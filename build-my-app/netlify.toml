[build]
  publish = "."
  functions = "netlify/functions"
  # This project lives in a subdirectory of a busy repo, so skip the build
  # unless something under build-my-app/ actually changed. Netlify runs this
  # from the base directory, so "." is build-my-app.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- ."
