[build]
  publish = "."
  functions = "netlify/functions"
  # This project lives in a subdirectory of a busy repo, so skip the build
  # unless something under build-my-app/ actually changed. Netlify runs this
  # from the base directory, so "." is build-my-app.
  #
  # BUT when the build cache is empty Netlify sets CACHED_COMMIT_REF to the
  # commit being built, the diff is empty, and every build is skipped for good:
  # the 30 Sep 2026 order-code fix sat undeployed behind "Canceled build due to
  # no content" for exactly that reason. No reference to compare with = build.
  ignore = "if [ -z \"$CACHED_COMMIT_REF\" ] || [ \"$CACHED_COMMIT_REF\" = \"$COMMIT_REF\" ]; then exit 1; fi; git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- ."
