<!-- CONCEPT: Squad Leader: Frontier (works with a game controller) - a free-roam space RPG and base builder: fly an open sector, mine asteroids, rescue wingmates, level up, build and defend your own outpost, break enemy nests and hunt bosses across five dangerous zones, collect gear and new ships, take contracts, defend your base from invasions and anomalies, send explorer pilots after treasure, collect stickers, or play Rogue (Cards) where you pick 1 of 3 cards and your base builds itself, with the Mirror Shield from Squad Leader (tap just before impact to reflect) | Controls: WASD/Arrows move, mouse aims, Space/Left-click fire, Shift/X/Right-click Mirror Shield, E Ultimate Laser, B Build, C Squad, J Quests, N Map, P Pause, M Music. Three ranks, and Auto-Aim can be on or off in both modes. Touch: drag anywhere to fly, SHIELD and LASER buttons bottom-right, plus FIRE when Auto-Aim is off, toolbar top-right -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Squad Leader: Frontier</title>
<style>
:root{--bg:#05060f;--panel:#0d1428;--panel2:#16213d;--line:#2c4170;--ink:#e6f0ff;--muted:#8fa6c8;--a:#4df;--b:#5f8cff;--gold:#ffd866;--good:#6f6;--bad:#f66;--crystal:#f6c;--tap:48px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;background:var(--bg);overflow:hidden;overscroll-behavior:none;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;font-family:'Segoe UI',system-ui,sans-serif;color:var(--ink)}
canvas{display:block;position:absolute;left:0;top:0;width:100%;height:100%;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
.hide{display:none!important}
h1{margin:0;font-size:clamp(30px,8vw,56px);line-height:1.05;background:linear-gradient(90deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:.5px}
h2{margin:0 0 8px;font-size:clamp(20px,5vw,26px);color:var(--a)}
h3{margin:14px 0 6px;font-size:clamp(15px,4vw,18px);color:var(--gold)}
#title{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:16px 16px max(22px,4vh);gap:10px;text-align:center;pointer-events:none}
#title>*{pointer-events:auto}
.big.pulse{animation:btnpulse 1.6s ease-in-out infinite}
@keyframes btnpulse{0%,100%{box-shadow:0 0 5px rgba(68,221,255,.4)}50%{box-shadow:0 0 22px 5px rgba(68,221,255,.9)}}
@media (prefers-reduced-motion:reduce){.big.pulse{animation:none}}
.big.cont{display:flex;flex-direction:column;gap:3px;text-align:left;min-width:min(92vw,340px);min-height:64px;padding:8px 14px}
.cont .c1{font-size:clamp(16px,4.2vw,19px);font-weight:800}
.cont .c2{font-size:clamp(12px,3.2vw,14px);font-weight:600;color:#d7e8ff}
.cont .cbar{display:block;height:6px;border-radius:3px;background:rgba(0,0,0,.45);overflow:hidden;margin-top:2px}
.cont .cbar i{display:block;height:100%;background:linear-gradient(90deg,#ffd866,#fff3b8)}
.modes{display:flex;flex-direction:column;gap:12px;margin:10px 0}
.modeb{display:flex;align-items:center;gap:14px;min-height:112px;padding:10px 14px;border-radius:16px;border:3px solid var(--a);background:linear-gradient(90deg,#0f2f52,#0c1a33);text-align:left}
.modeb.rogue{border-color:var(--gold);background:linear-gradient(90deg,#3d2f0c,#1a1608)}
.modeb img{width:88px;height:88px;flex:0 0 auto}
.modeb b{display:block;font-size:clamp(19px,5vw,24px)}
.modeb span{display:block;color:#c9d8ef;font-size:clamp(13px,3.5vw,15px);line-height:1.3;font-weight:500}
.rankb img.who{display:block}
.aimb svg{width:32px;height:32px;display:block}
.aimb.off svg{opacity:.35}
#title .sub{color:var(--muted);font-size:clamp(14px,3.6vw,18px);max-width:560px}
.big{min-height:54px;min-width:min(78vw,280px);padding:10px 22px;border-radius:12px;border:2px solid var(--a);background:rgba(13,30,60,.92);font-size:clamp(16px,4.4vw,20px);font-weight:700}
.big.alt{border-color:var(--line);font-weight:600}
.padfocus{outline:4px solid #ffd866!important;outline-offset:3px;box-shadow:0 0 18px rgba(255,216,102,.8)!important}
#buildList .padfocus{outline-offset:-1px}
.big.primary{background:linear-gradient(90deg,#0f6a8a,#2c56b8)}
.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
#tools{position:absolute;top:max(6px,env(safe-area-inset-top));right:6px;display:flex;gap:6px}
.tool{position:relative;width:var(--tap);height:var(--tap);border-radius:10px;border:2px solid var(--line);background:rgba(13,20,40,.82);font-size:22px;padding:0;line-height:1}
.tool .dot{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;background:#ff3b3b;border:2px solid #fff;color:#fff;font-size:15px;font-weight:900;line-height:18px;text-align:center}
.tool.attn{border-color:var(--gold);border-width:3px;background:rgba(120,90,10,.95);animation:attn 1s ease-in-out infinite}
@keyframes attn{0%,100%{box-shadow:0 0 6px 1px rgba(255,216,102,.6);background:rgba(90,66,8,.95)}50%{box-shadow:0 0 26px 9px rgba(255,216,102,1);background:rgba(190,145,20,.98)}}
@media (prefers-reduced-motion:reduce){.tool.attn{animation:none;box-shadow:0 0 18px 6px rgba(255,216,102,.9)}}
#act{position:absolute;right:10px;bottom:max(14px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px;align-items:flex-end}
.act{width:clamp(86px,24vw,120px);height:clamp(70px,18vw,92px);border-radius:16px;border:3px solid #58f;background:rgba(20,40,90,.55);font-weight:800;font-size:clamp(14px,3.6vw,17px)}
#tBeacon{position:absolute}
.tool.gone{visibility:hidden}
@media (max-width:340px){#tools{gap:3px;right:3px}.tool{width:46px}}
.actrow{display:flex;gap:10px}
.act.fire{border-color:#f66;background:rgba(90,20,20,.6);color:#fbb}
.act.laser{border-color:var(--gold);background:rgba(90,70,10,.6);color:var(--gold)}
#netPad{position:absolute;inset:0;z-index:40;background:#070b18;display:flex;flex-direction:column;touch-action:none;user-select:none;-webkit-user-select:none}
#netPad.hide{display:none}#netPad.view{background:transparent}#netPad.view #netTop{background:rgba(13,21,48,.82)}#netTop{flex:0 0 auto;position:relative;z-index:1;display:flex;align-items:center;gap:12px;padding:12px 16px;color:#fff;font:600 18px system-ui;background:#0d1530;border-bottom:2px solid #b6ff3a}
#netTop .grow{flex:1}#netSt{font-weight:400;color:#cfe;margin-top:4px;font-size:17px}#netPad canvas{position:static;width:auto;height:auto}#netShip{width:56px;height:56px;flex:0 0 auto}#netLeave{min-width:0;flex:0 0 auto}
#netCv{flex:1 1 0;height:0!important;width:100%!important;min-height:0;display:block}
#panel{position:absolute;inset:0;background:rgba(3,6,16,.72);display:flex;align-items:center;justify-content:center;padding:10px}
#sheet{width:min(620px,100%);max-height:100%;overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:16px}
#sheet p{margin:6px 0;color:var(--ink);font-size:clamp(14px,3.7vw,16px);line-height:1.4}
.muted{color:var(--muted)!important}
.card{display:flex;align-items:center;gap:10px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:6px 0;font-size:clamp(13px,3.5vw,15px)}
.card .grow{flex:1;min-width:0}
.card b{color:var(--ink)}
.mini{min-width:var(--tap);min-height:var(--tap);padding:4px 12px;border-radius:9px;border:2px solid var(--a);background:#0f2a4a;font-weight:700}
.mini[disabled]{opacity:.4;border-color:var(--line);cursor:default}
#buildBar{position:absolute;left:0;right:0;bottom:0;background:rgba(9,14,30,.95);border-top:2px solid var(--line);padding:6px 8px max(6px,env(safe-area-inset-bottom))}
#buildHead{display:flex;align-items:center;gap:10px;margin-bottom:6px;font-size:clamp(13px,3.5vw,15px)}
#buildHead .grow{flex:1;min-width:0}
#buildList{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:6px;max-height:44vh;overflow-y:auto;overflow-x:hidden;touch-action:pan-y;padding:4px}
@media (max-width:360px){#buildList{max-height:34vh}}
@media (max-height:480px){#buildList{grid-template-columns:repeat(auto-fill,minmax(104px,1fr));max-height:40vh}.bcard{min-height:54px!important;font-size:11px!important}.bcard .ic{font-size:17px!important}#buildHead{margin-bottom:3px}}
.bcard{min-width:0;min-height:84px;border-radius:10px;border:2px solid var(--line);background:var(--panel2);padding:4px;font-size:12px;line-height:1.2;text-align:center}
.bcard .ic{font-size:22px;display:block}
.bcard.sel{border-color:var(--gold);box-shadow:0 0 10px rgba(255,216,102,.5)}
.bcard.no{opacity:.45}
.cost{color:var(--muted);font-size:11px;display:block}
.ranks{display:flex;flex-direction:column;gap:10px;margin:8px 0}
.rankrow{display:flex;gap:8px;align-items:stretch}
.rankb{flex:1;min-width:0;display:flex;align-items:center;gap:12px;padding:6px 12px;border-radius:16px;border:4px solid;font-weight:800;text-align:left}
.rankb .who{line-height:1;flex:0 0 auto}
.rankb .bad{display:block;line-height:1.1;letter-spacing:0;white-space:nowrap}
.rankb .lab{display:block;font-size:clamp(14px,3.7vw,17px);color:#fff}
.rank-cadet{min-height:88px;border-color:#5f5;background:linear-gradient(90deg,#123d1c,#0f2a18)}
.rank-cadet .who{width:72px;height:72px}.rank-cadet .bad{font-size:15px}
.rank-pilot{min-height:106px;border-color:#fc3;background:linear-gradient(90deg,#4d3a08,#2c2208)}
.rank-pilot .who{width:90px;height:90px}.rank-pilot .bad{font-size:18px}
.rank-captain{min-height:128px;border-color:#f44;background:linear-gradient(90deg,#5c0f0f,#320a0a);box-shadow:0 0 16px rgba(255,60,60,.55)}
.rank-captain .who{width:112px;height:112px}.rank-captain .bad{font-size:22px}
.aimb{flex:0 0 74px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-radius:14px;border:3px solid;font-weight:800;font-size:14px;padding:4px}
.aimb .ic{font-size:30px;line-height:1}
.aimb.on{border-color:#5f5;background:#123d1c;color:#9f9}
.aimb.off{border-color:#55617a;background:#1a2030;color:#8a93a6}
.aimb.off .ic{filter:grayscale(1);opacity:.35}
@media (max-width:360px){.rankb{gap:6px;padding:6px 8px}.aimb{flex:0 0 60px}.rank-cadet .who{width:54px;height:54px}.rank-cadet .bad{font-size:14px}.rank-pilot .who{width:66px;height:66px}.rank-pilot .bad{font-size:16px}.rank-captain .who{width:80px;height:80px}.rank-captain .bad{font-size:18px}}
@media (max-height:480px){.ranks{flex-direction:row}.rankrow{flex:1 1 0;min-width:0}.rankb{flex-direction:column;gap:2px;text-align:center;padding:4px;min-height:0}.rank-cadet .who{width:44px;height:44px}.rank-pilot .who{width:52px;height:52px}.rank-captain .who{width:60px;height:60px}.rank-cadet .bad,.rank-pilot .bad,.rank-captain .bad{font-size:12px}.aimb{flex:0 0 56px}.aimb .ic{font-size:22px}}
.act:active,.tool:active,.mini:active,.big:active,.rankb:active,.aimb:active,.cardp:active,.bcard:active,.tabb:active{filter:brightness(1.35);transform:scale(.97)}
.stickers{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:8px;margin:8px 0}
.stick{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:34px;line-height:1;border-radius:14px;background:var(--panel2);border:2px solid var(--gold)}
.stick.off{border-color:var(--line);background:#26324f}.stick.off span{filter:grayscale(1) brightness(0);opacity:.6}
.card.mate{flex-direction:column;align-items:stretch;gap:6px}
.orders{display:flex;gap:6px}
.ord{flex:1 1 0;min-width:0;min-height:56px;padding:4px 2px;border-radius:10px;border:2px solid var(--line);background:#0f1a33;color:var(--muted);font-weight:700;font-size:clamp(12px,3.2vw,14px);line-height:1.15}
.ord .oi{display:block;font-size:20px;line-height:1.2;opacity:.65}
.ord.on{border:3px solid var(--gold);background:linear-gradient(180deg,#d9a61c,#9c7410);color:#fff;font-weight:900;box-shadow:0 0 12px rgba(255,216,102,.75)}
.ord.on .oi{opacity:1}
.forms{flex-wrap:wrap}.forms .ord{flex:1 1 22%;min-width:64px}.forms svg{display:block;width:54px;height:36px;margin:0 auto 2px}.forms .ord.on svg path{fill:#fff}
.cur{display:inline-block;width:12px;height:12px;vertical-align:-1px;margin-right:4px}
.cur.scrap{background:#c9b48a}
.cur.crystal{background:#f6c;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);width:14px;height:18px;vertical-align:-3px}
.cur.big2{width:22px;height:22px;margin:0}
@media (max-width:360px){.card:has(.btns){flex-wrap:wrap}.card:has(.btns) .grow{flex:1 1 100%}.btns{width:100%}.btns .mini{flex:1}}
.card.job{gap:10px}.card.job.main{border-color:var(--gold);border-width:2px}
.jobic{font-size:34px;line-height:1;flex:0 0 auto}
.card.job b{display:block;font-size:clamp(16px,4.2vw,19px)}
.jobbar{display:block;height:12px;border-radius:6px;background:rgba(255,255,255,.14);overflow:hidden;margin:5px 0 2px}
.jobbar i{display:block;height:100%;background:#6f6;border-radius:6px}
.jobn{display:block;font-size:13px;font-weight:700;color:#bfffbf}
.jobtxt{display:block;font-size:13px;margin-top:2px}
.mini.say{font-size:22px;padding:0;flex:0 0 var(--tap)}
.hand{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0}
.cardp{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:4px;min-height:190px;padding:12px 8px;border-radius:14px;border:3px solid var(--line);background:var(--panel2);text-align:center;animation:deal .32s ease-out backwards}
.cardp:nth-child(2){animation-delay:.08s}.cardp:nth-child(3){animation-delay:.16s}
.cardp .big-ic{font-size:40px;line-height:1.1}
.cardp .nm{font-weight:800;font-size:clamp(15px,3.8vw,18px)}
.cardp .ef{color:var(--ink);font-size:clamp(13px,3.4vw,15px);line-height:1.3}
.cardp .rr{font-size:11px;font-weight:800;letter-spacing:.6px;text-transform:uppercase}
.cardp .tg{color:var(--muted);font-size:10px;font-weight:700;letter-spacing:.6px}
.cardp[disabled]{cursor:default}
.cardp.r3{box-shadow:0 0 22px rgba(255,187,51,.7)}.cardp.r2{box-shadow:0 0 14px rgba(204,102,255,.5)}
@keyframes deal{from{opacity:0;transform:translateY(26px) scale(.92)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.cardp{animation:none}}
@media (max-width:540px){.hand{grid-template-columns:1fr}.cardp{min-height:0;flex-direction:row;flex-wrap:wrap;text-align:left;align-items:center;column-gap:10px;padding:10px 12px}.cardp .big-ic{flex:0 0 46px;text-align:center}.cardp .txt{flex:1 1 0;min-width:0}}
.deck{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chip{border:2px solid var(--line);border-radius:9px;padding:4px 8px;font-size:13px;background:var(--panel2)}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.tabb{flex:1 1 44px;min-width:0;letter-spacing:-.2px;min-height:var(--tap);border-radius:9px;border:2px solid var(--line);background:var(--panel2);font-weight:700;font-size:clamp(11px,3vw,14px);padding:2px 1px}
.tabb{position:relative}.tabdot{position:absolute;top:-6px;right:-4px;width:20px;height:20px;border-radius:50%;background:#ff3b3b;border:2px solid #fff;color:#fff;font-size:13px;font-weight:900;line-height:16px}
.tabb.on{border-color:var(--gold);color:var(--gold)}
.up{color:var(--good);font-weight:700}
.btns{display:flex;gap:6px;flex:0 0 auto}
@media (min-width:700px) and (min-height:700px){
:root{--tap:60px}
#tools{gap:8px;right:10px;top:max(10px,env(safe-area-inset-top))}
.tool{font-size:30px;border-radius:13px}.tool .dot{width:26px;height:26px;font-size:18px;line-height:22px}
#act{right:18px;bottom:max(20px,env(safe-area-inset-bottom));gap:14px}.actrow{gap:14px}
.act{width:150px;height:118px;font-size:21px;border-radius:20px}
#sheet{zoom:1.3;width:min(640px,100%)}
#title{gap:14px;padding-bottom:max(34px,5vh)}
.big{min-height:68px;font-size:23px;min-width:300px}
#buildList{grid-template-columns:repeat(auto-fill,minmax(128px,1fr))}.bcard{min-height:110px;font-size:15px}.bcard .ic{font-size:32px}.cost{font-size:13px}
#sheet .rankb{justify-content:center;gap:22px}
#buildHead{font-size:18px}#buildBar{padding:10px 12px max(10px,env(safe-area-inset-bottom))}
}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="title">
  <div class="row" id="titleBtns">
    <button class="big primary cont hide" id="btnContinue"></button>
    <button class="big primary cont hide" id="btnRogue"></button>
    <button class="big pulse" id="btnNew">New Game</button>
    <button class="big alt" id="btnCoop" aria-pressed="false">👥 Co-pilot: OFF</button>
    <button class="big alt" id="btnHelp">How to Play</button>
    <button class="big alt hide" id="btnJoin">🎮 Join as P2</button>
  </div>
</div>
<div id="netPad" class="hide"><div id="netTop"><canvas id="netShip" width="72" height="72"></canvas><div class="grow"><b>You fly P2, the green ship</b><div id="netSt">Connecting…</div></div><button class="big alt" id="netLeave">Leave</button></div><canvas id="netCv"></canvas></div>

<div id="tools" class="hide">
  <button class="tool" id="tSquad" aria-label="Squad and skills">⭐<span class="dot hide" id="skillDot">!</span></button>
  <button class="tool" id="tBuild" aria-label="Build">🔧</button>
  <button class="tool" id="tQuest" aria-label="Quests">📜</button>
  <button class="tool" id="tMap" aria-label="Map">🗺️</button>
  <button class="tool" id="tView" aria-label="Zoom the view out">🔍<span id="viewPips" style="position:absolute;left:0;right:0;bottom:2px;font-size:9px;letter-spacing:1px;color:#fff"></span></button>
  <button class="tool" id="tPause" aria-label="Pause">⏸️</button>
</div>

<button class="tool hide" id="tBeacon" aria-label="Drop a Beacon here">📡<span class="dot" id="beaconN" style="background:#2c56b8">1</span></button>

<div id="act" class="hide">
  <button class="act laser hide" id="bLaser">LASER</button>
  <div class="actrow"><button class="act fire hide" id="bFire">FIRE</button><button class="act" id="bShield">SHIELD</button></div>
</div>

<div id="buildBar" class="hide">
  <div id="buildHead"><div class="grow" id="buildInfo"></div><button class="mini" id="bDone">Done</button></div>
  <div id="buildList"></div>
</div>

<div id="panel" class="hide"><div id="sheet"></div></div>

<script>
(function(){
"use strict";
/* ---------- screen: the view fills any shape of screen, phone portrait included ---------- */
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let VW=960,VH=540,scale=1,dpr=1,qualityCap=9,TOOL_H=62,TOOL_W=278,slowT2=0;
function resize(){
  const w=window.innerWidth,h=window.innerHeight;
  // a tablet has four times a phone's pixels; about 2.4 million is sharp and keeps the frame rate up
  dpr=Math.max(1,Math.min(window.devicePixelRatio||1,Math.sqrt(2.4e6/(w*h)),qualityCap));
  const big=Math.min(w,h)>=700;TOOL_H=big?78:62;TOOL_W=big?410:332;
  cv.width=w*dpr;cv.height=h*dpr;
  scale=Math.min(w,h)/540;
  VW=w/scale;VH=h/scale;
}
window.addEventListener('resize',resize);resize();
function rnd(a,b){return a+Math.random()*(b-a);}
const $=id=>document.getElementById(id);
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);

/* ---------- audio: a space-sized room (long reverb + ping-pong echo), synth voices, ambient music ---------- */
let AC=null,master=null,send=null,noiseBuf=null,musBus=null,sched=0,gates={},audioRendering=false;
const MUS_VOL=0.3;
let musicOn=true;try{musicOn=localStorage.getItem('cowork-squad-frontier-music')!=='off';}catch(e){}
function buildAudio(ctx){
  AC=ctx;gates={};sched=0;
  const sr=AC.sampleRate,comp=AC.createDynamicsCompressor();
  comp.threshold.value=-18;comp.knee.value=14;comp.ratio.value=5;comp.attack.value=0.004;comp.release.value=0.2;
  comp.connect(AC.destination);
  master=AC.createGain();master.gain.value=0.62;master.connect(comp);
  // the room: 3 seconds of dark, decaying noise, different in each ear
  const len=Math.floor(sr*3),ir=AC.createBuffer(2,len,sr);

function cInfo(c){
  const need=c.need;
  if(c.t==='kills')return {ic:'💥',short:'Shoot '+need+' ships',say:'Shoot '+need+' enemy ships.'};
  if(c.t==='mine')return {ic:'🪨',short:'Grab '+need+' scrap',say:'Grab '+need+' scrap.'};
  if(c.t==='parry')return {ic:'🪞',short:'Bounce '+need+' shots',say:'Press Shield just as a shot comes, '+need+' times.'};
  if(c.t==='elites')return {ic:'🥇',short:'Beat '+need+' gold ships',say:'Beat '+need+' ships with a gold ring around them.'};
  if(c.t==='nests')return {ic:'💣',short:'Break a nest',say:'Find a spiky nest and shoot it.'};
  if(c.t==='raids')return {ic:'🚨',short:'Beat a raid',say:'Beat the raiders when they come to your base.'};
  if(c.t==='zone')return {ic:'🗺️',short:need+' ships in '+ZONES[c.z].name,say:'Shoot '+need+' ships in '+ZONES[c.z].name+'.'};
  if(c.t==='wanted')return {ic:'⭐',short:'Catch '+c.name,say:'Look for the gold star on your map. Fly there and beat '+c.name+'.'};
  if(c.t==='reborn')return {ic:'🔁',short:'Beat '+BOSS_KINDS[c.id].name,say:BOSS_KINDS[c.id].name+' came back. Look on your map and beat it.'};
  return {ic:'📜',short:cText(c),say:cText(c)};
}

function questHit(p){const r=questRect;if(!r)return false;const py=Math.max(10,(44/scale-r.h)/2);return p.x>=r.x-6&&p.x<=r.x+r.w+6&&p.y>=r.y-py&&p.y<=r.y+r.h+py;}
/* stuck on the same thing for a while? Amigo says it again, a few times, then leaves him be */
function hintTick(dt){
  arrowPulse=Math.max(0,arrowPulse-dt);
  if(!G.talk)return;   // Amigo Talks OFF: no nudges at all
  const q=QUESTS[G.quest];if(!q)return;
  const I=qInfo(q),key=G.quest+':'+(I.prog?I.prog[0]:'');
  if(G.hintQ!==G.quest){G.hintQ=G.quest;G.hintN=0;}
  if(key!==hintKey){hintKey=key;hintT=0;return;}
  hintT+=dt;
  if(G.hintN<HINT_GAPS.length&&hintT>=HINT_GAPS[G.hintN]&&!msg&&!msgQ.length){hintT=0;G.hintN++;say(I.say);arrowPulse=2.5;}
}

function migrate(g){

function tidySave(g){
  g.tidy1=1;

  const c=g.structs.find(s=>s.t==='core');if(!c)return;
  const ring=300+70*c.lv,cap=6+2*c.lv,home=s=>!s.field&&Math.hypot(s.x-c.x,s.y-c.y)<=ring;
  let refund=0,merged=0,gone=0;
  const walls=g.structs.filter(s=>s.t==='wall'&&home(s)),turrets=g.structs.filter(s=>s.t==='turret'&&home(s));
  const drop=new Set();
  for(const w of walls.slice(cap)){refund+=Math.round(STRUCTS.wall.s*0.5*w.lv);drop.add(w);gone++;}
  const keep=turrets.slice(0,cap);
  for(const x of turrets.slice(cap)){
    drop.add(x);gone++;
    let lv=x.lv;
    while(lv>0){let low=null;for(const o of keep)if(o.lv<MAX_LV&&(!low||o.lv<low.lv))low=o;if(!low)break;low.lv++;lv--;merged++;}
    refund+=lv*Math.round(STRUCTS.turret.s*0.5);
  }
  for(const o of keep)o.hp=Math.round(STRUCTS.turret.hp*(1+0.6*(o.lv-1)));
  g.structs=g.structs.filter(s=>!drop.has(s));g.scrap+=refund;

function boom(x,y,col,n,sp){if(parts.length>500)n=Math.min(n,3);
  for(let i=0;i<n;i++){const a=Math.random()*6.283,s=rnd(40,sp||260);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,t:rnd(0.3,0.8),max:0.8,col,sz:rnd(2,5)});}}
function vib(p){padRumble(p);try{if(touchMode&&navigator.vibrate)navigator.vibrate(p);}catch(e){}}

/* ---------- quests: the story walks you through everything, then the sector is yours ---------- */
function coreStruct(){return structs.find(s=>s.t==='core');}
function nearestRock(){let b=null,bd=1e9;for(const a of asteroids){if(a.gone>0)continue;const d=Math.hypot(a.x-player.x,a.y-player.y);if(d<bd){bd=d;b=a;}}return b;}
function nearestNest(){let b=null,bd=1e9;for(const n of nests){if(G.nestDead[n.id])continue;const d=dist(n,player);if(d<bd){bd=d;b=n;}}return b;}
function nextLair(){let b=null;for(const l of lairs)if(!G.bossDead[l.id]&&(!b||l.lv<b.lv))b=l;return b;}
function bossQuest(i){return {title:'Hunt the bosses ('+i+'/5)',text:'Beat a boss at its lair (red marks on the map). Any order, but each one has a level it expects.',say:i===0?'Five bosses rule this sector. The Void Prism is the weakest. When you see a boss, reflect its shots!':'One down... that was '+i+' of 5. Next lair is on your map.',check:()=>bossesDown()>i,target:()=>nextLair(),xp:120+i*60,scrap:60+i*20};}

  {title:'Build a Turret',text:'Tap 🔧 (or press B), pick Turret, and tap a spot inside the glowing ring.',say:'Great! Now the fun part: fly home and build a Turret by the station.',check:()=>structs.some(s=>s.t==='turret'),target:()=>coreStruct(),xp:30,scrap:15},
  {title:'Mirror Shield',text:'Reflect 3 shots: press SHIELD (Shift or right-click) just as a shot arrives.',say:'Two training drones are coming. Hit SHIELD at the last moment and their shots fly right back!',start(){spawnTrainers();},check:()=>G.stats.parries>=(G.casual?1:3)||(G.casual&&G.playT>=mirrorDeadline()),target:()=>null,xp:40,scrap:15},
  {title:'Rescue a pilot',text:'Fly to the distress pod. Pilots become wingmates who fight beside you.',say:'A distress signal! There is a pilot drifting nearby. Go get them.',check:()=>G.stats.rescued>=1,target:()=>pods[0],xp:40,scrap:20},
  {title:'Build an Extractor',text:'An Extractor makes scrap for you, even while you explore.',say:'Nice flying. Now make the base pay for itself: build an Extractor.',check:()=>structs.some(s=>s.t==='extractor'),target:()=>coreStruct(),xp:40,scrap:20},
  {title:'Survive a raid',text:'Raiders are coming for your buildings. Defend the outpost!',say:'Uh oh. My sensors see raiders heading for the outpost! Get home and defend it.',start(){if(!raid)G.raidT=14;},check:()=>G.stats.raidsWon>=1,target:()=>coreStruct(),xp:80,scrap:40},
  {title:'Claim new ground',text:'Fly out and build a Beacon anywhere. It adds a build zone and a warp point.',say:'You held them off! Now explore. A Beacon claims land anywhere, and you can warp to it from the map.',check:()=>structs.some(s=>s.t==='beacon'),target:()=>null,xp:60,scrap:30,crystal:4},
  {title:'Break a nest',text:'Destroy an enemy nest. They keep sending ships until you do.',say:'See those pulsing nests on your map? Each one keeps sending ships. Break one!',check:()=>G.stats.nests>=1,target:()=>nearestNest(),xp:100,scrap:40,crystal:4},
  bossQuest(0),bossQuest(1),bossQuest(2),bossQuest(3),bossQuest(4),

  {title:'Open a Trading Post',text:'Build a Trading Post. It sells gear for crystal: tap ⭐ then Trade.',say:'Word is out, Commander. Traders want to visit! Build a Trading Post.',check:()=>structs.some(s=>s.t==='post'),target:()=>coreStruct(),xp:150,scrap:80,crystal:10},
  {title:'Fly a new ship',text:'Build a Shipyard, then tap ⭐ then Ships, and buy one.',say:'Time for a bigger ride. Build a Shipyard and pick a new ship.',check:()=>G.ship!=='frontier'||(G.casual&&structs.some(s=>s.t==='shipyard')),target:()=>coreStruct(),xp:200,scrap:80,crystal:10},
  {title:'Finish 3 contracts',text:'Contracts are in 📜. They finish by themselves as you play.',say:'People need help out here. Finish three contracts for them.',check:()=>G.stats.contracts>=3,target:()=>null,xp:250,scrap:100,crystal:12},
  {title:'Beat a Reborn boss',text:'A boss has come back stronger! Check 📜 and the map.',say:'Oh no. A boss came back, even stronger! Something is waking them up...',start(){forceReborn();},check:()=>G.stats.reborn>=1,target:()=>rebornLair(),xp:300,scrap:120,crystal:15},
  {title:'The Mirror King',text:'His armor stops most of your shots. REFLECT his shots with your shield to break him!',say:'I found who is doing it. The Mirror King! He has a shield just like yours, so your guns will not do much. Reflect his own shots back at him!',start(){syncLairs();},check:()=>!!G.bossDead[5],target:()=>KING_LAIR,xp:600,scrap:300,crystal:40},
  {title:'The Final Invasion',text:'Three waves are coming for your base. Beat each Siege Ship and every raider.',say:'That was not all of them, Commander. The Mirror King was guarding something bigger, and a fleet is heading for our base! Get home and hold the line!',check:()=>G.fin.cleared>=3,target:()=>(ev&&ev.e&&!ev.e.dead)?ev.e:coreStruct(),xp:400,scrap:200,crystal:20},

function startQuest(){
  const q=QUESTS[G.quest];if(!q)return;
  if(!G.questStarted){G.questStarted=true;say(qSay(q));}
  if(q.start)q.start();
}
function questTick(){
  const q=QUESTS[G.quest];if(!q)return;
  if(G.casual&&CASUAL_Q[q.title]&&CASUAL_Q[q.title].auto&&countOf(CASUAL_Q[q.title].auto)===0){const k=CASUAL_Q[q.title].auto;if(k==='beacon')freeBeacon();else buildFree(k);}
  if(q.check()){
    gainXp(q.xp||0);G.scrap+=q.scrap||0;G.crystal+=q.crystal||0;
    const qdN=pops.filter(o=>o.qd).length;pop(player.x,player.y-46-qdN*24,'QUEST DONE: '+q.title,'#ffd866',2.4);pops[pops.length-1].qd=true;SFX.rankUp();
    G.quest++;G.questStarted=false;
    if(G.quest===13&&!G.won){G.won=true;banner='SECTOR SECURED!';bannerT=4;SFX.bossDown();showWin();startQuest();}
    else if(G.quest===18&&!G.won2){G.won2=true;banner='THE MIRROR KING FALLS!';bannerT=4;SFX.bossDown();showEnding();startQuest();}
    else if(G.quest>=QUESTS.length){G.won3=true;banner='THE FRONTIER IS FREE!';bannerT=4;SFX.bossDown();showFinal();}
    else startQuest();
    save();
  }
}
/* bosses come back at a higher level; the Mirror King's lair only appears when his quest starts */
function syncLairs(){
  const want=G.quest>=17||!!G.bossDead[5],at=lairs.indexOf(KING_LAIR);
  if(want&&at<0)lairs.push(KING_LAIR);else if(!want&&at>=0)lairs.splice(at,1);
  const wantM=G.quest>=19||!!G.bossDead[6],atM=lairs.indexOf(MOTHER_LAIR);
  if(wantM&&atM<0)lairs.push(MOTHER_LAIR);else if(!wantM&&atM>=0)lairs.splice(atM,1);
  for(const l of lairs)l.lv=G.reborn[l.id]||BOSS_KINDS[l.kind].lv;
}
function rebornLair(){const c=G.contracts.find(x=>x.t==='reborn'&&!x.done);return c?lairs.find(l=>l.id===c.id):null;}
function forceReborn(){if(G.stats.reborn<1&&!G.contracts.some(c=>c.t==='reborn')){if(G.contracts.length>=3)G.contracts.shift();addContract('reborn');}}

/* ---------- gear ---------- */
function rollRar(min){const r=Math.random();const v=r<0.03?3:r<0.13?2:r<0.4?1:0;return Math.max(min||0,v);}
function pick(a){return a[Math.floor(Math.random()*a.length)];}
function makeItem(lv,minRar){
  const slot=pick(['gun','gun','armor','shield','engine']),r=rollRar(minRar),it={id:G.nextId++,slot,l:Math.max(1,Math.round(lv)),r};
  if(slot==='gun'){it.g=pick(Object.keys(GUNS));it.n=GUNS[it.g].n;}else it.n=pick(BASES[slot]);
  if(r>=2)it.p=pick(Object.keys(PERKS));
  return it;
}
function sigItem(i,lv){const s=SIG[i],it={id:G.nextId++,slot:s.slot,l:Math.max(1,Math.round(lv)),r:3,n:s.n,p:s.p};if(s.g)it.g=s.g;return it;}
function itemScore(it){return it?(it.slot==='gun'?gearV(it)*GUNS[it.g].pw:gearV(it)):0;}
function itemText(it){
  let t=it.slot==='gun'?'Damage x'+gearV(it).toFixed(2)+', '+GUNS[it.g].t:it.slot==='armor'?'+'+armorOf(it)+' hull':it.slot==='shield'?'+'+energyOf(it)+' energy'+(it.r?', longer reflects':''):'+'+speedOf(it)+' speed, longer magnet';
  if(it.p)t+='. '+PERKS[it.p]+'.';
  return t;
}
function addItem(it){
  G.bag.push(it);G.stats.gearGot++;
  if(G.bag.length>30){let w=null;for(const o of G.bag)if(!w||itemScore(o)<itemScore(w))w=o;G.bag=G.bag.filter(o=>o!==w);const v=salvageValue(w);G.crystal+=v;}
  if(G.casual){if(itemScore(it)>itemScore(G.gear[it.slot])){equip(it.id);pop(player.x,player.y-64,'NOW WEARING: '+it.n,RAR[it.r].col,1.8);}return;}
  if(itemScore(it)>itemScore(G.gear[it.slot])){G.newGear=true;syncDots();}
  if(!G.tips.gear){G.tips.gear=1;say('You found gear! Tap ⭐ and then Gear to put it on.');}
}
function salvageValue(it){return 1+it.r*2+Math.floor(it.l/6);}
function dropGear(x,y,it){pickups.push({x:x+rnd(-20,20),y:y+rnd(-20,20),vx:rnd(-60,60),vy:rnd(-60,60),k:'gear',n:1,it,t:180});}
function equip(id){
  const it=G.bag.find(o=>o.id===id);if(!it)return;
  const old=G.gear[it.slot];G.bag=G.bag.filter(o=>o!==it);G.gear[it.slot]=it;if(old)G.bag.push(old);
  player.hp=Math.min(maxHp(),player.hp);player.energy=Math.min(maxEnergy(),player.energy);SFX.power();
}

/* ---------- contracts: extra jobs, three at a time, that finish while you play ---------- */
const CKEY={kills:'kills',mine:'scrapGot',parry:'parries',elites:'elites',nests:'nests',raids:'raidsWon'};
function contractsOn(){return G.quest>=8||G.lvl>=5;}
function cHave(c){if(c.t==='wanted'||c.t==='reborn')return c.done?1:0;if(c.t==='zone')return G.stats.zk[c.z]-c.base;return G.stats[CKEY[c.t]]-c.base;}
function cText(c){
  if(c.t==='kills')return 'Shoot down '+c.need+' enemy ships';
  if(c.t==='mine')return 'Collect '+c.need+' scrap';
  if(c.t==='parry')return 'Reflect '+c.need+' shots';
  if(c.t==='elites')return 'Beat '+c.need+' gold-ringed elites';
  if(c.t==='nests')return 'Break '+c.need+' enemy nest'+(c.need>1?'s':'');
  if(c.t==='raids')return 'Beat a raid';
  if(c.t==='zone')return 'Shoot down '+c.need+' ships in '+ZONES[c.z].name;
  if(c.t==='wanted')return 'WANTED: '+c.name+'. Gold star on your map';
  if(c.t==='reborn')return 'Reborn boss: '+BOSS_KINDS[c.id].name+' at level '+G.reborn[c.id];
  return '';
}
function addContract(force){
  const types=['kills','kills','mine','parry','zone','zone','elites'];
  if(G.quest>=5)types.push('raids');
  if(nests.some(n=>!G.nestDead[n.id]))types.push('nests');
  if(!G.contracts.some(c=>c.t==='wanted'))types.push('wanted','wanted');
  const down=lairs.filter(l=>l.id<5&&G.bossDead[l.id]);
  if(G.won&&down.length&&!G.contracts.some(c=>c.t==='reborn'))types.push('reborn');
  let k=force||pick(types.filter(x=>x==='zone'||x==='wanted'||x==='reborn'||!G.contracts.some(c=>c.t===x)));
  if(k==='reborn'&&!down.length)k='kills';
  const lv=G.lvl,c={t:k,at:G.playT,cid:G.nextId++,s:30+lv*6,c:2+Math.floor(lv/4),gear:Math.random()<0.35};
  if(k==='kills')c.need=12+lv;
  else if(k==='mine')c.need=40+lv*6;
  else if(k==='parry')c.need=8+Math.floor(lv/2);
  else if(k==='elites')c.need=2;
  else if(k==='nests')c.need=1;
  else if(k==='raids')c.need=1;
  else if(k==='zone'){c.z=Math.floor(Math.random()*5);c.need=8+Math.floor(lv/2);c.base=G.stats.zk[c.z];}
  else if(k==='wanted'){const a=Math.random()*6.283,R=rnd(1250,3100);c.name=pick(WANTED);c.x=Math.cos(a)*R;c.y=Math.sin(a)*R;c.lv=Math.max(3,lv);c.need=1;c.gear=true;c.s*=2;c.c*=2;}
  else if(k==='reborn'){const l=pick(down);c.id=l.id;G.bossDead[l.id]=0;G.reborn[l.id]=Math.max(BOSS_KINDS[l.kind].lv+6,lv+2);l.lv=G.reborn[l.id];l.awake=false;c.need=1;c.gear=true;c.s*=3;c.c*=3;say(BOSS_KINDS[l.kind].name+' has come back stronger! It is on your map.');}
  if(c.base===undefined&&CKEY[k])c.base=G.stats[CKEY[k]];
  G.contracts.push(c);
}
function contractsTick(){
  if(!contractsOn())return;
  if(!G.tips.contracts){G.tips.contracts=1;say('New contracts are up, Commander! Tap 📜 to see them. They pay well.');}
  for(const c of G.contracts){
    if(c.t==='wanted'&&dist(c,player)<1000&&respawnT<=0&&!enemies.some(e=>e.wanted===c.cid)){
      const e=spawnE(pick(['tank','sprayer','sniper','carrier']),c.x,c.y,c.lv,{wanted:c.cid,label:c.name,elite:true});
      e.hp=e.max=e.max*6;e.r=Math.round(e.r*1.4);say(c.name+' is here! Get them!');
    }
    if(c.t==='reborn'&&G.bossDead[c.id])c.done=true;
    if(cHave(c)>=c.need){
      if(c.t==='wanted')G.stats.wanted++;
      if(c.t==='reborn')G.stats.reborn++;
      G.stats.contracts++;G.scrap+=c.s;G.crystal+=c.c;
      if(c.gear)addItem(makeItem(G.lvl,c.t==='wanted'||c.t==='reborn'?1:0));
      banner='CONTRACT DONE!  +'+c.s+' SCRAP';bannerT=2.4;SFX.rankUp();c.paid=true;gainXp(20+G.lvl*4);
    }
  }
  for(const c of G.contracts)if(c.t!=='reborn'&&!c.paid&&G.playT-(c.at===undefined?G.playT:c.at)>360)c.paid=true; // an old job nobody got to makes way for a new one
  if(G.contracts.some(c=>c.paid)){G.contracts=G.contracts.filter(c=>!c.paid);save();}
  while(G.contracts.length<3)addContract();
}

/* ---------- Rogue: deal 3 cards, apply the pick, then the base spends what you have ---------- */
function scrapValue(r){return [40,90,180,360][r]+G.lvl*8;}
function cardOk(c,r){return c.r.includes(r)&&(!c.can||c.can());}
function rollCardRarity(min){
  const luck=Math.min(0.2,G.deck.length*0.002),x=Math.random();
  const v=x<0.02+luck*0.25?3:x<0.12+luck*0.5?2:x<0.42+luck?1:0;
  return Math.max(min||0,v);
}
function dealHand(min,why){
  const groups=[c=>c.tag==='BUILD',c=>c.tag==='BOOST'||c.tag==='BASE',c=>c.tag==='ABILITY'||c.tag==='SQUAD'||c.tag==='LOOT'];
  // no Epic or better for 7 picks in a row? the next hand is sure to have one
  const pity=G.sinceEpic>=7;
  const cards=groups.map((g,i)=>{
    let r=rollCardRarity(min);if(pity&&i===2)r=Math.max(r,2);
    for(let q=r;q>=0;q--){const pool=CARDS.filter(c=>g(c)&&cardOk(c,q));if(pool.length)return {id:pick(pool).id,r:q};}
    return {id:'l_scrap',r};
  });
  for(let i=cards.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[cards[i],cards[j]]=[cards[j],cards[i]];}
  G.hand={cards,why:why||'PICK A CARD',min:min||0};
}
const CARD_COOL=120;   // seconds of play between hands
function grantCard(min,why,boss){
  if(!G.casual)return;
  if(boss){G.pending.unshift({min:min||0,why:why||'PICK A CARD',boss:true});return;}
  // two can wait; any more become a little scrap and crystal, so a busy moment never stacks up hands
  if(G.pending.length>=2){const n=30+G.lvl*4;G.scrap+=n;G.crystal+=1;pop(player.x,player.y-64,'+'+n+' SCRAP +1 CRYSTAL','#c9b48a',1.4);return;}
  G.pending.push({min:min||0,why:why||'PICK A CARD'});
}
function cardsTick(dt){
  if(!G.casual)return;
  cardGap=Math.max(0,cardGap-dt);
  if(ui||respawnT>0||cardGap>0||state!=='play')return;
  if(!G.hand&&G.pending.length&&(G.pending[0].boss||G.cardAt===undefined||G.playT-G.cardAt>=CARD_COOL)){const n=G.pending.shift();G.cardAt=G.playT;dealHand(n.min,n.why);}
  if(G.hand)openHand();
}
function cardHtml(sl,i){
  const c=CARD_BY[sl.id],rc=RAR[sl.r].col;
  return '<button class="cardp r'+sl.r+'" style="border-color:'+rc+'" data-do="card:'+i+'" disabled aria-label="'+RAR[sl.r].n+' '+c.n+'"><span class="big-ic">'+c.ic+'</span><span class="txt"><span class="rr" style="color:'+rc+'">'+RAR[sl.r].n+'</span> <span class="tg">· '+c.tag+'</span><br><span class="nm" style="color:'+rc+'">'+c.n+'</span><br><span class="ef">'+c.text(sl.r)+'</span></span></button>';
}
let handTimer=0,lastHandSaid='';
function openHand(keepLock){
  const H=G.hand,cost=shuffleCost();
  let h='<h2>🃏 '+H.why+'</h2><p class="muted">Pick one. Your base builds itself after.'+'</p><div class="hand">';
  H.cards.forEach((sl,i)=>{h+=cardHtml(sl,i);});
  h+='</div><div class="row"><button class="mini" data-do="shuffle"'+(G.crystal>=cost?'':' disabled')+'>🔀 New cards: '+cost+' crystal</button></div>';
  openPanel(h);
  // a short pause, so a thumb that was already moving cannot pick a card by accident
  clearTimeout(handTimer);handTimer=setTimeout(()=>{document.querySelectorAll('.cardp').forEach(b=>{b.disabled=false;});},keepLock?0:450);
  SFX.rankUp();
  const said=JSON.stringify(H.cards);
  if(said!==lastHandSaid){lastHandSaid=said;speak(H.cards.map(s=>CARD_BY[s.id].n).join('. ')+'.');}
}
function shuffleCost(){return 2+G.shuffled*2;}
function pickCard(i){
  const H=G.hand;if(!H||!H.cards[i])return;
  const sl=H.cards[i],c=CARD_BY[sl.id];
  c.apply(sl.r);
  G.deck.push({id:sl.id,r:sl.r});G.sinceEpic=sl.r>=2||H.cards.some(o=>o.r>=2)?0:G.sinceEpic+1;
  G.hand=null;G.shuffled=0;cardGap=0.7;hush();
  (sl.r>=2?SFX.bossDown:SFX.power)();
  closeUi();player.hp=Math.min(maxHp(),player.hp);
  pop(player.x,player.y-46,c.ic+' '+c.n,RAR[sl.r].col,1.8);
  const built=autoBuild();
  if(built.length){banner='BASE: +'+built[0].toUpperCase()+(built.length>1?' +'+(built.length-1)+' MORE':'');bannerT=2.2;}
  syncDots();questTick();save();
}
/* what the base wants next, in order. It always buys the first thing on this list it can afford. */
const BUILD_PLAN=[['turret',2],['extractor',1],['turret',3],['repair',1],['extractor',2],['mirror',1],['barracks',1],['turret',4],['refinery',1],['post',1],['workshop',1],['arc',1],['shipyard',1],['extractor',3],['silo',1],['dome',1],['turret',6],['barracks',2],['arc',2],['refinery',2],['mirror',2],['repair',2],['silo',2],['dome',2],['turret',8]];
function countOf(k){let n=0;for(const s of structs)if(s.t===k)n++;return n;}
function coreRing(){return 300+70*coreStruct().lv;}
function inCoreRing(s){const c=coreStruct();return !s.field&&Math.hypot(s.x-c.x,s.y-c.y)<=coreRing();}
function countHome(k){let n=0;for(const s of structs)if(s.t===k&&inCoreRing(s))n++;return n;}
function homeCap(){return 6+2*coreStruct().lv;}
const AUTO_GAP=70;
function spacedOk(k,x,y){const d=STRUCTS[k];for(const s of structs)if(Math.hypot(s.x-x,s.y-y)<Math.max(AUTO_GAP,STRUCTS[s.t].r+d.r+20))return false;return true;}
function autoSpot(k,zone){
  const zs=zone?[zone]:buildZones(),outer=['turret','wall','arc','mirror','silo','dome'].includes(k),d=STRUCTS[k];
  for(const z of zs){
    const hi=z.r-d.r-8,lo=70,step=44;
    const rings=[];for(let r=lo;r<=hi;r+=step)rings.push(r);
    if(outer)rings.reverse();
    for(const r of rings){
      const n=Math.max(8,Math.round(6.283*r/56));
      for(let i=0;i<n;i++){
        const a=countOf(k)*0.9+i*2.39996,x=snap(z.x+Math.cos(a)*r),y=snap(z.y+Math.sin(a)*r);
        if(!placeProblem(k,x,y)&&spacedOk(k,x,y))return {x,y};
      }
    }
  }

}

function endPtr(e){

  fetch('/api/mp/rooms',{cache:'no-store',signal:ac.signal}).then(r=>r.ok?r.json():null)
    .then(j=>{NET.ok=!!(j&&Array.isArray(j.rooms));$('btnJoin').classList.toggle('hide',!NET.ok);}).catch(()=>{});

  $('buildList').innerHTML=h;$('buildList').scrollTop=0;
}
$('buildList').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;initAudio();
  if(b.dataset.b){
    const k=b.dataset.b,d=STRUCTS[k];
    if(G.lvl<d.unlock){flashInfo('Reach level '+d.unlock+' to unlock '+d.name+'.');return;}
    buildSel=buildSel===k?null:k;renderBuildBar();return;
  }
  const act=b.dataset.act;
  if(act!=='rec')delSure=false;
  if(act==='back'){picked=null;renderBuildBar();}
  else if(act==='mv'&&picked&&picked.t!=='core'){moving=picked;hover=null;SFX.ui();renderBuildBar();}
  else if(act==='change'){buildSel=null;hover=null;SFX.ui();renderBuildBar();}
  else if(act==='mvcancel'){moving=null;hover=null;SFX.ui();renderBuildBar();}
  else if(act==='up'&&picked){
    const c=upCost(picked);
    if(!canPay(c)){flashInfo('Not enough yet: this upgrade costs '+costText(c)+'.');return;}
    pay(c);picked.lv++;picked.hp=sHp(picked);SFX.power();boom(picked.x,picked.y,'#ffd866',16,200);save();renderBuildBar();
  }else if(act==='rec'&&picked&&picked.t!=='core'){
    if(!delSure){delSure=true;SFX.deflect();renderBuildBar();return;}   // two taps, so a building can't vanish by accident
    const back=refundOf(picked);G.scrap+=back.s;G.crystal+=back.c;boom(picked.x,picked.y,'#8cf',14,180);structs=structs.filter(s=>s!==picked);picked=null;delSure=false;SFX.deflect();save();renderBuildBar();
  }
});
/* half of everything paid for it: the building, plus every upgrade */
function refundOf(s){const d=STRUCTS[s.t];let a=d.s,b=d.c;for(let l=1;l<s.lv;l++){const u=upCost({t:s.t,lv:l});a+=u.s;b+=u.c;}return {s:Math.floor(a/2),c:Math.floor(b/2)};}
function moveTo(x,y){
  const s=moving,prob=placeProblem(s.t,x,y,false,s);
  hover=null;
  if(prob){flashInfo(prob);return false;}
  boom(s.x,s.y,'#8cf',8,120);s.x=x;s.y=y;moving=null;SFX.power();boom(x,y,'#8cf',14,180);vib(20);save();renderBuildBar();
  return true;
}
/* a clean tap on the bar with no click soon after: the browser dropped it, usually just after a map drag. pointercancel means the row scrolled, so no press. */
(function(){
  const bar=$('buildBar');let down=null,timer=0,swallowUntil=0;
  bar.addEventListener('pointerdown',e=>{swallowUntil=0;/* a new press is never a duplicate of the last one */down={id:e.pointerId,x:e.clientX,y:e.clientY,btn:e.target.closest('button')};},true);
  bar.addEventListener('pointercancel',()=>{down=null;},true);
  bar.addEventListener('pointerup',e=>{
    const d=down;down=null;clearTimeout(timer);
    if(!d||!d.btn||d.id!==e.pointerId||Math.hypot(e.clientX-d.x,e.clientY-d.y)>12)return;
    timer=setTimeout(()=>{if(d.btn.isConnected){swallowUntil=performance.now()+600;d.btn.click();}},120);
  },true);
  bar.addEventListener('click',e=>{
    if(!e.isTrusted)return;
    clearTimeout(timer);
    if(performance.now()<swallowUntil){e.stopPropagation();e.preventDefault();}   // the real click turned up late: we already pressed it
  },true);
})();
function flashInfo(t){$('buildInfo').innerHTML='<b style="color:var(--gold)">'+t+'</b>';SFX.deflect();}
function placeProblem(k,x,y,free,ignore){
  const d=STRUCTS[k];
  if(Math.abs(x)>WORLD||Math.abs(y)>WORLD)return 'That is outside the sector.';
  for(const s of structs)if(s!==ignore&&Math.hypot(s.x-x,s.y-y)<STRUCTS[s.t].r+d.r+4)return 'Too close to another building.';
  for(const l of lairs)if(!G.bossDead[l.id]&&Math.hypot(l.x-x,l.y-y)<420)return 'Too close to a boss lair.';
  for(const n of nests)if(!G.nestDead[n.id]&&Math.hypot(n.x-x,n.y-y)<300)return 'Too close to an enemy nest.';
  if(k==='beacon'){if(Math.hypot(player.x-x,player.y-y)>420)return 'A Beacon must go close to your ship. Fly there first.';return null;}
  if(!free&&!buildZones().some(z=>Math.hypot(z.x-x,z.y-y)<=z.r))return 'Build inside a glowing ring (or place a Beacon to make one).';
  return null;
}
const SNAP=20;
function snap(v){return Math.round(v/SNAP)*SNAP;}
let hover=null;
function hoverAt(p){if(!buildSel&&!moving){hover=null;return;}const w=toWorld(p);hover={x:snap(w.x),y:snap(w.y)};}
function buildTap(p){
  const w=toWorld(p);
  if(moving){
    if(Math.hypot(moving.x-w.x,moving.y-w.y)<STRUCTS[moving.t].r+10){flashInfo('Tap a new spot, or drag it there.');return;}
    moveTo(snap(w.x),snap(w.y));return;
  }
  if(buildSel){
    // tapping a building picks it, even with a card chosen: nothing could be built on that spot anyway
    for(const s of structs)if(Math.hypot(s.x-w.x,s.y-w.y)<STRUCTS[s.t].r+10){buildSel=null;picked=s;delSure=false;hover=null;SFX.ui();renderBuildBar();return;}
    const d=STRUCTS[buildSel],c={s:d.s,c:d.c},x=snap(w.x),y=snap(w.y);
    const prob=placeProblem(buildSel,x,y);
    if(prob){flashInfo(prob);return;}
    if(!canPay(c)){flashInfo('Not enough yet: '+d.name+' costs '+costText(c)+'.');return;}
    pay(c);structs.push({t:buildSel,x,y,lv:1,hp:d.hp,cool:0,aim:0,flash:0});
    G.stats.built++;SFX.power();boom(x,y,'#8cf',14,180);vib(20);
    hover=null;renderBuildBar();questTick();save();
    return;
  }
  picked=null;delSure=false;
  for(const s of structs)if(Math.hypot(s.x-w.x,s.y-w.y)<STRUCTS[s.t].r+10){picked=s;break;}
  renderBuildBar();
}

/* ---------- map ---------- */
function openMap(){setUi('map');}
function mapRect(){const pad=14,top=TOOL_H/scale+40,sz=Math.min(VW-pad*2,VH-top-60);return {x:(VW-sz)/2,y:top+Math.max(0,(VH-top-60-sz)/2),s:sz};}
function mapTo(r,x,y){return {x:r.x+(x+WORLD)/(2*WORLD)*r.s,y:r.y+(y+WORLD)/(2*WORLD)*r.s};}
function mapTap(p){
  const r=mapRect();
  for(const s of structs){
    if(s.t!=='core'&&s.t!=='beacon')continue;
    const q=mapTo(r,s.x,s.y);
    if(Math.hypot(q.x-p.x,q.y-p.y)<22){
      closeUi();player.x=s.x;player.y=s.y+STRUCTS[s.t].r+40;cam.x=player.x;cam.y=player.y;SFX.drone();boom(player.x,player.y,'#4df',24,240);
      for(const m of player.mates)if(!m.guard&&!m.explore){m.x=player.x;m.y=player.y;}

}
function drawMap(){
  const r=mapRect();

  ctx.fillStyle='#0a1228';ctx.strokeStyle='#2c4170';ctx.lineWidth=2;ctx.fillRect(r.x,r.y,r.s,r.s);ctx.strokeRect(r.x,r.y,r.s,r.s);
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillStyle='#4df';ctx.font='bold 22px system-ui';ctx.fillText('SECTOR MAP',VW/2,r.y-20);
  ctx.save();ctx.beginPath();ctx.rect(r.x,r.y,r.s,r.s);ctx.clip();
  const mc=mapTo(r,0,0),mk=r.s/(2*WORLD);

  ctx.fillStyle='#0a1228';ctx.beginPath();ctx.arc(mc.x,mc.y,HOME_R*mk,0,6.283);ctx.fill();
  ctx.font='bold 11px system-ui';ZONES.forEach((z,i)=>{const mid=-Math.PI/2+i*2*Math.PI/5+0.33,q=mapTo(r,Math.cos(mid)*2900,Math.sin(mid)*2900);ctx.fillStyle=z.col;ctx.globalAlpha=0.85;ctx.fillText(z.name,q.x,q.y);ctx.globalAlpha=1;});
  ctx.restore();
  for(const n of nests){if(G.nestDead[n.id])continue;const q=mapTo(r,n.x,n.y);ctx.fillStyle=n.col;ctx.globalAlpha=0.8;ctx.beginPath();ctx.arc(q.x,q.y,3.5,0,6.283);ctx.fill();}
  ctx.globalAlpha=1;
  for(const l of lairs){const b=BOSS_KINDS[l.kind],q=mapTo(r,l.x,l.y);
    if(G.bossDead[l.id]){ctx.fillStyle='#6f6';ctx.font='16px system-ui';ctx.fillText('✓',q.x,q.y);continue;}
    ctx.strokeStyle=b.col;ctx.lineWidth=3;ctx.beginPath();ctx.arc(q.x,q.y,8,0,6.283);ctx.stroke();
    ctx.fillStyle=b.col;ctx.font='bold 12px system-ui';ctx.fillText(b.name,q.x,q.y+18);
    ctx.fillStyle='#8fa6c8';ctx.font='11px system-ui';ctx.fillText('Lv '+l.lv,q.x,q.y-16);}
  for(const c of G.contracts)if(c.t==='wanted'){const q=mapTo(r,c.x,c.y);ctx.fillStyle='#ffd866';ctx.font='18px system-ui';ctx.fillText('★',q.x,q.y);ctx.font='bold 10px system-ui';ctx.fillText(c.name,q.x,q.y+14);}
  for(const pd of pods){if(G.podDone[pd.id])continue;const q=mapTo(r,pd.x,pd.y);ctx.fillStyle='#ffd866';ctx.fillRect(q.x-2.5,q.y-2.5,5,5);}
  for(const m of player.mates)if(m.explore&&!m.down){const q=mapTo(r,m.x,m.y);ctx.fillStyle='#6f9';ctx.beginPath();ctx.arc(q.x,q.y,4,0,6.283);ctx.fill();}
  if(G.treasure){const q=mapTo(r,G.treasure.x,G.treasure.y);ctx.font='18px system-ui';ctx.fillText('💰',q.x,q.y);}
  for(const s of structs){const q=mapTo(r,s.x,s.y);
    if(s.t==='core'||s.t==='beacon'){ctx.fillStyle='#4df';ctx.beginPath();ctx.arc(q.x,q.y,s.t==='core'?8:6,0,6.283);ctx.fill();ctx.strokeStyle='rgba(68,221,255,.6)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(q.x,q.y,14,0,6.283);ctx.stroke();}
    else{ctx.fillStyle='#8cf';ctx.fillRect(q.x-1.5,q.y-1.5,3,3);}}
  const me=mapTo(r,player.x,player.y);ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(me.x,me.y,4+Math.sin(time*6),0,6.283);ctx.fill();
  ctx.fillStyle='#8fa6c8';ctx.font='14px system-ui';
  ctx.fillText('Tap a blue circle to warp there · Tap here or 🗺️ to close',VW/2,VH-30);
}

/* ---------- world objects ---------- */
function spawnE(type,x,y,lv,o){
  const d=ET[type];o=o||{};
  const hpMul=(1+0.28*(lv-1))*(o.trainer||!G?1:(G.casual?diffOf().autoHp:diffOf().storyHp)*rampHp());
  const e=Object.assign({type,x,y,lv,hp:Math.ceil(d.hp*hpMul),r:d.r,t:0,f:rnd(d.fire[0],d.fire[1])*0.7,ph:Math.random()*6.283,state:0,vx:0,vy:0,flash:0},o);
  e.max=e.hp;enemies.push(e);return e;
}
function pickType(lv){
  const pool=['drifter','drifter'];
  if(lv>=2)pool.push('diver');
  if(lv>=3)pool.push('sprayer','splitter');
  if(lv>=4)pool.push('sprayer','diver');
  if(lv>=6)pool.push('tank');
  if(lv>=9)pool.push('tank','splitter');
  if(lv>=5)pool.push('sniper');
  if(lv>=7)pool.push('warden');
  if(lv>=8)pool.push('carrier');
  return pool[Math.floor(Math.random()*pool.length)];
}
function wakeBoss(l){
  const b=BOSS_KINDS[l.kind];
  l.awake=true;
  const e=spawnE('boss',l.x,l.y,l.lv,{kind:l.kind,col:b.col,lair:l,sc:b.sc,f:2.2});
  e.r=Math.round(ET.boss.r*b.sc);e.hp=e.max=Math.round((150+l.lv*55)*(l.kind===6?2.6:l.kind===5?2.2:1)*rampBoss());
  if(l.kind===5)say('Remember: when he glows gold, your guns barely scratch him. Reflect his shots!');
  if(l.kind===6)say('It is huge, Commander! Reflected shots hurt it double. It will call for help as it breaks. Stay with it!');
  banner=b.name+' AWAKENS!';bannerT=2.4;SFX.wave();
  if(G.lvl<l.lv)say('Careful! The '+b.name+' expects level '+l.lv+'. You can fly away; it will not follow far.');
}
function shootE(e,ang,spd){ebullets.push({x:e.x,y:e.y,vx:Math.cos(ang)*spd,vy:Math.sin(ang)*spd,r:6,life:3.6,dmg:1+Math.floor(e.lv/6)});}
function targetOf(e){
  if(e.raid){
    if(dist(e,player)<260&&respawnT<=0)return player;
    let b=null,bd=1e9;for(const s of structs){const d=dist(e,s);if(s.field&&d>260)continue;if(d<bd){bd=d;b=s;}}
    return b||player;
  }
  return player;
}
function ebSpeed(lv){return Math.min(380,220+lv*9);}
function updateEnemy(e,dt){
  e.t+=dt;e.flash=Math.max(0,(e.flash||0)-dt);
  const d0=ET[e.type],tg=targetOf(e),dx=tg.x-e.x,dy=tg.y-e.y,dd=Math.hypot(dx,dy)||1,ang=Math.atan2(dy,dx);
  const es=ebSpeed(e.lv),awake=e.raid||e.trainer||dd<950;
  if(e.siege){
    e.x=e.ax+Math.cos(e.t*0.7)*14;e.y=e.ay+Math.sin(e.t*0.9)*14;
    e.f-=dt;
    if(e.f<=0&&dd<760&&respawnT<=0){
      e.f=rnd(2.6,3.6);const o=Math.random()*6.28;for(let k=0;k<12;k++)shootE(e,o+k/12*6.283,es*0.6);
      if(enemies.filter(o=>o.siegeKid&&!o.dead).length<3)spawnE(pick(['drifter','drifter','diver','sprayer','splitter']),e.x+rnd(-70,70),e.y+rnd(-70,70),Math.max(1,e.lv-2),{siegeKid:true});
    }
    return;
  }
  if(e.type==='boss'){
    const l=e.lair,pd=dist(player,l);
    const kept=Math.hypot(e.x-l.x,e.y-l.y);
    if(pd>1500||respawnT>0){ // lost interest: heads home and heals
      e.x+=(l.x-e.x)*Math.min(1,dt);e.y+=(l.y-e.y)*Math.min(1,dt);e.hp=Math.min(e.kind===6?e.max*(e.p3?0.3:e.p2?0.55:e.p1?0.8:1):e.kind===5?e.max*(e.p2?0.4:e.p1?0.7:1):e.max,Math.max(e.hp,e.hp+e.max*0.1*dt));return;
    }
    if(e.kind===5){
      e.armored=(e.t%18)<11;
      for(const [k,f] of [['p1',0.66],['p2',0.33]])if(!e[k]&&e.hp<e.max*f){e[k]=true;banner='HE CALLS FOR HELP!';bannerT=2;SFX.wave();for(let n=0;n<5;n++){const a=n/5*6.283;spawnE(pickType(14),e.x+Math.cos(a)*240,e.y+Math.sin(a)*240,14,{nest:null});}}
    }
    if(e.kind===6){
      for(const [k,f] of [['p1',0.75],['p2',0.5],['p3',0.25]])if(!e[k]&&e.hp<e.max*f){e[k]=true;banner='IT CALLS FOR REINFORCEMENTS!';bannerT=2.4;SFX.wave();vib(50);for(let n=0;n<8;n++){const a=n/8*6.283;spawnE(pickType(14),e.x+Math.cos(a)*280,e.y+Math.sin(a)*280,14,{nest:null});}}
    }
    if(dd>e.r+260&&kept<900){e.x+=dx/dd*d0.speed*dt;e.y+=dy/dd*d0.speed*dt;}
    e.x+=Math.cos(e.t*0.8)*40*dt;e.y+=Math.sin(e.t*1.1)*40*dt;
    e.f-=dt;
    if(e.f<=0&&dd<760){
      const rate=Math.max(0.9,1.7-e.lv*0.03)*rampFire(),set=BOSS_SETS[e.kind],atk=set[Math.floor(e.t/6)%set.length];
      e.f=rate;
      if(atk==='ring'){const n=14,o=Math.random()*6.28;for(let k=0;k<n;k++)shootE(e,o+k/n*6.283,es*0.7);}
      else if(atk==='bigring'){const n=22,o=Math.random()*6.28;for(let k=0;k<n;k++)shootE(e,o+k/n*6.283,es*0.5);e.f=rate*1.3;}
      else if(atk==='fan5'){for(let k=-2;k<=2;k++)shootE(e,ang+k*0.17,es);e.f=rate*0.75;}
      else if(atk==='fan3fast'){for(let k=-1;k<=1;k++)shootE(e,ang+k*0.12,es*1.15);e.f=rate*0.45;}
      else if(atk==='sweep'){e.f=0.11;e.sp=(e.sp||0)+0.45;shootE(e,ang+Math.sin(e.sp)*0.9,es*0.85);}
      else if(atk==='spiral2'){e.f=0.09;e.sp=(e.sp||0)+0.32;shootE(e,e.sp,es*0.65);shootE(e,e.sp+Math.PI,es*0.65);}
      else if(atk==='flower'){e.f=0.16;e.sp=(e.sp||0)+0.2;for(let k=0;k<5;k++)shootE(e,e.sp+k*1.2566,es*0.6);}
      else if(atk==='wall'){ // a wall of shots with one gap to slip through
        const gap=Math.floor(rnd(1,8)),nx=-Math.sin(ang),ny=Math.cos(ang);
        for(let k=0;k<10;k++){if(k===gap||k===gap+1)continue;const off=(k-4.5)*44;ebullets.push({x:e.x+nx*off,y:e.y+ny*off,vx:Math.cos(ang)*es*0.6,vy:Math.sin(ang)*es*0.6,r:6,life:3.6,dmg:1+Math.floor(e.lv/6)});}
        e.f=rate*1.6;
      }
    }
    return;
  }
  if(!awake){e.x+=Math.cos(e.ph+e.t*0.4)*24*dt;e.y+=Math.sin(e.ph+e.t*0.4)*24*dt;return;}
  if(e.type==='mini'){
    e.vx+=(dx/dd*d0.speed-e.vx)*Math.min(1,2.2*dt);e.vy+=(dy/dd*d0.speed-e.vy)*Math.min(1,2.2*dt);
    e.x+=e.vx*dt;e.y+=e.vy*dt;e.life=(e.life||6)-dt;if(e.life<=0){e.dead=true;boom(e.x,e.y,'#7f8',6,120);}
  }else if(e.type==='diver'){
    if(e.state===0){e.x+=dx/dd*d0.speed*dt;e.y+=dy/dd*d0.speed*dt;if(dd<400){e.state=1;e.t=0;}}
    else if(e.state===1){e.x+=Math.sin(e.t*40)*0.8;if(e.t>0.55){e.state=2;e.t=0;const sp=380+e.lv*8;e.vx=dx/dd*sp;e.vy=dy/dd*sp;}}
    else{e.x+=e.vx*dt;e.y+=e.vy*dt;if(e.t>1.1){e.state=0;e.t=0;}}
  }else{
    const want=d0.range,sp=d0.speed*(e.raid&&dd>400?1.5:1);
    if(dd>want+20){e.x+=dx/dd*sp*dt;e.y+=dy/dd*sp*dt;}
    else if(dd<want-40){e.x-=dx/dd*sp*0.6*dt;e.y-=dy/dd*sp*0.6*dt;}
    const px=-dy/dd,py=dx/dd,sw=Math.sin(e.t*1.4+e.ph)*60;e.x+=px*sw*dt;e.y+=py*sw*dt;
    if(e.aimT>0){e.aimT-=dt;if(e.aimT<=0)shootE(e,ang,es*1.8);}
    e.f-=dt;
    if(e.f<=0&&dd<620){
      const k=rnd(d0.fire[0],d0.fire[1])*Math.max(0.55,1-e.lv*0.02)*rampFire();e.f=k;
      if(e.type==='drifter')shootE(e,ang,es);

      else if(e.type==='sprayer'){for(let j=-1;j<=1;j++)shootE(e,ang+j*0.28,es*0.9);}
      else if(e.type==='tank'){const n=10;for(let j=0;j<n;j++)shootE(e,e.t+j/n*6.283,es*0.7);}
      else if(e.type==='sniper'){e.aimT=0.75;SFX.raise();}
      else if(e.type==='warden'){
        shootE(e,ang,es*0.9);
        let hb=null;for(const o of enemies){if(o!==e&&!o.dead&&o.type!=='boss'&&!o.siege&&o.hp<o.max&&Math.hypot(o.x-e.x,o.y-e.y)<260){hb=o;break;}}
        if(hb){hb.hp=Math.min(hb.max,hb.hp+Math.ceil(hb.max*0.25));zaps.push({x1:e.x,y1:e.y,x2:hb.x,y2:hb.y,t:0.25,col:'#8fc'});}
      }
      else if(e.type==='carrier'){if(enemies.length<40)for(let j=0;j<2;j++)spawnE('mini',e.x+rnd(-30,30),e.y+rnd(-30,30),e.lv,{raid:e.raid,nest:e.nest,vx:rnd(-90,90),vy:rnd(-90,90),life:7});}
    }
  }
}
function killEnemy(e,give){
  if(e.dead)return;e.dead=true;

function updateRaid(dt){

/* ---------- update ---------- */
function update(dt){
  time+=dt;G.playT+=dt;
  const p=player;
  if(msg){msg.t-=dt;if(msg.t<=0)msg=null;}
  if(!msg&&msgQ.length){const txt=msgQ.shift(),life=Math.max(3.6,txt.length*0.06);msg={txt,t:life,life};SFX.drone();speak(txt);}
  bannerT=Math.max(0,bannerT-dt);
  saveT-=dt;if(saveT<=0){saveT=15;save();}

  /* ---- ship ---- */
  let mx=0,my=0;
  const ar=!copilot;if(keys.KeyA||ar&&keys.ArrowLeft)mx-=1;if(keys.KeyD||ar&&keys.ArrowRight)mx+=1;if(keys.KeyW||ar&&keys.ArrowUp)my-=1;if(keys.KeyS||ar&&keys.ArrowDown)my+=1;
  if(stick.id!==null){const dx=stick.x-stick.sx,dy=stick.y-stick.sy,m=Math.hypot(dx,dy);if(m>6){const k=Math.min(1,m/44);mx+=dx/m*k;my+=dy/m*k;}}
  if(pad.on){mx+=pad.mx;my+=pad.my;}
  const ml=Math.hypot(mx,my);if(ml>1){mx/=ml;my/=ml;}
  if(respawnT>0){
    respawnT-=dt;if(respawnT<=0){respawnT=0;respawn();}
  }else{
    const sp=shipSpeed();
    p.x=Math.max(-WORLD,Math.min(WORLD,p.x+mx*sp*dt));p.y=Math.max(-WORLD,Math.min(WORLD,p.y+my*sp*dt));
  }
  ['inv','rapid','wide','missile','laser','pulse'].forEach(k=>p[k]=Math.max(0,p[k]-dt));
  p.streakT=Math.max(0,p.streakT-dt);if(p.streakT<=0)p.streak=0;

  /* ---- aim: the mouse if it is being used, otherwise whatever is nearest ---- */
  const usingMouse=!G.autoAim&&!touchMode&&mouseAim&&time-mouseSeen<3;
  let tgt=null,bd=470;
  for(const e of enemies){const d=dist(e,p)*(e.siege?0.25:e.type==='boss'?0.45:1);if(d<bd){bd=d;tgt=e;}} // a boss outranks the small fry unless they are right on top of you
  for(const n of nests){if(G.nestDead[n.id])continue;const d=dist(n,p)*0.7;if(d<bd){bd=d;tgt=n;}}   // a nest outranks ships at a similar distance: it makes more of them
  if(!tgt)for(const c of crates){if(c.gone>0)continue;const d=dist(c,p);if(d<Math.min(bd,300)){bd=d;tgt=c;}}
  if(!tgt){let mb=340;for(const h of nearMines){if(h.gone>0)continue;const d=dist(h,p);if(d<mb){mb=d;tgt=h;}}}
  if(!tgt){let rb=340;for(const a of nearRocks){if(a.gone>0)continue;const d=dist(a,p);if(d<rb){rb=d;tgt=a;}}}
  let aimA=p.ang;
  if(pad.aim)aimA=pad.aimA;
  else if(usingMouse)aimA=Math.atan2(mouseAim.y-VH/2-(p.y-cam.y)*cam.zoom,mouseAim.x-VW/2-(p.x-cam.x)*cam.zoom);
  else if(tgt&&G.autoAim)aimA=Math.atan2(tgt.y-p.y,tgt.x-p.x);
  else if(ml>0.1)aimA=Math.atan2(my,mx);
  let da=aimA-p.ang;while(da>Math.PI)da-=6.283;while(da<-Math.PI)da+=6.283;
  p.ang+=da*Math.min(1,14*dt);

  /* ---- shield ---- */
  const s=p.sh,wantShield=keys.ShiftLeft||keys.ShiftRight||keys.KeyX||mouseShield||touchShield||pad.shield;
  s.cd=Math.max(0,s.cd-dt);s.broken=Math.max(0,s.broken-dt);
  if(respawnT<=0&&wantShield&&!s.on&&s.cd<=0&&s.broken<=0&&p.energy>8){s.on=true;s.t=0;s.parried=false;SFX.raise();}
  const eMax=maxEnergy();
  if(s.on){
    s.t+=dt;
    if(s.t>parryWin())p.energy-=SHIELD_HOLD_DRAIN*dt;
    if(!wantShield||p.energy<=0){
      s.on=false;s.cd=s.parried?0.08:0.45;
      if(p.energy<=0){p.energy=0;s.broken=1.8;boom(p.x,p.y,'#8cf',16,180);SFX.absorb();pop(p.x,p.y-40,'SHIELD DOWN','#f88',0.9);}
    }
  }else p.energy=Math.min(eMax,p.energy+(s.broken>0?9:20)*dt);
  if(p.hp===1&&respawnT<=0){heartT-=dt;if(heartT<=0){heartT=1.1;SFX.heart();}}else heartT=0;

  /* ---- fire ---- */
  const wantFire=(keys.Space||mouseFire||touchFire||pad.fire||(G.autoAim&&tgt))&&respawnT<=0;
  p.fire-=dt;
  if(wantFire&&!s.on&&p.laser<=0&&p.fire<=0){
    const gun=eq('gun'),gk=gun?gun.g:'pulse',gv=gun?gearV(gun):1,sh=ship();
    p.fire=(p.rapid>0?0.075:0.15)*sh.rate*(gk==='rail'?2.8:gk==='seeker'?1.4:1)/(1+G.boon.rate);
    const crit=perk('crit')&&Math.random()<0.15*perk('crit')?2:1,dmg=gunDmg()*gv*sh.dmg*crit,ca=Math.cos(p.ang),sa=Math.sin(p.ang);
    const mk=(a,o,ex,off)=>{const sp=(ex&&ex.sp)||900,f=off||0;bullets.push(Object.assign({x:p.x+ca*22-sa*f,y:p.y+sa*22+ca*f,vx:Math.cos(p.ang+a)*sp,vy:Math.sin(p.ang+a)*sp,dmg:dmg*(o||1),r:4,life:0.75},ex||{}));};
    if(gk==='twin'){mk(0,0.62,null,-6);mk(0,0.62,null,6);}
    else if(gk==='scatter'){const q={life:0.5};mk(-0.17,0.5,q);mk(0,0.5,q);mk(0.17,0.5,q);}
    else if(gk==='rail')mk(0,3,{sp:1400,rail:true,pierce:3,r:6,life:0.6});
    else if(gk==='seeker')mk(0,0.95,{sp:520,miss:true,life:1.7});
    else mk(0);
    if(p.wide>0){mk(-0.17);mk(0.17);}
    if(G.boon.rear)mk(Math.PI,0.4+0.2*G.boon.rear);
    if(G.boon.side){mk(Math.PI/2,0.3+0.2*G.boon.side);mk(-Math.PI/2,0.3+0.2*G.boon.side);}
    SFX.shoot();
  }
  p.mfire-=dt;
  if((p.missile>0||G.boon.missile)&&p.mfire<=0&&enemies.some(e=>dist(e,p)<(p.missile>0?1e9:640))&&respawnT<=0){
    p.mfire=p.missile>0?0.5:Math.max(0.7,2.5-0.35*G.boon.missile);SFX.missile();
    for(const sgn of [-1,1]){const a=p.ang+sgn*1.1;bullets.push({x:p.x,y:p.y+sgn*8,vx:Math.cos(a)*260,vy:Math.sin(a)*260,dmg:3*(gunDmg()),r:6,miss:true,life:3.5});}
  }
  if(p.laser>0&&respawnT<=0){
    p.laserAng=p.ang;
    const lx=Math.cos(p.ang),ly=Math.sin(p.ang),dps=(45+10*G.skills.guns)*(1+0.15*sumLv('workshop'))*ship().dmg;
    for(const e of enemies){const rx=e.x-p.x,ry=e.y-p.y,al=rx*lx+ry*ly,pe=Math.abs(rx*ly-ry*lx);
      if(al>0&&al<1500&&pe<LASER_HALF+e.r){e.hp-=dps*dt*(e.armored?0.5:1);e.flash=0.06;if(e.hp<=0)killEnemy(e,1);}}
    for(const n of nests){if(G.nestDead[n.id])continue;const rx=n.x-p.x,ry=n.y-p.y,al=rx*lx+ry*ly,pe=Math.abs(rx*ly-ry*lx);
      if(al>0&&al<1500&&pe<LASER_HALF+n.r){n.hp-=dps*dt;if(n.hp<=0)killNest(n);}}
    for(const eb of ebullets){const rx=eb.x-p.x,ry=eb.y-p.y,al=rx*lx+ry*ly,pe=Math.abs(rx*ly-ry*lx);if(al>0&&al<1500&&pe<LASER_HALF+8)eb.dead=true;}
  }

  /* ---- wingmates ---- */
  let i=0;const flyN=p.mates.filter(m=>!m.down&&!m.guard&&!m.explore).length;
  for(const m of p.mates){
    if(m.down>0){m.down-=dt;if(m.down<=0){m.down=0;m.x=coreStruct().x;m.y=coreStruct().y;m.sh=m.max;if(respawnT<=0)pop(p.x,p.y-40,m.name+' IS BACK!','#9df',1.4);}continue;}
    if(m.explore){exploreTick(m,dt);continue;}
    let tx,ty;
    if(m.guard){const c=coreStruct(),ga=time*0.35+m.t;tx=c.x+Math.cos(ga)*120;ty=c.y+Math.sin(ga)*120;}
    else{
      const o=formOff(i,flyN,G.form,time);i++;
      const ca=Math.cos(p.ang),sa=Math.sin(p.ang);
      tx=p.x+o[0]*ca-o[1]*sa;ty=p.y+o[0]*sa+o[1]*ca+Math.sin(time*3+m.t)*4;
    }
    const k=Math.min(1,5*dt);m.x+=(tx-m.x)*k;m.y+=(ty-m.y)*k;m.inv=Math.max(0,m.inv-dt);m.age+=dt;
    mateRankUp(m);
    m.fire-=dt;
    if(m.fire<=0&&respawnT<=0){
      let bt=null,bb=430;for(const e of enemies){const d=dist(e,m);if(d<bb){bb=d;bt=e;}}
      for(const n of nests){if(G.nestDead[n.id])continue;const d=dist(n,m)*0.7;if(d<bb){bb=d;bt=n;}}
      if(bt){m.fire=0.36;const a=Math.atan2(bt.y-m.y,bt.x-m.x);m.ang=a;
        bullets.push({x:m.x,y:m.y,vx:Math.cos(a)*850,vy:Math.sin(a)*850,dmg:(m.rank>=3?2:1)*(1+0.15*sumLv('workshop')),r:4,life:0.6,mate:m,ace:m.rank>=3});}
      else m.fire=0.25;
    }
  }

  if(copilot)copilotTick(copilot,dt);
  if(NET.peer&&copilot){NET.sendT-=dt;if(NET.sendT<=0){NET.sendT=0.1;netSend(netFast(),true);}NET.slowT-=dt;if(NET.slowT<=0){NET.slowT=1;netSend(netSlow(),true);}}

  /* ---- the world around you ---- */
  nearT-=dt;
  if(nearT<=0){nearT=0.3;const nearP=o=>(Math.abs(o.x-p.x)<1100&&Math.abs(o.y-p.y)<1100)||(NET.peer&&copilot&&Math.abs(o.x-copilot.x)<900&&Math.abs(o.y-copilot.y)<900);nearRocks=asteroids.filter(a=>a.gone<=0&&nearP(a));nearMines=hazards.filter(h=>h.k==='mine'&&nearP(h));}
  updateHazards(dt);
  abilitiesTick(dt);
  cardsTick(dt);
  treasureTick();
  baseEventsTick(dt);
  hintTick(dt);
  contractT-=dt;if(contractT<=0){contractT=0.5;contractsTick();shopTick();stickerTick();}
  for(const a of asteroids)if(a.gone>0){a.gone-=dt;if(a.gone<=0){a.gone=0;a.hp=a.max;}}
  for(const c of crates)if(c.gone>0)c.gone=Math.max(0,c.gone-dt);

  // pods rescue when you fly by
  if(respawnT<=0)for(const pd of pods){
    if(G.podDone[pd.id]||Math.hypot(pd.x-p.x,pd.y-p.y)>70)continue;
    G.podDone[pd.id]=1;G.stats.rescued++;SFX.drone();
    if(p.mates.length<mateSlots()){
      const used=p.mates.map(m=>m.name),free=CALLSIGNS.filter(n=>!used.includes(n));
      const name=free[Math.floor(Math.random()*free.length)]||'WING';
      p.mates.push({name,rank:0,age:0,kills:0,sh:3,max:3,down:0,x:pd.x,y:pd.y,inv:0,fire:0,t:rnd(0,6)});
      banner=name+' JOINED YOUR SQUAD!';bannerT=2.4;
    }else{
      gainXp(30+G.lvl*4);G.crystal+=3;banner='SQUAD FULL: +XP, +3 CRYSTAL';bannerT=2.4;
      say('The squad is full, Commander. A Barracks adds room for more pilots.');
    }
    boom(pd.x,pd.y,'#ffd866',20,220);questTick();save();
  }

  // lairs wake when you come close
  if(respawnT<=0)for(const l of lairs){
    if(G.bossDead[l.id]||l.awake)continue;
    if(dist(l,p)<720)wakeBoss(l);
  }
  for(const e of enemies)if(e.type==='boss'&&dist(e.lair,p)>2400&&e.hp>=e.max){e.dead=true;e.lair.awake=false;}

  // nests send ships while you are near
  for(const n of nests){
    if(G.nestDead[n.id])continue;
    const d=dist(n,p);
    n.hp=Math.min(n.max,n.hp+(d>900?n.max*0.02*dt:0));
    if(d<1000&&respawnT<=0){
      n.t-=dt;
      if(n.t<=0){
        n.t=rnd(2.6,4.4);
        if(enemies.filter(e=>e.nest===n).length<3+Math.floor(n.lv/4)+rampPop())spawnE(pickType(n.lv),n.x+rnd(-40,40),n.y+rnd(-40,40),n.lv,{nest:n});
      }
    }
  }

  if(patrolT<=0){

    const dHome=Math.hypot(p.x,p.y);
    if(dHome>SAFE_R&&enemies.length<Math.min(26,14+rampPop()*2)&&respawnT<=0){
      const a=Math.random()*6.283,R=Math.max(VW,VH)*0.75/cam.zoom+120,x=p.x+Math.cos(a)*R,y=p.y+Math.sin(a)*R;
      const lv=Math.max(1,Math.round(1+dHome/520));
      const n=1+Math.floor(rnd(0,2.2))+rampPop();for(let k=0;k<n;k++)spawnE(pickType(lv),x+rnd(-60,60),y+rnd(-60,60),lv);
      if(lv>=3&&Math.random()<Math.min(0.65,0.25+diffOf().ramp.elite*threat())){const e=spawnE(pickType(lv),x,y,lv,{elite:true});e.hp=e.max=e.max*3;e.r=Math.round(e.r*1.25);}
    }
  }
  // training drones come back until the lesson is learned
  if(QUESTS[G.quest]&&QUESTS[G.quest].title==='Mirror Shield'&&!enemies.some(e=>e.trainer)&&respawnT<=0){trainT+=dt;if(trainT>3){trainT=0;spawnTrainers();}}
  updateRaid(dt);
  finalTick(dt);

  /* ---- enemies ---- */
  for(const e of enemies){
    if(e.dead)continue;
    updateEnemy(e,dt);
    if(e.dead)continue;
    if(!e.raid&&!e.trainer&&!e.siege&&e.type!=='boss'&&dist(e,p)>1900)e.dead=true;
    // contact with the ship
    if(respawnT<=0&&dist(e,p)<e.r+14){
      if(e.type==='boss'||e.type==='tank'||e.elite){hurt(1+Math.floor(e.lv/6));if(e.type!=='boss'){e.x+=(e.x-p.x)*0.3;e.y+=(e.y-p.y)*0.3;}}
      else if(s.on&&s.t<=parryWin()*1.5)killEnemy(e,1);
      else{hurt(1);killEnemy(e,1);}
    }
    // raiders chew on buildings by touch
    if(!e.dead&&(e.raid||e.type==='diver'))for(const st of structs){
      if(Math.hypot(e.x-st.x,e.y-st.y)<e.r+STRUCTS[st.t].r){hitStruct(st,e.type==='tank'?3:1);if(e.type!=='tank')killEnemy(e,0);break;}
    }
    if(!e.dead)for(const m of p.mates){
      if(!m.down&&m.inv<=0&&Math.hypot(e.x-m.x,e.y-m.y)<e.r+12){mateDamage(m,1);if(e.type!=='boss'){e.hp-=2;e.flash=0.08;if(e.hp<=0)killEnemy(e,1);}}
    }
  }

  /* ---- your shots ---- */
  for(const b of bullets){
    b.life-=dt;if(b.life<=0)b.dead=true;
    if(b.miss||(b.ref&&b.target)){
      if(b.miss&&(!b.target||b.target.dead)){let m=1e9;b.target=null;for(const e of enemies){const d=Math.hypot(e.x-b.x,e.y-b.y);if(d<m){m=d;b.target=e;}}}
      if(b.target&&!b.target.dead){
        const a=Math.atan2(b.target.y-b.y,b.target.x-b.x),cur=Math.atan2(b.vy,b.vx);let d=a-cur;while(d>Math.PI)d-=6.283;while(d<-Math.PI)d+=6.283;
        const na=cur+Math.max(-7*dt,Math.min(7*dt,d)),sp=Math.min(760,Math.hypot(b.vx,b.vy)+500*dt);b.vx=Math.cos(na)*sp;b.vy=Math.sin(na)*sp;

    for(const e of enemies){

      if(Math.hypot(e.x-b.x,e.y-b.y)<e.r*(e.sc?0.95:1)+b.r){
        e.hp-=b.dmg*(e.kind>=5?(b.ref?2:(e.armored?0.35:1)):1)*(e.siege&&b.tur?0:1);e.flash=0.08;SFX.hit();boom(b.x,b.y,b.ref?'#fff':'#ff9',b.ref?8:3,120);
        if(b.ref){shake=Math.max(shake,4);if(!b.hit)b.hit=new Set();b.hit.add(e);b.pierce--;if(b.pierce<0)b.dead=true;}
        else if(b.rail){if(!b.hit)b.hit=new Set();b.hit.add(e);b.pierce--;if(b.pierce<0)b.dead=true;}
        else b.dead=true;
        if(e.hp<=0){if(b.mate)b.mate.kills++;killEnemy(e,b.tur?2:1);}

      }
    }
    if(b.dead)continue;
    for(const n of nests){
      if(G.nestDead[n.id])continue;
      if(Math.abs(n.x-b.x)<n.r+8&&Math.hypot(n.x-b.x,n.y-b.y)<n.r+b.r){n.hp-=b.dmg;b.dead=true;SFX.hit();boom(b.x,b.y,n.col,3,120);if(n.hp<=0)killNest(n);break;}
    }
    if(b.dead||b.tur)continue;
    for(const a of nearRocks){
      if(a.gone>0)continue;
      if(Math.abs(a.x-b.x)<a.r+8&&Math.hypot(a.x-b.x,a.y-b.y)<a.r+b.r){
        a.hp-=b.dmg;b.dead=true;boom(b.x,b.y,a.crystal?'#f6c':'#a98',2,90);
        if(a.hp<=0){a.gone=120;a.hp=0;boom(a.x,a.y,a.crystal?'#f6c':'#a98',16,200);SFX.absorb();
          drop(a.x,a.y,'scrap',Math.ceil(a.r/8));if(a.crystal)drop(a.x,a.y,'crystal',1+Math.floor(a.r/24));}
        break;
      }
    }
    if(b.dead)continue;
    for(const h of nearMines){
      if(h.gone>0)continue;
      if(Math.hypot(h.x-b.x,h.y-b.y)<h.r+b.r+4){b.dead=true;blowMine(h);break;}
    }
    if(b.dead)continue;
    for(const c of crates){
      if(c.gone>0)continue;
      if(Math.hypot(c.x-b.x,c.y-b.y)<20+b.r){c.gone=200;b.dead=true;openCrate(c);break;}
    }
  }

  /* ---- enemy shots ---- */
  for(const b of ebullets){
    b.life-=dt;if(b.life<=0)b.dead=true;
    b.x+=b.vx*dt;b.y+=b.vy*dt;
    if(b.dead)continue;
    // your Mirror Pylons bat shots back
    for(const st of structs){
      if(st.t==='mirror'&&st.cool<=0&&Math.hypot(st.x-b.x,st.y-b.y)<STRUCTS.mirror.range+st.lv*14){
        st.cool=Math.max(0.5,1.6-0.3*st.lv);st.flash=0.25;reflect(b,st.x,st.y,3+st.lv,true);SFX.deflect();break;
      }
      if(st.t==='dome'&&domeCharge(st)>=1&&Math.hypot(st.x-b.x,st.y-b.y)<domeR(st)){st.charge=domeCharge(st)-1;st.flash=0.12;b.dead=true;boom(b.x,b.y,'#9df',3,90);break;}
    }
    if(b.dead)continue;
    if(respawnT<=0&&Math.hypot(b.x-p.x,b.y-p.y)<62+b.r){
      const storm=G.boon.storm&&p.stormT<=0;
      if(storm||(G.boon.auto&&p.autoT<=0)){
        if(!storm){p.autoT=Math.max(1.5,8-1.1*G.boon.auto);pop(p.x,p.y-52,'AUTO MIRROR!','#fff',0.7);}
        reflect(b,p.x,p.y,(6+2*G.skills.shield)*(1+0.15*sumLv('workshop'))*(1+G.boon.dmg),false);G.stats.parries++;SFX.parry(1);addUlt(3);questTick();continue;
      }
    }
    if(respawnT<=0&&s.on&&Math.hypot(b.x-p.x,b.y-p.y)<shieldR()+b.r){
      if(s.t<=parryWin()){
        s.parried=true;p.streak++;p.streakT=2.4;G.stats.parries++;
        reflect(b,p.x,p.y,(6+2*G.skills.shield)*(1+0.15*sumLv('workshop'))*(1+0.5*perk('mirror')),false);
        SFX.parry(p.streak);shake=Math.max(shake,4);vib(18);addUlt(6*(1+0.4*perk('charge')));slowT=Math.max(slowT,0.04);
        pop(p.x,p.y-52,p.streak>1?'MIRROR x'+p.streak:'MIRROR!','#fff',0.7);
        questTick();
      }else{
        b.dead=true;p.energy=Math.max(0,p.energy-SHIELD_ABSORB_COST);SFX.absorb();boom(b.x,b.y,'#8cf',4,100);
      }
      continue;
    }
    if(respawnT<=0&&Math.hypot(b.x-p.x,b.y-p.y)<12+b.r){b.dead=true;hurt(b.dmg);continue;}
    for(const m of p.mates){if(!m.down&&m.inv<=0&&Math.hypot(b.x-m.x,b.y-m.y)<12+b.r){b.dead=true;mateDamage(m,1);break;}}
    if(!b.dead&&copilot&&!copilot.down&&copilot.inv<=0&&Math.hypot(b.x-copilot.x,b.y-copilot.y)<16+b.r){b.dead=true;copilotDamage(copilot);}
    if(b.dead)continue;
    for(const st of structs){if(Math.abs(st.x-b.x)<50&&Math.hypot(st.x-b.x,st.y-b.y)<STRUCTS[st.t].r+b.r){b.dead=true;hitStruct(st,b.dmg);break;}}
  }

  /* ---- your buildings at work ---- */
  incomeT-=dt;refineT-=dt;
  if(incomeT<=0){incomeT=10;const n=Math.round(sumLv('extractor')*3*(1+G.boon.income));if(n>0&&!baseJammed()){if(isHome()){G.scrap+=n;G.stats.scrapGot+=n;}else G.vault.s=Math.min(vaultCap().s,G.vault.s+n);}}
  if(refineT<=0){refineT=20;const n=Math.round(sumLv('refinery')*(1+G.boon.income));if(n>0&&!baseJammed()){if(isHome())G.crystal+=n;else G.vault.c=Math.min(vaultCap().c,G.vault.c+n);}}
  for(const st of structs){
    st.cool=Math.max(0,(st.cool||0)-dt);st.flash=Math.max(0,(st.flash||0)-dt);
    if(st.hp<sHp(st)&&!raid&&!(ev&&ev.k==='siege'))st.hp=Math.min(sHp(st),st.hp+sHp(st)*0.02*dt);
    if(G.boon.nanite&&st.hp<sHp(st))st.hp=Math.min(sHp(st),st.hp+sHp(st)*G.boon.nanite*dt);
    if(ev&&ev.k==='storm'&&!st.field)continue;   // knocked out until you reboot the Core
    if(st.t==='turret'){
      const range=STRUCTS.turret.range+st.lv*30;
      let bt=null,bb=range;for(const e of enemies){if(e.siege)continue;const d=Math.hypot(e.x-st.x,e.y-st.y);if(d<bb){bb=d;bt=e;}}
      if(bt){st.aim=Math.atan2(bt.y-st.y,bt.x-st.x);
        if(st.cool<=0){st.cool=Math.max(0.22,0.62-0.1*st.lv)/(1+G.boon.turret);const a=st.aim;bullets.push({x:st.x+Math.cos(a)*20,y:st.y+Math.sin(a)*20,vx:Math.cos(a)*800,vy:Math.sin(a)*800,dmg:(1+st.lv*0.8)*(1+G.boon.turret),r:4,life:0.6,tur:true});}}
    }else if(st.t==='arc'){
      if(st.cool<=0){
        const range=STRUCTS.arc.range+st.lv*30,hits=enemies.filter(e=>!e.dead&&!e.siege&&Math.hypot(e.x-st.x,e.y-st.y)<range).slice(0,2+st.lv);
        if(hits.length){
          st.cool=Math.max(0.5,1-0.12*st.lv);let fx=st.x,fy=st.y;
          for(const e of hits){zaps.push({x1:fx,y1:fy,x2:e.x,y2:e.y,t:0.16,col:'#9ef'});fx=e.x;fy=e.y;e.hp-=(1.5+st.lv)*(1+0.15*sumLv('workshop'));e.flash=0.08;if(e.hp<=0)killEnemy(e,2);}
          SFX.hit();
        }
      }
    }else if(st.t==='silo'){
      if(st.cool<=0){
        const range=STRUCTS.silo.range+st.lv*60;
        if(enemies.some(e=>!e.siege&&Math.hypot(e.x-st.x,e.y-st.y)<range)){
          st.cool=Math.max(1.2,2.8-0.35*st.lv);st.flash=0.15;SFX.missile();
          const a=rnd(0,6.283);bullets.push({x:st.x,y:st.y,vx:Math.cos(a)*240,vy:Math.sin(a)*240,dmg:(5+2.5*st.lv)*(1+0.15*sumLv('workshop')),r:6,miss:true,tur:true,life:3.5});
        }
      }
    }else if(st.t==='dome'){
      st.charge=Math.min(domeMax(st),domeCharge(st)+(0.5+0.25*st.lv)*dt);
    }else if(st.t==='repair'){
      const range=STRUCTS.repair.range+st.lv*30,heal=0.8+st.lv*0.6;
      if(Math.hypot(p.x-st.x,p.y-st.y)<range&&respawnT<=0)p.hp=Math.min(maxHp(),p.hp+heal*dt);
      for(const m of p.mates)if(!m.down&&Math.hypot(m.x-st.x,m.y-st.y)<range)m.sh=Math.min(m.max,m.sh+heal*0.5*dt);
      for(const o of structs)if(o!==st&&o.hp<sHp(o)&&Math.hypot(o.x-st.x,o.y-st.y)<range)o.hp=Math.min(sHp(o),o.hp+sHp(o)*0.05*st.lv*dt);
    }
  }
  structs=structs.filter(st=>{
    if(st.hp>0)return true;
    if(st.t==='core'){st.hp=1;return true;}
    boom(st.x,st.y,'#fa4',26,300);SFX.boom();pop(st.x,st.y-20,STRUCTS[st.t].name+' LOST','#f88',1.6);
    return false;
  });

  /* ---- pickups ---- */
  const mag=120+G.skills.engine*12+(eq('engine')?40:0)+G.boon.magnet;
  for(const pk of pickups){
    pk.t-=dt;if(pk.t<=0){pk.dead=true;continue;}
    pk.vx*=Math.pow(0.05,dt);pk.vy*=Math.pow(0.05,dt);
    const d=Math.hypot(p.x-pk.x,p.y-pk.y);
    if(d<mag&&respawnT<=0){const sp=360*(1-d/mag)+120;pk.vx=(p.x-pk.x)/d*sp;pk.vy=(p.y-pk.y)/d*sp;}
    pk.x+=pk.vx*dt;pk.y+=pk.vy*dt;
    if(d<26&&respawnT<=0){pk.dead=true;collect(pk);}
    else if(copilot&&!copilot.down&&respawnT<=0&&Math.hypot(copilot.x-pk.x,copilot.y-pk.y)<30){pk.dead=true;collect(pk);}
  }
  for(const q of parts){q.t-=dt;q.x+=q.vx*dt;q.y+=q.vy*dt;q.vx*=0.97;q.vy*=0.97;}
  for(const q of pops){q.t-=dt;q.y-=30*dt;}
  enemies=enemies.filter(e=>!e.dead);bullets=bullets.filter(b=>!b.dead);ebullets=ebullets.filter(b=>!b.dead);
  parts=parts.filter(q=>q.t>0);pops=pops.filter(q=>q.t>0);pickups=pickups.filter(q=>!q.dead);
  questTick();
  shake=Math.max(0,shake-22*dt);
  if(G.ult>=ULT_COST)$('bLaser').classList.toggle('hide',!touchMode);
  // the camera leans ahead of where you are flying
  const k=Math.min(1,6*dt);cam.x+=(p.x-cam.x)*k;cam.y+=(p.y-cam.y)*k;
}

/* ---------- zone hazards ---------- */
function blowMine(h){
  h.gone=70;h.arm=0;boom(h.x,h.y,'#f83',26,300);SFX.boom();shake=Math.max(shake,5);
  drop(h.x,h.y,'scrap',2);
  for(const e of enemies)if(Math.hypot(e.x-h.x,e.y-h.y)<140){e.hp-=8;e.flash=0.1;if(e.hp<=0)killEnemy(e,1);}
  if(respawnT<=0&&Math.hypot(player.x-h.x,player.y-h.y)<120&&!player.sh.on)hurt(1);
}
function updateHazards(dt){
  const p=player,z=zoneAt(p.x,p.y);
  if(z!==curZone){
    curZone=z;
    if(z>=0){banner=ZONES[z].name.toUpperCase();bannerT=2;if(!G.seenZ[z]){G.seenZ[z]=1;say(ZONES[z].tip);}}
    else{banner='HOME REACH';bannerT=1.4;}
  }
  zaps=zaps.filter(q=>(q.t-=dt)>0);
  for(const h of hazards){
    if(h.gone>0){h.gone-=dt;continue;}
    const dx=p.x-h.x,dy=p.y-h.y;
    if(Math.abs(dx)>h.r+130||Math.abs(dy)>h.r+130)continue;
    const d=Math.hypot(dx,dy)||1;
    if(respawnT>0)continue;
    if(h.k==='well'&&d<h.r){
      const pull=(1-d/h.r)*210+30;p.x-=dx/d*pull*dt;p.y-=dy/d*pull*dt;
      if(d<34)hurt(1);
    }else if(h.k==='mine'){
      if(!h.arm&&d<110){h.arm=0.6;SFX.raise();}
      if(h.arm>0){h.arm-=dt;if(h.arm<=0)blowMine(h);}
    }else if(h.k==='current'&&d<h.r){p.x+=Math.cos(h.a)*170*dt;p.y+=Math.sin(h.a)*170*dt;}
    else if(h.k==='toxic'&&d<h.r&&!p.inv){
      p.hp-=0.3*dt*diffOf().toxic;
      poisonT-=dt;if(poisonT<=0){poisonT=2;pop(p.x,p.y-30,'POISON!','#9f3',0.9);}
      if(p.hp<=0)shipDown();
    }
  }
  for(const h of nearMines)if(h.arm>0&&(respawnT>0||Math.hypot(p.x-h.x,p.y-h.y)>h.r+130)){h.arm-=dt;if(h.arm<=0)blowMine(h);}
  // solar flares: a warning, then hold your shield up
  flareOn=Math.max(0,flareOn-dt);
  if(z===3&&respawnT<=0){
    if(flareWarn>0){
      flareWarn-=dt;
      if(flareWarn<=0){
        flareOn=0.7;SFX.nuke();shake=Math.max(shake,10);
        if(p.sh.on){addUlt(15);pop(p.x,p.y-52,'FLARE BLOCKED!','#fff',1.2);}
        else hurt(diffOf().flare);
        flareT=rnd(20,30);
      }
    }else{flareT-=dt;if(flareT<=0){flareWarn=3;SFX.wave();}}
  }else flareWarn=0;
  p.x=Math.max(-WORLD,Math.min(WORLD,p.x));p.y=Math.max(-WORLD,Math.min(WORLD,p.y));
}
function reflect(b,x,y,dmg,weak){
  b.dead=true;
  let bestE=null,bestD=1e9;for(const e of enemies){const d=Math.hypot(e.x-x,e.y-y);if(d<bestD){bestD=d;bestE=e;}}
  let a=Math.atan2(-b.vy,-b.vx);if(bestE)a=Math.atan2(bestE.y-b.y,bestE.x-b.x);
  bullets.push({x:b.x,y:b.y,vx:Math.cos(a)*720,vy:Math.sin(a)*720,dmg,r:7,ref:true,pierce:weak?0:2,target:bestE,life:1.4,tur:weak});
  boom(b.x,b.y,'#fff',weak?5:10,240);
}

function amigoHead(c,o){ // centred on the middle of the face; about 34 units in radius
  const FACE='#cdd3df',SHADE='#a8b2c6',NAVY='#121c4a',BLUE=o.eye||'#3a86ff';
  o=o||{};
