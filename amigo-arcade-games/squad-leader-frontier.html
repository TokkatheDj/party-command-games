    c.beginPath();c.ellipse(0,-4,35,33,0,Math.PI*0.9,Math.PI*2.1);c.closePath();c.fill();c.stroke();
    c.fillStyle=o.stripe||'#e8f2ff';c.fillRect(-4,-37,8,12);c.fillStyle=o.stripe2||'#3a86ff';c.fillRect(-1.5,-37,3,12);
  }
  // face
  c.fillStyle=FACE;c.beginPath();c.ellipse(0,6,27,19,0,0,6.283);c.fill();
  c.fillStyle=SHADE;c.beginPath();c.ellipse(0,19,18,5,0,0,6.283);c.fill();
  c.fillStyle=FACE;c.beginPath();c.ellipse(0,15,20,7,0,0,6.283);c.fill();
  // eyes
  for(const [ex,side] of [[-14,-1],[14,1]]){
    c.fillStyle=FACE;c.beginPath();c.arc(ex,-10,11.5,0,6.283);c.fill();
    c.fillStyle=NAVY;c.beginPath();c.arc(ex,-10,9.3,0,6.283);c.fill();
    if(o.fire){c.shadowColor='#4ff';c.shadowBlur=12;}
    c.fillStyle=BLUE;c.beginPath();c.arc(ex,-10,7.6,0,6.283);c.fill();c.shadowBlur=0;
    c.fillStyle=NAVY;c.beginPath();c.arc(ex+(o.fire?0:1.6),-9.6,o.pupil||5.8,0,6.283);c.fill();
    c.fillStyle='#fff';c.beginPath();c.arc(ex-2.6,-12.8,1.9,0,6.283);c.fill();
    // a lid cuts across the top of the eye: flat when focused, steep when fierce
    if(o.lid){c.fillStyle=SHADE;c.save();c.beginPath();c.arc(ex,-10,11.8,0,6.283);c.clip();c.translate(ex,-10);c.rotate(side*-(o.lidTilt||0));c.fillRect(-16,-16,32,16-o.lid);c.restore();}

    if(o.brow!==undefined){c.strokeStyle=o.browCol||NAVY;c.lineWidth=o.browW||3.4;c.lineCap='round';c.beginPath();c.moveTo(ex+side*11,-21-o.brow*0.9);c.lineTo(ex-side*9,-19+o.brow*1.5);c.stroke();}

  if(o.mouth==='grit'){
    c.fillStyle='#0d1530';c.beginPath();c.moveTo(-14,8);c.lineTo(14,8);c.quadraticCurveTo(12,19,0,19);c.quadraticCurveTo(-12,19,-14,8);c.closePath();c.fill();c.stroke();
    c.strokeStyle='#e8f2ff';c.lineWidth=1.6;c.beginPath();for(let x=-10;x<=10;x+=4){c.moveTo(x,9.5);c.lineTo(x,17);}c.moveTo(-12,13);c.lineTo(12,13);c.stroke();
  }else if(o.mouth==='set'){c.beginPath();c.moveTo(-10,12);c.quadraticCurveTo(1,14,12,9);c.stroke();}
  else{c.beginPath();c.moveTo(-11,8);c.quadraticCurveTo(-8,16,0,16);c.quadraticCurveTo(9,16,12,9);c.stroke();c.fillStyle=NAVY;c.beginPath();c.arc(21.5,8.8,1.9,0,6.283);c.fill();}
  if(o.scar){c.strokeStyle='#7d8aa5';c.lineWidth=2.2;c.beginPath();c.moveTo(19,-24);c.lineTo(11,3);c.stroke();c.lineWidth=1.4;for(const y of [-16,-8,-1]){const x=19-(y+24)*0.3;c.beginPath();c.moveTo(x-3,y-1);c.lineTo(x+3,y+1);c.stroke();}}
  // headset and boom mic
  if(o.headset){

    c.fillStyle='#0d1530';c.beginPath();c.ellipse(-6,18.5,4.5,3.5,0,0,6.283);c.fill();
  }
}

function drawStars(){
  ctx.fillStyle='#05060f';ctx.fillRect(0,0,VW,VH);
  const cx=(state==='play'?cam.x:time*40),cy=(state==='play'?cam.y:time*12);
  for(const s of stars){
    const x=((s.x-cx*s.z)%VWmod()+VWmod())%VWmod(),y=((s.y-cy*s.z)%VHmod()+VHmod())%VHmod();
    ctx.globalAlpha=0.3+s.z;ctx.fillStyle=s.z>0.5?'#cfe':'#89a';ctx.fillRect(x,y,s.s,s.s);
  }
  ctx.globalAlpha=1;
}
function VWmod(){return Math.max(VW,700);}
function VHmod(){return Math.max(VH,700);}
function onView(x,y,m){const hw=VW/2/cam.zoom+(m||60),hh=VH/2/cam.zoom+(m||60),cx=cam.x+cam.px,cy=cam.y+cam.py;return Math.abs(x-cx)<hw&&Math.abs(y-cy)<hh;}

  if(a.crystal){ctx.fillStyle='#f9d';for(let k=0;k<3;k++){const t=k*2.1,r=a.r*0.35;ctx.beginPath();ctx.moveTo(Math.cos(t)*r,Math.sin(t)*r-5);ctx.lineTo(Math.cos(t)*r+4,Math.sin(t)*r);ctx.lineTo(Math.cos(t)*r,Math.sin(t)*r+5);ctx.lineTo(Math.cos(t)*r-4,Math.sin(t)*r);ctx.closePath();ctx.fill();}}

function drawStruct(s){

    else if(s.t==='refinery'){ctx.fillStyle=col;ctx.save();ctx.rotate(time);ctx.beginPath();ctx.moveTo(0,-r*0.6);ctx.lineTo(r*0.45,0);ctx.lineTo(0,r*0.6);ctx.lineTo(-r*0.45,0);ctx.closePath();ctx.fill();ctx.restore();}

function drawHazard(h){

    const g=ctx.createRadialGradient(0,0,10,0,0,h.r);g.addColorStop(0,'rgba(20,0,40,.95)');g.addColorStop(0.5,'rgba(120,60,200,.18)');g.addColorStop(1,'rgba(120,60,200,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,h.r,0,6.283);ctx.fill();
    ctx.strokeStyle='rgba(200,150,255,.5)';ctx.lineWidth=2;for(let i=0;i<3;i++){const q=((time*0.4+i/3)%1);ctx.globalAlpha=q;ctx.beginPath();ctx.arc(0,0,34+(1-q)*(h.r-40),0,6.283);ctx.stroke();}ctx.globalAlpha=1;
    ctx.fillStyle='#000';ctx.strokeStyle='#c6f';ctx.beginPath();ctx.arc(0,0,30,0,6.283);ctx.fill();ctx.stroke();
  }else if(h.k==='mine'){
    const blink=h.arm>0?Math.floor(time*16)%2:Math.floor(time*2)%2;
    ctx.fillStyle=blink?'#f83':'#4a1a0c';ctx.strokeStyle='#f83';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,h.r,0,6.283);ctx.fill();ctx.stroke();
    for(let i=0;i<8;i++){const a=i/8*6.283;ctx.beginPath();ctx.moveTo(Math.cos(a)*h.r,Math.sin(a)*h.r);ctx.lineTo(Math.cos(a)*(h.r+7),Math.sin(a)*(h.r+7));ctx.stroke();}
    if(h.arm>0){ctx.strokeStyle='rgba(255,130,50,.6)';ctx.beginPath();ctx.arc(0,0,120,0,6.283);ctx.stroke();}
  }else if(h.k==='current'){
    ctx.globalAlpha=0.08;ctx.fillStyle='#2fb';ctx.beginPath();ctx.arc(0,0,h.r,0,6.283);ctx.fill();ctx.globalAlpha=1;
    ctx.rotate(h.a);ctx.strokeStyle='rgba(60,255,200,.45)';ctx.lineWidth=3;
    for(let i=-2;i<=2;i++)for(let j=-2;j<=2;j++){const x=((j*90+time*150)%450+450)%450-225,y=i*70;if(x*x+y*y>h.r*h.r*0.8)continue;ctx.beginPath();ctx.moveTo(x-10,y-12);ctx.lineTo(x+6,y);ctx.lineTo(x-10,y+12);ctx.stroke();}
  }else if(h.k==='toxic'){

  }
  ctx.restore();
}
function drawTint(){

function drawEnemy(e){

  }else if(e.type==='tank'){ctx.beginPath();for(let i=0;i<6;i++){const a=i/6*6.283;i?ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r):ctx.moveTo(Math.cos(a)*r,Math.sin(a)*r);}ctx.closePath();ctx.fill();ctx.stroke();ctx.fillStyle=col;ctx.beginPath();ctx.arc(0,0,r*0.3,0,6.283);ctx.fill();}

  else if(e.type==='sniper'){const a=Math.atan2(player.y-e.y,player.x-e.x);ctx.rotate(a);ctx.beginPath();ctx.moveTo(r+10,0);ctx.lineTo(-r,-r*0.55);ctx.lineTo(-r,r*0.55);ctx.closePath();ctx.fill();ctx.stroke();if(e.aimT>0){ctx.strokeStyle='rgba(255,90,90,'+(0.9-e.aimT)+')';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(r+10,0);ctx.lineTo(900,0);ctx.stroke();}}
  else if(e.type==='warden'){ctx.beginPath();ctx.arc(0,0,r,0,6.283);ctx.fill();ctx.stroke();ctx.fillStyle=col;ctx.fillRect(-3,-r*0.6,6,r*1.2);ctx.fillRect(-r*0.6,-3,r*1.2,6);}
  else if(e.type==='carrier'){ctx.rotate(e.t*0.2);ctx.beginPath();for(let i=0;i<8;i++){const a=i/8*6.283;i?ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r):ctx.moveTo(Math.cos(a)*r,Math.sin(a)*r);}ctx.closePath();ctx.fill();ctx.stroke();ctx.fillStyle=col;for(let i=0;i<4;i++){const a=i/4*6.283;ctx.beginPath();ctx.arc(Math.cos(a)*r*0.5,Math.sin(a)*r*0.5,r*0.14,0,6.283);ctx.fill();}}
  else if(e.type==='siege'){
    glow('#f44',22);ctx.save();ctx.rotate(e.t*0.4);ctx.beginPath();for(let i=0;i<16;i++){const a=i/16*6.283,rr=r*(i%2?0.8:1);i?ctx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr):ctx.moveTo(Math.cos(a)*rr,Math.sin(a)*rr);}ctx.closePath();ctx.fill();ctx.stroke();ctx.restore();noGlow();
    ctx.fillStyle=col;ctx.beginPath();ctx.ellipse(0,0,r*0.5,r*0.22,0,0,6.283);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(0,-r*0.14,r*0.2,3.14,6.283);ctx.fill();
    ctx.strokeStyle='rgba(255,120,120,'+(0.35+0.2*Math.sin(e.t*5))+')';ctx.lineWidth=4;ctx.beginPath();ctx.arc(0,0,r+14,0,6.283);ctx.stroke();
  }
  else if(e.type==='sprayer'){ctx.rotate(e.t);ctx.beginPath();for(let i=0;i<3;i++){const a=i/3*6.283;i?ctx.lineTo(Math.cos(a)*r*1.2,Math.sin(a)*r*1.2):ctx.moveTo(Math.cos(a)*r*1.2,Math.sin(a)*r*1.2);}ctx.closePath();ctx.fill();ctx.stroke();}
