<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Comet Courier</title>
<!-- Comet Courier: a gravity flying game made with the Amigo App Builder's Advanced rules.
     Rocket art: Adobe Stock #541053342 "Small cartoon red and white rocket.", licensed 23 Nov 2026,
     background removed with Adobe's Remove Background, and stored inside this file as a small picture. -->
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #070b1f; color: #eef1ff;
    font-family: "Segoe UI", system-ui, sans-serif; user-select: none; -webkit-user-select: none; touch-action: none; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #hud { position: fixed; top: 8px; left: 10px; right: 10px; display: flex; gap: 14px; align-items: center; flex-wrap: wrap;
    font-weight: 700; font-size: clamp(14px, 3.6vw, 18px); pointer-events: none; text-shadow: 0 0 8px #4c6fff; }
  #fuelbar { width: clamp(80px, 22vw, 160px); height: 12px; border: 2px solid #9fb0ff; border-radius: 8px; overflow: hidden; }
  #fuel { height: 100%; width: 100%; background: linear-gradient(90deg, #ffb703, #ffe066); }
  #hud button { pointer-events: auto; margin-left: auto; font: inherit; font-size: 15px; color: #eef1ff; background: rgba(120,140,255,.2);
    border: 2px solid #9fb0ff; border-radius: 10px; padding: 3px 10px; cursor: pointer; }
  .pad { position: fixed; bottom: 14px; width: 74px; height: 74px; border-radius: 50%; border: 3px solid #9fb0ff;
    background: rgba(120,140,255,.18); color: #fff; font-size: 30px; display: grid; place-items: center; cursor: pointer; }
  .pad.on { background: rgba(255,200,80,.45); border-color: #ffe066; }
  #tl { left: 14px; } #tr { left: 100px; } #th { right: 14px; width: 96px; height: 96px; font-size: 22px; font-weight: 700; }
  .screen { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
    padding: 20px; text-align: center; background: rgba(7, 11, 31, .82); }
  .screen h1 { margin: 0; font-size: clamp(36px, 10vw, 68px); background: linear-gradient(90deg, #ffe066, #ff8fab, #8fd3ff);
    -webkit-background-clip: text; background-clip: text; color: transparent; }
  .screen p { margin: 0; max-width: 460px; line-height: 1.45; font-size: clamp(15px, 4vw, 18px); }
  .screen kbd { background: #1d2550; border: 1px solid #5b6bd6; border-radius: 5px; padding: 0 6px; }
  .big { font: inherit; font-weight: 800; font-size: 24px; padding: 14px 40px; border-radius: 40px; border: 0; cursor: pointer;
    color: #1b1b3a; background: linear-gradient(90deg, #ffe066, #ff8fab); box-shadow: 0 0 24px #ff8fab88; }
  .hide { display: none !important; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
  <span id="level">Level 1</span><span id="lives"></span><span id="score">Score 0</span>
  <span>Fuel</span><div id="fuelbar"><div id="fuel"></div></div>
  <button id="restart">↺ Level</button><button id="mute" aria-label="Sound on or off">🔊</button>
</div>
<button class="pad" id="tl" aria-label="Turn left">⟲</button>
<button class="pad" id="tr" aria-label="Turn right">⟳</button>
<button class="pad" id="th" aria-label="Thrust">BOOST</button>

<div class="screen" id="start">
  <h1>Comet Courier</h1>
  <p>Fly your rocket to the glowing delivery ring. Planets pull you in with gravity, so use it to swing around them. Grab stars for points and fuel.</p>
  <p>Turn with <kbd>←</kbd> <kbd>→</kbd>, boost with <kbd>↑</kbd> or <kbd>Space</kbd>, or use the buttons. Restart a level with <kbd>R</kbd>.</p>
  <button class="big" id="go">Launch</button>
</div>
<div class="screen hide" id="msg"><h1 id="msgTitle"></h1><p id="msgText"></p><button class="big" id="msgBtn"></button></div>

<script>
/* =========================================================
   1. SETTINGS — try changing these numbers!
   ========================================================= */
const CONFIG = {
  turnSpeed: 3.2,     // how fast the rocket turns (radians per second)
  thrust: 0.9,        // how hard the boost pushes
  gravity: 0.045,     // how strongly planets pull (bigger = harder)
  maxSpeed: 0.9,      // speed limit
  fuelUse: 0.16,      // fuel used per second of boosting (1 = a full tank)
  starFuel: 0.25,     // fuel a star gives back
  lives: 3,
  rocketSize: 0.075   // rocket picture size, as a share of the screen
};

const ROCKET_TILT = Math.PI / 4; // turns the picture so its nose matches the flying direction

/* =========================================================
   4. GAME STATE
   ========================================================= */
const cvs = document.getElementById("game"), ctx = cvs.getContext("2d");
let W, H, S;                 // screen width, height, and the "unit" size (smaller side)
let level = 0, lives = CONFIG.lives, score = 0, state = "start";
let ship, planets, goal, stars, fuel, trail = [], boom = 0, t = 0;
const sky = Array.from({ length: 160 }, () => ({ x: Math.random(), y: Math.random(), s: Math.random() * 1.6 + 0.3, tw: Math.random() * 6 }));

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight; S = Math.min(W, H);
  cvs.width = W * dpr; cvs.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
addEventListener("resize", () => { resize(); if (state !== "start") loadLevel(level, true); });
resize();

// Level positions are 0..1 across the screen; physics uses "units" where 1 = the smaller screen side.
const ux = x => x * W / S, uy = y => y * H / S;

function loadLevel(n, keepShip = false) {
  const L = LEVELS[n];
  planets = L.planets.map(p => ({ ...p, x: ux(p.x), y: uy(p.y) }));
  goal = { x: ux(L.goal[0]), y: uy(L.goal[1]), r: 0.07 };
  if (!keepShip) {
    stars = L.stars.map(s => ({ x: ux(s[0]), y: uy(s[1]), got: false }));
    ship = { x: ux(L.start[0]), y: uy(L.start[1]), vx: 0, vy: 0, a: -Math.PI / 2 };
    fuel = 1; trail = [];
  }
  updateHud();
}

/* =========================================================
   5. SOUND — soft Web Audio sounds, no buzzers
   ========================================================= */
let ac = null, muted = false, hum = null;
function tone(f1, f2, dur, vol, delay = 0, type = "sine") {
  if (!ac || muted) return;
  const t0 = ac.currentTime + delay, o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(f1, t0); o.frequency.exponentialRampToValueAtTime(f2, t0 + dur);
  g.gain.setValueAtTime(0.0001, t0); g.gain.linearRampToValueAtTime(vol, t0 + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(ac.destination); o.start(t0); o.stop(t0 + dur + 0.05);
}
const sfx = {
  star:    () => { tone(988, 988, 0.12, 0.08, 0, "triangle"); tone(1480, 1480, 0.2, 0.07, 0.08, "triangle"); },
  deliver: () => [523, 659, 784, 1047].forEach((f, i) => tone(f, f, 0.22, 0.08, i * 0.1, "triangle")),
  crash:   () => tone(300, 220, 0.3, 0.06),                     // soft, short mistake tone
  win:     () => [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, f, 0.3, 0.08, i * 0.12, "triangle"))
};
function setHum(on) { // gentle engine hum while boosting
  if (!ac) return;
  if (!hum) {
    const o = ac.createOscillator(), f = ac.createBiquadFilter(), g = ac.createGain();
    o.type = "triangle"; o.frequency.value = 70; f.type = "lowpass"; f.frequency.value = 300; g.gain.value = 0;
    o.connect(f); f.connect(g); g.connect(ac.destination); o.start(); hum = g;
  }
  hum.gain.setTargetAtTime(on && !muted ? 0.05 : 0, ac.currentTime, 0.05);
}

/* =========================================================
   6. CONTROLS — keyboard and on-screen buttons
   ========================================================= */
const keys = { left: false, right: false, thrust: false };
const KEYMAP = { ArrowLeft: "left", a: "left", ArrowRight: "right", d: "right", ArrowUp: "thrust", w: "thrust", " ": "thrust" };
addEventListener("keydown", e => {
  if (KEYMAP[e.key]) { keys[KEYMAP[e.key]] = true; e.preventDefault(); }
  if ((e.key === "r" || e.key === "R") && state === "play") loadLevel(level);
});
addEventListener("keyup", e => { if (KEYMAP[e.key]) keys[KEYMAP[e.key]] = false; });
for (const [id, k] of [["tl", "left"], ["tr", "right"], ["th", "thrust"]]) {
  const b = document.getElementById(id);
  const on = e => { e.preventDefault(); keys[k] = true; b.classList.add("on"); };
  const off = () => { keys[k] = false; b.classList.remove("on"); };
  b.addEventListener("pointerdown", on); b.addEventListener("pointerup", off);
  b.addEventListener("pointerleave", off); b.addEventListener("pointercancel", off);
}
document.getElementById("restart").onclick = () => { if (state === "play") loadLevel(level); };
document.getElementById("mute").onclick = e => { muted = !muted; e.target.textContent = muted ? "🔇" : "🔊"; setHum(false); };
document.getElementById("go").onclick = () => {
  try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); ac.resume(); } catch (err) { ac = null; }
  level = 0; lives = CONFIG.lives; score = 0; loadLevel(0); state = "play";
  document.getElementById("start").classList.add("hide");
};

function showMsg(title, text, btn, next) {
  state = "msg"; setHum(false);
  document.getElementById("msgTitle").textContent = title;
  document.getElementById("msgText").textContent = text;
  const b = document.getElementById("msgBtn"); b.textContent = btn;
  b.onclick = () => { document.getElementById("msg").classList.add("hide"); next(); };
  document.getElementById("msg").classList.remove("hide");
}

function updateHud() {
  document.getElementById("level").textContent = `Level ${level + 1}: ${LEVELS[level].name}`;
  document.getElementById("lives").textContent = "🚀".repeat(Math.max(0, lives));
  document.getElementById("score").textContent = "Score " + score;
  document.getElementById("fuel").style.width = Math.round(fuel * 100) + "%";
}

/* =========================================================
   7. PHYSICS — runs every frame
   ========================================================= */
function update(dt) {
  if (keys.left) ship.a -= CONFIG.turnSpeed * dt;
  if (keys.right) ship.a += CONFIG.turnSpeed * dt;
  const boosting = keys.thrust && fuel > 0;
  setHum(boosting);
  if (boosting) {
    ship.vx += Math.cos(ship.a) * CONFIG.thrust * dt;
    ship.vy += Math.sin(ship.a) * CONFIG.thrust * dt;
    fuel = Math.max(0, fuel - CONFIG.fuelUse * dt);
  }
  // gravity: each planet pulls the ship toward its center (pull gets weaker with distance squared)
  for (const p of planets) {
    const dx = p.x - ship.x, dy = p.y - ship.y, d2 = Math.max(dx * dx + dy * dy, 0.004), d = Math.sqrt(d2);
    const pull = CONFIG.gravity * p.m / d2;
    ship.vx += dx / d * pull * dt; ship.vy += dy / d * pull * dt;
    if (d < p.r + 0.022) return crash();
  }
  // speed limit, then move
  const sp = Math.hypot(ship.vx, ship.vy);
  if (sp > CONFIG.maxSpeed) { ship.vx *= CONFIG.maxSpeed / sp; ship.vy *= CONFIG.maxSpeed / sp; }
  ship.x += ship.vx * dt; ship.y += ship.vy * dt;
  // soft bounce off the screen edges
  const maxX = W / S, maxY = H / S;
  if (ship.x < 0.02 || ship.x > maxX - 0.02) { ship.vx *= -0.6; ship.x = Math.min(Math.max(ship.x, 0.02), maxX - 0.02); }
  if (ship.y < 0.02 || ship.y > maxY - 0.02) { ship.vy *= -0.6; ship.y = Math.min(Math.max(ship.y, 0.02), maxY - 0.02); }
  // stars
  for (const s of stars) if (!s.got && Math.hypot(s.x - ship.x, s.y - ship.y) < 0.05) {
    s.got = true; score += 10; fuel = Math.min(1, fuel + CONFIG.starFuel); sfx.star();
  }
  // delivered?
  if (Math.hypot(goal.x - ship.x, goal.y - ship.y) < goal.r) return deliver();
  trail.push({ x: ship.x, y: ship.y }); if (trail.length > 60) trail.shift();
  updateHud();
}

function crash() {
  sfx.crash(); lives--; boom = 0.6; updateHud();
  if (lives <= 0) return showMsg("Out of rockets", `You scored ${score}. Every courier crashes on the way to greatness.`, "Try again",
    () => { level = 0; lives = CONFIG.lives; score = 0; loadLevel(0); state = "play"; });
  loadLevel(level); // same level, fresh tank
}

function deliver() {
  const bonus = Math.round(fuel * 50);
  score += 50 + bonus; sfx.deliver(); updateHud();
  if (level === LEVELS.length - 1) {
    sfx.win();
    return showMsg("All delivered!", `Every package made it. Final score: ${score}.`, "Play again",
      () => { level = 0; lives = CONFIG.lives; score = 0; loadLevel(0); state = "play"; });
  }
  showMsg("Delivered!", `+50 for the delivery and +${bonus} for fuel left. Next: ${LEVELS[level + 1].name}.`, "Next level",
    () => { level++; loadLevel(level); state = "play"; });
}

/* =========================================================
   8. DRAWING
   ========================================================= */
function glow(x, y, r, color) { // a soft glowing circle
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, color); g.addColorStop(1, "transparent");
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
}

function draw() {
  ctx.fillStyle = "#070b1f"; ctx.fillRect(0, 0, W, H);
  glow(W * 0.8, H * 0.2, S * 0.6, "rgba(120,80,255,.18)"); glow(W * 0.15, H * 0.85, S * 0.5, "rgba(255,90,160,.12)");
  for (const s of sky) { ctx.fillStyle = `rgba(255,255,255,${0.4 + 0.4 * Math.sin(t * 2 + s.tw)})`; ctx.fillRect(s.x * W, s.y * H, s.s, s.s); }
  if (state === "start") return;

  // goal ring pulses
  const gx = goal.x * S, gy = goal.y * S, gr = goal.r * S;
  glow(gx, gy, gr * 2, "rgba(120,255,200,.35)");
  ctx.strokeStyle = "#8affd0"; ctx.lineWidth = 4; ctx.setLineDash([10, 8]); ctx.lineDashOffset = -t * 30;
  ctx.beginPath(); ctx.arc(gx, gy, gr * (1 + 0.06 * Math.sin(t * 4)), 0, 7); ctx.stroke(); ctx.setLineDash([]);
  ctx.fillStyle = "#8affd0"; ctx.font = `bold ${Math.round(S * 0.028)}px system-ui`; ctx.textAlign = "center"; ctx.fillText("DELIVER", gx, gy + 5);

  // planets with a glow and a shaded side
  for (const p of planets) {
    const x = p.x * S, y = p.y * S, r = p.r * S;
    glow(x, y, r * 2.2, p.color + "40");
    const g = ctx.createRadialGradient(x - r * 0.4, y - r * 0.4, r * 0.1, x, y, r);
    g.addColorStop(0, "#ffffff"); g.addColorStop(0.25, p.color); g.addColorStop(1, "#1a1440");
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
  }
  // stars to collect
  for (const s of stars) if (!s.got) {
    const x = s.x * S, y = s.y * S; glow(x, y, S * 0.04, "rgba(255,230,120,.6)");
    ctx.font = `${Math.round(S * 0.04)}px serif`; ctx.fillText("⭐", x, y + S * 0.014);
  }
  // the ship's dotted trail, then the ship
  ctx.fillStyle = "rgba(255,200,120,.5)";
  trail.forEach((p, i) => { if (i % 3 === 0) ctx.fillRect(p.x * S - 1, p.y * S - 1, 2, 2); });
  const x = ship.x * S, y = ship.y * S, size = S * CONFIG.rocketSize;
  if (keys.thrust && fuel > 0) glow(x - Math.cos(ship.a) * size * 0.55, y - Math.sin(ship.a) * size * 0.55, size * 0.6, "rgba(255,170,60,.8)");
  ctx.save(); ctx.translate(x, y); ctx.rotate(ship.a + ROCKET_TILT);
  ctx.drawImage(rocketImg, -size / 2, -size / 2, size, size); ctx.restore();
  if (boom > 0) { glow(x, y, S * 0.12 * (1 - boom), `rgba(255,180,90,${boom})`); }
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.033, (now - last) / 1000); last = now; t += dt; boom = Math.max(0, boom - dt);
  if (state === "play") update(dt);
  draw(); requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
