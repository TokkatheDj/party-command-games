<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Reef Rescue</title>
<!-- Reef Rescue: a catch game made with the Amigo App Builder's Basic rules.
     Sea creature art: Adobe Stock #478346529 "Underwater animal and fishes isolated objects set.",
     licensed 23 Nov 2026 and turned into vector shapes with Adobe's Vectorize tool. -->
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b4a6f;
    font-family: "Trebuchet MS", system-ui, sans-serif; color: #fff; user-select: none; -webkit-user-select: none; touch-action: none; }
  canvas { display: block; width: 100vw; height: 100vh; }
  /* top bar: score, hearts, mute */
  #hud { position: fixed; top: 8px; left: 10px; right: 10px; display: flex; justify-content: space-between; align-items: center;
    font-size: clamp(18px, 4.5vw, 26px); font-weight: bold; text-shadow: 0 2px 0 #06324c; pointer-events: none; }
  #mute { pointer-events: auto; font-size: 22px; background: rgba(255,255,255,.2); border: 2px solid #fff; border-radius: 12px; color: #fff; padding: 2px 10px; cursor: pointer; }
  /* big on-screen arrow buttons */
  .pad { position: fixed; bottom: 14px; width: 84px; height: 84px; border-radius: 50%; border: 3px solid #fff;
    background: rgba(255,255,255,.22); color: #fff; font-size: 38px; display: grid; place-items: center; cursor: pointer; }
  #left { left: 14px; } #right { right: 14px; }
  .pad:active, .pad.on { background: rgba(255,255,255,.45); }
  /* start and game-over screens */
  .screen { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    padding: 20px; text-align: center; background: rgba(4, 45, 70, .78); }
  .screen h1 { margin: 0; font-size: clamp(40px, 11vw, 76px); color: #ffe066; text-shadow: 0 5px 0 #e8590c; letter-spacing: 1px; }
  .screen p { margin: 0; max-width: 420px; font-size: clamp(17px, 4.4vw, 21px); line-height: 1.4; }
  .big { font: inherit; font-weight: bold; font-size: 28px; padding: 16px 46px; border-radius: 40px; border: 4px solid #fff;
    background: #ff8fab; color: #fff; cursor: pointer; box-shadow: 0 6px 0 #c9184a; }
  .big:active { transform: translateY(4px); box-shadow: 0 2px 0 #c9184a; }
  .hide { display: none !important; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud"><span id="score">Score 0</span><span id="hearts"></span><button id="mute" aria-label="Sound on or off">🔊</button></div>
<button class="pad" id="left" aria-label="Move left">◀</button>
<button class="pad" id="right" aria-label="Move right">▶</button>

<div class="screen" id="start">
  <h1>Reef Rescue</h1>
  <p>Move the sea turtle with ◀ ▶ (or the arrow keys) to catch fish, starfish and shells, and stay away from jellyfish and pufferfish!</p>
  <button class="big" id="go">Start</button>
</div>
<div class="screen hide" id="over">
  <h1>Great swim!</h1>
  <p id="final"></p>
  <button class="big" id="again">Play again</button>
</div>

];
const BAD = ["jelly", "puffer"]; // touching these costs a life
const LIVES = 3;
const START_SPEED = 140;  // how fast things fall at the start (pixels per second)
const SPEED_UP = 6;       // extra speed for every point you score
const BAD_CHANCE = 0.3;   // 30% of falling things are bad

// ===== Setup =====
const cvs = document.getElementById("game"), ctx = cvs.getContext("2d");
let W, H, size;
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cvs.width = W * dpr; cvs.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  size = Math.max(54, Math.min(W * 0.13, 92)); // sprite size fits phones and big screens
}
window.addEventListener("resize", resize); resize();

let state = "start", score = 0, best = 0, lives = LIVES, items = [], spawnT = 0, hurtT = 0, t = 0;
const turtle = { x: 0, dir: 1, speed: 0 };
const bubbles = Array.from({ length: 26 }, () => ({ x: Math.random(), y: Math.random(), r: 2 + Math.random() * 6, v: 0.03 + Math.random() * 0.06 }));
const pops = []; // little "+1" texts

// ===== Sound (soft Web Audio tones, started after the Start tap) =====
let ac = null, muted = false;
function tone(f1, f2, dur, vol, delay = 0) {
  if (!ac || muted) return;
  const t0 = ac.currentTime + delay, o = ac.createOscillator(), g = ac.createGain();
  o.type = "sine"; o.frequency.setValueAtTime(f1, t0); o.frequency.exponentialRampToValueAtTime(f2, t0 + dur);
  g.gain.setValueAtTime(0.0001, t0); g.gain.linearRampToValueAtTime(vol, t0 + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(ac.destination); o.start(t0); o.stop(t0 + dur + 0.05);
}
const sfx = {
  catch: () => tone(500, 900, 0.14, 0.12),                                   // bubbly "bloop" up
  shell: () => { tone(880, 880, 0.18, 0.1); tone(1320, 1320, 0.25, 0.1, 0.1); }, // sparkly chime
  ouch:  () => tone(330, 250, 0.25, 0.06),                                   // soft, short mistake tone (no buzzer)
  over:  () => [392, 330, 262].forEach((f, i) => tone(f, f, 0.3, 0.06, i * 0.18))
};

// ===== Controls: arrow keys, A/D, on-screen buttons, or drag =====
const held = { left: false, right: false };
let dragX = null;
addEventListener("keydown", e => {
  if (e.key === "ArrowLeft" || e.key === "a") held.left = true;
  if (e.key === "ArrowRight" || e.key === "d") held.right = true;
  if ((e.key === " " || e.key === "Enter") && state !== "play") startGame();
});
addEventListener("keyup", e => {
  if (e.key === "ArrowLeft" || e.key === "a") held.left = false;
  if (e.key === "ArrowRight" || e.key === "d") held.right = false;
});
for (const side of ["left", "right"]) {
  const b = document.getElementById(side);
  const on = e => { e.preventDefault(); held[side] = true; b.classList.add("on"); };
  const off = () => { held[side] = false; b.classList.remove("on"); };
  b.addEventListener("pointerdown", on); b.addEventListener("pointerup", off);
  b.addEventListener("pointerleave", off); b.addEventListener("pointercancel", off);
}
cvs.addEventListener("pointerdown", e => { dragX = e.clientX; });
cvs.addEventListener("pointermove", e => { if (dragX !== null) dragX = e.clientX; });
addEventListener("pointerup", () => { dragX = null; });
document.getElementById("mute").onclick = () => { muted = !muted; document.getElementById("mute").textContent = muted ? "🔇" : "🔊"; };
document.getElementById("go").onclick = startGame;
document.getElementById("again").onclick = startGame;

function startGame() {
  if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { ac = null; } }
  if (ac && ac.state === "suspended") ac.resume();
  score = 0; lives = LIVES; items = []; spawnT = 0.6; hurtT = 0; turtle.x = W / 2;
  state = "play";
  document.getElementById("start").classList.add("hide");
  document.getElementById("over").classList.add("hide");
  updateHud(); tone(520, 780, 0.18, 0.1);
}

function endGame() {
  state = "over"; best = Math.max(best, score); sfx.over();
  document.getElementById("final").textContent = `You rescued ${score} point${score === 1 ? "" : "s"} of sea friends! Best this session: ${best}.`;
  document.getElementById("over").classList.remove("hide");
}

function updateHud() {
  document.getElementById("score").textContent = "Score " + score;
  document.getElementById("hearts").textContent = "💚".repeat(lives) + "🤍".repeat(LIVES - lives);
}

// ===== Falling things =====
function spawn() {
  const bad = Math.random() < BAD_CHANCE;
  let kind;
  if (bad) kind = { sprite: BAD[Math.floor(Math.random() * BAD.length)], bad: true };
  else {
    const pick = Math.random() < 0.08 ? GOOD[GOOD.length - 1] : GOOD[Math.floor(Math.random() * (GOOD.length - 1))];
    kind = { sprite: pick.sprite, points: pick.points, bad: false };
  }
  const s = size * (bad ? 0.95 : 0.8);
  items.push({ ...kind, s, x: s / 2 + Math.random() * (W - s), y: -s, wob: Math.random() * 6 });
}

// ===== Main loop =====
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now; t += dt;
  if (state === "play") update(dt);
  draw();
  requestAnimationFrame(loop);
}

function update(dt) {
  // move the turtle
  const move = (held.right ? 1 : 0) - (held.left ? 1 : 0);
  if (move) { turtle.x += move * W * 0.75 * dt; turtle.dir = move; }
  if (dragX !== null) { const d = dragX - turtle.x; turtle.x += d * Math.min(1, dt * 12); if (Math.abs(d) > 2) turtle.dir = Math.sign(d); }
  turtle.x = Math.max(size * 0.7, Math.min(W - size * 0.7, turtle.x));

  // spawn new things faster as the score goes up
  spawnT -= dt;
  if (spawnT <= 0) { spawn(); spawnT = Math.max(0.35, 1.0 - score * 0.012); }

  const ty = H - size * 1.9, speed = START_SPEED + score * SPEED_UP;
  for (const it of items) {
    it.y += speed * dt;
    // caught? (circle check between the turtle and the falling thing)
    if (!it.done && Math.hypot(it.x - turtle.x, it.y - ty) < size * 0.62) {
      it.done = true;
      if (it.bad) {
        lives--; hurtT = 1; sfx.ouch(); updateHud();
        if (lives <= 0) { endGame(); return; }
      } else {
        score += it.points; it.points > 1 ? sfx.shell() : sfx.catch(); updateHud();
        pops.push({ x: it.x, y: it.y, text: "+" + it.points, life: 0.8 });
      }
    }
  }
  items = items.filter(it => !it.done && it.y < H + it.s);
  hurtT = Math.max(0, hurtT - dt);
}

// ===== Drawing =====
function drawSprite(name, x, y, w, flip = 1, angle = 0, alpha = 1) {
  const [, , sw, sh] = SPRITES[name], h = w * sh / sw;
  ctx.save(); ctx.globalAlpha = alpha; ctx.translate(x, y); ctx.rotate(angle); ctx.scale(flip, 1);
  if (img[name].complete) ctx.drawImage(img[name], -w / 2, -h / 2, w, h);
  ctx.restore();
}

function draw() {
  // water: light at the top, deep at the bottom
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, "#5fc8e8"); g.addColorStop(0.55, "#1b84b5"); g.addColorStop(1, "#0b4a6f");
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // sun rays
  ctx.fillStyle = "rgba(255,255,255,.06)";
  for (let i = 0; i < 5; i++) {
    const x = ((i * 0.23 + t * 0.01) % 1.2) * W;
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x + W * 0.08, 0); ctx.lineTo(x - W * 0.1, H); ctx.lineTo(x - W * 0.2, H); ctx.fill();
  }
  // rising bubbles
  ctx.strokeStyle = "rgba(255,255,255,.45)"; ctx.lineWidth = 2;
  for (const b of bubbles) {
    b.y -= b.v * 0.016; if (b.y < -0.05) { b.y = 1.05; b.x = Math.random(); }
    ctx.beginPath(); ctx.arc(b.x * W + Math.sin(t + b.r) * 6, b.y * H, b.r, 0, 7); ctx.stroke();
  }
  // sandy sea floor with coral and seaweed
  ctx.fillStyle = "#f2d49b"; ctx.beginPath(); ctx.moveTo(0, H - size * 0.9);
  for (let x = 0; x <= W; x += 40) ctx.lineTo(x, H - size * 0.9 + Math.sin(x * 0.02) * 8);
  ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.fill();
  drawSprite("coral", W * 0.12, H - size * 1.05, size * 1.2, 1, Math.sin(t) * 0.03);
  drawSprite("seaweed", W * 0.88, H - size * 1.1, size * 0.9, 1, Math.sin(t * 1.3) * 0.06);
  drawSprite("seaweed", W * 0.55, H - size * 0.95, size * 0.6, -1, Math.sin(t * 1.1) * 0.06);

  // falling things wobble as they sink
  for (const it of items) drawSprite(it.sprite, it.x, it.y, it.s, 1, Math.sin(t * 3 + it.wob) * 0.18);

  // the turtle (blinks after a bump)
  const blink = hurtT > 0 && Math.floor(hurtT * 10) % 2 === 0;
  if (state !== "start") drawSprite("turtle", turtle.x, H - size * 1.9, size * 1.5, turtle.dir, Math.sin(t * 4) * 0.05, blink ? 0.35 : 1);

  // "+1" texts float up and fade
  ctx.font = `bold ${Math.round(size * 0.4)}px Trebuchet MS, sans-serif`; ctx.textAlign = "center";
  for (const p of pops) {
    p.life -= 0.016; p.y -= 1.2;
    ctx.fillStyle = `rgba(255,236,120,${Math.max(0, p.life)})`; ctx.fillText(p.text, p.x, p.y);
  }
  while (pops.length && pops[0].life <= 0) pops.shift();
}

updateHud();
requestAnimationFrame(loop);
</script>
</body>
</html>
