<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Robo-Beat Galaxy</title>
<style>
  /* Palette anchored on hue 164 (teal-green): deep space, teal glow, mint, coral accent, gold */
  :root{
    --bg1:#04161a; --bg2:#062a2c; --teal:#19e6b4; --mint:#b8ffe9; --coral:#ff6f91; --gold:#ffd86b; --panel:#0b3a3a;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:var(--bg1);font-family:"Trebuchet MS",sans-serif;color:var(--mint)}
  /* Parallax star layers drifting at different speeds */
  .layer{position:fixed;inset:0;pointer-events:none;background-repeat:repeat}
  #l1{background-image:radial-gradient(1px 1px at 20px 30px,#fff,transparent),radial-gradient(1px 1px at 90px 80px,#b8ffe9,transparent),radial-gradient(1px 1px at 150px 20px,#fff,transparent);background-size:180px 120px;animation:drift 120s linear infinite;opacity:.6}
  #l2{background-image:radial-gradient(2px 2px at 40px 60px,#fff,transparent),radial-gradient(2px 2px at 130px 110px,#ffd86b,transparent);background-size:260px 200px;animation:drift 70s linear infinite;opacity:.8}
  #l3{background-image:radial-gradient(3px 3px at 80px 40px,#19e6b4,transparent),radial-gradient(2px 2px at 200px 150px,#fff,transparent);background-size:380px 280px;animation:drift 40s linear infinite}
  @keyframes drift{to{background-position:-1000px 600px}}
  .planet{position:fixed;border-radius:50%;pointer-events:none;animation:float 9s ease-in-out infinite}
  #p1{width:120px;height:120px;right:-30px;top:12%;background:radial-gradient(circle at 30% 30%,#7bffd8,#0a8f72 60%,#04332b);box-shadow:0 0 40px #19e6b466}
  #p2{width:70px;height:70px;left:-20px;bottom:22%;background:radial-gradient(circle at 30% 30%,#ffb3c6,#d94a73 65%,#5a1630);box-shadow:0 0 30px #ff6f9155;animation-delay:-4s}
  @keyframes float{50%{transform:translateY(-16px)}}
  #app{position:relative;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px;gap:10px}
  h1{font-size:clamp(26px,6vw,44px);color:var(--teal);text-shadow:0 0 18px #19e6b4aa;text-align:center;letter-spacing:1px}
  .amigo{width:90px;height:90px}
  .idle{animation:idle 1.6s ease-in-out infinite}
  @keyframes idle{50%{transform:translateY(-10px) rotate(4deg)}}
  .card{background:#0b3a3acc;border:3px solid var(--teal);border-radius:28px;padding:18px 22px;text-align:center;max-width:420px;box-shadow:0 0 30px #19e6b455}
  button{font-family:inherit;font-weight:bold;cursor:pointer;border:none;border-radius:999px;color:#04161a;background:var(--teal);box-shadow:0 5px 0 #0a8f72,0 0 20px #19e6b488;transition:transform .08s}
  button:active{transform:translateY(4px);box-shadow:0 1px 0 #0a8f72}
  .big{font-size:26px;padding:14px 44px;margin-top:14px}
  #game{display:none;width:100%;max-width:640px;flex-direction:column;gap:10px;align-items:center}
  #seq{display:grid;grid-template-columns:auto repeat(8,1fr);gap:6px;width:100%;background:#0b3a3acc;border:3px solid var(--teal);border-radius:24px;padding:10px;box-shadow:0 0 30px #19e6b444}
  .lab{display:flex;align-items:center;justify-content:center;font-size:clamp(18px,4vw,26px);width:clamp(34px,8vw,48px)}
  .step{aspect-ratio:1;border-radius:50%;border:2px solid #19e6b455;background:#06262a;cursor:pointer;position:relative;transition:transform .08s}
  .step.on{background:radial-gradient(circle at 35% 30%,#fff,var(--c) 55%);box-shadow:0 0 14px var(--c);border-color:#fff}
  .step.beat{outline:3px solid var(--gold);outline-offset:1px}
  .step.hit{transform:scale(1.25)}
  .step:nth-child(8n+2),.step:nth-child(8n+6){border-color:#19e6b4aa}
  #bar{display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap;background:#0b3a3acc;border:3px solid var(--teal);border-radius:999px;padding:10px 18px;width:100%}
  #play{font-size:20px;padding:10px 26px}
  #clear{font-size:16px;padding:8px 18px;background:var(--coral);box-shadow:0 5px 0 #a3294a}
  #tempoWrap{display:flex;align-items:center;gap:8px;font-weight:bold}
  input[type=range]{accent-color:var(--teal);width:130px;height:28px}
  #msg{min-height:24px;font-weight:bold;color:var(--gold);text-align:center}
  #combo{position:fixed;left:50%;top:14px;transform:translateX(-50%);font-size:20px;font-weight:bold;color:var(--gold);text-shadow:0 0 10px #ffd86b99;pointer-events:none}
  .robo{width:44px;height:44px}
</style>
</head>
<body><!--amigo:start--><svg aria-hidden="true" focusable="false" style="position:absolute;width:0;height:0;overflow:hidden"><defs><symbol id="amigo" viewBox="0 0 512 512"><defs><linearGradient id="amigo-face" gradientUnits="userSpaceOnUse" x1="0" y1="90" x2="0" y2="452"><stop offset="0" stop-color="#EEF1F6"/><stop offset="1" stop-color="#B8C0CC"/></linearGradient><radialGradient id="amigo-iris" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#6FA6FF"/><stop offset="1" stop-color="#2F6FE0"/></radialGradient></defs><circle cx="256" cy="256" r="256" fill="#111318"/><circle cx="256" cy="256" r="241.5" fill="none" stroke="#3A84FF" stroke-width="11"/><g fill="url(#amigo-face)"><ellipse cx="256" cy="298" rx="168" ry="126"/><circle cx="154" cy="172" r="78"/><circle cx="358" cy="172" r="78"/></g><g fill="#121E46"><circle cx="154" cy="172" r="65"/><circle cx="358" cy="172" r="65"/></g><g fill="url(#amigo-iris)"><circle cx="154" cy="172" r="54"/><circle cx="358" cy="172" r="54"/></g><g fill="#121E46"><circle cx="154" cy="172" r="41"/><circle cx="358" cy="172" r="41"/></g><g fill="#fff"><circle cx="136" cy="156" r="13"/><circle cx="340" cy="156" r="13"/><circle cx="170" cy="190" r="5"/><circle cx="374" cy="190" r="5"/></g><g fill="#121E46"><circle cx="226" cy="286" r="7"/><circle cx="286" cy="286" r="7"/><circle cx="130" cy="310" r="7"/><circle cx="382" cy="310" r="7"/></g><path d="M178 334 Q256 382 334 334" fill="none" stroke="#121E46" stroke-width="13" stroke-linecap="round"/></symbol></defs></svg><!--amigo:end-->
<div class="layer" id="l1"></div><div class="layer" id="l2"></div><div class="layer" id="l3"></div>
<div class="planet" id="p1"></div><div class="planet" id="p2"></div>
<div id="combo"></div>

<div id="app">
  <!-- Title screen: Amigo idles while instructions show -->
  <div id="start">
    <h1>🤖 Robo-Beat Galaxy 🪐</h1>
    <div style="text-align:center"><svg class="amigo idle" viewBox="0 0 512 512" role="img" aria-label="Amigo"><use href="#amigo"/></svg></div>
    <div class="card">
      <p>Tap the glowing dots to program the robot band's drums, then press Play to hear your beat!</p>
      <button class="big" id="startBtn">Start</button>
    </div>
  </div>

  <!-- Sequencer -->
  <div id="game">
    <h1>Robo-Beat Galaxy</h1>
    <div id="msg">Tap dots to build a beat!</div>
    <div id="seq"></div>
    <div id="bar">
      <button id="play">▶ Play</button>
      <div id="tempoWrap">🐢<input type="range" id="tempo" min="60" max="180" value="110" aria-label="Tempo">🐇 <span id="bpm">110</span></div>
      <button id="clear">Clear</button>
    </div>
  </div>
</div>

<script>
// 4 tracks: each is a robot-band instrument with a color, an emoji label and a sound.
// Piano/xylophone-style notes use Amigo.play; the kick is a soft drum for rhythm.
var TRACKS = [
  {name:'Bass Bot',  icon:'🤖', color:'#19e6b4', play:function(){Amigo.play('piano','C3',0.6,0.9);}},
  {name:'Piano Bot', icon:'🎹', color:'#ffd86b', play:function(){Amigo.play('piano','E4',0.5,0.8);}},
  {name:'Xylo Bot',  icon:'🔔', color:'#ff6f91', play:function(){Amigo.play('marimba','G4',0.4,0.9);}},
  {name:'Chime Bot', icon:'✨', color:'#9bd7ff', play:function(){Amigo.play('bell','C5',0.6,0.7);}}
];
var STEPS = 8;
var grid = TRACKS.map(function(){ return new Array(STEPS).fill(false); });
var playing = false, cur = -1, timer = null, combo = 0;

var seq = document.getElementById('seq');
var cells = []; // cells[track][step] = element

// Build the grid: one icon label then 8 step buttons per row
TRACKS.forEach(function(t, r){
  var lab = document.createElement('div');
  lab.className = 'lab'; lab.textContent = t.icon; lab.title = t.name;
  seq.appendChild(lab);
  cells[r] = [];
  for (var c = 0; c < STEPS; c++){
    var b = document.createElement('div');
    b.className = 'step'; b.style.setProperty('--c', t.color);
    b.setAttribute('role','button'); b.setAttribute('aria-label', t.name + ' step ' + (c+1));
    b.dataset.r = r; b.dataset.c = c;
    b.addEventListener('pointerdown', toggle);
    seq.appendChild(b); cells[r][c] = b;
  }
});

// Toggle a step on/off and preview the sound when switching on
function toggle(e){
  e.preventDefault();
  var r = +this.dataset.r, c = +this.dataset.c;
  grid[r][c] = !grid[r][c];
  this.classList.toggle('on', grid[r][c]);
  if (grid[r][c]){ TRACKS[r].play(); Amigo.sfx('pop'); } else { Amigo.sfx('click'); }
  setMsg(countOn() + ' notes programmed');
}
function countOn(){ return grid.reduce(function(a,row){ return a + row.filter(Boolean).length; }, 0); }
function setMsg(t){ document.getElementById('msg').textContent = t; }

// Advance one step: highlight column, play active tracks
function tick(){
  if (cur >= 0) for (var r = 0; r < TRACKS.length; r++) cells[r][cur].classList.remove('beat');
  cur = (cur + 1) % STEPS;
  var hits = 0;
  for (var r2 = 0; r2 < TRACKS.length; r2++){
    var el = cells[r2][cur]; el.classList.add('beat');
    if (grid[r2][cur]){
      TRACKS[r2].play(); hits++;
      el.classList.add('hit'); (function(x){ setTimeout(function(){ x.classList.remove('hit'); }, 110); })(el);
    }
  }
  // Streak counter: consecutive steps with a note raise a combo with a rising chime
  if (hits){ combo++; if (combo % 4 === 0) Amigo.sfx('sparkle'); } else combo = 0;
  document.getElementById('combo').textContent = combo > 2 ? '🔥 Combo x' + combo : '';
}

// (Re)start the interval using the current tempo (steps are eighth notes)
function schedule(){
  clearInterval(timer);
  var bpm = +document.getElementById('tempo').value;
  timer = setInterval(tick, 60000 / bpm / 2);
}
function togglePlay(){
  playing = !playing;
  var btn = document.getElementById('play');
  if (playing){
    btn.textContent = '■ Stop'; Amigo.sfx('swoosh'); Amigo.music('hiphop');
    cur = -1; combo = 0; tick(); schedule(); setMsg('Robots are jamming!');
  } else {
    btn.textContent = '▶ Play'; clearInterval(timer); Amigo.music('off'); Amigo.sfx('chime');
    for (var r = 0; r < TRACKS.length; r++) if (cur >= 0) cells[r][cur].classList.remove('beat');
    cur = -1; document.getElementById('combo').textContent = ''; setMsg('Paused. Keep building!');
  }
}

document.getElementById('play').addEventListener('click', togglePlay);
document.getElementById('tempo').addEventListener('input', function(){
  document.getElementById('bpm').textContent = this.value;
  if (playing) schedule();
});
document.getElementById('clear').addEventListener('click', function(){
  grid.forEach(function(row){ row.fill(false); });
  document.querySelectorAll('.step').forEach(function(s){ s.classList.remove('on'); });
  Amigo.sfx('scratch'); setMsg('Fresh start!');
});
document.getElementById('startBtn').addEventListener('click', function(){
  document.getElementById('start').style.display = 'none';
  document.getElementById('game').style.display = 'flex';
  Amigo.sfx('magic');
});
// Keyboard: space toggles play once the game is showing
document.addEventListener('keydown', function(e){
  if (e.code === 'Space' && document.getElementById('game').style.display === 'flex'){ e.preventDefault(); togglePlay(); }
});
</script>
</body>
</html>
