<!-- CONCEPT: Space Shooter - SQUAD LEADER: side-scroll shooter where a timed mirror shield reflects enemy bullets straight back as super-bolts; Wingmate ships, Nova blasts, Star Shield and an ultimate laser; flip to fire backwards; works with a game controller; Rogue (Cards) mode: pick 1 of 3 rarity cards that last the whole run | Controls: WASD/Arrows move, Space/Left-click hold to fire, C/Ctrl/Middle-click hold to flip & fire backwards, Shift/X/Right-click for Mirror Shield (tap just before impact to reflect, hold to absorb; covers front and rear), E = Ultimate Laser when charged. Touch: left half = drag to move (auto-fire), bottom-right row: REAR (tap to flip facing) + SHIELD (tap/hold), LASER button above SHIELD when charged -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Squad Leader</title>
<style>
html,body{margin:0;height:100%;background:#05060f;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block;position:absolute;left:0;top:0;width:100%;height:100%}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function(){
"use strict";
const W=960,H=540;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let scale=1,offX=0,offY=0;
function resize(){
  const dpr=window.devicePixelRatio||1;
  const w=window.innerWidth,h=window.innerHeight;
  cv.width=w*dpr;cv.height=h*dpr;
  scale=Math.min(w/W,h/H);
  offX=(w-W*scale)/2;offY=(h-H*scale)/2;
  ctx.setTransform(1,0,0,1,0,0);
  cv.dpr=dpr;
}
window.addEventListener('resize',resize);resize();
function rnd(a,b){return a+Math.random()*(b-a);}

/* ---------- audio (filtered, layered, with a soft echo bus + compressor) ---------- */
let AC=null,master=null,send=null,noiseBuf=null,musBus=null;
const MUS_VOL=0.32;
let musicOn=true;try{musicOn=localStorage.getItem('sl_music')!=='off';}catch(e){}
function initAudio(){
  if(AC){if(AC.state==='suspended')AC.resume();return;}
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    const comp=AC.createDynamicsCompressor();
    comp.threshold.value=-20;comp.knee.value=12;comp.ratio.value=4;comp.attack.value=0.004;comp.release.value=0.18;
    comp.connect(AC.destination);
    master=AC.createGain();master.gain.value=0.6;master.connect(comp);
    // echo bus
    const delay=AC.createDelay(1);delay.delayTime.value=0.21;
    const fb=AC.createGain();fb.gain.value=0.3;
    const dlp=AC.createBiquadFilter();dlp.type='lowpass';dlp.frequency.value=2200;
    const wet=AC.createGain();wet.gain.value=0.32;
    delay.connect(dlp);dlp.connect(fb);fb.connect(delay);dlp.connect(wet);wet.connect(master);
    send=AC.createGain();send.gain.value=1;send.connect(delay);
    musBus=AC.createGain();musBus.gain.value=musicOn?MUS_VOL:0;musBus.connect(master);
    // reusable noise
    const n=AC.sampleRate*2;noiseBuf=AC.createBuffer(1,n,AC.sampleRate);
    const d=noiseBuf.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
  }catch(e){AC=null;}
}
function voice(node,vol,dur,attack,sendAmt){
  const t=AC.currentTime,g=AC.createGain();
  g.gain.setValueAtTime(0.0001,t);
  g.gain.linearRampToValueAtTime(vol,t+(attack||0.004));
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  node.connect(g);g.connect(master);
  if(sendAmt){const s=AC.createGain();s.gain.value=sendAmt;g.connect(s);s.connect(send);}
}
function tone(f1,f2,dur,type,vol,o){
  if(!AC)return;o=o||{};
  const t=AC.currentTime,osc=AC.createOscillator();
  osc.type=type||'sine';
  osc.frequency.setValueAtTime(f1,t);
  osc.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t+dur);
  let n=osc;
  if(o.cut){const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=o.cut;f.Q.value=o.q||0.7;osc.connect(f);n=f;}
  voice(n,vol,dur,o.attack,o.send);
  osc.start(t);osc.stop(t+dur+0.05);
}
function noise(dur,vol,o){
  if(!AC)return;o=o||{};
  const t=AC.currentTime,s=AC.createBufferSource();s.buffer=noiseBuf;s.loop=true;
  s.playbackRate.value=o.rate||1;
  const f=AC.createBiquadFilter();f.type=o.type||'lowpass';
  f.frequency.setValueAtTime(o.cut||1200,t);
  if(o.cut2)f.frequency.exponentialRampToValueAtTime(o.cut2,t+dur);
  f.Q.value=o.q||0.8;
  s.connect(f);voice(f,vol,dur,o.attack,o.send);
  s.start(t);s.stop(t+dur+0.05);
}
/* --- background music: tiny step sequencer (bass, kick, hats, arp; faster with snare on boss waves) --- */
const mus={next:0,step:0};
function mhz(m){return 440*Math.pow(2,(m-69)/12);}
function mNote(freq,t,dur,type,vol,cut,att){
  const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(freq,t);
  let n=o;if(cut){const fl=AC.createBiquadFilter();fl.type='lowpass';fl.frequency.value=cut;o.connect(fl);n=fl;}
  g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(vol,t+(att||0.008));g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  n.connect(g);g.connect(musBus);o.start(t);o.stop(t+dur+0.05);
}
function mKick(t){const o=AC.createOscillator(),g=AC.createGain();o.frequency.setValueAtTime(140,t);o.frequency.exponentialRampToValueAtTime(42,t+0.13);
  g.gain.setValueAtTime(0.55,t);g.gain.exponentialRampToValueAtTime(0.0001,t+0.16);o.connect(g);g.connect(musBus);o.start(t);o.stop(t+0.2);}
function mNoise(t,dur,vol,cut,type){const sr=AC.createBufferSource();sr.buffer=noiseBuf;const fl=AC.createBiquadFilter();fl.type=type;fl.frequency.value=cut;
  const g=AC.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);sr.connect(fl);fl.connect(g);g.connect(musBus);
  sr.start(t,Math.random()*1.5);sr.stop(t+dur+0.02);}
const ROOTS=[45,41,38,40],CHORDS=[[0,3,7,12],[0,4,7,12],[0,3,7,12],[0,3,7,12]],BASSP=[0,0,0,12,0,0,7,0];
function musicStep(s,t,boss,spb){ // dark synth space groove
  const bar=Math.floor(s/16)%4,r=ROOTS[bar],ch=CHORDS[bar],q=s%16;
  if(q%4===0)mKick(t);
  if(q%2===1)mNoise(t,0.03,0.06,8000,'highpass');
  if(boss&&q%8===4)mNoise(t,0.18,0.28,1500,'bandpass');
  if(q%2===0)mNote(mhz(r-12+BASSP[(q/2)%8]),t,spb*1.6,'sawtooth',0.22,380+(boss?260:0));
  if(boss||q%2===0){const arp=[0,2,1,3,2,1,3,2][q%8];mNote(mhz(r+24+ch[arp]),t,spb*0.8,'square',0.03,1500);}
  if(q===0)for(const k of [0,1,2])mNote(mhz(r+12+ch[k]),t,spb*16,'sawtooth',0.022,700,spb*4); // slow pad
}
function musicTick(){
  if(!AC||!musBus||state!=='play'||paused)return;
  const boss=enemies.some(e=>e.type==='boss'),spb=60/(boss?140:114)/4;
  if(mus.next<AC.currentTime)mus.next=AC.currentTime+0.05;
  while(mus.next<AC.currentTime+0.12){musicStep(mus.step,mus.next,boss,spb);mus.next+=spb;mus.step=(mus.step+1)%64;}
}
function setMusic(on){musicOn=on;try{localStorage.setItem('sl_music',on?'on':'off');}catch(e){}
  if(musBus)musBus.gain.setTargetAtTime(on?MUS_VOL:0,AC.currentTime,0.05);}
// FM voice: metallic / sci-fi timbres (carrier swept f1->f2, modulator at ratio x carrier)
function fm(f1,f2,ratio,depth,dur,vol,o){
  if(!AC)return;o=o||{};
  const t=AC.currentTime,c=AC.createOscillator(),m=AC.createOscillator(),mg=AC.createGain();
  c.type=o.type||'sine';c.frequency.setValueAtTime(f1,t);c.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t+dur);
  m.frequency.setValueAtTime(f1*ratio,t);m.frequency.exponentialRampToValueAtTime(Math.max(20,f2*ratio),t+dur);
  mg.gain.setValueAtTime(f1*depth,t);mg.gain.exponentialRampToValueAtTime(Math.max(1,f2*depth*0.2),t+dur);
  m.connect(mg);mg.connect(c.frequency);
  let n=c;if(o.cut){const fl=AC.createBiquadFilter();fl.type='lowpass';fl.frequency.value=o.cut;c.connect(fl);n=fl;}
  voice(n,vol,dur,o.attack,o.send);c.start(t);m.start(t);c.stop(t+dur+0.05);m.stop(t+dur+0.05);
}
const later=(ms,fn)=>setTimeout(fn,ms);
const SFX={
  // --- space / sci-fi sound set ---
  shoot(){tone(rnd(1300,1500),170,0.09,'square',0.035,{cut:3200});tone(900,110,0.08,'sine',0.05);},
  hit(){fm(900,650,1.41,2,0.08,0.06);noise(0.04,0.05,{type:'highpass',cut:3500});},
  boom(){noise(0.9,0.5,{cut:1400,cut2:50,send:0.7});tone(70,24,0.8,'sine',0.4,{send:0.3});fm(120,40,0.5,4,0.5,0.12,{cut:600});},
  raise(){tone(200,1200,0.16,'sine',0.08,{send:0.4});fm(600,1500,2.01,0.8,0.18,0.05,{send:0.5});},
  absorb(){fm(150,80,2.5,3,0.2,0.13,{cut:1200});noise(0.08,0.05,{cut:900});},
  deflect(){fm(1800,1100,1.5,1,0.16,0.07,{send:0.4});},
  parry(n){
    const f=600+Math.min(n,12)*40;
    fm(f,f*1.01,3.5,1.2,0.7,0.14,{send:0.8});tone(f*2,f*2.02,0.45,'sine',0.06,{send:0.7});
    tone(f*0.5,f*0.25,0.25,'sawtooth',0.04,{cut:1500});
  },
  hurt(){tone(220,200,0.32,'square',0.08,{cut:1300});tone(233,210,0.32,'square',0.08,{cut:1300});noise(0.4,0.4,{cut:700,cut2:80,send:0.4});},
  power(){[660,990,1320].forEach((f,i)=>later(i*55,()=>tone(f,f*1.02,0.09,'square',0.05,{cut:2600,send:0.5})));tone(300,1200,0.25,'sine',0.06,{send:0.4});},
  drone(){noise(0.12,0.06,{type:'bandpass',cut:2200,q:3});later(110,()=>tone(1200,1200,0.07,'sine',0.1,{send:0.5}));later(200,()=>tone(1600,1600,0.1,'sine',0.1,{send:0.6}));later(320,()=>fm(400,800,2,1,0.35,0.07,{send:0.5}));},
  droneHit(){fm(420,300,2,2,0.1,0.08);},
  droneLost(){tone(800,60,0.7,'sawtooth',0.1,{cut:1400,send:0.4});noise(0.4,0.25,{cut:1000,cut2:100,send:0.4});},
  wave(){tone(1500,1500,0.25,'sine',0.12,{send:0.9});later(420,()=>tone(1500,1500,0.25,'sine',0.08,{send:0.9}));tone(110,220,0.8,'sawtooth',0.05,{cut:700,attack:0.1,send:0.4});},
  over(){tone(420,38,1.6,'sawtooth',0.14,{cut:900,send:0.5});tone(210,20,1.6,'sine',0.18);noise(1.2,0.15,{cut:600,cut2:60,send:0.5});},
  nuke(){noise(1.6,0.7,{cut:3000,cut2:40,send:0.8});tone(60,20,1.4,'sine',0.5);fm(80,30,0.5,6,1.0,0.15,{cut:500});tone(2000,200,0.6,'sawtooth',0.05,{cut:3000,send:0.6});},
  laser(d){tone(110,100,d,'sawtooth',0.16,{cut:900,attack:0.05,send:0.3});fm(440,430,1.5,0.6,d,0.07,{attack:0.08,send:0.4});noise(d,0.1,{type:'bandpass',cut:2200,q:0.9,attack:0.05});},
  bossDown(){noise(1.8,0.6,{cut:2500,cut2:40,send:0.8});tone(55,20,1.6,'sine',0.5);
    [220,277,330,440].forEach((f,i)=>later(300+i*160,()=>tone(f,f*1.005,1.2,'sawtooth',0.06,{cut:1800,attack:0.05,send:0.7})));},
  count(go){if(go){tone(990,990,0.45,'square',0.06,{cut:2400,send:0.6});tone(495,495,0.45,'sine',0.1,{send:0.5});}else tone(660,660,0.14,'square',0.06,{cut:2000,send:0.4});},
  rankUp(){[880,1175,1568].forEach((f,i)=>later(i*70,()=>tone(f,f,0.08,'square',0.045,{cut:3000,send:0.6})));later(240,()=>fm(800,1600,2,0.6,0.4,0.06,{send:0.6}));},
  heart(){tone(85,55,0.14,'sine',0.25);later(170,()=>tone(80,50,0.16,'sine',0.2));},
  missile(){noise(0.25,0.08,{type:'bandpass',cut:600,cut2:2600,q:1.4});tone(200,620,0.18,'sawtooth',0.035,{cut:1600});},
  ultReady(){tone(150,1200,0.6,'sawtooth',0.06,{cut:2500,send:0.6});later(500,()=>fm(1200,1210,2,0.7,0.6,0.08,{send:0.8}));}
};

/* ---------- input ---------- */
const keys={};
let mouseFire=false,mouseShield=false,mouseRear=false;
const touches={}; // id -> {role:'move'|'act'|'flip',sx,sy,x,y,t}
let touchMode=false;      // set once a finger/pen touches the canvas
let manualFacing=1;       // touch: facing set by the FLIP pad (1 forward, -1 rear)
function vib(p){padRumble(p);try{if(touchMode&&navigator.vibrate)navigator.vibrate(p);}catch(e){}}
/* ---------- game controller, standard layout: A0 B1 X2 Y3 LB4 RB5 LT6 RT7 Back8 Start9 Up12 Down13 Left14 Right15 ---------- */
const pad={on:false,mx:0,my:0,shield:false,rear:false};
let padActive=false,padFocusI=0,padScreen='',padLock=false,padRep=0,padLastDir=null,padIdx=-1,padPrev=[],padGot=null;
function padRead(){
  if(!navigator.getGamepads)return null;
  let list=[];try{list=[...navigator.getGamepads()].filter(q=>q&&q.connected&&q.buttons&&q.buttons.length);}catch(e){return null;}
  if(!list.length)return null;
  const live=list.find(q=>q.buttons.some(b=>b.pressed)); /* Windows can list a phantom controller first, so the one being used wins */
  if(live)padIdx=live.index;
  return list.find(q=>q.index===padIdx)||list[0];
}
function padDead(x,y){const m=Math.hypot(x,y);if(m<0.22)return [0,0];const k=Math.min(1,(m-0.22)/0.78)/m;return [x*k,y*k];}
function padRumble(p){
  const a=padActive&&padGot&&padGot.vibrationActuator;if(!a||!a.playEffect)return;
  const d=Array.isArray(p)?p.reduce((s,v)=>s+v,0):(+p||40);
  try{const r=a.playEffect('dual-rumble',{duration:Math.min(400,d),strongMagnitude:0.7,weakMagnitude:0.5});if(r&&r.catch)r.catch(()=>{});}catch(e){}
}
/* what can be chosen on this screen; null while flying */
function padItems(){
  const toMenu=()=>{paused=false;state='title';showHelp=false;};
  if(state==='title'){
    if(showHelp)return [{r:CLOSEBTN,go:()=>{showHelp=false;}}];
    return [{r:PLAYBTN,go:()=>startGame(false)},{r:ROGUEBTN,go:()=>startGame(true)},{r:HELPBTN,go:()=>{showHelp=true;}}];
  }
  if(state==='over')return overT>1.2?[{r:OVERBTN,go:()=>startGame()},{r:MENUBTN,go:toMenu}]:[];
  if(state==='play'&&paused)return [{r:OVERBTN,go:()=>setPause(false)},{r:MENUBTN,go:toMenu}];
  if(state==='play'&&hand){const n=hand.cards.length;return hand.cards.map((c,i)=>({r:cardRect(i,n),go:()=>pickCard(i)}));}
  return null;
}
function padNav(items,dir){
  const c=items[padFocusI];if(!c)return;
  const cx=c.r.x+c.r.w/2,cy=c.r.y+c.r.h/2,H=dir==='l'||dir==='r',s=dir==='l'||dir==='u'?-1:1;
  let best=-1,bs=1e9;
  items.forEach((it,i)=>{if(i===padFocusI)return;const dx=it.r.x+it.r.w/2-cx,dy=it.r.y+it.r.h/2-cy,along=(H?dx:dy)*s,cross=Math.abs(H?dy:dx);if(along<=4)return;const sc=along+cross*2.2;if(sc<bs){bs=sc;best=i;}});
  if(best>=0){padFocusI=best;if(AC)SFX.deflect();}
}
function padDrop(){padActive=false;pad.on=false;pad.mx=pad.my=0;pad.shield=pad.rear=false;}
function padTick(dt){
  const g=padRead();padGot=g;
  if(!g){padDrop();return;}
  const cur=g.buttons.map(b=>!!b&&(b.pressed||b.value>0.3)),B=i=>!!cur[i],edge=i=>B(i)&&!padPrev[i];
  const ax=g.axes||[],L=padDead(ax[0]||0,ax[1]||0),Rs=padDead(ax[2]||0,ax[3]||0),any=cur.some(Boolean)||L[0]||L[1]||Rs[0]||Rs[1];
  const items0=padItems();
  if(!padActive){
    if(!any){padPrev=cur;return;}
    padActive=true;pad.on=true;touchMode=false;initAudio();manualFacing=1;
    if(items0){padScreen=state+paused+!!hand+showHelp;padFocusI=0;padLock=true;padPrev=cur;return;}   // on a menu the first press only wakes it up, so it can't choose something unseen
  }
  pad.on=true;
  const screen=state+paused+!!hand+showHelp;
  if(screen!==padScreen){padScreen=screen;padFocusI=0;padLock=true;}
  const items=padItems();
  if(items===null){
    pad.mx=L[0];pad.my=L[1];pad.shield=B(0)||B(6);pad.rear=B(4)||Rs[0]<-0.4;
    if(Rs[0]>0.4&&manualFacing<0)manualFacing=1;
    if(edge(2))fireLaser();
    else if(edge(3)){manualFacing=-manualFacing;vib(15);if(player)pops.push({x:player.x,y:player.y-34,t:0.7,txt:manualFacing<0?'<< FACING REAR':'FACING FORWARD >>',col:'#fc8'});}
    else if(edge(9))setPause(true);
    else if(edge(8))setMusic(!musicOn);
  }else{
    pad.mx=pad.my=0;pad.shield=pad.rear=false;
    if(padFocusI>=items.length)padFocusI=0;
    const stick=Math.hypot(L[0],L[1])>0.45?(Math.abs(L[0])>Math.abs(L[1])?(L[0]<0?'l':'r'):(L[1]<0?'u':'d')):null;
    const dir=B(12)?'u':B(13)?'d':B(14)?'l':B(15)?'r':stick;
    if(!dir)padLock=false;
    if(dir&&!padLock){
      if(dir!==padLastDir)padRep=0;
      padRep-=dt;
      if(padRep<=0){padRep=dir===padLastDir?0.16:0.35;padNav(items,dir);}
    }
    padLastDir=dir;
    const it=items[padFocusI];
    if(edge(0)||(edge(9)&&!(state==='play'&&paused)&&!(state==='title'&&showHelp))){if(it){if(AC)SFX.power();it.go();}}
    else if(edge(1)||edge(9)){
      if(state==='title'&&showHelp)showHelp=false;
      else if(state==='play'&&paused)setPause(false);
    }
  }
  padPrev=cur;
}
function drawPadRing(){
  if(!padActive)return;
  const items=padItems();if(!items||!items.length)return;
  const it=items[Math.min(padFocusI,items.length-1)],r=it.r,o=7,pu=0.75+0.25*Math.sin(performance.now()/160);
  ctx.save();ctx.globalAlpha=pu;ctx.strokeStyle='#ffd866';ctx.lineWidth=5;ctx.shadowColor='#ffd866';ctx.shadowBlur=18;
  ctx.beginPath();if(ctx.roundRect)ctx.roundRect(r.x-o,r.y-o,r.w+o*2,r.h+o*2,10);else ctx.rect(r.x-o,r.y-o,r.w+o*2,r.h+o*2);ctx.stroke();ctx.restore();
}
function toLogical(e){return {x:(e.clientX-offX)/scale,y:(e.clientY-offY)/scale};}
window.addEventListener('keydown',e=>{
  keys[e.code]=true;
  if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','ShiftLeft','ShiftRight','ControlLeft','ControlRight'].includes(e.code))e.preventDefault();
  initAudio();
  if(!e.repeat){
    if(state==='title'&&!showHelp&&(e.code==='Enter'||e.code==='Space'))startGame(false);
    else if(state==='title'&&!showHelp&&e.code==='KeyR')startGame(true);
    else if(state==='title'&&showHelp&&(e.code==='Escape'||e.code==='Enter'))showHelp=false;
    else if(state==='over'&&overT>1.2&&(e.code==='Enter'||e.code==='KeyR'))startGame();
    else if(state==='over'&&overT>1.2&&(e.code==='Escape'||e.code==='KeyM')){state='title';showHelp=false;}
    else if(state==='play'&&hand&&!paused&&/^Digit[1-3]$/.test(e.code))pickCard(+e.code.slice(5)-1);
    else if(state==='play'&&(e.code==='Escape'||e.code==='KeyP'))setPause(!paused);
    else if(state==='play'&&e.code==='KeyM')setMusic(!musicOn);
  }
  if(e.code==='KeyE'&&state==='play')fireLaser();
});
window.addEventListener('keyup',e=>{keys[e.code]=false;});
window.addEventListener('blur',()=>{for(const k in keys)keys[k]=false;mouseFire=mouseShield=mouseRear=false;setPause(true);});
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('mousedown',e=>{if(e.button===1)e.preventDefault();});
cv.addEventListener('auxclick',e=>e.preventDefault());
// touch: two buttons side by side on the bottom-right row, each a quarter of the screen wide
const ROW_Y=H*0.58;

    if(showHelp){if(inBox(CLOSEBTN,p)||e.pointerType!=='mouse')showHelp=false;}

  }

function rollRarity(min){const x=Math.random();return Math.max(min,x<0.02?3:x<0.12?2:x<0.4?1:0);}
function dealHand(min,why){
  const pool=CARDS.filter(c=>(!c.can||c.can())&&c.r.some(x=>x>=min));
  const cards=[];
  while(cards.length<3&&pool.length){
    /* the roll comes first, then a card that exists at that rarity, so a Common roll can't get bumped up to Rare */
    const want=rollRarity(min);let opts=pool.filter(q=>q.r.some(x=>x>=min&&x<=want));if(!opts.length)opts=pool;
    const c=opts[Math.floor(Math.random()*opts.length)];pool.splice(pool.indexOf(c),1);
    let r=-1;for(const x of c.r)if(x>=min&&x<=want)r=x; /* the best this card has, up to what was rolled */
    if(r<0)r=c.r.find(x=>x>=min);
    cards.push({id:c.id,r});
  }
  if(!cards.length)return;
  hand={why,cards,t:0};rogueHand=null;
  for(const id in touches)delete touches[id];mouseFire=mouseShield=mouseRear=false;for(const k in keys)keys[k]=false;
  SFX.rankUp();
}
function pickCard(i){
  if(!hand||hand.t<0.45)return; /* a short pause, so a thumb already moving cannot pick by accident */
  const sl=hand.cards[i];if(!sl)return;
  const c=CARD_BY[sl.id];c.apply(sl.r);player.deck.push({id:sl.id,r:sl.r});
  lastCardAt=time;hand=null;(sl.r>=2?SFX.bossDown:SFX.power)();vib(25);
  pops.push({x:player.x,y:player.y-40,t:1.6,txt:c.n.toUpperCase(),col:RAR[sl.r].col});
}
function cardRect(i,n){const w=270,g=24,x0=W/2-(n*w+(n-1)*g)/2;return {x:x0+i*(w+g),y:92,w,h:340};}
function wrapText(txt,maxW){
  const out=[];let line='';
  for(const word of txt.split(' ')){const tryL=line?line+' '+word:word;if(ctx.measureText(tryL).width>maxW&&line){out.push(line);line=word;}else line=tryL;}
  if(line)out.push(line);return out;
}
const EMOJI='"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif';
function drawHand(){

    ctx.save();ctx.translate(cx,cy);ctx.scale(0.8+0.2*k,0.8+0.2*k);ctx.translate(-cx,-cy);ctx.globalAlpha=k;
    glow(col,sl.r>=2?26:10);ctx.fillStyle='#10183a';ctx.strokeStyle=col;ctx.lineWidth=sl.r>=2?5:3;

/* the cards you hold: same card twice shows a count, and its border is the best rarity you got */
function drawDeck(cx,y,sz){
  const p=player;if(!p||!p.deck||!p.deck.length)return;
  const seen={},list=[];for(const d of p.deck){if(!seen[d.id]){seen[d.id]={id:d.id,r:d.r,n:0};list.push(seen[d.id]);}seen[d.id].n++;seen[d.id].r=Math.max(seen[d.id].r,d.r);}
  const per=Math.floor(440/(sz+4));
  ctx.save();ctx.textAlign='center';ctx.textBaseline='middle';
  list.forEach((d,i)=>{
    const row=Math.floor(i/per),inRow=Math.min(per,list.length-row*per),x=cx-(inRow*(sz+4)-4)/2+(i%per)*(sz+4)+sz/2,yy=y+row*(sz+4);
    ctx.fillStyle='rgba(10,16,40,.75)';ctx.strokeStyle=RAR[d.r].col;ctx.lineWidth=1.5;ctx.fillRect(x-sz/2,yy-sz/2,sz,sz);ctx.strokeRect(x-sz/2,yy-sz/2,sz,sz);
    ctx.fillStyle='#fff';ctx.font=Math.round(sz*0.68)+'px '+EMOJI;ctx.fillText(CARD_BY[d.id].ic,x,yy+1);
    if(d.n>1){ctx.fillStyle='#ffd24a';ctx.font='bold '+Math.round(sz*0.45)+'px monospace';ctx.textAlign='right';ctx.fillText(String(d.n),x+sz/2-1,yy+sz/2-sz*0.2);ctx.textAlign='center';}
  });
  ctx.restore();
}

const CALLSIGNS=['VIPER','ACE','GHOST','COMET','ROOK','BLAZE','ECHO','NOVA','HAWK','JET','SPARK','BOLT','ORBIT','RAZOR','DASH','STORM'];
const RANKS=['ROOKIE','PILOT','VETERAN','ACE'],RANK_AT=[0,25,60,120];
function pickName(){const used=player.drones.map(d=>d.name);const free=CALLSIGNS.filter(n=>!used.includes(n));return free[Math.floor(Math.random()*free.length)]||'WING';}
function addDrone(){
  const p=player;
  if(p.drones.length>=MAX_DRONES){ // full squad: every wingmate gets +1 max shield and is fully repaired
    for(const d of p.drones){d.max=Math.min(DRONE_SH_CAP,d.max+1);d.sh=d.max;}
    return 'WINGMATES +1 LIFE';
  }
  let slot=0;while(p.drones.some(d=>d.slot===slot))slot++;
  const o=DRONE_OFF[slot];
  const name=pickName();stats.recruited++;
  p.drones.push({slot,name,rank:0,age:0,x:p.x+o[0]*p.dir,y:p.y+o[1],sh:DRONE_SH,max:DRONE_SH,inv:0,t:Math.random()*6});
  return (slot>=2?'TAIL GUNNER ':'WINGMAN ')+name+' JOINED!';
}

/* ---------- waves ---------- */
const ET={
  drifter:{hp:3,r:16,col:'#ffe03a',score:100,fire:[1.6,2.6]},
  splitter:{hp:6,r:19,col:'#3f6',score:250,fire:[2.6,3.6]},
  mini:{hp:1,r:10,col:'#7f8',score:60,fire:[99,99]},
  sprayer:{hp:5,r:19,col:'#f5a',score:200,fire:[2.2,3.2]},
  tank:{hp:14,r:28,col:'#f83',score:400,fire:[2.4,3.4]},
  diver:{hp:2,r:13,col:'#f45',score:150,fire:[99,99]},
  boss:{hp:80,r:54,col:'#c6f',score:3000,fire:[99,99]}
};
function buildWave(n){
  queue=[];
  if(n%5===0){
    queue.push({t:'boss',d:0.5});
    const k=2+Math.floor(n/5);
    for(let i=0;i<k;i++)queue.push({t:'drifter',d:3+i*1.6,side:i%2?-1:1});
    return;
  }
  const count=Math.min(30,5+n*2);
  for(let i=0;i<count;i++){
    let pool=['drifter'];
    if(n>=2)pool.push('diver');
    if(n>=3)pool.push('sprayer','splitter');
    if(n>=7)pool.push('splitter');
    if(n>=4)pool.push('sprayer','diver');
    if(n>=6)pool.push('tank');
    if(n>=9)pool.push('tank','sprayer');
    const t=pool[Math.floor(Math.random()*pool.length)];
    // from wave 4 some drifters/sprayers sneak in from BEHIND
    const side=(n>=4&&(t==='drifter'||t==='sprayer'||t==='splitter')&&Math.random()<Math.min(0.35,0.12+n*0.02))?-1:1;
    queue.push({t,d:Math.max(0.35,1.1-n*0.04)+Math.random()*0.4,side});
  }
}
function spawn(type,side){
  const d=ET[type];
  const hpMul=1+Math.floor(wave/(rogue?4:6))*0.35; // Rogue players are stronger, so enemies toughen sooner
  const e={type,x:W+40,y:rnd(60,H-60),dir:-1,hp:Math.ceil(d.hp*(type==='boss'?(1+wave*0.1)*(rogue?1.25:1):hpMul)),r:d.r,t:0,f:rnd(d.fire[0],d.fire[1])*0.8,ph:Math.random()*6.28,by:0,state:0};
  e.max=e.hp;e.by=e.y;
  if(side===-1&&(type==='drifter'||type==='sprayer'||type==='splitter')){e.x=-40;e.dir=1;}
  if(type==='boss'){e.kind=bossKind(wave);e.col=BOSS_KINDS[e.kind].col;e.sc=bossScale(wave);e.r=Math.round(d.r*e.sc);e.hp=e.max=Math.ceil(e.hp*(0.6+0.4*e.sc));e.y=H/2;e.by=H/2;e.f=2;}
  enemies.push(e);
}
// boss size grows every 5 waves: wave 5 small, 10 normal, 15 large, 20+ HUGE
function bossScale(w){const t=[[5,0.65],[10,1.0],[15,1.4],[20,2.0]];
  for(const [ww,sc] of t)if(w<=ww)return sc;return Math.min(2.3,2.0+(w-20)/5*0.1);}
const BOSS_KINDS=[
  {name:'VOID PRISM',col:'#c6f',pts:8,inner:0.72},
  {name:'CRIMSON STAR',col:'#f55',pts:10,inner:0.55},
  {name:'TIDE HEX',col:'#2fb',pts:6,inner:0.85},
  {name:'SOLAR CROWN',col:'#fd4',pts:12,inner:0.62},
  {name:'VENOM WHEEL',col:'#9f3',pts:16,inner:0.8}];
function bossKind(w){return (Math.max(1,Math.round(w/5))-1)%BOSS_KINDS.length;}
function bossSizeName(w){const sc=bossScale(w);return sc<0.9?'MINI BOSS':sc<1.2?'BOSS':sc<1.8?'BIG BOSS':'HUGE BOSS';}
function ebSpeed(){return Math.min(400,230+wave*9);}
function shootE(e,ang,spd){
  ebullets.push({x:e.x,y:e.y,vx:Math.cos(ang)*spd,vy:Math.sin(ang)*spd,r:6});
}
function aimAng(e){return Math.atan2(player.y-e.y,player.x-e.x);}
function onScreen(e){return e.x>20&&e.x<W-20;}

/* ---------- update ---------- */
function update(dt){
  time+=dt;
  if(countdown>0){countdown-=dt;const c=countdown>0.4?Math.ceil(countdown-0.4):0;
    if(c!==cdShown){cdShown=c;SFX.count(c===0);}}
  const p=player,pm=p.m;
  // movement input
  let mx=0,my=0;
  if(keys.KeyA||keys.ArrowLeft)mx-=1;
  if(keys.KeyD||keys.ArrowRight)mx+=1;
  if(keys.KeyW||keys.ArrowUp)my-=1;
  if(keys.KeyS||keys.ArrowDown)my+=1;
  let wantFire=keys.Space||mouseFire,
      wantShield=keys.ShiftLeft||keys.ShiftRight||keys.KeyX||mouseShield,
      wantRear=keys.KeyC||keys.ControlLeft||keys.ControlRight||keys.KeyQ||mouseRear;
  for(const id in touches){
    const t=touches[id];
    if(t.role==='move'){
      const dx=t.x-t.sx,dy=t.y-t.sy,m=Math.hypot(dx,dy);
      if(m>6){const k=Math.min(1,m/40);mx+=dx/m*k;my+=dy/m*k;}
    }else if(t.role==='act'){
      t.t+=dt;
      if(t.shield)wantShield=true;
    }
  }
  if(touchMode||pad.on||p.twin>0)wantFire=true; // touch and Star Shield always auto-fire
  if(pad.on){mx+=pad.mx;my+=pad.my;if(pad.shield)wantShield=true;}
  const ml=Math.hypot(mx,my);if(ml>1){mx/=ml;my/=ml;}
  const spd=330*pm.spd;
  p.x=Math.max(30,Math.min(W*0.55,p.x+mx*spd*dt));
  p.y=Math.max(24,Math.min(H-24,p.y+my*spd*dt));
  p.tilt=(p.tilt||0)+(my*0.3-(p.tilt||0))*Math.min(1,10*dt);
  // facing: keyboard/mouse = hold for rear; touch = FLIP pad toggles, nothing else changes it
  if(wantRear||pad.rear)p.dir=-1;
  else if(touchMode||pad.on)p.dir=manualFacing;
  else p.dir=1;
  if(p.dir<0)wantFire=true;
  p.inv=Math.max(0,p.inv-dt);p.rapid=Math.max(0,p.rapid-dt);p.wide=Math.max(0,p.wide-dt);p.twin=Math.max(0,p.twin-dt);p.missile=Math.max(0,p.missile-dt);p.laser=Math.max(0,p.laser-dt);p.pulse=Math.max(0,p.pulse-dt);

  // shield
  const s=p.sh;
  s.cd=Math.max(0,s.cd-dt);s.broken=Math.max(0,s.broken-dt);
  if(wantShield&&!s.on&&s.cd<=0&&s.broken<=0&&p.energy>8){
    s.on=true;s.t=0;s.parried=false;SFX.raise();
  }
  if(s.on){
    s.t+=dt;
    if(s.t>parryWin())p.energy-=SHIELD_HOLD_DRAIN*pm.shCost*dt;
    if(!wantShield||p.energy<=0){
      s.on=false;s.cd=s.parried?0.08:0.45;
      if(p.energy<=0){p.energy=0;s.broken=1.8;boom(p.x,p.y,'#8cf',16,180);SFX.absorb();pops.push({x:p.x,y:p.y-40,t:0.9,txt:'SHIELD DOWN',col:'#f88'});}
    }
  }else{
    p.energy=Math.min(100,p.energy+(s.broken>0?9:20)*pm.shRegen*dt);
  }

  // low-hull heartbeat
  if(p.hp===1){heartT-=dt;if(heartT<=0){heartT=1.1;SFX.heart();}}else heartT=0;
  // drones follow
  for(let i=0;i<p.drones.length;i++){
    const d=p.drones[i],o=DRONE_OFF[d.slot];
    const tx=p.x+o[0]*p.dir,ty=p.y+o[1]+Math.sin(time*3+d.t)*4;
    const k=Math.min(1,9*dt);
    d.x+=(tx-d.x)*k;d.y+=(ty-d.y)*k;d.inv=Math.max(0,d.inv-dt);
    d.age+=dt;
    if(d.rank<3&&d.age>=RANK_AT[d.rank+1]){d.rank++;SFX.rankUp();
      if(d.rank>=2){d.max=Math.min(DRONE_SH_CAP,d.max+1);d.sh=d.max;}
      pops.push({x:d.x,y:d.y-22,t:1.3,txt:d.name+' -> '+RANKS[d.rank]+'!',col:d.rank===3?'#fff':'#cef'});}
    if(d.rank>stats.topRank||(d.rank===stats.topRank&&!stats.topName)){stats.topRank=d.rank;stats.topName=d.name;}
  }

  // fire
  p.fire-=dt;
  if(wantFire&&(!s.on||p.twin>0)&&p.laser<=0&&p.fire<=0){
    p.fire=(p.rapid>0?0.065:0.12)*pm.rate;
    const dirs=p.twin>0?[p.dir,-p.dir]:[p.dir];
    for(const dir of dirs){
      const mk=(a,x,y,dmg)=>bullets.push({x,y,vx:Math.cos(a)*900*dir,vy:Math.sin(a)*900,dmg:dmg+pm.dmg,r:4,ref:false,pr:pm.pierce});
      mk(0,p.x+24*dir,p.y,1);
      if(p.wide>0){mk(-0.16,p.x+24*dir,p.y,1);mk(0.16,p.x+24*dir,p.y,1);}
      for(let k=1;k<=pm.shots;k++)mk((k%2?1:-1)*0.09*Math.ceil(k/2),p.x+24*dir,p.y,1);
      for(let k=0;k<pm.rear;k++)bullets.push({x:p.x-20*dir,y:p.y+(k-(pm.rear-1)/2)*11,vx:-900*dir,vy:0,dmg:1+pm.dmg,r:4,ref:false,pr:pm.pierce});
      for(const d of p.drones){const dd=d.slot>=2?-dir:dir;bullets.push({x:d.x+16*dd,y:d.y,vx:900*dd,vy:0,dmg:(d.rank>=3?2:1)+pm.droneDmg,r:4,ref:false,ace:d.rank>=3});}
    }
    SFX.shoot();
  }

  // homing missiles power-up: a pair every half second, seeking the nearest enemies
  p.mfire-=dt;
  if((p.missile>0||pm.seek>0)&&p.mfire<=0&&enemies.length){
    p.mfire=p.missile>0?0.5:pm.seek;SFX.missile();
    for(const sgn of [-1,1]){
      const a=(p.dir>0?0:Math.PI)+sgn*1.1;
      bullets.push({x:p.x,y:p.y+sgn*8,vx:Math.cos(a)*260,vy:Math.sin(a)*260,dmg:3,r:6,miss:true,life:3.5,target:null});
    }
  }
  // waves
  if(waveClear){
    clearT-=dt;
    if(rogueHand){rogueHand.t-=dt;if(rogueHand.t<=0){dealHand(rogueHand.min,rogueHand.why);return;}}
    if(clearT<=0){
      wave++;waveClear=false;buildWave(wave);spawnT=0.6;
      if(pm.star>0)p.twin=Math.max(p.twin,pm.star);
      banner=(wave%5===0)?'WAVE '+wave+' - '+bossSizeName(wave)+': '+BOSS_KINDS[bossKind(wave)].name:'WAVE '+wave;bannerT=2;
      if(wave>1){SFX.wave();}
    }
  }else{
    spawnT-=dt;
    while(queue.length&&spawnT<=0){const q=queue.shift();spawn(q.t,q.side);spawnT+=q.d;}
    if(!queue.length&&!enemies.length){
      waveClear=true;clearT=2.2;
      const bonus=wave*150;addScore(bonus,W/2,H/2,'#ff6');
      if(!(banner==='BOSS DOWN!'&&bannerT>0)){banner='WAVE '+wave+' CLEAR!';bannerT=2;}else{clearT=3.2;}
      if(p.hp<p.maxhp&&wave%3===0){p.hp++;pops.push({x:p.x,y:p.y-30,t:1,txt:'+HULL',col:'#6f6'});}
      p.energy=100;
      for(const d of p.drones)d.sh=Math.min(d.max,d.sh+1);
      if(rogue){
        if(pm.regen&&wave%pm.regen===0&&p.hp<p.maxhp){p.hp++;pops.push({x:p.x,y:p.y-52,t:1,txt:'+HULL',col:'#6f6'});}
        // bosses always pay, with an Epic or better; otherwise a hand waits for the cool-down
        if(wave%5===0)rogueHand={min:2,why:'BOSS DOWN! PICK A CARD',t:2};
        else if(time-lastCardAt>=CARD_COOL)rogueHand={min:0,why:'WAVE '+wave+' CLEAR! PICK A CARD',t:1.1};
      }
    }
  }
  bannerT=Math.max(0,bannerT-dt);

  // enemies
  const es=ebSpeed();
  for(const e of enemies){
    e.t+=dt;
    if(e.type==='drifter'){
      const ent=e.dir<0?e.x>W-90:e.x<90;
      e.x+=e.dir*(ent?150:70)*dt;e.y=e.by+Math.sin(e.t*2+e.ph)*60;
      e.f-=dt;if(e.f<=0&&onScreen(e)){e.f=rnd(1.6,2.6)*Math.max(0.5,1-wave*0.02);shootE(e,aimAng(e),es);}
    }else if(e.type==='splitter'){ // slow wobbling green blob; splits into 2 minis when destroyed
      const ent=e.dir<0?e.x>W-110:e.x<110;
      e.x+=e.dir*(ent?120:38)*dt;e.y=e.by+Math.sin(e.t*1.6+e.ph)*70;
      e.f-=dt;if(e.f<=0&&onScreen(e)){e.f=rnd(2.6,3.6)*Math.max(0.6,1-wave*0.02);const a=aimAng(e);shootE(e,a-0.12,es*0.8);shootE(e,a+0.12,es*0.8);}
    }else if(e.type==='mini'){ // zips toward the player, curving
      const a=Math.atan2(player.y-e.y,player.x-e.x),sp=170+wave*6;e.vx+=(Math.cos(a)*sp-e.vx)*Math.min(1,2.2*dt);e.vy+=(Math.sin(a)*sp-e.vy)*Math.min(1,2.2*dt);
      e.x+=e.vx*dt;e.y+=e.vy*dt;e.life-=dt;if(e.life<=0){e.dead=true;boom(e.x,e.y,'#7f8',6,120);}
    }else if(e.type==='sprayer'){
      const ent=e.dir<0?e.x>W-120:e.x<120;
      e.x+=e.dir*(ent?140:45)*dt;e.y=e.by+Math.sin(e.t*1.3+e.ph)*90;
      e.f-=dt;if(e.f<=0&&onScreen(e)){e.f=rnd(2.2,3.2)*Math.max(0.55,1-wave*0.02);const a=aimAng(e);for(let k=-1;k<=1;k++)shootE(e,a+k*0.28,es*0.9);}
    }else if(e.type==='tank'){
      e.x-=(e.x>W-140?100:28)*dt;e.y+=Math.sin(e.t+e.ph)*20*dt;
      e.f-=dt;if(e.f<=0&&e.x<W-30){e.f=rnd(2.4,3.4)*Math.max(0.6,1-wave*0.02);const n=10;for(let k=0;k<n;k++)shootE(e,e.t+k/n*6.283,es*0.7);}
    }else if(e.type==='diver'){
      if(e.state===0){e.x-=160*dt;if(e.x<W-120+Math.sin(e.ph)*60){e.state=1;e.t=0;}}
      else if(e.state===1){ // telegraph
        e.y+=Math.sin(e.t*40)*0.8;
        if(e.t>0.55){e.state=2;const a=Math.atan2(player.y-e.y,player.x-e.x);e.vx=Math.cos(a)*(380+wave*8);e.vy=Math.sin(a)*(380+wave*8);}
      }else{e.x+=e.vx*dt;e.y+=e.vy*dt;}
    }else if(e.type==='boss'){
      if(e.x>W-150)e.x-=80*dt;
      e.y=e.by+Math.sin(e.t*0.9)*Math.min(150,H/2-e.r-30);
      e.f-=dt;
      if(e.f<=0&&e.x<=W-150){
        const rate=Math.max(0.9,1.7-wave*0.03);
        // each boss kind cycles through its own set of attacks (6s each)
        const SETS=[['ring','fan5','sweep'],['spiral2','fan3fast','ring'],['wall','ring','fan5'],['bigring','spiral2','wall'],['flower','fan3fast','sweep']];
        const set=SETS[e.kind||0],atk=set[Math.floor(e.t/6)%set.length];
        e.f=rate;
        if(atk==='ring'){const n=14,o=Math.random()*6.28;for(let k=0;k<n;k++)shootE(e,o+k/n*6.283,es*0.7);}
        else if(atk==='bigring'){const n=22,o=Math.random()*6.28;for(let k=0;k<n;k++)shootE(e,o+k/n*6.283,es*0.5);e.f=rate*1.3;}
        else if(atk==='fan5'){const a=aimAng(e);for(let k=-2;k<=2;k++)shootE(e,a+k*0.17,es);e.f=rate*0.75;}
        else if(atk==='fan3fast'){const a=aimAng(e);for(let k=-1;k<=1;k++)shootE(e,a+k*0.12,es*1.15);e.f=rate*0.45;}
        else if(atk==='sweep'){e.f=0.11;e.sp=(e.sp||0)+0.45;shootE(e,Math.PI+Math.sin(e.sp)*0.9,es*0.85);}
        else if(atk==='spiral2'){e.f=0.09;e.sp=(e.sp||0)+0.32;shootE(e,e.sp,es*0.65);shootE(e,e.sp+Math.PI,es*0.65);}
        else if(atk==='flower'){e.f=0.16;e.sp=(e.sp||0)+0.2;for(let k=0;k<5;k++)shootE(e,e.sp+k*1.2566,es*0.6);}
        else if(atk==='wall'){ // a column of shots with one gap to slip through
          const gap=Math.floor(rnd(1,8));for(let k=0;k<10;k++){if(k===gap||k===gap+1)continue;
            ebullets.push({x:e.x-e.r,y:20+k*(H-40)/9,vx:-es*0.6,vy:0,r:6});}e.f=rate*1.6;}
      }
    }
    // collide with ship
    if(Math.hypot(e.x-p.x,e.y-p.y)<e.r+14){
      if(p.twin>0){ // Star Shield rams small enemies, ignores big ones
        if(e.type==='diver'||e.type==='drifter'||e.type==='sprayer'||e.type==='splitter'||e.type==='mini')killEnemy(e,true);
      }else if(e.type==='diver'||e.type==='drifter'||e.type==='sprayer'||e.type==='splitter'||e.type==='mini'){
        if(s.on&&s.t<=parryWin()*1.5){ // shield bash (front or rear)
          killEnemy(e,true);
        }else{hurt();killEnemy(e,false);}
      }else if(e.type==='tank'){hurt();e.x+=60;}
      else if(e.type==='boss'){hurt();}
    }
    // collide with drones (ram)
    if(!e.dead)for(const d of p.drones){
      if(!d.dead&&d.inv<=0&&Math.hypot(e.x-d.x,e.y-d.y)<e.r+12){
        d.inv=0.6;droneDamage(d);
        if(e.type!=='boss'){e.hp-=2;e.flash=0.08;boom(d.x,d.y,'#5cf',6,160);if(e.hp<=0)killEnemy(e,true);}
      }
    }
    if(e.x<-100||e.x>W+100||e.y<-100||e.y>H+100)e.dead=true;
  }

  // player bullets
  for(const b of bullets){
    if(b.miss){
      b.life-=dt;if(b.life<=0)b.dead=true;
      if(!b.target||b.target.dead||enemies.indexOf(b.target)<0){
        let bd=1e9;b.target=null;
        for(const e of enemies){const dd=Math.hypot(e.x-b.x,e.y-b.y);if(dd<bd){bd=dd;b.target=e;}}
      }
      const cur=Math.atan2(b.vy,b.vx);let na=cur;
      if(b.target){const a=Math.atan2(b.target.y-b.y,b.target.x-b.x);let d=a-cur;while(d>Math.PI)d-=6.283;while(d<-Math.PI)d+=6.283;na=cur+Math.max(-6*dt,Math.min(6*dt,d));}
      const sp=Math.min(700,Math.hypot(b.vx,b.vy)+700*dt);b.vx=Math.cos(na)*sp;b.vy=Math.sin(na)*sp;
      if(Math.random()<0.8)parts.push({x:b.x-Math.cos(na)*8,y:b.y-Math.sin(na)*8,vx:rnd(-20,20),vy:rnd(-20,20),t:0.35,max:0.35,col:Math.random()<0.5?'#fa4':'#ddd',sz:3});
    }
    if(b.ref&&b.target&&!b.target.dead&&enemies.indexOf(b.target)>=0){
      const a=Math.atan2(b.target.y-b.y,b.target.x-b.x),cur=Math.atan2(b.vy,b.vx);
      let d=a-cur;while(d>Math.PI)d-=6.283;while(d<-Math.PI)d+=6.283;
      const na=cur+Math.max(-9*dt,Math.min(9*dt,d)),sp=Math.hypot(b.vx,b.vy);
      b.vx=Math.cos(na)*sp;b.vy=Math.sin(na)*sp;
    }
    b.x+=b.vx*dt;b.y+=b.vy*dt;
    if(b.ref)parts.push({x:b.x,y:b.y,vx:0,vy:0,t:0.25,max:0.25,col:'#fff',sz:4});
    for(const e of enemies){
      if(e.dead||b.dead||(b.hit&&b.hit.has(e)))continue;
      if(Math.hypot(e.x-b.x,e.y-b.y)<e.r+b.r){
        e.hp-=b.dmg;SFX.hit();e.flash=0.08;
        boom(b.x,b.y,b.ref?'#fff':'#ff9',b.ref?8:3,120);
        if(b.ref){shake=Math.max(shake,5);if(!b.hit)b.hit=new Set();b.hit.add(e);b.pierce--;if(b.pierce<0)b.dead=true;}
        else if(b.pr>0){if(!b.hit)b.hit=new Set();b.hit.add(e);b.pr--;}
        else b.dead=true;
        if(b.miss){boom(b.x,b.y,'#fa4',12,200);shake=Math.max(shake,3);
          for(const o of enemies){if(o!==e&&!o.dead&&Math.hypot(o.x-b.x,o.y-b.y)<50+o.r){o.hp-=1;o.flash=0.08;if(o.hp<=0)killEnemy(o,true);}}}
        if(e.hp<=0)killEnemy(e,true);
      }
    }
    if(!b.miss&&(b.x>W+30||b.x<-30||b.y<-30||b.y>H+30))b.dead=true;
    if(b.miss&&(b.x>W+120||b.x<-120||b.y<-120||b.y>H+120))b.dead=true;
  }

  // enemy bullets
  for(const b of ebullets){
    b.x+=b.vx*dt;b.y+=b.vy*dt;
    if(b.x<-30||b.x>W+30||b.y<-30||b.y>H+30){b.dead=true;continue;}
    // wingmate shields soak shots
    let soaked=false;
    for(const d of p.drones){
      if(d.sh>0&&Math.hypot(b.x-d.x,b.y-d.y)<17+b.r){
        b.dead=true;soaked=true;droneDamage(d);boom(b.x,b.y,'#5cf',5,140);break;
      }
    }
    if(soaked)continue;
    const dx=b.x-p.x,dy=b.y-p.y,d=Math.hypot(dx,dy);
    if(s.on&&d<SHIELD_R+b.r){ // full ring: front AND rear
      b.dead=true;
      if(s.t<=parryWin()){ // raised right before impact -> REFLECT straight back
        s.parried=true;combo++;bestCombo=Math.max(bestCombo,combo);
        SFX.parry(combo);shake=Math.max(shake,6);p.pulse=0.2;vib(25);
        // straight reflection: sent back the way it came (no homing), faster and stronger
        const a=Math.atan2(-b.vy,-b.vx);
        bullets.push({x:b.x,y:b.y,vx:Math.cos(a)*1000,vy:Math.sin(a)*1000,dmg:5+pm.refDmg,r:9,ref:true,pierce:2,target:null});
        p.energy=Math.min(100,p.energy+6);
        addScore(25,b.x,b.y-14,'#8ff');
        boom(b.x,b.y,'#8ff',12,240);
      }else if(p.twin>0){ // Star Shield covers the cost
        SFX.absorb();boom(b.x,b.y,'#fd6',6,120);
      }else{ // held: ABSORB only (no reflect), costs energy
        p.energy-=SHIELD_ABSORB_COST*pm.shCost;SFX.absorb();boom(b.x,b.y,'#58f',6,120);
        if(p.energy<=0){p.energy=0;}
      }
    }else if(p.twin>0&&d<SHIELD_R+b.r){ // Star Shield: unlimited bubble, absorbs everything
      b.dead=true;boom(b.x,b.y,'#fd6',5,110);if(Math.random()<0.5)SFX.absorb();
    }else if(d<b.r+11&&p.inv<=0){
      b.dead=true;hurt();
    }
  }

  // powerups
  for(const w of pows){
    w.x-=70*dt;w.t+=dt;w.y+=Math.sin(w.t*3)*0.6;
    if(pm.magnet>28&&Math.hypot(w.x-p.x,w.y-p.y)<pm.magnet){const k=Math.min(1,7*dt);w.x+=(p.x-w.x)*k;w.y+=(p.y-w.y)*k;}
    if(Math.hypot(w.x-p.x,w.y-p.y)<28){
      w.dead=true;
      let label={R:'RAPID FIRE',W:'WIDE SHOT',H:'+HULL',N:'NOVA BLAST!',T:'STAR SHIELD!',M:'HOMING MISSILES!'}[w.k];
      if(w.k==='R')p.rapid=9*pm.powT;
      else if(w.k==='W')p.wide=11*pm.powT;
      else if(w.k==='H'){p.hp=Math.min(p.maxhp,p.hp+1);for(const d of p.drones)d.sh=d.max;if(p.drones.length)label='+HULL  WINGMATES REPAIRED';}
      else if(w.k==='N')nuke(p.x,p.y);
      else if(w.k==='T'){p.twin=10*pm.powT;SFX.ultReady();}
      else if(w.k==='M'){p.missile=10*pm.powT;p.mfire=0;}
      else if(w.k==='D'){label=addDrone();}
      if(w.k==='D')SFX.drone();else SFX.power();
      pops.push({x:w.x,y:w.y-16,t:0.9,txt:label,col:'#ff6'});
    }
    if(w.x<-20)w.dead=true;
  }

  // ultimate laser beam
  if(p.laser>0){
    const x0=p.x+20*p.dir,x1=p.dir>0?W+40:-40,lo=Math.min(x0,x1),hi=Math.max(x0,x1);
    const half=LASER_HALF*(0.7+0.3*Math.min(1,p.laser*3));
    for(const e of enemies){
      if(e.x+e.r>lo&&e.x-e.r<hi&&Math.abs(e.y-p.y)<half+e.r){
        e.hp-=LASER_DPS*dt;e.flash=0.05;
        if(Math.random()<0.4)boom(e.x-e.r*p.dir,e.y+rnd(-e.r,e.r),'#fff',1,160);
        if(e.hp<=0)killEnemy(e,true);
      }
    }
    for(const b of ebullets){if(b.x>lo&&b.x<hi&&Math.abs(b.y-p.y)<half+b.r){b.dead=true;boom(b.x,b.y,'#aff',2,80);}}
    shake=Math.max(shake,3);
  }
  // nova shockwaves: destroy what the ring front touches
  for(const n of novas){
    const r0=n.r;n.r+=820*dt;n.t+=dt;
    for(const e of enemies){
      if(e.dead||n.hit.has(e))continue;
      const dd=Math.hypot(e.x-n.x,e.y-n.y);
      if(dd-e.r<=n.r){
        n.hit.add(e);
        if(e.type==='boss'){e.hp-=25;e.flash=0.15;boom(e.x,e.y,'#fc8',20,300);if(e.hp<=0)killEnemy(e,true);}
        else killEnemy(e,true);
      }
    }
    for(const b of ebullets){if(!b.dead&&Math.hypot(b.x-n.x,b.y-n.y)<=n.r){b.dead=true;score+=10;boom(b.x,b.y,'#fc8',2,90);}}
    if(n.r>1150)n.done=true;
  }
  novas=novas.filter(n=>!n.done);
  // ult charge from points earned
  if(score>lastScore&&p.laser<=0){ult=Math.min(ULT_COST,ult+(score-lastScore)*pm.ultRate);}
  lastScore=score;
  if(ult>=ULT_COST&&!ultReadyShown){ultReadyShown=true;SFX.ultReady();pops.push({x:p.x,y:p.y-46,t:1.4,txt:'LASER READY!',col:'#aff'});}

  // particles etc.
  for(const q of parts){q.x+=q.vx*dt;q.y+=q.vy*dt;q.vx*=0.96;q.vy*=0.96;q.t-=dt;}
  for(const q of pops){q.y-=30*dt;q.t-=dt;}
  for(const st of stars){st.x-=st.z*(60+wave*2)*dt;if(st.x<0){st.x=W;st.y=Math.random()*H;}}
  shake=Math.max(0,shake-30*dt);flash=Math.max(0,flash-dt*2);

  enemies=enemies.filter(e=>!e.dead);
  bullets=bullets.filter(b=>!b.dead);
  ebullets=ebullets.filter(b=>!b.dead);
  pows=pows.filter(w=>!w.dead);
  parts=parts.filter(q=>q.t>0);
  pops=pops.filter(q=>q.t>0);
  p.drones=p.drones.filter(d=>!d.dead);
  if(parts.length>600)parts.splice(0,parts.length-600);
}
function droneDamage(d){
  d.sh--;
  if(d.sh<=0){
    d.dead=true;SFX.droneLost();boom(d.x,d.y,'#5cf',22,260);shake=Math.max(shake,5);vib(30);
    stats.lost++;pops.push({x:d.x,y:d.y-16,t:1.1,txt:d.name+' IS DOWN!',col:'#f88'});
  }else SFX.droneHit();
}
function dropPow(e){
  const p=player;
  let pool=[['R',p.rapid>0?0.5:2.5],['W',p.wide>0?0.5:2.5],['T',p.twin>0?0:1.6],['D',p.drones.length<MAX_DRONES?3:1],['N',1.2],['M',p.missile>0?0.4:2.2]];
  const hurtDrone=p.drones.some(d=>d.sh<d.max);
  if(p.hp<p.maxhp||hurtDrone)pool.push(['H',3]);
  pool=pool.filter(q=>q[0]!==lastDrop&&q[1]>0); // never the same power-up twice in a row
  let tot=0;for(const q of pool)tot+=q[1];
  let r=Math.random()*tot,k='R';
  for(const q of pool){r-=q[1];if(r<=0){k=q[0];break;}}
  lastDrop=k;pows.push({x:e.x,y:e.y,k,t:0});
}
function killEnemy(e,give){
  if(e.dead)return;
  e.dead=true;SFX.boom();
  const d=ET[e.type];
  if(e.type==='splitter'){ // burst into two fast minis
    for(const sg of [-1,1])enemies.push({type:'mini',x:e.x,y:e.y+sg*8,vx:-e.dir*-40+rnd(-60,60),vy:sg*160,hp:1,max:1,r:10,t:0,f:99,ph:0,by:e.y,state:0,dir:e.dir,life:6});
  }
  boom(e.x,e.y,e.col||d.col,e.type==='boss'?Math.round(70*e.sc):18,e.type==='boss'?420*Math.sqrt(e.sc):280);
  shake=Math.max(shake,e.type==='boss'?18:4);
  if(give){
    combo+=1;bestCombo=Math.max(bestCombo,combo);
    addScore(d.score,e.x,e.y,e.col||d.col);
    if(e.type==='boss'){pows.push({x:e.x,y:e.y,k:'N',t:0});pows.push({x:e.x-40,y:e.y+30,k:'D',t:0});}
    else if(Math.random()<(rogue?Math.min(0.35,0.07+player.m.lucky):0.14))dropPow(e);
    if(e.type==='boss'){for(const b of ebullets){b.dead=true;boom(b.x,b.y,'#fff',2,100);addScore(10);}
      slowT=1.4;flash=0.75;shake=28;banner='BOSS DOWN!';bannerT=2.6;SFX.bossDown();vib([80,40,120]);
      for(let k=0;k<3;k++)setTimeout(()=>{if(state==='play')boom(e.x+rnd(-e.r,e.r),e.y+rnd(-e.r,e.r),'#fff',30,380);},k*220);}
  }
}
function nuke(x,y){
  SFX.nuke();flash=0.9;shake=22;vib([60,40,80]);
  novas.push({x,y,r:10,t:0,hit:new Set()});
  boom(x,y,'#fff',40,500);boom(x,y,'#fc8',40,380);boom(x,y,'#f84',30,260);
}
function hurt(){
  const p=player;
  if(p.inv>0||p.twin>0)return;
  p.hp--;p.inv=1.4;combo=p.m.keep?Math.floor(combo/2):0;SFX.hurt();shake=14;flash=0.6;vib([40,30,40]);
  boom(p.x,p.y,'#f66',22,300);
  if(p.m.panic&&time>=p.panicAt&&p.hp>0){p.panicAt=time+p.m.panic;nuke(p.x,p.y);}
  if(p.hp<=0){
    if(p.m.revive>0){p.m.revive--;p.hp=Math.max(1,Math.ceil(p.maxhp/2));p.inv=3;nuke(p.x,p.y);banner='SECOND CHANCE!';bannerT=2;}
    else gameOver();
  }
}
let overNew=false;
function gameOver(){
  state='over';overT=0;SFX.over();
  boom(player.x,player.y,'#fff',60,400);
  let newBest=false;
  if(rogue){
    if(score>rbest){rbest=score;newBest=true;}
    if(wave>rbestWave)rbestWave=wave;
    try{localStorage.setItem('sl_rogue_best',rbest);localStorage.setItem('sl_rogue_wave',rbestWave);}catch(e){}
  }else{
    if(score>best){best=score;newBest=true;}
    if(wave>bestWave)bestWave=wave;
    try{localStorage.setItem('mm_best',best);localStorage.setItem('mm_wave',bestWave);}catch(e){}
  }
  overNew=newBest;
}

/* ---------- drawing ---------- */
function glow(col,b){ctx.shadowColor=col;ctx.shadowBlur=b;}
function noGlow(){ctx.shadowBlur=0;}
function drawShip(p){
  ctx.save();ctx.translate(p.x,p.y);ctx.scale(p.dir,1);ctx.rotate(p.tilt||0);
  if(p.inv>0&&Math.floor(time*20)%2===0)ctx.globalAlpha=0.35;
  glow('#4df',14);
  ctx.fillStyle='#0b2a4a';ctx.strokeStyle='#4df';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(24,0);ctx.lineTo(-16,-15);ctx.lineTo(-8,0);ctx.lineTo(-16,15);ctx.closePath();ctx.fill();ctx.stroke();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(2,0,3.5,0,6.28);ctx.fill();
  // engine
  noGlow();ctx.fillStyle='#fa4';ctx.beginPath();ctx.moveTo(-9,-4);ctx.lineTo(-20-Math.random()*8,0);ctx.lineTo(-9,4);ctx.fill();
  ctx.restore();
  // shield
  const s=p.sh;
  if(s.on){
    const parry=s.t<=parryWin();
    ctx.save();ctx.translate(p.x,p.y);
    glow(parry?'#fff':'#58f',parry?28:16);
    ctx.lineWidth=parry?7:4;ctx.strokeStyle=parry?'#ffffff':'rgba(110,150,255,'+(0.5+0.5*p.energy/100)+')';
    ctx.beginPath();ctx.arc(0,0,SHIELD_R,0,6.283);ctx.stroke();
    ctx.globalAlpha=parry?0.22:0.08;ctx.fillStyle=parry?'#8ff':'#58f';ctx.beginPath();ctx.arc(0,0,SHIELD_R,0,6.283);ctx.fill();
    ctx.restore();noGlow();
  }else if(s.broken>0){
    ctx.save();ctx.translate(p.x,p.y);ctx.strokeStyle='rgba(120,150,255,.35)';ctx.setLineDash([4,10]);ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,0,SHIELD_R,0,6.283);ctx.stroke();ctx.restore();
  }
  if(p.twin>0){ // Star Shield bubble
    const fade=p.twin<2?(Math.floor(time*10)%2?0.35:1):1;
    ctx.save();ctx.translate(p.x,p.y);ctx.globalAlpha=fade;glow('#fd6',22);
    ctx.strokeStyle='#ffd866';ctx.lineWidth=4;ctx.beginPath();ctx.arc(0,0,SHIELD_R+2,0,6.283);ctx.stroke();
    ctx.globalAlpha=0.12*fade;ctx.fillStyle='#ffd866';ctx.beginPath();ctx.arc(0,0,SHIELD_R+2,0,6.283);ctx.fill();
    ctx.globalAlpha=fade;noGlow();
    for(let i=0;i<3;i++){const a=time*2.2+i*2.094;drawStar(Math.cos(a)*(SHIELD_R+2),Math.sin(a)*(SHIELD_R+2),5,'#ffd866');}
    ctx.restore();
  }
  if(p.pulse>0){ctx.strokeStyle='rgba(140,255,255,'+(p.pulse*4)+')';ctx.lineWidth=3;ctx.beginPath();ctx.arc(p.x,p.y,44+(0.2-p.pulse)*220,0,6.28);ctx.stroke();}
  // wingmates
  for(const d of p.drones){
    ctx.save();ctx.translate(d.x,d.y);ctx.scale(d.slot>=2?-p.dir:p.dir,1);
    if(d.inv>0&&Math.floor(time*30)%2===0)ctx.globalAlpha=0.5;
    const dc=d.slot>=2?'#39f':'#5cf';glow(dc,10);
    ctx.fillStyle=d.slot>=2?'#0a1a3a':'#0b2240';ctx.strokeStyle=dc;ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(13,0);ctx.lineTo(-9,-8);ctx.lineTo(-5,0);ctx.lineTo(-9,8);ctx.closePath();ctx.fill();ctx.stroke();
    noGlow();ctx.fillStyle='#fa4';ctx.beginPath();ctx.moveTo(-5,-2);ctx.lineTo(-12-Math.random()*5,0);ctx.lineTo(-5,2);ctx.fill();
    // shield ring: brightness = remaining hits
    ctx.globalAlpha=Math.min(1,0.25+0.75*d.sh/d.max);ctx.strokeStyle=d.max>DRONE_SH?'#cef':dc;ctx.lineWidth=d.max>DRONE_SH?3:2;ctx.setLineDash(d.sh<d.max?[6,5]:[]);
    ctx.beginPath();ctx.arc(0,0,17,0,6.28);ctx.stroke();
    ctx.restore();
    if(d.rank>0){ctx.save();ctx.translate(d.x,d.y-24);ctx.fillStyle=d.rank===3?'#fff':'#cef';ctx.globalAlpha=0.9;
      for(let k=0;k<d.rank;k++){ctx.beginPath();ctx.moveTo(-5,k*-4+2);ctx.lineTo(0,k*-4-1);ctx.lineTo(5,k*-4+2);ctx.lineTo(5,k*-4+3.5);ctx.lineTo(0,k*-4+0.5);ctx.lineTo(-5,k*-4+3.5);ctx.closePath();ctx.fill();}
      ctx.restore();}
  }
}

function drawBlast(x,y){ // comic-style explosion burst

function drawEnemy(e){
  const d=ET[e.type];
  ctx.save();ctx.translate(e.x,e.y);
  if(e.dir>0)ctx.scale(-1,1);
  const fl=e.flash>0;if(e.flash)e.flash-=0.016;
  const ecol=e.col||d.col;
  glow(ecol,e.type==='boss'?22:12);ctx.fillStyle=fl?'#fff':'#12122a';ctx.strokeStyle=ecol;ctx.lineWidth=e.type==='boss'?3.5:2.5;

function draw(){

/* ---------- animated title screen: a squad flying a sortie behind the menu ---------- */
const TD={t:0,sx:-160,fire:0,spawn:0.4,bul:[],en:[],fx:[],rings:[],boss:{x:W+200,y:300,a:0}};
const EN_COLS=['#ffe03a','#f5a','#f83','#3f6'];
function updTitle(dt){
  TD.t+=dt;
  for(const st of stars){st.x-=st.z*90*dt;if(st.x<0){st.x=W;st.y=Math.random()*H;}}
  TD.sx+=95*dt;if(TD.sx>W+220)TD.sx=-180;
  const sy=446+Math.sin(TD.t*1.3)*12;TD.sy=sy;
  // squad guns
  TD.fire-=dt;
  if(TD.fire<=0&&TD.sx>-60){TD.fire=0.16;
    const L=[[0,0,1],[-34,-40,1],[-34,40,1],[-74,-22,-1],[-74,22,-1]];
    for(const [ox,oy,d] of L)TD.bul.push({x:TD.sx+ox+16*d,y:sy+oy,vx:640*d,tail:d<0});
  }
  // enemies stream in from the right (and a few from the left)
  TD.spawn-=dt;
  if(TD.spawn<=0){TD.spawn=rnd(0.45,0.9);const left=Math.random()<0.2;
    TD.en.push({x:left?-30:W+30,y:rnd(395,500),vx:left?rnd(70,110):-rnd(90,150),hp:2,c:EN_COLS[Math.floor(Math.random()*4)],ph:Math.random()*6,fl:0});}
  for(const b of TD.bul)b.x+=b.vx*dt;
  for(const e of TD.en){e.x+=e.vx*dt;e.y+=Math.sin(TD.t*2+e.ph)*0.6;e.fl=Math.max(0,e.fl-dt);
    for(const b of TD.bul){if(!b.dead&&Math.abs(b.x-e.x)<16&&Math.abs(b.y-e.y)<14){b.dead=true;e.hp--;e.fl=0.08;
      if(e.hp<=0&&!e.dead){e.dead=true;TD.rings.push({x:e.x,y:e.y,r:4,c:e.c});
        for(let k=0;k<16;k++){const a=rnd(0,6.283),sp=rnd(60,240);TD.fx.push({x:e.x,y:e.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,t:rnd(0.3,0.7),c:Math.random()<0.5?e.c:'#fff'});}}}}
    if(e.x<-60||e.x>W+60)e.dead=true;}
  for(const q of TD.fx){q.x+=q.vx*dt;q.y+=q.vy*dt;q.vx*=0.95;q.vy*=0.95;q.t-=dt;}
  for(const r of TD.rings){r.r+=160*dt;}
  TD.bul=TD.bul.filter(b=>!b.dead&&b.x>-40&&b.x<W+40);TD.en=TD.en.filter(e=>!e.dead);
  TD.fx=TD.fx.filter(q=>q.t>0);TD.rings=TD.rings.filter(r=>r.r<46);

  TD.boss.x-=14*dt;TD.boss.a+=0.25*dt;if(TD.boss.x<-260)TD.boss.x=W+260;
}

  if(state==='play'){
    if(hand){if(!paused)hand.t+=dt;}
    else if(!paused){let sdt=dt;if(slowT>0){slowT-=dt;sdt=dt*0.3;}update(sdt);}
    musicTick();
  }
  else{
    if(state==='over')overT+=dt;
    if(state==='title')updTitle(dt);
    else for(const st of stars){st.x-=st.z*40*dt;if(st.x<0){st.x=W;st.y=Math.random()*H;}}
    if(state==='over'){for(const q of parts){q.x+=q.vx*dt;q.y+=q.vy*dt;q.t-=dt;}parts=parts.filter(q=>q.t>0);shake=Math.max(0,shake-30*dt);}
  }
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
