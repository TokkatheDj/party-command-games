<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deep Sea Dive Quiz</title>
<style>
  /* Palette anchored on hue 178: deep teal, aqua, foam, coral accent, sand */
  :root{
    --deep:#04343a; --mid:#0a6c74; --aqua:#2fd4c9; --foam:#dffaf6; --coral:#ff7a6b; --sand:#ffe7a8;
    --ease:cubic-bezier(.2,.9,.3,1.2);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
    color:var(--foam); overflow:hidden; height:100vh;
    /* chalkboard-like underwater texture: layered gradients + fine dots */
    background:
      radial-gradient(circle at 20% 10%, rgba(47,212,201,.25), transparent 50%),
      radial-gradient(circle at 80% 90%, rgba(255,231,168,.08), transparent 40%),
      repeating-linear-gradient(45deg, rgba(255,255,255,.025) 0 2px, transparent 2px 6px),
      linear-gradient(180deg,#0a6c74 0%,#06484f 55%,#04343a 100%);
  }
  canvas#bubbles{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
  #app{position:relative;z-index:1;height:100%;display:flex;align-items:center;justify-content:center;padding:14px}
  .screen{display:none;width:100%;max-width:560px;max-height:100%;overflow:auto;text-align:center;animation:pop .5s var(--ease)}
  .screen.on{display:block}
  @keyframes pop{from{opacity:0;transform:translateY(20px) scale(.95)}to{opacity:1;transform:none}}
  /* soft blobby card */
  .card{
    background:rgba(4,52,58,.78); border:3px solid var(--aqua);
    border-radius:42px 28px 46px 30px / 30px 44px 28px 46px;
    padding:22px 18px; box-shadow:0 10px 30px rgba(0,0,0,.35), inset 0 0 30px rgba(47,212,201,.15);
  }
  h1{font-weight:900;letter-spacing:.12em;text-transform:uppercase;font-size:clamp(28px,8vw,48px);line-height:1.05;color:var(--sand);text-shadow:0 4px 0 var(--mid),0 8px 16px rgba(0,0,0,.4)}
  h2{font-weight:900;letter-spacing:.08em;font-size:clamp(20px,5vw,28px)}
  p.sub{margin:14px auto 20px;font-size:clamp(15px,4vw,18px);max-width:400px;line-height:1.4}
  .amigo{width:110px;height:110px}
  .fish{font-size:70px;display:inline-block;animation:swim 3s ease-in-out infinite}
  @keyframes swim{0%,100%{transform:translateX(-18px) rotate(-4deg)}50%{transform:translateX(18px) rotate(4deg)}}
  button{font:inherit;cursor:pointer;border:none;color:var(--deep);transition:transform .2s var(--ease),background .2s,box-shadow .2s}
  .big{
    background:var(--sand);font-weight:900;letter-spacing:.14em;font-size:22px;padding:16px 40px;
    border-radius:40px 28px 40px 28px / 28px 40px 28px 40px;box-shadow:0 6px 0 #c9a24a,0 10px 18px rgba(0,0,0,.35)
  }
  .big:hover{transform:translateY(-3px) scale(1.04)}
  .big:active{transform:translateY(4px);box-shadow:0 2px 0 #c9a24a}
  /* score badge */
  #hud{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px}
  .badge{background:var(--sand);color:var(--deep);font-weight:900;letter-spacing:.1em;padding:6px 16px;border-radius:30px 20px 30px 20px;font-size:clamp(16px,4vw,22px);box-shadow:0 4px 0 #c9a24a}
  .badge b{font-size:1.5em}
  #bar{height:12px;background:rgba(0,0,0,.35);border-radius:10px;overflow:hidden;margin-bottom:14px}
  #fill{height:100%;width:0;background:linear-gradient(90deg,var(--aqua),var(--sand));border-radius:10px;transition:width .5s var(--ease)}
  #q{font-size:clamp(18px,5vw,24px);font-weight:800;line-height:1.3;margin-bottom:16px;min-height:3em;display:flex;align-items:center;justify-content:center}
  #choices{display:grid;gap:10px}
  .choice{
    background:var(--foam);font-weight:800;font-size:clamp(15px,4vw,19px);padding:13px 14px;text-align:left;
    border-radius:26px 18px 26px 18px / 18px 26px 18px 26px;border:3px solid transparent;box-shadow:0 4px 0 #7fc9c3
  }
  .choice:hover:not(:disabled){transform:translateX(6px);background:#fff}
  .choice:disabled{cursor:default}
  .choice.right{background:#7df0a8;border-color:#1c9b55;animation:bounce .5s var(--ease)}
  .choice.wrong{background:#ffb1a8;border-color:var(--coral);animation:wobble .4s}
  @keyframes bounce{50%{transform:scale(1.05)}}
  @keyframes wobble{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
  #fb{min-height:48px;margin-top:12px;font-weight:700;font-size:clamp(14px,3.8vw,17px);line-height:1.35}
  #next{margin-top:6px;display:none;padding:11px 30px;font-size:18px}
  #stars{font-size:38px;margin:8px 0}
  #final{font-size:clamp(40px,12vw,64px);font-weight:900;color:var(--sand);letter-spacing:.1em}
  /* my own mute button (bottom-left; top-right is reserved for the kit's button) */
  #mute{position:fixed;left:12px;bottom:12px;z-index:5;width:46px;height:46px;border-radius:50%;background:var(--sand);font-size:22px;box-shadow:0 4px 0 #c9a24a}
  #mute:hover{transform:scale(1.1)}
</style>
</head>
<body><!--amigo:start--><svg aria-hidden="true" focusable="false" style="position:absolute;width:0;height:0;overflow:hidden"><defs><symbol id="amigo" viewBox="0 0 512 512"><defs><linearGradient id="amigo-face" gradientUnits="userSpaceOnUse" x1="0" y1="90" x2="0" y2="452"><stop offset="0" stop-color="#EEF1F6"/><stop offset="1" stop-color="#B8C0CC"/></linearGradient><radialGradient id="amigo-iris" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#6FA6FF"/><stop offset="1" stop-color="#2F6FE0"/></radialGradient></defs><circle cx="256" cy="256" r="256" fill="#111318"/><circle cx="256" cy="256" r="241.5" fill="none" stroke="#3A84FF" stroke-width="11"/><g fill="url(#amigo-face)"><ellipse cx="256" cy="298" rx="168" ry="126"/><circle cx="154" cy="172" r="78"/><circle cx="358" cy="172" r="78"/></g><g fill="#121E46"><circle cx="154" cy="172" r="65"/><circle cx="358" cy="172" r="65"/></g><g fill="url(#amigo-iris)"><circle cx="154" cy="172" r="54"/><circle cx="358" cy="172" r="54"/></g><g fill="#121E46"><circle cx="154" cy="172" r="41"/><circle cx="358" cy="172" r="41"/></g><g fill="#fff"><circle cx="136" cy="156" r="13"/><circle cx="340" cy="156" r="13"/><circle cx="170" cy="190" r="5"/><circle cx="374" cy="190" r="5"/></g><g fill="#121E46"><circle cx="226" cy="286" r="7"/><circle cx="286" cy="286" r="7"/><circle cx="130" cy="310" r="7"/><circle cx="382" cy="310" r="7"/></g><path d="M178 334 Q256 382 334 334" fill="none" stroke="#121E46" stroke-width="13" stroke-linecap="round"/></symbol></defs></svg><!--amigo:end-->
<canvas id="bubbles"></canvas>
<button id="mute" aria-label="Toggle sound" title="Mute / unmute">🔊</button>

<div id="app">
  <!-- Start screen -->
  <section class="screen on" id="start">
    <div class="card">
      <div class="fish">🐠</div>
      <h1>Deep Sea<br>Dive Quiz</h1>
      <p class="sub">Answer 10 ocean questions by tapping the right choice. Get feedback instantly and see how deep you can dive!</p>
      <button class="big" id="go">START</button>
    </div>
  </section>

  <!-- Quiz screen -->
  <section class="screen" id="quiz">
    <div class="card">
      <div id="hud">
        <div class="badge">Q <b id="qn">1</b>/10</div>
        <div class="badge">Score <b id="sc">0</b></div>
      </div>
      <div id="bar"><div id="fill"></div></div>
      <div id="q"></div>
      <div id="choices"></div>
      <div id="fb"></div>
      <button class="big" id="next">NEXT ➜</button>
    </div>
  </section>

  <!-- Results screen -->
  <section class="screen" id="end">
    <div class="card">
      <h2 id="rank"></h2>
      <div id="stars"></div>
      <div id="final"></div>
      <p class="sub" id="msg"></p>
      <button class="big" id="again">PLAY AGAIN</button>
    </div>
  </section>
</div>

<script>
/* ---------- Quiz data: correct answer is the index in "a" ---------- */
const QUESTIONS = [
  {q:"Which is the largest animal in the ocean?",c:["Great white shark","Blue whale","Giant squid","Whale shark"],a:1,f:"Blue whales can grow about 30 meters long, as long as 2½ school buses!"},
  {q:"How many hearts does an octopus have?",c:["1","2","3","8"],a:2,f:"Three hearts, and its blood is blue!"},
  {q:"What is a baby seahorse called?",c:["Pup","Fry","Calf","Kit"],a:1,f:"Baby seahorses are called fry. Dad seahorses carry the eggs!"},
  {q:"Which ocean is the biggest?",c:["Atlantic","Indian","Arctic","Pacific"],a:3,f:"The Pacific covers about a third of Earth's surface."},
  {q:"What do sea otters use to crack open shellfish?",c:["Rocks","Their tails","Seaweed","Sand"],a:0,f:"Otters keep a favorite rock in a pocket of skin!"},
  {q:"Coral reefs are made by tiny animals called...",c:["Sponges","Polyps","Plankton","Urchins"],a:1,f:"Coral polyps build hard skeletons that form reefs."},
  {q:"Which fish is famous for living in anemones?",c:["Clownfish","Tuna","Eel","Swordfish"],a:0,f:"Clownfish are safe from stings thanks to a special slime."},
  {q:"A group of jellyfish is called a...",c:["School","Pod","Smack","Herd"],a:2,f:"A group of jellyfish is a smack (or bloom)."},
  {q:"Which sea creature has five arms and no brain?",c:["Crab","Starfish","Lobster","Shrimp"],a:1,f:"Starfish have no brain, but their arms can sense light!"},
  {q:"About how much of Earth is covered by ocean?",c:["30%","50%","71%","90%"],a:2,f:"Oceans cover about 71% of our planet."}
];

/* ---------- State ---------- */
let idx = 0, score = 0, locked = false, muted = false;
const $ = id => document.getElementById(id);

/* ---------- Sound: uses the Amigo kit. Mute stops music and silences sfx ---------- */
function sfx(name){ if(!muted && window.Amigo) Amigo.sfx(name); }
function music(style){ if(window.Amigo) Amigo.music(muted ? 'off' : style); }
$('mute').onclick = () => {
  muted = !muted;
  $('mute').textContent = muted ? '🔇' : '🔊';
  music('dream');
  if(!muted) sfx('click');
};

/* ---------- Screens ---------- */
function show(id){
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('on'));
  $(id).classList.add('on');
}

/* ---------- Game flow ---------- */
function startGame(){
  idx = 0; score = 0;
  $('sc').textContent = 0;
  sfx('swoosh');
  music('dream');
  show('quiz');
  loadQ();
}

function loadQ(){
  locked = false;
  const item = QUESTIONS[idx];
  $('qn').textContent = idx + 1;
  $('fill').style.width = (idx / QUESTIONS.length * 100) + '%';
  $('q').textContent = item.q;
  $('fb').textContent = '';
  $('next').style.display = 'none';
  const box = $('choices'); box.innerHTML = '';
  item.c.forEach((text, i) => {
    const b = document.createElement('button');
    b.className = 'choice';
    b.textContent = ['A','B','C','D'][i] + ".  " + text;
    b.onclick = () => answer(i, b);
    box.appendChild(b);
  });
}

function answer(i, btn){
  if(locked) return;
  locked = true;
  const item = QUESTIONS[idx];
  const buttons = [...document.querySelectorAll('.choice')];
  buttons.forEach(b => b.disabled = true);
  if(i === item.a){
    score++;
    btn.classList.add('right');
    $('sc').textContent = score;
    $('fb').textContent = "🎉 Correct! " + item.f;
    sfx('correct');
    burst(btn);
  } else {
    btn.classList.add('wrong');
    buttons[item.a].classList.add('right');
    $('fb').textContent = "Not quite! " + item.f;
    sfx('oops'); // soft mistake sound only
  }
  $('fill').style.width = ((idx + 1) / QUESTIONS.length * 100) + '%';
  $('next').textContent = idx === QUESTIONS.length - 1 ? 'SEE RESULTS ➜' : 'NEXT ➜';
  $('next').style.display = 'inline-block';
}

function nextQ(){
  sfx('click');
  idx++;
  if(idx >= QUESTIONS.length) return finish();
  loadQ();
}

function finish(){
  show('end');
  let rank, stars;
  if(score === 10){rank="Ocean Legend!";stars="⭐⭐⭐";sfx('fanfare');}
  else if(score >= 7){rank="Master Diver!";stars="⭐⭐";sfx('tada');}
  else if(score >= 4){rank="Reef Explorer";stars="⭐";sfx('chime');}
  else {rank="Splashing Beginner";stars="🌊";sfx('sparkle');}
  $('rank').textContent = rank;
  $('stars').textContent = stars;
  $('final').textContent = score + " / 10";
  $('msg').textContent = score >= 7 ? "Amazing! You really know the sea." : "Great try! Dive in again and beat your score.";
  for(let k=0;k<25;k++) setTimeout(()=>spawn(Math.random()*innerWidth, innerHeight, 1), k*40);
}

$('go').onclick = startGame;
$('next').onclick = nextQ;
$('again').onclick = startGame;

/* ---------- Bubble background (canvas) ---------- */
const cv = $('bubbles'), ctx = cv.getContext('2d');
let bubbles = [];
function resize(){ cv.width = innerWidth; cv.height = innerHeight; }
addEventListener('resize', resize); resize();

// Create one bubble; "pop" bubbles are faster and bigger (celebration)
function spawn(x, y, fast){
  bubbles.push({x, y, r: 4 + Math.random()*(fast?16:12), v: (fast?1.5:.3) + Math.random()*(fast?2.5:1), w: Math.random()*6, a: .25 + Math.random()*.4});
}
// Burst of bubbles around the clicked answer
function burst(el){
  const r = el.getBoundingClientRect();
  for(let i=0;i<12;i++) spawn(r.left + Math.random()*r.width, r.top + r.height/2, 1);
}
for(let i=0;i<30;i++) spawn(Math.random()*innerWidth, Math.random()*innerHeight);

let last = performance.now();
function loop(now){
  const dt = Math.min(now - last, 50) / 16; last = now;
  ctx.clearRect(0, 0, cv.width, cv.height);
  if(Math.random() < .08) spawn(Math.random()*cv.width, cv.height + 10);
  bubbles = bubbles.filter(b => b.y + b.r > -10);
  for(const b of bubbles){
    b.y -= b.v * dt; b.w += .04 * dt;
    const x = b.x + Math.sin(b.w) * 14;
    ctx.beginPath(); ctx.arc(x, b.y, b.r, 0, 6.283);
    ctx.fillStyle = `rgba(223,250,246,${b.a * .25})`; ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = `rgba(223,250,246,${b.a})`; ctx.stroke();
    ctx.beginPath(); ctx.arc(x - b.r*.35, b.y - b.r*.35, b.r*.2, 0, 6.283);
    ctx.fillStyle = `rgba(255,255,255,${b.a + .2})`; ctx.fill();
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* Keyboard: keys 1-4 / A-D pick an answer, Enter goes next or starts */
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if($('quiz').classList.contains('on')){
    const map = {'1':0,'2':1,'3':2,'4':3,'a':0,'b':1,'c':2,'d':3};
    if(k in map && !locked){ const b = document.querySelectorAll('.choice')[map[k]]; if(b) b.click(); }
    else if(k === 'enter' && locked) nextQ();
  } else if(k === 'enter'){
    if($('start').classList.contains('on')) startGame();
    else if($('end').classList.contains('on')) startGame();
  }
});
/* 27 Nov 2026: a double-tap on START or PLAY AGAIN also answered question 1 (the second tap landed on the answer
   button under the finger), so 10 out of 10 was impossible. A tap on a button is ignored if it lands within 400 ms
   and a fingertip's width of a tap on another button that has since left the screen. */
(function () { let t0 = 0, el = null, x0 = 0, y0 = 0;
  document.addEventListener('click', e => { const b = e.target.closest && e.target.closest('button');
    if (!b || b.closest('[data-rapid]') || (!e.detail && !e.clientX && !e.clientY)) return;
    const now = performance.now(), gone = el && !(el.isConnected && el.getClientRects().length);
    if (now - t0 < 400 && b !== el && gone && Math.hypot(e.clientX - x0, e.clientY - y0) < 56) { e.stopPropagation(); e.preventDefault(); return; }
    t0 = now; el = b; x0 = e.clientX; y0 = e.clientY; }, true); })();
</script>
</body>
</html>
