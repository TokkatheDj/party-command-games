%225%22%2F%3E%3Ccircle%20cx%3D%22374%22%20cy%3D%22190%22%20r%3D%225%22%2F%3E%3C%2Fg%3E%3Cg%20fill%3D%22%23121E46%22%3E%3Ccircle%20cx%3D%22226%22%20cy%3D%22286%22%20r%3D%227%22%2F%3E%3Ccircle%20cx%3D%22286%22%20cy%3D%22286%22%20r%3D%227%22%2F%3E%3Ccircle%20cx%3D%22130%22%20cy%3D%22310%22%20r%3D%227%22%2F%3E%3Ccircle%20cx%3D%22382%22%20cy%3D%22310%22%20r%3D%227%22%2F%3E%3C%2Fg%3E%3Cpath%20d%3D%22M178%20334%20Q256%20382%20334%20334%22%20fill%3D%22none%22%20stroke%3D%22%23121E46%22%20stroke-width%3D%2213%22%20stroke-linecap%3D%22round%22%2F%3E%3C%2Fsvg%3E";</script><script src="https://amigo-build.vercel.app/amigo-kit.js" onerror="window.Amigo=window.Amigo||function(){var n=function(){},t={sprite:function(c,k,x,y,s,o){c.save();c.fillStyle=o?o.color||'rgb(79,140,255)':'rgb(79,140,255)';c.beginPath();c.arc(x,y,s*.4,0,7);c.fill();c.restore()},backdrop:function(c,w,h){c.fillStyle='rgb(30,34,60)';c.fillRect(0,0,w,h)},block:function(c,x,y,w,h,k){c.fillStyle=k||'rgb(122,92,62)';c.fillRect(x,y,w,h)},text:function(c,s,x,y,z,k,a){c.save();c.font='900 '+(z||28)+'px sans-serif';c.textAlign=a||'center';c.textBaseline='middle';c.fillStyle=k||'white';c.fillText(s,x,y);c.restore()},img:function(){return 'data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw=='},mute:function(){return false},shade:function(h){return h}};return new Proxy(t,{get:function(a,k){return k in a?a[k]:typeof k=='string'?/^(sprites|sounds|softSounds|songs|retroSongs|themes|drums|instruments)$/.test(k)?[]:n:undefined}})}()"></script><!--amigo:end-->
<meta charset="utf-8">

<title>Jungle Jumpers: Monkey Mango Dash</title>
<style>
  /* Palette (hue ~180 teal anchored, leafy jungle greens): deep teal #0b3b3c, jungle #1f7a5c, leaf #5fbf7a, mint #c8f0d8, mango #ffb830 */
  html,body{margin:0;height:100%;background:#0b3b3c;overflow:hidden;font-family:'Lucida Console',monospace;color:#c8f0d8;touch-action:none;user-select:none;-webkit-user-select:none}
  #wrap{position:relative;width:100vw;height:100vh}
  canvas{display:block;width:100%;height:100%}
  /* slim top bar */
  #bar{position:absolute;top:0;left:0;right:0;height:34px;display:flex;align-items:center;justify-content:space-between;padding:0 56px 0 12px;background:rgba(11,59,60,.85);border-bottom:2px solid #5fbf7a;font-size:14px;letter-spacing:1px}
  #bar b{color:#ffb830}
  /* overlay screens */
  .screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:rgba(11,59,60,.55);padding:16px;box-sizing:border-box}
  .screen.hide{display:none}
  h1{font-size:clamp(26px,7vw,52px);margin:6px 0;color:#c8f0d8;text-shadow:0 0 12px #5fbf7a,3px 3px 0 #0b3b3c}
  p{max-width:420px;font-size:clamp(13px,3.6vw,17px);line-height:1.4;margin:6px 0 14px}
  .big{font-family:inherit;font-size:clamp(20px,5vw,28px);padding:14px 40px;border:3px solid #c8f0d8;background:#1f7a5c;color:#fff;border-radius:40px;cursor:pointer;box-shadow:0 0 18px #5fbf7a}
  .big:active{transform:scale(.95)}
  .amigo{width:90px;height:90px;animation:idle 1.2s ease-in-out infinite}
  @keyframes idle{50%{transform:translateY(-8px) rotate(-4deg)}}
  /* touch buttons */
  #ctl{position:absolute;bottom:10px;left:0;right:0;display:flex;justify-content:space-between;padding:0 12px;pointer-events:none}
  #ctl div{display:flex;gap:10px}
  .tb{pointer-events:auto;width:76px;height:76px;border-radius:50%;border:3px solid #c8f0d8;background:rgba(31,122,92,.7);color:#fff;font-size:30px;display:flex;align-items:center;justify-content:center;cursor:pointer}
  .tb.on{background:#5fbf7a}

<body><!--amigo:start--><svg aria-hidden="true" focusable="false" style="position:absolute;width:0;height:0;overflow:hidden"><defs><symbol id="amigo" viewBox="0 0 512 512"><defs><linearGradient id="amigo-face" gradientUnits="userSpaceOnUse" x1="0" y1="90" x2="0" y2="452"><stop offset="0" stop-color="#EEF1F6"/><stop offset="1" stop-color="#B8C0CC"/></linearGradient><radialGradient id="amigo-iris" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#6FA6FF"/><stop offset="1" stop-color="#2F6FE0"/></radialGradient></defs><circle cx="256" cy="256" r="256" fill="#111318"/><circle cx="256" cy="256" r="241.5" fill="none" stroke="#3A84FF" stroke-width="11"/><g fill="url(#amigo-face)"><ellipse cx="256" cy="298" rx="168" ry="126"/><circle cx="154" cy="172" r="78"/><circle cx="358" cy="172" r="78"/></g><g fill="#121E46"><circle cx="154" cy="172" r="65"/><circle cx="358" cy="172" r="65"/></g><g fill="url(#amigo-iris)"><circle cx="154" cy="172" r="54"/><circle cx="358" cy="172" r="54"/></g><g fill="#121E46"><circle cx="154" cy="172" r="41"/><circle cx="358" cy="172" r="41"/></g><g fill="#fff"><circle cx="136" cy="156" r="13"/><circle cx="340" cy="156" r="13"/><circle cx="170" cy="190" r="5"/><circle cx="374" cy="190" r="5"/></g><g fill="#121E46"><circle cx="226" cy="286" r="7"/><circle cx="286" cy="286" r="7"/><circle cx="130" cy="310" r="7"/><circle cx="382" cy="310" r="7"/></g><path d="M178 334 Q256 382 334 334" fill="none" stroke="#121E46" stroke-width="13" stroke-linecap="round"/></symbol></defs></svg><!--amigo:end-->
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="bar"><span>LEVEL <b id="lv">1</b>/3</span><span>🥭 <b id="sc">0</b></span><span id="li">♥♥♥</span></div>
  <div id="ctl">
    <div><span class="tb" id="bL">◀</span><span class="tb" id="bR">▶</span></div>
    <div><span class="tb" id="bJ">▲</span></div>
  </div>
  <div class="screen" id="start">
    <svg class="amigo" viewBox="0 0 512 512" role="img" aria-label="Amigo"><use href="#amigo"/></svg>
    <h1>Jungle Jumpers</h1>
    <p>Help the monkey run and jump across the treetops, grab every mango, and dodge the spikes and snakes!</p>
    <p style="font-size:12px;opacity:.8">Arrow keys / WASD + Space, or use the big buttons.</p>
    <button class="big" id="go">START</button>
  </div>
  <div class="screen hide" id="msg">
    <h1 id="mt"></h1><p id="mp"></p>
    <button class="big" id="mb">NEXT</button>
  </div>
</div>
<script>
// ---------- Setup ----------
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const $ = id => document.getElementById(id);
let W = 0, H = 0, S = 1;           // canvas size and scale
function resize(){ cv.width = W = innerWidth; cv.height = H = innerHeight; S = Math.min(W/640, H/360); }
addEventListener('resize', resize); resize();

// ---------- Level data: platforms [x,y,w], coins [x,y], hazards [x,y,type] (world units: 360 high) ----------
const LEVELS = [
 { len:1800, theme:'day',
   plat:[[0,300,400],[460,260,200],[720,300,250],[1040,250,180],[1280,290,220],[1560,300,300]],
   coin:[[200,260],[520,220],[560,220],[800,260],[1100,210],[1340,250],[1380,250],[1640,260]],
   haz:[[330,282,'spike'],[860,282,'spike'],[1420,272,'spike']] },
 { len:2200, theme:'sunset',
   plat:[[0,300,300],[360,250,140],[560,210,140],[780,280,200],[1050,240,140],[1260,290,200],[1540,230,150],[1760,280,160],[1980,300,260]],
   coin:[[150,260],[420,210],[620,170],[860,240],[1110,200],[1330,250],[1600,190],[1820,240],[2100,260]],
   haz:[[240,282,'spike'],[900,262,'snake'],[1330,272,'spike'],[1820,262,'snake'],[2080,282,'spike']] },
 { len:2600, theme:'night',
   plat:[[0,300,260],[330,260,120],[520,220,120],[710,270,150],[930,230,120],[1120,280,160],[1350,240,120],[1540,200,120],[1730,260,150],[1960,300,150],[2180,250,130],[2380,300,260]],
   coin:[[120,260],[390,220],[580,180],[780,230],[990,190],[1190,240],[1410,200],[1600,160],[1800,220],[2240,210],[2500,260]],
   haz:[[200,282,'spike'],[780,252,'snake'],[1200,262,'snake'],[1780,242,'spike'],[2020,282,'spike'],[2450,282,'snake']] }
];

// ---------- State ----------
let lvl=0, score=0, lives=3, state='title', t=0, camX=0, slow=0, trail=[];
let P, coins, haz, leaves=[], safe=null; // safe = the last platform the monkey stood on
const keys={L:0,R:0,J:0};

function loadLevel(){
  const L=LEVELS[lvl];
  P={x:40,y:200,vx:0,vy:0,on:false,face:1,inv:0}; safe=null;
  coins=L.coin.map(c=>({x:c[0],y:c[1],got:false}));
  // Snakes walk back and forth along their platform; spikes stay put
  haz=L.haz.map(h=>{ const p=L.plat.find(q=>h[0]>=q[0]&&h[0]<=q[0]+q[2]&&q[1]>=h[1]);
    return {x:h[0],y:h[1],type:h[2],x0:p?p[0]+16:h[0],x1:p?p[0]+p[2]-16:h[0],dir:1,dead:0}; });
  trail=[]; camX=0;
  $('lv').textContent=lvl+1;
}
function hud(){ $('sc').textContent=score; $('li').textContent='♥'.repeat(Math.max(lives,0))+'♡'.repeat(Math.max(3-lives,0)); }
function show(id,on){ $(id).classList.toggle('hide',!on); }

// ---------- Input ----------
addEventListener('keydown',e=>{
  if(['ArrowLeft','a','A'].includes(e.key)) keys.L=1;
  if(['ArrowRight','d','D'].includes(e.key)) keys.R=1;
  if(['ArrowUp','w','W',' '].includes(e.key)){ keys.J=1; e.preventDefault(); }
});
addEventListener('keyup',e=>{
  if(['ArrowLeft','a','A'].includes(e.key)) keys.L=0;
  if(['ArrowRight','d','D'].includes(e.key)) keys.R=0;
  if(['ArrowUp','w','W',' '].includes(e.key)) keys.J=0;
});
function bindBtn(id,k){
  const b=$(id);
  const on=e=>{e.preventDefault();keys[k]=1;b.classList.add('on');};
  const off=e=>{e.preventDefault();keys[k]=0;b.classList.remove('on');};
  b.addEventListener('touchstart',on,{passive:false}); b.addEventListener('touchend',off); b.addEventListener('touchcancel',off);
  b.addEventListener('mousedown',on); b.addEventListener('mouseup',off); b.addEventListener('mouseleave',off);
}
bindBtn('bL','L'); bindBtn('bR','R'); bindBtn('bJ','J');

// ---------- Game flow ----------
$('go').onclick=()=>{ score=0; lives=3; lvl=0; loadLevel(); hud(); state='play'; show('start',false); Amigo.music('lofi'); Amigo.sfx('chime'); };
let nextAction=null;
$('mb').onclick=()=>{ show('msg',false); Amigo.sfx('click'); if(nextAction) nextAction(); };
function message(title,text,btn,fn){ state='pause'; $('mt').textContent=title; $('mp').textContent=text; $('mb').textContent=btn; nextAction=fn; show('msg',true); }

function hurt(){
  if(P.inv>0) return;
  lives--; hud(); Amigo.sfx('oops'); Amigo.shake(6); P.inv=1.5; P.vy=-300; slow=0.5;
  if(lives<=0){ Amigo.music('off'); message('Game Over','The jungle wins this time. You gathered '+score+' mangoes!','TRY AGAIN',()=>{score=0;lives=3;lvl=0;loadLevel();hud();state='play';Amigo.music('lofi');}); }
}
function win(){
  Amigo.sfx('tada');
  if(lvl>=2){ Amigo.music('off'); Amigo.sfx('fanfare'); message('You Did It!','Jungle champion! Final score: '+score+' mangoes. 🏆','PLAY AGAIN',()=>{score=0;lives=3;lvl=0;loadLevel();hud();state='play';Amigo.music('lofi');}); }
  else message('Level '+(lvl+1)+' Clear!','Deep breath... the next part of the jungle is trickier.','NEXT LEVEL',()=>{lvl++;loadLevel();state='play';});
}

// ---------- Update ----------
function update(dt){
  const L=LEVELS[lvl]; if(slow>0){ slow-=dt; dt*=0.35; }
  const sp=190, g=900, SNAKE_SPEED=45; // SNAKE_SPEED: how fast snakes walk
  P.vx = (keys.R-keys.L)*sp; if(P.vx) P.face=P.vx>0?1:-1;
  if(keys.J && P.on){ P.vy=-400; P.on=false; Amigo.sfx('swoosh'); }
  P.vy+=g*dt; const oy=P.y;
  P.x+=P.vx*dt; P.y+=P.vy*dt; P.on=false;
  if(P.x<0)P.x=0;
  // platform collisions (land from above only)
  for(const p of L.plat){
    if(P.x+10>p[0] && P.x-10<p[0]+p[2] && oy+20<=p[1]+4 && P.y+20>=p[1] && P.vy>=0){ P.y=p[1]-20; P.vy=0; P.on=true; safe=p; }
  }
  if(P.y>420){ lives--; hud(); Amigo.sfx('splash'); if(lives<=0){ hurtOver(); return; } loadRespawn(); }
  if(P.inv>0)P.inv-=dt;
  // coins
  for(const c of coins) if(!c.got && Math.abs(c.x-P.x)<22 && Math.abs(c.y-P.y)<26){ c.got=true; score++; hud(); Amigo.sfx('sparkle'); Amigo.burst(c.x-camX*1,c.y,'#ffb830',8); Amigo.float(c.x,c.y,'+1','#ffb830'); }
  // hazards (near miss triggers slow-mo)
  for(const h of haz){
    if(h.dead){ h.dead+=dt; continue; }
    if(h.type==='snake'){ h.x+=h.dir*SNAKE_SPEED*dt; if(h.x<h.x0){h.x=h.x0;h.dir=1;} if(h.x>h.x1){h.x=h.x1;h.dir=-1;} }
    const dx=Math.abs(h.x-P.x), dy=Math.abs(h.y-P.y);
    // stomp: land on a snake from above to squash it and bounce
    if(h.type==='snake' && dx<24 && P.vy>0 && P.y<h.y-4 && P.y>h.y-36){ h.dead=0.001; P.vy=-330; score++; hud(); Amigo.sfx('pop'); Amigo.float(h.x,h.y-20,'STOMP! +1','#c8f0d8'); continue; }
    if(dx<18 && dy<22) hurt();
    else if(dx<34 && dy<30 && slow<=0 && P.inv<=0 && Math.random()<.04){ slow=0.35; Amigo.sfx('whistle'); }
  }
  // finish
  if(P.x>L.len-60){ win(); }
  // trail + camera
  trail.push({x:P.x,y:P.y,a:1}); if(trail.length>12)trail.shift();
  const target=P.x-W/S*0.35; camX+=(target-camX)*0.1; if(camX<0)camX=0;
  t+=dt;
}
// After a fall, come back on the last platform the monkey stood on (not over a gap), a little in from its edges
function loadRespawn(){ const p=safe||LEVELS[lvl].plat[0];
  // the spot on that platform closest to where you fell that is not right next to a spike or snake
  const want=Math.min(Math.max(P.x,p[0]+30),p[0]+p[2]-30); let best=want, bd=1e9;
  for(let x=p[0]+20;x<=p[0]+p[2]-20;x+=5){ if(haz.some(h=>!h.dead&&Math.abs(h.x-x)<50&&Math.abs(h.y-(p[1]-18))<30)) continue; if(Math.abs(x-want)<bd){bd=Math.abs(x-want);best=x;} }
  P.x=best; P.y=p[1]-60; P.vx=0; P.vy=0; P.inv=1.5; }
function hurtOver(){ lives=0; hud(); Amigo.music('off'); Amigo.sfx('oops'); message('Game Over','You fell into the river! Mangoes: '+score,'TRY AGAIN',()=>{score=0;lives=3;lvl=0;loadLevel();hud();state='play';Amigo.music('lofi');}); }

// ---------- Draw ----------
function drawHills(){
  // layered line-art hills and trees for parallax
  for(let layer=0;layer<3;layer++){
    const par=0.15+layer*0.15, col=['#144c47','#1a6350','#238060'][layer];
    ctx.fillStyle=col; ctx.strokeStyle='#5fbf7a'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.moveTo(0,H);
    for(let x=0;x<=W+40;x+=40){
      const wx=x/S+camX*par; ctx.lineTo(x,H-(60+layer*40+Math.sin(wx*0.01+layer*2)*35+Math.sin(wx*0.027)*15)*S);
    }
    ctx.lineTo(W,H); ctx.closePath(); ctx.fill(); ctx.stroke();
  }
}
function drawPlatform(p){
  const x=(p[0]-camX)*S,y=p[1]*S,w=p[2]*S;
  if(x>W||x+w<0)return;
  Amigo.block(ctx,x,y,w,(400-p[1])*S,'#1f7a5c',8*S);
  ctx.strokeStyle='#5fbf7a'; ctx.lineWidth=3*S; ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+w,y); ctx.stroke(); // grassy top line
  ctx.strokeStyle='#c8f0d8'; ctx.lineWidth=1.5; // line-art leaf ticks
  for(let i=8*S;i<w;i+=22*S){ ctx.beginPath(); ctx.moveTo(x+i,y); ctx.lineTo(x+i-3*S,y-6*S); ctx.moveTo(x+i,y); ctx.lineTo(x+i+3*S,y-6*S); ctx.stroke(); }
}
function draw(){
  const L=LEVELS[lvl];
  ctx.save(); Amigo.camera(ctx,1/60);
  Amigo.backdrop(ctx,W,H,L.theme,t);
  drawHills();
  L.plat.forEach(drawPlatform);
  // finish flag
  Amigo.sprite(ctx,'flag',(L.len-30-camX)*S,(L.plat[L.plat.length-1][1]-24)*S,56*S);
  coins.forEach(c=>{ if(!c.got) Amigo.sprite(ctx,'coin',(c.x-camX)*S,(c.y+Math.sin(t*4+c.x)*3)*S,24*S); });
  haz.forEach(h=>{ if(h.dead>0.4) return; // a squashed snake flattens, then disappears
    Amigo.sprite(ctx,h.type==='snake'?'slime':'spike',(h.x-camX)*S,(h.y+(h.dead?8:0))*S,28*S,{color:h.type==='snake'?'#7acf3a':undefined,look:h.type==='snake'?h.dir:Math.sin(t*2),flip:h.dir<0,squash:h.dead?0.35:1,alpha:h.dead?1-h.dead/0.4:1}); });
  // trail behind the monkey
  trail.forEach((p,i)=>Amigo.sprite(ctx,'hero',(p.x-camX)*S,p.y*S,(24+i)*S,{color:'#8b5a2b',alpha:i/trail.length*0.25}));
  // monkey (blinks when invincible)
  if(P.inv<=0||Math.floor(t*14)%2) Amigo.sprite(ctx,'hero',(P.x-camX)*S,P.y*S,44*S,{color:'#a0652d',flip:P.face<0,shadow:true,squash:P.on?1:0.9,look:P.face});
  Amigo.fx(ctx,1/60);
  ctx.restore();
  if(slow>0){ ctx.fillStyle='rgba(200,240,216,.12)'; ctx.fillRect(0,0,W,H); } // slow-mo tint
}

// ---------- Main loop ----------
let last=performance.now();
function loop(now){
  const dt=Math.min((now-last)/1000,0.05); last=now;
  if(state==='play') update(dt); else t+=dt;
  draw(); requestAnimationFrame(loop);
}
loadLevel(); hud(); requestAnimationFrame(loop);
</script>
