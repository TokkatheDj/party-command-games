<!-- CONCEPT: REACTION / TIMING (catch-it-mid-air order filling) - Pop-Pop Popcorn Stand: Kernel the hamster runs a popcorn stand and silly smiling popcorn puffs in six flavours (butter, strawberry, blueberry, apple, orange, grape - each with its own colour AND symbol) pop out of the big pot in slow arcs; an animal guest shows an order card ("3 butter" or later "2 strawberry + 1 apple") and kids tap the right puffs while they're in the air to catch them into the cone - a wrong flavour just wobbles back into the pot ("that's grape - we need butter!"), a missed one simply falls back for another go; five shows grow from 2 flavours and slow pops to Big Movie Night with 6 flavours and two-flavour orders, with a Hint glow, read-aloud orders, arrow-key + Enter play, saved stars per show and a Popcorn Champ ribbon. No timer, no losing. Ages 4-9. [style: Paper Cutout / sound: Woodblock Kit] -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Pop-Pop Popcorn Stand</title>
<style>
:root{
  --bg:#fdf6e3; --panel:#ffffff; --ink:#1b1030; --muted:#5a4e6e;
  --btn:#f4a259; --btnInk:#1b1030; --dark:#1b1030; --onDark:#ffffff;
  --red:#e4572e; --gold:#ffd23f;
  --line:3px solid var(--ink); --shadow:4px 4px 0 var(--ink);
  --font:"Fredoka","Trebuchet MS","Comic Sans MS",sans-serif;
}
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:var(--font);touch-action:manipulation;user-select:none;-webkit-user-select:none}
button{font-family:inherit;cursor:pointer;color:var(--btnInk);background:var(--btn);border:var(--line);
  border-radius:14px;box-shadow:var(--shadow);font-weight:700;min-height:48px;min-width:48px;
  font-size:clamp(15px,4vw,20px);padding:6px 14px;transition:transform .08s}
button:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
button:focus-visible{outline:4px solid #0977d0;outline-offset:3px}
button[aria-pressed="true"]{background:var(--dark);color:var(--onDark)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#app{height:100%;display:flex;flex-direction:column;max-width:820px;margin:0 auto;padding:8px 10px 10px;gap:8px}
header{display:flex;align-items:center;gap:8px}
h1{margin:0;font-size:clamp(22px,6.4vw,36px);line-height:1.05;flex:1;
  background:linear-gradient(90deg,#b0005a,#6b2fb3);-webkit-background-clip:text;background-clip:text;color:transparent}
.icons{display:flex;gap:6px}
.icons button{padding:4px 8px;font-size:20px}
#screenMenu,#screenPlay{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px}
[hidden]{display:none !important}
.card{background:var(--panel);border:var(--line);border-radius:16px;box-shadow:var(--shadow);padding:10px 12px}
.tiltL{transform:rotate(-1.2deg)} .tiltR{transform:rotate(1deg)}
.intro p{margin:0;font-size:clamp(14px,3.8vw,18px);color:var(--muted)}
.intro p b{color:var(--ink)}
#showList{flex:1;min-height:0;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
  gap:12px;padding:6px 6px 8px 2px;grid-auto-rows:max-content}
.showBtn{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 8px;border-radius:16px;background:var(--panel)}
.showBtn:nth-child(odd){transform:rotate(-1.5deg)} .showBtn:nth-child(even){transform:rotate(1.3deg)}
.showBtn .big{font-size:34px;line-height:1}
.showBtn .nm{font-size:clamp(15px,4vw,19px)}
.showBtn .st{font-size:18px;letter-spacing:2px}
.showBtn .ds{font-size:13px;color:var(--muted);font-weight:600}
#ribbon{text-align:center;font-weight:700;font-size:clamp(15px,4vw,19px)}
/* play */
#orderCard{display:flex;align-items:center;gap:10px;min-height:86px}
#guest{font-size:44px;line-height:1;flex:none}
#orderBody{flex:1;min-width:0}
#orderText{font-weight:700;font-size:clamp(16px,4.3vw,21px)}
#slots{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.slot{width:30px;height:30px;border-radius:50%;border:3px dashed var(--ink);display:flex;align-items:center;
  justify-content:center;font-size:15px;font-weight:700;background:#fff}
.slot.full{border-style:solid;box-shadow:2px 2px 0 var(--ink);animation:pop .3s}
@keyframes pop{0%{transform:scale(.3)}70%{transform:scale(1.25)}100%{transform:scale(1)}}
#progress{font-size:14px;color:var(--muted);font-weight:600;text-align:right;flex:none;max-width:70px}
#stageWrap{flex:1;min-height:160px;position:relative;border:var(--line);border-radius:16px;box-shadow:var(--shadow);
  background:#fff;overflow:hidden}
#stage{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#msg{height:46px;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:700;
  font-size:clamp(14px,3.9vw,18px);line-height:1.15;overflow:hidden}
.bar{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.bar button{flex:1;max-width:200px}
/* overlay */
#over{position:fixed;inset:0;background:rgba(253,246,227,.92);display:flex;align-items:center;justify-content:center;z-index:5;padding:16px}
#overCard{max-width:380px;width:100%;text-align:center;display:flex;flex-direction:column;gap:10px}
#overCard h2{margin:0;font-size:clamp(24px,7vw,34px)}
#overStars{font-size:44px;letter-spacing:6px}
#overText{margin:0;font-size:17px;color:var(--muted);font-weight:600}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Pop-Pop Popcorn Stand</h1>
    <div class="icons">
      <button id="muteBtn" aria-pressed="false" aria-label="Sound off">🔊</button>
    </div>
  </header>

  <section id="screenMenu" aria-label="Choose a show">
    <div class="card intro tiltL">
      <p><b>Catch the popcorn!</b> Puffs pop out of the pot. Tap the flavours your animal guest wants while they fly, and fill their cone. Wrong ones just pop back in!</p>
    </div>
    <div id="showList"></div>
    <div id="ribbon" class="card tiltR"></div>
  </section>

  <section id="screenPlay" aria-label="Popcorn stand" hidden>
    <div id="orderCard" class="card tiltL">
      <div id="guest" aria-hidden="true">🐻</div>
      <div id="orderBody">
        <div id="orderText">Bear wants…</div>
        <div id="slots" aria-hidden="true"></div>
      </div>
      <div id="progress"></div>
    </div>
    <div id="stageWrap">
      <canvas id="stage" aria-label="Popcorn popping out of the pot. Tap a popcorn to catch it, or use arrow keys and Enter."></canvas>
    </div>
    <div id="msg" role="status" aria-live="polite"></div>
    <div class="bar">
      <button id="hintBtn">💡 Hint</button>
      <button id="sayBtn">🗣️ Say it</button>
      <button id="menuBtn">🎬 Shows</button>
    </div>
  </section>
</div>

<div id="over" hidden>
  <div id="overCard" class="card tiltR" role="dialog" aria-modal="true" aria-labelledby="overTitle">
    <h2 id="overTitle">Show complete!</h2>
    <div id="overStars" aria-hidden="true">⭐⭐⭐</div>
    <p id="overText"></p>
    <button id="nextBtn">▶️ Next show</button>
    <button id="againBtn">🔁 Play again</button>
    <button id="toMenuBtn">🎬 All shows</button>
  </div>
</div>

<script>
const load = (k, d) => { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } };
const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
const KEY = 'cowork-popcorn-stand-';
const $ = id => document.getElementById(id);

/* ---------- data ---------- */
const FLAVS = [
  {name:'butter',     col:'#ffd23f', sym:'●'},       // ●
  {name:'strawberry', col:'#ff8fb8', sym:'♥︎'}, // ♥
  {name:'blueberry',  col:'#6ec6ff', sym:'◆'},       // ◆
  {name:'apple',      col:'#7ed957', sym:'♣︎'}, // ♣
  {name:'orange',     col:'#ff9f1c', sym:'★'},       // ★
  {name:'grape',      col:'#c9a2ff', sym:'▲'}        // ▲
];
const GUESTS = [['🐻','Bear'],['🐰','Bunny'],['🦊','Fox'],['🐼','Panda'],['🐸','Frog'],['🐯','Tiger'],
  ['🐨','Koala'],['🐷','Piggy'],['🐵','Monkey'],['🦁','Lion'],['🐮','Cow'],['🐔','Hen']];
const SHOWS = [
  {name:'Morning Matinee', icon:'🌅', desc:'2 flavours', flav:[0,1], guests:4, cmin:1, cmax:3, multi:false, T:3.6, every:1.25, max:3},
  {name:'Afternoon Show',  icon:'☀️', desc:'3 flavours', flav:[0,1,2], guests:4, cmin:2, cmax:4, multi:false, T:3.3, every:1.1, max:4},
  {name:'Double Scoop',    icon:'🍦', desc:'mix 2 flavours', flav:[0,1,2,3], guests:4, cmin:1, cmax:3, multi:true, T:3.1, every:1.0, max:4},
  {name:'Rainbow Rush',    icon:'🌈', desc:'5 flavours', flav:[0,1,2,3,4], guests:5, cmin:1, cmax:4, multi:true, T:2.9, every:0.9, max:5},
  {name:'Big Movie Night', icon:'🎬', desc:'all 6 flavours', flav:[0,1,2,3,4,5], guests:6, cmin:2, cmax:5, multi:true, T:2.75, every:0.85, max:5}
];
let stars = load(KEY + 'stars', [0,0,0,0,0]);
if (!Array.isArray(stars) || stars.length !== SHOWS.length) stars = [0,0,0,0,0];
let muted = !!load(KEY + 'muted', false);

/* ---------- sound: Woodblock Kit ---------- */
let ac = null, master = null, noiseBuf = null;
function audio() {
  if (ac) { if (ac.state === 'suspended') ac.resume(); return ac; }
  try {
    ac = new (window.AudioContext || window.webkitAudioContext)();
    const comp = ac.createDynamicsCompressor();
    comp.threshold.value = -16; comp.ratio.value = 4;
    master = ac.createGain(); master.gain.value = muted ? 0 : 0.8;
    master.connect(comp); comp.connect(ac.destination);
    noiseBuf = ac.createBuffer(1, ac.sampleRate * 0.5, ac.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  } catch (e) { ac = null; }
  return ac;
}
function env(g, t, peak, atk, rel) {
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(peak, t + atk);
  g.gain.exponentialRampToValueAtTime(0.0001, t + atk + rel);
}
// bandpassed noise click (the "pop")
function click(freq = 2200, peak = 0.6, when = 0, len = 0.03) {
  if (!audio() || muted) return;
  const t = ac.currentTime + when;
  const s = ac.createBufferSource(); s.buffer = noiseBuf;
  const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = freq; bp.Q.value = 3;
  const g = ac.createGain(); env(g, t, peak, 0.005, len);
  s.connect(bp); bp.connect(g); g.connect(master);
  s.start(t, Math.random() * 0.3); s.stop(t + len + 0.05);
}
// pitched woodblock (triangle)
function block(freq = 800, peak = 0.5, when = 0, len = 0.06) {
  if (!audio() || muted) return;
  const t = ac.currentTime + when;
  const o = ac.createOscillator(); o.type = 'triangle'; o.frequency.setValueAtTime(freq, t);
  o.frequency.exponentialRampToValueAtTime(freq * 0.92, t + len);
  const g = ac.createGain(); env(g, t, peak, 0.006, len);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + len + 0.05);
  click(freq * 2.6, peak * 0.35, when, 0.015);
}
// shaker (highpassed noise)
function shaker(peak = 0.35, when = 0, len = 0.12) {
  if (!audio() || muted) return;
  const t = ac.currentTime + when;
  const s = ac.createBufferSource(); s.buffer = noiseBuf;
  const hp = ac.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 5000;
  const g = ac.createGain(); env(g, t, peak, 0.02, len);
  s.connect(hp); hp.connect(g); g.connect(master); s.start(t); s.stop(t + len + 0.05);
}
const SCALE = [523, 587, 659, 784, 880, 1046, 1175];
const sfx = {
  pop()   { click(1600 + Math.random() * 1300, 0.45); },
  tap()   { click(2800, 0.3, 0, 0.02); },
  catch(i){ block(SCALE[Math.min(i, SCALE.length - 1)], 0.55); click(3000, 0.25, 0.04, 0.02); },
  wrong() { block(330, 0.45, 0, 0.07); block(262, 0.45, 0.1, 0.09); shaker(0.25, 0.05); },
  motif() { [523, 659, 784, 1046].forEach((f, i) => block(f, 0.5, i * 0.13, 0.08)); shaker(0.3, 0.55); },
  served(){ [784, 880, 1046].forEach((f, i) => block(f, 0.5, i * 0.09)); shaker(0.3, 0.3, 0.15); },
  win()   { [523, 659, 784, 1046, 784, 1046].forEach((f, i) => block(f, 0.55, i * 0.12, 0.08));
            for (let i = 0; i < 6; i++) shaker(0.22, 0.75 + i * 0.09, 0.06); }
};
function setMute(m) {
  muted = m; save(KEY + 'muted', m);
  $('muteBtn').setAttribute('aria-pressed', m ? 'true' : 'false');
  $('muteBtn').textContent = m ? '🔇' : '🔊';
  if (master) master.gain.value = m ? 0 : 0.8;
}
$('muteBtn').onclick = () => setMute(!muted);
setMute(muted);

function speak(text) {
  try {
    if (!('speechSynthesis' in window) || muted) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text); u.rate = 0.95; u.pitch = 1.15;
    speechSynthesis.speak(u);
  } catch (e) {}
}

/* ---------- menu ---------- */
function renderMenu() {
  const list = $('showList'); list.innerHTML = '';
  SHOWS.forEach((s, i) => {
    const b = document.createElement('button');
    b.className = 'showBtn';
    const st = stars[i] || 0;
    b.setAttribute('aria-label', `Show ${i + 1}: ${s.name}, ${s.desc}, ${st} of 3 stars`);
    b.innerHTML = `<span class="big" aria-hidden="true">${s.icon}</span><span class="nm">${i + 1}. ${s.name}</span>
      <span class="ds">${s.desc}</span><span class="st" aria-hidden="true">${'★'.repeat(st)}${'☆'.repeat(3 - st)}</span>`;
    b.onclick = () => startShow(i);
    list.appendChild(b);
  });
  const all = stars.every(s => s >= 3);
  const total = stars.reduce((a, b) => a + b, 0);
  $('ribbon').textContent = all ? '🎀 Popcorn Champ! Every show got 3 stars! 🎀' : `⭐ ${total} of ${SHOWS.length * 3} stars - get 3 on every show for the Popcorn Champ ribbon!`;
}

/* ---------- game state ---------- */
const cv = $('stage'), cx = cv.getContext('2d');
let W = 300, H = 300, dpr = 1;
let G = null;           // current game
let pieces = [], confetti = [], kernels = [];
let lastT = 0, running = false, selIdx = -1;

function resize() {
  const r = $('stageWrap').getBoundingClientRect();
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = Math.max(100, r.width - 6); H = Math.max(100, r.height - 6);
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  cx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
new ResizeObserver(resize).observe($('stageWrap'));
const R = () => Math.max(24, Math.min(42, Math.min(W, H) * 0.075));
const potW = () => Math.min(W * 0.42, 220);
const potH = () => Math.min(H * 0.17, 90);
const potTop = () => H - potH() - 6;

const rnd = (a, b) => a + Math.random() * (b - a);
const ri = (a, b) => Math.floor(rnd(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];

function makeOrder(show) {
  const fl = show.flav.slice().sort(() => Math.random() - 0.5);
  if (show.multi && Math.random() < 0.75) {
    const a = ri(1, 3), b = ri(1, Math.min(3, 5 - a));
    return [{f: fl[0], n: a}, {f: fl[1], n: b}];
  }
  return [{f: fl[0], n: ri(show.cmin, show.cmax)}];
}

function startShow(i) {
  audio();
  const show = SHOWS[i];
  const guests = GUESTS.slice().sort(() => Math.random() - 0.5).slice(0, show.guests);
  G = {show, idx: i, guests, gi: 0, order: null, got: [], misses: 0, spawnT: 0.4, between: false,
       hintT: 0, forceNeed: false, caughtTotal: 0};
  pieces = []; confetti = []; selIdx = -1;
  $('screenMenu').hidden = true; $('screenPlay').hidden = false; $('over').hidden = true;
  requestAnimationFrame(() => { resize(); nextGuest(true); });
  sfx.motif();
  if (!running) { running = true; lastT = 0; requestAnimationFrame(loop); }
}

function needLeft() {
  // map flav -> remaining
  const m = {};
  G.order.forEach((o, k) => { m[o.f] = o.n - G.got[k]; });
  return m;
}
function isNeeded(f) { const m = needLeft(); return (m[f] || 0) > 0; }
function orderSentence() {
  const [emo, nm] = G.guests[G.gi];
  const parts = G.order.map(o => `${o.n} ${FLAVS[o.f].name}`);
  return `${nm} wants ${parts.join(' and ')}!`;
}
function nextGuest(first) {
  G.order = makeOrder(G.show); G.got = G.order.map(() => 0); G.between = false;
  const [emo] = G.guests[G.gi];
  $('guest').textContent = emo;
  renderOrder();
  const s = orderSentence();
  setMsg(first ? `🍿 ${s} Tap them while they fly!` : `🍿 ${s}`);
  speak(s);
}
function renderOrder() {
  const [, nm] = G.guests[G.gi];
  $('orderText').textContent = orderSentence();
  const sl = $('slots'); sl.innerHTML = '';
  G.order.forEach((o, k) => {
    for (let j = 0; j < o.n; j++) {
      const d = document.createElement('div');
      d.className = 'slot' + (j < G.got[k] ? ' full' : '');
      d.style.borderColor = '#1b1030';
      d.style.background = j < G.got[k] ? FLAVS[o.f].col : '#fff';
      d.style.color = '#1b1030';
      d.textContent = FLAVS[o.f].sym;
      if (j >= G.got[k]) { d.style.boxShadow = `inset 0 0 0 4px ${FLAVS[o.f].col}`; }
      sl.appendChild(d);
    }
  });
  $('progress').textContent = `Guest ${G.gi + 1} of ${G.guests.length}`;
}
function setMsg(t) { $('msg').innerHTML = `<span>${t}</span>`; }

/* ---------- pieces ---------- */
function spawn() {
  const show = G.show;
  let f;
  const need = Object.entries(needLeft()).filter(([, n]) => n > 0).map(([k]) => +k);
  const needOnScreen = pieces.some(p => p.state === 'air' && need.includes(p.f));
  if (need.length && (G.forceNeed || !needOnScreen && Math.random() < 0.75 || Math.random() < 0.45)) { f = pick(need); G.forceNeed = false; }
  else f = pick(show.flav);
  const x0 = W / 2 + rnd(-potW() * 0.25, potW() * 0.25), y0 = potTop() + 8;
  const peakY = H * rnd(0.1, 0.32);
  const h = y0 - peakY;
  const T = show.T; // flight time is independent of screen size
  const g = 8 * h / (T * T);
  const vy = -Math.sqrt(2 * g * h);
  const apexX = rnd(W * 0.14, W * 0.86);
  const vx = (apexX - x0) / (T / 2);
  pieces.push({x: x0, y: y0, vx, vy, g, f, state: 'air', t: 0, rot: rnd(-0.4, 0.4), spin: rnd(-1.2, 1.2), wob: 0, seed: Math.random() * 9});
  sfx.pop();
  G.potJig = 0.25;
  for (let i = 0; i < 3; i++) kernels.push({x: x0 + rnd(-20, 20), y: y0, vx: rnd(-60, 60), vy: rnd(-160, -90), life: 0.5});
}

function tryCatch(p) {
  if (!p || p.state !== 'air' || G.between) return;
  if (isNeeded(p.f)) {
    p.state = 'fly'; p.t = 0; p.sx = p.x; p.sy = p.y;
    const k = G.order.findIndex((o, k2) => o.f === p.f && G.got[k2] < o.n);
    G.got[k]++; G.caughtTotal++;
    const filled = G.got.reduce((a, b) => a + b, 0);
    sfx.catch(filled - 1);
    renderOrder();
    for (let i = 0; i < 8; i++) confetti.push(mkConf(p.x, p.y, FLAVS[p.f].col, 0.7));
    const left = G.order.reduce((a, o, k2) => a + o.n - G.got[k2], 0);
    if (left === 0) served();
    else setMsg(pick(['Yum, got it!', 'Nice catch!', 'Into the cone!', 'Pop-tastic!']) + ` ${left} more to go.`);
  } else {
    p.state = 'drop'; p.vy = Math.max(p.vy, 60); p.vx *= 0.3; p.wob = 1;
    G.misses++;
    sfx.wrong();
    const need = Object.entries(needLeft()).filter(([, n]) => n > 0).map(([k]) => FLAVS[+k].name);
    setMsg(`Oops, that's ${FLAVS[p.f].name}! We need ${need.join(' or ')}. It pops back in the pot.`);
  }
}

function served() {
  const mine = G;   // 26 Nov 2026: Shows tapped inside the 1.5 s pause lost the stars, or skipped a guest in the next show
  G.between = true;
  if (G.gi + 1 >= G.guests.length) {   // last guest: bank the stars now, before the pause
    const st0 = G.misses <= 2 ? 3 : G.misses <= 5 ? 2 : 1;
    if (st0 > (stars[G.idx] || 0)) { stars[G.idx] = st0; save(KEY + 'stars', stars); }
  }
  const [, nm] = G.guests[G.gi];
  sfx.served();
  setMsg(`🎉 ${nm} says "Yum! Thank you!"`);
  for (let i = 0; i < 40; i++) confetti.push(mkConf(W / 2 + rnd(-W * 0.3, W * 0.3), rnd(0, H * 0.4), pick(['#ffd23f', '#ff8fb8', '#6ec6ff', '#7ed957', '#ff9f1c', '#c9a2ff']), 1.6));
  setTimeout(() => {
    if (!G || G !== mine) return;
    G.gi++;
    if (G.gi >= G.guests.length) showDone();
    else nextGuest(false);
  }, 1500);
}

function showDone() {
  const m = G.misses;
  const st = m <= 2 ? 3 : m <= 5 ? 2 : 1;
  if (st > (stars[G.idx] || 0)) { stars[G.idx] = st; save(KEY + 'stars', stars); }
  sfx.win();
  $('overTitle').textContent = `${G.show.name} - done!`;
  $('overStars').textContent = '⭐'.repeat(st) + '☆'.repeat(3 - st);
  $('overStars').setAttribute('aria-hidden', 'true');
  const champ = stars.every(s => s >= 3);
  $('overText').textContent = `You served ${G.guests.length} happy guests and caught ${G.caughtTotal} popcorn! ${st} of 3 stars.` +
    (st < 3 ? ' Fewer wrong flavours = more stars.' : '') + (champ ? ' 🎀 You are the Popcorn Champ!' : '');
  $('nextBtn').hidden = G.idx >= SHOWS.length - 1;
  $('over').hidden = false;
  G.between = true;
  setTimeout(() => ($('nextBtn').hidden ? $('againBtn') : $('nextBtn')).focus(), 50);
}

function mkConf(x, y, col, life) {
  return {x, y, vx: rnd(-140, 140), vy: rnd(-220, -60), col, life, max: life, rot: rnd(0, 6), vr: rnd(-6, 6), w: rnd(6, 11), h: rnd(4, 8)};
}

/* ---------- input ---------- */
function airPieces() { return pieces.filter(p => p.state === 'air').sort((a, b) => a.x - b.x); }
cv.addEventListener('pointerdown', e => {
  if (!G || G.between) return;
  audio();
  const r = cv.getBoundingClientRect();
  const x = (e.clientX - r.left) * (W / r.width), y = (e.clientY - r.top) * (H / r.height);
  const hit = Math.max(R() * 1.45, 34);
  let best = null, bd = 1e9;
  for (const p of pieces) {
    if (p.state !== 'air') continue;
    const d = Math.hypot(p.x - x, p.y - y);
    if (d < hit && d < bd) { bd = d; best = p; }
  }
  if (best) tryCatch(best); else sfx.tap();
});
document.addEventListener('keydown', e => {
  if (!G || $('screenPlay').hidden || !$('over').hidden) return;
  const air = airPieces();
  if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
    e.preventDefault();
    if (!air.length) return;
    const cur = air.indexOf(pieces[selIdx]);
    let n = cur < 0 ? (e.key === 'ArrowRight' ? 0 : air.length - 1) : cur + (e.key === 'ArrowRight' ? 1 : -1);
    n = (n + air.length) % air.length;
    selIdx = pieces.indexOf(air[n]); sfx.tap();
  } else if (e.key === 'Enter' || e.key === ' ' || e.key === 'ArrowUp') {
    if (document.activeElement && document.activeElement.tagName === 'BUTTON' && e.key !== 'ArrowUp') return;
    e.preventDefault();
    const p = pieces[selIdx];
    if (p && p.state === 'air') tryCatch(p);
    else if (air.length) selIdx = pieces.indexOf(air[0]);
  }
});
$('hintBtn').onclick = () => {
  if (!G || G.between) return;
  G.hintT = 2.5; G.forceNeed = true; sfx.tap();
  setMsg('💡 Look for the glowing ring - that one is a flavour we need!');
};
$('sayBtn').onclick = () => { if (G && G.order) { speak(orderSentence()); setMsg('🗣️ ' + orderSentence()); } };
$('menuBtn').onclick = toMenu;
$('toMenuBtn').onclick = toMenu;
$('againBtn').onclick = () => startShow(G.idx);
$('nextBtn').onclick = () => startShow(Math.min(G.idx + 1, SHOWS.length - 1));
function toMenu() {
  G = null; pieces = []; confetti = []; running = false;
  try { speechSynthesis.cancel(); } catch (e) {}
  $('over').hidden = true; $('screenPlay').hidden = true; $('screenMenu').hidden = false;
  renderMenu();
}

/* ---------- loop ---------- */
function loop(ts) {
  if (!running) return;
  requestAnimationFrame(loop);
  try {
    const dt = lastT ? Math.min(0.05, Math.max(0, (ts - lastT) / 1000)) : 0.016;
    lastT = ts;
    update(dt); draw(ts / 1000);
  } catch (err) { console.error(err); }
}
function update(dt) {
  if (!G) return;
  if (!G.between) {
    G.spawnT -= dt;
    const air = pieces.filter(p => p.state === 'air').length;
    if (G.spawnT <= 0 && air < G.show.max) { spawn(); G.spawnT = G.show.every * rnd(0.8, 1.2); }
  }
  if (G.hintT > 0) G.hintT -= dt;
  if (G.potJig > 0) G.potJig -= dt;
  const r = R();
  for (const p of pieces) {
    if (p.state === 'fly') {
      p.t += dt / 0.45;
      const e = 1 - Math.pow(1 - Math.min(1, p.t), 3);
      p.x = p.sx + (W / 2 - p.sx) * e; p.y = p.sy + (-r - p.sy) * e;
      p.rot += dt * 8;
      continue;
    }
    const g = p.state === 'drop' ? p.g * 1.8 : p.g;
    p.vy += g * dt; p.x += p.vx * dt; p.y += p.vy * dt;
    p.rot += p.spin * dt;
    if (p.wob > 0) p.wob = Math.max(0, p.wob - dt * 1.2);
    if (p.x < r) { p.x = r; p.vx = Math.abs(p.vx); }
    if (p.x > W - r) { p.x = W - r; p.vx = -Math.abs(p.vx); }
    if (p.vy > 0 && p.y > potTop() + 10) { p.state = 'gone'; }
  }
  pieces = pieces.filter(p => p.state !== 'gone' && !(p.state === 'fly' && p.t >= 1));
  if (selIdx >= pieces.length || (pieces[selIdx] && pieces[selIdx].state !== 'air')) selIdx = -1;
  for (const c of confetti) { c.vy += 420 * dt; c.x += c.vx * dt; c.y += c.vy * dt; c.rot += c.vr * dt; c.life -= dt; }
  confetti = confetti.filter(c => c.life > 0);
  for (const k of kernels) { k.vy += 600 * dt; k.x += k.vx * dt; k.y += k.vy * dt; k.life -= dt; }
  kernels = kernels.filter(k => k.life > 0);
}

function puffPath(r, seed) {
  // lumpy popcorn: 6 bumps around + centre
  const pts = [];
  for (let i = 0; i < 6; i++) {
    const a = i / 6 * Math.PI * 2 + seed;
    pts.push([Math.cos(a) * r * 0.48, Math.sin(a) * r * 0.48, r * (0.5 + 0.08 * Math.sin(seed * 3 + i * 1.7))]);
  }
  pts.push([0, 0, r * 0.6]);
  return pts;
}
function drawPuff(p, r, t) {
  const pts = puffPath(r, p.seed);
  cx.save();
  cx.translate(p.x, p.y);
  let s = 1;
  if (p.state === 'fly') s = 1 - 0.5 * Math.min(1, p.t);
  cx.scale(s, s);
  let rot = p.rot;
  if (p.wob > 0) rot += Math.sin(t * 30) * 0.4 * p.wob;
  cx.rotate(rot);
  // hard offset shadow
  cx.fillStyle = '#1b1030';
  for (const [x, y, rr] of pts) { cx.beginPath(); cx.arc(x + 4, y + 4, rr + 3, 0, 7); cx.fill(); }
  for (const [x, y, rr] of pts) { cx.beginPath(); cx.arc(x, y, rr + 3, 0, 7); cx.fill(); }
  cx.fillStyle = FLAVS[p.f].col;
  for (const [x, y, rr] of pts) { cx.beginPath(); cx.arc(x, y, rr, 0, 7); cx.fill(); }
  // highlight dabs
  cx.fillStyle = '#ffffff';
  cx.beginPath(); cx.arc(-r * 0.35, -r * 0.45, r * 0.12, 0, 7); cx.fill();
  cx.rotate(-rot * 0.7); // keep face mostly upright
  // face
  cx.fillStyle = '#1b1030';
  cx.beginPath(); cx.arc(-r * 0.22, -r * 0.08, r * 0.09, 0, 7); cx.arc(r * 0.22, -r * 0.08, r * 0.09, 0, 7); cx.fill();
  cx.strokeStyle = '#1b1030'; cx.lineWidth = Math.max(2, r * 0.07); cx.lineCap = 'round';
  cx.beginPath();
  if (p.wob > 0) cx.arc(0, r * 0.28, r * 0.15, Math.PI * 1.15, Math.PI * 1.85);
  else cx.arc(0, r * 0.08, r * 0.2, 0.2 * Math.PI, 0.8 * Math.PI);
  cx.stroke();
  // flavour badge
  const bx = r * 0.62, by = -r * 0.62, br = r * 0.3;
  cx.fillStyle = '#1b1030'; cx.beginPath(); cx.arc(bx, by, br + 2.5, 0, 7); cx.fill();
  cx.fillStyle = '#ffffff'; cx.beginPath(); cx.arc(bx, by, br, 0, 7); cx.fill();
  cx.fillStyle = '#1b1030';
  cx.font = `700 ${Math.round(br * 1.25)}px "Segoe UI Symbol","Trebuchet MS",sans-serif`;
  cx.textAlign = 'center'; cx.textBaseline = 'middle';
  cx.fillText(FLAVS[p.f].sym, bx, by + 1);
  cx.restore();
}
function draw(t) {
  cx.clearRect(0, 0, W, H);
  // awning scallops
  const n = Math.max(6, Math.round(W / 46)), sw = W / n, ah = Math.min(26, H * 0.07);
  for (let i = 0; i < n; i++) {
    cx.fillStyle = i % 2 ? '#ffffff' : '#e4572e';
    cx.fillRect(i * sw, 0, sw, ah);
    cx.beginPath(); cx.arc(i * sw + sw / 2, ah, sw / 2, 0, Math.PI); cx.fill();
  }
  cx.strokeStyle = '#1b1030'; cx.lineWidth = 3;
  cx.beginPath(); cx.moveTo(0, ah); cx.lineTo(W, ah); cx.stroke();
  // floor stripe
  cx.fillStyle = '#fdf6e3'; cx.fillRect(0, H - 20, W, 20);
  cx.beginPath(); cx.moveTo(0, H - 20); cx.lineTo(W, H - 20); cx.stroke();
  if (!G) return;
  const r = R();
  // pot (behind pieces until they leave it)
  const pw = potW(), ph = potH(), px = W / 2 - pw / 2, py = potTop();
  const jig = G.potJig > 0 ? Math.sin(t * 60) * 2 : 0;
  // kernels jumping
  cx.fillStyle = '#ffd23f';
  for (const k of kernels) { cx.beginPath(); cx.ellipse(k.x, k.y, 4, 3, 0, 0, 7); cx.fill(); }
  // pieces (in air)
  for (const p of pieces) if (p.state !== 'fly') drawPuff(p, r, t);
  cx.save(); cx.translate(jig, 0);
  // shadow
  cx.fillStyle = '#1b1030';
  roundRect(px + 4, py + 4, pw, ph, 12); cx.fill();
  cx.fillStyle = '#e4572e'; roundRect(px, py, pw, ph, 12); cx.fill();
  cx.lineWidth = 3; cx.strokeStyle = '#1b1030'; roundRect(px, py, pw, ph, 12); cx.stroke();
  // rim
  cx.fillStyle = '#ffffff'; roundRect(px - 8, py - 6, pw + 16, 14, 7); cx.fill(); cx.stroke();
  // handles
  cx.fillStyle = '#1b1030';
  roundRect(px - 22, py + ph * 0.25, 18, 10, 4); cx.fill();
  roundRect(px + pw + 4, py + ph * 0.25, 18, 10, 4); cx.fill();
  // stars on pot
  cx.fillStyle = '#ffd23f';
  for (let i = 0; i < 3; i++) star(px + pw * (0.25 + i * 0.25), py + ph * 0.58, Math.min(ph * 0.18, 12));
  cx.restore();
  // hint ring
  if (G.hintT > 0) {
    const need = pieces.filter(p => p.state === 'air' && isNeeded(p.f));
    cx.strokeStyle = '#0977d0'; cx.lineWidth = 5;
    cx.setLineDash([10, 7]); cx.lineDashOffset = -t * 30;
    for (const p of need) { cx.beginPath(); cx.arc(p.x, p.y, r * 1.35 + Math.sin(t * 6) * 3, 0, 7); cx.stroke(); }
    cx.setLineDash([]);
  }
  // keyboard selection
  const sp = pieces[selIdx];
  if (sp && sp.state === 'air') {
    cx.strokeStyle = '#1b1030'; cx.lineWidth = 4;
    cx.beginPath(); cx.arc(sp.x, sp.y, r * 1.45, 0, 7); cx.stroke();
    cx.fillStyle = '#1b1030';
    cx.beginPath(); cx.moveTo(sp.x, sp.y - r * 1.5); cx.lineTo(sp.x - 9, sp.y - r * 1.5 - 14); cx.lineTo(sp.x + 9, sp.y - r * 1.5 - 14); cx.fill();
  }
  for (const p of pieces) if (p.state === 'fly') drawPuff(p, r, t);
  // confetti
  for (const c of confetti) {
    cx.save(); cx.translate(c.x, c.y); cx.rotate(c.rot);
    cx.fillStyle = '#1b1030'; cx.fillRect(-c.w / 2 + 1.5, -c.h / 2 + 1.5, c.w, c.h);
    cx.fillStyle = c.col; cx.fillRect(-c.w / 2, -c.h / 2, c.w, c.h);
    cx.restore();
  }
}
function roundRect(x, y, w, h, rr) {
  cx.beginPath(); cx.moveTo(x + rr, y); cx.arcTo(x + w, y, x + w, y + h, rr); cx.arcTo(x + w, y + h, x, y + h, rr);
  cx.arcTo(x, y + h, x, y, rr); cx.arcTo(x, y, x + w, y, rr); cx.closePath();
}
function star(x, y, s) {
  cx.beginPath();
  for (let i = 0; i < 10; i++) { const a = i / 10 * Math.PI * 2 - Math.PI / 2, rr = i % 2 ? s * 0.45 : s; cx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); }
  cx.closePath(); cx.fill();
}

renderMenu();
</script>
</body>
