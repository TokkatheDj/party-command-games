<!-- CONCEPT: PRETEND PLAY (firefighter routine) - Pepper's Fire Pup Station: the alarm bell rings and an animal friend calls for help, so kids run Pepper the dalmatian pup's whole fire-crew routine - tap on the right gear (helmet, coat, boots, gloves - not the flip-flops!), find the caller's house in town from the picture card (colour, then roof shape, then door number), drive the truck there, then slide a finger to spray the hose on silly little flames until they fizzle out, or raise the truck ladder to exactly the right window to bring a stuck friend down; four shifts grow from 3 houses and 3 flames to 6 look-alike houses, flames that creep back and two-job calls, every rescued friend joins a saved Badge Book. No timer, no losing - a wrong house just waves "all fine here!" and the right one glows. Ages 4-10. [style: Toy Blocks / sound: Plucked String] -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Pepper's Fire Pup Station</title>
<style>
:root{
  --bg:#ffffff; --panel:#f2f2f2; --text:#1b1030; --muted:#4a4a5a;
  --blue:#1d5fc4; --blueD:#123f85; --red:#c1121f; --redD:#7a0a13;
  --green:#1e7a3c; --greenD:#124d25; --yellow:#ffd60a; --yellowD:#b39400;
  --gap:clamp(8px,2.4vw,14px);
  --font:"Baloo 2","Arial Black","Trebuchet MS",sans-serif;
}
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);
  font-family:var(--font);font-weight:800;touch-action:manipulation;user-select:none;-webkit-user-select:none}
[hidden]{display:none !important}
#app{height:100%;display:flex;flex-direction:column}
.top{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:6px 8px;background:var(--panel);border-bottom:4px solid #d9d9d9}
.top .ttl{flex:1;text-align:center;font-size:clamp(15px,4.4vw,22px);color:var(--red);line-height:1.1}
.screen{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;padding:var(--gap)}
.blk{font-family:var(--font);font-weight:800;font-size:clamp(16px,4.4vw,21px);cursor:pointer;border:none;border-radius:4px;
  min-height:52px;min-width:52px;padding:8px 16px;color:#fff;background:var(--blue);border-bottom:6px solid var(--blueD);
  transition:transform .08s}
.blk:active{transform:translateY(3px);border-bottom-width:3px;margin-top:3px}
.blk:focus-visible{outline:4px solid var(--text);outline-offset:2px}
.blk.red{background:var(--red);border-bottom-color:var(--redD)}
.blk.green{background:var(--green);border-bottom-color:var(--greenD)}
.blk.yellow{background:var(--yellow);border-bottom-color:var(--yellowD);color:var(--text)}
.blk.grey{background:var(--panel);border-bottom-color:#bdbdbd;color:var(--text)}
.top .blk.grey{background:#fff;border:2px solid #bdbdbd;border-bottom:6px solid #9e9e9e}
.blk.small{min-height:46px;min-width:46px;padding:4px 10px;font-size:clamp(14px,3.8vw,18px)}
#main{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
.top h1.ttl{margin:0;font-weight:800}
h2.bigt{margin:4px 0 2px;text-align:center;font-size:clamp(30px,9vw,52px);line-height:1}
.bigt .w1{color:var(--red)} .bigt .w2{color:var(--blue)} .bigt .w3{color:var(--green)}
h2{margin:4px 0;font-size:clamp(20px,6vw,30px);text-align:center}
.desc{color:var(--muted);text-align:center;font-size:clamp(14px,3.8vw,18px);margin:4px auto 10px;max-width:520px;line-height:1.25}
.center{display:flex;flex-direction:column;align-items:center;gap:var(--gap)}
.pepper{width:clamp(120px,36vw,190px);height:auto;display:block;margin:0 auto}
.shifts{display:grid;grid-template-columns:1fr 1fr;gap:var(--gap);width:100%;max-width:520px}
.shiftBtn{display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;min-height:74px}
.shiftBtn .sub{font-size:clamp(12px,3.3vw,15px)}
.row{display:flex;gap:var(--gap);justify-content:center;flex-wrap:wrap;width:100%}
.card{background:var(--panel);border-radius:4px;border-bottom:6px solid #c9c9c9;padding:10px;width:100%;max-width:520px}
.callCard{display:flex;align-items:center;gap:10px}
.callCard .who{font-size:clamp(44px,13vw,70px);line-height:1}
.callCard .info{flex:1;font-size:clamp(15px,4.2vw,20px);line-height:1.2}
.callCard svg{width:clamp(70px,20vw,100px);height:auto;flex:0 0 auto}
.bell{font-size:clamp(50px,15vw,80px);display:inline-block;animation:ring .5s ease-in-out infinite}
@keyframes ring{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(14deg)}}
.gearGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--gap);width:100%;max-width:520px}
.gearBtn{display:flex;flex-direction:column;align-items:center;gap:0;min-height:80px;line-height:1.05}
.gearBtn .ic{font-size:clamp(30px,9vw,42px)}
.gearBtn.done{background:var(--green);border-bottom-color:var(--greenD)}
.wobble{animation:wob .45s}
@keyframes wob{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
.bounce{animation:bnc .6s}
@keyframes bnc{0%,100%{transform:translateY(0)}40%{transform:translateY(-14px)}}
.msg{min-height:2.6em;height:2.6em;display:flex;align-items:center;justify-content:center;text-align:center;
  font-size:clamp(15px,4.2vw,20px);line-height:1.2;padding:0 6px}
.town{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--gap);width:100%;max-width:560px}
.houseBtn{background:#fff;border:3px solid #d0d0d0;border-bottom:6px solid #bdbdbd;border-radius:4px;padding:4px;cursor:pointer;min-height:90px}
.houseBtn svg{width:100%;height:auto;display:block}
.houseBtn:focus-visible{outline:4px solid var(--text)}
.houseBtn.glow{border-color:var(--yellowD);box-shadow:0 0 0 5px var(--yellow);animation:bnc 1s infinite}
.road{position:relative;height:54px;width:100%;max-width:560px;background:#4a4a5a;border-radius:4px;overflow:hidden}
.road::after{content:"";position:absolute;left:0;right:0;top:25px;border-top:4px dashed #ffd60a}
.truck{position:absolute;left:4px;top:2px;font-size:42px;line-height:1;transition:left 1s ease-in;transform:scaleX(-1)}
#sJob{display:flex;flex-direction:column;padding:0}
#stage{flex:1 1 auto;min-height:0;position:relative}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.jobBar{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:6px 8px;background:var(--panel);border-top:4px solid #d9d9d9}
.jobBar .msg{flex:1}
.book{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%;max-width:520px}
.slot{background:var(--panel);border-radius:4px;border-bottom:5px solid #c9c9c9;text-align:center;padding:6px 2px;font-size:clamp(12px,3.2vw,15px)}
.slot .e{font-size:clamp(30px,9vw,42px);display:block;line-height:1.1}
.slot.no .e{color:var(--muted)}
#ov{position:fixed;inset:0;background:rgba(27,16,48,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:5}
.ovBox{background:#fff;border-radius:4px;border-bottom:8px solid #c9c9c9;padding:16px;max-width:420px;width:100%;text-align:center}
.ovBox .big{font-size:clamp(60px,18vw,96px);line-height:1}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:9}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <button class="blk grey small" id="homeBtn" aria-label="Home">🏠</button>
    <h1 class="ttl">Fire Pup Station</h1>
    <button class="blk grey small" id="hearBtn" aria-label="Hear it again">🗣️</button>
    <button class="blk grey small" id="muteBtn" aria-label="Sound" aria-pressed="true">🔊</button>
  </header>
  <main id="main">

  <section class="screen" id="sTitle">
    <div class="center">
      <h2 class="bigt"><span class="w1">Pepper's</span> <span class="w2">Fire Pup</span> <span class="w3">Station</span></h2>
      <p class="desc">Ring ring! Help Pepper the fire pup: put on the right gear, find the house, then spray the silly flames or raise the ladder to rescue a friend.</p>
      <div id="titlePepper"></div>
      <div class="shifts" id="shiftList"></div>
      <div class="row">
        <button class="blk yellow" id="bookBtn">📒 Badge Book</button>
      </div>
    </div>
  </section>

  <section class="screen" id="sCall" hidden>
    <div class="center">
      <div><span class="bell" aria-hidden="true">🔔</span></div>
      <h2 id="callHead">Ring ring!</h2>
      <div class="card callCard" id="callCard"></div>
      <div id="callPepper"></div>
      <button class="blk red" id="goGear">Let's go! ▶</button>
    </div>
  </section>

  <section class="screen" id="sGear" hidden>
    <div class="center">
      <h2>Gear up, Pepper!</h2>
      <div id="gearPepper"></div>
      <div class="msg" id="gearMsg" aria-live="polite">Tap the things a fire pup wears.</div>
      <div class="gearGrid" id="gearGrid"></div>
    </div>
  </section>

  <section class="screen" id="sTown" hidden>
    <div class="center">
      <div class="card callCard" id="townCard"></div>
      <div class="msg" id="townMsg" aria-live="polite">Which house called? Tap it!</div>
      <div class="town" id="town"></div>
      <div class="road" aria-hidden="true"><span class="truck" id="truck">🚒</span></div>
    </div>
  </section>

  <section class="screen" id="sJob" hidden>
    <div id="stage"><canvas id="cv" aria-label="Fire scene: slide to spray water, or raise the ladder"></canvas></div>
    <div class="jobBar">
      <div class="msg" id="jobMsg" aria-live="polite"></div>
      <button class="blk green small" id="downBtn" aria-label="Ladder down" hidden>▼</button>
      <button class="blk green small" id="upBtn" aria-label="Ladder up" hidden>▲</button>
    </div>
  </section>

  <section class="screen" id="sBook" hidden>
    <div class="center">
      <h2>📒 Badge Book</h2>
      <p class="desc" id="bookCount"></p>
      <div class="book" id="book"></div>
      <div class="row">
        <button class="blk" id="bookBack">◀ Back</button>
        <button class="blk grey small" id="resetBtn">Start over</button>
      </div>
    </div>
  </section>
  </main>
</div>
<div id="ov" hidden><div class="ovBox" role="dialog" aria-modal="true" aria-labelledby="ovTitle" id="ovBox"></div></div>
<canvas id="fx" aria-hidden="true"></canvas>

<script>
'use strict';
const KEY = 'cowork-firepup-';
const load = (k, d) => { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } };
const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
const $ = id => document.getElementById(id);
const rnd = n => Math.floor(Math.random() * n);
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

/* ---------- progress ---------- */
let prog = load(KEY + 'progress', null);
if (!prog || !Array.isArray(prog.done) || !Array.isArray(prog.badges)) prog = { done: [false, false, false, false], badges: [] };
let muted = !!load(KEY + 'muted', false);
const saveProg = () => save(KEY + 'progress', prog);

/* ---------- sound: Plucked String (Karplus-Strong) ---------- */
let AC = null, master = null;
const ksCache = new Map();
function ensureAudio() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    const comp = AC.createDynamicsCompressor();
    comp.threshold.value = -16; comp.ratio.value = 4;
    master = AC.createGain(); master.gain.value = muted ? 0 : 0.9;
    master.connect(comp); comp.connect(AC.destination);
  } catch (e) { AC = null; }
}
function ksBuffer(freq, decay, dur) {
  const key = freq.toFixed(1) + '|' + decay + '|' + dur;
  if (ksCache.has(key)) return ksCache.get(key);
  const sr = AC.sampleRate, N = Math.max(2, Math.round(sr / freq)), len = Math.floor(sr * dur);
  const buf = AC.createBuffer(1, len, sr), d = buf.getChannelData(0), ring = new Float32Array(N);
  for (let i = 0; i < N; i++) ring[i] = Math.random() * 2 - 1;      // the noise burst
  let idx = 0;
  for (let i = 0; i < len; i++) {                                    // feedback delay of 1/f with a lowpass (2-tap average) in the loop
    const nx = (idx + 1) % N, out = ring[idx];
    ring[idx] = decay * 0.5 * (ring[idx] + ring[nx]);
    d[i] = out; idx = nx;
  }
  ksCache.set(key, buf); return buf;
}
function pluck(freq, o = {}) {
  if (!AC || muted) return;
  const vol = o.vol ?? 0.45, dur = o.dur ?? 0.9, t = AC.currentTime + (o.when || 0);
  const src = AC.createBufferSource(); src.buffer = ksBuffer(freq, o.decay ?? 0.996, dur);
  const g = AC.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(vol, t + 0.008);
  g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
  let node = src;
  if (o.lp) { const f = AC.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = o.lp; src.connect(f); node = f; }
  node.connect(g); g.connect(master);
  src.start(t); src.stop(t + dur + 0.05);
}
// pentatonic (D major pentatonic)
const P = { D4: 293.7, E4: 329.6, Fs4: 370, A4: 440, B4: 493.9, D5: 587.3, E5: 659.3, Fs5: 740, A5: 880, B5: 987.8, D6: 1174.7, E6: 1318.5, Fs6: 1480, A6: 1760 };
const SFX = {
  tap() { pluck(P.A4, { vol: 0.35, dur: 0.35 }); },
  motif() { [P.D5, P.Fs5, P.A5, P.D6].forEach((f, i) => pluck(f, { when: i * 0.13, vol: 0.4 })); },
  good() { [P.D5, P.Fs5, P.A5].forEach((f, i) => pluck(f, { when: i * 0.06, vol: 0.4, dur: 0.6 })); },
  oops() { pluck(P.A4 / 2, { vol: 0.4, dur: 0.45, lp: 700, decay: 0.985 }); pluck(P.Fs4 / 2, { when: 0.13, vol: 0.4, dur: 0.5, lp: 700, decay: 0.985 }); },
  siren() { for (let i = 0; i < 6; i++) pluck(i % 2 ? P.A5 : P.E5, { when: i * 0.17, vol: 0.28, dur: 0.3 }); },
  drip() { const n = [P.D6, P.E6, P.Fs6, P.A6]; pluck(n[rnd(4)], { vol: 0.07, dur: 0.14, decay: 0.99 }); },
  fizz() { pluck(P.B5, { vol: 0.3, dur: 0.4 }); pluck(P.E6, { when: 0.05, vol: 0.25, dur: 0.4 }); },
  click() { pluck(P.B4, { vol: 0.12, dur: 0.12, decay: 0.99 }); },
  win() { SFX.motif(); [P.D5, P.Fs5, P.A5, P.D6].forEach(f => pluck(f, { when: 0.62, vol: 0.3, dur: 1.4 })); },
  gear() { pluck(P.E5, { vol: 0.35, dur: 0.4 }); pluck(P.B5, { when: 0.07, vol: 0.3, dur: 0.5 }); }
};
function say(text) {
  try {
    if (muted || !('speechSynthesis' in window)) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text); u.rate = 0.95; u.pitch = 1.15; speechSynthesis.speak(u);
  } catch (e) {}
}
let lastSpoken = '';
const speak = t => { lastSpoken = t; say(t); };

/* ---------- data ---------- */
const FRIENDS = [
  ['🐱', 'Kitty'], ['🐰', 'Bunny'], ['🦜', 'Polly'], ['🐹', 'Hammy'],
  ['🦉', 'Owlet'], ['🐵', 'Mo'], ['🐥', 'Chick'], ['🦝', 'Rocky'],
  ['🐨', 'Koko'], ['🐼', 'Pandy'], ['🐿️', 'Nutty'], ['🐷', 'Piggy'],
  ['🦊', 'Foxy'], ['🐸', 'Hops'], ['🐻', 'Teddy'], ['🦄', 'Sparkle']
];
const COLORS = [
  { n: 'red', c: '#c1121f', d: '#7a0a13' }, { n: 'blue', c: '#1d5fc4', d: '#123f85' },
  { n: 'green', c: '#1e7a3c', d: '#124d25' }, { n: 'yellow', c: '#ffd60a', d: '#b39400' },
  { n: 'purple', c: '#6b2fb3', d: '#45197a' }, { n: 'orange', c: '#f4a259', d: '#b5641f' }
];
const ROOFS = ['pointy', 'flat', 'round'];
const GEAR = {
  helmet: { ic: '⛑️', n: 'Helmet' }, coat: { ic: '🧥', n: 'Coat' }, boots: { ic: '🥾', n: 'Boots' }, gloves: { ic: '🧤', n: 'Gloves' }
};
const DECOYS = [
  { ic: '🩴', n: 'Flip-flops', why: 'Flip-flops are for the beach!' },
  { ic: '👒', n: 'Sun hat', why: 'A sun hat is for picnics!' },
  { ic: '🥳', n: 'Party hat', why: 'Party hats are for birthdays!' },
  { ic: '🛟', n: 'Swim ring', why: 'A swim ring is for the pool!' },
  { ic: '🩳', n: 'Beach shorts', why: 'Beach shorts are for the seaside!' }
];
const SHIFTS = [
  { name: 'Morning', ic: '🌅', houses: 3, mode: 'color', gear: ['helmet', 'coat', 'boots'], decoys: 0, flames: 3, regrow: 0, tol: 0.14, floors: 2,
    calls: ['fire', 'ladder', 'fire', 'ladder'] },
  { name: 'Lunchtime', ic: '🌞', houses: 4, mode: 'roof', gear: ['helmet', 'coat', 'boots'], decoys: 1, flames: 4, regrow: 0.05, tol: 0.11, floors: 2,
    calls: ['ladder', 'fire', 'both', 'fire'] },
  { name: 'Afternoon', ic: '🌤️', houses: 5, mode: 'number', gear: ['helmet', 'coat', 'boots', 'gloves'], decoys: 1, flames: 5, regrow: 0.1, tol: 0.09, floors: 3,
    calls: ['fire', 'ladder', 'both', 'ladder'] },
  { name: 'Evening', ic: '🌙', houses: 6, mode: 'all', gear: ['helmet', 'coat', 'boots', 'gloves'], decoys: 2, flames: 6, regrow: 0.16, tol: 0.075, floors: 3,
    calls: ['both', 'fire', 'ladder', 'both'] }
];

/* ---------- drawings ---------- */
function pepperSVG(show) {
  const vis = k => show === 'all' || (show && show[k]) ? '' : ' style="display:none"';
  return `<svg class="pepper" viewBox="0 0 200 230" aria-hidden="true">
  <g stroke="#1b1030" stroke-width="4" stroke-linejoin="round">
    <ellipse cx="72" cy="214" rx="22" ry="11" fill="#fff"/><ellipse cx="128" cy="214" rx="22" ry="11" fill="#fff"/>
    <ellipse cx="100" cy="165" rx="50" ry="50" fill="#fff"/>
    <circle cx="80" cy="160" r="7" fill="#1b1030" stroke="none"/><circle cx="118" cy="182" r="9" fill="#1b1030" stroke="none"/>
    <g data-g="coat"${vis('coat')}><path d="M52 140 Q100 112 148 140 L152 200 Q100 216 48 200 Z" fill="#ffd60a"/>
      <rect x="52" y="172" width="96" height="10" fill="#d9d9d9" stroke-width="3"/><line x1="100" y1="128" x2="100" y2="208" stroke-width="3"/></g>
    <circle cx="44" cy="168" r="14" fill="#fff"/><circle cx="156" cy="168" r="14" fill="#fff"/>
    <g data-g="gloves"${vis('gloves')}><circle cx="44" cy="168" r="15" fill="#c1121f"/><circle cx="156" cy="168" r="15" fill="#c1121f"/></g>
    <g data-g="boots"${vis('boots')}><path d="M50 202 h42 v22 h-46 z" fill="#1b1030"/><path d="M108 202 h42 v22 h-46 z" fill="#1b1030"/>
      <rect x="50" y="208" width="42" height="5" fill="#ffd60a" stroke="none"/><rect x="108" y="208" width="42" height="5" fill="#ffd60a" stroke="none"/></g>
    <ellipse cx="44" cy="80" rx="16" ry="30" fill="#1b1030" transform="rotate(18 44 80)"/>
    <ellipse cx="156" cy="80" rx="16" ry="30" fill="#1b1030" transform="rotate(-18 156 80)"/>
    <circle cx="100" cy="82" r="50" fill="#fff"/>
    <circle cx="70" cy="60" r="8" fill="#1b1030" stroke="none"/><circle cx="132" cy="104" r="6" fill="#1b1030" stroke="none"/><circle cx="124" cy="52" r="5" fill="#1b1030" stroke="none"/>
    <circle cx="82" cy="82" r="8" fill="#1b1030" stroke="none"/><circle cx="118" cy="82" r="8" fill="#1b1030" stroke="none"/>
    <circle cx="85" cy="79" r="3" fill="#fff" stroke="none"/><circle cx="121" cy="79" r="3" fill="#fff" stroke="none"/>
    <ellipse cx="100" cy="100" rx="11" ry="8" fill="#1b1030" stroke="none"/>
    <path d="M86 112 Q100 124 114 112" fill="none" stroke-width="4" stroke-linecap="round"/>
    <path d="M96 116 q4 12 8 0" fill="#ff7aa2" stroke-width="3"/>
    <g data-g="helmet"${vis('helmet')}><path d="M50 62 Q52 18 100 16 Q148 18 150 62 Z" fill="#c1121f"/>
      <path d="M38 62 Q100 50 162 62 L160 72 Q100 62 40 72 Z" fill="#c1121f"/>
      <path d="M100 26 l6 12 13 1 -10 8 4 13 -13 -8 -13 8 4 -13 -10 -8 13 -1 z" fill="#ffd60a" stroke-width="2.5"/></g>
  </g></svg>`;
}
function houseSVG(h) {
  const col = COLORS[h.c];
  let roof;
  if (h.r === 0) roof = `<polygon points="8,52 60,10 112,52" fill="${col.d}"/>`;
  else if (h.r === 1) roof = `<rect x="6" y="34" width="108" height="18" fill="${col.d}"/>`;
  else roof = `<path d="M10 52 A50 42 0 0 1 110 52 Z" fill="${col.d}"/>`;

        if (J.hintShown !== t) { J.hintShown = t; }
        setMsg(t);
      } else setMsg(`Raise the ladder to ${G.friend[1]}'s window!`);
    }
  } else if (J.phase === 'rescue') {
    J.rescueT += dt;
    if (J.rescueT > 1.9 && !J.doneT) { J.doneT = J.t; setTimeout(() => { if (cur === 'sJob') finishCall(); }, 500); }
  }
}

/* drawing */
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function emoji(ch, x, y, size) { ctx.globalAlpha = 1; ctx.fillStyle = '#000'; ctx.font = `${size}px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(ch, x, y); }
function drawFlame(x, y, s, ph, size) {
  const h = size * s * (1 + Math.sin(J.t * 9 + ph) * 0.07), w = h * 0.62;
  ctx.lineWidth = 3; ctx.strokeStyle = '#1b1030';
  ctx.beginPath(); ctx.moveTo(x, y - h);
  ctx.bezierCurveTo(x + w * 0.3, y - h * 0.6, x + w, y - h * 0.35, x + w * 0.7, y - h * 0.05);
  ctx.quadraticCurveTo(x, y + h * 0.14, x - w * 0.7, y - h * 0.05);
  ctx.bezierCurveTo(x - w, y - h * 0.35, x - w * 0.3, y - h * 0.6, x, y - h);
  ctx.fillStyle = '#ff7a1a'; ctx.fill(); ctx.stroke();
  const ih = h * 0.55, iw = w * 0.5;
  ctx.beginPath(); ctx.moveTo(x, y - ih);
  ctx.quadraticCurveTo(x + iw, y - ih * 0.35, x + iw * 0.6, y - h * 0.04);
  ctx.quadraticCurveTo(x, y + h * 0.06, x - iw * 0.6, y - h * 0.04);
  ctx.quadraticCurveTo(x - iw, y - ih * 0.35, x, y - ih);
  ctx.fillStyle = '#ffd60a'; ctx.fill();
  if (s > 0.35) { // sleepy silly eyes
    ctx.strokeStyle = '#1b1030'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(x - w * 0.18, y - h * 0.22, h * 0.06, 0, Math.PI); ctx.stroke();
    ctx.beginPath(); ctx.arc(x + w * 0.18, y - h * 0.22, h * 0.06, 0, Math.PI); ctx.stroke();
  }
}
function drawHouse(l) {
  const h = G.target, col = COLORS[h.c];
  ctx.lineWidth = 3; ctx.strokeStyle = '#1b1030'; ctx.lineJoin = 'round';
  const { hx, hw, bodyTop, roofH, ground } = l;
  ctx.fillStyle = col.d; ctx.beginPath();
  if (h.r === 0) { ctx.moveTo(hx - 10, bodyTop); ctx.lineTo(hx + hw / 2, bodyTop - roofH); ctx.lineTo(hx + hw + 10, bodyTop); ctx.closePath(); }
  else if (h.r === 1) { ctx.rect(hx - 8, bodyTop - roofH * 0.35, hw + 16, roofH * 0.35); }
  else { ctx.moveTo(hx - 6, bodyTop); ctx.ellipse(hx + hw / 2, bodyTop, hw / 2 + 6, roofH, 0, Math.PI, 0); ctx.closePath(); }
  ctx.fill(); ctx.stroke();
  ctx.fillStyle = col.c; ctx.fillRect(hx, bodyTop, hw, ground - bodyTop); ctx.strokeRect(hx, bodyTop, hw, ground - bodyTop);
  for (let f = 1; f < G.cfg.floors; f++) { ctx.beginPath(); ctx.moveTo(hx, ground - l.floorH * f); ctx.lineTo(hx + hw, ground - l.floorH * f); ctx.stroke(); }
  l.wins.forEach((w, i) => {
    const lit = J.flames.some(f => !f.out && f.a.kind === 'win' && f.a.i === i);
    ctx.fillStyle = lit ? '#ffcf8a' : '#bfe3ff';
    ctx.fillRect(w.x - l.winW / 2, w.y - l.winH / 2, l.winW, l.winH); ctx.strokeRect(w.x - l.winW / 2, w.y - l.winH / 2, l.winW, l.winH);
    ctx.beginPath(); ctx.moveTo(w.x, w.y - l.winH / 2); ctx.lineTo(w.x, w.y + l.winH / 2); ctx.stroke();
  });
  const dw = l.hw * 0.2, dh = l.floorH * 0.62, d = l.door;
  ctx.fillStyle = '#6b3e1f'; ctx.fillRect(d.x - dw / 2, ground - dh, dw, dh); ctx.strokeRect(d.x - dw / 2, ground - dh, dw, dh);
  if (h.showNum) { ctx.fillStyle = '#ffffff'; ctx.font = `900 ${Math.round(dh * 0.4)}px "Arial Black",Arial,sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(h.num, d.x, ground - dh * 0.6); }
}
function drawTruck(l) {
  const { tx, ty, tw, th } = l;
  ctx.lineWidth = 3; ctx.strokeStyle = '#1b1030';
  ctx.fillStyle = '#c1121f'; rr(tx, ty, tw * 0.72, th * 0.82, 4); ctx.fill(); ctx.stroke();
  rr(tx + tw * 0.68, ty + th * 0.18, tw * 0.3, th * 0.64, 4); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#bfe3ff'; rr(tx + tw * 0.74, ty + th * 0.26, tw * 0.18, th * 0.26, 3); ctx.fill(); ctx.stroke();
  emoji('🐶', tx + tw * 0.83, ty + th * 0.4, th * 0.26);
  ctx.fillStyle = '#ffd60a'; ctx.fillRect(tx + 4, ty + th * 0.46, tw * 0.64, th * 0.1);
  // siren light - small, blinks at 2 Hz
  ctx.fillStyle = Math.floor(J.t * 4) % 2 ? '#1d5fc4' : '#ffd60a';
  rr(tx + tw * 0.78, ty + th * 0.06, tw * 0.1, th * 0.13, 3); ctx.fill(); ctx.stroke();
  // hose reel
  ctx.fillStyle = '#ffd60a'; ctx.beginPath(); ctx.arc(l.noz.x - 6, ty - 2, th * 0.12, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  for (const wx of [tx + tw * 0.18, tx + tw * 0.82]) {
    ctx.fillStyle = '#1b1030'; ctx.beginPath(); ctx.arc(wx, ty + th * 0.85, th * 0.18, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#d9d9d9'; ctx.beginPath(); ctx.arc(wx, ty + th * 0.85, th * 0.08, 0, Math.PI * 2); ctx.fill();
  }
}
function drawLadder(l, ext) {
  const B = l.base, T = ladderTarget(l), x2 = B.x + (T.x - B.x) * ext, y2 = B.y + (T.y - B.y) * ext;
  const dx = x2 - B.x, dy = y2 - B.y, len = Math.hypot(dx, dy) || 1, nx = -dy / len * 9, ny = dx / len * 9;
  ctx.strokeStyle = '#1b1030'; ctx.lineWidth = 7; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(B.x + nx, B.y + ny); ctx.lineTo(x2 + nx, y2 + ny); ctx.moveTo(B.x - nx, B.y - ny); ctx.lineTo(x2 - nx, y2 - ny); ctx.stroke();
  ctx.strokeStyle = '#d9d9d9'; ctx.lineWidth = 3.5;
  ctx.beginPath(); ctx.moveTo(B.x + nx, B.y + ny); ctx.lineTo(x2 + nx, y2 + ny); ctx.moveTo(B.x - nx, B.y - ny); ctx.lineTo(x2 - nx, y2 - ny); ctx.stroke();
  ctx.strokeStyle = '#1b1030'; ctx.lineWidth = 3;
  for (let d = 12; d < len; d += 15) { const px = B.x + dx * d / len, py = B.y + dy * d / len; ctx.beginPath(); ctx.moveTo(px + nx, py + ny); ctx.lineTo(px - nx, py - ny); ctx.stroke(); }
  ctx.lineCap = 'butt';
  ctx.fillStyle = '#4a4a5a'; ctx.beginPath(); ctx.arc(B.x, B.y, 8, 0, Math.PI * 2); ctx.fill();
  return { x: x2, y: y2 };
}
function draw() {
  const l = L();
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = G.s === 3 ? '#2b2f6b' : G.s === 2 ? '#ffe7c2' : '#d7ecff'; ctx.fillRect(0, 0, W, H);
  if (G.s === 3) { ctx.fillStyle = '#ffd60a'; for (let i = 0; i < 14; i++) ctx.fillRect((i * 97) % W, (i * 53) % (H * 0.4), 3, 3); emoji('🌙', W * 0.12, H * 0.12, 30); }
  else emoji('☀️', W * 0.12, H * 0.12, 34);
  ctx.fillStyle = '#5fb04a'; ctx.fillRect(0, l.ground, W, H - l.ground);
  ctx.strokeStyle = '#1b1030'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(0, l.ground); ctx.lineTo(W, l.ground); ctx.stroke();
  drawHouse(l);
  // friend
  const T = ladderTarget(l), w = l.wins[J.win];
  const fsz = Math.min(l.winH * 1.05, 46);
  if (G.job !== 'fire' && J.phase !== 'rescue' && J.phase !== 'wave') {
    emoji(G.friend[0], w.x, w.y + Math.sin(J.t * 6) * 2, fsz);
    if (J.phase === 'ladder' || (J.phase === 'fire' && G.job === 'both')) { // help bubble
      ctx.fillStyle = '#ffffff'; ctx.strokeStyle = '#1b1030'; ctx.lineWidth = 2.5;
      const bx = w.x + l.winW * 0.2, by = w.y - l.winH * 0.5 - 30; rr(bx, by, 62, 24, 4); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#1b1030'; ctx.font = '800 15px "Baloo 2","Arial Black",sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('Help!', bx + 31, by + 13);
    }
  }
  // flames
  for (const f of J.flames) if (!f.out) { const p = spotPos(l, f.a); drawFlame(p.x, p.y + l.fb * 0.25, f.s, f.ph, l.fb * 1.25); }
  // ladder
  if (J.phase === 'ladder' || J.phase === 'rescue' || (G.job !== 'fire' && J.phase === 'wave')) {
    const tol = G.cfg.tol, inBand = Math.abs(J.ext - 1) <= tol;
    if (J.phase === 'ladder') {
      ctx.setLineDash([6, 6]); ctx.lineWidth = 4; ctx.strokeStyle = inBand ? '#1e7a3c' : '#b39400';
      ctx.beginPath(); ctx.arc(T.x, T.y, 22 + Math.sin(J.t * 5) * 3, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
    }
    const tip = drawLadder(l, J.phase === 'ladder' ? J.ext : 1);
    if (J.phase === 'rescue') {
      const k = clamp(J.rescueT / 1.6, 0, 1), B = l.base;
      const fx2 = w.x + (B.x - w.x) * k, fy2 = w.y + (B.y - 18 - w.y) * k;
      emoji(G.friend[0], fx2, fy2 - Math.abs(Math.sin(J.rescueT * 10)) * 6, fsz);
    }
    void tip;
  }
  drawTruck(l);
  if (J.phase === 'wave' && G.job === 'fire') emoji(G.friend[0], l.door.x, l.door.y - Math.abs(Math.sin(J.t * 8)) * 10, Math.min(l.floorH * 0.55, 48));
  if (J.phase === 'wave' && G.job === 'fire') emoji('💖', l.door.x + 30, l.door.y - 40 - (J.t - J.waveT) * 20, 22);
  // water stream
  if (J.phase === 'fire' && J.spraying && J.aim) {
    const N = l.noz, A = J.aim, cx = (N.x + A.x) / 2, cy = Math.min(N.y, A.y) - 50;
    ctx.lineCap = 'round';
    ctx.strokeStyle = '#1d5fc4'; ctx.lineWidth = 9; ctx.beginPath(); ctx.moveTo(N.x, N.y); ctx.quadraticCurveTo(cx, cy, A.x, A.y); ctx.stroke();
    ctx.strokeStyle = '#a8d8ff'; ctx.lineWidth = 3.5; ctx.setLineDash([10, 8]); ctx.lineDashOffset = -J.t * 120;
    ctx.beginPath(); ctx.moveTo(N.x, N.y); ctx.quadraticCurveTo(cx, cy, A.x, A.y); ctx.stroke(); ctx.setLineDash([]); ctx.lineCap = 'butt';
  }
  if (J.phase === 'fire' && J.keyAim && J.aim) { ctx.strokeStyle = '#1b1030'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(J.aim.x, J.aim.y, 14, 0, Math.PI * 2); ctx.stroke(); }
  // particles
  for (const p of J.parts) {
    if (p.k === 'txt') { ctx.fillStyle = '#1b1030'; ctx.font = '800 20px "Baloo 2","Arial Black",sans-serif'; ctx.textAlign = 'center'; ctx.fillText(p.t, p.x, p.y); continue; }
    ctx.globalAlpha = p.k === 'drop' ? 1 : clamp(p.life, 0, 1) * (p.k === 'smoke' ? 0.55 : 0.85);
    ctx.fillStyle = p.k === 'smoke' ? '#8a8a99' : p.k === 'steam' ? '#ffffff' : '#1d5fc4';
    ctx.beginPath(); ctx.arc(p.x, p.y, Math.max(1, p.r), 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

/* ---------- finish ---------- */
function finishCall() {
  if (!$('ov').hidden) return;
  const [e, n] = G.friend, idx = G.s * 4 + G.call;
  const isNew = !prog.badges.includes(idx);
  if (isNew) prog.badges.push(idx);
  if (G.call === 3) prog.done[G.s] = true;   // save the shift's star with its last badge: a reload on the thank-you screen used to lose it
  saveProg();
  SFX.win(); confettiBurst(90);
  const last = G.call === 3;
  say(`Thank you, Pepper! You got the ${n} badge!`);
  overlay(`<div class="big" aria-hidden="true">${e}</div><h2 id="ovTitle">Thank you, Pepper!</h2><p class="desc">${isNew ? 'New badge' : 'Badge'}: ${n} 🏅</p>`,
    [{ t: last ? 'Finish shift ⭐' : 'Next call ▶', cls: last ? 'green' : 'red', fn: () => {
      if (last) finishShift(); else { G.call++; startCall(); }
    } }]);
}
function finishShift() {
  prog.done[G.s] = true; saveProg();
  SFX.win(); confettiBurst(160);
  const next = G.s < 3;
  say(next ? 'Shift done! Super fire pup!' : 'You finished every shift! Fire Chief Pepper!');
  const btns = [{ t: '🏠 Station', cls: 'grey', fn: renderTitle }];
  if (next) btns.push({ t: `Shift ${G.s + 2} ▶`, cls: 'green', fn: () => startShift(G.s + 1) });
  else btns.push({ t: '📒 Badges', cls: 'yellow', fn: renderBook });
  overlay(`<div class="big" aria-hidden="true">${next ? '⭐' : '🏆'}</div><h2 id="ovTitle">${next ? `Shift ${G.s + 1} done!` : 'Fire Chief Pepper!'}</h2><p class="desc">${next ? 'Four friends helped. Super fire pup!' : (prog.done.every(Boolean) ? 'Every shift done. ' : 'The hardest shift is done. ') + 'The whole town says thank you!'}</p>`, btns);
}

/* ---------- badge book ---------- */
let resetArm = false, resetArmAt = 0;
function renderBook() {
  $('book').innerHTML = FRIENDS.map((f, i) => prog.badges.includes(i)
    ? `<div class="slot"><span class="e" aria-hidden="true">${f[0]}</span>${f[1]}</div>`
    : `<div class="slot no"><span class="e" aria-hidden="true">?</span>Shift ${Math.floor(i / 4) + 1}</div>`).join('');
  $('bookCount').textContent = `${prog.badges.length} of 16 friends helped`;
  resetArm = false; $('resetBtn').textContent = 'Start over';
  show('sBook');
}
$('bookBtn').onclick = () => { ensureAudio(); SFX.tap(); renderBook(); };
$('bookBack').onclick = () => { SFX.tap(); renderTitle(); };
$('resetBtn').onclick = () => {
  if (!resetArm) { resetArm = true; resetArmAt = performance.now(); $('resetBtn').textContent = 'Tap again to clear'; return; }
  if (performance.now() - resetArmAt < 700) return;   // a double-tap used to wipe every badge and star
  prog = { done: [false, false, false, false], badges: [] }; saveProg(); renderBook();
};
$('homeBtn').onclick = () => { runId++; ensureAudio(); SFX.tap(); $('ov').hidden = true; J.phase = ''; renderTitle(); try { speechSynthesis.cancel(); } catch (e) {} };
function setMuteUI() { $('muteBtn').textContent = muted ? '🔇' : '🔊'; $('muteBtn').setAttribute('aria-pressed', String(!muted)); }
$('muteBtn').onclick = () => {
  muted = !muted; save(KEY + 'muted', muted); ensureAudio();
  if (master) master.gain.value = muted ? 0 : 0.9;
  if (muted) { try { speechSynthesis.cancel(); } catch (e) {} } else SFX.tap();
  setMuteUI();
};
/* 27 Nov 2026: a double-tap must not press whatever button the next screen puts under the finger.
   A tap on a button is ignored if it lands within 400 ms and a fingertip's width of a tap on another button that has since left the screen. */
(function () { let t0 = 0, el = null, x0 = 0, y0 = 0;
  document.addEventListener('click', e => { const b = e.target.closest && e.target.closest('button'); if (!b || (!e.detail && !e.clientX && !e.clientY)) return;   // keyboard presses and scripted clicks have no position: leave them alone
    const now = performance.now(), gone = el && !(el.isConnected && el.getClientRects().length);
    if (now - t0 < 400 && b !== el && gone && Math.hypot(e.clientX - x0, e.clientY - y0) < 56) { e.stopPropagation(); e.preventDefault(); return; }
    t0 = now; el = b; x0 = e.clientX; y0 = e.clientY; }, true); })();
setMuteUI();
renderTitle();
</script>
