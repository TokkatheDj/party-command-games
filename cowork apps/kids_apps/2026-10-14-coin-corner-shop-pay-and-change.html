<!-- CONCEPT: PRETEND PLAY / LEARNING (money) - Coin Corner Shop: shop at Rosie the raccoon's toy shop by tapping real-size pennies, nickels, dimes and quarters out of your coin purse onto the counter until a filling meter hits the price tag exactly, then PAY to bag the toy; four streets climb from Penny Lane (count 2-10 pennies) through Nickel Street, Dime Drive and Quarter Market (with a gold star for paying with the fewest coins), then Shopkeeper Day flips roles so kids count up the change for animal customers, plus a Piggy Bank free-play that adds up any coins you drop in. Running subtotals under every coin teach counting on. No timer, no losing - too much or too little just gets a friendly nudge and a glowing hint coin. Ages 4-11. -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Coin Corner Shop</title>
<style>
:root{
  --bg1:#ffeaa8; --bg2:#ffc6d9; --ink:#3b2a4a; --panel:#fffaf0; --wood:#c98a52; --wood2:#a86a36;
  --awn1:#ff6b6b; --awn2:#ffffff; --sky:#4fb3ff; --good:#33c36a; --over:#ff9f2e; --gold:#ffd23f;
  --purple:#8e5cff; --pink:#ff4f9a; --copper1:#f6b984; --copper2:#b25f27; --silver1:#f7f9fc; --silver2:#9aa4b0;
  --shadow:0 5px 0 rgba(0,0,0,.14);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0; padding: 0; height: 100%;
  touch-action: manipulation;
  user-select: none; -webkit-user-select: none;
  overflow: hidden;
}
body{ font-family:"Comic Sans MS","Trebuchet MS",system-ui,sans-serif; color:var(--ink);
  background:linear-gradient(180deg,var(--bg1),var(--bg2)); }
button{ font-family:inherit; color:inherit; cursor:pointer; border:none; background:none; padding:0; }
.screen{ position:fixed; inset:0; display:none; flex-direction:column; align-items:center; height:100dvh; }
.screen.on{ display:flex; }
.awning{ flex:0 0 auto; width:100%; height:20px;
  background:repeating-linear-gradient(90deg,var(--awn1) 0 28px,var(--awn2) 28px 56px);
  -webkit-mask:radial-gradient(circle at 14px 6px,#000 14px,transparent 15px) 0 0/28px 20px repeat-x, linear-gradient(#000,#000) 0 0/100% 6px no-repeat;
  mask:radial-gradient(circle at 14px 6px,#000 14px,transparent 15px) 0 0/28px 20px repeat-x, linear-gradient(#000,#000) 0 0/100% 6px no-repeat; }
.col{ width:100%; max-width:520px; padding:0 12px; }
.title{ margin:4px 0 0; text-align:center; line-height:1.1; font-size:clamp(32px,9vw,48px);
  background:linear-gradient(90deg,var(--pink),var(--purple)); -webkit-background-clip:text; background-clip:text; color:transparent; }
.round{ width:48px; height:48px; border-radius:50%; background:#fff; box-shadow:var(--shadow); font-size:24px; flex:0 0 auto; }
.round:active,.street:active,.big:active,.pbtn:active{ transform:translateY(3px); box-shadow:0 2px 0 rgba(0,0,0,.14); }

/* ---------- menu ---------- */
#menu{ overflow-y:auto; overflow-x:hidden; }
#menu .col{ padding-bottom:24px; }
.welcome{ display:flex; align-items:center; gap:10px; margin:8px 0 6px; }
.welcome .rosie{ font-size:56px; }
.welcome .bubble{ position:relative; }
.street{ display:flex; align-items:center; gap:12px; width:100%; min-height:76px; margin:9px 0; padding:10px 14px;
  background:#fff; border-radius:20px; box-shadow:var(--shadow); text-align:left; font-weight:bold; font-size:clamp(17px,4.8vw,22px); }
.street .ico{ font-size:36px; flex:0 0 auto; }
.street .nm{ flex:1; display:flex; flex-direction:column; gap:4px; }
.street .mini{ display:flex; gap:4px; align-items:center; }
.street .st{ font-size:clamp(15px,4vw,19px); flex:0 0 auto; text-align:right; }
.street.done{ background:linear-gradient(90deg,#fff,#e6ffe9); }
.big{ display:block; width:100%; min-height:68px; margin:10px 0; border-radius:22px; box-shadow:var(--shadow);
  font-size:clamp(20px,5.6vw,26px); font-weight:bold; color:#fff; background:linear-gradient(90deg,var(--pink),#ff8a5c); }
.big.green{ background:linear-gradient(90deg,#2fbf65,#6ad66b); }
.big.blue{ background:linear-gradient(90deg,#3f9cff,#7a6bff); }
.shelfBox{ background:rgba(255,255,255,.75); border-radius:20px; padding:10px 12px; margin-top:8px; box-shadow:var(--shadow); }
.shelfBox h3{ margin:0 0 6px; font-size:20px; }
.shelf{ display:flex; flex-wrap:wrap; gap:6px; font-size:30px; min-height:40px; align-items:center; }
.shelf .empty{ font-size:16px; opacity:.7; }

/* ---------- play ---------- */
.bar{ flex:0 0 auto; display:flex; align-items:center; gap:8px; padding:6px 0 4px; }
.sname{ flex:1; text-align:center; font-weight:bold; font-size:clamp(17px,4.8vw,23px); line-height:1.1; }
.bag{ background:#fff; border-radius:24px; padding:0 12px; height:48px; display:flex; align-items:center; gap:4px;
  font-weight:bold; font-size:18px; box-shadow:var(--shadow); flex:0 0 auto; }
.bag.bump{ animation:bump .5s; }
@keyframes bump{ 40%{ transform:scale(1.25);} }
.scene{ flex:1 1 auto; min-height:0; display:flex; flex-direction:column; justify-content:center; gap:4px; }
.keeper{ display:flex; align-items:center; gap:8px; }
.rosie{ font-size:clamp(40px,8vh,58px); line-height:1; flex:0 0 auto; }
.rosie.happy{ animation:hop .6s 2; }
@keyframes hop{ 50%{ transform:translateY(-14px) rotate(-8deg);} }
.bubble{ flex:1; background:#fff; border-radius:18px; padding:8px 12px; font-size:clamp(15px,4.2vw,19px); font-weight:bold;
  box-shadow:var(--shadow); line-height:1.25; min-height:44px; display:flex; align-items:center; position:relative; }
.bubble::before{ content:""; position:absolute; left:-9px; top:50%; margin-top:-8px; border:8px solid transparent; border-right:10px solid #fff; border-left:0; }
.bubble>span{ display:block; }
.counter{ position:relative; display:flex; align-items:center; justify-content:center; gap:10px;
  background:linear-gradient(180deg,var(--wood),var(--wood2)); border-radius:18px; padding:6px 10px; min-height:clamp(84px,15vh,118px);
  box-shadow:inset 0 -6px 0 rgba(0,0,0,.15), var(--shadow); }
.customer{ font-size:clamp(40px,8vh,58px); line-height:1; display:none; }
.customer.on{ display:block; animation:walkin .6s ease-out; }
@keyframes walkin{ from{ transform:translateX(-60px); opacity:0;} }
.item{ font-size:clamp(46px,9.5vh,74px); line-height:1; filter:drop-shadow(0 4px 0 rgba(0,0,0,.18)); }
.item.pop{ animation:itemIn .5s cubic-bezier(.3,1.6,.5,1); }
@keyframes itemIn{ from{ transform:scale(.2) rotate(-20deg);} }
.tag{ background:#fff7c2; border:3px solid #e9b200; border-radius:10px 22px 22px 10px; padding:4px 12px 4px 16px; position:relative;
  font-weight:900; font-size:clamp(26px,7vw,36px); text-align:center; transform:rotate(4deg); box-shadow:0 4px 0 rgba(0,0,0,.18); }
.tag::before{ content:""; position:absolute; left:5px; top:50%; width:7px; height:7px; margin-top:-4px; border-radius:50%; background:var(--wood2); }
.dots{ display:flex; flex-wrap:wrap; justify-content:center; gap:3px; max-width:84px; margin:2px auto 0; }
.dots i{ width:10px; height:10px; border-radius:50%; background:var(--copper2); }
.paidBox{ display:none; flex-direction:column; align-items:center; gap:2px; font-weight:bold; font-size:14px; color:#fff; text-shadow:0 1px 0 rgba(0,0,0,.4); }
.paidBox.on{ display:flex; }
.paidBox .pc{ display:flex; gap:2px; }

.meter{ flex:0 0 auto; margin-top:6px; }
.mtrack{ position:relative; height:30px; border-radius:16px; background:#fff; box-shadow:inset 0 3px 0 rgba(0,0,0,.08), var(--shadow); overflow:visible; }
.mfill{ position:absolute; left:0; top:0; bottom:0; width:0; border-radius:16px; background:var(--sky); transition:width .3s, background .3s; }
.mfill.exact{ background:var(--good); }
.mfill.over{ background:var(--over); }
.mbase{ position:absolute; left:0; top:0; bottom:0; width:0; border-radius:16px 0 0 16px; z-index:1;
  background:repeating-linear-gradient(45deg,rgba(255,255,255,.55) 0 6px,transparent 6px 12px); }
.mgoal{ position:absolute; top:-6px; bottom:-6px; width:6px; margin-left:-3px; background:var(--ink); border-radius:3px; z-index:2; transition:left .3s; }
.mgoal span{ position:absolute; top:-2px; left:8px; font-size:14px; font-weight:900; background:#fff7c2; border-radius:8px; padding:0 5px; white-space:nowrap; }
.mrow{ display:flex; justify-content:space-between; align-items:baseline; margin-top:4px; }
.mtotal{ font-size:clamp(24px,6.5vw,32px); font-weight:900; }
.meq{ font-size:clamp(14px,3.9vw,18px); font-weight:bold; opacity:.85; }
.meter.shake{ animation:shake .4s; }
@keyframes shake{ 25%{ transform:translateX(-8px);} 75%{ transform:translateX(8px);} }

.tray{ flex:0 0 auto; height:clamp(92px,16vh,120px); margin-top:6px; border-radius:18px; padding:6px;
  background:linear-gradient(180deg,#4fb06f,#2e8a52); box-shadow:inset 0 0 0 4px rgba(255,255,255,.25), var(--shadow);
  display:flex; flex-wrap:wrap; align-content:flex-start; justify-content:center; gap:4px 6px; overflow-y:auto; position:relative; }
.trayHint{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:rgba(255,255,255,.85);
  font-weight:bold; font-size:clamp(15px,4.2vw,19px); text-align:center; padding:0 10px; pointer-events:none; }
.tcoin{ display:flex; flex-direction:column; align-items:center; min-width:44px; min-height:44px; }
.tcoin .sub{ font-size:13px; font-weight:900; color:#fff; text-shadow:0 1px 0 rgba(0,0,0,.4); line-height:1.1; }
.tcoin.new .coin{ animation:drop .35s cubic-bezier(.3,1.6,.5,1); }
@keyframes drop{ from{ transform:translateY(-40px) scale(.6);} }
.startChip{ align-self:flex-start; background:#fff7c2; border-radius:12px; padding:2px 8px; font-weight:900; font-size:16px; margin-top:8px; }

.purse{ flex:0 0 auto; display:flex; justify-content:center; gap:8px; margin-top:8px; }
.pbtn{ flex:1 1 0; max-width:104px; min-height:96px; border-radius:18px; background:#fff; box-shadow:var(--shadow);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; position:relative; padding:6px 2px; }
.pbtn .cn{ font-size:13px; font-weight:bold; }
.pbtn .badge{ position:absolute; top:-6px; right:-4px; background:var(--purple); color:#fff; border-radius:12px; min-width:30px; height:24px;
  font-size:15px; font-weight:900; display:flex; align-items:center; justify-content:center; padding:0 6px; }
.pbtn.empty{ opacity:.4; }
.actions{ flex:0 0 auto; display:flex; gap:10px; margin:8px 0 10px; }
.hint{ width:64px; height:64px; border-radius:50%; background:#fff3a6; font-size:30px; box-shadow:var(--shadow); flex:0 0 auto; }
.pay{ flex:1; height:64px; border-radius:22px; font-size:clamp(22px,6vw,28px); font-weight:900; color:#fff;
  background:linear-gradient(90deg,#2fbf65,#6ad66b); box-shadow:var(--shadow); }
.pay.ready{ animation:pulse 1s infinite; }
@keyframes pulse{ 50%{ transform:scale(1.05); box-shadow:0 0 0 8px rgba(51,195,106,.35);} }
.glow{ animation:glow .9s infinite !important; border-radius:50%; }
.pbtn.glow{ border-radius:18px; }
@keyframes glow{ 50%{ box-shadow:0 0 0 7px var(--gold), 0 0 22px 8px rgba(255,210,63,.9);} }

/* ---------- coins ---------- */
.coin{ --d:56px; --c1:var(--silver1); --c2:var(--silver2); width:var(--d); height:var(--d); border-radius:50%; flex:0 0 auto;
  display:grid; place-items:center; font-weight:900; font-size:calc(var(--d) * .31); letter-spacing:-.5px;
  background:radial-gradient(circle at 34% 30%, var(--c1), var(--c2) 78%); color:#2d3540; text-shadow:0 1px 0 rgba(255,255,255,.6);
  box-shadow:inset 0 0 0 calc(var(--d) * .06) rgba(255,255,255,.4), inset 0 0 0 calc(var(--d) * .11) rgba(0,0,0,.12), 0 3px 0 rgba(0,0,0,.28); }
.coin.v1{ --c1:var(--copper1); --c2:var(--copper2); color:#4d2205; text-shadow:0 1px 0 rgba(255,220,180,.6); }
.coin.v10,.coin.v25{ outline:2px dashed rgba(60,70,85,.28); outline-offset:-3px; }

/* ---------- piggy ---------- */
.ptotal{ text-align:center; font-size:clamp(46px,13vw,72px); font-weight:900; margin:4px 0 0; line-height:1; }
.psub{ text-align:center; font-weight:bold; font-size:18px; min-height:24px; opacity:.85; }
.pig{ font-size:clamp(90px,22vh,150px); text-align:center; line-height:1.1; margin:4px 0; }
.pig.wig{ animation:wig .45s; }
@keyframes wig{ 30%{ transform:rotate(-8deg) scale(1.06);} 70%{ transform:rotate(6deg);} }
.flying{ position:fixed; z-index:50; pointer-events:none; }
.float{ position:fixed; z-index:60; pointer-events:none; font-weight:900; font-size:22px; color:var(--purple);
  text-shadow:0 2px 0 #fff; animation:floatUp .9s ease-out forwards; }
@keyframes floatUp{ to{ transform:translateY(-48px); opacity:0; } }

/* ---------- overlay ---------- */
.overlay{ position:fixed; inset:0; z-index:40; display:none; align-items:center; justify-content:center; background:rgba(59,42,74,.45); padding:16px; }
.overlay.on{ display:flex; }
.card{ width:100%; max-width:420px; background:var(--panel); border-radius:26px; padding:18px; text-align:center; box-shadow:0 10px 0 rgba(0,0,0,.2);
  animation:itemIn .5s cubic-bezier(.3,1.6,.5,1); }
.card h2{ margin:0; font-size:clamp(26px,7vw,34px); }
.card .got{ font-size:clamp(30px,8.5vw,42px); margin:10px 0; display:flex; flex-wrap:wrap; justify-content:center; gap:4px 8px; }
.card .got span{ position:relative; }
.card .got b{ position:absolute; right:-6px; top:-8px; font-size:20px; }
.card p{ font-size:19px; font-weight:bold; margin:6px 0; }
#fx{ position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:70; }
</style>
</head>
<body>

<!-- MENU -->
<section id="menu" class="screen on">
  <div class="awning"></div>
  <div class="col">
    <div style="display:flex;justify-content:flex-end;margin-top:6px"><button class="round" id="sndBtnM" aria-label="Sound">🔊</button></div>
    <h1 class="title">Coin Corner Shop</h1>
    <div class="welcome"><div class="rosie">🦝</div><div class="bubble"><span>Hi! I'm Rosie. Pick a street to go shopping!</span></div></div>
    <div id="streets"></div>
    <button class="big blue" id="piggyBtn">🐷 Piggy Bank</button>
    <div class="shelfBox"><h3>🧸 My Toy Shelf</h3><div class="shelf" id="shelf"></div></div>
  </div>
</section>

<!-- PLAY -->
<section id="play" class="screen">
  <div class="awning"></div>
  <div class="col" style="display:flex;flex-direction:column;flex:1 1 auto;min-height:0">
    <header class="bar">
      <button class="round" id="homeBtn" aria-label="Home">🏠</button>
      <div class="sname" id="sname"></div>
      <div class="bag" id="bag">🛍️ <span id="bagN">0</span>/5</div>
      <button class="round" id="sndBtn" aria-label="Sound">🔊</button>
    </header>
    <div class="scene">
      <div class="keeper"><div class="rosie" id="rosie">🦝</div><div class="bubble" id="bubble"><span></span></div></div>
      <div class="counter">
        <div class="customer" id="customer"></div>
        <div class="item" id="item"></div>
        <div class="tag" id="tag"><div id="tagPrice"></div><div class="dots" id="dots"></div></div>
        <div class="paidBox" id="paidBox"><span>pays</span><div class="pc" id="paidCoins"></div></div>
      </div>
    </div>
    <div class="meter" id="meter">
      <div class="mtrack"><div class="mfill" id="mFill"></div><div class="mbase" id="mBase"></div><div class="mgoal" id="mGoal"><span id="mGoalLbl"></span></div></div>
      <div class="mrow"><div class="mtotal" id="mTotal">0¢</div><div class="meq" id="mEq"></div></div>
    </div>
    <div class="tray" id="tray"></div>
    <div class="purse" id="purse"></div>
    <div class="actions"><button class="hint" id="hintBtn" aria-label="Hint">💡</button><button class="pay" id="payBtn">Pay</button></div>
  </div>
</section>

<!-- PIGGY -->
<section id="piggy" class="screen">
  <div class="awning"></div>
  <div class="col" style="display:flex;flex-direction:column;flex:1 1 auto;min-height:0">
    <header class="bar">
      <button class="round" id="homeBtn2" aria-label="Home">🏠</button>
      <div class="sname">🐷 Piggy Bank</div>
      <button class="round" id="sndBtnP" aria-label="Sound">🔊</button>
    </header>
    <div style="flex:1 1 auto;min-height:0;display:flex;flex-direction:column;justify-content:center">
      <div class="ptotal" id="pTotal">0¢</div>
      <div class="psub" id="pSub">Tap a coin to drop it in!</div>
      <div class="pig" id="pig">🐷</div>
    </div>
    <div class="purse" id="pPurse"></div>
    <div class="actions"><button class="pay" id="pEmpty" style="background:linear-gradient(90deg,#ff7aa8,#ffa36c)">Shake it out 🔄</button></div>
  </div>
</section>

<!-- STREET DONE -->
<div class="overlay" id="doneOv">
  <div class="card">
    <h2 id="doneTitle">Street complete!</h2>
    <div class="got" id="doneGot"></div>
    <p id="doneMsg"></p>
    <button class="big green" id="doneNext">Next street ▶</button>
    <button class="big blue" id="doneMap">🗺️ All streets</button>
  </div>
</div>

<canvas id="fx"></canvas>

<script>
const $ = s => document.querySelector(s);
const ri = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

const NAME = { 1: 'penny', 5: 'nickel', 10: 'dime', 25: 'quarter' };
const SIZE = { 1: .8, 5: .88, 10: .74, 25: 1 };   // real relative sizes: the dime is the smallest!
const ITEMS = [['🧸','teddy bear'],['🪀','yo-yo'],['🎈','balloon'],['🍭','lollipop'],['🦆','rubber duck'],['🚂','toy train'],
  ['🪁','kite'],['🖍️','crayons'],['🍪','cookie'],['🧃','juice box'],['🍎','apple'],['🦕','dino toy'],['⚽','ball'],
  ['🎨','paint set'],['🧁','cupcake'],['🐠','toy fish'],['🚀','rocket'],['🎺','trumpet'],['🧩','puzzle'],['🍩','donut'],
  ['🛼','roller skate'],['🍦','ice cream'],['🪃','boomerang'],['🎲','dice']];
const CUSTOMERS = [['🐰','Bunny'],['🐻','Bear'],['🐸','Frog'],['🐷','Piggy'],['🦊','Fox'],['🐼','Panda'],['🐨','Koala'],['🐯','Tiger'],['🐮','Cow'],['🐭','Mouse']];
const STREETS = [
  { id: 1, name: 'Penny Lane', ico: '🏡', coins: [1], mode: 'pay', ranges: [[2,4],[3,5],[4,7],[5,9],[6,10]] },
  { id: 2, name: 'Nickel Street', ico: '🏪', coins: [5,1], mode: 'pay', ranges: [[5,9],[6,12],[10,15],[11,18],[13,20]] },
  { id: 3, name: 'Dime Drive', ico: '🏬', coins: [10,5,1], mode: 'pay', smart: true, ranges: [[10,20],[12,25],[15,30],[20,35],[25,45]] },
  { id: 4, name: 'Quarter Market', ico: '🎪', coins: [25,10,5,1], mode: 'pay', smart: true, ranges: [[25,40],[30,50],[35,60],[40,75],[50,99]] },
  { id: 5, name: 'Shopkeeper Day', ico: '🦝', coins: [25,10,5,1], mode: 'change', paid: [[10,[5,9]],[10,[2,8]],[25,[12,22]],[25,[6,20]],[50,[26,45]]] },
];

/* ---------- storage ---------- */
const KEY = 'cowork-coinshop-progress', SKEY = 'cowork-coinshop-sound';
let prog = { done: {}, smart: {}, shelf: [] };
try { prog = Object.assign(prog, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(prog)); } catch (e) {} };
let soundOn = localStorage.getItem(SKEY) !== 'off';

/* ---------- audio ---------- */
let AC = null;
function ac() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }
  if (AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(f, dur, type = 'sine', vol = .2, when = 0, slide = 0) {
  if (!soundOn) return; const a = ac(); if (!a) return;
  const t = a.currentTime + when, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + dur);
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur + .05);
}
const sfx = {
  clink(v) { const b = { 1: 1450, 5: 1800, 10: 2500, 25: 2100 }[v]; tone(b, .12, 'triangle', .18); tone(b * 1.5, .2, 'sine', .1, .05); },
  pop() { tone(520, .12, 'sine', .2, 0, 260); },
  boing() { tone(330, .32, 'sine', .18, 0, 150); },
  ching() { tone(523, .12, 'square', .05); [0, .1].forEach(d => { tone(2637, .5, 'triangle', .14, d + .08); tone(3136, .6, 'sine', .1, d + .12); }); },
  fanfare() { [523, 659, 784, 1047].forEach((f, i) => tone(f, .3, 'triangle', .18, i * .12)); tone(1047, .8, 'triangle', .18, .5); tone(784, .8, 'sine', .12, .5); },
};
function speak(t) {
  if (!soundOn || !('speechSynthesis' in window)) return;
  try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(t); u.rate = 1; u.pitch = 1.25; speechSynthesis.speak(u); } catch (e) {}
}
const fmt = c => c < 100 ? c + '¢' : '$' + (c / 100).toFixed(2);
const sayMoney = c => c < 100 ? `${c} cent${c === 1 ? '' : 's'}` : `${Math.floor(c / 100)} dollar${c >= 200 ? 's' : ''}${c % 100 ? ' and ' + (c % 100) + ' cents' : ''}`;

/* ---------- coin helpers ---------- */
function coinEl(v, base) {
  const d = document.createElement('div');
  d.className = 'coin v' + v; d.style.setProperty('--d', Math.round(base * SIZE[v]) + 'px'); d.textContent = v + '¢';
  return d;
}
// fewest coins: greedy is optimal for US coins
function greedy(amt, coins) { const r = {}; for (const v of coins) { r[v] = Math.floor(amt / v); amt -= r[v] * v; } return r; }
const countOf = o => Object.values(o).reduce((a, b) => a + b, 0);
function buildPurse(st, price) {
  const p = {};
  if (st.id === 1) { p[1] = price + ri(1, 3); return p; }
  const sol = greedy(price, st.coins);
  for (const v of st.coins) p[v] = (sol[v] || 0) + (v === 1 ? 0 : ri(v === st.coins[0] ? 0 : 1, 2));
  p[1] = Math.min(4, (sol[1] || 0) + ri(1, 2));   // few pennies, so bigger coins are needed
  return p;
}
// pick the solution closest to what's already on the tray (for hints)
function closestSolution(target, avail, have) {
  const vs = Object.keys(avail).map(Number).sort((a, b) => b - a);
  let best = null, bestScore = Infinity;
  const cur = {};
  (function rec(i, rem) {
    if (i === vs.length) {
      if (rem !== 0) return;
      let s = 0, n = 0; for (const v of vs) { s += Math.abs((cur[v] || 0) - (have[v] || 0)); n += cur[v] || 0; }
      const score = s * 100 + n; if (score < bestScore) { bestScore = score; best = Object.assign({}, cur); }
      return;
    }
    const v = vs[i], mx = Math.min(avail[v], Math.floor(rem / v));
    for (let c = mx; c >= 0; c--) { cur[v] = c; rec(i + 1, rem - c * v); }
    cur[v] = 0;
  })(0, target);
  return best;
}

/* ---------- state ---------- */
const S = { st: null, idx: 0, items: [], item: null, cust: null, price: 0, paid: 0, purse: {}, tray: [], wrongs: 0, busy: false, bought: [], lastAdd: -1 };
const isChange = () => S.st && S.st.mode === 'change';
const trayTotal = () => S.tray.reduce((a, b) => a + b, 0);
const total = () => (isChange() ? S.price : 0) + trayTotal();
const goal = () => isChange() ? S.paid : S.price;
const trayCounts = () => { const c = {}; S.tray.forEach(v => c[v] = (c[v] || 0) + 1); return c; };

/* ---------- screens ---------- */
function show(id) { document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === id)); if (id === 'menu') renderMenu(); }
function syncSound() { document.querySelectorAll('#sndBtn,#sndBtnM,#sndBtnP').forEach(b => b.textContent = soundOn ? '🔊' : '🔇'); }
function toggleSound() { soundOn = !soundOn; localStorage.setItem(SKEY, soundOn ? 'on' : 'off'); syncSound(); if (!soundOn && 'speechSynthesis' in window) speechSynthesis.cancel(); else sfx.pop(); }

function renderMenu() {
  const box = $('#streets'); box.innerHTML = '';
  STREETS.forEach((st, i) => {
    const b = document.createElement('button');
    b.className = 'street' + (prog.done[st.id] ? ' done' : '');
    const mini = st.coins.map(v => coinEl(v, 26).outerHTML).join('');
    const stars = prog.done[st.id] ? '✅' + (st.smart ? `<br>${'⭐'.repeat(Math.min(5, prog.smart[st.id] || 0)) || ''}` : '') : '';
    b.innerHTML = `<span class="ico">${st.ico}</span><span class="nm">${st.name}<span class="mini">${st.mode === 'change' ? '<span style="font-size:15px">give change</span>' : mini}</span></span><span class="st">${stars}</span>`;
    b.onclick = () => { sfx.pop(); startStreet(i); };
    box.appendChild(b);
  });
  const sh = $('#shelf');
  sh.innerHTML = prog.shelf.length ? prog.shelf.map(e => `<span>${e}</span>`).join('') : '<span class="empty">Buy toys to fill your shelf!</span>';
}

/* ---------- play ---------- */
function startStreet(i) {
  S.st = STREETS[i]; S.idx = 0; S.bought = []; S.busy = false; S.gen = (S.gen || 0) + 1;
  S.items = shuffle(ITEMS).slice(0, 5);
  $('#sname').textContent = S.st.ico + ' ' + S.st.name;
  $('#doneOv').classList.remove('on');
  show('play'); newItem();
}
function newItem() {
  const st = S.st;
  S.item = S.items[S.idx]; S.tray = []; S.wrongs = 0; S.busy = false; S.lastAdd = -1;
  if (st.mode === 'pay') {
    const [a, b] = st.ranges[S.idx]; S.price = ri(a, b); S.paid = 0; S.purse = buildPurse(st, S.price); S.cust = null;
  } else {
    const [paid, [a, b]] = st.paid[S.idx]; S.paid = paid; S.price = ri(a, b);
    S.purse = {}; st.coins.forEach(v => S.purse[v] = Infinity);
    S.cust = CUSTOMERS[ri(0, CUSTOMERS.length - 1)];
  }
  const it = $('#item'); it.textContent = S.item[0]; it.classList.remove('pop'); void it.offsetWidth; it.classList.add('pop');
  $('#tagPrice').textContent = S.price + '¢';
  $('#dots').innerHTML = st.id === 1 ? '<i></i>'.repeat(S.price) : '';
  const cu = $('#customer'), pb = $('#paidBox');
  cu.classList.remove('on'); pb.classList.toggle('on', isChange());
  if (isChange()) {
    cu.textContent = S.cust[0]; void cu.offsetWidth; cu.classList.add('on');
    const pc = $('#paidCoins'); pc.innerHTML = '';
    greedyList(S.paid).forEach(v => pc.appendChild(coinEl(v, 40)));
    say(`${S.cust[1]} pays ${S.paid}¢ for the ${S.item[1]}. Give the change!`,
        `The ${S.item[1]} costs ${sayMoney(S.price)}. ${S.cust[1]} pays ${sayMoney(S.paid)}. Count up the change!`);
  } else {
    say(`The ${S.item[1]} is ${S.price}¢, please!`, `The ${S.item[1]} is ${sayMoney(S.price)}, please!`);
  }
  $('#payBtn').textContent = isChange() ? 'Give Change 🤝' : 'Pay 💰';
  $('#bagN').textContent = S.bought.length;
  render();
}
const greedyList = amt => { const g = greedy(amt, [25, 10, 5, 1]), out = []; [25, 10, 5, 1].forEach(v => { for (let i = 0; i < g[v]; i++) out.push(v); }); return out; };
function say(text, spoken) { $('#bubble').innerHTML = '<span></span>'; $('#bubble span').textContent = text; if (spoken !== null) speak(spoken || text); }

function render() {
  clearGlow();
  // purse
  const pu = $('#purse'); pu.innerHTML = '';
  S.st.coins.forEach(v => {
    const b = document.createElement('button'); b.className = 'pbtn'; b.dataset.v = v;
    const n = S.purse[v];
    if (n === 0) b.classList.add('empty');
    b.appendChild(coinEl(v, 58));
    const nm = document.createElement('span'); nm.className = 'cn'; nm.textContent = NAME[v]; b.appendChild(nm);
    if (n !== Infinity) { const bd = document.createElement('span'); bd.className = 'badge'; bd.textContent = '×' + n; b.appendChild(bd); }
    b.onclick = () => addCoin(v, b);
    pu.appendChild(b);
  });
  // tray: biggest coins first, with a running count-on number under each
  const tr = $('#tray'); tr.innerHTML = '';
  const sorted = S.tray.slice().sort((a, b) => b - a);
  let run = isChange() ? S.price : 0;
  if (isChange()) { const c = document.createElement('div'); c.className = 'startChip'; c.textContent = '🏷️ ' + S.price + '¢'; tr.appendChild(c); }
  const newAt = sorted.lastIndexOf(S.lastAdd);
  sorted.forEach((v, k) => {
    run += v;
    const w = document.createElement('button'); w.className = 'tcoin'; w.dataset.v = v;
    if (k === newAt) w.classList.add('new');
    w.appendChild(coinEl(v, 46));
    const s = document.createElement('span'); s.className = 'sub'; s.textContent = run + '¢'; w.appendChild(s);
    w.onclick = () => removeCoin(v);
    tr.appendChild(w);
  });
  if (!S.tray.length) { const h = document.createElement('div'); h.className = 'trayHint'; h.textContent = isChange() ? 'Tap coins below to count up the change' : 'Tap your coins to put them here'; tr.appendChild(h); }
  S.lastAdd = -1;
  // meter
  const g = goal(), t = total(), mx = Math.max(g * 1.25, t);
  const f = $('#mFill'); f.style.width = (t / mx * 100) + '%';
  f.className = 'mfill' + (t === g ? ' exact' : t > g ? ' over' : '');
  $('#mBase').style.width = isChange() ? (S.price / mx * 100) + '%' : '0';
  $('#mGoal').style.left = (g / mx * 100) + '%';
  $('#mGoalLbl').textContent = (isChange() ? '🪙 ' : '🏷️ ') + g + '¢';
  $('#mTotal').textContent = fmt(t);
  $('#mEq').textContent = isChange() ? `${S.price}¢ + ${trayTotal()}¢ change = ${t}¢` : (t < g ? `${g - t}¢ more` : t > g ? `${t - g}¢ too much` : 'just right!');
  $('#payBtn').classList.toggle('ready', t === g && !S.busy);
}

function floatText(txt, el) {
  const r = el.getBoundingClientRect(), d = document.createElement('div');
  d.className = 'float'; d.textContent = txt; d.style.left = (r.left + r.width / 2 - 20) + 'px'; d.style.top = (r.top - 10) + 'px';
  document.body.appendChild(d); setTimeout(() => d.remove(), 950);
}
function addCoin(v, btn) {
  if (S.busy) return;
  if (S.purse[v] <= 0) { sfx.boing(); say(`No more ${v === 1 ? 'pennies' : NAME[v] + 's'} in your purse!`); return; }
  S.purse[v]--; S.tray.push(v); S.lastAdd = v;
  sfx.clink(v); if (btn) floatText('+' + v + '¢', btn);
  render();
  const t = total(), g = goal();
  if (t === g) say(isChange() ? 'Just right! Tap Give Change!' : 'Just right! Tap Pay!', sayMoney(t) + '. Just right!');
  else if (t > g) say('Oops, a little too much! Tap a coin on the counter to take it back.', sayMoney(t) + '. That is too much.');
  else say(`${t}¢ … ${g - t}¢ more to go!`, sayMoney(t));
}
function removeCoin(v) {
  if (S.busy) return;
  const i = S.tray.lastIndexOf(v); if (i < 0) return;
  S.tray.splice(i, 1); S.purse[v]++;
  sfx.pop(); render();
  const t = total(), g = goal();
  say(t === g ? 'Just right now!' : t > g ? `Still ${t - g}¢ too much.` : `${t}¢ … ${g - t}¢ more to go!`, sayMoney(t));
}
function pay() {
  if (S.busy) return;
  const t = total(), g = goal();
  if (t === g) return success();
  S.wrongs++; sfx.boing();
  const m = $('#meter'); m.classList.remove('shake'); void m.offsetWidth; m.classList.add('shake');
  if (t < g) say(`Almost! We need ${g - t}¢ more.`, `Almost! We need ${sayMoney(g - t)} more.`);
  else say(`That's ${t - g}¢ too much. Take a coin back!`, `That's ${sayMoney(t - g)} too much. Take a coin back!`);
  if (S.wrongs >= 2) setTimeout(() => showHint(false), 900);
}

/* ---------- hints ---------- */
function clearGlow() { document.querySelectorAll('.glow').forEach(e => e.classList.remove('glow')); }
function showHint(talk = true) {
  if (S.busy) return;
  clearGlow();
  const have = trayCounts(), avail = {};
  const target = goal() - (isChange() ? S.price : 0);
  S.st.coins.forEach(v => avail[v] = S.purse[v] === Infinity ? Math.floor(target / v) : S.purse[v] + (have[v] || 0));
  const sol = closestSolution(target, avail, have);
  if (!sol) return;
  if (countOf(have) === countOf(sol) && S.st.coins.every(v => (have[v] || 0) === (sol[v] || 0))) {
    $('#payBtn').classList.add('glow'); if (talk) say('It\'s just right — tap the green button!'); return;
  }
  const extra = S.st.coins.find(v => (have[v] || 0) > (sol[v] || 0));
  if (extra) {
    const el = document.querySelector(`#tray .tcoin[data-v="${extra}"]`); if (el) el.classList.add('glow');
    if (talk) say(`Take back a ${NAME[extra]}!`); return;
  }
  const need = S.st.coins.find(v => (sol[v] || 0) > (have[v] || 0));
  const el = document.querySelector(`#purse .pbtn[data-v="${need}"]`); if (el) el.classList.add('glow');
  if (talk) say(`Try a ${NAME[need]}! That's ${need}¢.`, `Try a ${NAME[need]}. That's ${sayMoney(need)}.`);
}
let idleT = 0;
function resetIdle() { clearTimeout(idleT); idleT = setTimeout(() => { if ($('#play').classList.contains('on') && !S.busy) showHint(false); }, 20000); }
document.addEventListener('pointerdown', resetIdle);

/* ---------- success ---------- */
function success() {
  S.busy = true; render(); $('#payBtn').classList.remove('ready');
  sfx.ching();
  const smart = S.st.smart && S.tray.length === countOf(greedy(S.price, S.st.coins));
  const rosie = $('#rosie'); rosie.classList.remove('happy'); void rosie.offsetWidth; rosie.classList.add('happy');
  if (isChange()) say(`${S.price}¢ + ${trayTotal()}¢ = ${S.paid}¢. Thank you, ${S.cust[1]}! 🎉`,
                      `${sayMoney(S.price)} plus ${sayMoney(trayTotal())} makes ${sayMoney(S.paid)}. Thank you!`);
  else say(smart ? 'Cha-ching! Fewest coins — smart paying! ⭐' : 'Cha-ching! Thank you! Enjoy your ' + S.item[1] + '!',
           smart ? 'Cha-ching! Smart paying, fewest coins!' : 'Cha-ching! Thank you!');
  S.bought.push({ e: S.item[0], smart });
  if (!prog.shelf.includes(S.item[0])) { prog.shelf.push(S.item[0]); save(); }
  const it = $('#item'), r = it.getBoundingClientRect();
  burst(r.left + r.width / 2, r.top + r.height / 2, 40);
  flyTo(it.textContent, r, $('#bag'), () => { const bg = $('#bag'); $('#bagN').textContent = S.bought.length; bg.classList.remove('bump'); void bg.offsetWidth; bg.classList.add('bump'); });
  it.textContent = '';
  if (isChange()) $('#customer').classList.remove('on');
  const gen = S.gen;
  setTimeout(() => { if (gen !== S.gen || !$('#play').classList.contains('on')) return; S.idx++; if (S.idx >= 5) streetDone(); else newItem(); }, 1700);
}
function flyTo(txt, from, toEl, cb) {
  const d = document.createElement('div'); d.className = 'flying'; d.textContent = txt;
  d.style.fontSize = '64px'; d.style.left = from.left + 'px'; d.style.top = from.top + 'px'; document.body.appendChild(d);
  const to = toEl.getBoundingClientRect();
  const an = d.animate([{ transform: 'translate(0,0) scale(1)' }, { transform: `translate(${to.left - from.left}px,${to.top - from.top - 30}px) scale(1.3)`, offset: .4 },
    { transform: `translate(${to.left - from.left}px,${to.top - from.top}px) scale(.3)` }], { duration: 900, easing: 'ease-in-out' });
  an.onfinish = () => { d.remove(); cb && cb(); };
}
function streetDone() {
  const st = S.st, smartN = S.bought.filter(b => b.smart).length;
  prog.done[st.id] = true; if (st.smart) prog.smart[st.id] = Math.max(prog.smart[st.id] || 0, smartN); save();
  sfx.fanfare(); bigConfetti();
  $('#doneTitle').textContent = st.mode === 'change' ? 'Super shopkeeper! 🎉' : st.name + ' done! 🎉';
  $('#doneGot').innerHTML = S.bought.map(b => `<span>${b.e}${b.smart ? '<b>⭐</b>' : ''}</span>`).join('');
  $('#doneMsg').textContent = st.mode === 'change' ? 'Every customer got the right change!' :
    st.smart ? (smartN ? `${smartN} gold star${smartN > 1 ? 's' : ''} for using the fewest coins!` : 'Try using bigger coins for gold stars!') : 'You paid for every toy!';
  const nx = $('#doneNext'), i = STREETS.indexOf(st);
  nx.textContent = i < STREETS.length - 1 ? 'Next street ▶' : 'Shop again 🔄';
  nx.onclick = () => { sfx.pop(); startStreet(i < STREETS.length - 1 ? i + 1 : i); };
  $('#doneOv').classList.add('on');
  speak(st.mode === 'change' ? 'Super shopkeeper!' : 'Hooray! You bought everything!');
}

/* ---------- piggy bank ---------- */
let piggy = 0, piggyN = 0;
function renderPiggy() {
  $('#pTotal').textContent = fmt(piggy);
  $('#pSub').textContent = piggyN ? `${piggyN} coin${piggyN > 1 ? 's' : ''} inside` : 'Tap a coin to drop it in!';
  const pu = $('#pPurse'); pu.innerHTML = '';
  [25, 10, 5, 1].forEach(v => {
    const b = document.createElement('button'); b.className = 'pbtn'; b.dataset.v = v;
    b.appendChild(coinEl(v, 58));
    const nm = document.createElement('span'); nm.className = 'cn'; nm.textContent = NAME[v]; b.appendChild(nm);
    b.onclick = () => dropPiggy(v, b); pu.appendChild(b);
  });
}
function dropPiggy(v, btn) {
  const c = coinEl(v, 58), r = btn.getBoundingClientRect(), p = $('#pig').getBoundingClientRect();
  c.classList.add('flying'); c.style.left = (r.left + r.width / 2 - 29) + 'px'; c.style.top = (r.top + 6) + 'px'; document.body.appendChild(c);
  sfx.clink(v);
  const dx = p.left + p.width / 2 - (r.left + r.width / 2), dy = p.top + p.height * .2 - r.top;
  const an = c.animate([{ transform: 'translate(0,0)' }, { transform: `translate(${dx * .6}px,${dy - 60}px)`, offset: .5 }, { transform: `translate(${dx}px,${dy}px) scale(.4)`, opacity: .2 }], { duration: 550, easing: 'ease-in' });
  an.onfinish = () => c.remove();
  piggy += v; piggyN++;
  const pg = $('#pig'); pg.classList.remove('wig'); void pg.offsetWidth; pg.classList.add('wig');
  setTimeout(() => tone(900, .1, 'sine', .12), 500);
  renderPiggy(); speak(sayMoney(piggy));
  if (piggy >= 100 && piggy - v < 100) { const pr = pg.getBoundingClientRect(); burst(pr.left + pr.width / 2, pr.top + pr.height / 2, 50); setTimeout(() => speak('One whole dollar! Wow!'), 900); }
}

/* ---------- confetti ---------- */
const fx = $('#fx'), cx = fx.getContext('2d'); let parts = [], fxOn = false;
function sizeFx() { fx.width = innerWidth * devicePixelRatio; fx.height = innerHeight * devicePixelRatio; cx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0); }
addEventListener('resize', sizeFx); sizeFx();
const COLS = ['#ff4f9a', '#8e5cff', '#ffd23f', '#33c36a', '#4fb3ff', '#ff9f2e'];
function burst(x, y, n) {
  for (let i = 0; i < n; i++) { const a = Math.random() * Math.PI * 2, s = 3 + Math.random() * 6;
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 4, r: 4 + Math.random() * 5, c: COLS[i % COLS.length], life: 70 + Math.random() * 30, rot: Math.random() * 6 }); }
  if (!fxOn) { fxOn = true; requestAnimationFrame(fxLoop); }
}
function bigConfetti() { for (let k = 0; k < 5; k++) setTimeout(() => burst(innerWidth * (.15 + .175 * k), innerHeight * .3, 40), k * 150); }
function fxLoop() {
  cx.clearRect(0, 0, innerWidth, innerHeight);
  parts = parts.filter(p => p.life-- > 0);
  for (const p of parts) { p.vy += .25; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.rot += .2;
    cx.save(); cx.translate(p.x, p.y); cx.rotate(p.rot); cx.globalAlpha = Math.min(1, p.life / 30); cx.fillStyle = p.c; cx.fillRect(-p.r, -p.r / 2, p.r * 2, p.r); cx.restore(); }
  if (parts.length) requestAnimationFrame(fxLoop); else { fxOn = false; cx.clearRect(0, 0, innerWidth, innerHeight); }
}

/* ---------- wiring ---------- */
$('#payBtn').onclick = pay;
$('#hintBtn').onclick = () => { sfx.pop(); showHint(true); };
$('#homeBtn').onclick = () => { sfx.pop(); S.busy = true; show('menu'); };
$('#homeBtn2').onclick = () => { sfx.pop(); show('menu'); };
$('#doneMap').onclick = () => { sfx.pop(); $('#doneOv').classList.remove('on'); show('menu'); };
$('#piggyBtn').onclick = () => { sfx.pop(); piggy = 0; piggyN = 0; renderPiggy(); show('piggy'); };
$('#pEmpty').onclick = () => { if (!piggy) return; sfx.boing(); const pr = $('#pig').getBoundingClientRect(); burst(pr.left + pr.width / 2, pr.top + pr.height, 30); speak('All shaken out!'); piggy = 0; piggyN = 0; renderPiggy(); };
['#sndBtn', '#sndBtnM', '#sndBtnP'].forEach(s => $(s).onclick = toggleSound);
syncSound(); renderMenu();
window.__game = { S, STREETS, prog, startStreet, addCoin, removeCoin, pay, showHint, total, goal, greedy, buildPurse, closestSolution, get piggy() { return piggy; } };
</script>
