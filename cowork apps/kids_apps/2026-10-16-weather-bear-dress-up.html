<!-- CONCEPT: Weather Bear Dress-Up — see today's weather (sunny, rainy, snowy, pool day) and tap the 3 right things for Bear to wear (hat, outfit, shoes); a sneaky weather-and-clothing learning dress-up game. -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Weather Bear Dress-Up</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:#fff4d6;font-family:"Baloo 2","Comic Sans MS","Chalkboard SE","Trebuchet MS",system-ui,sans-serif;color:#4a3426;user-select:none;-webkit-user-select:none}
  #app{display:flex;flex-direction:column;height:100%}
  header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 12px;background:#ffcf5c;border-bottom:5px solid #f0a92a}
  header h1{margin:0;font-size:clamp(13px,3.4vw,26px);white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
  #dots{display:flex;gap:5px;flex:none}
  #dots i{width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid #f0a92a;display:block}
  #dots i.done{background:#ff7aa8;border-color:#d6457c}
  #dots i.now{background:#fff;border-color:#4a3426;transform:scale(1.25)}
  #mute{flex:none;font-size:22px;width:44px;height:44px;border-radius:50%;border:none;background:#fff;box-shadow:0 4px 0 #d9962a;cursor:pointer}
  #stage{position:relative;flex:1;min-height:0;overflow:hidden}
  #cv{position:absolute;inset:0;width:100%;height:100%;display:block}
  #badge{position:absolute;left:10px;top:8px;background:rgba(255,255,255,.88);border-radius:22px;padding:4px 16px 4px 10px;display:flex;align-items:center;gap:8px;font-size:clamp(22px,5vw,38px);font-weight:800;box-shadow:0 4px 0 rgba(0,0,0,.15)}
  #badge span.e{font-size:clamp(34px,8vw,60px);line-height:1}
  #need{position:absolute;right:10px;top:8px;display:flex;gap:4px;background:rgba(255,255,255,.88);border-radius:22px;padding:4px 12px;box-shadow:0 4px 0 rgba(0,0,0,.15)}
  #need span{font-size:clamp(26px,6vw,42px);filter:grayscale(1);opacity:.35;transition:.25s}
  #need span.on{filter:none;opacity:1;animation:pop .45s}
  #bearWrap{position:absolute;left:50%;bottom:1%;height:94%;transform:translateX(-50%);aspect-ratio:3/4}
  #bear{height:100%;width:100%;display:block;overflow:visible}
  #bearWrap.shake{animation:shake .5s}
  #bearWrap.dance{animation:dance .7s infinite alternate ease-in-out}
  .wear{animation:wearIn .4s ease-out;transform-box:fill-box;transform-origin:center}
  .eyes{animation:blink 4.2s infinite;transform-box:fill-box;transform-origin:center}
  #bubble{position:absolute;left:50%;top:-4%;transform:translateX(-50%) scale(0);background:#fff;border:4px solid #4a3426;border-radius:24px;padding:6px 16px;font-size:clamp(20px,4.6vw,32px);font-weight:800;white-space:nowrap;pointer-events:none;z-index:4}
  #bubble.show{animation:bub 1.6s forwards}
  #tray{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;padding:10px 8px 12px;background:#ffe9a8;border-top:5px solid #f0a92a}
  .item{position:relative;width:clamp(86px,15vw,126px);aspect-ratio:1;border:none;border-radius:24px;background:#fff;box-shadow:0 6px 0 #d9962a,inset 0 0 0 4px #ffd36b;cursor:pointer;padding:8px;transition:transform .12s}
  .item:active{transform:translateY(4px);box-shadow:0 2px 0 #d9962a,inset 0 0 0 4px #ffd36b}
  .item:focus-visible{outline:5px solid #ff4f93;outline-offset:3px}
  .item svg{width:100%;height:100%;display:block;pointer-events:none}
  .item.worn{opacity:.4;pointer-events:none}
  .item.worn::after{content:"✔";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:46px;color:#25a244;text-shadow:0 2px 0 #fff}
  .item.nope{animation:shake .45s;background:#ffd9d9}
  .ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;z-index:10;padding:20px}
  .ov.hide{display:none}
  #start{background:linear-gradient(#8fd8ff,#fff4d6)}
  #start h2,#fin h2{margin:0;font-size:clamp(34px,8vw,64px);line-height:1.05;color:#d6457c;text-shadow:0 4px 0 #fff}
  #start p{margin:0;font-size:clamp(18px,3.6vw,26px);max-width:560px;font-weight:700}
  #fin{background:rgba(255,244,214,.82);bottom:auto;top:0;height:62%;z-index:9;pointer-events:none}
  #fin button{pointer-events:auto}
  #finStars{font-size:clamp(40px,9vw,72px)}
  .big{font-family:inherit;font-weight:800;font-size:clamp(24px,5.5vw,38px);color:#fff;background:#ff4f93;border:none;border-radius:34px;padding:12px 40px;box-shadow:0 8px 0 #c42a6b;cursor:pointer}
  .big:active{transform:translateY(5px);box-shadow:0 3px 0 #c42a6b}
  .big:focus-visible{outline:5px solid #4a3426;outline-offset:4px}
  #next{position:absolute;right:12px;bottom:12px;z-index:5}
  #next.hide{display:none}
  #next{animation:pulse 1s infinite alternate}
  @keyframes pop{0%{transform:scale(.3)}60%{transform:scale(1.4)}100%{transform:scale(1)}}
  @keyframes shake{0%,100%{transform:translateX(-50%) rotate(0)}20%{transform:translateX(-50%) rotate(-6deg)}40%{transform:translateX(-50%) rotate(6deg)}60%{transform:translateX(-50%) rotate(-4deg)}80%{transform:translateX(-50%) rotate(4deg)}}
  .item.nope{animation:shake2 .45s}
  @keyframes shake2{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}75%{transform:rotate(-5deg)}}
  @keyframes dance{from{transform:translateX(-50%) translateY(0) rotate(-3deg)}to{transform:translateX(-50%) translateY(-5%) rotate(3deg)}}
  @keyframes wearIn{0%{transform:scale(1.5);opacity:0}100%{transform:scale(1);opacity:1}}
  @keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
  @keyframes bub{0%{transform:translateX(-50%) scale(0)}12%{transform:translateX(-50%) scale(1.1)}20%{transform:translateX(-50%) scale(1)}85%{transform:translateX(-50%) scale(1)}100%{transform:translateX(-50%) scale(0)}}
  @keyframes pulse{from{transform:scale(1)}to{transform:scale(1.08)}}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>🐻 Weather Bear Dress-Up</h1>
    <div id="dots"></div>
    <button id="mute" aria-label="Sound on or off">🔊</button>
  </header>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="badge"><span class="e" id="wEmoji">☀️</span><span id="wWord">Sunny</span></div>
    <div id="need"><span>👒</span><span>👕</span><span>👟</span></div>
    <div id="bearWrap">
      <svg id="bear" viewBox="0 0 300 400" xmlns="http://www.w3.org/2000/svg">
        <!-- feet -->
        <ellipse cx="115" cy="336" rx="31" ry="19" fill="#b9793f"/><ellipse cx="185" cy="336" rx="31" ry="19" fill="#b9793f"/>
        <ellipse cx="115" cy="342" rx="15" ry="9" fill="#e6b27a"/><ellipse cx="185" cy="342" rx="15" ry="9" fill="#e6b27a"/>
        <!-- body -->
        <ellipse cx="150" cy="255" rx="62" ry="74" fill="#c98846"/>
        <ellipse cx="150" cy="268" rx="38" ry="48" fill="#f0c791"/>
        <!-- arms -->
        <ellipse cx="86" cy="248" rx="19" ry="46" fill="#c98846" transform="rotate(14 86 248)"/>
        <ellipse cx="214" cy="248" rx="19" ry="46" fill="#c98846" transform="rotate(-14 214 248)"/>
        <!-- head -->
        <circle cx="103" cy="70" r="24" fill="#c98846"/><circle cx="103" cy="70" r="13" fill="#f0c791"/>
        <circle cx="197" cy="70" r="24" fill="#c98846"/><circle cx="197" cy="70" r="13" fill="#f0c791"/>
        <circle cx="150" cy="115" r="62" fill="#c98846"/>
        <ellipse cx="150" cy="138" rx="28" ry="21" fill="#f0c791"/>
        <circle cx="112" cy="132" r="9" fill="#ff9bb5" opacity=".7"/><circle cx="188" cy="132" r="9" fill="#ff9bb5" opacity=".7"/>
        <g class="eyes"><circle cx="128" cy="106" r="7" fill="#3b2418"/><circle cx="172" cy="106" r="7" fill="#3b2418"/>
        <circle cx="130" cy="103" r="2.5" fill="#fff"/><circle cx="174" cy="103" r="2.5" fill="#fff"/></g>
        <ellipse cx="150" cy="128" rx="9" ry="6.5" fill="#3b2418"/>
        <path d="M137 143 Q150 156 163 143" fill="none" stroke="#3b2418" stroke-width="4" stroke-linecap="round"/>
        <!-- worn clothes -->
        <g id="slot-feet"></g><g id="slot-body"></g><g id="slot-head"></g>
      </svg>
      <div id="bubble"></div>
    </div>
    <button class="big hide" id="next">Next ▶</button>

    <div class="ov" id="start">
      <div style="font-size:clamp(70px,16vw,130px)">🐻🌦️</div>
      <h2>Weather Bear<br>Dress-Up</h2>
      <p>Look at the weather, then tap the 3 things Bear should wear!</p>
      <button class="big" id="play">Play!</button>
    </div>
    <div class="ov hide" id="fin">
      <h2>Great job!</h2>
      <div id="finStars">⭐⭐⭐</div>
      <button class="big" id="again">Play again</button>
    </div>
  </div>
  <div id="tray"></div>
</div>

<script>
(function(){
"use strict";
/* ---------- clothes (drawn in the same 300x400 space as the bear) ---------- */
const mirror = s => s + '<g transform="translate(300 0) scale(-1 1)">'+s+'</g>';
const ITEMS = {
  sunhat:{slot:'head',set:'sunny',vb:'55 20 190 70',svg:
    '<ellipse cx="150" cy="72" rx="88" ry="15" fill="#ffd54a" stroke="#e0a800" stroke-width="4"/>'+
    '<path d="M110 72 Q112 30 150 30 Q188 30 190 72Z" fill="#ffe082" stroke="#e0a800" stroke-width="4"/>'+
    '<rect x="111" y="56" width="78" height="13" fill="#ff6b6b"/>'},
  rainhat:{slot:'head',set:'rainy',vb:'80 18 140 80',svg:
    '<path d="M92 84 Q94 26 150 26 Q206 26 208 84Z" fill="#ffcc00" stroke="#c99a00" stroke-width="4"/>'+
    '<path d="M84 86 Q150 64 216 86 Q150 98 84 86Z" fill="#ffd633" stroke="#c99a00" stroke-width="4"/>'+
    '<path d="M120 50 Q150 38 180 50" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".6"/>'},
  beanie:{slot:'head',set:'snowy',vb:'85 8 130 88',svg:
    '<path d="M97 82 Q97 30 150 30 Q203 30 203 82Z" fill="#e53935" stroke="#a31515" stroke-width="4"/>'+
    '<path d="M122 36 L126 80 M150 30 L150 80 M178 36 L174 80" stroke="#ff8a80" stroke-width="5"/>'+
    '<rect x="93" y="70" width="114" height="20" rx="10" fill="#ffcdd2" stroke="#a31515" stroke-width="4"/>'+
    '<circle cx="150" cy="24" r="13" fill="#fff" stroke="#ccc" stroke-width="3"/>'},
  goggles:{slot:'head',set:'pool',vb:'88 82 124 54',svg:
    '<rect x="96" y="100" width="108" height="8" rx="4" fill="#00897b"/>'+
    '<circle cx="128" cy="107" r="19" fill="#b3ecff" fill-opacity=".75" stroke="#00897b" stroke-width="6"/>'+
    '<circle cx="172" cy="107" r="19" fill="#b3ecff" fill-opacity=".75" stroke="#00897b" stroke-width="6"/>'+
    '<rect x="143" y="102" width="14" height="8" fill="#00897b"/>'},
  tee:{slot:'body',set:'sunny',vb:'55 185 190 145',svg:
    '<path d="M100 196 Q150 218 200 196 L236 226 L212 252 L198 240 L198 304 L102 304 L102 240 L88 252 L64 226Z" fill="#ffb300" stroke="#e68900" stroke-width="4"/>'+
    '<circle cx="150" cy="250" r="16" fill="#fff176" stroke="#e68900" stroke-width="3"/>'+
    '<path d="M102 302 H198 L202 326 H153 L150 314 L147 326 H98Z" fill="#29b6f6" stroke="#0277bd" stroke-width="4"/>'},
  raincoat:{slot:'body',set:'rainy',vb:'50 185 200 145',svg:
    '<path d="M98 194 Q150 218 202 194 L242 256 L218 274 L200 240 L206 322 L94 322 L100 240 L82 274 L58 256Z" fill="#ffd600" stroke="#c7a500" stroke-width="4"/>'+
    '<circle cx="150" cy="238" r="6" fill="#f57f17"/><circle cx="150" cy="262" r="6" fill="#f57f17"/><circle cx="150" cy="286" r="6" fill="#f57f17"/>'+
    '<path d="M112 210 Q150 232 188 210" fill="none" stroke="#c7a500" stroke-width="5"/>'},
  puffy:{slot:'body',set:'snowy',vb:'50 185 200 145',svg:
    '<path d="M98 194 Q150 218 202 194 L242 256 L218 274 L200 240 L206 322 L94 322 L100 240 L82 274 L58 256Z" fill="#42a5f5" stroke="#1565c0" stroke-width="4"/>'+
    '<path d="M100 262 H200 M96 290 H204" stroke="#1565c0" stroke-width="4"/>'+
    '<rect x="102" y="190" width="96" height="22" rx="11" fill="#ef5350" stroke="#b71c1c" stroke-width="3"/>'+
    '<rect x="168" y="204" width="18" height="52" rx="7" fill="#ef5350" stroke="#b71c1c" stroke-width="3"/>'},
  trunks:{slot:'body',set:'pool',vb:'52 225 196 105',svg:
    '<path d="M98 268 H202 L206 324 H153 L150 306 L147 324 H94Z" fill="#26c6da" stroke="#00838f" stroke-width="4"/>'+
    '<rect x="98" y="268" width="104" height="10" fill="#fff"/>'+
    '<ellipse cx="150" cy="262" rx="70" ry="17" fill="none" stroke="#ff7043" stroke-width="15"/>'+
    '<path d="M95 250 L108 270 M150 245 L150 258 M205 250 L192 270" stroke="#fff" stroke-width="7" stroke-linecap="round"/>'},
  sandals:{slot:'feet',set:'sunny',vb:'70 320 160 50',svg: mirror(
    '<ellipse cx="113" cy="352" rx="32" ry="8" fill="#ff9800" stroke="#e65100" stroke-width="3"/>'+
    '<path d="M94 346 Q113 326 132 346" fill="none" stroke="#e65100" stroke-width="6"/>')},
  boots:{slot:'feet',set:'rainy',vb:'70 310 160 62',svg: mirror(
    '<path d="M92 318 H138 V352 Q138 368 118 368 H84 Q86 340 92 318Z" fill="#43a047" stroke="#1b5e20" stroke-width="4"/>'+
    '<rect x="88" y="316" width="54" height="11" rx="5" fill="#81c784" stroke="#1b5e20" stroke-width="3"/>')},
  snowboots:{slot:'feet',set:'snowy',vb:'70 306 160 66',svg: mirror(
    '<path d="M92 320 H138 V352 Q138 368 118 368 H84 Q86 340 92 320Z" fill="#8d6e63" stroke="#4e342e" stroke-width="4"/>'+
    '<rect x="86" y="311" width="56" height="18" rx="9" fill="#fff" stroke="#bbb" stroke-width="3"/>')},
  flippers:{slot:'feet',set:'pool',vb:'60 316 180 62',svg: mirror(
    '<path d="M100 328 L134 328 L148 374 L66 374Z" fill="#00acc1" stroke="#006064" stroke-width="4"/>'+
    '<path d="M110 342 L106 368 M124 342 L126 368" stroke="#006064" stroke-width="3"/>')}
};
const WEATHER = {
  sunny:{label:'Sunny',emoji:'☀️',sky:['#58bfff','#d8f3ff'],ground:'#6fcf5a'},
  rainy:{label:'Rainy',emoji:'🌧️',sky:['#76848f','#b6c2ce'],ground:'#5a9e55'},
  snowy:{label:'Snowy',emoji:'❄️',sky:['#b5d8f0','#f2f9ff'],ground:'#ffffff'},
  pool: {label:'Pool Day',emoji:'🏊',sky:['#27cde8','#c5f5ff'],ground:'#ffdc9a'}
};
const WARM = ['sunny','pool'];
const ROUNDS = 6;

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];} return a; };
const rand = (a,b) => a+Math.random()*(b-a);

/* ---------- sound (Web Audio) ---------- */
let ac=null, muted=false;
function audio(){ try{ if(!ac) ac=new (window.AudioContext||window.webkitAudioContext)(); if(ac.state==='suspended') ac.resume(); }catch(e){} return ac; }
function tone(f,delay,dur,type,vol,slide){
  if(muted) return; const c=audio(); if(!c) return;
  const t=c.currentTime+(delay||0), o=c.createOscillator(), g=c.createGain();
  o.type=type||'sine'; o.frequency.setValueAtTime(f,t);
  if(slide) o.frequency.exponentialRampToValueAtTime(slide,t+dur);
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol||.2,t+.02); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+dur+.05);
}
const sfx = {
  good(n){ const b=[523,659,784][n%3]; tone(b,0,.18,'triangle',.22); tone(b*2,.09,.22,'sine',.18); },
  oops(){ tone(330,0,.28,'triangle',.22,150); tone(220,.12,.25,'sine',.15,120); },
  cheer(){ [523,659,784,1047,784,1047,1319].forEach((f,i)=>tone(f,i*.11,.25,'triangle',.22)); },
  finale(){ [523,523,659,784,1047,988,1047,1319,1568].forEach((f,i)=>tone(f,i*.13,.3,'triangle',.24)); },
  tap(){ tone(700,0,.08,'square',.08); }
};

/* ---------- weather canvas ---------- */
const cv=$('#cv'), ctx=cv.getContext('2d'); let dpr=1, cw=0, ch=0;
let cur='sunny', parts=[], clouds=[], confetti=[];
function resize(){
  dpr=Math.min(window.devicePixelRatio||1,2);
  const r=cv.getBoundingClientRect(); cw=r.width; ch=r.height;
  cv.width=cw*dpr; cv.height=ch*dpr; initParts();
}
function initParts(){
  parts=[]; clouds=[];
  const n = Math.round(cw*ch/9000);
  if(cur==='rainy') for(let i=0;i<n*1.4;i++) parts.push({x:rand(0,cw),y:rand(0,ch),l:rand(12,22),v:rand(520,820)});
  if(cur==='snowy') for(let i=0;i<n;i++) parts.push({x:rand(0,cw),y:rand(0,ch),r:rand(2.5,6),v:rand(30,80),ph:rand(0,6)});
  if(cur==='pool')  for(let i=0;i<10;i++) parts.push({x:rand(0,cw),y:rand(ch*.75,ch*.84),r:rand(3,8),v:rand(15,40),ph:rand(0,6)});
  const cc={sunny:2,rainy:4,snowy:3,pool:1}[cur];
  for(let i=0;i<cc;i++) clouds.push({x:rand(0,cw),y:rand(ch*.06,ch*.26),s:rand(60,100)*Math.min(1,cw/700+.4),v:rand(8,22)});
}
function cloud(x,y,s,col){
  ctx.fillStyle=col; ctx.beginPath();
  [[0,0,.5],[.55,-.22,.62],[1.1,0,.5],[.55,.1,.55]].forEach(c=>{ctx.moveTo(x+c[0]*s+c[2]*s,y+c[1]*s);ctx.arc(x+c[0]*s,y+c[1]*s,c[2]*s,0,7);});
  ctx.fill();
}
let last=0;
function frame(t){
  const dt=Math.min((t-last)/1000||0,.05); last=t; const sec=t/1000;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  const W=WEATHER[cur], g=ctx.createLinearGradient(0,0,0,ch);
  g.addColorStop(0,W.sky[0]); g.addColorStop(1,W.sky[1]); ctx.fillStyle=g; ctx.fillRect(0,0,cw,ch);
  if(cur==='sunny'||cur==='pool'){
    const sx=cw*.84, sy=ch*.2+ (cw<500?40:0), r=Math.min(cw,ch)*.085+10;
    ctx.save(); ctx.translate(sx,sy); ctx.rotate(sec*.3); ctx.strokeStyle='#ffd23f'; ctx.lineWidth=8; ctx.lineCap='round';
    for(let i=0;i<12;i++){ctx.rotate(Math.PI/6);ctx.beginPath();ctx.moveTo(r*1.3,0);ctx.lineTo(r*1.75,0);ctx.stroke();}
    ctx.restore(); ctx.fillStyle='#ffe066'; ctx.beginPath(); ctx.arc(sx,sy,r,0,7); ctx.fill();
  }
  const cc = cur==='rainy'?'#8b97a4':cur==='snowy'?'#e6eef6':'#fff';
  clouds.forEach(c=>{ c.x+=c.v*dt; if(c.x>cw+40) c.x=-c.s*2; cloud(c.x,c.y,c.s,cc); });
  const gy=ch*.84;
  if(cur==='pool'){
    ctx.fillStyle='#1fb5e8'; ctx.fillRect(0,ch*.74,cw,ch*.12);
    ctx.strokeStyle='rgba(255,255,255,.8)'; ctx.lineWidth=4; ctx.beginPath();
    for(let x=0;x<=cw;x+=12){const y=ch*.74+Math.sin(x*.04+sec*2)*4; x?ctx.lineTo(x,y):ctx.moveTo(x,y);} ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,.7)';
    parts.forEach(p=>{p.y-=p.v*dt; if(p.y<ch*.74) p.y=ch*.84; ctx.beginPath();ctx.arc(p.x+Math.sin(sec*2+p.ph)*4,p.y,p.r,0,7);ctx.fill();});
  }
  ctx.fillStyle=W.ground; ctx.beginPath(); ctx.moveTo(0,gy+8);
  for(let x=0;x<=cw;x+=20) ctx.lineTo(x,gy+Math.sin(x*.012)*8);
  ctx.lineTo(cw,ch); ctx.lineTo(0,ch); ctx.fill();
  if(cur==='rainy'){
    ctx.fillStyle='rgba(90,150,220,.55)'; [[.15,.93],[.8,.95],[.62,.9]].forEach(p=>{ctx.beginPath();ctx.ellipse(cw*p[0],ch*p[1],38,9,0,0,7);ctx.fill();});
    ctx.strokeStyle='rgba(60,110,190,.85)'; ctx.lineWidth=2.5; ctx.beginPath();
    parts.forEach(p=>{p.y+=p.v*dt; p.x-=p.v*dt*.18; if(p.y>ch){p.y=-20;p.x=rand(0,cw+80);} ctx.moveTo(p.x,p.y);ctx.lineTo(p.x+p.l*.18,p.y-p.l);}); ctx.stroke();
  }
  if(cur==='snowy'){
    ctx.fillStyle='#fff'; ctx.strokeStyle='#d7e6f2'; ctx.lineWidth=1;
    parts.forEach(p=>{p.y+=p.v*dt; if(p.y>ch+10){p.y=-10;p.x=rand(0,cw);} ctx.beginPath();ctx.arc(p.x+Math.sin(sec+p.ph)*14,p.y,p.r,0,7);ctx.fill();ctx.stroke();});
  }
  // confetti
  confetti.forEach(c=>{ c.vy+=600*dt; c.x+=c.vx*dt; c.y+=c.vy*dt; c.rot+=c.vr*dt; });
  confetti=confetti.filter(c=>c.y<ch+30);
  confetti.forEach(c=>{ ctx.save(); ctx.translate(c.x,c.y); ctx.rotate(c.rot); ctx.fillStyle=c.col; ctx.fillRect(-c.s/2,-c.s/4,c.s,c.s/2); ctx.restore(); });
  requestAnimationFrame(frame);
}
function burst(n){
  const cols=['#ff4f93','#ffd23f','#4cc9f0','#7bd88f','#b388ff','#ff9f43'];
  for(let i=0;i<n;i++) confetti.push({x:cw/2+rand(-30,30),y:ch*.45,vx:rand(-380,380),vy:rand(-720,-220),rot:rand(0,6),vr:rand(-8,8),s:rand(10,18),col:cols[i%cols.length]});
}

/* ---------- game ---------- */
let seq=[], round=0, worn={}, mistakes=0, locked=true;
const bearWrap=$('#bearWrap'), bubble=$('#bubble'), tray=$('#tray'), nextBtn=$('#next');
const needEls=[...document.querySelectorAll('#need span')];

function makeSeq(){
  const keys=Object.keys(WEATHER); let a=shuffle(keys), b=shuffle(keys);
  if(b[0]===a[a.length-1]) b.push(b.shift());
  return a.concat(b.slice(0,ROUNDS-4));
}
function buildDots(){
  const d=$('#dots'); d.innerHTML='';
  for(let i=0;i<ROUNDS;i++){const e=document.createElement('i'); d.appendChild(e);}
}
function updateDots(){
  [...$('#dots').children].forEach((e,i)=>{e.className = i<round?'done':(i===round?'now':'');});
}
function say(txt){
  bubble.textContent=txt; bubble.classList.remove('show'); void bubble.offsetWidth; bubble.classList.add('show');
}
function setWeather(k){
  cur=k; $('#wEmoji').textContent=WEATHER[k].emoji; $('#wWord').textContent=WEATHER[k].label; initParts();
}
function startRound(){
  worn={}; locked=false; nextBtn.classList.add('hide');
  bearWrap.classList.remove('dance');
  ['head','body','feet'].forEach(s=>$('#slot-'+s).innerHTML='');
  needEls.forEach(e=>e.classList.remove('on'));
  const w=seq[round]; setWeather(w); updateDots();
  const right=Object.keys(ITEMS).filter(k=>ITEMS[k].set===w);
  let pool=Object.keys(ITEMS).filter(k=>ITEMS[k].set!==w);
  if(WARM.includes(w)) pool=pool.filter(k=>['snowy','rainy'].includes(ITEMS[k].set));
  else pool=pool.filter(k=>WARM.includes(ITEMS[k].set));
  const wrong=shuffle(pool).slice(0,3);
  tray.innerHTML='';
  shuffle(right.concat(wrong)).forEach(k=>{
    const b=document.createElement('button'); b.className='item'; b.dataset.k=k; b.setAttribute('aria-label',k);
    b.innerHTML='<svg viewBox="'+ITEMS[k].vb+'" xmlns="http://www.w3.org/2000/svg">'+ITEMS[k].svg+'</svg>';
    b.addEventListener('click',()=>pick(b,k));
    tray.appendChild(b);
  });
  resize(); // tray height may have changed the stage size
}
function pick(btn,k){
  if(locked) return; audio();
  const it=ITEMS[k];
  if(it.set===seq[round]){
    worn[it.slot]=true; btn.classList.add('worn');
    const g=$('#slot-'+it.slot); g.innerHTML=it.svg; g.classList.remove('wear'); void g.getBoundingClientRect(); g.classList.add('wear');
    const n=Object.keys(worn).length; needEls[n-1].classList.add('on'); sfx.good(n-1);
    if(n===3) roundDone(); else say(['Yes!','Great pick!','Perfect!'][n-1]||'Yes!');
  } else {
    mistakes++; sfx.oops();
    btn.classList.remove('nope'); void btn.offsetWidth; btn.classList.add('nope');
    bearWrap.classList.remove('shake'); void bearWrap.offsetWidth; bearWrap.classList.add('shake');
    const w=seq[round];
    let msg;
    if(WARM.includes(w)) msg = it.set==='snowy' ? '🥵 Too hot!' : '🤔 No rain today!';
    else if(w==='snowy') msg='🥶 Brrr! Too chilly!';
    else msg='💦 I would get wet!';
    say(msg);
  }
}
function roundDone(){
  locked=true; round++; updateDots();
  setTimeout(()=>{ sfx.cheer(); burst(80); bearWrap.classList.add('dance'); say('I am ready! 🎉'); },250);
  nextBtn.textContent = round>=ROUNDS ? 'Finish 🎉' : 'Next ▶';
  setTimeout(()=>{ nextBtn.classList.remove('hide'); nextBtn.focus({preventScroll:true}); },900);
}
function finish(){
  nextBtn.classList.add('hide');
  const s = mistakes<=2?3 : mistakes<=6?2 : 1;
  $('#finStars').textContent='⭐'.repeat(s)+'☆'.repeat(3-s);
  $('#fin').classList.remove('hide');
  sfx.finale(); burst(160); setTimeout(()=>burst(120),700); bearWrap.classList.add('dance');
  say('Weather expert! 🌈');
  $('#again').focus({preventScroll:true});
}
function newGame(){
  $('#start').classList.add('hide'); $('#fin').classList.add('hide');
  seq=makeSeq(); round=0; mistakes=0; buildDots(); startRound();
}

nextBtn.addEventListener('click',()=>{ sfx.tap(); if(round>=ROUNDS) finish(); else startRound(); });
$('#play').addEventListener('click',()=>{ audio(); sfx.tap(); newGame(); });
$('#again').addEventListener('click',()=>{ audio(); sfx.tap(); newGame(); });
$('#mute').addEventListener('click',e=>{ muted=!muted; e.target.textContent=muted?'🔇':'🔊'; if(!muted) sfx.tap(); });
// arrow keys move between clothes
document.addEventListener('keydown',e=>{
  if(e.key!=='ArrowLeft' && e.key!=='ArrowRight') return;
  const items=[...tray.querySelectorAll('.item:not(.worn)')]; if(!items.length || locked) return;
  const i=items.indexOf(document.activeElement);
  const n = e.key==='ArrowRight' ? (i+1)%items.length : (i<=0?items.length-1:i-1);
  items[n].focus(); e.preventDefault();
});
window.addEventListener('resize',resize);

seq=makeSeq(); buildDots(); setWeather('sunny'); $('#need').style.display='';
resize(); requestAnimationFrame(frame);
$('#play').focus({preventScroll:true});
})();
</script>
</body>
