<!-- CONCEPT: Sneaky Snacks — a hold-to-tiptoe timing game; press and hold to creep up the hallway rug toward the cookie jar, but let go the instant Biscuit the guard dog perks his ears and opens his eyes. Grab cookies on the way, hop over squeaky rubber ducks (standing still on one squeaks and wakes him), and reach the jar for a confetti munch party. Getting spotted just costs a few steps and a happy "Boop!" — you can never lose. Reaction/timing game for ages 4-11. -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Sneaky Snacks</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  :root {
    --wall-a: #3a2a6b;
    --wall-b: #6b3f8f;
    --floor: #7a4a2e;
    --rug-a: #ff5a7a;
    --rug-b: #ff8fa8;
    --safe: #47e07a;
    --warn: #ffcf3d;
    --danger: #ff4d5e;
    --cream: #fff6e6;
    --ink: #2b1b47;
    --panel: rgba(28, 16, 56, 0.92);
    --font: "Comic Sans MS", "Trebuchet MS", system-ui, sans-serif;
  }

  html, body {
    margin: 0; padding: 0;
    height: 100%;
    overflow: hidden;
    touch-action: manipulation;
    user-select: none; -webkit-user-select: none;
    background: #1a1030;
    font-family: var(--font);
    color: var(--cream);
  }

  #app {
    position: relative;
    width: 100%; height: 100%;
    display: flex; flex-direction: column;
    max-width: 720px; margin: 0 auto;
  }

  /* ---------- Top HUD ---------- */
  #hud {
    flex: 0 0 auto;
    display: flex; align-items: center; gap: 8px;
    padding: 8px 10px 4px;
  }
  #title {
    flex: 1 1 auto;
    font-size: clamp(17px, 5vw, 26px);
    font-weight: bold;
    letter-spacing: 0.5px;
    background: linear-gradient(90deg, #ffd54a, #ff7aa8, #7ad7ff);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    white-space: nowrap;
  }
  .pill {
    flex: 0 0 auto;
    background: rgba(255,255,255,0.14);
    border: 2px solid rgba(255,255,255,0.22);
    border-radius: 999px;
    padding: 5px 11px;
    font-size: clamp(12px, 3.4vw, 16px);
    font-weight: bold;
    white-space: nowrap;
  }
  #muteBtn {
    flex: 0 0 auto;
    width: 60px; height: 60px;
    min-width: 60px;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.22);
    background: rgba(255,255,255,0.14);
    color: var(--cream);
    font-size: 19px;
    cursor: pointer;
    font-family: var(--font);
  }

  /* ---------- Status banner ---------- */
  #status {
    flex: 0 0 auto;
    margin: 2px 10px 6px;
    border-radius: 14px;
    padding: 7px 10px;
    text-align: center;
    font-size: clamp(15px, 4.6vw, 22px);
    font-weight: bold;
    color: #17102b;
    background: var(--safe);
    box-shadow: 0 3px 0 rgba(0,0,0,0.28);
    transition: background 0.12s linear;
  }
  #status.warn   { background: var(--warn); }
  #status.danger { background: var(--danger); color: #fff; }

  /* ---------- Stage ---------- */
  #stage {
    position: relative;
    flex: 1 1 auto;
    min-height: 0;
    touch-action: none;
  }
  #game { display: block; width: 100%; height: 100%; }

  /* Floating toast message over the stage */
  #toast {
    position: absolute; left: 50%; top: 46%;
    transform: translate(-50%, -50%) scale(0.6);
    padding: 10px 18px;
    border-radius: 16px;
    background: rgba(255,255,255,0.95);
    color: var(--ink);
    font-size: clamp(18px, 5.4vw, 26px);
    font-weight: bold;
    white-space: nowrap;
    pointer-events: none;
    opacity: 0;
    box-shadow: 0 6px 0 rgba(0,0,0,0.25);
  }
  #toast.show { animation: toastPop 1.1s ease-out forwards; }
  @keyframes toastPop {
    0%   { opacity: 0; transform: translate(-50%,-50%) scale(0.6); }
    18%  { opacity: 1; transform: translate(-50%,-50%) scale(1.08); }
    72%  { opacity: 1; transform: translate(-50%,-58%) scale(1); }
    100% { opacity: 0; transform: translate(-50%,-76%) scale(0.95); }
  }

  /* ---------- Hold bar ---------- */
  #holdBar {
    flex: 0 0 auto;
    margin: 8px 10px 12px;
    height: 78px;
    min-height: 60px;
    border-radius: 22px;
    border: none;
    font-family: var(--font);
    font-size: clamp(18px, 5.4vw, 26px);
    font-weight: bold;
    color: #26144a;
    background: linear-gradient(180deg, #ffe27a, #ffb43d);
    box-shadow: 0 6px 0 #c47a12;
    cursor: pointer;
    touch-action: none;
    transition: transform 0.06s ease-out, box-shadow 0.06s ease-out;
  }
  #holdBar.pressed {
    transform: translateY(5px);
    box-shadow: 0 1px 0 #c47a12;
    background: linear-gradient(180deg, #b6ff9a, #55dd66);
  }

  /* ---------- Overlays ---------- */
  .overlay {
    position: absolute; inset: 0;
    z-index: 20;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 12px;
    padding: 18px;
    text-align: center;
    background: var(--panel);
    backdrop-filter: blur(3px);
  }
  .overlay.hidden { display: none; }
  .ovTitle {
    font-size: clamp(30px, 9vw, 48px);
    font-weight: bold;
    line-height: 1.05;
    background: linear-gradient(90deg, #ffd54a, #ff7aa8, #7ad7ff);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .ovBig { font-size: clamp(44px, 15vw, 76px); line-height: 1; }
  .ovText {
    font-size: clamp(15px, 4.3vw, 20px);
    line-height: 1.5;
    max-width: 30ch;
    color: var(--cream);
  }
  .howto {
    display: flex; flex-direction: column; gap: 8px;
    width: 100%; max-width: 340px;
  }
  .howRow {
    display: flex; align-items: center; gap: 10px;
    background: rgba(255,255,255,0.1);
    border-radius: 14px;
    padding: 9px 12px;
    font-size: clamp(14px, 4vw, 18px);
    text-align: left;
  }
  .howRow span.ico { font-size: 30px; flex: 0 0 auto; width: 38px; text-align: center; }
  .btn {
    min-height: 60px;
    padding: 14px 34px;
    border: none; border-radius: 20px;
    font-family: var(--font);
    font-size: clamp(19px, 5.6vw, 26px);
    font-weight: bold;
    color: #26144a;
    background: linear-gradient(180deg, #9ef7a8, #40cf6a);
    box-shadow: 0 6px 0 #2a8f47;
    cursor: pointer;
  }
  .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #2a8f47; }
  .btn.alt {
    background: linear-gradient(180deg, #b7c6ff, #7d8fe8);
    box-shadow: 0 6px 0 #4a58a8;
    font-size: clamp(16px, 4.4vw, 20px);
    padding: 12px 26px;
  }
  .btn.alt:active { box-shadow: 0 2px 0 #4a58a8; }
</style>
</head>
<body>
<div id="app">

  <div id="hud">
    <div id="title">🍪 Sneaky Snacks</div>
    <div class="pill" id="levelPill">Lvl 1</div>
    <div class="pill" id="starPill">⭐ 0</div>
    <button id="muteBtn" aria-label="Sound on or off">🔊</button>
  </div>

  <div id="status">😴 Zzz… tiptoe!</div>

  <div id="stage">
    <canvas id="game"></canvas>
    <div id="toast"></div>
  </div>

  <button id="holdBar">👣 HOLD TO TIPTOE</button>

  <!-- Title screen -->
  <div class="overlay" id="startOverlay">
    <div class="ovBig">🐶🍪</div>
    <div class="ovTitle">Sneaky Snacks</div>
    <div class="ovText">Biscuit is guarding the cookie jar. Can you tiptoe past him?</div>
    <div class="howto">
      <div class="howRow"><span class="ico">👣</span><div>Hold the big button to tiptoe forward.</div></div>
      <div class="howRow"><span class="ico">👀</span><div>Let go when Biscuit's eyes open!</div></div>
      <div class="howRow"><span class="ico">🦆</span><div>Don't stand still on a squeaky duck.</div></div>
    </div>
    <button class="btn" id="startBtn">Let's Sneak! ▶</button>
  </div>

  <!-- Level complete screen -->
  <div class="overlay hidden" id="winOverlay">
    <div class="ovBig" id="winEmoji">🍪</div>
    <div class="ovTitle" id="winTitle">Yum!</div>
    <div class="ovText" id="winText">You got the cookies!</div>
    <button class="btn" id="nextBtn">Next Sneak ▶</button>
    <button class="btn alt" id="restartBtn">Start Over ↺</button>
  </div>

</div>

<script>
(() => {
  'use strict';

  // ---------------------------------------------------------------- elements
  const cvs        = document.getElementById('game');
  const ctx        = cvs.getContext('2d');
  const stage      = document.getElementById('stage');
  const holdBar    = document.getElementById('holdBar');
  const statusEl   = document.getElementById('status');
  const levelPill  = document.getElementById('levelPill');
  const starPill   = document.getElementById('starPill');
  const muteBtn    = document.getElementById('muteBtn');
  const toastEl    = document.getElementById('toast');
  const startOv    = document.getElementById('startOverlay');
  const winOv      = document.getElementById('winOverlay');
  const startBtn   = document.getElementById('startBtn');
  const nextBtn    = document.getElementById('nextBtn');
  const restartBtn = document.getElementById('restartBtn');
  const winEmoji   = document.getElementById('winEmoji');
  const winTitle   = document.getElementById('winTitle');
  const winText    = document.getElementById('winText');

  // ---------------------------------------------------------------- storage
  const STORE_KEY = 'cowork-sneakysnacks-progress';
  function loadSave() {
    try {
      const raw = localStorage.getItem(STORE_KEY);
      if (!raw) return { stars: 0, best: 1 };
      const o = JSON.parse(raw);
      return { stars: o.stars | 0, best: Math.max(1, o.best | 0) };
    } catch (e) { return { stars: 0, best: 1 }; }
  }
  function persist() {
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify({ stars: G.stars, best: G.best }));
    } catch (e) { /* private mode — just keep playing */ }
  }
  const saved = loadSave();

  // ---------------------------------------------------------------- audio
  // The context is created inside the Start tap so Chromium never leaves it
  // suspended (a suspended context would silence the wake-up tell).
  let actx = null, master = null, muted = false;

  function initAudio() {
    if (actx) { if (actx.state === 'suspended') actx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try {
      actx = new AC();
      if (actx.state === 'suspended') actx.resume();
      // Everything routes through one master gain, so hitting mute during a
      // celebration also silences notes that were already scheduled ahead.
      master = actx.createGain();
      master.gain.value = muted ? 0 : 1;
      master.connect(actx.destination);
    } catch (e) { actx = null; master = null; }
  }

  function tone(freq, dur, type, vol, slideTo, delay) {
    if (!actx || muted) return;
    const t0 = actx.currentTime + (delay || 0);
    const osc = actx.createOscillator();
    const gain = actx.createGain();
    osc.type = type || 'sine';
    osc.frequency.setValueAtTime(freq, t0);
    if (slideTo) osc.frequency.exponentialRampToValueAtTime(Math.max(40, slideTo), t0 + dur);
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(vol == null ? 0.16 : vol, t0 + 0.012);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(gain); gain.connect(master);
    osc.start(t0); osc.stop(t0 + dur + 0.03);
  }
  function noise(dur, vol) {
    if (!actx || muted) return;
    const n = Math.floor(actx.sampleRate * dur);
    const buf = actx.createBuffer(1, n, actx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const src = actx.createBufferSource(); src.buffer = buf;
    const g = actx.createGain(); g.gain.value = vol == null ? 0.12 : vol;
    const f = actx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 1400;
    src.connect(f); f.connect(g); g.connect(master);
    src.start();
  }

  const SFX = {
    step:   () => tone(180 + Math.random() * 40, 0.05, 'triangle', 0.05),
    stir:   () => { tone(660, 0.11, 'square', 0.08); tone(880, 0.11, 'square', 0.08, null, 0.12); },
    watch:  () => tone(300, 0.22, 'sawtooth', 0.10, 190),
    sleep:  () => tone(260, 0.3, 'sine', 0.06, 170),
    squeak: () => { tone(1250, 0.1, 'square', 0.11, 1750); tone(1600, 0.09, 'square', 0.09, 1100, 0.1); },
    boop:   () => { noise(0.16, 0.10); tone(420, 0.16, 'square', 0.11, 250); tone(330, 0.2, 'square', 0.09, 200, 0.15); },
    cookie: () => { tone(880, 0.09, 'triangle', 0.12); tone(1320, 0.13, 'triangle', 0.11, null, 0.08); },
    win:    () => {
      [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, 0.26, 'triangle', 0.14, null, i * 0.11));
      noise(0.5, 0.06);
    },
    munch:  () => { noise(0.12, 0.14); noise(0.12, 0.12); tone(150, 0.14, 'sawtooth', 0.07, 90, 0.14); }
  };

  // ---------------------------------------------------------------- canvas
  let W = 0, H = 0, DPR = 1;
  function resize() {
    const r = stage.getBoundingClientRect();
    W = Math.max(200, r.width);
    H = Math.max(240, r.height);
    DPR = Math.min(2, window.devicePixelRatio || 1);
    cvs.width  = Math.round(W * DPR);
    cvs.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', () => setTimeout(resize, 120));

  // Track geometry: progress 0 = bottom of rug, 1 = the cookie jar at the top.
  function topY()    { return Math.max(120, H * 0.30); }
  function bottomY() { return H - 46; }
  function trackY(p) { const t = topY(), b = bottomY(); return b + (t - b) * p; }
  function rugW()    { return Math.min(W * 0.66, 250); }

  // ---------------------------------------------------------------- game state
  const G = {
    screen: 'title',        // 'title' | 'play' | 'win'
    level: 1,
    best: saved.best,
    stars: saved.stars,
    levelStars: 0,
    p: 0,                   // player progress 0..1
    holding: false,
    needRelease: false,     // must lift finger after being spotted
    caughtT: 0,             // freeze-out timer after being spotted
    stepT: 0,
    walkPhase: 0,
    shake: 0,
    squeakT: 0,
    cookies: [],
    ducks: [],
    confetti: [],
    pops: [],               // little "+⭐" floaters
    oops: 0,
    dog: { mode: 'sleep', t: 2, fake: false, blink: 0, tail: 0 },
    cfg: null,
    time: 0
  };

  function levelConfig(n) {
    const k = Math.min(n, 12);
    return {
      sleepMin: Math.max(0.85, 2.30 - k * 0.11),
      sleepMax: Math.max(1.60, 3.90 - k * 0.17),
      stir:     Math.max(0.38, 0.92 - k * 0.045),
      watchMin: Math.min(1.50, 0.75 + k * 0.06),
      watchMax: Math.min(2.40, 1.30 + k * 0.09),
      fakeChance: n >= 3 ? 0.28 : (n >= 2 ? 0.15 : 0),
      speed: 0.158
    };
  }

  const rand = (a, b) => a + Math.random() * (b - a);

  function buildLevel(n) {
    G.cfg = levelConfig(n);
    G.p = 0;
    // Only demand a fresh press if a finger is already down (e.g. still held
    // from the last level) — otherwise the first hold must work immediately.
    G.needRelease = G.holding;
    G.caughtT = 0;
    G.squeakT = 0;
    G.oops = 0;
    G.levelStars = 0;
    G.confetti.length = 0;
    G.pops.length = 0;
    G.dog.mode = 'sleep';
    G.dog.t = rand(1.4, 2.2);
    G.dog.fake = false;

    // Cookies: 3 along the rug, gently jittered.
    G.cookies = [0.26, 0.5, 0.74].map(base => ({ p: base + rand(-0.05, 0.05), got: false }));

    // Squeaky ducks: grow slowly with level, kept clear of the cookies & start.
    const duckCount = Math.min(4, Math.floor((n - 1) / 2) + 1);
    G.ducks = [];
    let guard = 0;
    while (G.ducks.length < duckCount && guard++ < 200) {
      const p = rand(0.16, 0.86);
      const clashCookie = G.cookies.some(c => Math.abs(c.p - p) < 0.09);
      const clashDuck   = G.ducks.some(d => Math.abs(d.p - p) < 0.14);
      if (!clashCookie && !clashDuck) G.ducks.push({ p: p, w: 0.055, squeal: 0 });
    }
    G.ducks.sort((a, b) => a.p - b.p);

    levelPill.textContent = 'Lvl ' + n;
    updateStarPill();
  }

  function updateStarPill() { starPill.textContent = '⭐ ' + G.stars; }

  // ---------------------------------------------------------------- effects
  let toastTimer = 0;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.remove('show');
    void toastEl.offsetWidth;      // restart the animation
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1200);
  }

  const CONFETTI_COLORS = ['#ffd54a', '#ff7aa8', '#7ad7ff', '#9ef7a8', '#ffa14a', '#c79bff'];
  function burstConfetti(x, y, count) {
    for (let i = 0; i < count; i++) {
      const a = rand(-Math.PI, 0);
      const sp = rand(90, 330);
      G.confetti.push({
        x: x, y: y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp - rand(40, 160),
        rot: rand(0, 6.3), vr: rand(-9, 9),
        size: rand(5, 11),
        col: CONFETTI_COLORS[(Math.random() * CONFETTI_COLORS.length) | 0],
        life: rand(1.3, 2.4)
      });
    }
  }
  function popText(x, y, txt) { G.pops.push({ x: x, y: y, txt: txt, life: 1 }); }

  // ---------------------------------------------------------------- dog brain
  function setDog(mode) {
    const c = G.cfg;
    G.dog.mode = mode;
    if (mode === 'sleep') { G.dog.t = rand(c.sleepMin, c.sleepMax); G.dog.fake = false; SFX.sleep(); }
    else if (mode === 'stir') {
      G.dog.t = c.stir;
      G.dog.fake = Math.random() < c.fakeChance;
      SFX.stir();
    } else { G.dog.t = rand(c.watchMin, c.watchMax); SFX.watch(); }
  }

  function spotted(reason) {
    G.caughtT = 0.95;
    G.needRelease = true;
    G.shake = 12;
    G.oops++;
    G.p = Math.max(0, G.p - 0.13);
    SFX.boop();
    const lines = reason === 'duck'
      ? ['Squeak! 🦆', 'Oops, a duck! 🦆', 'That was loud! 🦆']
      : ['Boop! He saw you 🐶', 'Caught ya! 🐶', 'Sneak sneakier! 🐶', 'Almost! 🐶'];
    toast(lines[(Math.random() * lines.length) | 0]);
  }

  // ---------------------------------------------------------------- input
  function pressDown() {
    if (G.screen !== 'play') return;
    G.holding = true;
    holdBar.classList.add('pressed');
  }
  function pressUp() {
    G.holding = false;
    G.needRelease = false;
    holdBar.classList.remove('pressed');
  }

  stage.addEventListener('pointerdown', e => { e.preventDefault(); pressDown(); });
  holdBar.addEventListener('pointerdown', e => { e.preventDefault(); pressDown(); });
  // Release is watched on the window: a finger dragged off the button before
  // lifting would otherwise never fire pointerup and leave the kid stuck walking.
  window.addEventListener('pointerup', pressUp);
  window.addEventListener('pointercancel', pressUp);
  window.addEventListener('blur', pressUp);
  document.addEventListener('visibilitychange', () => { if (document.hidden) pressUp(); });

  // Keyboard for anyone playing on a laptop.
  window.addEventListener('keydown', e => {
    if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); pressDown(); }
  });
  window.addEventListener('keyup', e => {
    if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); pressUp(); }
  });

  muteBtn.addEventListener('click', () => {
    muted = !muted;
    muteBtn.textContent = muted ? '🔇' : '🔊';
    if (master) master.gain.setTargetAtTime(muted ? 0 : 1, actx.currentTime, 0.01);
  });

  startBtn.addEventListener('click', () => {
    initAudio();
    startOv.classList.add('hidden');
    G.level = 1;
    buildLevel(1);
    G.screen = 'play';
  });
  nextBtn.addEventListener('click', () => {
    initAudio();
    winOv.classList.add('hidden');
    G.level++;
    G.best = Math.max(G.best, G.level);
    persist();
    buildLevel(G.level);
    G.screen = 'play';
  });
  restartBtn.addEventListener('click', () => {
    initAudio();
    winOv.classList.add('hidden');
    G.level = 1;
    buildLevel(1);
    G.screen = 'play';
  });

  // ---------------------------------------------------------------- update
  function update(dt) {
    G.time += dt;
    G.shake = Math.max(0, G.shake - dt * 34);
    G.dog.blink -= dt;
    G.dog.tail += dt * (G.dog.mode === 'watch' ? 9 : 3);

    // Confetti & floaters run on every screen so celebrations keep playing.
    for (let i = G.confetti.length - 1; i >= 0; i--) {
      const c = G.confetti[i];
      c.vy += 620 * dt;
      c.x += c.vx * dt; c.y += c.vy * dt;
      c.rot += c.vr * dt;
      c.life -= dt;
      if (c.life <= 0 || c.y > H + 40) G.confetti.splice(i, 1);
    }
    for (let i = G.pops.length - 1; i >= 0; i--) {
      const p = G.pops[i];
      p.y -= 46 * dt; p.life -= dt * 1.3;
      if (p.life <= 0) G.pops.splice(i, 1);
    }
    for (const d of G.ducks) d.squeal = Math.max(0, d.squeal - dt * 2);

    if (G.screen !== 'play') return;

    // --- dog state machine
    G.dog.t -= dt;
    if (G.dog.t <= 0) {
      if (G.dog.mode === 'sleep')      setDog('stir');
      else if (G.dog.mode === 'stir')  setDog(G.dog.fake ? 'sleep' : 'watch');
      else                             setDog('sleep');
    }

    // --- player movement
    if (G.caughtT > 0) G.caughtT -= dt;
    const canMove = G.holding && !G.needRelease && G.caughtT <= 0;
    const moving = canMove && G.p < 1;

    if (moving) {
      G.p = Math.min(1, G.p + G.cfg.speed * dt);
      G.walkPhase += dt * 13;
      G.stepT -= dt;
      if (G.stepT <= 0) { SFX.step(); G.stepT = 0.27; }
      G.squeakT = 0;
      // Caught red-handed: moving while those eyes are open.
      if (G.dog.mode === 'watch') spotted('seen');
    } else if (G.caughtT <= 0 && G.p > 0 && G.p < 1) {
      // Standing still on a squeaky duck wakes Biscuit — but only to STIR,
      // so there is always a beat to react instead of a dead end.
      const duck = G.ducks.find(d => Math.abs(d.p - G.p) < d.w);
      if (duck) {
        G.squeakT += dt;
        if (G.squeakT > 0.5) {
          G.squeakT = 0;
          duck.squeal = 1;
          SFX.squeak();
          if (G.dog.mode === 'sleep') { setDog('stir'); G.dog.fake = false; }
          toast('Squeeeak! 🦆');
        }
      } else {
        G.squeakT = 0;
      }
    }

    // --- cookie pickups
    for (const c of G.cookies) {
      if (!c.got && Math.abs(G.p - c.p) < 0.028) {
        c.got = true;
        G.stars++; G.levelStars++;
        updateStarPill();
        persist();
        SFX.cookie();
        const y = trackY(c.p);
        popText(W / 2, y - 18, '+⭐');
        burstConfetti(W / 2, y, 10);
      }
    }

    // --- reached the jar
    if (G.p >= 1) winLevel();

    // --- status banner
    let cls = '', txt = '';
    if (G.caughtT > 0)                 { cls = 'danger'; txt = '🐶 Boop! Wait a sec…'; }
    else if (G.dog.mode === 'sleep')   { cls = '';       txt = '😴 Zzz… tiptoe!'; }
    else if (G.dog.mode === 'stir')    { cls = 'warn';   txt = '❓ He’s stirring…'; }
    else                               { cls = 'danger'; txt = '👀 WATCHING! Freeze!'; }
    if (statusEl.dataset.k !== cls + txt) {
      statusEl.dataset.k = cls + txt;
      statusEl.className = cls;
      statusEl.textContent = txt;
    }
  }

  function winLevel() {
    G.screen = 'win';
    G.holding = false;
    holdBar.classList.remove('pressed');
    G.best = Math.max(G.best, G.level + 1);
    persist();
    SFX.win();
    setTimeout(() => SFX.munch(), 420);
    for (let i = 0; i < 4; i++) {
      setTimeout(() => burstConfetti(rand(W * 0.2, W * 0.8), rand(H * 0.3, H * 0.6), 26), i * 130);
    }
    const perfect = G.oops === 0;
    winEmoji.textContent = perfect ? '🏆🍪' : '🍪';
    winTitle.textContent = perfect ? 'Silent Sneaker!' : 'Cookies! Yum!';
    const allCookies = G.levelStars === G.cookies.length;
    winText.textContent =
      (perfect ? 'Biscuit never even woke up. ' : 'You made it to the jar! ') +
      (allCookies ? 'You grabbed every cookie on the rug! ' : '') +
      'Level ' + G.level + ' done — ⭐ ' + G.stars + ' total.';
    setTimeout(() => winOv.classList.remove('hidden'), 900);
  }

  // ---------------------------------------------------------------- drawing
  function roundRect(x, y, w, h, r) {
    const rr = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + rr, y);
    ctx.arcTo(x + w, y, x + w, y + h, rr);
    ctx.arcTo(x + w, y + h, x, y + h, rr);
    ctx.arcTo(x, y + h, x, y, rr);
    ctx.arcTo(x, y, x + w, y, rr);
    ctx.closePath();
  }

  function drawRoom() {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#2f2160');
    g.addColorStop(0.55, '#553280');
    g.addColorStop(1, '#7c4b34');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    // Warm lamp glow behind the cookie jar.
    const glow = ctx.createRadialGradient(W / 2, topY() - 30, 10, W / 2, topY() - 30, Math.max(W, H) * 0.55);
    glow.addColorStop(0, 'rgba(255, 214, 130, 0.34)');
    glow.addColorStop(1, 'rgba(255, 214, 130, 0)');
    ctx.fillStyle = glow;
    ctx.fillRect(0, 0, W, H);

    // Floorboards.
    const floorTop = topY() + 6;
    ctx.strokeStyle = 'rgba(0,0,0,0.16)';
    ctx.lineWidth = 2;
    for (let y = floorTop; y < H; y += 34) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
    }

    // Rug runner.
    const rw = rugW(), rx = (W - rw) / 2;
    const ry = topY() - 18, rh = bottomY() - ry + 26;
    ctx.fillStyle = 'rgba(0,0,0,0.22)';
    roundRect(rx + 4, ry + 6, rw, rh, 18); ctx.fill();
    const rg = ctx.createLinearGradient(rx, 0, rx + rw, 0);
    rg.addColorStop(0, '#e04766');
    rg.addColorStop(0.5, '#ff6f8c');
    rg.addColorStop(1, '#e04766');
    ctx.fillStyle = rg;
    roundRect(rx, ry, rw, rh, 18); ctx.fill();
    ctx.save();
    roundRect(rx, ry, rw, rh, 18); ctx.clip();
    ctx.fillStyle = 'rgba(255,255,255,0.14)';
    for (let y = ry; y < ry + rh; y += 42) ctx.fillRect(rx, y, rw, 16);
    ctx.restore();
    ctx.strokeStyle = '#ffd9a0'; ctx.lineWidth = 4;
    roundRect(rx, ry, rw, rh, 18); ctx.stroke();

    // Faint footprints marking the path.
    ctx.fillStyle = 'rgba(255,255,255,0.13)';
    for (let i = 1; i < 10; i++) {
      const y = trackY(i / 10);
      const off = (i % 2 === 0) ? 11 : -11;
      ctx.beginPath(); ctx.ellipse(W / 2 + off, y, 5, 7, 0, 0, 6.3); ctx.fill();
    }
  }

  function drawDuck(d) {
    const y = trackY(d.p);
    const x = W / 2 + (d.p * 100 % 2 < 1 ? -1 : 1) * Math.min(rugW() * 0.22, 46);
    const near = Math.abs(G.p - d.p) < d.w && !G.holding && G.screen === 'play';
    const bob = Math.sin(G.time * 5 + d.p * 10) * 2;
    const s = 1 + d.squeal * 0.3;

    ctx.save();
    ctx.translate(x, y + bob);
    ctx.scale(s, s);
    if (near || d.squeal > 0) {
      ctx.fillStyle = 'rgba(255, 220, 80, ' + (0.3 + d.squeal * 0.4) + ')';
      ctx.beginPath(); ctx.arc(0, 0, 24, 0, 6.3); ctx.fill();
    }
    ctx.fillStyle = '#ffd43b';                       // body
    ctx.beginPath(); ctx.ellipse(0, 3, 13, 9, 0, 0, 6.3); ctx.fill();
    ctx.beginPath(); ctx.arc(6, -6, 7, 0, 6.3); ctx.fill();   // head
    ctx.fillStyle = '#ff8c1a';                       // beak
    ctx.beginPath(); ctx.moveTo(11, -6); ctx.lineTo(19, -4); ctx.lineTo(11, -2); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#3b2a12';                       // eye
    ctx.beginPath(); ctx.arc(7, -8, 1.8, 0, 6.3); ctx.fill();
    ctx.restore();

    if (near || d.squeal > 0) {
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 20px ' + getComputedStyle(document.body).fontFamily;
      ctx.textAlign = 'center';
      ctx.fillText('!', x, y - 26 + bob);
    }
  }

  function drawCookie(c) {
    if (c.got) return;
    const y = trackY(c.p);
    const bob = Math.sin(G.time * 4 + c.p * 8) * 3;
    ctx.save();
    ctx.translate(W / 2, y + bob);
    ctx.fillStyle = 'rgba(0,0,0,0.2)';
    ctx.beginPath(); ctx.ellipse(1, 11, 11, 4, 0, 0, 6.3); ctx.fill();
    ctx.fillStyle = '#e0a44e';
    ctx.beginPath(); ctx.arc(0, 0, 13, 0, 6.3); ctx.fill();
    ctx.fillStyle = '#5a3418';
    [[-5, -4], [4, -6], [0, 4], [6, 3], [-6, 4]].forEach(pt => {
      ctx.beginPath(); ctx.arc(pt[0], pt[1], 2.4, 0, 6.3); ctx.fill();
    });
    ctx.restore();
  }

  function drawJar(x, y) {
    ctx.save();
    ctx.translate(x, y);
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.beginPath(); ctx.ellipse(2, 30, 30, 8, 0, 0, 6.3); ctx.fill();
    // glass body
    ctx.fillStyle = 'rgba(190, 235, 255, 0.72)';
    roundRect(-27, -14, 54, 44, 12); ctx.fill();
    ctx.strokeStyle = '#eaf8ff'; ctx.lineWidth = 3;
    roundRect(-27, -14, 54, 44, 12); ctx.stroke();
    // cookies inside
    ctx.fillStyle = '#d99b46';
    [[-12, 8], [6, 12], [-3, -1], [14, 0]].forEach(pt => {
      ctx.beginPath(); ctx.arc(pt[0], pt[1], 8, 0, 6.3); ctx.fill();
    });
    // lid
    ctx.fillStyle = '#ff6f8c';
    roundRect(-31, -25, 62, 14, 7); ctx.fill();
    ctx.fillStyle = '#ffd54a';
    ctx.beginPath(); ctx.arc(0, -29, 6, 0, 6.3); ctx.fill();
    ctx.restore();
  }

  function drawDog(x, y) {
    const m = G.dog.mode;
    const wake = (m === 'watch');
    const stir = (m === 'stir');
    const breathe = Math.sin(G.time * 2.2) * (wake ? 1 : 3);

    ctx.save();
    ctx.translate(x, y + breathe);

    if (wake) {                                   // alert halo
      const pulse = 0.34 + Math.sin(G.time * 12) * 0.12;
      ctx.fillStyle = 'rgba(255, 77, 94, ' + pulse + ')';
      ctx.beginPath(); ctx.arc(0, 0, 78, 0, 6.3); ctx.fill();
    }

    // body behind the head
    ctx.fillStyle = '#c98a4b';
    ctx.beginPath(); ctx.ellipse(0, 46, 56, 30, 0, 0, 6.3); ctx.fill();

    // wagging tail
    const tw = Math.sin(G.dog.tail) * (wake ? 0.7 : 0.35);
    ctx.save();
    ctx.translate(52, 44); ctx.rotate(-0.5 + tw);
    ctx.strokeStyle = '#c98a4b'; ctx.lineWidth = 11; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(26, -6); ctx.stroke();
    ctx.restore();

    // ears — perked when stirring or watching
    const earLift = (stir || wake) ? -18 : 4;
    ctx.fillStyle = '#a86a33';
    [-1, 1].forEach(s => {
      ctx.save();
      ctx.translate(s * 40, -6 + earLift * 0.4);
      ctx.rotate(s * ((stir || wake) ? 0.15 : 0.75));
      ctx.beginPath(); ctx.ellipse(0, 12 + (stir || wake ? -8 : 8), 13, 26, 0, 0, 6.3); ctx.fill();
      ctx.restore();
    });

    // head
    ctx.fillStyle = '#dda05c';
    ctx.beginPath(); ctx.arc(0, 0, 44, 0, 6.3); ctx.fill();
    ctx.fillStyle = '#f0c48c';                    // muzzle
    ctx.beginPath(); ctx.ellipse(0, 18, 26, 18, 0, 0, 6.3); ctx.fill();
    ctx.fillStyle = '#3a2412';                    // nose
    ctx.beginPath(); ctx.ellipse(0, 8, 9, 7, 0, 0, 6.3); ctx.fill();
    ctx.strokeStyle = '#3a2412'; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(0, 13); ctx.lineTo(0, 22);
    ctx.moveTo(0, 22); ctx.arc(-6, 22, 6, 0, Math.PI);
    ctx.moveTo(0, 22); ctx.arc(6, 22, 6, 0, Math.PI);
    ctx.stroke();

    // eyes
    if (wake) {
      [-16, 16].forEach(ex => {
        ctx.fillStyle = '#fff';
        ctx.beginPath(); ctx.ellipse(ex, -8, 12, 13, 0, 0, 6.3); ctx.fill();
        ctx.fillStyle = '#20140a';
        ctx.beginPath(); ctx.arc(ex, -5, 6.5, 0, 6.3); ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.beginPath(); ctx.arc(ex + 2.5, -8, 2.2, 0, 6.3); ctx.fill();
      });
      // Brows raised in the middle = surprised & alert, never angry.
      ctx.strokeStyle = '#8a5323'; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.moveTo(-27, -20); ctx.lineTo(-8, -26);
      ctx.moveTo(27, -20); ctx.lineTo(8, -26);
      ctx.stroke();
    } else if (stir) {
      [-16, 16].forEach(ex => {
        ctx.fillStyle = '#fff';
        ctx.beginPath(); ctx.ellipse(ex, -8, 10, 6, 0, 0, 6.3); ctx.fill();
        ctx.fillStyle = '#20140a';
        ctx.beginPath(); ctx.arc(ex, -7, 4, 0, 6.3); ctx.fill();
      });
    } else {
      ctx.strokeStyle = '#20140a'; ctx.lineWidth = 3.5;
      [-16, 16].forEach(ex => {
        ctx.beginPath(); ctx.arc(ex, -12, 11, 0.35, Math.PI - 0.35); ctx.stroke();
      });
    }
    ctx.restore();

    // Thought bubbles above the dog.
    ctx.textAlign = 'center';
    const fam = getComputedStyle(document.body).fontFamily;
    if (m === 'sleep') {
      ctx.fillStyle = 'rgba(255,255,255,0.85)';
      for (let i = 0; i < 3; i++) {
        const t = (G.time * 0.6 + i * 0.33) % 1;
        ctx.globalAlpha = 0.9 * (1 - t);
        ctx.font = 'bold ' + (13 + i * 5) + 'px ' + fam;
        ctx.fillText('z', x + 44 + i * 13, y - 42 - t * 34);
      }
      ctx.globalAlpha = 1;
    } else if (stir) {
      ctx.fillStyle = '#ffcf3d';
      ctx.font = 'bold 34px ' + fam;
      ctx.fillText('?', x + 52, y - 42 + Math.sin(G.time * 16) * 3);
    } else {
      ctx.fillStyle = '#ff4d5e';
      ctx.font = 'bold 34px ' + fam;
      ctx.fillText('!', x + 52, y - 42 + Math.sin(G.time * 20) * 3);
    }
  }

  function drawPlayer() {
    const y = trackY(G.p);
    const moving = G.holding && !G.needRelease && G.caughtT <= 0 && G.p < 1 && G.screen === 'play';
    const bounce = moving ? Math.abs(Math.sin(G.walkPhase)) * 4 : 0;
    const wob = moving ? Math.sin(G.walkPhase * 0.5) * 2 : 0;
    const x = W / 2 + wob;
    const scared = G.caughtT > 0;

    ctx.save();
    ctx.translate(x, y - bounce);

    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.beginPath(); ctx.ellipse(0, 22 + bounce, 16, 5, 0, 0, 6.3); ctx.fill();

    // legs (tiptoe)
    ctx.strokeStyle = '#5f4bb6'; ctx.lineWidth = 6; ctx.lineCap = 'round';
    const swing = moving ? Math.sin(G.walkPhase) * 7 : 2;
    ctx.beginPath();
    ctx.moveTo(-5, 10); ctx.lineTo(-5 - swing * 0.4, 21);
    ctx.moveTo(5, 10);  ctx.lineTo(5 + swing * 0.4, 21);
    ctx.stroke();

    // pyjama body
    ctx.fillStyle = '#7d63e8';
    roundRect(-13, -6, 26, 20, 8); ctx.fill();
    ctx.fillStyle = '#a893ff';
    for (let i = -1; i <= 1; i++) { ctx.beginPath(); ctx.arc(i * 7, 4, 2.2, 0, 6.3); ctx.fill(); }

    // arms — up by the mouth in a "shhh"
    ctx.strokeStyle = '#ffd9b3'; ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.moveTo(-12, -2); ctx.lineTo(-17, -10 + (moving ? swing * 0.3 : 0));
    ctx.moveTo(12, -2);  ctx.lineTo(17, -10 - (moving ? swing * 0.3 : 0));
    ctx.stroke();

    // head
    ctx.fillStyle = '#ffd9b3';
    ctx.beginPath(); ctx.arc(0, -20, 13, 0, 6.3); ctx.fill();
    // hair
    ctx.fillStyle = '#4a3020';
    ctx.beginPath(); ctx.arc(0, -24, 13, Math.PI, 0); ctx.fill();
    ctx.beginPath(); ctx.arc(0, -34, 4, 0, 6.3); ctx.fill();
    // face
    ctx.fillStyle = '#2b1b47';
    if (scared) {
      ctx.beginPath(); ctx.arc(-4.5, -21, 3, 0, 6.3); ctx.fill();
      ctx.beginPath(); ctx.arc(4.5, -21, 3, 0, 6.3); ctx.fill();
      ctx.beginPath(); ctx.ellipse(0, -14, 3.5, 3, 0, 0, 6.3); ctx.fill();
    } else {
      ctx.beginPath(); ctx.arc(-4.5, -21, 2, 0, 6.3); ctx.fill();
      ctx.beginPath(); ctx.arc(4.5, -21, 2, 0, 6.3); ctx.fill();
      ctx.strokeStyle = '#2b1b47'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(0, -16, 4, 0.2, Math.PI - 0.2); ctx.stroke();
    }
    ctx.restore();
  }

  function drawVignette() {
    let col = null;
    if (G.screen === 'play') {
      if (G.dog.mode === 'watch' || G.caughtT > 0) col = [255, 60, 80, 0.34];
      else if (G.dog.mode === 'stir') col = [255, 205, 60, 0.24];
      else col = [70, 230, 130, 0.14];
    }
    if (!col) return;
    const g = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.28, W / 2, H / 2, Math.max(W, H) * 0.72);
    g.addColorStop(0, 'rgba(' + col[0] + ',' + col[1] + ',' + col[2] + ',0)');
    g.addColorStop(1, 'rgba(' + col[0] + ',' + col[1] + ',' + col[2] + ',' + col[3] + ')');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }

  function drawProgressPips() {
    // Little cookie pips down the left edge showing how far along you are.
    const x = 16, t = topY() - 4, b = bottomY() + 8;
    ctx.strokeStyle = 'rgba(255,255,255,0.22)'; ctx.lineWidth = 6; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x, b); ctx.lineTo(x, t); ctx.stroke();
    ctx.strokeStyle = '#ffd54a';
    ctx.beginPath(); ctx.moveTo(x, b); ctx.lineTo(x, b + (t - b) * G.p); ctx.stroke();
    ctx.fillStyle = '#fff6e6';
    ctx.beginPath(); ctx.arc(x, b + (t - b) * G.p, 6, 0, 6.3); ctx.fill();
  }

  function drawEffects() {
    for (const c of G.confetti) {
      ctx.save();
      ctx.translate(c.x, c.y); ctx.rotate(c.rot);
      ctx.globalAlpha = Math.max(0, Math.min(1, c.life));
      ctx.fillStyle = c.col;
      ctx.fillRect(-c.size / 2, -c.size / 2, c.size, c.size * 0.62);
      ctx.restore();
    }
    ctx.globalAlpha = 1;
    ctx.textAlign = 'center';
    const fam = getComputedStyle(document.body).fontFamily;
    for (const p of G.pops) {
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = '#ffd54a';
      ctx.font = 'bold 22px ' + fam;
      ctx.fillText(p.txt, p.x, p.y);
    }
    ctx.globalAlpha = 1;
  }

  function render() {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.clearRect(0, 0, W, H);
    if (G.shake > 0) {
      ctx.translate(rand(-G.shake, G.shake) * 0.5, rand(-G.shake, G.shake) * 0.5);
    }

    drawRoom();
    for (const d of G.ducks) drawDuck(d);
    for (const c of G.cookies) drawCookie(c);
    drawDog(W / 2, topY() - 62);
    drawJar(W / 2, topY() - 2);
    if (G.screen !== 'title') { drawPlayer(); drawProgressPips(); }
    drawVignette();
    drawEffects();
  }

  // ---------------------------------------------------------------- loop
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    update(dt);
    render();
    requestAnimationFrame(frame);
  }

  // ---------------------------------------------------------------- boot
  resize();
  buildLevel(1);
  G.screen = 'title';
  updateStarPill();
  requestAnimationFrame(frame);

  // Exposed so the local test harness can drive and inspect a run.
  window.__sneaky = G;
  window.__sneakyAudio = () => ({
    muted: muted,
    ctxState: actx ? actx.state : null,
    masterGain: master ? master.gain.value : null
  });
})();
</script>
</body>
</html>
