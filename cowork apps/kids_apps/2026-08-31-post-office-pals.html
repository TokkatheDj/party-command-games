<!-- CONCEPT: Post Office Pals - a pretend-play post office where kids run the counter for animal customers: pick the box that fits the parcel, read the scale and press on that many stamps, then ride the delivery van down the street and pop it in the matching house's mailbox for a confetti thank-you. -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Post Office Pals</title>
<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

:root{
  --wall:#fff3dc;
  --wall2:#ffe6bd;
  --wood:#c98a4b;
  --wood-dark:#a2682f;
  --ink:#4a3423;
  --sky1:#8fd6ff;
  --sky2:#dff4ff;
  --grass:#7fd67f;
  --road:#8d8f9c;
  --red:#ff5d5d;
  --blue:#4aa3ff;
  --green:#3ecf8e;
  --yellow:#ffd93d;
  --purple:#b07cff;
  --orange:#ff9f43;
  --pink:#ff86c8;
  --card:#ffffff;
  --pad: clamp(6px, 2vw, 14px);
  --font: "Comic Sans MS", "Comic Sans", "Trebuchet MS", system-ui, sans-serif;
}

html, body{
  margin:0; padding:0;
  height:100%;
  overflow:hidden;
  touch-action: manipulation;
  user-select:none; -webkit-user-select:none;
  font-family: var(--font);
  color: var(--ink);
  background:#ffdfa8;
}

#app{
  position:relative;
  width:100%;
  height:100vh;
  height:100dvh;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

#confetti{
  position:fixed; inset:0;
  width:100%; height:100%;
  pointer-events:none;
  z-index:60;
}

button{ font-family:inherit; color:inherit; border:none; background:none; cursor:pointer; }

/* ---------------- title ---------------- */
#titleScreen{
  position:absolute; inset:0; z-index:40;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap: clamp(8px, 2.4vh, 18px);
  padding: 18px;
  background:
    radial-gradient(circle at 20% 12%, rgba(255,255,255,.65), transparent 42%),
    linear-gradient(180deg, var(--sky1), var(--sky2) 58%, var(--grass));
  text-align:center;
}
.title-badge{ font-size: clamp(52px, 17vw, 96px); line-height:1; filter: drop-shadow(0 6px 0 rgba(0,0,0,.12)); animation: bobbing 2.4s ease-in-out infinite; }
h1{
  margin:0;
  font-size: clamp(30px, 9.5vw, 56px);
  letter-spacing:.5px;
  background: linear-gradient(90deg, #ff5d5d, #ff9f43 40%, #4aa3ff);
  -webkit-background-clip:text; background-clip:text; color:transparent;
  filter: drop-shadow(0 3px 0 rgba(255,255,255,.9));
}
.tagline{ margin:0; font-size: clamp(14px, 4.2vw, 20px); color:#3f5a6b; max-width: 22ch; line-height:1.35; }
.big-btn{
  min-height:74px;
  padding: 14px 34px;
  font-size: clamp(20px, 6vw, 30px);
  border-radius:999px;
  background: linear-gradient(180deg, #ffe27a, #ffb020);
  box-shadow: 0 7px 0 #d1841a, 0 12px 18px rgba(0,0,0,.18);
  color:#5a3a06;
  transition: transform .09s ease, box-shadow .09s ease;
}
.big-btn:active{ transform: translateY(5px); box-shadow: 0 2px 0 #d1841a, 0 6px 10px rgba(0,0,0,.2); }
.big-btn.blue{ background: linear-gradient(180deg,#9fd8ff,#3f95ff); box-shadow:0 7px 0 #2a6fc4, 0 12px 18px rgba(0,0,0,.18); color:#0e2c50; }
.stats-card{
  background: rgba(255,255,255,.82);
  border-radius:20px;
  padding: 10px 18px;
  font-size: clamp(13px, 3.8vw, 17px);
  box-shadow: 0 4px 0 rgba(0,0,0,.08);
  max-width: 92%;
}
.trophy-row{ font-size: clamp(18px,5.4vw,26px); letter-spacing:2px; margin-top:4px; min-height:1.2em; }
.tiny-btn{
  font-size: clamp(12px,3.4vw,15px);
  padding:12px 18px; min-height:46px;
  border-radius:999px;
  background: rgba(255,255,255,.7);
  color:#5b6b78;
  box-shadow:0 3px 0 rgba(0,0,0,.1);
}

/* ---------------- topbar ---------------- */
#topbar{
  flex: 0 0 auto;
  display:flex; align-items:center; gap:8px;
  padding: 8px var(--pad);
  background: linear-gradient(180deg,#2f7bd6,#245fa8);
  color:#fff;
  box-shadow: 0 3px 0 rgba(0,0,0,.15);
  z-index:20;
}
.top-title{ font-size: clamp(13px, 3.8vw, 17px); font-weight:bold; white-space:nowrap; }
#progressDots{ display:flex; gap:4px; flex:1; justify-content:center; flex-wrap:nowrap; }
.dot{
  width: clamp(13px,3.6vw,18px); height: clamp(13px,3.6vw,18px);
  border-radius:5px;
  background: rgba(255,255,255,.28);
  box-shadow: inset 0 -2px 0 rgba(0,0,0,.12);
  transition: transform .25s ease, background .25s ease;
}
.dot.done{ background: var(--yellow); transform: scale(1.12) rotate(-6deg); }
.icon-btn{
  width:46px; height:46px; min-width:46px;
  border-radius:14px;
  font-size:21px;
  background: rgba(255,255,255,.2);
  display:flex; align-items:center; justify-content:center;
}
.icon-btn:active{ transform: scale(.92); }

/* ---------------- stage ---------------- */
#stage{
  position:relative;
  flex:1 1 auto;
  min-height:0;
  overflow:hidden;
}
.scene{
  position:absolute; inset:0;
  display:none;
  flex-direction:column;
  align-items:center;
  padding: var(--pad);
  gap: clamp(4px, 1.4vh, 12px);
}
.scene.active{ display:flex; }

.speech{
  background:#fff;
  border-radius: 18px;
  padding: 8px 14px;
  font-size: clamp(14px, 4.2vw, 20px);
  text-align:center;
  box-shadow: 0 4px 0 rgba(0,0,0,.12);
  line-height:1.25;
  max-width: 96%;
}
.speech b{ color:#d1560c; }

/* ---- counter scene ---- */
#counterScene{
  background:
    linear-gradient(180deg, var(--wall) 0%, var(--wall2) 72%, #f0d29c 72%, #e3b578 74%, #c98a4b 100%);
  padding-bottom: clamp(12px, 3vh, 24px);
}
.postcard-strip{
  position:absolute; top:0; left:0; right:0; height:10px;
  background: repeating-linear-gradient(90deg, var(--red) 0 14px, #fff 14px 28px, var(--blue) 28px 42px, #fff 42px 56px);
  opacity:.85;
}
.customer-row{
  display:flex; align-items:center; justify-content:center; gap:10px;
  width:100%;
  margin-top:6px;
}
#customerEmoji{
  font-size: clamp(40px, 12vw, 62px);
  line-height:1;
  animation: bobbing 1.6s ease-in-out infinite;
}
.item-pod{
  display:flex; align-items:center; justify-content:center;
  margin-top:auto;
  width: clamp(120px, 40vw, 190px);
  height: clamp(96px, 22vh, 150px);
  border-radius:22px;
  background: radial-gradient(circle at 50% 40%, #fff 0%, #ffeec2 70%, #ffd98a 100%);
  box-shadow: inset 0 -6px 0 rgba(0,0,0,.08), 0 5px 0 rgba(0,0,0,.1);
}
#itemEmoji{ line-height:1; animation: popIn .4s ease; }
#itemEmoji.sz-small{ font-size: clamp(34px, 10vw, 48px); }
#itemEmoji.sz-medium{ font-size: clamp(52px, 16vw, 76px); }
#itemEmoji.sz-big{ font-size: clamp(70px, 22vw, 104px); }

.box-row{
  display:flex; align-items:flex-end; justify-content:center;
  gap: clamp(6px, 2.6vw, 16px);
  width:100%;
  margin-top: auto;
}
.boxbtn{
  position:relative;
  border-radius:10px;
  background: linear-gradient(180deg, #e0a566 0%, var(--wood) 42%, var(--wood-dark) 100%);
  box-shadow: 0 6px 0 #7d4e1c, 0 10px 14px rgba(0,0,0,.2);
  display:flex; align-items:flex-end; justify-content:center;
  padding-bottom:6px;
  color:#fff;
  font-weight:bold;
  text-shadow: 0 2px 0 rgba(0,0,0,.4);
  font-size: clamp(11px,3.2vw,14px);
  transition: transform .12s ease;
  overflow:hidden;
}
.boxbtn::before{ /* tape */
  content:"";
  position:absolute; left:50%; top:0; bottom:0; width:16%;
  transform: translateX(-50%);
  background: rgba(255,255,255,.4);
}
.boxbtn::after{ /* flap line */
  content:"";
  position:absolute; left:0; right:0; top:26%; height:3px;
  background: rgba(0,0,0,.16);
}
.boxbtn span{ position:relative; z-index:2; }
.boxbtn:active{ transform: translateY(4px) scale(.97); }
.boxbtn.sz-small{ width: clamp(74px, 22vw, 96px); height: clamp(60px, 15vw, 76px); }
.boxbtn.sz-medium{ width: clamp(94px, 27vw, 120px); height: clamp(80px, 20vw, 100px); }
.boxbtn.sz-big{ width: clamp(112px, 32vw, 146px); height: clamp(102px, 25vw, 124px); }
.boxbtn.wrong{ animation: wobble .45s ease; }
.hintGlow{ animation: hintPulse 1s ease-in-out infinite; }

/* ---- stamp scene ---- */
#stampScene{
  background: linear-gradient(180deg, #fff3dc 0%, #ffe6bd 76%, #f0d29c 76%, #e3b578 78%, #c98a4b 100%);
  justify-content:center;
  padding-bottom: clamp(12px, 3vh, 24px);
  gap: clamp(8px, 2.4vh, 20px);
}
.scale-wrap{ display:flex; align-items:flex-end; justify-content:center; gap: clamp(8px,3vw,20px); width:100%; }
.scale{
  position:relative;
  width: clamp(88px, 26vw, 120px);
  display:flex; flex-direction:column; align-items:center;
}
.scale-dial{
  width: clamp(74px, 22vw, 100px); height: clamp(74px, 22vw, 100px);
  border-radius:50%;
  background: radial-gradient(circle at 50% 42%, #fff 0 58%, #ffd93d 60%, #f0a800 100%);
  box-shadow: 0 5px 0 rgba(0,0,0,.18), inset 0 0 0 5px #fff;
  display:flex; align-items:center; justify-content:center;
  position:relative;
}
#needle{
  position:absolute; left:50%; bottom:50%;
  width:4px; height:38%;
  background:#e03b3b;
  border-radius:3px;
  transform-origin: 50% 100%;
  transform: translateX(-50%) rotate(-70deg);
  transition: transform .9s cubic-bezier(.2,1.6,.5,1);
}
.scale-dial::after{ content:""; position:absolute; width:11px; height:11px; border-radius:50%; background:#e03b3b; }
.scale-base{ width:100%; height:14px; background:#9aa4b2; border-radius:0 0 8px 8px; box-shadow:0 4px 0 #6f7885; }

.parcel{
  position:relative;
  width: clamp(112px, 34vw, 160px);
  height: clamp(92px, 26vw, 130px);
  border-radius:10px;
  background: linear-gradient(180deg, #e0a566 0%, var(--wood) 45%, var(--wood-dark) 100%);
  box-shadow: 0 6px 0 #7d4e1c, 0 10px 14px rgba(0,0,0,.2);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:6px;
  padding:6px;
}
.parcel::after{
  content:""; position:absolute; left:0; right:0; top:22%; height:3px; background:rgba(0,0,0,.16);
}
.slot-row{ display:flex; gap:5px; z-index:2; }
.slot{
  width: clamp(24px, 7.4vw, 34px); height: clamp(26px, 8vw, 38px);
  border-radius:4px;
  border:2px dashed rgba(255,255,255,.75);
  background: rgba(255,255,255,.14);
  display:flex; align-items:center; justify-content:center;
  font-size: clamp(14px,4.4vw,20px);
}
.slot.filled{
  border:2px solid #fff;
  background:#fff;
  animation: stampDown .35s cubic-bezier(.2,1.8,.4,1);
  box-shadow: 0 2px 0 rgba(0,0,0,.18);
}
.mini-label{
  z-index:2;
  display:flex; align-items:center; gap:4px;
  background:#fffdf5; border-radius:6px;
  padding:2px 8px;
  font-size: clamp(11px,3.2vw,14px);
  box-shadow:0 2px 0 rgba(0,0,0,.14);
}
.count-big{
  font-size: clamp(24px, 8vw, 40px);
  font-weight:bold;
  color:#d1560c;
  min-height:1.2em;
  text-shadow: 0 3px 0 rgba(255,255,255,.9);
}
.stamp-roll{
  width: clamp(150px, 52vw, 220px);
  min-height: 84px;
  border-radius:16px;
  background: repeating-linear-gradient(90deg,#ff9f43 0 8px, #ffb96e 8px 16px);
  box-shadow: 0 6px 0 #c56f18, 0 10px 14px rgba(0,0,0,.18);
  display:flex; align-items:center; justify-content:center; gap:8px;
  padding: 10px;
  margin-bottom:4px;
  transition: transform .1s ease;
}
.stamp-roll:active{ transform: translateY(4px) scale(.98); }
.stamp-roll.waiting{ opacity:.4; pointer-events:none; box-shadow:0 6px 0 #c56f18; }
.stamp-face{
  background:#fff; border-radius:5px;
  padding:5px 9px;
  font-size: clamp(20px,6vw,28px);
  box-shadow:0 2px 0 rgba(0,0,0,.2);
  border: 3px dotted #ffd93d;
}
.roll-label{ font-size: clamp(13px,3.8vw,17px); color:#6a3c05; font-weight:bold; }

/* ---- deliver scene ---- */
#deliverScene{
  background: linear-gradient(180deg, var(--sky1) 0%, #cfeaff 60%, var(--sky2) 100%);
  padding-bottom:0;
}
.sun{ position:absolute; top:6px; right:10px; font-size: clamp(28px,8vw,44px); animation: spinSlow 14s linear infinite; }
.cloud{ position:absolute; font-size: clamp(24px,7vw,38px); opacity:.9; }
.street{
  position:relative;
  width:100%;
  flex:0 0 auto;
  margin-top:auto;
  background: linear-gradient(180deg, #96e08a 0%, var(--grass) 26%, #59bb59 100%);
  box-shadow: inset 0 6px 0 rgba(255,255,255,.22);
  display:flex; align-items:flex-end; justify-content:center;
  gap: clamp(4px, 1.6vw, 12px);
  padding: clamp(14px, 4.5vh, 40px) 4px 8px;
}
.house{
  position:relative;
  width: clamp(70px, 22vw, 106px);
  display:flex; flex-direction:column; align-items:center;
  transition: transform .15s ease;
}
.house:active{ transform: translateY(3px) scale(.97); }
.street.busy .house{ pointer-events:none; }
.roof{
  width:100%; height: clamp(32px, 10vw, 46px);
  clip-path: polygon(50% 0, 100% 100%, 0 100%);
  background: linear-gradient(180deg,#ff8a5c,#d94f2b);
}
.body{
  width: 86%;
  height: clamp(84px, 24vw, 118px);
  border-radius: 4px 4px 8px 8px;
  display:flex; align-items:flex-end; justify-content:center;
  padding-bottom:0;
  box-shadow: inset 0 -6px 0 rgba(0,0,0,.12), 0 5px 0 rgba(0,0,0,.15);
  position:relative;
}
.door{
  width: 54%;
  height: 74%;
  border-radius: 26px 26px 3px 3px;
  background: linear-gradient(180deg,#8a5a2b,#6b421c);
  display:flex; align-items:center; justify-content:center;
  font-size: clamp(18px, 5.6vw, 26px);
  transform-origin: left center;
  transition: transform .5s ease;
  box-shadow: inset 0 0 0 3px rgba(255,255,255,.35);
}
.house.open .door{ transform: perspective(240px) rotateY(-72deg); }
.pal{
  position:absolute;
  bottom: 6%;
  font-size: clamp(26px, 8vw, 38px);
  opacity:0;
  transform: translateY(14px);
  transition: opacity .3s ease, transform .45s cubic-bezier(.2,1.7,.4,1);
  pointer-events:none;
}
.house.show-pal .pal{ opacity:1; transform: translateY(0); }
.mailbox{
  position:absolute; right:2px; bottom:2px;
  font-size: clamp(15px,4.6vw,20px);
  transition: transform .3s ease;
}
.house.delivered .mailbox{ transform: translateY(-6px) rotate(-12deg); }
.house-name{
  font-size: clamp(9px, 2.7vw, 12px);
  color:#2c5c2c;
  margin-top:2px;
  white-space:nowrap;
}
.house.nope{ animation: wobble .45s ease; }

.road{
  position:relative;
  flex:0 0 auto;
  width:100%;
  height: clamp(58px, 15vh, 92px);
  background: linear-gradient(180deg,#a5a8b5 0 6px, var(--road) 6px);
  border-top: 4px solid #6f7280;
  overflow:hidden;
}
.road::after{
  content:"";
  position:absolute; left:0; right:0; top:52%;
  height:5px;
  background: repeating-linear-gradient(90deg, #fff5c2 0 26px, transparent 26px 52px);
}
#van{
  position:absolute;
  bottom:6px; left:0;
  font-size: clamp(34px, 11vw, 52px);
  transform: translateX(6px);
  transition: transform .85s cubic-bezier(.4,.05,.35,1);
  z-index:3;
}
#van.jiggle{ animation: vanJiggle .28s ease-in-out infinite; }
#flyParcel{
  position:absolute;
  font-size: clamp(24px,7vw,34px);
  left:0; top:0;
  opacity:0;
  pointer-events:none;
  z-index:5;
  transition: transform .7s cubic-bezier(.3,-0.4,.4,1), opacity .2s ease;
}
.label-chip{
  display:inline-flex; align-items:center; gap:6px;
  border-radius:999px;
  padding: 3px 12px;
  font-size: clamp(14px,4.2vw,19px);
  color:#3a2a17;
  box-shadow: 0 3px 0 rgba(0,0,0,.16);
  border:3px solid #fff;
}

/* ---- finale ---- */
#finaleScene{
  background: linear-gradient(180deg,#ffd6f0,#ffe9b0 55%, #b6f0b6);
  justify-content:center;
  gap: clamp(8px,2vh,16px);
  text-align:center;
}
.trophy{ font-size: clamp(60px, 20vw, 110px); animation: bobbing 1.5s ease-in-out infinite; filter: drop-shadow(0 8px 0 rgba(0,0,0,.12)); }
.parade{ font-size: clamp(24px,7.4vw,36px); letter-spacing:2px; animation: paradeSlide 3.4s linear infinite; white-space:nowrap; }
h2{ margin:0; font-size: clamp(24px,7.5vw,40px); background: linear-gradient(90deg,#ff5d5d,#b07cff); -webkit-background-clip:text; background-clip:text; color:transparent; }

/* ---- toast ---- */
#toast{
  position:absolute;
  left:50%; top:8px;
  transform: translate(-50%, -140%);
  background:#fff;
  border-radius:999px;
  padding:10px 20px;
  font-size: clamp(14px,4.2vw,19px);
  box-shadow:0 5px 0 rgba(0,0,0,.15);
  transition: transform .3s cubic-bezier(.2,1.7,.4,1);
  z-index:50;
  pointer-events:none;
  max-width: 92%;
  text-align:center;
}
#toast.show{ transform: translate(-50%, 0); }

/* ---- animations ---- */
@keyframes bobbing{ 0%,100%{ transform: translateY(0) } 50%{ transform: translateY(-8px) } }
@keyframes popIn{ 0%{ transform: scale(.3) rotate(-14deg); opacity:0 } 100%{ transform: scale(1) rotate(0); opacity:1 } }
@keyframes wobble{ 0%,100%{ transform: translateX(0) } 20%{ transform: translateX(-9px) rotate(-4deg) } 45%{ transform: translateX(8px) rotate(4deg) } 70%{ transform: translateX(-5px) } }
@keyframes stampDown{ 0%{ transform: scale(2.1) rotate(12deg); opacity:.2 } 60%{ transform: scale(.92) } 100%{ transform: scale(1) rotate(0) } }
@keyframes hintPulse{ 0%,100%{ box-shadow: 0 6px 0 #7d4e1c, 0 0 0 0 rgba(255,217,61,.9) } 50%{ box-shadow: 0 6px 0 #7d4e1c, 0 0 0 14px rgba(255,217,61,0) } }
@keyframes spinSlow{ from{ transform: rotate(0) } to{ transform: rotate(360deg) } }
@keyframes vanJiggle{ 0%,100%{ transform: translateY(0) } 50%{ transform: translateY(-3px) } }
@keyframes paradeSlide{ from{ transform: translateX(40%) } to{ transform: translateX(-40%) } }
@keyframes floatUp{ 0%{ transform: translateY(0) scale(.6); opacity:1 } 100%{ transform: translateY(-90px) scale(1.3); opacity:0 } }
.heart{ position:absolute; font-size:24px; pointer-events:none; animation: floatUp 1.1s ease-out forwards; z-index:9; }
.hidden{ display:none !important; }
</style>
</head>
<body>
<div id="app">

  <canvas id="confetti"></canvas>

  <!-- ============ TITLE ============ -->
  <div id="titleScreen">
    <div class="title-badge">📮</div>
    <h1>Post Office Pals</h1>
    <p class="tagline">Box it, stamp it, deliver it!</p>
    <button class="big-btn" id="startBtn">▶ Open the Post Office</button>
    <div class="stats-card">
      <div id="allTime">Parcels delivered: 0</div>
      <div class="trophy-row" id="trophyRow"></div>
    </div>
    <button class="tiny-btn" id="clearBtn">Start my badges over</button>
  </div>

  <!-- ============ TOPBAR ============ -->
  <div id="topbar">
    <button class="icon-btn" id="homeBtn" aria-label="Back to start">🏠</button>
    <div class="top-title">📦 <span id="parcelCount">1/8</span></div>
    <div id="progressDots"></div>
    <button class="icon-btn" id="resetBtn" aria-label="Start this round again">🔄</button>
  </div>

  <!-- ============ STAGE ============ -->
  <div id="stage">
    <div id="toast"></div>

    <!-- COUNTER: pick the right box -->
    <div class="scene" id="counterScene">
      <div class="postcard-strip"></div>
      <div class="customer-row">
        <div id="customerEmoji">🐹</div>
        <div class="speech" id="counterSpeech">Please send my <b>🧸</b>!</div>
      </div>
      <div class="item-pod"><div id="itemEmoji" class="sz-medium">🧸</div></div>
      <div class="speech" id="boxPrompt">Which box will it fit in?</div>
      <div class="box-row" id="boxRow">
        <button class="boxbtn sz-small" data-size="small"><span>small</span></button>
        <button class="boxbtn sz-medium" data-size="medium"><span>medium</span></button>
        <button class="boxbtn sz-big" data-size="big"><span>BIG</span></button>
      </div>
    </div>

    <!-- STAMPS -->
    <div class="scene" id="stampScene">
      <div class="postcard-strip"></div>
      <div class="speech" id="stampPrompt">Weighing the parcel…</div>
      <div class="scale-wrap">
        <div class="scale">
          <div class="scale-dial"><div id="needle"></div></div>
          <div class="scale-base"></div>
        </div>
        <div class="parcel" id="parcelBox">
          <div class="mini-label" id="parcelLabel"><span>⭐</span></div>
          <div class="slot-row" id="slotRow"></div>
        </div>
      </div>
      <div class="count-big" id="countBig"></div>
      <button class="stamp-roll" id="stampRoll">
        <div class="stamp-face">🌈</div>
        <div class="roll-label">Press a<br>stamp!</div>
      </button>
    </div>

    <!-- DELIVERY -->
    <div class="scene" id="deliverScene">
      <div class="sun">☀️</div>
      <div class="cloud" style="top:4%; left:6%">☁️</div>
      <div class="cloud" style="top:14%; left:62%; font-size:26px">☁️</div>
      <div class="speech" id="deliverPrompt">Deliver to the <span class="label-chip">⭐</span> house!</div>
      <div class="street" id="street"></div>
      <div class="road">
        <div id="van">🚚</div>
        <div id="flyParcel">📦</div>
      </div>
    </div>

    <!-- FINALE -->
    <div class="scene" id="finaleScene">
      <div class="trophy">🏆</div>
      <h2>Best Postal Pal!</h2>
      <div class="speech" id="finaleText">You delivered all 8 parcels!</div>
      <div class="parade">🚚 🐰 🐨 🦊 🐸 🐧 🐻</div>
      <button class="big-btn" id="againBtn">🔁 Another Round</button>
      <button class="big-btn blue" id="finHomeBtn">🏠 Home</button>
    </div>
  </div>
</div>

<script>
(() => {
'use strict';

/* ================= audio ================= */
let AC = null;
function ac(){
  try{
    if(!AC){
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if(!Ctx) return null;
      AC = new Ctx();
    }
    if(AC.state === 'suspended') AC.resume().catch(()=>{});
    return AC;
  }catch(e){ return null; }
}
function tone(freq, dur, type='sine', vol=0.18, delay=0, slideTo=null){
  const c = ac(); if(!c) return;
  try{
    const t = c.currentTime + delay;
    const o = c.createOscillator();
    const g = c.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if(slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(40, slideTo), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(c.destination);
    o.start(t); o.stop(t + dur + 0.06);
  }catch(e){}
}
function noise(dur=0.2, vol=0.12, center=1600, delay=0){
  const c = ac(); if(!c) return;
  try{
    const len = Math.max(1, Math.floor(c.sampleRate * dur));
    const buf = c.createBuffer(1, len, c.sampleRate);
    const d = buf.getChannelData(0);
    for(let i=0;i<len;i++) d[i] = (Math.random()*2-1) * (1 - i/len);
    const src = c.createBufferSource(); src.buffer = buf;
    const bp = c.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value = center; bp.Q.value = 0.8;
    const g = c.createGain(); g.gain.value = vol;
    src.connect(bp); bp.connect(g); g.connect(c.destination);
    src.start(c.currentTime + delay);
  }catch(e){}
}
const S = {
  tape(){ noise(0.3, 0.1, 2600); tone(300, .12, 'triangle', .1, 0, 200); },
  stamp(i){ noise(0.09, 0.12, 900); tone(300 + i*40, .1, 'square', .09); tone(523*Math.pow(1.122, i), .22, 'triangle', .2, .02); },
  ding(){ tone(880, .22, 'sine', .18); tone(1320, .34, 'sine', .13, .07); },
  oops(){ tone(340, .15, 'triangle', .13); tone(270, .22, 'triangle', .11, .12); },
  engine(){ tone(92, .45, 'sawtooth', .06, 0, 120); tone(96, .45, 'square', .03, .1, 130); },
  doorbell(){ tone(659, .3, 'sine', .18); tone(494, .45, 'sine', .16, .2); },
  happy(){ [659,784,988].forEach((f,i)=>tone(f, .22, 'triangle', .18, i*0.09)); },
  fanfare(){ [523,659,784,1047,1319].forEach((f,i)=>tone(f, .3, 'triangle', .2, i*0.12)); noise(.4,.06,3000,.5); },
  whoosh(){ noise(.28, .08, 900); }
};

/* ================= confetti ================= */
const cvs = document.getElementById('confetti');
const ctx = cvs.getContext('2d');
let bits = [], raf = null;
function fitCanvas(){
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  cvs.width = Math.floor(window.innerWidth * dpr);
  cvs.height = Math.floor(window.innerHeight * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
fitCanvas();
window.addEventListener('resize', fitCanvas);
const CONF = ['#ff5d5d','#ffd93d','#4aa3ff','#3ecf8e','#b07cff','#ff86c8','#ff9f43'];
function confetti(n = 60, ox = null, oy = null){
  const W = window.innerWidth, H = window.innerHeight;
  const x0 = ox === null ? W/2 : ox;
  const y0 = oy === null ? H*0.42 : oy;
  for(let i=0;i<n;i++){
    bits.push({
      x: x0 + (Math.random()-.5)*90,
      y: y0 + (Math.random()-.5)*40,
      vx: (Math.random()-.5)*7.5,
      vy: -Math.random()*10 - 3,
      w: 6 + Math.random()*8,
      h: 5 + Math.random()*7,
      r: Math.random()*Math.PI,
      vr: (Math.random()-.5)*0.35,
      c: CONF[(Math.random()*CONF.length)|0],
      life: 90 + Math.random()*50
    });
  }
  if(!raf) raf = requestAnimationFrame(step);
}
function step(){
  const H = window.innerHeight;
  ctx.clearRect(0,0,window.innerWidth, H);
  for(let i=bits.length-1;i>=0;i--){
    const b = bits[i];
    b.vy += 0.34; b.x += b.vx; b.y += b.vy; b.r += b.vr; b.life--;
    if(b.life <= 0 || b.y > H + 40){ bits.splice(i,1); continue; }
    ctx.save();
    ctx.translate(b.x, b.y); ctx.rotate(b.r);
    ctx.fillStyle = b.c;
    ctx.fillRect(-b.w/2, -b.h/2, b.w, b.h);
    ctx.restore();
  }
  if(bits.length) raf = requestAnimationFrame(step);
  else { raf = null; ctx.clearRect(0,0,window.innerWidth,H); }
}

/* ================= data ================= */
const ITEMS = {
  small:  ['🔑','🍬','💍','🪙','🧦','🖍️','🐞','🍭','🪥','🥄','🎗️','🪺'],
  medium: ['🧸','⚽','📚','🎁','🪴','🥾','🎂','🍉','🎺','🪁','🧁','👟'],
  big:    ['🚲','🎸','🐘','🪑','🎹','🛷','🦒','🛴','🛁','🌳']
};
const SIZE_WORD = { small:'small', medium:'medium', big:'BIG' };
const HOUSES = [
  { sym:'⭐', color:'#ffd93d', name:'Star',   pal:'🐰' },
  { sym:'🌺', color:'#ff86c8', name:'Flower', pal:'🐨' },
  { sym:'🌙', color:'#b07cff', name:'Moon',   pal:'🦊' },
  { sym:'🍀', color:'#3ecf8e', name:'Clover', pal:'🐸' },
  { sym:'🔔', color:'#4aa3ff', name:'Bell',   pal:'🐧' },
  { sym:'❤️', color:'#ff5d5d', name:'Heart',  pal:'🐻' }
];
const CUSTOMERS = ['🐹','🐼','🐤','🐷','🐮','🦔','🐙','🦉','🐳','🦩','🐿️','🦆'];
const CHEERS = ['Thank you!','Yippee!','My parcel!','Wowee!','Hooray!','Just what I wanted!'];
const KUDOS = ['Nice work!','Perfect!','You got it!','Super!','Well done, postie!','Spot on!'];

const TOTAL = 8;
const STORE_KEY = 'cowork-post-office-pals-stats';

function pick(a){ return a[(Math.random()*a.length)|0]; }
function rnd(a,b){ return a + Math.floor(Math.random()*(b-a+1)); }
function shuffle(a){ const c = a.slice(); for(let i=c.length-1;i>0;i--){ const j=(Math.random()*(i+1))|0; [c[i],c[j]]=[c[j],c[i]]; } return c; }

/* ================= state ================= */
const G = {
  index: 0,
  parcel: null,
  stamped: 0,
  wrongBox: 0,
  wrongHouse: 0,
  busy: false,
  lastItem: '',
  running: false
};
let stats = { delivered: 0, rounds: 0 };

function loadStats(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw){
      const p = JSON.parse(raw);
      if(p && typeof p === 'object'){
        stats.delivered = Number(p.delivered) || 0;
        stats.rounds = Number(p.rounds) || 0;
      }
    }
  }catch(e){ stats = { delivered:0, rounds:0 }; }
}
function saveStats(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(stats)); }catch(e){}
}

/* ================= elements ================= */
const $ = id => document.getElementById(id);
const titleScreen = $('titleScreen');
const topbar = $('topbar');
const stage = $('stage');
const scenes = {
  counter: $('counterScene'),
  stamp: $('stampScene'),
  deliver: $('deliverScene'),
  finale: $('finaleScene')
};
const toastEl = $('toast');
let toastTimer = null;

function showScene(name){
  Object.keys(scenes).forEach(k => scenes[k].classList.toggle('active', k === name));
}
function toast(msg, ms = 1700){
  toastEl.innerHTML = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> toastEl.classList.remove('show'), ms);
}

/* ================= progress ================= */
function buildDots(){
  const wrap = $('progressDots');
  wrap.innerHTML = '';
  for(let i=0;i<TOTAL;i++){
    const d = document.createElement('div');
    d.className = 'dot';
    wrap.appendChild(d);
  }
}
function paintDots(){
  const dots = $('progressDots').children;
  for(let i=0;i<dots.length;i++) dots[i].classList.toggle('done', i < G.index);
  $('parcelCount').textContent = Math.min(G.index + 1, TOTAL) + '/' + TOTAL;
}

/* ================= parcel generation ================= */
function makeParcel(i){
  const sizes = ['small','medium','big'];
  const size = sizes[(Math.random()*3)|0];
  let item = pick(ITEMS[size]);
  let guard = 0;
  while(item === G.lastItem && guard++ < 8) item = pick(ITEMS[size]);
  G.lastItem = item;

  const stampsNeeded = size === 'small' ? rnd(1,2) : size === 'medium' ? rnd(2,3) : rnd(3,4);
  const houseCount = i < 3 ? 3 : 4;
  const houses = shuffle(HOUSES).slice(0, houseCount);
  const target = (Math.random()*houseCount)|0;

  return {
    size, item, stampsNeeded, houses, target,
    customer: pick(CUSTOMERS)
  };
}

/* ================= station 1: the box ================= */
function startParcel(){
  G.parcel = makeParcel(G.index);
  G.stamped = 0;
  G.wrongBox = 0;
  G.wrongHouse = 0;
  G.busy = false;
  paintDots();

  const p = G.parcel;
  $('customerEmoji').textContent = p.customer;
  $('counterSpeech').innerHTML = 'Please send my <b>' + p.item + '</b>!';
  const ie = $('itemEmoji');
  ie.textContent = p.item;
  ie.className = 'sz-' + p.size;
  // restart the pop animation
  ie.style.animation = 'none';
  void ie.offsetWidth;
  ie.style.animation = '';

  $('boxPrompt').textContent = 'Which box will it fit in?';
  Array.from($('boxRow').children).forEach(b => b.classList.remove('hintGlow','wrong'));

  showScene('counter');
  setTimeout(()=> S.doorbell(), 120);
}

$('boxRow').addEventListener('click', e => {
  const btn = e.target.closest('.boxbtn');
  if(!btn || G.busy || !G.parcel) return;
  const chosen = btn.dataset.size;
  const want = G.parcel.size;
  if(chosen === want){
    G.busy = true;
    S.tape();
    btn.classList.remove('wrong');
    $('boxPrompt').textContent = 'That one fits perfectly! 📦';
    const ie = $('itemEmoji');
    ie.style.transition = 'transform .5s cubic-bezier(.3,1.4,.4,1), opacity .4s ease';
    ie.style.transform = 'translateY(120px) scale(.4) rotate(20deg)';
    ie.style.opacity = '0';
    toast(pick(KUDOS));
    setTimeout(()=>{
      ie.style.transition = '';
      ie.style.transform = '';
      ie.style.opacity = '';
      goStamps();
    }, 780);
  }else{
    const order = { small:0, medium:1, big:2 };
    S.oops();
    btn.classList.remove('wrong'); void btn.offsetWidth; btn.classList.add('wrong');
    $('boxPrompt').textContent = order[chosen] < order[want]
      ? 'Ooh, too small — try a bigger box!'
      : 'That box is too roomy — try a smaller one!';
    G.wrongBox++;
    if(G.wrongBox >= 3){
      const right = $('boxRow').querySelector('[data-size="' + want + '"]');
      if(right) right.classList.add('hintGlow');
    }
  }
});

/* ================= station 2: stamps ================= */
function goStamps(){
  const p = G.parcel;
  G.stamped = 0;
  G.busy = true;

  const h = p.houses[p.target];
  const lab = $('parcelLabel');
  lab.innerHTML = '<span>' + h.sym + '</span>';
  lab.style.background = '#fffdf5';

  const row = $('slotRow');
  row.innerHTML = '';
  for(let i=0;i<p.stampsNeeded;i++){
    const s = document.createElement('div');
    s.className = 'slot';
    row.appendChild(s);
  }

  $('stampPrompt').textContent = 'Pop it on the scale…';
  $('countBig').textContent = '';
  const needle = $('needle');
  needle.style.transform = 'translateX(-50%) rotate(-70deg)';
  $('stampRoll').classList.remove('hintGlow');
  $('stampRoll').classList.add('waiting');

  showScene('stamp');

  setTimeout(()=>{
    // needle swings to a spot based on how heavy it is
    const deg = -70 + (p.stampsNeeded / 4) * 140;
    needle.style.transform = 'translateX(-50%) rotate(' + deg + 'deg)';
    S.whoosh();
  }, 220);

  setTimeout(()=>{
    S.ding();
    $('stampPrompt').innerHTML = 'This one needs <b>' + p.stampsNeeded + '</b> stamp' + (p.stampsNeeded>1?'s':'') + '!';
    $('countBig').textContent = '0 of ' + p.stampsNeeded;
    $('stampRoll').classList.remove('waiting');
    G.busy = false;
  }, 1100);
}

$('stampRoll').addEventListener('click', () => {
  const p = G.parcel;
  if(!p || G.busy) return;
  if(G.stamped >= p.stampsNeeded) return;

  const slots = $('slotRow').children;
  const slot = slots[G.stamped];
  if(!slot) return;
  slot.classList.add('filled');
  slot.textContent = '🌈';
  S.stamp(G.stamped);
  G.stamped++;
  $('countBig').textContent = G.stamped + ' of ' + p.stampsNeeded;
  $('stampRoll').classList.remove('hintGlow');

  if(G.stamped >= p.stampsNeeded){
    G.busy = true;
    S.ding();
    $('stampRoll').classList.add('waiting');
    $('countBig').textContent = '✅ ' + p.stampsNeeded + ' stamps!';
    $('stampPrompt').textContent = 'All stamped and ready to go!';
    confetti(18, window.innerWidth/2, window.innerHeight*0.4);
    setTimeout(goDeliver, 1000);
  }else{
    $('stampRoll').classList.add('hintGlow');
  }
});

/* ================= station 3: delivery ================= */
let houseEls = [];

function buildStreet(){
  const p = G.parcel;
  const street = $('street');
  street.classList.remove('busy');
  street.innerHTML = '';
  houseEls = [];
  p.houses.forEach((h, i) => {
    const el = document.createElement('button');
    el.className = 'house';
    el.dataset.i = String(i);
    el.setAttribute('aria-label', h.name + ' house');
    el.innerHTML =
      '<div class="roof"></div>' +
      '<div class="body" style="background:linear-gradient(180deg,' + h.color + ',' + shade(h.color) + ')">' +
        '<div class="door">' + h.sym + '</div>' +
        '<div class="pal">' + h.pal + '</div>' +
        '<div class="mailbox">📪</div>' +
      '</div>' +
      '<div class="house-name">' + h.name + '</div>';
    street.appendChild(el);
    houseEls.push(el);
  });
}
function shade(hex){
  try{
    const n = parseInt(hex.slice(1), 16);
    const r = Math.max(0, ((n >> 16) & 255) - 46);
    const g = Math.max(0, ((n >> 8) & 255) - 46);
    const b = Math.max(0, (n & 255) - 46);
    return 'rgb(' + r + ',' + g + ',' + b + ')';
  }catch(e){ return hex; }
}

function goDeliver(){
  const p = G.parcel;
  const h = p.houses[p.target];
  buildStreet();
  $('deliverPrompt').innerHTML =
    'Deliver to the <span class="label-chip" style="background:' + h.color + '">' + h.sym + ' ' + h.name + '</span> house!';
  const van = $('van');
  van.style.transition = 'none';
  van.style.transform = 'translateX(6px)';
  void van.offsetWidth;
  van.style.transition = '';
  van.classList.add('jiggle');
  $('flyParcel').style.opacity = '0';
  G.busy = false;
  showScene('deliver');
  S.engine();
}

$('street').addEventListener('click', e => {
  const el = e.target.closest('.house');
  if(!el || G.busy || !G.parcel) return;
  const i = Number(el.dataset.i);
  G.busy = true;
  $('street').classList.add('busy');
  driveTo(el, () => {
    if(i === G.parcel.target) deliverSuccess(el);
    else wrongHouse(el);
  });
});

function driveTo(houseEl, done){
  const van = $('van');
  const road = van.parentElement;
  const rr = road.getBoundingClientRect();
  const hr = houseEl.getBoundingClientRect();
  let x = (hr.left - rr.left) + hr.width/2 - van.offsetWidth/2;
  x = Math.max(2, Math.min(x, rr.width - van.offsetWidth - 2));
  van.style.transform = 'translateX(' + x + 'px)';
  S.engine();
  setTimeout(done, 900);
}

function wrongHouse(el){
  S.oops();
  el.classList.remove('nope'); void el.offsetWidth; el.classList.add('nope');
  el.classList.add('show-pal');
  const h = G.parcel.houses[Number(el.dataset.i)];
  toast(h.pal + ' says: “Not mine! Try next door 😊”');
  G.wrongHouse++;
  setTimeout(()=>{
    el.classList.remove('show-pal');
    if(G.wrongHouse >= 2){
      const right = houseEls[G.parcel.target];
      if(right) right.querySelector('.door').classList.add('hintGlow');
    }
    $('street').classList.remove('busy');
    G.busy = false;
  }, 1200);
}

function deliverSuccess(el){
  const van = $('van');
  van.classList.remove('jiggle');
  const fly = $('flyParcel');
  const road = van.parentElement;
  const rr = road.getBoundingClientRect();
  const vr = van.getBoundingClientRect();
  const box = el.querySelector('.mailbox').getBoundingClientRect();

  fly.style.transition = 'none';
  fly.style.transform = 'translate(' + (vr.left - rr.left + 6) + 'px,' + (vr.top - rr.top + 4) + 'px)';
  fly.style.opacity = '1';
  void fly.offsetWidth;
  fly.style.transition = 'transform .7s cubic-bezier(.3,-0.4,.4,1), opacity .25s ease .55s';
  fly.style.transform = 'translate(' + (box.left - rr.left) + 'px,' + (box.top - rr.top) + 'px) scale(.5)';
  fly.style.opacity = '0';
  S.whoosh();

  setTimeout(()=>{
    el.classList.add('delivered','open');
    S.doorbell();
  }, 640);

  setTimeout(()=>{
    el.classList.add('show-pal');
    S.happy();
    const h = G.parcel.houses[G.parcel.target];
    toast(h.pal + ' says: “' + pick(CHEERS) + '”');
    const r = el.getBoundingClientRect();
    confetti(40, r.left + r.width/2, r.top + r.height*0.3);
    for(let k=0;k<4;k++) heart(r.left + r.width/2 + (Math.random()-.5)*40, r.top + 10 + Math.random()*20, k*130);
    stats.delivered++;
    saveStats();
  }, 1000);

  setTimeout(()=>{
    G.index++;
    paintDots();
    if(G.index >= TOTAL) finale();
    else startParcel();
  }, 2500);
}

function heart(x, y, delay){
  setTimeout(()=>{
    const h = document.createElement('div');
    h.className = 'heart';
    h.textContent = pick(['💖','⭐','✨','🎉']);
    h.style.left = x + 'px';
    h.style.top = y + 'px';
    document.body.appendChild(h);
    setTimeout(()=> h.remove(), 1200);
  }, delay);
}

/* ================= finale ================= */
function finale(){
  stats.rounds++;
  saveStats();
  $('finaleText').innerHTML = 'You delivered all <b>' + TOTAL + '</b> parcels!<br>The whole town says thank you! 💌';
  showScene('finale');
  S.fanfare();
  confetti(90, window.innerWidth/2, window.innerHeight*0.3);
  setTimeout(()=> confetti(60, window.innerWidth*0.25, window.innerHeight*0.35), 500);
  setTimeout(()=> confetti(60, window.innerWidth*0.75, window.innerHeight*0.35), 950);
}

/* ================= round control ================= */
function startRound(){
  G.index = 0;
  G.running = true;
  titleScreen.classList.add('hidden');
  topbar.classList.remove('hidden');
  stage.classList.remove('hidden');
  paintDots();
  startParcel();
}
function goHome(){
  G.running = false;
  G.busy = true;
  showScene('none');
  titleScreen.classList.remove('hidden');
  refreshTitle();
}
function refreshTitle(){
  $('allTime').textContent = 'Parcels delivered: ' + stats.delivered;
  const n = Math.min(stats.rounds, 10);
  $('trophyRow').textContent = n > 0 ? '🏆'.repeat(n) + (stats.rounds > 10 ? ' +' + (stats.rounds-10) : '') : 'Deliver 8 parcels to win a trophy!';
}

/* ================= wiring ================= */
$('startBtn').addEventListener('click', () => { ac(); startRound(); });
$('againBtn').addEventListener('click', () => { startRound(); });
$('finHomeBtn').addEventListener('click', goHome);
$('homeBtn').addEventListener('click', goHome);
$('resetBtn').addEventListener('click', () => {
  if(!G.running) return;
  toast('Fresh sack of parcels! 📬');
  S.ding();
  startRound();
});
$('clearBtn').addEventListener('click', () => {
  stats = { delivered:0, rounds:0 };
  saveStats();
  refreshTitle();
  S.oops();
});

document.addEventListener('pointerdown', () => ac(), { once:true });
window.addEventListener('resize', () => {
  if(G.running && scenes.deliver.classList.contains('active') && G.parcel){
    const van = $('van');
    van.style.transition = 'none';
    van.style.transform = 'translateX(6px)';
  }
});

buildDots();
loadStats();
refreshTitle();
showScene('none');

})();
