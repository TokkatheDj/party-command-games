<!-- CONCEPT: HIDE & SEEK / SEARCH - Where's Pip? Pip the kitten hides in look-alike baskets, boxes, hats and flowerpots around four rooms, and the only way to know which one is the position-word clue (in the basket UNDER the table, not ON it); lift a hiding place to peek, find Pip four times per room, then flip roles in Bo's Turn where you hide Pip and Bo the puppy asks yes/no position questions to find her. No timer, no losing. Ages 4-11. -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Where's Pip? Hide &amp; Seek</title>
<style>
:root {
  --bg1: #ffd86b; --bg2: #ff9fb8;
  --ink: #3b2a55; --soft: #fff8ec; --card: #ffffff;
  --a: #ff6fa5; --b: #7a5cff; --c: #23c4a8; --d: #ff9f1c;
  --pill-v: #23c4a8; --pill-r: #ff6fa5;
  --land-glow: #ffe14d;
  --radius: 22px; --gap: 12px;
  --font: "Comic Sans MS", "Trebuchet MS", system-ui, sans-serif;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0; padding: 0; height: 100%;
  touch-action: manipulation;
  user-select: none; -webkit-user-select: none;
  overflow: hidden;
  font-family: var(--font); color: var(--ink);
  background: linear-gradient(160deg, var(--bg1), var(--bg2));
}
button { font-family: inherit; color: inherit; cursor: pointer; border: none; }
.screen { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; }
.screen.on { display: flex; }

/* ---------- home ---------- */
#home { justify-content: center; gap: clamp(10px, 2.5vh, 22px); padding: 16px; text-align: center; }
h1 {
  margin: 0; font-size: clamp(38px, 11vw, 64px); line-height: 1.05;
  background: linear-gradient(90deg, var(--b), var(--a), var(--d));
  -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 3px 0 rgba(255,255,255,.7));
}
.sub { margin: 0; font-size: clamp(16px, 4.4vw, 22px); font-weight: bold; opacity: .85; }
.peek-art { position: relative; width: 150px; height: 130px; }
.peek-art .box { position: absolute; left: 20px; bottom: 0; font-size: 104px; line-height: 1; z-index: 2; }
.peek-art .cat { position: absolute; left: 42px; bottom: 58px; font-size: 64px; line-height: 1; z-index: 1; animation: peekbob 2.4s ease-in-out infinite; }
@keyframes peekbob { 0%,100% { transform: translateY(24px); } 40%,70% { transform: translateY(0); } }
.big-btns { display: flex; flex-direction: column; gap: 14px; width: min(340px, 90vw); }
.big {
  min-height: 72px; border-radius: var(--radius); font-size: clamp(22px, 6vw, 28px); font-weight: bold;
  background: var(--card); box-shadow: 0 6px 0 rgba(59,42,85,.25); display: flex; align-items: center; justify-content: center; gap: 12px;
  transition: transform .1s;
}
.big:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(59,42,85,.25); }
.big .em { font-size: 1.4em; }
.big.find { background: linear-gradient(90deg, #fff, #ffe7f1); }
.big.bo { background: linear-gradient(90deg, #fff, #e6fff8); }
.stars-line { font-size: clamp(16px, 4.5vw, 20px); font-weight: bold; }

/* ---------- room picker ---------- */
#picker { padding: 14px; gap: 14px; justify-content: center; }
#picker h2 { margin: 0; font-size: clamp(26px, 7.5vw, 36px); }
.rooms { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; width: min(400px, 92vw); }
.room-card {
  position: relative; min-height: 128px; border-radius: var(--radius); background: var(--card);
  box-shadow: 0 6px 0 rgba(59,42,85,.22); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  font-size: clamp(17px, 4.6vw, 21px); font-weight: bold; padding: 8px;
}
.room-card .em { font-size: 52px; line-height: 1.1; }
.room-card .tick { position: absolute; top: 6px; right: 8px; font-size: 26px; }
.room-card .words { font-size: 13px; opacity: .7; font-weight: normal; }
.room-card:active { transform: translateY(4px); }
.back-btn { min-height: 56px; min-width: 150px; border-radius: 999px; background: rgba(255,255,255,.75); font-size: 20px; font-weight: bold; padding: 0 22px; }

/* ---------- game ---------- */
#game { padding: 6px 8px 8px; gap: 6px; }
.hdr { width: 100%; max-width: 560px; display: flex; align-items: center; gap: 8px; height: 50px; flex: 0 0 auto; }
.hbtn { width: 48px; height: 48px; border-radius: 16px; background: rgba(255,255,255,.8); font-size: 24px; flex: 0 0 auto; }
.htitle { flex: 1; text-align: center; font-weight: bold; font-size: clamp(18px, 5vw, 24px);
  background: linear-gradient(90deg, var(--b), var(--a)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.starbox { min-width: 64px; height: 44px; border-radius: 14px; background: rgba(255,255,255,.8); display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 20px; padding: 0 8px; }

.clue {
  width: 100%; max-width: 560px; min-height: 92px; flex: 0 0 auto; background: var(--soft); border-radius: var(--radius);
  box-shadow: 0 4px 0 rgba(59,42,85,.18); display: flex; align-items: center; gap: 8px; padding: 6px 8px;
}
.clue .who { font-size: 46px; line-height: 1; flex: 0 0 auto; }
.clue .who.talk { animation: talk .5s ease-in-out 3; }
@keyframes talk { 50% { transform: rotate(-8deg) scale(1.08); } }
.clue .txt { flex: 1; font-size: clamp(17px, 4.6vw, 23px); font-weight: bold; line-height: 1.5; display: flex; flex-wrap: wrap; align-items: center; gap: 2px 5px; }
.clue .txt > span { display: inline-flex; align-items: center; }
.replay { width: 52px; height: 52px; border-radius: 50%; background: var(--card); font-size: 24px; box-shadow: 0 3px 0 rgba(59,42,85,.2); flex: 0 0 auto; }
.pw { border-radius: 12px; padding: 0 8px 0 4px; color: #fff; gap: 3px; text-transform: uppercase; }
.pw svg { width: 34px; height: 28px; background: rgba(255,255,255,.92); border-radius: 8px; }
.pw.v { background: var(--pill-v); }
.pw.r { background: var(--pill-r); }
.pw.small { background: #b9b0cc; font-size: .8em; }
.pw.pulse { animation: pulse .5s ease-in-out 4; }
@keyframes pulse { 50% { transform: scale(1.18); } }
.chip { background: #fff; border-radius: 12px; padding: 0 6px; border: 2px solid #e7dcf5; gap: 3px; }
.chip .ce { font-size: 1.3em; line-height: 1.2; }
.mini-pot { width: 22px; height: 20px; background: #e07a3f; clip-path: polygon(22% 0, 78% 0, 100% 100%, 0 100%); display: inline-block; }
.mini-curtain { width: 20px; height: 24px; background: repeating-linear-gradient(90deg, #ff8fb8 0 5px, #ff6fa5 5px 10px); border-radius: 3px; display: inline-block; }

.stage-wrap { flex: 1 1 auto; width: 100%; min-height: 0; display: flex; align-items: center; justify-content: center; }
.stage-box { position: relative; }
#stage { position: absolute; left: 0; top: 0; width: 360px; height: 440px; transform-origin: 0 0; border-radius: 26px; overflow: hidden; box-shadow: 0 6px 0 rgba(59,42,85,.22); }
.dec { position: absolute; pointer-events: none; }
.dec.emo { line-height: 1; text-align: center; }
.dec.glow { animation: glow .7s ease-in-out infinite alternate; }
@keyframes glow { from { filter: drop-shadow(0 0 0 var(--land-glow)); } to { filter: drop-shadow(0 0 12px var(--land-glow)) drop-shadow(0 0 4px #fff) brightness(1.15); } }
.cover { position: absolute; display: flex; align-items: flex-end; justify-content: center; line-height: 1; cursor: pointer;
  transition: transform .38s cubic-bezier(.3,1.5,.5,1); background: none; padding: 0; }
.cover .ce { pointer-events: none; display: block; }
.cover.lift { transform: translateY(-78%) rotate(-12deg); }
.cover.slideR { transform: translateX(80%) rotate(8deg); }
.cover.slideL { transform: translateX(-80%) rotate(-8deg); }
.cover.curtain-open { transform: scaleX(.32); transform-origin: 0 50%; }
.cover.wiggle { animation: wiggle .45s ease-in-out infinite; }
@keyframes wiggle { 25% { rotate: -9deg; } 75% { rotate: 9deg; } }
.cover.hop { animation: hop .45s ease-out; }
@keyframes hop { 40% { translate: 0 -24px; } }
.pot-shape { width: 100%; height: 100%; background: linear-gradient(90deg, #c9602b, #ee8a4c 45%, #c9602b);
  clip-path: polygon(20% 0, 80% 0, 100% 100%, 0 100%); border-top: 6px solid #a84c1f; }
.curtain-shape { width: 100%; height: 100%; border-radius: 0 0 18px 18px;
  background: repeating-linear-gradient(90deg, #ff8fb8 0 14px, #ff6fa5 14px 28px); box-shadow: inset 0 -8px 0 rgba(0,0,0,.08); }
.content { position: absolute; line-height: 1; text-align: center; visibility: hidden; pointer-events: none; transform: scale(.3); transition: transform .3s cubic-bezier(.3,1.6,.5,1); }
.content.show { visibility: visible; transform: scale(1); }
.content.pip.show { animation: pipjoy .6s ease-in-out .3s 3; }
@keyframes pipjoy { 50% { translate: 0 -14px; } }
.actor { position: absolute; line-height: 1; z-index: 40; pointer-events: none; transition: left .8s ease-in-out, top .8s ease-in-out, opacity .3s; }
.eyes {
  position: absolute; inset: 0; z-index: 50; background: rgba(59,42,85,.82); display: flex; flex-direction: column; align-items: center; justify-content: center;
  color: #fff; font-size: 34px; font-weight: bold; text-align: center; gap: 6px; opacity: 0; pointer-events: none; transition: opacity .3s;
}
.eyes.on { opacity: 1; pointer-events: auto; }
.eyes .monkey { font-size: 96px; line-height: 1; }
.eyes .count { font-size: 64px; }

.foot { width: 100%; max-width: 560px; flex: 0 0 auto; min-height: 64px; display: flex; align-items: center; justify-content: center; gap: 12px; }
.paws { display: flex; gap: 10px; }
.paw { width: 48px; height: 48px; border-radius: 50%; background: rgba(255,255,255,.55); display: flex; align-items: center; justify-content: center; font-size: 26px; transition: transform .3s; }
.paw.got { background: #fff; transform: scale(1.12); }
.yn { min-width: 132px; min-height: 60px; border-radius: 20px; font-size: 24px; font-weight: bold; color: #fff; box-shadow: 0 5px 0 rgba(0,0,0,.18); }
.yn.yes { background: #23b86c; } .yn.no { background: #ff6f6f; }
.yn:active { transform: translateY(3px); }
.foot .msg { font-weight: bold; font-size: clamp(16px, 4.4vw, 20px); background: rgba(255,255,255,.7); padding: 8px 14px; border-radius: 16px; text-align: center; }
.pill-btn { min-height: 56px; border-radius: 18px; background: #fff; font-size: 19px; font-weight: bold; padding: 0 16px; box-shadow: 0 4px 0 rgba(59,42,85,.2); }

/* ---------- overlay ---------- */
#overlay { position: fixed; inset: 0; z-index: 100; background: rgba(59,42,85,.55); display: none; align-items: center; justify-content: center; padding: 16px; }
#overlay.on { display: flex; }
.panel { background: var(--soft); border-radius: 28px; padding: 22px 18px; width: min(360px, 92vw); text-align: center; display: flex; flex-direction: column; gap: 14px; align-items: center; animation: popin .4s cubic-bezier(.3,1.6,.5,1); }
@keyframes popin { from { transform: scale(.5); opacity: 0; } }
.panel h3 { margin: 0; font-size: clamp(26px, 7.5vw, 34px); }
.sticker { width: 130px; height: 130px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff6b0, #ffc93c 60%, #f0a500); display: flex; align-items: center; justify-content: center; font-size: 70px; box-shadow: 0 6px 0 rgba(0,0,0,.15); animation: spin 1.2s ease-out; }
@keyframes spin { from { transform: rotate(-200deg) scale(.3); } }
.panel .row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }

.fx { position: fixed; inset: 0; pointer-events: none; z-index: 120; overflow: hidden; }
.conf { position: absolute; font-size: 22px; animation: fly 1.3s ease-out forwards; }
@keyframes fly { to { transform: translate(var(--dx), var(--dy)) rotate(var(--rot)); opacity: 0; } }
</style>
</head>
<body>

<section id="home" class="screen on">
  <div class="peek-art" aria-hidden="true"><span class="cat">🐱</span><span class="box">📦</span></div>
  <h1>Where's Pip?</h1>
  <p class="sub">Pip the kitten loves to hide!</p>
  <div class="big-btns">
    <button class="big find" id="btnFind"><span class="em">🔍</span> Find Pip</button>
    <button class="big bo" id="btnBo"><span class="em">🐶</span> Bo's Turn</button>
  </div>
  <div class="stars-line" id="homeStars"></div>
</section>

<section id="picker" class="screen">
  <h2 id="pickTitle">Pick a room</h2>
  <div class="rooms" id="rooms"></div>
  <button class="back-btn" id="pickBack">⬅ Back</button>
</section>

<section id="game" class="screen">
  <div class="hdr">
    <button class="hbtn" id="gHome" aria-label="Rooms">🏠</button>
    <div class="htitle" id="gTitle">Where's Pip?</div>
    <button class="hbtn" id="gSound" aria-label="Sound">🔊</button>
    <div class="starbox" id="gStars">⭐ 0</div>
  </div>
  <div class="clue" id="clue">
    <div class="who" id="who">🐱</div>
    <div class="txt" id="clueTxt"></div>
    <button class="replay" id="replay" aria-label="Say it again">🗣️</button>
  </div>
  <div class="stage-wrap" id="stageWrap"><div class="stage-box" id="stageBox"><div id="stage"></div></div></div>
  <div class="foot" id="foot"></div>
</section>

<div id="overlay"><div class="panel" id="panel"></div></div>
<div class="fx" id="fx"></div>

<script>
'use strict';
const $ = id => document.getElementById(id);
const rnd = n => Math.floor(Math.random() * n);
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const wait = ms => new Promise(r => setTimeout(r, ms));

/* ---------- hiding-place kinds ---------- */
const KINDS = {
  box:     { name: 'box',       emoji: '📦' },
  basket:  { name: 'basket',    emoji: '🧺' },
  hat:     { name: 'hat',       emoji: '🎩' },
  bed:     { name: 'bed',       emoji: '🛏️' },
  plant:   { name: 'plant',     emoji: '🪴' },
  pot:     { name: 'flowerpot', css: 'pot' },
  curtain: { name: 'curtain',   css: 'curtain' }

const ROOMS = [

    lands: {},
    deco: [

      { id: 'bed',     kind: 'bed',     verb: 'under',  x: 150, y: 196, s: 150, reveal: 'lift', cx: 225, cy: 318, cs: 44 },
      { id: 'plant',   kind: 'plant',   verb: 'behind', x: 286, y: 176, s: 70, reveal: 'slideL', cx: 321, cy: 216, cs: 44 },
      { id: 'box',     kind: 'box',     verb: 'in',     x: 22, y: 334, s: 66, reveal: 'lift' },
      { id: 'hat',     kind: 'hat',     verb: 'under',  x: 150, y: 352, s: 58, reveal: 'lift' },

    ]
  },
  {

    lands: { table: 'table' },
    deco: [
      WALL('#fff1b8', '#ffe08a'), FLOOR('#9ad0c2', '#7cbcae'),
      { t: 'rect', x: 0, y: 320, w: 360, h: 120, bg: 'repeating-linear-gradient(90deg, rgba(255,255,255,.18) 0 30px, transparent 30px 60px)' },

      { id: 'basketUnder', kind: 'basket', verb: 'in', word: 'under',   land: 'table', x: 110, y: 278, s: 62, reveal: 'lift' },
      { id: 'boxUnder',    kind: 'box',    verb: 'in', word: 'under',   land: 'table', x: 186, y: 278, s: 62, reveal: 'lift' },
      { id: 'basketNext',  kind: 'basket', verb: 'in', word: 'next to', land: 'table', x: 12,  y: 278, s: 62, reveal: 'lift' },

  {

  },
  {
    id: 'garden', name: 'Garden', emoji: '🌳', level: 2, words: 'between · on · under',
    lands: { tree: 'tree', house: 'doghouse', bench: 'bench' },

      { t: 'emo', e: '🌼', x: 30, y: 392, s: 30 }, { t: 'emo', e: '🌷', x: 320, y: 396, s: 30 }, { t: 'emo', e: '🌼', x: 236, y: 404, s: 26 },
      { t: 'emo', e: '🌳', x: -8, y: 176, s: 150, land: 'tree' },

  if (G.phase !== 'bo-ask') return;
  G.answers.push({ attr: G.q, yes }); G.phase = 'bo-think';
  SFX.pop();
  setFoot(`<div class="msg">${yes ? '👍 Yes!' : '👎 No!'} Bo is thinking… 🤔</div>`);
  setTimeout(() => G.phase === 'bo-think' && boAsk(), 700);
}
async function boCheck(cv) {
  const gen = G.gen;
  G.phase = 'bo-look';
  const c = coverEls[cv.id];
  setFoot('<div class="msg">🐶 Sniff sniff…</div>');
  setWho('🐶'); setClue(`<span>I think Pip is ${cv.verb} the</span>${kindChip(cv.kind)}<span>${cv.word ? cv.word + ' ' + landSay(room, cv.land) : ''}!</span>`);
  say(`I think Pip is ${cv.verb} the ${KINDS[cv.kind].name}!`, 'bo');
  const { w } = coverSize(cv);
  boEl.style.left = Math.max(-10, Math.min(300, cv.x + w / 2 - 70)) + 'px';
  boEl.style.top = Math.min(370, cv.y + 10) + 'px';
  await wait(1100);
  if (gen !== G.gen) return;
  G.tried.add(cv.id);
  if (cv.id === G.hidden) {
    G.phase = 'bo-found'; G.boFound++;
    openCover(cv.id, '🐱'); SFX.found(); confettiAt(c.el);
    setClue('<span>Found you, Pip! Thanks for playing with me!</span>'); say('Found you, Pip! Woof woof!', 'bo');
    addStar();
    await wait(900);
    if (gen !== G.gen) return;
    setFoot('<button class="pill-btn" id="boAgain">🙈 Hide again</button><button class="pill-btn" id="boRooms">🏠 Rooms</button>');
    $('boAgain').onclick = () => boHidePhase();
    $('boRooms').onclick = () => { G.gen++; openPicker('bo'); };
    return;
  }
  const silly = SILLY[rnd(SILLY.length)];
  openCover(cv.id, silly); SFX.boing();
  setClue(`<span>Silly me! Just a ${silly}. Let me think again…</span>`); say('Silly me! Let me think again.', 'bo');
  await wait(1300);
  if (gen !== G.gen) return;
  closeCover(cv.id);
  boAsk();
}

function onCover(cv) {
  audio();
  if (G.mode === 'find') findTap(cv);
  else if (G.phase === 'bo-hide') boHide(cv);
}

/* ---------- wiring ---------- */
$('btnFind').onclick = () => { audio(); openPicker('find'); };
$('btnBo').onclick = () => { audio(); openPicker('bo'); };
$('pickBack').onclick = () => show('home');
$('gHome').onclick = () => { G.gen++; G.phase = 'idle'; if ('speechSynthesis' in window) speechSynthesis.cancel(); closeOverlay(); openPicker(G.mode); };
$('replay').onclick = () => {
  if (G.mode === 'find' && G.phase === 'seek') giveClue();
  else if (G.mode === 'bo' && G.phase === 'bo-ask') say(questionFor(G.q).speech, 'bo');
};
function syncSound() { $('gSound').textContent = save.muted ? '🔇' : '🔊'; }
$('gSound').onclick = () => { save.muted = !save.muted; persist(); syncSound(); if (save.muted && 'speechSynthesis' in window) speechSynthesis.cancel(); };
syncSound(); renderHome();

window.__pip = { G, ROOMS, coverEls: () => coverEls, attrsOf, boCandidates };
</script>
