<!-- CONCEPT: CREATIVE / SANDBOX - Carl's Sandcastle Beach: tap a bucket mold (tower, block, wall, dome, cone) and it thumps down onto the sand and stacks on whatever is already there, then decorate with shells, starfish, flags, windows, doors, seaweed and pebbles; Carl the crab gives 8 picture orders (two towers, three high with a flag...) that tick off as you build, a Big Wave button gleefully washes the beach clean (saving a photo first), and a saved Album keeps every castle. No timer, no losing. Ages 4-11. -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Carl's Sandcastle Beach</title>
<style>
:root{
  --sky1:#7fd3ff; --sky2:#d9f4ff; --sand:#e9c27a; --sand-d:#c99a52;
  --ink:#4a2f12; --panel:#fff8e8; --accent:#ff7a3d; --accent2:#ffcf3d;
  --sea:#2ea3d6; --good:#3cbf6a; --btn:#ffffff; --btn-on:#ffe08a;
  --radius:16px; --font:"Comic Sans MS","Trebuchet MS",system-ui,sans-serif;
}
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none;font-family:var(--font);color:var(--ink);background:var(--sky1)}
#app{display:flex;flex-direction:column;height:100%;height:100dvh}
header{flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:6px 8px;background:linear-gradient(180deg,#fff5d6,#ffe7a8);box-shadow:0 2px 6px rgba(0,0,0,.15);z-index:2}
h1{margin:0;flex:1;min-width:0;font-size:clamp(16px,4.6vw,26px);line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:420px){ h1 .ico{display:none} h1{font-size:clamp(14px,4.6vw,22px)} }
h1 .grad{background:linear-gradient(90deg,#ff6a3d,#e8a400,#2ea3d6);-webkit-background-clip:text;background-clip:text;color:transparent}
.hbtn{min-width:44px;height:44px;border:none;border-radius:12px;background:var(--btn);font-size:22px;cursor:pointer;box-shadow:0 2px 0 rgba(0,0,0,.18);font-family:var(--font);color:var(--ink)}
.hbtn:active{transform:translateY(2px);box-shadow:none}
#stars{font-weight:bold;font-size:clamp(14px,3.8vw,18px);padding:0 4px;white-space:nowrap}
#stage{flex:1 1 auto;position:relative;min-height:0;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:pointer}
#order{position:absolute;left:6px;right:6px;top:6px;background:var(--panel);border-radius:var(--radius);padding:6px 8px;box-shadow:0 3px 8px rgba(0,0,0,.18);display:flex;flex-direction:column;gap:4px;pointer-events:none;height:76px}
#order[hidden]{display:none}
#say{font-size:clamp(12px,3.4vw,16px);line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#chips{display:flex;gap:6px;flex-wrap:nowrap;overflow:hidden}
.chip{display:flex;align-items:center;gap:3px;background:#fff;border:2px solid #f0d9a6;border-radius:12px;padding:1px 6px 1px 2px;font-weight:bold;font-size:clamp(12px,3.4vw,16px)}
.chip canvas{width:34px;height:34px}
.chip.ok{border-color:var(--good);background:#e4ffe9}
.chip.ok .n::after{content:" ✓";color:var(--good)}
#tools{flex:0 0 auto;display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:5px 5px calc(5px + env(safe-area-inset-bottom));background:linear-gradient(180deg,#ffe7a8,#f5c96c)}
.tool{height:clamp(48px,13vw,66px);border:3px solid transparent;border-radius:14px;background:var(--btn);cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 0 rgba(0,0,0,.18);font-size:24px;font-family:var(--font)}
.tool canvas{width:88%;height:88%;pointer-events:none}
.tool.on{background:var(--btn-on);border-color:var(--accent);transform:translateY(-2px)}
.tool:active{transform:translateY(2px);box-shadow:none}
.tool.pulse{animation:pulse 1s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,122,61,.8)}50%{box-shadow:0 0 0 7px rgba(255,122,61,0)}}
.overlay{position:absolute;inset:0;background:rgba(40,90,130,.55);display:flex;align-items:center;justify-content:center;z-index:10;padding:12px}
.overlay[hidden]{display:none}
.card{background:var(--panel);border-radius:22px;padding:16px;max-width:520px;width:100%;max-height:100%;overflow:auto;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.card h2{margin:4px 0 10px;font-size:clamp(22px,6vw,32px)}
.big{display:block;width:100%;min-height:62px;margin:8px 0;border:none;border-radius:18px;font-size:clamp(18px,5vw,24px);font-weight:bold;font-family:var(--font);cursor:pointer;color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.2)}
.big:active{transform:translateY(3px);box-shadow:none}
.b1{background:linear-gradient(180deg,#ff8a50,#f0622a)}
.b2{background:linear-gradient(180deg,#46c1f0,#1f93c9)}
.b3{background:linear-gradient(180deg,#5fd27f,#2fa856)}
.b4{background:#fff;color:var(--ink)}
.crabbig{font-size:64px;line-height:1;display:inline-block;animation:bob 1.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
#ordGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:8px 0}
.og{min-height:64px;border:3px solid #f0d9a6;border-radius:14px;background:#fff;font-size:24px;font-weight:bold;font-family:var(--font);cursor:pointer;color:var(--ink)}
.og.done{background:#fff1b8;border-color:#e8a400}
#albumGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}
#albumGrid img{width:100%;border-radius:10px;border:3px solid #fff;box-shadow:0 2px 5px rgba(0,0,0,.25);cursor:pointer}
#bigPhoto{width:100%;border-radius:14px;border:4px solid #fff}
#toast{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);background:#fff;padding:8px 14px;border-radius:16px;font-size:clamp(14px,4vw,18px);font-weight:bold;box-shadow:0 3px 10px rgba(0,0,0,.25);opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap;max-width:94%;overflow:hidden;text-overflow:ellipsis;z-index:5}
#toast.show{opacity:1}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .35s;z-index:6}
</style>
</head>
<body>
<div id="app">
  <header>
    <button class="hbtn" id="menuBtn" aria-label="Menu">🏠</button>
    <h1><span class="ico">🏰 </span><span class="grad">Carl's Sandcastle Beach</span></h1>
    <span id="stars">⭐0</span>
    <button class="hbtn" id="camBtn" aria-label="Take a photo">📷</button>
  </header>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="order" hidden><div id="say"></div><div id="chips"></div></div>
    <div id="toast"></div>
    <div id="flash"></div>

    <div class="overlay" id="menu">
      <div class="card">
        <div class="crabbig">🦀</div>
        <h2>Carl's Sandcastle Beach</h2>
        <p style="margin:4px 0 8px;font-size:clamp(14px,4vw,18px)">Tap a bucket, tap the sand. THUMP! A castle!</p>
        <button class="big b1" id="goOrders">🦀 Carl's Orders</button>
        <button class="big b2" id="goFree">🏖️ Free Build</button>
        <button class="big b3" id="goAlbum">📷 My Album</button>
        <div id="ordGrid"></div>
      </div>
    </div>

    <div class="overlay" id="win" hidden>
      <div class="card">
        <div class="crabbig">🦀</div>
        <h2 id="winTitle">Hooray!</h2>
        <p id="winText" style="font-size:clamp(15px,4.2vw,19px);margin:4px 0"></p>
        <button class="big b1" id="nextBtn">Next order ▶</button>
        <button class="big b4" id="keepBtn">Keep building</button>
      </div>
    </div>

    <div class="overlay" id="album" hidden>
      <div class="card">
        <h2>📷 My Album</h2>
        <div id="albumEmpty" style="font-size:18px;margin:10px 0">No photos yet! Tap 📷, or send a Big Wave 🌊 - I snap a photo first.</div>
        <div id="albumGrid"></div>
        <button class="big b2" id="albumClose">Back to the beach</button>
      </div>
    </div>

    <div class="overlay" id="photo" hidden>
      <div class="card">
        <img id="bigPhoto" alt="castle photo">
        <button class="big b2" id="photoClose">Back</button>
      </div>
    </div>
  </div>
  <div id="tools"></div>
</div>

<script>
// ---------- data ----------
const MOLDS = {
  tower:{w:1.3,h:1.6,cap:1,  bucket:'#ff5a7a'},
  block:{w:1.4,h:1.15,cap:1, bucket:'#3fa9f5'},
  wall: {w:2.4,h:0.8,cap:1,  bucket:'#7ac943'},
  dome: {w:1.6,h:0.95,cap:.85,bucket:'#b06cf0'},
  cone: {w:1.0,h:1.5,cap:.88,bucket:'#ffb020'},
};
const MOLD_KEYS = Object.keys(MOLDS);
const DECOR_KEYS = ['shell','star','flag','window','door','weed','pebble'];
const NEEDS_CASTLE = {window:1, door:1};
const FLAG_COLORS = ['#ff4b4b','#3fa9f5','#ffcf3d','#b06cf0','#3cbf6a'];
const ORDERS = [
  {say:"One tall tower, please! And 2 shells!", req:[['tower',1],['shell',2]]},
  {say:"Two square blocks and a flag!", req:[['block',2],['flag',1]]},
  {say:"Stack it! 2 high, with a window.", req:[['high',2],['window',1]]},
  {say:"A dome house with a door and 2 windows!", req:[['dome',1],['door',1],['window',2]]},
  {say:"Two towers and two pointy cones!", req:[['tower',2],['cone',2]]},
  {say:"A long wall, 2 starfish and seaweed!", req:[['wall',1],['star',2],['weed',1]]},
  {say:"Super tall! 3 high with a flag!", req:[['high',3],['flag',1]]},
  {say:"The Grand Castle! 4 high, 2 flags, 3 shells!", req:[['high',4],['flag',2],['shell',3]]},
];
const LS = k => 'cowork-sandcastle-' + k;
const load = (k, d) => { try { const v = JSON.parse(localStorage.getItem(LS(k))); return v ?? d; } catch { return d; } };
const save = (k, v) => { try { localStorage.setItem(LS(k), JSON.stringify(v)); } catch {} };

// ---------- state ----------
const S = {
  blocks: [], decor: [], history: [],
  tool: 'tower', mode: 'free', order: 0,
  done: load('done', []), album: load('album', []),
  anims: [], parts: [], wave: null, crabHop: 0, flagN: 0, celebrated: false,
};
const saved = load('beach', null);
if (saved) { S.blocks = saved.blocks || []; S.decor = saved.decor || []; S.flagN = saved.flagN || 0; }
let nextId = 1 + Math.max(0, ...S.blocks.map(b => b.id), ...S.decor.map(d => d.id));
const saveBeach = () => save('beach', {blocks:S.blocks, decor:S.decor, flagN:S.flagN});

// ---------- dom ----------
const $ = id => document.getElementById(id);
const cv = $('cv'), g = cv.getContext('2d');
let W = 0, H = 0, DPR = 1, s = 40, groundY = 300, seaX = 300, buildMax = 6, skyTop = 90;

function layout(){
  const r = $('stage').getBoundingClientRect();
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = r.width; H = r.height;
  cv.width = Math.round(W*DPR); cv.height = Math.round(H*DPR);
  g.setTransform(DPR,0,0,DPR,0,0);
  groundY = H*0.82;
  skyTop = $('order').hidden ? 12 : 90;
  s = Math.max(22, Math.min(W/8, (groundY - skyTop)/6.6));
  seaX = W - Math.max(56, W*0.12);
  buildMax = (seaX - s*0.75)/s;
}
new ResizeObserver(layout).observe($('stage'));

// ---------- audio ----------
let AC = null, noiseBuf = null;
function audio(){
  if (!AC) {
    try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch { return null; }
    noiseBuf = AC.createBuffer(1, AC.sampleRate*2, AC.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i=0;i<d.length;i++) d[i] = Math.random()*2-1;
  }
  if (AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(f, t0, dur, type='sine', vol=.2, f2){
  const a = audio(); if (!a) return;
  const o = a.createOscillator(), gn = a.createGain(), t = a.currentTime + t0;
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t+dur);
  gn.gain.setValueAtTime(0.0001, t); gn.gain.exponentialRampToValueAtTime(vol, t+.01);
  gn.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  o.connect(gn).connect(a.destination); o.start(t); o.stop(t+dur+.05);
}
function noise(t0, dur, freq, q=1, vol=.3, freq2){
  const a = audio(); if (!a) return;
  const n = a.createBufferSource(), f = a.createBiquadFilter(), gn = a.createGain(), t = a.currentTime + t0;
  n.buffer = noiseBuf; f.type = 'bandpass'; f.Q.value = q; f.frequency.setValueAtTime(freq, t);
  if (freq2) f.frequency.exponentialRampToValueAtTime(freq2, t+dur);
  gn.gain.setValueAtTime(0.0001, t); gn.gain.exponentialRampToValueAtTime(vol, t+dur*.25);
  gn.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  n.connect(f).connect(gn).connect(a.destination); n.start(t); n.stop(t+dur+.05);
}
const sThump = () => { tone(140,0,.18,'sine',.5,50); noise(0,.18,300,.8,.5); };
const sPop = (f=880) => { tone(f,0,.12,'triangle',.22,f*1.6); };
const sBoing = () => tone(300,0,.3,'sine',.2,520);
const sWave = () => { noise(0,2.2,300,.7,.45,1400); noise(.4,1.6,900,.5,.25,200); };
const sClack = () => { tone(1600,0,.04,'square',.08); tone(1900,.08,.04,'square',.08); };
const sShutter = () => { noise(0,.06,3000,1,.3); noise(.09,.06,2500,1,.25); };
const sFanfare = () => [523,659,784,1047,784,1047].forEach((f,i)=>tone(f,i*.12,.22,'triangle',.22));

// ---------- helpers ----------
const toastEl = $('toast'); let toastT = 0;
function toast(msg){ toastEl.textContent = msg; toastEl.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(()=>toastEl.classList.remove('show'), 2000); }
const now = () => performance.now();
const overlapX = (a, ax, aw, bx, bw) => Math.min(ax+aw/2, bx+bw/2) - Math.max(ax-aw/2, bx-bw/2);

function landing(x, w){
  let y = 0;
  for (const b of S.blocks) {
    const m = MOLDS[b.type];
    if (overlapX(0, x, w, b.x, m.w) > 0.15) y = Math.max(y, b.y + m.h*m.cap);
  }
  // level = 1 + highest block whose top is the surface
  let sup = 0;
  for (const b of S.blocks) {
    const m = MOLDS[b.type];
    if (overlapX(0, x, w, b.x, m.w) > 0.15 && Math.abs(b.y + m.h*m.cap - y) < 1e-6) sup = Math.max(sup, b.lvl);
  }
  return {y, lvl: sup + 1};
}
function surfaceAt(x){
  let y = 0;
  for (const b of S.blocks) { const m = MOLDS[b.type]; if (Math.abs(x - b.x) < m.w/2) y = Math.max(y, b.y + m.h*m.cap); }
  return y;
}
function blockAt(wx, wy){
  for (let i = S.blocks.length-1; i >= 0; i--) {
    const b = S.blocks[i], m = MOLDS[b.type];
    if (Math.abs(wx - b.x) < m.w/2*0.92 && wy > b.y + 0.05 && wy < b.y + m.h*0.9) return b;
  }
  return null;
}
function counts(){
  const c = {high:0};
  for (const b of S.blocks) { c[b.type] = (c[b.type]||0) + 1; c.high = Math.max(c.high, b.lvl); }
  for (const d of S.decor) c[d.type] = (c[d.type]||0) + 1;
  return c;
}

// ---------- drawing: molds & decor ----------
function moldPath(c, type, cx, by, u){
  const m = MOLDS[type], w = m.w*u, h = m.h*u, top = by - h;
  c.beginPath();
  if (type === 'tower' || type === 'wall') {
    const tw = type === 'tower' ? w*.84 : w, mh = h*(type==='tower' ? .16 : .26), segs = type==='tower' ? 5 : 7, seg = tw/segs;
    c.moveTo(cx-w/2, by); c.lineTo(cx-tw/2, top+mh);
    let x = cx - tw/2; c.lineTo(x, top);
    for (let i=0;i<segs;i++){ const yy = i%2===0 ? top : top+mh; c.lineTo(x,yy); x += seg; c.lineTo(x,yy); }
    c.lineTo(cx+tw/2, top+mh); c.lineTo(cx+w/2, by);
  } else if (type === 'block') {
    c.rect(cx-w/2, top, w, h);
  } else if (type === 'dome') {
    c.moveTo(cx-w/2, by); c.ellipse(cx, by, w/2, h, 0, Math.PI, Math.PI*2);
  } else if (type === 'cone') {
    c.moveTo(cx-w/2, by); c.quadraticCurveTo(cx-w*.33, by-h*.55, cx, top);
    c.quadraticCurveTo(cx+w*.33, by-h*.55, cx+w/2, by);
  }
  c.closePath();
}
function drawMold(c, type, cx, by, u, opt={}){
  const m = MOLDS[type], w = m.w*u, h = m.h*u, sy = opt.sy ?? 1;
  c.save();
  if (sy !== 1) { c.translate(cx, by); c.scale(1 + (1-sy)*.7, Math.max(.02, sy)); c.translate(-cx, -by); }
  moldPath(c, type, cx, by, u);
  const gr = c.createLinearGradient(cx-w/2, 0, cx+w/2, 0);
  const wet = opt.wet || 0;
  gr.addColorStop(0, wet ? '#c99a58' : '#f7dc9f'); gr.addColorStop(.55, wet ? '#b88748' : '#e9c27a'); gr.addColorStop(1, wet ? '#9b6d36' : '#c99a52');
  c.fillStyle = gr; c.fill();
  c.lineWidth = Math.max(1, u*.035); c.strokeStyle = '#a77a3c'; c.stroke();
  c.clip();
  c.strokeStyle = 'rgba(140,95,40,.35)'; c.lineWidth = Math.max(1, u*.03);
  c.beginPath();
  if (type === 'tower' || type === 'cone') { for (const f of [.3,.6]) { c.moveTo(cx-w/2, by-h*f); c.lineTo(cx+w/2, by-h*f); } }
  if (type === 'block' || type === 'wall') {
    const rows = type==='block' ? 3 : 2, rh = (type==='wall'? h*.74 : h)/rows;
    for (let r=1;r<rows+ (type==='wall'?1:0);r++){ c.moveTo(cx-w/2, by-rh*r); c.lineTo(cx+w/2, by-rh*r); }
    for (let r=0;r<rows;r++){ const off = r%2 ? .5 : 0, bw = u*.55; for (let x = cx-w/2 + bw*off; x < cx+w/2; x += bw){ c.moveTo(x, by-rh*r); c.lineTo(x, by-rh*(r+1)); } }
  }
  if (type === 'dome') { c.moveTo(cx-w*.3, by-h*.25); c.quadraticCurveTo(cx, by-h*.45, cx+w*.3, by-h*.25); }
  c.stroke();
  // sparkle grains
  c.fillStyle = 'rgba(255,255,255,.35)';
  for (let i=0;i<6;i++){ const px = cx - w/2 + ((i*37+type.length*13)%100)/100*w, py = by - ((i*53+7)%100)/100*h; c.fillRect(px, py, u*.04, u*.04); }
  c.restore();
}
function drawBucket(c, type, cx, by, u){
  const m = MOLDS[type], w = m.w*u*1.12, h = m.h*u*1.08;
  c.save();
  c.fillStyle = m.bucket; c.strokeStyle = 'rgba(0,0,0,.25)'; c.lineWidth = 2;
  c.beginPath(); c.moveTo(cx-w/2, by); c.lineTo(cx-w*.42, by-h); c.lineTo(cx+w*.42, by-h); c.lineTo(cx+w/2, by); c.closePath(); c.fill(); c.stroke();
  c.fillStyle = 'rgba(255,255,255,.35)'; c.fillRect(cx-w*.36, by-h*.92, w*.12, h*.8);
  c.fillStyle = 'rgba(0,0,0,.15)'; c.fillRect(cx-w/2, by-h*.12, w, h*.12);
  c.restore();
}
function star5(c, x, y, r1, r2){ c.beginPath(); for (let i=0;i<10;i++){ const a = -Math.PI/2 + i*Math.PI/5, r = i%2 ? r2 : r1; c.lineTo(x+Math.cos(a)*r, y+Math.sin(a)*r); } c.closePath(); }
function drawDecor(c, d, px, py, u){
  c.save(); c.globalAlpha = 1;
  switch (d.type) {
    case 'shell': {
      c.translate(px, py); c.rotate(d.rot || 0);
      c.fillStyle = '#ffb3c1'; c.strokeStyle = '#d9667d'; c.lineWidth = Math.max(1, u*.03);
      c.beginPath(); c.moveTo(0, u*.16); c.arc(0, u*.04, u*.24, Math.PI*1.05, Math.PI*1.95); c.closePath(); c.fill(); c.stroke();
      c.beginPath(); for (let i=-2;i<=2;i++){ c.moveTo(0,u*.16); c.lineTo(Math.sin(i*.45)*u*.22, u*.04-Math.cos(i*.45)*u*.2); } c.stroke();
      c.fillStyle = '#d9667d'; c.fillRect(-u*.06, u*.13, u*.12, u*.06);
      break; }
    case 'star': {
      c.translate(px, py); c.rotate(d.rot || 0);
      c.fillStyle = '#ff8a3d'; c.strokeStyle = '#c95b16'; c.lineWidth = Math.max(1, u*.03);
      star5(c, 0, 0, u*.24, u*.1); c.fill(); c.stroke();
      c.fillStyle = '#ffd1a8'; for (let i=0;i<5;i++){ const a=-Math.PI/2+i*Math.PI*2/5; c.beginPath(); c.arc(Math.cos(a)*u*.12, Math.sin(a)*u*.12, u*.025, 0, 7); c.fill(); }
      break; }
    case 'flag': {
      const ph = u*1.0, t = now()/300 + d.id;
      c.strokeStyle = '#6b4a22'; c.lineWidth = Math.max(2, u*.06);
      c.beginPath(); c.moveTo(px, py); c.lineTo(px, py-ph); c.stroke();
      c.fillStyle = FLAG_COLORS[d.color % FLAG_COLORS.length];
      c.beginPath(); c.moveTo(px, py-ph);
      c.quadraticCurveTo(px+u*.25, py-ph+u*.05+Math.sin(t)*u*.06, px+u*.55, py-ph+u*.17);
      c.quadraticCurveTo(px+u*.25, py-ph+u*.3+Math.sin(t)*u*.06, px, py-ph+u*.36); c.closePath(); c.fill();
      c.fillStyle = '#ffd84a'; c.beginPath(); c.arc(px, py-ph, u*.06, 0, 7); c.fill();
      break; }
    case 'window': case 'door': {
      const w = d.type==='door' ? u*.48 : u*.3, h = d.type==='door' ? u*.62 : u*.4;
      const x = px - w/2, y = py - h/2;
      c.fillStyle = d.type==='door' ? '#7a4a1e' : '#4a3424';
      c.beginPath(); c.moveTo(x, y+h); c.lineTo(x, y+w/2); c.arc(px, y+w/2, w/2, Math.PI, 0); c.lineTo(x+w, y+h); c.closePath(); c.fill();
      c.strokeStyle = '#a77a3c'; c.lineWidth = Math.max(1, u*.04); c.stroke();
      if (d.type==='door'){ c.fillStyle = '#ffd84a'; c.beginPath(); c.arc(x+w*.75, y+h*.6, u*.035, 0, 7); c.fill(); }
      else { c.strokeStyle = 'rgba(255,220,120,.6)'; c.lineWidth = Math.max(1,u*.025); c.beginPath(); c.moveTo(px, y+u*.04); c.lineTo(px, y+h); c.stroke(); }
      break; }
    case 'weed': {
      c.strokeStyle = '#2fa856'; c.lineCap = 'round'; c.lineWidth = Math.max(2, u*.07);
      const t = now()/500 + d.id;
      for (let i=-1;i<=1;i++){ c.beginPath(); c.moveTo(px+i*u*.08, py+u*.15);
        c.quadraticCurveTo(px+i*u*.18+Math.sin(t+i)*u*.08, py-u*.1, px+i*u*.1+Math.sin(t+i+1)*u*.1, py-u*.38+Math.abs(i)*u*.1); c.stroke(); }
      break; }
    case 'pebble': {
      c.fillStyle = ['#9aa3ad','#7f8a96','#b9b0a3'][d.id % 3]; c.strokeStyle = 'rgba(0,0,0,.25)'; c.lineWidth = 1;
      c.beginPath(); c.ellipse(px, py, u*.2, u*.13, d.rot||0, 0, 7); c.fill(); c.stroke();
      c.fillStyle = 'rgba(255,255,255,.4)'; c.beginPath(); c.ellipse(px-u*.06, py-u*.04, u*.06, u*.03, 0, 0, 7); c.fill();
      break; }
  }
  c.restore();
}

// ---------- scene ----------
const clouds = [{x:.15,y:.12,s:1},{x:.6,y:.08,s:.8},{x:.9,y:.2,s:.65}];
const grains = Array.from({length:120}, () => ({x:Math.random(), y:Math.random(), r:Math.random()}));
let gull = null;

function drawScene(t){
  // sky
  const sk = g.createLinearGradient(0, 0, 0, groundY);
  sk.addColorStop(0, '#6ccaff'); sk.addColorStop(1, '#d9f4ff');
  g.fillStyle = sk; g.fillRect(0, 0, W, H);
  // sun
  const sx = W*.84, sy2 = skyTop + s*.9;
  g.save(); g.translate(sx, sy2); g.rotate(t/4000);
  g.fillStyle = 'rgba(255,214,70,.45)';
  for (let i=0;i<10;i++){ g.rotate(Math.PI/5); g.fillRect(-s*.06, s*.5, s*.12, s*.28); }
  g.restore();
  g.fillStyle = '#ffd646'; g.beginPath(); g.arc(sx, sy2, s*.45, 0, 7); g.fill();
  // clouds
  g.fillStyle = 'rgba(255,255,255,.92)';
  for (const c of clouds){
    const cx = ((c.x + t/90000*c.s) % 1.2 - .1) * W, cy = skyTop + c.y*(groundY - skyTop), r = s*.4*c.s + 10;
    g.beginPath(); g.arc(cx, cy, r, 0, 7); g.arc(cx+r*.9, cy+r*.2, r*.8, 0, 7); g.arc(cx-r*.9, cy+r*.25, r*.7, 0, 7); g.fill();
  }
  // gull
  if (!gull && Math.random() < .002) gull = {x:-30, y: skyTop + Math.random()*(groundY-skyTop)*.4, v: 40 + Math.random()*30};
  if (gull){
    gull.x += gull.v/60; const f = Math.sin(t/120)*6;
    g.strokeStyle = '#3a4a5a'; g.lineWidth = 2.5; g.lineCap = 'round';
    g.beginPath(); g.moveTo(gull.x-12, gull.y+f*.5); g.quadraticCurveTo(gull.x-6, gull.y-6+f, gull.x, gull.y); g.quadraticCurveTo(gull.x+6, gull.y-6+f, gull.x+12, gull.y+f*.5); g.stroke();
    if (gull.x > W + 30) gull = null;
  }
  // sea (right side) + horizon strip
  const horizon = groundY - s*.9;
  g.fillStyle = '#4fb6e3'; g.fillRect(0, horizon, W, groundY - horizon);
  g.fillStyle = 'rgba(255,255,255,.5)';
  for (let i=0;i<8;i++){ const x = ((i*.13 + t/20000) % 1)*W; g.fillRect(x, horizon + 6 + (i%3)*8, s*.4, 2); }
  // sand
  const sd = g.createLinearGradient(0, groundY - s*.3, 0, H);
  sd.addColorStop(0, '#f3d28e'); sd.addColorStop(1, '#d8a95e');
  g.fillStyle = sd;
  g.beginPath(); g.moveTo(0, groundY - s*.05); g.lineTo(seaX, groundY - s*.05);
  g.quadraticCurveTo(seaX + (W-seaX)*.5, groundY + s*.2, W, groundY + s*.9); g.lineTo(W, H); g.lineTo(0, H); g.closePath(); g.fill();
  // shoreline water lapping
  const lap = Math.sin(t/900)*.5 + .5;
  g.fillStyle = 'rgba(46,163,214,.85)';
  g.beginPath(); g.moveTo(W, groundY - s*.5); g.lineTo(seaX + (W-seaX)*(.55 - lap*.25), groundY - s*.5);
  g.quadraticCurveTo(seaX + (W-seaX)*(.4 - lap*.25), groundY + s*.35, W, groundY + s*1.2); g.closePath(); g.fill();
  g.fillStyle = 'rgba(255,255,255,.75)';
  g.beginPath(); g.ellipse(seaX + (W-seaX)*(.5 - lap*.25), groundY + s*.1, s*.35, s*.06, .6, 0, 7); g.fill();
  // grains
  g.fillStyle = 'rgba(160,110,50,.35)';
  for (const p of grains){ g.fillRect(p.x*W, groundY + p.y*(H-groundY), 2, 2); }
}

function drawCrab(t){
  const cx = seaX - s*.25, base = groundY + s*.12;
  const hop = S.crabHop > t ? Math.abs(Math.sin((S.crabHop - t)/90))*s*.5 : Math.abs(Math.sin(t/400))*s*.06;
  const fs = Math.round(s*.9);
  g.save(); g.globalAlpha = 1; g.fillStyle = '#000';
  g.font = `${fs}px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif`;
  g.textAlign = 'center'; g.textBaseline = 'bottom';
  g.fillText('🦀', cx, base - hop);
  g.restore();
}

// ---------- main loop ----------
function frame(){
  const t = now();
  if (!W) layout();
  drawScene(t);
  // wet shadow line under castles
  const waveX = S.wave ? S.wave.front : Infinity;
  // blocks
  for (const b of S.blocks){
    const a = S.anims.find(an => an.id === b.id);
    if (a && t - a.t0 < 260) continue;
    let sy = 1, wet = 0;
    const bx = b.x*s;
    if (S.wave && bx > waveX - s){ wet = 1; sy = Math.max(0, 1 - (bx - waveX + s)/(s*3)); }
    drawMold(g, b.type, bx, groundY - b.y*s*(S.wave ? sy : 1), s, {sy, wet});
  }
  for (const d of S.decor){
    const px = d.x*s;
    if (S.wave && px > waveX - s) continue;
    drawDecor(g, d, px, groundY - d.y*s, s);
  }
  // bucket animations
  S.anims = S.anims.filter(a => t - a.t0 < 900);
  for (const a of S.anims){
    const e = t - a.t0, cx = a.x*s, by = groundY - a.y*s;
    let off;
    if (e < 260) off = (1 - e/260)**2 * (by + s*2);
    else if (e < 450) off = Math.sin((e-260)/190*Math.PI)*s*.06;
    else off = (((e-450)/450)**1.5) * (by + s*2);
    if (e >= 260 && !a.thumped){ a.thumped = true; sThump(); burst(cx, by, 12, ['#e9c27a','#f7dc9f','#c99a52'], 3); }
    g.save(); g.globalAlpha = e > 450 ? Math.max(0, 1 - (e-450)/450) : 1;
    drawBucket(g, a.type, cx, by - Math.abs(off), s);
    g.restore();
  }
  drawCrab(t);
  // wave
  if (S.wave){
    const e = t - S.wave.t0, dur = 2200;
    S.wave.front = W*1.05 - (e/dur)*(W*1.5);
    const fx = S.wave.front, top = groundY - s*3.2 - Math.sin(e/200)*s*.15;
    const wg = g.createLinearGradient(0, top, 0, H);
    wg.addColorStop(0, 'rgba(70,190,240,.95)'); wg.addColorStop(1, 'rgba(30,120,190,.95)');
    g.fillStyle = wg;
    g.beginPath(); g.moveTo(fx + s*.6, H); g.lineTo(fx, groundY);
    g.quadraticCurveTo(fx - s*.3, top + s*.8, fx + s*.8, top);
    g.quadraticCurveTo(fx + s*1.6, top - s*.3, fx + s*1.4, top + s*.5);
    for (let x = fx + s*1.4; x < W + 40; x += s*.8) g.quadraticCurveTo(x + s*.4, top - s*.2, x + s*.8, top + s*.1);
    g.lineTo(W + 40, H); g.closePath(); g.fill();
    g.fillStyle = 'rgba(255,255,255,.9)';
    for (let i=0;i<7;i++){ const yy = top + s*.1 + i*s*.45; g.beginPath(); g.arc(fx + s*.15 + Math.sin(i*1.7 + e/120)*s*.15, yy, s*.13, 0, 7); g.fill(); }
    if (Math.random() < .5) burst(fx, top + Math.random()*s*2, 1, ['#ffffff','#bde9ff'], 4);
    if (e > dur){ S.wave = null; S.blocks = []; S.decor = []; S.history = []; saveBeach(); refreshOrder(); toast('✨ A smooth, fresh beach!'); if (S.afterWave) { const f = S.afterWave; S.afterWave = null; f(); } }
  }
  // particles
  for (const p of S.parts){ p.x += p.vx; p.y += p.vy; p.vy += p.gr; p.life--; }
  S.parts = S.parts.filter(p => p.life > 0 && p.y < H + 20);
  for (const p of S.parts){ g.fillStyle = p.c; g.globalAlpha = Math.min(1, p.life/20); g.fillRect(p.x, p.y, p.r, p.r); }
  g.globalAlpha = 1;
  requestAnimationFrame(frame);
}
function burst(x, y, n, cols, sp=3, gr=.15){
  for (let i=0;i<n;i++){ const a = Math.random()*Math.PI*2, v = Math.random()*sp + 1;
    S.parts.push({x, y, vx:Math.cos(a)*v, vy:Math.sin(a)*v - sp*.6, gr, life:40 + Math.random()*30, r: 3 + Math.random()*4, c: cols[i % cols.length]}); }
}
function confetti(){
  const cols = ['#ff4b4b','#ffcf3d','#3fa9f5','#3cbf6a','#b06cf0','#ff8a3d'];
  for (let i=0;i<90;i++) S.parts.push({x: Math.random()*W, y: -10 - Math.random()*H*.3, vx:(Math.random()-.5)*2, vy: 1 + Math.random()*2, gr:.04, life: 140 + Math.random()*60, r: 5 + Math.random()*4, c: cols[i%cols.length]});
}

// ---------- input ----------
cv.addEventListener('pointerdown', e => {
  audio();
  if (S.wave) return;
  const r = cv.getBoundingClientRect(), px = e.clientX - r.left, py = e.clientY - r.top;
  const wx = px/s, wy = (groundY - py)/s;
  // tap Carl
  if (Math.abs(px - (seaX - s*.25)) < s*.6 && py > groundY - s && py < groundY + s*.4){
    S.crabHop = now() + 500; sClack();
    if (S.mode === 'orders') toast('🦀 ' + ORDERS[S.order].say); else toast('🦀 Snip snap! Build me a castle!');
    return;
  }
  if (MOLDS[S.tool]) placeMold(wx); else placeDecor(wx, wy);
});

function placeMold(wx){
  const m = MOLDS[S.tool];
  const x = Math.max(m.w/2 + .1, Math.min(buildMax - m.w/2, wx));
  const L = landing(x, m.w);
  if ((L.y + m.h)*s > groundY - skyTop - 4){ sBoing(); toast('☁️ Too tall for the sky! Try another spot.'); return; }
  const b = {id: nextId++, type: S.tool, x, y: L.y, lvl: L.lvl};
  S.blocks.push(b); S.history.push(b.id);
  S.anims.push({id: b.id, type: b.type, x, y: L.y, t0: now()});
  saveBeach(); setTimeout(refreshOrder, 300);
}
function placeDecor(wx, wy){
  const type = S.tool;
  wx = Math.max(.2, Math.min(buildMax, wx));
  let x = wx, y = wy;
  const b = blockAt(wx, wy);
  if (type === 'flag'){
    y = surfaceAt(wx);
  } else if (!b){
    if (NEEDS_CASTLE[type]){ sBoing(); toast(type === 'door' ? '🚪 Tap a castle to add a door!' : '🪟 Tap a castle to add a window!'); return; }
    y = surfaceAt(wx) + .12;
  }
  if (y < .1 && type !== 'flag') y = .1;
  const d = {id: nextId++, type, x, y, rot: (Math.random()-.5)*.8};
  if (type === 'flag') d.color = S.flagN++;
  S.decor.push(d); S.history.push(d.id);
  sPop(type === 'flag' ? 660 : 760 + Math.random()*400);
  burst(x*s, groundY - y*s, 8, ['#fff6b0','#ffffff','#ffd84a'], 2.5, .05);
  saveBeach(); refreshOrder();
}
function undo(){
  if (S.wave) return;
  const id = S.history.pop();
  if (id == null){ toast('Nothing to undo!'); return; }
  S.blocks = S.blocks.filter(b => b.id !== id); S.decor = S.decor.filter(d => d.id !== id);
  sPop(500); saveBeach(); refreshOrder();
}

// ---------- photos ----------
function snapshot(){
  if (!S.blocks.length && !S.decor.length) return false;
  const tw = 300, th = Math.round(tw * H / W);
  const c = document.createElement('canvas'); c.width = tw; c.height = th;
  c.getContext('2d').drawImage(cv, 0, 0, tw, th);
  S.album.unshift(c.toDataURL('image/jpeg', .7));
  if (S.album.length > 12) S.album.length = 12;
  save('album', S.album);
  return true;
}
function takePhoto(){
  audio();
  if (!snapshot()){ toast('📷 Build something first!'); return; }
  sShutter(); const f = $('flash'); f.style.transition = 'none'; f.style.opacity = '.9';
  requestAnimationFrame(() => { f.style.transition = 'opacity .4s'; f.style.opacity = '0'; });
  toast('📷 Saved to your Album!');
}
function bigWave(after){
  if (S.wave) return;
  audio();
  const had = snapshot();
  S.wave = {t0: now(), front: W*1.1}; S.afterWave = after || null; sWave();
  if (had) toast('📷 Photo saved... here comes the WAVE!');
}

// ---------- orders ----------
function iconCanvas(key, size=68){
  const c = document.createElement('canvas'); c.width = size; c.height = size;
  const x = c.getContext('2d');
  if (MOLDS[key]){ const m = MOLDS[key], u = Math.min(size*.82/m.w, size*.82/m.h); drawMold(x, key, size/2, size*.92, u); }
  else if (key === 'high'){ const u = size/4.2; for (let i=0;i<3;i++) drawMold(x, 'block', size/2, size*.98 - i*u*1.15*.9, u*.85);
    x.fillStyle = '#ff7a3d'; x.beginPath(); x.moveTo(size*.9, size*.1); x.lineTo(size*.98, size*.3); x.lineTo(size*.82, size*.3); x.fill(); x.fillRect(size*.88, size*.28, size*.04, size*.6); }
  else { const u = size/1.1, d = {type:key, id:1, rot:0, color:0};
    const py = key === 'flag' ? size*.95 : size/2; const px = key === 'flag' ? size*.3 : size/2;
    if (key === 'window' || key === 'door'){ x.fillStyle = '#e9c27a'; x.fillRect(size*.12, size*.12, size*.76, size*.76); }
    drawDecor(x, d, px, py, key === 'flag' ? size*.85 : u); }
  return c;
}
function refreshOrder(){
  const box = $('order');
  if (S.mode !== 'orders'){ box.hidden = true; return; }
  box.hidden = false;
  const o = ORDERS[S.order], c = counts();
  $('say').textContent = `🦀 Order ${S.order+1}/8: ${o.say}`;
  const chips = $('chips'); chips.innerHTML = '';
  let all = true;
  for (const [k, n] of o.req){
    const have = c[k] || 0, ok = have >= n; if (!ok) all = false;
    const ch = document.createElement('div'); ch.className = 'chip' + (ok ? ' ok' : '');
    ch.appendChild(iconCanvas(k));
    const sp = document.createElement('span'); sp.className = 'n';
    sp.textContent = k === 'high' ? `${Math.min(have,n)}/${n} high` : `${Math.min(have,n)}/${n}`;
    ch.appendChild(sp); chips.appendChild(ch);
  }
  if (all && !S.celebrated && !S.wave){ S.celebrated = true; setTimeout(orderDone, 700); }
  pulseHint();
}
function orderDone(){
  if (!S.done.includes(S.order)){ S.done.push(S.order); save('done', S.done); }
  updateStars(); sFanfare(); confetti(); S.crabHop = now() + 1500;
  snapshot();
  const last = S.order >= ORDERS.length - 1;
  $('winTitle').textContent = last ? '👑 Castle Champion!' : 'Hooray! Carl loves it!';
  $('winText').textContent = last ? 'You built every one of Carl\'s castles! The photo is in your Album.' : 'Snip snap! What a great castle. I put a photo in your Album!';
  $('nextBtn').textContent = last ? 'Back to the menu' : 'Next order ▶';
  setTimeout(() => $('win').hidden = false, 900);
}
function startOrder(i){
  S.mode = 'orders'; S.order = i; S.celebrated = false;
  hideAll(); $('order').hidden = false; layout();
  const go = () => { S.celebrated = false; refreshOrder(); toast('🦀 ' + ORDERS[i].say); S.crabHop = now() + 600; sClack(); };
  if (S.blocks.length || S.decor.length) bigWave(go); else go();
  const first = ORDERS[i].req.find(([k]) => k !== 'high');
  if (first) setTool(ORDERS[i].req[0][0] === 'high' ? 'block' : ORDERS[i].req[0][0]);
}
function pulseHint(){
  document.querySelectorAll('.tool').forEach(b => b.classList.remove('pulse'));
  if (S.mode !== 'orders') return;
  const c = counts();
  const need = ORDERS[S.order].req.find(([k, n]) => (c[k] || 0) < n);
  if (!need) return;
  const k = need[0] === 'high' ? 'block' : need[0];
  if (k !== S.tool){ const b = document.querySelector(`.tool[data-k="${k}"]`); if (b) b.classList.add('pulse'); }
}
function updateStars(){ $('stars').textContent = '⭐' + S.done.length; }

// ---------- tools ----------
function setTool(k){
  S.tool = k;
  document.querySelectorAll('.tool').forEach(b => b.classList.toggle('on', b.dataset.k === k));
  pulseHint();
}
function buildTools(){
  const t = $('tools');
  const add = (k, label, fn) => {
    const b = document.createElement('button'); b.className = 'tool'; b.dataset.k = k; b.setAttribute('aria-label', label);
    if (fn) { b.textContent = k === 'wave' ? '🌊' : '↩️'; b.addEventListener('click', fn); }
    else { b.appendChild(iconCanvas(k)); b.addEventListener('click', () => { audio(); sPop(1200); setTool(k); }); }
    t.appendChild(b);
  };
  MOLD_KEYS.forEach(k => add(k, k + ' mold'));
  add('wave', 'Big wave', () => bigWave());
  add('undo', 'Undo', undo);
  DECOR_KEYS.forEach(k => add(k, k));
  setTool('tower');
}

// ---------- overlays ----------
function hideAll(){ ['menu','win','album','photo'].forEach(id => $(id).hidden = true); }
function showMenu(){
  hideAll(); $('menu').hidden = false;
  const grid = $('ordGrid'); grid.innerHTML = '';
  ORDERS.forEach((o, i) => {
    const b = document.createElement('button'); b.className = 'og' + (S.done.includes(i) ? ' done' : '');
    b.textContent = S.done.includes(i) ? '🏰' : String(i+1); b.setAttribute('aria-label', 'Order ' + (i+1));
    b.addEventListener('click', () => { audio(); startOrder(i); });
    grid.appendChild(b);
  });
}
function showAlbum(){
  hideAll(); $('album').hidden = false;
  const grid = $('albumGrid'); grid.innerHTML = '';
  $('albumEmpty').hidden = S.album.length > 0;
  S.album.forEach(src => { const im = document.createElement('img'); im.src = src; im.alt = 'castle photo';
    im.addEventListener('click', () => { $('bigPhoto').src = src; $('album').hidden = true; $('photo').hidden = false; }); grid.appendChild(im); });
}
$('menuBtn').addEventListener('click', () => { audio(); showMenu(); });
$('camBtn').addEventListener('click', takePhoto);
$('goOrders').addEventListener('click', () => { audio(); let i = ORDERS.findIndex((_, k) => !S.done.includes(k)); startOrder(i < 0 ? 0 : i); });
$('goFree').addEventListener('click', () => { audio(); S.mode = 'free'; hideAll(); $('order').hidden = true; layout(); pulseHint(); toast('🏖️ Build anything you like!'); });
$('goAlbum').addEventListener('click', () => { audio(); showAlbum(); });
$('albumClose').addEventListener('click', hideAll);
$('photoClose').addEventListener('click', () => { $('photo').hidden = true; showAlbum(); });
$('nextBtn').addEventListener('click', () => { $('win').hidden = true; if (S.order >= ORDERS.length - 1) showMenu(); else startOrder(S.order + 1); });
$('keepBtn').addEventListener('click', () => { $('win').hidden = true; S.mode = 'free'; $('order').hidden = true; layout(); pulseHint(); toast('🏖️ Keep building!'); });

buildTools(); updateStars(); layout(); showMenu();
requestAnimationFrame(frame);
</script>
</body>
