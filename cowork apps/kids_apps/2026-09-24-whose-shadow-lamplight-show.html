<!-- CONCEPT: PUZZLES / BRAIN - Whose Shadow? Lamplight Show: Ollie the owl shines a lamp behind a theatre screen and kids tap the picture card that made the shadow; five acts climb from easy shapes to look-alike shadows, turned-around shadows, half-hidden peekaboo shadows and two friends overlapping, and the shadow bursts into colour when you guess right. There is also a Shadow Play stage where you drag toys near the lamp to make giant shadows. No timer, no losing. Ages 4-11. -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Whose Shadow? Lamplight Show</title>
<style>
:root {
  --bg1: #2d1b69; --bg2: #6a2c91; --bg3: #1a0f3d;
  --gold: #ffd23f; --pink: #ff6fb5; --teal: #3ee0c5; --orange: #ff9f1c;
  --card: #fff8ec; --ink: #2b1d3a; --good: #c9ffd9;
  --curtain: #d7263d; --curtain2: #8e1330;
  --radius: 22px; --gap: clamp(6px, 2vw, 12px);
  --font: "Comic Sans MS", "Trebuchet MS", system-ui, sans-serif;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0; padding: 0; height: 100%;
  touch-action: manipulation;
  user-select: none; -webkit-user-select: none;
  overflow: hidden;
  font-family: var(--font); color: #fff;
  background: radial-gradient(ellipse at 50% 0%, var(--bg2), var(--bg1) 55%, var(--bg3));
}
button { font-family: inherit; cursor: pointer; border: none; color: inherit; }
.screen { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; }
.screen.on { display: flex; }

/* ---------- menu ---------- */
#menu { overflow-y: auto; padding: 66px 12px 20px; gap: clamp(8px, 1.6vh, 14px); }
h1 {
  margin: 0; text-align: center; line-height: 1.05;
  font-size: clamp(34px, 10vw, 60px);
  background: linear-gradient(90deg, var(--gold), var(--pink), var(--teal));
  -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 3px 0 rgba(0,0,0,.35));
}
.sub { font-size: clamp(15px, 4vw, 20px); opacity: .9; margin-top: -4px; }
.host { display: flex; align-items: center; gap: 10px; }
.host .owl { font-size: clamp(54px, 15vw, 80px); animation: bob 2.4s ease-in-out infinite; }
.bubble {
  background: var(--card); color: var(--ink); border-radius: 18px; padding: 10px 14px;
  font-size: clamp(15px, 4.2vw, 20px); position: relative; max-width: 58vw;
}
.bubble::before { content: ""; position: absolute; left: -10px; top: 50%; margin-top: -8px;
  border: 8px solid transparent; border-right: 10px solid var(--card); border-left: 0; }
.acts { display: grid; grid-template-columns: 1fr 1fr; gap: var(--gap); width: min(94vw, 520px); }
.ticket {
  min-height: clamp(76px, 12vh, 104px); border-radius: var(--radius);
  background: linear-gradient(160deg, #ffe07a, var(--orange));
  color: var(--ink); display: flex; align-items: center; gap: 8px; padding: 8px 12px;
  box-shadow: 0 6px 0 #b35c00, 0 10px 18px rgba(0,0,0,.3);
  transition: transform .1s;
}
.ticket:active { transform: translateY(4px); box-shadow: 0 2px 0 #b35c00; }
.ticket .ic { font-size: clamp(34px, 10vw, 50px); }
.ticket .tx { display: flex; flex-direction: column; align-items: flex-start; text-align: left; }
.ticket .nm { font-size: clamp(15px, 4.2vw, 21px); font-weight: bold; }
.ticket .st { font-size: clamp(13px, 3.6vw, 18px); letter-spacing: 1px; }
.ticket.act2 { background: linear-gradient(160deg, #9ff5e5, #2fbfa7); box-shadow: 0 6px 0 #16806e, 0 10px 18px rgba(0,0,0,.3); }
.ticket.act3 { background: linear-gradient(160deg, #ffc2e2, var(--pink)); box-shadow: 0 6px 0 #b02a70, 0 10px 18px rgba(0,0,0,.3); }
.ticket.act4 { background: linear-gradient(160deg, #c9d8ff, #6f8cff); box-shadow: 0 6px 0 #3448b0, 0 10px 18px rgba(0,0,0,.3); }
.ticket.act5 { background: linear-gradient(160deg, #e3c7ff, #9b5cff); box-shadow: 0 6px 0 #5a24b0, 0 10px 18px rgba(0,0,0,.3); }
.ticket.play { grid-column: 1 / -1; justify-content: center;
  background: linear-gradient(90deg, #3a2a7a, #1b1240); color: #fff; border: 3px dashed var(--gold);
  box-shadow: 0 6px 0 #0d0822, 0 10px 18px rgba(0,0,0,.3); }
.menu-sound { position: absolute; top: 10px; right: 10px; }

/* ---------- shared bar ---------- */
.topbar { width: min(96vw, 560px); display: flex; align-items: center; justify-content: space-between; padding: 8px 0 4px; gap: 8px; flex: 0 0 auto; }
.icon {
  width: 52px; height: 52px; border-radius: 16px; font-size: 26px;
  background: rgba(255,255,255,.16); display: flex; align-items: center; justify-content: center;
  box-shadow: 0 4px 0 rgba(0,0,0,.25);
}
.icon:active { transform: translateY(3px); box-shadow: none; }
#dots { display: flex; gap: 6px; align-items: center; }
#dots span { font-size: clamp(20px, 6vw, 28px); opacity: .35; transition: opacity .3s, transform .3s; }
#dots span.done { opacity: 1; transform: scale(1.15); }
.actlabel { font-size: clamp(14px, 3.8vw, 18px); opacity: .9; }

/* ---------- game ---------- */
#game { gap: clamp(4px, 1vh, 10px); }
.stage {
  position: relative; flex: 0 0 auto;
  width: min(96vw, 520px); height: min(40vh, 68vw, 380px);
  border-radius: 18px 18px 8px 8px; overflow: hidden;
  background: #120a2c; box-shadow: 0 10px 30px rgba(0,0,0,.45), inset 0 0 0 4px #3c1f10;
}
.stage canvas { position: absolute; left: 9%; right: 9%; top: 12%; bottom: 4%; width: 82%; height: 84%; border-radius: 6px; }
.valance { position: absolute; left: 0; right: 0; top: 0; height: 12%; z-index: 2;
  background: repeating-linear-gradient(90deg, var(--curtain) 0 18px, var(--curtain2) 18px 24px);
  border-bottom: 4px solid var(--gold); border-radius: 0 0 40% 40% / 0 0 30% 30%; }
.curt { position: absolute; top: 0; bottom: 0; width: 11%; z-index: 1;
  background: repeating-linear-gradient(90deg, var(--curtain) 0 8px, var(--curtain2) 8px 12px); }
.curt.l { left: 0; border-radius: 0 0 60% 0; }
.curt.r { right: 0; border-radius: 0 0 0 60%; }
.audience { display: flex; gap: clamp(4px, 2vw, 14px); font-size: clamp(26px, 8vw, 40px); height: clamp(34px, 9vw, 50px); flex: 0 0 auto; }
.audience span { display: inline-block; transform-origin: 50% 100%; }
.audience span.jump { animation: cheer .7s ease-out 2; }
.prompt {
  min-height: 44px; display: flex; align-items: center; justify-content: center; text-align: center;
  font-size: clamp(17px, 4.8vw, 24px); padding: 4px 12px; width: min(96vw, 560px); flex: 0 0 auto;
}
.prompt > span { display: inline; }
.cards { display: flex; gap: var(--gap); justify-content: center; flex-wrap: wrap; width: min(96vw, 560px); flex: 0 0 auto; }
.card {
  width: min(21vw, 108px); height: min(21vw, 108px); min-width: 64px; min-height: 64px;
  border-radius: var(--radius); background: var(--card);
  font-size: min(12vw, 60px); line-height: 1;
  display: flex; align-items: center; justify-content: center; position: relative;
  box-shadow: 0 6px 0 #d9b98a, 0 10px 16px rgba(0,0,0,.3);
  transition: transform .12s, opacity .3s, background .3s;
  animation: dealIn .35s ease-out backwards;
}
.card:active { transform: translateY(4px) scale(.97); }
.card.bad { opacity: .35; animation: wiggle .45s; }
.card.good { background: var(--good); box-shadow: 0 0 0 5px var(--gold), 0 6px 0 #7fcf98; transform: scale(1.06); }
.card.good::after { content: "✓"; position: absolute; right: 6px; top: 2px; font-size: 22px; color: #1f9a4b; font-weight: bold; }
.card.hint { animation: pulse .9s ease-in-out infinite; }

/* ---------- free play ---------- */
#play { gap: 6px; }
#pc { flex: 1 1 auto; width: min(98vw, 620px); min-height: 0; border-radius: 16px; touch-action: none; display: block; }
.tray { display: flex; gap: 8px; overflow-x: auto; width: min(98vw, 620px); padding: 6px 4px 12px; flex: 0 0 auto; touch-action: pan-x; }
.tray button { flex: 0 0 auto; width: 60px; height: 60px; border-radius: 16px; font-size: 36px; background: var(--card); box-shadow: 0 4px 0 #d9b98a; }
.tray button:active { transform: translateY(3px); box-shadow: none; }
.playtitle { font-size: clamp(18px, 5vw, 26px); font-weight: bold;
  background: linear-gradient(90deg, var(--gold), var(--pink)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.tools { display: flex; gap: 8px; }

/* ---------- overlay ---------- */
#win { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(15,6,40,.7); z-index: 20; }
#win.on { display: flex; }
.panel { background: linear-gradient(170deg, #fff3cf, #ffd08a); color: var(--ink); border-radius: 28px; padding: 20px 18px;
  width: min(90vw, 420px); text-align: center; box-shadow: 0 16px 40px rgba(0,0,0,.5); animation: popIn .45s cubic-bezier(.2,1.6,.4,1); }
.panel h2 { margin: 0 0 4px; font-size: clamp(30px, 9vw, 44px);
  background: linear-gradient(90deg, var(--curtain), var(--pink), var(--orange)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.panel .big { font-size: clamp(44px, 13vw, 64px); }
.panel .stars { font-size: clamp(30px, 9vw, 44px); letter-spacing: 4px; margin: 6px 0; }
.panel p { margin: 4px 0 12px; font-size: clamp(15px, 4.2vw, 19px); }
.btnrow { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.bigbtn { min-height: 60px; min-width: 130px; padding: 0 18px; border-radius: 20px; font-size: clamp(18px, 5vw, 22px); font-weight: bold;
  background: linear-gradient(160deg, #7ef2dc, #1fae94); color: #0b3b33; box-shadow: 0 5px 0 #127a67; }
.bigbtn.alt { background: linear-gradient(160deg, #ffe07a, var(--orange)); color: var(--ink); box-shadow: 0 5px 0 #b35c00; }
.bigbtn:active { transform: translateY(4px); box-shadow: none; }
#fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 30; }

@keyframes bob { 0%,100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-8px) rotate(3deg); } }
@keyframes cheer { 0% { transform: translateY(0); } 40% { transform: translateY(-16px) scale(1.15); } 100% { transform: translateY(0); } }
@keyframes wiggle { 0%,100% { transform: rotate(0); } 20% { transform: rotate(-12deg); } 40% { transform: rotate(10deg); } 60% { transform: rotate(-7deg); } 80% { transform: rotate(4deg); } }
@keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(255,210,63,.9), 0 6px 0 #d9b98a; transform: scale(1); } 50% { box-shadow: 0 0 0 10px rgba(255,210,63,0), 0 6px 0 #d9b98a; transform: scale(1.08); } }
@keyframes dealIn { from { transform: translateY(30px) scale(.6); opacity: 0; } }
@keyframes popIn { from { transform: scale(.5); opacity: 0; } }
</style>
</head>
<body>

<!-- MENU -->
<section id="menu" class="screen on">
  <button class="icon menu-sound" id="sndMenu" aria-label="Sound">🔊</button>
  <h1>Whose Shadow?</h1>
  <div class="sub">🔦 The Lamplight Show 🔦</div>
  <div class="host"><div class="owl">🦉</div><div class="bubble" id="hostSay">Who is behind the screen? Pick a show!</div></div>
  <div class="acts" id="acts"></div>
</section>

<!-- GAME -->
<section id="game" class="screen">
  <div class="topbar">
    <button class="icon" id="homeBtn" aria-label="Home">🏠</button>
    <div style="display:flex;flex-direction:column;align-items:center">
      <div class="actlabel" id="actLabel"></div>
      <div id="dots"></div>
    </div>
    <button class="icon" id="sndGame" aria-label="Sound">🔊</button>
  </div>
  <div class="stage">
    <canvas id="scr"></canvas>
    <div class="valance"></div>
    <div class="curt l"></div><div class="curt r"></div>
  </div>
  <div class="audience" id="aud"></div>
  <div class="prompt" id="prompt"></div>
  <div class="cards" id="cards"></div>
</section>

<!-- FREE PLAY -->
<section id="play" class="screen">
  <div class="topbar">
    <button class="icon" id="homeBtn2" aria-label="Home">🏠</button>
    <div class="playtitle">Shadow Play</div>
    <div class="tools">
      <button class="icon" id="tintBtn" aria-label="Shadow colour">🎨</button>
      <button class="icon" id="clearBtn" aria-label="Clear">🧹</button>
    </div>
  </div>
  <canvas id="pc"></canvas>
  <div class="tray" id="tray"></div>
</section>

<!-- CURTAIN CALL -->
<div id="win">
  <div class="panel">
    <div class="big">🎭</div>
    <h2>Curtain Call!</h2>
    <div class="stars" id="winStars"></div>
    <p id="winMsg"></p>
    <div class="btnrow">
      <button class="bigbtn" id="nextBtn">Next Act ▶</button>
      <button class="bigbtn alt" id="menuBtn">🏠 Menu</button>
    </div>
  </div>
</div>

<canvas id="fx"></canvas>

<script>
const $ = s => document.querySelector(s);
const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
const EMOJI_FONT = '"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji","Twemoji Mozilla",sans-serif';

// ---------- content ----------
const NAMES = {
  '🐘':'elephant','🦒':'giraffe','🐇':'bunny','🐢':'turtle','🐌':'snail','🦋':'butterfly','🐟':'fish','🐙':'octopus',
  '🦀':'crab','🐓':'rooster','🦆':'duck','🐈':'cat','🐕':'dog','🦕':'dinosaur','🐿️':'squirrel','🦔':'hedgehog',
  '🐳':'whale','🦉':'owl','🐧':'penguin','🦩':'flamingo','🐫':'camel','🦘':'kangaroo',
  '✈️':'aeroplane','🚀':'rocket','🚲':'bike','🚗':'car','⛵':'sailboat','🚁':'helicopter','🛴':'scooter','⚓':'anchor',
  '🔑':'key','✂️':'scissors','☂️':'umbrella','🎸':'guitar','🎈':'balloon','🎩':'top hat','👑':'crown','🔔':'bell',
  '🍎':'apple','🍌':'banana','🍐':'pear','🍄':'mushroom','🌵':'cactus','🌳':'tree','🥕':'carrot','🍕':'pizza',
  '🍦':'ice cream','🌙':'moon','⭐':'star','🍇':'grapes','🌻':'sunflower','🍉':'watermelon'
};
const GROUPS = {
  animals: ['🐘','🦒','🐇','🐢','🐌','🦋','🐟','🐙','🦀','🐓','🦆','🐈','🐕','🦕','🐿️','🦔','🐳','🦉','🐧','🦩','🐫','🦘'],
  things:  ['✈️','🚀','🚲','🚗','⛵','🚁','🛴','⚓','🔑','✂️','☂️','🎸','🎈','🎩','👑','🔔'],
  food:    ['🍎','🍌','🍐','🍄','🌵','🌳','🥕','🍕','🍦','🌙','⭐','🍇','🌻','🍉']
};
const ALL = Object.values(GROUPS).flat();
const groupOf = e => Object.keys(GROUPS).find(k => GROUPS[k].includes(e));
const ACTS = [
  { icon:'🔦', kind:'simple',  name:'Easy Peasy',  prompt:'🔦 Whose shadow is this?' },
  { icon:'🔍', kind:'similar', name:'Look Closely', prompt:'🔍 Look closely! Whose shadow?' },
  { icon:'🔄', kind:'turned',  name:'Topsy-Turvy', prompt:'🔄 It got turned around! Whose shadow?' },
  { icon:'🙈', kind:'peek',    name:'Peekaboo',    prompt:'🙈 Someone is hiding! Who is it?' },
  { icon:'👯', kind:'pair',    name:'Two Friends', prompt:'👯 Two friends! Find them both!' }
];
const ROUNDS = 5;
const AUDIENCE = ['🐻','🐰','🐸','🐱','🐶','🐼'];
const TURNS = [ {rot:Math.PI, sy:1}, {rot:Math.PI/2, sy:1}, {rot:-Math.PI/2, sy:1}, {rot:0, sy:-1} ];
const OOPS = ['Hmm, look again! 👀', 'So close! Try another! 🌟', 'Peek at the shape! 🔦', 'Good guess! Try again! 💫'];

// ---------- save ----------
const KEY = 'cowork-shadowshow-progress';
let save = { best:[0,0,0,0,0], sound:true };
try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && Array.isArray(s.best)) save = Object.assign(save, s); } catch (e) {}
const persist = () => { try { localStorage.setItem(KEY, JSON.stringify(save)); } catch (e) {} };

// ---------- helpers ----------
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const ease = t => 1 - Math.pow(1 - clamp(t, 0, 1), 3);
const lerp = (a, b, t) => a + (b - a) * t;

// ---------- audio ----------
let AC = null;
function audio() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; } }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(f, dur = .18, type = 'sine', vol = .18, delay = 0, slideTo = 0) {
  if (!save.sound) return; const ac = audio(); if (!ac) return;
  const t = ac.currentTime + delay, o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .02); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(ac.destination); o.start(t); o.stop(t + dur + .05);
}
function noise(dur = .08, vol = .12, delay = 0, freq = 1800) {
  if (!save.sound) return; const ac = audio(); if (!ac) return;
  const t = ac.currentTime + delay, len = Math.max(1, ac.sampleRate * dur | 0);
  const buf = ac.createBuffer(1, len, ac.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2);
  const src = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
  f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = .8; g.gain.value = vol;
  src.buffer = buf; src.connect(f).connect(g).connect(ac.destination); src.start(t);
}
const sfx = {
  click: () => { noise(.04, .2, 0, 3000); tone(900, .05, 'square', .05); },
  chime: () => [660, 830, 990, 1320].forEach((f, i) => tone(f, .28, 'triangle', .16, i * .07)),
  boop: () => tone(330, .25, 'sine', .16, 0, 200),
  applause: () => { for (let i = 0; i < 22; i++) noise(.05, .1 + Math.random() * .08, i * .05 + Math.random() * .03, 1500 + Math.random() * 1500); },
  fanfare: () => [523, 659, 784, 1047, 784, 1047].forEach((f, i) => tone(f, i === 5 ? .6 : .2, 'square', .08, i * .13)),
  whoosh: () => tone(200, .3, 'sine', .1, 0, 700),
  flip: () => tone(700, .08, 'triangle', .1, 0, 1000),
  lamp: () => { noise(.03, .25, 0, 4000); tone(1200, .04, 'square', .04); }
};
function speak(text) {
  if (!save.sound || !('speechSynthesis' in window)) return;
  try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.rate = .95; u.pitch = 1.25; speechSynthesis.speak(u); } catch (e) {}
}
function syncSoundBtns() { document.querySelectorAll('#sndMenu,#sndGame').forEach(b => b.textContent = save.sound ? '🔊' : '🔇'); }
function toggleSound() { save.sound = !save.sound; persist(); syncSoundBtns(); if (save.sound) sfx.click(); else if ('speechSynthesis' in window) speechSynthesis.cancel(); }

// ---------- emoji images (colour + silhouette), cached ----------
const imgCache = new Map();
function emojiImg(e, px, color) {
  px = Math.max(8, Math.round(px));
  const key = e + '|' + px + '|' + (color || '');
  if (imgCache.has(key)) return imgCache.get(key);
  if (imgCache.size > 300) imgCache.clear();
  const c = document.createElement('canvas'), s = Math.ceil(px * 1.35);
  c.width = c.height = s;
  const g = c.getContext('2d');
  g.font = `${px}px ${EMOJI_FONT}`; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillStyle = '#000'; g.globalAlpha = 1;
  g.fillText(e, s / 2, s / 2 + px * .06);
  if (color) { g.globalCompositeOperation = 'source-in'; g.fillStyle = color; g.fillRect(0, 0, s, s); }
  imgCache.set(key, c);
  return c;
}
function drawEmoji(g, e, x, y, size, color, alpha = 1) {
  const im = emojiImg(e, size * dpr, color), w = im.width / dpr;
  g.globalAlpha = alpha; g.drawImage(im, x - w / 2, y - w / 2, w, w); g.globalAlpha = 1;
}

// ---------- screens ----------
function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === id));
  if (id === 'game') fitScr();
  if (id === 'play') fitPlay();
}

// ---------- menu ----------
function buildMenu() {
  const box = $('#acts'); box.innerHTML = '';
  ACTS.forEach((a, i) => {
    const b = document.createElement('button');
    b.className = 'ticket act' + (i + 1);
    const st = '★'.repeat(save.best[i]) + '☆'.repeat(ROUNDS - save.best[i]);
    b.innerHTML = `<span class="ic">${a.icon}</span><span class="tx"><span class="nm">${a.name}</span><span class="st">${st}</span></span>`;
    b.setAttribute('aria-label', 'Act ' + (i + 1) + ' ' + a.name);
    b.onclick = () => { sfx.click(); startAct(i); };
    box.appendChild(b);
  });
  const p = document.createElement('button');
  p.className = 'ticket play';
  p.innerHTML = `<span class="ic">🔦</span><span class="tx"><span class="nm">Shadow Play</span><span class="st">make giant shadows!</span></span>`;
  p.onclick = () => { sfx.click(); startPlay(); };
  box.appendChild(p);
}

// ---------- game state ----------
let actIdx = 0, rounds = [], rIdx = 0, round = null, earned = [], nextTimer = 0;
const scr = $('#scr'), sg = scr.getContext('2d');
let scrW = 300, scrH = 200;
const sparks = [];

function fitScr() {
  const r = scr.getBoundingClientRect();
  if (!r.width) return;
  scrW = r.width; scrH = r.height;
  scr.width = Math.round(r.width * dpr); scr.height = Math.round(r.height * dpr);
}

function pickDecoys(ans, n, pool) {
  return shuffle(pool.filter(e => !ans.includes(e))).slice(0, n);
}
function buildRounds(ai) {
  const kind = ACTS[ai].kind, order = shuffle(ALL), list = [];
  let p = 0;
  for (let r = 0; r < ROUNDS; r++) {
    const ans = [order[p++]];
    if (kind === 'pair') { let b = order[p++]; ans.push(b); }
    const grp = GROUPS[groupOf(ans[0])];
    let decoys;
    if (kind === 'simple') decoys = pickDecoys(ans, 2, ALL.filter(e => groupOf(e) !== groupOf(ans[0])));
    else if (kind === 'similar') decoys = pickDecoys(ans, 3, grp);
    else if (kind === 'peek') decoys = pickDecoys(ans, 2, grp).concat(pickDecoys(ans, 1, ALL.filter(e => !grp.includes(e))));
    else decoys = pickDecoys(ans, kind === 'pair' ? 2 : 3, ALL);
    const items = kind === 'pair'
      ? [{ e: ans[0], dx: -.2, dy: -.04, t0: 0 }, { e: ans[1], dx: .2, dy: .06, t0: 0 }]
      : [{ e: ans[0], dx: 0, dy: 0, t0: 0 }];
    const peekSide = ['left', 'right', 'top', 'bottom'][Math.random() * 4 | 0];
    list.push({
      kind, answers: ans, choices: shuffle(ans.concat(decoys)), items, found: [], misses: 0, done: false, wob: 0,
      tf: kind === 'turned' ? TURNS[Math.random() * TURNS.length | 0] : { rot: 0, sy: 1 },
      peek: kind === 'peek' ? peekSide : null
    });
  }
  return list;
}

function startAct(ai) {
  clearTimeout(nextTimer);
  actIdx = ai; rounds = buildRounds(ai); rIdx = 0; earned = [];
  $('#actLabel').textContent = `Act ${ai + 1}: ${ACTS[ai].name}`;
  $('#aud').innerHTML = AUDIENCE.map(a => `<span>${a}</span>`).join('');
  show('game');
  startRound();
}

function renderDots() {
  $('#dots').innerHTML = Array.from({ length: ROUNDS }, (_, i) =>
    `<span class="${i < earned.length ? 'done' : ''}">${i < earned.length ? (earned[i] ? '⭐' : '🌟') : '⚪'}</span>`).join('');
}
function setPrompt(t) { $('#prompt').innerHTML = `<span>${t}</span>`; }

function startRound() {
  round = rounds[rIdx];
  renderDots();
  setPrompt(ACTS[actIdx].prompt);
  const box = $('#cards'); box.innerHTML = '';
  round.choices.forEach((e, i) => {
    const b = document.createElement('button');
    b.className = 'card'; b.textContent = e; b.style.animationDelay = (i * .07) + 's';
    b.setAttribute('aria-label', NAMES[e] || 'card');
    b.onclick = () => pick(e, b);
    box.appendChild(b);
  });
  round.lampT = performance.now();
  sfx.lamp();
  const say = { simple: 'Whose shadow is this?', similar: 'Look closely! Whose shadow?', turned: 'Uh oh, it got turned around! Whose shadow?',
    peek: 'Someone is hiding! Who is it?', pair: 'Two friends! Can you find them both?' }[round.kind];
  speak(say);
}

function pick(e, el) {
  if (!round || round.done || el.classList.contains('bad') || el.classList.contains('good')) return;
  audio();
  const now = performance.now();
  if (round.answers.includes(e) && !round.found.includes(e)) {
    round.found.push(e);
    el.classList.remove('hint'); el.classList.add('good');
    const it = round.items.find(x => x.e === e); it.t0 = now;
    burstOnScreen(it);
    sfx.chime();
    if (round.found.length < round.answers.length) {
      setPrompt(`🎉 Yes, the ${NAMES[e]}! One more friend!`);
      speak(`Yes, the ${NAMES[e]}! Find one more!`);
    } else roundWin();
  } else {
    el.classList.add('bad');
    round.misses++; round.wob = now;
    sfx.boop();
    setPrompt(OOPS[Math.random() * OOPS.length | 0]);
    speak('Hmm, look again!');
    if (round.misses >= 2) document.querySelectorAll('.card').forEach(c => {
      const ce = c.textContent;
      if (round.answers.includes(ce) && !round.found.includes(ce)) c.classList.add('hint');
    });
  }
}

function roundWin() {
  round.done = true;
  const first = round.misses === 0;
  earned.push(first);
  renderDots();
  const names = round.answers.map(a => 'the ' + NAMES[a]).join(' and ');
  setPrompt(`${first ? '⭐' : '🌟'} It's ${names}! ${first ? 'Sharp eyes!' : 'You found it!'}`);
  speak(`It's ${names}!`);
  setTimeout(sfx.applause, 250);
  document.querySelectorAll('#aud span').forEach((s, i) => {
    s.classList.remove('jump'); void s.offsetWidth; s.style.animationDelay = (i * .06) + 's'; s.classList.add('jump');
  });
  nextTimer = setTimeout(() => {
    rIdx++;
    if (rIdx < rounds.length) startRound(); else actDone();
  }, 2200);
}

function actDone() {
  const n = earned.filter(Boolean).length;
  save.best[actIdx] = Math.max(save.best[actIdx], n); persist(); buildMenu();
  $('#winStars').textContent = earned.map(f => f ? '⭐' : '🌟').join('');
  $('#winMsg').textContent = n === ROUNDS ? 'Every shadow on the first try! Bravo!' : `You solved all ${ROUNDS} shadows! ⭐ = first try`;
  const last = actIdx === ACTS.length - 1;
  $('#nextBtn').textContent = last ? '🔁 Play Again' : 'Next Act ▶';
  $('#win').classList.add('on');
  sfx.fanfare(); setTimeout(sfx.applause, 500);
  speak('Curtain call! Take a bow!');
  confetti(160);
}

// ---------- shadow screen drawing ----------
function burstOnScreen(it) {
  const size = itemSize();
  const x = scrW / 2 + it.dx * size, y = scrH / 2 + it.dy * size;
  for (let i = 0; i < 26; i++) {
    const a = Math.random() * Math.PI * 2, v = 1.5 + Math.random() * 3.5;
    sparks.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 1, hue: Math.random() * 360, r: 2 + Math.random() * 3 });
  }
}
function itemSize() { return Math.min(scrW, scrH) * (round && round.kind === 'pair' ? .56 : .7); }

function drawSheet(g, W, H, now) {
  const glow = round ? ease((now - (round.lampT || 0)) / 300) : 1;
  const grd = g.createRadialGradient(W / 2, H * .45, 8, W / 2, H / 2, Math.max(W, H) * .75);
  grd.addColorStop(0, `rgba(255,251,232,${glow})`); grd.addColorStop(.6, '#ffe3a0'); grd.addColorStop(1, '#d9964a');
  g.fillStyle = '#5a3b1a'; g.fillRect(0, 0, W, H);
  g.fillStyle = grd; g.fillRect(0, 0, W, H);
  g.strokeStyle = 'rgba(170,110,40,.18)'; g.lineWidth = 2;
  for (let i = 1; i < 6; i++) { const x = W * i / 6; g.beginPath(); g.moveTo(x, 0); g.quadraticCurveTo(x + 6, H / 2, x - 3, H); g.stroke(); }
}

function drawPeekCurtain(g, W, H, cx, cy, size, side, open) {
  // covers a bit under half of the hidden friend's box (the glyph itself fills less than the box); slides away as it opens
  const cover = size * .4;
  g.save();
  let x, y, w, h;
  if (side === 'left')  { w = cx - size / 2 + cover; x = -w * open; y = 0; h = H; }
  if (side === 'right') { w = W - (cx + size / 2 - cover); x = W - w + w * open; y = 0; h = H; }
  if (side === 'top')   { h = cy - size / 2 + cover; y = -h * open; x = 0; w = W; }
  if (side === 'bottom'){ h = H - (cy + size / 2 - cover); y = H - h + h * open; x = 0; w = W; }
  const vertical = side === 'left' || side === 'right';
  const gr = vertical ? g.createLinearGradient(x, 0, x + 14, 0) : g.createLinearGradient(0, y, 0, y + 14);
  gr.addColorStop(0, '#d7263d'); gr.addColorStop(.6, '#b31a33'); gr.addColorStop(1, '#8e1330');
  g.fillStyle = gr; g.fillRect(x, y, w, h);
  g.fillStyle = 'rgba(0,0,0,.15)';
  if (vertical) for (let i = x; i < x + w; i += 16) g.fillRect(i, y, 5, h);
  else for (let i = y; i < y + h; i += 16) g.fillRect(x, i, w, 5);
  g.fillStyle = '#ffd23f';
  if (side === 'left') g.fillRect(x + w - 5, 0, 5, H);
  if (side === 'right') g.fillRect(x, 0, 5, H);
  if (side === 'top') g.fillRect(0, y + h - 5, W, 5);
  if (side === 'bottom') g.fillRect(0, y, W, 5);
  g.restore();
}

function drawScreen(now) {
  const g = sg, W = scrW, H = scrH;
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  drawSheet(g, W, H, now);
  if (!round) return;
  const size = itemSize();
  const wobT = (now - round.wob) / 450;
  const wob = wobT < 1 ? Math.sin(wobT * 18) * 7 * (1 - wobT) : 0;
  const cx = W / 2 + wob, cy = H / 2 + Math.sin(now / 700) * 3;
  const appear = ease((now - round.lampT) / 350);
  round.items.forEach(it => {
    const rv = it.t0 ? ease((now - it.t0) / 750) : 0;
    const x = cx + it.dx * size, y = cy + it.dy * size;
    g.save(); g.translate(x, y);
    g.rotate(round.tf.rot * (1 - rv));
    g.scale(1, lerp(round.tf.sy, 1, rv) || .001);
    g.shadowColor = 'rgba(40,20,60,.35)'; g.shadowBlur = 14;
    if (rv < 1) drawEmoji(g, it.e, 0, 0, size, '#2b1d3a', appear * (1 - rv));
    g.shadowBlur = 0;
    if (rv > 0) drawEmoji(g, it.e, 0, 0, size * lerp(.9, 1, rv), null, rv);
    g.restore();
  });
  if (round.kind === 'peek') {
    const it = round.items[0];
    const open = it.t0 ? ease((now - it.t0) / 650) : 0;
    drawPeekCurtain(g, W, H, cx + it.dx * size, cy, size, round.peek, open);
  }
  for (let i = sparks.length - 1; i >= 0; i--) {
    const s = sparks[i];
    s.x += s.vx; s.y += s.vy; s.vy += .06; s.life -= .018;
    if (s.life <= 0) { sparks.splice(i, 1); continue; }
    g.globalAlpha = s.life; g.fillStyle = `hsl(${s.hue},95%,60%)`;
    g.beginPath(); g.arc(s.x, s.y, s.r, 0, Math.PI * 2); g.fill();
  }
  g.globalAlpha = 1;
}

// ---------- free play: shadow stage ----------
const pc = $('#pc'), pg = pc.getContext('2d');
let pw = 300, ph = 400, objs = [], drag = null, tint = 0, touchedOnce = false;
const TINTS = ['#2b1d3a', '#4b2a8a', 'rainbow'];
const TRAY = ['🐇', '🦒', '🐘', '🦕', '🐙', '🦋', '🐌', '🦀', '🐓', '🚀', '✈️', '🎸', '☂️', '🌵', '🍄', '👑', '🐳', '🦉'];

function fitPlay() {
  const r = pc.getBoundingClientRect();
  if (!r.width) return;
  pw = r.width; ph = r.height;
  pc.width = Math.round(pw * dpr); pc.height = Math.round(ph * dpr);
  objs.forEach(o => keepIn(o));
}
function geo() {
  const sh = ph * .5;
  return { sx: pw * .05, sy: 8, sw: pw * .9, sh: sh - 8, sBottom: sh, lx: pw / 2, ly: ph - 26, objSize: Math.min(pw, ph) * .13 };
}
function keepIn(o) {
  const G = geo();
  o.x = clamp(o.x, G.objSize * .6, pw - G.objSize * .6);
  o.y = clamp(o.y, G.sBottom + G.objSize * .6, G.ly - G.objSize * .75);
}
function addObj(e) {
  const G = geo();
  if (objs.length >= 6) objs.shift();
  const o = { e, x: pw * (.2 + Math.random() * .6), y: lerp(G.sBottom, G.ly, .45), flip: false, hue: Math.random() * 360 };
  keepIn(o); objs.push(o);
  sfx.whoosh();
}
function startPlay() {
  show('play');
  if (!objs.length) addObj('🐇');
  speak('Drag your friends close to the lamp to make giant shadows!');
}

function drawPlay(now) {
  const g = pg, G = geo();
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.fillStyle = '#140b30'; g.fillRect(0, 0, pw, ph);
  // light beam
  const beam = g.createLinearGradient(0, G.ly, 0, G.sy);
  beam.addColorStop(0, 'rgba(255,230,140,.55)'); beam.addColorStop(1, 'rgba(255,230,140,.08)');
  g.fillStyle = beam; g.beginPath(); g.moveTo(G.lx - 14, G.ly); g.lineTo(G.sx, G.sBottom); g.lineTo(G.sx + G.sw, G.sBottom); g.lineTo(G.lx + 14, G.ly); g.fill();
  // screen
  const grd = g.createRadialGradient(pw / 2, G.sh * .5, 10, pw / 2, G.sh * .5, G.sw * .7);
  grd.addColorStop(0, '#fffbe8'); grd.addColorStop(.65, '#ffe3a0'); grd.addColorStop(1, '#d9964a');
  g.fillStyle = grd; g.fillRect(G.sx, G.sy, G.sw, G.sh);
  g.fillStyle = '#d7263d'; g.fillRect(G.sx - 4, G.sy - 8, G.sw + 8, 10);
  // shadows (clipped to screen)
  g.save(); g.beginPath(); g.rect(G.sx, G.sy, G.sw, G.sh); g.clip();
  const scy = G.sy + G.sh * .55, D = G.ly - scy;
  objs.forEach(o => {
    const d = Math.max(30, G.ly - o.y), k = D / d;
    const s = Math.min(G.objSize * k * .9, G.sh * 1.7);
    const x = G.lx + (o.x - G.lx) * k * .8;
    const col = TINTS[tint] === 'rainbow' ? `hsla(${(o.hue + now / 20) % 360},80%,45%,1)` : TINTS[tint];
    g.save(); g.translate(x, scy + (s - G.objSize) * .08); if (o.flip) g.scale(-1, 1);
    drawEmoji(g, o.e, 0, 0, s, col, .88);
    g.restore();
  });
  g.restore();
  // stage floor line
  g.strokeStyle = 'rgba(255,210,63,.35)'; g.setLineDash([6, 8]); g.beginPath(); g.moveTo(10, G.sBottom + 4); g.lineTo(pw - 10, G.sBottom + 4); g.stroke(); g.setLineDash([]);
  // objects
  objs.forEach(o => {
    g.save(); g.translate(o.x, o.y); if (o.flip) g.scale(-1, 1);
    if (drag && drag.o === o) { g.shadowColor = 'rgba(255,210,63,.9)'; g.shadowBlur = 18; }
    drawEmoji(g, o.e, 0, 0, G.objSize, null, 1);
    g.restore();
  });
  // lamp
  const pulse = 1 + Math.sin(now / 300) * .06;
  const lg = g.createRadialGradient(G.lx, G.ly, 2, G.lx, G.ly, 40 * pulse);
  lg.addColorStop(0, 'rgba(255,255,220,1)'); lg.addColorStop(.35, 'rgba(255,220,100,.9)'); lg.addColorStop(1, 'rgba(255,200,60,0)');
  g.fillStyle = lg; g.beginPath(); g.arc(G.lx, G.ly, 40 * pulse, 0, Math.PI * 2); g.fill();
  g.fillStyle = '#6b4a2b'; g.fillRect(G.lx - 16, G.ly + 10, 32, 14);
  if (!touchedOnce && objs.length) {
    const o = objs[objs.length - 1];
    g.font = `bold ${Math.round(clamp(pw * .045, 14, 20))}px ${getComputedStyle(document.body).fontFamily}`;
    g.textAlign = 'center'; g.fillStyle = '#ffd23f';
    g.fillText('Drag me to the lamp! 👇', clamp(o.x, 110, pw - 110), o.y - G.objSize * .8 + Math.sin(now / 250) * 4);
  }
}

function pPos(ev) { const r = pc.getBoundingClientRect(); return { x: ev.clientX - r.left, y: ev.clientY - r.top }; }
pc.addEventListener('pointerdown', ev => {
  audio();
  const p = pPos(ev), G = geo();
  for (let i = objs.length - 1; i >= 0; i--) {
    const o = objs[i];
    if (Math.hypot(p.x - o.x, p.y - o.y) < G.objSize * .7) {
      objs.splice(i, 1); objs.push(o);
      drag = { o, dx: o.x - p.x, dy: o.y - p.y, sx: p.x, sy: p.y, moved: 0 };
      pc.setPointerCapture(ev.pointerId);
      break;
    }
  }
});
pc.addEventListener('pointermove', ev => {
  if (!drag) return;
  const p = pPos(ev);
  drag.moved = Math.max(drag.moved, Math.hypot(p.x - drag.sx, p.y - drag.sy));
  drag.o.x = p.x + drag.dx; drag.o.y = p.y + drag.dy; keepIn(drag.o);
  if (drag.moved > 10) touchedOnce = true;
});
const endDrag = () => {
  if (!drag) return;
  if (drag.moved < 8) { drag.o.flip = !drag.o.flip; sfx.flip(); }
  drag = null;
};
pc.addEventListener('pointerup', endDrag);
pc.addEventListener('pointercancel', endDrag);

function buildTray() {
  $('#tray').innerHTML = '';
  TRAY.forEach(e => {
    const b = document.createElement('button');
    b.textContent = e; b.setAttribute('aria-label', NAMES[e] || 'toy');
    b.onclick = () => { audio(); addObj(e); };
    $('#tray').appendChild(b);
  });
}

// ---------- confetti ----------
const fx = $('#fx'), fg = fx.getContext('2d');
let conf = [];
function fitFx() { fx.width = innerWidth * dpr; fx.height = innerHeight * dpr; }
function confetti(n) {
  for (let i = 0; i < n; i++) conf.push({
    x: Math.random() * innerWidth, y: -20 - Math.random() * innerHeight * .5,
    vx: (Math.random() - .5) * 2, vy: 2 + Math.random() * 3, r: Math.random() * 6.28, vr: (Math.random() - .5) * .3,
    w: 6 + Math.random() * 6, h: 10 + Math.random() * 8, c: `hsl(${Math.random() * 360},95%,60%)`
  });
}
function drawFx() {
  fg.setTransform(dpr, 0, 0, dpr, 0, 0);
  fg.clearRect(0, 0, innerWidth, innerHeight);
  for (let i = conf.length - 1; i >= 0; i--) {
    const p = conf[i];
    p.x += p.vx; p.y += p.vy; p.r += p.vr;
    if (p.y > innerHeight + 30) { conf.splice(i, 1); continue; }
    fg.save(); fg.translate(p.x, p.y); fg.rotate(p.r); fg.fillStyle = p.c; fg.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); fg.restore();
  }
}

// ---------- loop ----------
function loop(now) {
  if ($('#game').classList.contains('on')) drawScreen(now);
  if ($('#play').classList.contains('on')) drawPlay(now);
  if (conf.length || fx._dirty) { drawFx(); fx._dirty = conf.length > 0; }
  requestAnimationFrame(loop);
}

// ---------- wiring ----------
$('#sndMenu').onclick = toggleSound;
$('#sndGame').onclick = toggleSound;
$('#homeBtn').onclick = () => { sfx.click(); clearTimeout(nextTimer); round = null; show('menu'); };
$('#homeBtn2').onclick = () => { sfx.click(); show('menu'); };
$('#tintBtn').onclick = () => { tint = (tint + 1) % TINTS.length; sfx.flip(); };
$('#clearBtn').onclick = () => { objs = []; sfx.whoosh(); };
$('#nextBtn').onclick = () => { $('#win').classList.remove('on'); sfx.click(); startAct(actIdx === ACTS.length - 1 ? 0 : actIdx + 1); };
$('#menuBtn').onclick = () => { $('#win').classList.remove('on'); sfx.click(); round = null; show('menu'); };
addEventListener('resize', () => { fitFx(); if ($('#game').classList.contains('on')) fitScr(); if ($('#play').classList.contains('on')) fitPlay(); });

buildMenu(); buildTray(); syncSoundBtns(); fitFx();
requestAnimationFrame(loop);
</script>
</body>
</html>
