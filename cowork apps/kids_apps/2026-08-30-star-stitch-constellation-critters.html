<!-- CONCEPT: A cozy night-sky connect-the-dots game where kids tap glowing numbered stars in order to stitch friendly animal constellations that wake up with sparkles and chimes, plus a free Doodle Sky mode for inventing their own. -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Star Stitch</title>
<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0; padding: 0;
  touch-action: manipulation;
  user-select: none; -webkit-user-select: none;
  overflow: hidden;
  width: 100%; height: 100%;
}

:root {
  --sky-1: #251461;
  --sky-2: #46228c;
  --sky-3: #0d0a2e;
  --gold: #ffd76a;
  --pink: #ff77bd;
  --cyan: #6fe9ff;
  --lime: #bcff72;
  --panel: rgba(30, 18, 74, 0.86);
  --panel-edge: rgba(255, 215, 106, 0.45);
  --text: #fdf6ff;
  --font: "Comic Sans MS", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  --pad: clamp(8px, 2.6vw, 16px);
}

body {
  font-family: var(--font);
  color: var(--text);
  background: var(--sky-3);
}

#sky {
  position: fixed;
  inset: 0;
  z-index: 0;
}
#c { display: block; width: 100%; height: 100%; touch-action: none; }

#ui {
  position: fixed;
  inset: 0;
  z-index: 2;
  pointer-events: none;
  display: flex;
  flex-direction: column;
}
#ui > * { pointer-events: auto; }

/* ---------- buttons ---------- */
button {
  font-family: var(--font);
  font-weight: bold;
  color: var(--text);
  border: 3px solid var(--panel-edge);
  background: linear-gradient(180deg, rgba(96, 56, 168, 0.95), rgba(48, 26, 108, 0.95));
  border-radius: 18px;
  cursor: pointer;
  min-height: 44px;
  min-width: 44px;
  padding: 8px 14px;
  font-size: clamp(15px, 4vw, 20px);
  box-shadow: 0 4px 0 rgba(12, 6, 40, 0.7), 0 0 18px rgba(120, 80, 220, 0.35);
  transition: transform .08s ease, box-shadow .08s ease;
}
button:active {
  transform: translateY(3px);
  box-shadow: 0 1px 0 rgba(12, 6, 40, 0.7);
}

/* ---------- HUD ---------- */
#hud {
  display: none;
  align-items: center;
  gap: var(--pad);
  padding: var(--pad);
  padding-top: max(var(--pad), env(safe-area-inset-top));
}
#hud.on { display: flex; }
.icon-btn {
  width: 52px; height: 52px;
  padding: 0;
  font-size: clamp(20px, 5.5vw, 26px);
  border-radius: 16px;
  display: flex; align-items: center; justify-content: center;
  flex: 0 0 auto;
}
#hudTitle {
  flex: 1 1 auto;
  text-align: center;
  min-width: 0;
  background: var(--panel);
  border: 3px solid var(--panel-edge);
  border-radius: 18px;
  padding: 6px 8px;
  line-height: 1.15;
}
#hudTitle .line {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  min-width: 0;
}
#hudEmoji {
  font-size: clamp(16px, 4.6vw, 24px);
  flex: 0 0 auto;
}
#hudName {
  font-size: clamp(16px, 4.6vw, 24px);
  background: linear-gradient(90deg, var(--gold), var(--pink), var(--cyan));
  -webkit-background-clip: text; background-clip: text; color: transparent;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  min-width: 0;
}
#hudSub {
  display: block;
  font-size: clamp(12px, 3.2vw, 16px);
  color: #d8c9ff;
}

/* ---------- screens ---------- */
.screen {
  position: absolute;
  inset: 0;
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: var(--pad);
  padding: var(--pad);
  padding-top: max(var(--pad), env(safe-area-inset-top));
  padding-bottom: max(var(--pad), env(safe-area-inset-bottom));
  overflow-y: auto;
}
.screen.on { display: flex; }

#home h1 {
  margin: 0;
  font-size: clamp(30px, 10vw, 54px);
  letter-spacing: 1px;
  background: linear-gradient(90deg, var(--gold), var(--pink), var(--cyan), var(--lime));
  -webkit-background-clip: text; background-clip: text; color: transparent;
  text-align: center;
  filter: drop-shadow(0 0 14px rgba(255, 180, 255, 0.35));
}
#home .tag {
  margin: -4px 0 2px;
  font-size: clamp(13px, 3.6vw, 18px);
  color: #d9c9ff;
  text-align: center;
}

#grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: clamp(6px, 2vw, 12px);
  width: 100%;
  max-width: 520px;
}
.tile {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  aspect-ratio: 1 / 1;
  min-height: 74px;
  padding: 4px;
  border-radius: 20px;
  background: linear-gradient(180deg, rgba(104, 62, 178, 0.95), rgba(44, 24, 100, 0.95));
  position: relative;
  overflow: hidden;
}
.tile .em { font-size: clamp(26px, 8vw, 40px); line-height: 1; }
.tile .lbl { font-size: clamp(10px, 2.8vw, 13px); color: #e6dbff; }
.tile.done { border-color: var(--gold); box-shadow: 0 4px 0 rgba(12,6,40,.7), 0 0 20px rgba(255, 215, 106, .5); }
.tile .chk {
  position: absolute; top: 3px; right: 5px;
  font-size: clamp(12px, 3.4vw, 16px);
  opacity: 0;
}
.tile.done .chk { opacity: 1; }

.wide {
  width: 100%;
  max-width: 520px;
  font-size: clamp(17px, 4.6vw, 24px);
  padding: 14px;
  background: linear-gradient(180deg, rgba(255, 119, 189, .95), rgba(150, 40, 130, .95));
}
#homeFoot {
  display: flex; gap: var(--pad); align-items: center; justify-content: center;
  width: 100%; max-width: 520px;
}
#starCount {
  font-size: clamp(13px, 3.6vw, 17px);
  color: var(--gold);
  background: var(--panel);
  border: 3px solid var(--panel-edge);
  border-radius: 16px;
  padding: 8px 12px;
  flex: 1 1 auto;
  text-align: center;
}

/* ---------- bottom bars ---------- */
.bar {
  margin-top: auto;
  display: none;
  gap: var(--pad);
  padding: var(--pad);
  padding-bottom: max(var(--pad), env(safe-area-inset-bottom));
  justify-content: center;
  align-items: center;
  flex-wrap: wrap;
}
.bar.on { display: flex; }
.bar button { flex: 1 1 40%; max-width: 220px; }

#winBar { position: relative; z-index: 3; }
#winBar .cheer {
  width: 100%;
  text-align: center;
  font-size: clamp(18px, 5.4vw, 28px);
  color: var(--gold);
  text-shadow: 0 0 14px rgba(255, 200, 120, .8);
}

#hint {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  bottom: 96px;
  background: var(--panel);
  border: 3px solid var(--panel-edge);
  border-radius: 999px;
  padding: 8px 16px;
  font-size: clamp(13px, 3.6vw, 17px);
  color: #ffe9b8;
  pointer-events: none;
  opacity: 0;
  transition: opacity .3s ease;
  white-space: nowrap;
  z-index: 3;
}
#hint.on { opacity: 1; }
</style>
</head>
<body>

<div id="sky"><canvas id="c"></canvas></div>

<div id="ui">

  <header id="hud">
    <button class="icon-btn" id="btnBack" aria-label="Back to menu">🏠</button>
    <div id="hudTitle">
      <span class="line"><span id="hudEmoji">✨</span><span id="hudName">Star Stitch</span></span>
      <span id="hudSub">Tap star 1</span>
    </div>
    <button class="icon-btn" id="btnSound" aria-label="Sound on or off">🔊</button>
    <button class="icon-btn" id="btnRestart" aria-label="Start over">🔄</button>
  </header>

  <div class="screen on" id="home">
    <h1>✨ Star Stitch ✨</h1>
    <p class="tag">Tap the twinkly stars in order<br>and wake up a sky critter!</p>
    <div id="grid"></div>
    <button class="wide" id="btnDoodle">🎨 Doodle Sky — make your own!</button>
    <div id="homeFoot">
      <div id="starCount">⭐ 0 of 8 critters awake</div>
      <button class="icon-btn" id="btnSound2" aria-label="Sound on or off">🔊</button>
    </div>
  </div>

  <div class="bar" id="playBar"></div>

  <div class="bar" id="winBar">
    <div class="cheer" id="cheerText">Hooray!</div>
    <button id="btnAgain">🔄 Again</button>
    <button id="btnNext">➡️ Next Critter</button>
  </div>

  <div class="bar" id="doodleBar">
    <button id="btnTwinkle">✨ Twinkle!</button>
    <button id="btnClear">🧹 Clear</button>
  </div>

  <div id="hint"></div>
</div>

<script>
(() => {
'use strict';

/* ================= constellation data (normalized 0..1) ================= */
const CRITTERS = [
  { id:'fish', name:'Fish', emoji:'🐠', color:'#6fe9ff', close:true, pts:[
    [0.20,0.50],[0.38,0.32],[0.60,0.34],[0.80,0.22],[0.80,0.74],[0.60,0.62],[0.38,0.68]
  ]},
  { id:'cat', name:'Kitty', emoji:'🐱', color:'#ffd76a', close:true, pts:[
    [0.30,0.24],[0.42,0.40],[0.58,0.40],[0.70,0.24],[0.74,0.52],[0.62,0.72],[0.38,0.72],[0.26,0.52]
  ]},
  { id:'bunny', name:'Bunny', emoji:'🐰', color:'#ff9ede', close:true, pts:[
    [0.34,0.12],[0.43,0.40],[0.57,0.12],[0.64,0.40],[0.72,0.56],[0.62,0.72],[0.42,0.76],[0.30,0.62],[0.32,0.44]
  ]},
  { id:'puppy', name:'Puppy', emoji:'🐶', color:'#ffb066', close:true, pts:[
    [0.16,0.38],[0.28,0.26],[0.40,0.44],[0.52,0.28],[0.72,0.30],[0.82,0.20],[0.78,0.50],[0.68,0.74],[0.40,0.74],[0.26,0.54]
  ]},
  { id:'turtle', name:'Turtle', emoji:'🐢', color:'#bcff72', close:true, pts:[
    [0.18,0.44],[0.32,0.34],[0.50,0.28],[0.68,0.34],[0.80,0.48],[0.72,0.60],[0.76,0.76],[0.50,0.68],[0.28,0.78],[0.24,0.58]
  ]},
  { id:'whale', name:'Whale', emoji:'🐳', color:'#7fb2ff', close:true, pts:[
    [0.14,0.50],[0.26,0.36],[0.46,0.30],[0.64,0.34],[0.80,0.22],[0.90,0.42],[0.80,0.58],[0.62,0.60],[0.52,0.78],[0.40,0.68],[0.24,0.66]
  ]},
  { id:'butterfly', name:'Butterfly', emoji:'🦋', color:'#c79bff', close:true, pts:[
    [0.50,0.24],[0.28,0.10],[0.14,0.34],[0.38,0.46],[0.20,0.68],[0.46,0.60],[0.50,0.86],[0.54,0.60],[0.80,0.68],[0.62,0.46],[0.86,0.34],[0.72,0.10]
  ]},
  { id:'dragon', name:'Dragon', emoji:'🐉', color:'#ff7a7a', close:true, pts:[
    [0.10,0.46],[0.22,0.34],[0.30,0.18],[0.36,0.38],[0.48,0.28],[0.56,0.08],[0.72,0.22],[0.62,0.38],[0.80,0.44],[0.90,0.60],[0.72,0.70],[0.56,0.62],[0.40,0.76],[0.22,0.60]
  ]}
];

const CHEERS = ['Hooray!','You did it!','Wow!','Amazing!','Star power!','Beautiful!','Twinkle twinkle!','So cool!'];
const DOODLE_A = ['Sleepy','Giggly','Bouncy','Sparkly','Wiggly','Silly','Cozy','Zooming','Fluffy','Jellybean'];
const DOODLE_B = ['Noodle','Comet','Muffin','Pickle','Bubble','Squiggle','Pancake','Dino','Sock','Moonbeam'];

/* ================= storage ================= */
const KEY_DONE = 'cowork-starstitch-done';
const KEY_SOUND = 'cowork-starstitch-sound';
let done = new Set();
try { const raw = localStorage.getItem(KEY_DONE); if (raw) done = new Set(JSON.parse(raw)); } catch (e) {}
let soundOn = true;
try { if (localStorage.getItem(KEY_SOUND) === '0') soundOn = false; } catch (e) {}
const saveDone = () => { try { localStorage.setItem(KEY_DONE, JSON.stringify([...done])); } catch (e) {} };

/* ================= audio ================= */
let AC = null;
function ac() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }
  if (AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(freq, dur, type, vol, delay) {
  if (!soundOn) return;
  const a = ac(); if (!a) return;
  dur = dur || 0.18; type = type || 'sine'; vol = vol == null ? 0.16 : vol; delay = delay || 0;
  const t = a.currentTime + delay;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(a.destination);
  o.start(t); o.stop(t + dur + 0.06);
}
const SCALE = [523.25, 587.33, 659.25, 783.99, 880.00, 1046.50, 1174.66, 1318.51, 1567.98, 1760.00, 2093.00, 2349.32, 2637.02, 3135.96];
function sfxStitch(i) {
  tone(SCALE[Math.min(i, SCALE.length - 1)], 0.24, 'triangle', 0.16);
  tone(SCALE[Math.min(i, SCALE.length - 1)] * 2, 0.14, 'sine', 0.06, 0.01);
}
function sfxOops() { tone(233.08, 0.16, 'sine', 0.09); tone(196.00, 0.20, 'sine', 0.07, 0.07); }
function sfxWin() {
  const notes = [523.25, 659.25, 783.99, 1046.50, 1318.51, 1567.98, 2093.00];
  notes.forEach((f, i) => { tone(f, 0.42, 'triangle', 0.15, i * 0.09); tone(f * 2, 0.3, 'sine', 0.05, i * 0.09); });
  for (let i = 0; i < 10; i++) tone(1400 + Math.random() * 1600, 0.16, 'sine', 0.05, 0.65 + i * 0.05);
}
function sfxSparkle() { for (let i = 0; i < 8; i++) tone(900 + Math.random() * 1800, 0.2, 'sine', 0.06, i * 0.05); }
function sfxPlace(n) { tone(392 + (n % 8) * 55, 0.14, 'triangle', 0.12); }

/* ================= canvas ================= */
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;
let bgStars = [], shooters = [];

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2.5);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  bgStars = [];
  const n = Math.round((W * H) / 5200);
  for (let i = 0; i < n; i++) {
    bgStars.push({ x: Math.random() * W, y: Math.random() * H, r: 0.5 + Math.random() * 1.7,
      ph: Math.random() * Math.PI * 2, sp: 0.6 + Math.random() * 1.6, hue: Math.random() < 0.22 ? 45 : 220 });
  }
}
window.addEventListener('resize', resize);
resize();

/* play box geometry */
function box() {
  const topPad = (mode === 'play' || mode === 'doodle') ? 92 : 40;
  const botPad = 104;
  const availW = W - 20, availH = H - topPad - botPad;
  const side = Math.max(180, Math.min(availW, availH, 620));
  return { x: (W - side) / 2, y: topPad + (availH - side) / 2, s: side };
}
/* Each critter is scaled up to fill the play box (aspect preserved) so the
   figure is big and the stars sit far apart — easier for small fingers. */
function fitFor(c) {
  if (c._fit) return c._fit;
  let minx = 1, miny = 1, maxx = 0, maxy = 0;
  for (const [x, y] of c.pts) {
    if (x < minx) minx = x; if (x > maxx) maxx = x;
    if (y < miny) miny = y; if (y > maxy) maxy = y;
  }
  const w = Math.max(0.001, maxx - minx), h = Math.max(0.001, maxy - miny);
  const M = 0.09, avail = 1 - 2 * M;
  const k = avail / Math.max(w, h);
  c._fit = { minx, miny, k, ox: M + (avail - w * k) / 2, oy: M + (avail - h * k) / 2 };
  return c._fit;
}
function toPx(p, c) {
  const b = box(), f = fitFor(c || level);
  return { x: b.x + b.s * (f.ox + (p[0] - f.minx) * f.k),
           y: b.y + b.s * (f.oy + (p[1] - f.miny) * f.k) };
}
function hitR() { const b = box(); return Math.max(32, b.s * 0.085); }

/* ================= game state ================= */
let mode = 'home';           // home | play | doodle
let level = null;            // critter object
let cur = 0;                 // number of stars already stitched
let segT = 1;                // growth of newest segment 0..1
let wobble = null;           // {i, t}
let revealT = 0;             // 0..1 reveal animation
let winShown = false;
let parts = [];
let doodlePts = [];
let doodleTwinkle = 0;
let hintTimer = 0;

const $ = id => document.getElementById(id);
const hud = $('hud'), home = $('home'), winBar = $('winBar'), doodleBar = $('doodleBar');
const hudName = $('hudName'), hudEmoji = $('hudEmoji'), hudSub = $('hudSub'), hintEl = $('hint');

function showHint(text, ms) {
  hintEl.textContent = text;
  hintEl.classList.add('on');
  clearTimeout(hintTimer);
  hintTimer = setTimeout(() => hintEl.classList.remove('on'), ms || 2200);
}
function hideHint() { clearTimeout(hintTimer); hintEl.classList.remove('on'); }

/* ================= particles ================= */
function burst(x, y, n, color, power) {
  power = power || 1;
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = (0.6 + Math.random() * 3.2) * power;
    parts.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 0.6 * power,
      life: 1, decay: 0.008 + Math.random() * 0.014, r: 1.6 + Math.random() * 3.4,
      color: color, spin: Math.random() * Math.PI });
  }
  if (parts.length > 900) parts.splice(0, parts.length - 900);
}
function confetti() {
  const cols = ['#ffd76a', '#ff77bd', '#6fe9ff', '#bcff72', '#c79bff', '#ffffff'];
  for (let i = 0; i < 140; i++) {
    parts.push({ x: Math.random() * W, y: -20 - Math.random() * H * 0.5,
      vx: (Math.random() - 0.5) * 1.6, vy: 1.4 + Math.random() * 2.6,
      life: 1, decay: 0.004 + Math.random() * 0.005, r: 2 + Math.random() * 4,
      color: cols[(Math.random() * cols.length) | 0], spin: Math.random() * Math.PI, grav: 0.012 });
  }
}

/* ================= drawing helpers ================= */
function starPath(x, y, r, spikes) {
  spikes = spikes || 4;
  ctx.beginPath();
  const inner = r * 0.36;
  for (let i = 0; i < spikes * 2; i++) {
    const rad = i % 2 === 0 ? r : inner;
    const a = (Math.PI / spikes) * i - Math.PI / 2;
    const px = x + Math.cos(a) * rad, py = y + Math.sin(a) * rad;
    i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
  }
  ctx.closePath();
}
function glowLine(a, b, color, width, blur, alpha) {
  ctx.save();
  ctx.globalAlpha = alpha == null ? 1 : alpha;
  ctx.strokeStyle = color;
  ctx.lineWidth = width;
  ctx.lineCap = 'round';
  ctx.shadowColor = color;
  ctx.shadowBlur = blur;
  ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
  ctx.restore();
}

function drawBackground(t) {
  const g = ctx.createLinearGradient(0, 0, W * 0.3, H);
  g.addColorStop(0, '#3a1c78');
  g.addColorStop(0.45, '#251461');
  g.addColorStop(1, '#0c0926');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  // soft nebulas
  const nb = [[0.18, 0.22, 'rgba(255,119,189,0.16)'], [0.82, 0.34, 'rgba(111,233,255,0.13)'], [0.5, 0.9, 'rgba(188,255,114,0.09)']];
  for (const [nx, ny, col] of nb) {
    const r = Math.max(W, H) * 0.45;
    const rg = ctx.createRadialGradient(nx * W, ny * H, 0, nx * W, ny * H, r);
    rg.addColorStop(0, col); rg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = rg; ctx.fillRect(0, 0, W, H);
  }

  // twinkling background stars
  for (const s of bgStars) {
    const tw = 0.45 + 0.55 * (0.5 + 0.5 * Math.sin(t * s.sp + s.ph));
    ctx.globalAlpha = tw * 0.9;
    ctx.fillStyle = s.hue === 45 ? '#ffe9a8' : '#eaf0ff';
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // occasional shooting star
  if (Math.random() < 0.0035 && shooters.length < 2) {
    shooters.push({ x: Math.random() * W * 0.7, y: Math.random() * H * 0.4, vx: 4 + Math.random() * 3, vy: 1.6 + Math.random() * 1.4, life: 1 });
  }
  for (let i = shooters.length - 1; i >= 0; i--) {
    const s = shooters[i];
    s.x += s.vx; s.y += s.vy; s.life -= 0.012;
    if (s.life <= 0 || s.x > W + 60) { shooters.splice(i, 1); continue; }
    ctx.save();
    ctx.globalAlpha = Math.max(0, s.life) * 0.9;
    ctx.strokeStyle = '#fff8d8'; ctx.lineWidth = 2; ctx.lineCap = 'round';
    ctx.shadowColor = '#ffe9a8'; ctx.shadowBlur = 12;
    ctx.beginPath(); ctx.moveTo(s.x, s.y); ctx.lineTo(s.x - s.vx * 11, s.y - s.vy * 11); ctx.stroke();
    ctx.restore();
  }
}

function drawParticles() {
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.x += p.vx; p.y += p.vy;
    p.vy += p.grav == null ? 0.045 : p.grav;
    p.vx *= 0.992;
    p.life -= p.decay;
    if (p.life <= 0 || p.y > H + 40) { parts.splice(i, 1); continue; }
    ctx.save();
    ctx.globalAlpha = Math.max(0, Math.min(1, p.life));
    ctx.fillStyle = p.color;
    ctx.shadowColor = p.color; ctx.shadowBlur = 10;
    starPath(p.x, p.y, p.r * (0.6 + p.life * 0.9), 4);
    ctx.fill();
    ctx.restore();
  }
}

/* ================= level rendering ================= */
function drawLevel(t) {
  const pts = level.pts.map(p => toPx(p));
  const col = level.color;
  const b = box();
  const R = Math.max(7, Math.min(15, b.s * 0.028));
  const complete = cur >= pts.length;

  // filled body glow after reveal
  if (revealT > 0) {
    ctx.save();
    ctx.globalAlpha = 0.20 * revealT;
    ctx.fillStyle = col;
    ctx.shadowColor = col; ctx.shadowBlur = 40 * revealT;
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  // stitched segments
  const drawn = Math.max(0, cur - 1);
  for (let i = 0; i < drawn; i++) {
    const a = pts[i], bb = pts[i + 1];
    const isLast = (i === drawn - 1);
    const k = isLast ? segT : 1;
    const end = { x: a.x + (bb.x - a.x) * k, y: a.y + (bb.y - a.y) * k };
    const pulse = complete ? (0.75 + 0.25 * Math.sin(t * 4 + i * 0.5)) : 1;
    glowLine(a, end, '#ffffff', 6.5, 22 * pulse, 0.95);
    glowLine(a, end, col, 3, 26 * pulse, 1);
  }
  // closing segment
  if (complete && level.close) {
    const k = segT;
    const a = pts[pts.length - 1], bb = pts[0];
    const end = { x: a.x + (bb.x - a.x) * k, y: a.y + (bb.y - a.y) * k };
    const pulse = 0.75 + 0.25 * Math.sin(t * 4);
    glowLine(a, end, '#ffffff', 6.5, 22 * pulse, 0.95);
    glowLine(a, end, col, 3, 26 * pulse, 1);
  }

  // stars
  for (let i = 0; i < pts.length; i++) {
    const p = pts[i];
    const isDone = i < cur;
    const isNext = i === cur && !complete;
    let ox = 0, oy = 0, extra = 1;
    if (wobble && wobble.i === i) {
      const w = wobble.t;
      ox = Math.sin(w * 34) * 7 * (1 - w);
      extra = 1 + 0.18 * (1 - w);
    }
    const x = p.x + ox, y = p.y + oy;

    if (isNext) {
      const ring = (t * 1.5) % 1;
      ctx.save();
      ctx.globalAlpha = (1 - ring) * 0.85;
      ctx.strokeStyle = '#ffd76a'; ctx.lineWidth = 4;
      ctx.shadowColor = '#ffd76a'; ctx.shadowBlur = 20;
      ctx.beginPath(); ctx.arc(x, y, R * 1.5 + ring * R * 3.2, 0, Math.PI * 2); ctx.stroke();
      ctx.restore();
    }

    const pump = isNext ? 1 + 0.16 * Math.sin(t * 6) : 1;
    const rr = R * pump * extra * (isDone ? 1.06 : 1);

    ctx.save();
    ctx.fillStyle = isDone ? col : (isNext ? '#ffd76a' : '#c9d4ff');
    ctx.shadowColor = isDone ? col : (isNext ? '#ffd76a' : '#7f8fd0');
    ctx.shadowBlur = isNext ? 30 : (isDone ? 22 : 8);
    ctx.globalAlpha = isDone || isNext ? 1 : 0.72;
    starPath(x, y, rr * 1.55, 4); ctx.fill();
    ctx.beginPath(); ctx.arc(x, y, rr * 0.62, 0, Math.PI * 2);
    ctx.fillStyle = '#ffffff'; ctx.fill();
    ctx.restore();

    // number label
    if (!complete) {
      const fs = Math.max(13, Math.min(22, R * 1.5));
      ctx.save();
      ctx.font = 'bold ' + fs + 'px ' + getComputedStyle(document.body).fontFamily;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      const lx = x + R * 1.9, ly = y - R * 1.9;
      ctx.globalAlpha = isDone ? 0.35 : 1;
      ctx.fillStyle = 'rgba(16,10,44,0.82)';
      ctx.beginPath(); ctx.arc(lx, ly, fs * 0.78, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = isNext ? '#ffd76a' : '#ffffff';
      ctx.fillText(String(i + 1), lx, ly + 1);
      ctx.restore();
    }
  }

  // reveal: big emoji + name
  if (revealT > 0) {
    let cxm = 0, cym = 0;
    for (const p of pts) { cxm += p.x; cym += p.y; }
    cxm /= pts.length; cym /= pts.length;
    const e = revealT;
    const overshoot = e < 1 ? 1 + Math.sin(e * Math.PI) * 0.35 : 1 + Math.sin(t * 2.4) * 0.05;
    const size = b.s * 0.30 * Math.min(1, e * 1.6) * overshoot;
    ctx.save();
    ctx.globalAlpha = Math.min(1, e * 1.4);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = size + 'px serif';
    ctx.shadowColor = col; ctx.shadowBlur = 34;
    ctx.fillText(level.emoji, cxm, cym - b.s * 0.02);
    ctx.restore();
  }
}

function drawDoodle(t) {
  const col = ['#ffd76a', '#ff77bd', '#6fe9ff', '#bcff72', '#c79bff', '#ffb066'];
  for (let i = 0; i < doodlePts.length - 1; i++) {
    const a = doodlePts[i], bb = doodlePts[i + 1];
    const c = col[i % col.length];
    const pulse = 0.7 + 0.3 * Math.sin(t * 3 + i);
    glowLine(a, bb, '#ffffff', 6, 18 * pulse, 0.9);
    glowLine(a, bb, c, 2.6, 24 * pulse, 1);
  }
  for (let i = 0; i < doodlePts.length; i++) {
    const p = doodlePts[i];
    const c = col[i % col.length];
    const pump = 1 + 0.12 * Math.sin(t * 4 + i * 0.7) + doodleTwinkle * 0.5;
    ctx.save();
    ctx.fillStyle = c; ctx.shadowColor = c; ctx.shadowBlur = 24;
    starPath(p.x, p.y, 15 * pump, 4); ctx.fill();
    ctx.beginPath(); ctx.arc(p.x, p.y, 5 * pump, 0, Math.PI * 2);
    ctx.fillStyle = '#fff'; ctx.fill();
    ctx.restore();
  }
  if (doodlePts.length === 0) {
    ctx.save();
    ctx.globalAlpha = 0.55 + 0.25 * Math.sin(t * 2);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = 'bold ' + Math.max(16, Math.min(26, W * 0.05)) + 'px ' + getComputedStyle(document.body).fontFamily;
    ctx.fillStyle = '#e6dbff';
    ctx.fillText('Tap the sky to place stars ✨', W / 2, H / 2);
    ctx.restore();
  }
}

/* ================= main loop ================= */
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  const t = now / 1000;

  drawBackground(t);

  if (segT < 1) segT = Math.min(1, segT + dt * 4.5);
  if (wobble) { wobble.t += dt * 2.6; if (wobble.t >= 1) wobble = null; }
  if (doodleTwinkle > 0) doodleTwinkle = Math.max(0, doodleTwinkle - dt * 1.6);

  if (mode === 'play' && level) {
    if (cur >= level.pts.length && segT >= 1) revealT = Math.min(1, revealT + dt * 1.1);
    drawLevel(t);
    if (revealT >= 0.55 && !winShown) showWin();
  } else if (mode === 'doodle') {
    drawDoodle(t);
  }

  drawParticles();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ================= interaction ================= */
function evPos(e) {
  const r = cv.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}
let pointerDown = false;

cv.addEventListener('pointerdown', e => {
  e.preventDefault();
  ac();
  pointerDown = true;
  if (mode === 'play') tryStitch(evPos(e), true);
  else if (mode === 'doodle') addDoodle(evPos(e));
});
cv.addEventListener('pointermove', e => {
  if (!pointerDown || mode !== 'play') return;
  tryStitch(evPos(e), false);
});
const endPtr = () => { pointerDown = false; };
cv.addEventListener('pointerup', endPtr);
cv.addEventListener('pointercancel', endPtr);
cv.addEventListener('pointerleave', endPtr);

function tryStitch(p, allowWrong) {
  if (!level || cur >= level.pts.length) return;
  const pts = level.pts.map(p => toPx(p));
  const r = hitR();
  const next = pts[cur];
  const dn = Math.hypot(p.x - next.x, p.y - next.y);

  if (dn <= r) {
    cur++;
    segT = cur > 1 ? 0 : 1;
    sfxStitch(cur - 1);
    burst(next.x, next.y, 14, level.color, 0.9);
    updateHud();
    if (cur >= level.pts.length) finishLevel();
    return;
  }
  if (!allowWrong) return;

  // nearest other star -> gentle wobble, never a fail
  let best = -1, bd = r;
  for (let i = 0; i < pts.length; i++) {
    if (i === cur) continue;
    const d = Math.hypot(p.x - pts[i].x, p.y - pts[i].y);
    if (d < bd) { bd = d; best = i; }
  }
  if (best >= 0) {
    wobble = { i: best, t: 0 };
    sfxOops();
    showHint('Try the glowing star ' + (cur + 1) + ' ⭐', 1800);
  }
}

function finishLevel() {
  segT = level.close ? 0 : 1;
  revealT = 0;
  done.add(level.id); saveDone();
  const pts = level.pts.map(p => toPx(p));
  for (let i = 0; i < pts.length; i++) {
    setTimeout(() => burst(pts[i].x, pts[i].y, 16, level.color, 1.3), i * 55);
  }
  setTimeout(confetti, 260);
  sfxWin();
  updateHud();
}

function addDoodle(p) {
  if (doodlePts.length >= 40) { showHint('That is a big constellation! 🧹 Clear to start over.', 2400); return; }
  doodlePts.push(p);
  sfxPlace(doodlePts.length);
  burst(p.x, p.y, 12, '#ffd76a', 0.9);
  updateHud();
}

/* ================= screens & UI ================= */
function setMode(m) {
  mode = m;
  home.classList.toggle('on', m === 'home');
  hud.classList.toggle('on', m !== 'home');
  doodleBar.classList.toggle('on', m === 'doodle');
  winBar.classList.remove('on');
  winShown = false;
  hideHint();
}

function updateHud() {
  if (mode === 'doodle') {
    hudEmoji.textContent = '🎨';
    hudName.textContent = 'Doodle Sky';
    hudSub.textContent = doodlePts.length ? doodlePts.length + ' stars placed' : 'Tap the sky!';
    return;
  }
  if (!level) return;
  const total = level.pts.length;
  if (cur >= total) {
    hudEmoji.textContent = level.emoji;
    hudName.textContent = level.name + '!';
    hudSub.textContent = 'All ' + total + ' stars stitched!';
  } else {
    hudEmoji.textContent = '❓';
    hudName.textContent = 'Who is it?';
    hudSub.textContent = 'Tap star ' + (cur + 1) + '  •  ' + cur + ' / ' + total;
  }
}

function startLevel(c) {
  level = c; cur = 0; segT = 1; revealT = 0; wobble = null; parts = [];
  setMode('play');
  updateHud();
  showHint('Tap the glowing star ⭐', 2600);
}

function showWin() {
  winShown = true;
  $('cheerText').textContent = CHEERS[(Math.random() * CHEERS.length) | 0] + ' It is a ' + level.name + '! ' + level.emoji;
  const idx = CRITTERS.indexOf(level);
  $('btnNext').style.display = idx < CRITTERS.length - 1 ? '' : 'none';
  winBar.classList.add('on');
}

function buildGrid() {
  const g = $('grid');
  g.innerHTML = '';
  CRITTERS.forEach(c => {
    const b = document.createElement('button');
    b.className = 'tile' + (done.has(c.id) ? ' done' : '');
    b.innerHTML = '<span class="chk">⭐</span><span class="em">' + c.emoji + '</span><span class="lbl">' + c.pts.length + ' stars</span>';
    b.setAttribute('aria-label', c.name + ', ' + c.pts.length + ' stars');
    b.addEventListener('click', () => { ac(); startLevel(c); });
    g.appendChild(b);
  });
  $('starCount').textContent = '⭐ ' + done.size + ' of ' + CRITTERS.length + ' critters awake';
}
buildGrid();

function goHome() { level = null; setMode('home'); buildGrid(); }

$('btnBack').addEventListener('click', goHome);
$('btnRestart').addEventListener('click', () => {
  if (mode === 'doodle') { doodlePts = []; updateHud(); return; }
  if (level) startLevel(level);
});
$('btnAgain').addEventListener('click', () => { if (level) startLevel(level); });
$('btnNext').addEventListener('click', () => {
  const idx = CRITTERS.indexOf(level);
  if (idx >= 0 && idx < CRITTERS.length - 1) startLevel(CRITTERS[idx + 1]);
  else goHome();
});
$('btnDoodle').addEventListener('click', () => {
  ac();
  doodlePts = []; level = null; parts = [];
  setMode('doodle');
  updateHud();
  showHint('Tap anywhere to place stars ✨', 2600);
});
$('btnTwinkle').addEventListener('click', () => {
  if (doodlePts.length < 2) { showHint('Place a few stars first! ⭐', 2000); return; }
  doodleTwinkle = 1;
  doodlePts.forEach((p, i) => setTimeout(() => burst(p.x, p.y, 18, '#ffd76a', 1.3), i * 50));
  confetti(); sfxSparkle();
  const nm = DOODLE_A[(Math.random() * DOODLE_A.length) | 0] + ' ' + DOODLE_B[(Math.random() * DOODLE_B.length) | 0];
  showHint('✨ You made The ' + nm + '! ✨', 4000);
});
$('btnClear').addEventListener('click', () => { doodlePts = []; parts = []; updateHud(); });

function toggleSound() {
  soundOn = !soundOn;
  try { localStorage.setItem(KEY_SOUND, soundOn ? '1' : '0'); } catch (e) {}
  const icon = soundOn ? '🔊' : '🔇';
  $('btnSound').textContent = icon; $('btnSound2').textContent = icon;
  if (soundOn) { ac(); tone(880, 0.16, 'triangle', 0.14); }
}
$('btnSound').addEventListener('click', toggleSound);
$('btnSound2').addEventListener('click', toggleSound);
$('btnSound').textContent = soundOn ? '🔊' : '🔇';
$('btnSound2').textContent = soundOn ? '🔊' : '🔇';

// tapping the sky after a win moves on too
cv.addEventListener('pointerup', () => {
  if (mode === 'play' && winShown && revealT >= 1) { /* buttons handle it */ }
});

window.addEventListener('keydown', e => { if (e.key === 'Escape' && mode !== 'home') goHome(); });

})();
</script>
</body>
