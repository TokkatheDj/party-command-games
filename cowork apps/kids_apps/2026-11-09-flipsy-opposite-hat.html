<!-- CONCEPT: LEARNING (opposites) - Flipsy's Opposite Hat: drop a picture (HOT, BIG, DAY, ASLEEP...) into Flipsy the bunny's magic hat and tap the card that pops out as its OPPOSITE; three shows (2, 3, then 4 cards with a sneaky "that's the same!" trap), a Magic Hat free-play where any of 46 things flips into its opposite, read-aloud words and a saved Pair Book of opposites found. No losing - a wrong card just wiggles. Ages 4-8. [style: Comic Panel / sound: Cartoon FX] -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Flipsy's Opposite Hat</title>
<style>
:root{
  --bg:#fff8dc; --panel:#ffffff; --text:#111111; --muted:#4a4a4a;
  --btn:#c8102e; --btn-text:#ffffff; --hi:#ffd23f; --hi-text:#111111;
  --dot:#f1dc9a; --ink:#111111; --ok:#1e854a;
  --head:'Bangers','Comic Neue','Comic Sans MS','Chalkboard SE','Trebuchet MS',cursive;
  --body:'Comic Neue','Comic Sans MS','Chalkboard SE','Trebuchet MS',cursive;
  --gap:clamp(8px,2.2vw,14px);
}
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none;
  background-color:var(--bg);
  background-image:radial-gradient(var(--dot) 1.6px, transparent 1.8px);background-size:14px 14px;
  color:var(--text);font-family:var(--body);}
button{font-family:inherit;cursor:pointer;color:inherit}
.app{height:100%;display:flex;flex-direction:column;max-width:760px;margin:0 auto;padding:var(--gap);gap:var(--gap)}
header{display:flex;align-items:center;gap:8px}
h1{font-family:var(--head);font-weight:900;letter-spacing:1px;margin:0;font-size:clamp(26px,7.4vw,44px);line-height:1;
  color:var(--btn);text-shadow:2px 2px 0 var(--ink);flex:1}
.tog{min-width:48px;min-height:48px;border:3px solid var(--ink);background:var(--panel);font-weight:800;font-size:clamp(12px,3.2vw,15px);
  padding:4px 8px;box-shadow:3px 3px 0 var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05}
.tog .ic{font-size:20px}
.tog[aria-pressed="false"]{background:#e9e4d4}
.tog[aria-pressed="false"] .ic{filter:grayscale(1)}
.screen{flex:1;min-height:0;display:none;flex-direction:column;gap:var(--gap)}
.screen.on{display:flex}
.panel{background:var(--panel);border:4px solid var(--ink);box-shadow:5px 5px 0 var(--ink);padding:var(--gap)}
.desc{margin:0;font-size:clamp(15px,4vw,19px);font-weight:700}
.big{font-family:var(--head);font-weight:900;letter-spacing:1px;font-size:clamp(20px,5.6vw,28px);min-height:60px;border:4px solid var(--ink);
  background:var(--btn);color:var(--btn-text);box-shadow:4px 4px 0 var(--ink);padding:8px 14px;display:flex;align-items:center;gap:10px;justify-content:center}
.big:active,.card:active,.tray button:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.big.yellow{background:var(--hi);color:var(--hi-text)}
.big.white{background:var(--panel);color:var(--text)}
.big .sub{font-family:var(--body);font-size:clamp(13px,3.4vw,16px);font-weight:700;letter-spacing:0;display:block}
.big .lft{text-align:left;flex:1}
.big .stars{font-size:clamp(16px,4.4vw,22px);white-space:nowrap}
.menu-list{display:flex;flex-direction:column;gap:var(--gap);overflow-y:auto;padding:2px 6px 8px 2px}
.menu-hero{display:flex;align-items:center;gap:10px}
.menu-hero .bun{font-size:clamp(52px,15vw,80px);line-height:1}
/* stage */
.stage{position:relative;flex:1;min-height:210px;display:flex;align-items:flex-end;justify-content:center;overflow:hidden;padding-bottom:6px}
.bubble{position:relative;background:var(--panel);border:4px solid var(--ink);border-radius:22px;padding:10px 14px;
  font-size:clamp(16px,4.4vw,22px);font-weight:800;min-height:64px;display:flex;align-items:center;box-shadow:4px 4px 0 var(--ink)}
.bubble::after{content:"";position:absolute;left:34px;bottom:-18px;width:0;height:0;border-left:12px solid transparent;border-right:12px solid transparent;border-top:18px solid var(--ink)}
.bubble::before{content:"";position:absolute;left:38px;bottom:-11px;width:0;height:0;border-left:8px solid transparent;border-right:8px solid transparent;border-top:12px solid var(--panel);z-index:1}
.bubble b{background:var(--hi);padding:0 5px;border:2px solid var(--ink)}
.flipsy{position:absolute;left:4%;bottom:8px;font-size:clamp(54px,15vw,84px);line-height:1;transform-origin:bottom center}
.flipsy .wand{position:absolute;right:-30px;top:2px;font-size:.55em;transform-origin:bottom left}
.flipsy.wave .wand{animation:wave .5s ease-in-out 2}
@keyframes wave{50%{transform:rotate(-35deg)}}
.hat{position:relative;width:200px;height:190px;transform-origin:50% 100%}
.hat.wobble{animation:wob .5s ease-in-out}
@keyframes wob{25%{transform:rotate(-6deg) scaleY(.94)}55%{transform:rotate(5deg) scaleY(1.05)}80%{transform:rotate(-2deg)}}
.hat svg{position:absolute;left:0;top:0;width:200px;height:190px;overflow:visible}
.hat .back{z-index:1}.hat .front{z-index:3;pointer-events:none}
.hitem{position:absolute;left:50%;top:-108px;z-index:2;transform:translateX(-50%) scale(1);width:130px;height:110px;display:flex;align-items:center;justify-content:center;
  transition:top .55s cubic-bezier(.5,0,.75,0), transform .55s}
.hitem.inside{top:80px;transform:translateX(-50%) scale(.5)}
.hitem.pop{transition:top .6s cubic-bezier(.2,1.6,.4,1), transform .6s cubic-bezier(.2,1.6,.4,1)}
.hitem.nomove{transition:none}
.it{display:inline-flex;align-items:center;justify-content:center;line-height:1}
.multi{display:grid;grid-template-columns:repeat(3,auto);gap:0;line-height:1}
.choices{display:grid;gap:var(--gap)}
.card{background:var(--panel);border:4px solid var(--ink);box-shadow:4px 4px 0 var(--ink);min-height:112px;padding:6px 4px;
  display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:4px;font-weight:800;font-size:clamp(16px,4.4vw,21px)}
.card .pic{height:70px;display:flex;align-items:center;justify-content:center}
.card.nope{border-style:dashed;box-shadow:none;background:#efe9d6}
.card.nope .pic{filter:grayscale(1)}
.card.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-8px) rotate(-3deg)}40%{transform:translateX(8px) rotate(3deg)}60%{transform:translateX(-5px)}80%{transform:translateX(4px)}}
.card.yes{background:var(--hi)}
.card[hidden]{display:none}
.row{display:flex;gap:var(--gap);align-items:center}
.row .big{flex:1}
.prog{display:flex;gap:4px;justify-content:center;flex-wrap:wrap}
.prog span{width:18px;height:18px;border:3px solid var(--ink);background:var(--panel);transform:rotate(45deg)}
.prog span.done{background:var(--btn)}
.prog span.now{background:var(--hi)}
.topline{display:flex;align-items:center;gap:8px}
.topline .big{min-height:48px;font-size:clamp(16px,4.4vw,20px);padding:4px 10px}
.topline .ttl{font-family:var(--head);font-weight:900;letter-spacing:1px;font-size:clamp(20px,5.4vw,28px);flex:1}
/* book */
.book{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:var(--gap);overflow-y:auto;grid-auto-rows:max-content;padding:2px 6px 8px 2px}
.pair{background:var(--panel);border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink);padding:6px;text-align:center;font-weight:800;font-size:clamp(14px,3.8vw,17px)}
.pair .pics{display:flex;justify-content:space-around;align-items:center;height:56px;font-size:38px}
.pair.locked{background:#efe9d6;border-style:dashed;box-shadow:none}
.pair:nth-child(odd){transform:rotate(-1deg)}.pair:nth-child(even){transform:rotate(1deg)}
/* free play */
.tray{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px;overflow-y:auto;grid-auto-rows:max-content;padding:2px 6px 8px 2px;max-height:38vh}
.tray button{background:var(--panel);border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink);min-height:84px;padding:4px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;font-weight:800;font-size:clamp(13px,3.6vw,16px)}
.tray button .pic{height:48px;display:flex;align-items:center;justify-content:center}
/* end */
.endbox{text-align:center;display:flex;flex-direction:column;gap:var(--gap);align-items:center;justify-content:center;flex:1}
.endbox h2{font-family:var(--head);font-weight:900;letter-spacing:1px;font-size:clamp(34px,10vw,58px);margin:0;color:var(--btn);text-shadow:3px 3px 0 var(--ink)}
.endstars{font-size:clamp(46px,14vw,74px)}
.pow{display:inline-block;background:var(--hi);border:4px solid var(--ink);padding:6px 16px;font-family:var(--head);font-size:clamp(22px,6vw,32px);transform:rotate(-3deg);box-shadow:4px 4px 0 var(--ink)}
.spark{position:fixed;pointer-events:none;z-index:50;font-size:28px;animation:fly 1s ease-out forwards}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) rotate(var(--r)) scale(.4);opacity:0}}
.zap{position:absolute;z-index:4;left:76%;top:42%;transform:translateX(-50%) rotate(-6deg);background:var(--hi);border:4px solid var(--ink);font-family:var(--head);
  font-size:clamp(24px,7vw,36px);padding:2px 14px;white-space:nowrap;box-shadow:4px 4px 0 var(--ink);pointer-events:none;animation:zap .9s ease-out forwards}
@keyframes zap{0%{transform:translateX(-50%) rotate(-6deg) scale(.2)}30%{transform:translateX(-50%) rotate(-6deg) scale(1.15)}75%{transform:translateX(-50%) rotate(-6deg) scale(1)}100%{transform:translateX(-50%) rotate(-6deg) scale(1);opacity:0}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hatwrap{transform:scale(var(--hs,1));transform-origin:50% 100%;flex:none}
</style>
</head>
<body>
<main class="app">
  <header>
    <h1>Flipsy's Opposite Hat</h1>
    <button class="tog" id="sndBtn" aria-pressed="true"><span class="ic" aria-hidden="true">🔊</span>Sound</button>
    <button class="tog" id="voiceBtn" aria-pressed="true"><span class="ic" aria-hidden="true">🗣️</span>Voice</button>
  </header>

  <!-- MENU -->
  <section class="screen on" id="menu">
    <div class="panel menu-hero" style="transform:rotate(-1deg)">
      <div class="bun" aria-hidden="true">🐰</div>
      <p class="desc">Drop a picture into Flipsy's magic hat and tap what pops out: its <b>OPPOSITE</b>! Hot turns cold, big turns small.</p>
    </div>
    <div class="menu-list">
      <button class="big" data-show="1"><span class="lft">Show 1: Easy Tricks<span class="sub">pick from 2 cards</span></span><span class="stars" id="st1"></span></button>
      <button class="big" data-show="2"><span class="lft">Show 2: Trickier<span class="sub">pick from 3 cards</span></span><span class="stars" id="st2"></span></button>
      <button class="big" data-show="3"><span class="lft">Show 3: Sneaky Traps<span class="sub">4 cards, watch for the SAME one</span></span><span class="stars" id="st3"></span></button>
      <button class="big yellow" id="freeBtn"><span class="lft">Magic Hat Free Play<span class="sub">flip anything you like</span></span><span aria-hidden="true">🎩</span></button>
      <button class="big white" id="bookBtn"><span class="lft">Pair Book<span class="sub" id="bookCount">0 found</span></span><span aria-hidden="true">📖</span></button>
    </div>
  </section>

  <!-- GAME -->
  <section class="screen" id="game">
    <div class="topline">
      <button class="big white" id="gBack">◀ Menu</button>
      <span class="ttl" id="gTitle">Show 1</span>
    </div>
    <div class="prog" id="prog" aria-hidden="true"></div>
    <div class="bubble" id="bubble" aria-live="polite">Ready?</div>
    <div class="stage" id="stage">
      <div class="flipsy" id="flipsy" aria-hidden="true">🐰<span class="wand">🪄</span></div>
      <div class="hatwrap"><div class="hat" id="hat">
        <svg class="back" viewBox="0 0 200 190" aria-hidden="true">
          <ellipse cx="100" cy="42" rx="96" ry="26" fill="#222" stroke="#111" stroke-width="4"/>
          <ellipse cx="100" cy="42" rx="58" ry="14" fill="#000"/>
        </svg>
        <div class="hitem" id="hitem" role="img" aria-label="magic hat"></div>
        <svg class="front" viewBox="0 0 200 190" aria-hidden="true">
          <path d="M42 44 L42 168 Q42 184 100 184 Q158 184 158 168 L158 44 Q130 58 100 58 Q70 58 42 44 Z" fill="#2b2b2b" stroke="#111" stroke-width="4"/>
          <path d="M42 62 Q70 78 100 78 Q130 78 158 62 L158 88 Q130 102 100 102 Q70 102 42 88 Z" fill="#c8102e" stroke="#111" stroke-width="3"/>
          <path d="M4 42 Q10 68 100 68 Q190 68 196 42 Q170 58 100 58 Q30 58 4 42 Z" fill="#222" stroke="#111" stroke-width="4"/>
          <path d="M60 120 l6 -14 l6 14 l14 2 l-10 10 l3 14 l-13 -7 l-13 7 l3 -14 l-10 -10 z" fill="#ffd23f" stroke="#111" stroke-width="2"/>
        </svg>
      </div></div>
    </div>
    <div class="choices" id="choices"></div>
    <div class="row"><button class="big" id="nextBtn" hidden>Next trick ▶</button></div>
  </section>

  <!-- FREE PLAY -->
  <section class="screen" id="free">
    <div class="topline">
      <button class="big white" id="fBack">◀ Menu</button>
      <span class="ttl">Magic Hat</span>
    </div>
    <div class="bubble" id="fBubble" aria-live="polite">Tap anything to drop it in the hat!</div>
    <div class="stage" id="fStage">
      <div class="flipsy" id="fFlipsy" aria-hidden="true">🐰<span class="wand">🪄</span></div>
      <div class="hatwrap"><div class="hat" id="fHat"></div></div>
    </div>
    <div class="tray" id="tray"></div>
  </section>

  <!-- BOOK -->
  <section class="screen" id="bookS">
    <div class="topline">
      <button class="big white" id="bBack">◀ Menu</button>
      <span class="ttl" id="bTitle">Pair Book</span>
    </div>
    <div class="book" id="book" role="region" aria-label="Pairs found" tabindex="0"></div>
  </section>

  <!-- END -->
  <section class="screen" id="end">
    <div class="endbox panel">
      <h2>Ta-da!</h2>
      <div class="endstars" id="endStars" role="img" aria-label="3 stars"></div>
      <div class="pow" id="endMsg">You flipped 8 opposites!</div>
      <div class="row" style="width:100%;max-width:440px">
        <button class="big" id="againBtn">Play again</button>
        <button class="big yellow" id="eMenu">Menu</button>
      </div>
    </div>
  </section>
</main>

<script>
/* ---------- data ---------- */
const GLASS_FULL = '<svg viewBox="0 0 60 70" width="1em" height="1.15em" aria-hidden="true"><path d="M8 4 L52 4 L46 66 L14 66 Z" fill="#dff4ff" stroke="#111" stroke-width="4"/><path d="M11 16 L49 16 L46 64 L14 64 Z" fill="#2f8fe0"/><path d="M8 4 L52 4 L46 66 L14 66 Z" fill="none" stroke="#111" stroke-width="4"/></svg>';
const GLASS_EMPTY = '<svg viewBox="0 0 60 70" width="1em" height="1.15em" aria-hidden="true"><path d="M8 4 L52 4 L46 66 L14 66 Z" fill="#f4fbff" stroke="#111" stroke-width="4"/><path d="M18 14 L22 54" stroke="#bfe3fb" stroke-width="5" stroke-linecap="round"/></svg>';
// each pair: [id, tier, sideA, sideB]; side = {w, e, sc?, rot?, multi?, svg?, off?}
const PAIRS = [
  ['big',1,{w:'big',e:'🐘',sc:1.35},{w:'small',e:'🐘',sc:.5}],
  ['hot',1,{w:'hot',e:'🔥'},{w:'cold',e:'🧊'}],
  ['day',1,{w:'day',e:'☀️'},{w:'night',e:'🌙'}],
  ['happy',1,{w:'happy',e:'😄'},{w:'sad',e:'😢'}],
  ['up',1,{w:'up',e:'👆'},{w:'down',e:'👇'}],
  ['stop',1,{w:'stop',e:'🛑'},{w:'go',e:'🟢'}],
  ['fast',1,{w:'fast',e:'🐇'},{w:'slow',e:'🐢'}],
  ['lots',1,{w:'lots',e:'🍎',multi:6},{w:'one',e:'🍎'}],
  ['flip',1,{w:'right way up',e:'🙂'},{w:'upside down',e:'🙂',rot:180}],
  ['loud',2,{w:'loud',e:'📢'},{w:'quiet',e:'🤫'}],
  ['open',2,{w:'open',e:'🔓'},{w:'closed',e:'🔒'}],
  ['awake',2,{w:'awake',e:'😳'},{w:'asleep',e:'😴'}],
  ['heavy',2,{w:'heavy',e:'🪨'},{w:'light',e:'🪶'}],
  ['wet',2,{w:'wet',e:'💦'},{w:'dry',e:'🏜️'}],
  ['tall',2,{w:'tall',e:'🦒'},{w:'short',e:'🐧'}],
  ['sweet',2,{w:'sweet',e:'🍭'},{w:'sour',e:'🍋'}],
  ['full',2,{w:'full',svg:GLASS_FULL},{w:'empty',svg:GLASS_EMPTY}],
  ['hard',3,{w:'hard',e:'🧱'},{w:'soft',e:'🧸'}],
  ['summer',3,{w:'summer',e:'🏖️'},{w:'winter',e:'⛄'}],
  ['left',3,{w:'left',e:'👈'},{w:'right',e:'👉'}],
  ['yes',3,{w:'yes',e:'👍'},{w:'no',e:'👎'}],
  ['old',3,{w:'old',e:'👴'},{w:'young',e:'👶'}],
  ['on',3,{w:'on',e:'💡'},{w:'off',e:'💡',off:true}],
];
const SHOWS = {
  1:{title:'Show 1: Easy Tricks',n:2,pick:()=>sample(PAIRS.filter(p=>p[1]===1),8)},
  2:{title:'Show 2: Trickier',n:3,pick:()=>shuffle([...sample(PAIRS.filter(p=>p[1]===2),6),...sample(PAIRS.filter(p=>p[1]===1),2)])},
  3:{title:'Show 3: Sneaky Traps',n:4,pick:()=>shuffle([...sample(PAIRS.filter(p=>p[1]===3),6),...sample(PAIRS.filter(p=>p[1]===2),2)])},
};
const KEY='cowork-flipsy-opposites-';
const store = {
  get(k,d){try{const v=localStorage.getItem(KEY+k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem(KEY+k,JSON.stringify(v))}catch(e){}}
};
let stars = store.get('stars',{});
let found = new Set(store.get('found',[]));
let prefs = store.get('prefs',{snd:true,voice:true});

/* ---------- helpers ---------- */
const $ = id=>document.getElementById(id);
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function sample(a,n){return shuffle([...a]).slice(0,n)}
function itemHTML(s,size){
  const sz=size*(s.sc||1);
  if(s.svg) return `<span class="it" style="font-size:${size}px">${s.svg}</span>`;
  if(s.multi){const k=size*.42;return `<span class="it multi" style="font-size:${k}px" aria-hidden="true">${s.e.repeat(s.multi)}</span>`}
  let st=`font-size:${sz}px;`;
  if(s.rot) st+=`transform:rotate(${s.rot}deg);`;
  if(s.off) st+='filter:grayscale(1) brightness(.45);';
  return `<span class="it" style="${st}" aria-hidden="true">${s.e}</span>`;
}
const cap = w=>w.toUpperCase();

/* ---------- audio: Cartoon FX ---------- */
let ac=null, master=null, noiseBuf=null;
function audio(){
  if(!ac){
    const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return null;
    ac=new AC();
    const comp=ac.createDynamicsCompressor();comp.threshold.value=-14;comp.ratio.value=4;
    master=ac.createGain();master.gain.value=prefs.snd?.55:0;
    master.connect(comp);comp.connect(ac.destination);
    noiseBuf=ac.createBuffer(1,ac.sampleRate*.5,ac.sampleRate);
    const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  }
  if(ac.state==='suspended') ac.resume();
  return ac;
}
function env(g,t,peak,att,dur){g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(peak,t+att);g.gain.exponentialRampToValueAtTime(0.0001,t+dur)}
function boing(t0=0,f1=200,f2=600,dur=.42,peak=.5){
  const a=audio();if(!a)return;const t=a.currentTime+t0;
  const o=a.createOscillator(),g=a.createGain(),l=a.createOscillator(),lg=a.createGain();
  o.type='sine';o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(f2,t+dur*.6);
  l.frequency.value=14;lg.gain.setValueAtTime(f2*.04,t);lg.gain.linearRampToValueAtTime(f2*.12,t+dur);
  l.connect(lg);lg.connect(o.frequency);
  env(g,t,peak,.012,dur);o.connect(g);g.connect(master);
  o.start(t);l.start(t);o.stop(t+dur+.05);l.stop(t+dur+.05);
}
function pop(t0=0,f=900,peak=.45){
  const a=audio();if(!a)return;const t=a.currentTime+t0;
  const n=a.createBufferSource();n.buffer=noiseBuf;const bp=a.createBiquadFilter();bp.type='bandpass';bp.frequency.value=2200;bp.Q.value=1.2;
  const ng=a.createGain();env(ng,t,peak*.8,.005,.04);n.connect(bp);bp.connect(ng);ng.connect(master);n.start(t);n.stop(t+.06);
  const o=a.createOscillator(),g=a.createGain();o.type='triangle';o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(f*1.6,t+.04);
  env(g,t,peak,.005,.05);o.connect(g);g.connect(master);o.start(t);o.stop(t+.08);
}
function slide(t0=0,f1=400,f2=1100,dur=.5,peak=.32){
  const a=audio();if(!a)return;const t=a.currentTime+t0;
  const o=a.createOscillator(),g=a.createGain(),l=a.createOscillator(),lg=a.createGain();
  o.type='sine';o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(f2,t+dur);
  l.frequency.value=6;lg.gain.value=f1*.03;l.connect(lg);lg.connect(o.frequency);
  // breathy whistle noise
  const n=a.createBufferSource();n.buffer=noiseBuf;const bp=a.createBiquadFilter();bp.type='bandpass';bp.Q.value=12;
  bp.frequency.setValueAtTime(f1,t);bp.frequency.exponentialRampToValueAtTime(f2,t+dur);const ng=a.createGain();env(ng,t,peak*.35,.02,dur);
  n.connect(bp);bp.connect(ng);ng.connect(master);
  env(g,t,peak,.02,dur+.05);o.connect(g);g.connect(master);
  o.start(t);l.start(t);n.start(t);o.stop(t+dur+.1);l.stop(t+dur+.1);n.stop(t+dur+.1);
}
const SFX={
  tap:()=>pop(0,700,.32),
  drop:()=>slide(0,1000,260,.55,.3),
  right:()=>{boing(0,220,660,.4,.5);pop(.32,1200,.35);pop(.42,1500,.3)},
  wrong:()=>{slide(0,520,300,.32,.26);slide(.34,420,240,.38,.24)},
  motif:()=>{[262,330,392,523].forEach((f,i)=>boing(i*.13,f*.75,f,.2,.38));pop(.56,1400,.35)},
  win:()=>{SFX.motif();slide(.7,500,1600,.6,.3);[0,.12,.24,.36,.48].forEach(d=>pop(1.2+d,900+d*1500,.3))}
};

/* ---------- voice ---------- */
function say(txt){
  if(!prefs.voice||!('speechSynthesis' in window))return;
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(txt);u.rate=.9;u.pitch=1.25;speechSynthesis.speak(u)}catch(e){}
}

/* ---------- toggles ---------- */
function syncToggles(){
  $('sndBtn').setAttribute('aria-pressed',prefs.snd);$('voiceBtn').setAttribute('aria-pressed',prefs.voice);
  if(master) master.gain.setTargetAtTime(prefs.snd?.55:0,ac.currentTime,.02);
}
$('sndBtn').onclick=()=>{prefs.snd=!prefs.snd;store.set('prefs',prefs);audio();syncToggles();if(prefs.snd)SFX.tap()};
$('voiceBtn').onclick=()=>{prefs.voice=!prefs.voice;store.set('prefs',prefs);syncToggles();if(!prefs.voice&&'speechSynthesis' in window)speechSynthesis.cancel();else say('Voice on!')};

/* ---------- screens ---------- */
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id))}
function renderMenu(){
  for(const k of [1,2,3]){const s=stars[k]||0;$('st'+k).textContent=s?'⭐'.repeat(s):''}
  $('bookCount').textContent=`${found.size} of ${PAIRS.length} found`;
  show('menu');
}
document.querySelectorAll('[data-show]').forEach(b=>b.onclick=()=>{audio();SFX.tap();startShow(+b.dataset.show)});
$('gBack').onclick=$('fBack').onclick=$('bBack').onclick=$('eMenu').onclick=()=>{SFX.tap();clearTimers();if('speechSynthesis' in window)speechSynthesis.cancel();renderMenu()};

/* ---------- sparkles ---------- */
function sparkle(el,n=14){
  const r=el.getBoundingClientRect();const cx=r.left+r.width/2,cy=r.top+r.height/3;
  const em=['✨','⭐','💥','🌟','🎉'];
  for(let i=0;i<n;i++){
    const s=document.createElement('span');s.className='spark';s.textContent=em[i%em.length];s.setAttribute('aria-hidden','true');
    const a=Math.random()*Math.PI*2,d=70+Math.random()*110;
    s.style.left=cx-14+'px';s.style.top=cy-14+'px';
    s.style.setProperty('--dx',Math.cos(a)*d+'px');s.style.setProperty('--dy',Math.sin(a)*d-40+'px');s.style.setProperty('--r',(Math.random()*360|0)+'deg');
    document.body.appendChild(s);setTimeout(()=>s.remove(),1050);
  }
}
function zap(stage,txt){const z=document.createElement('div');z.className='zap';z.textContent=txt;z.setAttribute('aria-hidden','true');stage.appendChild(z);setTimeout(()=>z.remove(),950)}
const ZAPS=['POOF!','FLIP!','ZAP!','TA-DA!','BOING!','WOW!'];

/* ---------- hat mechanics (shared) ---------- */
let timers=[];
function later(fn,ms){timers.push(setTimeout(fn,ms))}
function clearTimers(){timers.forEach(clearTimeout);timers=[]}
function placeAbove(el,side){
  el.classList.add('nomove');el.classList.remove('inside','pop');
  el.innerHTML=itemHTML(side,74);el.setAttribute('aria-label',side.w);
  void el.offsetWidth;el.classList.remove('nomove');
}
function dropIn(el,hat,flipsy){
  SFX.drop();el.classList.add('inside');
  later(()=>{hat.classList.remove('wobble');void hat.offsetWidth;hat.classList.add('wobble');flipsy.classList.remove('wave');void flipsy.offsetWidth;flipsy.classList.add('wave')},420);
}
function popOut(el,side){
  el.classList.add('nomove');el.innerHTML=itemHTML(side,74);el.setAttribute('aria-label',side.w);
  void el.offsetWidth;el.classList.remove('nomove');el.classList.add('pop');el.classList.remove('inside');
}

/* ---------- show game ---------- */
let G=null;
function startShow(k){
  clearTimers();
  const S=SHOWS[k];
  G={k,S,rounds:S.pick(),i:0,wrong:0,locked:true};
  $('gTitle').textContent=S.title;
  $('choices').style.gridTemplateColumns=`repeat(${S.n},1fr)`;
  show('game');SFX.motif();
  nextRound();
}
function renderProg(){
  $('prog').innerHTML=G.rounds.map((_,j)=>`<span class="${j<G.i?'done':j===G.i?'now':''}"></span>`).join('');
}
function nextRound(){
  const p=G.rounds[G.i];
  const flipIt=Math.random()<.5;
  G.inS=flipIt?p[3]:p[2];G.outS=flipIt?p[2]:p[3];G.pair=p;G.tries=0;G.locked=true;
  renderProg();
  $('nextBtn').hidden=true;$('choices').innerHTML='';
  const hi=$('hitem');placeAbove(hi,G.inS);
  $('bubble').innerHTML=`<span><b>${cap(G.inS.w)}</b> goes in the hat...</span>`;
  say(`${G.inS.w}!`);
  later(()=>dropIn(hi,$('hat'),$('flipsy')),900);
  later(()=>{
    $('bubble').innerHTML=`<span>What pops out? Tap the <b>OPPOSITE</b> of ${cap(G.inS.w)}!</span>`;
    say(`What is the opposite of ${G.inS.w}?`);
    buildChoices();G.locked=false;
  },1650);
}
function buildChoices(){
  const n=G.S.n;let opts=[{s:G.outS,kind:'right'}];
  if(G.k===3) opts.push({s:G.inS,kind:'same'});
  const others=shuffle(PAIRS.filter(p=>p!==G.pair).flatMap(p=>[p[2],p[3]]));
  // avoid two cards with the same word
  for(const s of others){if(opts.length>=n)break;if(!opts.some(o=>o.s.w===s.w))opts.push({s,kind:'other'})}
  shuffle(opts);
  const box=$('choices');box.innerHTML='';
  opts.forEach(o=>{
    const b=document.createElement('button');b.className='card';
    b.innerHTML=`<span class="pic">${itemHTML(o.s,46)}</span><span>${o.s.w}</span>`;
    b.onclick=()=>choose(b,o);box.appendChild(b);
  });
}
function choose(btn,o){
  if(G.locked||btn.classList.contains('nope'))return;
  if(o.kind==='right'){
    G.locked=true;btn.classList.add('yes');SFX.right();
    popOut($('hitem'),G.outS);
    later(()=>{sparkle($('hat'));zap($('stage'),ZAPS[Math.random()*ZAPS.length|0])},250);
    $('bubble').innerHTML=`<span><b>${cap(G.inS.w)}</b> and <b>${cap(G.outS.w)}</b> are opposites!</span>`;
    say(`${G.inS.w}... ${G.outS.w}! Opposites!`);
    if(!found.has(G.pair[0])){found.add(G.pair[0]);store.set('found',[...found])}
    [...$('choices').children].forEach(c=>{if(c!==btn)c.hidden=true});
    const nb=$('nextBtn');nb.hidden=false;nb.textContent=G.i===G.rounds.length-1?'See my stars ▶':'Next trick ▶';
    later(()=>nb.focus({preventScroll:true}),50);
  }else{
    G.wrong++;G.tries++;SFX.wrong();
    btn.classList.add('nope','shake');btn.setAttribute('aria-disabled','true');
    later(()=>btn.classList.remove('shake'),420);
    let msg;
    if(o.kind==='same') msg=`<span>Oops, that's the <b>SAME</b> as ${cap(G.inS.w)}! The hat flips things. Try another!</span>`,say(`That's the same! We need the opposite of ${G.inS.w}.`);
    else msg=`<span>Hmm, <b>${cap(o.s.w)}</b> isn't the opposite of ${cap(G.inS.w)}. Try another!</span>`,say(`Hmm, try another!`);
    $('bubble').innerHTML=msg;
  }
}
$('nextBtn').onclick=()=>{
  SFX.tap();G.i++;
  if(G.i>=G.rounds.length) return finish();
  nextRound();
};
function finish(){
  const s=G.wrong<=1?3:G.wrong<=3?2:1;
  if(s>(stars[G.k]||0)){stars[G.k]=s;store.set('stars',stars)}
  $('endStars').textContent='⭐'.repeat(s);$('endStars').setAttribute('aria-label',`${s} stars`);
  $('endMsg').textContent=s===3?`Perfect! ${G.rounds.length} opposites flipped!`:`You flipped ${G.rounds.length} opposites!`;
  show('end');SFX.win();say(s===3?'Ta-da! Perfect show!':'Ta-da! Great show!');
  later(()=>sparkle($('endStars'),22),200);later(()=>sparkle($('endMsg'),16),700);
}
$('againBtn').onclick=()=>{SFX.tap();startShow(G.k)};

/* ---------- free play ---------- */
$('fHat').innerHTML=$('hat').innerHTML;
const fItem=$('fHat').querySelector('.hitem');fItem.id='fItem';
let fBusy=false,fCur=null;
function buildTray(){
  const t=$('tray');t.innerHTML='';
  PAIRS.forEach(p=>[[p[2],p[3]],[p[3],p[2]]].forEach(([a,b])=>{
    const btn=document.createElement('button');
    btn.innerHTML=`<span class="pic">${itemHTML(a,36)}</span><span>${a.w}</span>`;
    btn.onclick=()=>freeFlip(a,b,p[0]);t.appendChild(btn);
  }));
}
function freeFlip(a,b,id){
  if(fBusy)return;fBusy=true;audio();SFX.tap();
  placeAbove(fItem,a);$('fBubble').innerHTML=`<span><b>${cap(a.w)}</b> goes in...</span>`;say(a.w);
  later(()=>dropIn(fItem,$('fHat'),$('fFlipsy')),500);
  later(()=>{
    SFX.right();popOut(fItem,b);
    later(()=>{sparkle($('fHat'),10);zap($('fStage'),ZAPS[Math.random()*ZAPS.length|0])},200);
    $('fBubble').innerHTML=`<span>...and <b>${cap(b.w)}</b> pops out!</span>`;say(`${b.w}!`);
    if(!found.has(id)){found.add(id);store.set('found',[...found])}
    later(()=>fBusy=false,600);
  },1350);
}
$('freeBtn').onclick=()=>{
  audio();SFX.motif();clearTimers();fBusy=false;
  fItem.classList.add('nomove');fItem.classList.remove('inside','pop');fItem.innerHTML='';fItem.setAttribute('aria-label','empty hat');
  $('fBubble').innerHTML='<span>Tap anything to drop it in the hat!</span>';
  show('free');say('Tap anything to drop it in the magic hat!');
};

/* ---------- pair book ---------- */
$('bookBtn').onclick=()=>{
  SFX.tap();
  $('bTitle').textContent=`Pair Book: ${found.size} of ${PAIRS.length}`;
  $('book').innerHTML=PAIRS.map(p=>found.has(p[0])
    ?`<div class="pair"><div class="pics">${itemHTML(p[2],38)}<span aria-hidden="true">↔</span>${itemHTML(p[3],38)}</div>${p[2].w} / ${p[3].w}</div>`
    :`<div class="pair locked"><div class="pics" aria-hidden="true">❓<span>↔</span>❓</div>not found yet</div>`).join('');
  show('bookS');
};

/* fit hat + popped item (needs ~306px tall) into whatever stage height is left */
function fitStage(st){
  const h=st.clientHeight-8, w=st.clientWidth;
  const s=Math.max(.45,Math.min(1.25,h/306,w/260));
  st.querySelector('.hatwrap').style.setProperty('--hs',s.toFixed(3));
}
if('ResizeObserver' in window){const ro=new ResizeObserver(es=>es.forEach(e=>fitStage(e.target)));ro.observe($('stage'));ro.observe($('fStage'))}
else addEventListener('resize',()=>{fitStage($('stage'));fitStage($('fStage'))});

buildTray();syncToggles();renderMenu();
</script>
</body>
</html>
