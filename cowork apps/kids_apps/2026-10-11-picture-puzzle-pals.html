<!-- CONCEPT: Picture Puzzle Pals - tap two tiles to swap them and rebuild a scrambled cartoon picture (jigsaw-style, 3 sizes, 4 pictures) -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Picture Puzzle Pals</title>
<style>
  :root{--ink:#3b2a6b;--pink:#ff6fae;--yellow:#ffd93d;--green:#4cd964;--blue:#4aa8ff;--purple:#9b6bff;--orange:#ff9a3c}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
  html,body{margin:0;height:100%;font-family:"Comic Sans MS","Chalkboard SE","Trebuchet MS",sans-serif;color:var(--ink);
    background:linear-gradient(180deg,#bfe9ff 0%,#fff1c9 100%);overflow-x:hidden}
  .screen{display:none;min-height:100%;padding:14px;flex-direction:column;align-items:center}
  .screen.on{display:flex}
  h1{font-size:clamp(30px,7vw,52px);margin:8px 0 4px;text-align:center;text-shadow:3px 3px 0 #fff,5px 5px 0 rgba(155,107,255,.35)}
  .desc{font-size:clamp(16px,3.2vw,22px);text-align:center;max-width:560px;margin:0 0 12px;line-height:1.3}
  h2{font-size:clamp(20px,4vw,28px);margin:12px 0 8px}
  .btn{font-family:inherit;font-size:clamp(20px,4.5vw,30px);font-weight:bold;color:#fff;border:none;border-radius:26px;
    padding:12px 26px;margin:6px;cursor:pointer;background:var(--purple);box-shadow:0 7px 0 rgba(0,0,0,.2);transition:transform .08s}
  .btn:active{transform:translateY(5px);box-shadow:0 2px 0 rgba(0,0,0,.2)}
  .btn.green{background:var(--green)}.btn.pink{background:var(--pink)}.btn.orange{background:var(--orange)}.btn.blue{background:var(--blue)}
  .row{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-bottom:8px}
  .pic{width:min(40vw,200px);border:6px solid #fff;border-radius:20px;background:#fff;cursor:pointer;padding:0;
    box-shadow:0 8px 0 rgba(0,0,0,.18);transition:transform .1s;font-family:inherit;color:var(--ink);font-weight:bold;font-size:20px}
  .pic img{width:100%;display:block;border-radius:12px}
  .pic span{display:block;padding:4px 0 2px}
  .pic.sel{outline:6px solid var(--yellow);transform:scale(1.06)}
  .pic:active{transform:scale(.97)}
  .size{min-width:120px}
  .size.sel{outline:6px solid var(--yellow);transform:scale(1.07)}
  #hud{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;width:100%;max-width:700px}
  .badge{background:#fff;border-radius:20px;padding:6px 16px;font-size:clamp(18px,4vw,26px);font-weight:bold;box-shadow:0 4px 0 rgba(0,0,0,.12)}
  #msg{min-height:34px;font-size:clamp(18px,4vw,26px);font-weight:bold;margin:6px 0;text-align:center}
  #board{display:grid;gap:5px;width:min(94vw,640px);aspect-ratio:4/3;background:#fff;padding:6px;border-radius:22px;
    box-shadow:0 8px 0 rgba(0,0,0,.18);touch-action:manipulation}
  .tile{border-radius:10px;background-repeat:no-repeat;cursor:pointer;position:relative;transition:transform .12s, box-shadow .2s;
    border:3px solid rgba(255,255,255,.0)}
  .tile.sel{transform:scale(.93);box-shadow:0 0 0 5px var(--yellow),0 0 18px 6px rgba(255,217,61,.8);z-index:2}
  .tile.cur{box-shadow:0 0 0 4px var(--blue)}
  .tile.ok{box-shadow:inset 0 0 0 4px var(--green)}
  .tile.ok::after{content:"\2713";position:absolute;right:4px;top:0;color:#fff;font-size:22px;text-shadow:0 0 4px #2a9d3a,0 0 4px #2a9d3a}
  .tile.pop{animation:pop .45s}
  @keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.12) rotate(-3deg)}100%{transform:scale(1)}}
  #peek{position:fixed;inset:0;background:rgba(40,20,90,.55);display:none;align-items:center;justify-content:center;z-index:20}
  #peek.on{display:flex}
  #peek img{width:min(90vw,640px);border:8px solid #fff;border-radius:22px}
  #win{position:fixed;inset:0;background:rgba(40,20,90,.55);display:none;align-items:center;justify-content:center;z-index:30;flex-direction:column}
  #win.on{display:flex}
  .card{background:#fff;border-radius:30px;padding:20px 26px;text-align:center;max-width:92vw;animation:bounceIn .6s}
  .card img{width:min(70vw,320px);border-radius:16px;border:5px solid var(--yellow)}
  .stars{font-size:clamp(40px,10vw,64px);letter-spacing:6px}
  @keyframes bounceIn{0%{transform:scale(.3)}60%{transform:scale(1.08)}100%{transform:scale(1)}}
  canvas#confetti{position:fixed;inset:0;pointer-events:none;z-index:40;width:100%;height:100%}
  .mute{position:fixed;top:8px;right:8px;z-index:50;font-size:26px;padding:6px 14px;margin:0}
</style>
</head>
<body>

<button class="btn blue mute" id="muteBtn" aria-label="Sound on or off">🔊</button>

<!-- MENU -->
<div id="menu" class="screen on">
  <h1>🧩 Picture Puzzle Pals 🧩</h1>
  <p class="desc">The picture got all mixed up! Tap one piece, then tap another to swap them. Put every piece back to finish the picture!</p>
  <h2>1. Pick a picture</h2>
  <div class="row" id="picRow"></div>
  <h2>2. Pick a size</h2>
  <div class="row" id="sizeRow">
    <button class="btn green size sel" data-c="2" data-r="2">🐣 Easy<br><small>4 pieces</small></button>
    <button class="btn orange size" data-c="3" data-r="2">🐥 Medium<br><small>6 pieces</small></button>
    <button class="btn pink size" data-c="3" data-r="3">🦄 Tricky<br><small>9 pieces</small></button>
  </div>
  <button class="btn" id="startBtn" style="font-size:clamp(26px,6vw,38px);margin-top:10px">▶ Let's Play!</button>
</div>

<!-- GAME -->
<div id="game" class="screen">
  <div id="hud">
    <button class="btn orange" id="homeBtn" style="font-size:20px;padding:8px 16px">🏠</button>
    <div class="badge">Swaps: <span id="moves">0</span></div>
    <div class="badge">✅ <span id="placed">0</span>/<span id="total">0</span></div>
    <button class="btn blue" id="peekBtn" style="font-size:20px;padding:8px 16px">👀 Peek</button>
    <button class="btn pink" id="shuffleBtn" style="font-size:20px;padding:8px 16px">🔀 Mix</button>
  </div>
  <div id="msg">Tap a piece to start!</div>
  <div id="board"></div>
</div>

<div id="peek"><img id="peekImg" alt="The finished picture"></div>

<div id="win">
  <div class="card">
    <div style="font-size:clamp(28px,7vw,44px);font-weight:bold">🎉 You did it! 🎉</div>
    <img id="winImg" alt="Finished picture">
    <div class="stars" id="stars"></div>
    <div style="font-size:20px;margin-bottom:4px" id="winTxt"></div>
    <button class="btn green" id="againBtn">🔁 Play Again</button>
    <button class="btn orange" id="newBtn">🖼 New Picture</button>
  </div>
</div>
<canvas id="confetti"></canvas>

<script>
"use strict";
/* ---------- AUDIO (Web Audio only) ---------- */
let actx=null, muted=false;
function audio(){ if(!actx){ try{actx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){} } if(actx&&actx.state==="suspended")actx.resume(); return actx; }
function tone(freq,dur,type,vol,delay){
  if(muted)return; const a=audio(); if(!a)return;
  const t=a.currentTime+(delay||0), o=a.createOscillator(), g=a.createGain();
  o.type=type||"sine"; o.frequency.setValueAtTime(freq,t);
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol||0.2,t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+dur+0.05);
}
const sfx={
  pick(){tone(520,.12,"triangle",.2);},
  swap(){tone(400,.1,"square",.12);tone(600,.12,"square",.12,.08);},
  good(){tone(660,.12,"triangle",.25);tone(880,.18,"triangle",.25,.1);},
  nope(){tone(300,.15,"sine",.15);},
  win(){[523,659,784,1047,784,1047,1319].forEach((f,i)=>tone(f,.28,"triangle",.28,i*.13));},
  mix(){for(let i=0;i<5;i++)tone(300+Math.random()*500,.08,"square",.1,i*.05);}
};

/* ---------- PICTURES (drawn with canvas, no image files) ---------- */
const W=800,H=600;
function mk(){const c=document.createElement("canvas");c.width=W;c.height=H;return [c,c.getContext("2d")];}
function circ(g,x,y,r,col){g.fillStyle=col;g.beginPath();g.arc(x,y,r,0,7);g.fill();}
function ell(g,x,y,rx,ry,col,rot){g.fillStyle=col;g.beginPath();g.ellipse(x,y,rx,ry,rot||0,0,7);g.fill();}
function rect(g,x,y,w,h,col,r){g.fillStyle=col;g.beginPath();g.roundRect?g.roundRect(x,y,w,h,r||0):g.rect(x,y,w,h);g.fill();}
function cloud(g,x,y,s){circ(g,x,y,30*s,"#fff");circ(g,x+30*s,y-10*s,36*s,"#fff");circ(g,x+65*s,y,28*s,"#fff");rect(g,x-20*s,y,110*s,28*s,"#fff",14*s);}
function face(g,x,y,s){circ(g,x-12*s,y,5*s,"#222");circ(g,x+12*s,y,5*s,"#222");g.strokeStyle="#222";g.lineWidth=3*s;g.beginPath();g.arc(x,y+4*s,13*s,.15*Math.PI,.85*Math.PI);g.stroke();}

   circ(g,630,480,38,"#fff");ell(g,640,498,26,17,"#ffb3c7");circ(g,622,470,5,"#222");circ(g,650,470,5,"#222");ell(g,598,455,10,20,"#333",.5);ell(g,660,450,10,18,"#333",-.5);
   for(let i=0;i<9;i++){const x=40+i*85,c=["#ff6fae","#ffd93d","#fff","#ff9a3c"][i%4];g.strokeStyle="#2e9a2e";g.lineWidth=5;g.beginPath();g.moveTo(x,590);g.lineTo(x,555);g.stroke();circ(g,x,548,13,c);circ(g,x,548,5,"#ffd93d");}

   g.fillStyle="rgba(255,255,255,.18)";for(let i=0;i<5;i++){g.beginPath();g.moveTo(100+i*160,0);g.lineTo(150+i*160,0);g.lineTo(60+i*160,500);g.lineTo(0+i*160,500);g.fill();}

   rect(g,-50,-80,100,190,"#f5f5f5",50);g.fillStyle="#ff4b6e";g.beginPath();g.moveTo(-50,-30);g.quadraticCurveTo(-50,-150,0,-170);g.quadraticCurveTo(50,-150,50,-30);g.fill();

 }}
];
PICS.forEach(p=>{const [c,g]=mk();p.draw(g);p.url=c.toDataURL("image/jpeg",.9);});

/* ---------- STATE ---------- */
const $=id=>document.getElementById(id);
let picIdx=0, cols=2, rows=2, order=[], sel=-1, cur=0, moves=0, busy=false, playing=false;
const board=$("board");

function show(id){document.querySelectorAll(".screen").forEach(s=>s.classList.remove("on"));$(id).classList.add("on");}

/* ---------- MENU ---------- */
const picRow=$("picRow");
PICS.forEach((p,i)=>{
  const b=document.createElement("button");b.className="pic"+(i===0?" sel":"");
  b.innerHTML='<img src="'+p.url+'" alt=""><span>'+p.name+'</span>';
  b.onclick=()=>{picIdx=i;[...picRow.children].forEach(c=>c.classList.remove("sel"));b.classList.add("sel");sfx.pick();};
  picRow.appendChild(b);
});
document.querySelectorAll(".size").forEach(b=>{
  b.onclick=()=>{cols=+b.dataset.c;rows=+b.dataset.r;document.querySelectorAll(".size").forEach(x=>x.classList.remove("sel"));b.classList.add("sel");sfx.pick();};
});
$("startBtn").onclick=()=>{audio();startGame();};
$("homeBtn").onclick=()=>{playing=false;show("menu");};
$("againBtn").onclick=()=>{$("win").classList.remove("on");startGame();};
$("newBtn").onclick=()=>{$("win").classList.remove("on");playing=false;show("menu");};
$("shuffleBtn").onclick=()=>{if(busy)return;sfx.mix();scramble();render();msg("All mixed up again! 🌀");};
$("peekBtn").onclick=()=>{$("peekImg").src=PICS[picIdx].url;$("peek").classList.add("on");sfx.pick();};
$("peek").onclick=()=>$("peek").classList.remove("on");
$("muteBtn").onclick=()=>{muted=!muted;$("muteBtn").textContent=muted?"🔇":"🔊";if(!muted)sfx.pick();};

/* ---------- GAME ---------- */
function msg(t){$("msg").textContent=t;}
function scramble(){
  const n=cols*rows;
  do{ order=[...Array(n).keys()]; for(let i=n-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]];} }
  while(order.filter((v,i)=>v===i).length>Math.floor(n/3)); // start mostly scrambled, never solved
  sel=-1;moves=0;cur=0;
}
function startGame(){
  playing=true;busy=false;scramble();
  board.style.gridTemplateColumns="repeat("+cols+",1fr)";
  board.style.gridTemplateRows="repeat("+rows+",1fr)";
  board.innerHTML="";
  for(let s=0;s<cols*rows;s++){
    const d=document.createElement("div");d.className="tile";d.dataset.s=s;
    d.style.backgroundImage="url("+PICS[picIdx].url+")";
    d.style.backgroundSize=(cols*100)+"% "+(rows*100)+"%";
    d.addEventListener("click",()=>tapSlot(s));
    board.appendChild(d);
  }
  $("total").textContent=cols*rows;
  msg("Tap a piece to start!");
  render();show("game");
}
function render(){
  const tiles=board.children;let ok=0;
  for(let s=0;s<tiles.length;s++){
    const id=order[s],cx=id%cols,cy=Math.floor(id/cols);
    const t=tiles[s];
    t.style.backgroundPosition=(cols>1?cx*100/(cols-1):0)+"% "+(rows>1?cy*100/(rows-1):0)+"%";
    const right=id===s; if(right)ok++;
    t.classList.toggle("ok",right);t.classList.toggle("sel",s===sel);t.classList.toggle("cur",s===cur&&sel===-1&&false);
  }
  $("moves").textContent=moves;$("placed").textContent=ok;
  return ok;
}
function tapSlot(s){
  if(!playing||busy)return;audio();
  if(sel===-1){ if(order[s]===s){msg("That one is already perfect! ⭐");sfx.nope();return;} sel=s;sfx.pick();msg("Now tap where it should go!");render();return; }
  if(sel===s){sel=-1;msg("Okay! Pick a piece.");render();return;}
  if(order[s]===s){msg("That piece is happy where it is! 😊");sfx.nope();return;}
  const a=sel,b=s,before=render();
  [order[a],order[b]]=[order[b],order[a]];sel=-1;moves++;sfx.swap();
  const after=render();
  [a,b].forEach(i=>{const t=board.children[i];t.classList.remove("pop");void t.offsetWidth;t.classList.add("pop");});
  const total=cols*rows;
  if(after===total){win();}
  else if(after>before){sfx.good();msg(["Great job! 🌟","Nice one! 👏","Yes! That fits! 🎈","Wow, you're good! 😎"][moves%4]);}
  else{msg("Keep going, you can do it! 💪");}
}
function win(){
  busy=true;playing=false;
  const n=cols*rows, par=n+Math.ceil(n/2);
  const stars=moves<=par?3:(moves<=par*2?2:1);
  setTimeout(()=>{
    sfx.win();confetti();
    $("winImg").src=PICS[picIdx].url;
    $("stars").textContent="⭐".repeat(stars)+"☆".repeat(3-stars);
    $("winTxt").textContent="Finished in "+moves+" swaps!";
    $("win").classList.add("on");busy=false;
  },500);
}

/* keyboard: arrows move cursor, Enter/Space picks */
addEventListener("keydown",e=>{
  if(!$("game").classList.contains("on")||$("win").classList.contains("on"))return;
  let moved=true;
  if(e.key==="ArrowRight")cur=(cur%cols<cols-1)?cur+1:cur;
  else if(e.key==="ArrowLeft")cur=(cur%cols>0)?cur-1:cur;
  else if(e.key==="ArrowDown")cur=(cur+cols<cols*rows)?cur+cols:cur;
  else if(e.key==="ArrowUp")cur=(cur-cols>=0)?cur-cols:cur;
  else if(e.key==="Enter"||e.key===" "){e.preventDefault();tapSlot(cur);moved=false;}
  else moved=false;
  if(moved){e.preventDefault();[...board.children].forEach((t,i)=>t.classList.toggle("cur",i===cur));sfx.pick();}
});

/* ---------- CONFETTI ---------- */
function confetti(){
  const c=$("confetti"),g=c.getContext("2d");c.width=innerWidth;c.height=innerHeight;
  const cols_=["#ff6fae","#ffd93d","#4cd964","#4aa8ff","#9b6bff","#ff9a3c"];
  const ps=Array.from({length:150},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.5,vx:(Math.random()-.5)*3,vy:2+Math.random()*4,s:6+Math.random()*8,r:Math.random()*6,vr:(Math.random()-.5)*.3,c:cols_[Math.random()*6|0]}));
  let f=0;(function tick(){
    g.clearRect(0,0,c.width,c.height);
    ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;g.save();g.translate(p.x,p.y);g.rotate(p.r);g.fillStyle=p.c;g.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);g.restore();});
    if(++f<260)requestAnimationFrame(tick);else g.clearRect(0,0,c.width,c.height);
  })();
}
</script>
