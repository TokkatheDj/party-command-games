<!doctype html>
<!-- CONCEPT: kids math puzzle - chain matching candies that add up and double, with Amigo the coqui cheering you on | Players: 1 | ~10 min -->
<!-- Game idea by a young game designer (made in the Amigo App Builder as "Spooky Candy Connect"); Amigo, themes and Math Coach added 27 Oct 2026. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Amigo's Candy Math</title>
<style>
/* ===== Themes =====
   Each theme sets the same colour names; the board's candy colours live in THEMES in the script.
   --night: page base   --accent: second colour   --hot: main buttons   --cream: text
   --goo: big numbers   --panel: solid box colour (keeps text readable on any background) */
:root{--night:#12062b;--accent:#a77bff;--hot:#ff5fa2;--cream:#fff6e0;--goo:#7dff6a;--panel:#1f0b3d;
  --hotSh:#a0245f;--accSh:#5b34a8;--logo:#ff5fa2;--ink:#2a0420;
  --bg:linear-gradient(135deg,#12062b,#2b0f5c,#5a1650,#2b0f5c,#12062b);
  --title:Impact,'Arial Black',sans-serif;}
[data-theme="forest"]{--night:#04122b;--accent:#5fb4ff;--hot:#ffd23f;--cream:#eaf6ff;--goo:#b6ff5c;--panel:#0a2145;
  --hotSh:#9a7b00;--accSh:#1d5b99;--logo:#ffd23f;--ink:#06213f;
  --bg:linear-gradient(135deg,#020b1f,#06294f,#0b3d5c,#06294f,#020b1f)}
[data-theme="sweet"]{--night:#ffe3ef;--accent:#ff9ecb;--hot:#ff7eb6;--cream:#fff6e0;--goo:#9dff8a;--panel:#4a2318;
  --hotSh:#b8436f;--accSh:#b8436f;--logo:#b0005a;--ink:#3b1009;
  --bg:linear-gradient(135deg,#ffd6e8,#ffeec2,#c9f0ff,#ffeec2,#ffd6e8)}
[data-theme="space"]{--night:#000814;--accent:#8be9fd;--hot:#ff9f1c;--cream:#f1f5ff;--goo:#c6ff3d;--panel:#0b1033;
  --hotSh:#a85f00;--accSh:#2a7f91;--logo:#ff9f1c;--ink:#0b1033;
  --bg:linear-gradient(135deg,#000814,#0d1b4c,#2a0e5c,#0d1b4c,#000814)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;font-family:'Trebuchet MS',Verdana,sans-serif;color:var(--cream)}
/* Slowly shifting sky gradient */
body{background:var(--night);background-image:var(--bg);background-size:400% 400%;animation:sky 40s ease-in-out infinite;height:100vh}
@keyframes sky{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
/* Drifting decorations (bats, fireflies, clouds, stars) - made by decorate() for each theme */
#deco span{position:fixed;pointer-events:none}
.drift{font-size:26px;opacity:.4;animation:fly 22s linear infinite}
@keyframes fly{from{transform:translateX(-80px)}to{transform:translateX(110vw) translateY(-40px)}}
.firefly{width:7px;height:7px;border-radius:50%;background:#e8ff6a;box-shadow:0 0 10px 4px rgba(220,255,90,.7);animation:glow 3s ease-in-out infinite alternate}
@keyframes glow{from{opacity:.1;transform:translate(0,0)}to{opacity:1;transform:translate(14px,-18px)}}
.twinkle{font-size:14px;animation:twink 2.4s ease-in-out infinite alternate}
@keyframes twink{from{opacity:.15}to{opacity:.9}}
#app{display:flex;height:100vh;gap:14px;padding:14px}
#panel{width:250px;flex:none;display:flex;flex-direction:column;gap:10px;overflow-y:auto;padding-bottom:120px}
.logo{font-family:var(--title);font-size:26px;line-height:1;margin:0;color:var(--logo);
  text-shadow:3px 3px 0 #000;letter-spacing:1px;text-transform:uppercase}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:var(--panel);border:3px solid var(--accent);border-radius:12px;padding:6px 8px;box-shadow:0 4px 0 var(--accSh)}
.stat small{display:block;font-size:11px;letter-spacing:1px;color:var(--accent);text-transform:uppercase}
.stat b{font-family:var(--title);font-size:26px;font-weight:400;color:var(--cream)}
/* The score gets a big, bright box of its own */
.stat.score{grid-column:span 2;border-color:var(--hot);box-shadow:0 4px 0 var(--hotSh);text-align:center}
.stat.score small{color:var(--hot)}
.stat.score b{font-size:44px;color:var(--goo);text-shadow:2px 2px 0 #000}
/* Level progress bar */
#lvlBox{background:var(--panel);border:3px solid var(--accent);border-radius:12px;padding:6px 8px;font-size:13px}
#lvlBox b{font-family:var(--title);font-weight:400;font-size:18px;color:var(--goo)}
#bar{height:12px;margin-top:5px;background:#000;border-radius:8px;overflow:hidden}
#barFill{height:100%;width:0;background:linear-gradient(90deg,var(--hot),var(--goo));transition:width .4s ease}
#preview{background:var(--panel);border:3px dashed var(--hot);border-radius:12px;padding:8px;
  font-size:16px;min-height:56px;transition:all .2s ease}
#preview b{color:var(--goo)}
/* Controls: shuffle, Amigo voice, rumble, theme, help, volume */
#controls{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#btnShuffle,#volBox{grid-column:span 2}
/* Bigger buttons: tall, wide, easy to tap */
button{font-family:var(--title);font-size:22px;letter-spacing:1px;color:var(--ink);background:var(--hot);
  border:4px solid #000;border-radius:16px;padding:14px 18px;min-height:60px;cursor:pointer;box-shadow:0 6px 0 var(--hotSh);
  transition:transform .15s ease,box-shadow .15s ease,filter .15s ease}
button:hover{transform:translateY(-2px);filter:brightness(1.1)}
button:active{transform:translateY(5px);box-shadow:0 1px 0 var(--hotSh)}
button:disabled{filter:grayscale(.8) brightness(.7);cursor:default}
button.alt{background:var(--accent);box-shadow:0 6px 0 var(--accSh)}
button.alt:active{box-shadow:0 1px 0 var(--accSh)}
/* small tool buttons (voice / rumble / theme / help) */
.tool{font-size:16px;padding:6px 8px;min-height:56px;line-height:1.1}
.tool small{display:block;font-family:'Trebuchet MS',Verdana,sans-serif;font-size:11px;letter-spacing:0;font-weight:bold}
.tool[aria-pressed="false"]{filter:grayscale(.7) brightness(.85)}
/* Volume row: mute button + slider */
#volBox{display:flex;align-items:center;gap:10px;background:var(--panel);border:3px solid var(--accent);
  border-radius:16px;padding:6px 10px}
#btnMute{min-height:44px;min-width:56px;padding:4px 10px;font-size:22px;flex:none}
#vol{flex:1;min-width:0;height:36px;accent-color:var(--hot);cursor:pointer}
#wrap{flex:1;min-width:0;min-height:0;display:flex;align-items:center;justify-content:center;position:relative}
canvas#cv{touch-action:none;background:rgba(0,0,0,.35);border:4px solid var(--accent);border-radius:16px;box-shadow:0 0 30px rgba(167,123,255,.4)}
[data-theme="sweet"] canvas#cv{background:rgba(74,35,24,.55)}
/* Rumble: a quick screen shake on the board (size set by --amp from JavaScript) */
#wrap.rumble canvas{animation:rumble .35s linear}
@keyframes rumble{
  0%,100%{transform:translate(0,0)}
  15%{transform:translate(var(--amp),calc(var(--amp)*-.5))}
  30%{transform:translate(calc(var(--amp)*-1),var(--amp))}
  45%{transform:translate(var(--amp),var(--amp))}
  60%{transform:translate(calc(var(--amp)*-.7),calc(var(--amp)*-.7))}
  80%{transform:translate(calc(var(--amp)*.4),0)}}
/* Level-up message shown over the board */
#toast{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%) scale(.5);font-family:var(--title);
  font-size:clamp(36px,9vw,64px);color:var(--goo);text-shadow:4px 4px 0 #000;text-transform:uppercase;
  pointer-events:none;opacity:0;text-align:center;white-space:nowrap;z-index:3}
#toast.show{animation:toast 1.8s ease forwards}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}
  75%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-80%) scale(1)}}
/* The maths of each chain floats up over the board: "2 + 2 + 4 = 8" */
#eq{position:absolute;left:50%;top:6%;transform:translateX(-50%);font-family:var(--title);font-size:clamp(20px,5.5vw,34px);
  color:#fff;text-shadow:2px 2px 0 #000;pointer-events:none;opacity:0;z-index:3;text-align:center;
  background:rgba(10,5,30,.88);border:3px solid var(--goo);border-radius:16px;padding:6px 14px;max-width:94%;width:max-content;line-height:1.15}
#eq small{display:block;font-size:.6em;color:var(--goo)}
#eq.show{animation:eq 2.2s ease forwards}
@keyframes eq{0%{opacity:0;transform:translate(-50%,20px) scale(.7)}15%{opacity:1;transform:translate(-50%,0) scale(1.08)}
  70%{opacity:1;transform:translate(-50%,-6px) scale(1)}100%{opacity:0;transform:translate(-50%,-30px)}}
/* Full-screen confetti layer */
#fx{position:fixed;inset:0;pointer-events:none;z-index:6}
/* ===== Amigo the coqui: sits in the corner, hops up to cheer ===== */
#amigoBox{position:fixed;left:14px;bottom:14px;z-index:4;display:flex;align-items:flex-end;gap:6px;pointer-events:none;
  max-width:calc(100vw - 28px)}
#amigoBtn{pointer-events:auto;width:96px;height:96px;min-height:0;padding:0;border:none;border-radius:50%;background:none;
  box-shadow:none;flex:none;animation:breathe 3s ease-in-out infinite}
#amigoBtn:hover{transform:none;filter:brightness(1.1)}
#amigoBtn svg{width:100%;height:100%;filter:drop-shadow(0 5px 0 rgba(0,0,0,.45))}
#amigoBtn.hop{animation:hop .7s cubic-bezier(.3,1.6,.5,1)}
@keyframes breathe{50%{transform:scale(1.04)}}
@keyframes hop{0%{transform:translateY(0) scale(1)}25%{transform:translateY(-34px) scale(1.12) rotate(-6deg)}
  50%{transform:translateY(0) scale(1.05,.92)}70%{transform:translateY(-12px) rotate(4deg)}100%{transform:none}}
#bubble{pointer-events:auto;position:relative;background:#fff;color:#1b1030;border:4px solid #000;border-radius:18px;
  padding:10px 14px;font-weight:bold;font-size:18px;line-height:1.3;max-width:320px;margin-bottom:58px;
  box-shadow:0 5px 0 rgba(0,0,0,.4);opacity:0;visibility:hidden;transform:scale(.5) translateY(30px);transform-origin:bottom left;
  transition:opacity .2s,transform .3s cubic-bezier(.3,1.6,.5,1),visibility .3s}
#bubble.show{opacity:1;visibility:visible;transform:none}
#bubble::before{content:'';position:absolute;left:-16px;bottom:14px;border:10px solid transparent;border-right:14px solid #000}
#bubble p{margin:0}
.choices{display:flex;gap:8px;margin-top:8px}
.choices button{flex:1;font-size:22px;padding:6px 4px;min-height:52px;color:#1b1030;background:#ffe066;box-shadow:0 4px 0 #a07800}
.choices button.right{background:#7dff6a}.choices button.wrong{background:#ffb3b3}
#bubble .skip{display:block;margin:8px auto 0;font-size:14px;min-height:40px;padding:4px 14px;color:#fff;background:#4a3a6b;box-shadow:0 3px 0 #000}
/* Overlay: title / help / game over */
#overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(10,3,25,.8);
  transition:opacity .4s ease,visibility .4s;z-index:5;padding:12px}
#overlay.hide{opacity:0;visibility:hidden}
.card{max-width:460px;width:100%;max-height:100%;overflow:auto;text-align:center;background:var(--panel);border:5px solid var(--hot);border-radius:22px;
  padding:18px 18px 20px;box-shadow:0 8px 0 #000,0 0 40px rgba(255,95,162,.4)}
.big{font-family:var(--title);font-size:clamp(34px,10vw,56px);line-height:1;margin:0 0 8px;color:var(--hot);text-shadow:4px 4px 0 #000;text-transform:uppercase}
.big .w{display:block}
.big span.l{display:inline-block;animation:bounceIn .9s cubic-bezier(.3,1.6,.5,1) both}
.big .w:nth-child(2) span.l{color:var(--goo)}
@keyframes bounceIn{0%{transform:translateY(-300px) scale(.4);opacity:0}100%{transform:none;opacity:1}}
.card p{margin:8px 0;font-size:16px;line-height:1.4}
.card ul{text-align:left;font-size:14px;line-height:1.5;padding-left:22px;margin:8px 0 14px}
.card .credit{font-size:13px;color:var(--accent)}
.hero{width:110px;height:110px;display:block;margin:0 auto 6px;animation:breathe 3s ease-in-out infinite}
.cardBtns{display:flex;flex-direction:column;align-items:center;gap:14px;margin-top:12px}
#ovBtn{font-size:28px;padding:14px 34px;min-height:66px;animation:pulse 1.4s ease-in-out infinite}
#helpBtn{font-size:20px;padding:8px 22px;min-height:52px}
@keyframes pulse{50%{transform:scale(1.07)}}
/* Theme picker on the title card */
.themes{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0 4px}
.themes button{font-size:15px;padding:6px;min-height:52px;letter-spacing:0}
.themes button[aria-pressed="true"]{outline:4px solid #fff;outline-offset:2px}
.themes button[aria-pressed="false"]{filter:brightness(.8)}
/* Narrow screens: panel moves on top, Amigo sits under the board */
@media(max-width:700px){
  #app{flex-direction:column;gap:6px;padding:8px 8px 80px}
  #panel{width:100%;gap:5px;flex:none;overflow:visible;padding-bottom:0}
  .logo{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}   /* hidden, but still the page heading */
  .stats{grid-template-columns:1.4fr 1fr 1fr 1fr 1fr;gap:4px}
  .stat{padding:2px 4px}.stat small{font-size:8px;letter-spacing:0}.stat b{font-size:17px}
  .stat.score{grid-column:auto}.stat.score b{font-size:22px}
  #lvlBox{padding:3px 8px;font-size:12px}#lvlBox b{font-size:15px}#bar{height:8px;margin-top:2px}
  #preview{min-height:0;padding:3px 8px;font-size:14px}
  /* all five buttons in one row, volume underneath */
  #controls{grid-template-columns:repeat(5,1fr);gap:5px}
  #btnShuffle{grid-column:auto}
  #volBox{grid-column:span 5;order:5;padding:2px 8px;border-width:2px}
  #btnMute{min-height:36px;padding:0 8px;font-size:18px;box-shadow:0 3px 0 var(--accSh)}
  #vol{height:28px}
  button{font-size:15px;padding:6px 6px;min-height:48px;letter-spacing:0}
  .tool{min-height:48px;font-size:13px;padding:4px 2px}
  .tool small{font-size:10px}
  #amigoBox{left:8px;bottom:6px}
  #amigoBtn{width:70px;height:70px}
  #bubble{font-size:16px;margin-bottom:34px;max-width:calc(100vw - 100px)}
}
</style>
</head>
<body><!--amigo:start--><svg aria-hidden="true" focusable="false" style="position:absolute;width:0;height:0;overflow:hidden"><defs><symbol id="amigo" viewBox="0 0 512 512"><defs><linearGradient id="amigo-face" gradientUnits="userSpaceOnUse" x1="0" y1="90" x2="0" y2="452"><stop offset="0" stop-color="#EEF1F6"/><stop offset="1" stop-color="#B8C0CC"/></linearGradient><radialGradient id="amigo-iris" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#6FA6FF"/><stop offset="1" stop-color="#2F6FE0"/></radialGradient></defs><circle cx="256" cy="256" r="256" fill="#111318"/><circle cx="256" cy="256" r="241.5" fill="none" stroke="#3A84FF" stroke-width="11"/><g fill="url(#amigo-face)"><ellipse cx="256" cy="298" rx="168" ry="126"/><circle cx="154" cy="172" r="78"/><circle cx="358" cy="172" r="78"/></g><g fill="#121E46"><circle cx="154" cy="172" r="65"/><circle cx="358" cy="172" r="65"/></g><g fill="url(#amigo-iris)"><circle cx="154" cy="172" r="54"/><circle cx="358" cy="172" r="54"/></g><g fill="#121E46"><circle cx="154" cy="172" r="41"/><circle cx="358" cy="172" r="41"/></g><g fill="#fff"><circle cx="136" cy="156" r="13"/><circle cx="340" cy="156" r="13"/><circle cx="170" cy="190" r="5"/><circle cx="374" cy="190" r="5"/></g><g fill="#121E46"><circle cx="226" cy="286" r="7"/><circle cx="286" cy="286" r="7"/><circle cx="130" cy="310" r="7"/><circle cx="382" cy="310" r="7"/></g><path d="M178 334 Q256 382 334 334" fill="none" stroke="#121E46" stroke-width="13" stroke-linecap="round"/></symbol></defs></svg><!--amigo:end-->
<div id="deco" aria-hidden="true"></div>
<div id="app">
  <aside id="panel">
    <h1 class="logo">Amigo's Candy Math</h1>
    <div class="stats">
      <div class="stat score"><small>Score</small><b id="sScore">0</b></div>
      <div class="stat"><small>Level</small><b id="sLevel">1</b></div>
      <div class="stat"><small>Best</small><b id="sBest">0</b></div>
      <div class="stat"><small>Top candy</small><b id="sTop">🍬</b></div>
      <div class="stat"><small>Moves</small><b id="sMoves">0</b></div>
    </div>
    <div id="lvlBox"><span id="lvlText">Next level at 200</span><div id="bar"><div id="barFill"></div></div></div>
    <div id="preview">Start by matching a pair!</div>
    <div id="controls">
      <button id="btnShuffle" class="tool">🔀 Shuffle<small>3 left</small></button>
      <button id="btnVoice" class="tool alt" aria-pressed="true">🐸 Amigo<small>Voice on</small></button>
      <button id="btnRumble" class="tool alt" aria-pressed="true">📳 Rumble<small>On</small></button>
      <button id="btnTheme" class="tool alt">🎨 Theme<small>Spooky</small></button>
      <button id="btnHelp" class="tool alt">❓ Help<small>(H)</small></button>
      <!-- Volume: mute button + slider -->
      <div id="volBox">
        <button id="btnMute" class="alt" aria-label="Mute or unmute">🔊</button>
        <input id="vol" type="range" min="0" max="100" value="80" aria-label="Volume">
      </div>
    </div>
  </aside>
  <main id="wrap"><canvas id="cv"></canvas><div id="toast"></div><div id="eq"></div></main>
</div>
<aside id="amigoBox" aria-label="Amigo">
  <button id="amigoBtn" aria-label="Amigo the coqui. Tap him to say hi!"><svg viewBox="0 0 512 512" aria-hidden="true"><use href="#amigo"/></svg></button>
  <div id="bubble" role="status" aria-live="polite"></div>
</aside>
<canvas id="fx" aria-hidden="true"></canvas>
<section id="overlay" aria-label="Game menu"><div class="card" id="card"></div></section>

<script>
/* ================= CONFIG ================= */
const COLS = 5, ROWS = 6;
const SCALE = [67,69,71,72,74,76,78,79,81,83,84,86]; // G major notes (MIDI) for chain sounds
// LEVELS: you reach level L+1 when your score hits goalFor(L). Edit this to make levels easier or harder!
const goalFor = L => 100 * L * (L + 1);   // level 1 -> 200, level 2 -> 600, level 3 -> 1200 ...

/* THEMES: each one has its own candy colours (index = log2(value) - 1), panel emoji,
   outline colour, decorations and game-over words. The CSS colours are under [data-theme]. */
const THEMES = {
  spooky: { name: 'Spooky', icon: '🎃',
    emoji: ['🍬','🍭','🍫','🍩','🧁','🍪','🎃','👻','🦇','🕷️','💀','🧙','🍎'],
    colors: ['#ffe066','#ffa94d','#ff6b9d','#c77dff','#74c0fc','#63e6be','#b2f23c','#ff8787','#e599f7','#91a7ff','#fff3bf','#38d9a9','#ffd43b'],
    edge: '#3a1030', slot: 'rgba(167,123,255,.12)', trail: 'rgba(255,95,162,.9)',
    over: ['Boo!', 'No Moves'], overText: 'The ghosts ate your last move!' },
  forest: { name: 'Rainforest', icon: '🐸',
    emoji: ['🍬','🍭','🍫','🍩','🧁','🍪','🐸','🌺','🦋','🌙','⭐','🌈','👑'],
    colors: ['#b6ff5c','#ffd23f','#5fd4ff','#ff9ecb','#7ee0b8','#ffb366','#c8a6ff','#ff7b7b','#9ad1ff','#e8ff8a','#ffe08a','#7dffd0','#ffd43b'],
    edge: '#06213f', slot: 'rgba(95,180,255,.13)', trail: 'rgba(255,210,63,.9)',
    over: ['Oh no!', 'No Moves'], overText: 'The fireflies went to sleep!' },
  sweet: { name: 'Sweet Shop', icon: '🧁',
    emoji: ['🍬','🍭','🍫','🍩','🧁','🍪','🍰','🎂','🍦','🍓','🌈','🦄','👑'],
    colors: ['#ff8fc7','#6fd3ff','#ffe14d','#b08cff','#6fe3a5','#ffad5c','#ff5fa2','#4fb8ff','#ffd23f','#9b7bff','#3fd98a','#ff7a6b','#ffd43b'],
    edge: '#5a2a1c', slot: 'rgba(255,158,203,.16)', trail: 'rgba(255,126,182,.95)',
    over: ['Oh no!', 'No Moves'], overText: 'The candy jar is stuck!' },
  space: { name: 'Space', icon: '🚀',
    emoji: ['🍬','🍭','🍫','🍩','🧁','🍪','🌙','⭐','🪐','☄️','🚀','👽','🌌'],
    colors: ['#8be9fd','#ff9f1c','#c6ff3d','#ff6bd6','#a29bfe','#ffd93d','#6bffb8','#ff7676','#74b9ff','#fd79a8','#ffeaa7','#55efc4','#ffd43b'],
    edge: '#0b1033', slot: 'rgba(139,233,253,.12)', trail: 'rgba(255,159,28,.9)',
    over: ['Oh no!', 'No Moves'], overText: 'Lost in space - no moves left!' }
};
const THEME_ORDER = ['spooky', 'forest', 'sweet', 'space'];
let theme = 'spooky';
const T = () => THEMES[theme];

/* AMIGO'S LINES: {L} level, {n} candies in the chain, {v} candy value, {s} score, {a} answer, {b} bonus.
   Add your own! He picks a random one each time (never the same one twice in a row). */
const LINES = {
  hello:  ["Hi! I'm Amigo! Let's make some candy math!", "Ko-KEE! Match a pair to start!", "Ready? Let's go, amigo!", "Let's add up some candy!"],
  tap:    ["Ko-KEE!", "Hee hee, that tickles!", "You're doing great!", "I love candy math!", "Hi again!", "Boop!"],
  chain5: ["Nice chain!", "Ooh, a tasty combo!", "Great linking!", "Look at you go!", "Yum! {n} candies!", "Sweet move!", "Keep it up!"],

/* ================= AUDIO (Web Audio: piano + xylophone + soft music) ================= */
let ac = null, master = null, muted = false, musicTimer = null, nextT = 0, step = 0;
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
const applyVolume = () => { if (master) master.gain.value = muted ? 0 : vol; };
function initAudio() {
  if (ac) { ac.resume(); return; }
  ac = new (window.AudioContext || window.webkitAudioContext)();
  master = ac.createGain(); master.connect(ac.destination); applyVolume();
}
// Generic envelope helper: oscillator -> gain with fast attack, exponential decay
function tone(type, f, t, vol, dur, attack = 0.005) {
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.value = f;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(vol, t + attack);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.05);
}
// A sliding tone, for Amigo's chirp
function slide(f0, f1, t, vol, dur) {
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = 'sine'; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + dur + 0.04);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.1);
}
// Piano: warm triangle + soft octave overtone, long decay
function piano(m, vol = 0.22, t = ac.currentTime) {
  const f = mtof(m); tone('triangle', f, t, vol, 1.3); tone('sine', f * 2, t, vol * 0.35, 0.6);
}
// Xylophone: bright sine + inharmonic overtone, short decay
function xylo(m, vol = 0.22, t = ac.currentTime) {
  const f = mtof(m); tone('sine', f, t, vol, 0.45); tone('sine', f * 3.9, t, vol * 0.3, 0.12);
}
function play(fn) { if (ac && !muted) fn(); }
const sfx = {
  pick: n => play(() => xylo(SCALE[Math.min(n, SCALE.length - 1)])),            // chain grows
  back: () => play(() => xylo(60, 0.12)),                                        // chain shrinks
  merge: (k, len) => play(() => { const t = ac.currentTime;                      // piano chord by candy level
    piano(55 + k * 2, 0.25, t); piano(62 + k * 2, 0.15, t + 0.07); xylo(SCALE[Math.min(len, 11)] + 12, 0.18, t + 0.12); }),
  start: () => play(() => { [67,71,74,79].forEach((m, i) => piano(m, 0.2, ac.currentTime + i * 0.12)); }),
  shuffle: () => play(() => { [79,76,72,69].forEach((m, i) => xylo(m, 0.14, ac.currentTime + i * 0.06)); }),
  level: () => play(() => { [72,76,79,84,88].forEach((m, i) => xylo(m, 0.2, ac.currentTime + i * 0.09)); }), // happy rising run
  fanfare: () => play(() => { const t = ac.currentTime;                          // big chains: ta-da!
    [67,71,74].forEach((m, i) => piano(m, 0.18, t + i * 0.08)); [79,83,86].forEach(m => piano(m, 0.16, t + 0.32)); }),
  chirp: () => play(() => { const t = ac.currentTime;                            // the coqui call: "ko-KEE!"
    slide(1150, 1300, t, 0.12, 0.08); slide(1900, 2900, t + 0.14, 0.13, 0.16); }),
  over: () => play(() => tone('sine', 262, ac.currentTime, 0.07, 0.3, 0.05))     // one soft, short, gentle tone
};
/* Background music: a slow, dreamy loop (not chiptune!).
   Each chord lasts 8 steps. Per chord we play a soft sine "pad" that swells in,
   a deep sine bass note, and a gentle arpeggio of rounded plucks on top.
   Chord = [bass, upper1, upper2, upper3] as MIDI notes: G, Em, C, D. */
const CHORDS = [[43,55,59,62],[40,55,59,64],[48,55,60,64],[50,54,57,62]];
const ARP = [1,2,3,2,3,2,1,2];      // which upper chord note to pluck at each step
const STEP_LEN = 0.45;              // seconds per step (slow and relaxed)
function scheduleMusic() {
  while (nextT < ac.currentTime + 0.3) {
    const chord = CHORDS[Math.floor(step / 8) % CHORDS.length], s = step % 8;
    if (s === 0) {
      chord.slice(1).forEach(m => tone('sine', mtof(m), nextT, 0.022, 3.8, 1.2)); // pad swells in slowly
      tone('sine', mtof(chord[0]), nextT, 0.09, 3.4, 0.05);                        // soft bass
    }
    const f = mtof(chord[ARP[s]] + 12);                                           // gentle plucked arpeggio
    tone('sine', f, nextT, 0.04, 1.3, 0.03); tone('triangle', f / 2, nextT, 0.012, 0.9, 0.03);
    nextT += STEP_LEN; step++;
  }
}
function startMusic() {
  if (!ac || muted || musicTimer) return;
  nextT = ac.currentTime + 0.1; musicTimer = setInterval(scheduleMusic, 90);
}
function stopMusic() { clearInterval(musicTimer); musicTimer = null; }
function updateMuteIcon() { $('btnMute').textContent = (muted || vol === 0) ? '🔇' : vol < 0.4 ? '🔈' : vol < 0.75 ? '🔉' : '🔊'; }
function toggleMute() {
  muted = !muted;
  applyVolume();
  muted ? stopMusic() : startMusic();
  if (muted) hush();
  updateMuteIcon();
}
// Volume slider: changes loudness; moving it up from muted turns sound back on
function setVolume(v) {
  initAudio(); vol = v / 100;
  if (muted && vol > 0) toggleMute(); else { applyVolume(); updateMuteIcon(); }
  if (ac && !musicTimer && !muted && state === 'play') startMusic();
}

/* ================= AMIGO (speech bubble, voice, hop) ================= */
// Amigo talks with the browser's built-in voice. Pick a friendly one if the device has it.
let voice = null;
function pickVoice() {
  if (!('speechSynthesis' in window)) return;
  const vs = speechSynthesis.getVoices().filter(v => /^en/i.test(v.lang));
  const likes = ['Google US English', 'Samantha', 'Aria', 'Jenny', 'Ava', 'Zira', 'Karen'];
  voice = likes.map(n => vs.find(v => v.name.includes(n))).find(Boolean) || vs[0] || null;
}
if ('speechSynthesis' in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function say(text) {
  if (!voiceOn || muted || vol === 0 || !('speechSynthesis' in window)) return;
  const words = text.replace(/[\u{1F000}-\u{1FFFF}\u{2600}-\u{27BF}\u{FE0F}]/gu, '')
    .replace(/×/g, ' times ').replace(/\+/g, ' plus ').replace(/Ko-KEE/gi, 'ko-kee');
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(words);
    if (voice) u.voice = voice;
    u.pitch = 1.6; u.rate = 1.05; u.volume = Math.min(1, vol + 0.2);
    speechSynthesis.speak(u);
  } catch (e) {}
}
function hush() { try { if ('speechSynthesis' in window) speechSynthesis.cancel(); } catch (e) {} }

let bubbleTimer = null, lastCheer = 0;
const lastLine = {};
function showBubble(html, ms) {
  const b = $('bubble'); b.innerHTML = html; b.classList.add('show');
  clearTimeout(bubbleTimer);
  if (ms) bubbleTimer = setTimeout(() => b.classList.remove('show'), ms);
}
function fill(text, vars) { return text.replace(/\{(\w)\}/g, (m, k) => vars[k] !== undefined ? vars[k] : m); }
// Amigo cheers: pick a line, show it, chirp, hop, and say it out loud
function cheer(kind, vars = {}) {
  if (coachOpen && !['right', 'wrong', 'skip'].includes(kind)) return;   // don't talk over a question
  const pool = LINES[kind]; let i;
  do { i = Math.floor(Math.random() * pool.length); } while (pool.length > 1 && i === lastLine[kind]);
  lastLine[kind] = i;
  const text = fill(pool[i], vars);
  showBubble('<p>' + text + '</p>', 2600 + text.length * 45);
  hop(); sfx.chirp(); setTimeout(() => say(text), 250);
  lastCheer = performance.now();
}

/* ================= MATH COACH (a bonus question at each level-up) ================= */
// Amigo asks a quick sum about the candies. Right answer = bonus points. Never stops the game.
let coachTimer = null;
function askCoach() {
  if (state !== 'play' || coachOpen) return;
  const vals = grid.flat().map(t => t.v).filter(v => v <= 64);
  const x = vals[Math.floor(Math.random() * vals.length)] || 4;
  const kinds = level >= 4 ? ['add', 'double', 'half', 'four'] : level >= 3 ? ['add', 'double', 'half'] : ['add', 'double'];
  const kind = kinds[Math.floor(Math.random() * kinds.length)];
  let q, a;
  if (kind === 'add') { q = "What's " + x + ' + ' + x + '?'; a = x * 2; }
  else if (kind === 'double') { q = "What's double " + x + '?'; a = x * 2; }
  else if (kind === 'half') { const y = Math.max(4, x * 2); q = "What's half of " + y + '?'; a = y / 2; }
  else { q = "What's " + x + ' + ' + x + ' + ' + x + ' + ' + x + '?'; a = x * 4; }
  // two wrong answers that look reasonable
  const wrong = new Set();
  for (const w of [a + x, a - Math.max(1, x / 2), a + 2, a * 2, a - 2, a + 1]) if (w > 0 && w !== a && wrong.size < 2) wrong.add(w);
  const opts = [a, ...wrong].sort(() => Math.random() - 0.5);
  const bonus = 20 * level;
  coachOpen = true;
  showBubble('<p>🧠 Math Coach! ' + q + '</p><div class="choices">' +
    opts.map(o => '<button data-v="' + o + '" aria-label="Answer ' + o + '">' + o + '</button>').join('') +
    '</div><button class="skip">Skip</button>');
  $('bubble').querySelectorAll('.choices button').forEach(btn => btn.onclick = () => answerCoach(btn, +btn.dataset.v, a, bonus));
  $('bubble').querySelector('.skip').onclick = () => { closeCoach(); cheer('skip'); };
  hop(); sfx.chirp(); setTimeout(() => say('Math coach! ' + q), 250);
  clearTimeout(coachTimer); coachTimer = setTimeout(() => { if (coachOpen) { closeCoach(); $('bubble').classList.remove('show'); } }, 20000);
}
function closeCoach() { coachOpen = false; clearTimeout(coachTimer); }
function answerCoach(btn, v, a, bonus) {
  if (!coachOpen) return;
  $('bubble').querySelectorAll('.choices button').forEach(b => { b.disabled = true; if (+b.dataset.v === a) b.classList.add('right'); });
  closeCoach();
  if (v === a) {
    score += bonus; best = Math.max(best, score); saveBest();
    floatText(COLS / 2 - .5, ROWS / 2 - .5, '+' + bonus, '#ffe066');
    throwConfetti(60); sfx.level();
    setTimeout(() => { cheer('right', { b: bonus }); updateStats(); checkLevel(false); }, 500);
  } else {
    btn.classList.add('wrong');
    setTimeout(() => cheer('wrong', { a }), 700);
  }
}

/* ================= GAME LOGIC ================= */
const lvl = v => Math.round(Math.log2(v)) - 1;
// Smallest power of two that is >= n (the value a chain turns into)
const roundUp2 = n => { let r = 2; while (r < n) r *= 2; return r; };
/* Chain rule: a chain MUST begin with a matching pair (2 > 2).
   After that pair is made (chain length >= 2), each step may go to an equal
   candy OR a candy exactly double, e.g. 2>2>4>8>8>16>32.
   `len` is the current chain length (before adding the new tile). */
const canStep = (from, to, len) => to === from || (len >= 2 && to === from * 2);
// Higher levels spawn bigger candies, so the board gets trickier
function randValue() {
  const pool = [2,2,2,4,4,8];
  if (maxV >= 64 || level >= 3) pool.push(16);
  if (maxV >= 256 || level >= 5) pool.push(32);
  if (level >= 4) pool.push(8);
  return pool[Math.floor(Math.random() * pool.length)];
}
const newTile = (v, y) => ({ v, y, s: 1 });
// Is there any move? Since a chain must start with a pair, we need two touching
// (incl. diagonal) candies with the SAME value.
function hasMove() {
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++)
    for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
      if (!dr && !dc) continue;
      const t = grid[r + dr]?.[c + dc], g = grid[r][c];
      if (t && t.v === g.v) return true;
    }
  return false;
}
function saveBest() { store.set('best', best); }
function newGame() {
  score = 0; moves = 0; maxV = 2; shuffles = 3; level = 1; combo = 0; chain = []; particles = []; settling = false; checkOver = false;
  bestAtStart = best; cheeredBest = false; closeCoach();
  do {
    grid = [];
    for (let r = 0; r < ROWS; r++) { grid.push([]); for (let c = 0; c < COLS; c++) grid[r].push(newTile(randValue(), r - ROWS - 1)); }
  } while (!hasMove());
  settling = true; updateStats(); updatePreview();
}
const chainSum = () => chain.reduce((a, p) => a + grid[p.r][p.c].v, 0);
// Level up when the score passes the goal; reward: +1 shuffle. Returns true if we went up.
function checkLevel(ask = true) {
  let up = false;
  while (score >= goalFor(level)) { level++; shuffles++; up = true; }
  if (up) {
    showToast('Level ' + level + '!'); sfx.level(); rumbleFx(4); throwConfetti(160); updateStats();
    cheer('level', { L: level });
    if (ask) setTimeout(askCoach, 3200);   // after Amigo's cheer, a Math Coach question
  }
  return up;
}
/* The sum written out. Short chains: 2 + 2 + 4 = 8.
   Long chains are grouped so the times tables show: 2×4 + 4×2 + 8 = 24 */
function sumText(vals) {
  if (vals.length <= 5) return vals.join(' + ');
  const parts = [];
  for (let i = 0; i < vals.length;) {
    let j = i; while (j < vals.length && vals[j] === vals[i]) j++;
    parts.push(j - i > 1 ? vals[i] + '×' + (j - i) : String(vals[i])); i = j;
  }
  return parts.join(' + ');
}
// Finish a chain: merge into one bigger candy at the last tile, drop the rest down
function resolveChain() {
  const len = chain.length;
  if (len < 2) { chain = []; updatePreview(); return; }
  const vals = chain.map(q => grid[q.r][q.c].v);
  const sum = chainSum(), res = roundUp2(sum);       // total rounded UP to the next power of 2
  const last = chain[len - 1], oldMax = maxV, C = T().colors;
  chain.forEach(p => { if (p !== last) { burst(p.c, p.r, C[lvl(grid[p.r][p.c].v) % C.length], len >= 8 ? 16 : 8); grid[p.r][p.c] = null; } });
  const t = grid[last.r][last.c]; t.v = res; t.s = 1.5;
  burst(last.c, last.r, C[lvl(res) % C.length], 18 + len * 2);
  floatText(last.c, last.r, '+' + res);
  score += res; moves++; maxV = Math.max(maxV, res); best = Math.max(best, score); saveBest();
  combo = len >= 4 ? combo + 1 : 0;
  // show the maths
  showEq(sumText(vals) + ' = ' + sum + (res !== sum ? ' → ' + res : '') +
    (res !== sum ? '<small>' + sum + ' rounds up to ' + res + '</small>' : combo >= 2 ? '<small>Combo ×' + combo + '!</small>' : ''));
  sfx.merge(lvl(res), len); rumbleFx(Math.min(4, len / 2));
  if (len >= 8) { sfx.fanfare(); throwConfetti(len >= 12 ? 220 : 110); }
  if (res > oldMax && res >= 32) starBurst(last.c, last.r);
  // Amigo reacts to the best thing that just happened (a level-up beats everything)
  const leveled = checkLevel();
  if (!leveled) {
    const quiet = performance.now() - lastCheer < 5000;   // small cheers wait their turn
    if (len >= 12) cheer('chain12', { n: len });
    else if (bestAtStart > 0 && !cheeredBest && score > bestAtStart) { cheeredBest = true; cheer('best'); }
    else if (res > oldMax && res >= 32) cheer('top', { v: res });
    else if (len >= 8) cheer('chain8', { n: len });
    else if (combo === 3 && !quiet) cheer('combo');
    else if (len >= 5 && !quiet) cheer('chain5', { n: len });
  }
  // gravity: compact each column downward, then refill from the top
  for (let c = 0; c < COLS; c++) {
    const col = []; for (let r = ROWS - 1; r >= 0; r--) if (grid[r][c]) col.push(grid[r][c]);
    const missing = ROWS - col.length;
    for (let i = 0; i < missing; i++) col.push(newTile(randValue(), -1 - i));
    for (let r = ROWS - 1, i = 0; r >= 0; r--, i++) grid[r][c] = col[i];
  }
  chain = []; settling = true; checkOver = true; updateStats();
  $('preview').innerHTML = '✅ ' + sumText(vals) + ' = ' + sum + (res !== sum ? ' → <b>' + res + '</b>' : '');   // keep the last sum readable
}
// Mix the candies; keep trying until there is at least one pair to match
function mix() {
  const all = grid.flat();
  for (let tries = 0; tries < 40; tries++) {
    const vals = all.map(t => t.v);
    for (let i = vals.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [vals[i], vals[j]] = [vals[j], vals[i]]; }
    all.forEach((t, i) => { t.v = vals[i]; t.s = 1.3; });
    if (hasMove()) return;
  }
}
function doShuffle() {
  if (state !== 'play' || settling || shuffles <= 0 || helpOpen) return;
  initAudio(); shuffles--; mix();
  sfx.shuffle(); rumbleFx(1.5); checkOver = true; settling = true; updateStats();
}

/* ================= EFFECTS ================= */
function burst(c, r, color, n) { // chunky square particles
  const x = (c + .5) * cell, y = (r + .5) * cell;
  for (let i = 0; i < n; i++) {
    const a = Math.random() * 6.283, sp = 60 + Math.random() * 200;
    particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 60, life: 1, color, size: 4 + Math.random() * 7 });
  }
}
function floatText(c, r, text, color) { particles.push({ x: (c + .5) * cell, y: (r + .5) * cell, vx: 0, vy: -50, life: 1.2, text, color }); }
// Stars fly out of a brand-new biggest candy
function starBurst(c, r) {
  const x = (c + .5) * cell, y = (r + .5) * cell;
  for (let i = 0; i < 10; i++) { const a = i / 10 * 6.283;
    particles.push({ x, y, vx: Math.cos(a) * 160, vy: Math.sin(a) * 160 - 40, life: 1.3, emoji: '⭐' }); }
}
// Confetti rains over the whole screen
function throwConfetti(n) {
  const C = T().colors;
  for (let i = 0; i < n; i++) confetti.push({ x: Math.random() * innerWidth, y: -20 - Math.random() * innerHeight * .4,
    vx: -40 + Math.random() * 80, vy: 120 + Math.random() * 180, rot: Math.random() * 6, vr: -6 + Math.random() * 12,
    w: 6 + Math.random() * 8, h: 4 + Math.random() * 6, color: C[i % C.length] });
}

/* ================= UI ================= */
const $ = id => document.getElementById(id);
function showToast(text) { // big banner over the board (restarts the CSS animation each time)
  const t = $('toast'); t.textContent = text; t.classList.remove('show'); void t.offsetWidth; t.classList.add('show');
}
function showEq(html) { const e = $('eq'); e.innerHTML = html; e.classList.remove('show'); void e.offsetWidth; e.classList.add('show'); }
function updateStats() {
  $('sScore').textContent = score; $('sBest').textContent = best; $('sMoves').textContent = moves; $('sLevel').textContent = level;
  const E = T().emoji;
  $('sTop').textContent = E[Math.min(lvl(maxV), E.length - 1)] + maxV;
  $('btnShuffle').innerHTML = '🔀 Shuffle<small>' + shuffles + ' left</small>'; $('btnShuffle').disabled = shuffles <= 0;
  // progress bar from the previous level's goal up to the next goal
  const lo = level > 1 ? goalFor(level - 1) : 0, hi = goalFor(level);
  $('barFill').style.width = Math.max(0, Math.min(100, (score - lo) / (hi - lo) * 100)) + '%';
  $('lvlText').innerHTML = 'Level <b>' + level + '</b> · next at <b>' + hi + '</b>';
}
function updatePreview() {
  const p = $('preview');
  if (chain.length < 2) { p.textContent = chain.length ? 'Match a pair first: drag to a neighbor with the SAME number…' : 'Start by matching a pair!'; return; }
  const vals = chain.map(q => grid[q.r][q.c].v), sum = chainSum(), res = roundUp2(sum), E = T().emoji;
  p.innerHTML = sumText(vals) + ' = ' + sum + ' → <b>' + E[Math.min(lvl(res), E.length - 1)] + ' ' + res + '</b>';
}
// The instructions live on their own "help" card, opened with the ❓ button (or the H key)
const HELP_HTML = '<ul><li>Press and <b>drag</b> through 2+ touching candies (diagonals count!).</li>' +
  '<li>Your chain must <b>start with a matching pair</b> (2 → 2). Only after that can it climb to the <b>next double up</b>, or repeat a match.</li>' +
  '<li>Example: 2 → 2 → 4 → 8 → 8 → 16 → 32. You can\'t step back down.</li>' +
  '<li>The candies <b>add up</b>! The total rounds up to the next power of 2 (2, 4, 8, 16, 32…) and that is your <b>score</b>.</li>' +
  '<li>Earn score to <b>level up</b>. Each level gives a free Shuffle, but brings bigger candies!</li>' +
  '<li>🐸 <b>Amigo</b> cheers big chains and level-ups. At each level-up he asks a <b>Math Coach</b> question: get it right for bonus points!</li>' +
  '<li>Stuck with no pairs? Amigo uses one of your shuffles for you.</li>' +
  '<li>🎨 <b>Theme</b> changes the look: Spooky, Rainforest, Sweet Shop or Space.</li>' +
  '<li>Keys: <b>S</b> shuffle, <b>A</b> Amigo voice, <b>T</b> theme, <b>M</b> mute, <b>V</b> rumble, <b>H</b> help, <b>R</b> restart.</li></ul>';
const AMIGO_SVG = '<svg class="hero" viewBox="0 0 512 512" aria-hidden="true"><use href="#amigo"/></svg>';
function showOverlay(mode) {
  const card = $('card');
  const titles = { title: ["Amigo's", 'Candy Math'], over: T().over, help: ['How to', 'Play'] };
  let h = (mode === 'title' ? AMIGO_SVG : '') + '<h2 class="big">' + titles[mode].map((w, wi) => '<span class="w">' +
    [...w].map((ch, i) => '<span class="l" style="animation-delay:' + ((wi * 8 + i) * 0.05) + 's">' + (ch === ' ' ? '&nbsp;' : ch) + '</span>').join('') + '</span>').join('') + '</h2>';
  if (mode === 'title') {
    h += '<p>Link candies, add them up, and climb the levels with Amigo!</p>' +
      '<div class="themes">' + THEME_ORDER.map(k => '<button class="alt" data-theme="' + k + '" aria-pressed="' + (k === theme) + '">' +
        THEMES[k].icon + ' ' + THEMES[k].name + '</button>').join('') + '</div>';
  } else if (mode === 'help') {
    h += HELP_HTML;
  } else {
    const E = T().emoji;
    h += '<p>' + T().overText + '</p><p style="font-size:22px">Score: <b style="color:var(--goo)">' + score + '</b> · Level <b style="color:var(--goo)">' + level +
      '</b><br>Top candy: ' + E[Math.min(lvl(maxV), E.length - 1)] + ' ' + maxV + '</p>' +
      (score > bestAtStart && score > 0 ? '<p style="font-size:20px">🏆 New best score!</p>' : '');
  }
  h += '<div class="cardBtns">';
  if (mode === 'help') h += '<button id="ovBtn">👍 Got it!</button>';
  else h += '<button id="ovBtn">' + (mode === 'title' ? T().icon + ' Play!' : '🍬 Play again') + '</button>' +
            '<button id="helpBtn" class="alt">❓ How to play</button>';
  h += '</div>';
  if (mode === 'title') h += '<p class="credit">Game idea by a young game designer · made with the Amigo App Builder</p>';
  card.innerHTML = h;
  $('ovBtn').onclick = mode === 'help' ? closeHelp : startGame;
  if ($('helpBtn')) $('helpBtn').onclick = openHelp;
  card.querySelectorAll('.themes button').forEach(b => b.onclick = () => { setTheme(b.dataset.theme); showOverlay('title'); });
  $('overlay').classList.remove('hide');
}
function openHelp() {
  if (document.activeElement) document.activeElement.blur(); // so Enter doesn't re-trigger the button
  dragging = false; chain = []; updatePreview();
  helpOpen = true; showOverlay('help');
}
// Close help and go back to whatever was behind it (title, game over, or the game itself)
function closeHelp() {
  helpOpen = false;
  if (state === 'play') $('overlay').classList.add('hide');
  else showOverlay(state === 'over' ? 'over' : 'title');
}
function startGame() {
  initAudio(); startMusic(); sfx.start();
  helpOpen = false; state = 'play'; newGame(); $('overlay').classList.add('hide');
  setTimeout(() => { if (state === 'play') cheer('hello'); }, 900);
}

/* ================= INPUT ================= */
function cellAt(e) {
  const rc = cv.getBoundingClientRect();
  const x = (e.clientX - rc.left) / rc.width * COLS, y = (e.clientY - rc.top) / rc.height * ROWS;
  const c = Math.floor(x), r = Math.floor(y);
  if (c < 0 || r < 0 || c >= COLS || r >= ROWS) return null;
  return { r, c, d: Math.hypot(x - c - .5, y - r - .5) };
}
cv.addEventListener('pointerdown', e => {
  if (state !== 'play' || settling || helpOpen) return;
  initAudio(); const p = cellAt(e); if (!p) return;
  cv.setPointerCapture(e.pointerId); dragging = true; chain = [{ r: p.r, c: p.c }]; sfx.pick(0); updatePreview();
});
cv.addEventListener('pointermove', e => {
  if (!dragging) return; const p = cellAt(e); if (!p || p.d > 0.42) return; // must be near the tile's center
  const last = chain[chain.length - 1];
  if (p.r === last.r && p.c === last.c) return;
  if (chain.length >= 2) { const prev = chain[chain.length - 2]; // moving back undoes the last step
    if (prev.r === p.r && prev.c === p.c) { chain.pop(); sfx.back(); updatePreview(); return; } }
  if (chain.some(q => q.r === p.r && q.c === p.c)) return;
  if (Math.max(Math.abs(p.r - last.r), Math.abs(p.c - last.c)) !== 1) return;
  // first step must be an equal pair; later steps can be equal or double
  if (!canStep(grid[last.r][last.c].v, grid[p.r][p.c].v, chain.length)) return;
  chain.push({ r: p.r, c: p.c }); sfx.pick(chain.length - 1); tick(); updatePreview();
});
const endDrag = () => { if (!dragging) return; dragging = false; resolveChain(); };
cv.addEventListener('pointerup', endDrag); cv.addEventListener('pointercancel', endDrag);
$('btnShuffle').onclick = doShuffle;
$('btnMute').onclick = () => { initAudio(); toggleMute(); };
$('vol').oninput = e => setVolume(+e.target.value);
$('btnRumble').onclick = toggleRumble;
$('btnVoice').onclick = toggleVoice;
$('btnTheme').onclick = nextTheme;
$('btnHelp').onclick = openHelp;
$('amigoBtn').onclick = () => { initAudio(); if (!coachOpen) cheer('tap'); };
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  // While the help card is open, only the keys that close it work
  if (helpOpen) { if (k === 'escape' || k === 'enter' || k === 'h') { e.preventDefault(); closeHelp(); } return; }
  if (e.target.tagName === 'BUTTON' && (k === 'enter' || k === ' ')) return;   // let buttons handle their own keys
  if (k === 'm') { initAudio(); toggleMute(); }
  else if (k === 'v') toggleRumble();
  else if (k === 'a') toggleVoice();
  else if (k === 't') { nextTheme(); if (state === 'title') showOverlay('title'); }
  else if (k === 'h') openHelp();
  else if (k === 'r' || (k === 'enter' && state !== 'play')) startGame();
  else if (k === 's') doShuffle();
});

/* ================= DRAWING ================= */
function rrect(x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function resize() {
  const w = $('wrap').clientWidth - 8, h = $('wrap').clientHeight - 8;
  cell = Math.max(40, Math.floor(Math.min(w / COLS, h / ROWS)));
  dpr = window.devicePixelRatio || 1;
  cv.style.width = cell * COLS + 'px'; cv.style.height = cell * ROWS + 'px';
  cv.width = cell * COLS * dpr; cv.height = cell * ROWS * dpr;
  fx.width = innerWidth * dpr; fx.height = innerHeight * dpr;
}
addEventListener('resize', resize);

/* Candy tiles! Three shapes, chosen by candy level (k % 3):
   - 0: WRAPPED bonbon (round body + ruffled, pleated wrapper ends, like a twisted wrapper)
   - 1: SWIRL hard candy (round, with a spiral of white stripes)
   - 2: GUMDROP (dome with sugar crystals sprinkled on it)
   Every candy gets a shiny 3D "gloss" (a white-to-dark gradient on top of its color).
   Tweak the numbers below (fractions of w, the tile size) to reshape them. */
function drawTile(t, r, c, sel) {
  const k = lvl(t.v), C = T().colors, col = C[k % C.length], s = t.s * (sel ? 1.08 : 1);
  const cx = (c + .5) * cell, cy = (t.y + .5) * cell, w = cell * 0.9;
  const edge = sel ? '#fff' : T().edge;              // outline color (white when selected)
  ctx.save(); ctx.translate(cx, cy); ctx.scale(s, s);
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  // soft ground shadow under the candy
  ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.beginPath(); ctx.ellipse(0, w * .42, w * .3, w * .06, 0, 0, 6.283); ctx.fill();
  ctx.lineWidth = sel ? 5 : 3; ctx.strokeStyle = edge;
  // Helper: fill a shape with the candy color, optional decoration `mid`, then gloss, then outline.
  // `shape` must start a path (beginPath ... ) describing the candy outline.
  const body = (shape, mid) => {
    if (sel) { ctx.shadowColor = '#fff'; ctx.shadowBlur = cell * .25; }   // selected candies glow
    shape(); ctx.fillStyle = col; ctx.fill(); ctx.shadowBlur = 0;
    if (mid) { ctx.save(); shape(); ctx.clip(); mid(); ctx.restore(); }
    const g = ctx.createRadialGradient(-w * .15, -w * .18, w * .03, 0, 0, w * .5);  // glossy shine
    g.addColorStop(0, 'rgba(255,255,255,.6)'); g.addColorStop(.45, 'rgba(255,255,255,0)'); g.addColorStop(1, 'rgba(20,0,40,.3)');
    shape(); ctx.fillStyle = g; ctx.fill();
    shape(); ctx.stroke();
  };
  const shine = (x, y, rx, ry, a) => {   // little white glint
    ctx.fillStyle = 'rgba(255,255,255,.85)'; ctx.beginPath(); ctx.ellipse(x, y, rx, ry, a, 0, 6.283); ctx.fill();
  };
  const shape = k % 3;
  if (shape === 0) {
    // wrapper ends: ruffled fans with pleat lines, drawn first so the body sits on top
    for (const d of [-1, 1]) {
      ctx.beginPath(); ctx.moveTo(d * w * .28, -w * .07); ctx.lineTo(d * w * .46, -w * .3);
      ctx.quadraticCurveTo(d * w * .55, -w * .15, d * w * .5, 0);
      ctx.quadraticCurveTo(d * w * .55, w * .15, d * w * .46, w * .3);
      ctx.lineTo(d * w * .28, w * .07); ctx.closePath();
      ctx.fillStyle = col; ctx.fill(); ctx.fillStyle = 'rgba(255,255,255,.55)'; ctx.fill(); ctx.stroke();
      ctx.lineWidth = 1.5;
      for (const y of [-.17, 0, .17]) { ctx.beginPath(); ctx.moveTo(d * w * .3, y * .3 * w); ctx.lineTo(d * w * .5, y * w); ctx.stroke(); }
      ctx.lineWidth = sel ? 5 : 3;
    }
    body(() => { ctx.beginPath(); ctx.ellipse(0, 0, w * .34, w * .33, 0, 0, 6.283); });
    shine(-w * .17, -w * .17, w * .07, w * .035, -.7);
  } else if (shape === 1) {
    // spiral swirl: wedges whose angle bends with the radius, clipped inside the circle
    const R = w * .44;
    body(() => { ctx.beginPath(); ctx.arc(0, 0, R, 0, 6.283); }, () => {
      ctx.fillStyle = 'rgba(255,255,255,.5)';
      for (let i = 0; i < 6; i++) {
        const a0 = i * Math.PI / 3; ctx.beginPath(); ctx.moveTo(0, 0);
        for (let q = 0; q <= 10; q++) ctx.lineTo(Math.cos(a0 + q / 10 * 1.1) * R * 1.1 * q / 10, Math.sin(a0 + q / 10 * 1.1) * R * 1.1 * q / 10);
        for (let q = 10; q >= 0; q--) ctx.lineTo(Math.cos(a0 + .5 + q / 10 * 1.1) * R * 1.1 * q / 10, Math.sin(a0 + .5 + q / 10 * 1.1) * R * 1.1 * q / 10);
        ctx.closePath(); ctx.fill();
      }
    });
    shine(-w * .24, -w * .24, w * .08, w * .04, -.8);
  } else {
    // gumdrop: dome with a flat rounded base, sprinkled with sugar crystals
    body(() => {
      ctx.beginPath(); ctx.moveTo(-w * .42, w * .3); ctx.bezierCurveTo(-w * .42, -w * .56, w * .42, -w * .56, w * .42, w * .3);
      ctx.quadraticCurveTo(w * .42, w * .42, w * .3, w * .42); ctx.lineTo(-w * .3, w * .42);
      ctx.quadraticCurveTo(-w * .42, w * .42, -w * .42, w * .3); ctx.closePath();
    }, () => {
      ctx.fillStyle = 'rgba(255,255,255,.8)';
      for (const [x, y] of [[-.3,-.1],[-.12,-.3],[.2,-.22],[.32,.05],[-.32,.2],[.15,.3],[-.05,.38],[.38,.28]]) {
        ctx.beginPath(); ctx.arc(x * w, y * w, w * .018, 0, 6.283); ctx.fill();
      }
    });
    shine(-w * .2, -w * .22, w * .07, w * .035, -.8);
  }
  // BIG number in the middle (font shrinks only for long numbers)
  const str = String(t.v), n = str.length;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = Math.floor(cell * (n <= 2 ? .4 : n === 3 ? .32 : n === 4 ? .25 : .2)) + 'px Impact,"Arial Black",sans-serif';
  ctx.lineWidth = cell * .08; ctx.strokeStyle = 'rgba(255,255,255,.95)'; ctx.strokeText(str, 0, cell * .03); // light outline
  ctx.fillStyle = T().edge; ctx.fillText(str, 0, cell * .03);
  ctx.restore();
}
let lastTs = 0;
function frame(ts) {
  const dt = Math.min(0.05, (ts - lastTs) / 1000 || 0.016); lastTs = ts;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, cv.width, cv.height);
  // faint board slots
  ctx.fillStyle = T().slot;
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) { rrect(c * cell + 4, r * cell + 4, cell - 8, cell - 8, cell * .14); ctx.fill(); }
  // animate tiles toward their slots (smooth easing)
  if (grid.length) {
    let moving = false; const k = 1 - Math.pow(0.0004, dt);
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
      const t = grid[r][c]; if (!t) continue;
      t.y += (r - t.y) * k; t.s += (1 - t.s) * k;
      if (Math.abs(r - t.y) < 0.02) t.y = r; else moving = true;
      if (Math.abs(1 - t.s) < 0.01) t.s = 1;
      const sel = chain.some(p => p.r === r && p.c === c);
      drawTile(t, r, c, sel);
    }
    if (settling && !moving) { // everything landed
      settling = false;
      if (checkOver && state === 'play') { checkOver = false;
        if (!hasMove()) {
          if (shuffles > 0) {   // no pairs left, but shuffles are: Amigo uses one instead of ending the game
            shuffles--; mix(); sfx.shuffle(); rumbleFx(1.5); checkOver = true; settling = true; updateStats(); cheer('save');
          } else {
            state = 'over'; sfx.over(); closeCoach(); cheer('over', { s: score });
            setTimeout(() => { if (!helpOpen) showOverlay('over'); }, 700);
          }
        } }
    }
  }
  // chain trail
  if (chain.length > 1) {
    ctx.lineWidth = cell * .14; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = T().trail;
    ctx.beginPath(); chain.forEach((p, i) => { const x = (p.c + .5) * cell, y = (p.r + .5) * cell; i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); });
    ctx.stroke();
  }
  // particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i]; p.life -= dt * (p.text || p.emoji ? 0.9 : 1.6);
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    p.x += p.vx * dt; p.y += p.vy * dt; if (!p.text) p.vy += (p.emoji ? 200 : 500) * dt;
    ctx.globalAlpha = Math.min(1, p.life);
    if (p.text) { ctx.font = Math.floor(cell * .5) + 'px Impact,"Arial Black",sans-serif'; ctx.textAlign = 'center';
      ctx.lineWidth = 5; ctx.strokeStyle = '#000'; ctx.strokeText(p.text, p.x, p.y); ctx.fillStyle = p.color || '#7dff6a'; ctx.fillText(p.text, p.x, p.y); }
    else if (p.emoji) { ctx.font = Math.floor(cell * .4) + 'px sans-serif'; ctx.textAlign = 'center'; ctx.fillText(p.emoji, p.x, p.y); }
    else { ctx.fillStyle = p.color; ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size); }
    ctx.globalAlpha = 1;
  }
  // confetti over the whole screen
  fctx.setTransform(dpr, 0, 0, dpr, 0, 0); fctx.clearRect(0, 0, innerWidth, innerHeight);
  for (let i = confetti.length - 1; i >= 0; i--) {
    const p = confetti[i]; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
    if (p.y > innerHeight + 30) { confetti.splice(i, 1); continue; }
    fctx.save(); fctx.translate(p.x, p.y); fctx.rotate(p.rot); fctx.fillStyle = p.color; fctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); fctx.restore();
  }
  requestAnimationFrame(frame);
}

/* ================= BOOT ================= */
best = store.get('best', 0);
voiceOn = store.get('voice', true); setVoice(voiceOn);
resize(); setTheme(store.get('theme', 'spooky')); newGame(); showOverlay('title'); requestAnimationFrame(frame);
</script>
