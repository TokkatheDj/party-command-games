<!-- CONCEPT: PRETEND PLAY (florist) - Poppy's Flower Stall: animal customers come to Poppy the hedgehog's flower stall with a picture order (3 red tulips and 2 sunflowers...), and kids tap the flower buckets to gather exactly that bouquet, then wrap it in paper, tie a ribbon and hand it over; four days grow from one kind of flower with counting dots, to two kinds, to matching the wrapping paper and ribbon, to big three-kind bunches with numerals only, and thirsty buckets droop until you water them; plus Free Arrange and a saved shop window of the last bouquets made. No timer, no losing - a wrong count just gets a friendly hint and the right bucket glows. Ages 4-9. [style: Clay / sound: Marimba] -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Poppy's Flower Stall</title>
<style>
:root{
  --bg:#e9e4f5; --panel:#f4f1fb; --card:#ffffff; --text:#2a2340; --muted:#5b5470;
  --btn:#6b4fd8; --btn-text:#ffffff; --btn-dark:#4a33a8; --accent:#b0005a;
  --ok:#1e854a; --glow:#ffb000;
  --r:24px; --gap:clamp(6px,2vw,12px);
  --shadow:-4px -4px 10px rgba(255,255,255,.85), 6px 8px 16px rgba(70,50,130,.22);
  --shadow-in:inset -3px -3px 8px rgba(255,255,255,.8), inset 4px 5px 10px rgba(70,50,130,.18);
  --font:"Nunito","Trebuchet MS",sans-serif;
}
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none;
  background:var(--bg);color:var(--text);font-family:var(--font);font-weight:600}
[hidden]{display:none!important}
button{font-family:inherit;font-weight:800;color:var(--text);border:0;cursor:pointer;border-radius:var(--r);
  background:var(--panel);box-shadow:var(--shadow);transition:transform .12s ease, box-shadow .12s ease;min-height:48px}
button:active{transform:scale(.93);box-shadow:var(--shadow-in)}
button:focus-visible{outline:4px solid var(--btn-dark);outline-offset:3px}
button.primary{background:var(--btn);color:var(--btn-text)}
button:disabled{cursor:default}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#app{height:100vh;height:100dvh;display:flex;flex-direction:column;max-width:640px;margin:0 auto;position:relative}
.screen{flex:1;display:flex;flex-direction:column;min-height:0}

/* ---------- menu ---------- */
#menu{overflow-y:auto;padding:14px 14px 24px;gap:12px}
.toprow{display:flex;justify-content:flex-end}
h1{margin:4px 0 0;text-align:center;font-weight:800;font-size:clamp(30px,9vw,46px);line-height:1.05;
  background:linear-gradient(90deg,#6b4fd8,#b0005a);-webkit-background-clip:text;background-clip:text;color:transparent}
.desc{margin:0;text-align:center;color:var(--muted);font-size:clamp(14px,3.8vw,18px)}
.poppy{display:flex;align-items:center;gap:10px;background:var(--panel);border-radius:var(--r);padding:10px 14px;box-shadow:var(--shadow)}
.poppy .face{font-size:44px;line-height:1}
.poppy p{margin:0;font-size:clamp(14px,3.8vw,18px)}
#days{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.daybtn{padding:12px 10px;min-height:96px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:clamp(15px,4vw,19px)}
.daybtn .num{font-size:clamp(20px,5.5vw,26px)}
.daybtn .sub{font-weight:600;font-size:clamp(12px,3.3vw,15px);color:var(--muted)}
.daybtn .done{font-size:13px;color:var(--ok);font-weight:800}
#freeBtn{min-height:64px;font-size:clamp(17px,4.6vw,22px)}
.window{background:var(--panel);border-radius:var(--r);padding:10px 12px;box-shadow:var(--shadow-in)}
.window h3{margin:0 0 6px;font-size:clamp(15px,4vw,19px)}
.window .shelf{display:flex;gap:6px;flex-wrap:wrap;min-height:70px;align-items:flex-end}
.window .shelf svg{width:70px;height:62px}
.window .empty{color:var(--muted);font-size:15px}
.window .made{margin:6px 0 0;color:var(--muted);font-size:15px}

/* ---------- play ---------- */
.bar{display:flex;align-items:center;gap:8px;padding:8px 10px 2px}
.bar h2{flex:1;margin:0;font-size:clamp(17px,4.8vw,24px);font-weight:800;line-height:1.1}
.bar h2 small{display:block;font-size:clamp(12px,3.3vw,15px);color:var(--muted);font-weight:700}
.iconbtn{width:48px;height:48px;min-height:48px;padding:0;font-size:22px;border-radius:16px;flex:none}
#mute[aria-pressed="true"]{background:var(--btn-dark);color:#fff}
.pips{display:flex;gap:5px}
.pips i{width:12px;height:12px;border-radius:50%;background:#cfc6ea;box-shadow:var(--shadow-in)}
.pips i.on{background:var(--ok)}
.pips i.now{background:var(--btn)}
#front{display:flex;align-items:center;gap:10px;padding:6px 10px;min-height:96px}
.cust{flex:none;width:clamp(64px,18vw,84px);height:clamp(64px,18vw,84px);border-radius:50%;background:var(--panel);box-shadow:var(--shadow);
  display:flex;align-items:center;justify-content:center;font-size:clamp(38px,11vw,52px);position:relative}
.cust .nm{position:absolute;bottom:-10px;left:50%;transform:translateX(-50%);background:var(--card);border-radius:10px;padding:0 6px;font-size:12px;white-space:nowrap;font-weight:800;box-shadow:0 2px 4px rgba(70,50,130,.2)}
.cust.enter{animation:enter .5s ease-out}
.cust.happy{animation:hop .5s ease-in-out 2}
@keyframes enter{from{transform:translateX(120px);opacity:0}to{transform:none;opacity:1}}
@keyframes hop{50%{transform:translateY(-14px) rotate(-6deg)}}
.bubble{flex:1;min-width:0;background:var(--card);border-radius:20px;padding:8px 10px;position:relative;box-shadow:var(--shadow)}
.bubble::before{content:"";position:absolute;left:-10px;top:50%;margin-top:-10px;border:10px solid transparent;border-right-color:var(--card);border-left:0}
.bubble .hi{margin:0 0 4px;font-size:clamp(13px,3.6vw,16px);color:var(--muted);display:flex;align-items:center;gap:6px}
.bubble .hi span{flex:1}
.hear{min-height:44px;width:44px;padding:0;border-radius:14px;font-size:20px;flex:none}
.order{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.oi{display:flex;align-items:center;gap:2px;font-size:clamp(20px,6vw,28px);font-weight:800}
.oi svg{width:clamp(32px,9vw,42px);height:clamp(32px,9vw,42px)}
.oi .dots{font-size:11px;letter-spacing:1px;max-width:52px;line-height:1.1;color:var(--text)}
.sw{display:flex;align-items:center;gap:4px;font-size:clamp(12px,3.4vw,15px);font-weight:800}
.sw i{width:22px;height:22px;border-radius:7px;border:2px solid #2a2340;display:inline-block}
.sw i.rib{border-radius:50%}
#bqWrap{flex:1 1 auto;min-height:110px;display:flex;justify-content:center;align-items:stretch;position:relative}
#bq{height:100%;width:100%;max-width:340px;display:block}
#bq .hd{cursor:pointer}
.wig{animation:wig .45s ease-in-out 3;transform-box:fill-box;transform-origin:center}
@keyframes wig{25%{transform:rotate(-14deg)}75%{transform:rotate(14deg)}}
#bqWrap.fly svg{animation:fly .7s ease-in forwards}
@keyframes fly{to{transform:translate(-30%,-55%) scale(.35);opacity:0}}
#msg{height:48px;margin:0 12px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:clamp(14px,3.9vw,18px);font-weight:800;line-height:1.15}
#msg > span{display:inline}
#msg svg{width:24px;height:24px;vertical-align:middle}
#work{padding:4px 10px;display:grid;grid-template-columns:repeat(3,1fr);gap:var(--gap)}
.bucket{padding:2px 2px 4px;min-height:clamp(78px,12.5vh,100px);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;font-size:clamp(12px,3.3vw,15px);line-height:1.05;position:relative}
.bucket svg{width:100%;max-width:92px;height:clamp(50px,8.5vh,70px)}
.bucket.glow{animation:glow 1s ease-in-out infinite;}
@keyframes glow{50%{box-shadow:0 0 0 5px var(--glow),var(--shadow)}}
.bucket.thirsty{background:#efe3c7}
.bucket .drop{position:absolute;top:4px;right:6px;font-size:18px}
.bucket.splash::after{content:"💧💧💧";position:absolute;top:-6px;left:0;right:0;text-align:center;font-size:16px;animation:rain .6s ease-in forwards}
@keyframes rain{from{transform:translateY(-12px);opacity:1}to{transform:translateY(26px);opacity:0}}
.choice{min-height:clamp(96px,15vh,130px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:clamp(14px,3.9vw,18px)}
.choice i{width:52px;height:52px;border-radius:14px;border:3px solid #2a2340;display:block}
.choice i.rib{border-radius:50%}
.choice.glow{animation:glow 1s ease-in-out infinite}
.choice.wig{animation:wig .45s ease-in-out 2}
#actions{display:flex;gap:10px;padding:8px 10px 12px}
#actions button{flex:1;min-height:58px;font-size:clamp(16px,4.4vw,21px)}

/* ---------- overlay ---------- */
#over{position:absolute;inset:0;background:rgba(42,35,64,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:5}
.card{background:var(--panel);border-radius:28px;padding:20px;max-width:420px;width:100%;text-align:center;box-shadow:var(--shadow)}
.card h2{margin:0 0 6px;font-size:clamp(24px,7vw,34px);font-weight:800}
.card p{margin:0 0 10px;font-size:clamp(15px,4vw,19px);color:var(--muted)}
.card .row{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;margin-bottom:12px}
.card .row svg{width:56px;height:50px}
.card .btns{display:flex;flex-direction:column;gap:10px}
.card .btns button{min-height:56px;font-size:clamp(16px,4.4vw,20px)}
.sticker{font-size:56px;line-height:1;display:block;margin-bottom:6px;animation:hop .6s ease-in-out 2}
.petal{position:absolute;top:-20px;width:14px;height:10px;border-radius:60% 40% 60% 40%;pointer-events:none;z-index:6;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg)}}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}
  .petal{display:none}
}
</style>
</head>
<body>
<div id="app">
  <!-- MENU -->
  <section id="menu" class="screen" aria-label="Menu">
    <div class="toprow"><button class="iconbtn mutebtn" aria-pressed="false" aria-label="Sound off">🔊</button></div>
    <h1>Poppy's Flower Stall</h1>
    <p class="desc">Animal friends want flowers! Pick the right bunch, wrap it up, tie a bow and hand it over.</p>
    <div class="poppy"><span class="face" aria-hidden="true">🦔</span><p id="poppySay">Hi, I'm Poppy! Will you help me run my flower stall today?</p></div>
    <div id="days"></div>
    <button id="freeBtn" class="primary">🌷 Free Arrange</button>
    <div class="window">
      <h3>Shop window</h3>
      <div class="shelf" id="shelf"></div>
      <p class="made" id="made"></p>
    </div>
  </section>

  <!-- PLAY -->
  <section id="play" class="screen" aria-label="Flower stall" hidden>
    <div class="bar">
      <button class="iconbtn" id="home" aria-label="Menu">🏠</button>
      <h2>Poppy's Flower Stall<small id="dayName"></small></h2>
      <div class="pips" id="pips" aria-hidden="true"></div>
      <span class="sr" id="pipsSr"></span>
      <button class="iconbtn mutebtn" aria-pressed="false" aria-label="Sound off">🔊</button>
    </div>
    <div id="front">
      <div class="cust" id="cust" aria-hidden="true"></div>
      <div class="bubble">
        <p class="hi"><span id="hi"></span><button class="hear" id="hear" aria-label="Hear the order">🗣️</button></p>
        <div class="order" id="order"></div>
        <span class="sr" id="orderSr"></span>
      </div>
    </div>
    <div id="bqWrap"></div>
    <div id="msg" aria-live="polite"></div>
    <div id="work"></div>
    <div id="actions"></div>
  </section>

  <div id="over" hidden><div class="card" id="overCard" role="dialog" aria-modal="true" aria-labelledby="overTitle"></div></div>
</div>

<script>
/* ================= data ================= */
const FL=[
  {id:'rt',name:'red tulip',pl:'red tulips',label:'Red tulips',kind:'tulip',c:'#d7263d'},
  {id:'pt',name:'purple tulip',pl:'purple tulips',label:'Purple tulips',kind:'tulip',c:'#8a4fd6'},
  {id:'pr',name:'pink rose',pl:'pink roses',label:'Pink roses',kind:'rose',c:'#f06aa6'},
  {id:'wd',name:'white daisy',pl:'white daisies',label:'Daisies',kind:'daisy',c:'#ffffff'},
  {id:'sf',name:'sunflower',pl:'sunflowers',label:'Sunflowers',kind:'sun',c:'#ffc21a'},
  {id:'bb',name:'bluebell',pl:'bluebells',label:'Bluebells',kind:'bell',c:'#3a7bd5'},
];
const FLM=Object.fromEntries(FL.map(f=>[f.id,f]));
const PAPERS=[{id:'pk',name:'Pink',c:'#f7b6d2'},{id:'bl',name:'Blue',c:'#a8d4f5'},{id:'gn',name:'Green',c:'#b7e4a7'}];
const RIBBONS=[{id:'rd',name:'Red',c:'#d7263d'},{id:'yl',name:'Yellow',c:'#ffd23f'},{id:'pu',name:'Purple',c:'#6b2fb3'}];
const PM=Object.fromEntries(PAPERS.map(p=>[p.id,p])), RM=Object.fromEntries(RIBBONS.map(p=>[p.id,p]));
const CUSTS=[['🐻','Bo'],['🐰','Bea'],['🦊','Fen'],['🐸','Flo'],['🐷','Pip'],['🐨','Kit'],['🐼','Pan'],['🐯','Tess'],['🐭','Milo'],['🦉','Opal'],['🐶','Rex'],['🐱','Mimi']];
const FOR=['for my grandma','for a birthday party','for my teacher','to say thank you','for my best friend','for my mum','for my dad','to cheer up my brother','for a picnic','just because'];
const DAYS=[
  {n:1,name:'Little Orders',sub:'One kind, count to 5'},
  {n:2,name:'Two Kinds',sub:'Mix two flowers'},
  {n:3,name:'Pretty Wrapping',sub:'Match paper and bow'},
  {n:4,name:'Big Bunches',sub:'Up to 10 flowers'},
];
const PER_DAY=5;

/* ================= storage ================= */
const KEY='cowork-poppy-flower-stall-progress';
function load(){const d={days:{},made:0,window:[]};try{return Object.assign(d,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){return d}}
let P=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(P))}catch(e){}}

/* ================= sound: Marimba kit ================= */
let AC=null,master=null,muted=localStorage.getItem('cowork-poppy-flower-stall-muted')==='1';
function audio(){
  if(!AC){
    const C=window.AudioContext||window.webkitAudioContext; if(!C) return null;
    AC=new C(); const comp=AC.createDynamicsCompressor(); comp.threshold.value=-18; comp.ratio.value=4;
    master=AC.createGain(); master.gain.value=muted?0:0.7; master.connect(comp); comp.connect(AC.destination);
  }
  if(AC.state==='suspended') AC.resume();
  return AC;
}
// FM marimba: sine carrier + sine modulator at 4x, modulation index falling fast
function mar(f,when=0,vel=.45,dec=.4){
  const ac=audio(); if(!ac) return;
  const t=ac.currentTime+when+0.005;
  const car=ac.createOscillator(); car.type='sine'; car.frequency.value=f;
  const mod=ac.createOscillator(); mod.type='sine'; mod.frequency.value=f*4;
  const mg=ac.createGain(); mg.gain.setValueAtTime(f*2.6,t); mg.gain.exponentialRampToValueAtTime(f*0.02,t+0.07);
  mod.connect(mg); mg.connect(car.frequency);
  const g=ac.createGain(); g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vel,t+0.008); g.gain.exponentialRampToValueAtTime(0.0001,t+dec);
  car.connect(g); g.connect(master);
  car.start(t); mod.start(t); car.stop(t+dec+0.05); mod.stop(t+dec+0.05);
}
const PENT=[262,294,330,392,440,523,587,659,784,880,1047,1175];
const SND={
  tap(){mar(880,0,.22,.14)},
  pick(n){mar(PENT[Math.min(n+2,PENT.length-1)],0,.42,.4)},
  back(){mar(523,0,.3,.18);mar(392,.08,.3,.25)},
  wrong(){mar(247,0,.5,.45);mar(208,.2,.5,.55)},
  wrap(){[523,659,784].forEach((f,i)=>mar(f,i*.06,.3,.25))},
  bow(){[784,659].forEach((f,i)=>mar(f,i*.07,.3,.3))},
  water(){[1175,1047,880,784,659,523].forEach((f,i)=>mar(f,i*.05,.22,.25))},
  motif(){[392,523,659,784].forEach((f,i)=>mar(f,i*.13,.45,i===3?.6:.35))},
  give(){[523,659,784,1047].forEach((f,i)=>mar(f,i*.11,.45,i===3?.7:.35))},
  fanfare(){[392,523,659,784,659,784,1047].forEach((f,i)=>mar(f,i*.12,.45,i===6?.9:.3))},
};
function speak(t){
  if(muted||!('speechSynthesis' in window)) return;
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.rate=.95;u.pitch=1.15;speechSynthesis.speak(u)}catch(e){}
}
function setMute(m){
  muted=m; localStorage.setItem('cowork-poppy-flower-stall-muted',m?'1':'0');
  if(master) master.gain.value=m?0:.7;
  if(m&&'speechSynthesis' in window) speechSynthesis.cancel();
  document.querySelectorAll('.mutebtn').forEach(b=>{b.setAttribute('aria-pressed',m);b.textContent=m?'🔇':'🔊'});
}
document.querySelectorAll('.mutebtn').forEach(b=>b.onclick=()=>{setMute(!muted);if(!muted)SND.tap()});

/* ================= drawing ================= */
function shade(hex,f){const n=parseInt(hex.slice(1),16);const r=(n>>16)*f|0,g=((n>>8)&255)*f|0,b=(n&255)*f|0;return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1)}
function headSVG(fl,x,y,s,rot=0){
  const c=fl.c, d=fl.id==='wd'?'#8d86a3':shade(c,.62); let g='';
  if(fl.kind==='tulip') g=`<path d="M-10,-5 Q-12,10 0,12 Q12,10 10,-5 L6,1 L3,-9 L0,-1 L-3,-9 L-6,1Z" fill="${c}" stroke="${d}" stroke-width="1.6" stroke-linejoin="round"/><path d="M-5,3 Q-4,8 0,9" stroke="#fff" stroke-opacity=".5" stroke-width="2" fill="none" stroke-linecap="round"/>`;
  else if(fl.kind==='rose') g=`<circle r="11" fill="${c}" stroke="${d}" stroke-width="1.6"/><path d="M-5,2 Q0,-7 5,0 Q2,6 -2,3 Q-1,-1 2,0" fill="none" stroke="${d}" stroke-width="1.6" stroke-linecap="round"/><path d="M-9,4 Q-4,11 4,10" fill="none" stroke="${d}" stroke-width="1.4"/>`;
  else if(fl.kind==='daisy'){for(let i=0;i<8;i++)g+=`<ellipse cy="-8" rx="3.7" ry="7" fill="#fff" stroke="${d}" stroke-width="1.1" transform="rotate(${i*45})"/>`;g+=`<circle r="4.6" fill="#ffc21a" stroke="#a87400" stroke-width="1"/>`}
  else if(fl.kind==='sun'){for(let i=0;i<12;i++)g+=`<ellipse cy="-9" rx="3.4" ry="6.5" fill="${c}" stroke="#a87400" stroke-width="1" transform="rotate(${i*30})"/>`;g+=`<circle r="6.6" fill="#6b3e1f" stroke="#3d220f" stroke-width="1"/>`}
  else g=`<path d="M-9,7 Q-10,-11 0,-11 Q10,-11 9,7 Q5,4 3,8 Q0,4 -3,8 Q-5,4 -9,7Z" fill="${c}" stroke="${d}" stroke-width="1.6" stroke-linejoin="round"/><circle cy="9" r="2" fill="${d}"/>`;
  return `<g transform="translate(${x.toFixed(1)},${y.toFixed(1)}) rotate(${rot.toFixed(1)}) scale(${s})">${g}</g>`;
}
function bucketSVG(fl,wilt){
  const pos=wilt?[[14,40,-105],[40,30,170],[66,40,105]]:[[22,20,-14],[40,12,0],[58,20,14]];
  let s='';
  pos.forEach(([x,y,r])=>{const cx=wilt?(x+40)/2:(x+40)/2, cy=wilt?14:30;s+=`<path d="M40,46 Q${cx},${cy} ${x},${y}" stroke="#3f8f3a" stroke-width="3" fill="none" stroke-linecap="round"/>`});
  pos.forEach(([x,y,r])=>s+=headSVG(fl,x,y,1,r));
  s+=`<path d="M16,40 L64,40 L58,63 L22,63Z" fill="#b9a8e6" stroke="#6b5aa8" stroke-width="2" stroke-linejoin="round"/><path d="M14,40 L66,40" stroke="#6b5aa8" stroke-width="4" stroke-linecap="round"/>`;
  return `<svg viewBox="0 0 80 66" aria-hidden="true">${s}</svg>`;
}
const OUT=[0,18,-18,36,-36],INN=[-9,9,-27,27,0];
function bouquetSVG(stems,paper,ribbon,o={}){
  const bx=120,by=196; let st='',hd='',pb='',pf='',bow='';
  stems.forEach((id,i)=>{
    const fl=FLM[id]; const deg=i<5?OUT[i]:INN[i-5]; const a=deg*Math.PI/180; const r=i<5?125:92;
    const x=bx+r*Math.sin(a), y=by-r*Math.cos(a);
    st+=`<path d="M${bx},${by} Q${(bx+r*.45*Math.sin(a)).toFixed(1)},${(by-r*.55).toFixed(1)} ${x.toFixed(1)},${y.toFixed(1)}" stroke="#3f8f3a" stroke-width="4" fill="none" stroke-linecap="round"/>`;
    hd+=`<g class="hd${o.wig&&o.wig.includes(i)?' wig':''}" data-i="${i}">${headSVG(fl,x,y,1.7,deg*.5)}</g>`;
  });
  if(paper){const c=PM[paper].c;
    pb=`<path d="M46,112 L194,112 L134,198 L106,198Z" fill="${shade(c,.86)}" stroke="${shade(c,.6)}" stroke-width="2" stroke-linejoin="round"/>`;
    pf=`<path d="M34,132 Q58,118 77,138 Q98,121 120,140 Q142,121 163,138 Q182,118 206,132 L136,199 L104,199Z" fill="${c}" stroke="${shade(c,.6)}" stroke-width="2.2" stroke-linejoin="round"/>`;}
  if(ribbon){const c=RM[ribbon].c,d=shade(c,.6);
    bow=`<g transform="translate(120,178)"><path d="M-2,2 L-13,22 M2,2 L13,22" stroke="${c}" stroke-width="6" stroke-linecap="round"/><path d="M0,0 Q-24,-18 -25,0 Q-24,15 0,0Z" fill="${c}" stroke="${d}" stroke-width="2"/><path d="M0,0 Q24,-18 25,0 Q24,15 0,0Z" fill="${c}" stroke="${d}" stroke-width="2"/><circle r="6" fill="${c}" stroke="${d}" stroke-width="2"/></g>`;}
  const empty=!stems.length&&o.hint?`<text x="120" y="150" text-anchor="middle" font-family="Nunito,Trebuchet MS,sans-serif" font-weight="800" font-size="15" fill="#5b5470">Tap a bucket to pick flowers</text><path d="M120,160 L120,190 M110,180 L120,192 L130,180" stroke="#5b5470" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`:'';
  return `<svg viewBox="20 40 200 162" ${o.id?`id="${o.id}"`:''} aria-hidden="true">${pb}${st}${pf}${hd}${bow}${empty}</svg>`;
}

/* ================= helpers ================= */
const $=s=>document.querySelector(s);
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const NUMW=['zero','one','two','three','four','five','six','seven','eight','nine','ten'];
const icon=id=>`<svg viewBox="-16 -16 32 32" aria-hidden="true">${headSVG(FLM[id],0,0,1.15)}</svg>`;
function say(html){ $('#msg').innerHTML=`<span>${html}</span>`; }

/* ================= orders ================= */
function makeOrder(day,i){
  let items=[];
  if(day===1){const f=pick(FL); items=[{id:f.id,n:Math.min(5,1+i+rnd(0,1))}];}
  else if(day===2){shuffle(FL).slice(0,2).forEach(f=>items.push({id:f.id,n:rnd(1,3)}));}
  else if(day===3){const k=i<2?1:2; shuffle(FL).slice(0,k).forEach(f=>items.push({id:f.id,n:rnd(1,k===1?5:3)}));}
  else {const k=i<2?2:3; let left=10; shuffle(FL).slice(0,k).forEach((f,j)=>{const n=Math.min(left-(k-j-1),rnd(2,4));left-=n;items.push({id:f.id,n})});}
  const o={items,dots:day<4,paper:day>=3?pick(PAPERS).id:null,ribbon:day>=3?pick(RIBBONS).id:null};
  return o;
}
function orderText(o){
  const parts=o.items.map(it=>`${NUMW[it.n]} ${it.n===1?FLM[it.id].name:FLM[it.id].pl}`);
  let s=parts.length>1?parts.slice(0,-1).join(', ')+' and '+parts.at(-1):parts[0];
  if(o.paper) s+=`, in ${PM[o.paper].name.toLowerCase()} paper with a ${RM[o.ribbon].name.toLowerCase()} bow`;
  return s;
}

/* ================= game state ================= */
let G=null;
function startDay(day){
  const custs=shuffle(CUSTS);
  G={day,free:false,i:0,orders:Array.from({length:PER_DAY},(_,i)=>makeOrder(day,i)),custs:custs.slice(0,PER_DAY),made:[],wilt:new Set(),stems:[],phase:'pick',paper:null,ribbon:null,hints:0};
  show('play'); SND.motif(); nextCustomer(true);
}
function startFree(){
  G={day:0,free:true,i:0,orders:[],custs:[['🦔','Poppy']],made:[],wilt:new Set(),stems:[],phase:'pick',paper:null,ribbon:null};
  show('play'); SND.motif(); nextCustomer(true);
}
function nextCustomer(first){
  G.stems=[];G.phase='pick';G.paper=null;G.ribbon=null;
  const c=$('#cust');
  if(G.free){
    c.innerHTML='🦔<span class="nm">Poppy</span>';
    $('#hi').textContent='Make any bouquet you like!';
    $('#order').innerHTML='<span class="sw">Pick flowers, wrap, tie a bow, then put it in the shop window.</span>';
    $('#orderSr').textContent='';
    $('#dayName').textContent='Free Arrange';
    $('#pips').innerHTML='';$('#pipsSr').textContent='';
    say('Pick as many flowers as you like (up to 10).');
  } else {
    const [em,nm]=G.custs[G.i], o=G.orders[G.i];
    c.innerHTML=`${em}<span class="nm">${nm}</span>`;
    $('#hi').textContent=`Hi! I'm ${nm}. ${FOR[(G.i*3+G.day)%FOR.length][0].toUpperCase()+FOR[(G.i*3+G.day)%FOR.length].slice(1)}, please:`;
    let h=o.items.map(it=>`<span class="oi">${icon(it.id)}<span aria-hidden="true">${it.n}</span>${o.dots?`<span class="dots" aria-hidden="true">${'●'.repeat(it.n)}</span>`:''}</span>`).join('');
    if(o.paper) h+=`<span class="sw" aria-hidden="true"><i style="background:${PM[o.paper].c}"></i>paper</span><span class="sw" aria-hidden="true"><i class="rib" style="background:${RM[o.ribbon].c}"></i>bow</span>`;
    $('#order').innerHTML=h;
    $('#orderSr').textContent='Order: '+orderText(o)+'.';
    $('#dayName').textContent=`Day ${G.day} · ${DAYS[G.day-1].name}`;
    $('#pips').innerHTML=Array.from({length:PER_DAY},(_,k)=>`<i class="${k<G.i?'on':k===G.i?'now':''}"></i>`).join('');
    $('#pipsSr').textContent=`Customer ${G.i+1} of ${PER_DAY}`;
    // thirsty buckets: guaranteed on customers 2 and 4 from day 2 on
    if(G.day>=2&&(G.i===1||G.i===3)){const w=pick(o.items).id;G.wilt.add(w);}
    const thirsty=[...G.wilt];
    if(thirsty.length) say(`Oh no! The ${FLM[thirsty[0]].pl} ${icon(thirsty[0])} are thirsty. Tap their bucket to water them!`);
    else say('Tap the buckets to pick the flowers.');
    setTimeout(()=>speak(`Hi! I'm ${nm}. May I have ${orderText(o)}, please?`),first?700:300);
  }
  c.classList.remove('enter','happy');void c.offsetWidth;c.classList.add('enter');
  render();
}
$('#hear').onclick=()=>{SND.tap();if(G.free)speak('Make any bouquet you like!');else{const [,nm]=G.custs[G.i];speak(`May I have ${orderText(G.orders[G.i])}, please?`)}};

/* ================= rendering ================= */
function render(o={}){
  $('#bqWrap').classList.remove('fly');
  $('#bqWrap').innerHTML=bouquetSVG(G.stems,G.paper,G.ribbon,{id:'bq',wig:o.wig,hint:G.phase==='pick'});
  const W=$('#work'),A=$('#actions');
  if(G.phase==='pick'){
    W.innerHTML=FL.map(f=>{const th=G.wilt.has(f.id);return `<button class="bucket${th?' thirsty':''}${o.glow===f.id?' glow':''}" data-f="${f.id}" aria-label="${th?f.label+': thirsty, tap to water':f.label}">${th?'<span class="drop" aria-hidden="true">💧</span>':''}${bucketSVG(f,th)}<span aria-hidden="true">${f.label}</span></button>`}).join('');
    A.innerHTML=`<button id="undo">↩️ Put back</button><button id="wrapBtn" class="primary">🎁 Wrap it!</button>`;
    $('#undo').onclick=undo; $('#wrapBtn').onclick=tryWrap;
    W.querySelectorAll('.bucket').forEach(b=>b.onclick=()=>tapBucket(b.dataset.f,b));
  } else if(G.phase==='paper'||G.phase==='ribbon'){
    const isP=G.phase==='paper', L=isP?PAPERS:RIBBONS;
    W.innerHTML=L.map(x=>`<button class="choice${o.glow===x.id?' glow':''}${o.wigC===x.id?' wig':''}" data-c="${x.id}"><i class="${isP?'':'rib'}" style="background:${x.c}" aria-hidden="true"></i>${x.name} ${isP?'paper':'bow'}</button>`).join('');
    W.querySelectorAll('.choice').forEach(b=>b.onclick=()=>choose(b.dataset.c));
    A.innerHTML=`<button id="unwrap">↩️ Back to flowers</button>`;
    $('#unwrap').onclick=()=>{SND.back();G.phase='pick';G.paper=null;G.ribbon=null;say('Okay! Change the flowers, then wrap again.');render()};
  } else if(G.phase==='give'){
    W.innerHTML='';
    A.innerHTML=G.free?`<button id="giveBtn" class="primary">🪟 Put it in the window!</button>`:`<button id="giveBtn" class="primary">💐 Give it to ${G.custs[G.i][1]}!</button>`;
    $('#giveBtn').onclick=give;
  } else { W.innerHTML=''; A.innerHTML=''; }
  const svg=$('#bq');
  svg.onclick=e=>{const h=e.target.closest('.hd'); if(h&&G.phase==='pick') removeStem(+h.dataset.i);};
}

/* ================= actions ================= */
function tapBucket(id,btn){
  if(G.wilt.has(id)){
    G.wilt.delete(id); SND.water(); say(`Ahh! The ${FLM[id].pl} are fresh and perky again!`);
    render(); const nb=$(`.bucket[data-f="${id}"]`); if(nb){nb.classList.add('splash');nb.focus()} return;
  }
  if(G.stems.length>=10){SND.wrong();say('Ten flowers is a big armful! Wrap it up, or put one back.');return}
  G.stems.push(id); SND.pick(G.stems.length);
  const same=G.stems.filter(s=>s===id).length;
  say(`${same} ${icon(id)} ${same===1?FLM[id].name:FLM[id].pl}`);
  render(); $(`.bucket[data-f="${id}"]`)?.focus();
}
function removeStem(i){
  const id=G.stems.splice(i,1)[0]; SND.back(); say(`Back in the bucket: ${icon(id)}`); render();
}
function undo(){ if(!G.stems.length){SND.tap();say('Nothing to put back yet.');return} removeStem(G.stems.length-1); $('#undo')?.focus(); }
function check(){
  const o=G.orders[G.i], need={},have={};
  o.items.forEach(it=>need[it.id]=it.n); G.stems.forEach(id=>have[id]=(have[id]||0)+1);
  for(const id in have) if(!need[id]) return {t:'extra',id};
  for(const it of o.items){const h=have[it.id]||0; if(h<it.n) return {t:'few',id:it.id,d:it.n-h}; if(h>it.n) return {t:'many',id:it.id,d:h-it.n};}
  return null;
}
function tryWrap(){
  if(!G.stems.length){SND.wrong();say('Pick some flowers first!');render({glow:G.free?null:G.orders[G.i].items[0].id});return}
  if(!G.free){
    const p=check();
    if(p){
      SND.wrong(); G.hints++;
      if(p.t==='few'){say(`Almost! ${NUMW[p.d][0].toUpperCase()+NUMW[p.d].slice(1)} more ${icon(p.id)} ${p.d===1?FLM[p.id].name:FLM[p.id].pl}, please.`);render({glow:p.id});}
      else if(p.t==='many'){const idx=[];G.stems.forEach((s,k)=>{if(s===p.id)idx.push(k)});say(`Oops, ${NUMW[p.d]} too many ${icon(p.id)}! Tap one in the bunch to put it back.`);render({wig:idx.slice(-p.d)});}
      else {const idx=[];G.stems.forEach((s,k)=>{if(s===p.id)idx.push(k)});say(`I didn't ask for ${FLM[p.id].pl} ${icon(p.id)}. Tap it to put it back.`);render({wig:idx});}
      return;
    }
  }
  SND.wrap(); G.phase='paper';
  say(G.free||!G.orders[G.i].paper?'Perfect bunch! Now pick some wrapping paper.':'Perfect bunch! Which paper did they ask for?');
  render(); $('#work .choice')?.focus();
}
function choose(id){
  const o=G.free?null:G.orders[G.i];
  if(G.phase==='paper'){
    if(o&&o.paper&&id!==o.paper){SND.wrong();say(`Hmm, ${G.custs[G.i][1]} wants <b>${PM[o.paper].name.toLowerCase()}</b> paper. Look at the order!`);render({glow:o.paper,wigC:id});return}
    G.paper=id;G.phase='ribbon';SND.wrap();say(o&&o.ribbon?'Lovely! Now which colour bow?':'Lovely! Now tie a bow.');render();$('#work .choice')?.focus();
  } else {
    if(o&&o.ribbon&&id!==o.ribbon){SND.wrong();say(`So close! The order shows a <b>${RM[o.ribbon].name.toLowerCase()}</b> bow.`);render({glow:o.ribbon,wigC:id});return}
    G.ribbon=id;G.phase='give';SND.bow();say(G.free?'Beautiful! Put it in the shop window.':'Ta-da! It looks wonderful.');render();$('#giveBtn')?.focus();
  }
}
function give(){
  if(G.phase!=='give')return;
  G.phase='busy';
  const b={s:G.stems.slice(),p:G.paper,r:G.ribbon};
  P.made++; P.window.push(b); if(P.window.length>6)P.window=P.window.slice(-6); save();
  G.made.push(b);
  $('#bqWrap').classList.add('fly'); $('#work').innerHTML=''; $('#actions').innerHTML='';
  SND.give(); petals(10);
  const c=$('#cust'); c.classList.remove('enter'); void c.offsetWidth; c.classList.add('happy');
  if(G.free){say('In the window it goes! Make another one?');setTimeout(()=>nextCustomer(),1300);return}
  const nm=G.custs[G.i][1];
  const thanks=pick(['Thank you so much!','Oh wow, it\'s perfect!','Yay! They\'re beautiful!','Thank you, florist!']);
  say(`${nm}: “${thanks}” 💖`); speak(thanks);
  setTimeout(()=>{G.i++; if(G.i>=PER_DAY) dayDone(); else nextCustomer();},1600);
}
function dayDone(){
  P.days[G.day]=true; save();
  SND.fanfare(); petals(36);
  const last=G.day===4, all=DAYS.every(d=>P.days[d.n]);
  overlay(`<span class="sticker" aria-hidden="true">${['🌷','🌼','🌹','🌻'][G.day-1]}</span>
    <h2 id="overTitle">${last?'Flower Festival!':'Day '+G.day+' done!'}</h2>
    <p>You made ${PER_DAY} bouquets and every friend went home smiling.${all?' You finished every day at the stall!':''}</p>
    <div class="row">${G.made.map(b=>bouquetSVG(b.s,b.p,b.r)).join('')}</div>
    <div class="btns">${G.day<4?`<button class="primary" id="oNext">Next: Day ${G.day+1} · ${DAYS[G.day].name}</button>`:''}
    <button id="oAgain">Play Day ${G.day} again</button><button id="oMenu">🏠 Menu</button></div>`);
  $('#oNext')&&($('#oNext').onclick=()=>{closeOver();startDay(G.day+1)});
  $('#oAgain').onclick=()=>{closeOver();startDay(G.day)};
  $('#oMenu').onclick=()=>{closeOver();show('menu')};
}
function overlay(h){$('#overCard').innerHTML=h;$('#over').hidden=false;setTimeout(()=>$('#overCard button')?.focus(),50)}
function closeOver(){$('#over').hidden=true}
function petals(n){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const cols=['#f06aa6','#ffc21a','#d7263d','#8a4fd6','#3a7bd5','#ffffff'];
  for(let k=0;k<n;k++){const p=document.createElement('div');p.className='petal';p.style.left=Math.random()*100+'%';p.style.background=pick(cols);
    p.style.animationDuration=(1.8+Math.random()*1.6)+'s';p.style.animationDelay=Math.random()*.5+'s';$('#app').appendChild(p);setTimeout(()=>p.remove(),4200);}
}

/* ================= menu ================= */
function show(s){
  $('#menu').hidden=s!=='menu'; $('#play').hidden=s!=='play';
  if('speechSynthesis' in window) try{speechSynthesis.cancel()}catch(e){}
  if(s==='menu') renderMenu();
}
function renderMenu(){
  $('#days').innerHTML=DAYS.map(d=>`<button class="daybtn" data-d="${d.n}"><span class="num">Day ${d.n}</span>${d.name}<span class="sub">${d.sub}</span>${P.days[d.n]?'<span class="done">✔ done</span>':''}</button>`).join('');
  document.querySelectorAll('.daybtn').forEach(b=>b.onclick=()=>{audio();startDay(+b.dataset.d)});
  $('#shelf').innerHTML=P.window.length?P.window.map(b=>bouquetSVG(b.s,b.p,b.r)).join(''):'<span class="empty">Your bouquets will show up here.</span>';
  $('#made').textContent=P.made?`Bouquets made: ${P.made}`:'';
  const done=DAYS.filter(d=>P.days[d.n]).length;
  $('#poppySay').textContent=done===4?'You\'re a super florist! Play any day again, or make your own bouquets.':done?`Welcome back! ${4-done} more ${4-done===1?'day':'days'} at the stall to go.`:'Hi, I\'m Poppy! Will you help me run my flower stall today?';
}
$('#freeBtn').onclick=()=>{audio();startFree()};
$('#home').onclick=()=>{SND.tap();show('menu')};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#over').hidden){closeOver();show('menu')}});
setMute(muted); renderMenu();
</script>
</body>
