<!-- CONCEPT: NATURE & WEATHER - Nest to Flight: help three real bird families (Robin, Goldfinch, Cardinal) through a whole nesting season - tap the right nest materials off the ground so Mama bird builds her nest (twigs, grass, mud, moss, thistle fluff, leaves - not rocks, pinecones or toys), tap the eggs to keep them cozy when chilly gusts blow until they crack and hatch, fetch each family's real baby food (worms, seeds or caterpillars) and give it to the chick with its beak open, then tap to flap each fluffy fledgling across to Mama's branch for its first flight. No timer, no losing - a chick that lands in the grass just hops over and climbs up. Ages 4-11. -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Nest to Flight</title>
<style>
:root{
  --sky1:#8fd6ff; --sky2:#e3f6ff;
  --ink:#3a2a1a; --card:#fffdf4; --accent:#ff8a3d; --accent2:#ffcb3d;
  --green:#4cbf5a; --green2:#2f9e46; --blue:#3aa0ff; --pink:#ff6fa8;
  --hud:#fff7df; --shadow:0 6px 0 rgba(0,0,0,.14);
  --font:"Comic Sans MS","Trebuchet MS",system-ui,sans-serif;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0; padding: 0; height: 100%;
  touch-action: manipulation;
  user-select: none; -webkit-user-select: none;
  overflow: hidden; background: var(--sky1); font-family: var(--font); color: var(--ink);
}
#app{position:fixed; inset:0; display:flex; flex-direction:column;}
#hud{flex:0 0 auto; display:flex; align-items:center; gap:8px; padding:6px 8px; background:var(--hud);
  border-bottom:4px solid #f1d58a; z-index:2;}
.hbtn{width:52px; height:52px; min-width:52px; border-radius:16px; border:none; background:#fff; box-shadow:var(--shadow);
  font-size:26px; cursor:pointer; display:flex; align-items:center; justify-content:center; font-family:var(--font);}
.hbtn:active{transform:translateY(3px); box-shadow:0 3px 0 rgba(0,0,0,.14);}
#hudMid{flex:1; display:flex; flex-direction:column; align-items:center; min-width:0;}
#hudTitle{margin:0; font-size:clamp(17px,4.6vw,24px); font-weight:900; line-height:1.1; white-space:nowrap;
  background:linear-gradient(90deg,var(--accent),#e0457b,var(--blue)); -webkit-background-clip:text; background-clip:text; color:transparent;}
#pips{display:flex; gap:6px; margin-top:3px;}
.pip{width:32px; height:24px; border-radius:12px; background:#f3e6c2; display:flex; align-items:center; justify-content:center;
  font-size:15px; opacity:.5; transition:all .25s;}
.pip.on{background:#ffd86b; opacity:1; transform:scale(1.15);}
.pip.done{background:#bdf0b5; opacity:1;}
#stage{flex:1 1 auto; position:relative; min-height:0;}
#cv{position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none; cursor:pointer;}
.overlay{position:absolute; inset:0; z-index:5; display:flex; align-items:center; justify-content:center; padding:14px;}
.overlay.hide{display:none;}
#menu{background:linear-gradient(180deg,#9fdcff,#dff5ff 55%,#9be08c 55%,#6cc95e);}
.menuCard{width:min(94vw,460px); max-height:100%; overflow:auto; background:var(--card); border-radius:28px; padding:16px 14px 18px;
  box-shadow:0 10px 0 rgba(0,0,0,.12); text-align:center;}
.menuCard h1{margin:4px 0 2px; font-size:clamp(32px,9vw,46px); font-weight:900; line-height:1.05;
  background:linear-gradient(90deg,var(--accent),#e0457b,var(--blue)); -webkit-background-clip:text; background-clip:text; color:transparent;}
.steps{font-size:clamp(22px,6vw,30px); margin:4px 0 10px; letter-spacing:2px;}
.birds{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin:6px 0 14px;}
.bcard{position:relative; border:none; border-radius:20px; background:#fff3cf; padding:6px 4px 8px; cursor:pointer; min-height:110px;
  box-shadow:var(--shadow); font-family:var(--font); font-size:clamp(14px,3.8vw,17px); font-weight:800; color:var(--ink);}
.bcard canvas{width:100%; height:auto; aspect-ratio:1/1; display:block; max-width:110px; margin:0 auto;}
.bcard .tick{position:absolute; top:-6px; right:-6px; width:34px; height:34px; border-radius:50%; background:#5cd16a; color:#fff;
  font-size:20px; display:flex; align-items:center; justify-content:center; box-shadow:0 3px 0 rgba(0,0,0,.15);}
.bigbtn{border:none; border-radius:22px; padding:12px 26px; min-height:64px; min-width:170px; font-family:var(--font); font-weight:900;
  font-size:clamp(22px,6vw,28px); color:#fff; background:linear-gradient(180deg,#ffa24d,#ff7a2d); box-shadow:0 7px 0 #c9561a; cursor:pointer;}
.bigbtn:active{transform:translateY(4px); box-shadow:0 3px 0 #c9561a;}
.bigbtn.alt{background:linear-gradient(180deg,#6fc3ff,#3a98f0); box-shadow:0 7px 0 #2468b0;}
#done{align-items:flex-end; padding-bottom:10px; pointer-events:none;}
#done .menuCard{padding:12px 12px 14px;}
#done .bigbtn{min-width:0; padding:10px 20px;}
#done .menuCard{pointer-events:auto; animation:drop .5s cubic-bezier(.3,1.6,.5,1);}
#doneTitle{font-size:clamp(20px,5.4vw,28px); font-weight:900; margin:2px 0 4px;}
#doneFact{font-size:clamp(14px,3.8vw,17px); margin:0 0 10px; line-height:1.3;}
.row{display:flex; gap:10px; justify-content:center; flex-wrap:wrap;}
@keyframes drop{from{transform:translateY(-40px) scale(.8); opacity:0} to{transform:none; opacity:1}}
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <button class="hbtn" id="homeBtn" aria-label="Home">🏠</button>
    <div id="hudMid">
      <div id="hudTitle">Nest to Flight</div>
      <div id="pips">
        <div class="pip" data-s="build">🌿</div>
        <div class="pip" data-s="eggs">🥚</div>
        <div class="pip" data-s="feed">🐛</div>
        <div class="pip" data-s="fly">🐦</div>
      </div>
    </div>
    <button class="hbtn" id="againBtn" aria-label="Start this nest again">↺</button>
  </div>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div class="overlay" id="menu">
      <div class="menuCard">
        <h1>Nest to Flight</h1>
        <div class="steps">🌿 ➜ 🥚 ➜ 🐛 ➜ 🐦</div>
        <div class="birds" id="birdCards"></div>
        <button class="bigbtn" id="playBtn">Play ▶</button>
      </div>
    </div>
    <div class="overlay hide" id="done">
      <div class="menuCard">
        <div id="doneTitle">🎉 They can fly!</div>
        <p id="doneFact"></p>
        <div class="row">
          <button class="bigbtn" id="nextBtn">Next bird ▶</button>
          <button class="bigbtn alt" id="menuBtn">🏠</button>
        </div>
      </div>
    </div>
  </div>
</div>
<script>
'use strict';
// ---------- world + canvas ----------
const W = 400, H = 700;
const NEST = { x: 130, y: 318, rx: 95 };
const PERCH = { x: 244, y: 283 };         // Mama's spot at the end of the nest branch
const HOVER = { x: 130, y: 218 };          // Mama hovers here holding food
const RIM = { x: 214, y: 290 };            // chick launch spot for first flight
const RBRANCH = { x0: 290, x1: 400, y: 372 }; // Mama's branch on the right tree
const GROUND = 545;
const cv = document.getElementById('cv');
let ctx = cv.getContext('2d');
let dpr = 1, cw = 0, ch = 0, S = 1, ox = 0, oy = 0;
function resize() {
  const r = cv.parentElement.getBoundingClientRect();
  dpr = Math.min(2, window.devicePixelRatio || 1);
  cw = r.width; ch = r.height;
  cv.width = Math.max(1, Math.round(cw * dpr)); cv.height = Math.max(1, Math.round(ch * dpr));
  S = Math.min(cw / W, ch / H); ox = (cw - W * S) / 2; oy = (ch - H * S) / 2;
}
window.addEventListener('resize', resize);

const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

// ---------- audio ----------
let AC = null;
function ac() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; } }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(f, dur, type = 'sine', vol = .14, slideTo = null, delay = 0) {
  const a = ac(); if (!a) return;
  const t = a.currentTime + delay;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.015);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + dur + 0.05);
}
function noise(dur, vol = .1, freq = 800, delay = 0) {
  const a = ac(); if (!a) return;
  const t = a.currentTime + delay;
  const buf = a.createBuffer(1, Math.max(1, Math.floor(a.sampleRate * dur)), a.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
  const s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
  s.buffer = buf; f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = 1.2; g.gain.value = vol;
  s.connect(f); f.connect(g); g.connect(a.destination); s.start(t);
}
const SFX = {
  chirp() { tone(2300, .08, 'sine', .09, 3300); tone(2700, .08, 'sine', .08, 3700, .1); tone(2500, .1, 'sine', .07, 3400, .2); },
  peep() { tone(3100, .07, 'triangle', .05, 3900); },
  pop() { tone(480, .1, 'sine', .16, 1200); },
  place(n) { tone(523 * Math.pow(1.122, n), .2, 'triangle', .13); tone(1046 * Math.pow(1.122, n), .12, 'sine', .05, null, .04); },
  boing() { tone(260, .32, 'square', .05, 120); },
  crack() { noise(.07, .25, 2600); },
  hatch() { noise(.14, .22, 1800); [880, 1109, 1319, 1760].forEach((f, i) => tone(f, .16, 'triangle', .1, null, .05 + i * .07)); },
  brr() { noise(.6, .07, 420); },
  warm() { tone(620, .16, 'sine', .11, 930); },
  gulp() { tone(320, .12, 'sine', .18, 140); tone(900, .1, 'triangle', .07, 1500, .13); },
  flap() { noise(.09, .12, 700); },
  whee() { tone(600, .45, 'sine', .12, 1500); },
  hop() { tone(700, .08, 'sine', .08, 1000); },
  nope() { tone(360, .12, 'sine', .09, 290); tone(330, .14, 'sine', .09, 260, .15); },
  fanfare() { [523, 659, 784, 1047].forEach((f, i) => tone(f, .26, 'triangle', .12, null, i * .12)); tone(1047, .7, 'sine', .09, null, .5); tone(1319, .7, 'sine', .06, null, .5); },
};

// ---------- data ----------
const BIRDS = [
  { id: 'robin', name: 'Robin', body: '#8b6b52', belly: '#ec7436', wing: '#6a5040', head: '#4f3d30', beak: '#f4b52f',
    chick: '#c9ab8f', eggs: 3, egg: '#8fd6f2', speck: null, food: 'worm',
    recipe: [['twig', 3], ['grass', 2], ['mud', 2]],
    fact: 'Robins glue their nests with mud and lay sky-blue eggs. Baby robins love worms!' },
  { id: 'goldfinch', name: 'Goldfinch', body: '#f6cf22', belly: '#fde57c', wing: '#2a2a2a', head: '#f6cf22', cap: '#222', beak: '#f0a35a',
    chick: '#e6d38a', eggs: 4, egg: '#e3f1f6', speck: null, food: 'seed',
    recipe: [['grass', 3], ['fluff', 2], ['moss', 2]],
    fact: 'Goldfinches line their nests with soft thistle fluff and feed their babies seeds!' },
  { id: 'cardinal', name: 'Cardinal', body: '#d7263a', belly: '#e84a5b', wing: '#a81d2e', head: '#d7263a', crest: true, mask: '#1d1d1d', beak: '#f58a37',
    chick: '#c98f86', eggs: 4, egg: '#efe8d2', speck: '#8b775a', food: 'bug',
    recipe: [['twig', 3], ['leaf', 2], ['grass', 2]],
    fact: 'Cardinals build with twigs and leaves, and their babies gobble up caterpillars!' },
];
const DECOYS = ['rock', 'pinecone', 'ball'];
const DECOY_SAY = { rock: 'Too heavy!', pinecone: 'Too spiky!', ball: "That's a toy!" };
const MAT_COL = { twig: '#8a5a2b', grass: '#7fbf3f', mud: '#6b4423', moss: '#4f9a3a', fluff: '#f4f1ea', leaf: '#3fae4a' };
const SLOTS = [];
for (let r = 0; r < 2; r++) for (let c = 0; c < 5; c++) SLOTS.push({ x: 48 + c * 76 + (r ? 20 : 0) - (r ? 10 : 0), y: r ? 664 : 598 });
const FOODSPOTS = [{ x: 60, y: 600 }, { x: 170, y: 626 }, { x: 290, y: 598 }, { x: 110, y: 676 }, { x: 240, y: 680 }, { x: 352, y: 664 }];
const STORE = 'cowork-nesttoflight-album';
function loadAlbum() { try { return JSON.parse(localStorage.getItem(STORE)) || {}; } catch (e) { return {}; } }
function saveAlbum(a) { try { localStorage.setItem(STORE, JSON.stringify(a)); } catch (e) {} }

// ---------- drawing primitives ----------
function ell(x, y, rx, ry, rot = 0) { ctx.beginPath(); ctx.ellipse(x, y, Math.max(.1, rx), Math.max(.1, ry), rot, 0, Math.PI * 2); }
function circ(x, y, r) { ctx.beginPath(); ctx.arc(x, y, Math.max(.1, r), 0, Math.PI * 2); }
function rrect(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function emoji(ch, x, y, size) { ctx.save(); ctx.globalAlpha = 1; ctx.fillStyle = '#000'; ctx.font = `${size}px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(ch, x, y); ctx.restore(); }

function drawBird(x, y, s, B, o = {}) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s * (o.face || 1), s);
  if (o.tilt) ctx.rotate(o.tilt);
  // legs
  if (!o.flying) { ctx.strokeStyle = '#c98a2e'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(-3, 20); ctx.lineTo(-5, 30); ctx.moveTo(6, 20); ctx.lineTo(6, 30); ctx.stroke(); }
  // tail
  ctx.fillStyle = B.wing; ctx.beginPath(); ctx.moveTo(-16, 0); ctx.lineTo(-42, -10); ctx.lineTo(-40, 8); ctx.closePath(); ctx.fill();
  // body
  ctx.fillStyle = B.body; ell(0, 4, 25, 18); ctx.fill();
  ctx.fillStyle = B.belly; ell(8, 10, 15, 11); ctx.fill();
  // head
  ctx.fillStyle = B.head; circ(18, -12, 13); ctx.fill();
  if (B.crest) { ctx.beginPath(); ctx.moveTo(9, -20); ctx.lineTo(4, -38); ctx.lineTo(22, -22); ctx.closePath(); ctx.fill(); }
  if (B.cap) { ctx.fillStyle = B.cap; ctx.beginPath(); ctx.arc(19, -13, 13, Math.PI * 1.15, Math.PI * 1.75); ctx.lineTo(19, -13); ctx.closePath(); ctx.fill(); }
  if (B.mask) { ctx.fillStyle = B.mask; ell(28, -10, 7, 6); ctx.fill(); }
  // eye
  ctx.fillStyle = '#fff'; circ(22, -15, 4.4); ctx.fill();
  ctx.fillStyle = '#111'; circ(23, -15, 2.7); ctx.fill();
  ctx.fillStyle = '#fff'; circ(24, -16, 1); ctx.fill();
  // beak
  ctx.fillStyle = B.beak;
  if (o.open) {
    ctx.beginPath(); ctx.moveTo(29, -15); ctx.lineTo(42, -19); ctx.lineTo(30, -11); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(29, -9); ctx.lineTo(41, -5); ctx.lineTo(30, -12); ctx.closePath(); ctx.fill();
  } else { ctx.beginPath(); ctx.moveTo(29, -15); ctx.lineTo(42, -11); ctx.lineTo(29, -7); ctx.closePath(); ctx.fill(); }
  // wing
  ctx.save(); ctx.translate(-2, -2);
  const up = o.flap != null ? Math.abs(Math.sin(o.flap)) : 0;
  ctx.rotate(-0.15 - up * 1.3);
  ctx.fillStyle = B.wing; ell(-8, 2, 18, 9, -0.15); ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,.18)'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(-18, 2); ctx.lineTo(0, 3); ctx.stroke();
  ctx.restore();
  // carried item under the beak
  if (o.carry) { ctx.save(); ctx.translate(38, -4); ctx.scale(1 / s * .55, 1 / s * .55); ctx.scale(o.face || 1, 1); drawThing(o.carry, 0, 0, 1, 0); ctx.restore(); }
  ctx.restore();
}

function drawChick(x, y, r, B, o = {}) {
  ctx.save(); ctx.translate(x + (o.shake ? Math.sin(o.shake * 40) * 4 * o.shake : 0), y);
  const sc = o.squash ? 1 + o.squash * .15 : 1;
  ctx.scale(1 / sc * (o.face || 1), sc);
  // wings
  const fl = o.flap != null ? Math.sin(o.flap) : 0;
  ctx.fillStyle = shade(B.chick, -18);
  ctx.save(); ctx.translate(-r * .8, 0); ctx.rotate(-.4 - Math.abs(fl) * 1.1); ell(-r * .25, 0, r * .45, r * .25); ctx.fill(); ctx.restore();
  ctx.save(); ctx.translate(r * .8, 0); ctx.rotate(.4 + Math.abs(fl) * 1.1); ell(r * .25, 0, r * .45, r * .25); ctx.fill(); ctx.restore();
  // body
  ctx.fillStyle = B.chick; circ(0, 0, r); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.35)'; circ(0, r * .3, r * .6); ctx.fill();
  // fluff tufts
  ctx.strokeStyle = B.chick; ctx.lineWidth = 3; ctx.lineCap = 'round';
  ctx.beginPath(); for (let i = -1; i <= 1; i++) { ctx.moveTo(i * r * .25, -r * .9); ctx.lineTo(i * r * .4, -r * 1.25); } ctx.stroke();
  // eyes
  if (o.sleepy) {
    ctx.strokeStyle = '#222'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(-r * .32, -r * .2, r * .13, 0, Math.PI); ctx.moveTo(r * .45, -r * .2); ctx.arc(r * .32, -r * .2, r * .13, 0, Math.PI); ctx.stroke();
  } else {
    ctx.fillStyle = '#1b1b1b'; circ(-r * .32, -r * .22, r * .14); ctx.fill(); circ(r * .32, -r * .22, r * .14); ctx.fill();
    ctx.fillStyle = '#fff'; circ(-r * .28, -r * .27, r * .05); ctx.fill(); circ(r * .36, -r * .27, r * .05); ctx.fill();
  }
  // beak
  const op = o.open || 0;
  ctx.fillStyle = '#ffcc33';
  if (op > .05) {
    ctx.fillStyle = '#e83d4a'; ell(0, r * .18, r * .34, r * .32 * op); ctx.fill();
    ctx.fillStyle = '#ffcc33';
    ctx.beginPath(); ctx.moveTo(-r * .42, r * .1); ctx.lineTo(0, r * .1 - r * .45 * op); ctx.lineTo(r * .42, r * .1); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-r * .4, r * .22); ctx.lineTo(0, r * .22 + r * .4 * op); ctx.lineTo(r * .4, r * .22); ctx.closePath(); ctx.fill();
  } else {
    ctx.beginPath(); ctx.moveTo(-r * .22, r * .02); ctx.lineTo(0, r * .3); ctx.lineTo(r * .22, r * .02); ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}

function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  const r = clamp((n >> 16) + amt, 0, 255), g = clamp(((n >> 8) & 255) + amt, 0, 255), b = clamp((n & 255) + amt, 0, 255);
  return `rgb(${r},${g},${b})`;
}

function drawEgg(e, B, t) {
  ctx.save();
  const sh = e.shake > 0 ? Math.sin(t * 50) * 3 * e.shake : 0;
  const shiver = e.chill ? Math.sin(t * 70) * 1.6 : 0;
  ctx.translate(e.x + sh + shiver, e.y); ctx.rotate((sh + shiver) * .04);
  ctx.fillStyle = B.egg; ell(0, 0, 17, 22); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.55)'; ell(-6, -8, 5, 7, -.3); ctx.fill();
  if (B.speck) { ctx.fillStyle = B.speck; for (let i = 0; i < 9; i++) { const a = i * 2.4, rr = (i * 7) % 13; circ(Math.cos(a) * rr * .9, Math.sin(a) * rr * 1.2, 1.7); ctx.fill(); } }
  if (e.chill) { ctx.fillStyle = 'rgba(120,190,255,.45)'; ell(0, 0, 17, 22); ctx.fill(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(-8, -14); ctx.lineTo(-3, -10); ctx.moveTo(6, -15); ctx.lineTo(9, -9); ctx.stroke(); }
  // warm glow ring
  if (e.warm > 0 && !e.chill) { ctx.strokeStyle = `rgba(255,150,60,${.25 + e.warm * .1})`; ctx.lineWidth = 3; ell(0, 0, 20, 25); ctx.stroke(); }
  // cracks
  ctx.strokeStyle = '#5a4630'; ctx.lineWidth = 1.8; ctx.lineJoin = 'round';
  if (e.warm >= 2) { ctx.beginPath(); ctx.moveTo(-10, -6); ctx.lineTo(-5, -2); ctx.lineTo(-1, -8); ctx.lineTo(3, -3); ctx.stroke(); }
  if (e.warm >= 3) { ctx.beginPath(); ctx.moveTo(3, -3); ctx.lineTo(8, -8); ctx.lineTo(12, -2); ctx.stroke(); }
  if (e.warm >= 4) { ctx.beginPath(); ctx.moveTo(-14, 2); ctx.lineTo(-10, -6); ctx.moveTo(12, -2); ctx.lineTo(15, 4); ctx.stroke(); }
  ctx.restore();
  if (e.chill) emoji('❄️', e.x + 18, e.y - 30, 20);
}

// materials, decoys and foods
function drawThing(type, x, y, s, t) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  switch (type) {
    case 'twig':
      ctx.strokeStyle = '#7a4c22'; ctx.lineWidth = 6; ctx.beginPath(); ctx.moveTo(-26, 10); ctx.lineTo(24, -8); ctx.stroke();
      ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(-4, 2); ctx.lineTo(4, -14); ctx.moveTo(10, -3); ctx.lineTo(20, 6); ctx.stroke();
      ctx.fillStyle = '#6cc04a'; ell(5, -16, 5, 3, -.8); ctx.fill(); break;
    case 'grass':
      ctx.strokeStyle = '#6fb534'; ctx.lineWidth = 3.5;
      for (let i = -3; i <= 3; i++) { ctx.beginPath(); ctx.moveTo(i * 2, 14); ctx.quadraticCurveTo(i * 5, -2, i * 8 + 3, -18 + Math.abs(i) * 2); ctx.stroke(); }
      ctx.strokeStyle = '#e0c060'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(-10, 8); ctx.lineTo(10, 8); ctx.stroke(); break;
    case 'mud':
      ctx.fillStyle = '#6b4423'; ctx.beginPath(); ctx.moveTo(-24, 10); ctx.bezierCurveTo(-26, -8, -8, -14, 0, -10); ctx.bezierCurveTo(12, -18, 28, -6, 24, 10); ctx.closePath(); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.3)'; ell(-6, -4, 6, 3, -.3); ctx.fill(); ctx.fillStyle = '#583619'; circ(10, 2, 3); ctx.fill(); break;
    case 'moss':
      ctx.fillStyle = '#4f9a3a'; for (const [a, b, r] of [[-12, 4, 11], [0, -4, 13], [12, 4, 11], [0, 8, 10]]) { circ(a, b, r); ctx.fill(); }
      ctx.fillStyle = '#7fcf55'; for (const [a, b] of [[-8, -2], [4, -8], [10, 2], [-2, 6]]) { circ(a, b, 3); ctx.fill(); } break;
    case 'fluff':
      ctx.strokeStyle = 'rgba(200,190,170,.9)'; ctx.lineWidth = 1.5;
      for (let i = 0; i < 12; i++) { const a = i / 12 * Math.PI * 2; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(Math.cos(a) * 20, Math.sin(a) * 20); ctx.stroke(); }
      ctx.fillStyle = '#fbf8f0'; for (let i = 0; i < 12; i++) { const a = i / 12 * Math.PI * 2; circ(Math.cos(a) * 19, Math.sin(a) * 19, 5); ctx.fill(); }
      ctx.fillStyle = '#b48ac9'; circ(0, 0, 5); ctx.fill(); break;
    case 'leaf':
      ctx.fillStyle = '#3fae4a'; ctx.beginPath(); ctx.moveTo(-22, 8); ctx.quadraticCurveTo(-8, -22, 22, -8); ctx.quadraticCurveTo(4, 20, -22, 8); ctx.fill();
      ctx.strokeStyle = '#2a7d34'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(-22, 8); ctx.lineTo(18, -6); ctx.stroke(); break;
    case 'rock':
      ctx.fillStyle = '#8d8f99'; ctx.beginPath(); ctx.moveTo(-26, 14); ctx.lineTo(-22, -8); ctx.lineTo(-4, -18); ctx.lineTo(18, -12); ctx.lineTo(28, 12); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#b3b5bf'; ctx.beginPath(); ctx.moveTo(-16, -6); ctx.lineTo(-4, -13); ctx.lineTo(4, -4); ctx.closePath(); ctx.fill(); break;
    case 'pinecone':
      ctx.fillStyle = '#8a5a2b'; ell(0, 0, 14, 22); ctx.fill();
      ctx.strokeStyle = '#5e3a17'; ctx.lineWidth = 2;
      for (let r = -3; r <= 3; r++) { ctx.beginPath(); ctx.moveTo(-12 + Math.abs(r) * 1.5, r * 6); ctx.quadraticCurveTo(0, r * 6 + 6, 12 - Math.abs(r) * 1.5, r * 6); ctx.stroke(); } break;
    case 'ball':
      ctx.fillStyle = '#ff4d6d'; circ(0, 0, 20); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(0, 0, 20, -.3, Math.PI * .7); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#ffd43b'; circ(0, 0, 7); ctx.fill(); break;
    case 'worm': {
      const w = Math.sin((t || 0) * 8);
      ctx.strokeStyle = '#f08aa0'; ctx.lineWidth = 9;
      ctx.beginPath(); ctx.moveTo(-16, 10); ctx.bezierCurveTo(-8, -4 + w * 4, 4, 14 - w * 4, 10, -8); ctx.stroke();
      ctx.fillStyle = '#222'; circ(12, -11, 1.8); ctx.fill(); break; }
    case 'seed':
      ctx.strokeStyle = '#4c9a3a'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(0, 16); ctx.lineTo(0, -2); ctx.stroke();
      ctx.fillStyle = '#b87a2e'; circ(0, -10, 12); ctx.fill();
      ctx.fillStyle = '#3d2a14'; for (let i = 0; i < 9; i++) { const a = i * 2.4, rr = (i % 3) * 4 + 2; circ(Math.cos(a) * rr, -10 + Math.sin(a) * rr, 1.8); ctx.fill(); }
      ctx.fillStyle = '#ffd43b'; for (let i = 0; i < 10; i++) { const a = i / 10 * Math.PI * 2; ell(Math.cos(a) * 15, -10 + Math.sin(a) * 15, 5, 3, a); ctx.fill(); } break;
    case 'bug': {
      const w = Math.sin((t || 0) * 7) * 2;
      ctx.fillStyle = '#6cc04a'; for (let i = 0; i < 5; i++) { circ(-16 + i * 7, w * (i % 2 ? 1 : -1), 6); ctx.fill(); }
      ctx.fillStyle = '#3f8a2e'; circ(16, -2, 7); ctx.fill();
      ctx.fillStyle = '#111'; circ(18, -4, 1.8); ctx.fill(); break; }
  }
  ctx.restore();
}

// ---------- game state ----------
const G = {
  screen: 'menu', bi: 0, B: BIRDS[0], stage: 'build', t: 0, idle: 0, ready: false,
  items: [], pieces: [], got: {}, eggs: [], chicks: [], foods: [], foodT: 0, gustT: 4,
  hungry: -1, holding: false, fetching: false, fly: null, landed: [], parts: [], says: [], timers: [],
  winds: [], mama: null, hintAt: null, celebrate: 0,
  stats: { decoy: 0, gust: 0, chillFix: 0, refuse: 0, grass: 0, branch: 0, fed: 0, placed: 0, hatched: 0 },
};
window.__nest = G;

function later(sec, fn) { G.timers.push({ t: sec, fn }); }
function newMama() { return { x: PERCH.x, y: PERCH.y, face: -1, q: [], cur: null, carry: null, flying: false, ph: 0, hop: 0, strain: 0, open: 0 }; }
function mamaGo(x, y, dur, then) { G.mama.q.push({ x, y, dur, then }); }
function mamaBusy() { return !!(G.mama.cur || G.mama.q.length); }
function need(type) { const r = G.B.recipe.find(r => r[0] === type); return r ? r[1] : 0; }
function totalNeed() { return G.B.recipe.reduce((a, r) => a + r[1], 0); }

function say(x, y, text, col = '#3a2a1a') { G.says.push({ x, y, text, col, life: 1.6 }); }
function burst(x, y, kind, n, col) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, Math.PI * 2), sp = rand(40, 160);
    G.parts.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - (kind === 'heart' ? 60 : 30), life: rand(.7, 1.2), max: 1.2, kind,
      col: col || pick(['#ff6fa8', '#ffcb3d', '#3aa0ff', '#4cbf5a', '#ff8a3d', '#b074ff']), rot: rand(0, 6), vr: rand(-6, 6), s: rand(.7, 1.2) });
  }
}
function confetti(n = 90) {
  for (let i = 0; i < n; i++) G.parts.push({ x: rand(0, W), y: rand(-60, 0), vx: rand(-30, 30), vy: rand(60, 200), life: rand(2.2, 3.6), max: 3.6, kind: 'conf',
    col: pick(['#ff6fa8', '#ffcb3d', '#3aa0ff', '#4cbf5a', '#ff8a3d', '#b074ff']), rot: rand(0, 6), vr: rand(-8, 8), s: rand(.8, 1.3) });
}

function setPips() {
  const order = ['build', 'eggs', 'feed', 'fly'];
  const si = G.stage === 'done' ? 4 : order.indexOf(G.stage);
  document.querySelectorAll('.pip').forEach((p, i) => { p.classList.toggle('on', i === si); p.classList.toggle('done', i < si); });
}

// ---------- start a bird ----------
function startBird(bi) {
  G.bi = bi; G.B = BIRDS[bi]; G.screen = 'play';
  G.parts = []; G.says = []; G.timers = []; G.winds = []; G.celebrate = 0;
  G.mama = newMama();
  G.eggs = []; G.chicks = []; G.foods = []; G.landed = []; G.fly = null; G.hungry = -1; G.holding = false; G.fetching = false;
  document.getElementById('menu').classList.add('hide');
  document.getElementById('done').classList.add('hide');
  setupBuild();
}

// ---------- STAGE 1: build the nest ----------
function setupBuild() {
  G.stage = 'build'; G.ready = true; G.pieces = []; G.got = {}; G.idle = 0;
  const types = [];
  G.B.recipe.forEach(([t, n]) => { for (let i = 0; i < n; i++) types.push(t); });
  types.push(...DECOYS);
  const slots = shuffle(SLOTS.slice());
  G.items = shuffle(types).map((type, i) => ({ type, x: slots[i].x, y: slots[i].y, state: 'ground', wob: 0, decoy: DECOYS.includes(type), bob: rand(0, 6) }));
  setPips();
}

function tapItem(it) {
  if (it.decoy) {
    if (it.state === 'nope') { it.wob = 1; SFX.nope(); say(it.x, it.y - 44, DECOY_SAY[it.type]); return; }
    if (it.state !== 'ground') return;
    it.state = 'trying'; G.stats.decoy++;
    mamaGo(it.x, it.y - 30, .5, () => { it.wob = 1.4; G.mama.strain = 1; SFX.boing(); say(it.x, it.y - 50, DECOY_SAY[it.type]); });
    mamaGo(it.x + 2, it.y - 34, .7, () => { it.state = 'nope'; G.mama.strain = 0; burst(it.x, it.y - 10, 'spark', 5, '#bbb'); });
    mamaGo(PERCH.x, PERCH.y, .5, () => { G.mama.face = -1; });
    return;
  }
  if (it.state !== 'ground') return;
  if ((G.got[it.type] || 0) + G.items.filter(o => o.type === it.type && (o.state === 'claimed' || o.state === 'carried')).length >= need(it.type)) { it.wob = 1; SFX.nope(); return; }
  it.state = 'claimed'; SFX.chirp();
  mamaGo(it.x, it.y - 28, .45, () => { it.state = 'carried'; G.mama.carry = it.type; SFX.pop(); });
  const dx = rand(-60, 60);
  mamaGo(NEST.x + dx, NEST.y - 36, .55, () => { G.mama.carry = null; it.state = 'placed'; addPiece(it.type, dx); });
  mamaGo(PERCH.x, PERCH.y, .4, () => { G.mama.face = -1; });
}

function addPiece(type, dx) {
  G.got[type] = (G.got[type] || 0) + 1; G.stats.placed++;
  const n = G.pieces.length;
  // each piece leaves a few coloured strands woven around the bowl
  const strands = [];
  for (let i = 0; i < 4; i++) {
    const a0 = rand(-0.2, Math.PI + 0.2), len = rand(.5, 1.1), row = rand(0, 1);
    strands.push({ a0, a1: a0 + len * (Math.random() < .5 ? -1 : 1), row, w: rand(3, 5) });
  }
  G.pieces.push({ type, strands, dx });
  SFX.place(n);
  burst(NEST.x + dx, NEST.y - 10, 'spark', 8, MAT_COL[type]);
  if (G.pieces.length >= totalNeed()) {
    G.ready = false;
    later(.5, () => { SFX.fanfare(); burst(NEST.x, NEST.y - 20, 'star', 22); say(NEST.x, NEST.y - 90, 'Cozy nest!'); });
    later(2.0, setupEggs);
  }
}

// ---------- STAGE 2: warm & hatch the eggs ----------
function setupEggs() {
  G.stage = 'eggs'; G.ready = false; G.idle = 0; setPips();
  G.items.forEach(it => { if (it.decoy) burst(it.x, it.y, 'spark', 6, '#fff'); });
  G.items = [];
  const n = G.B.eggs, gap = 46;
  G.eggs = [];
  // Mama sits on the nest and lays her eggs
  mamaGo(NEST.x, NEST.y - 34, .7, () => { G.mama.face = 1; });
  for (let i = 0; i < n; i++) {
    later(1.0 + i * .45, () => {
      G.eggs.push({ x: NEST.x + (i - (n - 1) / 2) * gap, y: NEST.y - 22, warm: 0, chill: false, shake: .8, hatched: false, pop: 1 });
      SFX.pop(); G.mama.hop = .3;
    });
  }
  later(1.3 + n * .45, () => { mamaGo(PERCH.x, PERCH.y, .6, () => { G.mama.face = -1; G.ready = true; G.gustT = 3.2; SFX.chirp(); }); });
}

function tapEgg(e) {
  if (e.hatched) return;
  if (e.chill) {
    e.chill = false; e.shake = .6; G.stats.chillFix++;
    SFX.warm(); burst(e.x, e.y - 10, 'heart', 5, '#ff6fa8');
    return;
  }
  e.warm++; e.shake = 1;
  burst(e.x, e.y - 8, 'heart', 3, '#ff8a3d');
  if (!mamaBusy()) { G.mama.hop = .35; }
  if (e.warm >= 5) {
    e.hatched = true; G.stats.hatched++;
    SFX.hatch(); burst(e.x, e.y - 6, 'shell', 10, G.B.egg); burst(e.x, e.y - 16, 'star', 8);
    G.chicks.push({ x: e.x, y: e.y - 6, r: 17, meals: 0, open: 0, shake: 0, squash: 1, pop: 1, peepT: rand(0, 1), sleepy: false, face: 1 });
    if (G.eggs.every(o => o.hatched)) {
      G.ready = false;
      later(.7, () => { SFX.chirp(); mamaGo(HOVER.x, HOVER.y, .6); say(NEST.x, NEST.y - 100, 'Peep peep!'); });
      later(2.0, setupFeed);
    }
  } else if (e.warm >= 2) SFX.crack();
  else SFX.warm();
}

function updEggs(dt) {
  for (const e of G.eggs) { e.shake = Math.max(0, e.shake - dt * 2); e.pop = Math.max(0, e.pop - dt * 3); }
  if (!G.ready) return;
  G.gustT -= dt;
  if (G.gustT <= 0) {
    const cand = G.eggs.filter(e => !e.hatched && !e.chill);
    if (!G.eggs.some(e => e.chill) && cand.length) {
      const e = pick(cand); e.chill = true; G.stats.gust++; SFX.brr();
      for (let i = 0; i < 6; i++) G.winds.push({ x: rand(-120, -20), y: e.y - 60 + rand(-40, 40), life: 1.6, len: rand(50, 110) });
      G.gustT = rand(4.5, 6.5);
    } else G.gustT = 1.5;
  }
}

// ---------- STAGE 3: feed the chicks ----------
function setupFeed() {
  G.stage = 'feed'; G.ready = true; G.idle = 0; setPips();
  G.foods = []; G.foodT = .3; G.holding = false; G.fetching = false;
  G.chicks.forEach(c => { c.y = NEST.y - 24; });
  nextHungry();
}
function nextHungry() {
  const left = G.chicks.map((c, i) => i).filter(i => G.chicks[i].meals < 2);
  if (!left.length) { G.hungry = -1; return; }
  const others = left.filter(i => i !== G.hungry);
  G.hungry = others.length ? pick(others) : left[0];
  G.chicks[G.hungry].peepT = 0;
}
function spawnFood() {
  const used = G.foods.map(f => f.spot);
  const free = FOODSPOTS.filter(s => !used.includes(s));
  if (!free.length) return;
  const spot = pick(free);
  G.foods.push({ spot, x: spot.x, y: spot.y, up: 0, life: rand(4.5, 6), state: 'up' });
}
function updFeed(dt) {
  if (!G.ready) return;
  G.foodT -= dt;
  if (G.foodT <= 0 && G.foods.length < 2) { spawnFood(); G.foodT = rand(1.2, 2.2); }
  for (const f of G.foods) {
    if (f.state === 'up') { f.up = Math.min(1, f.up + dt * 3); f.life -= dt; if (f.life <= 0) f.state = 'down'; }
    else if (f.state === 'down') { f.up -= dt * 3; }
  }
  G.foods = G.foods.filter(f => !(f.state === 'down' && f.up <= 0) && f.state !== 'gone');
}
function tapFood(f) {
  if (G.holding || G.fetching) { SFX.nope(); pointAt(G.chicks[G.hungry]); return; }
  G.fetching = true; f.state = 'taken'; SFX.chirp();
  mamaGo(f.x, f.y - 30, .5, () => { f.state = 'gone'; G.mama.carry = G.B.food; SFX.pop(); });
  mamaGo(HOVER.x, HOVER.y, .55, () => { G.fetching = false; G.holding = true; G.mama.face = 1; });
}
function tapChick(i) {
  const c = G.chicks[i];
  if (i !== G.hungry) {
    c.shake = 1; G.stats.refuse++; SFX.nope();
    say(c.x, c.y - 44, c.meals >= 2 ? 'Full! 😋' : 'Not me!');
    if (G.hungry >= 0) G.chicks[G.hungry].peepT = 0;
    return;
  }
  if (!G.holding) { SFX.peep(); c.squash = 1; const f = G.foods.find(f => f.state === 'up'); if (f) pointAt(f); return; }
  G.holding = false; G.ready = false;
  mamaGo(c.x + 4, c.y - 46, .3, () => {
    G.mama.carry = null; c.meals++; c.r += 3; c.squash = 1; G.stats.fed++;
    SFX.gulp(); burst(c.x, c.y - 20, 'heart', 6, '#ff6fa8');
    G.hungry = -1;
    later(.4, () => {
      mamaGo(HOVER.x, HOVER.y, .35);
      if (G.chicks.every(o => o.meals >= 2)) {
        SFX.fanfare(); say(NEST.x, NEST.y - 100, 'All full!');
        G.chicks.forEach(o => { o.squash = 1; });
        later(1.8, setupFly);
      } else { G.ready = true; nextHungry(); }
    });
  });
}
function pointAt(obj) { if (obj) G.hintAt = { x: obj.x, y: obj.y - 10, t: 1.6 }; }

// ---------- STAGE 4: first flights ----------
function landSlot(k) { return { x: RBRANCH.x0 + 12 + k * 22, y: RBRANCH.y - 20 }; }
function setupFly() {
  G.stage = 'fly'; G.ready = true; G.idle = 0; setPips();
  G.foods = []; G.landed = [];
  G.chicks.forEach(c => { c.sleepy = false; c.open = 0; });
  mamaGo(390, RBRANCH.y - 32, .9, () => { G.mama.face = -1; SFX.chirp(); });
  G.fly = { i: 0, c: null };
  later(.9, readyChick);
}
function readyChick() {
  const c = G.chicks[G.fly.i];
  c.state = 'hop'; c.hx0 = c.x; c.hy0 = c.y; c.ht = 0;
  G.fly.c = c;
}
function updGlides(dt) {
  for (const c of G.chicks) {
    if (c.state !== 'glide') continue;
    c.gt += dt / .45; const k = Math.min(1, c.gt);
    c.x = c.gx0 + (c.tx - c.gx0) * k; c.y = c.gy0 + (c.ty - c.gy0) * k - Math.sin(k * Math.PI) * 10;
    if (k >= 1) c.state = 'perched';
  }
}
function updFly(dt) {
  updGlides(dt);
  const F = G.fly; if (!F || !F.c) return;
  const c = F.c;
  if (c.state === 'hop') {
    c.ht += dt / .6; const k = Math.min(1, c.ht);
    c.x = c.hx0 + (RIM.x - c.hx0) * k; c.y = c.hy0 + (RIM.y - c.hy0) * k - Math.sin(k * Math.PI) * 26;
    if (k >= 1) { c.state = 'ready'; SFX.hop(); }
  } else if (c.state === 'air') {
    c.vy += 380 * dt; c.x += c.vx * dt; c.y += c.vy * dt;
    c.flap = (c.flap || 0) + dt * 6; c.flapT = Math.max(0, (c.flapT || 0) - dt);
    if (c.y < 70) { c.y = 70; c.vy = Math.max(0, c.vy); }
    if (c.x >= RBRANCH.x0 && c.y <= RBRANCH.y + 8) { landChick(c, 'branch'); }
    else if (c.y >= GROUND + 18) { c.y = GROUND + 18; c.state = 'walk'; c.wt = 0; c.wx0 = c.x; G.stats.grass++; SFX.hop(); say(c.x, c.y - 40, 'Hop hop!'); }
    if (c.x > 392) c.x = 392;
  } else if (c.state === 'walk') {
    // hop along the grass to the right tree, then scramble up the trunk
    c.wt += dt;
    const tx = 360;
    if (c.x < tx) { c.x = Math.min(tx, c.x + 70 * dt); c.y = GROUND + 18 - Math.abs(Math.sin(c.wt * 9)) * 14; if (Math.sin(c.wt * 9) > .98) SFX.hop(); }
    else { c.y -= 110 * dt; c.flap = (c.flap || 0) + dt * 20; if (c.y <= RBRANCH.y - 20) landChick(c, 'climb'); }
  }
}
function flapTap() {
  const c = G.fly && G.fly.c; if (!c) return;
  if (c.state === 'ready') { c.state = 'air'; c.vx = 40; c.vy = -110; c.flapT = .25; SFX.flap(); burst(c.x, c.y, 'feather', 2, G.B.chick); return; }
  if (c.state === 'air') { c.vy = -175; c.flapT = .25; SFX.flap(); if (Math.random() < .5) burst(c.x, c.y + 6, 'feather', 1, G.B.chick); }
}
function landChick(c, how) {
  const k = G.landed.length;
  const s = landSlot(k);
  c.state = 'glide'; c.gt = 0; c.gx0 = c.x; c.gy0 = c.y; c.tx = s.x; c.ty = s.y; c.flap = 0;
  G.landed.push(c);
  if (how === 'branch') { G.stats.branch++; SFX.whee(); say(s.x, s.y - 50, 'Wheee!'); burst(s.x, s.y - 10, 'star', 12); }
  else { SFX.chirp(); say(s.x, s.y - 50, 'Made it!'); burst(s.x, s.y - 10, 'star', 8); }
  G.mama.hop = .4;
  G.fly.c = null;
  G.fly.i++;
  if (G.fly.i < G.chicks.length) later(1.0, readyChick);
  else later(1.0, finishBird);
}
function finishBird() {
  G.stage = 'done'; setPips(); G.celebrate = 1;
  SFX.fanfare(); confetti(110);
  const al = loadAlbum(); const wasAll = BIRDS.every(b => al[b.id]);
  al[G.B.id] = true; saveAlbum(al);
  const nowAll = BIRDS.every(b => al[b.id]);
  later(1.4, () => {
    document.getElementById('doneTitle').textContent = (nowAll && !wasAll ? '🏆 ' : '🎉 ') + `The ${G.B.name} family can fly!`;
    document.getElementById('doneFact').textContent = G.B.fact;
    document.getElementById('nextBtn').textContent = G.bi < BIRDS.length - 1 ? 'Next bird ▶' : 'Play again ▶';
    document.getElementById('done').classList.remove('hide');
  });
}

// ---------- update ----------
const clouds = [0, 1, 2, 3].map(i => ({ x: rand(-40, 420), y: rand(96, 190), s: rand(.6, 1.1), v: rand(5, 12) }));
function update(dt) {
  G.t += dt;
  for (const c of clouds) { c.x += c.v * dt; if (c.x > 480) c.x = -80; }
  if (G.screen !== 'play') return;
  G.idle += dt;
  const due = [];
  G.timers.forEach(tm => { tm.t -= dt; if (tm.t <= 0) due.push(tm); });
  G.timers = G.timers.filter(tm => tm.t > 0);
  due.forEach(tm => tm.fn());
  // Mama
  const m = G.mama;
  if (!m.cur && m.q.length) {
    const s = m.q.shift();
    m.cur = { ...s, fx: m.x, fy: m.y, t: 0, d: Math.hypot(s.x - m.x, s.y - m.y) };
    if (Math.abs(s.x - m.x) > 3) m.face = s.x > m.x ? 1 : -1;
  }
  if (m.cur) {
    const c = m.cur; c.t += dt;
    const k = Math.min(1, c.t / c.dur), e = k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
    m.x = c.fx + (c.x - c.fx) * e;
    m.y = c.fy + (c.y - c.fy) * e - Math.sin(k * Math.PI) * Math.min(50, c.d * .2);
    m.flying = c.d > 6;
    if (k >= 1) { m.cur = null; m.flying = false; if (c.then) c.then(); }
  }
  m.ph += dt * (m.flying ? 24 : 0);
  m.hop = Math.max(0, m.hop - dt);
  // items
  for (const it of G.items) it.wob = Math.max(0, it.wob - dt * 1.5);
  if (G.stage === 'eggs') updEggs(dt);
  if (G.stage === 'feed') updFeed(dt);
  if (G.stage === 'fly') updFly(dt);
  if (G.stage === 'done') updGlides(dt);
  // chicks
  G.chicks.forEach((c, i) => {
    const hungry = G.stage === 'feed' && i === G.hungry;
    c.open += ((hungry ? 1 : (c.state === 'ready' ? .5 : 0)) - c.open) * Math.min(1, dt * 10);
    c.shake = Math.max(0, c.shake - dt * 2); c.squash = Math.max(0, c.squash - dt * 2.5); c.pop = Math.max(0, c.pop - dt * 3);
    c.sleepy = G.stage === 'feed' && c.meals >= 2;
    if (hungry) { c.peepT -= dt; if (c.peepT <= 0) { SFX.peep(); c.peepT = 1.3; c.squash = .6; } }
  });
  // particles
  for (const p of G.parts) {
    p.life -= dt;
    if (p.kind === 'feather') { p.vy = Math.min(p.vy + 40 * dt, 40); p.vx *= .98; p.x += Math.sin(G.t * 3 + p.rot) * 20 * dt; }
    else if (p.kind === 'conf') { p.vy = Math.min(p.vy + 30 * dt, 160); p.x += Math.sin(G.t * 4 + p.rot) * 30 * dt; }
    else p.vy += 260 * dt;
    p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
  }
  G.parts = G.parts.filter(p => p.life > 0);
  for (const w of G.winds) { w.x += 420 * dt; w.life -= dt; }
  G.winds = G.winds.filter(w => w.life > 0);
  for (const s of G.says) { s.life -= dt; s.y -= 16 * dt; }
  G.says = G.says.filter(s => s.life > 0);
  if (G.hintAt) { G.hintAt.t -= dt; if (G.hintAt.t <= 0) G.hintAt = null; }
}

// ---------- render ----------
function drawBackground() {
  const L = -ox / S, R = (cw - ox) / S, T = -oy / S, Bm = (ch - oy) / S;
  const g = ctx.createLinearGradient(0, T, 0, GROUND);
  g.addColorStop(0, '#79ccff'); g.addColorStop(1, '#e4f7ff');
  ctx.fillStyle = g; ctx.fillRect(L, T, R - L, GROUND - T + 5);
  // sun
  ctx.save(); ctx.translate(250, 128); ctx.rotate(G.t * .2);
  ctx.fillStyle = 'rgba(255,214,80,.45)';
  for (let i = 0; i < 10; i++) { ctx.rotate(Math.PI / 5); ctx.beginPath(); ctx.moveTo(-5, 30); ctx.lineTo(0, 46); ctx.lineTo(5, 30); ctx.fill(); }
  ctx.fillStyle = '#ffd650'; circ(0, 0, 25); ctx.fill(); ctx.restore();
  // clouds
  ctx.fillStyle = 'rgba(255,255,255,.9)';
  for (const c of clouds) { for (const [a, b, r] of [[0, 0, 20], [20, -8, 24], [42, 0, 18], [20, 6, 18]]) { circ(c.x + a * c.s, c.y + b * c.s, r * c.s); ctx.fill(); } }
  // far hills
  ctx.fillStyle = '#a8e08f';
  ctx.beginPath(); ctx.moveTo(L, GROUND); for (let x = L; x <= R + 20; x += 20) ctx.lineTo(x, GROUND - 30 - Math.sin(x * .02) * 18); ctx.lineTo(R, GROUND); ctx.fill();
  // grass

  ctx.fillStyle = gg; ctx.beginPath(); ctx.moveTo(L, Bm + 5);
  for (let x = L; x <= R + 20; x += 20) ctx.lineTo(x, GROUND - Math.sin(x * .05) * 5);
  ctx.lineTo(R + 20, Bm + 5); ctx.fill();
  // flowers
  for (let i = 0; i < 14; i++) {

    ctx.fillStyle = '#ffb02e'; circ(fx, fy, 2); ctx.fill();
  }
}

function nestProgress() { return G.stage === 'build' ? G.pieces.length / totalNeed() : 1; }

function inNest(c) { return !c.state || c.state === 'hop' || c.state === 'ready'; }
function chickDrawY(c, i) {
  let y = c.y;

}

function drawItems() {
  for (const it of G.items) {
    if (it.state === 'carried' || it.state === 'placed') continue;

    ctx.fillStyle = 'rgba(0,0,0,.15)'; ell(it.x, it.y + 20, 24, 6); ctx.fill();

function drawFoods() {

function drawMama() {
  const m = G.mama; if (!m) return;
  const hop = m.hop > 0 ? Math.sin(m.hop / .35 * Math.PI) * 10 : 0;

    open: G.stage === 'done' ? Math.sin(G.t * 8) > 0 : false });
}

function drawCard() {
  const x = 50, y = 8, w = 300, h = 74;

  ctx.fillStyle = 'rgba(0,0,0,.12)'; rrect(x, y + 5, w, h, 20); ctx.fill();
  ctx.fillStyle = '#fffdf4'; rrect(x, y, w, h, 20); ctx.fill();
  ctx.strokeStyle = '#f1d58a'; ctx.lineWidth = 3; rrect(x, y, w, h, 20); ctx.stroke();

function hintTarget() {
  if (G.hintAt) return G.hintAt;
  if (G.idle < 4 || !G.ready || G.stage === 'done') return null;
  if (G.stage === 'build') {
    if (mamaBusy()) return null;
    const it = G.items.find(o => o.state === 'ground' && !o.decoy && (G.got[o.type] || 0) < need(o.type));
    return it ? { x: it.x, y: it.y } : null;
  }
  if (G.stage === 'eggs') { const e = G.eggs.find(o => o.chill) || G.eggs.find(o => !o.hatched); return e ? { x: e.x, y: e.y } : null; }
  if (G.stage === 'feed') {
    if (G.holding && G.hungry >= 0) return G.chicks[G.hungry];
    if (!G.fetching) { const f = G.foods.find(o => o.state === 'up' && o.up > .8); return f ? { x: f.x, y: f.y - 10 } : null; }
    return null;
  }
  if (G.stage === 'fly' && G.fly && G.fly.c && G.fly.c.state === 'ready') return G.fly.c;

function drawParts() {

    const a = clamp(p.life / p.max * 1.4, 0, 1);

    ctx.beginPath(); ctx.moveTo(w.x, w.y); ctx.quadraticCurveTo(w.x + w.len * .5, w.y - 12, w.x + w.len, w.y); ctx.stroke(); ctx.restore();

function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, cv.width, cv.height);
  ctx.setTransform(dpr * S, 0, 0, dpr * S, dpr * ox, dpr * oy);

  drawTrees();

  if (G.stage === 'feed') drawFoods();
  drawItems();
  drawNestBack();
  G.eggs.forEach(e => { if (!e.hatched) { ctx.save(); const s = 1 - e.pop * .6; ctx.translate(e.x, e.y); ctx.scale(s, s); ctx.translate(-e.x, -e.y); drawEgg(e, G.B, G.t); ctx.restore(); } });

  drawNestFront();
  // flight guide: a dotted arc from the nest rim to Mama's branch

    ctx.save(); ctx.setLineDash([4, 10]); ctx.lineCap = 'round'; ctx.strokeStyle = 'rgba(255,255,255,.95)'; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.moveTo(RIM.x + 10, RIM.y - 10); ctx.quadraticCurveTo(270, 200, landSlot(G.landed.length).x, RBRANCH.y - 30); ctx.stroke(); ctx.restore();
  }
  G.chicks.forEach((c, i) => { if (!inNest(c)) drawChickAt(c, i); });
  drawMama();
  drawCard();
  drawParts();
  const h = hintTarget();
  if (h) emoji('👆', h.x + 6, h.y + 38 + Math.abs(Math.sin(G.t * 5)) * -10, 38);
  if (G.stage === 'fly' && G.fly && G.fly.c && G.fly.c.state === 'ready' && !h) emoji('👆', G.fly.c.x + 4, G.fly.c.y + 44 + Math.abs(Math.sin(G.t * 5)) * -8, 34);
}

// ---------- input ----------
function toWorld(e) { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left - ox) / S, y: (e.clientY - r.top - oy) / S }; }
function nearest(list, p, maxD, fx = o => o) {
  let best = null, bd = maxD;
  for (const o of list) { const q = fx(o); const d = Math.hypot(q.x - p.x, q.y - p.y); if (d < bd) { bd = d; best = o; } }
  return best;
}
cv.addEventListener('pointerdown', e => {
  e.preventDefault(); ac();
  if (G.screen !== 'play') return;
  G.idle = 0;
  const p = toWorld(e);
  if (G.stage === 'build') {
    if (!G.ready) return;
    const it = nearest(G.items.filter(o => o.state === 'ground' || o.state === 'nope'), p, 44);
    if (it) tapItem(it);
    else if (Math.hypot(p.x - NEST.x, p.y - NEST.y) < 90) { SFX.peep(); say(NEST.x, NEST.y - 80, '👇 Pick from the grass'); }
  } else if (G.stage === 'eggs') {
    if (!G.ready) return;
    const eg = nearest(G.eggs.filter(o => !o.hatched), p, 52);
    if (eg) tapEgg(eg);
  } else if (G.stage === 'feed') {
    if (!G.ready) return;
    const f = nearest(G.foods.filter(o => o.state === 'up' && o.up > .3), p, 46, o => ({ x: o.x, y: o.y - 8 }));
    if (f) { tapFood(f); return; }
    const c = nearest(G.chicks, p, 42);
    if (c) tapChick(G.chicks.indexOf(c));
  } else if (G.stage === 'fly') {
    flapTap();
  }
});

// ---------- menus ----------
function buildMenu() {
  const al = loadAlbum();
  const box = document.getElementById('birdCards'); box.innerHTML = '';
  BIRDS.forEach((B, i) => {
    const b = document.createElement('button'); b.className = 'bcard';
    const c = document.createElement('canvas'); c.width = 220; c.height = 220;
    b.appendChild(c);
    const lab = document.createElement('div'); lab.textContent = B.name; b.appendChild(lab);
    if (al[B.id]) { const t = document.createElement('div'); t.className = 'tick'; t.textContent = '✓'; b.appendChild(t); }
    b.addEventListener('click', () => { ac(); SFX.chirp(); startBird(i); });
    box.appendChild(b);
    const main = ctx; ctx = c.getContext('2d');
    ctx.setTransform(2, 0, 0, 2, 0, 0);
    ctx.fillStyle = '#cdeeff'; circ(55, 55, 50); ctx.fill();
    ctx.fillStyle = '#8b5a33'; ctx.fillRect(8, 78, 94, 8);
    drawBird(52, 52, 1, B, { face: 1 });
    ctx.fillStyle = B.egg; ell(88, 72, 7, 9); ctx.fill();
    ctx = main;
  });
}
function showMenu() {
  G.screen = 'menu'; G.timers = [];
  document.getElementById('done').classList.add('hide');
  document.getElementById('menu').classList.remove('hide');
  document.querySelectorAll('.pip').forEach(p => p.classList.remove('on', 'done'));
  buildMenu();
}
document.getElementById('playBtn').addEventListener('click', () => {
  ac(); SFX.chirp();
  const al = loadAlbum(); const i = BIRDS.findIndex(b => !al[b.id]);
  startBird(i < 0 ? 0 : i);
});
document.getElementById('homeBtn').addEventListener('click', () => { ac(); showMenu(); });
document.getElementById('againBtn').addEventListener('click', () => { ac(); if (G.screen === 'play') startBird(G.bi); });
document.getElementById('nextBtn').addEventListener('click', () => { ac(); startBird((G.bi + 1) % BIRDS.length); });
document.getElementById('menuBtn').addEventListener('click', () => { ac(); showMenu(); });

// ---------- loop ----------
let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  if (cv.width < 2) resize();
  update(dt); render();
  requestAnimationFrame(frame);
}
resize(); buildMenu(); requestAnimationFrame(frame);
</script>
</body>
</html>
