<!-- CONCEPT: PUZZLES / BRAIN (pattern completion) - Wiggle's Pattern Garden: Wiggle the caterpillar's body is a repeating pattern of coloured bumps (AB, AAB, ABB, ABC, AABB, ABAC, ABCD by colour, shape and size); kids tap the bump that comes next to finish the tail, fill gaps in the middle, or spot the one bump that doesn't fit, then the whole body plays its pattern as a little tune, munches a leaf, curls into a cocoon and pops out as a butterfly whose wings carry the pattern into a saved Butterfly Garden; five gardens of four caterpillars plus a My Pattern mode where kids invent a core and watch Wiggle repeat it. No timer, no losing - a wrong bump just boings off, then the repeats light up and the right choice glows. Ages 4-11. -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Wiggle's Pattern Garden</title>
<style>
:root{
  --ink:#3a2a5a;
  --ink-soft:#6a5a8a;
  --card:#ffffff;
  --a1:#ff5fa8;
  --a2:#ff9f1c;
  --a3:#4aa8ff;
  --good:#46c25a;
  --gold:#ffd23d;
  --shadow:0 5px 0 rgba(58,42,90,.22);
  --radius:22px;
  --gap:10px;
  --font:"Comic Sans MS","Trebuchet MS",system-ui,sans-serif;
  --chip:clamp(64px,19vw,90px);
  --chip-sm:clamp(50px,15.5vw,72px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0; padding: 0;
  touch-action: manipulation;
  user-select: none; -webkit-user-select: none;
  overflow: hidden; height: 100%;
  font-family: var(--font); color: var(--ink);
  background: linear-gradient(180deg,#8fdcff,#e7fbff);
}
button { font-family: var(--font); color: var(--ink); cursor: pointer; }

/* ---------- play screen ---------- */
#app { position: absolute; inset: 0; display: flex; flex-direction: column; }
#bar { display: flex; align-items: center; gap: 6px; padding: 8px 8px 4px; flex-shrink: 0; }
.icon {
  width: 48px; height: 48px; flex-shrink: 0; border: none; border-radius: 50%;
  background: var(--card); box-shadow: var(--shadow); font-size: 24px; line-height: 1;
  display: grid; place-items: center; padding: 0;
}
.icon:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(58,42,90,.22); }
.icon.hide { visibility: hidden; }
#label {
  flex: 1; min-width: 0; font-weight: bold; font-size: clamp(15px,4.2vw,22px);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  background: rgba(255,255,255,.75); border-radius: 999px; padding: 8px 12px; text-align: center;
}
#dots { display: flex; gap: 5px; flex-shrink: 0; }
#dots span { width: 14px; height: 14px; border-radius: 50%; background: rgba(255,255,255,.7); border: 2px solid rgba(58,42,90,.25); }
#dots span.done { background: var(--good); border-color: #2f8f3f; }
#dots span.now { border-color: var(--a1); border-width: 3px; }
#prompt {
  flex-shrink: 0; margin: 4px auto 0; max-width: 94%;
  font-weight: bold; font-size: clamp(18px,5.2vw,30px); text-align: center;
  background: rgba(255,255,255,.85); border-radius: 999px; padding: 6px 18px; min-height: 44px;
  box-shadow: 0 3px 0 rgba(58,42,90,.15); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}
#prompt.flash { animation: flash .5s; }
@keyframes flash { 0%,100%{ transform: scale(1);} 40%{ transform: scale(1.08); background: #fff6c2; } }
#stageWrap { flex: 1; min-height: 0; position: relative; }
#stage { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: manipulation; }
#palette {
  flex-shrink: 0; display: flex; flex-direction: column; align-items: center; gap: 8px;
  padding: 8px 8px calc(12px + env(safe-area-inset-bottom)); min-height: 104px; justify-content: center;
  background: linear-gradient(180deg, rgba(255,255,255,0), rgba(255,255,255,.55));
}
.row { display: flex; flex-wrap: wrap; justify-content: center; gap: var(--gap); }
.chip {
  width: var(--chip); height: var(--chip); padding: 0; border-radius: var(--radius);
  background: var(--card); border: 4px solid #fff; box-shadow: var(--shadow); position: relative;
}
.chip.sm { width: var(--chip-sm); height: var(--chip-sm); border-radius: 18px; }
.chip canvas { width: 100%; height: 100%; display: block; pointer-events: none; }
.chip:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(58,42,90,.22); }
.chip.dim { opacity: .5; }
.chip.glow { border-color: var(--gold); animation: glow 1s infinite; }
@keyframes glow { 0%,100%{ box-shadow: 0 0 0 0 rgba(255,210,61,.9), var(--shadow);} 50%{ box-shadow: 0 0 0 10px rgba(255,210,61,0), var(--shadow);} }
.shake { animation: shake .4s; }
@keyframes shake { 0%,100%{ transform: translateX(0);} 25%{ transform: translateX(-8px) rotate(-4deg);} 75%{ transform: translateX(8px) rotate(4deg);} }
.big {
  border: none; border-radius: 999px; min-height: 60px; padding: 12px 26px;
  font-size: clamp(18px,5vw,26px); font-weight: bold; color: #fff;
  background: linear-gradient(180deg,#ff7fbd,var(--a1)); box-shadow: 0 6px 0 #c23c7e;
}
.big.green { background: linear-gradient(180deg,#7be38a,var(--good)); box-shadow: 0 6px 0 #2f8f3f; }
.big.blue { background: linear-gradient(180deg,#7cc4ff,var(--a3)); box-shadow: 0 6px 0 #2a72c0; }
.big.orange { background: linear-gradient(180deg,#ffc35c,var(--a2)); box-shadow: 0 6px 0 #c77300; }
.big.white { background: #fff; color: var(--ink); box-shadow: var(--shadow); }
.big:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,.2); }
.big.sm { min-height: 52px; padding: 8px 18px; font-size: clamp(16px,4.4vw,22px); }
.big.dim { opacity: .55; }

/* ---------- full screens ---------- */
.screen {
  position: absolute; inset: 0; display: none; flex-direction: column; align-items: center;
  overflow-y: auto; z-index: 10; padding: 14px 14px 24px;
  background: linear-gradient(180deg,#bdf0ff 0%,#eaffd9 70%,#c9f2a8 100%);
}
.screen.on { display: flex; }
.mascot { font-size: clamp(44px,13vw,72px); line-height: 1; margin-top: 4px; }
h1 {
  margin: 4px 0 2px; text-align: center; font-size: clamp(30px,9vw,54px); line-height: 1.05;
  background: linear-gradient(90deg,var(--a1),var(--a2),var(--a3)); -webkit-background-clip: text; background-clip: text; color: transparent;
}
.sub { margin: 0 0 12px; font-size: clamp(15px,4.2vw,20px); color: var(--ink-soft); text-align: center; font-weight: bold; }
.gardens { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 12px; width: min(100%, 560px); }
.gcard {
  border: none; border-radius: var(--radius); min-height: 100px; padding: 10px 8px;
  box-shadow: var(--shadow); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  font-weight: bold; font-size: clamp(15px,4.2vw,20px);
}
.gcard .e { font-size: clamp(30px,9vw,42px); line-height: 1.1; }
.gcard .p { font-size: clamp(13px,3.6vw,17px); letter-spacing: 1px; }
.gcard:active { transform: translateY(3px); }
.homeRow { display: flex; flex-direction: column; gap: 12px; width: min(100%, 560px); margin-top: 14px; }
.tiny { margin-top: 16px; background: none; border: none; color: var(--ink-soft); font-size: 15px; min-height: 44px; padding: 8px 14px; text-decoration: underline; }

#flutter { padding: 0; overflow: hidden; }
#flutterBar { display: flex; align-items: center; gap: 8px; padding: 8px; width: 100%; flex-shrink: 0; }
#flutterTitle { flex: 1; text-align: center; font-weight: bold; font-size: clamp(18px,5vw,26px); background: rgba(255,255,255,.8); border-radius: 999px; padding: 8px; }
#fWrap { flex: 1; min-height: 0; width: 100%; position: relative; }
#fcanvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

#cheer {
  position: absolute; inset: 0; z-index: 20; display: none; align-items: center; justify-content: center;
  background: rgba(40,20,70,.4); padding: 16px;
}
#cheer.on { display: flex; }
.card {
  background: #fff; border-radius: 28px; padding: 20px 18px; width: min(92vw, 420px); text-align: center;
  box-shadow: 0 10px 0 rgba(58,42,90,.25); animation: popin .45s cubic-bezier(.3,1.6,.5,1);
}
@keyframes popin { from { transform: scale(.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.card h2 { margin: 0 0 6px; font-size: clamp(26px,7.5vw,38px); color: var(--a1); }
.card .flies { font-size: clamp(34px,10vw,52px); margin: 6px 0 12px; }
.card .col { display: flex; flex-direction: column; gap: 12px; }
</style>
</head>
<body>

<div id="app">
  <div id="bar">
    <button class="icon" id="homeBtn" aria-label="Home">🏠</button>
    <div id="label">Wiggle</div>
    <div id="dots"></div>
    <button class="icon" id="hintBtn" aria-label="Hint">💡</button>
    <button class="icon" id="muteBtn" aria-label="Sound">🔊</button>
  </div>
  <div id="prompt">What comes next? 👉</div>
  <div id="stageWrap"><canvas id="stage"></canvas></div>
  <div id="palette"></div>
</div>

<div class="screen on" id="home">
  <div class="mascot">🐛</div>
  <h1>Wiggle's Pattern Garden</h1>
  <p class="sub">Finish the pattern ➜ make a butterfly! 🦋</p>
  <div class="gardens" id="gardens"></div>
  <div class="homeRow">
    <button class="big blue" id="flutterBtn">🦋 Butterfly Garden</button>
  </div>
  <button class="tiny" id="resetBtn">↺ Start over</button>
</div>

<div class="screen" id="flutter">
  <div id="flutterBar">
    <button class="icon" id="flutterBack" aria-label="Back">🏠</button>
    <div id="flutterTitle">🦋 Butterfly Garden</div>
  </div>
  <div id="fWrap"><canvas id="fcanvas"></canvas></div>
</div>

<div id="cheer">
  <div class="card">
    <h2 id="cheerTitle">Garden done!</h2>
    <div class="flies">🦋🦋🦋🦋</div>
    <div class="col" id="cheerBtns"></div>
  </div>
</div>

<script>
'use strict';
const $ = s => document.querySelector(s);
const LSK = 'cowork-wigglepattern-';
const load = (k, d) => { try { const v = JSON.parse(localStorage.getItem(LSK + k)); return v == null ? d : v; } catch (e) { return d; } };
const store = (k, v) => { try { localStorage.setItem(LSK + k, JSON.stringify(v)); } catch (e) {} };

/* ---------------- data ---------------- */
const COLORS = [
  { f: '#ff5a5f', d: '#c9343a' }, // red
  { f: '#ff9f1c', d: '#c77300' }, // orange
  { f: '#ffd93d', d: '#c99c00' }, // yellow
  { f: '#5ad15a', d: '#2f8f35' }, // green
  { f: '#4aa8ff', d: '#1f6fc0' }, // blue
  { f: '#b07cff', d: '#7445c9' }, // purple
  { f: '#ff7ac8', d: '#c9448f' }, // pink
];
const LIME = { f: '#9be15d', d: '#5a9e2c' };
const SHAPES = ['star', 'heart', 'circle', 'triangle', 'square', 'diamond'];
const SMALL = 0.64;

const THEMES = [
  { sky: ['#7fd3ff', '#d4f4ff'], hill: '#8fe07a', grass: '#62c95c', sun: true },
  { sky: ['#8fe8c8', '#e6fff3'], hill: '#7fd78a', grass: '#4bbf62', sun: true },
  { sky: ['#ffbfe0', '#fff1f8'], hill: '#9ee07a', grass: '#6fcf5f', sun: true },
  { sky: ['#c3b2ff', '#f1ecff'], hill: '#86cf8a', grass: '#56b46a', sun: true },
  { sky: ['#1b2256', '#3d3f92'], hill: '#2f6f5a', grass: '#245a48', night: true },
  { sky: ['#ffdf8f', '#fff8dc'], hill: '#a8e27a', grass: '#7fcf5f', sun: true },
];

const GARDENS = [
  { name: 'Sunny Leaf', emoji: '🌞', bg: '#ffe98a', rounds: [
    { type: 'AB', kind: 'color', gaps: 1, choices: 2 },
    { type: 'AB', kind: 'color', gaps: 1, choices: 2 },
    { type: 'AB', kind: 'color', gaps: 2, choices: 2 },
    { type: 'AB', kind: 'color', gaps: 2, choices: 3 } ] },
  { name: 'Clover Patch', emoji: '🍀', bg: '#b9f3c8', rounds: [
    { type: 'AAB', kind: 'color', gaps: 2, choices: 3 },
    { type: 'ABB', kind: 'color', gaps: 2, choices: 3 },
    { type: 'ABC', kind: 'color', gaps: 2, choices: 3 },
    { type: 'ABC', kind: 'color', gaps: 3, choices: 4 } ] },
  { name: 'Flower Bed', emoji: '🌷', bg: '#ffd0e8', rounds: [
    { type: 'AB', kind: 'shape', gaps: 2, choices: 3 },
    { type: 'ABC', kind: 'shape', gaps: 2, choices: 3 },
    { type: 'AABB', kind: 'color', gaps: 3, choices: 3 },
    { type: 'ABC', kind: 'combo', gaps: 3, choices: 4 } ] },
  { name: 'Mushroom Grove', emoji: '🍄', bg: '#ddd2ff', rounds: [
    { type: 'AB', kind: 'size', gaps: 2, choices: 2, mid: true },
    { type: 'ABB', kind: 'size', gaps: 2, choices: 3 },
    { type: 'ABC', kind: 'color', gaps: 2, choices: 3, mid: true },
    { type: 'ABAC', kind: 'color', gaps: 2, choices: 4 } ] },
  { name: 'Moonlight Meadow', emoji: '🌙', bg: '#b8c2ff', rounds: [
    { type: 'AB', kind: 'color', fix: true, choices: 2 },
    { type: 'ABC', kind: 'shape', fix: true, choices: 3 },
    { type: 'AABB', kind: 'color', fix: true, choices: 3 },
    { type: 'ABCD', kind: 'combo', fix: true, choices: 4 } ] },
];

const MAKE_TOKENS = [
  ...COLORS.slice(0, 6).map((_, c) => ({ c, s: null, z: 1 })),
  { c: 2, s: 'star', z: 1 }, { c: 6, s: 'heart', z: 1 }, { c: 4, s: 'diamond', z: 1 }, { c: 3, s: null, z: SMALL },
];

const tkey = t => t.c + '|' + (t.s || '') + '|' + t.z;
const same = (a, b) => !!a && !!b && tkey(a) === tkey(b);
const rint = n => Math.floor(Math.random() * n);
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rint(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const easeOut = t => 1 - Math.pow(1 - t, 3);
const easeInOut = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const easeBack = t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const validTok = t => t && Number.isInteger(t.c) && t.c >= 0 && t.c < COLORS.length && (t.s === null || SHAPES.includes(t.s)) && (t.z === 1 || t.z === SMALL);

/* ---------------- saved state ---------------- */
let progress = load('progress', null);
if (!Array.isArray(progress) || progress.length !== GARDENS.length || !progress.every(a => Array.isArray(a) && a.length === 4)) {
  progress = GARDENS.map(() => [false, false, false, false]);
}
progress = progress.map(a => a.map(Boolean));
let flies = load('butterflies', []);
if (!Array.isArray(flies)) flies = [];
flies = flies.filter(b => b && Array.isArray(b.t) && b.t.length >= 1 && b.t.length <= 4 && b.t.every(validTok)).slice(-48);
let muted = !!load('muted', false);

/* ---------------- audio ---------------- */
let AC = null, master = null, noiseBuf = null;
function ac() {
  if (!AC) {
    try {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      master = AC.createGain(); master.gain.value = 0.55; master.connect(AC.destination);
      noiseBuf = AC.createBuffer(1, AC.sampleRate * 0.25, AC.sampleRate);
      const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
    } catch (e) { AC = null; }
  }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(freq, dur = 0.25, type = 'sine', vol = 0.25, when = 0, slideTo = 0) {
  if (muted) return; const a = ac(); if (!a) return;
  const t = a.currentTime + when, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.012); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.05);
}
const SCALE = [392, 440, 523.25, 587.33, 659.25, 783.99, 880, 1046.5];
function tokFreq(t) { const si = t.s ? SHAPES.indexOf(t.s) + 1 : 0; let f = SCALE[(t.c + si * 3) % SCALE.length]; if (t.z < 1) f *= 1.5; return f; }
function note(t, when = 0) { const f = tokFreq(t); tone(f, 0.38, 'triangle', 0.26, when); tone(f * 2, 0.18, 'sine', 0.06, when); }
const sfx = {
  pop() { tone(620, 0.09, 'sine', 0.2, 0, 1250); },
  boing() { tone(330, 0.4, 'sine', 0.22, 0, 110); tone(165, 0.3, 'triangle', 0.08, 0.02, 80); },
  giggle() { [700, 900, 760, 1000].forEach((f, i) => tone(f, 0.09, 'sine', 0.12, i * 0.07)); },
  chomp() {
    if (muted) return; const a = ac(); if (!a || !noiseBuf) return;
    const s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
    s.buffer = noiseBuf; f.type = 'bandpass'; f.frequency.value = 900; g.gain.value = 0.5;
    s.connect(f); f.connect(g); g.connect(master); s.start(); tone(140, 0.08, 'square', 0.05);
  },
  sparkle() { [1318, 1568, 2093, 1760, 2637].forEach((f, i) => tone(f, 0.22, 'sine', 0.08, i * 0.06)); },
  fanfare() { [523, 659, 784, 1047, 784, 1047].forEach((f, i) => tone(f, i === 5 ? 0.6 : 0.2, 'triangle', 0.2, i * 0.13)); },
  whoosh() { tone(300, 0.5, 'sine', 0.06, 0, 900); },
};
function say(text) {
  if (muted || !window.speechSynthesis || !window.SpeechSynthesisUtterance) return;
  try {
    const clean = text.replace(/[^\p{L}\p{N}\s?!.,']/gu, '').trim(); if (!clean) return;
    speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(clean); u.rate = 0.95; u.pitch = 1.3; speechSynthesis.speak(u);
  } catch (e) {}
}

/* ---------------- round generation ---------------- */
function tokenPool(kind, bodyC) {
  if (kind === 'color') return shuffle([0, 1, 2, 3, 4, 5, 6]).map(c => ({ c, s: null, z: 1 }));
  if (kind === 'shape') return shuffle(SHAPES).map(s => ({ c: bodyC, s, z: 1 }));
  if (kind === 'size') {
    const big = { c: bodyC, s: null, z: 1 }, small = { c: bodyC, s: null, z: SMALL };
    const others = shuffle([0, 1, 2, 3, 4, 5, 6].filter(c => c !== bodyC)).map(c => ({ c, s: null, z: 1 }));
    return (Math.random() < 0.5 ? [big, small] : [small, big]).concat(others);
  }
  const cs = shuffle([0, 1, 2, 3, 4, 5, 6]), ss = shuffle(SHAPES);
  return ss.map((s, i) => ({ c: cs[i], s, z: 1 }));
}
function makeRound(spec) {
  const bodyC = rint(COLORS.length);
  const pool = tokenPool(spec.kind, bodyC);
  const letters = [...new Set(spec.type)];
  const map = {}; letters.forEach((L, i) => { map[L] = pool[i]; });
  const core = [...spec.type].map(L => map[L]);
  const cl = core.length;
  const n = Math.min(12, Math.max(8, cl * 3));
  const answer = Array.from({ length: n }, (_, i) => core[i % cl]);
  const shown = answer.slice();
  let gaps = [], fixIdx = -1, fixTok = null;
  if (spec.fix) {
    fixIdx = cl + 1 + rint(n - cl - 1);
    const others = letters.map(L => map[L]).filter(t => !same(t, answer[fixIdx]));
    fixTok = others[rint(others.length)];
    shown[fixIdx] = fixTok;
  } else if (spec.mid) {
    for (let tries = 0; tries < 200 && gaps.length < spec.gaps; tries++) {
      const i = cl + rint(n - cl);
      if (!gaps.includes(i) && !gaps.includes(i - 1) && !gaps.includes(i + 1)) gaps.push(i);
    }
    gaps.sort((a, b) => a - b);
  } else {
    for (let i = n - spec.gaps; i < n; i++) gaps.push(i);
  }
  gaps.forEach(i => { shown[i] = null; });
  const distinct = letters.map(L => map[L]);
  const want = Math.max(distinct.length, spec.choices || 0);
  const choices = shuffle(distinct.concat(pool.slice(letters.length, letters.length + (want - distinct.length))));
  const headC = (spec.kind === 'shape' || spec.kind === 'size') ? COLORS[bodyC] : LIME;
  return { spec, core, answer, shown, n, gaps, fixIdx, fixTok, choices, headC };
}

/* ---------------- drawing helpers ---------------- */
function shapePath(g, s, x, y, k) {
  g.beginPath();
  if (s === 'star') {
    for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? k * 0.45 : k; g.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); }
    g.closePath();
  } else if (s === 'heart') {
    g.moveTo(x, y + k * 0.85);
    g.bezierCurveTo(x - k * 1.3, y - k * 0.05, x - k * 0.6, y - k * 1.05, x, y - k * 0.38);
    g.bezierCurveTo(x + k * 0.6, y - k * 1.05, x + k * 1.3, y - k * 0.05, x, y + k * 0.85);
    g.closePath();
  } else if (s === 'circle') {
    g.arc(x, y, k * 0.78, 0, Math.PI * 2);
  } else if (s === 'triangle') {

    case 'chomp': {

        const lp = leafPos(now); sfx.chomp(); S.lastChomp = now; S.bites++; S.step++; burst(lp.x, lp.y, 8, 'crumb');

/* ---------------- butterfly garden ---------------- */
let FLY_HITS = [];
const flyHop = new Map();
function drawFlutter(now) {

    return;
  }
  const cnt = flies.length, cols = Math.max(1, Math.ceil(Math.sqrt(cnt * FW / FH))), rows = Math.ceil(cnt / cols);

    const x = (i % cols + 0.5) * cw + Math.sin(now * 0.0013 + i) * cw * 0.08;
    const y = (Math.floor(i / cols) + 0.5) * chh + Math.cos(now * 0.0017 + i * 1.7) * chh * 0.07 - hop * chh * 0.3;
    drawButterfly(fg, x, y, sz * (1 + hop * 0.3), b.t, now * 0.01 + i * 0.9, 1, Math.sin(now * 0.0019 + i) * 0.2);

fcv.addEventListener('pointerdown', ev => {

  if (S.screen !== 'play') return;
  ac();
  const b = cv.getBoundingClientRect(), x = ev.clientX - b.left, y = ev.clientY - b.top, now = performance.now();
  if (!LAY) return;
  const busy = ['tune', 'chomp', 'cocoon', 'fly', 'grow'].includes(S.phase);
  const h = headPos(now);
  if (!busy && S.phase !== 'done' && Math.hypot(h.x - x, h.y - y) < LAY.r * 1.4) { S.headWob = now; sfx.giggle(); return; }
  if (busy || S.phase === 'done' || S.phase === 'gone') return;
  let best = -1, bd = 1e9;
  for (let i = 0; i < S.n; i++) { const p = segPos(i, now), d = Math.hypot(p.x - x, p.y - y); if (d < LAY.r * 1.15 && d < bd) { bd = d; best = i; } }
  if (best < 0) return;
  const sl = S.slots[best];
  if (S.mode === 'play' && S.phase === 'find') { onFindTap(best, now); return; }
  if (sl.tok) { sl.bounce = now; note(sl.tok); }
  else if (best === activeGap()) { setPrompt(S.mode === 'make' ? 'Pick a bump below 👇' : 'Pick one below 👇'); }
});

/* ---------------- buttons ---------------- */
$('#homeBtn').addEventListener('click', () => showScreen('home'));
$('#flutterBack').addEventListener('click', () => showScreen('home'));
$('#flutterBtn').addEventListener('click', () => { ac(); showScreen('flutter'); });
$('#hintBtn').addEventListener('click', hint);
promptEl.addEventListener('click', () => say(promptEl.textContent));
function syncMute() { $('#muteBtn').textContent = muted ? '🔇' : '🔊'; }
$('#muteBtn').addEventListener('click', () => { muted = !muted; store('muted', muted); syncMute(); if (!muted) { ac(); sfx.pop(); } else if (window.speechSynthesis) { try { speechSynthesis.cancel(); } catch (e) {} } });
$('#resetBtn').addEventListener('click', () => {
  const b = $('#resetBtn');
  if (!S.resetArm || performance.now() - S.resetArm > 4000) { S.resetArm = performance.now(); b.textContent = 'Tap again to start over (butterflies stay)'; return; }
  progress = GARDENS.map(() => [false, false, false, false]); store('progress', progress); renderHome();
});
window.addEventListener('resize', () => { LAY = null; paletteEl.querySelectorAll('.chip canvas').forEach(c => { const k = c.parentElement.dataset.k; const t = [...MAKE_TOKENS, ...(S.round ? S.round.choices : [])].find(q => tkey(q) === k); if (t) paintChip(c, t); }); });

/* ---------------- loop ---------------- */
let lastT = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - lastT) / 1000); lastT = now;
  if (S.screen === 'play') { tick(now); stepFx(dt); drawPlay(now); }
  else if (S.screen === 'flutter') drawFlutter(now);
  requestAnimationFrame(frame);
}
syncMute();
renderHome();
requestAnimationFrame(frame);
</script>
</body>
