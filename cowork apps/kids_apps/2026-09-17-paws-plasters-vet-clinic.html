<!-- CONCEPT: PRETEND PLAY - Paws & Plasters Vet Clinic: poorly animal patients waddle into the clinic and kids pick up real vet tools to make them better by doing the actual job with their finger - scrub off mud with a sponge then rinse with the shower, stick a plaster on a scrape, hold a thermometer in a hot mouth then spoon in medicine, pull a thorn from a paw with tweezers, brush germy teeth, listen to a heartbeat with a stethoscope and hold a tissue to a sniffly nose - then hand over a lollipop so the pal can wave goodbye and fill the Get Well Wall; cure all 10 animals for a thank-you parade. Picture clipboard, no reading, no timer, no losing - a wrong tool just tickles. Ages 4-11. -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Paws &amp; Plasters Vet Clinic</title>
<style>
:root {
  --sky1: #b9f0ff; --sky2: #fff3c4; --ink: #35305a;
  --pink: #ff5fa2; --orange: #ff9a3c; --purple: #8a5cff; --green: #2bc46a;
  --card1: #ffffff; --card2: #fff6dc;
  --radius: 22px; --gap: 8px;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0; padding: 0; height: 100%;
  overflow: hidden;
  touch-action: manipulation;
  user-select: none; -webkit-user-select: none;
  font-family: "Comic Sans MS", "Trebuchet MS", system-ui, sans-serif;
  color: var(--ink);
  background: linear-gradient(180deg, var(--sky1), var(--sky2));
}
button { font-family: inherit; color: inherit; }
#app {
  position: fixed; top: 0; bottom: 0; left: 0; right: 0;
  max-width: 900px; margin: 0 auto;
  display: flex; flex-direction: column;
}
header {
  display: flex; align-items: center; justify-content: space-between;
  gap: var(--gap); padding: 6px 10px 2px;
}
.title {
  min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  font-size: clamp(19px, 5.4vw, 32px); font-weight: 900;
}
.grad {
  background: linear-gradient(90deg, var(--pink), var(--orange), var(--purple));
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.hdr-r { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
.icon-btn {
  width: 46px; height: 46px; border: none; border-radius: 50%;
  background: #fff; font-size: 24px; cursor: pointer;
  box-shadow: 0 4px 0 #0002; display: grid; place-items: center; padding: 0;
}
.icon-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #0002; }
.pill {
  background: #fff; border-radius: 30px; padding: 6px 12px; min-height: 40px;
  display: none; align-items: center; font-size: clamp(16px, 4.4vw, 22px); font-weight: 900;
  box-shadow: 0 4px 0 #0002;
}
.pill.show { display: flex; }
#wall {
  display: flex; justify-content: center; gap: clamp(2px, 1vw, 8px);
  padding: 4px 8px 6px;
}
.slot {
  width: clamp(30px, 8.6vw, 50px); height: clamp(30px, 8.6vw, 50px);
  border-radius: 50%; background: #ffffffaa; display: grid; place-items: center;
  font-size: clamp(18px, 5.4vw, 30px); box-shadow: inset 0 -3px 0 #0001;
}
.slot span { filter: grayscale(1); opacity: .28; transition: opacity .3s; }
.slot.on { background: #fff; box-shadow: 0 0 0 3px #ffd84d; }
.slot.on span { filter: none; opacity: 1; }
.slot.pop { animation: pop .7s ease; }
#stageWrap {
  position: relative; flex: 1; min-height: 0; margin: 0 8px;
  border-radius: 26px; overflow: hidden; background: #e5f8ff;
  box-shadow: 0 6px 0 #0000001c; touch-action: none;
}
#stage { display: block; width: 100%; height: 100%; touch-action: none; cursor: pointer; }
#chips {
  position: absolute; top: 8px; left: 0; right: 0;
  display: flex; justify-content: center; align-items: center; gap: 6px;
  pointer-events: none; padding: 0 6px;
}
.chip {
  width: 46px; height: 46px; border-radius: 14px; background: #fff;
  display: grid; place-items: center; font-size: 26px; position: relative;
  box-shadow: 0 3px 0 #0002; transition: opacity .25s, background .25s;
}
.chip svg { width: 30px; height: 30px; }
.chip.later { opacity: .45; }
.chip.now { box-shadow: 0 0 0 3px var(--orange), 0 3px 0 #0002; animation: bob 1.1s ease-in-out infinite; }
.chip.done { background: #d4ffdc; }
.chip.done::after {
  content: '✔'; position: absolute; right: -5px; bottom: -7px;
  font-size: 20px; color: var(--green); text-shadow: 0 0 3px #fff, 0 0 3px #fff;
}
.chip.gap { margin-left: 10px; }
#tools {
  display: grid; grid-template-columns: repeat(5, 1fr); gap: var(--gap);
  padding: 8px 8px calc(10px + env(safe-area-inset-bottom)); touch-action: none;
}
.tool {
  height: clamp(58px, 9vh, 84px); min-width: 44px; border: none; border-radius: 18px;
  font-size: clamp(30px, 8.4vw, 46px); cursor: pointer; padding: 0;
  display: grid; place-items: center; touch-action: none;
  box-shadow: 0 5px 0 #0003; transition: transform .12s;
}
.tool svg { width: 62%; height: 62%; }
.tool .ico { pointer-events: none; display: grid; place-items: center; width: 100%; height: 100%; }
.tool:active { transform: translateY(3px); box-shadow: 0 2px 0 #0003; }
.tool.held { box-shadow: 0 0 0 4px #fff, 0 0 0 8px var(--orange); transform: scale(.93); }
.tool.hint { animation: wig .9s ease-in-out infinite; }
#ghost {
  position: fixed; left: 0; top: 0; width: 80px; height: 80px; margin: -70px 0 0 -40px;
  font-size: 62px; line-height: 80px; text-align: center; pointer-events: none;
  z-index: 50; display: none; filter: drop-shadow(0 6px 4px #0005);
}
#ghost svg { width: 66px; height: 66px; margin-top: 7px; }
#flyer { position: fixed; z-index: 60; pointer-events: none; font-size: 60px; line-height: 1;
  transition: transform .9s cubic-bezier(.5,-0.3,.6,1), opacity .9s; }
.overlay {
  position: fixed; top: 0; bottom: 0; left: 0; right: 0; z-index: 100;
  display: none; align-items: center; justify-content: center;
  background: #35305acc; padding: 16px;
}
.overlay.show { display: flex; }
.card {
  background: linear-gradient(180deg, var(--card1), var(--card2));
  border-radius: 30px; padding: 22px 16px; text-align: center;
  width: 100%; max-width: 430px; box-shadow: 0 10px 0 #0003;
}
.card h1, .card h2 { margin: 6px 0 12px; font-size: clamp(30px, 9vw, 46px); line-height: 1.1; }
.hero { font-size: clamp(54px, 16vw, 84px); line-height: 1.1; }
.hero span { display: inline-block; animation: bob 1.4s ease-in-out infinite; }
.hero span:nth-child(2) { animation-delay: .2s; }
.hero span:nth-child(3) { animation-delay: .4s; }
.how {
  display: flex; justify-content: center; align-items: center; flex-wrap: wrap; gap: 4px;
  font-size: clamp(28px, 8vw, 40px); margin: 4px 0 16px;
}
.how .arrow { font-size: .6em; opacity: .5; }
.big-btn {
  min-height: 64px; padding: 12px 26px; margin: 6px; border: none; border-radius: 40px;
  font-size: clamp(22px, 6.4vw, 30px); font-weight: 900; color: #fff; cursor: pointer;
  background: linear-gradient(90deg, var(--pink), var(--orange)); box-shadow: 0 6px 0 #c2407a;
}
.big-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #c2407a; }
.big-btn.green { background: linear-gradient(90deg, #35d67a, #1fb6a0); box-shadow: 0 6px 0 #178a5c; }
.big-btn.gray { background: linear-gradient(90deg, #a3a8c3, #8a8fad); box-shadow: 0 6px 0 #666b88; }
.parade { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; font-size: clamp(36px, 11vw, 54px); }
.parade span { display: inline-block; animation: dance .7s ease-in-out infinite alternate; }
@keyframes wig { 0%,100% { transform: rotate(0) scale(1); } 25% { transform: rotate(-11deg) scale(1.1); } 75% { transform: rotate(11deg) scale(1.1); } }
@keyframes bob { 50% { transform: translateY(-5px); } }
@keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.7); } 100% { transform: scale(1); } }
@keyframes dance { from { transform: translateY(0) rotate(-10deg); } to { transform: translateY(-14px) rotate(10deg); } }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="title">🐾 <span class="grad">Paws &amp; Plasters</span></div>
    <div class="hdr-r">
      <div id="trophy" class="pill">🏆 0</div>
      <button id="muteBtn" class="icon-btn" aria-label="Sound on or off">🔊</button>
      <button id="resetBtn" class="icon-btn" aria-label="Start over">↺</button>
    </div>
  </header>
  <div id="wall"></div>
  <div id="stageWrap">
    <canvas id="stage"></canvas>
    <div id="chips"></div>
  </div>
  <div id="tools"></div>
</div>
<div id="ghost"></div>

<div id="startOv" class="overlay show">
  <div class="card">
    <div class="hero"><span>🩺</span><span>🐶</span><span>🩹</span></div>
    <h1 class="grad">Paws &amp; Plasters</h1>
    <div class="how"><span>👆</span><span class="arrow">➜</span><span>🧽🩹🌡️</span><span class="arrow">➜</span><span>🤕</span><span class="arrow">➜</span><span>😊</span></div>
    <button class="big-btn" id="startBtn">▶ Open the Clinic!</button>
  </div>
</div>
<div id="paradeOv" class="overlay">
  <div class="card">
    <div class="parade" id="paradeRow"></div>
    <h2 class="grad">Everyone feels better!</h2>
    <div class="how"><span>💖</span><span>🍭</span><span>🎉</span></div>
    <button class="big-btn" id="againBtn">🐾 More patients!</button>
  </div>
</div>
<div id="confirmOv" class="overlay">
  <div class="card">
    <div class="hero"><span>↺</span></div>
    <h2>Start over?</h2>
    <button class="big-btn green" id="yesBtn">✅ Yes</button>
    <button class="big-btn gray" id="noBtn">❌ No</button>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const TAU = Math.PI * 2;
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const EMOJI_FONT = '"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif';

// ---------- data ----------
const SPECIES = [
  { id: 'kitty',  e: '🐱', fur: '#f7a94b', belly: '#ffe6c4', dark: '#c9762a', ear: 'cat',   whisk: true, voice: 720 },
  { id: 'puppy',  e: '🐶', fur: '#d9a066', belly: '#fbe6cc', dark: '#8a5a2b', ear: 'dog',   voice: 420 },
  { id: 'bunny',  e: '🐰', fur: '#eee7fb', belly: '#ffffff', dark: '#ff9ec4', ear: 'bunny', voice: 880 },
  { id: 'bear',   e: '🐻', fur: '#ad774f', belly: '#ebc9a2', dark: '#6e4527', ear: 'bear',  voice: 260 },
  { id: 'piggy',  e: '🐷', fur: '#ffb8cb', belly: '#ffd9e4', dark: '#e57a9a', ear: 'pig',   voice: 560 },
  { id: 'froggy', e: '🐸', fur: '#82d85c', belly: '#dcf7b8', dark: '#3f9a2c', ear: 'frog',  voice: 330 },
  { id: 'fox',    e: '🦊', fur: '#ff8b3d', belly: '#fff4ea', dark: '#5a3a2a', ear: 'fox',   whisk: true, voice: 640 },
  { id: 'panda',  e: '🐼', fur: '#f8f8f8', belly: '#ffffff', dark: '#2e2e3a', ear: 'panda', voice: 380 },
  { id: 'mouse',  e: '🐭', fur: '#bcc3cf', belly: '#eef0f5', dark: '#ff9eb8', ear: 'mouse', whisk: true, voice: 1100 },
  { id: 'lion',   e: '🦁', fur: '#f7cb4d', belly: '#fff0bf', dark: '#d9822b', ear: 'lion',  voice: 300 },
];
const TWEEZ = '<svg viewBox="0 0 40 40" aria-hidden="true"><path d="M20 3 Q7 22 15 37 M20 3 Q33 22 25 37" stroke="#6f7a8f" stroke-width="5.5" stroke-linecap="round" fill="none"/><path d="M20 4 Q9 22 15 35 M20 4 Q31 22 25 35" stroke="#eef2f8" stroke-width="2" stroke-linecap="round" fill="none"/><circle cx="20" cy="5" r="4" fill="#6f7a8f"/></svg>';
const TOOLS = [
  { id: 'sponge',   e: '🧽', bg: '#fff27a' },
  { id: 'shower',   e: '🚿', bg: '#9fe3ff' },
  { id: 'bandage',  e: '🩹', bg: '#ffc9a8' },
  { id: 'thermo',   e: '🌡️', bg: '#ff9fb2' },
  { id: 'medicine', e: '🥄', bg: '#e3c2ff' },
  { id: 'tweezers', svg: TWEEZ, bg: '#d5dcea' },
  { id: 'brush',    e: '🪥', bg: '#b8f5c8' },
  { id: 'stetho',   e: '🩺', bg: '#a9c8ff' },
  { id: 'tissue',   e: '🧻', bg: '#ffffff' },
  { id: 'lolly',    e: '🍭', bg: '#ffb3e0' },
];
const TOOL = Object.fromEntries(TOOLS.map(t => [t.id, t]));
const icon = id => TOOL[id].svg || TOOL[id].e;
// each ailment is a short routine of tool steps
const AIL = {
  scrape:  { steps: ['bandage'],           sym: '🤕' },
  mud:     { steps: ['sponge', 'shower'],  sym: '🟤' },
  fever:   { steps: ['thermo', 'medicine'], sym: '🥵' },
  thorn:   { steps: ['tweezers'],          sym: '🌵' },
  teeth:   { steps: ['brush'],             sym: '🦷' },
  heart:   { steps: ['stetho'],            sym: '💓' },
  sniffle: { steps: ['tissue'],            sym: '🤧' },
};
const CONF = ['#ff5fa2', '#ff9a3c', '#ffd84d', '#35d67a', '#39b8ff', '#8a5cff'];

// ---------- storage ----------
const KEY = 'cowork-pawsplasters-';
const load = (k, d) => { try { const v = localStorage.getItem(KEY + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } };
const save = (k, v) => { try { localStorage.setItem(KEY + k, JSON.stringify(v)); } catch (e) {} };
let cured = load('cured', []);
if (!Array.isArray(cured)) cured = [];
cured = cured.filter(id => SPECIES.some(s => s.id === id));
let rounds = +load('rounds', 0) || 0;
let seen = +load('seen', 0) || 0;
let muted = !!load('muted', false);

// ---------- audio ----------
let AC = null, noiseBuf = null;
function audio() {
  if (!AC) { const C = window.AudioContext || window.webkitAudioContext; if (C) { try { AC = new C(); } catch (e) {} } }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(f, d = .15, type = 'sine', v = .18, delay = 0, f2 = null) {
  if (muted) return; const a = audio(); if (!a) return;
  const t = a.currentTime + delay, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(v, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t + d + 0.03);
}
function noise(d = .2, v = .15, freq = 1500, q = 1, delay = 0, f2 = null) {
  if (muted) return; const a = audio(); if (!a) return;
  if (!noiseBuf) {
    noiseBuf = a.createBuffer(1, a.sampleRate, a.sampleRate);
    const ch = noiseBuf.getChannelData(0);
    for (let i = 0; i < ch.length; i++) ch[i] = Math.random() * 2 - 1;
  }
  const t = a.currentTime + delay, s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
  s.buffer = noiseBuf; f.type = 'bandpass'; f.Q.value = q;
  f.frequency.setValueAtTime(freq, t);
  if (f2) f.frequency.exponentialRampToValueAtTime(f2, t + d);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(v, t + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  s.connect(f).connect(g).connect(a.destination); s.start(t, Math.random() * 0.5); s.stop(t + d + 0.05);
}
const voice = () => pat ? pat.sp.voice : 600;
const SFX = {
  pick:    () => tone(660, .08, 'triangle', .14, 0, 990),
  drop:    () => tone(520, .08, 'triangle', .1, 0, 380),
  chime:   () => [784, 988, 1319].forEach((f, i) => tone(f, .28, 'sine', .15, i * .07)),
  ding:    () => tone(1046, .35, 'sine', .16),
  boop:    () => tone(330, .16, 'sine', .15, 0, 240),
  giggle:  () => { const v = voice(); for (let i = 0; i < 4; i++) tone(v * (1.15 + (i % 2) * .18), .07, 'triangle', .11, i * .08); },
  squish:  () => noise(.13, .14, 900, 2, 0, 450),
  water:   () => noise(.2, .1, 3200, .6),
  tick:    () => tone(1900, .03, 'square', .035),
  scrub:   () => noise(.08, .12, 2600, 3),
  stretch: k => tone(260 + k * 700, .06, 'triangle', .06),
  pop:     () => tone(500, .09, 'sine', .18, 0, 1500),
  thump:   () => { tone(95, .14, 'sine', .38, 0, 55); tone(85, .12, 'sine', .3, .16, 50); },
  beep:    () => { tone(1500, .08, 'square', .07); tone(1500, .08, 'square', .07, .15); },
  gulp:    () => { tone(420, .1, 'sine', .2, 0, 180); tone(360, .12, 'sine', .18, .16, 150); },
  achoo:   () => { const v = voice(); tone(v, .28, 'triangle', .12, 0, v * 1.6); noise(.35, .28, 2600, .8, .3, 500); },
  happy:   () => { const v = voice(); tone(v, .12, 'triangle', .14, 0, v * 1.3); tone(v * 1.25, .2, 'triangle', .14, .13, v * 1.7); },
  sad:     () => { const v = voice(); tone(v * 1.2, .45, 'triangle', .11, 0, v * .75); },
  fanfare: () => { [523, 659, 784, 1046].forEach((f, i) => tone(f, .22, 'triangle', .15, i * .11)); tone(1318, .6, 'triangle', .15, .44); },
  sparkle: () => [1568, 2093, 2637].forEach((f, i) => tone(f, .18, 'sine', .08, i * .05)),
};
const rubT = {};
function rub(kind, gapMs, arg) {
  const now = performance.now();
  if (now - (rubT[kind] || 0) < gapMs) return;
  rubT[kind] = now; SFX[kind](arg);
}

// ---------- canvas + layout ----------
const cv = $('#stage'), ctx = cv.getContext('2d');
let W = 300, H = 400, DPR = 1;
const L = { cx: 150, cy: 200, R: 60 };
function resize() {
  const r = cv.parentElement.getBoundingClientRect();
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = Math.max(1, r.width); H = Math.max(1, r.height);
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const top = 62, avail = H - top - 12;
  L.R = Math.max(26, Math.min(W * 0.2, avail / 4.75));
  L.cx = W / 2;
  L.cy = top + 2.05 * L.R + Math.max(0, (avail - 4.6 * L.R) / 2);
}

// zones in stage coords (min 46px radius so small fingers always land)
function Z() {
  const R = L.R, x = L.cx + (pat ? pat.ox : 0), y = L.cy;
  const P = (dx, dy, r) => ({ x: x + dx * R, y: y + dy * R, r: Math.max(46, r * R) });
  return {
    mouth: P(0, .5, .5), nose: P(0, .18, .4), chest: P(0, 1.35, .6),
    scrape: P(-.95, 1.35, .55), thorn: P(.5, 2.2, .5), body: P(0, .9, 1.9),
    mud: [P(.45, -.5, .45), P(-.35, 1.55, .45), P(.8, 1.05, .45)],
  };
}
const inZ = (p, z) => Math.hypot(p.x - z.x, p.y - z.y) < z.r;
const onStage = p => p.x >= 0 && p.y >= 0 && p.x <= W && p.y <= H;

// ---------- patient state ----------
let pat = null;
const stepTool = a => { const s = pat.ail[a]; return s.step < AIL[a].steps.length ? AIL[a].steps[s.step] : null; };
function zoneFor(a) {
  const z = Z(), s = pat.ail[a];
  switch (a) {
    case 'mud': if (s.step === 0) { const i = s.patch.findIndex(v => v < 1); return z.mud[Math.max(0, i)]; } return z.body;
    case 'scrape': return z.scrape;
    case 'fever': case 'teeth': return z.mouth;
    case 'thorn': return z.thorn;
    case 'heart': return z.chest;
    case 'sniffle': return z.nose;
  }
  return z.body;
}
function newPatient() {
  let pool = SPECIES.filter(s => !cured.includes(s.id));
  if (!pool.length) pool = SPECIES.slice();
  if (pat && pool.length > 1) pool = pool.filter(s => s.id !== pat.sp.id);
  const sp = pick(pool);
  let order;
  if (seen === 0) order = ['scrape'];
  else {
    const n = seen < 4 ? 2 : (Math.random() < .7 ? 3 : 2);
    order = Object.keys(AIL).sort(() => Math.random() - .5).slice(0, n);
  }
  const ail = {};
  order.forEach(a => ail[a] = { step: 0, prog: 0, patch: [0, 0, 0], grab: false, pull: null, beat: 0, cool: 0 });
  pat = { sp, order, ail, phase: 'arrive', t: 0, ox: W * 1.1, hopY: 0, hop: 0, shake: 0, joy: 0,
          bubble: '', bubbleT: 0, wrong: 0, hintZone: null, hintT: 0, lastProg: performance.now(),
          blink: 2, lolly: false };
  setHeld(null);
  renderChips();
}

// ---------- particles ----------
const parts = [];
function spawn(type, x, y, o = {}) {
  const p = { type, x, y, vx: rnd(-40, 40), vy: rnd(-80, -20), g: 0, life: 0, max: 1, size: rnd(6, 13), rot: rnd(0, TAU), vr: rnd(-5, 5), color: pick(CONF) };

  ctx.font = `${size}px ${EMOJI_FONT}`;
  const tw = ctx.measureText(txt).width, w = tw + 26, h = size + 20;
  const hx = L.cx + pat.ox, hy = L.cy + pat.hopY;
  let bx = hx + .95 * R, by = hy - 1.55 * R - h, tailX = bx + 16, left = false;
  if (bx + w > W - 6) { bx = hx - .95 * R - w; tailX = bx + w - 16; left = true; }
  if (bx < 6) { bx = 6; }
  by = Math.max(60, by);
  ctx.fillStyle = '#fff'; ctx.strokeStyle = '#35305a33'; ctx.lineWidth = 2;
  rrect(bx, by, w, h, h / 2); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(tailX - 8, by + h - 1); ctx.lineTo(tailX + 8, by + h - 1);
  ctx.lineTo(left ? tailX + 16 : tailX - 14, by + h + 14); ctx.closePath(); ctx.fillStyle = '#fff'; ctx.fill();
  emoji(txt, bx + w / 2, by + h / 2 + 2, size);
}

function draw(ts) {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  drawRoom(ts);
  if (pat) {
    drawAnimal(ts);
    // progress rings for press-and-hold / rubbing jobs
    if (pat.phase === 'treat') for (const a of pat.order) {
      const s = pat.ail[a], t = stepTool(a);
      if (s.prog > 0 && s.prog < 1 && t !== 'tweezers' && t !== 'shower') drawRing(zoneFor(a), s.prog, '#35d67a');
    }
    if (pat.hintT > 0 && pat.hintZone) {
      const z = pat.hintZone, T = ts / 1000;
      ctx.save(); ctx.globalAlpha = Math.min(1, pat.hintT * 2);
      ctx.setLineDash([10, 8]); ctx.lineDashOffset = -T * 40; ctx.lineWidth = 5; ctx.strokeStyle = '#ff9a3c';
      ctx.beginPath(); ctx.arc(z.x, z.y, z.r * (1 + Math.sin(T * 8) * .08), 0, TAU); ctx.stroke();
      ctx.restore();
      emoji('👇', z.x, z.y - z.r - 18 - Math.abs(Math.sin(T * 6)) * 8, 34);
    }
    drawBubble();
  }
  drawParts();
}

// ---------- treatment logic ----------
function say(txt, secs) { pat.bubble = txt; pat.bubbleT = secs; }
function clearHints() { document.querySelectorAll('.tool.hint').forEach(b => b.classList.remove('hint')); pat && (pat.hintT = 0); }
function hintDelay() { return seen === 0 ? 3000 : 8000; }
function showHint() {
  if (!pat) return;
  let tool, zone;
  if (pat.phase === 'reward') { tool = 'lolly'; zone = Z().mouth; }
  else if (pat.phase === 'treat') {
    const a = pat.order.find(a => stepTool(a)); if (!a) return;
    tool = stepTool(a); zone = zoneFor(a);
  } else return;
  clearHints();
  if (held !== tool) toolBtn(tool).classList.add('hint');
  pat.hintZone = zone; pat.hintT = 3.5;
}

function applyTool(tool, p, dt, mv, ev) {
  if (!pat) return false;
  // the body zone reaches past the canvas edge; never let toolbar taps count
  if (!onStage(p) && !(tool === 'tweezers' && pat.ail.thorn && pat.ail.thorn.grab)) return false;
  const z = Z(), R = L.R;
  if (pat.phase === 'reward') {
    if (tool === 'lolly' && ev === 'up' && inZ(p, z.body)) { giveLolly(); return true; }
    return false;
  }
  if (pat.phase !== 'treat') return false;
  let did = false;
  for (const a of pat.order) {
    const s = pat.ail[a];
    if (stepTool(a) !== tool) continue;
    if (tool === 'sponge' && ev === 'move') {
      z.mud.forEach((m, i) => {
        if (s.patch[i] < 1 && inZ(p, m)) {
          s.patch[i] = Math.min(1, s.patch[i] + mv * .011 + dt * .5); did = true;
          if (Math.random() < .35) spawn('bubble', m.x + rnd(-.3, .3) * R, m.y + rnd(-.3, .3) * R);
          rub('squish', 170);
        }
      });
      if (s.patch.every(v => v >= 1)) advance(a);
    } else if (tool === 'shower' && ev === 'move' && inZ(p, z.body)) {
      s.prog = Math.min(1, s.prog + mv * .004 + dt * .55); did = true;
      for (let k = 0; k < 2; k++) spawn('drop', p.x + rnd(-22, 22), p.y + 8);
      rub('water', 160);
      if (s.prog >= 1) advance(a);
    } else if ((tool === 'bandage' || tool === 'medicine') && ev === 'up') {
      if (inZ(p, tool === 'bandage' ? z.scrape : z.mouth)) { advance(a); did = true; }
    } else if (tool === 'thermo' && ev === 'move' && inZ(p, z.mouth)) {
      s.prog = Math.min(1, s.prog + dt / 1.3); did = true; rub('tick', 140);
      if (s.prog >= 1) advance(a);
    } else if (tool === 'tweezers') {
      if (ev === 'move') {
        if (!s.grab && inZ(p, z.thorn)) { s.grab = true; SFX.pop(); }
        if (s.grab) {
          const dx = p.x - z.thorn.x, dy = p.y - z.thorn.y, d = Math.hypot(dx, dy);
          s.pull = { dx, dy }; did = true;
          rub('stretch', 90, Math.min(1, d / R));
          if (d > .95 * R) {
            spawn('thorn', z.thorn.x + dx, z.thorn.y + dy);
            SFX.pop(); advance(a);
          }
        }
      } else if (ev === 'up' && s.grab) { s.grab = false; s.pull = null; did = true; SFX.boop(); }
    } else if (tool === 'brush' && ev === 'move' && inZ(p, z.mouth)) {
      const before = Math.ceil(4 * (1 - s.prog));
      s.prog = Math.min(1, s.prog + mv * .004 + dt * .35); did = true;
      rub('scrub', 110);
      if (Math.random() < .25) spawn('bubble', z.mouth.x + rnd(-20, 20), z.mouth.y + rnd(-10, 10), { size: rnd(3, 7) });
      if (Math.ceil(4 * (1 - s.prog)) < before) { SFX.pop(); burst('spark', z.mouth.x, z.mouth.y, 5); }
      if (s.prog >= 1) advance(a);
    } else if (tool === 'stetho' && ev === 'move' && inZ(p, z.chest)) {
      s.prog = Math.min(1, s.prog + dt / 2.2); did = true;
      s.beat -= dt;
      if (s.beat <= 0) { s.beat = .55; SFX.thump(); spawn('heart', z.chest.x + rnd(-20, 20), z.chest.y - 16); }
      if (s.prog >= 1) advance(a);
    } else if (tool === 'tissue' && ev === 'move' && inZ(p, z.nose)) {
      s.prog = Math.min(1, s.prog + dt / .9); did = true;
      if (s.prog >= 1) { SFX.achoo(); pat.shake = .7; burst('puff', z.nose.x, z.nose.y, 8); advance(a); say('💨', 1.2); }
    }
  }
  return did;
}

function advance(a) {
  const s = pat.ail[a], z = zoneFor(a);
  s.step++; s.prog = 0; s.grab = false; s.pull = null;
  pat.lastProg = performance.now(); pat.wrong = 0; clearHints();
  burst('spark', z.x, z.y, 12);
  if (a === 'fever' && s.step === 1) { SFX.beep(); say('🔥', 1.6); }
  else if (a === 'fever' && s.step === 2) { SFX.gulp(); s.cool = 1; say('😋', 1.2); }
  else if (a === 'mud' && s.step === 1) SFX.ding();
  else SFX.chime();
  if (s.step >= AIL[a].steps.length) {
    setTimeout(() => SFX.happy(), 260);
    burst('heart', z.x, z.y, 3); pat.hop = .5;
  }
  renderChips();
  if (pat.order.every(x => !stepTool(x))) {
    const me = pat;
    setTimeout(() => {
      if (pat !== me || pat.phase !== 'treat') return;
      pat.phase = 'reward'; pat.hop = .6; pat.lastProg = performance.now();
      SFX.sparkle(); renderChips();
    }, 750);
  }
}

function wrongTool(tool) {
  const target = pat.phase === 'treat' ? pat.order.find(a => stepTool(a) === tool) : null;
  if (target) {             // right tool, wrong spot: glow where it goes
    pat.hintZone = zoneFor(target); pat.hintT = 2.2; SFX.boop();
    return;
  }
  pat.shake = .45; say(pick(['🤭', '😆', '🙃']), 1.1); SFX.giggle();
  if (++pat.wrong >= 2) { pat.wrong = 0; showHint(); }
}

function giveLolly() {
  const me = pat;
  pat.phase = 'bye'; pat.lolly = true; pat.joy = 3; pat.hop = 1.2; pat.t = 0;
  SFX.fanfare(); setTimeout(() => SFX.happy(), 500);
  const z = Z();
  burst('heart', z.mouth.x, z.mouth.y, 6); confetti(70);
  if (!cured.includes(pat.sp.id)) cured.push(pat.sp.id);
  seen++; save('cured', cured); save('seen', seen);
  setHeld(null); clearHints(); renderChips();
  flySticker(pat.sp);
  setTimeout(() => { if (pat === me) { pat.phase = 'leave'; pat.t = 0; } }, 2000);
}

function afterLeave() {
  if (cured.length >= SPECIES.length) { pat = null; renderChips(); showParade(); }
  else newPatient();
}

// ---------- UI ----------
const toolsEl = $('#tools'), chipsEl = $('#chips'), wallEl = $('#wall'), ghost = $('#ghost');
toolsEl.innerHTML = TOOLS.map(t => `<button class="tool" data-id="${t.id}" style="background:${t.bg}" aria-label="${t.id}"><span class="ico">${icon(t.id)}</span></button>`).join('');
const toolBtn = id => toolsEl.querySelector(`[data-id="${id}"]`);
let held = null;
function setHeld(id) {
  held = id;
  toolsEl.querySelectorAll('.tool').forEach(b => b.classList.toggle('held', b.dataset.id === id));
  if (id) { toolBtn(id).classList.remove('hint'); ghost.innerHTML = icon(id); SFX.pick(); }
}
function renderChips() {
  if (!pat) { chipsEl.innerHTML = ''; return; }
  let h = '';
  pat.order.forEach((a, ai) => {
    const s = pat.ail[a];
    AIL[a].steps.forEach((t, i) => {
      const cls = i < s.step ? 'done' : i === s.step ? 'now' : 'later';
      h += `<div class="chip ${cls}${i === 0 && ai > 0 ? ' gap' : ''}">${icon(t)}</div>`;
    });
  });
  const lc = (pat.phase === 'bye' || pat.phase === 'leave') ? 'done' : pat.phase === 'reward' ? 'now' : 'later';
  h += `<div class="chip gap ${lc}">${icon('lolly')}</div>`;
  chipsEl.innerHTML = h;
}
function renderWall(popId) {
  wallEl.innerHTML = SPECIES.map(s => `<div class="slot${cured.includes(s.id) ? ' on' : ''}${popId === s.id ? ' pop' : ''}" data-id="${s.id}"><span>${s.e}</span></div>`).join('');
  const tr = $('#trophy'); tr.textContent = '🏆 ' + rounds; tr.classList.toggle('show', rounds > 0);
}
function flySticker(sp) {
  const cr = cv.getBoundingClientRect(), slot = wallEl.querySelector(`[data-id="${sp.id}"]`);
  if (!slot) { renderWall(sp.id); return; }
  const sr = slot.getBoundingClientRect();
  const el = document.createElement('div'); el.id = 'flyer'; el.textContent = sp.e;
  const sx = cr.left + L.cx - 30, sy = cr.top + L.cy - 30;
  el.style.left = sx + 'px'; el.style.top = sy + 'px';
  document.body.appendChild(el);
  requestAnimationFrame(() => requestAnimationFrame(() => {
    el.style.transform = `translate(${sr.left + sr.width / 2 - 30 - sx}px, ${sr.top + sr.height / 2 - 30 - sy}px) scale(.5)`;
  }));
  setTimeout(() => { el.remove(); renderWall(sp.id); SFX.ding(); }, 950);
}
function showParade() {
  $('#paradeRow').innerHTML = SPECIES.map((s, i) => `<span style="animation-delay:${i * .08}s">${s.e}</span>`).join('');
  $('#paradeOv').classList.add('show');
  SFX.fanfare(); setTimeout(() => SFX.fanfare(), 900);
  confetti(160);
}
$('#againBtn').addEventListener('click', () => {
  audio(); cured = []; rounds++; save('cured', cured); save('rounds', rounds);
  renderWall(); $('#paradeOv').classList.remove('show'); newPatient();
});
$('#startBtn').addEventListener('click', () => {
  audio(); $('#startOv').classList.remove('show'); SFX.chime();
  if (!pat) newPatient();
});
$('#resetBtn').addEventListener('click', () => { audio(); $('#confirmOv').classList.add('show'); });
$('#noBtn').addEventListener('click', () => $('#confirmOv').classList.remove('show'));
$('#yesBtn').addEventListener('click', () => {
  cured = []; rounds = 0; seen = 0; save('cured', cured); save('rounds', 0); save('seen', 0);
  parts.length = 0; pat = null; renderWall();
  $('#confirmOv').classList.remove('show'); $('#paradeOv').classList.remove('show');
  newPatient();
});
const muteBtn = $('#muteBtn');
const syncMute = () => { muteBtn.textContent = muted ? '🔇' : '🔊'; };
muteBtn.addEventListener('click', () => { muted = !muted; save('muted', muted); syncMute(); audio(); SFX.pick(); });

// ---------- input ----------
const pointer = { down: false, id: null, x: 0, y: 0, px: 0, py: 0, moved: 0, pressProgress: false, tapBack: false };
const toStage = (cx, cy) => { const r = cv.getBoundingClientRect(); return { x: cx - r.left, y: cy - r.top }; };
function moveGhost() { ghost.style.transform = `translate(${pointer.x}px, ${pointer.y}px)`; }
function startPress(e) {
  Object.assign(pointer, { down: true, id: e.pointerId, x: e.clientX, y: e.clientY, px: e.clientX, py: e.clientY, moved: 0, pressProgress: false });
  moveGhost(); ghost.style.display = 'block';
}
toolsEl.addEventListener('pointerdown', e => {
  const b = e.target.closest('.tool'); if (!b) return;
  e.preventDefault(); audio();
  const id = b.dataset.id;
  pointer.tapBack = held === id;
  if (held !== id) setHeld(id);
  startPress(e);
});
cv.addEventListener('pointerdown', e => {
  e.preventDefault(); audio();
  if (!pat) return;
  if (!held) {
    const p = toStage(e.clientX, e.clientY);
    if (inZ(p, Z().body) && (pat.phase === 'treat' || pat.phase === 'reward')) { pat.shake = .35; SFX.giggle(); showHint(); }
    return;
  }
  pointer.tapBack = false;
  startPress(e);
});
window.addEventListener('pointermove', e => {
  if (!pointer.down || e.pointerId !== pointer.id) return;
  pointer.moved += Math.hypot(e.clientX - pointer.x, e.clientY - pointer.y);
  pointer.x = e.clientX; pointer.y = e.clientY; moveGhost();
}, { passive: true });
function endPress(e) {
  if (!pointer.down || e.pointerId !== pointer.id) return;
  pointer.down = false; ghost.style.display = 'none';
  if (!held || !pat) return;
  const p = toStage(pointer.x, pointer.y);
  if (e.type !== 'pointercancel') {
    const did = applyTool(held, p, 0, 0, 'up');
    if (did) pat.lastProg = performance.now();
    else if (!pointer.pressProgress && onStage(p) && (pat.phase === 'treat' || pat.phase === 'reward') && inZ(p, Z().body)) wrongTool(held);
  } else applyTool(held, p, 0, 0, 'cancel');
  for (const a of pat.order) { const s = pat.ail[a]; if (s.grab) { s.grab = false; s.pull = null; } }
  if (pointer.tapBack && pointer.moved < 12 && held) { setHeld(null); SFX.drop(); }
}
window.addEventListener('pointerup', endPress);
window.addEventListener('pointercancel', endPress);
document.addEventListener('contextmenu', e => e.preventDefault());

// ---------- loop ----------
const easeOut = k => 1 - Math.pow(1 - k, 3), easeIn = k => k * k;
function update(dt, ts) {
  updateParts(dt);
  if (!pat) return;
  pat.t += dt;
  if (pat.phase === 'arrive') {
    const k = Math.min(1, pat.t / .9);
    pat.ox = W * 1.1 * (1 - easeOut(k));
    pat.hopY = -Math.abs(Math.sin(k * Math.PI * 3)) * L.R * .25 * (1 - k);
    if (k >= 1) { pat.phase = 'treat'; pat.t = 0; pat.ox = 0; pat.hopY = 0; pat.lastProg = ts; SFX.sad(); }
  } else if (pat.phase === 'leave') {
    const k = Math.min(1, pat.t / 1.1);
    pat.ox = -W * 1.1 * easeIn(k);
    pat.hopY = -Math.abs(Math.sin(k * Math.PI * 4)) * L.R * .3;
    if (k >= 1) { afterLeave(); return; }
  } else {
    pat.hopY = pat.hop > 0 ? -Math.abs(Math.sin(pat.hop * 12)) * L.R * .18 : 0;
  }
  pat.hop = Math.max(0, pat.hop - dt); pat.shake = Math.max(0, pat.shake - dt);
  pat.joy = Math.max(0, pat.joy - dt); pat.bubbleT = Math.max(0, pat.bubbleT - dt);
  if (pat.hintT > 0) { pat.hintT = Math.max(0, pat.hintT - dt); }
  pat.blink -= dt; if (pat.blink < -.13) pat.blink = rnd(2, 5);
  for (const a of pat.order) { const s = pat.ail[a]; s.cool = Math.max(0, s.cool - dt * .7); }
  if (pointer.down && held) {
    const mv = Math.hypot(pointer.x - pointer.px, pointer.y - pointer.py);
    pointer.px = pointer.x; pointer.py = pointer.y;
    if (applyTool(held, toStage(pointer.x, pointer.y), dt, mv, 'move')) { pointer.pressProgress = true; pat.lastProg = ts; }
  }
  if ((pat.phase === 'treat' || pat.phase === 'reward') && !pointer.down && ts - pat.lastProg > hintDelay()) {
    showHint(); pat.lastProg = ts;
  }
}
let lastTs = performance.now();
function frame(ts) {
  const dt = Math.min(.05, Math.max(0, (ts - lastTs) / 1000)); lastTs = ts;
  update(dt, ts); draw(ts);
  requestAnimationFrame(frame);
}
new ResizeObserver(resize).observe($('#stageWrap'));
window.addEventListener('resize', resize);
resize(); renderWall(); syncMute();
requestAnimationFrame(frame);

// test hook for the headless driver
window.__dbg = () => ({ phase: pat && pat.phase, sp: pat && pat.sp.id, order: pat && pat.order, held, cured: cured.slice(), seen, rounds, L: { ...L }, W, H,
  zones: pat ? Z() : null, steps: pat ? Object.fromEntries(pat.order.map(a => [a, { step: pat.ail[a].step, prog: pat.ail[a].prog, patch: pat.ail[a].patch }])) : null,
  rect: cv.getBoundingClientRect().toJSON() });
</script>
</body>
</html>
