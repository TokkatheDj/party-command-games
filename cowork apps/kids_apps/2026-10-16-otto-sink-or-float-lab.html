<!-- CONCEPT: NATURE & SCIENCE / CAUSE & EFFECT - Otto's Sink or Float Lab: Otto the otter dangles everyday things (rubber duck, rock, apple, metal spoon, pumpkin, ring, ice cube...) over a glass water tank and kids tap SINK or FLOAT to predict, then watch it splash in and really bob on the surface or glug down to the sand, with a one-line "why" for every result; four tubs (Bath Time, Kitchen, Garden & Toolbox, Big Surprises) end with all six things side by side - floaters on top, sinkers on the bottom - and the Big Surprises tub has two change-it experiments (peel the floating orange and it sinks, squish the sinking clay ball into a boat and it floats); plus Boat Load, where kids guess and then add coins one by one to a foil boat that rides lower and lower until it gently sinks, and a saved Science Notebook of every floater and sinker found. No timer, no losing - a wrong guess is just "Ooh, a surprise!". Ages 4-11. -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Otto's Sink or Float Lab</title>
<style>
:root{
  --bg1:#7fd4ff; --bg2:#c9f0ff;
  --ink:#1d3557; --ink2:#3b5b80;
  --panel:#ffffff; --panel2:#f1faff;
  --float:#ffcf33; --float-d:#e0a800;
  --sink:#2f7bff; --sink-d:#1d56c4;
  --go:#3ccf6e; --go-d:#25a052;
  --pink:#ff6fae; --orange:#ff9a3c; --purple:#9b6bff;
  /* buttons with white text: the same green and pink, deep enough for 4.5:1 (26 Oct 2026) */
  --go-btn:#218644; --go-btn-d:#145529; --pink-btn:#e40064; --pink-btn-d:#a3004a;
  --water1:#3fb6ff; --water2:#0b5fb8;
  --sand1:#f6dc9c; --sand2:#e2b965;
  --radius:22px; --gap:10px;
  --font:"Comic Sans MS","Trebuchet MS",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;padding:0;height:100%;overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none}
body{font-family:var(--font);color:var(--ink);background:linear-gradient(180deg,var(--bg1),var(--bg2));}
button{font-family:inherit;cursor:pointer;border:none;color:inherit}
#app{max-width:560px;margin:0 auto;height:100vh;height:100dvh;display:flex;flex-direction:column;padding:8px 10px 10px;gap:8px}
header{display:flex;align-items:center;gap:8px;flex:0 0 auto}
header h1{flex:1;margin:0;text-align:center;font-size:clamp(20px,5.6vw,30px);line-height:1.1;
  background:linear-gradient(90deg,#0b5fb8,#9b3dff,#ff4f9a);-webkit-background-clip:text;background-clip:text;color:transparent}
.icon-btn{width:48px;height:48px;border-radius:16px;background:var(--panel);font-size:24px;box-shadow:0 4px 0 #9cc7e6;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.icon-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #9cc7e6}
.icon-btn.ghost{visibility:hidden}
.screen{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px}

/* ---------- home ---------- */
.home-hero{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center}
.home-otter{font-size:clamp(70px,24vw,120px);line-height:1;animation:bob 2.4s ease-in-out infinite}
.home-tag{font-size:clamp(16px,4.4vw,22px);color:var(--ink2);max-width:22em}
.home-btns{display:flex;flex-direction:column;gap:12px;flex:0 0 auto}
.big-btn{min-height:68px;border-radius:var(--radius);font-size:clamp(20px,5.4vw,26px);font-weight:bold;display:flex;align-items:center;justify-content:center;gap:10px;padding:8px 14px;background:var(--panel);box-shadow:0 6px 0 #9cc7e6}
.big-btn:active{transform:translateY(4px);box-shadow:0 2px 0 #9cc7e6}
.big-btn .em{font-size:1.3em}
.big-btn.go{background:var(--go-btn);color:#fff;box-shadow:0 6px 0 var(--go-btn-d)}
.big-btn.pink{background:var(--pink-btn);color:#fff;box-shadow:0 6px 0 var(--pink-btn-d)}
.big-btn.purple{background:var(--purple);color:#fff;box-shadow:0 6px 0 #6c43c9}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-10px) rotate(3deg)}}

/* ---------- tub picker ---------- */
.tub-grid{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:12px;align-content:center}
.tub-card{border-radius:var(--radius);background:var(--panel);box-shadow:0 6px 0 #9cc7e6;padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:130px;justify-content:center}
.tub-card:active{transform:translateY(4px);box-shadow:0 2px 0 #9cc7e6}
.tub-card .em{font-size:clamp(40px,12vw,58px);line-height:1}
.tub-card .nm{font-size:clamp(16px,4.4vw,21px);font-weight:bold}
.tub-card .st{font-size:15px;color:var(--ink2);min-height:1.2em}
.tub-card .peek{font-size:20px;letter-spacing:2px}

/* ---------- otto bubble ---------- */
.otto-row{display:flex;align-items:flex-end;gap:6px;flex:0 0 auto}
.otto-row .otter{font-size:44px;line-height:1;flex:0 0 auto;transition:transform .2s}
.otto-row .otter.happy{animation:hop .5s ease 2}
@keyframes hop{50%{transform:translateY(-12px) rotate(-8deg)}}
.bubble{flex:1;background:var(--panel);border-radius:18px 18px 18px 4px;padding:8px 12px;font-size:clamp(15px,4.2vw,20px);line-height:1.25;min-height:58px;display:flex;align-items:center;box-shadow:0 3px 0 #9cc7e6}
.bubble > span{display:block}
.bubble b{color:#9b3dff}
.bubble .fact{display:block;font-size:.86em;color:var(--ink2);margin-top:3px}

/* ---------- lab top bar ---------- */
.labbar{display:flex;align-items:center;gap:8px;flex:0 0 auto;background:rgba(255,255,255,.6);border-radius:16px;padding:4px 6px 4px 12px}
.labbar .tubname{font-weight:bold;font-size:clamp(15px,4vw,19px);white-space:nowrap}
.dots{flex:1;display:flex;gap:5px;justify-content:center}
.dot{width:14px;height:14px;border-radius:50%;background:#cfe6f6;border:2px solid #fff}
.dot.now{background:var(--pink);transform:scale(1.25)}
.dot.F{background:var(--float)} .dot.S{background:var(--sink)}
.starcount{font-weight:bold;font-size:18px;white-space:nowrap}
.labbar .icon-btn{width:44px;height:44px;font-size:20px;box-shadow:0 3px 0 #9cc7e6}

/* ---------- tank ---------- */
.tank{position:relative;flex:1;min-height:220px;border-radius:26px;overflow:hidden;border:6px solid rgba(255,255,255,.95);box-shadow:0 6px 0 #8bbbe0, inset 0 0 0 2px rgba(0,60,120,.15);background:linear-gradient(180deg,#e9f8ff,#cdeeff)}
.tank .water-back{position:absolute;left:0;right:0;top:36%;bottom:0;background:linear-gradient(180deg,var(--water1),var(--water2))}
.tank .weed{position:absolute;bottom:4%;font-size:34px;opacity:.85}
.tank .sand{position:absolute;left:0;right:0;bottom:0;height:7%;background:linear-gradient(180deg,var(--sand1),var(--sand2));border-radius:40% 40% 0 0/14px 14px 0 0}
.tank .objs{position:absolute;inset:0}
.tank .water-front{position:absolute;left:0;right:0;top:36%;bottom:0;background:linear-gradient(180deg,rgba(150,220,255,.42),rgba(40,130,230,.30));pointer-events:none}
.tank .surface{position:absolute;left:-10%;right:-10%;top:-5px;height:10px;border-radius:50%;background:rgba(255,255,255,.75);animation:wave 2.6s ease-in-out infinite}
@keyframes wave{50%{transform:translateX(4%) scaleY(.6)}}
.tank canvas.fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.tank .shine{position:absolute;left:5%;top:6%;width:10px;height:42%;border-radius:8px;background:rgba(255,255,255,.55);pointer-events:none}
.tank .label{position:absolute;right:10px;font-size:13px;font-weight:bold;padding:2px 8px;border-radius:10px;pointer-events:none;opacity:0;transition:opacity .4s}
.tank .label.on{opacity:1}
.tank .label.lf{top:calc(36% - 26px);background:var(--float);color:#5a4300}
.tank .label.ls{bottom:34%;background:var(--sink);color:#fff}

.obj{position:absolute;left:0;top:0;display:flex;align-items:center;justify-content:center;line-height:1;will-change:transform;text-align:center}
.rope{position:absolute;top:0;width:4px;margin-left:-2px;background:repeating-linear-gradient(180deg,#b07a3c 0 6px,#8a5a26 6px 10px);border-radius:2px}
.hook{position:absolute;width:18px;height:12px;margin-left:-9px;border:4px solid #777;border-top:none;border-radius:0 0 12px 12px}

/* CSS-drawn objects (sized in em, so they scale with the object) */
.art{display:block;font-style:normal}
.art.rock{width:.92em;height:.7em;background:radial-gradient(circle at 35% 30%,#c9c9c9,#8b8b8b 55%,#5d5d5d);border-radius:48% 52% 44% 56%/58% 50% 50% 42%;box-shadow:inset -.06em -.06em 0 rgba(0,0,0,.2)}
.art.coin{width:.72em;height:.72em;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3a8,#f5c518 50%,#c79100);box-shadow:inset 0 0 0 .06em #b07f00;position:relative}
.art.coin::after{content:"1";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:.42em;font-weight:bold;color:#8a6200}
.art.peeled{width:.82em;height:.82em;border-radius:50%;background:repeating-conic-gradient(from 10deg,#ffb347 0 30deg,#ff9418 30deg 36deg);box-shadow:inset 0 0 0 .05em #f7e2b5}
.art.clay{width:.74em;height:.74em;border-radius:50%;background:radial-gradient(circle at 35% 30%,#d8956a,#a85d32 60%,#7d4020)}
.art.claybt{width:1em;height:.42em;border-radius:.06em .06em 50% 50%/.06em .06em 100% 100%;background:linear-gradient(180deg,#d8956a,#a85d32 60%,#7d4020);box-shadow:inset 0 .07em 0 #7d4020}

/* boat */
.boat{position:absolute;left:0;top:0;will-change:transform}
.hull{position:absolute;left:0;bottom:0;width:100%;height:100%;clip-path:polygon(0 0,100% 0,86% 100%,14% 100%);
  background:repeating-linear-gradient(115deg,rgba(255,255,255,.35) 0 7px,rgba(0,0,0,.05) 7px 13px),linear-gradient(180deg,#f7f9fc,#aab6c6)}
.rim{position:absolute;left:-3px;right:-3px;top:-3px;height:6px;border-radius:4px;background:#e8edf3;box-shadow:0 1px 0 #8d99a8}
.coin-on{position:absolute;transition:top .28s cubic-bezier(.4,1.6,.6,1)}

/* ---------- controls ---------- */
.controls{display:flex;gap:10px;flex:0 0 auto}
.controls > button{flex:1}
.pbtn{min-height:84px;border-radius:var(--radius);font-size:clamp(22px,6.4vw,30px);font-weight:bold;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05;padding:6px}
.pbtn .em{font-size:1.25em}
.pbtn.sink{background:var(--sink);color:#fff;box-shadow:0 7px 0 var(--sink-d)}
.pbtn.float{background:var(--float);color:#5a4300;box-shadow:0 7px 0 var(--float-d)}
.pbtn:active{transform:translateY(5px);box-shadow:0 2px 0 rgba(0,0,0,.25)}
.pbtn.picked{outline:5px solid #fff;outline-offset:-5px}
.pbtn:disabled{opacity:.45}
.pbtn.next{background:var(--go-btn);color:#fff;box-shadow:0 7px 0 var(--go-btn-d);flex-direction:row;gap:10px}
.pbtn.special{background:var(--orange);color:#fff;box-shadow:0 7px 0 #d0701c;flex-direction:row;gap:8px;font-size:clamp(19px,5.4vw,26px)}
.pulse{animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.04)}}

/* ---------- boat screen ---------- */
.boatbar{display:flex;gap:8px;flex:0 0 auto}
.szbtn{flex:1;min-height:56px;border-radius:16px;background:var(--panel);box-shadow:0 4px 0 #9cc7e6;font-size:16px;font-weight:bold;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;padding:4px}
.szbtn small{font-size:12px;color:var(--ink2);font-weight:normal}
.szbtn.on{background:#fff3a8;box-shadow:0 4px 0 var(--float-d)}
.guessrow{display:flex;align-items:center;gap:8px;flex:0 0 auto;justify-content:center;font-weight:bold;font-size:clamp(15px,4.2vw,19px)}
.chip{min-width:56px;min-height:48px;border-radius:24px;background:var(--panel);box-shadow:0 4px 0 #9cc7e6;font-size:22px;font-weight:bold;padding:0 12px}
.chip.on{background:var(--pink-btn);color:#fff;box-shadow:0 4px 0 var(--pink-btn-d)}
.chip:disabled{opacity:.6}
.coincount{position:absolute;left:10px;top:8px;background:rgba(255,255,255,.9);border-radius:14px;padding:2px 12px;font-size:26px;font-weight:bold;pointer-events:none}

/* ---------- notebook ---------- */
.book{flex:1;min-height:0;overflow-y:auto;background:var(--panel);border-radius:var(--radius);padding:10px;box-shadow:0 5px 0 #9cc7e6;
  background-image:repeating-linear-gradient(180deg,transparent 0 33px,#e3f1fb 33px 35px)}
.book h2{margin:4px 0 8px;font-size:clamp(18px,5vw,24px);text-align:center}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.col h3{margin:0 0 6px;text-align:center;border-radius:12px;padding:4px;font-size:18px}
.col.F h3{background:var(--float);color:#5a4300}
.col.S h3{background:var(--sink);color:#fff}
.found{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.cell{aspect-ratio:1;border-radius:14px;background:var(--panel2);display:flex;align-items:center;justify-content:center;font-size:30px;border:2px solid #d6ebf8}
.cell.unk{color:#9fbdd3;font-size:22px;font-weight:bold}
.medals{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:12px 0 4px}
.medal{font-size:30px;width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#eef6fb;filter:grayscale(1);opacity:.45}
.medal.got{filter:none;opacity:1;background:#fff3a8;box-shadow:0 0 0 3px var(--float)}
.recs{text-align:center;font-size:16px;color:var(--ink2);margin:6px 0}
.resetbtn{display:block;margin:12px auto 4px;min-height:44px;padding:0 16px;border-radius:14px;background:#ffe1e1;color:#a33;font-size:15px}

/* ---------- overlay + fx ---------- */
.overlay{position:fixed;inset:0;background:rgba(10,40,80,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.panel{background:var(--panel);border-radius:28px;padding:18px 16px;max-width:400px;width:100%;text-align:center;box-shadow:0 8px 0 #9cc7e6;animation:popin .4s cubic-bezier(.3,1.6,.5,1)}
@keyframes popin{from{transform:scale(.6);opacity:0}}
.panel .badge{font-size:64px;line-height:1}
.panel h2{margin:6px 0;font-size:clamp(22px,6vw,30px)}
.panel p{margin:6px 0 12px;font-size:clamp(16px,4.4vw,20px);color:var(--ink2)}
.panel .btns{display:flex;flex-direction:column;gap:10px}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:30}
.pop{position:absolute;font-size:34px;pointer-events:none;animation:popup 1s ease-out forwards;z-index:5}
@keyframes popup{to{transform:translateY(-60px) scale(1.4);opacity:0}}
</style>
</head>
<body>
<div id="app">
  <header>
    <button class="icon-btn ghost" id="homeBtn" aria-label="Home">🏠</button>
    <h1>Otto's Sink or Float Lab</h1>
    <button class="icon-btn" id="soundBtn" aria-label="Sound">🔊</button>
  </header>

  <!-- HOME -->
  <section class="screen" id="scr-home">
    <div class="home-hero">
      <div class="home-otter">🦦</div>
      <div class="home-tag">Hi, I'm Otto! Will it <b style="color:var(--float-d)">FLOAT</b> on top, or <b style="color:var(--sink)">SINK</b> to the bottom? Let's find out!</div>
    </div>
    <div class="home-btns">
      <button class="big-btn go" id="goLab"><span class="em">🧪</span> Guess Lab</button>
      <button class="big-btn pink" id="goBoat"><span class="em">⛵</span> Boat Load</button>
      <button class="big-btn purple" id="goBook"><span class="em">📒</span> My Notebook</button>
    </div>
  </section>

  <!-- TUB PICKER -->
  <section class="screen" id="scr-tubs" hidden>
    <div class="otto-row"><span class="otter">🦦</span><div class="bubble"><span>Pick a tub of things to test!</span></div></div>
    <div class="tub-grid" id="tubGrid"></div>
  </section>

  <!-- LAB -->
  <section class="screen" id="scr-lab" hidden>
    <div class="labbar">
      <span class="tubname" id="tubName">Bath Time</span>
      <div class="dots" id="dots"></div>
      <span class="starcount">⭐<span id="starN">0</span></span>
      <button class="icon-btn" id="restartTub" aria-label="Start this tub again">↺</button>
    </div>
    <div class="otto-row"><span class="otter" id="labOtter">🦦</span><div class="bubble" id="labBubble"><span>…</span></div></div>
    <div class="tank" id="labTank">
      <div class="water-back"></div>
      <span class="weed" style="left:4%">🌿</span><span class="weed" style="right:6%">🌱</span>
      <div class="sand"></div>
      <div class="objs"></div>
      <div class="water-front"><div class="surface"></div></div>
      <div class="shine"></div>
      <span class="label lf">FLOATERS</span><span class="label ls">SINKERS</span>
      <canvas class="fx"></canvas>
    </div>
    <div class="controls" id="predictRow">
      <button class="pbtn sink" id="btnSink"><span class="em">⬇️</span>SINK</button>
      <button class="pbtn float" id="btnFloat"><span class="em">⬆️</span>FLOAT</button>
    </div>
    <div class="controls" id="nextRow" hidden>
      <button class="pbtn special pulse" id="btnSpecial" hidden>✨</button>
      <button class="pbtn next" id="btnNext">Next <span class="em">▶</span></button>
    </div>
  </section>

  <!-- BOAT -->
  <section class="screen" id="scr-boat" hidden>
    <div class="otto-row"><span class="otter" id="boatOtter">🦦</span><div class="bubble" id="boatBubble"><span>…</span></div></div>
    <div class="boatbar" id="sizeRow"></div>
    <div class="tank" id="boatTank">
      <div class="water-back"></div>
      <span class="weed" style="left:5%">🌿</span><span class="weed" style="right:8%">🪸</span>
      <div class="sand"></div>
      <div class="objs"></div>
      <div class="water-front"><div class="surface"></div></div>
      <div class="shine"></div>
      <div class="coincount" id="coinCount">🪙 0</div>
      <canvas class="fx"></canvas>
    </div>
    <div class="guessrow" id="guessRow"><span>Guess:</span></div>
    <div class="controls">
      <button class="pbtn float" id="btnCoin"><span class="em">🪙</span>Add a coin</button>
      <button class="pbtn next" id="btnNewBoat" hidden>New boat <span class="em">⛵</span></button>
    </div>
  </section>

  <!-- NOTEBOOK -->
  <section class="screen" id="scr-book" hidden>
    <div class="book" id="book"></div>
  </section>
</div>

<div class="overlay" id="overlay" hidden><div class="panel" id="panel"></div></div>
<canvas id="confetti"></canvas>

<script>
/* ================= data ================= */
const OBJ = {
  duck:   {n:'rubber duck', a:'🦆', f:1, s:.3,  fact:'Rubber ducks are hollow and full of air, so they bob on top.'},
  rock:   {n:'rock', a:'css:rock', f:0, fact:'Rocks are heavy for their size, so down they go!'},
  sponge: {n:'sponge', a:'🧽', f:1, s:.45, fact:'A dry sponge is full of little air holes, so it floats.'},
  key:    {n:'key', a:'🔑', f:0, fact:'Keys are made of metal. Metal is heavy for its size, so it sinks.'},
  ball:   {n:'beach ball', a:'⚽', f:1, s:.3, fact:'The ball is full of air, and air is a super floater!'},
  coin:   {n:'coin', a:'css:coin', f:0, fact:'Little but heavy! Coins are metal, so they sink.'},
  apple:  {n:'apple', a:'🍎', f:1, s:.6, fact:'Apples have lots of air inside. That is why you can bob for apples!'},
  spoon:  {n:'metal spoon', a:'🥄', f:0, fact:'A metal spoon sinks straight to the bottom.'},
  lemon:  {n:'lemon', a:'🍋', f:1, s:.62, fact:'Lemons float. Their bumpy peel is full of tiny air pockets.'},
  pan:    {n:'frying pan', a:'🍳', f:0, fact:'A frying pan is solid metal. Splash, sink!'},
  bread:  {n:'bread', a:'🍞', f:1, s:.4, fact:'Bread is full of air bubbles, so it floats (and gets soggy!).'},
  fork:   {n:'fork and knife', a:'🍴', f:0, fact:'Forks and knives are metal, so they sink.'},
  leaf:   {n:'leaf', a:'🍃', f:1, s:.12, fact:'Leaves are light and flat, so they rest on top of the water.'},
  shell:  {n:'seashell', a:'🐚', f:0, fact:'Seashells are hard like stone, so they sink.'},
  pencil: {n:'pencil', a:'✏️', f:1, s:.5, fact:'Pencils are made of wood, and wood floats.'},
  bolt:   {n:'metal bolt', a:'🔩', f:0, fact:'A metal bolt sinks fast.'},
  tennis: {n:'tennis ball', a:'🎾', f:1, s:.35, fact:'A tennis ball is hollow inside, so it floats.'},
  hammer: {n:'hammer', a:'🔨', f:0, fact:'A hammer has a heavy metal head. Glug glug, it sinks!'},
  pumpkin:{n:'big pumpkin', a:'🎃', f:1, s:.6, fact:'A pumpkin is big and heavy, but hollow inside, so it floats! Big does not mean sink.'},
  ring:   {n:'tiny ring', a:'💍', f:0, fact:'This ring is tiny, but it is metal, so it sinks. Small does not mean float!'},
  ice:    {n:'ice cube', a:'🧊', f:1, s:.85, fact:'Ice is frozen water, and it is a tiny bit lighter than water, so it floats. See how most of it hides underwater?'},
  orange: {n:'orange', a:'🍊', f:1, s:.6, fact:'The peel is like a life jacket full of air bubbles!',

let AC = null;
function ac(){
  if(!SV.sound) return null;
  if(!AC){ try{ AC = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ return null; } }
  if(AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(freq, dur, type='sine', vol=.2, when=0, slideTo=null){
  const c = ac(); if(!c) return;
  const t = c.currentTime + when;
  const o = c.createOscillator(), g = c.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.015);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(c.destination); o.start(t); o.stop(t + dur + 0.05);
}
let noiseBuf = null;
function noise(dur, freq, q, vol, when=0){
  const c = ac(); if(!c) return;
  if(!noiseBuf){
    noiseBuf = c.createBuffer(1, c.sampleRate, c.sampleRate);
    const d = noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i] = Math.random()*2-1;
  }
  const t = c.currentTime + when;
  const s = c.createBufferSource(); s.buffer = noiseBuf;
  const f = c.createBiquadFilter(); f.type = 'bandpass'; f.frequency.setValueAtTime(freq, t); f.frequency.exponentialRampToValueAtTime(freq*.4, t+dur); f.Q.value = q;
  const g = c.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f).connect(g).connect(c.destination); s.start(t); s.stop(t + dur);
}

  bloop(){ tone(rnd(500,800), .12, 'sine', .08, 0, 220); },
  right(){ [523,659,784,1047].forEach((f,i)=>tone(f,.18,'triangle',.16,i*.09)); },
  surprise(){ tone(300,.18,'triangle',.18,0,700); tone(700,.2,'triangle',.14,.18,350); },
  clink(){ tone(rnd(1900,2300),.09,'square',.05); tone(rnd(2800,3200),.12,'sine',.07,.02); },
  glug(){ for(let i=0;i<5;i++) tone(rnd(180,320),.14,'sine',.16,i*.16,90); },

/* ================= tank geometry + particles ================= */
function makeTank(el){
  const T = {el, objs:el.querySelector('.objs'), cv:el.querySelector('canvas.fx'), W:300, H:300, parts:[]};
  T.ctx = T.cv.getContext('2d');
  T.measure = () => {
    const r = el.getBoundingClientRect(), b = 12; // inner size minus borders
    T.W = Math.max(100, r.width - b); T.H = Math.max(100, r.height - b);
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    T.cv.width = T.W*dpr; T.cv.height = T.H*dpr; T.ctx.setTransform(dpr,0,0,dpr,0,0);
  };
  T.wt = () => T.H*.36;
  T.sandH = () => T.H*.07;
  T.splash = (x, power) => {
    const n = Math.round(8 + power*14), y = T.wt();
    for(let i=0;i<n;i++) T.parts.push({k:'drop', x:x+rnd(-14,14), y, vx:rnd(-160,160), vy:-rnd(120,330)*(.6+power*.6), r:rnd(2.5,5.5), life:1.2});
    T.parts.push({k:'ring', x, y, r:6, life:1});
    T.parts.push({k:'ring', x, y, r:2, life:1.3});
  };
  T.bubble = (x, y) => T.parts.push({k:'bub', x:x+rnd(-8,8), y, vy:-rnd(50,100), r:rnd(2,5), ph:rnd(0,6), life:4});
  T.step = dt => {
    const c = T.ctx, wt = T.wt();
    c.clearRect(0,0,T.W,T.H);
    T.parts = T.parts.filter(p => p.life > 0);
    for(const p of T.parts){
      p.life -= dt;
      if(p.k === 'drop'){
        p.vy += 900*dt; p.x += p.vx*dt; p.y += p.vy*dt;
        if(p.vy > 0 && p.y > wt) p.life = 0;
        c.fillStyle = 'rgba(190,235,255,.95)';
        c.beginPath(); c.arc(p.x, p.y, p.r, 0, 7); c.fill();
      }else if(p.k === 'ring'){
        p.r += 70*dt;
        c.strokeStyle = `rgba(255,255,255,${Math.max(0,p.life)*.8})`; c.lineWidth = 3;
        c.beginPath(); c.ellipse(p.x, wt, p.r*1.6, p.r*.35, 0, 0, 7); c.stroke();
      }else if(p.k === 'bub'){
        p.y += p.vy*dt; p.ph += dt*6; p.x += Math.sin(p.ph)*.6;
        if(p.y < wt + 3) p.life = 0;
        c.strokeStyle = 'rgba(255,255,255,.85)'; c.lineWidth = 1.5;
        c.beginPath(); c.arc(p.x, p.y, p.r, 0, 7); c.stroke();
      }
    }
  };
  return T;
}

function layoutLab(){
  const s = objSize();
  for(const b of L.bodies){ b.el.style.fontSize = s + 'px'; b.el.style.width = b.el.style.height = s + 'px'; }
}

function stepLab(dt){
  const s = objSize(), wt = labT.wt(), hy = hookY();
  const floor = labT.H - labT.sandH() - s*.42;
  for(const b of L.bodies){
    const o = OBJ[b.id], x0 = slotX(b.slot);
    let x = x0;
    b.t += dt;
    if(b.mode === 'hang'){
      b.y = hy + Math.sin(b.t*2.2)*4; b.rot = Math.sin(b.t*1.7)*7;
      x = x0 + Math.sin(b.t*1.7)*3;
    }else if(b.mode === 'lift'){
      b.y -= 260*dt; b.rot *= .9;
      if(b.y <= hy){ b.y = hy; b.mode = 'hang'; if(b.onLifted){ const f = b.onLifted; b.onLifted = null; f(); } }
    }else if(b.mode === 'fall'){
      const inWater = b.y + s*.5 > wt;
      if(inWater && !b.splashed){
        b.splashed = true; const p = Math.min(1, Math.abs(b.vy)/500);
        labT.splash(x, p); sfx.splash(p > .6);
        if(!o.f) b.vy *= .45;
      }
      if(!inWater){ b.vy += 1800*dt; }
      else{
        b.tw += dt;
        if(o.f){
          const target = wt - s*.5 + s*o.s;
          b.vy += ((target - b.y)*55 - b.vy*7)*dt;
          b.rot = Math.sin(b.t*3)*6*Math.max(0, 1 - b.tw/2);
          if((b.tw > 1.2 && Math.abs(b.vy) < 10 && Math.abs(b.y - target) < 2.5) || b.tw > 3){ b.mode = 'rest'; b.t = 0; }
        }else{
          b.vy += (150 - b.vy)*3*dt;
          x = x0 + Math.sin(b.t*5)*4;
          b.rot += (b.tilt - b.rot)*2*dt;
          if(Math.random() < dt*14) labT.bubble(x, b.y);
          if(Math.random() < dt*3) sfx.bloop();
          if(b.y >= floor){
            b.y = floor;
            if(b.vy > 70){ b.vy = -b.vy*.25; } else { b.vy = 0; b.mode = 'rest'; b.t = 0; }
          }
        }
      }
      b.y += b.vy*dt;
      if(b.mode === 'rest' && b === L.cur && L.phase === 'dropping') reveal();
    }else if(b.mode === 'rest'){
      if(o.f){ b.y = wt - s*.5 + s*o.s + Math.sin(b.t*2 + b.ph)*2.5; b.rot = Math.sin(b.t*1.6 + b.ph)*5; }
      else { b.y = floor; b.rot = b.tilt; }
    }
    b.x = x;
    b.el.style.transform = `translate(${x - s/2}px,${b.y - s/2}px) rotate(${b.rot}deg)`;
    if(b.rope){ b.rope.style.left = x + 'px'; b.rope.style.height = Math.max(0, b.y - s*.5 + 4) + 'px'; b.rope.lastChild.style.top = '100%'; }
  }
}

      if(B.phase !== 'load' || B.coins > 0) return;
      sfx.tap(); B.guess = n;
      r.querySelectorAll('.chip').forEach(x => x.classList.toggle('on', +x.textContent === n));
      const m = `You guessed <b>${n}</b> coins. Tap the coin button to load the boat!`;
      setBubble($('#boatBubble'), m); say(m);
    };
    r.appendChild(ch);
  }
}
function newBoat(size){
  B.size = size; B.cap = BOATS[size].cap; B.coins = 0; B.phase = 'load'; B.guess = null;
  B.sinkY = 0; B.sinkVy = 0; B.rot = 0; B.t = 0; B.draft = 6;
  boatT.parts = [];
  boatT.objs.innerHTML = '';
  const el = document.createElement('div'); el.className = 'boat';
  el.innerHTML = '<div class="hull"></div><div class="rim"></div><div class="cbox" style="position:absolute;inset:0"></div>';
  boatT.objs.appendChild(el);
  B.el = el; B.coinBox = el.querySelector('.cbox');
  $('#btnCoin').hidden = false; $('#btnNewBoat').hidden = true;
  $('#btnCoin').disabled = false;
  $('#coinCount').textContent = '🪙 0';
  renderSizes(); renderGuess(); sizeBoat();
  const m = SV.boats[size] != null
    ? `The <b>${BOATS[size].name}</b> foil boat! Last time it held ${SV.boats[size]} coins. Load it up again!`
    : `How many coins can the <b>${BOATS[size].name}</b> foil boat carry before it sinks? Pick a guess, then add coins!`;
  setBubble($('#boatBubble'), m); say(m);
}
function sizeBoat(){
  if(!B.el) return;
  const g = boatGeom();
  B.el.style.width = g.w + 'px'; B.el.style.height = g.h + 'px';
  [...B.coinBox.children].forEach((c,i) => placeCoin(c, i, g, false));
}
function coinSpot(i, g){
  const inner = g.w*.6, per = Math.max(2, Math.floor(inner/(g.cs*.9)));
  const row = Math.floor(i/per), col = i % per;
  const rowCount = Math.min(per, B.cap - row*per);
  const span = (rowCount - 1)*g.cs*.9;
  const x = g.w/2 - span/2 + col*g.cs*.9 - g.cs/2 + (row % 2 ? g.cs*.3 : 0);
  const y = g.h - g.cs - 4 - row*g.cs*.42;
  return {x, y};
}
function placeCoin(c, i, g, fresh){
  const p = coinSpot(i, g);
  c.style.fontSize = g.cs + 'px'; c.style.left = p.x + 'px';
  if(fresh){ c.style.top = (p.y - 90) + 'px'; requestAnimationFrame(() => requestAnimationFrame(() => c.style.top = p.y + 'px')); }
  else c.style.top = p.y + 'px';
}
function addCoin(){
  if(B.phase !== 'load') return;
  B.coins++;
  const g = boatGeom();
  const c = document.createElement('span'); c.className = 'coin-on'; c.innerHTML = '<i class="art coin"></i>';
  B.coinBox.appendChild(c); placeCoin(c, B.coins - 1, g, true);
  sfx.clink();
  $('#coinCount').textContent = '🪙 ' + B.coins;
  renderGuess();
  if(B.coins > B.cap){
    B.phase = 'sinking'; $('#btnCoin').disabled = true;
    const m = 'Uh-oh… water is coming over the side!';
    setBubble($('#boatBubble'), m); say(m);
    setTimeout(() => sfx.glug(), 250);
    return;
  }
  let m;
  const left = B.cap - B.coins;
  if(B.coins === 1) m = 'Clink! See how the boat sits a little lower?';
  else if(left === 0) m = 'Wow, the edge is almost touching the water!';
  else if(left <= 2) m = 'It is riding really low now…';
  else m = `${B.coins} coins… still floating!`;
  setBubble($('#boatBubble'), m);
  if(B.coins === 1 || left <= 2) say(m);
}
$('#btnCoin').onclick = addCoin;
$('#btnNewBoat').onclick = () => { sfx.tap(); newBoat(B.size); };

function boatSunk(){
  B.phase = 'sunk';
  const held = B.cap;
  SV.boats[B.size] = held; persist();
  let m = `It carried <b>${held} coins</b>! Coin number ${held + 1} sank it.`;
  if(B.guess === held){ m += ' You guessed it exactly! ⭐'; sfx.right(); confetti(); hop($('#boatOtter')); }
  else if(B.guess != null){ m += ` You guessed ${B.guess}, so close to a real scientist!`; sfx.surprise(); }
  else sfx.right();
  setBubble($('#boatBubble'), m, 'Bigger boats push more water away, so they can carry more.'); say(m + ' Bigger boats push more water away, so they can carry more.');
  $('#btnCoin').hidden = true; $('#btnNewBoat').hidden = false;
  renderSizes();
}
function stepBoat(dt){
  if(!B.el) return;
  const g = boatGeom(), wt = boatT.wt();
  B.t += dt;
  const step = (g.h - 6 - 5)/B.cap;
  const target = 6 + Math.min(B.coins, B.cap)*step;
  B.draft += (target - B.draft)*Math.min(1, dt*6);
  let y = wt - g.h + B.draft, x = boatT.W/2 - g.w/2;
  if(B.phase === 'load'){
    y += Math.sin(B.t*2)*1.5; B.rot = Math.sin(B.t*1.4)*2;
  }else if(B.phase === 'sinking' || B.phase === 'sunk'){
    const floorTop = boatT.H - boatT.sandH()*.6 - g.h;
    if(B.phase === 'sinking'){
      B.sinkVy += (70 - B.sinkVy)*dt*1.5;
      B.sinkY += B.sinkVy*dt;
      B.rot += (9 - B.rot)*dt*1.5;
      if(Math.random() < dt*20) boatT.bubble(x + rnd(0, g.w), y + B.sinkY);
      if(Math.random() < dt*8) boatT.parts.push({k:'drop', x:x + (Math.random() < .5 ? 0 : g.w), y:wt - 2, vx:rnd(-40,40), vy:-rnd(40,90), r:3, life:.6});
    }
    if(y + B.sinkY >= floorTop){ B.sinkY = floorTop - y; if(B.phase === 'sinking') boatSunk(); }
    y += B.sinkY;
  }
  B.el.style.transform = `translate(${x}px,${y}px) rotate(${B.rot}deg)`;
}

/* ================= notebook ================= */
function renderBook(){
  const order = [];
  TUBS.forEach(t => t.items.forEach(id => { order.push(id); if(OBJ[id].sp) order.push(OBJ[id].sp.to); }));
  const total = order.length, foundN = order.filter(id => SV.found[id]).length;
  const cells = side => {
    const ids = order.filter(id => (OBJ[id].f ? 'F' : 'S') === side);
    return ids.map(id => SV.found[id] ? `<div class="cell" title="${OBJ[id].n}">${artHTML(OBJ[id].a)}</div>` : '<div class="cell unk">?</div>').join('');
  };
  const recs = ['s','m','b'].map(k => `${BOATS[k].name} boat: ${SV.boats[k] != null ? SV.boats[k] + ' 🪙' : '—'}`).join(' · ');
  $('#book').innerHTML = `<h2>📒 My Science Notebook</h2>
    <div class="recs">Things tested: <b>${foundN}</b> of ${total}</div>
    <div class="cols">
      <div class="col F"><h3>⬆️ Floaters</h3><div class="found">${cells('F')}</div></div>
      <div class="col S"><h3>⬇️ Sinkers</h3><div class="found">${cells('S')}</div></div>
    </div>
    <div class="medals">${TUBS.map((t,i) => `<span class="medal ${SV.tubs[i] != null ? 'got' : ''}" title="${t.name}">${t.badge}</span>`).join('')}</div>
    <div class="recs">${recs}</div>
    <button class="resetbtn" id="resetBtn">Clear my notebook</button>`;
  const rb = $('#resetBtn'); let armed = false;
  rb.onclick = () => {
    if(!armed){ armed = true; rb.textContent = 'Tap again to clear everything'; return; }
    SV.found = {}; SV.tubs = {}; SV.boats = {}; persist(); renderBook();
  };
  $('#book').querySelectorAll('.cell[title]').forEach(c => c.style.fontSize = '30px');
}

/* ================= overlay + confetti ================= */
function openPanel(html){ $('#panel').innerHTML = html; $('#overlay').hidden = false; }
function closePanel(){ $('#overlay').hidden = true; }
const CF = {cv:$('#confetti'), parts:[]};
CF.ctx = CF.cv.getContext('2d');
function sizeConfetti(){ CF.cv.width = innerWidth; CF.cv.height = innerHeight; }
function confetti(){
  const cols = ['#ff6fae','#ffcf33','#3ccf6e','#2f7bff','#9b6bff','#ff9a3c'];
  for(let i=0;i<120;i++) CF.parts.push({x:innerWidth/2 + rnd(-60,60), y:innerHeight*.35, vx:rnd(-320,320), vy:rnd(-650,-200), r:rnd(5,10), c:cols[i%cols.length], a:rnd(0,6), va:rnd(-8,8), life:3});
}
function stepConfetti(dt){
  const c = CF.ctx; if(!CF.parts.length && !CF.dirty) return;
  c.clearRect(0,0,CF.cv.width,CF.cv.height); CF.dirty = CF.parts.length > 0;
  CF.parts = CF.parts.filter(p => p.life > 0 && p.y < innerHeight + 20);
  for(const p of CF.parts){
    p.life -= dt; p.vy += 700*dt; p.vx *= .99; p.x += p.vx*dt; p.y += p.vy*dt; p.a += p.va*dt;
    c.save(); c.translate(p.x, p.y); c.rotate(p.a); c.fillStyle = p.c; c.fillRect(-p.r/2, -p.r/4, p.r, p.r/2); c.restore();
  }
}

/* ================= loop ================= */
let last = performance.now();
function loop(now){
  const dt = Math.min(.05, (now - last)/1000); last = now;
  if(screen === 'lab'){ stepLab(dt); labT.step(dt); }
  else if(screen === 'boat'){ stepBoat(dt); boatT.step(dt); }
  stepConfetti(dt);
  requestAnimationFrame(loop);
}
window.addEventListener('resize', () => { labT.measure(); boatT.measure(); layoutLab(); sizeBoat(); sizeConfetti(); });
sizeConfetti(); refreshSoundBtn();
labT.measure(); boatT.measure();
requestAnimationFrame(loop);
window.SFL = {L, B, OBJ, TUBS, SV:() => SV, labT, boatT};
</script>
