<!-- CONCEPT: LEARNING (position words) - Where Does It Go? Mo the mouse is tidying four rooms and kids learn ON, UNDER, IN, NEXT TO, BEHIND, IN FRONT OF, ABOVE and BETWEEN: in "Put it" turns you tap the ring where a kitten, teddy or duck belongs ("Put the kitten UNDER the bed") and it hops there; in "Where is it?" turns Mo hides it and you tap the right word; a wrong spot just gets named ("now the kitten is NEXT TO the bed - let's try UNDER!") and hops back. Bedroom, Kitchen, Garden and Playroom add new words, read-aloud sentences, saved stars per room, a Tidy-Up Champ ribbon and a Free Play where any word makes the friend hop there. No timer, no losing. Ages 4-8. [style: Clay / sound: Cartoon FX] -->

<main id="app">

<script>
(() => {
'use strict';
const KEY = 'cowork-wheredoesitgo-';
const $ = id => document.getElementById(id);

/* ================= SOUND: Cartoon FX ================= */
let AC = null, master = null, soundOn = localStorage.getItem(KEY + 'sound') !== 'off';
let voiceOn = localStorage.getItem(KEY + 'voice') !== 'off';
function ac() {
  if (!AC) {
    const C = window.AudioContext || window.webkitAudioContext;
    if (!C) return null;
    AC = new C();
    const comp = AC.createDynamicsCompressor();
    comp.threshold.value = -16; comp.ratio.value = 4;
    master = AC.createGain();
    master.gain.value = soundOn ? 0.6 : 0;
    master.connect(comp); comp.connect(AC.destination);
  }
  if (AC.state === 'suspended') AC.resume();
  return AC;
}
function envGain(c, t, peak, atk, rel) {
  const g = c.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(peak, t + atk);
  g.gain.exponentialRampToValueAtTime(0.0001, t + atk + rel);
  g.connect(master);
  return g;
}
// boing: sine sweep up with vibrato
function boing(delay = 0, f1 = 200, f2 = 600, dur = 0.35, vol = 0.32) {
  const c = ac(); if (!c) return;
  const t = c.currentTime + delay;
  const o = c.createOscillator(); o.type = 'sine';
  o.frequency.setValueAtTime(f1, t);
  o.frequency.exponentialRampToValueAtTime(f2, t + dur * 0.45);
  o.frequency.exponentialRampToValueAtTime(f2 * 0.88, t + dur);
  const lfo = c.createOscillator(); lfo.frequency.value = 16;
  const lg = c.createGain(); lg.gain.value = f2 * 0.05;
  lfo.connect(lg); lg.connect(o.frequency);
  const g = envGain(c, t, vol, 0.012, dur);
  o.connect(g);
  o.start(t); lfo.start(t); o.stop(t + dur + 0.08); lfo.stop(t + dur + 0.08);
}
let noiseBuf = null;
function noise(c) {
  if (!noiseBuf) {
    noiseBuf = c.createBuffer(1, c.sampleRate * 0.2, c.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  const s = c.createBufferSource(); s.buffer = noiseBuf; return s;
}
// pop: noise burst + 900 Hz blip, 40 ms
function pop(vol = 0.3) {
  const c = ac(); if (!c) return;
  const t = c.currentTime;
  const n = noise(c);
  const bp = c.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1800; bp.Q.value = 1.2;
  const g1 = envGain(c, t, vol, 0.005, 0.04);
  n.connect(bp); bp.connect(g1); n.start(t); n.stop(t + 0.07);
  const o = c.createOscillator(); o.type = 'triangle';
  o.frequency.setValueAtTime(900, t); o.frequency.exponentialRampToValueAtTime(1300, t + 0.04);
  const g2 = envGain(c, t, vol * 0.8, 0.005, 0.045);
  o.connect(g2); o.start(t); o.stop(t + 0.08);
}
// slide whistle: gentle downward sweep with wobble ("whoops")
function slide(delay = 0) {
  const c = ac(); if (!c) return;
  const t = c.currentTime + delay;
  const o = c.createOscillator(); o.type = 'triangle';
  o.frequency.setValueAtTime(820, t);
  o.frequency.exponentialRampToValueAtTime(330, t + 0.55);
  const lfo = c.createOscillator(); lfo.frequency.value = 7;
  const lg = c.createGain(); lg.gain.value = 22;
  lfo.connect(lg); lg.connect(o.frequency);
  const g = envGain(c, t, 0.22, 0.02, 0.6);
  o.connect(g); o.start(t); lfo.start(t); o.stop(t + 0.7); lfo.stop(t + 0.7);
}
function hopSnd() { boing(0, 320, 720, 0.16, 0.18); }
function motif(delay = 0) { // signature: four rising boings C E G C
  [262, 330, 392, 523].forEach((f, i) => boing(delay + i * 0.14, f * 0.62, f, i === 3 ? 0.4 : 0.2, 0.28));
}
function yay() { boing(0, 300, 900, 0.3, 0.3); boing(0.16, 400, 1200, 0.32, 0.24); }

/* ================= SPEECH ================= */
let lastSpoken = '';
function speak(text) {
  lastSpoken = text;
  if (!voiceOn || !soundOn || !('speechSynthesis' in window)) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.rate = 0.9; u.pitch = 1.25;
    speechSynthesis.speak(u);
  } catch (e) {}
}

/* ================= DATA ================= */
const WORDS = { on: 'ON', under: 'UNDER', in: 'IN', next: 'NEXT TO', behind: 'BEHIND', front: 'IN FRONT OF', above: 'ABOVE', between: 'BETWEEN' };
// [x%, y%, scale, z]
const GEO = {
  A: { on: [28, 44, 1, 7], under: [28, 77, 1, 3], next: [7, 78, 1, 7], front: [28, 91, 1.12, 9], above: [28, 24, 1, 7] },
  B: { in: [72, 57, 1, 3], behind: [83, 49, 0.8, 1], next: [93, 78, 1, 7], front: [74, 92, 1.12, 9], above: [74, 30, 1, 7] },
  AB: { between: [52, 78, 1, 7] }
};
const MAT = [15, 15, 1, 7];
const ROOMS = [
  { name: 'Bedroom', emoji: '🛏️', words: ['on', 'under', 'in'], A: { look: 'bed', noun: 'bed' }, B: { look: 'toybox', noun: 'toy box' },
    wall: '#cfe0ff', floor: '#e6c9a3', edge: '#c9a77d', tt: '#ff8fa3', leg: '#8a5a3c', bx: '#e0504f', bxIn: '#7a2222', bxDeco: '#ffd23f', spots: 3, choices: 3, deco: 'window' },
  { name: 'Kitchen', emoji: '🍳', words: ['on', 'under', 'in', 'next'], A: { look: 'kitchen', noun: 'table' }, B: { look: 'basket', noun: 'basket' },
    wall: '#fde2c8', floor: '#d5e8cc', edge: '#a9c99b', tt: '#e8a35c', leg: '#9b6236', bx: '#c98b45', bxIn: '#5e3a14', bxDeco: '#fff', spots: 3, choices: 3, deco: 'window' },
  { name: 'Garden', emoji: '🌻', words: ['on', 'under', 'in', 'next', 'behind', 'front'], A: { look: 'bench', noun: 'bench' }, B: { look: 'pot', noun: 'flowerpot' },
    wall: '#bfe6ff', floor: '#9fd68a', edge: '#6fb35a', tt: '#b97a45', leg: '#6b4423', bx: '#d9773f', bxIn: '#5a2a10', bxDeco: '#f3b48a', spots: 4, choices: 4, deco: 'sun' },
  { name: 'Playroom', emoji: '🧩', words: ['on', 'under', 'in', 'next', 'behind', 'front', 'above', 'between'], A: { look: 'play', noun: 'table' }, B: { look: 'bucket', noun: 'bucket' },
    wall: '#f3d6ee', floor: '#c9d9f5', edge: '#98afe0', tt: '#ffd23f', leg: '#1d5fc4', bx: '#2e8bd8', bxIn: '#123a66', bxDeco: '#ffffff', spots: 4, choices: 4, deco: 'window' }
];
const FRIENDS = [['🐱', 'kitten'], ['🐶', 'puppy'], ['🧸', 'teddy'], ['🦆', 'duck'], ['⚽', 'ball'], ['🐰', 'bunny'], ['🐢', 'turtle'], ['🦖', 'dino']];
const ROUNDS = 6;
let best = {};
try { best = JSON.parse(localStorage.getItem(KEY + 'stars') || '{}') || {}; } catch (e) { best = {}; }

/* ================= STATE ================= */
const S = { room: 0, round: 0, mistakes: 0, wrongs: 0, mode: 'put', target: null, spots: [], busy: false,
  friend: FRIENDS[0], used: new Set(), lastKey: '', free: false, freeAnchor: 'A', timers: [] };
let W = 360, H = 270;

const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = a => a[Math.floor(Math.random() * a.length)];
function later(fn, ms) { const id = setTimeout(fn, ms); S.timers.push(id); return id; }
function clearTimers() { S.timers.forEach(clearTimeout); S.timers = []; }

function positions(room) {
  const out = [];
  room.words.forEach(w => {
    if (w === 'between') out.push({ w, a: 'AB' });
    else {
      if (GEO.A[w]) out.push({ w, a: 'A' });
      if (GEO.B[w]) out.push({ w, a: 'B' });
    }
  });
  out.forEach(p => { p.key = p.w + p.a; p.g = GEO[p.a][p.w]; });
  return out;
}
function anchorPhrase(room, a) {
  if (a === 'AB') return 'the ' + room.A.noun + ' and the ' + room.B.noun;
  return 'the ' + room[a].noun;
}

/* ================= STAGE ================= */
const stage = $('stage');
let critter = null, ringLayer = null;
function el(cls, style, parent) {
  const d = document.createElement('div');
  if (cls) d.className = cls;
  if (style) d.setAttribute('style', style);
  (parent || stage).appendChild(d);
  return d;
}
function buildStage(room) {
  stage.innerHTML = '';
  stage.setAttribute('aria-hidden', 'false');
  stage.style.setProperty('--wall', room.wall);
  stage.style.setProperty('--floor', room.floor);
  stage.style.setProperty('--edge', room.edge);
  stage.style.setProperty('--tt', room.tt);
  stage.style.setProperty('--leg', room.leg);
  stage.style.setProperty('--bx', room.bx);
  stage.style.setProperty('--bxIn', room.bxIn);
  stage.style.setProperty('--bxDeco', room.bxDeco);
  const scene = el('', 'position:absolute;inset:0');
  scene.setAttribute('aria-hidden', 'true');
  el('wall', '', scene); el('floor', '', scene);
  el(room.deco, '', scene);
  el('mat', '', scene);
  const t = el('tbl look-' + room.A.look, 'left:14%;top:52%;width:28%;height:34%', scene);
  el('tt', '', t); el('leg l', '', t); el('leg r', '', t);
  if (room.A.look === 'bed') el('head', '', t);
  el('bxback', 'left:62%;top:56.5%;width:24%;height:7%', scene);
  el('bxfront look-' + room.B.look, 'left:62%;top:60%;width:24%;height:26%', scene);
  critter = el('critter instant', '', scene);
  critter.innerHTML = '<span class="hop"></span>';
  ringLayer = el('', 'position:absolute;inset:0;z-index:20;pointer-events:none');
  placeCritter(MAT, true);
  fitStage();
}
function setFriend(f) { S.friend = f; critter.firstChild.textContent = f[0]; }
function placeCritter(g, instant) {
  critter.classList.toggle('instant', !!instant);
  if (instant) void critter.offsetWidth;
  critter.style.left = g[0] + '%';
  critter.style.top = g[1] + '%';
  critter.style.setProperty('--s', g[2]);
  critter.style.zIndex = g[3];
  critter.classList.toggle('dim', g[3] === 1);
  if (!instant) {
    const h = critter.firstChild;
    h.classList.remove('go'); void h.offsetWidth; h.classList.add('go');
    hopSnd();
  }
}
function sparkle(g) {
  for (let i = 0; i < 7; i++) {
    const s = el('spark', '');
    s.textContent = pick(['✨', '⭐', '💜']);
    s.setAttribute('aria-hidden', 'true');
    s.style.left = g[0] + '%'; s.style.top = g[1] + '%';
    const ang = (i / 7) * Math.PI * 2;
    s.style.setProperty('--dx', Math.cos(ang) * W * 0.12 + 'px');
    s.style.setProperty('--dy', Math.sin(ang) * W * 0.12 + 'px');
    setTimeout(() => s.remove(), 900);
  }
}
function ringPx() { return Math.max(46, W * 0.13); }
function fitStage() {
  const wrap = $('stageWrap');
  const r = wrap.getBoundingClientRect();
  if (r.width < 10 || r.height < 10) return;
  W = Math.floor(Math.min(r.width, r.height * 4 / 3));
  H = Math.floor(W * 0.75);
  stage.style.width = W + 'px';
  stage.style.height = H + 'px';
  stage.style.fontSize = (W * 0.11) + 'px';
  if (ringLayer) ringLayer.querySelectorAll('.ring').forEach(b => { b.style.width = b.style.height = ringPx() + 'px'; });
}
new ResizeObserver(fitStage).observe($('stageWrap'));
window.addEventListener('resize', fitStage);

function farEnough(g, list) {
  const need = ringPx() + 4;
  return list.every(o => Math.hypot((g[0] - o.g[0]) * W / 100, (g[1] - o.g[1]) * H / 100) >= need) &&
    Math.hypot((g[0] - MAT[0]) * W / 100, (g[1] - MAT[1]) * H / 100) >= need;
}

/* ================= SCREENS ================= */
function show(id) {
  ['menu', 'play'].forEach(s => { $(s).hidden = s !== id; });
  if (id === 'play') requestAnimationFrame(fitStage);
}
function starsHTML(n) {
  let s = '';
  for (let i = 0; i < 3; i++) s += i < n ? '★' : '<span class="off">☆</span>';
  return s;
}
function renderMenu() {
  const box = $('rooms'); box.innerHTML = '';
  ROOMS.forEach((r, i) => {
    const b = document.createElement('button');
    b.className = 'roomBtn';
    const n = best[i] || 0;
    b.innerHTML = '<span class="rEmoji" aria-hidden="true">' + r.emoji + '</span><span class="rName">' + r.name + '</span>' +
      '<span class="rWords">' + r.words.map(w => WORDS[w]).join(' · ') + '</span>' +
      '<span class="stars" aria-hidden="true">' + starsHTML(n) + '</span><span class="sr">, ' + n + ' of 3 stars</span>';
    b.addEventListener('click', () => { pop(); startRoom(i); });
    box.appendChild(b);
  });
  $('ribbon').hidden = !ROOMS.every((r, i) => (best[i] || 0) >= 3);
}
function updateToggles() {
  $('soundBtn').textContent = 'Sound: ' + (soundOn ? 'on' : 'off');
  $('soundBtn').setAttribute('aria-pressed', String(soundOn));
  $('voiceBtn').textContent = 'Read aloud: ' + (voiceOn ? 'on' : 'off');
  $('voiceBtn').setAttribute('aria-pressed', String(voiceOn));
}
$('soundBtn').addEventListener('click', () => {
  soundOn = !soundOn; localStorage.setItem(KEY + 'sound', soundOn ? 'on' : 'off');
  if (master) master.gain.value = soundOn ? 0.6 : 0;
  if (!soundOn && 'speechSynthesis' in window) speechSynthesis.cancel();
  updateToggles(); pop();
});
$('voiceBtn').addEventListener('click', () => {
  voiceOn = !voiceOn; localStorage.setItem(KEY + 'voice', voiceOn ? 'on' : 'off');
  if (!voiceOn && 'speechSynthesis' in window) speechSynthesis.cancel();
  updateToggles(); pop();
});
$('backBtn').addEventListener('click', () => { pop(); goMenu(); });
$('hearBtn').addEventListener('click', () => { pop(); const t = lastSpoken; lastSpoken = ''; speak(t); });
$('freeBtn').addEventListener('click', () => { pop(); startFree(); });
function goMenu() {
  clearTimers(); S.busy = false;
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  $('overlay').hidden = true;
  renderMenu(); show('menu');
}
function setSay(html, spoken) { $('say').innerHTML = '<span>' + html + '</span>'; speak(spoken); }
function renderDots() {
  const d = $('dots'); d.innerHTML = '';
  for (let i = 0; i < ROUNDS; i++) {
    const s = document.createElement('span');
    s.className = 'dot' + (i < S.round ? ' done' : i === S.round ? ' now' : '');
    d.appendChild(s);
  }
  $('roundSr').textContent = 'Round ' + Math.min(S.round + 1, ROUNDS) + ' of ' + ROUNDS;
}

/* ================= GAME ================= */
function startRoom(i) {
  clearTimers();
  S.free = false; S.room = i; S.round = 0; S.mistakes = 0; S.used = new Set(); S.lastKey = '';
  const room = ROOMS[i];
  $('roomName').textContent = room.name;
  $('dots').hidden = false;
  show('play');
  buildStage(room);
  motif();
  later(nextRound, 300);
}
function chooseTarget(room) {
  const all = positions(room);
  let fresh = all.filter(p => !S.used.has(p.w) && p.key !== S.lastKey);
  if (!fresh.length) { S.used.clear(); fresh = all.filter(p => p.key !== S.lastKey); }
  const t = pick(fresh);
  S.used.add(t.w); S.lastKey = t.key;
  return t;
}
function nextRound() {
  S.busy = false; S.wrongs = 0;
  const room = ROOMS[S.room];
  renderDots();
  if (S.round >= ROUNDS) { finishRoom(); return; }
  S.mode = S.round % 2 === 0 ? 'put' : 'word';
  let f; do { f = pick(FRIENDS); } while (f === S.friend);
  setFriend(f);
  placeCritter(MAT, true);
  ringLayer.innerHTML = '';
  $('answers').innerHTML = '';
  const t = S.target = chooseTarget(room);
  const ph = anchorPhrase(room, t.a);
  if (S.mode === 'put') {
    const all = shuffle(positions(room).filter(p => p.key !== t.key));
    const chosen = [t];
    for (const p of all) {
      if (chosen.length >= room.spots) break;
      if (farEnough(p.g, chosen)) chosen.push(p);
    }
    S.spots = shuffle(chosen);
    S.spots.forEach((p, i) => {
      const b = document.createElement('button');
      b.className = 'ring';
      b.style.left = p.g[0] + '%'; b.style.top = p.g[1] + '%';
      b.style.width = b.style.height = ringPx() + 'px';
      b.style.pointerEvents = 'auto';
      b.setAttribute('aria-label', 'Spot ' + (i + 1) + ' of ' + S.spots.length);
      b.addEventListener('click', () => onSpot(p, b));
      p.btn = b;
      ringLayer.appendChild(b);
    });
    setSay('Put the <b>' + f[1] + '</b> <span class="kw">' + WORDS[t.w] + '</span> ' + ph + '.',
      'Put the ' + f[1] + ' ' + WORDS[t.w].toLowerCase() + ' ' + ph + '.');
    $('answers').innerHTML = '<span class="hint">Tap a ring to make it hop!</span>';
  } else {
    S.busy = true;
    setSay('Where is the <b>' + f[1] + '</b>? It is <span class="blank">&nbsp;</span> ' + ph + '.',
      'Where is the ' + f[1] + '? Watch!');
    later(() => { placeCritter(t.g); }, 500);
    later(() => {
      const opts = room.words.filter(w => w !== t.w && !(t.w === 'between' && w === 'next') && !(t.w === 'next' && w === 'between'));
      const words = shuffle([t.w, ...shuffle(opts).slice(0, room.choices - 1)]);
      words.forEach(w => {
        const b = document.createElement('button');
        b.className = 'chip'; b.textContent = WORDS[w];
        b.addEventListener('click', () => onWord(w, b));
        $('answers').appendChild(b);
      });
      speak('The ' + f[1] + ' is... where? ' + ph.replace(/^the /, 'Look at the ') + '.');
      S.busy = false;
    }, 1100);
  }
}
function onSpot(p, btn) {
  if (S.busy) return;
  S.busy = true;
  pop();
  const room = ROOMS[S.room], t = S.target, f = S.friend;
  placeCritter(p.g);
  if (p.key === t.key) {
    later(() => {
      yay(); sparkle(p.g);
      S.spots.forEach(s => s.btn.remove());
      const ph = anchorPhrase(room, t.a);
      setSay('Yes! The ' + f[1] + ' is <span class="kw">' + WORDS[t.w] + '</span> ' + ph + '!',
        'Yes! The ' + f[1] + ' is ' + WORDS[t.w].toLowerCase() + ' ' + ph + '!');
      $('answers').innerHTML = '<span class="hint">Great tidying!</span>';
    }, 420);
    later(() => { S.round++; nextRound(); }, 2600);
  } else {
    S.mistakes++; S.wrongs++;
    btn.classList.add('tried');
    later(() => {
      slide();
      const ph = anchorPhrase(room, p.a), tph = anchorPhrase(room, t.a);
      setSay('Now the ' + f[1] + ' is <span class="kw">' + WORDS[p.w] + '</span> ' + ph + '. Let\'s try <span class="kw">' + WORDS[t.w] + '</span> ' + tph + '!',
        'Oops! Now the ' + f[1] + ' is ' + WORDS[p.w].toLowerCase() + ' ' + ph + '. Let\'s try ' + WORDS[t.w].toLowerCase() + ' ' + tph + '!');
    }, 420);
    later(() => {
      placeCritter(MAT);
      if (S.wrongs >= 2) t.btn && t.btn.classList.add('glow');
      S.busy = false;
    }, 2400);
  }
}
function onWord(w, btn) {
  if (S.busy || btn.disabled) return;
  const room = ROOMS[S.room], t = S.target, f = S.friend;
  const ph = anchorPhrase(room, t.a);
  if (w === t.w) {
    S.busy = true;
    btn.classList.add('right');
    $('answers').querySelectorAll('.chip').forEach(b => { if (b !== btn) b.disabled = true; });
    yay(); sparkle(t.g);
    setSay('Yes! The ' + f[1] + ' is <span class="kw">' + WORDS[t.w] + '</span> ' + ph + '!',
      'Yes! The ' + f[1] + ' is ' + WORDS[t.w].toLowerCase() + ' ' + ph + '!');
    later(() => { S.round++; nextRound(); }, 2500);
  } else {
    S.mistakes++; S.wrongs++;
    pop(); slide(0.05);
    btn.classList.remove('wrong'); void btn.offsetWidth; btn.classList.add('wrong');
    btn.disabled = true;
    setSay('Not ' + WORDS[w] + '... look again! The ' + f[1] + ' is <span class="blank">&nbsp;</span> ' + ph + '.',
      'Not ' + WORDS[w].toLowerCase() + '. Look again!');
  }
}
function finishRoom() {
  const stars = S.mistakes <= 1 ? 3 : S.mistakes <= 3 ? 2 : 1;
  best[S.room] = Math.max(best[S.room] || 0, stars);
  try { localStorage.setItem(KEY + 'stars', JSON.stringify(best)); } catch (e) {}
  motif();
  const room = ROOMS[S.room];
  $('ovTitle').textContent = room.name + ' is tidy!';
  $('ovStars').innerHTML = starsHTML(stars);
  $('ovStarsSr').textContent = stars + ' of 3 stars';
  const champ = ROOMS.every((r, i) => (best[i] || 0) >= 3);
  $('ovMsg').textContent = champ ? 'Tidy-Up Champ! Every room has 3 stars!' :
    stars === 3 ? 'Super! You know where everything goes!' : 'Nice work! Play again for more stars!';
  const bx = $('ovBtns'); bx.innerHTML = '';
  const mk = (txt, fn, soft) => {
    const b = document.createElement('button'); b.className = 'btn' + (soft ? ' soft' : '');
    b.textContent = txt; b.addEventListener('click', () => { pop(); $('overlay').hidden = true; fn(); }); bx.appendChild(b); return b;
  };
  let first;
  if (S.room < ROOMS.length - 1) first = mk('Next room', () => startRoom(S.room + 1));
  const again = mk('Play again', () => startRoom(S.room), !!first);
  mk('Rooms', goMenu, true);
  $('overlay').hidden = false;
  (first || again).focus();
  speak(room.name + ' is tidy! ' + stars + ' stars!');
}

/* ================= FREE PLAY ================= */
function startFree() {
  clearTimers();
  S.free = true; S.busy = false;
  const room = ROOMS[3];
  $('roomName').textContent = 'Free Play';
  $('dots').hidden = true;
  $('roundSr').textContent = '';
  show('play');
  buildStage(room);
  setFriend(pick(FRIENDS));
  ringLayer.innerHTML = '';
  setSay('Tap a word and watch where the <b>' + S.friend[1] + '</b> goes!', 'Tap a word and watch where the ' + S.friend[1] + ' goes!');
  const ans = $('answers'); ans.innerHTML = '';
  Object.keys(WORDS).forEach(w => {
    const b = document.createElement('button');
    b.className = 'chip small'; b.textContent = WORDS[w];
    b.addEventListener('click', () => freeWord(w));
    ans.appendChild(b);
  });
  const ab = document.createElement('button');
  ab.className = 'chip small'; ab.id = 'anchorBtn';
  ab.addEventListener('click', () => { pop(); S.freeAnchor = S.freeAnchor === 'A' ? 'B' : 'A'; labelAnchor(); });
  ans.appendChild(ab);
  const fb = document.createElement('button');
  fb.className = 'chip small'; fb.textContent = 'New friend';
  fb.addEventListener('click', () => {
    pop(); let f; do { f = pick(FRIENDS); } while (f === S.friend);
    setFriend(f); placeCritter(MAT);
    setSay('Hello, <b>' + f[1] + '</b>! Tap a word!', 'Hello, ' + f[1] + '!');
  });
  ans.appendChild(fb);
  labelAnchor();
}
function labelAnchor() { $('anchorBtn').textContent = 'Near: ' + ROOMS[3][S.freeAnchor].noun; }
function freeWord(w) {
  const room = ROOMS[3];
  let a = w === 'between' ? 'AB' : GEO[S.freeAnchor][w] ? S.freeAnchor : (GEO.A[w] ? 'A' : 'B');
  const g = GEO[a][w];
  placeCritter(g);
  later(() => sparkle(g), 380);
  const ph = anchorPhrase(room, a);
  setSay('The ' + S.friend[1] + ' is <span class="kw">' + WORDS[w] + '</span> ' + ph + '!',
    'The ' + S.friend[1] + ' is ' + WORDS[w].toLowerCase() + ' ' + ph + '!');
}

/* ================= INIT ================= */
updateToggles();
renderMenu();
window.__mo = { S, ROOMS, GEO, positions };
})();
</script>
</body>
</html>
