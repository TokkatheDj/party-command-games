<!-- CONCEPT: SIZE & ORDERING (sequencing / before-and-after) - Story Blocks: chunky toy picture blocks each show one moment of a tiny story (seed, sprout, sunflower; egg, crack, chick; snow, snowman, melt...), shuffled in the toy box; kids tap them onto numbered spots 1-2-3 in the order they happen, then press PLAY and Theo the teddy "plays" the story block by block on a big stage, reading each step aloud - a block that's out of order wiggles and hops back to the toy box while the right ones lock in with a gold check; four shelves of 4 stories grow from 3-step to 5-step stories (blossom to apple pie, egg to butterfly, acorn to squirrel's tree, rocket launch), with a Help glow, saved stars per story and a Story Master trophy. No timer, no losing. Ages 4-9. [style: Toy Blocks / sound: Woodblock Kit] -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Story Blocks</title>
<style>
:root{
  --bg:#ffffff; --panel:#f2f2f2; --panel-edge:#c9c9d2;
  --text:#1b1030; --muted:#4a4a5a;
  --blue:#1d5fc4; --blue-d:#123f86;
  --red:#c1121f; --red-d:#7d0b14;
  --green:#1e7a3c; --green-d:#11502a;
  --yellow:#ffd60a; --yellow-d:#b39400;
  --gold:#8a6a00;
  --r:4px;
  --font:"Baloo 2","Arial Rounded MT Bold","Arial Black","Trebuchet MS",sans-serif;
}
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none;background:var(--bg);color:var(--text);font-family:var(--font)}
[hidden]{display:none!important}
button{font-family:inherit;color:inherit;cursor:pointer}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.app{height:100%;max-width:760px;margin:0 auto;display:flex;flex-direction:column}
header{padding:8px 12px 4px;flex:none}
.toprow{display:flex;align-items:center;gap:8px;justify-content:space-between}
h1{margin:0;line-height:1}
#titleTiles{display:flex;gap:8px;flex-wrap:wrap}
.tile{display:inline-flex;align-items:center;justify-content:center;width:clamp(19px,5.2vw,38px);height:clamp(24px,6.6vw,44px);
  font-size:clamp(14px,4.2vw,28px);font-weight:800;color:#fff;border-radius:var(--r);border-bottom:4px solid rgba(0,0,0,.35)}
.tile.gap{width:6px;background:none;border:none}
.t0{background:var(--blue)} .t1{background:var(--red)} .t2{background:var(--green)}
.tools{display:flex;gap:6px;flex:none}
.tools .btn{white-space:nowrap;padding:4px 8px}
.desc{margin:4px 0 0;font-size:clamp(13px,3.4vw,16px);color:var(--muted);line-height:1.25}

.btn{min-height:46px;min-width:46px;padding:6px 14px;border:none;border-radius:var(--r);font-weight:800;font-size:clamp(15px,4vw,20px);
  border-bottom:6px solid; transition:transform .08s}
.btn:active:not(:disabled){transform:translateY(3px);border-bottom-width:3px;margin-top:3px}
.btn:disabled{cursor:default;background:#e3e3e8;color:#4a4a5a;border-bottom-color:#b8b8c2}
.b-blue{background:var(--blue);color:#fff;border-bottom-color:var(--blue-d)}
.b-red{background:var(--red);color:#fff;border-bottom-color:var(--red-d)}
.b-green{background:var(--green);color:#fff;border-bottom-color:var(--green-d)}
.b-yellow{background:var(--yellow);color:var(--text);border-bottom-color:var(--yellow-d)}
.b-plain{background:var(--panel);color:var(--text);border-bottom-color:var(--panel-edge)}
.b-plain[aria-pressed="true"]{background:var(--blue-d);color:#fff;border-bottom-color:#0a2350}
.small{font-size:clamp(13px,3.4vw,16px);padding:4px 10px;min-height:44px}

main{flex:1;min-height:0;overflow-y:auto;padding:6px 12px 12px;display:flex;flex-direction:column;gap:10px}

/* menu */
.shelves{display:grid;grid-template-columns:1fr;gap:12px}
@media (min-width:600px){.shelves{grid-template-columns:1fr 1fr}}
.shelf{display:flex;align-items:center;gap:12px;text-align:left;padding:12px;background:var(--panel);border:3px solid var(--text);
  border-bottom:8px solid var(--text);border-radius:var(--r);min-height:84px}
.shelf .ic{font-size:40px;width:56px;text-align:center}
.shelf .nm{font-size:clamp(18px,5vw,24px);font-weight:800;display:block}
.shelf .st{font-size:clamp(14px,3.6vw,17px);color:var(--muted)}
.shelf.locked{border-style:dashed}
.trophy{text-align:center;padding:10px;background:var(--yellow);border-radius:var(--r);border-bottom:6px solid var(--yellow-d);font-weight:800;font-size:clamp(16px,4.4vw,22px)}
.menu-foot{display:flex;justify-content:center}

/* game */
.stage{flex:none;position:relative;background:var(--panel);border-radius:var(--r);border-bottom:6px solid var(--panel-edge);
  min-height:clamp(96px,19dvh,210px);display:flex;align-items:center;justify-content:center;gap:12px;padding:10px;overflow:hidden}
.theo{font-size:clamp(40px,11vw,64px);flex:none;transform-origin:50% 90%}
.theo.bob{animation:bob .5s ease}
@keyframes bob{40%{transform:translateY(-10px) rotate(-6deg)}80%{transform:translateY(0) rotate(4deg)}}
.bubble{position:relative;background:#fff;border:3px solid var(--text);border-radius:var(--r);padding:8px 12px;
  font-size:clamp(16px,4.4vw,22px);font-weight:700;max-width:70%;line-height:1.2}
.bubble::before{content:"";position:absolute;left:-12px;top:50%;margin-top:-8px;border:8px solid transparent;border-right-color:var(--text);border-left:0;width:0;height:0}
.scene{display:flex;flex-direction:column;align-items:center;gap:4px}
.scene .big{font-size:clamp(52px,15vw,104px);line-height:1.05;animation:pop .35s ease}
.scene .cap{font-size:clamp(17px,4.8vw,26px);font-weight:800;text-align:center}
.scene .num{position:absolute;left:10px;top:10px;background:var(--blue);color:#fff;font-weight:800;border-radius:var(--r);padding:2px 10px;font-size:clamp(16px,4.4vw,22px)}
@keyframes pop{0%{transform:scale(.4)}70%{transform:scale(1.12)}100%{transform:scale(1)}}

.info{display:flex;justify-content:space-between;align-items:center;font-size:clamp(14px,3.6vw,17px);color:var(--muted);font-weight:700}
.stars{color:var(--gold)}
.label{font-size:clamp(14px,3.6vw,17px);font-weight:800;margin:0 0 4px;color:var(--text)}
.row{display:grid;gap:8px}
.slot{position:relative;min-height:clamp(76px,20vw,116px);border:3px dashed #8a8a99;border-radius:var(--r);display:flex;align-items:center;justify-content:center;background:#fff}
.slot .n{position:absolute;left:4px;top:4px;background:var(--blue);color:#fff;font-weight:800;border-radius:3px;padding:0 6px;font-size:clamp(13px,3.6vw,18px);z-index:1}
.slot.empty .n{left:50%;top:50%;transform:translate(-50%,-50%);font-size:clamp(22px,6vw,34px);padding:2px 12px}
.block{width:100%;height:100%;min-height:clamp(76px,20vw,116px);background:#fff;border:3px solid var(--c,#1d5fc4);border-bottom:8px solid var(--cd,#123f86);
  border-radius:var(--r);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:14px 2px 4px;gap:2px}
.block .em{font-size:clamp(26px,7.6vw,46px);line-height:1}
.block .tx{font-size:clamp(10px,2.7vw,14px);font-weight:700;line-height:1.1;text-align:center;color:var(--text)}
.slot .block{position:absolute;inset:-3px;width:auto;height:auto}
.block.locked{border-color:var(--gold);border-bottom-color:#5c4700;cursor:default}
.block.locked::after{content:"✓";position:absolute;right:4px;top:2px;background:var(--gold);color:#fff;font-weight:800;border-radius:50%;width:22px;height:22px;
  display:flex;align-items:center;justify-content:center;font-size:14px}
.block.now{outline:4px solid var(--yellow);outline-offset:2px}
.block.wig{animation:wig .5s ease 2}
@keyframes wig{25%{transform:rotate(-7deg)}75%{transform:rotate(7deg)}}
.block.hint{animation:glow 1.2s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 0 6px var(--yellow)}}
.block.land{animation:pop .3s ease}
.tray{background:var(--panel);border-radius:var(--r);padding:8px;border-bottom:6px solid var(--panel-edge);min-height:clamp(96px,24vw,136px)}
.tray .emptymsg{text-align:center;color:var(--muted);font-weight:700;padding:20px 0;font-size:clamp(14px,3.6vw,17px)}
.actions{flex:none;display:flex;gap:6px;padding:6px 12px 10px;border-top:3px solid var(--panel)}
.actions .btn{flex:1 1 0;padding:6px 6px;white-space:nowrap;font-size:clamp(14px,3.8vw,20px)}
#playBtn{flex:1.8 1 0}
.row.n5 .block .em{font-size:clamp(20px,6vw,40px)}
.row.n5 .block .tx{font-size:clamp(9.5px,2.5vw,13px)}
.word{display:inline-flex;gap:3px;white-space:nowrap}

/* overlay */
.overlay{position:fixed;inset:0;background:rgba(27,16,48,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.card{background:#fff;border:4px solid var(--text);border-bottom:10px solid var(--text);border-radius:var(--r);padding:18px;width:min(420px,100%);text-align:center}
.card h2{margin:0 0 6px;font-size:clamp(26px,7vw,36px)}
.card .bigstars{font-size:clamp(34px,10vw,52px);letter-spacing:4px}
.card p{margin:6px 0 14px;font-size:clamp(16px,4.2vw,20px);color:var(--muted);font-weight:700}
.card .reel{font-size:clamp(26px,7vw,38px);margin:6px 0}
.card .btns{display:flex;flex-direction:column;gap:8px}

.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:30}
.confetti i{position:absolute;top:-20px;width:12px;height:16px;border-radius:2px;animation:fall 1.8s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
@media (prefers-reduced-motion:reduce){
  .block.wig,.block.hint,.theo.bob,.scene .big,.block.land{animation:none}
  .block.hint{box-shadow:0 0 0 6px var(--yellow)}
}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="toprow">
      <h1><span class="sr">Story Blocks</span><span aria-hidden="true" id="titleTiles"></span></h1>
      <div class="tools">
        <button class="btn b-plain small" id="soundBtn" aria-pressed="true">🔊 Sound</button>
        <button class="btn b-plain small" id="readBtn" aria-pressed="true">🗣️ Read</button>
      </div>
    </div>
    <p class="desc">Put the picture blocks in order (first, next, last), then press Play to watch your story!</p>
  </header>

  <main id="menu">
    <div class="trophy" id="trophy" hidden>🏆 Story Master! You finished every shelf!</div>
    <div class="shelves" id="shelves"></div>
    <div class="menu-foot"><button class="btn b-plain small" id="resetBtn">Clear my stars</button></div>
  </main>

  <main id="game" hidden>
    <div class="stage" id="stage" aria-live="polite"></div>
    <div class="info"><span id="where"></span><span class="stars" id="storyStars"></span></div>
    <div>
      <p class="label">Story spots</p>
      <div class="row" id="slots"></div>
    </div>
    <div class="tray">
      <p class="label">Toy box</p>
      <div class="row" id="tray"></div>
    </div>
  </main>
  <div class="actions" id="gameActions" hidden>
    <button class="btn b-green" id="playBtn">▶ Play the story</button>
    <button class="btn b-yellow" id="helpBtn">💡 Help</button>
    <button class="btn b-blue" id="backBtn">📚 Shelves</button>
  </div>
</div>

<div class="overlay" id="overlay" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="ovTitle">
    <h2 id="ovTitle">Ta-da!</h2>
    <div class="bigstars" id="ovStars"></div>
    <div class="reel" id="ovReel" aria-hidden="true"></div>
    <p id="ovMsg"></p>
    <div class="btns">
      <button class="btn b-green" id="nextBtn">Next story ▶</button>
      <button class="btn b-yellow" id="againBtn">🎬 Watch it again</button>
      <button class="btn b-blue" id="ovShelfBtn">📚 Shelves</button>
    </div>
  </div>
</div>
<div class="confetti" id="confetti"></div>

<script>
// ---------- data ----------
const SHELVES = [
  {name:"Little Stories", icon:"🌻", note:"3 blocks"},
  {name:"Day Stories", icon:"🌈", note:"3 blocks"},
  {name:"Four-Step Stories", icon:"🦋", note:"4 blocks"},
  {name:"Five-Step Stories", icon:"🚀", note:"5 blocks"},
];
const STORIES = [
  [ {name:"The Sunflower", steps:[["🌰","Plant a seed"],["🌱","A sprout pops up"],["🌻","A big sunflower!"]]},
    {name:"The Chick", steps:[["🥚","An egg"],["🐣","Crack! It hatches"],["🐥","A fluffy chick"]]},
    {name:"The Snowman", steps:[["🌨️","Snow falls"],["⛄","Build a snowman"],["☀️💧","The sun melts it"]]},
    {name:"Pizza Night", steps:[["🍅🧀","Add the toppings"],["🔥","Bake it hot"],["🍕😋","Yum, eat it!"]]} ],
  [ {name:"The Rainbow", steps:[["☁️","Clouds roll in"],["🌧️","Rain, rain!"],["🌈","A rainbow!"]]},
    {name:"Bedtime", steps:[["🛁","Take a bath"],["🪥","Brush your teeth"],["🛏️😴","Sleep tight"]]},
    {name:"The Birthday", steps:[["🎂","Here comes the cake"],["🕯️💨","Blow out the candles"],["🍰😋","Eat a slice"]]},
    {name:"One Whole Day", steps:[["🌅","The sun comes up"],["☀️","A sunny afternoon"],["🌙⭐","Night time"]]} ],
  [ {name:"The Apple", steps:[["🌸","Apple blossom"],["🍏","A little green apple"],["🍎","A big red apple"],["🥧","Apple pie!"]]},
    {name:"The Butterfly", steps:[["🥚🍃","A tiny egg on a leaf"],["🐛","A hungry caterpillar"],["🐛💤","A cosy cocoon nap"],["🦋","A butterfly!"]]},
    {name:"School Morning", steps:[["⏰","Wake up"],["🥣","Eat breakfast"],["🎒","Grab your backpack"],["🚌","Ride the bus"]]},
    {name:"The Sandcastle", steps:[["🪣","Fill the bucket"],["🏰","A sand castle"],["🚩🏰","Add a flag"],["🌊","Splash! A wave"]]} ],
  [ {name:"The Oak Tree", steps:[["🌰","An acorn"],["🌱","A sprout"],["🌿","A little plant"],["🌳","A big tree"],["🐿️🌳","A squirrel moves in"]]},
    {name:"Baking Cookies", steps:[["🥚🧈","Get eggs and butter"],["🥣","Stir it up"],["🔥","Bake in the oven"],["🍪","Cookies!"],["🥛🍪","Cookies and milk"]]},
    {name:"To the Moon", steps:[["👩‍🚀","Put on a space suit"],["🚀","3, 2, 1..."],["🔥🚀","Blast off!"],["🌕","Land on the moon"],["🚩","Plant a flag"]]},
    {name:"Puppy Bath", steps:[["🐶🟫","A muddy puppy"],["🛁","Hop in the tub"],["🫧","Scrub-a-dub"],["💦🐶","Shake, shake!"],["✨🐶","Squeaky clean!"]]} ],
];
const BLOCK_COLS = [["#1d5fc4","#123f86"],["#c1121f","#7d0b14"],["#1e7a3c","#11502a"],["#b39400","#6e5b00"],["#6b2fb3","#3f1a6b"]];
const KEY = "cowork-storyblocks-stars";
let saved = {};
try{ saved = JSON.parse(localStorage.getItem(KEY)||"{}")||{}; }catch(e){ saved = {}; }
const save = () => { try{ localStorage.setItem(KEY, JSON.stringify(saved)); }catch(e){} };
const sid = (s,i) => s+"-"+i;
const shelfStars = s => STORIES[s].reduce((a,_,i)=>a+(saved[sid(s,i)]||0),0);
const shelfDone = s => STORIES[s].every((_,i)=>saved[sid(s,i)]);

// ---------- sound: Woodblock Kit ----------
let AC=null, master=null, noiseBuf=null, soundOn=true, readOn=true;
function audio(){
  if(AC) { if(AC.state==="suspended") AC.resume(); return AC; }
  const C = window.AudioContext||window.webkitAudioContext; if(!C) return null;
  AC = new C();
  const comp = AC.createDynamicsCompressor();
  comp.threshold.value=-14; comp.ratio.value=4;
  master = AC.createGain(); master.gain.value = soundOn?0.9:0;
  master.connect(comp); comp.connect(AC.destination);
  noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
  const d = noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
  return AC;
}
function env(g,t,vol,att,rel){ g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(vol,t+att); g.gain.exponentialRampToValueAtTime(0.0001,t+att+rel); }
function noiseClick(t,freq,dur,vol,type="bandpass",q=4){
  const src=AC.createBufferSource(); src.buffer=noiseBuf;
  const f=AC.createBiquadFilter(); f.type=type; f.frequency.value=freq; f.Q.value=q;
  const g=AC.createGain(); env(g,t,vol,0.005,dur);
  src.connect(f); f.connect(g); g.connect(master); src.start(t, Math.random()*0.5); src.stop(t+dur+0.05);
}
function wood(freq,t,vol=0.5){
  const o=AC.createOscillator(); o.type="triangle"; o.frequency.setValueAtTime(freq*1.04,t); o.frequency.exponentialRampToValueAtTime(freq,t+0.02);
  const g=AC.createGain(); env(g,t,vol,0.005,0.06);
  o.connect(g); g.connect(master); o.start(t); o.stop(t+0.12);
  noiseClick(t, Math.min(3000, Math.max(1500,freq*2.5)), 0.03, vol*0.5);
}
function shaker(t,vol=0.25){ noiseClick(t,6500,0.12,vol,"highpass",0.7); }
const SFX = {
  tap(){ if(!audio()) return; noiseClick(AC.currentTime,2200,0.03,0.45); },
  place(i){ if(!audio()) return; wood(660+i*110, AC.currentTime, 0.5); },
  back(){ if(!audio()) return; const t=AC.currentTime; wood(520,t,0.35); noiseClick(t+0.05,1600,0.03,0.25); },
  step(i){ if(!audio()) return; const p=[523,587,659,784,880,1047][i]||1047; wood(p,AC.currentTime,0.55); },
  oops(){ if(!audio()) return; const t=AC.currentTime; wood(440,t,0.45); wood(330,t+0.16,0.45); },
  motif(){ if(!audio()) return; const t=AC.currentTime; [659,880,988,1319].forEach((f,i)=>wood(f,t+i*0.13,0.5)); shaker(t+0.55,0.3); },
  win(){ if(!audio()) return; const t=AC.currentTime; [784,988,1175,1568].forEach((f,i)=>wood(f,t+i*0.09,0.55)); shaker(t+0.4,0.3); shaker(t+0.6,0.3); shaker(t+0.8,0.25); },
};
function say(text){
  if(!readOn || !("speechSynthesis" in window)) return;
  try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(text.replace(/\.\.\./g,"")); u.rate=0.95; u.pitch=1.15; speechSynthesis.speak(u); }catch(e){}
}

// ---------- helpers ----------
const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r=>setTimeout(r,ms));
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function esc(s){ return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

// title tiles
{ let k=0; $("titleTiles").innerHTML = ["STORY","BLOCKS"].map(w=>`<span class="word">${w.split("").map(c=>`<span class="tile t${(k++)%3}">${c}</span>`).join("")}</span>`).join(""); }

// ---------- state ----------
let S = null; // {shelf, idx, story, n, slots, locked, tray, cols, tries, helped, playing, hint}

function showMenu(){
  if(S) S.playing=false;
  $("overlay").hidden=true; $("game").hidden=true; $("gameActions").hidden=true; $("menu").hidden=false;
  const box=$("shelves"); box.innerHTML="";
  SHELVES.forEach((sh,s)=>{
    const open = s===0 || shelfDone(s-1) || shelfStars(s)>0;
    const b=document.createElement("button");
    b.className="shelf"+(open?"":" locked");
    const st=shelfStars(s), done=STORIES[s].filter((_,i)=>saved[sid(s,i)]).length;
    b.innerHTML=`<span class="ic" aria-hidden="true">${sh.icon}</span><span><span class="nm">${sh.name}</span><span class="st">${sh.note} · ${done} of 4 stories · ⭐ ${st} of 12</span>${open?"":'<span class="st" style="display:block">Finish the shelf before, or tap to try!</span>'}</span>`;
    b.onclick=()=>{ SFX.tap(); startStory(s, firstUnfinished(s)); };
    box.appendChild(b);
  });
  $("trophy").hidden = !SHELVES.every((_,s)=>shelfDone(s));
}
function firstUnfinished(s){ const i=STORIES[s].findIndex((_,k)=>!saved[sid(s,k)]); return i<0?0:i; }

function startStory(shelf, idx){
  const story=STORIES[shelf][idx], n=story.steps.length;
  let tray; do{ tray=shuffle([...Array(n).keys()]); }while(tray.every((v,i)=>v===i));
  const cols=shuffle([...BLOCK_COLS]).slice(0,n);
  S={shelf,idx,story,n,slots:Array(n).fill(null),locked:Array(n).fill(false),tray,cols,tries:0,helped:false,playing:false,hint:null};
  $("menu").hidden=true; $("overlay").hidden=true; $("game").hidden=false; $("gameActions").hidden=false;
  $("slots").className=$("tray").className="row n"+n;
  $("slots").style.gridTemplateColumns=`repeat(${n},1fr)`;
  $("tray").style.gridTemplateColumns=`repeat(${n},1fr)`;
  theo(`“${story.name}”! What happens first?`);
  say(`${story.name}. What happens first?`);
  render();
}

function theo(msg){
  $("stage").innerHTML=`<span class="theo bob" aria-hidden="true">🧸</span><div class="bubble">${esc(msg)}</div>`;
}
function showScene(i, pos){
  const [em,cap]=S.story.steps[i];
  $("stage").innerHTML=`<span class="num">${pos+1}</span><div class="scene"><div class="big" aria-hidden="true">${em}</div><div class="cap">${esc(cap)}</div></div>`;
}

function blockHTML(b, extra=""){
  const [em,cap]=S.story.steps[b]; const [c,cd]=S.cols[b];
  return {cls:"block "+extra, style:`--c:${c};--cd:${cd}`, html:`<span class="em" aria-hidden="true">${em}</span><span class="tx">${esc(cap)}</span>`};
}

function render(){
  const {n}=S;
  $("where").textContent=`${SHELVES[S.shelf].name} · story ${S.idx+1} of 4`;
  const best=saved[sid(S.shelf,S.idx)]||0;
  $("storyStars").textContent = best ? "Best: "+"⭐".repeat(best) : "";
  // slots
  const sl=$("slots"); sl.innerHTML="";
  for(let i=0;i<n;i++){
    const d=document.createElement("div");
    const b=S.slots[i];
    d.className="slot"+(b===null?" empty":"");
    d.innerHTML=`<span class="n" aria-hidden="true">${i+1}</span>`;
    if(b===null){ d.insertAdjacentHTML("beforeend",`<span class="sr">Spot ${i+1}, empty</span>`); }
    else{
      const btn=document.createElement("button");
      const h=blockHTML(b, (S.locked[i]?"locked":"")+(S.hint&&S.hint.slot===i?" hint":"")+(S.justPlaced===i?" land":""));
      btn.className=h.cls; btn.style.cssText=h.style;
      btn.innerHTML=`<span class="sr">Spot ${i+1}: </span>`+h.html+(S.locked[i]?'<span class="sr"> (right spot)</span>':"");
      btn.dataset.slot=i;
      btn.onclick=()=>unplace(i);
      if(S.locked[i]) btn.setAttribute("aria-disabled","true");
      d.appendChild(btn);
    }
    sl.appendChild(d);
  }
  S.justPlaced=null;
  // tray
  const tr=$("tray"); tr.innerHTML="";
  if(!S.tray.length){ tr.style.gridTemplateColumns="1fr"; tr.innerHTML=`<div class="emptymsg">All the blocks are out!</div>`; }
  else{
    tr.style.gridTemplateColumns=`repeat(${n},1fr)`;
    S.tray.forEach(b=>{
      const btn=document.createElement("button");
      const h=blockHTML(b, S.hint&&S.hint.block===b?"hint":"");
      btn.className=h.cls; btn.style.cssText=h.style; btn.innerHTML=h.html; btn.dataset.block=b;
      btn.onclick=()=>place(b);
      tr.appendChild(btn);
    });
  }
  const full=S.slots.every(v=>v!==null);
  $("playBtn").disabled = !full || S.playing;
  $("helpBtn").disabled = S.playing;
  $("backBtn").disabled = false;
}

function place(b){
  if(!S||S.playing) return;
  const i=S.slots.indexOf(null); if(i<0) return;
  S.slots[i]=b; S.tray=S.tray.filter(x=>x!==b); S.justPlaced=i;
  if(S.hint && S.hint.block===b) S.hint=null;
  SFX.place(i);
  const cap=S.story.steps[b][1];
  if(S.slots.every(v=>v!==null)){ theo("All set! Press Play to watch the story."); say(cap+". All set! Press play."); }
  else { theo(`Spot ${i+1}: ${cap}. What comes next?`); say(cap); }
  render();
}
function unplace(i){
  if(!S||S.playing||S.locked[i]) return;
  const b=S.slots[i]; if(b===null) return;
  S.slots[i]=null; S.tray.push(b);
  if(S.hint && S.hint.slot===i) S.hint=null;
  SFX.back(); theo("Back in the toy box!");
  render();
}

function help(){
  if(!S||S.playing) return;
  SFX.tap();
  const i=S.slots.findIndex((v,k)=>v!==k);
  if(i<0) return;
  S.helped=true;
  if(S.slots[i]===null){
    // is an earlier empty spot? first empty slot gets the next block placed
    const firstEmpty=S.slots.indexOf(null);
    if(firstEmpty===i && S.tray.includes(i)){ S.hint={block:i}; theo(`Look for the glowing block. It goes in spot ${i+1}!`); say("Look for the glowing block!"); }
    else { // block i is sitting in a wrong spot somewhere
      const where=S.slots.indexOf(i);
      S.hint={slot:where}; theo("Tap the glowing block to put it back."); say("Tap the glowing block to put it back.");
    }
  } else {
    S.hint={slot:i}; theo(`Hmm, spot ${i+1} looks mixed up. Tap the glowing block to send it back.`); say("Tap the glowing block to send it back.");
  }
  render();
}

async function playStory(replay=false){
  if(!S||S.playing) return;
  if(!replay && !S.slots.every(v=>v!==null)) return;
  S.playing=true; S.hint=null; render();
  const token=S;
  for(let i=0;i<S.n;i++){
    if(S!==token||!S.playing) return;
    const b=S.slots[i];
    document.querySelectorAll("#slots .block").forEach(el=>el.classList.toggle("now", +el.dataset.slot===i));
    if(b!==i){
      // out of order
      const el=document.querySelector(`#slots .block[data-slot="${i}"]`);
      if(el) el.classList.add("wig");
      SFX.oops();
      const prev = i>0 ? S.story.steps[S.slots[i-1]][1] : null;
      theo(i===0 ? "Hmm! Does the story really start like that? Let's fix it." : `Hmm! Does that happen right after “${prev}”? Let's fix it.`);
      say("Hmm! That one is mixed up. Let's fix it.");
      await sleep(1100);
      if(S!==token||!S.playing) return;
      S.tries++;
      for(let k=0;k<S.n;k++){
        if(S.slots[k]===k) S.locked[k]=true;
        else if(S.slots[k]!==null){ S.tray.push(S.slots[k]); S.slots[k]=null; }
      }
      S.playing=false;
      if(S.tries>=2){ render(); help(); S.helped=false; S.helpedAuto=true; return; }
      render();
      return;
    }
    showScene(b,i); SFX.step(i); say(S.story.steps[b][1]);
    S.locked[i]=true;
    document.querySelectorAll(`#slots .block[data-slot="${i}"]`).forEach(el=>el.classList.add("locked"));
    await sleep(reduced?1300:1500);
  }
  if(S!==token||!S.playing) return;
  document.querySelectorAll("#slots .block").forEach(el=>el.classList.remove("now"));
  S.playing=false;
  finish(replay);
}

function finish(replay){
  SFX.win(); confetti();
  let stars = S.tries===0 && !S.helped ? 3 : (S.tries<=1 ? 2 : 1);
  if(S.helped && stars>2) stars=2;
  const id=sid(S.shelf,S.idx);
  if(!replay){ saved[id]=Math.max(saved[id]||0,stars); save(); S.stars=stars; }
  theo("The end! What a great story!");
  render();
  setTimeout(()=>showOverlay(), 650);
}

function showOverlay(){
  const s=S.stars||saved[sid(S.shelf,S.idx)]||1;
  const lastInShelf = S.idx===STORIES[S.shelf].length-1;
  const allDone = SHELVES.every((_,k)=>shelfDone(k));
  $("ovTitle").textContent = lastInShelf && shelfDone(S.shelf) ? "Shelf finished!" : "Ta-da!";
  $("ovStars").innerHTML = `<span aria-hidden="true">${"⭐".repeat(s)}${"☆".repeat(3-s)}</span><span class="sr">${s} of 3 stars</span>`;
  $("ovReel").textContent = S.story.steps.map(x=>x[0]).join(" ➜ ");
  const msgs=["Every block in the right spot, first try!","You fixed it and told the whole story!","You never gave up. The story is all done!"];
  let m = msgs[3-s];
  if(lastInShelf && shelfDone(S.shelf)) m += allDone ? " You finished EVERY shelf. Story Master!" : " The next shelf is open!";
  $("ovMsg").textContent = m;
  const next = nextStory();
  $("nextBtn").textContent = next ? (next[0]!==S.shelf ? "Next shelf ▶" : "Next story ▶") : "Play from the start ▶";
  $("overlay").hidden=false;
  setTimeout(()=>$("nextBtn").focus(),50);
}
function nextStory(){
  if(S.idx+1<STORIES[S.shelf].length) return [S.shelf,S.idx+1];
  if(S.shelf+1<SHELVES.length) return [S.shelf+1,0];
  return null;
}

function confetti(){
  if(reduced) return;
  const box=$("confetti"); box.innerHTML="";
  const cols=["#1d5fc4","#c1121f","#1e7a3c","#ffd60a","#6b2fb3"];
  for(let i=0;i<44;i++){
    const p=document.createElement("i");
    p.style.left=Math.random()*100+"%"; p.style.background=cols[i%cols.length];
    p.style.animationDelay=(Math.random()*0.6)+"s"; p.style.animationDuration=(1.4+Math.random()*1)+"s";
    box.appendChild(p);
  }
  setTimeout(()=>{ box.innerHTML=""; }, 3200);
}

// ---------- wiring ----------
$("playBtn").onclick=()=>{ SFX.tap(); playStory(false); };
$("helpBtn").onclick=help;
$("backBtn").onclick=()=>{ SFX.tap(); try{speechSynthesis.cancel();}catch(e){} showMenu(); };
$("ovShelfBtn").onclick=()=>{ SFX.tap(); showMenu(); };
$("nextBtn").onclick=()=>{ SFX.motif(); const nx=nextStory(); $("overlay").hidden=true; if(nx) startStory(nx[0],nx[1]); else startStory(0,0); };
$("againBtn").onclick=()=>{ SFX.tap(); $("overlay").hidden=true; playStory(true); };
$("soundBtn").onclick=()=>{
  soundOn=!soundOn; $("soundBtn").setAttribute("aria-pressed",soundOn); $("soundBtn").textContent=soundOn?"🔊 Sound":"🔇 Sound";
  if(master) master.gain.value=soundOn?0.9:0; if(soundOn) SFX.tap();
};
$("readBtn").onclick=()=>{
  readOn=!readOn; $("readBtn").setAttribute("aria-pressed",readOn); SFX.tap();
  if(!readOn){ try{speechSynthesis.cancel();}catch(e){} }
};
let resetArm=false;
$("resetBtn").onclick=()=>{
  SFX.tap();
  if(!resetArm){ resetArm=true; $("resetBtn").textContent="Tap again to clear"; setTimeout(()=>{resetArm=false; $("resetBtn").textContent="Clear my stars";},3000); return; }
  saved={}; save(); resetArm=false; $("resetBtn").textContent="Clear my stars"; showMenu();
};
document.addEventListener("pointerdown",()=>audio(),{once:true});
let greeted=false;
document.addEventListener("pointerdown",()=>{ if(!greeted){ greeted=true; setTimeout(()=>SFX.motif(),60);} },{once:true});
showMenu();
/* 27 Nov 2026: a double-tap must not press whatever button the next screen puts under the finger.
   A tap on a button is ignored if it lands within 400 ms and a fingertip's width of a tap on another button that has since left the screen.
   Buttons inside an element marked data-rapid are left alone (fast-tap play areas). */
(function () { let t0 = 0, el = null, x0 = 0, y0 = 0;
  document.addEventListener('click', e => { const b = e.target.closest && e.target.closest('button');
    if (!b || b.closest('[data-rapid]') || (!e.detail && !e.clientX && !e.clientY)) return;
    const now = performance.now(), gone = el && !(el.isConnected && el.getClientRects().length);
    if (now - t0 < 400 && b !== el && gone && Math.hypot(e.clientX - x0, e.clientY - y0) < 56) { e.stopPropagation(); e.preventDefault(); return; }
    t0 = now; el = b; x0 = e.clientX; y0 = e.clientY; }, true); })();
</script>
