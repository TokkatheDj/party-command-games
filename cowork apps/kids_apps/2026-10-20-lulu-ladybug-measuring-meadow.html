<!-- CONCEPT: SIZE & ORDERING (measuring) - Lulu's Measuring Meadow: tap HOP and Lulu the ladybug hops along a snake, pencil, carrot, scarf or log one ladybug-length at a time, leaving numbered footprints, then kids tap how long it is; four meadows climb from counting hops, to measuring two things and picking the longer, shorter or same, to measuring one thing with little Lulu hops AND big Gus-the-grasshopper hops (and seeing the bigger hopper needs fewer), to growing a stretchy scarf, snake or noodle to exactly the length an animal ordered; plus a Free Measure field and a saved Measuring Book of everything measured. No timer, no losing - a wrong answer just replays the counting footprints. Ages 4-11. -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Lulu's Measuring Meadow</title>
<style>
*, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
:root {
  --sky1: #8fd8ff; --sky2: #d9f4ff;
  --grass: #6cc94f; --grass-dark: #4aa83a;
  --red: #ff4d4d; --yellow: #ffd23f; --orange: #ff9f1c; --green: #2ec27e;
  --blue: #3a86ff; --purple: #9b5de5; --pink: #ff6fae;
  --ink: #2b2d42; --card: #ffffff; --shadow: rgba(43,45,66,0.18);
  --btn-h: 64px; --gap: 10px; --radius: 22px;
  --font: "Comic Sans MS", "Trebuchet MS", system-ui, sans-serif;
}
html, body {
  margin: 0; padding: 0; height: 100%; overflow: hidden;
  touch-action: manipulation; user-select: none; -webkit-user-select: none;
  font-family: var(--font); color: var(--ink);
  background: linear-gradient(180deg, var(--sky1), var(--sky2) 60%, #eaffd9);
}
button { font-family: inherit; cursor: pointer; border: none; color: var(--ink); }
.screen { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; }
.screen.on { display: flex; }
.screen[hidden] { display: none; }

/* ---------- title screen ---------- */
#home { justify-content: flex-start; padding: 14px 14px 18px; gap: 10px; overflow-y: auto; }
.title {
  margin: 4px 0 0; text-align: center; line-height: 1.05;
  font-size: clamp(30px, 9vw, 54px); font-weight: 900;
  background: linear-gradient(90deg, var(--red), var(--orange), var(--purple));
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.sub { margin: 0; font-size: clamp(14px, 4vw, 20px); text-align: center; opacity: .85; }
#homeArt { width: min(92vw, 420px); height: 120px; }
.menu { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; width: min(94vw, 520px); }
.mbtn {
  min-height: 96px; border-radius: var(--radius); background: var(--card);
  box-shadow: 0 6px 0 var(--shadow); padding: 8px 6px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  font-size: clamp(15px, 4.2vw, 21px); font-weight: 800; position: relative;
  transition: transform .1s;
}
.mbtn:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--shadow); }
.mbtn .ico { font-size: clamp(30px, 9vw, 42px); line-height: 1; }
.mbtn .stars { font-size: 14px; letter-spacing: 1px; min-height: 18px; }
.mbtn.wide { grid-column: 1 / -1; min-height: 70px; flex-direction: row; gap: 10px; }
.m1 { background: #fff3c4; } .m2 { background: #d6f5ff; } .m3 { background: #e5ffd6; } .m4 { background: #ffe0ef; }
.m5 { background: #ece0ff; } .m6 { background: #fff; }

/* ---------- play screen ---------- */
#play { padding: 8px 10px 10px; gap: 8px; }
.topbar { width: 100%; max-width: 720px; display: flex; align-items: center; gap: 8px; }
.round-btn {
  width: 52px; height: 52px; min-width: 52px; border-radius: 50%; background: var(--card);
  box-shadow: 0 4px 0 var(--shadow); font-size: 26px; display: flex; align-items: center; justify-content: center;
}
.round-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--shadow); }
.progress { flex: 1; display: flex; justify-content: center; gap: 6px; font-size: clamp(18px, 5vw, 26px); }
.progress span { opacity: .3; transition: opacity .3s, transform .3s; }
.progress span.got { opacity: 1; transform: scale(1.15); }
#bubble {
  width: 100%; max-width: 720px; background: var(--card); border-radius: 20px; padding: 8px 14px;
  font-size: clamp(17px, 4.8vw, 24px); font-weight: 800; text-align: center; min-height: 52px;
  display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 4px 0 var(--shadow);
  position: relative;
}
#bubble .big { font-size: 1.5em; }
#bubble.pop { animation: pop .35s; }
@keyframes pop { 0% { transform: scale(.92); } 60% { transform: scale(1.04); } 100% { transform: scale(1); } }
#sceneWrap { flex: 1; width: 100%; max-width: 720px; min-height: 0; position: relative; }
#scene { position: absolute; inset: 0; width: 100%; height: 100%; border-radius: 24px; display: block; }
#actions {
  width: 100%; max-width: 720px; display: flex; gap: var(--gap); justify-content: center; align-items: stretch;
  flex-wrap: wrap; min-height: var(--btn-h);
}
.abtn {
  flex: 1 1 0; min-width: 0; min-height: var(--btn-h); border-radius: var(--radius);
  font-size: clamp(22px, 6.5vw, 34px); font-weight: 900; background: var(--card);
  box-shadow: 0 6px 0 var(--shadow); display: flex; align-items: center; justify-content: center; gap: 8px;
  padding: 4px 8px; transition: transform .1s, background .2s;
}
.abtn:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--shadow); }
.abtn.hop { background: var(--red); color: #fff; font-size: clamp(26px, 8vw, 40px); }
.abtn.hop.gus { background: var(--green); }
.abtn.go { background: var(--yellow); }
.abtn.num { background: #fff7d1; font-size: clamp(30px, 9vw, 46px); }
.abtn.pick { flex-direction: column; gap: 0; font-size: clamp(16px, 4.5vw, 22px); background: #eef9ff; }
.abtn.pick .e { font-size: clamp(30px, 9vw, 42px); line-height: 1.1; }
.abtn.small { flex: 0 0 auto; width: var(--btn-h); font-size: 34px; }
.abtn.glow { animation: glow 0.9s infinite; }
@keyframes glow { 0%,100% { box-shadow: 0 6px 0 var(--shadow), 0 0 0 0 rgba(255,210,63,.9); } 50% { box-shadow: 0 6px 0 var(--shadow), 0 0 0 10px rgba(255,210,63,.0); background: #fff1a8; } }
.abtn.wobble { animation: wobble .45s; }
@keyframes wobble { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-8px) rotate(-3deg); } 40% { transform: translateX(8px) rotate(3deg); } 60% { transform: translateX(-5px); } 80% { transform: translateX(5px); } }
.abtn:disabled { opacity: .45; }
.lenbox { flex: 0 0 auto; min-width: 70px; display: flex; align-items: center; justify-content: center; font-size: clamp(26px, 8vw, 40px); font-weight: 900; }

/* ---------- overlays ---------- */
.overlay {
  position: absolute; inset: 0; background: rgba(43,45,66,.45); display: none; align-items: center; justify-content: center;
  z-index: 20; padding: 16px;
}
.overlay.on { display: flex; }
.card {
  background: var(--card); border-radius: 28px; padding: 18px 16px; width: min(94vw, 460px); max-height: 92vh; overflow-y: auto;
  text-align: center; box-shadow: 0 10px 0 var(--shadow); display: flex; flex-direction: column; align-items: center; gap: 10px;
}
.card h2 { margin: 0; font-size: clamp(26px, 7.5vw, 38px); }
.card .huge { font-size: clamp(54px, 16vw, 84px); line-height: 1; animation: bounce 1s infinite; }
@keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
.card .row { display: flex; gap: 10px; width: 100%; }
.card .row .abtn { font-size: clamp(18px, 5vw, 24px); }
#bookGrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; width: 100%; }
.bk { background: #fff7d1; border-radius: 16px; padding: 6px 4px; font-size: 15px; font-weight: 800; display: flex; flex-direction: column; align-items: center; }
.bk .e { font-size: 32px; }
.bk.empty { background: #f1f1f1; opacity: .55; }
.bk small { font-weight: 700; font-size: 12px; opacity: .8; }
#confetti { position: absolute; inset: 0; pointer-events: none; z-index: 30; width: 100%; height: 100%; }
#muteBtn.off { opacity: .5; }
</style>
</head>
<body>

<!-- HOME -->
<section id="home" class="screen on">
  <h1 class="title">Lulu's Measuring Meadow</h1>
  <p class="sub">🐞 Hop, hop, hop... how long is it?</p>
  <canvas id="homeArt"></canvas>
  <div class="menu">
    <button class="mbtn m1" data-ch="0"><span class="ico">🐍</span>Count the Hops<span class="stars" id="st0"></span></button>
    <button class="mbtn m2" data-ch="1"><span class="ico">⚖️</span>Longer or Shorter?<span class="stars" id="st1"></span></button>
    <button class="mbtn m3" data-ch="2"><span class="ico">🦗</span>Big Hops, Little Hops<span class="stars" id="st2"></span></button>
    <button class="mbtn m4" data-ch="3"><span class="ico">🧣</span>Make It Just Right<span class="stars" id="st3"></span></button>
    <button class="mbtn m5 wide" id="freeBtn"><span class="ico">📏</span>Free Measure</button>
    <button class="mbtn m6 wide" id="bookBtn"><span class="ico">📒</span>Measuring Book <span id="bookCount" style="font-size:15px;opacity:.7"></span></button>
  </div>
</section>

<!-- PLAY -->
<section id="play" class="screen">
  <div class="topbar">
    <button class="round-btn" id="homeBtn" aria-label="Home">🏠</button>
    <div class="progress" id="progress"></div>
    <button class="round-btn" id="muteBtn" aria-label="Sound">🔊</button>
  </div>
  <div id="bubble"></div>
  <div id="sceneWrap"><canvas id="scene"></canvas></div>
  <div id="actions"></div>
</section>

<!-- OVERLAYS -->
<div class="overlay" id="winOv">
  <div class="card">
    <div class="huge" id="winEmoji">🏆</div>
    <h2 id="winTitle">Meadow done!</h2>
    <p id="winText" style="margin:0;font-size:18px;font-weight:700"></p>
    <div class="row">
      <button class="abtn go" id="winAgain">🔁 Again</button>
      <button class="abtn" id="winHome">🏠 Home</button>
    </div>
  </div>
</div>
<div class="overlay" id="bookOv">
  <div class="card">
    <h2>📒 Measuring Book</h2>
    <p style="margin:0;font-weight:700">Everything Lulu has measured!</p>
    <div id="bookGrid"></div>
    <div class="row">
      <button class="abtn" id="bookReset" style="font-size:16px;flex:0 0 auto;width:auto;padding:4px 14px">🧽 Clear</button>
      <button class="abtn go" id="bookClose">👍 Close</button>
    </div>
  </div>
</div>
<canvas id="confetti"></canvas>

<script>
'use strict';
// ================= basics =================
const KEY = 'cowork-lulu-measuring-meadow-save';
const $ = id => document.getElementById(id);
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const shuffle = arr => { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const ease = p => p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
const fmt = x => (x % 1) ? (Math.floor(x) + '½') : String(x);

let save = { stars: [0, 0, 0, 0], resume: [0, 0, 0, 0], book: {}, muted: false };
try {
  const s = JSON.parse(localStorage.getItem(KEY));
  if (s && typeof s === 'object') save = Object.assign(save, s);
} catch (e) {}
if (!Array.isArray(save.stars) || save.stars.length !== 4) save.stars = [0, 0, 0, 0];
if (!Array.isArray(save.resume) || save.resume.length !== 4) save.resume = [0, 0, 0, 0];
if (!save.book || typeof save.book !== 'object') save.book = {};
function persist() { try { localStorage.setItem(KEY, JSON.stringify(save)); } catch (e) {} }

// ================= sound =================
let actx = null;
function audio() {
  if (save.muted) return null;
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }
  if (actx.state === 'suspended') actx.resume().catch(() => {});
  return actx;
}
function tone(f, dur = 0.15, type = 'sine', vol = 0.18, delay = 0, slideTo = 0) {
  const a = audio(); if (!a) return;
  const t = a.currentTime + delay;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.015);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur + 0.05);
}
const SCALE = [523, 587, 659, 784, 880, 1047, 1175, 1319, 1568, 1760, 2093, 2349, 2637];
const sfx = {
  hop(k) { tone(300, 0.12, 'triangle', 0.12, 0, 520); tone(SCALE[clamp(k - 1, 0, 12)], 0.22, 'sine', 0.16, 0.12); },
  big(k) { tone(150, 0.2, 'square', 0.05, 0, 320); tone(SCALE[clamp(k - 1, 0, 12)] / 2, 0.3, 'triangle', 0.2, 0.16); },
  done() { [784, 988, 1175, 1568].forEach((f, i) => tone(f, 0.18, 'sine', 0.14, i * 0.08)); },
  right() { [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.22, 'triangle', 0.15, i * 0.09)); },
  boing() { tone(220, 0.3, 'sine', 0.16, 0, 110); },
  stretch(up) { tone(up ? 300 : 520, 0.18, 'triangle', 0.1, 0, up ? 520 : 300); },
  tap() { tone(660, 0.06, 'sine', 0.08); },
  count(k) { tone(SCALE[clamp(k - 1, 0, 12)], 0.16, 'sine', 0.14); },
  fanfare() { [523, 659, 784, 1047, 784, 1047, 1319].forEach((f, i) => tone(f, 0.25, 'triangle', 0.15, i * 0.12)); },
  whoosh() { tone(900, 0.3, 'sine', 0.06, 0, 300); }
};
function speak(text) {
  if (save.muted || !('speechSynthesis' in window)) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.rate = 1.0; u.pitch = 1.25; u.volume = 0.9;
    speechSynthesis.speak(u);
  } catch (e) {}
}

// ================= drawing helpers =================
function rr(c, x, y, w, h, r) {
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  c.beginPath(); c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}
const OUT = '#3b2f2f';

// Every object is drawn so it spans exactly x .. x+w (that is what gets measured).
function drawSnake(c, x, y, w, h, t) {
  const hr = Math.min(h * 0.5, w * 0.3), hx = x + w - hr * 1.05;
  const N = Math.max(8, Math.round(w / 4));
  const pts = [];
  for (let i = 0; i <= N; i++) {
    const f = i / N, px = x + h * 0.08 + (hx - x - h * 0.08) * f;
    const amp = h * 0.2 * (1 - f * 0.85);
    pts.push([px, y + amp * Math.sin(f * w / h * 1.6 + t * 3)]);
  }
  c.lineCap = 'round'; c.lineJoin = 'round';
  for (let pass = 0; pass < 2; pass++) {
    for (let i = 1; i <= N; i++) {
      const f = i / N;
      c.strokeStyle = pass ? '#5cc83b' : OUT;
      c.lineWidth = (h * 0.16 + h * 0.5 * Math.sqrt(f)) + (pass ? 0 : 3);
      c.beginPath(); c.moveTo(pts[i - 1][0], pts[i - 1][1]); c.lineTo(pts[i][0], pts[i][1]); c.stroke();
    }
  }
  c.fillStyle = '#ffd23f';
  for (let i = 3; i < N - 1; i += 3) { c.beginPath(); c.arc(pts[i][0], pts[i][1], h * 0.08 + h * 0.06 * (i / N), 0, Math.PI * 2); c.fill(); }
  const hy = pts[N][1];
  c.fillStyle = '#5cc83b'; c.strokeStyle = OUT; c.lineWidth = 2;
  c.beginPath(); c.ellipse(hx, hy, hr * 1.05, hr * 0.85, 0, 0, Math.PI * 2); c.fill(); c.stroke();
  c.fillStyle = '#fff'; c.beginPath(); c.arc(hx + hr * 0.25, hy - hr * 0.3, hr * 0.28, 0, Math.PI * 2); c.fill();
  c.fillStyle = '#222'; c.beginPath(); c.arc(hx + hr * 0.32, hy - hr * 0.3, hr * 0.14, 0, Math.PI * 2); c.fill();
  c.strokeStyle = OUT; c.lineWidth = 1.5; c.beginPath(); c.arc(hx + hr * 0.3, hy + hr * 0.1, hr * 0.4, 0.3, 1.4); c.stroke();
}
function drawPencil(c, x, y, w, h) {
  const bh = h * 0.7, top = y - bh / 2;
  const e = Math.min(h * 0.6, w * 0.15), m = Math.min(h * 0.3, w * 0.08), tl = Math.min(h * 0.9, w * 0.25);
  c.lineWidth = 2; c.strokeStyle = OUT;
  rr(c, x, top, e + 4, bh, bh * 0.3); c.fillStyle = '#ff8fab'; c.fill(); c.stroke();
  c.fillStyle = '#b8c0cc'; c.fillRect(x + e, top, m, bh); c.strokeRect(x + e, top, m, bh);
  c.fillStyle = '#ffd23f'; c.fillRect(x + e + m, top, w - e - m - tl, bh); c.strokeRect(x + e + m, top, w - e - m - tl, bh);
  c.fillStyle = '#f4b400'; c.fillRect(x + e + m, top + bh * 0.62, w - e - m - tl, bh * 0.2);
  c.beginPath(); c.moveTo(x + w - tl, top); c.lineTo(x + w, y); c.lineTo(x + w - tl, top + bh); c.closePath();
  c.fillStyle = '#f2c894'; c.fill(); c.stroke();
  c.beginPath(); c.moveTo(x + w - tl * 0.35, y - bh * 0.18); c.lineTo(x + w, y); c.lineTo(x + w - tl * 0.35, y + bh * 0.18); c.closePath();
  c.fillStyle = '#444'; c.fill();
}
function drawCarrot(c, x, y, w, h) {
  const bh = h * 0.8;
  c.fillStyle = '#3fae49'; c.strokeStyle = OUT; c.lineWidth = 2;
  for (let i = -1; i <= 1; i++) {
    c.beginPath(); c.ellipse(x + bh * 0.35 + i * bh * 0.15, y - bh * 0.75, bh * 0.14, bh * 0.45, i * 0.4, 0, Math.PI * 2); c.fill(); c.stroke();
  }
  c.beginPath(); c.moveTo(x + bh * 0.4, y - bh / 2);
  c.quadraticCurveTo(x + w * 0.6, y - bh * 0.35, x + w, y);
  c.quadraticCurveTo(x + w * 0.6, y + bh * 0.35, x + bh * 0.4, y + bh / 2);
  c.arc(x + bh * 0.4, y, bh / 2, Math.PI / 2, Math.PI * 1.5);
  c.closePath(); c.fillStyle = '#ff8c1a'; c.fill(); c.stroke();
  c.strokeStyle = '#c96400'; c.lineWidth = 1.5;
  for (let f = 0.25; f < 0.85; f += 0.18) {
    const px = x + w * f; c.beginPath(); c.moveTo(px, y - bh * 0.3 * (1 - f)); c.lineTo(px + bh * 0.2, y - bh * 0.1 * (1 - f)); c.stroke();
  }
}
function drawBread(c, x, y, w, h) {
  const bh = h * 0.8;
  rr(c, x, y - bh / 2, w, bh, bh / 2);
  const g = c.createLinearGradient(0, y - bh / 2, 0, y + bh / 2); g.addColorStop(0, '#f4c27a'); g.addColorStop(1, '#c98a3c');
  c.fillStyle = g; c.fill(); c.strokeStyle = OUT; c.lineWidth = 2; c.stroke();
  c.strokeStyle = '#fbe3b5'; c.lineWidth = Math.max(2, bh * 0.1); c.lineCap = 'round';
  for (let px = x + bh * 0.7; px < x + w - bh * 0.5; px += bh * 1.1) {
    c.beginPath(); c.moveTo(px, y + bh * 0.22); c.lineTo(px + bh * 0.45, y - bh * 0.22); c.stroke();
  }
}
function drawScarf(c, x, y, w, h) {
  const bh = h * 0.75, top = y - bh / 2, fr = Math.min(h * 0.3, w * 0.12);
  c.save(); rr(c, x + fr, top, w - fr * 2, bh, 4); c.clip();
  const sw = h * 0.5; const cols = ['#ff4d4d', '#fff', '#3a86ff', '#fff'];
  for (let i = 0, px = x; px < x + w; i++, px += sw) { c.fillStyle = cols[i % 4]; c.fillRect(px, top, sw + 1, bh); }
  c.restore();
  c.strokeStyle = OUT; c.lineWidth = 2; rr(c, x + fr, top, w - fr * 2, bh, 4); c.stroke();
  c.strokeStyle = '#ff4d4d'; c.lineWidth = 2;
  for (let i = 0; i < 5; i++) {
    const yy = top + 3 + (bh - 6) * i / 4;
    c.beginPath(); c.moveTo(x + fr, yy); c.lineTo(x + 1, yy + (i - 2) * 1.5); c.stroke();
    c.beginPath(); c.moveTo(x + w - fr, yy); c.lineTo(x + w - 1, yy + (i - 2) * 1.5); c.stroke();
  }
}
function drawCrayon(c, x, y, w, h) {
  const bh = h * 0.68, top = y - bh / 2, tl = Math.min(h * 0.7, w * 0.2);
  c.strokeStyle = OUT; c.lineWidth = 2;
  rr(c, x, top, w - tl + 2, bh, 4); c.fillStyle = '#9b5de5'; c.fill(); c.stroke();

// --- Meadow 1: count the hops ---

      () => { setBubble(`The ${o.e} is <b>${tr.result}</b> ladybugs long! 🎉`, `The ${o.n} is ${tr.result} ladybugs long!`); later(finishRound, 1700); },

      R.locked = true;

    growControls(p, make, cr);

  setActions([hopBtn(cr)]);

    R.locked = true;
    setBubble(`The ${ro.e} is <b>${tr.result}</b>! Make the ${o.e} <b>${tr.result}</b> too!`, `The ${ro.n} is ${tr.result}. Now make the ${o.n} ${tr.result} long!`);

function growControls(p, tr, cr) {
  const [pe, pn] = p.pal, o = OBJS[p.obj];
  const ch = (d, el) => { if (changeLen(tr, cr, d, 10)) glowId(''); else wobble(el); };
  setActions([
    { html: '➖', cls: 'small', id: 'minusBtn', label: 'Shorter', on: el => ch(-1, el) },
    { html: '➕', cls: 'small', id: 'plusBtn', label: 'Longer', on: el => ch(1, el) },
    { html: '✅ Check', cls: 'go', id: 'checkBtn', on: () => {
      if (R.busy || R.locked) return;
      R.busy = true; resetMeasure(tr, cr, R.tracks.indexOf(tr)); glowId('');
      setBubble('Lulu checks... 👀', 'Let\'s check!');
      R.onTrackDone = t => {
        if (t.result === p.target) {
          tr.hl = 'good'; addBook(p.obj, 'lulu', t.result); sfx.right(); cheer($('checkBtn'));
          setBubble(`Just right! ${pe} loves it! 💖`, `Just right! ${pn} loves it!`);
          later(finishRound, 2000);
        } else {
          const longer = t.result < p.target;
          setBubble(`It's ${t.result}. ${pe} wants ${p.target}. Make it ${longer ? '<b>longer</b> ➕' : '<b>shorter</b> ➖'}`,
            `It's ${t.result}. ${pn} wants ${p.target}. Make it ${longer ? 'longer' : 'shorter'}!`);
          R.busy = false; glowId(longer ? 'plusBtn' : 'minusBtn');
        }
      };
      autoHop(cr);
    } }
  ]);
  if (o) cr.pointing = false;
}

// ================= free measure =================
function startFree() {
  G = { mode: 'free', obj: 0, kind: 'lulu', len: 5 };
  showScreen('play');
  newRound({ maxLen: 12, tracks: [mkTrack(OBJ_KEYS[0], 5, { ticks: true })], critters: [mkCritter('lulu', 0)] });
  R.onTrackDone = (tr, cr) => {
    addBook(tr.obj, cr.kind, tr.result);
    const o = OBJS[tr.obj], gus = cr.kind === 'gus';
    setBubble(`The ${o.e} is <b>${fmt(tr.result)}</b> ${gus ? '🦗' : '🐞'} long!`,
      `The ${o.n} is ${fmt(tr.result).replace('½', ' and a half')} ${gus ? 'grasshoppers' : 'ladybugs'} long!`);
  };
  freeUI();
  setBubble('Pick a thing, stretch it, then <b>HOP!</b>', 'Pick a thing, stretch it, then hop!');
}
function freeUI() {
  const tr = R.tracks[0], cr = R.critters[0], o = OBJS[tr.obj];
  setActions([
    { html: '🔄 ' + o.e, id: 'objBtn', label: 'Next thing', on: () => {
      if (R.busy) return;
      G.obj = (G.obj + 1) % OBJ_KEYS.length; tr.obj = OBJ_KEYS[G.obj]; resetMeasure(tr, cr, 0); sfx.tap();
      setBubble(`A ${OBJS[tr.obj].e}! Tap <b>HOP!</b>`, `A ${OBJS[tr.obj].n}!`); freeUI();
    } },
    { html: cr.kind === 'gus' ? '🦗' : '🐞', id: 'critBtn', label: 'Switch hopper', on: () => {
      G.kind = cr.kind === 'gus' ? 'lulu' : 'gus';
      R.critters[0] = mkCritter(G.kind, 0); resetMeasure(tr, null); sfx.tap();
      setBubble(G.kind === 'gus' ? 'Gus 🦗 does <b>BIG</b> hops!' : 'Lulu 🐞 does <b>little</b> hops!', G.kind === 'gus' ? 'Gus does big hops!' : 'Lulu does little hops!');
      freeUI();
    } },
    { html: '➖', cls: 'small', id: 'minusBtn', label: 'Shorter', on: el => { if (!changeLen(tr, cr, -1, 12)) wobble(el); } },
    { html: '➕', cls: 'small', id: 'plusBtn', label: 'Longer', on: el => { if (!changeLen(tr, cr, 1, 12)) wobble(el); } },
    { br: true },
    { html: cr.kind === 'gus' ? 'HOP! 🦗' : 'HOP! 🐞', cls: 'hop' + (cr.kind === 'gus' ? ' gus' : ''), id: 'hopBtn', on: () => {
      const c = R.critters[0];
      if (tr.settling) return;
      if (tr.done && !c.anim) resetMeasure(tr, c, 0);
      doHop(c);
    } }
  ]);
}

// ================= screens, book, init =================
function showScreen(name) {
  $('home').classList.toggle('on', name === 'home');
  $('play').classList.toggle('on', name === 'play');
  requestAnimationFrame(resize);
}
function goHome() {
  roundSeq++; R = null; G = null; pendingHop = null;
  try { if ('speechSynthesis' in window) speechSynthesis.cancel(); } catch (e) {}
  $('winOv').classList.remove('on');
  showScreen('home'); updateHome();
}
function updateHome() {
  for (let i = 0; i < 4; i++) {
    const n = save.stars[i] >= 5 ? 5 : clamp(save.resume[i] | 0, 0, 5);
    $('st' + i).textContent = '⭐'.repeat(n) + '☆'.repeat(5 - n);
  }
  $('bookCount').textContent = '(' + OBJ_KEYS.filter(k => save.book[k]).length + '/' + OBJ_KEYS.length + ')';
}
function openBook() {
  $('bookGrid').innerHTML = OBJ_KEYS.map(k => {
    const b = save.book[k], o = OBJS[k];
    if (!b) return `<div class="bk empty"><span class="e">❔</span><small>${cap(o.n)}</small></div>`;
    return `<div class="bk"><span class="e">${o.e}</span>${b.lulu ? '<span>' + fmt(b.lulu) + ' 🐞</span>' : ''}${b.gus ? '<span>' + fmt(b.gus) + ' 🦗</span>' : ''}<small>${cap(o.n)}</small></div>`;
  }).join('');
  $('bookReset').textContent = '🧽 Clear';
  $('bookOv').classList.add('on');
}

document.querySelectorAll('.mbtn[data-ch]').forEach(b => b.addEventListener('click', () => { sfx.tap(); startChapter(+b.dataset.ch); }));
$('freeBtn').addEventListener('click', () => { sfx.tap(); startFree(); });
$('bookBtn').addEventListener('click', () => { sfx.tap(); openBook(); });
$('bookClose').addEventListener('click', () => { $('bookOv').classList.remove('on'); updateHome(); });
$('bookReset').addEventListener('click', e => {
  const b = e.currentTarget;
  if (b.dataset.sure !== '1') { b.dataset.sure = '1'; b.textContent = 'Sure? 🧽'; return; }
  b.dataset.sure = ''; save.book = {}; persist(); openBook();
});
$('homeBtn').addEventListener('click', goHome);
$('winHome').addEventListener('click', goHome);
$('winAgain').addEventListener('click', () => { const ch = G ? G.ch : 0; $('winOv').classList.remove('on'); startChapter(ch, true); });
$('muteBtn').addEventListener('click', () => {
  save.muted = !save.muted; persist();
  $('muteBtn').classList.toggle('off', save.muted); $('muteBtn').textContent = save.muted ? '🔇' : '🔊';
  if (save.muted) { try { speechSynthesis.cancel(); } catch (e) {} }
});
$('muteBtn').classList.toggle('off', save.muted); $('muteBtn').textContent = save.muted ? '🔇' : '🔊';
document.addEventListener('pointerdown', () => audio(), { once: true });
window.addEventListener('resize', resize);

function frame(now) {
  if ($('play').classList.contains('on')) { stepAnims(now); render(now); }
  else drawHome(now);
  drawConfetti();
  requestAnimationFrame(frame);
}
updateHome(); resize(); requestAnimationFrame(frame);
window.__lulu = { get R() { return R; }, get G() { return G; }, save };
</script>
