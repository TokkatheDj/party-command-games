<!-- CONCEPT: COZY / SILLY - Hiccup Dragon: Ember the baby dragon has the hiccups, and every HIC! puffs a surprise (bubbles, socks, ducks, donuts, a rare golden crown) out of his mouth that kids tap to catch into a saved Hiccup Jar of 18 treasures; to cure him, kids try six silly cures that each work a different way - tap a glass for three big gulps, rub his tummy with a tickle feather, wait for his cheeks to puff then shout BOO!, press and hold while he holds his breath to five, roll him head-over-heels three times, and drag a spoon of honey to his mouth - and each cure knocks one hiccup off the meter. Four hiccup fits (morning to bedtime) grow from 3 to 6 hiccups, ending in a party, plus a Free Play mode where tapping Ember makes him hic on demand. No timer, no losing - a too-early BOO or a let-go breath just gets a giggle and another go. Ages 4-11. -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Hiccup Dragon</title>
<style>
:root{
  --sky1:#8fd3ff; --sky2:#e6f7ff;
  --hill1:#7bd389; --hill2:#5cbf6e;
  --drag:#ff7a45; --dragDark:#e85d2a; --belly:#ffd98a; --wing:#ffb347; --horn:#fff3c4;
  --ink:#3b2457; --card:#fffaf0; --accent1:#ff5fa2; --accent2:#ffb800; --accent3:#7c5cff;
  --good:#3ccf7a; --btn:#ffffff; --shadow:0 6px 0 rgba(0,0,0,.15);
  --bottomH:clamp(150px, 25vh, 196px);
  --font:"Comic Sans MS","Trebuchet MS",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none;font-family:var(--font);color:var(--ink);background:#ffe9f3}
button{font-family:inherit;cursor:pointer;color:var(--ink)}
#app{position:relative;display:flex;flex-direction:column;height:100vh;height:100dvh;max-width:820px;margin:0 auto;background:#fff6e5;overflow:hidden}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 10px;background:linear-gradient(90deg,#fff0f7,#fff7dc);flex:0 0 auto}
h1{margin:0;font-size:clamp(22px,6vw,34px);background:linear-gradient(90deg,var(--accent1),var(--accent2),var(--accent3));-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:.5px;white-space:nowrap}
.hbtn{min-width:56px;height:52px;border:none;border-radius:16px;background:var(--btn);box-shadow:var(--shadow);font-size:26px;display:flex;align-items:center;justify-content:center;gap:4px;padding:0 10px}
.hbtn:active{transform:translateY(3px);box-shadow:0 3px 0 rgba(0,0,0,.15)}
#jarCount{font-size:16px;font-weight:bold;color:var(--accent3)}
#jarBtn.bump{animation:bump .45s}
@keyframes bump{40%{transform:scale(1.25) rotate(-8deg)}}
#hud{flex:0 0 auto;display:flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:4px 8px;background:#fff0f7}
#hud .lbl{font-size:24px}
.chip{min-width:46px;height:34px;border-radius:17px;background:linear-gradient(180deg,#c9f1ff,#8fd8ff);border:3px solid #fff;box-shadow:0 2px 0 rgba(0,0,0,.15);font-weight:bold;font-size:13px;display:flex;align-items:center;justify-content:center;color:#1e5f99}
.chip.gone{animation:chipPop .5s forwards}
@keyframes chipPop{40%{transform:scale(1.5)}100%{transform:scale(0);opacity:0}}
.freeTag{font-size:clamp(16px,4.4vw,22px);font-weight:bold;color:var(--accent3)}
#stage{position:relative;flex:1 1 auto;min-height:0;overflow:hidden;background:linear-gradient(180deg,var(--sky1),var(--sky2));transition:background 1s;touch-action:none}
.sun{position:absolute;right:6%;top:5%;font-size:clamp(34px,9vw,56px);animation:sunBob 6s ease-in-out infinite}
@keyframes sunBob{50%{transform:translateY(6px) rotate(8deg)}}
.cloud{position:absolute;width:110px;height:36px;background:#fff;border-radius:30px;opacity:.85}
.cloud::before{content:"";position:absolute;width:50px;height:50px;border-radius:50%;background:#fff;left:18px;top:-24px}
.cloud::after{content:"";position:absolute;width:38px;height:38px;border-radius:50%;background:#fff;left:56px;top:-16px}
.cloud.c1{top:12%;animation:drift 38s linear infinite}
.cloud.c2{top:26%;transform:scale(.7);animation:drift 55s linear infinite -20s}
@keyframes drift{from{left:-140px}to{left:110%}}
.hill{position:absolute;border-radius:50%}
.hill.h1{width:130%;height:46%;left:-40%;bottom:-26%;background:var(--hill1)}
.hill.h2{width:120%;height:40%;right:-45%;bottom:-24%;background:var(--hill2)}
.night .cloud{opacity:.25}
#emberWrap{position:absolute;left:50%;top:56%;width:min(64vw,40vh,330px);aspect-ratio:200/210;transform:translate(-50%,-50%);z-index:2}
#emberSpin{width:100%;height:100%;transition:transform .6s cubic-bezier(.4,1.4,.6,1)}
#ember{width:100%;height:100%;transform-origin:50% 92%;cursor:pointer}
#ember svg{width:100%;height:100%;display:block;overflow:visible;transition:filter .4s}
#ember .mouth{display:none}
#ember[data-mouth="smile"] .m-smile,#ember[data-mouth="o"] .m-o,#ember[data-mouth="laugh"] .m-laugh,#ember[data-mouth="flat"] .m-flat,#ember[data-mouth="scared"] .m-scared{display:inline}
.cheek,.eyelid,.wing,.headG,.pupil,.belly{transform-box:fill-box;transform-origin:center}
.cheek{transition:transform .25s}
.eyelid{transform:scaleY(0);transform-origin:top center}
#ember.blink .eyelid{animation:blink .18s}
@keyframes blink{50%{transform:scaleY(1)}}
.wing.wl{transform-origin:right center;animation:flapL 1.6s ease-in-out infinite}
.wing.wr{transform-origin:left center;animation:flapR 1.6s ease-in-out infinite}
@keyframes flapL{50%{transform:rotate(-12deg)}}
@keyframes flapR{50%{transform:rotate(12deg)}}
#ember{animation:breathe 2.6s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.02,.98)}}
#ember.windup .cheek{transform:scale(1.9)}
#ember.windup .headG{transform:scale(1.05,.95)}
#ember.hic{animation:hic .38s ease-out}
@keyframes hic{0%{transform:none}30%{transform:translateY(-14%) scale(.94,1.08)}62%{transform:scale(1.08,.92)}100%{transform:none}}
#ember.laugh{animation:wiggle .22s linear infinite}
@keyframes wiggle{25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}
#ember.scared{animation:scared .7s ease-out}
@keyframes scared{0%{transform:none}25%{transform:translateY(-22%) scale(.9,1.12)}35%{transform:translateY(-22%) rotate(-6deg)}45%{transform:translateY(-22%) rotate(6deg)}100%{transform:none}}
#ember.holding svg{filter:hue-rotate(-75deg) saturate(1.3)}
#ember.holding .headG{transform:scale(1.1)}
#ember.holding .cheek{transform:scale(2.1)}
#ember.holding{animation:shiver .12s linear infinite}
@keyframes shiver{50%{transform:translateX(1.5px)}}
#ember.gulp .headG{animation:gulp .3s}
@keyframes gulp{50%{transform:translateY(4%) scale(1,.94)}}
#ember.happy{animation:happyHop .6s ease-in-out 3}
@keyframes happyHop{50%{transform:translateY(-10%) scale(1.04)}}
#ember.dizzy .pupil{animation:dizzy .5s linear infinite}
@keyframes dizzy{to{transform:rotate(360deg) translateX(1px)}}
#mouthRing{position:absolute;left:50%;top:52.4%;width:22%;aspect-ratio:1;border-radius:50%;border:5px dashed #ffd400;transform:translate(-50%,-50%);display:none;animation:ring 1s linear infinite;pointer-events:none}
@keyframes ring{to{transform:translate(-50%,-50%) rotate(360deg)}}
#speech{position:absolute;left:50%;top:-6%;transform:translate(-50%,-100%) scale(0);background:#fff;border-radius:22px;padding:8px 16px;font-size:clamp(20px,5.5vw,30px);font-weight:bold;white-space:nowrap;box-shadow:0 4px 0 rgba(0,0,0,.12);transition:transform .25s cubic-bezier(.4,1.6,.6,1);z-index:3}
#speech::after{content:"";position:absolute;left:50%;bottom:-12px;margin-left:-10px;border:10px solid transparent;border-top-color:#fff;border-bottom:0}
#speech.show{transform:translate(-50%,-100%) scale(1)}
#floaters{position:absolute;inset:0;z-index:4;pointer-events:none}
.item{position:absolute;left:0;top:0;width:72px;height:72px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:42px;pointer-events:auto;cursor:pointer;background:radial-gradient(circle at 32% 30%,rgba(255,255,255,.95),rgba(255,255,255,.35) 30%,rgba(190,235,255,.25) 70%,rgba(255,255,255,.7));border:2px solid rgba(255,255,255,.9);will-change:transform}
.item.rare{box-shadow:0 0 18px 6px #ffe066}
.hictext{position:absolute;font-size:clamp(26px,7vw,40px);font-weight:900;color:#fff;-webkit-text-stroke:2px var(--accent1);text-shadow:0 3px 0 var(--accent1);animation:hicTxt .8s ease-out forwards;pointer-events:none;transform:translate(-50%,-50%)}
@keyframes hicTxt{0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}25%{opacity:1;transform:translate(-50%,-90%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-200%) scale(1)}}
.fly{position:fixed;z-index:60;font-size:42px;pointer-events:none;transition:transform .65s cubic-bezier(.5,-.3,.7,1),opacity .65s}
#count{position:absolute;left:50%;top:16%;transform:translate(-50%,-50%);font-size:clamp(56px,16vw,96px);font-weight:900;color:#fff;-webkit-text-stroke:3px var(--accent3);z-index:5;pointer-events:none;display:none}
#count.tick{animation:tick .3s}
@keyframes tick{40%{transform:translate(-50%,-50%) scale(1.35)}}
#feather{position:absolute;left:0;top:0;font-size:56px;pointer-events:none;z-index:6;display:none;transform-origin:20% 80%}
#toast{position:absolute;left:50%;top:10px;transform:translate(-50%,-160%);background:#fff;border-radius:20px;padding:8px 16px;font-size:clamp(17px,4.6vw,24px);font-weight:bold;box-shadow:0 4px 0 rgba(0,0,0,.12);z-index:8;transition:transform .35s cubic-bezier(.4,1.5,.6,1);white-space:nowrap;display:flex;align-items:center;gap:8px}
#toast.show{transform:translate(-50%,0)}
#toast .big{font-size:34px}
#bottom{position:relative;flex:0 0 var(--bottomH);z-index:6;background:linear-gradient(180deg,#fff3c9,#ffe0ee)}
#tray{position:absolute;inset:0;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:1fr 1fr;gap:8px;padding:8px}
.cure{position:relative;border:none;border-radius:20px;background:var(--btn);box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60px;padding:2px}
.cure .e{font-size:clamp(28px,8vw,40px);line-height:1.1}
.cure .n{font-size:clamp(13px,3.6vw,17px);font-weight:bold}
.cure:active{transform:translateY(3px);box-shadow:0 3px 0 rgba(0,0,0,.15)}
.cure.done{background:#e8ffe9;opacity:.75}
.cure.done::after{content:"✔";position:absolute;right:8px;top:4px;font-size:22px;color:var(--good);font-weight:bold}
.cure.nudge{animation:nudge 1.2s ease-in-out infinite}
@keyframes nudge{50%{transform:scale(1.06);box-shadow:0 6px 0 rgba(0,0,0,.15),0 0 0 5px #ffd400}}
#curebar{position:absolute;inset:0;display:grid;grid-template-columns:62px 1fr;grid-template-rows:auto 1fr;gap:6px;padding:8px}
#curebar .back{grid-row:1/3;border:none;border-radius:18px;background:#fff;box-shadow:var(--shadow);font-size:26px;min-height:60px}
#curebar .tip{font-size:clamp(15px,4.2vw,21px);font-weight:bold;text-align:center;line-height:1.2}
#curebar .ctrl{display:flex;align-items:center;justify-content:center;gap:14px;min-height:0}
.pips{display:flex;gap:8px}
.pip{width:22px;height:22px;border-radius:50%;background:#fff;border:3px solid var(--accent3)}
.pip.on{background:var(--accent2);border-color:var(--accent2);animation:bump .3s}
.bigBtn{border:none;border-radius:24px;background:linear-gradient(180deg,#fff,#ffeef7);box-shadow:var(--shadow);font-size:40px;min-width:120px;min-height:72px;padding:4px 18px;font-weight:bold;display:flex;align-items:center;justify-content:center;gap:8px;touch-action:none}
.bigBtn small{font-size:20px}
.bigBtn:active,.bigBtn.pressed{transform:translateY(3px);box-shadow:0 3px 0 rgba(0,0,0,.15)}
.glass{position:relative;width:74px;height:96px;border:4px solid #8ccff5;border-top:none;border-radius:0 0 18px 18px;background:rgba(255,255,255,.7);overflow:hidden;box-shadow:var(--shadow);padding:0}
.glass .water{position:absolute;left:0;right:0;bottom:0;height:80%;background:linear-gradient(180deg,#9fe3ff,#48b7f0);transition:height .35s}
.booBtn{font-size:30px;background:linear-gradient(180deg,#9be59b,#4fbf5f);color:#fff;-webkit-text-stroke:1px #2c7a37}
.booBtn.ready{animation:readyGlow .5s ease-in-out infinite;background:linear-gradient(180deg,#ffe36b,#ffb800);color:#fff}
@keyframes readyGlow{50%{transform:scale(1.1);box-shadow:0 0 0 8px rgba(255,212,0,.5)}}
.wobble{animation:wob .4s}
@keyframes wob{25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
.holdBtn{width:96px;height:96px;border-radius:50%;font-size:44px;min-width:0;padding:0}
.meterBar{width:min(60vw,320px);height:22px;border-radius:11px;background:#fff;border:3px solid var(--accent1);overflow:hidden}
.meterBar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent1),var(--accent2));transition:width .15s}
.spoon{position:relative;z-index:20;width:84px;height:84px;border-radius:50%;background:#fff;box-shadow:var(--shadow);font-size:40px;display:flex;align-items:center;justify-content:center;touch-action:none;cursor:grab;border:none}
.spoon.dragging{cursor:grabbing;box-shadow:0 12px 18px rgba(0,0,0,.25)}
.spoon.back{transition:transform .35s cubic-bezier(.4,1.5,.6,1)}
.handHint{font-size:34px;animation:hint 1.4s ease-in-out infinite}
@keyframes hint{0%,100%{transform:translate(0,0)}50%{transform:translate(0,-26px)}}
.overlay{position:absolute;z-index:30}
#titleOv{left:0;right:0;bottom:0;background:var(--card);border-radius:28px 28px 0 0;box-shadow:0 -6px 20px rgba(0,0,0,.12);padding:14px 16px 18px;display:flex;flex-direction:column;align-items:center;gap:10px}
#titleOv h2{margin:0;font-size:clamp(20px,5.6vw,30px);text-align:center}
.dots{display:flex;gap:10px;font-size:28px}
.dots span{opacity:.3;filter:grayscale(1)}
.dots span.on{opacity:1;filter:none}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;width:100%}
.mainBtn{border:none;border-radius:22px;min-height:64px;padding:8px 20px;font-size:clamp(20px,5.4vw,28px);font-weight:bold;box-shadow:var(--shadow);background:linear-gradient(180deg,#ff8cc0,var(--accent1));color:#fff;flex:1 1 140px;max-width:300px}
.mainBtn.alt{background:linear-gradient(180deg,#b6a4ff,var(--accent3))}
.mainBtn.alt2{background:linear-gradient(180deg,#ffd76b,var(--accent2));color:#5b3a00}
.mainBtn:active{transform:translateY(3px);box-shadow:0 3px 0 rgba(0,0,0,.15)}
.smallBtn{border:none;background:none;font-size:16px;text-decoration:underline;min-height:44px;padding:0 10px;color:#8a6fa8}
#winCard{left:50%;bottom:4%;transform:translateX(-50%);width:min(92%,440px);background:var(--card);border-radius:26px;box-shadow:0 8px 0 rgba(0,0,0,.12);padding:14px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;animation:cardIn .5s cubic-bezier(.4,1.5,.6,1)}
#winCard h2{margin:0;font-size:clamp(22px,6vw,32px)}
#winCard .loot{font-size:28px;letter-spacing:2px;max-width:100%;overflow:hidden;white-space:nowrap}
@keyframes cardIn{from{transform:translate(-50%,40px) scale(.6);opacity:0}}
#jarOv{inset:0;background:rgba(59,36,87,.55);display:flex;align-items:center;justify-content:center;padding:12px}
#jarOv .panel{background:var(--card);border-radius:26px;width:min(100%,480px);max-height:100%;overflow:auto;padding:14px;display:flex;flex-direction:column;align-items:center;gap:10px}
#jarOv h2{margin:0;font-size:clamp(22px,6vw,30px)}
.jarGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:8px;width:100%}
.slot{position:relative;aspect-ratio:1;border-radius:18px;background:#eef8ff;display:flex;align-items:center;justify-content:center;font-size:36px;border:3px solid #cfeaff}
.slot.missing{font-size:26px;color:#b9a9d6;background:#f3effa;border-style:dashed;border-color:#ddd2ef}
.slot b{position:absolute;right:4px;bottom:2px;font-size:13px;color:var(--accent3)}
.slot.rare{border-color:#ffd400;background:#fff8d6}
.hidden{display:none!important}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
@media (min-height:820px){#emberWrap{top:54%}}
</style>
</head>
<body>
<div id="app">
  <header>
    <button id="homeBtn" class="hbtn" aria-label="Home">🏠</button>
    <h1>Hiccup Dragon</h1>
    <button id="jarBtn" class="hbtn" aria-label="Hiccup Jar">🫙<span id="jarCount">0</span></button>
  </header>
  <div id="hud"></div>
  <div id="stage">
    <div class="sun" id="sun">☀️</div>
    <div class="cloud c1"></div><div class="cloud c2"></div>
    <div class="hill h1"></div><div class="hill h2"></div>
    <div id="emberWrap">
      <div id="speech"></div>
      <div id="emberSpin"><div id="ember" data-mouth="smile"></div></div>
      <div id="mouthRing"></div>
    </div>
    <div id="floaters"></div>
    <div id="count"></div>
    <div id="feather">🪶</div>
    <div id="toast"></div>
    <div id="winCard" class="overlay hidden"></div>
  </div>
  <div id="bottom">
    <div id="tray"></div>
    <div id="curebar" class="hidden"></div>
  </div>
  <div id="titleOv" class="overlay">
    <h2>Ember has the hiccups! 🐉</h2>
    <div class="dots" id="dots"></div>
    <div class="row">
      <button class="mainBtn" id="playBtn">▶ Play</button>
      <button class="mainBtn alt" id="freeBtn">🎈 Free Play</button>
    </div>
    <div class="row">
      <button class="mainBtn alt2" id="jarBtn2">🫙 My Jar</button>
    </div>
    <button class="smallBtn hidden" id="resetBtn">↺ Start over</button>
  </div>
  <div id="jarOv" class="overlay hidden">
    <div class="panel">
      <h2>🫙 Hiccup Jar</h2>
      <div id="jarSub" style="font-size:18px;font-weight:bold"></div>
      <div class="jarGrid" id="jarGrid"></div>
      <button class="mainBtn" id="jarClose" style="flex:0 0 auto;min-width:160px">👍 OK</button>
    </div>
  </div>
</div>
<canvas id="confetti"></canvas>
<script>
const $ = s => document.querySelector(s);
const rand = (a, b) => a + Math.random() * (b - a);

// ---------- data ----------
const ITEMS = [
  {e:'🫧', n:'Bubble', w:10}, {e:'🍿', n:'Popcorn', w:10}, {e:'🦋', n:'Butterfly', w:8},
  {e:'🧦', n:'Sock', w:8}, {e:'⭐', n:'Star', w:8}, {e:'🌸', n:'Flower', w:8},
  {e:'🦆', n:'Duck', w:7}, {e:'🎵', n:'Music', w:7}, {e:'🎈', n:'Balloon', w:7},
  {e:'🍩', n:'Donut', w:6}, {e:'🐟', n:'Fish', w:6}, {e:'🍪', n:'Cookie', w:6},
  {e:'❄️', n:'Snowflake', w:5}, {e:'🐸', n:'Frog', w:5}, {e:'🔔', n:'Bell', w:5},
  {e:'🍒', n:'Cherries', w:5}, {e:'🌈', n:'Rainbow', w:2, rare:true}, {e:'👑', n:'Golden Crown', w:1, rare:true}
];
const CURES = [
  {id:'water',   e:'🥛', n:'Sip'},
  {id:'feather', e:'🪶', n:'Tickle'},
  {id:'boo',     e:'👻', n:'BOO!'},
  {id:'breath',  e:'🤐', n:'Hold'},
  {id:'flip',    e:'🙃', n:'Roll'},
  {id:'honey',   e:'🍯', n:'Honey'}
];
const FITS = [
  {hics:3, sky:['#8fd3ff','#e6f7ff'], hills:['#7bd389','#5cbf6e'], sun:'☀️',  food:'🥞'},
  {hics:4, sky:['#6fc3ff','#fff1c4'], hills:['#8fdc72','#63c25a'], sun:'🌤️', food:'🍕'},
  {hics:5, sky:['#ff8f8b','#ffd29d'], hills:['#9bbf5a','#7aa648'], sun:'🌅', food:'🍦'},
  {hics:6, sky:['#272a6b','#5c4fa3'], hills:['#3f6d58','#2f5a48'], sun:'🌙', food:'🥛', night:true}
];
const WIN_LINES = ['Hooray! No more hiccups!', 'Phew! All better!', 'Ahhh… quiet at last!', 'Ember is all better!'];

// ---------- save ----------
const SAVE_KEY = 'cowork-hiccupdragon-save';
const S = {jar:{}, fits:0};
try {
  const s = JSON.parse(localStorage.getItem(SAVE_KEY));
  if (s && typeof s === 'object') { S.jar = (s.jar && typeof s.jar === 'object') ? s.jar : {}; S.fits = Math.max(0, Math.min(4, s.fits | 0)); }
} catch (e) {}
const save = () => { try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) {} };
const foundCount = () => ITEMS.filter(it => S.jar[it.e]).length;

// ---------- Ember SVG ----------
const EMBER_SVG = `
<svg viewBox="0 0 200 210" aria-label="Ember the dragon">

// ---------- audio ----------
let AC = null;
function ac() {
  try {
    if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
  } catch (e) { AC = null; }
  return AC;
}
function tone(f, d, {type = 'sine', vol = .18, to = null, delay = 0} = {}) {
  const a = ac(); if (!a) return;
  const t = a.currentTime + delay;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (to) o.frequency.exponentialRampToValueAtTime(to, t + d);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(g).connect(a.destination);
  o.start(t); o.stop(t + d + 0.05);
}
function noise(d, {vol = .15, freq = 1200, delay = 0, q = 1} = {}) {
  const a = ac(); if (!a) return;
  const b = a.createBuffer(1, Math.max(1, Math.floor(a.sampleRate * d)), a.sampleRate);
  const ch = b.getChannelData(0);
  for (let i = 0; i < ch.length; i++) ch[i] = (Math.random() * 2 - 1) * (1 - i / ch.length);
  const s = a.createBufferSource(); s.buffer = b;
  const f = a.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q;
  const g = a.createGain(); g.gain.value = vol;
  s.connect(f).connect(g).connect(a.destination);
  s.start(a.currentTime + delay);
}
const SND = {
  hic()    { tone(240, .12, {type:'square', vol:.06, to:760}); tone(480, .09, {vol:.16, to:1250, delay:.02}); noise(.05, {vol:.12, freq:2500}); },
  pop()    { tone(900, .09, {to:220, vol:.2}); },
  chime()  { [784, 988, 1175].forEach((f, i) => tone(f, .25, {type:'triangle', vol:.12, delay:i * .06})); },
  newItem(){ [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, .3, {type:'triangle', vol:.13, delay:i * .08})); },
  gulp()   { tone(230, .12, {to:110, vol:.28}); tone(190, .12, {to:95, vol:.22, delay:.13}); },
  giggle() { for (let i = 0; i < 4; i++) tone(i % 2 ? 720 : 940, .07, {type:'triangle', vol:.1, delay:i * .07}); },
  boo()    { tone(170, .35, {type:'sawtooth', vol:.07, to:85}); tone(1100, .28, {type:'square', vol:.05, to:1900, delay:.22}); },
  miss()   { tone(392, .12, {type:'triangle', vol:.12}); tone(330, .16, {type:'triangle', vol:.12, delay:.12}); },
  pfff()   { noise(.45, {vol:.25, freq:900, q:.6}); tone(500, .3, {to:200, vol:.06, type:'triangle'}); },
  whoosh() { noise(.4, {vol:.22, freq:600, q:.8}); tone(300, .35, {to:700, vol:.05}); },
  tick(n)  { tone(392 + n * 70, .14, {type:'triangle', vol:.16}); },
  munch()  { for (let i = 0; i < 3; i++) noise(.06, {vol:.25, freq:1500, delay:i * .12}); tone(660, .2, {type:'triangle', vol:.1, delay:.4}); },
  sigh()   { tone(620, .9, {to:240, vol:.12}); },
  fanfare(){ [523, 659, 784, 1047, 784, 1047, 1319].forEach((f, i) => tone(f, i === 6 ? .6 : .22, {type:'triangle', vol:.14, delay:i * .13})); },
  hee()    { tone(880, .1, {type:'triangle', vol:.12, to:1100}); tone(1100, .12, {type:'triangle', vol:.1, to:1400, delay:.1}); }

function mouthPoint() {

// ---------- surprises ----------
function pickItem() {
  const missing = ITEMS.filter(it => !S.jar[it.e] && !(it.e === '👑' && S.fits < 2));
  if (missing.length && Math.random() < .4) return missing[Math.floor(Math.random() * missing.length)];
  const pool = ITEMS.filter(it => !(it.e === '👑' && S.fits < 2 && G.mode !== 'free'));
  let tot = pool.reduce((s, it) => s + it.w, 0), r = Math.random() * tot;
  for (const it of pool) { r -= it.w; if (r <= 0) return it; }
  return pool[0];
}
function spawnItem(p) {
  if (G.items.length >= 9) { const old = G.items.shift(); old.el.remove(); }
  const it = pickItem();
  const el = document.createElement('div');
  el.className = 'item' + (it.rare ? ' rare' : '');
  el.textContent = it.e;
  const o = {el, it, x:p.x, y:p.y - 10, vx:rand(-110, 110), vy:rand(-62, -48), t:0, ph:rand(0, 6)};
  el.addEventListener('pointerdown', ev => { ev.stopPropagation(); ev.preventDefault(); catchItem(o); });
  $('#floaters').appendChild(el);
  G.items.push(o);
  placeItem(o);
}
function placeItem(o) {
  const wx = Math.sin(o.t * 2.2 + o.ph) * 14;
  const sc = Math.min(1, .2 + o.t * 4);
  o.el.style.transform = `translate(${o.x + wx - 36}px,${o.y - 36}px) scale(${sc}) rotate(${Math.sin(o.t * 1.6 + o.ph) * 12}deg)`;
}
function updateItems(dt) {
  const w = stage.clientWidth;
  for (const o of G.items) {
    o.t += dt;
    o.x += o.vx * dt; o.vx *= Math.pow(.25, dt);
    o.y += o.vy * dt;
    if (o.x < 40) { o.x = 40; o.vx = Math.abs(o.vx); }
    if (o.x > w - 40) { o.x = w - 40; o.vx = -Math.abs(o.vx); }
    if (o.y < -50) o.dead = true;
    placeItem(o);
  }
  G.items = G.items.filter(o => { if (o.dead) o.el.remove(); return !o.dead; });
}
function catchItem(o) {
  if (o.dead) return;
  o.dead = true;
  G.items = G.items.filter(x => x !== o);
  ac();
  const r = o.el.getBoundingClientRect();
  o.el.remove();
  const isNew = !S.jar[o.it.e];
  S.jar[o.it.e] = (S.jar[o.it.e] || 0) + 1;
  save();
  const fly = document.createElement('div');
  fly.className = 'fly'; fly.textContent = o.it.e;
  fly.style.left = (r.left + r.width / 2 - 21) + 'px'; fly.style.top = (r.top + r.height / 2 - 26) + 'px';
  document.body.appendChild(fly);
  const jr = $('#jarBtn').getBoundingClientRect();
  requestAnimationFrame(() => requestAnimationFrame(() => {
    fly.style.transform = `translate(${jr.left + jr.width / 2 - (r.left + r.width / 2)}px,${jr.top + jr.height / 2 - (r.top + r.height / 2)}px) scale(.35)`;
    fly.style.opacity = '.4';
  }));
  setTimeout(() => { fly.remove(); updateJarCount(); restartAnim($('#jarBtn'), 'bump'); }, 660);
  if (isNew) {
    SND.newItem();
    toast(`<span class="big">${o.it.e}</span> NEW! ${o.it.n}`);
    if (o.it.rare) confettiBurst(r.left + r.width / 2, r.top, 60);
    if (foundCount() === ITEMS.length) later(() => { toast('🫙 Jar full! WOW! 🎉', 2600); confettiBurst(innerWidth / 2, innerHeight / 3, 140); SND.fanfare(); }, 900);
  } else SND.pop();
}

function renderHud() {

// ---------- cures ----------
const TIPS = {
  water:   '👆 Tap the glass 3 times!',
  feather: '👆↔️ Tickle his tummy!',
  boo:     '😮 Puffy cheeks? Then BOO!',
  breath:  '✋ Press and HOLD to 5!',
  flip:    '🙃 Tap ROLL 3 times!',
  honey:   '🥄 Drag honey to his mouth!'
};
function pips(n, on) { let s = '<div class="pips">'; for (let i = 0; i < n; i++) s += `<div class="pip${i < on ? ' on' : ''}"></div>`; return s + '</div>'; }

function startCure(id) {
  ac();
  if (G.busy || G.done || G.cure) return;
  if (G.mode === 'play' && G.used[id]) { SND.miss(); say('✔ Done! Try another!', 1300); return; }
  document.querySelectorAll('.cure.nudge').forEach(b => b.classList.remove('nudge'));
  G.idleHics = 0;
  G.cure = id;
  const bar = $('#curebar');
  bar.innerHTML = `<button class="back" aria-label="Back">✖</button><div class="tip">${TIPS[id]}</div><div class="ctrl" id="ctrl"></div>`;
  bar.querySelector('.back').addEventListener('click', cancelCure);
  $('#tray').classList.add('hidden');
  bar.classList.remove('hidden');
  const ctrl = $('#ctrl');
  SND.chime();

  if (id === 'water') {
    G.gulps = 0;
    ctrl.innerHTML = `<button class="glass" id="glass" aria-label="Glass of water"><div class="water"></div></button>${pips(3, 0)}`;
    $('#glass').addEventListener('click', sip);
  } else if (id === 'feather') {
    G.tickle = 0; G.tickleNext = 220;
    ctrl.innerHTML = `<span style="font-size:40px">🪶</span><div class="meterBar"><i id="tickleFill"></i></div>`;
    say('Hee? 🪶', 1000);
  } else if (id === 'boo') {
    ctrl.innerHTML = `<button class="bigBtn booBtn" id="booBtn">🌳👻 BOO!</button>`;
    $('#booBtn').addEventListener('pointerdown', ev => { ev.preventDefault(); boo(); });
    if (G.windupStart) $('#booBtn').classList.add('ready');
  } else if (id === 'breath') {
    G.windupStart = 0; ember.classList.remove('windup'); setMouth('smile');
    ctrl.innerHTML = `<button class="bigBtn holdBtn" id="holdBtn" aria-label="Hold">🤐</button>`;
    const hb = $('#holdBtn');
    hb.addEventListener('pointerdown', ev => {
      ev.preventDefault();
      try { hb.setPointerCapture(ev.pointerId); } catch (e) {}
      if (G.hold) return;
      G.hold = {start: performance.now(), n: 0};
      hb.classList.add('pressed');
      ember.classList.add('holding'); setMouth('flat');
      $('#count').style.display = 'block'; $('#count').textContent = '';
    });
    const letGo = () => {
      hb.classList.remove('pressed');
      if (!G.hold) return;
      G.hold = null;
      ember.classList.remove('holding');
      $('#count').style.display = 'none';
      SND.pfff(); setMouth('o'); say('Pfff! 😆 Again!', 1300);
      later(() => { if (G.cure === 'breath') setMouth('smile'); }, 500);
    };
    hb.addEventListener('pointerup', letGo);
    hb.addEventListener('pointercancel', letGo);
  } else if (id === 'flip') {
    G.rolls = 0;
    ctrl.innerHTML = `<button class="bigBtn" id="rollBtn">🙃 <small>ROLL</small></button>${pips(3, 0)}`;
    $('#rollBtn').addEventListener('click', roll);
  } else if (id === 'honey') {
    ctrl.innerHTML = `<span class="handHint">☝️</span><button class="spoon" id="spoon" aria-label="Honey spoon">🍯</button>`;
    $('#mouthRing').style.display = 'block';
    setupSpoon($('#spoon'));
    say('Ooh, honey? 😋', 1200);
  }
}
function cancelCure() {
  G.cure = null; G.hold = null;
  showTray(); setMouth('smile'); renderTray();
}
function cureWorked(id) {
  const wasPlay = G.mode === 'play';
  G.cure = null; G.hold = null;
  if (wasPlay) G.used[id] = true;
  G.busy = true; G.windupStart = 0;
  ember.classList.remove('windup', 'holding', 'laugh');
  showTray(); renderTray();
  setMouth('smile');
  later(() => say('… … ?', 1100), 500);
  later(() => {
    if (wasPlay) { G.left = Math.max(0, G.left - 1); popChip(); }
    if (wasPlay && G.left <= 0) { cured(); return; }
    later(() => {
      G.busy = false;
      if (wasPlay) { say(G.left === 1 ? 'Almost! HIC!' : 'Uh-oh… HIC!', 1100); }
      doHic();
    }, 900);
  }, 1300);
}

function sip() {
  if (G.cure !== 'water' || G.gulps >= 3) return;
  G.gulps++;
  SND.gulp();
  $('#glass .water').style.height = (80 * (3 - G.gulps) / 3) + '%';
  document.querySelectorAll('#ctrl .pip').forEach((p, i) => p.classList.toggle('on', i < G.gulps));
  setMouth('o'); restartAnim(ember, 'gulp');
  later(() => { ember.classList.remove('gulp'); if (G.cure === 'water') setMouth('smile'); }, 320);
  if (G.gulps >= 3) { say('Glug! 💧', 900); later(() => cureWorked('water'), 450); }
}

function boo() {
  if (G.cure !== 'boo') return;
  const bb = $('#booBtn');
  if (G.windupStart) {
    G.windupStart = 0;
    ember.classList.remove('windup');
    bb.classList.remove('ready');
    SND.boo(); setMouth('scared');
    restartAnim(ember, 'scared');
    say('EEP! 😱', 1100);
    later(() => { ember.classList.remove('scared'); cureWorked('boo'); }, 750);
  } else {
    SND.miss();
    restartAnim(bb, 'wobble');
    say('👀 Huh? Wait…', 1000);
  }
}

function roll() {
  if (G.cure !== 'flip' || G.rolling || G.rolls >= 3) return;
  G.rolling = true;
  G.rolls++;
  G.rot += 360;
  emberSpin.style.transform = `rotate(${G.rot}deg)`;
  SND.whoosh();
  document.querySelectorAll('#ctrl .pip').forEach((p, i) => p.classList.toggle('on', i < G.rolls));
  setMouth('laugh');
  setTimeout(() => {
    G.rolling = false;
    if (G.cure === 'flip') setMouth('smile');
    if (G.rolls >= 3 && G.cure === 'flip') {
      ember.classList.add('dizzy'); say('Wheee! 😵‍💫', 1100);
      later(() => { ember.classList.remove('dizzy'); cureWorked('flip'); }, 700);
    }
  }, 620);
}

function setupSpoon(sp) {
  let st = null;
  sp.addEventListener('pointerdown', ev => {
    ev.preventDefault(); ac();
    try { sp.setPointerCapture(ev.pointerId); } catch (e) {}
    st = {x: ev.clientX, y: ev.clientY};
    sp.classList.remove('back'); sp.classList.add('dragging');
    const hh = document.querySelector('.handHint'); if (hh) hh.style.visibility = 'hidden';
  });
  sp.addEventListener('pointermove', ev => {
    if (!st) return;
    sp.style.transform = `translate(${ev.clientX - st.x}px,${ev.clientY - st.y}px) scale(1.1)`;
    const r = sp.getBoundingClientRect(), m = $('#mouthRing').getBoundingClientRect();
    const near = Math.hypot(r.left + r.width / 2 - (m.left + m.width / 2), r.top + r.height / 2 - (m.top + m.height / 2)) < Math.max(90, m.width * 1.4);
    setMouth(near ? 'o' : 'smile');
  });
  const up = () => {
    if (!st) return;
    st = null;
    sp.classList.remove('dragging');
    const r = sp.getBoundingClientRect(), m = $('#mouthRing').getBoundingClientRect();
    const d = Math.hypot(r.left + r.width / 2 - (m.left + m.width / 2), r.top + r.height / 2 - (m.top + m.height / 2));
    if (d < Math.max(90, m.width * 1.4) && G.cure === 'honey') {
      sp.style.opacity = '0';
      $('#mouthRing').style.display = 'none';
      SND.munch(); setMouth('o'); restartAnim(ember, 'gulp');
      say('Yum! 🍯', 1000);
      later(() => cureWorked('honey'), 700);
    } else {
      sp.classList.add('back');
      sp.style.transform = '';
      setMouth('smile');
      const hh = document.querySelector('.handHint'); if (hh) hh.style.visibility = '';
    }
  };
  sp.addEventListener('pointerup', up);
  sp.addEventListener('pointercancel', up);
}

// tickle feather + taps on Ember
let tickleDown = false, lastPt = null, laughT = 0;
function inEmber(x, y) {
  const r = ember.getBoundingClientRect(), px = r.width * .08;
  return x > r.left - px && x < r.right + px && y > r.top - px && y < r.bottom + px;
}
function addTickle(d) {
  G.tickle += d;
  $('#tickleFill') && ($('#tickleFill').style.width = Math.min(100, G.tickle / 14) + '%');
  ember.classList.add('laugh'); setMouth('laugh');
  clearTimeout(laughT);
  laughT = setTimeout(() => { ember.classList.remove('laugh'); if (G.cure === 'feather') setMouth('smile'); }, 320);
  if (G.tickle >= G.tickleNext) { G.tickleNext += 240; SND.giggle(); }
  if (G.tickle >= 1400 && G.cure === 'feather') {
    G.cure = 'featherDone';
    say('Hee hee hee! 🤣', 1100);
    $('#feather').style.display = 'none';
    later(() => { ember.classList.remove('laugh'); cureWorked('feather'); }, 600);
  }
}
function moveFeather(x, y) {
  const f = $('#feather'), sr = stage.getBoundingClientRect();
  f.style.display = 'block';
  f.style.transform = `translate(${x - sr.left - 10}px,${y - sr.top - 50}px) rotate(${Math.sin(performance.now() / 80) * 18}deg)`;
}
stage.addEventListener('pointerdown', ev => {
  ac();
  if (G.cure === 'feather') {
    tickleDown = true; lastPt = {x: ev.clientX, y: ev.clientY};
    moveFeather(ev.clientX, ev.clientY);
    if (inEmber(ev.clientX, ev.clientY)) addTickle(160);
    return;
  }
  if (!inEmber(ev.clientX, ev.clientY)) return;
  if (G.cure === 'flip') { roll(); return; }
  if (G.cure || G.busy || G.done) return;
  if (G.mode === 'free' || G.mode === 'title') {
    if (performance.now() - (G.lastTapHic || 0) > 280) { G.lastTapHic = performance.now(); doHic(); }
  } else if (G.mode === 'play') {
    SND.hee(); say('Hee! Help me! 🙏', 1100);
  }
});
stage.addEventListener('pointermove', ev => {
  if (G.cure !== 'feather') return;
  moveFeather(ev.clientX, ev.clientY);
  if (!tickleDown || !lastPt) return;
  const d = Math.hypot(ev.clientX - lastPt.x, ev.clientY - lastPt.y);
  lastPt = {x: ev.clientX, y: ev.clientY};
  if (inEmber(ev.clientX, ev.clientY)) addTickle(Math.min(d, 60));
});
const endTickle = () => { tickleDown = false; lastPt = null; };
stage.addEventListener('pointerup', endTickle);
stage.addEventListener('pointercancel', endTickle);
stage.addEventListener('pointerleave', endTickle);

// ---------- modes ----------
function setSky(i) {
  const f = FITS[i];
  stage.style.setProperty('--sky1', f.sky[0]); stage.style.setProperty('--sky2', f.sky[1]);
  stage.style.setProperty('--hill1', f.hills[0]); stage.style.setProperty('--hill2', f.hills[1]);
  $('#sun').textContent = f.sun;
  stage.classList.toggle('night', !!f.night);
}
function resetScene() {
  G.gen++;
  G.cure = null; G.busy = false; G.done = false; G.windupStart = 0; G.hold = null; G.idleHics = 0;
  ember.className = ''; setMouth('smile');
  G.rot = 0; emberSpin.style.transition = 'none'; emberSpin.style.transform = '';
  void emberSpin.offsetWidth; emberSpin.style.transition = '';
  $('#winCard').classList.add('hidden');
  showTray();
  scheduleNext(performance.now(), 1200, 1800);
}
function showTitle() {
  resetScene();
  G.mode = 'title';
  setSky(Math.min(S.fits, 3));
  $('#titleOv').classList.remove('hidden');
  const d = $('#dots'); d.innerHTML = '';
  FITS.forEach((f, i) => { const s = document.createElement('span'); s.textContent = f.sun; if (i < S.fits) s.className = 'on'; d.appendChild(s); });
  $('#playBtn').textContent = S.fits >= 4 ? '↺ Play again' : S.fits > 0 ? '▶ Keep going' : '▶ Play';
  $('#resetBtn').classList.toggle('hidden', S.fits === 0);
  renderHud(); renderTray();
}
function startFit(i) {
  resetScene();
  G.mode = 'play'; G.fit = i; G.left = FITS[i].hics; G.used = {};
  setSky(i);
  $('#titleOv').classList.add('hidden');
  renderHud(); renderTray();
  say(`${FITS[i].food} Too fast! HIC!`, 1600);
  scheduleNext(performance.now(), 900, 1200);
}
function startFree() {
  resetScene();
  G.mode = 'free';
  $('#titleOv').classList.add('hidden');
  setSky(Math.floor(Math.random() * 4));
  renderHud(); renderTray();
  say('Tap me! HIC!', 1400);
}
function cured() {
  G.done = true; G.busy = true;
  ember.className = 'happy'; setMouth('smile');
  SND.sigh();
  say('Ahhhh… 😌', 1500);
  const last = G.fit >= FITS.length - 1;
  S.fits = Math.max(S.fits, G.fit + 1); save();
  later(() => {
    SND.fanfare();
    confettiBurst(innerWidth / 2, innerHeight * .35, 160);
    if (last) emojiRain();
    const wc = $('#winCard');
    const loot = ITEMS.filter(it => S.jar[it.e]).map(it => it.e).join('');
    wc.innerHTML = last
      ? `<h2>🎂 Party time! 🎉</h2><div style="font-size:clamp(17px,4.6vw,22px);font-weight:bold">${WIN_LINES[3]}</div><div class="loot">${loot || '🫧🍿🦋'}</div>
         <div class="row"><button class="mainBtn" id="wcAgain">↺ Play again</button><button class="mainBtn alt" id="wcHome">🏠</button></div>`
      : `<h2>🎉 ${WIN_LINES[G.fit]}</h2><div style="font-size:34px">${FITS.map((f, i) => i <= G.fit ? f.sun : '⚪').join(' ')}</div>
         <div class="row"><button class="mainBtn" id="wcNext">Next ${FITS[G.fit + 1].sun} ▶</button><button class="mainBtn alt" id="wcHome">🏠</button></div>`;
    wc.classList.remove('hidden');
    $('#wcHome').addEventListener('click', showTitle);
    if (last) $('#wcAgain').addEventListener('click', () => startFit(0));
    else $('#wcNext').addEventListener('click', () => startFit(G.fit + 1));
  }, 1400);
}

// ---------- jar ----------
function openJar() {
  ac();
  const g = $('#jarGrid'); g.innerHTML = '';
  ITEMS.forEach(it => {
    const n = S.jar[it.e] || 0;
    const d = document.createElement('div');
    d.className = 'slot' + (n ? '' : ' missing') + (n && it.rare ? ' rare' : '');
    d.innerHTML = n ? `${it.e}<b>×${n}</b>` : '❓';
    d.title = n ? it.n : '???';
    g.appendChild(d);
  });
  $('#jarSub').textContent = `${foundCount()} / ${ITEMS.length} found`;
  $('#jarOv').classList.remove('hidden');
}
$('#jarBtn').addEventListener('click', openJar);
$('#jarBtn2').addEventListener('click', openJar);
$('#jarClose').addEventListener('click', () => { $('#jarOv').classList.add('hidden'); scheduleNext(performance.now(), 800, 1300); });
$('#homeBtn').addEventListener('click', () => { ac(); $('#jarOv').classList.add('hidden'); showTitle(); });
$('#playBtn').addEventListener('click', () => { ac(); startFit(S.fits >= 4 ? 0 : S.fits); });
$('#freeBtn').addEventListener('click', () => { ac(); startFree(); });
$('#resetBtn').addEventListener('click', () => { S.fits = 0; save(); SND.pop(); showTitle(); });

// ---------- confetti ----------
const cv = $('#confetti'), cx = cv.getContext('2d');
let parts = [];
function sizeCanvas() { cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio; }
addEventListener('resize', sizeCanvas); sizeCanvas();
const CCOL = ['#ff5fa2', '#ffb800', '#7c5cff', '#3ccf7a', '#36b6ff', '#ff7a45'];
function confettiBurst(x, y, n) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, Math.PI * 2), s = rand(200, 620);
    parts.push({x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 300, r: rand(4, 9), c: CCOL[i % CCOL.length], rot: rand(0, 6), vr: rand(-8, 8), life: rand(1.6, 2.8)});
  }
}
function emojiRain() {
  const found = ITEMS.filter(it => S.jar[it.e]).map(it => it.e);
  const pool = found.length >= 3 ? found : ['🫧', '🍿', '🦋', '🎈', '⭐'];
  for (let i = 0; i < 40; i++) {
    parts.push({x: rand(0, innerWidth), y: rand(-innerHeight * .8, -30), vx: rand(-30, 30), vy: rand(80, 200), e: pool[i % pool.length], rot: 0, vr: rand(-2, 2), life: 5, g: .15});
  }
}
function drawParts(dt) {
  if (!parts.length) { cx.clearRect(0, 0, cv.width, cv.height); return; }
  cx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
  cx.clearRect(0, 0, innerWidth, innerHeight);
  for (const p of parts) {
    p.vy += 900 * (p.g ?? 1) * dt; p.vx *= .99;
    p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt; p.life -= dt;
    cx.save(); cx.translate(p.x, p.y); cx.rotate(p.rot);
    cx.globalAlpha = 1;
    if (p.e) { cx.fillStyle = '#000'; cx.font = '34px serif'; cx.textAlign = 'center'; cx.textBaseline = 'middle'; cx.fillText(p.e, 0, 0); }
    else { cx.fillStyle = p.c; cx.fillRect(-p.r, -p.r / 2, p.r * 2, p.r); }
    cx.restore();
  }
  parts = parts.filter(p => p.life > 0 && p.y < innerHeight + 60);
}

// ---------- main loop ----------
function loop(t) {
  requestAnimationFrame(loop);
  const dt = Math.min(.05, (t - (G.last || t)) / 1000);
  G.last = t;
  if (!hicsPaused()) {
    if (!G.windupStart && t >= G.nextHic) startWindup(t);
    else if (G.windupStart && t >= G.windupStart + G.windupLen) {
      doHic();
      if (G.mode === 'play' && !G.cure) {
        G.idleHics = (G.idleHics || 0) + 1;
        if (G.idleHics >= 3 && !document.querySelector('.cure.nudge')) {
          const b = document.querySelector('.cure:not(.done)');
          if (b) b.classList.add('nudge');
        }
      }
    }
  }
  if (G.hold && G.cure === 'breath') {
    const el = t - G.hold.start, n = Math.min(5, Math.floor(el / 700) + 1);
    if (n !== G.hold.n) {
      G.hold.n = n; SND.tick(n);
      const c = $('#count'); c.textContent = n; restartAnim(c, 'tick');
    }
    if (el >= 3500) {
      G.hold = null;
      const hb = $('#holdBtn'); if (hb) hb.classList.remove('pressed');
      $('#count').style.display = 'none';
      ember.classList.remove('holding');
      say('Pwaaah! 😮‍💨', 1000);
      cureWorked('breath');
    }
  }
  updateItems(dt);
  drawParts(dt);
}
setInterval(() => { if (!ember.classList.contains('holding')) restartAnim(ember, 'blink'); setTimeout(() => ember.classList.remove('blink'), 200); }, 3200);

updateJarCount();
showTitle();
requestAnimationFrame(loop);
</script>
