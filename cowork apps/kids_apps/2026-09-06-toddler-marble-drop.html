<!-- CONCEPT: Toddler Marble Drop -- a picture-first version of Marble Flow.
     A toddler makes five choices (what to drop, how many, how bouncy, what
     sound, what colours) on big tappable cards before anything moves, then a
     giant GO drops them. Every choice is carried by an emoji, a colour and a
     size cue, so nothing depends on reading. -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Toddler Marble Drop</title>
<meta name="description" content="A toddler-friendly marble and balloon dropper. Pick what to drop, how many, how bouncy, the sound and the colours, then tap GO.">
<style>
  :root {
    --bg: #141a2e;
    --panel: rgba(255,255,255,0.07);
    --panel-on: rgba(255,255,255,0.16);
    --ink: #f4f7ff;
    --dim: #a8b3d4;
    --ring: #6fe3ff;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;                 /* the play area is the whole screen */
    background: var(--bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-user-select: none;
    user-select: none;
    overscroll-behavior: none;        /* no pull-to-refresh mid-play */
    touch-action: manipulation;       /* kill the 300ms double-tap zoom delay */
  }

  /* ---------------- Setup ---------------- */

  #setup {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    padding: 14px 14px calc(14px + env(safe-area-inset-bottom));
    gap: 12px;
    overflow-y: auto;                 /* vertical only -- never sideways */
    overflow-x: hidden;
  }

  .step-dots {
    display: flex;
    justify-content: center;
    gap: 10px;
    padding-top: 4px;
    flex-shrink: 0;
  }
  .dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: rgba(255,255,255,0.18);
    transition: background 0.25s, transform 0.25s;
  }
  .dot.done { background: var(--ring); }
  .dot.now  { background: var(--ink); transform: scale(1.45); }

  .question {
    text-align: center;
    font-size: clamp(22px, 6.5vw, 34px);
    font-weight: 800;
    letter-spacing: -0.01em;
    margin: 2px 0 0;
    flex-shrink: 0;
  }

  /* One card per row, each stretching to share the free height. A two-column
     grid left the third option orphaned in the left column and wasted most of
     the screen, which is the opposite of what a toddler needs -- these want to
     be the biggest thing on the display. */
  .choices {
    display: grid;
    grid-auto-rows: 1fr;
    gap: 12px;
    flex: 1;
    min-height: 0;
    width: 100%;
    max-width: 560px;
    margin: 0 auto;
  }

  /* Deliberately enormous. A toddler is aiming with a whole hand, not a
     fingertip, so these run far past the 44px adult minimum. */
  .choice {
    min-height: 96px;
    padding: 12px 20px;
    border: 3px solid transparent;
    border-radius: 24px;
    background: var(--panel);
    color: var(--ink);
    font: inherit;
    font-size: clamp(20px, 5.5vw, 26px);
    font-weight: 800;
    cursor: pointer;
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: flex-start;
    text-align: left;
    gap: 18px;
    transition: transform 0.12s ease, background 0.18s, border-color 0.18s;
  }
  .choice:active { transform: scale(0.95); }
  .choice.on {
    background: var(--panel-on);
    border-color: var(--ring);
    box-shadow: 0 0 0 4px rgba(111,227,255,0.18);
  }
  .choice .pic { font-size: clamp(40px, 11vw, 58px); line-height: 1; flex-shrink: 0; }
  .choice .txt { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .choice .sub { font-size: 15px; font-weight: 600; color: var(--dim); }

  /* colour choice shows the actual palette rather than naming it */
  .swatches { display: flex; gap: 7px; flex-shrink: 0; }
  .swatches i { width: 30px; height: 30px; border-radius: 50%; display: block; }

  .nav-row { display: flex; gap: 10px; flex-shrink: 0; }

  .nav-btn {
    min-height: 68px;
    flex: 1;
    border: none;
    border-radius: 20px;
    background: var(--panel);
    color: var(--ink);
    font: inherit;
    font-size: 20px;
    font-weight: 800;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .nav-btn:active { transform: scale(0.97); }
  .nav-btn.back { flex: 0 0 96px; font-size: 26px; }
  .nav-btn.go {
    background: linear-gradient(135deg, #35d6a4, #2bb3e0);
    color: #06221c;
    font-size: 26px;
  }
  .nav-btn[disabled] { opacity: 0.35; }

  /* ---------------- Play ---------------- */

  #play { position: absolute; inset: 0; display: none; }
  #play.on { display: block; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }

  .play-bar {
    position: absolute;
    left: 10px;
    right: 10px;
    top: calc(8px + env(safe-area-inset-top));
    display: flex;
    gap: 10px;
    justify-content: space-between;
    pointer-events: none;
  }
  .play-btn {
    pointer-events: auto;
    min-width: 64px;
    min-height: 64px;
    padding: 0 18px;
    border: none;
    border-radius: 18px;
    background: rgba(10,14,28,0.62);
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
    color: var(--ink);
    font: inherit;
    font-size: 26px;
    font-weight: 800;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .play-btn:active { transform: scale(0.95); }

  .hint {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    /* A heap of 34 marbles stands ~150px tall, so anything anchored to the
       bottom ends up buried in it. Sits under the buttons instead. */
    top: calc(84px + env(safe-area-inset-top));
    padding: 10px 18px;
    border-radius: 999px;
    background: rgba(10,14,28,0.55);
    color: var(--dim);
    font-size: 15px;
    font-weight: 600;
    white-space: nowrap;
    transition: opacity 0.5s;
  }
  .hint.gone { opacity: 0; }

  @media (max-height: 620px) {
    .choice { min-height: 72px; padding: 8px 16px; }
    .choice .pic { font-size: 34px; }
    .question { font-size: 22px; }
    .nav-btn { min-height: 56px; }
  }
</style>
</head>
<body>

<div id="setup">
  <div class="step-dots" id="dots"></div>
  <h1 class="question" id="question">What shall we drop?</h1>
  <div class="choices" id="choices"></div>
  <div class="nav-row">
    <button class="nav-btn back" id="backBtn" aria-label="Go back">&#8592;</button>
    <button class="nav-btn go" id="nextBtn">Next &#8594;</button>
  </div>
</div>

<div id="play">
  <canvas id="cv"></canvas>
  <div class="play-bar">
    <button class="play-btn" id="againBtn" aria-label="Change my picks">&#8635;</button>
    <button class="play-btn" id="moreBtn" aria-label="Drop more">&#10133;</button>
  </div>
  <div class="hint" id="hint">Tap anywhere for more!</div>
</div>

<script>
"use strict";

/* ---------------------------------------------------------------- choices */

const THEMES = {
  rainbow: ["#ff6b6b", "#ffd93d", "#6bcB77", "#4d96ff", "#c77dff", "#ff9f68"],
  ocean:   ["#5ce1e6", "#38a3d1", "#2b6cb0", "#7ae7c7", "#a0e9ff", "#1f4f8f"],
  candy:   ["#ff8fd8", "#ffb3c6", "#c77dff", "#ffd6e0", "#ff5fa2", "#e0aaff"],
};

const STEPS = [
  {
    key: "kind", q: "What shall we drop?",
    opts: [
      { v: "marble",  pic: "\u{1F534}", label: "Marbles",  sub: "they bounce" },
      { v: "balloon", pic: "\u{1F388}", label: "Balloons", sub: "they float up" },
      { v: "bubble",  pic: "\u{1FAE7}", label: "Bubbles",  sub: "they drift" },
    ],
  },
  {
    key: "count", q: "How many?",
    opts: [
      { v: 6,  pic: "\u{1F423}", label: "A few",  sub: "6" },
      { v: 16, pic: "\u{1F424}", label: "Some",   sub: "16" },
      { v: 34, pic: "\u{1F425}", label: "Lots!",  sub: "34" },
    ],
  },
  {
    key: "bounce", q: "How bouncy?",
    opts: [
      { v: 0.30, pic: "\u{1FAA8}", label: "Sleepy", sub: "little bounce" },
      { v: 0.62, pic: "\u{1F3C0}", label: "Bouncy", sub: "just right" },
      { v: 0.88, pic: "\u{1F998}", label: "Boing!", sub: "big bounce" },
    ],
  },
  {
    key: "sound", q: "What sound?",
    opts: [
      { v: "chime", pic: "\u{1F514}", label: "Chimes", sub: "twinkly" },
      { v: "pop",   pic: "\u{1F4A5}", label: "Pops",   sub: "poppy" },
      { v: "quiet", pic: "\u{1F92B}", label: "Quiet",  sub: "no sound" },
    ],
  },
  {
    key: "theme", q: "What colours?",
    opts: [
      { v: "rainbow", label: "Rainbow" },
      { v: "ocean",   label: "Ocean" },
      { v: "candy",   label: "Candy" },
    ],
  },
];

const picks = { kind: null, count: null, bounce: null, sound: null, theme: null };
let stepIx = 0;

/* ------------------------------------------------------------- setup view */

const dotsEl = document.getElementById("dots");
const qEl = document.getElementById("question");
const choicesEl = document.getElementById("choices");
const backBtn = document.getElementById("backBtn");
const nextBtn = document.getElementById("nextBtn");

function renderDots() {
  dotsEl.innerHTML = "";
  STEPS.forEach((_, i) => {
    const d = document.createElement("div");
    d.className = "dot" + (i < stepIx ? " done" : i === stepIx ? " now" : "");
    dotsEl.appendChild(d);
  });
}

function renderStep() {
  const step = STEPS[stepIx];
  qEl.textContent = step.q;
  choicesEl.innerHTML = "";

  step.opts.forEach(o => {
    const b = document.createElement("button");
    b.className = "choice" + (picks[step.key] === o.v ? " on" : "");

    if (step.key === "theme") {
      const sw = document.createElement("div");
      sw.className = "swatches";
      THEMES[o.v].slice(0, 4).forEach(c => {
        const i = document.createElement("i");
        i.style.background = c;
        sw.appendChild(i);
      });
      b.appendChild(sw);
    } else {
      const pic = document.createElement("div");
      pic.className = "pic";
      pic.textContent = o.pic;
      b.appendChild(pic);
    }

    const txt = document.createElement("div");
    txt.className = "txt";
    const lbl = document.createElement("div");
    lbl.textContent = o.label;
    txt.appendChild(lbl);
    if (o.sub) {
      const sub = document.createElement("div");
      sub.className = "sub";
      sub.textContent = o.sub;
      txt.appendChild(sub);
    }
    b.appendChild(txt);

    b.addEventListener("click", () => {
      picks[step.key] = o.v;
      blip(step.key === "theme" ? 660 : 520);
      renderStep();
      // Choosing is the whole interaction, so move on by itself -- a toddler
      // should not have to find a separate Next button after every pick.
      setTimeout(() => {
        if (stepIx < STEPS.length - 1) { stepIx++; renderStep(); renderDots(); }
        else start();
      }, 260);
    });
    choicesEl.appendChild(b);
  });

  backBtn.disabled = stepIx === 0;
  nextBtn.textContent = stepIx === STEPS.length - 1 ? "GO!" : "Next →";
  nextBtn.disabled = picks[STEPS[stepIx].key] === null;
  renderDots();
}

backBtn.addEventListener("click", () => {
  if (stepIx > 0) { stepIx--; renderStep(); }
});
nextBtn.addEventListener("click", () => {
  if (picks[STEPS[stepIx].key] === null) return;
  if (stepIx < STEPS.length - 1) { stepIx++; renderStep(); }
  else start();
});

/* ----------------------------------------------------------------- sound */

let actx = null, bus = null;
function audio() {
  if (picks.sound === "quiet") return null;
  if (!actx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    actx = new AC();
    // Every note used to connect straight to destination. With "Lots!" the
    // whole pile lands within a few milliseconds, so thirty-odd gains summed
    // well past 1.0 and the output square-clipped into a buzz. A compressor on
    // a shared bus is what turns that back into a chord instead of a crunch.
    const comp = actx.createDynamicsCompressor();
    comp.threshold.value = -20;
    comp.knee.value = 15;
    comp.ratio.value = 12;
    comp.attack.value = 0.003;
    comp.release.value = 0.25;
    bus = actx.createGain();
    bus.gain.value = 0.45;
    bus.connect(comp);
    comp.connect(actx.destination);
  }
  if (actx.state === "suspended") actx.resume();
  return actx;
}

const PENTA = [523.25, 587.33, 659.25, 783.99, 880.0];

let drainClock = 0;   // paces how fast the floor clears
let voices = 0, lastNoteAt = -1;
const MAX_VOICES = 6;     // ringing at once
const MIN_GAP = 0.028;    // seconds between note starts

// `strength` is 0..1 from the impact speed, so a marble settling is a tick and
// a marble dropped from the top is a chime. Before, every bounce was equally
// loud, which is most of why a settling pile sounded like gravel.
function blip(freq, strength) {
  const a = audio();
  if (!a) return;
  const t = a.currentTime;
  // A pile lands in the same millisecond, so cap both how many notes ring at
  // once and how close together they may start. Dropped notes are not missed --
  // at that density they only add mud.
  if (voices >= MAX_VOICES || t - lastNoteAt < MIN_GAP) return;
  lastNoteAt = t;
  voices++;
  const pop = picks.sound === "pop";
  const s = Math.max(0.18, Math.min(1, strength == null ? 1 : strength));
  const peak = (pop ? 0.11 : 0.075) * s;
  const dur = pop ? 0.09 : 0.34;   // was 0.55: long tails piled up
  const o = a.createOscillator(), g = a.createGain();
  o.type = pop ? "square" : "sine";
  o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(peak, t + 0.008);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(bus);
  o.start(t);
  o.stop(t + dur + 0.02);
  o.onended = () => { voices = Math.max(0, voices - 1); };
}

const note = (strength) => blip(PENTA[(Math.random() * PENTA.length) | 0], strength);

/* ---------------------------------------------------------------- physics */

const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");
const playEl = document.getElementById("play");
const setupEl = document.getElementById("setup");
const hintEl = document.getElementById("hint");

let W = 0, H = 0, dpr = 1;
let balls = [];
let raf = null;
let lastT = 0;

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = cv.clientWidth;
  H = cv.clientHeight;
  cv.width = Math.round(W * dpr);
  cv.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener("resize", resize);
window.addEventListener("orientationchange", () => setTimeout(resize, 120));

const MAX_BALLS = 90;

function spawn(n, x, y) {
  const pal = THEMES[picks.theme] || THEMES.rainbow;
  n = Math.min(n, MAX_BALLS - balls.length);
  for (let i = 0; i < n; i++) {
    const r = picks.kind === "balloon" ? 22 + Math.random() * 12
            : picks.kind === "bubble"  ? 18 + Math.random() * 16
            : 15 + Math.random() * 10;
    balls.push({
      x: x != null ? x + (Math.random() - 0.5) * 60 : 30 + Math.random() * Math.max(1, W - 60),
      y: y != null ? y + (Math.random() - 0.5) * 40
        : (picks.kind === "balloon" ? H + 40 + Math.random() * 200 : -40 - Math.random() * 300),
      vx: (Math.random() - 0.5) * 90,
      vy: 0,
      r,
      color: pal[(Math.random() * pal.length) | 0],
      wob: Math.random() * Math.PI * 2,
      pop: 0,
      rest: 0,     // seconds spent settled on the floor
      chimes: 0,   // sounds this marble has been allowed to make
      fade: 0,     // 0..1 while draining away
    });
  }
}

// Without this, "Lots!" looks like a handful: 34 marbles all settle to the
// same floor line and stack into a few overlapping blobs. Pairwise at n<=90 is
// ~4k checks a frame, which costs nothing and is what makes a big pile read as
// a big pile.
function collide(bounce) {
  for (let i = 0; i < balls.length; i++) {
    const a = balls[i];
    if (a.pop > 0 || a.fade > 0) continue;
    for (let j = i + 1; j < balls.length; j++) {
      const b = balls[j];
      if (b.pop > 0 || b.fade > 0) continue;
      const dx = b.x - a.x, dy = b.y - a.y;
      const rr = a.r + b.r;
      const d2 = dx * dx + dy * dy;
      if (d2 >= rr * rr || d2 === 0) continue;
      const d = Math.sqrt(d2);
      const nx = dx / d, ny = dy / d;
      const push = (rr - d) * 0.5;
      a.x -= nx * push; a.y -= ny * push;
      b.x += nx * push; b.y += ny * push;
      const vn = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
      if (vn < 0) {
        const imp = -(1 + (0.4 + bounce * 0.5)) * vn * 0.5;
        a.vx -= imp * nx; a.vy -= imp * ny;
        b.vx += imp * nx; b.vy += imp * ny;
      }
    }
  }
}

function step(dt) {
  const bounce = picks.bounce ?? 0.62;
  const kind = picks.kind;
  const g = kind === "balloon" ? -260 : kind === "bubble" ? 90 : 1100;
  const drag = kind === "marble" ? 0 : 0.6;

  // Draining used to clear the floor completely, which left a toddler looking at
  // a blank screen with nothing to come back to. Keep a few instead -- about a
  // quarter of the amount they chose, never fewer than three, so "A few" still
  // keeps some and "Lots!" does not leave a crowd. They are stationary and have
  // spent their chimes, so they sit there silently.
  const keepFloor = Math.max(3, Math.round((picks.count || 16) * 0.25));
  let liveCount = 0;
  for (const x of balls) if (x.fade === 0 && x.pop === 0) liveCount++;
  // One at a time, and not too quickly. Draining freely meant a tap's three new
  // marbles instantly freed three settled ones, so tapping swapped rather than
  // added and the count never moved -- which reads as a tap that did nothing.
  drainClock += dt;

  for (let i = balls.length - 1; i >= 0; i--) {
    const b = balls[i];

    if (b.pop > 0) {                       // popping animation, then remove
      b.pop += dt * 4;
      if (b.pop > 1) balls.splice(i, 1);
      continue;
    }

    // A pile that stays put is what made the sound repeat over itself: every new
    // drop crashed into the same heap and rang the same landing again, and the
    // heap only ever grew. Marbles that have come to rest now drain away, so the
    // screen goes quiet when nobody is playing and each new drop lands on a
    // clear floor. Balloons and bubbles already leave on their own.
    if (b.fade > 0) {
      b.fade += dt * 2.2;
      if (b.fade >= 1) balls.splice(i, 1);
      continue;
    }
    if (kind === "marble") {
      // Not "on the floor and stopped": a heap stands three or four deep, so only
      // a third of it ever touches the floor line, and collision resolution keeps
      // nudging the rest -- measured median speed in a settled pile is 35 and the
      // fastest is 67, so nothing stays under 30 for long. Sustained slowness is
      // the honest test, and anything still falling blows past 90 within a frame
      // or two, so it cannot be caught by mistake.
      const settled = Math.hypot(b.vx, b.vy) < 90;
      b.rest = settled ? b.rest + dt : 0;
      if (b.rest > 2.5 && liveCount > keepFloor && drainClock > 0.45) {
        b.fade = 0.001; liveCount--; drainClock = 0; continue;
      }
    }

    b.vy += g * dt;
    if (drag) { b.vx *= 1 - drag * dt; b.vy *= 1 - drag * dt; }

    // floaty things wander sideways so they do not rise in dull straight lines
    if (kind !== "marble") {
      b.wob += dt * 2;
      b.x += Math.sin(b.wob) * 22 * dt;
    }

    b.x += b.vx * dt;
    b.y += b.vy * dt;

    // Walls only ring on a real knock, and quieter than the floor -- they were
    // doubling the note density for no musical gain.
    if (b.x < b.r) { b.x = b.r; if (kind === "marble" && Math.abs(b.vx) > 150 && b.chimes < 3) { note(Math.abs(b.vx) / 1400); b.chimes++; } b.vx = Math.abs(b.vx) * bounce; }
    if (b.x > W - b.r) { b.x = W - b.r; if (kind === "marble" && Math.abs(b.vx) > 150 && b.chimes < 3) { note(Math.abs(b.vx) / 1400); b.chimes++; } b.vx = -Math.abs(b.vx) * bounce; }

    if (b.y > H - b.r) {
      b.y = H - b.r;
      // 60 was low enough that marbles still rattled while settling; 130 keeps
      // the landing and drops the gravel.
      if (Math.abs(b.vy) > 130) {
        if (b.chimes < 3) { note(Math.abs(b.vy) / 1100); b.chimes++; }
        b.vy = -Math.abs(b.vy) * bounce;
      }
      else if (Math.abs(b.vy) > 60) { b.vy = -Math.abs(b.vy) * bounce; }
      else { b.vy = 0; b.vx *= 0.9; }
    }

    // balloons that reach the top pop and are replaced, so the screen never empties
    if (kind === "balloon" && b.y < -b.r - 10) { balls.splice(i, 1); spawn(1); }
    if (kind === "bubble" && b.y > H + 200) balls.splice(i, 1);
  }

  collide(bounce);

  // collisions can shove one back through a wall, so clamp afterwards
  for (const b of balls) {
    if (b.pop > 0 || b.fade > 0) continue;
    if (b.x < b.r) b.x = b.r;
    if (b.x > W - b.r) b.x = W - b.r;
    if (b.y > H - b.r) b.y = H - b.r;
  }
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  for (const b of balls) {
    // A pop grows as it vanishes; a drain shrinks, so the two read differently.
    const alpha = b.pop > 0 ? 1 - b.pop : b.fade > 0 ? 1 - b.fade : 1;
    const r = b.r * (b.pop > 0 ? 1 + b.pop * 0.8 : b.fade > 0 ? 1 - b.fade * 0.45 : 1);
    ctx.globalAlpha = Math.max(0, alpha);

    if (picks.kind === "bubble") {
      ctx.beginPath();
      ctx.arc(b.x, b.y, r, 0, Math.PI * 2);
      ctx.strokeStyle = b.color;
      ctx.lineWidth = 3;
      ctx.stroke();
      ctx.globalAlpha = Math.max(0, alpha * 0.22);
      ctx.fillStyle = b.color;
      ctx.fill();
    } else {
      ctx.beginPath();
      ctx.arc(b.x, b.y, r, 0, Math.PI * 2);
      ctx.fillStyle = b.color;
      ctx.fill();
      if (picks.kind === "balloon") {          // little knot + string
        ctx.beginPath();
        ctx.moveTo(b.x, b.y + r);
        ctx.lineTo(b.x, b.y + r + 14);
        ctx.strokeStyle = "rgba(255,255,255,0.45)";
        ctx.lineWidth = 2;
        ctx.stroke();
      }
      ctx.globalAlpha = Math.max(0, alpha * 0.5);   // highlight
      ctx.beginPath();
      ctx.arc(b.x - r * 0.32, b.y - r * 0.34, r * 0.26, 0, Math.PI * 2);
      ctx.fillStyle = "#ffffff";
      ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
}

function loop(t) {
  const dt = Math.min((t - lastT) / 1000 || 0, 0.033);   // clamp after a background tab
  lastT = t;
  step(dt);
  draw();
  raf = requestAnimationFrame(loop);
}

/* ------------------------------------------------------------ play controls */

function popAt(x, y) {
  let hit = false;
  for (const b of balls) {
    if (b.pop > 0 || b.fade > 0) continue;
    const dx = b.x - x, dy = b.y - y;
    if (dx * dx + dy * dy < (b.r + 14) * (b.r + 14)) { b.pop = 0.001; hit = true; }
  }
  if (hit) { note(); if (picks.kind === "balloon") spawn(1); }
  return hit;
}

function onTap(x, y) {
  // Tapping a ball pops it; tapping empty space drops more. Both are rewarding,
  // which is the point at this age -- there is no wrong tap.
  if (!popAt(x, y)) { spawn(3, x, y); note(); }
  hintEl.classList.add("gone");
}

cv.addEventListener("pointerdown", e => {
  const r = cv.getBoundingClientRect();
  onTap(e.clientX - r.left, e.clientY - r.top);
});
cv.addEventListener("touchstart", e => { e.preventDefault(); }, { passive: false });

document.getElementById("moreBtn").addEventListener("click", () => {
  spawn(5);
  note();
  hintEl.classList.add("gone");
});

document.getElementById("againBtn").addEventListener("click", () => {
  if (raf) cancelAnimationFrame(raf);
  raf = null;
  balls = [];
  playEl.classList.remove("on");
  setupEl.style.display = "flex";
  stepIx = 0;
  renderStep();
});

function start() {
  setupEl.style.display = "none";
  playEl.classList.add("on");
  hintEl.classList.remove("gone");
  voices = 0; lastNoteAt = -1; drainClock = 0;
  resize();
  balls = [];
  spawn(picks.count || 16);
  lastT = performance.now();
  if (raf) cancelAnimationFrame(raf);
  raf = requestAnimationFrame(loop);
  setTimeout(() => hintEl.classList.add("gone"), 4200);
}

renderStep();
</script>
</body>
