<!DOCTYPE html>
<!-- CONCEPT: Lantern Lights – a lights-out style puzzle where tapping a paper lantern flips it and its neighbors; light every lantern to make the festival glow (6 levels, hints, stars). -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Lantern Lights</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;height:100%;font-family:"Comic Sans MS","Trebuchet MS",system-ui,sans-serif;color:#fff;overflow:hidden}
body{background:linear-gradient(#1d1b4b,#4a2a7a 70%,#8a3f8f);display:flex;flex-direction:column;align-items:center}
.stars{position:fixed;inset:0;pointer-events:none}
header{text-align:center;padding:10px 12px 0;z-index:2}
h1{margin:0;font-size:clamp(28px,6vw,46px);color:#ffd96b;text-shadow:0 3px 0 #b5541c,0 0 20px #ffb347}
.desc{font-size:clamp(14px,2.6vw,18px);margin:4px 0;opacity:.95}
#bar{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;margin:6px 0;z-index:2}
.pill{background:#ffffff22;border:3px solid #ffffff55;border-radius:30px;padding:6px 16px;font-size:clamp(16px,3vw,22px);font-weight:bold}
button{font:inherit;font-weight:bold;font-size:clamp(18px,3.4vw,26px);border:0;border-radius:30px;padding:10px 26px;cursor:pointer;color:#3b1d00;background:linear-gradient(#ffe27a,#ffb02e);box-shadow:0 6px 0 #b5701c;touch-action:manipulation}
button:active{transform:translateY(4px);box-shadow:0 2px 0 #b5701c}
button.alt{background:linear-gradient(#9be7ff,#4cb8ff);box-shadow:0 6px 0 #1f78b4;color:#05314d}
#stage{flex:1;display:flex;align-items:center;justify-content:center;width:100%;z-index:2;min-height:0}
#grid{display:grid;gap:clamp(6px,1.6vmin,14px);padding:10px}
.lan{position:relative;border:0;background:none;padding:0;cursor:pointer;box-shadow:none;border-radius:0;transition:transform .15s}
.lan:active{transform:scale(.92);box-shadow:none}
.lan svg{width:100%;height:100%;display:block;overflow:visible}
.lan .body{fill:#3a3a5c;transition:fill .25s}
.lan .cap{fill:#25253f}
.lan .glow{opacity:0;transition:opacity .25s}
.lan.on .body{fill:#ff9f2e}
.lan.on .glow{opacity:1}
.lan.on svg{animation:sway 2.4s ease-in-out infinite}
.lan.hint{animation:pulse .7s ease-in-out infinite}
@keyframes sway{50%{transform:rotate(3deg)}}
@keyframes pulse{50%{transform:scale(1.15)}}
#foot{z-index:2;padding:8px 0 14px;display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
#modal{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;z-index:10}
#modal.show{display:flex}
.card{background:linear-gradient(#fff7d6,#ffdca0);color:#4a2500;border-radius:30px;padding:24px 30px;text-align:center;max-width:90vw;box-shadow:0 10px 0 #b5701c;animation:pop .4s}
.card h2{margin:0 0 6px;font-size:clamp(28px,6vw,42px)}
.card .st{font-size:clamp(36px,9vw,60px);letter-spacing:6px}
@keyframes pop{from{transform:scale(.3)}to{transform:scale(1)}}
canvas{position:fixed;inset:0;pointer-events:none;z-index:20}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<header>
  <h1>🏮 Lantern Lights 🏮</h1>
  <div class="desc">Tap a lantern to flip it and its neighbors. Light them ALL to start the festival!</div>
</header>
<div id="bar">
  <div class="pill" id="lvl">Level 1 / 6</div>
  <div class="pill" id="taps">Taps: 0</div>
  <div class="pill" id="starsTot">⭐ 0</div>
</div>
<div id="stage"><div id="grid"></div></div>
<div id="foot">
  <button class="alt" id="hintBtn">💡 Hint</button>
  <button class="alt" id="resetBtn">🔄 Again</button>
</div>
<div id="modal"><div class="card" id="card"></div></div>
<script>
const LEVELS=[{n:3,k:2},{n:3,k:4},{n:4,k:4},{n:4,k:6},{n:5,k:5},{n:5,k:7}];
let lv=0,N=3,lit=[],need=new Set(),startLit=[],taps=0,best=[0,0,0,0,0,0],total=0,locked=false;
const grid=document.getElementById('grid');
// ---- audio
let ac;
function A(){if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(ac&&ac.state==='suspended')ac.resume();return ac}
function tone(f,d=.18,type='sine',v=.15,t0=0){const c=A();if(!c)return;const o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.value=f;const t=c.currentTime+t0;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+d)}
const PEN=[262,294,330,392,440,523,587,659];
function sfxTap(on){tone(on?PEN[(Math.random()*8)|0]:200,.2,on?'triangle':'sine',.14)}
function sfxWin(){[523,659,784,1047,784,1047,1319].forEach((f,i)=>tone(f,.3,'triangle',.16,i*.12))}
// ---- game
function idx(r,c){return r*N+c}
function flip(i,arr){const r=(i/N)|0,c=i%N;[[0,0],[1,0],[-1,0],[0,1],[0,-1]].forEach(([dr,dc])=>{const rr=r+dr,cc=c+dc;if(rr>=0&&rr<N&&cc>=0&&cc<N)arr[idx(rr,cc)]=!arr[idx(rr,cc)]})}
function build(){
  const {n,k}=LEVELS[lv];N=n;
  let tries=0;
  do{
    lit=Array(N*N).fill(true);need=new Set();
    const pool=[...Array(N*N).keys()].sort(()=>Math.random()-.5).slice(0,k);
    pool.forEach(i=>{flip(i,lit);need.add(i)});
    tries++;
  }while((lit.every(x=>x)||lit.every(x=>!x))&&tries<50);
  startLit=lit.slice();startNeed=new Set(need);
  taps=0;locked=false;
  const size=Math.min(window.innerWidth-30,window.innerHeight-300,520);
  const cell=Math.max(48,Math.floor((size-(N+1)*12)/N));
  grid.style.gridTemplateColumns=`repeat(${N},${cell}px)`;
  grid.innerHTML='';
  for(let i=0;i<N*N;i++){
    const b=document.createElement('button');b.className='lan';b.style.width=b.style.height=cell+'px';
    // a name for screen readers; whether it's lit is aria-pressed, kept in step by paint() (28 Oct 2026)
    b.setAttribute('aria-label',`Lantern, row ${Math.floor(i/N)+1}, column ${i%N+1}`);
    b.innerHTML=`<svg aria-hidden="true" viewBox="0 0 100 100"><circle class="glow" cx="50" cy="52" r="46" fill="#ffd96b" opacity=".35"/><rect x="40" y="4" width="20" height="10" rx="3" class="cap"/><rect x="47" y="0" width="6" height="8" fill="#a0a0c0"/><ellipse class="body" cx="50" cy="52" rx="36" ry="34" stroke="#ffffff55" stroke-width="3"/><path d="M50 18 Q30 52 50 86 M50 18 Q70 52 50 86 M16 52 H84" stroke="#0004" stroke-width="2.5" fill="none"/><rect x="38" y="84" width="24" height="9" rx="3" class="cap"/><path d="M50 93 v7" stroke="#ffd96b" stroke-width="4"/></svg>`;
    b.onclick=()=>tap(i);
    grid.appendChild(b);
  }
  paint();updateHud();
}
function paint(){[...grid.children].forEach((b,i)=>{b.classList.toggle('on',lit[i]);b.setAttribute('aria-pressed',lit[i]?'true':'false');b.classList.remove('hint')})}
function updateHud(){
  document.getElementById('lvl').textContent=`Level ${lv+1} / ${LEVELS.length}`;
  document.getElementById('taps').textContent=`Taps: ${taps}`;
  document.getElementById('starsTot').textContent=`⭐ ${total}`;
}
function tap(i){
  if(locked)return;A();
  flip(i,lit);taps++;
  if(need.has(i))need.delete(i);else need.add(i);
  sfxTap(lit[i]);paint();updateHud();
  if(lit.every(x=>x))win();
}
function hint(){
  if(locked)return;A();
  let c=need.size?[...need]:lit.map((v,i)=>v?-1:i).filter(i=>i>=0);
  if(!c.length)return;
  const i=c[(Math.random()*c.length)|0];
  grid.children[i].classList.add('hint');tone(880,.15,'sine',.1);tone(1100,.2,'sine',.1,.12);
}
function win(){
  locked=true;sfxWin();confetti();
  const par=LEVELS[lv].k;
  const s=taps<=par?3:taps<=par+3?2:1;
  if(s>best[lv]){total+=s-best[lv];best[lv]=s}
  updateHud();
  const last=lv===LEVELS.length-1;
  const card=document.getElementById('card');
  card.innerHTML=`<h2>${last?'🎉 Festival time! 🎉':'✨ Wonderful! ✨'}</h2><div class="st">${'⭐'.repeat(s)}${'☆'.repeat(3-s)}</div><p style="font-size:20px;margin:8px 0 14px">${last?'All the lanterns are glowing!':'Every lantern is glowing!'}</p>
  <button id="nextBtn">${last?'Play Again 🏮':'Next Level ▶'}</button> <button class="alt" id="againBtn">Replay</button>`;
  setTimeout(()=>{document.getElementById('modal').classList.add('show');
    document.getElementById('nextBtn').onclick=()=>{document.getElementById('modal').classList.remove('show');if(last){lv=0;total=0;best=[0,0,0,0,0,0]}else lv++;build()};
    document.getElementById('againBtn').onclick=()=>{document.getElementById('modal').classList.remove('show');build()};
  },700);
}
function reset(){ // same puzzle again
  lit=startLit.slice();need=new Set(startNeed);taps=0;locked=false;paint();updateHud();tone(300,.15,'sine',.1)
}
document.getElementById('hintBtn').onclick=hint;
document.getElementById('resetBtn').onclick=reset;
window.addEventListener('keydown',e=>{if(e.key==='h')hint()});
window.addEventListener('resize',()=>{if(!locked)build()});
// ---- confetti
const cv=document.getElementById('fx'),cx=cv.getContext('2d');let ps=[];
function size(){cv.width=innerWidth;cv.height=innerHeight}size();addEventListener('resize',size);
function confetti(){for(let i=0;i<140;i++)ps.push({x:innerWidth/2,y:innerHeight/2,vx:(Math.random()-.5)*16,vy:Math.random()*-14-2,c:`hsl(${Math.random()*360},90%,60%)`,s:5+Math.random()*7,l:120});}
(function loop(){cx.clearRect(0,0,cv.width,cv.height);ps=ps.filter(p=>p.l>0);ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.35;p.l--;cx.fillStyle=p.c;cx.fillRect(p.x,p.y,p.s,p.s)});requestAnimationFrame(loop)})();
// twinkle stars bg
(function(){const s=document.createElement('div');s.className='stars';let h='';for(let i=0;i<40;i++)h+=`<span style="position:absolute;left:${Math.random()*100}%;top:${Math.random()*70}%;font-size:${8+Math.random()*10}px;opacity:${.3+Math.random()*.6}">✦</span>`;s.innerHTML=h;document.body.prepend(s)})();
var startNeed=new Set();
build();
</script>
</body>
</html>
