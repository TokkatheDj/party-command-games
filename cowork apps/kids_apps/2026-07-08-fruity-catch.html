<!-- CONCEPT: Fruity Catch! — arcade catch-the-falling-fruit game: move a basket to catch 25 fruits, silly socks bounce out, confetti celebration on win. Ages 4-9. -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Fruity Catch!</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; overflow:hidden; font-family:'Comic Sans MS','Chalkboard SE','Segoe UI',sans-serif;
    background:linear-gradient(#7ed6f5 0%, #b8ecff 55%, #baf2b0 55.5%, #8fdd7f 100%); touch-action:none; }
  #wrap { position:relative; width:100%; height:100%; max-width:900px; margin:0 auto; }
  canvas { position:absolute; inset:0; width:100%; height:100%; display:block; }
  .overlay { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center;
    justify-content:center; text-align:center; background:rgba(255,255,255,.75); z-index:5; padding:20px; }
  h1 { font-size:clamp(2.2rem,8vw,4rem); color:#ff6f3c; text-shadow:3px 3px 0 #ffd93d; margin-bottom:10px; }
  .sub { font-size:clamp(1rem,4vw,1.4rem); color:#555; margin-bottom:26px; line-height:1.5; }
  .bigbtn { font-family:inherit; font-size:clamp(1.4rem,6vw,2rem); padding:18px 48px; border:none;
    border-radius:60px; background:#ff6f3c; color:#fff; cursor:pointer; box-shadow:0 6px 0 #d84f1e;
    transition:transform .1s; }
  .bigbtn:active { transform:translateY(4px); box-shadow:0 2px 0 #d84f1e; }
  #hud { position:absolute; top:10px; left:0; right:0; display:flex; justify-content:center; gap:14px;
    z-index:3; pointer-events:none; }
  .pill { background:rgba(255,255,255,.9); border-radius:40px; padding:8px 20px;
    font-size:clamp(1.1rem,4.5vw,1.5rem); color:#333; box-shadow:0 3px 6px rgba(0,0,0,.15); font-weight:bold; }
  #bar { position:absolute; top:60px; left:50%; transform:translateX(-50%); width:min(70%,420px); height:16px;
    background:rgba(255,255,255,.8); border-radius:10px; overflow:hidden; z-index:3; box-shadow:0 2px 4px rgba(0,0,0,.15); }
  #fill { height:100%; width:0%; background:linear-gradient(90deg,#ffd93d,#ff6f3c); border-radius:10px; transition:width .25s; }
  #cheer { position:absolute; top:22%; left:0; right:0; text-align:center; font-size:clamp(1.6rem,7vw,2.6rem);
    color:#ff6f3c; text-shadow:2px 2px 0 #fff; z-index:4; opacity:0; pointer-events:none; transition:opacity .2s; }
  .hidden { display:none !important; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>
  <div id="hud" class="hidden">
    <div class="pill">🍓 <span id="score">0</span> / 25</div>
  </div>
  <div id="bar" class="hidden"><div id="fill"></div></div>
  <div id="cheer"></div>

  <div id="startScreen" class="overlay">
    <h1>🍉 Fruity Catch! 🍓</h1>
    <div class="sub">Move the basket to catch <b>25 yummy fruits</b>!<br>
      Watch out for silly socks — they just bounce away! 🧦<br><br>
      🖱️ Move the mouse, 👆 drag your finger, or use ⬅️ ➡️ keys.</div>
    <button class="bigbtn" id="playBtn">▶ PLAY!</button>
  </div>

  <div id="winScreen" class="overlay hidden">
    <h1>🎉 YOU DID IT! 🎉</h1>
    <div class="sub">You caught all 25 fruits!<br>What a super fruit catcher! 🏆</div>
    <button class="bigbtn" id="againBtn">🔄 Play Again!</button>
  </div>
</div>

<script>
(() => {
  const canvas = document.getElementById('game'), ctx = canvas.getContext('2d');
  const startScreen = document.getElementById('startScreen'), winScreen = document.getElementById('winScreen');
  const hud = document.getElementById('hud'), bar = document.getElementById('bar'),
        fill = document.getElementById('fill'), scoreEl = document.getElementById('score'),
        cheerEl = document.getElementById('cheer');
  const GOAL = 25;
  const FRUITS = ['🍎','🍌','🍓','🍇','🍊','🍉','🍒','🍍','🥝','🍑'];
  const CHEERS = ['Yum!','Great catch!','Wow!','Super!','Tasty!','Nice one!','Amazing!','Yippee!'];
  let W, H, running = false, score = 0, items = [], particles = [], spawnTimer = 0, speedBoost = 0;
  let basket = { x: 0, w: 110, h: 70 };
  let keys = {}, cheerTimeout;

  function resize() {
    const r = canvas.parentElement.getBoundingClientRect();
    canvas.width = r.width * devicePixelRatio;
    canvas.height = r.height * devicePixelRatio;
    ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
    W = r.width; H = r.height;
    basket.w = Math.max(90, Math.min(130, W * 0.16));
  }
  window.addEventListener('resize', resize); resize();
  basket.x = W/2;

  // ---------- Web Audio ----------
  let AC;
  function audio() { if (!AC) AC = new (window.AudioContext||window.webkitAudioContext)(); if (AC.state==='suspended') AC.resume(); return AC; }
  function tone(freq, dur, type='sine', vol=0.25, when=0, slide=0) {
    const ac = audio(), o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime + when;
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(slide, t+dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t+dur);
    o.connect(g).connect(ac.destination); o.start(t); o.stop(t+dur+0.05);
  }
  const popSound  = () => { tone(500,0.08,'square',0.15); tone(800,0.12,'sine',0.2,0.03,1200); };
  const boing     = () => tone(160,0.35,'sawtooth',0.18,0,420);
  const fanfare   = () => { [523,659,784,1047,1319].forEach((f,i)=>tone(f,0.35,'triangle',0.22,i*0.14)); };

  // ---------- Input ----------
  function pointTo(clientX) {
    const r = canvas.getBoundingClientRect();
    basket.x = Math.max(basket.w/2, Math.min(W - basket.w/2, clientX - r.left));
  }
  canvas.addEventListener('mousemove', e => running && pointTo(e.clientX));
  canvas.addEventListener('touchmove', e => { e.preventDefault(); running && pointTo(e.touches[0].clientX); }, {passive:false});
  canvas.addEventListener('touchstart', e => { e.preventDefault(); running && pointTo(e.touches[0].clientX); }, {passive:false});
  window.addEventListener('keydown', e => keys[e.key] = true);
  window.addEventListener('keyup',   e => keys[e.key] = false);

  // ---------- Game objects ----------
  function spawn() {
    const isSock = Math.random() < 0.18;
    items.push({
      emoji: isSock ? '🧦' : FRUITS[(Math.random()*FRUITS.length)|0],
      sock: isSock,
      x: 30 + Math.random()*(W-60),
      y: -40,
      vy: (1.6 + Math.random()*1.2 + speedBoost) * (H/600),
      wob: Math.random()*Math.PI*2,
      size: 38 + Math.random()*10
    });
  }
  function burst(x,y,colors) {
    for (let i=0;i<18;i++) particles.push({
      x,y, vx:(Math.random()-0.5)*7, vy:-Math.random()*6-1,
      life:1, c:colors[(Math.random()*colors.length)|0], r:3+Math.random()*4
    });
  }
  function confettiRain() {
    for (let i=0;i<120;i++) particles.push({
      x:Math.random()*W, y:-20-Math.random()*H*0.6, vx:(Math.random()-0.5)*2, vy:2+Math.random()*3,
      life:3, c:['#ff6f3c','#ffd93d','#6bcb77','#4d96ff','#ff6fb5'][(Math.random()*5)|0], r:4+Math.random()*5
    });
  }
  function cheer(txt) {
    cheerEl.textContent = txt; cheerEl.style.opacity = 1;
    clearTimeout(cheerTimeout);
    cheerTimeout = setTimeout(()=>cheerEl.style.opacity=0, 700);
  }

  // ---------- Loop ----------
  let last = 0;
  function loop(ts) {
    if (!running) return;
    const dt = Math.min((ts-last)/16.7, 3); last = ts;

    if (keys.ArrowLeft)  basket.x = Math.max(basket.w/2, basket.x - 9*dt);
    if (keys.ArrowRight) basket.x = Math.min(W-basket.w/2, basket.x + 9*dt);

    spawnTimer -= dt;
    if (spawnTimer <= 0) { spawn(); spawnTimer = Math.max(28, 55 - score*1.1); }

    ctx.clearRect(0,0,W,H);

    // sun
    ctx.font = '48px serif'; ctx.textAlign='left'; ctx.fillText('☀️', W-70, 60);

    // items
    const by = H - 90;
    for (let i=items.length-1;i>=0;i--) {
      const it = items[i];
      it.y += it.vy*dt; it.wob += 0.05*dt;
      const wx = it.x + Math.sin(it.wob)*12;
      ctx.font = it.size+'px serif'; ctx.textAlign='center';
      ctx.fillText(it.emoji, wx, it.y);
      // catch check
      if (it.y > by-10 && it.y < by+45 && Math.abs(wx-basket.x) < basket.w/2+12) {
        items.splice(i,1);
        if (it.sock) {
          boing(); cheer('Silly sock! 🧦');
          burst(wx, by, ['#9aa5b1','#cbd2d9']);
        } else {
          score++; popSound();
          burst(wx, by, ['#ff6f3c','#ffd93d','#6bcb77','#ff6fb5']);
          if (score % 5 === 0) cheer(CHEERS[(Math.random()*CHEERS.length)|0]);
          scoreEl.textContent = score;
          fill.style.width = (score/GOAL*100)+'%';
          speedBoost = score * 0.045;
          if (score >= GOAL) { win(); return; }
        }
      } else if (it.y > H+50) items.splice(i,1);
    }

    // basket
    ctx.font = (basket.w*0.9)+'px serif'; ctx.textAlign='center';
    ctx.fillText('🧺', basket.x, H-40);

    // particles
    for (let i=particles.length-1;i>=0;i--) {
      const p = particles[i];
      p.x += p.vx*dt; p.y += p.vy*dt; p.vy += 0.15*dt; p.life -= 0.02*dt;
      if (p.life<=0 || p.y>H+20) { particles.splice(i,1); continue; }
      ctx.globalAlpha = Math.min(1,p.life);
      ctx.fillStyle = p.c;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,7); ctx.fill();
      ctx.globalAlpha = 1;
    }
    requestAnimationFrame(loop);
  }

  function start() {
    audio();
    score = 0; items = []; particles = []; spawnTimer = 0; speedBoost = 0;
    scoreEl.textContent = 0; fill.style.width = '0%';
    startScreen.classList.add('hidden'); winScreen.classList.add('hidden');
    hud.classList.remove('hidden'); bar.classList.remove('hidden');
    running = true; last = performance.now();
    requestAnimationFrame(loop);
  }
  function win() {
    running = false;
    fanfare(); confettiRain();
    // let confetti fall on top of win screen
    winScreen.classList.remove('hidden');
    hud.classList.add('hidden'); bar.classList.add('hidden');
    (function rain(){
      ctx.clearRect(0,0,W,H);
      let alive = false;
      for (const p of particles) {
        p.x += p.vx; p.y += p.vy; p.life -= 0.005;
        if (p.life>0 && p.y<H+20) {
          alive = true;
          ctx.globalAlpha = Math.min(1,p.life); ctx.fillStyle = p.c;
          ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,7); ctx.fill(); ctx.globalAlpha = 1;
        }
      }
      if (alive) requestAnimationFrame(rain);
    })();
  }

  document.getElementById('playBtn').addEventListener('click', start);
  document.getElementById('againBtn').addEventListener('click', start);
})();
</script>
</body>
</html>
