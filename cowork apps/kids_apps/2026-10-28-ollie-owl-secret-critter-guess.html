<!-- CONCEPT: FRIENDLY TURN-TAKING (guess-the-secret-critter deduction) - Ollie's Secret Critter: you and Ollie the owl each pick a secret critter from the same board of cats, dogs, bunnies and frogs in red, blue or yellow shirts (some wear hats, some hold balloons); take turns asking picture questions (Is it a bunny? Blue shirt? A hat?), flip down the critters that don't match, and answer Ollie's questions about your own critter with big Yes/No buttons - first to guess the other's critter wins. Ollie is a kind opponent (Sleepy or Wide-awake), won't let you flip a critter that still fits, gently asks you to look again if an answer doesn't match your critter, and a saved star chart counts every game. Ages 4-10. -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ollie's Secret Critter</title>
<style>
:root{
  --sky1:#7fd3ff; --sky2:#b8f0c8; --grass:#5cc76a;
  --ink:#2b2350; --panel:#ffffffe6; --panel2:#fff7d6;
  --pink:#ff5fa2; --purple:#8a5cff; --orange:#ff9f1c;
  --yes:#2ec46a; --no:#ff5d5d;
  --red:#ff4d6d; --blue:#3a86ff; --yellow:#ffc300;
  --back1:#6bbf59; --back2:#3f9a4a;
  --radius:16px; --gap:8px;
  --font:"Comic Sans MS","Trebuchet MS",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none;
  font-family:var(--font);color:var(--ink);background:linear-gradient(180deg,var(--sky1),var(--sky2) 70%,var(--grass));}
button{font-family:inherit;color:inherit;cursor:pointer;border:none}
#app{height:100%;display:flex;flex-direction:column;align-items:center;padding:6px 6px 8px;gap:6px;max-width:560px;margin:0 auto}
header{width:100%;display:flex;align-items:center;gap:6px}
h1{flex:1;margin:0;font-size:clamp(20px,6vw,30px);line-height:1.1;text-align:center;
  background:linear-gradient(90deg,var(--pink),var(--purple),var(--orange));-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 2px 0 #fff)}
.iconbtn{width:46px;height:46px;border-radius:50%;background:var(--panel);font-size:22px;box-shadow:0 3px 0 #0002;flex:none}
.iconbtn:active{transform:translateY(2px);box-shadow:0 1px 0 #0002}
#talk{width:100%;display:flex;align-items:center;gap:6px;height:64px;flex:none}
#ollie{font-size:46px;flex:none;line-height:1;transition:transform .2s}
#ollie.bob{animation:bob .6s ease}
@keyframes bob{0%,100%{transform:translateY(0) rotate(0)}30%{transform:translateY(-8px) rotate(-8deg)}60%{transform:translateY(0) rotate(6deg)}}
#bubble{flex:1;height:100%;background:var(--panel);border-radius:18px;padding:6px 12px;display:flex;align-items:center;gap:8px;
  font-size:clamp(14px,4.2vw,19px);font-weight:bold;position:relative;box-shadow:0 3px 0 #0002;overflow:hidden}
#bubble::before{content:"";position:absolute;left:-9px;top:24px;border:9px solid transparent;border-right-color:var(--panel);border-left:0}
#bubble .big{font-size:1.6em;flex:none}
#bubble.pop{animation:pop .3s ease}
@keyframes pop{0%{transform:scale(.92)}60%{transform:scale(1.03)}100%{transform:scale(1)}}
#board{width:100%;flex:1 1 auto;min-height:0;display:grid;gap:var(--gap);align-content:center;justify-content:center}
.card{position:relative;perspective:600px;cursor:pointer;border-radius:var(--radius)}
.inner{position:absolute;inset:0;transition:transform .45s ease;transform-style:preserve-3d}
.card.down .inner{transform:rotateY(180deg)}
.face,.back{position:absolute;inset:0;border-radius:var(--radius);backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:0 3px 0 #0003}
.face{background:var(--panel2);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;overflow:hidden;border:3px solid #fff}
.back{transform:rotateY(180deg);background:repeating-linear-gradient(45deg,var(--back1) 0 10px,var(--back2) 10px 20px);display:flex;align-items:center;justify-content:center;font-size:calc(var(--fs) * .7);border:3px solid #fff}
.critter{position:relative;display:flex;flex-direction:column;align-items:center;width:100%;flex:1;justify-content:flex-end}
.hat{font-size:calc(var(--fs) * .55);line-height:1;height:calc(var(--fs) * .5);margin-bottom:calc(var(--fs) * -.14);z-index:2}
.hat.none{visibility:hidden}
.head{font-size:var(--fs);line-height:1;z-index:1}
.shirt{width:62%;height:calc(var(--fs) * .42);border-radius:40% 40% 10px 10px;margin-top:calc(var(--fs) * -.08);border:2px solid #0002}
.balloon{position:absolute;right:4%;top:6%;font-size:calc(var(--fs) * .45);line-height:1}
.name{font-size:calc(var(--fs) * .27);font-weight:bold;padding:1px 0 3px;line-height:1.1}
.card.hint .face{animation:hint 1s ease-in-out infinite;border-color:var(--orange)}
@keyframes hint{0%,100%{transform:rotate(0)}25%{transform:rotate(-3deg)}75%{transform:rotate(3deg)}}
.card.wiggle .inner{animation:wig .4s ease}
@keyframes wig{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.card.last .face{border-color:var(--pink);box-shadow:0 0 0 4px var(--pink),0 0 18px var(--pink)}
.card.guessable .face{border-color:var(--purple);border-style:dashed}
#strip{width:100%;display:flex;gap:6px;align-items:stretch;height:58px;flex:none}
#mine{flex:none;display:flex;align-items:center;gap:4px;background:var(--panel);border-radius:14px;padding:3px 8px 3px 4px;box-shadow:0 3px 0 #0002}
#mine.look{animation:hint .6s ease-in-out 4;box-shadow:0 0 0 4px var(--pink)}
#mineCard{width:46px;height:52px;position:relative;--fs:26px}
#mineCard .face{border-width:2px;border-radius:10px}
#mineLabel{font-size:12px;font-weight:bold;line-height:1.1;width:44px}
#olliesBoard{flex:1;background:var(--panel);border-radius:14px;padding:3px 6px;display:flex;flex-direction:column;justify-content:center;box-shadow:0 3px 0 #0002;min-width:0}
#olliesBoard .lbl{font-size:12px;font-weight:bold}
#miniRow{display:flex;flex-wrap:wrap;gap:1px;font-size:15px;line-height:1.2}
#miniRow span.out{opacity:.18;filter:grayscale(1)}
#controls{width:100%;flex:none;min-height:112px;display:flex;flex-direction:column;justify-content:center}
#chips{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.chip{height:52px;border-radius:14px;background:#fff;font-size:28px;box-shadow:0 3px 0 #0003;display:flex;align-items:center;justify-content:center;position:relative}
.chip:active{transform:translateY(2px);box-shadow:0 1px 0 #0003}
.chip .sw{width:30px;height:30px;border-radius:50% 50% 8px 8px;border:2px solid #0003}
.chip.asked{opacity:.45}
.chip.asked::after{content:attr(data-ans);position:absolute;right:2px;bottom:0;font-size:14px}
.chip.guess{background:linear-gradient(135deg,#d9c8ff,#ffd0ea)}
.chip.guess.on{box-shadow:0 0 0 4px var(--purple)}
.chip:disabled{opacity:.35;cursor:default}
#yesno{display:none;grid-template-columns:1fr 1fr;gap:10px}
#yesno button{height:96px;border-radius:20px;font-size:30px;font-weight:bold;color:#fff;box-shadow:0 5px 0 #0003}
#yesBtn{background:var(--yes)}#noBtn{background:var(--no)}
#yesno button:active{transform:translateY(3px);box-shadow:0 2px 0 #0003}
#helpRow{display:none;gap:8px}
#helpRow button{flex:1;height:60px;border-radius:18px;font-size:20px;font-weight:bold;background:#fff;box-shadow:0 4px 0 #0003}
#controls.mode-yesno #chips{display:none}
#controls.mode-yesno #yesno{display:grid}
#controls.mode-flip #chips{display:none}
#controls.mode-flip #helpRow{display:flex}
#controls.mode-wait #chips{opacity:.4;pointer-events:none}
.overlay{position:fixed;inset:0;background:#2b235099;display:flex;align-items:center;justify-content:center;z-index:20;padding:12px}
.overlay[hidden]{display:none}
.sheet{background:#fff;border-radius:24px;padding:18px 16px;width:min(94vw,440px);max-height:96vh;overflow:auto;text-align:center;box-shadow:0 8px 0 #0003}
.sheet h2{margin:4px 0 8px;font-size:clamp(22px,6vw,30px);color:var(--purple)}
.sheet p{margin:6px 0;font-size:clamp(15px,4.2vw,18px)}
.how{display:flex;justify-content:center;gap:10px;font-size:30px;margin:6px 0}
.how div{display:flex;flex-direction:column;align-items:center;font-size:12px;font-weight:bold;width:74px}
.how div b{font-size:30px}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.pick button{min-height:64px;border-radius:18px;font-size:18px;font-weight:bold;background:#f1ecff;box-shadow:0 4px 0 #0002;padding:6px}
.pick button.sel{background:#6a3fe0;color:#fff}
.go{width:100%;height:66px;border-radius:20px;font-size:24px;font-weight:bold;color:#fff;background:linear-gradient(90deg,var(--pink),var(--orange));box-shadow:0 5px 0 #0003;margin-top:6px}
.go:active{transform:translateY(3px)}
.go.alt{background:linear-gradient(90deg,var(--purple),var(--blue))}
#secretBig{width:140px;height:168px;position:relative;margin:8px auto;--fs:80px}
.reveal{display:flex;justify-content:center;gap:14px;margin:8px 0}
.reveal .col{display:flex;flex-direction:column;align-items:center;font-size:13px;font-weight:bold}
.reveal .mini{width:84px;height:100px;position:relative;--fs:46px;margin-top:4px}
#stars,.stars{font-size:22px;min-height:28px;letter-spacing:2px}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:30}
</style>
</head>
<body>
<div id="app">
  <header>
    <button class="iconbtn" id="newBtn" aria-label="New game">🔄</button>
    <h1>Ollie's Secret Critter</h1>
    <button class="iconbtn" id="sndBtn" aria-label="Sound">🔊</button>
  </header>
  <div id="talk"><div id="ollie">🦉</div><div id="bubble"><span class="big">👋</span><span id="btxt">Hi! I'm Ollie!</span></div></div>
  <div id="board"></div>
  <div id="strip">
    <div id="mine"><div id="mineCard"></div><div id="mineLabel">Your secret 🤫</div></div>
    <div id="olliesBoard"><div class="lbl">🦉 Ollie is thinking about:</div><div id="miniRow"></div></div>
  </div>
  <div id="controls">
    <div id="chips"></div>
    <div id="yesno"><button id="yesBtn">👍 Yes</button><button id="noBtn">👎 No</button></div>
    <div id="helpRow"><button id="helpBtn">✨ Help me flip</button></div>
  </div>
</div>

<div class="overlay" id="startOv">
  <div class="sheet">
    <h2>🦉 Ollie's Secret Critter</h2>
    <div class="how">
      <div><b>❓</b>Ask Ollie</div>
      <div><b>🍃</b>Flip the ones that don't match</div>
      <div><b>🎉</b>Find his critter!</div>
    </div>
    <div class="pick" id="sizePick">
      <button data-n="6">🐱🐶🐰<br>6 critters</button>
      <button data-n="12">🐱🐶🐰🐸<br>12 critters</button>
    </div>
    <div class="pick" id="modePick">
      <button data-m="sleepy">😴 Sleepy Ollie</button>
      <button data-m="smart">🦉 Wide-awake Ollie</button>
    </div>
    <div id="stars"></div>
    <button class="go" id="startBtn">Let's play! ▶</button>
  </div>
</div>

<div class="overlay" id="secretOv" hidden>
  <div class="sheet">
    <h2>Shh! 🤫</h2>
    <p>This is <b>your</b> secret critter.</p>
    <div id="secretBig"></div>
    <p id="secretName"></p>
    <p>Ollie will try to guess it!</p>
    <button class="go" id="secretGo">I'm ready! ▶</button>
  </div>
</div>

<div class="overlay" id="endOv" hidden>
  <div class="sheet">
    <h2 id="endTitle">You found it!</h2>
    <p id="endMsg"></p>
    <div class="reveal">
      <div class="col">Ollie's critter<div class="mini" id="endOllie"></div></div>
      <div class="col">Your critter<div class="mini" id="endKid"></div></div>
    </div>
    <div id="endStars"></div>
    <button class="go" id="againBtn">Play again 🔄</button>
    <button class="go alt" id="menuBtn">Change game ⚙️</button>
  </div>
</div>
<canvas id="confetti"></canvas>

<script>
const ANIMALS=[{k:'cat',e:'🐱',n:'cat'},{k:'dog',e:'🐶',n:'dog'},{k:'bunny',e:'🐰',n:'bunny'},{k:'frog',e:'🐸',n:'frog'}];
const COLORS=[{k:'red',c:'var(--red)',n:'red'},{k:'blue',c:'var(--blue)',n:'blue'},{k:'yellow',c:'var(--yellow)',n:'yellow'}];
const NAMES=['Bea','Max','Lulu','Pip','Kit','Dot','Rex','Mo','Gus','Ivy','Tom','Zoe','Ada','Ben','Coco','Fin'];
const Q=[
  ...ANIMALS.map(a=>({id:'a-'+a.k,type:'animal',v:a.k,a})),
  ...COLORS.map(c=>({id:'c-'+c.k,type:'color',v:c.k,c})),
  {id:'hat',type:'hat'},{id:'bal',type:'balloon'}
];
const KEY='cowork-ollie-guess-stats';
const $=id=>document.getElementById(id);
const rnd=n=>Math.floor(Math.random()*n);
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};

const has=(c,q)=>q.type==='animal'?c.animal===q.v:q.type==='color'?c.color===q.v:q.type==='hat'?c.hat:c.balloon;
const fitsAll=(c,answers,wrong)=>!wrong.has(c.id)&&answers.every(r=>has(c,r.q)===r.ans);

function makeBoard(n){
  for(;;){
    const all=[];
    ANIMALS.forEach(a=>COLORS.forEach(c=>all.push({animal:a.k,color:c.k})));
    const pick=shuffle(all).slice(0,n);
    const names=shuffle(NAMES.slice());
    const hats=shuffle(pick.map((_,i)=>i<n/2)), bals=shuffle(pick.map((_,i)=>i<n/2));
    pick.forEach((c,i)=>{c.id='k'+i;c.name=names[i];c.hat=hats[i];c.balloon=bals[i]});
    if(n===6){const an=new Set(pick.map(c=>c.animal)).size, co=new Set(pick.map(c=>c.color)).size;if(an<3||co<2)continue}
    return pick;
  }
}

// --- Ollie's brain (pure, also used by self-test) ---
function ollieChoose(board,answers,wrong,asked,mode){
  const cand=board.filter(c=>fitsAll(c,answers,wrong));
  if(cand.length===1)return{guess:cand[0]};
  if(cand.length===2&&mode==='smart'&&Math.random()<0.5)return{guess:cand[rnd(2)]};
  const opts=Q.filter(q=>!asked.has(q.id)).map(q=>{const y=cand.filter(c=>has(c,q)).length;return{q,s:Math.min(y,cand.length-y)}});
  const useful=opts.filter(o=>o.s>0);
  if(!useful.length)return{guess:cand[rnd(cand.length)]};
  // Sleepy Ollie sometimes asks a question that doesn't help him (he's yawning!)
  if(mode==='sleepy'&&Math.random()<0.3){const o=opts[rnd(opts.length)];return{q:o.q}}
  const best=Math.max(...useful.map(o=>o.s));
  if(mode==='smart'||Math.random()<0.25){const b=useful.filter(o=>o.s===best);return{q:b[rnd(b.length)].q}}
  return{q:useful[rnd(useful.length)].q};
}

// --- state ---
let stats={played:0,kidWins:0,ollieWins:0};
try{Object.assign(stats,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){}
const saveStats=()=>{try{localStorage.setItem(KEY,JSON.stringify(stats))}catch(e){}};
let cfg={n:6,mode:'sleepy'};
try{Object.assign(cfg,JSON.parse(localStorage.getItem(KEY+'-cfg')||'{}'))}catch(e){}
let S=null, sound=true, timers=[];
const later=(fn,ms)=>{const t=setTimeout(fn,ms);timers.push(t);return t};
const clearTimers=()=>{timers.forEach(clearTimeout);timers=[]};

// --- audio ---
let ac=null;
function tone(f,d=.12,type='sine',v=.15,when=0){
  if(!sound)return;
  try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();
    const t=ac.currentTime+when,o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
    g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+d+.02)}catch(e){}
}
const sfx={
  yes:()=>{tone(660,.12,'triangle');tone(880,.18,'triangle',.15,.1)},
  no:()=>{tone(330,.14,'triangle');tone(262,.2,'triangle',.15,.1)},
  flip:()=>{tone(500,.06,'square',.06);tone(750,.08,'square',.05,.05)},
  boop:()=>tone(200,.18,'sine',.18),
  tap:()=>tone(520,.07,'triangle',.1),
  hoot:()=>{tone(392,.18,'sine',.16);tone(330,.25,'sine',.16,.2)},
  win:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.25,'triangle',.16,i*.13))
};
function say(t){
  if(!sound||!('speechSynthesis' in window))return;
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t.replace(/\p{Extended_Pictographic}|️/gu,''));u.rate=1;u.pitch=1.25;speechSynthesis.speak(u)}catch(e){}
}

// --- rendering ---
function critterHTML(c){
  const a=ANIMALS.find(x=>x.k===c.animal), col=COLORS.find(x=>x.k===c.color);
  return `<div class="inner"><div class="face"><div class="critter">${c.balloon?'<span class="balloon">🎈</span>':''}<span class="hat${c.hat?'':' none'}">🎩</span><span class="head">${a.e}</span><span class="shirt" style="background:${col.c}"></span></div><div class="name">${c.name}</div></div><div class="back">🍃</div></div>`;
}
function bubble(icon,text,speak=true){
  $('bubble').innerHTML=`<span class="big">${icon}</span><span>${text}</span>`;
  $('bubble').classList.remove('pop');void $('bubble').offsetWidth;$('bubble').classList.add('pop');
  $('ollie').classList.remove('bob');void $('ollie').offsetWidth;$('ollie').classList.add('bob');
  if(speak)say(text);
}
function qIcon(q){
  if(q.type==='animal')return q.a.e;
  if(q.type==='color')return `<span class="sw" style="background:${q.c.c};display:inline-block;width:1em;height:1em;border-radius:50% 50% 4px 4px;vertical-align:middle;border:2px solid #0003"></span>`;
  return q.type==='hat'?'🎩':'🎈';
}
function chipHTML(q){
  if(q.type==='animal')return q.a.e;
  if(q.type==='color')return `<span class="sw" style="background:${q.c.c}"></span>`;
  return q.type==='hat'?'🎩':'🎈';
}
function buildChips(){
  $('chips').innerHTML='';
  Q.forEach(q=>{const b=document.createElement('button');b.className='chip';b.dataset.q=q.id;b.innerHTML=chipHTML(q);
    b.setAttribute('aria-label',q.id);b.onclick=()=>kidAsk(q);$('chips').appendChild(b)});
  const g=document.createElement('button');g.className='chip guess';g.id='guessChip';g.textContent='🔍';g.setAttribute('aria-label','guess');
  g.onclick=toggleGuess;$('chips').appendChild(g);
}
function layoutBoard(){
  if(!S)return;
  const n=S.board.length, cols=n===6?3:4, rows=n/cols;
  const bw=$('board').clientWidth, bh=$('board').clientHeight, gap=8;
  let w=Math.min((bw-gap*(cols-1))/cols,140), h=w*1.18;
  if(h*rows+gap*(rows-1)>bh){h=(bh-gap*(rows-1))/rows;w=h/1.18}
  w=Math.max(40,Math.floor(w));h=Math.floor(w*1.18);
  const B=$('board');B.style.gridTemplateColumns=`repeat(${cols},${w}px)`;B.style.gridAutoRows=h+'px';
  B.style.setProperty('--fs',Math.round(w*.46)+'px');
}
function renderBoard(){
  const B=$('board');B.innerHTML='';
  S.board.forEach(c=>{const d=document.createElement('div');d.className='card';d.dataset.id=c.id;d.innerHTML=critterHTML(c);
    d.onclick=()=>cardTap(c,d);B.appendChild(d)});
  layoutBoard();
  $('mineCard').innerHTML=critterHTML(S.kidSecret).replace('class="inner"','class="inner" style="position:absolute;inset:0"');
  $('mineCard').querySelector('.name').remove();
}
const cardEl=c=>$('board').querySelector(`[data-id="${c.id}"]`);
function renderMini(){
  const cand=new Set(S.board.filter(c=>fitsAll(c,S.ollieAns,S.ollieWrong)).map(c=>c.id));
  $('miniRow').innerHTML=S.board.map(c=>`<span class="${cand.has(c.id)?'':'out'}">${ANIMALS.find(a=>a.k===c.animal).e}</span>`).join('');
  $('olliesBoard').querySelector('.lbl').textContent=`🦉 Ollie has ${cand.size} left`;
}
function renderChips(){
  Q.forEach(q=>{const b=$('chips').querySelector(`[data-q="${q.id}"]`);const r=S.kidAns.find(x=>x.q.id===q.id);
    b.classList.toggle('asked',!!r);b.dataset.ans=r?(r.ans?'✅':'❌'):''});
  $('guessChip').classList.toggle('on',S.guessMode);
}
function setMode(m){$('controls').className=m?('mode-'+m):''}
const kidLeft=()=>S.board.filter(c=>!S.down.has(c.id));
const kidNonFit=()=>S.board.filter(c=>!S.down.has(c.id)&&!fitsAll(c,S.kidAns,S.kidWrong));

function markCards(){
  const left=kidLeft();
  S.board.forEach(c=>{const el=cardEl(c);el.classList.toggle('down',S.down.has(c.id));
    el.classList.toggle('hint',S.phase==='kidFlip'&&!S.down.has(c.id)&&!fitsAll(c,S.kidAns,S.kidWrong));
    el.classList.toggle('last',left.length===1&&left[0]===c&&S.phase==='kidAsk');
    el.classList.toggle('guessable',S.guessMode&&!S.down.has(c.id))});
}

// --- game flow ---
function newGame(){
  clearTimers();
  const board=makeBoard(cfg.n);
  const kidSecret=board[rnd(board.length)];
  const ollieSecret=board[rnd(board.length)];
  S={board,kidSecret,ollieSecret,kidAns:[],kidWrong:new Set(),down:new Set(),ollieAns:[],ollieWrong:new Set(),ollieAsked:new Set(),
     phase:'intro',guessMode:false,ollieQ:null,lookTries:0};
  renderBoard();renderMini();renderChips();markCards();setMode('wait');
  $('secretBig').innerHTML=critterHTML(kidSecret).replace('class="inner"','class="inner" style="position:absolute;inset:0"');
  const a=ANIMALS.find(x=>x.k===kidSecret.animal);
  $('secretName').innerHTML=`<b>${kidSecret.name}</b> the ${a.n}`;
  $('secretOv').hidden=false;
  bubble('🤫','I picked my secret critter too!',false);
}
function startPlay(){
  $('secretOv').hidden=true;sfx.hoot();
  later(()=>{toKidTurn('You go first! Tap a question for me.')},150);
}
function toKidTurn(msg){
  S.phase='kidAsk';S.guessMode=false;setMode('');renderChips();markCards();
  const left=kidLeft();
  if(left.length===1)bubble('✨',`Only ${left[0].name} is left! Tap ${left[0].name} to guess!`);
  else bubble('❓',msg||'Your turn! Ask me a question.');
}
function answerText(q,yes){
  if(q.type==='animal')return yes?`Yes! Mine is a ${q.a.n}.`:`No, mine is not a ${q.a.n}.`;
  if(q.type==='color')return yes?`Yes! Mine wears ${q.c.n}.`:`No, mine is not wearing ${q.c.n}.`;
  if(q.type==='hat')return yes?'Yes! Mine has a hat.':'No hat on mine!';
  return yes?'Yes! Mine has a balloon.':'No balloon on mine!';
}
function askText(q){
  if(q.type==='animal')return `Is your critter a ${q.a.n}?`;
  if(q.type==='color')return `Is your critter wearing ${q.c.n}?`;
  if(q.type==='hat')return 'Does your critter have a hat?';
  return 'Does your critter have a balloon?';
}
function kidAsk(q){
  if(!S||S.phase!=='kidAsk')return;
  const prev=S.kidAns.find(r=>r.q.id===q.id);
  if(prev){sfx.tap();bubble(qIcon(q),'You asked that! '+answerText(q,prev.ans));return}
  S.guessMode=false;
  const yes=has(S.ollieSecret,q);
  S.kidAns.push({q,ans:yes});
  yes?sfx.yes():sfx.no();
  bubble(qIcon(q)+(yes?'✅':'❌'),answerText(q,yes));
  renderChips();
  S.phase='kidFlip';setMode('flip');markCards();
  if(!kidNonFit().length){later(()=>{bubble('👍','Nobody to flip this time!');later(startOllieTurn,1500)},1300)}
}
function toggleGuess(){
  if(!S||S.phase!=='kidAsk')return;
  S.guessMode=!S.guessMode;sfx.tap();renderChips();markCards();
  if(S.guessMode)bubble('🔍','Tap the critter you think is mine!');else bubble('❓','Okay! Ask me a question.');
}
function flipDown(c){
  S.down.add(c.id);sfx.flip();markCards();
  if(S.phase==='kidFlip'&&!kidNonFit().length){
    const left=kidLeft();
    bubble('🍃',left.length===1?`Great flipping! Only ${left[0].name} is left!`:'Great flipping!');
    S.phase='kidWait';setMode('wait');later(startOllieTurn,1300);
  }
}
function wiggle(el){el.classList.remove('wiggle');void el.offsetWidth;el.classList.add('wiggle')}
function cardTap(c,el){
  if(!S||S.down.has(c.id))return;
  const fits=fitsAll(c,S.kidAns,S.kidWrong);
  if(S.phase==='kidFlip'){
    if(!fits)flipDown(c);
    else{wiggle(el);sfx.boop();bubble('🤔',`${c.name} still fits! Keep ${c.name}.`)}
    return;
  }
  if(S.phase!=='kidAsk')return;
  const left=kidLeft();
  if(S.guessMode||(left.length===1&&left[0]===c)){kidGuess(c);return}
  if(!fits){flipDown(c);return}
  wiggle(el);sfx.tap();bubble('🔍',`Think it's ${c.name}? Tap 🔍 to guess!`);
}
function kidGuess(c){
  S.guessMode=false;S.phase='kidWait';setMode('wait');renderChips();
  bubble('🔍',`Is it ${c.name}?`);
  later(()=>{
    if(c.id===S.ollieSecret.id){sfx.win();bubble('🎉',`Yes! It's ${c.name}! You found it!`);later(()=>endGame(true),1200)}
    else{S.kidWrong.add(c.id);S.down.add(c.id);sfx.no();markCards();bubble('🙂',`Not ${c.name}! Good try!`);later(startOllieTurn,1600)}
  },900);
}
function startOllieTurn(){
  if(!S||S.phase==='over')return;
  S.phase='ollieThink';S.guessMode=false;setMode('wait');markCards();
  bubble('🤔','My turn! Hmm…',false);
  later(()=>{
    const ch=ollieChoose(S.board,S.ollieAns,S.ollieWrong,S.ollieAsked,cfg.mode);
    S.ollieQ=ch;S.phase='ollieAsk';S.lookTries=0;setMode('yesno');sfx.hoot();
    if(ch.guess){const a=ANIMALS.find(x=>x.k===ch.guess.animal);bubble(a.e+'❓',`Is your critter ${ch.guess.name}?`)}
    else bubble(qIcon(ch.q)+'❓',askText(ch.q));
  },1100);
}
function kidAnswer(ans){
  if(!S||S.phase!=='ollieAsk')return;
  const ch=S.ollieQ;
  const truth=ch.guess?ch.guess.id===S.kidSecret.id:has(S.kidSecret,ch.q);
  if(ans!==truth){
    sfx.boop();S.lookTries++;
    const m=$('mine');m.classList.remove('look');void m.offsetWidth;m.classList.add('look');
    bubble('🔍',S.lookTries>1?`Look at your critter! The answer is ${truth?'YES 👍':'NO 👎'}.`:'Hmm, look at your secret critter again!');
    return;
  }
  ans?sfx.yes():sfx.no();
  setMode('wait');S.phase='ollieWait';
  if(ch.guess){
    if(ans){bubble('🦉','Hooray! I guessed it! What a fun game!');later(()=>endGame(false),1400);return}
    S.ollieWrong.add(ch.guess.id);bubble('😄','Oh! Not that one. Thank you!');
  }else{
    S.ollieAsked.add(ch.q.id);S.ollieAns.push({q:ch.q,ans});
    bubble('😊',ans?'Thank you! Let me flip some down.':'Okay! I\'ll flip some down.');
  }
  renderMini();
  later(()=>toKidTurn(),1500);
}
function endGame(kidWon){
  S.phase='over';setMode('wait');
  stats.played++;kidWon?stats.kidWins++:stats.ollieWins++;saveStats();
  $('endTitle').textContent=kidWon?'🎉 You found it!':'🦉 Ollie found it!';
  $('endMsg').textContent=kidWon?`Ollie's critter was ${S.ollieSecret.name}. Super detective!`:`Ollie guessed ${S.kidSecret.name}. What a great game — try again!`;
  const box=c=>critterHTML(c).replace('class="inner"','class="inner" style="position:absolute;inset:0"');
  $('endOllie').innerHTML=box(S.ollieSecret);$('endKid').innerHTML=box(S.kidSecret);
  $('endStars').innerHTML=starLine();
  $('endOv').hidden=false;
  if(kidWon)confetti();else sfx.hoot();
}
function starLine(){
  if(!stats.played)return '';
  const st='⭐'.repeat(Math.min(stats.kidWins,20))+(stats.kidWins>20?' +'+(stats.kidWins-20):'');
  return `<div class="stars">${st||'🌱'}</div><p style="font-size:14px">Games played: ${stats.played} · Found Ollie's critter: ${stats.kidWins}</p>`;
}

// --- confetti ---
function confetti(){
  const cv=$('confetti'),x=cv.getContext('2d');cv.width=innerWidth;cv.height=innerHeight;
  const cols=['#ff5fa2','#8a5cff','#ffc300','#3a86ff','#2ec46a','#ff9f1c'];
  const P=Array.from({length:120},()=>({x:Math.random()*cv.width,y:-20-Math.random()*cv.height*.5,vx:(Math.random()-.5)*3,vy:2+Math.random()*3,r:Math.random()*6,c:cols[rnd(6)],a:Math.random()*6}));
  let f=0;(function step(){x.clearRect(0,0,cv.width,cv.height);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.a+=.1;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-4,-2,8+p.r,5);x.restore()});
    if(++f<200)requestAnimationFrame(step);else x.clearRect(0,0,cv.width,cv.height)})();
}

// --- wiring ---
function syncPick(){
  document.querySelectorAll('#sizePick button').forEach(b=>b.classList.toggle('sel',+b.dataset.n===cfg.n));
  document.querySelectorAll('#modePick button').forEach(b=>b.classList.toggle('sel',b.dataset.m===cfg.mode));
  $('stars').innerHTML=stats.kidWins?'⭐'.repeat(Math.min(stats.kidWins,20)):'';
}
document.querySelectorAll('#sizePick button').forEach(b=>b.onclick=()=>{cfg.n=+b.dataset.n;sfx.tap();syncPick()});
document.querySelectorAll('#modePick button').forEach(b=>b.onclick=()=>{cfg.mode=b.dataset.m;sfx.tap();syncPick()});
$('startBtn').onclick=()=>{try{localStorage.setItem(KEY+'-cfg',JSON.stringify(cfg))}catch(e){}$('startOv').hidden=true;newGame()};
$('secretGo').onclick=startPlay;
$('yesBtn').onclick=()=>kidAnswer(true);
$('noBtn').onclick=()=>kidAnswer(false);
$('helpBtn').onclick=()=>{if(S&&S.phase==='kidFlip'){const nf=kidNonFit();nf.forEach((c,i)=>later(()=>{if(S.phase==='kidFlip')flipDown(c)},i*160))}};
$('againBtn').onclick=()=>{$('endOv').hidden=true;newGame()};
$('menuBtn').onclick=()=>{$('endOv').hidden=true;clearTimers();syncPick();$('startOv').hidden=false};
$('newBtn').onclick=()=>{clearTimers();if(S)S.phase='over';try{speechSynthesis.cancel()}catch(e){}$('endOv').hidden=true;$('secretOv').hidden=true;syncPick();$('startOv').hidden=false};
$('sndBtn').onclick=()=>{sound=!sound;$('sndBtn').textContent=sound?'🔊':'🔇';if(!sound)try{speechSynthesis.cancel()}catch(e){}};
addEventListener('resize',layoutBoard);
if(window.ResizeObserver)new ResizeObserver(layoutBoard).observe($('board'));
buildChips();syncPick();
</script>
