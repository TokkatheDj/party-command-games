<!-- CONCEPT: PRETEND PLAY (mechanic) - Benny's Fix-It Garage: animal customers drive cars, vans, trucks, buses, pickups, a fire truck and an ice cream van into Benny the beaver's garage with things that need fixing - flat tire, empty tank, mud, a broken headlight, a dent, squeaky wheels, loose bolts, scratches, a dead battery. Kids pick the right tool from the 9-tool box and really use it: pump the tire, hold the nozzle or the charger, rub mud off with the sponge and paint over scratches, pop in a bulb, tap out the dent, oil each wheel, tighten each bolt. Each fixed vehicle honks thank-you and drives away; a garage day has 8 customers that grow from one problem to a four-problem big job, and a saved Garage Book collects all 16 friends. All art is drawn (SVG), no emoji. No timer, no losing - a wrong tool just gets a friendly hint and the right tool wiggles. Ages 4-11. -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Benny's Fix-It Garage</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#2b2340; --panel:#fffdf7; --accent:#ff7a2f; --accent3:#3fa7ff;
  --good:#35c26b; --btn:#ffffff; --btn-on:#fff1c2; --hint:#ff4f8b;
  --radius:16px; --font:"Fredoka","Nunito","Trebuchet MS",system-ui,sans-serif;
}
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none;font-family:var(--font);font-weight:500;color:var(--ink);background:#dbeefe}
#app{display:flex;flex-direction:column;height:100%;height:100dvh}
.art{display:block;width:100%;height:100%}
header{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:6px 10px;background:#fff;box-shadow:0 2px 10px rgba(43,35,64,.10);z-index:2}
h1{margin:0;flex:1;min-width:0;font-size:clamp(16px,4.4vw,26px);font-weight:700;line-height:1.05;letter-spacing:.2px}
h1 .grad{background:linear-gradient(90deg,#ff5a2f,#e89a00,#2f8fff);-webkit-background-clip:text;background-clip:text;color:transparent}
.hbtn{flex:0 0 auto;width:46px;height:46px;border:none;border-radius:14px;background:#f3f1fb;padding:9px;cursor:pointer;color:var(--ink)}
.hbtn:hover{background:#e9e5f7}
.hbtn:active{transform:scale(.94)}
.hbtn:focus-visible,.tool:focus-visible,.big:focus-visible,#cv:focus-visible{outline:4px solid var(--accent3);outline-offset:2px}
#dots{display:flex;gap:4px;align-items:center}
#dots .dot{width:clamp(14px,3.6vw,24px);height:clamp(14px,3.6vw,24px);border-radius:50%;background:#e6e3f0}
#dots .dot.on{background:#fff1c2}
@media (max-width:560px){#dots{flex-wrap:wrap;width:88px;gap:3px}#dots .dot{width:18px;height:18px}}
#msg{flex:0 0 auto;height:60px;display:flex;align-items:center;gap:10px;padding:4px 12px;background:var(--panel);border-bottom:1px solid #efe6d2}
#msg .benny{width:48px;height:48px;flex:0 0 auto}
#say{flex:1;min-width:0;font-size:clamp(14px,3.7vw,19px);line-height:1.2;max-height:52px;overflow:hidden}
#stage{flex:1 1 auto;position:relative;min-height:0;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:pointer}
#jobs{flex:0 0 auto;height:46px;display:flex;gap:6px;align-items:center;justify-content:center;padding:4px 6px;background:#fff7e6;overflow:hidden}
.chip{display:flex;align-items:center;gap:5px;padding:3px 10px 3px 4px;border-radius:999px;background:#fff;box-shadow:0 1px 4px rgba(43,35,64,.12);font-size:clamp(12px,3.4vw,16px);white-space:nowrap}
.chip .art{width:26px;height:26px}
.chip.done{background:#e3f8ea;text-decoration:line-through;opacity:.85}
#tools{flex:0 0 auto;display:grid;grid-template-columns:repeat(9,1fr);gap:6px;padding:8px 8px calc(8px + env(safe-area-inset-bottom));background:#2b2340}
@media (max-width:700px){#tools{grid-template-columns:repeat(5,1fr);gap:5px;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}}
.tool{min-height:62px;border:none;border-radius:var(--radius);background:#3a3156;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-family:var(--font);color:#fff;padding:4px 2px;transition:background .15s,transform .1s}
.tool .art{width:32px;height:32px}
.tool .n{font-size:clamp(11px,2.8vw,14px);font-weight:600}
@media (max-width:700px){.tool{min-height:54px}.tool .art{width:28px;height:28px}}
.tool:hover{background:#463c66}
.tool.sel{background:#fff1c2;color:var(--ink);box-shadow:0 0 0 3px #ffd23f}
.tool.hint{animation:wig .5s ease-in-out infinite;background:#ff4f8b}
.tool:active{transform:scale(.94)}
@keyframes wig{0%,100%{transform:rotate(0)}25%{transform:rotate(-7deg) scale(1.06)}75%{transform:rotate(7deg) scale(1.06)}}
.overlay{position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;padding:14px;background:rgba(43,35,64,.5);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.overlay[hidden]{display:none}
.card{background:var(--panel);border-radius:26px;padding:20px 18px;max-width:460px;width:100%;max-height:100%;overflow-y:auto;text-align:center;box-shadow:0 18px 40px rgba(43,35,64,.35)}
.card h2{margin:4px 0 8px;font-size:clamp(24px,6.5vw,34px);font-weight:700;background:linear-gradient(90deg,#ff5a2f,#e89a00,#2f8fff);-webkit-background-clip:text;background-clip:text;color:transparent}
.card .face{position:relative;width:110px;height:110px;margin:0 auto}
.card .face .hero{width:110px;height:110px}
.card .face .side{position:absolute;width:44px;height:44px;right:-18px;bottom:-4px}
.card p{margin:6px 0 12px;font-size:clamp(15px,4vw,18px);line-height:1.35}
.big{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:60px;margin:8px 0;border:none;border-radius:18px;font-family:var(--font);font-size:clamp(18px,5vw,23px);font-weight:600;cursor:pointer;color:#fff;background:linear-gradient(180deg,#ff8f45,#ea5a1a);box-shadow:0 5px 0 #b8400c}
.big .art{width:30px;height:30px;flex:0 0 auto}
.big.alt{background:linear-gradient(180deg,#55b8ff,#2f86e0);box-shadow:0 5px 0 #1d5ea8}
.big:active{transform:translateY(4px);box-shadow:0 1px 0 #b8400c}
.row{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;margin:6px 0}
.row .art{width:clamp(32px,9vw,44px);height:clamp(32px,9vw,44px)}
#bookGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));grid-auto-rows:max-content;gap:8px;margin:8px 0}
.bk{background:#fff;border-radius:16px;padding:8px 6px;box-shadow:0 1px 5px rgba(43,35,64,.12);font-size:13px}
.bk .e{width:48px;height:48px;margin:0 auto 2px}
.bk.none{opacity:.35;filter:grayscale(1)}
@media (prefers-reduced-motion: reduce){.tool.hint{animation:none;outline:4px dashed #fff}}
</style>
</head>
<body>
<div id="app">
  <header>
    <button class="hbtn" id="homeBtn" aria-label="Home menu"></button>
    <h1><span class="grad">Benny's Fix-It Garage</span></h1>
    <div id="dots" role="img" aria-label="Customers fixed today"></div>
    <button class="hbtn" id="sndBtn" aria-label="Sound and voice on" aria-pressed="true"></button>
  </header>
  <div id="msg"><span class="benny" id="bennyFace"></span><div id="say" aria-live="polite">Hi! I'm Benny!</div></div>
  <div id="stage">
    <canvas id="cv" tabindex="0" aria-label="Garage. Pick a tool, then tap or rub the vehicle. Keyboard: press Space to use the tool."></canvas>
    <div class="overlay" id="titleOv">
      <div class="card">
        <div class="face" id="titleFace"></div>
        <h2>Benny's Fix-It Garage</h2>
        <p>Cars, vans, fire trucks and even the ice cream van need help! Look at what's wrong, pick the right tool, and fix it up.</p>
        <button class="big" id="startBtn">Open the Garage</button>
        <button class="big alt" id="bookBtn">Garage Book</button>
      </div>
    </div>
    <div class="overlay" id="endOv" hidden>
      <div class="card">
        <div class="face" id="endFace"></div>
        <h2>Great Garage Day!</h2>
        <p id="endTxt">You fixed every vehicle!</p>
        <div class="row" id="endRow"></div>
        <button class="big" id="againBtn">Another Day</button>
        <button class="big alt" id="endBookBtn">Garage Book</button>
      </div>
    </div>
    <div class="overlay" id="bookOv" hidden>
      <div class="card">
        <h2>Garage Book</h2>
        <p id="bookTxt"></p>
        <div id="bookGrid"></div>
        <button class="big alt" id="bookBack">Back</button>
      </div>
    </div>
  </div>
  <div id="jobs" role="group" aria-label="Jobs to do"></div>
  <div id="tools" role="toolbar" aria-label="Toolbox"></div>
</div>
<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);

const KEY = 'cowork-bennygarage-';
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

const HEAD = c => `<circle cx="50" cy="55" r="33" fill="${c}"/>`;

  cat: PAIR(s => `<path d="M${50-30*s} 38l${2*s}-24 ${18*s} 12z" fill="#9aa1ad"/><path d="M${50-27*s} 33l${1*s}-12 ${9*s} 6z" fill="#ffb3c7"/>`) + HEAD('#9aa1ad') + EYES(50) + `<path d="M46 60h8l-4 4z" fill="#ff8fab"/>` + SMILE(67, 5) + PAIR(s => `<path d="M${50-14*s} 63h${-16*s}M${50-14*s} 67l${-15*s} 4" stroke="#6b7280" stroke-width="2" stroke-linecap="round"/>`),

  elephant: PAIR(s => `<ellipse cx="${50-34*s}" cy="54" rx="17" ry="23" fill="#a7b4c8"/><ellipse cx="${50-34*s}" cy="54" rx="9" ry="14" fill="#ffc9d6"/>`) + HEAD('#b8c4d6') + EYES(46) + `<path d="M50 58q-2 20 10 26" stroke="#b8c4d6" stroke-width="13" fill="none" stroke-linecap="round"/><path d="M50 58q-2 20 10 26" stroke="#a7b4c8" stroke-width="2" fill="none" stroke-dasharray="3 5"/>` + BLUSH,
  turtle: HEAD('#8fd88a') + `<circle cx="36" cy="30" r="5" fill="#5fb85a"/><circle cx="52" cy="25" r="6" fill="#5fb85a"/><circle cx="67" cy="32" r="4.5" fill="#5fb85a"/>` + EYES(52) + SMILE(66, 9) + BLUSH
};
const ICONS = {
  pump: `<rect x="16" y="12" width="24" height="42" rx="7" fill="#3fa7ff"/><rect x="16" y="12" width="24" height="11" rx="5.5" fill="#2f7fd0"/><circle cx="28" cy="36" r="7.5" fill="#fff"/><path d="M28 36l4.5-4.5" stroke="${INK}" stroke-width="2.5" stroke-linecap="round"/><path d="M40 44c11 0 13 6 13 12" fill="none" stroke="${INK}" stroke-width="4" stroke-linecap="round"/><rect x="12" y="52" width="32" height="6" rx="3" fill="${INK}"/>`,
  gas: `<path d="M14 18h22a6 6 0 0 1 6 6v8H14a4 4 0 0 1-4-4v-6a4 4 0 0 1 4-4z" fill="#ff5a5f"/><path d="M42 23h9l5 6" fill="none" stroke="#6b7280" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M18 32v12a8 8 0 0 0 8 8h4" fill="none" stroke="${INK}" stroke-width="5" stroke-linecap="round"/><path d="M22 32l3 8h8l2-8z" fill="#d63e43"/><path d="M56 34c0 3-2 5-4 5s-4-2-4-5 4-8 4-8 4 5 4 8z" fill="#ffb020"/>`,
  sponge: `<rect x="9" y="22" width="46" height="28" rx="9" fill="#ffd23f"/><rect x="9" y="22" width="46" height="10" rx="6" fill="#4fd17f"/><circle cx="21" cy="40" r="3" fill="#e8b51f"/><circle cx="33" cy="43" r="2.5" fill="#e8b51f"/><circle cx="45" cy="38" r="3" fill="#e8b51f"/><circle cx="50" cy="12" r="5.5" fill="#dff3ff" stroke="#7cc4f5" stroke-width="2"/><circle cx="39" cy="9" r="3.5" fill="#dff3ff" stroke="#7cc4f5" stroke-width="2"/>`,
  bulb: `<path d="M32 6a17 17 0 0 0-10 30.5c2.2 2 3.4 4.5 3.4 7.5h13.2c0-3 1.2-5.5 3.4-7.5A17 17 0 0 0 32 6z" fill="#ffd23f"/><path d="M25 19a9 9 0 0 1 7-6" stroke="#fff6c2" stroke-width="3.5" fill="none" stroke-linecap="round"/><rect x="24.5" y="45" width="15" height="5" rx="2" fill="#9aa1ad"/><rect x="25.5" y="51" width="13" height="5" rx="2" fill="#7d828c"/><rect x="29" y="56.5" width="6" height="3.5" rx="1.7" fill="#5b606a"/>`,
  hammer: `<g transform="rotate(-35 32 32)"><rect x="28" y="22" width="8" height="38" rx="4" fill="#c98a4b"/><rect x="11" y="9" width="42" height="15" rx="4" fill="#9aa1ad"/><rect x="11" y="9" width="13" height="15" rx="3" fill="#6b7280"/></g>`,
  oil: `<rect x="8" y="30" width="32" height="25" rx="6" fill="#35c26b"/><rect x="17" y="23" width="14" height="8" rx="2" fill="#2a9d55"/><path d="M38 38l15-12" stroke="#6b7280" stroke-width="4.5" stroke-linecap="round"/><path d="M12 30c0-9 24-9 24 0" fill="none" stroke="#2a9d55" stroke-width="3"/><path d="M57 37c0 3-2 5-4 5s-4-2-4-5 4-8 4-8 4 5 4 8z" fill="#ffb020"/>`,

function makeVehicle(idx){
  // one problem to start, building to a four-problem "big job" for the last customer
  const nProbs = idx < 2 ? 1 : idx < 5 ? 2 : idx < DAY_LEN - 1 ? 3 : 4;
  // a different vehicle for each customer until all seven have come in
  const used = cars.filter(Boolean).map(c => c.shape), fresh = SHAPES.filter(s => !used.includes(s));
  const shape = idx === 0 ? 'car' : pick(fresh.length ? fresh : SHAPES);
  const g = geo(shape);
  const who = dayCustomers[idx];
  // favour problems not used by the previous car so the day mixes it up
  const prev = idx > 0 && cars[idx-1] ? cars[idx-1].probs : [];
  const keys = shuffle(Object.keys(PROBS)).sort((a,b) => (prev.includes(a)?1:0) - (prev.includes(b)?1:0)).slice(0, nProbs);
  const v = {shape, g, who, color: pick(SHAPE_COLORS[shape] || COLORS), probs: keys, st:{}, x:0, rot:0, bounce:0};
  const [bx0,bx1,by0,by1] = g.bodyBox;
  if(keys.includes('tire')) v.st.tire = {wheel: Math.random()<.5?0:1, level:0.3};
  if(keys.includes('gas')) v.st.gas = {level:0.08};
  if(keys.includes('mud')){
    const spots = [];
    for(let i=0;i<6;i++) spots.push({x: bx0 + (bx1-bx0)*((i+0.5)/6) + rnd(-4,4), y: rnd(by0+4, by1-2), r: rnd(5,8), dirt:1});

  if(keys.includes('bolts')) v.st.bolts = {wheel: v.st.tire ? 1 - v.st.tire.wheel : (Math.random()<.5?0:1), tight:0};

function startDay(){
  ac();
  for(const id of ['titleOv','endOv','bookOv']) $(id).hidden = true;
  dayCustomers = shuffle(CUSTOMERS.slice()).slice(0, DAY_LEN);
  cars = []; carIdx = 0;
  nextCar();
}
function nextCar(){
  car = makeVehicle(carIdx); cars[carIdx] = car;
  for(const k in doneFlags) delete doneFlags[k];
  tool = null; wrongCount = 0; renderTools(); setHints([]);
  mode = 'arrive'; phaseT = 0; car.x = -1;
  SFX.vroom();
  say(`Beep beep! Here comes ${car.who.n} in a ${SHAPE_NAME[car.shape]}!`);
  renderJobs(); renderDots();
}
function startFixing(){
  mode = 'fix';
  const r = remaining(car);
  const names = r.map(k => PROBS[k].label.toLowerCase());
  const list = names.length === 1 ? names[0] : names.slice(0,-1).join(', ') + ' and ' + names[names.length-1];
  say(`${r.length > 3 ? 'Big job! ' : 'Oh no! '}${car.who.n} has: ${list}. Pick a tool!`);
}
function chooseTool(id){
  ac(); SFX.tap();
  if(mode !== 'fix'){ tool = id; renderTools(); return; }
  const need = remaining(car).map(k => PROBS[k].tool);
  if(!need.includes(id)){
    wrongCount++;
    tool = null; renderTools(); SFX.oops();
    const hintIds = [...new Set(need)];
    setHints(hintIds);
    car.bounce = 0.6;
    say(wrongCount > 1
      ? `Hmm, not the ${TOOL[id].n} this time. Try the wiggly ${TOOL[hintIds[0]].n}!`
      : `Hmm, the ${TOOL[id].n} won't help this ${SHAPE_NAME[car.shape]}. Look at the wiggly tools!`);
    return;
  }
  tool = id; renderTools(); setHints([]);
  const k = remaining(car).find(k => PROBS[k].tool === id);
  say(`Good pick! ${PROBS[k].how}`);
}
function problemFixed(k){
  if(doneFlags[k]) return; doneFlags[k] = true;
  SFX.fixed(); renderJobs();
  const c = carCenter();
  burst(c.x, c.y - 30*c.u, 16, ['star','spark','star']);
  tool = null; renderTools();
  if(remaining(car).length === 0){
    mode = 'leave'; phaseT = 0;
    book.total++; book.who[car.who.n] = (book.who[car.who.n]||0) + 1; saveBook();
    setTimeout(SFX.honk, 350);
    say(`${PROBS[k].done} All fixed! ${car.who.n} says THANK YOU, Benny!`);
  } else {
    say(`${PROBS[k].done} What else needs fixing?`);
  }
}
function endDay(){
  mode = 'end'; book.days++; saveBook();
  SFX.tada();
  $('endTxt').textContent = `You fixed all ${DAY_LEN} vehicles today! Benny's garage is the best in town.`;
  $('endRow').innerHTML = dayCustomers.map(c => art('a-' + c.k)).join('');
  $('endOv').hidden = false;
  confettiRain();
  renderDots(); say('Great garage day! You fixed everyone!');
}
function showBook(){
  for(const id of ['titleOv','endOv']) $(id).hidden = true;
  $('bookTxt').textContent = book.total
    ? `You have fixed ${book.total} vehicle${book.total===1?'':'s'} in ${book.days} garage day${book.days===1?'':'s'}!`
    : 'No fixes yet - open the garage to help your first friend!';
  const g = $('bookGrid'); g.innerHTML = '';
  for(const c of CUSTOMERS){
    const n = book.who[c.n] || 0;
    const d = document.createElement('div'); d.className = 'bk' + (n ? '' : ' none');
    d.innerHTML = `${art('a-' + c.k, 'e')}${c.n}<br><b>${n ? 'Fixed × ' + n : '?'}</b>`;
    g.appendChild(d);
  }
  $('bookOv').hidden = false;
}
function goHome(){
  mode = 'title'; car = null; tool = null; renderTools(); setHints([]); renderJobs(); renderDots();
  for(const id of ['endOv','bookOv']) $(id).hidden = true;
  $('titleOv').hidden = false;
  say("Hi! I'm Benny! Let's fix some cars!", false);
}

// ---------- coordinates ----------
// gas pump stands at the left edge; the car parks in the space to its right
function pumpBox(){
  const pu = Math.min(W*0.0072, H*0.0105);
  const gx = Math.max(6, W*0.015), gw = 18*pu;
  return {gx, gw, gh: 62*pu, pu};
}
function carCenter(){
  const pb = pumpBox(), left = pb.gx + pb.gw + 6;
  const u = Math.min((W - left - 10)/112, H*0.0105);
  const groundY = H*0.80;
  const park = left + (W - left)/2;
  const cx = car.x <= 0 ? park + car.x*(park + 60*u) : park + car.x*(W - park + 60*u);
  return {x:cx, y:groundY, u};
}
function toScreen(px, py){ const c = carCenter(); return {x: c.x + px*c.u, y: c.y + py*c.u, u:c.u}; }
function wheelY(){ return -11; }
const dist = (ax,ay,bx,by) => Math.hypot(ax-bx, ay-by);

// ---------- tool actions ----------
function pumpAt(x, y, forced){
  const s = car.st.tire; if(!s || s.level >= 1) return false;
  const w = toScreen(car.g.wheels[s.wheel], wheelY());
  if(!forced && dist(x,y,w.x,w.y) > Math.max(40, 18*w.u)) return false;
  s.level = Math.min(1, s.level + 0.14); SFX.pump();
  burst(w.x + 14*w.u, w.y, 4, ['puff']);
  if(s.level >= 1) problemFixed('tire');
  return true;
}
function bulbAt(x, y, forced){
  const s = car.st.light; if(!s || s.ok) return false;
  const p = toScreen(...car.g.light);
  if(!forced && dist(x,y,p.x,p.y) > Math.max(40, 14*p.u)) return false;
  s.ok = true; SFX.click(); burst(p.x, p.y, 10, ['spark','star']);
  problemFixed('light'); return true;
}
function hammerAt(x, y, forced){
  const s = car.st.dent; if(!s || s.hits >= 3) return false;
  const p = toScreen(s.x, s.y);
  if(!forced && dist(x,y,p.x,p.y) > Math.max(40, 14*p.u)) return false;
  s.hits++; SFX.bonk(); car.bounce = 0.5; burst(p.x, p.y, 5, ['spark']);
  if(s.hits >= 3) problemFixed('dent');
  else say(s.hits === 1 ? 'Bonk! Keep tapping!' : 'Bonk bonk! One more!', false);
  return true;
}
function oilAt(x, y, forced){
  const s = car.st.squeak; if(!s) return false;
  for(let i=0;i<2;i++){
    if(s.oiled[i]) continue;
    const w = toScreen(car.g.wheels[i], wheelY());
    if(forced || dist(x,y,w.x,w.y) < Math.max(40, 18*w.u)){
      s.oiled[i] = true; SFX.drip(); burst(w.x, w.y - 10*w.u, 5, ['drop']);
      if(s.oiled.every(Boolean)) problemFixed('squeak'); else say('Drip! Now the other wheel!', false);
      return true;
    }
  }
  return false;
}
function onCar(x, y){
  const [bx0,bx1] = car.g.bodyBox; const a = toScreen(bx0-8, -car.g.h-6), b = toScreen(bx1+8, 4);
  return x > a.x && x < b.x && y > a.y && y < b.y;
}
function scrub(x, y, amount, key='mud'){
  const s = car.st[key]; if(!s) return false;
  let hit = false;
  for(const p of s.spots){
    if(p.dirt <= 0) continue;
    const q = toScreen(p.x, p.y);
    if(dist(x,y,q.x,q.y) < p.r*q.u + 22){
      p.dirt -= amount; hit = true;
      if(p.dirt <= 0){ p.dirt = 0; burst(q.x, q.y, 4, key === 'mud' ? ['bubble'] : ['spark']); }
    }
  }
  if(hit && Math.random() < 0.35) (key === 'mud' ? SFX.scrub : SFX.paint)();
  if(hit && isDone(car,key)) problemFixed(key);
  return hit;
}
function boltAt(x, y, forced){
  const s = car.st.bolts; if(!s || s.tight >= 3) return false;
  const w = toScreen(car.g.wheels[s.wheel], wheelY());
  if(!forced && dist(x,y,w.x,w.y) > Math.max(40, 18*w.u)) return false;
  s.tight++; SFX.ratchet(); burst(w.x, w.y, 4, ['spark']);
  if(s.tight >= 3) problemFixed('bolts');
  else say(s.tight === 1 ? 'Click! Two more bolts!' : 'Click click! One more!', false);
  return true;
}
function useToolAt(x, y){
  if(mode !== 'fix' || !tool) {
    if(mode === 'fix' && !tool){ say('Pick a tool from the toolbox first!', false); setHints([...new Set(remaining(car).map(k => PROBS[k].tool))]); }
    return;
  }
  if(tool === 'pump') pumpAt(x,y) || nudge();
  else if(tool === 'bulb') bulbAt(x,y) || nudge();
  else if(tool === 'hammer') hammerAt(x,y) || nudge();
  else if(tool === 'oil') oilAt(x,y) || nudge();
  else if(tool === 'wrench') boltAt(x,y) || nudge();
  else if(tool === 'sponge') scrub(x,y,0.2);
  else if(tool === 'brush') scrub(x,y,0.2,'scratch');
}
let nudgeT = 0;
function nudge(){
  if(tool === 'gas' || tool === 'charge') return;
  const now = performance.now(); if(now - nudgeT < 1200) return; nudgeT = now;
  const tips = {pump:'Tap the flat tire - the one that is squished!', bulb:'Tap the dark headlight at the front!', hammer:'Tap right on the dent!', oil:'Tap a squeaky wheel!', wrench:'Tap the wheel with the wobbly bolts!'};
  say(tips[tool] + ' Look for the glowing ring.', false);
}
// keyboard / switch fallback: one step of the selected tool on the next target
function useToolStep(){
  if(mode !== 'fix' || !tool) return useToolAt(0,0);
  if(tool === 'pump') pumpAt(0,0,true);
  else if(tool === 'bulb') bulbAt(0,0,true);
  else if(tool === 'hammer') hammerAt(0,0,true);
  else if(tool === 'oil') oilAt(0,0,true);
  else if(tool === 'wrench') boltAt(0,0,true);
  else if(tool === 'gas' || tool === 'charge') fillStep(0.25);
  else if(tool === 'sponge' || tool === 'brush'){
    const key = tool === 'sponge' ? 'mud' : 'scratch', s = car.st[key];
    const p = s && s.spots.find(p => p.dirt > 0); if(p){ const q = toScreen(p.x,p.y); scrub(q.x, q.y, 0.5, key); }
  }
}
// gas and the battery charger both fill while you hold on the car
function fillStep(amount){
  const key = tool === 'gas' ? 'gas' : 'battery', s = car.st[key];
  if(!s || s.level >= 1) return;
  s.level = Math.min(1, s.level + amount);
  if(key === 'gas') glug(); else zap();
  if(s.level >= 1) problemFixed(key);
}
let lastZap = 0;
function zap(){ const now = performance.now(); if(now - lastZap > 240){ lastZap = now; tone(500 + car.st.battery.level*500, 0.08, 'square', 0.05, 300); const p = toScreen(...car.g.light); burst(p.x - 12*p.u, p.y - 20*p.u, 1, ['bolt']); } }
function glug(){ const now = performance.now(); if(now - lastGlug > 180){ lastGlug = now; tone(200 + (car.st.gas ? car.st.gas.level*300 : 0), 0.12, 'sine', 0.12, 60); } }

// ---------- pointer ----------
function pos(e){ const r = cv.getBoundingClientRect(); return {x: e.clientX - r.left, y: e.clientY - r.top}; }
cv.addEventListener('pointerdown', e => {
  ac(); const p = pos(e);
  try{ cv.setPointerCapture(e.pointerId); }catch(_){}
  pointer = {x:p.x, y:p.y, down:true, inside:true, lastX:p.x, lastY:p.y};
  if(mode === 'fix') useToolAt(p.x, p.y);
  else if(mode === 'arrive'){ SFX.honk(); }
});
cv.addEventListener('pointermove', e => {
  const p = pos(e);
  const d = dist(p.x, p.y, pointer.lastX, pointer.lastY);
  pointer.x = p.x; pointer.y = p.y; pointer.inside = true;
  if(pointer.down && mode === 'fix' && (tool === 'sponge' || tool === 'brush') && d > 0){
    const key = tool === 'sponge' ? 'mud' : 'scratch';
    // step along the path so fast swipes still scrub every spot they cross
    const steps = Math.max(1, Math.ceil(d/8));
    for(let i=1;i<=steps;i++){
      const sx = pointer.lastX + (p.x - pointer.lastX)*i/steps, sy = pointer.lastY + (p.y - pointer.lastY)*i/steps;
      scrub(sx, sy, (d/steps)/90, key);
      if(!car.st[key] || isDone(car,key)) break;
    }
  }
  pointer.lastX = p.x; pointer.lastY = p.y;
});
const up = () => { pointer.down = false; };
cv.addEventListener('pointerup', up);
cv.addEventListener('pointercancel', up);
cv.addEventListener('pointerleave', () => { pointer.inside = false; });
cv.addEventListener('keydown', e => {
  if(e.key === ' ' || e.key === 'Enter'){ e.preventDefault(); useToolStep(); }
  const n = parseInt(e.key, 10); if(n >= 1 && n <= TOOLS.length) chooseTool(TOOLS[n-1].id);
});

// ---------- particles ----------
function burst(x, y, n, kinds){
  const k = reduceMotion ? Math.ceil(n/3) : n;
  for(let i=0;i<k;i++) particles.push({x, y, vx: rnd(-120,120), vy: rnd(-220,-60), life: 1, kind: pick(kinds), s: rnd(10,16), g: 380, rot: rnd(0,6), vr: rnd(-6,6), c: pick(CONFETTI)});
}
const CONFETTI = ['#ff5a5f','#3fa7ff','#ffd23f','#4fd17f','#b07cff','#ff9f43'];
function confettiRain(){
  const n = reduceMotion ? 12 : 70;
  for(let i=0;i<n;i++) particles.push({x: rnd(0,W), y: rnd(-H*0.5, 0), vx: rnd(-30,30), vy: rnd(40,140), life: 2.2, kind: pick(['confetti','confetti','star']), s: rnd(8,14), g: 60, rot: rnd(0,6), vr: rnd(-5,5), c: pick(CONFETTI)});
}
function starPath(x, y, r, pts=5, inner=0.45){
  ctx.beginPath();
  for(let i=0;i<pts*2;i++){ const a = -Math.PI/2 + i*Math.PI/pts, rr = i%2 ? r*inner : r; ctx.lineTo(x + Math.cos(a)*rr, y + Math.sin(a)*rr); }
  ctx.closePath();
}
function drawParticle(p){
  const a = Math.min(1, p.life*1.5), s = p.s;
  ctx.save(); ctx.globalAlpha = a; ctx.translate(p.x, p.y); ctx.rotate(p.rot);
  switch(p.kind){
    case 'star': starPath(0, 0, s); ctx.fillStyle = '#ffd23f'; ctx.fill(); ctx.lineWidth = 1.5; ctx.strokeStyle = '#f0a500'; ctx.stroke(); break;
    case 'spark': starPath(0, 0, s*0.9, 4, 0.25); ctx.fillStyle = '#fff6c2'; ctx.fill(); break;
    case 'bubble': ctx.beginPath(); ctx.arc(0, 0, s*0.6, 0, 7); ctx.fillStyle = 'rgba(223,243,255,.55)'; ctx.fill(); ctx.strokeStyle = '#7cc4f5'; ctx.lineWidth = 1.5; ctx.stroke();
      ctx.beginPath(); ctx.arc(-s*0.2, -s*0.2, s*0.15, 0, 7); ctx.fillStyle = '#fff'; ctx.fill(); break;
    case 'drop': ctx.rotate(-p.rot); ctx.beginPath(); ctx.moveTo(0, -s*0.7); ctx.quadraticCurveTo(s*0.55, 0, 0, s*0.45); ctx.quadraticCurveTo(-s*0.55, 0, 0, -s*0.7); ctx.fillStyle = '#ffb020'; ctx.fill(); break;
    case 'puff': ctx.beginPath(); ctx.arc(0, 0, s*0.7*(2 - p.life), 0, 7); ctx.fillStyle = 'rgba(255,255,255,.75)'; ctx.fill(); break;
    case 'bolt': ctx.beginPath(); ctx.moveTo(s*0.2, -s); ctx.lineTo(-s*0.5, s*0.1); ctx.lineTo(0, s*0.1); ctx.lineTo(-s*0.2, s); ctx.lineTo(s*0.5, -s*0.1); ctx.lineTo(0, -s*0.1); ctx.closePath(); ctx.fillStyle = '#ffd23f'; ctx.fill(); break;
    default: ctx.fillStyle = p.c; ctx.fillRect(-s*0.5, -s*0.3, s, s*0.6);
  }
  ctx.restore();
}

// ---------- drawing ----------
function roundRect(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function shade(hex, f){
  const n = parseInt(hex.slice(1),16); let r = n>>16, g = (n>>8)&255, b = n&255;
  r = Math.round(Math.min(255, Math.max(0, r*f))); g = Math.round(Math.min(255, Math.max(0, g*f))); b = Math.round(Math.min(255, Math.max(0, b*f)));
  return `rgb(${r},${g},${b})`;
}
function drawGarage(t){
  const fy = H*0.80;
  // back wall: two-tone with a wainscot stripe
  const g = ctx.createLinearGradient(0,0,0,fy);
  g.addColorStop(0, '#dbeefe'); g.addColorStop(1, '#f4f9ff');
  ctx.fillStyle = g; ctx.fillRect(0,0,W,fy);
  ctx.fillStyle = '#c9e2f7'; ctx.fillRect(0, fy*0.62, W, fy*0.38);
  ctx.fillStyle = '#b4d4ee'; ctx.fillRect(0, fy*0.62, W, 4);
  // hanging lamps
  for(const lx of [W*0.22, W*0.78]){
    ctx.strokeStyle = '#8a93a3'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(lx, 0); ctx.lineTo(lx, H*0.035); ctx.stroke();
    ctx.fillStyle = '#3a3f4b'; ctx.beginPath(); ctx.moveTo(lx - 16, H*0.035 + 14); ctx.lineTo(lx + 16, H*0.035 + 14); ctx.lineTo(lx + 7, H*0.035); ctx.lineTo(lx - 7, H*0.035); ctx.closePath(); ctx.fill();
    const glow = ctx.createRadialGradient(lx, H*0.035 + 14, 2, lx, H*0.035 + 14, H*0.22);
    glow.addColorStop(0, 'rgba(255,240,170,.55)'); glow.addColorStop(1, 'rgba(255,240,170,0)');
    ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(lx, H*0.035 + 14, H*0.22, 0, Math.PI); ctx.fill();
  }
  // pegboard with the tools hanging on it
  const pbW = Math.min(W*0.62, 400), pbH = H*0.24, pbX = (W-pbW)/2, pbY = H*0.07;
  ctx.fillStyle = 'rgba(0,0,0,.08)'; roundRect(pbX+3, pbY+5, pbW, pbH, 14); ctx.fill();
  ctx.fillStyle = '#f0d3a2'; roundRect(pbX, pbY, pbW, pbH, 14); ctx.fill();
  ctx.fillStyle = 'rgba(140,95,40,.22)';
  for(let x = pbX+14; x < pbX+pbW-8; x += 18) for(let y = pbY+14; y < pbY+pbH-8; y += 18){ ctx.beginPath(); ctx.arc(x,y,1.8,0,7); ctx.fill(); }
  const deco = ['wrench','hammer','brush','oil','bulb'];
  const ds = Math.min(46, pbH*0.62, pbW/deco.length*0.8);
  deco.forEach((id,i) => drawArt(id, pbX + pbW*(i+0.5)/deco.length, pbY + pbH/2, ds));
  // floor with a lift pad under the parked car
  ctx.fillStyle = '#c3c9d4'; ctx.fillRect(0, fy, W, H-fy);
  ctx.fillStyle = '#aab1be'; ctx.fillRect(0, fy, W, 5);
  const pb0 = pumpBox(), left = pb0.gx + pb0.gw + 6, park = left + (W - left)/2, u0 = Math.min((W - left - 10)/112, H*0.0105);
  ctx.fillStyle = '#9aa2b1'; roundRect(park - 60*u0, fy + 3, 120*u0, Math.max(6, (H-fy)*0.18), 6); ctx.fill();
  ctx.fillStyle = '#ffd23f';
  for(let x = park - 56*u0; x < park + 52*u0; x += 16*u0){ ctx.save(); ctx.beginPath(); ctx.rect(park - 60*u0, fy + 3, 120*u0, Math.max(6,(H-fy)*0.18)); ctx.clip(); ctx.beginPath(); ctx.moveTo(x, fy+3); ctx.lineTo(x + 8*u0, fy+3); ctx.lineTo(x + 2*u0, fy + 3 + (H-fy)*0.18); ctx.lineTo(x - 6*u0, fy + 3 + (H-fy)*0.18); ctx.closePath(); ctx.fill(); ctx.restore(); }
  ctx.fillStyle = 'rgba(255,255,255,.55)';
  for(let x = 0; x < W; x += 60) ctx.fillRect(x, fy + (H-fy)*0.62, 34, 5);
  // gas pump at left
  const {gx, gw, gh} = pumpBox();
  ctx.fillStyle = '#c8303a'; roundRect(gx + 3, fy - gh + 4, gw, gh, 8); ctx.fill();
  ctx.fillStyle = '#ff5a5f'; roundRect(gx, fy - gh, gw, gh, 8); ctx.fill();
  ctx.fillStyle = '#2b2340'; roundRect(gx + gw*0.15, fy - gh*0.88, gw*0.7, gh*0.2, 4); ctx.fill();
  ctx.fillStyle = '#7dffb0'; ctx.fillRect(gx + gw*0.25, fy - gh*0.82, gw*0.5, gh*0.04);
  ctx.fillStyle = '#fff'; roundRect(gx + gw*0.15, fy - gh*0.6, gw*0.7, gh*0.1, 3); ctx.fill();
  if(!(tool === 'gas' && mode === 'fix' && car && car.st.gas)) drawArt('gas', gx + gw*0.55, fy - gh*0.38, gw*0.9);
  return {gx: gx + gw, gy: fy - gh*0.45};
}
function ring(x, y, r, t){
  const pulse = reduceMotion ? 0 : Math.sin(t*6)*0.15;
  ctx.strokeStyle = 'rgba(255,79,139,.9)'; ctx.lineWidth = 4; ctx.setLineDash([8,6]);
  ctx.beginPath(); ctx.arc(x, y, r*(1+pulse), 0, Math.PI*2); ctx.stroke(); ctx.setLineDash([]);
}
function poly(pts, X, Y){ ctx.beginPath(); pts.forEach(([x,y],i) => i ? ctx.lineTo(X(x),Y(y)) : ctx.moveTo(X(x),Y(y))); ctx.closePath(); }
function drawVehicle(v, t, pumpPos){
  const c = carCenter(), u = c.u, g = v.g;
  const bob = Math.sin(v.bounce*Math.PI*4) * v.bounce * 5 * u * (reduceMotion ? 0.3 : 1);
  const X = x => c.x + x*u, Y = y => c.y + y*u - bob;
  const [bx0,bx1,by0,by1] = g.bodyBox;
  ctx.lineJoin = 'round';
  // shadow
  ctx.fillStyle = 'rgba(0,0,0,.16)'; ctx.beginPath(); ctx.ellipse(c.x, c.y+2, 58*u, 5*u, 0, 0, 7); ctx.fill();
  // roof extras behind the body
  if(g.extra === 'ladder'){
    ctx.strokeStyle = '#d7dbe3'; ctx.lineWidth = Math.max(2, 1.6*u);
    const y0 = Y(-50), y1 = Y(-54);
    ctx.beginPath(); ctx.moveTo(X(-46), y0); ctx.lineTo(X(14), y0); ctx.moveTo(X(-46), y1); ctx.lineTo(X(14), y1);
    for(let x = -44; x <= 12; x += 6){ ctx.moveTo(X(x), y0); ctx.lineTo(X(x), y1); } ctx.stroke();
  }
  if(g.extra === 'cone'){
    const cx = X(-16), cy = Y(-58);
    ctx.fillStyle = '#e8b56a'; ctx.beginPath(); ctx.moveTo(cx - 7*u, cy - 10*u); ctx.lineTo(cx + 7*u, cy - 10*u); ctx.lineTo(cx, cy + 1*u); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#ff8fb8'; ctx.beginPath(); ctx.arc(cx, cy - 13*u, 7.5*u, 0, 7); ctx.fill();
    ctx.fillStyle = '#ff5a5f'; ctx.beginPath(); ctx.arc(cx + 1*u, cy - 21*u, 2.5*u, 0, 7); ctx.fill();
  }
  // body with a soft top-to-bottom shine
  poly(g.body, X, Y);
  const bg = ctx.createLinearGradient(0, Y(-g.h), 0, Y(-10));
  bg.addColorStop(0, shade(v.color, 1.18)); bg.addColorStop(0.55, v.color); bg.addColorStop(1, shade(v.color, 0.82));
  ctx.fillStyle = bg; ctx.fill(); ctx.lineWidth = 2.5; ctx.strokeStyle = shade(v.color, 0.6); ctx.stroke();
  if(g.extra === 'bed'){ ctx.fillStyle = shade(v.color, 0.7); ctx.fillRect(X(-46), Y(-30), 46*u, 3*u); }
  // stripe
  ctx.fillStyle = v.shape === 'fire' ? '#fff' : shade(v.color, 1.3); ctx.fillRect(X(bx0), Y(by1-3), (bx1-bx0)*u, 3*u);
  if(v.shape === 'icecream'){ for(let x = bx0; x < -8; x += 8){ ctx.fillStyle = (x/8)%2 ? '#fff' : '#ff8fb8'; ctx.beginPath(); ctx.arc(X(x+4), Y(-58), 4*u, 0, Math.PI); ctx.fill(); } }
  // windows, with the customer behind the glass
  for(const w of g.wins){ poly(w, X, Y); const wg = ctx.createLinearGradient(0, Y(-g.h), 0, Y(-34)); wg.addColorStop(0, '#e9f8ff'); wg.addColorStop(1, '#b9e3fb'); ctx.fillStyle = wg; ctx.fill(); }
  const happy = mode === 'leave' ? Math.abs(Math.sin(t*10))*2.5*u : 0;
  drawArt('a-' + v.who.k, X(g.drv[0]), Y(g.drv[1]) - happy, 15*u);
  for(const w of g.wins){ poly(w, X, Y); ctx.strokeStyle = shade(v.color,0.6); ctx.lineWidth = 2; ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.lineWidth = Math.max(1.5, 1.2*u); ctx.beginPath(); ctx.moveTo(X(w[0][0]) + 3*u, Y(w[0][1]) + 7*u); ctx.lineTo(X(w[0][0]) + 7*u, Y(w[0][1]) + 3*u); ctx.stroke(); }
  // bumper + tail light
  ctx.fillStyle = '#8a8f99'; roundRect(X(g.body[0][0]) - 2*u, Y(-14), 4*u, 5*u, 1.5*u); ctx.fill();
  ctx.fillStyle = '#ff3b3b'; roundRect(X(g.body[0][0]) - 1*u, Y(-26), 3*u, 5*u, 1*u); ctx.fill();
  ctx.fillStyle = '#8a8f99'; roundRect(X(g.body[g.body.length-1][0]) - 2*u, Y(-14), 4*u, 5*u, 1.5*u); ctx.fill();
  // gas cap
  const capX = X(g.cap[0]), capY = Y(g.cap[1]);
  ctx.fillStyle = shade(v.color,0.7); ctx.beginPath(); ctx.arc(capX + 3*u, capY, 3*u, 0, 7); ctx.fill();
  // headlight
  const lx = X(g.light[0]), ly = Y(g.light[1]);
  const lightOk = !v.st.light || v.st.light.ok;
  if(lightOk){
    const beam = ctx.createLinearGradient(lx, 0, lx + 40*u, 0); beam.addColorStop(0, 'rgba(255,240,140,.45)'); beam.addColorStop(1, 'rgba(255,240,140,0)');
    ctx.fillStyle = beam; ctx.beginPath(); ctx.moveTo(lx, ly-2*u); ctx.lineTo(lx + 40*u, ly - 12*u); ctx.lineTo(lx + 40*u, ly + 10*u); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#fff4a3';
  } else ctx.fillStyle = '#6b6f78';
  ctx.beginPath(); ctx.arc(lx, ly, 4*u, 0, 7); ctx.fill(); ctx.strokeStyle = '#555'; ctx.lineWidth = 1.5; ctx.stroke();
  if(!lightOk){ ctx.strokeStyle = '#222'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(lx-3*u, ly-3*u); ctx.lineTo(lx, ly); ctx.lineTo(lx-1*u, ly+3*u); ctx.moveTo(lx, ly); ctx.lineTo(lx+3*u, ly-1*u); ctx.stroke(); }
  // dent
  if(v.st.dent && v.st.dent.hits < 3){
    const k = (3 - v.st.dent.hits)/3, dx = X(v.st.dent.x), dy = Y(v.st.dent.y);
    ctx.fillStyle = `rgba(0,0,0,${0.25*k})`; ctx.beginPath(); ctx.ellipse(dx, dy, 7*u*k+2, 4*u*k+1, 0.3, 0, 7); ctx.fill();
    ctx.strokeStyle = `rgba(40,20,20,${0.8*k})`; ctx.lineWidth = 2;
    ctx.beginPath(); for(let i=0;i<5;i++){ const a = i*Math.PI*2/5 + 0.3; ctx.moveTo(dx, dy); ctx.lineTo(dx + Math.cos(a)*8*u*k, dy + Math.sin(a)*5*u*k); } ctx.stroke();
  }
  // scratches: white zigzags that fade as they are painted
  if(v.st.scratch){
    const sp = v.st.scratch.spots;
    ctx.lineCap = 'round'; ctx.lineWidth = Math.max(1.5, 1.1*u);
    for(let i=1;i<sp.length;i++){
      if(sp[i].line !== sp[i-1].line) continue;
      const a = Math.min(sp[i].dirt, sp[i-1].dirt); if(a <= 0) continue;
      ctx.strokeStyle = `rgba(255,255,255,${0.9*a})`; ctx.beginPath(); ctx.moveTo(X(sp[i-1].x), Y(sp[i-1].y)); ctx.lineTo(X(sp[i].x), Y(sp[i].y)); ctx.stroke();
      ctx.strokeStyle = `rgba(0,0,0,${0.25*a})`; ctx.beginPath(); ctx.moveTo(X(sp[i-1].x), Y(sp[i-1].y) + 1.2*u); ctx.lineTo(X(sp[i].x), Y(sp[i].y) + 1.2*u); ctx.stroke();
    }
    ctx.lineCap = 'butt';
  }
  // mud
  if(v.st.mud) for(const p of v.st.mud.spots){
    if(p.dirt <= 0) continue;
    ctx.fillStyle = `rgba(110,72,36,${0.92*Math.min(1,p.dirt+0.1)})`;
    const px = X(p.x), py = Y(p.y), r = p.r*u*(0.6 + 0.4*p.dirt);
    ctx.beginPath(); ctx.arc(px, py, r, 0, 7); ctx.arc(px + r*0.7, py + r*0.3, r*0.6, 0, 7); ctx.arc(px - r*0.6, py + r*0.4, r*0.5, 0, 7); ctx.fill();
  }
  // wheels
  for(let i=0;i<2;i++){
    const wx = X(g.wheels[i]); const r = 11*u;
    let ry = r, rx = r;
    if(v.st.tire && v.st.tire.wheel === i){ const L = v.st.tire.level; ry = r*(0.55 + 0.45*L); rx = r*(1 + 0.22*(1-L)); }
    const wy = c.y - ry;               // wheels sit on the ground, body bobs above
    ctx.fillStyle = '#23232b'; ctx.beginPath(); ctx.ellipse(wx, wy, rx, ry, 0, 0, 7); ctx.fill();
    ctx.strokeStyle = '#3a3a45'; ctx.lineWidth = Math.max(1.5, 1.2*u); ctx.beginPath(); ctx.ellipse(wx, wy, rx*0.82, ry*0.82, 0, 0, 7); ctx.stroke();
    const hub = ctx.createRadialGradient(wx - rx*0.15, wy - ry*0.15, 1, wx, wy, rx*0.5);
    hub.addColorStop(0, '#f1f3f7'); hub.addColorStop(1, '#a9afba');
    ctx.fillStyle = hub; ctx.beginPath(); ctx.ellipse(wx, wy, rx*0.5, ry*0.5, 0, 0, 7); ctx.fill();
    ctx.strokeStyle = '#7d828c'; ctx.lineWidth = 2;
    ctx.beginPath(); for(let s=0;s<4;s++){ const a = v.rot + s*Math.PI/2; ctx.moveTo(wx, wy); ctx.lineTo(wx + Math.cos(a)*rx*0.48, wy + Math.sin(a)*ry*0.48); } ctx.stroke();
    // bolts: loose ones stick out orange and wobble, tight ones sit flat
    if(v.st.bolts && v.st.bolts.wheel === i){
      for(let b=0;b<3;b++){
        const a = -Math.PI/2 + b*Math.PI*2/3, loose = b >= v.st.bolts.tight;
        const wob = loose && !reduceMotion ? Math.sin(t*12 + b)*1.2*u : 0;
        const bx = wx + Math.cos(a)*rx*0.3 + wob, by = wy + Math.sin(a)*ry*0.3;
        ctx.fillStyle = loose ? '#ff9f43' : '#6b7280'; ctx.beginPath(); ctx.arc(bx, by, (loose ? 2.4 : 1.8)*u, 0, 7); ctx.fill();
      }
    }
    if(v.st.squeak && !v.st.squeak.oiled[i]){
      const wig = reduceMotion ? 0 : Math.sin(t*14 + i)*2;
      ctx.strokeStyle = '#ff4f8b'; ctx.lineWidth = 2.5;
      ctx.beginPath(); for(let s=0;s<3;s++){ ctx.moveTo(wx - 6*u + s*6*u, wy - r - 4*u - wig); ctx.quadraticCurveTo(wx - 4*u + s*6*u, wy - r - 9*u - wig, wx - 6*u + s*6*u + 2*u, wy - r - 12*u - wig); } ctx.stroke();
    } else if(v.st.squeak){
      ctx.fillStyle = 'rgba(255,255,255,.7)'; ctx.beginPath(); ctx.arc(wx - rx*0.4, wy - ry*0.4, 2*u, 0, 7); ctx.fill();
    }
  }
  // gas gauge badge
  if(v.st.gas){
    const L = v.st.gas.level, gxx = X(g.cap[0]) + 4*u, gyy = Y(-g.h) - 12*u, R = 9*u;
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(gxx, gyy, R+3, Math.PI, 0); ctx.lineTo(gxx+R+3, gyy+3); ctx.lineTo(gxx-R-3, gyy+3); ctx.closePath(); ctx.fill();
    ctx.lineWidth = 3*u > 6 ? 6 : 3*u;
    ctx.strokeStyle = '#ff6b6b'; ctx.beginPath(); ctx.arc(gxx, gyy, R, Math.PI, Math.PI*1.33); ctx.stroke();
    ctx.strokeStyle = '#ffd23f'; ctx.beginPath(); ctx.arc(gxx, gyy, R, Math.PI*1.33, Math.PI*1.66); ctx.stroke();
    ctx.strokeStyle = '#35c26b'; ctx.beginPath(); ctx.arc(gxx, gyy, R, Math.PI*1.66, Math.PI*2); ctx.stroke();
    const a = Math.PI + L*Math.PI;
    ctx.strokeStyle = '#2b2340'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(gxx, gyy); ctx.lineTo(gxx + Math.cos(a)*R*0.9, gyy + Math.sin(a)*R*0.9); ctx.stroke();
    // hose while filling
    if(tool === 'gas' && mode === 'fix'){
      ctx.strokeStyle = '#333'; ctx.lineWidth = Math.max(3, 2.5*u);
      ctx.beginPath(); ctx.moveTo(pumpPos.gx, pumpPos.gy); ctx.quadraticCurveTo((pumpPos.gx + capX)/2, c.y + 4*u, capX, capY); ctx.stroke();
      drawArt('gas', capX - 4*u, capY - 2*u, 14*u);
    }
  }
  // battery badge over the hood: bars fill as it charges
  if(v.st.battery){
    const L = v.st.battery.level, bw = 18*u, bh = 9*u, bxx = X(g.light[0]) - 22*u, byy = Y(-g.h) - 14*u;
    ctx.fillStyle = '#fff'; roundRect(bxx - 3, byy - 3, bw + 6, bh + 6, 4); ctx.fill();
    ctx.strokeStyle = '#2b2340'; ctx.lineWidth = 2; roundRect(bxx, byy, bw, bh, 2); ctx.stroke();
    ctx.fillStyle = '#2b2340'; ctx.fillRect(bxx + bw, byy + bh*0.3, 2.5*u, bh*0.4);
    const bars = Math.ceil(L*4);
    for(let b=0;b<4;b++){ ctx.fillStyle = b < bars ? (L < 0.3 ? '#ff5a5f' : L < 1 ? '#ffd23f' : '#35c26b') : '#e3e6ec'; ctx.fillRect(bxx + 2 + b*(bw-4)/4, byy + 2, (bw-4)/4 - 1.5, bh - 4); }
    if(tool === 'charge' && mode === 'fix'){
      ctx.strokeStyle = '#ff5a5f'; ctx.lineWidth = Math.max(2.5, 2*u);
      ctx.beginPath(); ctx.moveTo(bxx + bw/2, byy + bh + 3); ctx.quadraticCurveTo(bxx + bw/2 + 10*u, Y(-24), X(g.light[0]) - 10*u, Y(-26)); ctx.stroke();
      drawArt('charge', X(g.light[0]) - 10*u, Y(-26), 10*u);
    }
  }
  // target rings for the selected tool
  if(mode === 'fix' && tool){
    if(tool === 'pump' && v.st.tire && v.st.tire.level < 1){ ring(X(g.wheels[v.st.tire.wheel]), c.y - 8*u, 16*u, t); }
    if(tool === 'bulb' && v.st.light && !v.st.light.ok) ring(lx, ly, 10*u, t);
    if(tool === 'hammer' && v.st.dent && v.st.dent.hits < 3) ring(X(v.st.dent.x), Y(v.st.dent.y), 12*u, t);
    if(tool === 'oil' && v.st.squeak) v.st.squeak.oiled.forEach((o,i) => { if(!o) ring(X(g.wheels[i]), c.y - 11*u, 15*u, t); });
    if(tool === 'wrench' && v.st.bolts && v.st.bolts.tight < 3) ring(X(g.wheels[v.st.bolts.wheel]), c.y - 11*u, 15*u, t);
    if(tool === 'gas' && v.st.gas && v.st.gas.level < 1) ring(capX + 3*u, capY, 10*u, t);
    if(tool === 'sponge' && v.st.mud) v.st.mud.spots.forEach(p => { if(p.dirt > 0) ring(X(p.x), Y(p.y), p.r*u + 4, t); });
    if(tool === 'brush' && v.st.scratch) v.st.scratch.spots.forEach((p,i) => { if(p.dirt > 0 && i % 2 === 0) ring(X(p.x), Y(p.y), 5*u + 4, t); });
    if(tool === 'charge' && v.st.battery && v.st.battery.level < 1) ring(c.x, Y(-g.h/2), 30*u, t);
  }
  ctx.lineJoin = 'miter';
}
function drawCursor(){
  if(!(mode === 'fix' && tool && pointer.inside)) return;
  const wob = pointer.down && (tool === 'hammer' || tool === 'wrench') ? -0.5 : 0;
  drawArt(tool, pointer.x + 14, pointer.y - 20, 46, 1, wob);
}

// ---------- loop ----------
let last = performance.now();
function frame(now){
  const dt = Math.min(0.05, (now - last)/1000); last = now; const t = now/1000;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  const pumpPos = drawGarage(t);
  if(car){
    if(mode === 'arrive'){
      phaseT += dt/1.4; const e = 1 - Math.pow(1 - Math.min(1, phaseT), 3);
      car.x = -1 + e; car.rot += dt*10*(1 - e + 0.05);
      if(phaseT >= 1){ car.x = 0; startFixing(); }
    } else if(mode === 'leave'){
      phaseT += dt;
      if(phaseT > 1.3){ const k = (phaseT - 1.3)/1.2; car.x = k*k; car.rot += dt*14; if(phaseT > 1.3 && phaseT - dt <= 1.3) SFX.vroom(); }
      if(phaseT > 2.6){ carIdx++; if(carIdx >= DAY_LEN){ car = null; renderJobs(); endDay(); } else nextCar(); }
    } else if(mode === 'fix' && (tool === 'gas' || tool === 'charge') && pointer.down && onCar(pointer.x, pointer.y)){
      fillStep(dt*0.5);
    }
    if(car){ car.bounce = Math.max(0, car.bounce - dt*1.5); drawVehicle(car, t, pumpPos); }
  }
  for(const p of particles){ p.life -= dt; p.vy += p.g*dt; p.x += p.vx*dt; p.y += p.vy*dt; p.rot += p.vr*dt; }
  particles = particles.filter(p => p.life > 0 && p.y < H + 40);
  for(const p of particles) drawParticle(p);
  drawCursor();
  requestAnimationFrame(frame);
}

// ---------- wiring ----------
function setSound(on){
  soundOn = on; try{ localStorage.setItem(KEY+'sound', on ? 'on' : 'off'); }catch(e){}
  $('sndBtn').innerHTML = art(on ? 'sound' : 'mute');
  $('sndBtn').setAttribute('aria-pressed', on ? 'true' : 'false');
  $('sndBtn').setAttribute('aria-label', on ? 'Sound and voice on' : 'Sound and voice off');
  if(!on && 'speechSynthesis' in window) speechSynthesis.cancel();
}
$('sndBtn').addEventListener('click', () => { setSound(!soundOn); if(soundOn) SFX.tap(); });
$('homeBtn').addEventListener('click', goHome);
$('startBtn').addEventListener('click', startDay);
$('againBtn').addEventListener('click', startDay);
$('bookBtn').addEventListener('click', showBook);
$('endBookBtn').addEventListener('click', showBook);
$('bookBack').addEventListener('click', () => { $('bookOv').hidden = true; if(mode === 'end') $('endOv').hidden = false; else if(mode === 'title') $('titleOv').hidden = false; });
// pictures on the page buttons (the words stay as the buttons' names)
$('homeBtn').innerHTML = art('home');
$('bennyFace').innerHTML = art('a-beaver');
$('titleFace').innerHTML = art('a-beaver', 'hero') + art('wrench', 'side');
$('endFace').innerHTML = art('a-beaver', 'hero') + art('star', 'side');
for(const [id, icon] of [['startBtn','car'],['bookBtn','book'],['againBtn','wrench'],['endBookBtn','book'],['bookBack','back']]) $(id).insertAdjacentHTML('afterbegin', art(icon));
buildTools(); setSound(soundOn); goHome();
requestAnimationFrame(frame);
window.__garage = { get mode(){ return mode; }, get car(){ return car; }, get carIdx(){ return carIdx; }, get tool(){ return tool; }, remaining: () => car ? remaining(car) : [], toScreen, useToolStep, chooseTool, book: () => book };
})();
</script>
</body>
