<!-- CONCEPT: PRETEND PLAY - Suds & Socks: run Wash Day for the Bear family through a real laundry routine - sort whites from colours into two baskets, load both washing machines (soap, then the big GO button) and pop the bubbles while muddy clothes spin clean, peg everything on the washing line and tap the clouds away so the sun dries it, find the twin socks and roll them into balls, then put each clean piece in the right drawer by size (big Papa, middle Mama, little Baby); three wash days grow from 6 to 10 pieces with muddy clothes and look-alike socks. No timer, no losing - a wrong basket or drawer just bounces back with a friendly hint. Ages 4-11. -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Suds &amp; Socks — Wash Day</title>
<style>
:root{
  --bg1:#8fdcff; --bg2:#e8fbff; --ink:#3a2a4a; --pink:#ff5fa2; --purple:#8b5cf6; --blue:#3b82f6;
  --sun:#ffd23f; --green:#22c55e; --green2:#0d8a5a; --shadow:rgba(58,42,74,.18);
  --basket:#e0a15c; --basket2:#b9793a; --wood:#d99a5e; --wood2:#b77a42; --wood3:#8a5529;
  --panel:#ffffff; --soft:rgba(255,255,255,.6);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0; padding: 0; height: 100%;
  touch-action: manipulation;
  user-select: none; -webkit-user-select: none;
  overflow: hidden;
}
body{font-family:"Comic Sans MS","Trebuchet MS",system-ui,sans-serif;color:var(--ink);background:linear-gradient(180deg,var(--bg1),var(--bg2));}
button{font-family:inherit;color:inherit;cursor:pointer}
#app{height:100vh;height:100dvh;display:flex;flex-direction:column;max-width:820px;margin:0 auto}
header{display:flex;align-items:center;gap:8px;padding:6px 10px 2px;flex:0 0 auto}
.icon-btn{min-width:52px;height:52px;border-radius:16px;border:none;background:var(--panel);box-shadow:0 4px 0 var(--shadow);font-size:26px;display:grid;place-items:center}
.grad{background:linear-gradient(90deg,var(--pink),var(--purple));-webkit-background-clip:text;background-clip:text;color:transparent}
h1{flex:1;margin:0;text-align:center;font-size:clamp(22px,6.4vw,34px);line-height:1.1}
.daytag{min-width:52px;height:52px;padding:0 8px;border-radius:16px;background:var(--panel);box-shadow:0 4px 0 var(--shadow);display:grid;place-items:center;font-weight:bold;font-size:clamp(14px,3.8vw,18px);white-space:nowrap}
#progress{display:flex;justify-content:center;gap:6px;padding:4px 8px;flex:0 0 auto}
.pstep{width:46px;height:40px;border-radius:12px;background:rgba(255,255,255,.5);display:grid;place-items:center;font-size:22px;opacity:.5;position:relative;transition:transform .2s}
.pstep.now{background:#fff;opacity:1;transform:scale(1.12);box-shadow:0 3px 0 var(--shadow)}
.pstep.done{opacity:1;background:#d9fbe5}
.pstep.done::after{content:'✓';position:absolute;right:-4px;top:-6px;width:20px;height:20px;border-radius:50%;background:var(--green);color:#fff;font-size:13px;display:grid;place-items:center;font-weight:bold}
#helper{display:flex;align-items:center;gap:8px;margin:4px 10px 6px;padding:6px 12px;background:var(--panel);border-radius:18px;box-shadow:0 3px 0 var(--shadow);min-height:50px;font-size:clamp(15px,4.2vw,20px);font-weight:bold;flex:0 0 auto}
#hbFace{font-size:30px;line-height:1}
#hbText{flex:1;line-height:1.25}
#stage{flex:1;min-height:0;position:relative;margin:0 8px;border-radius:22px;overflow:hidden;touch-action:none;box-shadow:inset 0 0 0 4px rgba(255,255,255,.7)}
footer{flex:0 0 auto;display:flex;justify-content:center;padding:8px 10px calc(8px + env(safe-area-inset-bottom))}
#next{height:62px;min-width:210px;border-radius:31px;border:none;font-size:26px;font-weight:bold;color:#fff;background:linear-gradient(90deg,#22c55e,#10b981);box-shadow:0 5px 0 var(--green2);visibility:hidden}
#next.show{visibility:visible;animation:pulse 1s ease-in-out infinite}

/* stage backgrounds */
.st-0{background:linear-gradient(#fff7e6 0 60%,#f0d2a4 60% 61%,#e9c893 61%)}
.st-1{background:repeating-linear-gradient(0deg,transparent 0 38px,rgba(120,180,200,.25) 38px 40px),repeating-linear-gradient(90deg,#e4f7fb 0 38px,rgba(120,180,200,.25) 38px 40px)}
.st-2{background:linear-gradient(#7fcfff,#d6f3ff 64%,#86dc6e 64%,#63c451)}
.st-3{background:radial-gradient(circle at 30% 30%,#f3e8ff,#e2d1ff 70%)}
.st-4{background:linear-gradient(#ffe7d6 0 55%,#e8b98c 55%)}

/* garments */
.gsvg{display:block;pointer-events:none;overflow:visible}
.item{position:relative;width:var(--box,80px);height:var(--box,80px);display:grid;place-items:center;cursor:pointer;touch-action:none;transform:rotate(var(--rot,0deg));transition:transform .15s}
.item .gsvg{width:var(--sz,80px);height:var(--sz,80px);filter:drop-shadow(0 3px 0 var(--shadow))}
.item.sel{transform:rotate(var(--rot,0deg)) scale(1.15);z-index:5}
.item.sel .gsvg{filter:drop-shadow(0 0 5px #fff) drop-shadow(0 0 9px var(--pink))}
.item.dragging{z-index:50;transition:none}
.item.gone{visibility:hidden;pointer-events:none}
.mini{width:30px;height:30px;flex:0 0 auto}
.mini .gsvg{width:100%;height:100%}

/* sort */
.pile{position:absolute;left:0;right:0;top:0;height:58%;display:flex;flex-wrap:wrap;justify-content:center;align-content:center;gap:2px 4px;padding:8px}
.baskets{position:absolute;left:0;right:0;bottom:8px;height:40%;display:flex;justify-content:space-around;align-items:stretch;gap:12px;padding:0 10px}
.basket{flex:1;max-width:200px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;cursor:pointer}
.bk-label{display:flex;align-items:center;gap:6px;background:#fff;border-radius:14px;padding:4px 10px;font-weight:bold;font-size:clamp(14px,4vw,18px);box-shadow:0 3px 0 var(--shadow)}
.bk-dot{width:24px;height:24px;border-radius:50%;border:3px solid var(--ink);display:inline-block}
.bk-dot.white{background:#fff}
.bk-dot.rainbow{background:conic-gradient(#ef4f5f,#f97316,#facc15,#22c55e,#3b82f6,#a855f7,#ef4f5f)}
.bk-body{width:100%;flex:1;min-height:60px;max-height:130px;border-radius:10px 10px 30px 30px;border:4px solid var(--basket2);background:repeating-linear-gradient(90deg,var(--basket) 0 10px,var(--basket2) 10px 13px);display:flex;flex-wrap:wrap-reverse;align-content:flex-start;justify-content:center;gap:2px;padding:6px;overflow:hidden;box-shadow:0 5px 0 var(--shadow)}
.basket[data-target=light] .bk-body{border-color:#b8c1d1;background:repeating-linear-gradient(90deg,#ffffff 0 10px,#dfe4ee 10px 13px)}
.basket[data-target=colour] .bk-body{border-color:#8b5cf6;background:repeating-linear-gradient(90deg,#ffd6e8 0 10px,#fff0b8 10px 20px,#c9f5ef 20px 30px,#e3d4ff 30px 40px)}

/* wash */
.washers{position:absolute;inset:0;display:flex;justify-content:space-around;align-items:center;padding:8px;gap:10px}
.washer{position:relative;z-index:25;flex:1;max-width:220px;display:flex;flex-direction:column;align-items:center;gap:10px}
.w-body{width:100%;background:linear-gradient(#ffffff,#e3e8f2);border:4px solid #b9c2d3;border-radius:22px;display:flex;flex-direction:column;align-items:center;padding:8px 8px 12px;box-shadow:0 6px 0 var(--shadow)}
.w-top{width:100%;display:flex;justify-content:space-between;align-items:center}
.w-soap,.w-go{width:60px;height:60px;border-radius:50%;border:none;font-size:28px;background:#fff;box-shadow:0 3px 0 var(--shadow),inset 0 0 0 3px #d5dbe6}
.w-go{background:radial-gradient(circle at 35% 35%,#ff9cc8,#ff3d8b);color:#fff;font-size:26px}
.w-light{width:14px;height:14px;border-radius:50%;background:#cbd2de;box-shadow:inset 0 0 0 2px #aab3c3}
.washer.spinning .w-light{background:#fbbf24;animation:blink .4s infinite}
.washer.clean .w-light{background:var(--green)}
.w-door{width:82%;aspect-ratio:1;border-radius:50%;border:9px solid #9aa6bd;background:radial-gradient(circle,#e6f8ff,#9ad7f0);margin-top:8px;position:relative;overflow:hidden}
.drum-clothes{position:absolute;inset:14%;display:flex;flex-wrap:wrap;justify-content:center;align-content:center;gap:0}
.drum-clothes .mini{width:34%;height:34%}
.washer.spinning .drum-clothes{animation:spin .55s linear infinite}
.washer.spinning .w-body{animation:rumble .12s linear infinite}
.suds{position:absolute;left:0;right:0;bottom:0;height:0;background:radial-gradient(circle at 20% 30%,#fff 18%,transparent 19%) 0 0/26px 22px,radial-gradient(circle at 70% 60%,#ffffffcc 22%,transparent 23%) 0 0/30px 26px;transition:height .8s}
.washer.soapy .suds{height:48%}
.glass{position:absolute;inset:0;border-radius:50%;background:linear-gradient(135deg,rgba(255,255,255,.55),transparent 45%);pointer-events:none}
.w-basket{width:100%;min-height:64px;border-radius:14px 14px 26px 26px;border:4px solid var(--basket2);background:repeating-linear-gradient(90deg,var(--basket) 0 10px,var(--basket2) 10px 13px);display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:2px;padding:4px;box-shadow:0 4px 0 var(--shadow)}
.w-basket.empty{opacity:.45}
.hint{animation:hint 1s ease-in-out infinite;outline:4px dashed var(--pink);outline-offset:3px}
.bubble{position:absolute;border-radius:50%;background:radial-gradient(circle at 32% 30%,#fff 0 14%,rgba(190,235,255,.35) 16%,rgba(160,210,255,.25) 60%,rgba(255,255,255,.8) 72%,transparent 74%);cursor:pointer;z-index:20;touch-action:manipulation}

/* hang */
.sky{position:absolute;left:0;right:0;top:0;height:24%}
.sun{position:absolute;right:7%;top:6%;font-size:clamp(44px,12vw,70px);line-height:1;transition:transform .6s}
.sun.shine{transform:scale(1.25);animation:sunshine 2.4s linear infinite}
.cloud{position:absolute;top:2%;font-size:clamp(58px,16vw,88px);background:none;border:none;padding:0;line-height:1;min-width:64px;min-height:64px;z-index:10;touch-action:manipulation}
.lines{position:absolute;left:0;right:0;top:20%;height:46%;display:flex;flex-direction:column;justify-content:space-around;gap:6px}
.line{position:relative;flex:1;margin:0 3%;cursor:pointer}
.rope{position:absolute;left:0;right:0;top:10px;height:4px;background:#7a5a3a;border-radius:2px}
.rope::before,.rope::after{content:'';position:absolute;top:-6px;width:14px;height:16px;border-radius:4px;background:#7a5a3a}
.rope::before{left:-6px}.rope::after{right:-6px}
.slots{position:absolute;left:4px;right:4px;top:10px;bottom:0;display:flex;justify-content:space-around}
.slot{flex:0 0 18%;position:relative}
.hung{position:absolute;inset:0;display:flex;justify-content:center;transform-origin:50% 0}
.hung .gsvg{height:100%;width:100%}
.peg{position:absolute;top:-8px;left:50%;width:10px;height:18px;margin-left:-5px;background:#ff7eb3;border:2px solid var(--ink);border-radius:3px;z-index:2}
.hung.wet .gsvg{filter:brightness(.8) saturate(1.35)}
.hung.wet::after{content:'💧';position:absolute;left:44%;bottom:-8px;font-size:12px;animation:drip 1s ease-in infinite}
.hung.dry{animation:sway 2.4s ease-in-out infinite}
.wetpile{position:absolute;left:8px;right:8px;bottom:8px;height:32%;display:flex;flex-wrap:wrap;justify-content:center;align-content:center;gap:2px 4px;padding:4px;border-radius:14px 14px 30px 30px;border:4px solid var(--basket2);background:repeating-linear-gradient(90deg,rgba(224,161,92,.85) 0 10px,rgba(185,121,58,.85) 10px 13px)}
.wetpile .item .gsvg{filter:brightness(.8) saturate(1.35) drop-shadow(0 3px 0 var(--shadow))}

/* socks */
.sockgrid{position:absolute;left:0;right:0;top:0;bottom:25%;display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));align-content:center;justify-items:center;gap:6px;padding:10px}
.sock{width:min(100%,96px);aspect-ratio:1;border:none;background:var(--soft);border-radius:18px;padding:6px;transform:rotate(var(--rot,0deg));transition:transform .15s,background .15s;touch-action:manipulation;min-width:56px}
.sock .gsvg{width:100%;height:100%}
.sock.sel{background:#fff;transform:rotate(0deg) scale(1.12);box-shadow:0 0 0 4px var(--pink)}
.sock.done{visibility:hidden;pointer-events:none}
.balltray{position:absolute;left:8px;right:8px;bottom:8px;height:21%;border-radius:14px 14px 30px 30px;border:4px solid var(--basket2);background:repeating-linear-gradient(90deg,var(--basket) 0 10px,var(--basket2) 10px 13px);display:flex;align-items:center;justify-content:center;gap:6px;padding:6px 10px;flex-wrap:wrap}
.ball{width:clamp(36px,10vw,52px);aspect-ratio:1;border-radius:50%;border:3px solid var(--ink);background:var(--c);box-shadow:inset -5px -6px 0 rgba(0,0,0,.18)}
.ball.stripes{background:repeating-linear-gradient(0deg,var(--c) 0 6px,var(--a) 6px 11px)}
.ball.dots{background:radial-gradient(circle,var(--a) 0 28%,transparent 30%) 0 0/11px 11px,var(--c)}
.ball.zig{background:repeating-linear-gradient(45deg,var(--c) 0 5px,var(--a) 5px 9px)}

/* put away */
.floor{--B:clamp(70px,21vw,110px);position:absolute;left:0;right:0;top:0;height:56%;display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-end;align-content:center;gap:2px 6px;padding:8px}
.dresser{position:absolute;left:3%;right:3%;bottom:8px;height:42%;display:flex;gap:6px;align-items:stretch}
.drawer{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:2px;cursor:pointer}
.dr-face{line-height:1}
.dr-name{font-weight:bold;font-size:clamp(14px,4vw,18px);background:#fff;border-radius:10px;padding:0 8px}
.dr-front{width:100%;height:clamp(58px,15vw,78px);background:linear-gradient(var(--wood),var(--wood2));border:4px solid var(--wood3);border-radius:10px;position:relative;transition:transform .2s;box-shadow:0 5px 0 var(--shadow)}
.dr-knob{position:absolute;left:50%;top:50%;width:18px;height:18px;margin:-9px;border-radius:50%;background:#ffe08a;border:3px solid var(--wood3)}
.dr-count{position:absolute;right:4px;bottom:2px;font-size:13px;font-weight:bold;color:#fff;text-shadow:0 1px 0 var(--wood3)}
.drawer.open .dr-front{transform:translateY(6px) scale(1.06)}

/* fx */
.spark{position:absolute;pointer-events:none;font-size:22px;z-index:40}
.overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;background:linear-gradient(180deg,#9fe3ff,#fff4c9);z-index:100;text-align:center;overflow-y:auto}
.overlay.hide{display:none}
.overlay h2{margin:0;font-size:clamp(30px,9vw,52px);line-height:1.1}
.hero{font-size:clamp(46px,14vw,72px);line-height:1}
.hero span{display:inline-block;animation:hop 1.2s ease-in-out infinite}
.hero span:nth-child(2){animation-delay:.15s}.hero span:nth-child(3){animation-delay:.3s}
.sub{font-size:clamp(16px,4.6vw,22px);font-weight:bold;margin:0}
.daycards{display:flex;flex-direction:column;gap:12px;width:min(92vw,420px)}
.daycard{display:flex;align-items:center;gap:12px;min-height:78px;padding:10px 16px;border:none;border-radius:22px;background:#fff;box-shadow:0 5px 0 var(--shadow);font-size:clamp(18px,5vw,24px);font-weight:bold;text-align:left}
.daycard .dc-icon{font-size:30px;min-width:88px;text-align:center}
.daycard .dc-name{flex:1}
.daycard .dc-star{font-size:30px}
.daycard .dc-star.off{opacity:.2;filter:grayscale(1)}
.bigbtn{min-height:64px;min-width:200px;padding:0 24px;border:none;border-radius:32px;font-size:clamp(20px,5.6vw,26px);font-weight:bold;color:#fff;background:linear-gradient(90deg,var(--pink),var(--purple));box-shadow:0 5px 0 #6b3fc4}
.bigbtn.alt{background:#fff;color:var(--ink);box-shadow:0 5px 0 var(--shadow)}
.smallbtn{min-height:46px;padding:0 18px;border:none;border-radius:23px;background:rgba(255,255,255,.7);font-size:16px;font-weight:bold}
.btnrow{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.stars{font-size:36px;letter-spacing:4px}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:150}

@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes hint{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes rumble{0%{transform:translate(0,0)}25%{transform:translate(1px,-1px)}50%{transform:translate(-1px,1px)}75%{transform:translate(1px,1px)}}
@keyframes blink{50%{opacity:.3}}
@keyframes drip{0%{transform:translateY(0);opacity:1}100%{transform:translateY(18px);opacity:0}}
@keyframes sway{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
@keyframes sunshine{0%{transform:scale(1.25) rotate(0)}100%{transform:scale(1.25) rotate(360deg)}}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-22px) rotate(-6deg)}60%{transform:translateY(-22px) rotate(6deg)}}
</style>
</head>
<body>
<div id="app">
  <header>
    <button class="icon-btn" id="homeBtn" aria-label="Home">🏠</button>
    <h1 class="grad">Suds &amp; Socks</h1>
    <div class="daytag" id="dayTag">Day 1</div>
  </header>
  <div id="progress"></div>
  <div id="helper"><span id="hbFace">🐻</span><span id="hbText"></span></div>
  <div id="stage"></div>
  <footer><button id="next">Next ➜</button></footer>
</div>

<div class="overlay" id="home">
  <div class="hero"><span>🧺</span><span>🐻</span><span>🧦</span></div>
  <h2 class="grad">Suds &amp; Socks</h2>
  <p class="sub">Wash Day with the Bear family!</p>
  <div class="daycards" id="dayCards"></div>
  <button class="smallbtn" id="resetBtn">↺ Reset stars</button>
</div>

<div class="overlay hide" id="win">
  <div class="hero"><span>🐻</span><span>🐻</span><span>🐻</span></div>
  <h2 class="grad" id="winTitle">Wash Day done!</h2>
  <p class="sub" id="winSub">Everything is clean and cosy. Thank you!</p>
  <div class="stars" id="winStars"></div>
  <div class="btnrow">
    <button class="bigbtn" id="winNext">Next Day ▶</button>
    <button class="bigbtn alt" id="winAgain">🔁 Again</button>
    <button class="bigbtn alt" id="winHome">🏠 Home</button>
  </div>
</div>

<canvas id="confetti"></canvas>

<script>
const $ = s => document.querySelector(s);
const stage = $('#stage');
const rnd = n => Math.floor(Math.random() * n);
const pick = a => a[rnd(a.length)];
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const STORE = 'cowork-suds-and-socks-stars';

/* ---------- sound ---------- */
let AC = null, NOISE = null;
function ac() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; } }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
document.addEventListener('pointerdown', ac, { capture: true });
function tone(freq, dur = 0.15, type = 'sine', vol = 0.2, when = 0, slideTo = null) {
  if (!AC) return;
  const t = AC.currentTime + when, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(AC.destination); o.start(t); o.stop(t + dur + 0.05);
}
function noise(dur, f1, f2, vol = 0.12, q = 1.2) {
  if (!AC) return;
  if (!NOISE) { NOISE = AC.createBuffer(1, AC.sampleRate * 2, AC.sampleRate); const d = NOISE.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
  const t = AC.currentTime, s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = NOISE; s.loop = true; f.type = 'bandpass'; f.Q.value = q;
  f.frequency.setValueAtTime(f1, t); f.frequency.exponentialRampToValueAtTime(f2, t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + Math.min(0.08, dur / 3)); g.gain.setValueAtTime(vol, t + dur * 0.7); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f).connect(g).connect(AC.destination); s.start(t); s.stop(t + dur + 0.05);
}
const sfx = {
  pick() { tone(660, 0.08, 'sine', 0.15); },
  plop() { tone(560, 0.14, 'sine', 0.25, 0, 200); },
  boop() { tone(320, 0.16, 'triangle', 0.18, 0, 250); tone(260, 0.2, 'triangle', 0.14, 0.13, 200); },
  pop() { tone(900 + Math.random() * 500, 0.06, 'square', 0.07, 0, 1900); },
  whoosh() { noise(0.4, 400, 2400, 0.14); },
  glug() { [0, 0.12, 0.24].forEach((w, i) => tone(340 - i * 40, 0.1, 'sine', 0.2, w, 180 - i * 20)); },
  spin(d) { noise(d, 250, 700, 0.07, 0.8); },
  ding() { tone(1320, 0.7, 'sine', 0.2); tone(1980, 0.5, 'sine', 0.07, 0.02); },

const OWNERS = { papa: { name: 'Papa', scale: 1, face: 46 }, mama: { name: 'Mama', scale: 0.72, face: 34 }, baby: { name: 'Baby', scale: 0.48, face: 24 } };
const OWNER_IDS = ['papa', 'mama', 'baby'];
const LIGHTS = ['#ffffff', '#fdf8ec', '#f3f5fa'];
const COLS = [
  { c: '#ef4f5f', a: '#ffd3d8' }, { c: '#3b82f6', a: '#cfe2ff' }, { c: '#22c55e', a: '#d4f8e0' }, { c: '#a855f7', a: '#ecd9ff' },
  { c: '#f97316', a: '#ffe0c7' }, { c: '#facc15', a: '#b45309' }, { c: '#ec4899', a: '#ffd6ec' }, { c: '#14b8a6', a: '#c9f5ef' }
];
const PATTERNS = ['none', 'stripes', 'dots', 'zig'];
const TYPES = ['shirt', 'pants', 'dress', 'towel'];
const DAYS = [
  { items: 6, mud: 0, pairs: 3, sock: 'solid', icon: '🧺', name: 'Day 1' },
  { items: 8, mud: 2, pairs: 4, sock: 'pattern', icon: '🧺🟤', name: 'Day 2 · Muddy!' },
  { items: 10, mud: 3, pairs: 5, sock: 'lookalike', icon: '🧺🧺', name: 'Day 3 · Big wash' }
];

function mudSpots() { return [...Array(3)].map(() => ({ x: 28 + rnd(44), y: 32 + rnd(44), r: 7 + rnd(6) })); }
function makeLoad(d) {
  const cfg = DAYS[d], n = cfg.items;
  const kinds = shuffle([...Array(n)].map((_, i) => i < n / 2 ? 'light' : 'colour'));
  const owners = shuffle([...Array(n)].map((_, i) => OWNER_IDS[i % 3]));
  const cols = shuffle(COLS.slice());
  const mud = new Set(shuffle([...Array(n).keys()]).slice(0, cfg.mud));
  let ci = 0;
  return kinds.map((k, i) => {
    const col = k === 'light' ? { c: pick(LIGHTS), a: '#dde3ee' } : cols[ci++ % cols.length];
    return { id: 'c' + i, kind: k, owner: owners[i], type: TYPES[(i + rnd(2)) % 4], color: col.c, accent: col.a,
      pattern: k === 'light' ? 'none' : pick(PATTERNS), mud: mud.has(i) ? mudSpots() : null };
  });
}
function makeSocks(d) {
  const cfg = DAYS[d], n = cfg.pairs;
  let styles;
  if (cfg.sock === 'solid') styles = shuffle(COLS.slice()).slice(0, n).map(c => ({ color: c.c, accent: c.a, pattern: 'none' }));
  else if (cfg.sock === 'pattern') styles = shuffle(COLS.slice()).slice(0, n).map((c, i) => ({ color: c.c, accent: c.a, pattern: PATTERNS[i % 4] }));
  else {
    const combos = [];
    shuffle(COLS.slice()).slice(0, 2).forEach(c => ['none', 'stripes', 'dots'].forEach(p => combos.push({ color: c.c, accent: c.a, pattern: p })));
    styles = shuffle(combos).slice(0, n);
  }
  const socks = [];
  styles.forEach((s, i) => { socks.push({ ...s, type: 'sock', key: i, id: 's' + i + 'a' }); socks.push({ ...s, type: 'sock', key: i, id: 's' + i + 'b' }); });
  return shuffle(socks);
}

let uid = 0;
function garmentSVG(g) {
  const id = 'gc' + (++uid), p = SHAPES[g.type], a = g.accent;
  let marks = '';
  if (g.pattern === 'stripes') for (let y = 4; y < 100; y += 15) marks += `<rect x="0" y="${y}" width="100" height="7" fill="${a}"/>`;

  else if (g.pattern === 'zig') for (let y = 12; y < 100; y += 20) marks += `<polyline points="0,${y} 10,${y - 7} 20,${y} 30,${y - 7} 40,${y} 50,${y - 7} 60,${y} 70,${y - 7} 80,${y} 90,${y - 7} 100,${y}" fill="none" stroke="${a}" stroke-width="4"/>`;

  const mud = g.mud ? g.mud.map(m => `<ellipse cx="${m.x}" cy="${m.y}" rx="${m.r}" ry="${m.r * 0.75}" fill="#7a5230"/><circle cx="${m.x + m.r}" cy="${m.y - m.r * 0.6}" r="${m.r * 0.35}" fill="#7a5230"/>`).join('') : '';
  return `<svg class="gsvg" viewBox="0 0 100 100"><defs><clipPath id="${id}"><path d="${p}"/></clipPath></defs><g clip-path="url(#${id})"><rect width="100" height="100" fill="${g.color}"/>${marks}${mud}${DETAILS[g.type]}</g><path d="${p}" fill="none" stroke="#3a2a4a" stroke-width="3.5" stroke-linejoin="round"/></svg>`;
}
function itemEl(it, sz, box) {

/* ---------- state + helpers ---------- */
const S = { day: 0, station: 0, load: [], socks: [], tryDrop: null, timers: [], intervals: [] };
let sel = null;
const find = el => S.load.concat(S.socks).find(i => i.id === el.dataset.id);
function later(fn, ms) { const t = setTimeout(fn, ms); S.timers.push(t); return t; }
function every(fn, ms) { const t = setInterval(fn, ms); S.intervals.push(t); return t; }
function clearTimers() { S.timers.forEach(clearTimeout); S.intervals.forEach(clearInterval); S.timers = []; S.intervals = []; }
function help(face, html) {
  $('#hbFace').textContent = face;
  $('#hbText').innerHTML = '<span>' + html + '</span>';

}
const praise = () => pick(['Yes! ✨', 'Great job! 🌟', 'Super! 💫', 'You got it! 👍', 'Nice one! 😊', 'Hooray! 🎈']);
function select(el) {
  if (sel) sel.classList.remove('sel');
  sel = el;
  if (el) { el.classList.add('sel'); sfx.pick(); }
}
function wiggle(el) { el.animate([{ transform: 'rotate(0)' }, { transform: 'rotate(-7deg)' }, { transform: 'rotate(7deg)' }, { transform: 'rotate(-4deg)' }, { transform: 'rotate(0)' }], { duration: 420 }); }
function bounce(el) { el.animate([{ translate: '0 0' }, { translate: '-10px -8px' }, { translate: '10px -4px' }, { translate: '-5px 0' }, { translate: '0 0' }], { duration: 420 }); }
function flyTo(el, dest, scale = 0.3) {
  const a = el.getBoundingClientRect(), b = dest.getBoundingClientRect();
  const dx = b.left + b.width / 2 - (a.left + a.width / 2), dy = b.top + b.height / 2 - (a.top + a.height / 2);
  el.style.pointerEvents = 'none'; el.style.zIndex = 60;
  return el.animate([{ transform: 'translate(0,0) scale(1)' }, { transform: `translate(${dx}px,${dy}px) scale(${scale})`, opacity: 0.3 }],
    { duration: 430, easing: 'cubic-bezier(.45,-0.25,.6,1)', fill: 'forwards' }).finished;
}
function land(el) { el.classList.add('gone'); el.getAnimations().forEach(a => a.cancel()); }
function sparkle(target, n = 6) {
  const r = target.getBoundingClientRect(), sr = stage.getBoundingClientRect();
  const cx = r.left + r.width / 2 - sr.left, cy = r.top + r.height / 2 - sr.top;
  for (let i = 0; i < n; i++) {
    const s = document.createElement('span'); s.className = 'spark'; s.textContent = pick(['✨', '⭐', '💫']);
    s.style.left = cx - 11 + 'px'; s.style.top = cy - 11 + 'px'; stage.appendChild(s);
    const ang = Math.PI * 2 * i / n + Math.random() * 0.5, d = 40 + rnd(30);
    s.animate([{ transform: 'translate(0,0) scale(.4)', opacity: 1 }, { transform: `translate(${Math.cos(ang) * d}px,${Math.sin(ang) * d}px) scale(1.1)`, opacity: 0 }],
      { duration: 650, easing: 'ease-out' }).finished.then(() => s.remove());
  }
}
function popIn(el) { el.animate([{ transform: 'scale(0)' }, { transform: 'scale(1.25)' }, { transform: 'scale(1)' }], { duration: 320, easing: 'ease-out' }); }

/* ---------- tap-or-drag system ---------- */
function targetAt(x, y) {
  return [...stage.querySelectorAll('.drop')].find(d => { const r = d.getBoundingClientRect(); return x >= r.left - 12 && x <= r.right + 12 && y >= r.top - 12 && y <= r.bottom + 12; });
}
function draggable(el) {
  el.addEventListener('pointerdown', e => {
    if (el.classList.contains('gone') || el.dataset.done) return;
    e.preventDefault();
    try { el.setPointerCapture(e.pointerId); } catch (_) {}
    const sx = e.clientX, sy = e.clientY; let moved = false;
    const move = ev => {
      const dx = ev.clientX - sx, dy = ev.clientY - sy;
      if (!moved && Math.hypot(dx, dy) > 10) { moved = true; select(null); el.classList.add('dragging'); }
      if (moved) el.style.transform = `translate(${dx}px,${dy}px) rotate(var(--rot)) scale(1.12)`;
    };
    const up = ev => {
      el.removeEventListener('pointermove', move); el.removeEventListener('pointerup', up); el.removeEventListener('pointercancel', up);
      if (!moved) { select(sel === el ? null : el); return; }
      el.classList.remove('dragging'); el.style.transform = '';
      const t = ev.type === 'pointerup' ? targetAt(ev.clientX, ev.clientY) : null;
      if (t && S.tryDrop) S.tryDrop(el, t); else bounce(el);
    };
    el.addEventListener('pointermove', move); el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up);
  });
}
stage.addEventListener('click', e => {
  const t = e.target.closest('.drop');
  if (!t || !S.tryDrop) return;
  if (sel) S.tryDrop(sel, t);
  else { help('👆', 'Tap a piece of clothing first!'); wiggle(t); }
});

function spawnBubble() {
  const b = document.createElement('div'); b.className = 'bubble';

  const anim = b.animate([{ transform: 'translate(0,0)' }, { transform: `translate(${drift}px,${-sh * 0.5}px)` }, { transform: `translate(${-drift}px,${-sh - size}px)` }],

function buildSocks() {
  const n = S.socks.length, cols = n <= 6 ? 3 : n <= 8 ? 4 : 5;
  stage.innerHTML = `<div class="sockgrid" style="--cols:${cols}"></div><div class="balltray"></div>`;
  const grid = stage.querySelector('.sockgrid'), tray = stage.querySelector('.balltray');

  });
  help('🐻', 'Find the <b>twin</b> socks! 🧦🧦');
  let first = null, busy = false, matched = 0;
  function pickSock(b) {
    if (busy || b.classList.contains('done')) return;
    if (!first) { first = b; b.classList.add('sel'); sfx.pick(); return; }
    if (first === b) { b.classList.remove('sel'); first = null; return; }

      ball.className = 'ball ' + (a.pattern === 'none' ? '' : a.pattern);
      ball.style.setProperty('--c', a.color); ball.style.setProperty('--a', a.accent);
      ball.style.visibility = 'hidden'; tray.appendChild(ball);
      Promise.all([flyTo(f, ball, 0.4), flyTo(b, ball, 0.4)]).then(() => {
        [f, b].forEach(x => { x.classList.add('done'); x.getAnimations().forEach(an => an.cancel()); });
        ball.style.visibility = ''; popIn(ball); sfx.plop(); sparkle(ball, 4); busy = false;
      });
      if (matched === n / 2) stationDone('🐻', 'All paired up! 🧦✨');
      else help('🐻', praise());
    } else {
      busy = true; sfx.boop(); wiggle(f); wiggle(b);
      help('🤔', 'Not twins… look again! 👀');
      later(() => { f.classList.remove('sel'); b.classList.remove('sel'); busy = false; }, 450);
    }
  }
}

/* ---------- station 5: put away by size ---------- */
function buildPutAway() {
  stage.innerHTML = `<div class="floor" id="floor"></div>
  <div class="dresser">${OWNER_IDS.map(o => `<div class="drawer drop" data-target="${o}"><div class="dr-face" style="font-size:${OWNERS[o].face}px">🐻</div><div class="dr-name">${OWNERS[o].name}</div><div class="dr-front"><span class="dr-knob"></span><span class="dr-count"></span></div></div>`).join('')}</div>`;
  const floor = $('#floor');
  shuffle(S.load.slice()).forEach(it => {
    const sz = `calc(var(--B) * ${OWNERS[it.owner].scale})`;
    const el = itemEl(it, sz, `max(60px, ${sz})`);
    floor.appendChild(el); draggable(el);
  });
  help('🐻', 'Big, middle, little! Put each one in the right drawer.');
  let put = 0;
  const counts = { papa: 0, mama: 0, baby: 0 };
  S.tryDrop = (el, t) => {
    const it = find(el), o = t.dataset.target;
    select(null);
    if (o === it.owner) {
      el.dataset.done = 1; put++; counts[o]++; sfx.plop();
      t.classList.add('open');
      const front = t.querySelector('.dr-front');
      flyTo(el, front, 0.25).then(() => {
        land(el); t.classList.remove('open');
        t.querySelector('.dr-count').textContent = '✓'.repeat(counts[o]);
        sparkle(front, 4);
      });
      if (put === S.load.length) stationDone('🐻', 'All put away! 🎉');
      else help('🐻', praise() + ' That fits ' + OWNERS[o].name + '!');
    } else {
      sfx.boop(); bounce(el); wiggle(t);
      const big = OWNERS[it.owner].scale > OWNERS[o].scale;
      help('🤔', big ? `Too <b>big</b> for ${OWNERS[o].name}! 🙈` : `Too <b>small</b> for ${OWNERS[o].name}! 🤏`);
    }
  };
}

/* ---------- win / home ---------- */
function loadStars() { try { const p = JSON.parse(localStorage.getItem(STORE)); return Array.isArray(p) ? p : [false, false, false]; } catch (e) { return [false, false, false]; } }
function saveStars(p) { try { localStorage.setItem(STORE, JSON.stringify(p)); } catch (e) {} }
function celebrate() {
  clearTimers();
  const p = loadStars(); p[S.day] = true; saveStars(p);
  renderProgress();
  sfx.fanfare(); confetti(180);
  const last = S.day === DAYS.length - 1, all = p.every(Boolean);
  $('#winTitle').textContent = last && all ? 'Laundry Champion!' : 'Wash Day done!';
  $('#winSub').textContent = last ? 'The biggest wash of all — the Bears are so happy!' : 'Everything is clean and cosy. Thank you!';
  $('#winStars').innerHTML = p.map(x => `<span style="opacity:${x ? 1 : 0.2}">⭐</span>`).join('');
  $('#winNext').style.display = last ? 'none' : '';
  $('#win').classList.remove('hide');
}
function goHome() {
  clearTimers(); hideNext(); sel = null; S.tryDrop = null;
  $('#win').classList.add('hide');
  const p = loadStars();
  $('#dayCards').innerHTML = DAYS.map((d, i) => `<button class="daycard" data-day="${i}"><span class="dc-icon">${d.icon}</span><span class="dc-name">${d.name}</span><span class="dc-star ${p[i] ? '' : 'off'}">⭐</span></button>`).join('');
  $('#dayCards').querySelectorAll('.daycard').forEach(b => b.addEventListener('click', () => { sfx.chime(); startDay(+b.dataset.day); }));
  $('#home').classList.remove('hide');
}
$('#homeBtn').addEventListener('click', goHome);
$('#winHome').addEventListener('click', goHome);
$('#winAgain').addEventListener('click', () => startDay(S.day));
$('#winNext').addEventListener('click', () => startDay(Math.min(S.day + 1, DAYS.length - 1)));
$('#resetBtn').addEventListener('click', () => { saveStars([false, false, false]); sfx.boop(); goHome(); });

/* ---------- confetti ---------- */
const cv = $('#confetti'), cx = cv.getContext('2d');
let parts = [], raf = 0;
function sizeCanvas() { const d = window.devicePixelRatio || 1; cv.width = innerWidth * d; cv.height = innerHeight * d; cx.setTransform(d, 0, 0, d, 0, 0); }
window.addEventListener('resize', sizeCanvas); sizeCanvas();
function confetti(n) {
  const cols = ['#ff5fa2', '#8b5cf6', '#3b82f6', '#22c55e', '#facc15', '#f97316'];
  for (let i = 0; i < n; i++) parts.push({ x: innerWidth / 2 + (Math.random() - 0.5) * innerWidth * 0.6, y: innerHeight * 0.4, vx: (Math.random() - 0.5) * 10, vy: -Math.random() * 11 - 4, w: 6 + Math.random() * 6, h: 4 + Math.random() * 4, c: pick(cols), r: Math.random() * 6, vr: (Math.random() - 0.5) * 0.3 });
  if (!raf) raf = requestAnimationFrame(tick);
}
function tick() {
  cx.clearRect(0, 0, innerWidth, innerHeight);
  parts.forEach(p => { p.vy += 0.28; p.vx *= 0.99; p.x += p.vx; p.y += p.vy; p.r += p.vr; cx.save(); cx.translate(p.x, p.y); cx.rotate(p.r); cx.fillStyle = p.c; cx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); cx.restore(); });
  parts = parts.filter(p => p.y < innerHeight + 30);
  raf = parts.length ? requestAnimationFrame(tick) : 0;
  if (!raf) cx.clearRect(0, 0, innerWidth, innerHeight);
}

window.__suds = { S, startDay, goHome };
goHome();
</script>
