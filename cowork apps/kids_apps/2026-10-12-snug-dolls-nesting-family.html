<!-- CONCEPT: SIZE & ORDERING - Snug Dolls: a family of animal nesting dolls (Bear, Owl, Fox) needs tucking in - drag each little doll into the very next size up (a doll is only ready, shown by a gold star, once someone smaller is already snug inside), tap a closed doll to pop its family out and set each one on its matching-size shadow, and find which doll fits the gap in a big-to-small line-up before the whole family nests itself back together; nine levels grow from 3 to 6 dolls with closer and closer sizes, each finished family earns a sticker on the Family Shelf, plus a Free Play table. Containment and size-ordering, not swap-sorting a row. No timer, no losing - a wrong fit just wobbles and hops back with a friendly hint. Ages 4-11. -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Snug Dolls</title>
<style>
:root{
  --bg1:#ffe9f3; --bg2:#e6f3ff;
  --ink:#4a2f22; --card:#fffaf2;
  --a:#ff5e8a; --b:#ff9f43; --c:#7b5cff;
  --btn:#ffffff; --btnEdge:#f1c9d8;
  --good:#2ec27e; --gold:#ffc93c;
  --gap:clamp(4px,1.6vw,10px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none;
  font-family:"Comic Sans MS","Trebuchet MS",system-ui,sans-serif;color:var(--ink);background:linear-gradient(180deg,var(--bg1),var(--bg2));}
#app{display:flex;flex-direction:column;height:100%;width:100%;}
#hud{display:flex;align-items:center;gap:var(--gap);padding:6px 8px 2px;flex:0 0 auto;}
.ttl{flex:1 1 auto;min-width:0;text-align:center;}
h1{margin:0;font-size:clamp(20px,5.6vw,34px);line-height:1.1;white-space:nowrap;overflow:hidden;
  background:linear-gradient(90deg,var(--a),var(--b),var(--c));-webkit-background-clip:text;background-clip:text;color:transparent;}
#dots{display:flex;justify-content:center;gap:4px;margin-top:3px;min-height:10px;}
#dots i{width:9px;height:9px;border-radius:50%;background:#f3d3df;display:block;}
#dots i.on{background:var(--gold);box-shadow:0 0 0 2px #fff;}
#dots i.cur{background:var(--a);transform:scale(1.3);}
.hb{width:54px;height:54px;flex:0 0 54px;border-radius:18px;border:3px solid var(--btnEdge);background:var(--btn);
  font-size:26px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 0 var(--btnEdge);padding:0;}
.hb:active{transform:translateY(3px);box-shadow:0 1px 0 var(--btnEdge);}
#msg{flex:0 0 auto;margin:4px 10px 0;padding:6px 12px;min-height:44px;border-radius:16px;background:rgba(255,255,255,.85);
  font-size:clamp(15px,4.2vw,22px);text-align:center;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 0 rgba(0,0,0,.06);}
#msg span{display:inline;}
#msg.pop{animation:mpop .35s ease;}
@keyframes mpop{0%{transform:scale(.92)}60%{transform:scale(1.04)}100%{transform:scale(1)}}
#stage{flex:1 1 auto;position:relative;min-height:0;}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:pointer;}
.ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(255,235,245,.72);z-index:10;padding:14px;}
.ov.show{display:flex;}
.card{background:var(--card);border-radius:28px;padding:18px 18px 20px;width:min(94vw,460px);max-height:96vh;overflow:auto;text-align:center;
  box-shadow:0 10px 0 rgba(200,120,150,.25),0 20px 40px rgba(0,0,0,.12);border:4px solid #ffd6e4;}
.card h1{font-size:clamp(32px,10vw,52px);white-space:normal;}
.big{font-size:clamp(46px,14vw,74px);line-height:1.15;margin:4px 0;}
.sub{font-size:clamp(16px,4.4vw,22px);margin:6px 0 12px;}
.bb{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:66px;margin:10px 0 0;border:none;border-radius:22px;
  font:inherit;font-size:clamp(20px,6vw,28px);font-weight:bold;color:#fff;cursor:pointer;
  background:linear-gradient(180deg,#ff7aa2,#ff4f7f);box-shadow:0 6px 0 #c9345e;}
.bb.alt{background:linear-gradient(180deg,#9d86ff,#7357f0);box-shadow:0 6px 0 #4e36b8;}
.bb.green{background:linear-gradient(180deg,#53d891,#26b06a);box-shadow:0 6px 0 #17834c;}
.bb:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.25);}
.small{min-height:44px;margin-top:14px;padding:6px 14px;border-radius:14px;border:2px solid #f1c9d8;background:#fff;font:inherit;font-size:15px;cursor:pointer;color:var(--ink);}
.shelf{display:flex;justify-content:center;gap:10px;margin:14px 0 4px;padding:10px 6px 6px;border-radius:16px;
  background:linear-gradient(180deg,#f7e3c8,#e6c49b);border-bottom:8px solid #b9875a;}
.stk{width:68px;height:68px;border-radius:50%;background:#fff6;display:flex;align-items:center;justify-content:center;font-size:38px;border:3px dashed #c99b70;}
.stk.got{background:#fff;border:3px solid var(--gold);box-shadow:0 0 0 3px #fff8,0 0 14px #ffd86b;animation:wig 2.4s ease-in-out infinite;}
.stk.no{filter:grayscale(1) opacity(.35);}
@keyframes wig{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
.shelfLbl{font-size:15px;opacity:.75;}
</style>
</head>
<body>
<div id="app">
  <header id="hud">
    <button class="hb" id="bHome" aria-label="Home">🏠</button>
    <div class="ttl"><h1>Snug Dolls</h1><div id="dots"></div></div>
    <button class="hb" id="bHint" aria-label="Hint">💡</button>
    <button class="hb" id="bRe" aria-label="Restart level">🔄</button>
    <button class="hb" id="bSnd" aria-label="Sound">🔊</button>
  </header>
  <div id="msg"><span>🪆 Let's tuck in the dolls!</span></div>
  <div id="stage"><canvas id="cv"></canvas></div>
</div>

<div class="ov show" id="ovHome">
  <div class="card">
    <h1>Snug Dolls</h1>
    <div class="big">🪆🪆🪆</div>
    <div class="sub">Tuck the little dolls inside the bigger ones!</div>
    <button class="bb" id="bPlay">▶ <span id="playLbl">Play</span></button>
    <button class="bb alt" id="bFree">🎨 Free Play</button>
    <div class="shelf" id="shelfHome"></div>
    <div class="shelfLbl">Family Shelf</div>
    <button class="small" id="bReset">↺ Start the levels over</button>
  </div>
</div>

<div class="ov" id="ovWin">
  <div class="card">
    <div class="big" id="winEm">🎉</div>
    <h1 id="winTtl">Snug as a bug!</h1>
    <div class="sub" id="winSub"></div>
    <button class="bb green" id="bNext">Next ▶</button>
    <button class="small" id="bWinHome">🏠 Home</button>
  </div>
</div>

<div class="ov" id="ovParty">
  <div class="card">
    <div class="big">🥳🎊🪆</div>
    <h1>Shelf Party!</h1>
    <div class="sub">Every doll family is snug and happy. You did it!</div>
    <div class="shelf" id="shelfParty"></div>
    <button class="bb" id="bAgain">▶ Play again</button>
    <button class="bb alt" id="bPartyFree">🎨 Free Play</button>
  </div>
</div>

<script>
/*__JS1__*/
</script>
</body>
</html>
