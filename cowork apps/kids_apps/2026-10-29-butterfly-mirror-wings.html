<!-- CONCEPT: Butterfly Mirror Wings - symmetry puzzle where kids paint one wing to mirror the pattern on the other wing, 8 levels plus a mirror-painting free mode. -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Butterfly Mirror Wings</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:manipulation}
  html,body{margin:0;height:100%;overflow:hidden;font-family:"Trebuchet MS","Comic Sans MS",system-ui,sans-serif;color:#4a2c6b}
  body{background:linear-gradient(180deg,#bfe8ff 0%,#e6f7ff 55%,#c9f2c7 100%);}
  .cloud{position:fixed;background:#fff;border-radius:50px;opacity:.85;z-index:0}
  .cloud:before,.cloud:after{content:"";position:absolute;background:#fff;border-radius:50%}
  #c1{width:120px;height:34px;top:9%;left:6%;animation:drift 40s linear infinite}
  #c1:before{width:50px;height:50px;top:-24px;left:16px}#c1:after{width:38px;height:38px;top:-16px;left:62px}
  #c2{width:90px;height:26px;top:18%;right:8%;animation:drift 55s linear infinite reverse}
  #c2:before{width:38px;height:38px;top:-18px;left:12px}#c2:after{width:30px;height:30px;top:-12px;left:46px}
  @keyframes drift{0%{transform:translateX(0)}50%{transform:translateX(40px)}100%{transform:translateX(0)}}
  .screen{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;z-index:2}
  .screen.on{display:flex}
  /* title */
  #title{justify-content:center;text-align:center;padding:16px}
  h1{font-size:clamp(34px,8vw,64px);margin:6px 0;color:#7a3bd1;text-shadow:0 4px 0 #fff,0 7px 0 rgba(122,59,209,.25);line-height:1.05}
  .desc{font-size:clamp(17px,3.4vw,24px);max-width:520px;margin:6px auto 22px;font-weight:700;color:#5b3a86}
  .bigbtn{font:inherit;font-weight:900;font-size:clamp(24px,5vw,34px);border:none;border-radius:999px;padding:16px 38px;margin:8px;cursor:pointer;color:#fff;background:linear-gradient(#ff7ab0,#ff3d86);box-shadow:0 8px 0 #c21d63,0 12px 18px rgba(0,0,0,.2);transition:transform .08s}
  .bigbtn:active{transform:translateY(6px);box-shadow:0 2px 0 #c21d63}
  .bigbtn.blue{background:linear-gradient(#58c8ff,#2a9df4);box-shadow:0 8px 0 #1677bf,0 12px 18px rgba(0,0,0,.2)}
  .bigbtn.blue:active{box-shadow:0 2px 0 #1677bf}
  .bigbtn.green{background:linear-gradient(#6ee08a,#2fc05a);box-shadow:0 8px 0 #1c8d3e,0 12px 18px rgba(0,0,0,.2)}
  .bigbtn.green:active{box-shadow:0 2px 0 #1c8d3e}
  .heroFly{font-size:clamp(70px,16vw,120px);animation:bob 2.2s ease-in-out infinite;display:inline-block}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-14px) rotate(6deg)}}
  /* game */
  #game{justify-content:flex-start}
  .top{width:100%;display:flex;align-items:center;justify-content:space-between;padding:10px 12px;gap:8px}
  .roundbtn{font-size:28px;width:56px;height:56px;border-radius:50%;border:none;background:#fff;box-shadow:0 5px 0 #b9a8d6;cursor:pointer;flex:none}
  .roundbtn:active{transform:translateY(4px);box-shadow:0 1px 0 #b9a8d6}
  #dots{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center}
  .dot{width:20px;height:20px;border-radius:50%;background:#fff;border:3px solid #c9b6ee}
  .dot.done{background:#ffcf33;border-color:#e0a800}
  .dot.now{border-color:#7a3bd1;transform:scale(1.25);background:#f1e6ff}
  #modeLabel{font-weight:900;font-size:24px;color:#7a3bd1}
  #prompt{font-size:clamp(18px,3.6vw,26px);font-weight:900;text-align:center;min-height:34px;padding:0 10px;color:#5b3a86}
  #stageWrap{flex:1;display:flex;align-items:center;justify-content:center;width:100%;min-height:0}
  #stage{display:flex;align-items:center;justify-content:center;position:relative}
  .wing{background:linear-gradient(145deg,#fff7dc,#ffe3f1);border:5px solid #fff;box-shadow:0 8px 0 rgba(122,59,209,.22),inset 0 0 0 4px rgba(255,160,200,.4);display:grid;position:relative}
  #wingL{border-radius:80px 16px 16px 56px;transform-origin:right center}
  #wingR{border-radius:16px 80px 56px 16px;transform-origin:left center}
  .body{width:34px;border-radius:20px;background:linear-gradient(90deg,#7b4a2c,#a8693f,#7b4a2c);margin:0 4px;position:relative;flex:none}
  .body:before,.body:after{content:"";position:absolute;top:-26px;width:3px;height:30px;background:#7b4a2c;border-radius:3px}
  .body:before{left:6px;transform:rotate(-24deg)}.body:after{right:6px;transform:rotate(24deg)}
  .face{position:absolute;top:12px;left:0;right:0;text-align:center;font-size:18px}
  .mline{position:absolute;top:-6px;bottom:-6px;left:50%;width:0;border-left:4px dashed rgba(122,59,209,.35);z-index:0;pointer-events:none}
  .cell{font-size:inherit;border-radius:50%;border:3px solid rgba(122,59,209,.18);background:rgba(255,255,255,.55);cursor:default;position:relative;padding:0;transition:transform .12s}
  .cell.paintable{cursor:pointer;border:3px dashed rgba(122,59,209,.4)}
  .cell.paintable:active{transform:scale(.88)}
  .cell.filled{border:3px solid rgba(255,255,255,.9);box-shadow:inset 0 -5px 0 rgba(0,0,0,.14),0 2px 3px rgba(0,0,0,.15)}
  .cell.ghost{animation:pulse .6s ease-in-out infinite alternate;border:4px solid #ffcf33}
  .cell.wiggle{animation:wig .5s ease-in-out}
  @keyframes pulse{from{transform:scale(.88)}to{transform:scale(1.1)}}
  @keyframes wig{0%,100%{transform:rotate(0)}20%{transform:rotate(-18deg)}40%{transform:rotate(16deg)}60%{transform:rotate(-12deg)}80%{transform:rotate(8deg)}}
  .pop{animation:popin .25s ease-out}
  @keyframes popin{0%{transform:scale(.4)}70%{transform:scale(1.18)}100%{transform:scale(1)}}
  #stage.flap #wingL{animation:flapL .45s ease-in-out 6}
  #stage.flap #wingR{animation:flapR .45s ease-in-out 6}
  @keyframes flapL{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.45)}}
  @keyframes flapR{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.45)}}
  .bottom{width:100%;padding:8px 10px 16px;display:flex;flex-direction:column;align-items:center;gap:10px}
  #palette{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  .sw{width:clamp(52px,13vw,74px);height:clamp(52px,13vw,74px);border-radius:50%;border:6px solid #fff;cursor:pointer;box-shadow:0 6px 0 rgba(0,0,0,.2);padding:0;transition:transform .1s}
  .sw.sel{transform:translateY(-8px) scale(1.12);border-color:#4a2c6b;box-shadow:0 12px 0 rgba(0,0,0,.2)}
  .sw:active{transform:translateY(0) scale(.95)}
  .actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  .smallbtn{font:inherit;font-weight:900;font-size:20px;border:none;border-radius:999px;padding:10px 22px;background:#fff;color:#7a3bd1;box-shadow:0 5px 0 #b9a8d6;cursor:pointer}
  .smallbtn:active{transform:translateY(4px);box-shadow:0 1px 0 #b9a8d6}
  /* overlay */
  #win{position:fixed;inset:0;background:rgba(74,44,107,.55);display:none;align-items:center;justify-content:center;z-index:10;flex-direction:column}
  #win.on{display:flex}
  .card{background:#fff;border-radius:34px;padding:26px 30px;text-align:center;max-width:92vw;box-shadow:0 12px 0 rgba(0,0,0,.18);animation:popin .4s ease-out}
  .card h2{margin:4px 0 6px;font-size:clamp(30px,7vw,46px);color:#ff3d86}
  .stars{font-size:clamp(44px,11vw,70px);letter-spacing:6px}
  .stars span{display:inline-block}
  .stars .on{animation:popin .5s ease-out both}
  .stars .off{filter:grayscale(1) opacity(.35)}
  #fx{position:fixed;inset:0;pointer-events:none;z-index:20}
</style>
</head>
<body>
<div class="cloud" id="c1"></div><div class="cloud" id="c2"></div>

<!-- TITLE -->
<div class="screen on" id="title">
  <div class="heroFly">🦋</div>
  <h1>Butterfly<br>Mirror Wings</h1>
  <div class="desc">Copy the colorful pattern onto the other wing so both sides match, just like a mirror!</div>
  <div>
    <button class="bigbtn" id="playBtn">▶ Play</button>
    <button class="bigbtn blue" id="freeBtn">🎨 Free Paint</button>
  </div>
</div>

<!-- GAME -->
<div class="screen" id="game">
  <div class="top">
    <button class="roundbtn" id="homeBtn" aria-label="Home">🏠</button>
    <div id="dots"></div>
    <button class="roundbtn" id="sndBtn" aria-label="Sound">🔊</button>
  </div>
  <div id="prompt"></div>
  <div id="stageWrap"><div id="stage">
    <div class="wing" id="wingL"></div>
    <div class="body"><div class="face">🙂</div></div>
    <div class="wing" id="wingR"></div>
  </div></div>
  <div class="bottom">
    <div id="palette"></div>
    <div class="actions">
      <button class="smallbtn" id="hintBtn">💡 Help me</button>
      <button class="smallbtn" id="newBtn">🔄 New pattern</button>
      <button class="smallbtn" id="clearBtn" style="display:none">🧽 Clear</button>
    </div>
  </div>
</div>

<!-- WIN -->
<div id="win"><div class="card">
  <h2 id="winTitle">Wonderful!</h2>
  <div class="stars" id="winStars"></div>
  <div id="winMsg" style="font-size:22px;font-weight:700;margin:6px 0 12px">Both wings match!</div>
  <div id="winBtns"></div>
</div></div>
<canvas id="fx"></canvas>

<script>
(function(){
  var COLORS=['#ff5d8f','#ffb703','#3ddc84','#38b6ff','#9b5de5'];
  var LEVELS=[
    {w:2,h:3,k:2},{w:3,h:3,k:2},{w:3,h:4,k:3},{w:4,h:4,k:3},
    {w:4,h:5,k:4},{w:5,h:5,k:4},{w:5,h:6,k:5},{w:6,h:6,k:5}
  ];
  var FREE={w:6,h:7,k:5};
  var $=function(id){return document.getElementById(id)};
  var state={mode:'level',level:0,W:3,H:3,K:2,target:[],player:[],sel:0,hints:0,done:false,sound:true,cells:{L:[],R:[]}};

  /* ---------- audio ---------- */
  var AC=null;
  function ac(){ if(!AC){ try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){} } if(AC&&AC.state==='suspended'){AC.resume();} return AC; }
  function tone(freq,dur,type,vol,delay){
    if(!state.sound) return; var a=ac(); if(!a) return;
    var t=a.currentTime+(delay||0), o=a.createOscillator(), g=a.createGain();
    o.type=type||'sine'; o.frequency.setValueAtTime(freq,t);
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol||0.2,t+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+dur+0.05);
  }
  var PENT=[392,440,523.25,587.33,659.25,783.99,880,1046.5];
  function sPaint(ci){ tone(PENT[ci%5],0.25,'triangle',0.22); }
  function sGood(){ tone(1046.5,0.18,'sine',0.14); tone(1318.5,0.22,'sine',0.12,0.08); }
  function sSelect(ci){ tone(PENT[ci%5]/2,0.12,'square',0.07); }
  function sBoop(){ tone(260,0.18,'sine',0.14); tone(330,0.2,'sine',0.12,0.1); }
  function sHint(){ tone(880,0.12,'sine',0.14); tone(1174.7,0.2,'sine',0.14,0.1); }
  function sWin(){ [523.25,659.25,783.99,1046.5,1318.5,1568].forEach(function(f,i){ tone(f,0.45,'triangle',0.2,i*0.11); }); tone(2093,0.7,'sine',0.1,0.75); }

  /* ---------- helpers ---------- */
  function show(id){ ['title','game'].forEach(function(s){ $(s).classList.toggle('on',s===id); }); }
  function rnd(n){ return Math.floor(Math.random()*n); }

  function genPattern(W,H,K){
    var g=[];
    for(var r=0;r<H;r++){ g[r]=[]; for(var c=0;c<W;c++){
      var v=rnd(K), p=Math.random();
      if(c>0 && p<0.4) v=g[r][c-1]; else if(r>0 && p<0.6) v=g[r-1][c];
      g[r][c]=v; } }
    var used={}; g.forEach(function(row){row.forEach(function(v){used[v]=1;});});
    var cnt=Object.keys(used).length, need=Math.min(K,3);
    var guard=0;
    while(cnt<need && guard++<50){ var r2=rnd(H),c2=rnd(W),nv=rnd(K); g[r2][c2]=nv; used={}; g.forEach(function(row){row.forEach(function(v){used[v]=1;});}); cnt=Object.keys(used).length; }
    return g;
  }

  /* ---------- sizing ---------- */
  function sizeStage(){
    var W=state.W,H=state.H, vw=window.innerWidth, vh=window.innerHeight;
    var sw=((vw-24-50)/2-48)/(W*1.1);
    var sh=(vh-330-34)/(H*1.1);
    var s=Math.max(24,Math.min(66,Math.floor(Math.min(sw,sh))));
    var g=Math.max(3,Math.round(s*0.1));
    ['wingL','wingR'].forEach(function(id){
      var el=$(id);
      el.style.gridTemplateColumns='repeat('+W+','+s+'px)';
      el.style.gap=g+'px'; el.style.padding='14px';
    });
    $('stage').parentNode.style.fontSize=s+'px';
    var bodyH=H*s+(H-1)*g+28+10; $('stage').querySelector('.body').style.height=bodyH+'px';
  }

  /* ---------- build ---------- */
  function buildPalette(){
    var p=$('palette'); p.innerHTML='';
    for(var i=0;i<state.K;i++){
      (function(i){
        var b=document.createElement('button'); b.className='sw'+(i===state.sel?' sel':''); b.style.background=COLORS[i];
        b.setAttribute('aria-label','color '+(i+1));
        b.addEventListener('click',function(){ state.sel=i; sSelect(i); refreshPalette(); });
        p.appendChild(b);
      })(i);
    }
  }
  function refreshPalette(){ var kids=$('palette').children; for(var i=0;i<kids.length;i++){ kids[i].classList.toggle('sel',i===state.sel); } }

  function buildDots(){
    var d=$('dots'); d.innerHTML='';
    if(state.mode==='free'){ d.innerHTML='<div id="modeLabel">🎨 Free Paint</div>'; return; }
    for(var i=0;i<LEVELS.length;i++){
      var x=document.createElement('div'); x.className='dot'+(i<state.level?' done':'')+(i===state.level?' now':''); d.appendChild(x);
    }
  }

  function buildWings(){
    var W=state.W,H=state.H;
    var L=$('wingL'), R=$('wingR'); L.innerHTML=''; R.innerHTML='';
    state.cells={L:[],R:[]};
    for(var r=0;r<H;r++){ state.cells.L[r]=[]; state.cells.R[r]=[];
      for(var c=0;c<W;c++){
        var a=document.createElement('button'); a.className='cell'; a.style.width=a.style.height='1em';
        var b=document.createElement('button'); b.className='cell paintable'; b.style.width=b.style.height='1em';
        (function(r,c,b,a){
          b.addEventListener('click',function(){ paint('R',r,c); });
          if(state.mode==='free'){ a.classList.add('paintable'); a.addEventListener('click',function(){ paint('L',r,c); }); }
        })(r,c,b,a);
        L.appendChild(a); R.appendChild(b); state.cells.L[r][c]=a; state.cells.R[r][c]=b;
      }
    }
    sizeStage(); renderAll();
  }

  function setCell(el,ci,anim){
    if(ci<0){ el.style.background=''; el.classList.remove('filled'); return; }
    el.style.background=COLORS[ci]; el.classList.add('filled');
    if(anim){ el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop'); }
  }
  function renderAll(){
    var W=state.W,H=state.H;
    for(var r=0;r<H;r++) for(var c=0;c<W;c++){
      setCell(state.cells.L[r][c], state.target[r][c], false);
      setCell(state.cells.R[r][c], state.player[r][c], false);
    }
  }

  /* ---------- game flow ---------- */
  function startLevel(i){
    state.mode='level'; state.level=i;
    var L=LEVELS[i]; state.W=L.w; state.H=L.h; state.K=L.k;
    newPattern(true);
    $('hintBtn').style.display=''; $('newBtn').style.display=''; $('clearBtn').style.display='none';
    show('game');
    buildPalette(); buildDots(); setPrompt('Paint the right wing to match the left wing! 🪞');
    sizeStage();
  }
  function newPattern(skipBuild){
    var W=state.W,H=state.H;
    state.target=genPattern(W,H,state.K);
    state.player=[]; for(var r=0;r<H;r++){ state.player[r]=[]; for(var c=0;c<W;c++) state.player[r][c]=-1; }
    state.hints=0; state.done=false; state.sel=0; $('stage').querySelector('.face').textContent='🙂';
    $('stage').classList.remove('flap');
    if(!skipBuild){ buildWings(); refreshPalette(); }
    else buildWings();
  }
  function startFree(){
    $('stage').classList.remove('flap'); $('stage').querySelector('.face').textContent='🙂';
    state.mode='free'; state.W=FREE.w; state.H=FREE.h; state.K=FREE.k; state.sel=0; state.done=false;
    var W=state.W,H=state.H; state.target=[]; state.player=[];
    for(var r=0;r<H;r++){ state.target[r]=[]; state.player[r]=[]; for(var c=0;c<W;c++){ state.target[r][c]=-1; state.player[r][c]=-1; } }
    $('hintBtn').style.display='none'; $('newBtn').style.display='none'; $('clearBtn').style.display='';
    show('game'); buildPalette(); buildDots(); buildWings();
    setPrompt('Tap either wing. The other side copies you! ✨');
  }
  function setPrompt(t){ $('prompt').textContent=t; }

  function paint(side,r,c){
    if(state.done) return;
    var W=state.W, ci=state.sel;
    if(state.mode==='free'){
      var mc=W-1-c;
      if(side==='L'){ state.target[r][c]=ci; state.player[r][mc]=ci; setCell(state.cells.L[r][c],ci,true); setCell(state.cells.R[r][mc],ci,true); }
      else { state.player[r][c]=ci; state.target[r][mc]=ci; setCell(state.cells.R[r][c],ci,true); setCell(state.cells.L[r][mc],ci,true); }
      sPaint(ci); sparkle(side==='L'?state.cells.L[r][c]:state.cells.R[r][c]);
      return;
    }
    var el=state.cells.R[r][c];
    el.classList.remove('ghost','wiggle');
    state.player[r][c]=ci; setCell(el,ci,true);
    var want=state.target[r][W-1-c];
    if(ci===want){ sPaint(ci); sGood(); sparkle(el); } else { sPaint(ci); }
    checkWin();
  }

  function wrongCells(){
    var out=[], W=state.W,H=state.H;
    for(var r=0;r<H;r++) for(var c=0;c<W;c++){ if(state.player[r][c]!==state.target[r][W-1-c]) out.push([r,c]); }
    return out;
  }
  function checkWin(){
    var bad=wrongCells();
    if(bad.length===0){ win(); return; }
    var empty=0; state.player.forEach(function(row){row.forEach(function(v){ if(v<0) empty++; });});
    if(empty===0){
      // all painted but some are different: gentle nudge
      setPrompt('Almost! Look in the mirror again 🪞');
      sBoop();
      bad.forEach(function(rc){ var el=state.cells.R[rc[0]][rc[1]]; el.classList.remove('wiggle'); void el.offsetWidth; el.classList.add('wiggle'); });
    } else {
      setPrompt('Paint the right wing to match the left wing! 🪞');
    }
  }

  function hint(){
    if(state.done) return;
    var bad=wrongCells(); if(!bad.length) return;
    state.hints++; sHint();
    var picks=bad.sort(function(){return Math.random()-0.5;}).slice(0,Math.min(2,bad.length));
    picks.forEach(function(rc){
      var r=rc[0],c=rc[1],el=state.cells.R[r][c], want=state.target[r][state.W-1-c];
      el.style.background=COLORS[want]; el.style.opacity='.6'; el.classList.add('ghost');
      setTimeout(function(){
        el.classList.remove('ghost'); el.style.opacity='';
        setCell(el,state.player[r][c],false);
      },2400);
    });
    setPrompt('Look at the glowing circles! They show the mirror color 💛');
  }

  function win(){
    state.done=true;
    $('stage').classList.add('flap');
    $('stage').querySelector('.face').textContent='😄';
    sWin(); burst(70);
    var stars=state.hints===0?3:(state.hints<=3?2:1);
    $('winStars').innerHTML='';
    for(var i=0;i<3;i++){ var s=document.createElement('span'); s.textContent='⭐'; s.className=i<stars?'on':'off'; s.style.animationDelay=(0.3+i*0.25)+'s'; $('winStars').appendChild(s); }
    var last=state.level>=LEVELS.length-1;
    $('winTitle').textContent=last?'You did it! 🎉':'Wonderful!';
    $('winMsg').textContent=last?'You finished every butterfly!':'Both wings match!';
    var bt=$('winBtns'); bt.innerHTML='';
    function mk(txt,cls,fn){ var b=document.createElement('button'); b.className='bigbtn '+cls; b.textContent=txt; b.addEventListener('click',function(){ $('win').classList.remove('on'); fn(); }); bt.appendChild(b); }
    if(!last) mk('Next ▶','green',function(){ startLevel(state.level+1); });
    else { mk('Play again','', function(){ startLevel(0); }); mk('🎨 Free Paint','blue',startFree); }
    if(!last) mk('↺ Again','blue',function(){ startLevel(state.level); });
    setTimeout(function(){ $('win').classList.add('on'); },1400);
  }

  /* ---------- effects ---------- */
  var fx=$('fx'), fctx=fx.getContext('2d'), parts=[], raf=0;
  function fit(){ fx.width=window.innerWidth; fx.height=window.innerHeight; }
  function loop(){
    fctx.clearRect(0,0,fx.width,fx.height);
    parts=parts.filter(function(p){ return p.life>0; });
    parts.forEach(function(p){
      p.x+=p.vx; p.y+=p.vy; p.vy+=p.g; p.life--; p.rot+=p.vr;
      fctx.save(); fctx.globalAlpha=Math.min(1,p.life/25); fctx.translate(p.x,p.y); fctx.rotate(p.rot);
      if(p.e){ fctx.font=p.s+'px serif'; fctx.textAlign='center'; fctx.textBaseline='middle'; fctx.fillText(p.e,0,0); }
      else { fctx.fillStyle=p.c; fctx.beginPath(); fctx.arc(0,0,p.s/2,0,7); fctx.fill(); }
      fctx.restore();
    });
    if(parts.length) raf=requestAnimationFrame(loop); else { raf=0; fctx.clearRect(0,0,fx.width,fx.height); }
  }
  function addP(p){ parts.push(p); if(!raf) raf=requestAnimationFrame(loop); }
  function burst(n){
    var E=['🦋','🌸','✨','💖','🌈'];
    for(var i=0;i<n;i++){
      addP({x:window.innerWidth/2,y:window.innerHeight*0.45,vx:(Math.random()-0.5)*14,vy:-Math.random()*13-3,g:0.22,rot:0,vr:(Math.random()-0.5)*0.2,
        life:90+rnd(60),s:20+rnd(24),e:Math.random()<0.55?E[rnd(E.length)]:null,c:COLORS[rnd(5)]});
    }
  }
  function sparkle(el){
    var b=el.getBoundingClientRect(), x=b.left+b.width/2, y=b.top+b.height/2;
    for(var i=0;i<7;i++) addP({x:x,y:y,vx:(Math.random()-0.5)*6,vy:(Math.random()-0.5)*6-1,g:0.12,rot:0,vr:0,life:26+rnd(12),s:6+rnd(6),e:null,c:Math.random()<0.5?'#ffd84a':'#ffffff'});
  }

  /* ---------- wire up ---------- */
  $('playBtn').addEventListener('click',function(){ ac(); startLevel(0); });
  $('freeBtn').addEventListener('click',function(){ ac(); startFree(); });
  $('homeBtn').addEventListener('click',function(){ $('win').classList.remove('on'); show('title'); });
  $('sndBtn').addEventListener('click',function(){ state.sound=!state.sound; this.textContent=state.sound?'🔊':'🔇'; if(state.sound) sSelect(2); });
  $('hintBtn').addEventListener('click',hint);
  $('newBtn').addEventListener('click',function(){ newPattern(); setPrompt('A brand new butterfly! 🦋'); $('stage').querySelector('.face').textContent='🙂'; });
  $('clearBtn').addEventListener('click',function(){
    for(var r=0;r<state.H;r++) for(var c=0;c<state.W;c++){ state.target[r][c]=-1; state.player[r][c]=-1; }
    renderAll(); sBoop();
  });
  window.addEventListener('resize',function(){ fit(); if($('game').classList.contains('on')) sizeStage(); });
  fit();
  /* arrow keys cycle the selected paint color (optional helper) */
  window.addEventListener('keydown',function(e){
    if(!$('game').classList.contains('on')) return;
    if(e.key==='ArrowRight'||e.key==='ArrowLeft'){
      state.sel=(state.sel+(e.key==='ArrowRight'?1:state.K-1))%state.K; refreshPalette(); sSelect(state.sel);
    }
  });
  /* tiny test hook */
  window.__bmw={state:state,paint:paint,startLevel:startLevel,startFree:startFree,hint:hint};
})();
</script>
