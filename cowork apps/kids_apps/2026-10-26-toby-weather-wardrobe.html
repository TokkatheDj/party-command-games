<!-- CONCEPT: SORTING & CATEGORISING (what belongs with which weather) - Toby's Weather Wardrobe: Toby the bear cub is heading outside, and kids look at the weather (sunny, rainy, snowy, windy) and tap the right things from the wardrobe to dress him for it - sun hat and flip-flops for sunshine, rain hat, raincoat, rain boots and umbrella for rain, woolly hat, mittens and puffy coat for snow - while wrong picks make Toby sweat, shiver or drip and hop back to the wardrobe; dressed right, he goes outside to build a sandcastle, splash puddles, roll a snowman or fly a kite. A seven-day week adds Weather Switch days (the sky changes mid-outfit, so kids take off what no longer fits and swap in the right things) and a Packing day that sorts every item into a beach bag or a snow bag, each day earning a sticker on a saved week chart, plus a Free Dress-Up wardrobe with all 19 items where Toby says how he feels in any weather. No timer, no losing. Ages 4-11. -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Toby's Weather Wardrobe</title>
<style>
:root{
  --bg1:#ffe7a3; --bg2:#ffb8d6; --ink:#3a2a55; --panel:#fff8ec; --accent:#ff7a59; --accent2:#7c5cff;
  --good:#2fb36b; --tile:#ffffff; --tileb:#ffd29a; --dot:#b79bd6; --h1a:#ff5f8f; --h1b:#7c5cff;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
*::before, *::after { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0; height: 100%; overflow: hidden;
  touch-action: manipulation;
  user-select: none; -webkit-user-select: none;
  font-family: "Comic Sans MS", "Trebuchet MS", system-ui, sans-serif;
  color: var(--ink);
  background: linear-gradient(160deg, var(--bg1), var(--bg2));
}
button { font-family: inherit; color: inherit; cursor: pointer; }
#app { height: 100vh; height: 100dvh; display: flex; flex-direction: column; max-width: 860px; margin: 0 auto; position: relative; }
header { height: 58px; flex: none; display: flex; align-items: center; gap: 8px; padding: 6px 8px; }
h1 {
  flex: 1; margin: 0; text-align: center; font-size: clamp(15px, 4.6vw, 30px);
  background: linear-gradient(90deg, var(--h1a), var(--h1b)); -webkit-background-clip: text; background-clip: text; color: transparent;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.ibtn { width: 48px; height: 48px; flex: none; border-radius: 14px; border: 3px solid #fff; background: #ffffffa0; font-size: 24px; display: grid; place-items: center; padding: 0; }
.ibtn[hidden] { display: none; }

/* ---------- menu ---------- */
#menu { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 4px 12px 18px; }
#menu[hidden], #game[hidden] { display: none; }
#mtoby { height: clamp(130px, 28vh, 230px); }
.bigbtn { min-height: 64px; padding: 0 24px; border-radius: 22px; border: 4px solid #fff; font-size: clamp(19px, 5.6vw, 27px); font-weight: bold; color: #fff; box-shadow: 0 5px 0 #0002; }
.go { background: linear-gradient(180deg, #ff8f6b, #ff5f8f); }
.free { background: linear-gradient(180deg, #9d86ff, #6a4cf0); }
.next { background: linear-gradient(180deg, #4fd18b, #23a05c); }
.mbtns { display: flex; flex-direction: column; gap: 10px; width: min(100%, 360px); }
.weekcard { width: min(100%, 520px); background: #ffffffb0; border: 4px solid #fff; border-radius: 22px; padding: 10px; }
.weekcard h2 { margin: 0 0 8px; text-align: center; font-size: clamp(16px, 4.6vw, 22px); }
#week { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.day { position: relative; min-height: 70px; border-radius: 16px; border: 3px dashed var(--dot); background: #fff8; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 4px; }
.day .di { font-size: 28px; line-height: 1.1; }
.day .dn { font-size: 14px; font-weight: bold; }
.day.done { border: 3px solid var(--good); background: #e9fff1; }
.day .star { position: absolute; top: -8px; right: -6px; font-size: 22px; }
#reset { min-height: 44px; padding: 0 16px; border-radius: 14px; border: 2px solid #fff; background: #ffffff70; font-size: 15px; }

/* ---------- game ---------- */
#game { flex: 1; min-height: 0; display: flex; flex-direction: column; }
#need { height: 54px; flex: none; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 0 8px; }
.slotdot { width: clamp(26px, 8vw, 44px); height: clamp(26px, 8vw, 44px); border-radius: 50%; border: 3px dashed var(--dot); background: #ffffff70; display: grid; place-items: center; padding: 2px; transition: transform .25s; }
.slotdot.on { border: 3px solid var(--good); background: #fff; transform: scale(1.08); }
.slotdot svg { width: 100%; height: 100%; }
.wbtn { width: 56px; height: 48px; border-radius: 14px; border: 3px solid #fff; background: #ffffff80; font-size: 26px; padding: 0; }
.wbtn.on { background: #fff; border-color: var(--accent2); transform: scale(1.1); }
#stage { flex: 1; min-height: 0; position: relative; margin: 0 8px; border-radius: 22px; overflow: hidden; border: 4px solid #fff; box-shadow: 0 4px 0 #0001; }
#wx { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#toby { position: absolute; bottom: 0; left: 50%; height: 97%; transform: translateX(-50%); transition: height .6s, left .6s; overflow: visible; }
#toby.outside { height: 80%; left: 68%; }
#toby.shiver { animation: shiver .12s linear infinite; }
#toby.jump { animation: jump .5s ease-out; }
#toby .pop { transform-box: fill-box; transform-origin: center; animation: popin .45s ease-out; }
#toby .hintg { animation: blink .8s ease-in-out infinite; }
#toby.hide { display: none; }
#badge { position: absolute; top: 8px; left: 8px; width: 62px; height: 62px; border-radius: 50%; background: #ffffffd0; font-size: 36px; display: grid; place-items: center; border: 3px solid #fff; padding: 0; z-index: 2; }
#badge.flip { animation: popin .6s ease-out; }
#cases { position: absolute; inset: 0; display: none; gap: 4%; padding: 70px 4% 5%; align-items: flex-end; justify-content: center; }
#cases.show { display: flex; }
.case { width: 46%; height: 100%; max-height: 300px; border-radius: 20px; border: 4px solid #fff; display: flex; flex-direction: column; align-items: center; padding: 6px; gap: 4px; box-shadow: 0 6px 0 #0002; }
.case.a { background: linear-gradient(180deg, #ffd166, #ff9f43); }
.case.b { background: linear-gradient(180deg, #a5d8ff, #6c8cff); }
.case .cl { font-size: 34px; line-height: 1; }
.case .cin { flex: 1; width: 100%; background: #ffffffa8; border-radius: 12px; display: flex; flex-wrap: wrap; align-content: flex-start; justify-content: center; gap: 2px; padding: 4px; overflow: hidden; }
.case .cin svg { width: 38px; height: 38px; }
.case.nope { animation: shake .45s; }
.case.hint, .item.hint, .bigbtn.hint { animation: glow .9s ease-in-out infinite; }
#msg { height: 48px; flex: none; display: flex; align-items: center; justify-content: center; padding: 0 12px; text-align: center; font-weight: bold; font-size: clamp(14px, 4.1vw, 21px); line-height: 1.15; overflow: hidden; }
#msg span { display: block; max-height: 46px; overflow: hidden; }
#tray { flex: none; height: 176px; overflow-y: auto; padding: 6px 8px 10px; display: grid; grid-template-columns: repeat(auto-fill, minmax(74px, 1fr)); grid-auto-rows: 74px; gap: 8px; align-content: start; }
#tray.big { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 12px; overflow: hidden; }
.item { position: relative; border-radius: 18px; background: var(--tile); border: 3px solid var(--tileb); padding: 4px; display: grid; place-items: center; box-shadow: 0 4px 0 #0001; transition: transform .2s; min-width: 44px; min-height: 44px; }
.item svg { width: 100%; height: 100%; pointer-events: none; }
.item.on { border-color: var(--good); background: #e9fff1; }
.item.on::after { content: "✓"; position: absolute; top: -6px; right: -4px; width: 22px; height: 22px; border-radius: 50%; background: var(--good); color: #fff; font-size: 14px; display: grid; place-items: center; }
.item.sel { transform: translateY(-6px) scale(1.06); border-color: var(--accent2); box-shadow: 0 8px 0 #7c5cff55; }
.item.nope { animation: shake .45s; }
.funrow { display: flex; gap: 14px; }
.fundot { width: 52px; height: 52px; border-radius: 50%; border: 4px dashed #fff; background: #ffffff60; display: grid; place-items: center; font-size: 28px; }
.fundot.on { border-style: solid; background: #fff; }
#fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 20; }
#party { position: fixed; inset: 0; z-index: 15; background: #3a2a5599; display: grid; place-items: center; padding: 16px; }
#party[hidden] { display: none; }
.pcard { background: var(--panel); border: 5px solid #fff; border-radius: 26px; padding: 18px; width: min(100%, 420px); text-align: center; display: flex; flex-direction: column; gap: 10px; align-items: center; }
.pcard .big { font-size: 46px; }
.pcard h2 { margin: 0; font-size: clamp(22px, 6vw, 30px); color: var(--accent2); }
.pcard p { margin: 0; font-size: clamp(15px, 4.2vw, 19px); }
.pcard .bigbtn { width: 100%; }

@keyframes shiver { 0%{transform:translateX(calc(-50% - 2px))} 50%{transform:translateX(calc(-50% + 2px))} 100%{transform:translateX(calc(-50% - 2px))} }
@keyframes jump { 0%{transform:translate(-50%,0)} 40%{transform:translate(-50%,-14%)} 100%{transform:translate(-50%,0)} }
@keyframes popin { 0%{transform:scale(.2)} 70%{transform:scale(1.15)} 100%{transform:scale(1)} }
@keyframes shake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-9px) rotate(-4deg)} 40%{transform:translateX(8px) rotate(4deg)} 60%{transform:translateX(-6px)} 80%{transform:translateX(5px)} }
@keyframes glow { 0%,100%{box-shadow:0 0 0 0 #ffd43b} 50%{box-shadow:0 0 0 8px #ffd43bcc} }
@keyframes blink { 50%{opacity:.35} }
@media (min-width: 700px) { #tray { height: 190px; grid-template-columns: repeat(auto-fill, minmax(86px, 1fr)); grid-auto-rows: 84px; } }
</style>
</head>
<body>
<div id="app">
  <header>
    <button class="ibtn" id="home" aria-label="Home" hidden>🏠</button>
    <h1>Toby's Weather Wardrobe</h1>
    <button class="ibtn" id="snd" aria-label="Sound">🔊</button>
  </header>

  <section id="menu">
    <svg id="mtoby" viewBox="-20 -20 240 320" aria-label="Toby the bear"></svg>
    <div class="mbtns">
      <button class="bigbtn go" id="play">▶ Toby's Week</button>
      <button class="bigbtn free" id="freebtn">👕 Free Dress-Up</button>
    </div>
    <div class="weekcard">
      <h2>Sticker Week</h2>
      <div id="week"></div>
    </div>
    <button id="reset">Start the week again</button>
  </section>

  <section id="game" hidden>
    <div id="need"></div>
    <div id="stage">
      <canvas id="wx"></canvas>
      <button id="badge" aria-label="Weather">☀️</button>
      <svg id="toby" viewBox="-20 -20 240 320"></svg>
      <div id="cases">
        <button class="case a" data-k="a" aria-label="Beach bag"><span class="cl">🏖️</span><div class="cin"></div></button>
        <button class="case b" data-k="b" aria-label="Snow bag"><span class="cl">🏔️</span><div class="cin"></div></button>
      </div>
    </div>
    <div id="msg"><span></span></div>
    <div id="tray"></div>
  </section>

  <div id="party" hidden>
    <div class="pcard">
      <div class="big">🎉🐻🎉</div>
      <h2>Toby's Whole Week!</h2>
      <p>Sunshine, rain, snow and wind - you dressed Toby just right every day!</p>
      <button class="bigbtn free" id="pfree">👕 Free Dress-Up</button>
      <button class="bigbtn go" id="phome">🏠 Sticker Week</button>
    </div>
  </div>
</div>
<canvas id="fx"></canvas>

// ---------- events ----------

$('#need').addEventListener('click', e => {

$('#badge').addEventListener('click', e => {

  say(`It's ${WX[S.w].name} today!`);

$('#week').addEventListener('click', e => { const d = e.target.closest('[data-i]'); if (d) startLevel(+d.dataset.i); });

$('#freebtn').addEventListener('click', startFree);
$('#pfree').addEventListener('click', startFree);
$('#phome').addEventListener('click', showMenu);
$('#home').addEventListener('click', showMenu);

  try { localStorage.setItem('cowork-toby-weather-wardrobe-sound', soundOn ? 'on' : 'off'); } catch (e) { /* ignore */ }

document.addEventListener('pointerdown', () => ac(), { passive: true });
setInterval(() => {
  if (S.mode === 'menu' || $('#game').hidden) return;
  if (++S.idle === 9) hint();

// ---------- canvas: weather, props, bursts ----------
let W = 0, H = 0, DPR = 1;
const parts = { rain: [], snow: [], wind: [] }, bursts = [], confs = [];
function resize() {
  const r = stage.getBoundingClientRect();
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = Math.max(1, r.width); H = Math.max(1, r.height);
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR); ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  fx.width = Math.round(innerWidth * DPR); fx.height = Math.round(innerHeight * DPR); fctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  parts.rain = Array.from({ length: 70 }, () => ({ x: Math.random() * W, y: Math.random() * H, v: 0.6 + Math.random() * 0.4 }));
  parts.snow = Array.from({ length: 60 }, () => ({ x: Math.random() * W, y: Math.random() * H, r: 1.5 + Math.random() * 3, p: Math.random() * 6 }));
  parts.wind = Array.from({ length: 16 }, () => ({ x: Math.random() * W, y: Math.random() * H * 0.85, p: Math.random() * 6, c: ['#ff922b', '#e8590c', '#ffd43b', '#94d82d'][Math.floor(Math.random() * 4)] }));
}
new ResizeObserver(resize).observe(stage);
addEventListener('resize', resize);

function updateParts(dt) {
  const k = dt / 16.7;
  parts.rain.forEach(d => { d.y += H * 0.022 * d.v * k; d.x -= 1.2 * k; if (d.y > H) { d.y = -10; d.x = Math.random() * (W + 40); } });

  parts.wind.forEach(l => { l.x += 3.2 * k; l.p += 0.08 * k; l.y += Math.sin(l.p) * 1.2 * k; if (l.x > W + 20) { l.x = -20; l.y = Math.random() * H * 0.85; } });
}
function cloud(x, y, s, col) {

  ctx.arc(x, y, 22 * s, 0, 7); ctx.arc(x + 24 * s, y - 10 * s, 26 * s, 0, 7); ctx.arc(x + 50 * s, y, 22 * s, 0, 7); ctx.arc(x + 24 * s, y + 8 * s, 22 * s, 0, 7);

function drawScene(w, t) {

function drawProps() {

      ctx.fillStyle = '#222'; [[-6, -4], [6, -4]].forEach(([dx, dy]) => { ctx.beginPath(); ctx.arc(px + dx * s, cy + dy * s, 2.6 * s, 0, 7); ctx.fill(); });
      ctx.fillStyle = '#ff922b'; ctx.beginPath(); ctx.moveTo(px, cy); ctx.lineTo(px + 16 * s, cy + 3 * s); ctx.lineTo(px, cy + 5 * s); ctx.fill();

    }

    ctx.fillStyle = '#6f8fbf'; ctx.beginPath(); ctx.ellipse(px, gy + (H - gy) * 0.45, (40 + n * 12) * s, (9 + n * 2) * s, 0, 0, 7); ctx.fill();

function burst(x, y, cols, k) {

  for (let i = 0; i < k; i++) confs.push({ x: Math.random() * innerWidth, y: -20 - Math.random() * innerHeight * 0.4, vx: (Math.random() - 0.5) * 2, vy: 2 + Math.random() * 3, a: Math.random() * 6, va: (Math.random() - 0.5) * 0.3, c: cols[i % cols.length], life: 1 });

$('#snd').textContent = soundOn ? '🔊' : '🔇';
showMenu();
resize();
requestAnimationFrame(frame);
