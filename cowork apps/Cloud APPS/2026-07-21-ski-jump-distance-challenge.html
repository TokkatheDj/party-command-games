<!-- CONCEPT: Ski Jumping - power-meter takeoff + lean-balance flight + timed telemark landing | Players: 1 | Controls: SPACE to launch/land, UP/DOWN arrows (or W/S) to balance lean, touch buttons on mobile -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Ski Jump: Distance Challenge</title>
<style>
  html,body{margin:0;padding:0;overflow:hidden;background:#0b1a2b;height:100%;width:100%;touch-action:none;font-family:'Segoe UI',Arial,sans-serif;}
  canvas{display:block;}
  #hint{position:fixed;bottom:6px;left:50%;transform:translateX(-50%);color:#cfe8ff;font-size:12px;opacity:.65;pointer-events:none;user-select:none;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">Ski Jump: Distance Challenge</div>
<script>
(function(){
"use strict";
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W=0,H=0,DPR=1;

function resize(){
  DPR = Math.min(window.devicePixelRatio||1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.floor(W*DPR); canvas.height = Math.floor(H*DPR);
  canvas.style.width = W+'px'; canvas.style.height = H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener('resize', resize);
resize();

/* ---------------- AUDIO ---------------- */
let actx = null;
function ensureAudio(){
  if(!actx){
    try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ actx=null; }
  }
  if(actx && actx.state==='suspended') actx.resume();
}
function tone(freq,dur,type,vol,delay){
  if(!actx) return;
  type=type||'sine'; vol=vol||0.2; delay=delay||0;
  const t0=actx.currentTime+delay;
  const osc=actx.createOscillator(), gain=actx.createGain();
  osc.type=type; osc.frequency.setValueAtTime(freq,t0);
  gain.gain.setValueAtTime(0,t0);
  gain.gain.linearRampToValueAtTime(vol,t0+0.02);
  gain.gain.exponentialRampToValueAtTime(0.001,t0+dur);
  osc.connect(gain); gain.connect(actx.destination);
  osc.start(t0); osc.stop(t0+dur+0.03);
}
function sweep(f0,f1,dur,type,vol){
  if(!actx) return;
  type=type||'sine'; vol=vol||0.2;
  const t0=actx.currentTime;
  const osc=actx.createOscillator(), gain=actx.createGain();
  osc.type=type; osc.frequency.setValueAtTime(f0,t0); osc.frequency.linearRampToValueAtTime(f1,t0+dur);
  gain.gain.setValueAtTime(0,t0); gain.gain.linearRampToValueAtTime(vol,t0+0.03);
  gain.gain.exponentialRampToValueAtTime(0.001,t0+dur);
  osc.connect(gain); gain.connect(actx.destination);
  osc.start(t0); osc.stop(t0+dur+0.03);
}
function noiseBurst(dur,vol,filterFreq){
  if(!actx) return;
  dur=dur||0.3; vol=vol||0.25; filterFreq=filterFreq||1200;
  const n = Math.max(1, Math.floor(actx.sampleRate*dur));
  const buffer = actx.createBuffer(1,n,actx.sampleRate);
  const data = buffer.getChannelData(0);
  for(let i=0;i<n;i++){ data[i]=(Math.random()*2-1)*(1-i/n); }
  const src=actx.createBufferSource(); src.buffer=buffer;
  const filt=actx.createBiquadFilter(); filt.type='lowpass'; filt.frequency.value=filterFreq;
  const gain=actx.createGain(); gain.gain.value=vol;
  src.connect(filt); filt.connect(gain); gain.connect(actx.destination);
  src.start();
}
function playWhistle(){ ensureAudio(); sweep(1700,2300,0.3,'square',0.14); setTimeout(()=>{ if(actx) sweep(2300,1700,0.22,'square',0.11); },300); }
function playCheer(){ ensureAudio(); noiseBurst(1.1,0.28,2600); tone(520,0.7,'sawtooth',0.05,0.05); }
function playDing(){ ensureAudio(); tone(1100,0.35,'sine',0.2); tone(1500,0.3,'sine',0.12,0.06); }
function playCrash(){ ensureAudio(); noiseBurst(0.4,0.32,500); tone(140,0.3,'square',0.18); }
function playClick(){ ensureAudio(); tone(700,0.08,'square',0.12); }
function playWoosh(){ ensureAudio(); noiseBurst(0.5,0.1,3200); }

/* ---------------- GAME STATE ---------------- */
const TOTAL_JUMPS = 3;
const COURSE_RECORD = 231.5; // meters, target to beat
const G = 9.81;

let state = 'TITLE'; // TITLE, INRUN, FLIGHT, LANDING_RESULT, FINAL
let jumpIndex = 0;
let jumpResults = []; // {distance, style}
let bestDistance = 0;
let stateTime = 0;

// in-run / power meter
let power = 0; // 0-100 current oscillating value
let powerT = 0;
const POWER_PERIOD = 1.7; // seconds per cycle
const POWER_MAXTIME = 4.2; // auto release after this long
const ZONE_GOOD = [78,96];
const ZONE_OK = [58,78,96,100]; // combined ok ranges via two intervals below/above good

// flight
let fx=0, fy=0, fvx=0, fvy=0, lean=0, leanInput=0;
const IDEAL_LEAN = 0.15;
let landingWindowOpen = false;
let landingPressed = false;
let distanceToGroundPrev = 999;
let lastLandingStyle = '';
let lastLandingMult = 1;
let flightPathPoints = [];

// result banner
let resultDistance = 0;

// input flags
let keyUp=false, keyDown=false;
let actionQueued=false;

/* ---------------- GROUND / HILL PROFILE ---------------- */
function groundY(x){
  // returns altitude (meters, negative = below takeoff point) of the landing hill at horizontal distance x
  if(x<=0) return 0.6; // small ramp lip just before takeoff
  const KPOINT = 106;
  if(x<=KPOINT) return -0.60*x;
  return -0.60*KPOINT - (x-KPOINT)*0.14;
}

/* ---------------- RESET / SETUP ---------------- */
function resetRun(){
  jumpIndex = 0;
  jumpResults = [];
  bestDistance = 0;
  goToInrun();
}
function goToInrun(){
  state='INRUN'; stateTime=0;
  power=0; powerT=0;
}
function startFlight(quality){
  state='FLIGHT'; stateTime=0;
  const speed = 23 + quality*11;      // 23 - 34 m/s
  const angleDeg = 8 + quality*5;     // 8 - 13 degrees
  const a = angleDeg*Math.PI/180;
  fx = 0; fy = 0.6;
  fvx = speed*Math.cos(a);
  fvy = speed*Math.sin(a);
  lean = 0; leanInput = 0;
  landingWindowOpen = false;
  landingPressed = false;
  distanceToGroundPrev = 999;
  flightPathPoints = [{x:fx,y:fy}];
  playWoosh();
}
function evaluateLanding(pressedNow){
  const gy = groundY(fx);
  const dist = fy - gy;
  let style, mult;
  if(pressedNow && dist>0.25 && dist<2.4){
    style='Telemark Landing!'; mult=1.06; playCheer();
  } else if(pressedNow){
    style='Stumble'; mult=0.90; playCrash();
  } else {
    style='Fall'; mult=0.83; playCrash();
  }
  lastLandingStyle = style; lastLandingMult = mult;
  resultDistance = Math.max(0, fx*mult);
  jumpResults.push({distance:resultDistance, style:style});
  if(resultDistance>bestDistance) bestDistance = resultDistance;
  state='LANDING_RESULT'; stateTime=0;
  playDing();
}

function action(){
  ensureAudio();
  if(state==='TITLE'){
    resetRun();
    return;
  }
  if(state==='INRUN'){
    lockPower();
    return;
  }
  if(state==='FLIGHT'){
    if(landingWindowOpen && !landingPressed){
      landingPressed = true;
      evaluateLanding(true);
    }
    return;
  }
  if(state==='LANDING_RESULT'){
    if(stateTime>0.5){
      advanceAfterResult();
    }
    return;
  }
  if(state==='FINAL'){
    resetRun();
    return;
  }
}
function advanceAfterResult(){
  jumpIndex++;
  if(jumpIndex>=TOTAL_JUMPS){
    state='FINAL'; stateTime=0;
  } else {
    goToInrun();
  }
}
function lockPower(){
  playClick();
  const q = powerQuality(power);
  startFlight(q);
}
function powerQuality(v){
  // 1.0 at center of good zone, tapering off outward
  const center = (ZONE_GOOD[0]+ZONE_GOOD[1])/2;
  const halfWidth = (ZONE_GOOD[1]-ZONE_GOOD[0])/2;
  const d = Math.abs(v-center);
  let q;
  if(d<=halfWidth) q = 1 - (d/halfWidth)*0.15; // 0.85-1.0 inside good zone
  else q = Math.max(0, 0.85 - (d-halfWidth)*0.02);
  return Math.max(0,Math.min(1,q));
}

/* ---------------- INPUT ---------------- */
window.addEventListener('keydown', (e)=>{
  if(e.code==='Space' || e.code==='Enter'){ e.preventDefault(); if(!actionQueued){ actionQueued=true; action(); } }
  if(e.code==='ArrowUp' || e.code==='KeyW') keyUp=true;
  if(e.code==='ArrowDown' || e.code==='KeyS') keyDown=true;
});
window.addEventListener('keyup', (e)=>{
  if(e.code==='Space' || e.code==='Enter') actionQueued=false;
  if(e.code==='ArrowUp' || e.code==='KeyW') keyUp=false;
  if(e.code==='ArrowDown' || e.code==='KeyS') keyDown=false;
});

// touch / mouse buttons (computed in draw, hit-tested here)
let btnAction=null, btnUp=null, btnDown=null, btnPlayAgain=null;
function pointInRect(px,py,r){ return r && px>=r.x && px<=r.x+r.w && py>=r.y && py<=r.y+r.h; }

function handlePointerDown(px,py){
  ensureAudio();
  if(state==='FINAL' && pointInRect(px,py,btnPlayAgain)){ resetRun(); return; }
  if(pointInRect(px,py,btnUp)){ keyUp=true; return; }
  if(pointInRect(px,py,btnDown)){ keyDown=true; return; }
  if(pointInRect(px,py,btnAction)){ if(!actionQueued){ actionQueued=true; action(); } return; }
  // generic tap anywhere also triggers action for title/result/final convenience
  if(state==='TITLE' || state==='LANDING_RESULT' || state==='FINAL'){ if(!actionQueued){ actionQueued=true; action(); } }
}
function handlePointerUp(){
  keyUp=false; keyDown=false; actionQueued=false;
}
canvas.addEventListener('mousedown', (e)=>{ handlePointerDown(e.clientX, e.clientY); });
window.addEventListener('mouseup', handlePointerUp);
canvas.addEventListener('touchstart', (e)=>{
  e.preventDefault();
  for(const t of e.changedTouches) handlePointerDown(t.clientX, t.clientY);
}, {passive:false});
canvas.addEventListener('touchend', (e)=>{ e.preventDefault(); handlePointerUp(); }, {passive:false});

/* ---------------- UPDATE ---------------- */
function update(dt){
  stateTime += dt;
  if(state==='INRUN'){
    powerT += dt;
    const phase = (powerT % POWER_PERIOD)/POWER_PERIOD;
    power = Math.abs(Math.sin(phase*Math.PI*2))*100;
    if(powerT>=POWER_MAXTIME){ lockPower(); }
  } else if(state==='FLIGHT'){
    // lean control: keyUp/keyDown or touch buttons push lean toward +1/-1, else decay toward 0
    const target = keyUp? 1 : (keyDown? -1 : 0);
    lean += (target-lean)*Math.min(1,dt*4);
    const liftQuality = Math.max(0, 1 - Math.abs(lean-IDEAL_LEAN)/0.85);
    const speedSq = fvx*fvx;
    const liftAccel = liftQuality*2.55*(speedSq/900);
    const dragCoeff = 0.02 + (1-liftQuality)*0.05;
    fvy += (-G + liftAccel)*dt;
    fvx -= dragCoeff*fvx*dt;
    fx += fvx*dt;
    fy += fvy*dt;
    flightPathPoints.push({x:fx,y:fy});
    if(flightPathPoints.length>400) flightPathPoints.shift();

    const gy = groundY(fx);
    const dist = fy-gy;
    if(dist<3.6 && !landingWindowOpen){ landingWindowOpen = true; }
    if(dist<=0){
      // touched down without (or with) a press already
      if(!landingPressed){ landingPressed=true; evaluateLanding(false); }
    }
    distanceToGroundPrev = dist;
  } else if(state==='LANDING_RESULT'){
    if(stateTime>2.2){ advanceAfterResult(); }
  }
}

/* ---------------- DRAW HELPERS ---------------- */
function drawSky(t){
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#8fc7ff');
  g.addColorStop(0.55,'#cdeaff');
  g.addColorStop(1,'#eef8ff');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  // sun
  ctx.fillStyle='rgba(255,255,240,0.9)';
  ctx.beginPath(); ctx.arc(W*0.85,H*0.15,40,0,Math.PI*2); ctx.fill();
  // mountains
  ctx.fillStyle='#c9d9e6';
  drawMountainRow(H*0.42, 140, 0.15);
  ctx.fillStyle='#b3c7da';
  drawMountainRow(H*0.5, 100, 0.22);
}
function drawMountainRow(baseY, amp, freq){
  ctx.beginPath();
  ctx.moveTo(0,baseY);
  for(let x=0;x<=W;x+=20){
    const y = baseY - Math.abs(Math.sin(x*freq*0.02+1))*amp - Math.abs(Math.sin(x*0.005))*amp*0.4;
    ctx.lineTo(x,y);
  }
  ctx.lineTo(W,baseY+200); ctx.lineTo(0,baseY+200); ctx.closePath(); ctx.fill();
}
function drawCrowdDots(baseY){
  ctx.fillStyle='rgba(40,50,70,0.35)';
  for(let i=0;i<40;i++){
    const x = (i*53)%W;
    const y = baseY + Math.sin(i*7.1)*4;
    ctx.beginPath(); ctx.arc(x,y,3,0,Math.PI*2); ctx.fill();
  }
}
function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function drawButton(x,y,w,h,label,fill){
  ctx.fillStyle = fill||'rgba(20,40,60,0.75)';
  roundRect(x,y,w,h,10); ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,0.6)'; ctx.lineWidth=2; roundRect(x,y,w,h,10); ctx.stroke();
  ctx.fillStyle='#fff'; ctx.font='bold 16px Segoe UI, Arial'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(label, x+w/2, y+h/2);
}
function drawScoreboard(){
  ctx.textAlign='left'; ctx.textBaseline='top';
  ctx.fillStyle='rgba(10,20,35,0.55)';
  roundRect(14,14,240,86,10); ctx.fill();
  ctx.fillStyle='#fff'; ctx.font='bold 15px Segoe UI, Arial';
  ctx.fillText('SKI JUMP — DISTANCE CHALLENGE', 26, 24);
  ctx.font='13px Segoe UI, Arial';
  ctx.fillText('Jump '+(Math.min(jumpIndex+1,TOTAL_JUMPS))+' / '+TOTAL_JUMPS, 26, 46);
  ctx.fillText('Best: '+bestDistance.toFixed(1)+' m', 26, 64);
  ctx.fillText('Record: '+COURSE_RECORD.toFixed(1)+' m', 26, 82);
}

/* ---------------- STATE DRAWS ---------------- */
function drawTitle(){
  drawSky();
  drawCrowdDots(H*0.78);
  ctx.fillStyle='#0b1a2b'; ctx.textAlign='center';
  ctx.font='bold '+Math.min(54,W*0.08)+'px Segoe UI, Arial';
  ctx.fillText('SKI JUMP: DISTANCE CHALLENGE', W/2, H*0.32);
  ctx.font='18px Segoe UI, Arial';
  ctx.fillText('Time your launch, balance your lean in the air, and stick the landing.', W/2, H*0.32+44);
  ctx.fillText('3 jumps. Beat the course record of '+COURSE_RECORD.toFixed(1)+' m.', W/2, H*0.32+70);
  ctx.font='bold 16px Segoe UI, Arial';
  ctx.fillStyle='#123';
  ctx.fillText('Sport: Ski Jumping   |   Players: 1   |   Controls: SPACE to launch/land, UP/DOWN to balance', W/2, H*0.32+110);

  const bw=Math.min(280,W*0.6), bh=56;
  btnAction={x:W/2-bw/2,y:H*0.62,w:bw,h:bh};
  drawButton(btnAction.x,btnAction.y,btnAction.w,btnAction.h,'PRESS SPACE / TAP TO START','rgba(30,110,60,0.85)');
  btnUp=null; btnDown=null; btnPlayAgain=null;
}

function drawInrun(){
  drawSky(); drawCrowdDots(H*0.75);
  // ramp
  ctx.fillStyle='#e9f4ff';
  ctx.beginPath();
  ctx.moveTo(0,H*0.15);
  ctx.lineTo(W*0.62,H*0.15);
  ctx.lineTo(W*0.62+ W*0.12, H*0.62);
  ctx.lineTo(0,H*0.62);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle='#9fb9cc'; ctx.lineWidth=2; ctx.stroke();

  // skier sliding down proportional to powerT
  const prog = Math.min(1, stateTime/ (POWER_MAXTIME*0.9));
  const sx = W*0.05 + prog*(W*0.62-W*0.08);
  const syTop=H*0.17, syBot=H*0.58;
  const sy = syTop + prog*(syBot-syTop);
  drawSkierTuck(sx,sy, W*0.02);

  drawScoreboard();

  ctx.fillStyle='#0b1a2b'; ctx.textAlign='center'; ctx.font='bold 20px Segoe UI, Arial';
  ctx.fillText('Press SPACE / Tap the button at the PERFECT moment to launch!', W/2, H*0.68);

  // power meter
  const mw = Math.min(520,W*0.7), mh=34;
  const mx = W/2-mw/2, my=H*0.74;
  ctx.fillStyle='rgba(10,20,35,0.55)'; roundRect(mx-10,my-10,mw+20,mh+56,12); ctx.fill();
  // zones
  ctx.fillStyle='#7a2e2e'; ctx.fillRect(mx,my,mw,mh);
  ctx.fillStyle='#c99a2e'; ctx.fillRect(mx+mw*0.58,my,mw*0.20,mh);
  ctx.fillStyle='#2ea360'; ctx.fillRect(mx+mw*(ZONE_GOOD[0]/100),my,mw*((ZONE_GOOD[1]-ZONE_GOOD[0])/100),mh);
  ctx.fillStyle='#c99a2e'; ctx.fillRect(mx+mw*0.96,my,mw*0.04,mh);
  ctx.strokeStyle='#fff'; ctx.lineWidth=2; ctx.strokeRect(mx,my,mw,mh);
  // marker
  const markX = mx + mw*(power/100);
  ctx.fillStyle='#fff';
  ctx.beginPath(); ctx.moveTo(markX,my-8); ctx.lineTo(markX-9,my-22); ctx.lineTo(markX+9,my-22); ctx.closePath(); ctx.fill();

  const bw=Math.min(240,W*0.5), bh=48;
  btnAction={x:W/2-bw/2, y:my+mh+16, w:bw, h:bh};
  drawButton(btnAction.x,btnAction.y,btnAction.w,btnAction.h,'LAUNCH (SPACE)','rgba(30,90,150,0.85)');
  btnUp=null; btnDown=null; btnPlayAgain=null;
}

function drawSkierTuck(x,y,s){
  ctx.save(); ctx.translate(x,y);
  ctx.strokeStyle='#1b2b3a'; ctx.fillStyle='#d33b3b'; ctx.lineWidth=3;
  ctx.beginPath(); ctx.ellipse(0,0,s*1.1,s*0.55,0.25,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(-s*0.9,-s*0.15,s*0.4,0,Math.PI*2); ctx.fillStyle='#f2c9a0'; ctx.fill();
  ctx.strokeStyle='#222'; ctx.beginPath(); ctx.moveTo(-s*2.2,s*0.7); ctx.lineTo(s*1.6,s*0.55); ctx.stroke();
  ctx.restore();
}

const CAM_SCALE = 3.4; // px per meter baseline (adjusted by W)
function worldToScreen(x,y){
  const scale = Math.max(2.0, Math.min(5.5, W/340));
  const originX = W*0.18;
  const originY = H*0.30;
  const camX = Math.max(0, fx - (originX)/scale);
  return { x: (x-camX)*scale + originX*0 + (x-camX)*0 + originX*0 + ( (x-camX)*scale ), sx: scale, originX, originY, camX };
}
function projectPoint(x,y,scale,originX,originY,camX){
  return { px: originX + (x-camX)*scale, py: originY - y*scale };
}

function drawFlightOrResult(){
  drawSky(); drawCrowdDots(H*0.86);
  const scale = Math.max(2.0, Math.min(5.5, W/340));
  const originX = W*0.22, originY = H*0.30;
  const camX = Math.max(0, fx - originX/scale);

  // hill profile
  ctx.beginPath();
  let first=true;
  for(let gx = Math.max(0,camX-20); gx<=camX + (W-originX)/scale + 40; gx+=4){
    const gy = groundY(gx);
    const p = projectPoint(gx,gy,scale,originX,originY,camX);
    if(first){ ctx.moveTo(p.px,p.py); first=false; } else ctx.lineTo(p.px,p.py);
  }
  const last = projectPoint(camX + (W-originX)/scale + 40, groundY(camX + (W-originX)/scale + 40), scale, originX, originY, camX);
  ctx.lineTo(last.px, H+40); ctx.lineTo(-40,H+40); ctx.closePath();
  ctx.fillStyle='#f4fafe'; ctx.fill();
  ctx.strokeStyle='#b9d3e6'; ctx.lineWidth=2; ctx.stroke();

  // distance markers every 20m
  ctx.fillStyle='rgba(20,40,60,0.55)'; ctx.font='11px Segoe UI, Arial'; ctx.textAlign='center';
  for(let gx=0; gx<=camX + (W-originX)/scale + 40; gx+=20){
    if(gx<camX-20) continue;
    const p = projectPoint(gx, groundY(gx), scale, originX, originY, camX);
    ctx.fillRect(p.px-1,p.py-6,2,6);
    ctx.fillText(gx+'m', p.px, p.py+16);
  }

  // record line marker
  {
    const p = projectPoint(COURSE_RECORD, groundY(COURSE_RECORD), scale, originX, originY, camX);
    ctx.strokeStyle='rgba(210,40,40,0.8)'; ctx.setLineDash([6,4]);
    ctx.beginPath(); ctx.moveTo(p.px,p.py); ctx.lineTo(p.px,p.py-260); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle='rgba(210,40,40,0.9)'; ctx.font='bold 11px Segoe UI, Arial';
    ctx.fillText('RECORD', p.px, p.py-266);
  }

  // flight path trail
  if(flightPathPoints.length>1){
    ctx.strokeStyle='rgba(255,255,255,0.7)'; ctx.lineWidth=2; ctx.beginPath();
    for(let i=0;i<flightPathPoints.length;i++){
      const pt = flightPathPoints[i];
      const p = projectPoint(pt.x,pt.y,scale,originX,originY,camX);
      if(i===0) ctx.moveTo(p.px,p.py); else ctx.lineTo(p.px,p.py);
    }
    ctx.stroke();
  }

  // skier
  const sp = projectPoint(fx,fy,scale,originX,originY,camX);
  ctx.save(); ctx.translate(sp.px, sp.py);
  const angle = Math.atan2(-fvy, fvx)*0.35 + lean*0.5;
  ctx.rotate(angle);
  ctx.fillStyle='#d33b3b'; ctx.strokeStyle='#1b2b3a'; ctx.lineWidth=2.5;
  ctx.beginPath(); ctx.ellipse(0,0, s_(scale)*2.4, s_(scale)*0.9, 0,0,Math.PI*2); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.arc(-s_(scale)*2.0,-s_(scale)*0.3, s_(scale)*0.9,0,Math.PI*2); ctx.fillStyle='#f2c9a0'; ctx.fill(); ctx.stroke();
  ctx.strokeStyle='#222'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(-s_(scale)*4.6,s_(scale)*1.3); ctx.lineTo(s_(scale)*3.2,s_(scale)*1.0); ctx.stroke();
  ctx.restore();

  drawScoreboard();

  // HUD text + lean meter (only while airborne)
  if(state==='FLIGHT'){
    ctx.fillStyle='#0b1a2b'; ctx.textAlign='center'; ctx.font='bold 18px Segoe UI, Arial';
    if(landingWindowOpen) ctx.fillText('Press SPACE / Tap ACTION to stick the landing!', W/2, H*0.12);
    else ctx.fillText('Hold UP / DOWN to balance your lean for lift!', W/2, H*0.12);

    const mw=220, mh=18, mx=W/2-mw/2, my=H*0.16;
    ctx.fillStyle='rgba(10,20,35,0.55)'; roundRect(mx-8,my-8,mw+16,mh+16,10); ctx.fill();
    ctx.fillStyle='#33475c'; ctx.fillRect(mx,my,mw,mh);
    ctx.fillStyle='#2ea360';
    const idealX = mx+mw*((IDEAL_LEAN+1)/2);
    ctx.fillRect(idealX-14,my,28,mh);
    const markX = mx+mw*((lean+1)/2);
    ctx.fillStyle='#fff'; ctx.fillRect(markX-3,my-4,6,mh+8);

    const bw=180,bh=44;
    btnAction={x:W/2-bw/2, y:H-bh-90, w:bw, h:bh};
    drawButton(btnAction.x,btnAction.y,btnAction.w,btnAction.h, landingWindowOpen? 'LAND! (SPACE)':'ACTION', landingWindowOpen? 'rgba(200,90,20,0.9)':'rgba(60,60,70,0.6)');
    const ubw=64,ubh=54;
    btnUp={x:W-ubw-20,y:H-ubh*2-40,w:ubw,h:ubh};
    btnDown={x:W-ubw-20,y:H-ubh-30,w:ubw,h:ubh};
    drawButton(btnUp.x,btnUp.y,btnUp.w,btnUp.h,'↑', keyUp?'rgba(30,110,60,0.85)':'rgba(20,40,60,0.75)');
    drawButton(btnDown.x,btnDown.y,btnDown.w,btnDown.h,'↓', keyDown?'rgba(30,110,60,0.85)':'rgba(20,40,60,0.75)');
    btnPlayAgain=null;
  } else if(state==='LANDING_RESULT'){
    ctx.fillStyle='rgba(10,20,35,0.72)';
    const bw=Math.min(420,W*0.8), bh=140, bx=W/2-bw/2, by=H*0.28;
    roundRect(bx,by,bw,bh,14); ctx.fill();
    ctx.fillStyle='#fff'; ctx.textAlign='center';
    ctx.font='bold 22px Segoe UI, Arial';
    ctx.fillText(lastLandingStyle, W/2, by+38);
    ctx.font='bold 36px Segoe UI, Arial';
    ctx.fillText(resultDistance.toFixed(1)+' m', W/2, by+82);
    ctx.font='14px Segoe UI, Arial';
    ctx.fillText(stateTime>0.5? 'Press SPACE / Tap to continue' : ' ', W/2, by+114);
    const bw2=200,bh2=44;
    btnAction={x:W/2-bw2/2, y:by+bh+16, w:bw2, h:bh2};
    if(stateTime>0.5) drawButton(btnAction.x,btnAction.y,btnAction.w,btnAction.h,'CONTINUE','rgba(30,90,150,0.85)');
    btnUp=null; btnDown=null; btnPlayAgain=null;
  }
}
function s_(scale){ return scale*0.6; }

function drawFinal(){
  drawSky(); drawCrowdDots(H*0.8);
  ctx.fillStyle='rgba(10,20,35,0.78)';
  const bw=Math.min(520,W*0.86), bh=Math.min(420,H*0.78), bx=W/2-bw/2, by=H/2-bh/2;
  roundRect(bx,by,bw,bh,16); ctx.fill();
  ctx.fillStyle='#fff'; ctx.textAlign='center';
  ctx.font='bold 26px Segoe UI, Arial';
  ctx.fillText('FINAL RESULTS', W/2, by+40);

  ctx.font='15px Segoe UI, Arial'; ctx.textAlign='left';
  let yy = by+80;
  for(let i=0;i<jumpResults.length;i++){
    const r = jumpResults[i];
    ctx.fillText('Jump '+(i+1)+':  '+r.distance.toFixed(1)+' m   ('+r.style+')', bx+40, yy);
    yy += 30;
  }
  ctx.font='bold 20px Segoe UI, Arial'; ctx.textAlign='center';
  yy += 14;
  ctx.fillText('Best Jump: '+bestDistance.toFixed(1)+' m', W/2, yy);
  yy += 32;
  const beat = bestDistance>COURSE_RECORD;
  ctx.fillStyle = beat? '#5fe08a' : '#ffd27a';
  ctx.fillText(beat? 'NEW COURSE RECORD! (was '+COURSE_RECORD.toFixed(1)+' m)' : 'Course Record: '+COURSE_RECORD.toFixed(1)+' m — so close, try again!', W/2, yy);

  const bw2=Math.min(260,bw*0.6), bh2=52;
  btnPlayAgain={x:W/2-bw2/2, y:by+bh-80, w:bw2, h:bh2};
  drawButton(btnPlayAgain.x,btnPlayAgain.y,btnPlayAgain.w,btnPlayAgain.h,'PLAY AGAIN (SPACE)','rgba(30,110,60,0.9)');
  btnAction=btnPlayAgain; btnUp=null; btnDown=null;
}

function draw(){
  ctx.clearRect(0,0,W,H);
  if(state==='TITLE') drawTitle();
  else if(state==='INRUN') drawInrun();
  else if(state==='FLIGHT' || state==='LANDING_RESULT') drawFlightOrResult();
  else if(state==='FINAL') drawFinal();
}

/* ---------------- LOOP ---------------- */
let lastT = null;
function frame(ts){
  if(lastT===null) lastT=ts;
  let dt = (ts-lastT)/1000;
  lastT = ts;
  dt = Math.min(dt, 1/20);
  update(dt);
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

})();
</script>
</body>
</html>
