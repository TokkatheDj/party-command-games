<!-- CONCEPT: Interactive guided worksheets for Science, English, Art, History and Spanish (grades K-12) with a student mode that checks answers, an answer key, and printable layouts. -->
<!-- Built 2026-10-29 from the Guided Math Worksheets engine (2026-06-26-guided-math-worksheets.html): same shell, student mode, answer key, tips, videos and ?subjects= config, but each worksheet is drawn from data (TOPICS) by one renderer. -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Guided Subject Worksheets</title>
<style>
:root{--math:Georgia,'Times New Roman',serif;--ui:'Segoe UI',system-ui,sans-serif;--ink:#111;--blue:#2f6fb0;--navy:#1d3557;--ok:#2e7d32;--okbg:#e8f5e9;--no:#c62828;--nobg:#ffebee;--key:#b5451b;--keybg:#fffbe6;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{touch-action:manipulation;}
body{font-family:var(--ui);background:#f4f3f0;color:var(--ink);font-size:14px;}

/* ── GLOBAL HEADER ── */
#global-header{background:#111;color:#fff;padding:10px 24px;display:flex;align-items:center;gap:20px;flex-wrap:wrap;}
#global-header h1{font-size:14px;font-weight:700;letter-spacing:.05em;white-space:nowrap;}
.gmeta{display:flex;flex-direction:column;gap:1px;}
.gmeta label{font-size:8px;color:#b5b5b5;font-weight:700;text-transform:uppercase;letter-spacing:.06em;}
.gmeta input{padding:3px 7px;border:1px solid #444;border-radius:3px;font-size:11px;font-family:var(--ui);background:#222;color:#fff;width:160px;}
.gmeta input:focus{outline:none;border-color:#888;}
.gbtns{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.gprint{padding:6px 14px;min-height:44px;border-radius:3px;border:1px solid #555;background:transparent;font-family:var(--ui);font-size:12px;cursor:pointer;color:#fff;font-weight:600;}
.gprint:hover{background:#333;}
.gprint.on-student{background:#2d6a4f;border-color:#2d6a4f;}
.gprint.on-key{background:var(--key);border-color:var(--key);}

/* ── TWO-TIER NAV (subject row + grade-band row, as Pre-Algebra's sub-row) ── */
#subject-bar{background:#fff;border-bottom:1px solid #ddd;display:flex;padding:0 20px;flex-wrap:wrap;}
.subj-btn{padding:10px 20px;min-height:44px;font-size:12px;font-weight:700;color:#666;background:transparent;border:none;cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent;margin-bottom:-1px;font-family:var(--ui);text-transform:uppercase;letter-spacing:.06em;transition:all .15s;}
.subj-btn:hover{color:#333;}
.subj-btn.active{color:#fff;}
.subj-btn[data-subj="science"].active{background:#2d6a4f;}
.subj-btn[data-subj="english"].active{background:#1d3557;}
.subj-btn[data-subj="art"].active{background:#8a2a6b;}
.subj-btn[data-subj="history"].active{background:#7b2d00;}
.subj-btn[data-subj="spanish"].active{background:#b5451b;}
#subject-subbar{background:#f3f8f5;border-bottom:1px solid #ddd;display:flex;align-items:center;padding:0 20px;flex-wrap:wrap;}
#subject-subbar .subj-btn{padding:8px 14px;font-size:11px;text-transform:none;letter-spacing:.02em;}
#subject-subbar .subj-btn.active{background:#0f5c73;color:#fff;}
.band-name{font-weight:600;opacity:.8;margin-left:3px;}
.band-tag{font-size:10px;font-weight:700;color:#0f5c73;background:#e3f1f5;border-radius:8px;padding:1px 6px;margin-left:4px;}
.subj-grp{margin:0 6px 0 0;font:700 10px var(--ui);color:#0f5c73;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;}
#topic-bar{background:#f9f8f6;border-bottom:2px solid #111;display:flex;flex-wrap:wrap;padding:0 16px;min-height:44px;align-items:stretch;}
.topic-btn{padding:8px 14px;min-height:44px;font-size:12px;font-weight:600;color:#5f5f5f;background:transparent;border:none;cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent;margin-bottom:-2px;font-family:var(--ui);letter-spacing:.03em;}
.topic-btn:hover{color:#333;}
.topic-btn.active{color:#111;border-bottom-color:#111;}

/* ── MODULE PANELS ── */
.module{display:none;}
.module.active{display:block;}

/* ── EDITOR STRIP (add your own question) ── */
.editor-strip{background:#fff;border-bottom:1px solid #ddd;padding:10px 24px 12px;}
.ed-details summary{cursor:pointer;font-size:11px;font-weight:700;color:#555;text-transform:uppercase;letter-spacing:.08em;min-height:44px;display:flex;align-items:center;}
.ed-form{display:flex;flex-direction:column;gap:8px;margin-top:8px;max-width:640px;}
.ed-field{display:flex;flex-direction:column;gap:3px;font-size:10px;font-weight:700;color:#666;text-transform:uppercase;letter-spacing:.05em;}
.ed-field textarea,.ed-field input,.ed-field select{font:inherit;font-size:13px;text-transform:none;letter-spacing:0;font-weight:400;color:#111;padding:6px 8px;border:1px solid #ccc;border-radius:4px;background:#fff;width:100%;}
.ed-field[hidden]{display:none;}
.ed-hint{font-size:11px;color:#6b6b6b;font-weight:400;text-transform:none;letter-spacing:0;}
.ed-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
button.act{padding:6px 13px;min-height:44px;border-radius:3px;border:1px solid #ccc;background:#fff;font-family:var(--ui);font-size:12px;cursor:pointer;color:#333;font-weight:600;}
button.act:hover{background:#f0f0f0;}
button.act.primary{background:#111;color:#fff;border-color:#111;}
.ed-msg{font-size:12px;font-weight:600;}
.ed-msg.no{color:var(--no);} .ed-msg.ok{color:var(--ok);}
.ed-custom{display:flex;flex-direction:column;gap:4px;}
.ed-custom-item{display:flex;align-items:center;gap:8px;background:#f9f8f6;border:1px solid #e4e2de;border-radius:5px;padding:5px 10px;font-size:12px;}
.ed-custom-item span{flex:1;min-width:0;overflow-wrap:anywhere;}

/* ── WORKSHEET ── */
.worksheet{max-width:780px;margin:20px auto;background:#fff;padding:40px 48px;border:1px solid #ccc;}
.ws-head{border-bottom:2.5px solid #111;padding-bottom:10px;margin-bottom:20px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;}
.ws-title{font-size:17px;font-weight:700;}
.ws-sub{font-size:11px;color:#5f5f5f;margin-top:3px;}
.ws-meta{font-size:11px;color:#555;text-align:right;line-height:1.9;}
.problem{margin-bottom:30px;padding-bottom:26px;border-bottom:1px solid #e8e8e8;break-inside:avoid;}
.problem:last-child{border-bottom:none;margin-bottom:0;}
.prob-num{font-size:14px;font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.prob-type{font-size:9px;color:#666;font-weight:600;text-transform:uppercase;letter-spacing:.06em;border:1px solid #ddd;padding:1px 6px;border-radius:2px;}
.prob-type.custom{color:#0f5c73;border-color:#9cc7d3;}
.prob-prompt{font-size:14px;margin-bottom:12px;line-height:1.7;overflow-wrap:break-word;}
.passage{background:#f8f8f6;border-left:3px solid #c9d6de;padding:10px 14px;margin:0 0 22px;font-size:14px;line-height:1.7;}
.passage-title{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:#0f5c73;margin-bottom:4px;}
.hint-sm{font-size:11px;color:#6b6b6b;margin-top:4px;}

/* blanks (fill-in): a line on paper, a text box in student mode */
.blank{border:none;border-bottom:1.5px solid #111;display:inline-block;min-width:70px;height:20px;background:transparent;vertical-align:bottom;margin:0 2px;}
.blank.sm{min-width:44px;} .blank.lg{min-width:100px;} .blank.xl{min-width:150px;}
.blank input{display:none;}
body.student-mode .blank{border-bottom:2px solid var(--blue);height:26px;padding:0 4px;background:#eef5fc;border-radius:4px 4px 0 0;vertical-align:middle;}
body.student-mode .blank.sm{width:60px;} body.student-mode .blank.md{width:110px;} body.student-mode .blank.lg{width:150px;} body.student-mode .blank.xl{width:min(220px,100%);}
body.student-mode .blank input{display:block;width:100%;height:100%;border:none;background:transparent;outline:none;font:inherit;font-weight:700;color:var(--navy);text-align:center;font-size:14px;padding:0;}
body.student-mode .blank.correct{background:var(--okbg);border-color:var(--ok);}
body.student-mode .blank.correct input{color:var(--ok);}
body.student-mode .blank.incorrect{background:var(--nobg);border-color:var(--no);}
body.student-mode .blank.incorrect input{color:var(--no);}
.ak-fill{display:none;}
body.answer-key-mode .blank{display:none;}
body.answer-key-mode .ak-fill{display:inline-block;font-weight:700;color:var(--key);border-bottom:1.5px solid var(--key);min-width:30px;text-align:center;padding:0 4px;}
.ak-only{display:none;}
body.answer-key-mode .ak-only{display:inline;color:var(--key);font-weight:700;}

/* paper copy vs. student-mode controls */
.live{display:none;}
body.student-mode .live{display:block;}
body.student-mode .paper{display:none;}

/* multiple choice */
.mc-opts{display:flex;flex-direction:column;gap:6px;margin:2px 0;}
.mc-opt{display:flex;align-items:center;gap:10px;text-align:left;padding:6px 10px;min-height:44px;border:1.5px solid #ddd;border-radius:6px;background:#fff;font:inherit;font-size:14px;color:#111;line-height:1.45;cursor:default;width:100%;}
.mc-letter{flex:0 0 auto;width:24px;height:24px;border:1.5px solid #111;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;}
body.student-mode .mc-opt{cursor:pointer;min-height:44px;}
body.student-mode .mc-opt:hover{border-color:var(--navy);background:#f0f4f8;}
body.student-mode .mc-opt.picked-ok{border-color:var(--ok);background:var(--okbg);color:var(--ok);font-weight:700;}
body.student-mode .mc-opt.picked-no{border-color:var(--no);background:var(--nobg);color:var(--no);}
body.answer-key-mode .mc-opt[data-ok="1"]{border-color:var(--key);background:var(--keybg);font-weight:700;}
body.answer-key-mode .mc-opt[data-ok="1"] .mc-letter{background:var(--key);border-color:var(--key);color:#fff;}

/* matching */
.m-line{display:inline-block;min-width:36px;border-bottom:1.5px solid #111;height:20px;vertical-align:bottom;margin-right:8px;text-align:center;}
.m-line.wide{min-width:160px;text-align:left;padding-left:4px;}
.match-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(240px,100%),1fr));gap:6px 28px;}
.match-grid ol,.match-grid ul{padding-left:22px;display:flex;flex-direction:column;gap:9px;line-height:1.5;}
.match-grid ul{list-style:none;padding-left:0;}
.match-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;padding:7px 0;border-bottom:1px dashed #e4e4e4;}
.match-row .ml{flex:1 1 180px;min-width:0;line-height:1.45;}
.match-row select{flex:1 1 200px;min-width:0;max-width:100%;min-height:44px;font:inherit;font-size:13px;padding:6px;border:2px solid var(--blue);border-radius:6px;background:#eef5fc;color:var(--navy);}
.match-row select.ok{border-color:var(--ok);background:var(--okbg);}
.match-row select.no{border-color:var(--no);background:var(--nobg);}

/* put in order */
.ord-paper{list-style:none;display:flex;flex-direction:column;gap:7px;}
.ord-paper li{display:flex;gap:10px;align-items:center;line-height:1.45;}
.o-box{width:28px;height:26px;border:1.5px solid #111;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;}
.ord-label{font-size:11px;font-weight:700;color:#555;text-transform:uppercase;letter-spacing:.05em;margin-top:6px;}
.ord-pool,.ord-seq{display:flex;flex-wrap:wrap;gap:6px;min-height:52px;padding:6px;border:1.5px dashed #c9d6de;border-radius:8px;margin:4px 0;align-items:flex-start;}
.ord-seq{flex-direction:column;align-items:stretch;}
.chip{min-height:44px;padding:6px 12px;border:1.5px solid #bbb;border-radius:20px;background:#fff;font:inherit;font-size:13.5px;cursor:pointer;text-align:left;color:#111;line-height:1.35;max-width:100%;}
.chip:hover{border-color:var(--navy);}
.ord-seq .chip{border-color:var(--blue);background:#eef5fc;color:var(--navy);border-radius:8px;}
.ord-seq .chip .n{font-weight:700;margin-right:6px;}
.ord-seq.ok .chip{border-color:var(--ok);background:var(--okbg);color:var(--ok);}
.ord-seq.no .chip{border-color:var(--no);}

/* label the diagram */
.lbl-wrap{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px;align-items:start;}
.lbl-svg svg{width:100%;height:auto;max-width:440px;display:block;margin:0 auto;}
.lbl-lead{stroke:#1d3557;stroke-width:1.3;}
.lbl-dot{fill:#1d3557;}
.lbl-spot circle{fill:#1d3557;stroke:#fff;stroke-width:1.5;}
.lbl-spot text{fill:#fff;font:700 12px var(--ui);text-anchor:middle;dominant-baseline:central;pointer-events:none;}
body.student-mode .lbl-spot{cursor:pointer;}
body.student-mode .lbl-spot.done circle{fill:var(--blue);}
body.student-mode .lbl-spot.sel circle{fill:#e67e22;}
.word-bank{font-size:12.5px;line-height:1.6;border:1px dashed #b9c6cf;border-radius:6px;padding:6px 10px;margin-bottom:10px;}
.lbl-paper{padding-left:24px;display:flex;flex-direction:column;gap:10px;}
.lbl-row{display:flex;gap:10px;align-items:center;width:100%;min-height:44px;padding:5px 10px;border:1.5px solid #ccc;border-radius:6px;background:#fff;font:inherit;font-size:14px;text-align:left;cursor:pointer;margin-bottom:6px;color:#111;}
.lbl-row.sel{border-color:#e67e22;background:#fff6ec;}
.lbl-row.ok{border-color:var(--ok);background:var(--okbg);}
.lbl-row.no{border-color:var(--no);background:var(--nobg);}
.num-dot{width:24px;height:24px;border-radius:50%;background:var(--navy);color:#fff;font-weight:700;font-size:11px;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;}
.lbl-val{color:#888;font-style:italic;} .lbl-val.set{color:var(--navy);font-style:normal;font-weight:700;}
.lbl-picker{display:none;margin-top:4px;padding:8px;border:1.5px solid #e67e22;border-radius:8px;background:#fffaf3;}
.lbl-picker.open{display:block;}
.lbl-picker-q{font-size:12px;font-weight:700;color:#8a4b0f;margin-bottom:6px;}
.lbl-names{display:flex;flex-wrap:wrap;gap:6px;}

/* short written answer */
.write-lines .rule{border-bottom:1px solid #bbb;height:28px;}
.short-live textarea{width:100%;min-height:96px;border:2px solid var(--blue);border-radius:6px;background:#eef5fc;padding:8px 10px;font:inherit;font-size:14px;color:var(--navy);resize:vertical;line-height:1.5;}

/* answer boxes */
.solution-box{margin-top:12px;border:1.5px solid #111;padding:7px 13px;font-size:13px;line-height:1.55;max-width:100%;overflow-wrap:break-word;}
@media screen{body:not(.answer-key-mode) .solution-box:not(.revealed){display:none;}}
.solution-box.revealed{background:var(--keybg);border-color:#e6b800;}
body.answer-key-mode .solution-box{display:block;background:var(--keybg);border-color:#e6b800;}
.sol-label{font-size:10px;font-weight:700;color:#555;text-transform:uppercase;letter-spacing:.05em;margin-right:4px;}
.sol-alts{color:#6b6b6b;font-size:12px;}
.solution-box ol{padding-left:22px;margin-top:2px;}

/* ── TIPS / KEY RULES + HELP VIDEO (copied) ── */
.ws-video{display:flex;align-items:center;gap:10px;margin:0 0 14px;padding:9px 14px;border:1px solid #f3c6c6;border-radius:8px;background:#fff5f5;color:#3a2a2a;text-decoration:none;font-size:12.5px;}
.ws-video:hover{background:#ffeaea;border-color:#e99;}
.ws-video:focus-visible{outline:3px solid #1d6a96;outline-offset:2px;}
.ws-video-play{flex:0 0 auto;width:26px;height:26px;border-radius:7px;background:#e62117;color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;}
.ws-video b{color:#b3261e;}
.ws-video-src{margin-left:auto;color:#6b6b6b;font-size:11px;white-space:nowrap;}
.ws-tips{border:1.5px solid #b8ddc8;border-radius:6px;margin-bottom:14px;overflow:hidden;background:#f2f9f5;}
.ws-tips-header{display:flex;align-items:center;justify-content:space-between;padding:7px 14px;min-height:44px;cursor:pointer;user-select:none;background:#e7f7ed;width:100%;border:none;font:inherit;text-align:left;}
.ws-tips-header-left{display:flex;align-items:center;gap:8px;}
.ws-tips-title{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:#555;}
.ws-tips-chevron{font-size:11px;color:#666;}
.ws-tips-body{padding:10px 14px;display:none;border-top:1px solid #e8e8e6;}
.ws-tips-body.open{display:block;}
.ws-tips-body ul{padding-left:18px;display:flex;flex-direction:column;gap:5px;}
.ws-tips-body li{font-size:12.5px;line-height:1.55;color:#333;}
.ws-tips-body li b{color:var(--navy);}

/* ── WORKSHEET TOOLBAR (difficulty) ── */
.ws-toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:4px 0 14px;border-bottom:1px solid #e8e8e8;margin-bottom:18px;}
.ws-toolbar-label{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#6b6b6b;}
.ws-toolbar-group{display:flex;gap:4px;align-items:center;}
.ws-chip{padding:5px 12px;min-height:44px;border-radius:16px;border:1px solid #ddd;font-size:11px;font-family:var(--ui);font-weight:600;cursor:pointer;background:#fff;color:#666;}
.ws-chip:hover{border-color:#888;color:#111;}
.ws-chip.diff-scaffolded.active{background:#2d6a4f;border-color:#2d6a4f;color:#fff;}
.ws-chip.diff-streamlined.active{background:#7b2d00;border-color:#7b2d00;color:#fff;}
body.streamlined-mode .steps,body.streamlined-mode .think-label,body.streamlined-mode .prob-score-badge{display:none!important;}

/* ── STUDENT MODE: check bar + progress (copied) ── */
.prob-check-bar{margin-top:14px;padding-top:10px;border-top:1px dashed #e0e0e0;display:none;align-items:center;gap:10px;flex-wrap:wrap;}
body.student-mode .prob-check-bar{display:flex;}
.check-btn{padding:6px 14px;min-height:44px;border:none;border-radius:6px;background:var(--ok);color:#fff;cursor:pointer;font-family:var(--ui);font-size:12px;font-weight:700;letter-spacing:.03em;}
.check-btn:hover{background:#1b5e20;}
.check-btn.show-answer{background:var(--key);}
.check-btn.show-answer:hover{background:#8c3210;}
.check-result{display:none;align-items:center;gap:4px;font-size:12.5px;font-weight:700;padding:5px 10px;border-radius:6px;line-height:1.4;}
.check-result.show{display:inline-flex;flex-wrap:wrap;}
.check-result.correct{color:var(--ok);background:var(--okbg);}
.check-result.incorrect{color:var(--no);background:var(--nobg);}
.check-result.pending{color:#7a5c00;background:#fff6d6;}
.check-result.seen{color:#555;background:#f0f0f0;}

#progress-panel{position:fixed;bottom:24px;right:24px;width:290px;background:rgba(26,26,26,0.9);color:#eee;border-radius:12px;border:1px solid rgba(255,255,255,0.08);box-shadow:0 12px 40px rgba(0,0,0,0.5);z-index:900;display:none;flex-direction:column;overflow:hidden;transition:transform .3s cubic-bezier(0.4,0,0.2,1);}
body.student-mode #progress-panel{display:flex;}
#progress-panel.minimized{transform:translateY(calc(100% - 41px));}
#progress-panel-header{background:rgba(17,17,17,0.7);padding:11px 16px;min-height:44px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;border:none;width:100%;color:#fff;font:inherit;}
#progress-panel-header h3{font-size:11px;font-weight:700;letter-spacing:.06em;}
#progress-panel-body{padding:12px 16px;display:flex;flex-direction:column;gap:9px;}
.pp-stat{display:flex;justify-content:space-between;align-items:center;font-size:12px;gap:10px;}
.pp-stat-label{color:#a8a8a8;text-transform:uppercase;font-size:9px;letter-spacing:.07em;font-weight:700;}
.pp-stat-value{color:#fff;font-weight:700;text-align:right;}
.pp-bar{height:6px;background:rgba(255,255,255,0.1);border-radius:3px;overflow:hidden;}
.pp-bar-fill{height:100%;background:linear-gradient(90deg,#2e7d32,#4caf50);transition:width .3s;width:0%;}
.pp-actions{display:flex;gap:6px;margin-top:2px;}
.pp-btn{flex:1;padding:8px;min-height:44px;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.06);color:#eee;border-radius:6px;cursor:pointer;font-family:var(--ui);font-size:11px;font-weight:600;}
.pp-btn:hover{background:rgba(255,255,255,0.12);}
.pp-btn.danger{color:#ff8a80;border-color:rgba(211,47,47,0.3);background:rgba(211,47,47,0.08);}
.pp-btn.armed{background:#c62828;color:#fff;}
.pp-msg{font-size:11px;color:#cfcfcf;min-height:14px;line-height:1.4;}
@keyframes confettiFall{0%{transform:translateY(-10px) rotate(0deg);opacity:1;}100%{transform:translateY(100vh) rotate(360deg);opacity:0;}}
.confetti-piece{position:fixed;width:8px;height:8px;top:-10px;z-index:9999;pointer-events:none;animation:confettiFall 3s linear forwards;}

/* ── INTERACTIVE CHOICE ENGINE (copied) ── */
@keyframes iShake{0%,100%{transform:translateX(0);}20%{transform:translateX(-7px);}40%{transform:translateX(7px);}60%{transform:translateX(-4px);}80%{transform:translateX(4px);}}
.i-shake{animation:iShake .38s ease;}
.think-label{font-size:10px;font-weight:700;color:#2d6a4f;text-transform:uppercase;letter-spacing:.07em;margin:2px 0 6px;}
.steps{display:flex;flex-direction:column;gap:10px;margin-bottom:12px;}
.step-q{font-size:13px;color:#444;margin-bottom:5px;line-height:1.6;}
.interactive-step{background:#f9f8f6;border:1px solid #e0e0e0;border-radius:6px;padding:11px 15px;}
.interactive-step.locked{display:none;}
.interactive-step.i-done{background:#f0f8f4;border-color:#b8e0c8;}
.interactive-step.i-done .step-q{color:#2d6a4f;}
.step-choices{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px;}
.choice-btn{padding:6px 14px;min-height:44px;border:1.5px solid #bbb;border-radius:5px;background:#fff;font-family:var(--ui);font-size:13px;cursor:pointer;line-height:1.4;text-align:left;color:#111;max-width:100%;}
.choice-btn:hover:not(.i-disabled){border-color:var(--navy);background:#f0f4f8;}
.choice-btn.i-correct{border-color:#2d6a4f!important;background:#e7f7ed!important;color:#2d6a4f;font-weight:700;}
.choice-btn.i-wrong{border-color:#c0392b!important;background:#fbeae8!important;color:#c0392b;}
.choice-btn.i-disabled{cursor:not-allowed;opacity:.65;}
.choice-btn.i-correct.i-disabled{opacity:1;cursor:default;}
body.answer-key-mode .interactive-step.locked{display:block;}
body.answer-key-mode .choice-btn{pointer-events:none;}
body.answer-key-mode .choice-btn[data-correct="true"]{border-color:#2d6a4f!important;background:#e7f7ed!important;color:#2d6a4f;font-weight:700;}
.prob-score-badge{margin:0 0 12px;padding:7px 14px;border-radius:5px;background:#e7f7ed;border:1.5px solid #2d6a4f;color:#2d6a4f;font-size:12px;font-weight:700;display:none;}
.prob-score-badge.i-show{display:inline-block;}
.prob-score-badge.i-perfect{background:#fff3e0;border-color:#e67e22;color:#d35400;}

/* ── PHONE ── */
@media (max-width:640px){
  #global-header{padding:10px 12px;gap:8px 10px;}
  .gmeta{flex:1 1 140px;} .gmeta input{width:100%;}
  .gbtns{margin-left:0;width:100%;}
  .gprint{flex:1 1 auto;padding:6px 8px;}
  #subject-bar,#subject-subbar,#topic-bar{padding:0 6px;}
  .subj-btn{padding:9px 12px;}
  .editor-strip{padding:8px 12px;}
  .worksheet{margin:10px 8px;padding:20px 14px;}
  .ws-head{flex-direction:column;align-items:flex-start;}
  .ws-meta{text-align:left;line-height:1.5;}
  .ws-video{flex-wrap:wrap;}
  .ws-video-src{margin-left:36px;}
  .lbl-wrap{grid-template-columns:1fr;}
  #progress-panel{right:8px;bottom:8px;width:calc(100vw - 16px);max-width:290px;}
}

/* ── PRINT (copied, trimmed) ── */
@media print{
  @page{size:letter portrait;margin:.6in .6in;}
  body{background:#fff;}
  #global-header,#subject-bar,#subject-subbar,#topic-bar,.editor-strip,.ws-toolbar,#progress-panel,.prob-check-bar,.ws-video{display:none!important;}
  .module{display:none!important;} .module.active{display:block!important;}
  .worksheet{margin:0;border:none;padding:0;max-width:100%;}
  .live{display:none!important;} .paper{display:block!important;}
  body.student-mode .blank{border-bottom:1.5px solid #111;background:transparent;width:auto;height:20px;}
  .blank input{display:none!important;}
  .ws-tips,.ws-tips-body{display:block!important;}
  .ws-tips-chevron{display:none;}
  .problem{margin-bottom:14px!important;padding-bottom:14px!important;page-break-inside:avoid;}
  .interactive-step{padding:5px 10px!important;}
  body:not(.answer-key-mode) .solution-box{display:none!important;}
  body.answer-key-mode .solution-box{display:block!important;border:2px solid var(--key)!important;}
  body.answer-key-mode .blank{display:none!important;}
  .mc-opt{padding:3px 8px;border-color:#eee;}
}
</style>
</head>
<body>

<!-- GLOBAL HEADER -->
<div id="global-header" role="banner">
  <h1 id="app-title">&#128221; Guided Subject Worksheets</h1>
  <div class="gmeta"><label for="gClass">Class / Period</label><input type="text" id="gClass" value="Period ___" oninput="updateAllMeta()"></div>
  <div class="gmeta"><label for="gName">Name line</label><input type="text" id="gName" value="Name: ________________________" oninput="updateAllMeta()"></div>
  <div class="gmeta"><label for="gDate">Date</label><input type="text" id="gDate" value="Date: ___________" oninput="updateAllMeta()"></div>
  <div class="gbtns">
    <button class="gprint" id="student-toggle-btn" onclick="toggleStudentMode()" title="Turn the worksheet into an interactive one that checks answers">&#127891; Student Mode: OFF</button>
    <button class="gprint" id="ak-toggle-btn" onclick="toggleAnswerKey()" title="Show the answers">&#128273; Answer Key: OFF</button>
    <button class="gprint" onclick="printWorksheet()">&#128438; Print / Save PDF</button>
  </div>
</div>

<!-- STUDENT PROGRESS PANEL -->
<div id="progress-panel" role="complementary" aria-label="Your progress">
  <button id="progress-panel-header" onclick="toggleProgressPanel()" aria-label="Show or hide your progress">
    <h3>&#128202; Your Progress</h3><span class="pp-chevron" id="pp-chevron">&#9660;</span>
  </button>
  <div id="progress-panel-body">
    <div class="pp-stat"><span class="pp-stat-label">Score</span><span class="pp-stat-value" id="pp-score">0 / 0</span></div>
    <div class="pp-bar"><div class="pp-bar-fill" id="pp-bar-fill"></div></div>
    <div class="pp-stat"><span class="pp-stat-label">Correct</span><span class="pp-stat-value" id="pp-correct" style="color:#7fd39a;">0</span></div>
    <div class="pp-stat"><span class="pp-stat-label">Incorrect</span><span class="pp-stat-value" id="pp-incorrect" style="color:#f0a090;">0</span></div>
    <div class="pp-stat"><span class="pp-stat-label">Accuracy</span><span class="pp-stat-value" id="pp-accuracy">&mdash;</span></div>
    <div class="pp-stat"><span class="pp-stat-label">Time</span><span class="pp-stat-value" id="pp-time">0:00</span></div>
    <div class="pp-stat"><span class="pp-stat-label">Worksheet</span><span class="pp-stat-value" id="pp-module" style="font-size:11px;">&mdash;</span></div>
    <div class="pp-actions">
      <button class="pp-btn" onclick="checkAllProblems()">&#10003; Check All</button>
      <button class="pp-btn danger" id="pp-reset" onclick="resetStudentProgress()">&#8635; Reset</button>
    </div>
    <div class="pp-msg" id="pp-msg" role="status" aria-live="polite"></div>
  </div>
</div>

{id:'sci_rocks', subj:'science', group:'earth', band:'g68', label:'Rock Cycle & Earth\u2019s Layers',

{id:'sci_ptable', subj:'science', group:'chem', band:'g912', label:'Periodic Table Basics',

  {t:'fill', q:'The chemical symbol <b>Fe</b> stands for the element ___.', a:['iron']},

{id:'sci_newton', subj:'science', group:'phys', band:'g912', label:'Newton\u2019s Laws of Motion',
 tips:['<b>First law (inertia):</b> an object at rest stays at rest, and a moving object keeps moving at the same velocity, unless a net force acts on it.',
       '<b>Second law:</b> net force = mass &times; acceleration (<b>F = ma</b>). More mass means less acceleration for the same force.',
       '<b>Third law:</b> for every action force there is an equal and opposite reaction force. The two forces act on different objects.',
       'Force is measured in <b>newtons (N)</b>. 1 N = 1 kg&middot;m/s&sup2;.'],
 problems:[
  {t:'match', q:'Match each law or idea to its statement.', pairs:[['First law','An object stays at rest or keeps moving at constant velocity unless a net force acts on it.'],['Second law','The acceleration of an object equals the net force divided by its mass.'],['Third law','When one object pushes on another, the second pushes back equally hard in the opposite direction.'],['Inertia','The tendency of an object to resist changes in its motion.']]},
  {t:'fill', q:'A 2 kg cart is pushed with a net force of 10 N. Its acceleration is ___ m/s\u00b2.', a:['5','5 m/s2','5 m/s^2','5 m/s\u00b2','five'],

  {t:'mc', q:'Passengers lurch forward when a bus stops suddenly. Which law explains this?', opts:['Newton\u2019s first law','Newton\u2019s second law','Newton\u2019s third law'], ans:0},
  {t:'mc', q:'A rocket pushes hot gas down, and the gas pushes the rocket up. Which law explains this?', opts:['Newton\u2019s first law','Newton\u2019s second law','Newton\u2019s third law'], ans:2},
  {t:'fill', q:'The SI unit of force is the ___.', a:['newton','newtons','n']},
  {t:'mc', q:'The same force pushes a bowling ball and a soccer ball. Which accelerates more, and why?', opts:['The bowling ball, because it has more mass','The soccer ball, because it has less mass','Both the same, because the force is the same'], ans:1},
  {t:'fill', q:'What net force is needed to accelerate a 1,000 kg car at 3 m/s\u00b2? ___ N', a:['3000','3,000','3000 n','3,000 n','3000 newtons','3,000 newtons']},
  {t:'short', q:'A book rests on a table. Name two forces acting on the book and explain why it does not move.', model:'Gravity (the book\u2019s weight) pulls it down, and the table pushes it up with an equal normal force. The forces are balanced, so the net force is zero and, by the first law, the book stays at rest.'}

{id:'es_plates', subj:'science', group:'earth', band:'g68', label:'Plate Tectonics',
 tips:['Earth&rsquo;s outer shell is broken into <b>tectonic plates</b> that move a few centimeters a year.',
       '<b>Divergent</b> boundaries: plates move apart and new crust forms (mid-ocean ridges).',
       '<b>Convergent</b> boundaries: plates push together, building mountains, trenches and volcanoes. When one plate sinks under another, it is called <b>subduction</b>.',
       '<b>Transform</b> boundaries: plates slide past each other, causing earthquakes (the San Andreas Fault).',
       'In 1912 Alfred <b>Wegener</b> proposed continental drift: the continents were once joined in a supercontinent called <b>Pangaea</b>.'],

  {t:'mc', q:'Where in an atom are the protons and neutrons?', opts:['in the nucleus','spread around the outside','inside the electrons'], ans:0},
  {t:'fill', q:'A substance made of only one kind of atom is an ___.', a:['element']},
  {t:'mc', q:'How many atoms are in one molecule of CO<sub>2</sub>?', opts:['1','2','3','4'], ans:2,

  {t:'short', q:'Explain the difference between an atom and a molecule. Give an example of each.', model:'An atom is the smallest unit of an element, such as one oxygen atom. A molecule is two or more atoms bonded together, such as a water molecule (H<sub>2</sub>O) made of two hydrogen atoms and one oxygen atom.'}
 ]},
{id:'ch_changes', subj:'science', group:'chem', band:'g68', label:'Physical & Chemical Changes',
 tips:['A <b>physical change</b> changes size, shape or state, but no new substance forms: melting ice, tearing paper, dissolving sugar.',
       'A <b>chemical change</b> makes a new substance: burning, rusting, baking, digesting food.',
       '<b>Signs of a chemical change:</b> gas bubbles, a new color, light or heat given off, a new smell, or a solid forming in a liquid.',
       '<b>Conservation of mass:</b> in a chemical reaction, atoms are rearranged, not created or destroyed, so the total mass stays the same.'],
 problems:[
  {t:'match', q:'Match each change to the reason it is physical or chemical.', pairs:[['ice melting','physical: it is still water, just in a different state'],['paper burning','chemical: ash, smoke and gases are new substances'],['iron rusting','chemical: iron combines with oxygen to form rust'],['sugar dissolving in tea','physical: the sugar is still there, just spread out']]},
  {t:'mc', q:'Which of these is a <b>chemical</b> change?', opts:['chopping wood','freezing water','baking a cake','tearing paper'], ans:2},
  {t:'mc', q:'Which of these is a <b>physical</b> change?', opts:['burning a match','boiling water','frying an egg','milk turning sour'], ans:1},
  {t:'fill', q:'When iron reacts with oxygen and water, it forms ___.', a:['rust','iron oxide']},
  {t:'mc', q:'Vinegar and baking soda are mixed, and bubbles form. What kind of change is this?', opts:['physical','chemical'], ans:1,
   steps:[{q:'The bubbles are a gas that was not there before. Is a new substance forming?', c:['yes','no'], a:0}]},
  {t:'fill', q:'In a chemical reaction, matter is not created or destroyed. This is the law of conservation of ___.', a:['mass','matter']},
  {t:'mc', q:'Which is <b>not</b> a sign of a chemical change?', opts:['a change of shape','a new color','gas bubbles','light and heat given off'], ans:0},
  {t:'short', q:'Is melting chocolate a physical or a chemical change? Explain.', model:'It is a physical change. The chocolate changes from a solid to a liquid, but it is still chocolate, and it can harden again when it cools.'}
 ]},
{id:'ch_bonding', subj:'science', group:'chem', band:'g912', label:'Chemical Bonding',
 tips:['In an <b>ionic bond</b>, a metal transfers electrons to a nonmetal. The resulting ions attract each other (NaCl).',
       'In a <b>covalent bond</b>, nonmetal atoms share electrons (H<sub>2</sub>O, CH<sub>4</sub>). Unequal sharing makes a <b>polar</b> covalent bond.',
       'In <b>metallic bonding</b>, metal atoms share a &ldquo;sea&rdquo; of electrons, which is why metals conduct electricity.',
       'The <b>octet rule</b>: atoms tend to gain, lose or share electrons until they have 8 valence electrons.',
       'Ionic compounds have high melting points and conduct electricity when melted or dissolved in water.'],
 problems:[
  {t:'match', q:'Match each type of bond to its description.', pairs:[['ionic','electrons are transferred from a metal to a nonmetal'],['covalent','electrons are shared between nonmetal atoms'],['metallic','a &ldquo;sea&rdquo; of electrons is shared among metal atoms']]},
  {t:'mc', q:'Sodium chloride (NaCl, table salt) is held together by...', opts:['ionic bonds','covalent bonds','metallic bonds'], ans:0},
  {t:'mc', q:'Which compound has <b>covalent</b> bonds?', opts:['water (H<sub>2</sub>O)','sodium chloride (NaCl)','magnesium oxide (MgO)','potassium bromide (KBr)'], ans:0},
  {t:'fill', q:'Atoms tend to gain, lose or share electrons until they have 8 valence electrons. This is the ___ rule.', a:['octet']},
  {t:'mc', q:'In NaCl, sodium becomes a positive ion because it...', opts:['loses one electron','gains one electron','shares two electrons'], ans:0,
   steps:[{q:'How many valence electrons does a sodium atom have?', c:['1','7'], a:0}]},
  {t:'fill', q:'In water, oxygen pulls on the shared electrons more strongly than hydrogen, so the bonds are polar ___ bonds.', a:['covalent']},
  {t:'mc', q:'Which property is typical of ionic compounds?', opts:['high melting points, and they conduct electricity when dissolved in water','very low melting points','they are always gases at room temperature'], ans:0},
  {t:'short', q:'Why do sodium and chlorine form an ionic bond, while two chlorine atoms form a covalent bond?', model:'Sodium easily gives up its one valence electron and chlorine strongly attracts one more, so the electron is transferred and the ions attract. Two chlorine atoms attract electrons equally, so neither can take one; they share a pair of electrons instead.'}
 ]},
{id:'ch_reactions', subj:'science', group:'chem', band:'g912', label:'Balancing Chemical Equations',
 tips:['In a chemical equation, <b>reactants</b> (left) turn into <b>products</b> (right).',
       'Atoms are not created or destroyed, so each element must have the same number of atoms on both sides.',
       'Balance with <b>coefficients</b> (big numbers in front). Never change the <b>subscripts</b>, because that changes the substance.',
       '<b>Reaction types:</b> synthesis (A + B &rarr; AB), decomposition (AB &rarr; A + B), single replacement, double replacement, combustion (fuel + O<sub>2</sub> &rarr; CO<sub>2</sub> + H<sub>2</sub>O).'],
 problems:[
  {t:'fill', q:'Balance the equation: ___ H<sub>2</sub> + O<sub>2</sub> &rarr; ___ H<sub>2</sub>O', blanks:[['2'],['2']],
   steps:[{q:'How many oxygen atoms are on the left side?', c:['1','2'], a:1},{q:'So how many H<sub>2</sub>O molecules are needed on the right?', c:['1','2'], a:1}]},
  {t:'mc', q:'In 2H<sub>2</sub> + O<sub>2</sub> &rarr; 2H<sub>2</sub>O, the substances on the left are called the...', opts:['reactants','products','catalysts'], ans:0},
  {t:'mc', q:'When balancing an equation, you may change...', opts:['only the coefficients','only the subscripts','both coefficients and subscripts'], ans:0},
  {t:'match', q:'Match each reaction type to its general form.', pairs:[['synthesis','A + B &rarr; AB'],['decomposition','AB &rarr; A + B'],['single replacement','A + BC &rarr; AC + B'],['double replacement','AB + CD &rarr; AD + CB']]},
  {t:'fill', q:'Balance the equation: N<sub>2</sub> + ___ H<sub>2</sub> &rarr; 2NH<sub>3</sub>', a:['3']},
  {t:'mc', q:'What type of reaction is CH<sub>4</sub> + 2O<sub>2</sub> &rarr; CO<sub>2</sub> + 2H<sub>2</sub>O?', opts:['combustion','decomposition','single replacement'], ans:0},
  {t:'fill', q:'Balance the equation: ___ Na + Cl<sub>2</sub> &rarr; 2NaCl', a:['2']},
  {t:'short', q:'Why must chemical equations be balanced?', model:'Because of the law of conservation of mass: atoms are only rearranged in a reaction, never created or destroyed, so every element must have the same number of atoms on both sides.'}
 ]},
{id:'bio_food', subj:'science', group:'bio', band:'g35', label:'Food Chains & Ecosystems',
 tips:['<b>Producers</b> (plants) make their own food using sunlight.',
       '<b>Consumers</b> eat other living things: <b>herbivores</b> eat plants, <b>carnivores</b> eat animals, <b>omnivores</b> eat both.',
       '<b>Decomposers</b> (fungi, bacteria, worms) break down dead plants and animals and return nutrients to the soil.',
       'In a food chain, each arrow points from the food to the eater and shows the flow of <b>energy</b>. Almost all of it starts with the <b>Sun</b>.',
       'Many connected food chains make a <b>food web</b>.'],
 problems:[
  {t:'label', q:'Label the role of each living thing.', diagram:'foodchain', parts:['producer','herbivore','carnivore','decomposer'], bank:['omnivore']},
  {t:'order', q:'Put this food chain in order, starting where the energy comes from.', items:['Sun','grass','grasshopper','frog','snake']},
  {t:'match', q:'Match each living thing to its role.', pairs:[['oak tree','producer'],['deer','herbivore'],['wolf','carnivore'],['bear','omnivore']]},
  {t:'fill', q:'In a food chain, the arrows show the flow of ___.', a:['energy']},
  {t:'mc', q:'Where does almost all the energy in a food chain start?', opts:['the soil','the Sun','water'], ans:1},
  {t:'mc', q:'In a meadow, foxes eat rabbits. What would most likely happen to the number of rabbits if all the foxes disappeared?', opts:['It would go up.','It would go down.','It would stay exactly the same.'], ans:0,
   steps:[{q:'Without foxes, fewer rabbits are...', c:['eaten','born'], a:0}]},
  {t:'fill', q:'Living things such as fungi and bacteria that break down dead plants and animals are called ___.', a:['decomposers','decomposer']},
  {t:'short', q:'Write a food chain with four living things from a habitat you know. Label the producer and the consumers.', model:'Pond: algae (producer) &rarr; tadpole (herbivore) &rarr; fish (carnivore) &rarr; heron (carnivore).'}
 ]},
{id:'bio_body', subj:'science', group:'bio', band:'g68', label:'Human Body Systems',
 tips:['<b>Circulatory</b> (heart, blood vessels): carries oxygen and nutrients to every cell.',
       '<b>Respiratory</b> (lungs): takes in oxygen and gets rid of carbon dioxide; gas exchange happens in tiny air sacs called <b>alveoli</b>.',
       '<b>Digestive</b> (stomach, intestines): breaks down food; most nutrients are absorbed in the <b>small intestine</b>.',
       '<b>Nervous</b> (brain, spinal cord, nerves): sends signals and controls the body. <b>Skeletal</b>: an adult has <b>206 bones</b>.',
       '<b>Excretory</b>: the kidneys filter waste from the blood. Body systems work together.'],
 problems:[
  {t:'match', q:'Match each body system to one of its main organs.', pairs:[['circulatory system','heart'],['respiratory system','lungs'],['digestive system','stomach'],['nervous system','brain']]},
  {t:'fill', q:'An adult human skeleton has ___ bones.', a:['206']},
  {t:'mc', q:'Where are most nutrients from food absorbed into the blood?', opts:['the stomach','the small intestine','the large intestine'], ans:1},
  {t:'mc', q:'Which system carries oxygen to every cell in the body?', opts:['circulatory','skeletal','digestive'], ans:0},
  {t:'order', q:'Put the path that food takes through the body in order.', items:['Mouth','Esophagus','Stomach','Small intestine','Large intestine']},
  {t:'mc', q:'Why do you breathe faster and your heart beats faster when you exercise?', opts:['Working muscles need more oxygen, so the lungs and heart work harder.','Your bones are growing.','Your stomach is digesting faster.'], ans:0,
   steps:[{q:'Working muscles need more...', c:['oxygen','sleep'], a:0}]},
  {t:'fill', q:'The ___ filter waste from the blood to make urine.', a:['kidneys','kidney']},
  {t:'mc', q:'Gas exchange in the lungs happens in tiny air sacs called...', opts:['alveoli','villi','neurons'], ans:0},
  {t:'short', q:'Explain how two body systems work together when you run.', model:'The respiratory system takes in oxygen in the lungs, and the circulatory system pumps oxygen-rich blood from the heart to the leg muscles, which the muscular system uses to move.'}
 ]},
{id:'bio_genetics', subj:'science', group:'bio', band:'g912', label:'DNA & Genetics',
 tips:['<b>DNA</b> is a double helix. Its bases pair <b>A with T</b> and <b>C with G</b>.',
       'A <b>gene</b> is a section of DNA that carries the instructions for a protein. Human body cells have <b>46 chromosomes</b> (23 pairs).',
       'Different versions of a gene are <b>alleles</b>. A <b>dominant</b> allele (B) hides a <b>recessive</b> one (b).',
       '<b>Genotype</b> is the alleles (Bb); <b>phenotype</b> is the trait you can see (brown eyes).',
       'Gregor <b>Mendel</b> discovered the basic rules of heredity with pea plants in the 1860s. A <b>Punnett square</b> predicts offspring.'],
 problems:[
  {t:'match', q:'Match each DNA base to the base it pairs with.', pairs:[['A (adenine)','T (thymine)'],['T (thymine)','A (adenine)'],['C (cytosine)','G (guanine)'],['G (guanine)','C (cytosine)']]},
  {t:'fill', q:'Human body cells have ___ chromosomes, in 23 pairs.', a:['46']},
  {t:'mc', q:'The trait you can see, such as eye color, is called the...', opts:['genotype','phenotype','allele'], ans:1},
  {t:'fill', q:'Crossing Bb &times; Bb gives 25% BB, ___% Bb and 25% bb.', a:['50'],
   steps:[{q:'In a Bb &times; Bb Punnett square, how many of the 4 boxes hold Bb?', c:['1','2','4'], a:1},{q:'2 boxes out of 4 is...', c:['50%','25%'], a:0}]},
  {t:'mc', q:'B (brown eyes) is dominant over b (blue eyes). What eye color does a person with genotype Bb have?', opts:['brown','blue','a mix of both'], ans:0},
  {t:'mc', q:'Who studied pea plants in the 1860s and discovered the basic rules of heredity?', opts:['Gregor Mendel','Charles Darwin','Louis Pasteur'], ans:0},
  {t:'fill', q:'A section of DNA that carries the instructions for one protein is a ___.', a:['gene']},
  {t:'order', q:'Put these in order from <b>smallest</b> to <b>largest</b>.', items:['base pair','gene','chromosome','genome']},
  {t:'short', q:'Explain the difference between a dominant and a recessive allele, using an example.', model:'A dominant allele shows its trait even when only one copy is present; a recessive allele shows only when there are two copies. If B (brown) is dominant over b (blue), BB and Bb have brown eyes, and only bb has blue eyes.'}
 ]},
{id:'bio_evolution', subj:'science', group:'bio', band:'g912', label:'Evolution & Natural Selection',
 tips:['Charles <b>Darwin</b> published <i>On the Origin of Species</i> in 1859, after studying living things such as the finches of the <b>Gal\u00e1pagos</b> Islands.',
       '<b>Natural selection:</b> individuals vary, the variations are inherited, more offspring are born than can survive, and those with helpful traits survive and reproduce more.',
       'A helpful inherited trait is an <b>adaptation</b>. <b>Fitness</b> means how well an organism survives and reproduces.',
       '<b>Evidence for evolution:</b> fossils, homologous structures, DNA comparisons, and changes we can watch, such as antibiotic-resistant bacteria.'],
 problems:[
  {t:'order', q:'Put the steps of natural selection in order.', items:['Individuals in a population vary in their traits.','Some of these variations are inherited.','More offspring are born than can survive.','Individuals with helpful traits survive and reproduce more.','Over many generations, the helpful trait becomes more common.']},
  {t:'mc', q:'Who published <i>On the Origin of Species</i> in 1859?', opts:['Gregor Mendel','Charles Darwin','Alfred Wegener'], ans:1},
  {t:'match', q:'Match each term to its description.', pairs:[['fossils','remains of past living things that show change over time'],['homologous structures','similar bones in different species, like a human arm and a bat wing'],['DNA comparisons','closely related species share more of their genetic code'],['artificial selection','people breeding plants and animals for chosen traits']]},
  {t:'fill', q:'An inherited trait that helps an organism survive and reproduce in its environment is an ___.', a:['adaptation']},
  {t:'mc', q:'Over time, bacteria become resistant to an antibiotic. Why?', opts:['A few bacteria that were already resistant survived and reproduced.','The bacteria decided to change.','The antibiotic taught the bacteria to resist it.'], ans:0,
   steps:[{q:'Before the antibiotic was used, were all the bacteria exactly the same?', c:['no, they varied','yes, they were identical'], a:0}]},
  {t:'mc', q:'In evolution, <b>fitness</b> means...', opts:['how well an organism survives and reproduces','how much an organism exercises','how big an organism is'], ans:0},
  {t:'fill', q:'Darwin studied finches with differently shaped beaks on the ___ Islands.', a:['Gal\u00e1pagos','Galapagos']},
  {t:'short', q:'Explain how a population of light-colored moths could become mostly dark-colored over many generations.', model:'If tree bark turned dark (for example from soot), dark moths would be harder for birds to see. They would survive and reproduce more, passing on the dark color, so over many generations most moths would be dark.'}
 ]}
]);

{id:'phy_magnets', subj:'science', group:'phys', band:'g35', label:'Magnets',
 tips:['Magnets attract things that contain <b>iron</b> (and a few other metals, like nickel). Steel contains iron.',
       'Every magnet has a <b>north pole</b> and a <b>south pole</b>.',
       '<b>Opposite poles attract</b> (pull together). <b>Like poles repel</b> (push apart).',
       'The space around a magnet where its force acts is its <b>magnetic field</b>. The force can act through paper, plastic and water.',
       'Earth acts like a giant magnet, so a <b>compass</b> needle points north.'],
 problems:[

  {t:'match', q:'Match each word to its meaning.', pairs:[['attract','pull together'],['repel','push apart'],['poles','the two ends of a magnet, where its force is strongest'],['magnetic field','the space around a magnet where its force acts']]},
  {t:'fill', q:'Like poles ___ each other.', a:['repel']},
  {t:'mc', q:'Why does a compass needle point north?', opts:['Earth acts like a giant magnet.','The wind blows it north.','The Sun pulls on it.'], ans:0},
  {t:'mc', q:'Two magnets are held with their <b>north poles</b> facing each other. What happens?', opts:['They pull together.','They push apart.','Nothing happens.'], ans:1,

  {t:'fill', q:'Magnets attract objects that contain the metal ___.', a:['iron']},
  {t:'mc', q:'Can a magnet pull a paper clip through a sheet of paper?', opts:['Yes, magnetic force can act through paper.','No, magnets only work when they touch.'], ans:0},
  {t:'short', q:'Describe a test to find out which objects in your classroom are magnetic.', model:'Touch a magnet to each object, one at a time. Sort them into two groups: things the magnet pulls on (like steel paper clips) and things it does not (like plastic, wood and paper).'}
 ]},
{id:'phy_circuits', subj:'science', group:'phys', band:'g35', label:'Electricity & Circuits',
 tips:['A <b>circuit</b> is a complete loop that electricity flows around: an energy source (battery), wires, and something that uses the energy (a bulb).',
       'A <b>switch</b> opens or closes the loop. In an <b>open circuit</b> there is a gap, so no electricity flows.',
       '<b>Conductors</b> (most metals, like copper) let electricity flow. <b>Insulators</b> (plastic, rubber, wood) block it.',
       'In a <b>series</b> circuit there is one path; if one bulb goes out, they all go out. A <b>parallel</b> circuit has more than one path.',
       'A battery stores <b>chemical energy</b> and turns it into electrical energy.'],
 problems:[
  {t:'label', q:'Label the parts of the circuit.', diagram:'circuit', parts:['battery','bulb','switch','wire'], bank:['magnet']},
  {t:'mc', q:'Which is a good <b>conductor</b> of electricity?', opts:['a rubber band','a copper wire','a wooden stick','a plastic straw'], ans:1},
  {t:'match', q:'Match each word to its meaning.', pairs:[['closed circuit','a complete loop, so electricity can flow'],['open circuit','a loop with a gap, so electricity cannot flow'],['conductor','a material that lets electricity flow easily'],['insulator','a material that blocks electricity']]},
  {t:'fill', q:'The plastic coating on a wire is an ___ that keeps the electricity inside the wire.', a:['insulator']},
  {t:'mc', q:'A bulb will not light because the switch is open. Why?', opts:['The loop has a gap, so electricity cannot flow.','The battery is too big.','The bulb is too bright.'], ans:0,
   steps:[{q:'When the switch is open, is the loop complete?', c:['yes','no'], a:1}]},
  {t:'mc', q:'Two bulbs are in a <b>series</b> circuit. One burns out. What happens to the other bulb?', opts:['It goes out too.','It gets brighter.','It stays the same.'], ans:0},
  {t:'fill', q:'A battery stores ___ energy.', a:['chemical']},
  {t:'short', q:'Why do electricians wear rubber gloves?', model:'Rubber is an insulator. It blocks electricity, so it helps keep electric current from flowing through the electrician&rsquo;s body.'}
 ]},
{id:'phy_energy', subj:'science', group:'phys', band:'g68', label:'Forms of Energy',
 tips:['<b>Kinetic energy</b> is the energy of motion. It depends on an object&rsquo;s mass and speed.',
       '<b>Potential energy</b> is stored energy: gravitational (height), elastic (a stretched spring) or chemical (food, batteries).',
       'Other forms: thermal, light, sound, electrical and nuclear energy.',
       '<b>Conservation of energy:</b> energy is never created or destroyed, only changed from one form to another.',
       'Energy is measured in <b>joules (J)</b>.'],
 problems:[
  {t:'match', q:'Match each device to the energy change it makes.', pairs:[['flashlight','chemical &rarr; electrical &rarr; light'],['toaster','electrical &rarr; thermal'],['solar panel','light &rarr; electrical'],['wind turbine','kinetic &rarr; electrical']]},
  {t:'mc', q:'Where does a roller coaster car have the most gravitational potential energy?', opts:['at the top of the highest hill','at the bottom of a hill','halfway down a hill'], ans:0},
  {t:'mc', q:'A rock resting at the edge of a cliff has...', opts:['gravitational potential energy','kinetic energy','sound energy'], ans:0},
  {t:'fill', q:'Energy cannot be created or destroyed, only changed from one form to another. This is the law of conservation of ___.', a:['energy']},
  {t:'fill', q:'The SI unit of energy is the ___.', a:['joule','joules','J']},
  {t:'mc', q:'A truck and a bicycle both move at 50 km/h. Which has more kinetic energy?', opts:['the truck','the bicycle','they are the same'], ans:0,
   steps:[{q:'Kinetic energy depends on mass and speed. The speeds are equal. Which has more mass?', c:['the truck','the bicycle'], a:0}]},
  {t:'order', q:'Put the energy changes on a roller coaster ride in order.', items:['The car is pulled to the top of the first hill.','The car starts down: potential energy becomes kinetic energy.','At the bottom, the car has its most kinetic energy.','Climbing the next hill, kinetic energy becomes potential energy.']},
  {t:'short', q:'Describe the energy changes when you eat breakfast and then ride a bike.', model:'Food stores chemical energy. My body changes it into the kinetic energy of my moving legs and the bike, and some becomes thermal energy, which is why I get warm.'}
 ]},
{id:'phy_waves', subj:'science', group:'phys', band:'g68', label:'Light & Sound Waves',
 tips:['Waves carry energy. Parts: <b>crest</b> (top), <b>trough</b> (bottom), <b>wavelength</b> (crest to crest), <b>amplitude</b> (height from the rest line).',
       '<b>Frequency</b> is how many waves pass a point each second, measured in <b>hertz (Hz)</b>.',
       '<b>Sound</b> needs a medium (air, water, solids), so it cannot travel through empty space. A louder sound has a bigger amplitude; a higher pitch has a higher frequency.',
       '<b>Light</b> can travel through empty space at about 300,000 km per second, far faster than sound.',
       'Waves can be <b>reflected</b> (bounce), <b>refracted</b> (bend when they change medium) or <b>absorbed</b>.'],
 problems:[
  {t:'label', q:'Label the parts of the wave.', diagram:'wave', parts:['crest','wavelength','amplitude','trough'], bank:['frequency']},
  {t:'mc', q:'Why can&rsquo;t sound travel through outer space?', opts:['There is no matter (medium) to carry the vibrations.','It is too cold.','Sound is blocked by the Sun.'], ans:0},

{id:'art_wheel', subj:'art', band:'g35', label:'Warm, Cool & Complementary Colors',

       '<b>Analogous colors</b> sit next to each other. <b>Tertiary colors</b> mix a primary with the secondary beside it (red-orange).',

  {t:'order', q:'Put these colors in order around the color wheel, from yellow to red.', items:['yellow','yellow-orange','orange','red-orange','red']},

{id:'art_elements', subj:'art', band:'g35', label:'Elements of Art',
 tips:['The <b>seven elements of art</b> are line, shape, form, space, color, value and texture.',

       '<b>Value</b> is how light or dark a color is.',
       '<b>Texture</b> is how something feels, or looks like it would feel.',

{id:'art_principles', subj:'art', band:'g68', label:'Principles of Design',
 tips:['<b>Balance</b> is how visual weight is spread out: <b>symmetrical</b> (mirror image), <b>asymmetrical</b> (different but balanced) or <b>radial</b> (from a center).',
       '<b>Contrast</b> is a strong difference, such as light and dark. <b>Emphasis</b> makes one part, the focal point, stand out.',
       '<b>Pattern</b> repeats an element. <b>Rhythm</b> and <b>movement</b> lead the eye through the work.',
       '<b>Proportion</b> is the size of parts compared with each other. <b>Unity</b> makes everything feel like it belongs together; <b>variety</b> adds interest.'],
 problems:[

  {t:'mc', q:'A butterfly has the same design on both wings. What kind of balance is this?', opts:['symmetrical','asymmetrical','radial'], ans:0},
  {t:'mc', q:'A snowflake has parts that spread out evenly from its center. What kind of balance is this?', opts:['symmetrical only','asymmetrical','radial'], ans:2},

  {t:'fill', q:'The size of one part compared with another part is called ___.', a:['proportion','scale']},
  {t:'mc', q:'Which picture shows <b>asymmetrical</b> balance?', opts:['one large tree on the left balanced by two small houses on the right','a face drawn exactly the same on both sides','a round design that repeats around its center'], ans:0,

  {t:'short', q:'How could an artist create <b>movement</b> in a painting of ocean waves?', model:'The artist could use curving, repeated lines and brushstrokes that lead the eye across the canvas, and place the waves at an angle so they seem to roll toward the shore.'}

{id:'art_media', subj:'art', band:'g68', label:'Art Media & Tools',
 tips:['The <b>medium</b> (plural: media) is the material an artist uses: pencil, paint, clay, stone and more.',
       '<b>Watercolor</b> is transparent and thinned with water. <b>Acrylic</b> dries fast and cleans up with water while wet. <b>Oil paint</b> dries slowly.',
       'Pencils marked <b>B</b> are soft and dark; pencils marked <b>H</b> are hard and light.',
       'Sculpture can be <b>subtractive</b> (carving material away) or <b>additive</b> (building it up, as in clay modeling). Clay is hardened by firing in a <b>kiln</b>.',
       'In <b>relief printmaking</b> (woodcuts, linocuts), the raised surface holds the ink.'],
 problems:[

  {t:'mc', q:'Carving a statue out of a block of marble is an example of...', opts:['additive sculpture','subtractive sculpture','printmaking'], ans:1},
  {t:'mc', q:'Which paint dries quickly and can be cleaned up with water while it is still wet?', opts:['oil paint','acrylic paint','oil pastel'], ans:1},
  {t:'fill', q:'A special oven used to fire clay is called a ___.', a:['kiln']},

  {t:'order', q:'Put the steps for making a relief print (such as a linocut) in order.', items:['Draw the design on the block.','Carve away the parts that should stay white.','Roll ink onto the raised surface.','Press paper onto the block and peel it off.']},
  {t:'mc', q:'Which pencil makes the darkest, softest marks?', opts:['2H','HB','6B'], ans:2,
   steps:[{q:'Pencils marked with a B are...', c:['softer and darker','harder and lighter'], a:0}]},
  {t:'short', q:'Choose two art media. Compare how an artist would use each one.', model:'Watercolor is painted in thin, see-through layers, so the artist works from light to dark and lets the white paper show. Clay is shaped by hand or on a wheel, then dried and fired in a kiln to make it hard.'}
 ]},
{id:'art_persp', subj:'art', band:'g912', label:'Linear Perspective',
 tips:['<b>Linear perspective</b> makes a flat picture look deep. The <b>horizon line</b> is the viewer&rsquo;s eye level.',
       'In <b>one-point perspective</b>, all lines going straight back into the picture (<b>orthogonals</b>) meet at one <b>vanishing point</b> on the horizon.',
       '<b>Two-point perspective</b> uses two vanishing points, often to draw the corner of a building.',
       '<b>Atmospheric perspective:</b> faraway things look lighter, bluer and less detailed.',
       'Filippo <b>Brunelleschi</b> demonstrated linear perspective in Florence in the early 1400s.'],
 problems:[
  {t:'label', q:'Label the parts of this one-point perspective drawing.', diagram:'persp', parts:['horizon line','vanishing point','orthogonal line'], bank:['contour line']},
  {t:'fill', q:'In linear perspective, parallel lines that go back into the distance meet at the ___ point.', a:['vanishing']},

   steps:[{q:'Each wall goes back toward its own vanishing point. How many walls go back?', c:['one','two'], a:1}]},
  {t:'match', q:'Match each technique to how it shows depth.', pairs:[['atmospheric perspective','faraway things look lighter, bluer and less detailed'],['foreshortening','an object pointing at the viewer looks shorter than it is'],['overlapping','a closer object covers part of a farther one'],['diminishing size','objects are drawn smaller as they get farther away']]},
  {t:'fill', q:'The Florentine architect Filippo ___ is credited with demonstrating linear perspective in the early 1400s.', a:['Brunelleschi']},
  {t:'order', q:'Put the steps for drawing a box in one-point perspective in order.', items:['Draw a horizon line.','Mark a vanishing point on the horizon line.','Draw the front face of the box as a square.','Draw lines from the corners of the square to the vanishing point.','Draw the back edges and erase the extra lines.']},
  {t:'short', q:'Explain why railroad tracks seem to meet in the distance, and how an artist shows this.', model:'The tracks are parallel, but objects look smaller the farther away they are, so the gap between the rails seems to shrink. An artist draws the rails as orthogonal lines that meet at a vanishing point on the horizon line.'}
 ]},
{id:'art_movements', subj:'art', band:'g912', label:'Art Movements & Artists',

function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function stripTags(s){ var d=document.createElement('div'); d.innerHTML=s; return d.textContent; }
function hashStr(s){ var h=2166136261; for(var i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); } return h>>>0; }
function seededShuffle(arr, seed){
  var a=arr.slice(), r=hashStr(seed)||1;
  function rnd(){ r^=r<<13; r>>>=0; r^=r>>>17; r^=r<<5; r>>>=0; return r/4294967296; }
  for(var i=a.length-1;i>0;i--){ var j=Math.floor(rnd()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}
// a shuffle that is never the original order (so a list never starts out solved)
function scrambled(arr, seed){
  var a=seededShuffle(arr, seed), k=0;
  while(arr.length>1 && a.every(function(x,i){ return x===arr[i]; })) a=seededShuffle(arr, seed+'#'+(++k));
  return a;
}
// the second-row key a topic sits under: its branch where the subject has branches, else its grade band
function rowOf(t){ return SUBJECT_GROUPS[t.subj] ? t.group : t.band; }
function groupOf(t){ var g = SUBJECT_GROUPS[t.subj] || []; for(var i=0;i<g.length;i++) if(g[i].id===t.group) return g[i]; return null; }
function bandOf(id){ for(var i=0;i<BANDS.length;i++) if(BANDS[i].id===id) return BANDS[i]; return null; }
function subjLabel(id){ for(var i=0;i<SUBJECT_INFO.length;i++) if(SUBJECT_INFO[i].id===id) return SUBJECT_INFO[i].label; return id; }

// ═══════════════════════════════════════════════
// WORD MATCHER (replaces the math app's numeric extractAnswer/answersMatch for words)
// Case-, spacing- and end-punctuation-insensitive; whole-answer equality only, so an answer
// that merely CONTAINS the right word is wrong. Accents (and ñ) are optional where a topic sets
// accents:true - the accented spelling is then shown after checking.
// ═══════════════════════════════════════════════
function wNorm(s, keepCase){
  var v = String(s==null?'':s).normalize('NFC')
    .replace(/[\u2018\u2019\u02bc`\u00b4]/g,"'").replace(/[\u201c\u201d]/g,'"');
  if(!keepCase) v = v.toLowerCase();
  return v.replace(/\s+/g,' ').trim()
    .replace(/^[\u00bf\u00a1"'.\s]+|[.!?,;:"'\s]+$/g,'')
    .replace(/(\d),(\d{3})\b/g,'$1$2').replace(/\s*-\s*/g,'-');
}
// every letter matches the answer's, or is the answer's letter with its accent left off
function accentsOnlyMissing(s, a){
  var sc = Array.from(s.normalize('NFC')), ac = Array.from(a.normalize('NFC'));
  return sc.length===ac.length && sc.every(function(c, i){ return c===ac[i] || c===stripAccents(ac[i]); });
}
function stripAccents(s){ return s.normalize('NFD').replace(/[\u0300-\u036f]/g,''); }
// caseSensitive (cs:true on a problem) is only for questions about capital letters
function wordsMatch(student, answers, accentsOptional, caseSensitive){
  var s=wNorm(student, caseSensitive);
  if(!s) return {ok:false, empty:true};
  for(var i=0;i<answers.length;i++) if(s===wNorm(answers[i], caseSensitive)) return {ok:true, exact:true};
  if(accentsOptional){
    for(var j=0;j<answers.length;j++) if(accentsOnlyMissing(s, wNorm(answers[j], caseSensitive))) return {ok:true, exact:false, spelled:answers[j]};
  }
  return {ok:false};
}

// INTERACTIVE TAP-THROUGH STEPS (copied from the math engine)
// ═══════════════════════════════════════════════
var iState = {};
function iKey(modId, probIdx){ return modId+'||'+probIdx; }
function initIState(modId, probIdx, stepCount){
  iState[iKey(modId, probIdx)] = {stepCount:stepCount, firstTry:(new Array(stepCount)).fill(null), done:(new Array(stepCount)).fill(false)};
}
function renderInteractiveSteps(steps, modId, probIdx){
  initIState(modId, probIdx, steps.length);
  var h = '<div class="steps" id="isteps-'+modId+'-'+probIdx+'">';
  steps.forEach(function(s, si){
    h += '<div class="interactive-step'+(si===0?'':' locked')+'" id="istep-'+modId+'-'+probIdx+'-'+si+'">';
    h += '<div class="step-q">'+s.prompt+'</div><div class="step-choices">';
    s.choices.forEach(function(c, ci){
      var isc = (ci===s.correct);
      h += '<button type="button" class="choice-btn" onclick="iCheck(this,\''+modId+'\','+probIdx+','+si+','+isc+')" data-correct="'+isc+'">'+c+'</button>';
    });
    h += '</div></div>';
  });
  h += '</div><div class="prob-score-badge" id="iscore-'+modId+'-'+probIdx+'"></div>';
  return h;
}
function iCheck(btn, modId, probIdx, stepIdx, isCorrect){
  var st = iState[iKey(modId, probIdx)];
  if(!st || st.done[stepIdx]) return;
  var stepEl = document.getElementById('istep-'+modId+'-'+probIdx+'-'+stepIdx);
  if(isCorrect){
    if(st.firstTry[stepIdx]===null) st.firstTry[stepIdx] = true;
    st.done[stepIdx] = true;
    stepEl.querySelectorAll('.choice-btn').forEach(function(b){
      b.classList.add('i-disabled'); b.setAttribute('aria-disabled','true');
      if(b.dataset.correct==='true') b.classList.add('i-correct');
    });
    stepEl.classList.add('i-done');
    iUnlock(modId, probIdx, stepIdx, st.stepCount);
  } else {
    if(st.firstTry[stepIdx]===null) st.firstTry[stepIdx] = false;
    btn.classList.add('i-wrong');
    iShakeEl(stepEl);
    setTimeout(function(){ btn.classList.remove('i-wrong'); }, 650);
  }
}
function iUnlock(modId, probIdx, stepIdx, totalSteps){
  var next = stepIdx+1;
  if(next < totalSteps){
    var el = document.getElementById('istep-'+modId+'-'+probIdx+'-'+next);
    if(el) el.classList.remove('locked');
  } else iShowScore(modId, probIdx);
}
function iShowScore(modId, probIdx){
  var st = iState[iKey(modId, probIdx)];
  var ft = st.firstTry.filter(function(v){ return v===true; }).length;
  var badge = document.getElementById('iscore-'+modId+'-'+probIdx);
  if(badge){
    badge.textContent = '\u2713 Thought it through! First try: '+ft+' / '+st.stepCount+' steps. Now answer below.';
    badge.classList.add('i-show');
    if(ft===st.stepCount) badge.classList.add('i-perfect');
  }
}
function iShakeEl(el){ el.classList.remove('i-shake'); void el.offsetWidth; el.classList.add('i-shake'); setTimeout(function(){ el.classList.remove('i-shake'); }, 420); }

    h += '<div class="mc-opts" role="group" aria-label="Choices">';
    p.opts.forEach(function(o, oi){
      h += '<button type="button" class="mc-opt" data-key="'+key+'" data-oi="'+oi+'" data-ok="'+(oi===p.ans?1:0)+'" onclick="mcPick(this)"><span class="mc-letter">'+LETTERS[oi].toUpperCase()+'</span><span>'+o+'</span></button>';
    });
    h += '</div>';
  }
  else if(p.t==='match'){
    var rights = scrambled(p.pairs.map(function(x){ return x[1]; }), key+'|m');
    LAYOUT[key] = {rights:rights};
    h += '<div class="paper"><div class="match-grid"><ol>';
    p.pairs.forEach(function(pr){ h += '<li><span class="m-line"><span class="ak-only">'+LETTERS[rights.indexOf(pr[1])]+'</span></span>'+pr[0]+'</li>'; });
    h += '</ol><ul>';
    rights.forEach(function(r, ri){ h += '<li><b>'+LETTERS[ri]+'.</b> '+r+'</li>'; });
    h += '</ul></div><div class="hint-sm">Write the letter of the match on each line.</div></div>';
    h += '<div class="live">';
    p.pairs.forEach(function(pr, pi){
      h += '<div class="match-row"><span class="ml"><b>'+(pi+1)+'.</b> '+pr[0]+'</span><select data-key="'+key+'" data-row="'+pi+'" aria-label="Match for item '+(pi+1)+'"><option value="">Choose a match&hellip;</option>';
      rights.forEach(function(r, ri){ h += '<option value="'+ri+'">'+LETTERS[ri]+'. '+esc(stripTags(r))+'</option>'; });
      h += '</select></div>';
    });
    h += '</div>';
  }
  else if(p.t==='order'){
    var shown = scrambled(p.items, key+'|o');
    LAYOUT[key] = {shown:shown};
    h += '<div class="paper"><ul class="ord-paper">';
    shown.forEach(function(it){ h += '<li><span class="o-box"><span class="ak-only">'+(p.items.indexOf(it)+1)+'</span></span><span>'+it+'</span></li>'; });
    h += '</ul><div class="hint-sm">Write 1 in the box for the first, 2 for the next, and so on.</div></div>';
    h += '<div class="live"><div class="ord-label">Tap the items in order</div><div class="ord-pool" data-key="'+key+'">';
    shown.forEach(function(it, si){ h += '<button type="button" class="chip" data-key="'+key+'" data-si="'+si+'" onclick="ordTap(this)">'+it+'</button>'; });
    h += '</div><div class="ord-label">Your order (tap an item to send it back)</div><div class="ord-seq" data-key="'+key+'"></div></div>';
  }
  else if(p.t==='label'){
    var d = DIAGRAMS[p.diagram];
    var names = scrambled(p.parts.concat(p.bank||[]), key+'|l');
    LAYOUT[key] = {names:names};
    var svg = '<svg viewBox="'+d.vb+'" role="img" aria-label="'+esc(d.alt)+'" xmlns="http://www.w3.org/2000/svg">'+d.art;
    d.spots.forEach(function(s, si){
      svg += '<line class="lbl-lead" x1="'+s.x+'" y1="'+s.y+'" x2="'+s.tx+'" y2="'+s.ty+'"/><circle class="lbl-dot" cx="'+s.tx+'" cy="'+s.ty+'" r="2.5"/>'
          +  '<g class="lbl-spot" data-key="'+key+'" data-s="'+si+'" onclick="lblSelect(this)"><circle cx="'+s.x+'" cy="'+s.y+'" r="11"/><text x="'+s.x+'" y="'+s.y+'">'+(si+1)+'</text></g>';
    });
    svg += '</svg>';
    h += '<div class="lbl-wrap"><div class="lbl-svg">'+svg+'</div><div>';
    h += '<div class="paper"><div class="word-bank"><b>Word bank:</b> '+names.map(esc).join(' &middot; ')+'</div><ol class="lbl-paper">';
    p.parts.forEach(function(n){ h += '<li><span class="m-line wide"><span class="ak-only">'+esc(n)+'</span></span></li>'; });
    h += '</ol></div><div class="live"><div class="lbl-rows">';
    p.parts.forEach(function(n, si){ h += '<button type="button" class="lbl-row" data-key="'+key+'" data-s="'+si+'" onclick="lblSelect(this)"><span class="num-dot">'+(si+1)+'</span><span class="lbl-val">Tap to label</span></button>'; });
    h += '</div><div class="lbl-picker" data-key="'+key+'"><div class="lbl-picker-q"></div><div class="lbl-names">';
    names.forEach(function(n, ni){ h += '<button type="button" class="chip" data-key="'+key+'" data-ni="'+ni+'" onclick="lblPick(this)">'+esc(n)+'</button>'; });
    h += '</div></div></div></div></div>';
  }
  else if(p.t==='short'){
    h += '<div class="paper write-lines"><div class="rule"></div><div class="rule"></div><div class="rule"></div><div class="rule"></div></div>';
    h += '<div class="live short-live"><textarea data-key="'+key+'" rows="4" placeholder="Write your answer in complete sentences." aria-label="Your written answer"></textarea></div>';
  }
  return h;
}

function solutionHTML(p){
  var h = '';
  if(p.t==='fill'){
    var blanks = fillBlanks(p);
    h = blanks.map(function(b){ return '<b>'+esc(b[0])+'</b>'; }).join(', ');
    var alts = [].concat.apply([], blanks.map(function(b){ return b.slice(1); }));
    if(alts.length) h += ' <span class="sol-alts">(also accepted: '+alts.map(esc).join(', ')+')</span>';
  }
  else if(p.t==='mc') h = '<b>'+LETTERS[p.ans].toUpperCase()+'.</b> '+p.opts[p.ans];
  else if(p.t==='match'){
    h = '<ol>'+p.pairs.map(function(pr){ return '<li>'+pr[0]+' &rarr; <b>'+pr[1]+'</b></li>'; }).join('')+'</ol>';
  }
  else if(p.t==='order') h = '<ol>'+p.items.map(function(it){ return '<li>'+it+'</li>'; }).join('')+'</ol>';
  else if(p.t==='label') h = '<ol>'+p.parts.map(function(n){ return '<li><b>'+esc(n)+'</b></li>'; }).join('')+'</ol>';
  else if(p.t==='short') h = p.model;
  if(p.note) h += '<div class="sol-alts">'+p.note+'</div>';
  return h;
}

function checkBarHTML(p, key){
  var rid = 'check-result-'+key.replace(':','-'), h = '<div class="prob-check-bar">';
  if(p.t==='short') h += '<button type="button" class="check-btn show-answer" onclick="revealAnswer(\''+key+'\')">&#128065; Show model answer</button>';
  else {
    if(p.t!=='mc') h += '<button type="button" class="check-btn" onclick="checkProblem(\''+key+'\')">&#10003; Check</button>';
    h += '<button type="button" class="check-btn show-answer" onclick="revealAnswer(\''+key+'\')">&#128065; Show Answer</button>';
  }
  return h + '<span class="check-result" id="'+rid+'" role="status" aria-live="polite"></span></div>';
}

function problemHTML(modId, p, i){
  var key = modId+':'+i;
  var h = '<div class="problem" data-key="'+key+'" data-type="'+p.t+'">';
  h += '<div class="prob-num">'+(i+1)+'. <span class="prob-type">'+TYPE_LABEL[p.t]+'</span>'+(p.custom?'<span class="prob-type custom">Added question</span>':'')+'</div>';
  if(p.passage) h += '<div class="passage">'+p.passage+'</div>';
  h += '<div class="prob-prompt">'+promptHTML(p, key)+'</div>';
  if(p.steps && p.steps.length){
    h += '<div class="think-label">&#129504; Think it through</div>';
    h += renderInteractiveSteps(p.steps.map(function(s){ return {prompt:s.q, choices:s.c, correct:s.a}; }), modId, i);
  }
  h += bodyHTML(p, key);
  h += '<div class="solution-box"><span class="sol-label">'+(p.t==='short'?'Model answer':'Answer')+':</span> '+solutionHTML(p)+'</div>';
  h += checkBarHTML(p, key);
  return h + '</div>';
}

function tipsHTML(moduleId){

// NAVIGATION: subject row, grade-band row (copied from Pre-Algebra's sub-row), topic row
// ═══════════════════════════════════════════════
var currentSubject = null, currentBand = null, currentModule = null;
var LAST_STORAGE = 'cowork-subject-worksheets-last';

function renderSubjectBar(){
  document.getElementById('subject-bar').innerHTML = SUBJECT_INFO.filter(function(s){ return SUBJECTS[s.id]; }).map(function(s){
    return '<button class="subj-btn" data-subj="'+s.id+'" onclick="switchSubject(\''+s.id+'\')">'+s.label+'</button>';
  }).join('');
}
function renderBandBar(subj){
  var have = {}; SUBJECTS[subj].forEach(function(t){ have[t.row] = 1; });
  var groups = SUBJECT_GROUPS[subj];
  document.getElementById('subject-subbar').innerHTML = groups
    ? '<span class="subj-grp">Branch</span>' + groups.filter(function(g){ return have[g.id]; }).map(function(g){
        return '<button class="subj-btn band-btn" data-band="'+g.id+'" onclick="switchBand(\''+g.id+'\')">'+g.label+'</button>';
      }).join('')
    : '<span class="subj-grp">Grades</span>' + BANDS.filter(function(b){ return have[b.id]; }).map(function(b){
        return '<button class="subj-btn band-btn" data-band="'+b.id+'" title="'+b.name+'" onclick="switchBand(\''+b.id+'\')">'+b.label+' <span class="band-name">'+b.name+'</span></button>';
      }).join('');
}
function renderTopicBar(subj, band, activeId){
  var graded = !!SUBJECT_GROUPS[subj];
  document.getElementById('topic-bar').innerHTML = SUBJECTS[subj].filter(function(t){ return t.row===band; }).map(function(t){
    return '<button class="topic-btn'+(t.id===activeId?' active':'')+'" data-id="'+t.id+'" onclick="switchTopic(\''+t.id+'\')">'+t.label
      +(graded ? ' <span class="band-tag">'+bandOf(t.band).label+'</span>' : '')+'</button>';
  }).join('');
}
function syncSubjectButtons(){
  document.querySelectorAll('#subject-bar .subj-btn').forEach(function(b){ b.classList.toggle('active', b.dataset.subj===currentSubject); });
  document.querySelectorAll('#subject-subbar .band-btn').forEach(function(b){ b.classList.toggle('active', b.dataset.band===currentBand); });
}
function switchSubject(subj){
  if(!SUBJECTS[subj]) return;
  switchModule(SUBJECTS[subj][0].id);
}
function switchBand(band){
  var first = SUBJECTS[currentSubject].filter(function(t){ return t.row===band; })[0];
  if(first) switchModule(first.id);
}
function switchTopic(id){ switchModule(id); }
function switchModule(id){
  var t = TOPIC_BY_ID[id];
  if(!t || !SUBJECTS[t.subj]) return;
  if(t.subj!==currentSubject){ currentSubject = t.subj; renderBandBar(t.subj); }
  if(rowOf(t)!==currentBand || !document.querySelector('#topic-bar .topic-btn[data-id="'+id+'"]')){ currentBand = rowOf(t); }
  renderTopicBar(currentSubject, currentBand, id);
  currentModule = id;
  syncSubjectButtons();
  document.querySelectorAll('.module').forEach(function(m){ m.classList.remove('active'); });
  var el = document.getElementById('mod-'+id);
  if(el) el.classList.add('active');
  lastCelebratedModule = null;
  try{ localStorage.setItem(LAST_STORAGE, id); }catch(e){}
  updateProgressPanel();
}
