// STUDENT MODE (INTERACTIVE) - state kept per problem key "modId:index"
// ═══════════════════════════════════════════════
var studentMode = false;
var lastCelebratedModule = null;
var studentState = {startTime:null, elapsedSeconds:0, results:{}, selections:{}, inputs:{}, timerInterval:null};
var STUDENT_STORAGE = 'cowork-subject-worksheets-student';
function loadStudentState(){
  try{
    var saved = JSON.parse(localStorage.getItem(STUDENT_STORAGE) || 'null');
    if(saved){
      studentState.elapsedSeconds = saved.elapsedSeconds || 0;
      studentState.results = saved.results || {};
      studentState.selections = saved.selections || {};
      studentState.inputs = saved.inputs || {};
    }
  }catch(e){}
}
function saveStudentState(){
  try{ localStorage.setItem(STUDENT_STORAGE, JSON.stringify({elapsedSeconds:studentState.elapsedSeconds, results:studentState.results, selections:studentState.selections, inputs:studentState.inputs})); }catch(e){}
}

function toggleStudentMode(){
  studentMode = !studentMode;
  document.body.classList.toggle('student-mode', studentMode);
  var btn = document.getElementById('student-toggle-btn');
  btn.innerHTML = studentMode ? '&#127891; Student Mode: ON' : '&#127891; Student Mode: OFF';
  btn.classList.toggle('on-student', studentMode);
  if(studentMode){
    // on a phone the open panel covers a third of the screen: start it folded (tap to open)
    var pp = document.getElementById('progress-panel');
    if(window.innerWidth<=640 && !pp.classList.contains('minimized')) toggleProgressPanel();
    startProgressTimer(); updateProgressPanel();
  }
  else stopProgressTimer();
}
function toggleAnswerKey(){
  var on = !document.body.classList.contains('answer-key-mode');
  document.body.classList.toggle('answer-key-mode', on);
  var btn = document.getElementById('ak-toggle-btn');
  btn.innerHTML = on ? '&#128275; Answer Key: ON' : '&#128273; Answer Key: OFF';
  btn.classList.toggle('on-key', on);
}
function printWorksheet(){ try{ window.print(); }catch(e){} }

// Put saved answers back into a module's controls (after render or re-render)
function restoreModuleState(modId){
  (PROBS[modId]||[]).forEach(function(p, i){
    var key = modId+':'+i, prob = probEl(key);
    if(!prob) return;
    if(p.t==='fill') prob.querySelectorAll('.blank input').forEach(function(inp){ inp.value = studentState.inputs[key+':b'+inp.dataset.b] || ''; });
    if(p.t==='match') prob.querySelectorAll('select').forEach(function(sel){ sel.value = studentState.inputs[key+':m'+sel.dataset.row] || ''; });
    if(p.t==='short'){ var ta = prob.querySelector('textarea'); if(ta) ta.value = studentState.inputs[key+':txt'] || ''; }
    if(p.t==='order') (studentState.inputs[key+':ord'] || []).forEach(function(si){ var chip = prob.querySelector('.ord-pool .chip[data-si="'+si+'"]'); if(chip) ordMove(chip, true); });
    if(p.t==='label') lblRefresh(key);
    if(p.t==='mc' && studentState.selections[key]!=null){
      var b = prob.querySelector('.mc-opt[data-oi="'+studentState.selections[key]+'"]');
      if(b) b.classList.add(+b.dataset.oi===p.ans ? 'picked-ok' : 'picked-no');
    }
    var r = studentState.results[key];
    if(r==='correct' || r==='incorrect') markChecked(key, r==='correct', '');
  });
}

// ── multiple choice: a tap is the answer ──
function mcPick(btn){
  if(!studentMode) return;
  var key = btn.dataset.key, p = probByKey(key), oi = +btn.dataset.oi, ok = oi===p.ans;
  btn.parentNode.querySelectorAll('.mc-opt').forEach(function(b){ b.classList.remove('picked-ok','picked-no'); });
  btn.classList.add(ok ? 'picked-ok' : 'picked-no');
  studentState.selections[key] = oi;
  var after = scoreResult(key, ok);
  saveStudentState();
  markChecked(key, ok, '', after);
  updateProgressPanel();
}

// ── put in order: tap a chip to move it between the pool and the sequence ──
function ordTap(chip){ if(studentMode) ordMove(chip, false); }
function ordMove(chip, restoring){
  var key = chip.dataset.key, prob = probEl(key);
  var pool = prob.querySelector('.ord-pool'), seq = prob.querySelector('.ord-seq');
  if(chip.parentNode===pool){
    seq.appendChild(chip);
  } else {
    var si = +chip.dataset.si, after = null;
    pool.querySelectorAll('.chip').forEach(function(c){ if(after===null && +c.dataset.si > si) after = c; });
    pool.insertBefore(chip, after);
  }
  seq.querySelectorAll('.chip').forEach(function(c, n){
    var num = c.querySelector('.n'); if(!num){ num = document.createElement('span'); num.className = 'n'; c.insertBefore(num, c.firstChild); }
    num.textContent = (n+1)+'.';
  });
  pool.querySelectorAll('.chip .n').forEach(function(n){ n.remove(); });
  if(!restoring){
    studentState.inputs[key+':ord'] = [].map.call(seq.querySelectorAll('.chip'), function(c){ return +c.dataset.si; });
    seq.classList.remove('ok','no');
    clearResult(key);
    saveStudentState();
  }
}

// ── label the diagram: tap a numbered part (or its row), then tap a name ──
var LBL_SEL = {};
function lblSelect(el){
  if(!studentMode) return;
  var key = el.dataset.key || el.getAttribute('data-key');
  LBL_SEL[key] = +(el.dataset.s || el.getAttribute('data-s'));
  lblRefresh(key);
}
function lblPick(btn){
  var key = btn.dataset.key, sel = LBL_SEL[key];
  if(sel==null) return;
  var labels = studentState.inputs[key+':lbl'] || {};
  labels[sel] = +btn.dataset.ni;
  studentState.inputs[key+':lbl'] = labels;
  // move on to the next part that still needs a name
  var p = probByKey(key), next = null;
  for(var k=1; k<=p.parts.length; k++){ var s=(sel+k)%p.parts.length; if(labels[s]==null){ next = s; break; } }
  LBL_SEL[key] = next;
  clearResult(key);
  saveStudentState();
  lblRefresh(key);
}
function lblRefresh(key){
  var prob = probEl(key), p = probByKey(key), labels = studentState.inputs[key+':lbl'] || {}, names = LAYOUT[key].names, sel = LBL_SEL[key];
  prob.querySelectorAll('.lbl-row').forEach(function(row){
    var s = +row.dataset.s, v = row.querySelector('.lbl-val');
    var has = labels[s]!=null;
    v.textContent = has ? names[labels[s]] : 'Tap to label';
    v.classList.toggle('set', has);
    row.classList.toggle('sel', s===sel);
    row.classList.remove('ok','no');
  });
  prob.querySelectorAll('.lbl-spot').forEach(function(g){
    var s = +g.getAttribute('data-s');
    g.classList.toggle('sel', s===sel);
    g.classList.toggle('done', labels[s]!=null);
  });
  var picker = prob.querySelector('.lbl-picker');
  picker.classList.toggle('open', sel!=null);
  if(sel!=null) picker.querySelector('.lbl-picker-q').textContent = 'Part '+(sel+1)+' is the\u2026';
}

// ── grading ──
function gradeProblem(key){
  var p = probByKey(key), prob = probEl(key), modId = key.split(':')[0];
  if(p.t==='fill'){
    var inputs = prob.querySelectorAll('.blank input'), blanks = fillBlanks(p), notes = [], allOk = true;
    if([].some.call(inputs, function(i){ return !i.value.trim(); })) return {state:'empty', msg:'Fill in every blank first.'};
    inputs.forEach(function(inp){
      var r = wordsMatch(inp.value, blanks[+inp.dataset.b], accentsFor(modId), p.cs);
      inp.parentNode.classList.remove('correct','incorrect');
      inp.parentNode.classList.add(r.ok ? 'correct' : 'incorrect');
      if(!r.ok) allOk = false;
      if(r.ok && !r.exact) notes.push(r.spelled);
    });
    return {state: allOk ? 'ok' : 'no', spelled: notes};
  }
  if(p.t==='mc'){
    var s = studentState.selections[key];
    if(s==null) return {state:'empty', msg:'Tap an answer.'};
    return {state: s===p.ans ? 'ok' : 'no'};
  }
  if(p.t==='match'){
    var sels = prob.querySelectorAll('.match-row select'), rights = LAYOUT[key].rights, right = 0;
    if([].some.call(sels, function(s){ return s.value===''; })) return {state:'empty', msg:'Choose a match for every item first.'};
    sels.forEach(function(sel){
      var ok = rights[+sel.value]===p.pairs[+sel.dataset.row][1];
      sel.classList.remove('ok','no'); sel.classList.add(ok ? 'ok' : 'no');
      if(ok) right++;
    });
    return {state: right===sels.length ? 'ok' : 'no', msg: right+' of '+sels.length+' matches are right.'};
  }
  if(p.t==='order'){
    var seqIdx = studentState.inputs[key+':ord'] || [], shown = LAYOUT[key].shown, inPlace = 0;
    if(seqIdx.length < p.items.length) return {state:'empty', msg:'Put every item in your order first.'};
    seqIdx.forEach(function(si, n){ if(shown[si]===p.items[n]) inPlace++; });
    var seqEl = prob.querySelector('.ord-seq'), good = inPlace===p.items.length;
    seqEl.classList.remove('ok','no'); seqEl.classList.add(good ? 'ok' : 'no');
    return {state: good ? 'ok' : 'no', msg: inPlace+' of '+p.items.length+' are in the right place.'};
  }
  if(p.t==='label'){
    var labels = studentState.inputs[key+':lbl'] || {}, names = LAYOUT[key].names, correct = 0;
    for(var s2=0; s2<p.parts.length; s2++) if(labels[s2]==null) return {state:'empty', msg:'Label every numbered part first.'};
    LBL_SEL[key] = null; lblRefresh(key);
    prob.querySelectorAll('.lbl-row').forEach(function(row){
      var s3 = +row.dataset.s, ok = names[labels[s3]]===p.parts[s3];
      row.classList.add(ok ? 'ok' : 'no');
      if(ok) correct++;
    });
    return {state: correct===p.parts.length ? 'ok' : 'no', msg: correct+' of '+p.parts.length+' labels are right.'};
  }
  return {state:'empty'};
}
function hasAnswer(key){
  var p = probByKey(key), prob = probEl(key);
  if(p.t==='fill') return [].some.call(prob.querySelectorAll('.blank input'), function(i){ return i.value.trim(); });
  if(p.t==='match') return [].some.call(prob.querySelectorAll('.match-row select'), function(s){ return s.value!==''; });
  if(p.t==='order') return (studentState.inputs[key+':ord']||[]).length>0;
  if(p.t==='label') return Object.keys(studentState.inputs[key+':lbl']||{}).length>0;
  return false;
}
function checkProblem(key){
  var r = gradeProblem(key);
  if(r.state==='empty'){ showResult(key, 'pending', r.msg || 'Answer first.'); return 'empty'; }
  var ok = r.state==='ok';
  var after = scoreResult(key, ok);
  saveStudentState();
  markChecked(key, ok, r.spelled && r.spelled.length ? r.spelled : (ok ? '' : r.msg), after);
  updateProgressPanel();
  return r.state;
}
function showResult(key, cls, html){
  var el = document.getElementById('check-result-'+key.replace(':','-'));
  if(!el) return;
  el.className = 'check-result show '+cls;
  el.innerHTML = html;
}
function clearResult(key){
  var el = document.getElementById('check-result-'+key.replace(':','-'));
  if(el){ el.className = 'check-result'; el.innerHTML = ''; }
}
// extra: for a right answer, the accented spellings (array); for a wrong one, a hint line
function markChecked(key, correct, extra, after){
  var msg;
  if(correct){
    msg = '\u2713 Correct!';
    if(extra && extra.length) msg += ' Spelled with accents: '+extra.map(function(s){ return '<b lang="es">'+esc(s)+'</b>'; }).join(', ');
  } else msg = '\u2717 Not quite. Try again.'+(extra ? ' '+esc(extra) : '');
  showResult(key, correct ? 'correct' : 'incorrect', msg+(after ? esc(after) : ''));
}
function revealAnswer(key){
  var p = probByKey(key), prob = probEl(key);
  if(p.t==='short'){
    var ta = prob.querySelector('textarea');
    if(!ta.value.trim()){ showResult(key, 'pending', 'Write your answer first, then compare it with the model answer.'); ta.focus(); return; }
  }
  prob.querySelector('.solution-box').classList.add('revealed');
  // a wrong answer stays wrong; an answer given after this point is not scored (see scoreResult)
  if(p.t!=='short') studentState.inputs[key+':shown'] = 1;
  if(!studentState.results[key]) studentState.results[key] = 'attempted';
  saveStudentState();
  updateProgressPanel();
  if(p.t==='short') showResult(key, 'seen', 'Compare your answer with the model answer. Short answers are not marked right or wrong.');
}
// Record a graded answer. Once the answer was shown, a right answer earns no score:
// the earlier result (incorrect, or attempted) stands. Returns a note for the result line.
function scoreResult(key, ok){
  var shown = studentState.inputs[key+':shown'] && studentState.results[key]!=='correct';
  if(!shown) studentState.results[key] = ok ? 'correct' : 'incorrect';
  return shown && ok ? ' (The answer was shown, so this one does not add to your score.)' : '';
}
function checkAllProblems(){
  // only answers a student can see and has started - an empty box isn't an attempt
  var n = 0;
  document.querySelectorAll('.module.active .worksheet .problem').forEach(function(prob){
    var key = prob.dataset.key, p = probByKey(key);
    if(p.t==='mc' || p.t==='short' || !prob.offsetParent || !hasAnswer(key)) return;
    checkProblem(key); n++;
  });
  document.getElementById('pp-msg').textContent = n ? 'Checked '+n+' answer'+(n===1?'':'s')+'. Empty ones were skipped.' : 'Nothing to check yet: type or choose an answer first.';
}

// inputs save as you type
document.addEventListener('input', function(e){
  var t = e.target, key = t.dataset && t.dataset.key;
  if(!key) return;
  if(t.matches('.blank input')){ studentState.inputs[key+':b'+t.dataset.b] = t.value; t.parentNode.classList.remove('correct','incorrect'); clearResult(key); }
  else if(t.matches('textarea')) studentState.inputs[key+':txt'] = t.value;
  else return;
  saveStudentState();
});
document.addEventListener('change', function(e){
  var t = e.target;
  if(!t.matches || !t.matches('.match-row select')) return;
  studentState.inputs[t.dataset.key+':m'+t.dataset.row] = t.value;
  t.classList.remove('ok','no');
  clearResult(t.dataset.key);
  saveStudentState();
});
document.addEventListener('keydown', function(e){
  if(e.key==='Enter' && e.target.matches && e.target.matches('.blank input')){ e.preventDefault(); checkProblem(e.target.dataset.key); }
});

// ── progress panel (copied) ──
function gradedTotal(modId){ return (PROBS[modId]||[]).filter(function(p){ return p.t!=='short'; }).length; }
function updateProgressPanel(){
  var modId = currentModule;
  if(!modId) return;
  var total = gradedTotal(modId), correct = 0, incorrect = 0;
  Object.keys(studentState.results).forEach(function(k){
    if(k.indexOf(modId+':')!==0) return;
    var p = probByKey(k); if(!p || p.t==='short') return;
    if(studentState.results[k]==='correct') correct++;
    else if(studentState.results[k]==='incorrect') incorrect++;
  });
  var attempted = correct+incorrect, pct = total ? Math.round(correct/total*100) : 0;
  document.getElementById('pp-score').textContent = correct+' / '+total;
  document.getElementById('pp-correct').textContent = correct;
  document.getElementById('pp-incorrect').textContent = incorrect;
  document.getElementById('pp-accuracy').textContent = attempted ? Math.round(correct/attempted*100)+'%' : '\u2014';
  document.getElementById('pp-module').textContent = TOPIC_BY_ID[modId].label;
  document.getElementById('pp-bar-fill').style.width = pct+'%';
  if(studentMode && total>0 && correct===total && lastCelebratedModule!==modId){ lastCelebratedModule = modId; triggerConfetti(); }
}
function triggerConfetti(){
  var container = document.createElement('div');
  container.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:9999;overflow:hidden;';
  document.body.appendChild(container);
  var colors = ['#f44336','#e91e63','#9c27b0','#3f51b5','#2196f3','#00bcd4','#4caf50','#cddc19','#ffc107','#ff5722'];
  for(var i=0;i<100;i++){
    var p = document.createElement('div');
    p.className = 'confetti-piece';
    p.style.left = Math.random()*100+'vw';
    p.style.backgroundColor = colors[Math.floor(Math.random()*colors.length)];
    p.style.animationDelay = Math.random()*2+'s';
    p.style.animationDuration = (Math.random()*2+1.8)+'s';
    container.appendChild(p);
  }
  setTimeout(function(){ container.remove(); }, 5000);
}
function startProgressTimer(){
  if(studentState.timerInterval) clearInterval(studentState.timerInterval);
  studentState.startTime = Date.now() - studentState.elapsedSeconds*1000;
  studentState.timerInterval = setInterval(function(){
    studentState.elapsedSeconds = Math.floor((Date.now()-studentState.startTime)/1000);
    var m = Math.floor(studentState.elapsedSeconds/60), s = studentState.elapsedSeconds%60;
    document.getElementById('pp-time').textContent = m+':'+(s<10?'0':'')+s;
    if(studentState.elapsedSeconds%10===0) saveStudentState();
  }, 1000);
}
function stopProgressTimer(){ if(studentState.timerInterval){ clearInterval(studentState.timerInterval); studentState.timerInterval = null; } saveStudentState(); }
function toggleProgressPanel(){
  var pp = document.getElementById('progress-panel');
  pp.classList.toggle('minimized');
  document.getElementById('pp-chevron').innerHTML = pp.classList.contains('minimized') ? '&#9650;' : '&#9660;';
}
// Reset asks for a second tap instead of a confirm() dialog
var resetArmed = null;
function resetStudentProgress(){
  var btn = document.getElementById('pp-reset');
  if(!resetArmed){
    btn.classList.add('armed'); btn.innerHTML = 'Tap again to reset';
    document.getElementById('pp-msg').textContent = 'This clears every answer on every worksheet.';
    resetArmed = setTimeout(function(){ resetArmed = null; btn.classList.remove('armed'); btn.innerHTML = '&#8635; Reset'; document.getElementById('pp-msg').textContent = ''; }, 4000);
    return;
  }
  clearTimeout(resetArmed); resetArmed = null;
  btn.classList.remove('armed'); btn.innerHTML = '&#8635; Reset';
  studentState.results = {}; studentState.selections = {}; studentState.inputs = {};
  studentState.elapsedSeconds = 0; studentState.startTime = Date.now();
  saveStudentState();
  LBL_SEL = {}; lastCelebratedModule = null;
  document.getElementById('pp-time').textContent = '0:00';
  Object.keys(PROBS).forEach(renderModule);
  updateProgressPanel();
  document.getElementById('pp-msg').textContent = 'Progress reset.';
}

// ═══════════════════════════════════════════════
// PROBLEM EDITOR - add your own question to a worksheet (saved in this browser)
// ═══════════════════════════════════════════════
function editorHTML(t){
  var list = (CUSTOM[t.id]||[]).map(function(p, ci){
    return '<div class="ed-custom-item"><span>'+TYPE_LABEL[p.t]+': '+p.q+'</span><button type="button" class="act" onclick="edRemove(\''+t.id+'\','+ci+')">Remove</button></div>';
  }).join('');
  return '<details class="ed-details"><summary>&#9998;&nbsp; Add your own question to this worksheet</summary>'
   + '<div class="ed-form" data-mod="'+t.id+'">'
   + '<label class="ed-field">Question type<select class="ed-type" onchange="edTypeChanged(this)"><option value="mc">Multiple choice</option><option value="fill">Fill in the blank</option><option value="short">Short written answer</option><option value="match">Matching</option><option value="order">Put in order</option></select></label>'
   + '<label class="ed-field">Question<textarea class="ed-q" rows="2"></textarea><span class="ed-hint ed-q-hint"></span></label>'
   + '<label class="ed-field ed-a-wrap"><span class="ed-a-label">Correct answer</span><textarea class="ed-a" rows="2"></textarea><span class="ed-hint ed-a-hint"></span></label>'
   + '<label class="ed-field ed-list-wrap"><span class="ed-list-label">Wrong choices (one per line)</span><textarea class="ed-list" rows="4"></textarea><span class="ed-hint ed-list-hint"></span></label>'
   + '<div class="ed-actions"><button type="button" class="act primary" onclick="edAdd(this)">+ Add question</button><span class="ed-msg" role="status"></span></div>'
   + (list ? '<div class="ed-custom"><span class="ed-hint">Questions you added:</span>'+list+'</div>' : '')
   + '</div></details>';
}
var ED_TYPES = {
  mc:    {q:'Type the question.', a:'Correct answer', ah:'', list:'Wrong choices (one per line, 1 to 4)', lh:''},
  fill:  {q:'Type ___ (three underscores) where the answer goes.', a:'Answer', ah:'Put each accepted answer on its own line (for example: sun, then sunlight on the next line).', list:null},
  short: {q:'Type the question.', a:'Model answer', ah:'Students compare their own answer with this. It is not marked right or wrong.', list:null},
  match: {q:'Type the directions, e.g. Match each word to its meaning.', a:null, list:'Pairs, one per line, written left = right (2 to 8)', lh:'Example: roots = take in water'},
  order: {q:'Type the directions, e.g. Put the events in order.', a:null, list:'Items in the CORRECT order, one per line (2 to 8)', lh:'They are shuffled on the worksheet.'}
};
function edTypeChanged(sel){
  var f = sel.closest('.ed-form'), cfg = ED_TYPES[sel.value];
  f.querySelector('.ed-q-hint').textContent = cfg.q;
  f.querySelector('.ed-a-wrap').hidden = !cfg.a;
  if(cfg.a){ f.querySelector('.ed-a-label').textContent = cfg.a; f.querySelector('.ed-a-hint').textContent = cfg.ah; }
  f.querySelector('.ed-list-wrap').hidden = !cfg.list;
  if(cfg.list){ f.querySelector('.ed-list-label').textContent = cfg.list; f.querySelector('.ed-list-hint').textContent = cfg.lh || ''; }
  f.querySelector('.ed-msg').textContent = '';
}
function edAdd(btn){
  var f = btn.closest('.ed-form'), modId = f.dataset.mod, type = f.querySelector('.ed-type').value;
  var q = f.querySelector('.ed-q').value.trim(), a = f.querySelector('.ed-a').value.trim();
  var lines = f.querySelector('.ed-list').value.split('\n').map(function(s){ return s.trim(); }).filter(Boolean);
  var msg = f.querySelector('.ed-msg');
  function fail(m){ msg.className = 'ed-msg no'; msg.textContent = m; }
  function uniq(arr){ var seen = {}; return arr.every(function(x){ var k = wNorm(x); if(seen[k]) return false; seen[k] = 1; return true; }); }
  if(!q) return fail('Type the question first.');
  var spec = {t:type, custom:true};
  if(type==='mc'){
    if(!a) return fail('Type the correct answer.');
    if(lines.length<1 || lines.length>4) return fail('Give 1 to 4 wrong choices, one per line.');
    if(!uniq([a].concat(lines))) return fail('Every choice must be different.');
    var pos = hashStr(q) % (lines.length+1), opts = lines.map(esc);
    opts.splice(pos, 0, esc(a));
    spec.q = esc(q); spec.opts = opts; spec.ans = pos;
  } else if(type==='fill'){
    var n = q.split('___').length-1;
    if(n!==1) return fail('Put exactly one ___ (three underscores) where the answer goes.');
    var alts = a.split('\n').map(function(s){ return s.trim(); }).filter(Boolean);
    if(!alts.length) return fail('Type the answer.');
    if(alts.some(function(x){ return !wNorm(x); })) return fail('An answer cannot be only punctuation, because answers are checked without end marks. Ask for the mark by name, or use multiple choice.');
    spec.q = esc(q); spec.a = alts;
  } else if(type==='short'){
    if(!a) return fail('Type a model answer.');
    spec.q = esc(q); spec.model = esc(a);
  } else if(type==='match'){
    var pairs = lines.map(function(l){ var i = l.indexOf('='); return i<1 ? null : [l.slice(0,i).trim(), l.slice(i+1).trim()]; });
    if(pairs.some(function(pr){ return !pr || !pr[0] || !pr[1]; })) return fail('Write every line as left = right.');
    if(pairs.length<2 || pairs.length>8) return fail('Give 2 to 8 pairs.');
    if(!uniq(pairs.map(function(x){ return x[0]; })) || !uniq(pairs.map(function(x){ return x[1]; }))) return fail('Each left item and each right item must be different.');
    spec.q = esc(q); spec.pairs = pairs.map(function(pr){ return [esc(pr[0]), esc(pr[1])]; });
  } else if(type==='order'){
    if(lines.length<2 || lines.length>8) return fail('Give 2 to 8 items, one per line.');
    if(!uniq(lines)) return fail('Every item must be different.');
    spec.q = esc(q); spec.items = lines.map(esc);
  }
  (CUSTOM[modId] = CUSTOM[modId] || []).push(spec);
  saveCustom();
  renderModule(modId);
  var nf = document.querySelector('#mod-'+modId+' .ed-form');
  nf.closest('details').open = true;
  nf.querySelector('.ed-msg').className = 'ed-msg ok';
  nf.querySelector('.ed-msg').textContent = 'Added as question '+PROBS[modId].length+'.';
  updateProgressPanel();
}
function edRemove(modId, ci){
  var base = TOPIC_BY_ID[modId].problems.length;
  // the removed question's saved answers, and those of later added questions, no longer line up
  Object.keys(studentState.results).concat(Object.keys(studentState.inputs), Object.keys(studentState.selections)).forEach(function(k){
    var parts = k.split(':');
    if(parts[0]===modId && +parts[1]>=base+ci){ delete studentState.results[k]; delete studentState.inputs[k]; delete studentState.selections[k]; }
  });
  saveStudentState();
  CUSTOM[modId].splice(ci, 1);
  saveCustom();
  renderModule(modId);
  document.querySelector('#mod-'+modId+' details').open = true;
  updateProgressPanel();
}

// ═══════════════════════════════════════════════
// DATA CHECKS - run on load; any problem is logged as a console error (the checker fails on it)
// ═══════════════════════════════════════════════
function validateTopics(){
  var errs = [], ids = {};
  // exact text (spacing aside): options that differ only in a capital or an end mark are allowed
  function dup(arr){ var s = {}; return arr.some(function(x){ var k = stripTags(x).replace(/\s+/g,' ').trim(); if(s[k]) return true; s[k] = 1; return false; }); }
  TOPICS.forEach(function(t){
    if(ids[t.id]) errs.push(t.id+': duplicate topic id'); ids[t.id] = 1;
    if(!/^[a-z0-9_]+$/.test(t.id)) errs.push(t.id+': id must be lowercase letters, digits, _');
    if(!bandOf(t.band)) errs.push(t.id+': unknown band');
    if(SUBJECT_GROUPS[t.subj] && !groupOf(t)) errs.push(t.id+': unknown branch');
    if(!MODULE_VIDEOS[t.id]) errs.push(t.id+': no help video');
    t.problems.forEach(function(p, i){
      var w = t.id+' #'+(i+1)+' ('+p.t+'): ';
      if(!TYPE_LABEL[p.t]) errs.push(w+'unknown type');
      if(p.t==='fill'){
        var n = p.q.split('___').length-1, b = fillBlanks(p);
        if(!n || n!==b.length) errs.push(w+'___ count does not match answers');
        b.forEach(function(x){ if(!x || !x.length) errs.push(w+'empty answer list'); else x.forEach(function(a){ if(!wNorm(a)) errs.push(w+'answer "'+a+'" is only punctuation'); }); });
      }
      if(p.t==='mc'){ if(!(p.ans>=0 && p.ans<p.opts.length)) errs.push(w+'answer index out of range'); if(dup(p.opts)) errs.push(w+'duplicate options'); }
      if(p.t==='match'){ if(dup(p.pairs.map(function(x){ return x[0]; })) || dup(p.pairs.map(function(x){ return x[1]; }))) errs.push(w+'duplicate match items'); if(p.pairs.length>LETTERS.length) errs.push(w+'too many pairs'); }
      if(p.t==='order' && (dup(p.items) || p.items.length<2)) errs.push(w+'order items must be 2+ and unique');
      if(p.t==='label'){
        var d = DIAGRAMS[p.diagram];
        if(!d) errs.push(w+'unknown diagram');
        else if(d.spots.length!==p.parts.length) errs.push(w+'parts do not match the diagram spots');
        if(dup(p.parts.concat(p.bank||[]))) errs.push(w+'duplicate label names');
      }
      if(p.t==='short' && !p.model) errs.push(w+'no model answer');
      (p.steps||[]).forEach(function(s, si){
        if(!(s.a>=0 && s.a<s.c.length)) errs.push(w+'step '+(si+1)+' answer out of range');
        if(dup(s.c)) errs.push(w+'step '+(si+1)+' duplicate choices');
      });
    });
  });
  return errs;
}

// ═══════════════════════════════════════════════
// FOCUSED-APP URL CONFIG (one file -> several Arcade tiles), as in the math app
//   ?subjects=science,history   show only these subjects
//   ?title=Science%20Worksheets override the app/tab title
// ═══════════════════════════════════════════════
(function applyUrlConfig(){
  var params = new URLSearchParams(location.search);
  var subj = params.get('subjects');
  if(subj){
    var keep = subj.split(',').map(function(s){ return s.trim().toLowerCase(); }).filter(function(k){ return SUBJECTS[k]; });
    if(keep.length) Object.keys(SUBJECTS).forEach(function(k){ if(keep.indexOf(k)===-1) delete SUBJECTS[k]; });
  }
  var title = params.get('title');
  if(title){ document.title = title; document.getElementById('app-title').textContent = title; }
})();

(function init(){
  var errs = validateTopics();
  if(errs.length) console.error('Worksheet data problems:\n'+errs.join('\n'));
  loadStudentState();
  renderSubjectBar();
  renderAllModules();
  var last = null;
  try{ last = localStorage.getItem(LAST_STORAGE); }catch(e){}
  var t = last && TOPIC_BY_ID[last];
  if(t && SUBJECTS[t.subj]) switchModule(last);
  else switchSubject(SUBJECT_INFO.filter(function(s){ return SUBJECTS[s.id]; })[0].id);
})();
</script>
