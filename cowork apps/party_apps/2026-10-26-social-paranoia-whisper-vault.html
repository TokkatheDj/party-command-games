<!-- CONCEPT: SECRET QUESTION, PUBLIC ANSWER - "Whisper Vault": a pass-the-phone take on the party game Paranoia. The Asker privately picks a pointed "who here would..." question, the phone goes to the Answerer, who secretly reads it and names someone OUT LOUD; the named player then guesses which question it was from a lineup of decoys (right = points and the question is revealed), and if they miss, a big coin flip decides whether the room ever learns the question or it is locked in the Vault forever. Twist cards (Two Names, Wide/Narrow Lineup, Loaded Coin, Heavy Lid, Freestyle), pay-to-reveal, double-points final lap, awards, resumable saves | Players: 4-12 | ~15-30 min -->

  flip: () => { for (let i = 0; i < 12; i++) tone(1400 + (i % 3) * 200, 0.04, 'square', 0.04, i * 0.13); },
  reveal: () => [784, 988, 1175, 1568].forEach((f, i) => tone(f, 0.22, 'sine', 0.13, i * 0.08)),
  vault: () => { tone(90, 0.4, 'square', 0.12); tone(70, 0.5, 'square', 0.1, 0.15); tone(1200, 0.05, 'triangle', 0.08, 0.5); }
};

/* ---------- save ---------- */
function save() { try { if (S && S.phase !== 'end') localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
function loadSave() { try { const s = JSON.parse(localStorage.getItem(KEY) || 'null'); return s && s.v === 1 && s.players ? s : null; } catch (e) { return null; } }
function clearSave() { try { localStorage.removeItem(KEY); } catch (e) {} }
function savePrefs() { try { localStorage.setItem(PREF, JSON.stringify(prefs)); } catch (e) {} }
window.addEventListener('pagehide', save);

/* ---------- game logic ---------- */
function enabledTiers() { return TIERS.map(t => t.k).filter(k => S.settings.tiers[k]); }
function drawQs(k, exclude = []) {
  const tiers = enabledTiers();
  let pool = ALLQ.filter(q => tiers.includes(q.tier) && !exclude.includes(q.id));
  let fresh = pool.filter(q => !S.used.includes(q.id));
  if (fresh.length < k) { S.used = S.used.filter(id => exclude.includes(id)); fresh = pool.filter(q => !S.used.includes(q.id)); }
  return shuffle(fresh.slice()).slice(0, k).map(q => q.id);
}
function newGame(names, opts) {
  S = {
    v: 1, phase: 'passAsk', turn: 0,
    settings: JSON.parse(JSON.stringify(opts)),
    players: names.map(n => ({ name: n, pts: 0, named: 0, right: 0, wrong: 0, myst: 0, vaults: 0, buys: 0 })),
    used: [], vault: [], log: [], cur: null
  };
  S.total = S.players.length * S.settings.laps;
  startTurn();
}
function pickTwist() {
  if (!S.settings.twists || S.turn === 0) return 'classic';
  const n = S.players.length, bag = [];
  for (const [k, t] of Object.entries(TWISTS)) { if (t.min && n < t.min) continue; for (let i = 0; i < t.w; i++) bag.push(k); }
  return bag[Math.floor(Math.random() * bag.length)];
}
function startTurn() {
  const n = S.players.length, asker = S.turn % n;
  const tw = pickTwist();
  S.cur = {
    asker, answerer: (asker + 1) % n, twist: tw,
    mult: S.turn >= S.total - n ? 2 : 1,
    options: drawQs(3), redeals: 1, q: null, named: [], lineup: [], real: -1,
    gi: 0, guesses: [], struck: [], outcome: null, coin: null, deltas: []
  };
  ui = { sel: [], askMode: tw === 'free' ? 'write' : 'cards', draft: '', drumDone: false, flipping: false, vaultShown: false };
  S.phase = 'passAsk';
}
function addPts(i, v, why) {
  S.players[i].pts += v;
  S.cur.deltas.push({ p: i, v, why });
}
function chooseQ(id) {
  const q = QBYID[id]; if (!q) return;
  S.cur.q = { t: q.t, tier: q.tier, id: q.id };
  S.used.push(q.id);
  S.phase = 'passAnswer';
}
function customQ(text) {
  let t = text.replace(/\s+/g, ' ').trim().slice(0, 140);
  if (t.length < 6) return false;
  if (!/[?!.]$/.test(t)) t += '?';
  t = t[0].toUpperCase() + t.slice(1);
  S.cur.q = { t, tier: null, id: null };
  S.phase = 'passAnswer';
  return true;
}
function lockAnswer(sel) {
  const c = S.cur;
  c.named = sel.slice();
  c.named.forEach(i => S.players[i].named++);
  // build the lineup: the real question + decoys from the same tier where possible
  const size = lineupSize(c.twist);
  const ex = c.q.id ? [c.q.id] : [];
  let pool = ALLQ.filter(q => !ex.includes(q.id) && q.t !== c.q.t && (c.q.tier ? q.tier === c.q.tier : S.settings.tiers[q.tier]));
  if (pool.length < size - 1) pool = ALLQ.filter(q => !ex.includes(q.id) && q.t !== c.q.t);
  const decoys = shuffle(pool.slice()).slice(0, size - 1).map(q => q.t);
  const lineup = shuffle([c.q.t, ...decoys]);
  c.lineup = lineup; c.real = lineup.indexOf(c.q.t);
  c.gi = 0; c.guesses = []; c.struck = [];
  S.phase = 'layDown';
}
function makeGuess(idx) {
  const c = S.cur, who = c.named[c.gi], ok = idx === c.real;
  c.guesses.push({ p: who, i: idx, ok });
  if (ok) {
    S.players[who].right++;
    addPts(who, guessPts(c.twist) * c.mult, 'guessed the question');
    addPts(c.answerer, 1 * c.mult, 'gave a readable answer');
    c.outcome = 'guessed';
  } else {
    S.players[who].wrong++;
    c.struck.push(idx);
  }
  S.phase = 'guessResult';
}
function afterGuess() {
  const c = S.cur;
  if (c.outcome === 'guessed') { S.phase = 'outcome'; return; }
  if (c.gi + 1 < c.named.length) { c.gi++; S.phase = 'lineup'; return; }
  // nobody cracked it: the Asker's question stayed a mystery
  S.players[c.asker].myst++;
  addPts(c.asker, 1 * c.mult, 'question stayed a mystery');
  S.phase = 'coin';
}
function buyReveal(i) {
  const c = S.cur;
  if (S.players[i].pts < BUY_COST || c.coin) return;
  S.players[i].buys++;
  addPts(i, -BUY_COST, 'paid to see the question');
  c.outcome = 'bought'; c.buyer = i;
  S.phase = 'outcome';
}
function flipCoin() {
  const c = S.cur;
  if (c.coin) return c.coin;
  c.coin = Math.random() < revealOdds(c.twist) ? 'reveal' : 'vault';
  c.outcome = c.coin === 'reveal' ? 'flipReveal' : 'flipVault';
  if (c.coin === 'vault') {
    S.players[c.asker].vaults++;
    S.vault.push({ t: c.q.t, asker: c.asker, answerer: c.answerer, named: c.named.slice() });
  }
  return c.coin;
}
function endTurn() {
  const c = S.cur;
  S.log.push({ t: c.q.t, asker: c.asker, answerer: c.answerer, named: c.named, outcome: c.outcome });
  S.turn++;
  if (S.turn >= S.total) { S.phase = 'end'; ui.vaultShown = false; }
  else startTurn();
}
function standings() {
  return S.players.map((p, i) => ({ ...p, i })).sort((a, b) => b.pts - a.pts || b.right - a.right || a.i - b.i);
}
function awards() {
  const out = [], P = S.players;
  const best = (key, min = 1) => {
    const m = Math.max(...P.map(p => p[key]));
    if (m < min) return null;
    return P.filter(p => p[key] === m).map(p => p.name).join(' & ');
  };
  let w;
  if ((w = best('named'))) out.push({ ic: '🎯', t: "Room's Favourite Target", d: `${w} got named the most.` });
  if ((w = best('right'))) out.push({ ic: '🧠', t: 'Mind Reader', d: `${w} cracked the most questions.` });
  if ((w = best('myst'))) out.push({ ic: '🗿', t: 'The Sphinx', d: `${w} asked the most unguessable questions.` });
  if ((w = best('vaults'))) out.push({ ic: '🔐', t: 'Vault Keeper', d: `${w} locked the most secrets away.` });
  if ((w = best('buys'))) out.push({ ic: '💸', t: 'Too Curious', d: `${w} paid to peek the most.` });
  return out;
}
/* ---------- rendering ---------- */
let phase = 'home';    // UI phase when no game is running
let drumTimer = null, flipTimer = null;
const curPhase = () => (S && phase === 'game') ? S.phase : phase;

function statusBar() {
  const c = S.cur, tw = TWISTS[c.twist];
  return `<div class="status"><span>Turn ${S.turn + 1} of ${S.total}${c.mult > 1 ? ' · <b style="color:var(--gold)">FINAL LAP ×2</b>' : ''}</span>
    <span class="pill">${tw.icon} ${esc(tw.name)}</span></div>
    <div class="prog"><i style="width:${(S.turn / S.total) * 100}%"></i></div>`;
}
function twistCard() {
  const tw = TWISTS[S.cur.twist];
  return `<div class="card twist"><div class="ic">${tw.icon}</div><div><b>${esc(tw.name)}</b><span class="muted small">${esc(tw.desc)}${S.cur.mult > 1 ? ' Final lap: every point doubled!' : ''}</span></div></div>`;
}
function deltaList(deltas) {
  const agg = {};
  deltas.forEach(d => { (agg[d.p] = agg[d.p] || []).push(d); });
  const keys = Object.keys(agg);
  if (!keys.length) return '<p class="muted center">No points changed hands this turn.</p>';
  return '<div class="deltas">' + keys.map(k => {
    const ds = agg[k], v = ds.reduce((s, d) => s + d.v, 0);
    return `<div class="delta"><span><b>${esc(pname(+k))}</b> <span class="muted small">${esc(ds.map(d => d.why).join(', '))}</span></span><span class="v ${v < 0 ? 'neg' : ''}">${v > 0 ? '+' : ''}${v}</span></div>`;
  }).join('') + '</div>';
}
function scoreTable() {
  const st = standings(), lead = st[0].pts;
  return '<table class="sb">' + st.map((p, r) => `<tr class="${p.pts === lead && lead > 0 ? 'lead' : ''}"><td class="n">${r + 1}</td><td class="nm"><b>${esc(p.name)}</b><br><span class="muted small">named ${p.named}× · cracked ${p.right}</span></td><td class="p">${p.pts}</td></tr>`).join('') + '</table>';
}
const btn = (act, label, cls = '', arg = '', dis = false) => `<button class="btn ${cls}" data-act="${act}"${arg !== '' ? ` data-arg="${esc(arg)}"` : ''}${dis ? ' disabled' : ''}>${label}</button>`;

function render() {
  const p = curPhase(), m = $('main'), f = $('foot');
  const inGame = phase === 'game' && S;
  $('bScores').hidden = !inGame;
  $('bMenu').hidden = !inGame;
  $('bMute').textContent = prefs.muted ? '🔇' : '🔊';
  clearTimeout(drumTimer);
  const V = VIEWS[p] || VIEWS.home;
  const out = V();
  m.innerHTML = out.main;
  f.innerHTML = out.foot || '';
  m.scrollTop = 0;
  if (out.after) out.after();
}

      main: statusBar() + top + `<div class="card"><b>This turn</b>${deltaList(c.deltas)}</div>`,
      foot: btn('next', last ? 'Final results' : 'Next turn'),
      after: c.outcome === 'flipVault' ? null : (c.outcome === 'guessed' ? null : sfx.reveal)
    };
  },
  end() {
    const st = standings(), top1 = st[0].pts, winners = st.filter(p => p.pts === top1).map(p => p.name);
    const aw = awards();
    const vaultHtml = S.vault.length
      ? (S.settings.vaultOpen
          ? (ui.vaultShown
              ? `<div class="vaultlist">${S.vault.map(v => `<div class="card"><b>${esc(v.t)}</b><br><span class="muted small">${esc(pname(v.answerer))} said ${v.named.map(i => esc(pname(i))).join(' & ')} · asked by ${esc(pname(v.asker))}</span></div>`).join('')}</div>`
              : btn('openVault', `🔓 Open the Vault (${S.vault.length})`, 'gold block'))
          : `<p class="muted">${S.vault.length} secret${S.vault.length === 1 ? '' : 's'} stay locked forever. What's in the vault stays in the vault.</p>`)
      : '<p class="muted">The vault is empty. Every secret came out!</p>';
    return {
      main: `<h1 class="big" style="font-size:clamp(30px,9vw,48px)">${top1 > 0 ? 'Winner' + (winners.length > 1 ? 's' : '') : 'Game over'}</h1>
        <p class="center" style="font-size:22px;font-weight:900;color:var(--gold);margin-top:0">${winners.map(esc).join(' & ')}</p>
        <div class="card">${scoreTable()}</div>
        ${aw.length ? `<div class="card"><b>Awards</b>${aw.map(a => `<div class="award" style="margin-top:10px"><div class="ic">${a.ic}</div><div><b>${esc(a.t)}</b><span class="muted small">${esc(a.d)}</span></div></div>`).join('')}</div>` : ''}
        <div class="card"><b>🔐 The Vault</b>${vaultHtml}</div>`,
      foot: btn('quitHome', 'Home', 'alt') + btn('again', 'Play again'),
      after: () => { clearSave(); sfx.good(); }
    };
  }
};

/* ---------- overlays ---------- */
function openOverlay(html) { $('ovBody').innerHTML = html; $('ov').hidden = false; }
function closeOverlay() { $('ov').hidden = true; $('ovBody').innerHTML = ''; }
$('ov').addEventListener('click', e => { if (e.target.id === 'ov') closeOverlay(); });

/* ---------- actions ---------- */
function go(p) { S.phase = p; save(); render(); }
const ACT = {
  mute() { prefs.muted = !prefs.muted; savePrefs(); $('bMute').textContent = prefs.muted ? '🔇' : '🔊'; },
  scores() { if (!S) return; openOverlay(`<h2 style="margin-top:0">Scores</h2><p class="muted small">Turn ${Math.min(S.turn + 1, S.total)} of ${S.total} · ${S.vault.length} in the vault</p>${scoreTable()}${btn('close', 'Close', 'block')}`); },
  menu() {
    openOverlay(`<h2 style="margin-top:0">Paused</h2><p class="muted small">Your game saves automatically.</p>
      ${btn('close', 'Back to the game', 'block')}${btn('endNow', 'End game now & see results', 'alt block')}${btn('quitHome', 'Quit to home (keep save)', 'alt block')}${btn('abandon', 'Abandon this game', 'alt block')}`);
  },
  close() { closeOverlay(); },
  setup() { closeOverlay(); phase = 'setup'; render(); },
  home() { phase = 'home'; render(); },
  quitHome() { closeOverlay(); if (S && S.phase !== 'end') save(); S = null; phase = 'home'; render(); },
  abandon() { closeOverlay(); clearSave(); S = null; phase = 'home'; render(); },
  endNow() { closeOverlay(); S.phase = 'end'; ui.vaultShown = false; render(); },
  resume() {
    const sv = loadSave(); if (!sv) { render(); return; }
    S = sv; phase = 'game';
    ui = { sel: [], askMode: S.cur && S.cur.twist === 'free' ? 'write' : 'cards', draft: '', drumDone: false, flipping: false, vaultShown: false };
    // never resume onto a private screen: step back to the hand-over
    if (S.phase === 'ask') S.phase = 'passAsk';
    if (S.phase === 'answer') S.phase = 'passAnswer';
    if (S.phase === 'announce') ui.drumDone = true;
    if (S.phase === 'coin' && S.cur.coin) S.phase = 'outcome';
    render();
  },
  addName() { if (setupNames.length < 12) { setupNames.push(''); render(); const ins = document.querySelectorAll('[data-name]'); ins[ins.length - 1].focus(); } },
  delName(a) { if (setupNames.length > 4) { setupNames.splice(+a, 1); render(); } },
  opt(a) { const [k, v] = a.split(':'); setupOpts[k] = v === 'true' ? true : v === 'false' ? false : +v; render(); },
  tier(k) {
    const t = setupOpts.tiers; t[k] = !t[k];
    if (!t.mild && !t.cheeky && !t.wild) t[k] = true;
    render();
  },
  start() {
    const seen = {};
    const names = setupNames.map((n, i) => {
      let s = n.replace(/\s+/g, ' ').trim() || `Player ${i + 1}`;
      const base = s; let k = 2;
      while (seen[s.toLowerCase()]) s = `${base} ${k++}`;
      seen[s.toLowerCase()] = 1; return s;
    });
    prefs.lastNames = setupNames.map(n => n.trim()); savePrefs();
    newGame(names, setupOpts); phase = 'game'; save(); sfx.hush(); render();
  },
  showAsk() { ui.pick = null; go('ask'); },
  pickQ(id) { ui.pick = id; sfx.tap(); render(); },
  redeal() {
    const c = S.cur; if (!c.redeals) return;
    c.redeals = 0; c.options = drawQs(3, c.options); ui.pick = null; save(); render();
  },
  askMode(m) { ui.askMode = m; ui.pick = null; render(); if (m === 'write') { const d = $('draft'); if (d) d.focus(); } },
  lockQ() {
    if (ui.askMode === 'write') { if (!customQ(ui.draft)) return; }
    else { if (!ui.pick) return; chooseQ(ui.pick); }
    ui.pick = null; ui.draft = ''; sfx.hush(); save(); render();
  },
  showAnswer() { ui.sel = []; go('answer'); },
  selName(a) {
    const i = +a, need = S.cur.twist === 'two' ? 2 : 1;
    if (ui.sel.includes(i)) ui.sel = ui.sel.filter(x => x !== i);
    else { ui.sel.push(i); if (ui.sel.length > need) ui.sel.shift(); }
    sfx.tap(); render();
  },
  lockA() {
    const need = S.cur.twist === 'two' ? 2 : 1;
    if (ui.sel.length !== need) return;
    lockAnswer(ui.sel); ui.sel = []; save(); render();
  },
  drum() { ui.drumDone = false; go('announce'); },
  toLineup() { ui.pick = null; go('lineup'); },
  pickG(a) { const i = +a; if (S.cur.struck.includes(i)) return; ui.pick = i; sfx.tap(); render(); },
  guess() { if (ui.pick === null || ui.pick === undefined) return; makeGuess(ui.pick); ui.pick = null; save(); render(); },
  afterGuess() { afterGuess(); ui.pick = null; save(); render(); },
  buy(a) { if (ui.flipping) return; buyReveal(+a); save(); render(); },
  flip() {
    if (ui.flipping) return;
    ui.flipping = true;
    const res = flipCoin(); save();
    document.querySelectorAll('#foot button, #main .btn').forEach(b => b.disabled = true);
    const coin = $('coin'), cw = $('cw');
    sfx.flip();
    if (coin && cw) {
      const deg = 360 * 5 + (res === 'vault' ? 180 : 0);
      cw.classList.add('toss');
      requestAnimationFrame(() => requestAnimationFrame(() => { coin.style.transform = `rotateY(${deg}deg)`; }));
    }
    flipTimer = setTimeout(() => {
      ui.flipping = false;
      if (!S || phase !== 'game' || S.phase !== 'coin') return;
      res === 'vault' ? sfx.vault() : null;
      go('outcome');
    }, 2100);
  },
  next() { endTurn(); save(); render(); },
  openVault() { ui.vaultShown = true; sfx.reveal(); render(); },
  again() {
    const names = S.players.map(p => p.name), opts = S.settings;
    newGame(names, opts); phase = 'game'; save(); render();
  }
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const f = ACT[el.dataset.act];
  if (f) { ac(); f(el.dataset.arg); }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset && t.dataset.name !== undefined) setupNames[+t.dataset.name] = t.value;
  if (t.id === 'draft') {
    ui.draft = t.value;
    const b = document.querySelector('#foot [data-act="lockQ"]');
    if (b) b.disabled = ui.draft.trim().length < 6;
  }
});

render();
</script>
</body>
</html>
