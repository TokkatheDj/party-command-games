<!-- CONCEPT: MEMORY/CUMULATIVE CHAIN - "Pack Rat": the classic "I packed my suitcase..." game with the phone as referee. A trip is dealt ("a pirate voyage"), each player recites the WHOLE packing list from memory out loud and then adds one new item; the phone always sits with the previous packer, who judges the recital item-by-item against a shrinking per-item timer, then hands it over so the reciter can type their new item and judge the next person. Rule cards bend what you may pack (Alphabet order, Letter Link, Two Words, Colour It - checked by the app), optional Moves give every item a gesture you must perform as you say it, and surprise Customs events force a BACKWARDS recital, confiscate a bag mid-list (Lost Luggage) or halve the clock. 64 trips, 150+ idea items | Players: 3-10 | ~15-25 min -->
<!DOCTYPE html>
<html lang="en">

<style>

<div id="app">
  <div class="top">
    <div class="logo"><span>🧳</span> <span class="grad">Pack Rat</span></div>
    <div class="sp"></div>

<div id="overlay"><div class="card" id="ovCard"></div></div>
<canvas class="confetti" id="confetti"></canvas>
<script>
'use strict';
// ---------- content ----------
const TRIPS = [
  ['🌕','a holiday on the Moon'],['🏴‍☠️','a pirate voyage'],['🏰','a sleepover in a haunted castle'],['🦕','a dinosaur safari'],
  ['🐠','a week in an underwater hotel'],['🎅','a trip to the North Pole'],['🏝️','getting stranded on a desert island'],['🌴','a jungle expedition'],
  ['🧙','the first day at wizard school'],['🛰️','a month on a space station'],['🎪','touring with the circus'],['🐉','visiting a dragon’s cave'],
  ['🏺','time-travelling to Ancient Egypt'],['👑','a royal ball at the palace'],['⛺','camping in the woods'],['🔴','the first trip to Mars'],
  ['🌊','a submarine dive'],['🌋','a picnic next to a volcano'],['🦸','superhero training camp'],['❄️','the great snowball war'],
  ['👵','a weekend at Grandma’s house'],['🤖','a tour of a robot factory'],['🌳','living in a treehouse'],['🎈','a hot-air balloon ride'],
  ['🤠','a trip to the Wild West'],['🕶️','a top-secret spy mission'],['🏖️','a day at the beach'],['👾','hiding in a monster-proof bunker'],
  ['🦄','a unicorn ranch'],['🚐','a road trip across the country'],['🦁','a school trip to the zoo'],['🥷','a week at ninja school'],
  ['☁️','a visit to the cloud kingdom'],['🍳','cooking in a giant’s kitchen'],['🐜','shrinking to the size of an ant'],['👽','an alien planet exchange trip'],
  ['🛡️','a knight’s quest'],['🧊','a night in an igloo'],['🦜','a rainforest canopy sleepover'],['🔺','exploring a lost pyramid'],
  ['🍕','a trip to Pizza Planet'],['🍫','a chocolate factory tour'],['🦑','a sea monster hunt'],['⛵','sailing with the Vikings'],
  ['🧞','a magic carpet ride'],['🏅','competing in the Olympics'],['🎸','going on tour with a rock band'],['🎤','the school talent show'],
  ['🐶','a birthday party for a dog'],['👻','a night on a ghost ship'],['🍭','a trip to the Candy Kingdom'],['🐧','visiting a penguin colony'],
  ['🎩','a fancy secret-agent gala'],['🌍','a journey to the centre of the Earth'],['🗼','a night in a lighthouse'],['🐄','a cowboy cattle drive'],
  ['🏛️','a sleepover in a museum'],['🚂','a train ride across the mountains'],['🧜','a mermaid lagoon'],['🎮','getting sucked into a video game'],
  ['🥚','rescuing a dragon egg'],['🎃','the spookiest Halloween party'],['🚀','a rocket race around the Sun'],['🏕️','summer camp on a haunted lake']
];
const RULES = [
  {id:'free',ic:'🎒',t:'Free Pack',d:'Pack anything at all - as long as the room agrees it fits the trip.'},
  {id:'abc',ic:'🔤',t:'Alphabet Order',d:'Each new item starts with the next letter: A, then B, then C…'},
  {id:'link',ic:'🔗',t:'Letter Link',d:'Each new item must start with the LAST letter of the item before it.'},
  {id:'two',ic:'✌️',t:'Two Words',d:'Every item must be exactly two words - “purple socks”, “rubber duck”.'},
  {id:'one',ic:'☝️',t:'One Word Only',d:'Every item is a single word. No “a”, no “the”, just the thing.'},
  {id:'col',ic:'🎨',t:'Colour It',d:'Every item must include a colour - “green slime”, “a golden ticket”.'}
];
const COLOURS = ['red','orange','yellow','green','blue','purple','pink','black','white','gold','golden','silver','brown','grey','gray','rainbow','violet','turquoise','crimson','navy','teal','lime','scarlet','beige','bronze','indigo','maroon','tan','cream','ruby','emerald'];
const MOVES = [['👏','clap'],['🙌','hands up'],['👃','touch your nose'],['🦶','stomp'],['🫡','salute'],['😉','wink'],['🤷','shrug'],['👍','thumbs up'],['🙆','hands on head'],['👉','point at someone'],['💃','wiggle'],['🐔','flap your elbows']];
const EVENTS = [
  {id:'back',ic:'🔄',t:'Backwards Check!',d:'Customs wants it in reverse. Recite the list from the NEWEST item back to the FIRST. Every item scores double.'},
  {id:'lost',ic:'🧦',t:'Lost Luggage!',d:''},
  {id:'fast',ic:'⚡',t:'Speed Check!',d:'The clock runs twice as fast this turn. Every item scores double.'}
];
const IDEAS = ('apple,accordion,alarm clock,anchor,astronaut helmet,avocado,backpack,banana,balloon,beach ball,binoculars,blanket,boots,bubble wrap,bucket,cactus,camera,candle,canoe,cape,carrot,castle,cheese,chopsticks,compass,cookies,crown,cupcake,dice,dinosaur egg,disco ball,dog bone,donut,drum,duck,earmuffs,egg,elephant,envelope,eraser,fan,feather,fishing rod,flag,flashlight,flute,football,fork,frog,frying pan,garden gnome,giraffe,glitter,glove,goggles,guitar,hairbrush,hammock,harmonica,hat,helmet,honey,hula hoop,ice cream,ice skates,igloo kit,inflatable shark,ink,jacket,jam,jellybeans,jetpack,jigsaw,juice box,jumper,kazoo,kettle,key,kite,kiwi,koala,ladder,lamp,lemon,lollipop,lunchbox,magnet,map,marbles,marshmallows,mittens,mop,muffin,nachos,napkin,necklace,net,noodles,notebook,octopus,onion,orange,oven mitt,owl,paddle,pancakes,parrot,peanuts,pencil,pickle,pillow,pineapple,pizza,popcorn,potato,pumpkin,puppet,quilt,queen’s crown,quiche,rabbit,radio,raincoat,rope,rubber duck,ruler,sandwich,scarf,shovel,skateboard,sleeping bag,snorkel,socks,spoon,sunglasses,sunscreen,sword,teapot,teddy bear,telescope,tent,toaster,toothbrush,torch,trampoline,trumpet,tuba,umbrella,unicycle,ukulele,vacuum,violin,volcano,waffle,wagon,walrus,watermelon,whistle,wig,xylophone,x-ray goggles,yak,yo-yo,yoghurt,zebra,zipper,zucchini,red balloon,blue jeans,golden ticket,pink flamingo,green slime,purple crayon,silver spoon,yellow raincoat,orange cone,black top hat,white slippers,rainbow wig,brown bear,grey pillow,gold coins,teal teapot,navy socks').split(',');

// ---------- state ----------
const LS = 'cowork-packrat-';
const load = (k, d) => { try { const v = JSON.parse(localStorage.getItem(LS + k)); return v ?? d; } catch (e) { return d; } };
const save = (k, v) => { try { localStorage.setItem(LS + k, JSON.stringify(v)); } catch (e) {} };
let names = load('players', ['Alex', 'Sam', 'Jo', 'Riley']);
if (!Array.isArray(names) || names.length < 3) names = ['Alex', 'Sam', 'Jo', 'Riley'];
const settings = Object.assign({ pace: 'normal', moves: true, rules: true, events: true, trips: 3 }, load('settings', {}));
const PACE = { relaxed: 8, normal: 5, frantic: 3 };
const MAX_CHAIN = 25;

let G = null;        // game
let phase = 'home';
let rafId = 0;
const $ = id => document.getElementById(id);
const stage = $('stage');
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = a => a[Math.floor(Math.random() * a.length)];

// ---------- audio ----------
let AC = null;
function ac() { if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } } if (AC.state === 'suspended') AC.resume(); return AC; }
function tone(f, d = 0.12, type = 'sine', vol = 0.18, when = 0, slide = 0) {
  const a = ac(); if (!a) return;
  const t = a.currentTime + when, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + d);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t + d + 0.05);
}
const sfx = {
  tick: i => tone(440 * Math.pow(2, Math.min(i, 24) / 12), 0.1, 'triangle', 0.2),
  add: () => { tone(660, 0.1, 'triangle'); tone(990, 0.16, 'triangle', 0.18, 0.08); },
  bust: () => { tone(220, 0.5, 'sawtooth', 0.2, 0, 70); tone(160, 0.5, 'square', 0.08, 0.05, 60); },
  event: () => { tone(300, 0.25, 'sine', 0.2, 0, 900); tone(900, 0.25, 'sine', 0.15, 0.2, 300); },
  warn: () => tone(1200, 0.05, 'square', 0.06),
  fan: () => [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.25, 'triangle', 0.2, i * 0.12)),
  tap: () => tone(600, 0.05, 'sine', 0.08)
};

// ---------- game flow ----------
function newGame() {
  G = {
    players: names.map(n => ({ name: n, score: 0, drops: 0, best: 0 })),
    tripNo: 0, trips: settings.trips,
    deck: shuffle(TRIPS.slice()),
    trip: null, turn: null, lastEvent: false, history: []
  };
  startTrip();
}
function startTrip() {
  const n = G.players.length;
  const theme = G.deck[G.tripNo % G.deck.length];
  let rule = RULES[0];
  if (settings.rules) {
    // first trip is always Free Pack so new groups learn the loop; after that deal a random rule card
    rule = G.tripNo === 0 ? RULES[0] : pick(RULES.slice(1).concat(RULES[0]));
  }
  G.trip = { ic: theme[0], name: theme[1], rule, list: [], lost: [], starter: G.tripNo % n, adder: G.tripNo % n, judge: -1, reciter: -1, abc: 0, delta: G.players.map(() => 0) };
  G.lastEvent = false;
  go('tripIntro');
}
function nextIdx(i) { return (i + 1) % G.players.length; }
function neededLetter() {
  const T = G.trip;
  if (T.rule.id === 'abc') return String.fromCharCode(65 + (T.abc % 26));
  if (T.rule.id === 'link' && T.list.length) {
    const letters = T.list[T.list.length - 1].text.toUpperCase().replace(/[^A-Z]/g, '');
    return letters ? letters[letters.length - 1] : null;
  }
  return null;
}
function wordsOf(s) { return s.trim().split(/\s+/).filter(Boolean); }
function checkItem(raw) {
  const T = G.trip, s = raw.trim().replace(/\s+/g, ' ');
  if (!s) return 'Type the item you just said out loud.';
  if (s.length > 28) return 'Keep it short - 28 letters max.';
  const norm = x => x.toLowerCase().replace(/^(a|an|the|some)\s+/, '').replace(/[^a-z0-9]/g, '');
  if (T.list.some(it => norm(it.text) === norm(s)) || T.lost.some(it => norm(it.text) === norm(s))) return 'That’s already been packed! Pick something new.';
  const L = neededLetter();
  if (L) {
    const first = s.replace(/^(a|an|the|some)\s+/i, '').toUpperCase().replace(/[^A-Z]/g, '')[0];
    if (first !== L) return `Rule card: it has to start with the letter ${L}.`;
  }
  const w = wordsOf(s.replace(/^(a|an|the|some)\s+/i, '')).length;
  if (T.rule.id === 'two' && w !== 2) return 'Rule card: exactly TWO words.';
  if (T.rule.id === 'one' && w !== 1) return 'Rule card: ONE word only.';
  if (T.rule.id === 'col' && !wordsOf(s.toLowerCase()).some(x => COLOURS.includes(x.replace(/[^a-z]/g, '')))) return 'Rule card: include a colour (red, blue, gold…).';
  return null;
}
function idea() {
  const T = G.trip, L = neededLetter();
  const packed = new Set(T.list.concat(T.lost).map(i => i.text.toLowerCase()));
  let pool = IDEAS.filter(x => !packed.has(x));
  const strip = x => x.replace(/^(a|an|the|some)\s+/i, '');
  if (L) pool = pool.filter(x => strip(x)[0].toUpperCase() === L);
  if (T.rule.id === 'two') pool = pool.filter(x => wordsOf(x).length === 2);
  if (T.rule.id === 'one') pool = pool.filter(x => wordsOf(x).length === 1);
  if (T.rule.id === 'col') pool = pool.filter(x => wordsOf(x).some(w => COLOURS.includes(w)));
  return pool.length ? pick(pool) : null;
}
function packItem(text) {
  const T = G.trip;
  const item = { text: text.trim().replace(/\s+/g, ' '), by: T.adder, move: settings.moves ? pick(MOVES) : null };
  T.list.push(item); T.abc++;
  sfx.add();
  go('added');
}
function afterAdded() {
  const T = G.trip;
  if (T.list.length >= MAX_CHAIN) { perfectTrip(); return; }
  T.judge = T.adder;
  T.reciter = nextIdx(T.adder);
  // customs event?
  let ev = null;
  if (settings.events && !G.lastEvent && T.list.length >= 4 && Math.random() < 0.3) {
    ev = pick(EVENTS);
    if (ev.id === 'lost' && T.list.length < 5) ev = EVENTS[0];
  }
  G.lastEvent = !!ev;
  G.turn = { ev: ev ? Object.assign({}, ev) : null, order: [], pos: 0, mult: 1, per: PACE[settings.pace], deadline: 0, lostItem: null, reason: '' };
  if (ev) {
    if (ev.id === 'lost') {
      const i = Math.floor(Math.random() * (T.list.length - 1));
      const gone = T.list.splice(i, 1)[0];
      T.lost.push(gone);
      G.turn.lostItem = gone;
      G.turn.ev.d = `Customs confiscated the <b>${esc(gone.text)}</b>! It’s gone for good - skip it from now on. Say it and you’re busted.`;
    }
    if (ev.id === 'back' || ev.id === 'fast') G.turn.mult = 2;
    if (ev.id === 'fast') G.turn.per = Math.max(1.5, G.turn.per / 2);
    sfx.event();
    go('event');
  } else go('handoff');
}
function startRecital() {
  const T = G.trip, t = G.turn;
  t.order = T.list.map((_, i) => i);
  if (t.ev && t.ev.id === 'back') t.order.reverse();
  t.pos = 0;
  t.deadline = performance.now() + t.per * 1000;
  go('recite');
}
function said() {
  const t = G.turn;
  if (phase !== 'recite') return;
  sfx.tick(t.pos);
  t.pos++;
  if (t.pos >= t.order.length) {
    const T = G.trip, pts = t.order.length * t.mult;
    const P = G.players[T.reciter];
    P.score += pts; T.delta[T.reciter] += pts; P.best = Math.max(P.best, t.order.length);
    t.earned = pts;
    T.adder = T.reciter;
    go('add');
  } else {
    t.deadline = performance.now() + t.per * 1000;
    renderRecite();
  }
}
function fumble(reason) {
  if (phase !== 'recite') return;
  G.turn.reason = reason;
  G.turn.left = Math.max(0, G.turn.deadline - performance.now());
  sfx.bust();
  go('fumble');
}
function undoFumble() {
  G.turn.deadline = performance.now() + Math.max(G.turn.left, 2500);
  go('recite');
}
function confirmFumble() {
  const T = G.trip, P = G.players[T.reciter];
  P.score -= 2; P.drops++; T.delta[T.reciter] -= 2;
  T.bust = { who: T.reciter, at: G.turn.order[G.turn.pos] };
  endTrip(false);
}
function perfectTrip() {
  const T = G.trip;
  G.players.forEach((p, i) => { p.score += 5; T.delta[i] += 5; });
  T.bust = null; T.perfect = true;
  endTrip(true);
}
function endTrip() {
  G.history.push({ name: G.trip.name, len: G.trip.list.length });
  go('tripEnd');
}
function nextTrip() {
  G.tripNo++;
  if (G.tripNo >= G.trips) { go('final'); return; }
  startTrip();
}

function confetti() {
  const cv = $('confetti'), cx = cv.getContext('2d');
  cv.width = innerWidth; cv.height = innerHeight;
  const cols = ['#ffcf3f', '#ff6fa8', '#4fd8c4', '#4fe07a', '#a98bff'];
  const ps = Array.from({ length: 140 }, () => ({ x: Math.random() * cv.width, y: -20 - Math.random() * cv.height, vx: (Math.random() - .5) * 2, vy: 2 + Math.random() * 3, r: Math.random() * 6, c: pick(cols), s: 4 + Math.random() * 6 }));
  const t0 = performance.now();
  const step = now => {
    cx.clearRect(0, 0, cv.width, cv.height);
    ps.forEach(p => { p.x += p.vx; p.y += p.vy; p.r += 0.1; cx.save(); cx.translate(p.x, p.y); cx.rotate(p.r); cx.fillStyle = p.c; cx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); cx.restore(); });
    if (now - t0 < 4500) cfRaf = requestAnimationFrame(step); else cx.clearRect(0, 0, cv.width, cv.height);
  };
  cancelAnimationFrame(cfRaf); cfRaf = requestAnimationFrame(step);
}
function stopConfetti() { cancelAnimationFrame(cfRaf); const cv = $('confetti'); cv.getContext('2d').clearRect(0, 0, cv.width, cv.height); }

go('home');
</script>
