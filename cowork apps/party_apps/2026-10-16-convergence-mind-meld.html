<!-- CONCEPT: CONVERGENCE/WORD ASSOCIATION - "Mind Meld": a pass-the-phone party game where two players at a time secretly lock in any word, both are revealed, then each secretly locks a word that links the two - again and again, the pair's word chains funnelling toward each other on a converging ladder until they finally say the SAME word (the app judges plurals, bans repeats and enforces rule cards); the fewer bridges it takes the more points both score, spectators bank "Called it!" bonuses, and a fast Shout Mode runs it out loud with a 3-2-1 countdown. Rotating duos so everyone melds with everyone, rule cards (Short Wire, Long Haul, E-Free Zone, Echo Letters, Spark Deal, Hot Potato, Double Down), double-points final duo, undo, resumable saves, awards | Players: 2-10 | ~15-30 min -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Mind Meld</title>
<style>
:root{
  --bg:#0c0b16; --panel:#171528; --panel2:#221f3a; --line:#34305a;
  --ink:#ece9ff; --muted:#9c97c4; --a:#ff5fa2; --b:#3ee0d0; --meld:#ffd166; --bad:#ff6b6b; --good:#7ee787;
  --r:14px; --gap:12px;
  --font:'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0; padding: 0; height: 100%; overflow: hidden;
  touch-action: manipulation;
  user-select: none; -webkit-user-select: none;
  background: radial-gradient(120% 80% at 50% 0%, #1b1636 0%, var(--bg) 60%); color: var(--ink); font-family: var(--font);
}
input { user-select: text; -webkit-user-select: text; }
#app { display:flex; flex-direction:column; height:100vh; height:100dvh; max-width:720px; margin:0 auto; }
header { display:flex; align-items:center; gap:8px; padding:10px 12px 6px; }
header h1 {
  margin:0; font-size:clamp(22px,6vw,30px); font-weight:900; letter-spacing:.5px;
  background:linear-gradient(90deg,var(--a),var(--meld),var(--b)); -webkit-background-clip:text; background-clip:text; color:transparent;
}
header .ttl { flex:1; min-width:0; }
header .sub { color:var(--muted); font-size:clamp(12px,3.2vw,14px); font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.icon { min-width:44px; height:44px; border-radius:12px; border:1px solid var(--line); background:var(--panel); color:var(--ink); font-size:18px; cursor:pointer; }
#main { flex:1; overflow-y:auto; padding:6px 14px 14px; -webkit-overflow-scrolling:touch; }
#foot { padding:10px 14px calc(12px + env(safe-area-inset-bottom)); display:flex; gap:10px; border-top:1px solid var(--line); background:rgba(12,11,22,.92); }
#foot:empty { display:none; }
.btn { flex:1; min-height:54px; border:none; border-radius:var(--r); font:800 clamp(16px,4.4vw,19px) var(--font); color:#140f24; cursor:pointer;
  background:linear-gradient(90deg,var(--a),var(--meld)); box-shadow:0 4px 18px rgba(255,95,162,.25); }
.btn.alt { background:var(--panel2); color:var(--ink); box-shadow:none; border:1px solid var(--line); }
.btn.teal { background:linear-gradient(90deg,var(--b),#7aa8ff); }
.btn.gold { background:linear-gradient(90deg,var(--meld),#ff9f5a); }
.btn:active { transform:scale(.98); }
.card { background:var(--panel); border:1px solid var(--line); border-radius:var(--r); padding:14px; margin:10px 0; }
.lead { font-size:clamp(14px,3.8vw,16px); color:var(--muted); line-height:1.45; margin:6px 0 10px; }
.big { font-size:clamp(24px,7vw,36px); font-weight:900; text-align:center; margin:8px 0; line-height:1.15; }
.center { text-align:center; }
.ca { color:var(--a); } .cb { color:var(--b); } .cg { color:var(--meld); } .cm { color:var(--muted); }
label.h { display:block; font-weight:800; font-size:13px; letter-spacing:1px; text-transform:uppercase; color:var(--muted); margin:14px 0 8px; }
.row { display:flex; gap:8px; align-items:center; margin:6px 0; }
.row input { flex:1; }
.txt { min-height:48px; border-radius:12px; border:1px solid var(--line); background:#0f0e1d; color:var(--ink); padding:0 14px; font:600 17px var(--font); outline:none; width:100%; }
.txt:focus { border-color:var(--b); }
.txt.bigtxt { min-height:60px; font-size:clamp(20px,6vw,26px); text-align:center; font-weight:800; letter-spacing:.5px; }
.chips { display:flex; flex-wrap:wrap; gap:8px; }
.chip { min-height:44px; padding:0 16px; border-radius:999px; border:1px solid var(--line); background:var(--panel2); color:var(--ink); font:700 15px var(--font); cursor:pointer; }
.chip.on { background:linear-gradient(90deg,var(--a),var(--b)); color:#120d20; border-color:transparent; }
.x { min-width:44px; height:48px; border-radius:12px; border:1px solid var(--line); background:var(--panel2); color:var(--muted); font-size:18px; cursor:pointer; }
.err { color:var(--bad); font-weight:700; min-height:22px; margin-top:8px; font-size:15px; }
.note { color:var(--meld); font-weight:700; font-size:14px; margin:6px 0; }
details summary { cursor:pointer; font-weight:800; min-height:44px; display:flex; align-items:center; }
details ol { padding-left:20px; color:var(--muted); line-height:1.5; margin:4px 0; }
.duo { display:flex; align-items:center; justify-content:center; gap:10px; flex-wrap:wrap; font-size:clamp(24px,7.5vw,38px); font-weight:900; margin:10px 0; }
.duo .plus { color:var(--muted); font-size:.6em; }
.rule { display:flex; gap:12px; align-items:center; }
.rule .ri { font-size:34px; }
.rule b { display:block; font-size:18px; }
.rule span { color:var(--muted); font-size:14px; line-height:1.35; }
.ladder { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
.ladder span { background:var(--panel2); border-radius:8px; padding:4px 8px; font-size:13px; color:var(--muted); }
.ladder span b { color:var(--meld); }
/* converging funnel */
.funnel { position:relative; margin:8px 0 4px; padding:4px 0; }
.funnel::before { content:''; position:absolute; left:50%; top:0; bottom:0; border-left:2px dashed #2c2850; }
.frow { position:relative; display:flex; justify-content:space-between; align-items:center; margin:6px 0; transition:padding .4s; }
.frow .lbl { position:absolute; left:50%; transform:translateX(-50%); font-size:11px; color:var(--muted); background:var(--bg); padding:0 4px; border-radius:4px; }
.pill { max-width:44%; padding:8px 12px; border-radius:999px; font-weight:800; font-size:clamp(14px,4vw,18px); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.pill.pa { background:rgba(255,95,162,.16); border:1px solid var(--a); color:#ffd0e4; }
.pill.pb { background:rgba(62,224,208,.14); border:1px solid var(--b); color:#c9fff9; }
.frow.new .pill { animation:pop .45s ease-out; }
.frow.meld { justify-content:center; }
.pill.pm { max-width:90%; background:linear-gradient(90deg,var(--meld),#ff9f5a); color:#1c1206; font-size:clamp(18px,5.5vw,24px); padding:10px 20px; box-shadow:0 0 28px rgba(255,209,102,.45); animation:glow 1.4s ease-in-out infinite alternate; }
@keyframes pop { 0%{transform:scale(.6);opacity:0} 70%{transform:scale(1.08);opacity:1} 100%{transform:scale(1)} }
@keyframes glow { from{box-shadow:0 0 14px rgba(255,209,102,.3)} to{box-shadow:0 0 34px rgba(255,209,102,.7)} }
.target { display:flex; align-items:center; justify-content:center; gap:10px; flex-wrap:wrap; margin:6px 0 4px; }
.target .and { color:var(--muted); font-weight:700; }
.verdict { text-align:center; font-weight:900; font-size:clamp(30px,10vw,52px); margin:4px 0; letter-spacing:2px; }
.verdict.yes { color:var(--meld); text-shadow:0 0 24px rgba(255,209,102,.6); animation:pop .5s ease-out; }
.verdict.no { color:var(--muted); font-size:clamp(22px,7vw,32px); }
.pts { text-align:center; font-size:18px; font-weight:800; color:var(--good); }
.privacy { text-align:center; font-size:64px; margin:14px 0 4px; }
.timer { text-align:center; font-weight:900; font-size:22px; color:var(--meld); min-height:28px; }
.timer.low { color:var(--bad); }
.board .pl { display:flex; align-items:center; gap:10px; padding:10px 4px; border-bottom:1px solid var(--line); }
.board .pl:last-child { border-bottom:none; }
.board .rk { width:28px; font-weight:900; color:var(--muted); text-align:center; }
.board .nm { flex:1; font-weight:800; font-size:17px; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.board .sc { font-weight:900; font-size:20px; color:var(--meld); }
.board .st { font-size:12px; color:var(--muted); }
.award { display:flex; gap:10px; align-items:center; padding:8px 0; border-bottom:1px solid var(--line); }
.award:last-child { border-bottom:none; }
.award .ai { font-size:28px; width:38px; text-align:center; }
.award b { display:block; } .award span { color:var(--muted); font-size:14px; }
.hist { font-size:14px; color:var(--muted); padding:8px 0; border-bottom:1px solid var(--line); line-height:1.45; }
.hist:last-child { border-bottom:none; }
.hist b { color:var(--ink); }
#cd { position:fixed; inset:0; display:none; align-items:center; justify-content:center; background:rgba(8,7,16,.88); z-index:50; flex-direction:column; }
#cd.on { display:flex; }
#cd .n { font-size:clamp(90px,34vw,180px); font-weight:900; background:linear-gradient(90deg,var(--a),var(--meld),var(--b)); -webkit-background-clip:text; background-clip:text; color:transparent; animation:pop .5s ease-out; }
#cd .t { color:var(--muted); font-weight:800; letter-spacing:2px; }
#modal { position:fixed; inset:0; display:none; align-items:center; justify-content:center; background:rgba(8,7,16,.8); z-index:60; padding:16px; }
#modal.on { display:flex; }
#modal .box { width:min(480px,100%); max-height:86vh; overflow-y:auto; background:var(--panel); border:1px solid var(--line); border-radius:18px; padding:16px; }
#modal .box h2 { margin:0 0 8px; font-size:22px; }
.btnrow { display:flex; gap:10px; margin-top:14px; }
.small { font-size:13px; color:var(--muted); }
.linkbtn { background:none; border:1px dashed var(--line); color:var(--muted); border-radius:12px; min-height:44px; padding:0 14px; font:700 14px var(--font); cursor:pointer; width:100%; margin-top:10px; }
.spark-btn { min-height:44px; border-radius:12px; border:1px solid var(--line); background:var(--panel2); color:var(--ink); font:700 15px var(--font); padding:0 14px; cursor:pointer; margin-top:10px; width:100%; }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="ttl"><h1>Mind Meld</h1><div class="sub" id="hsub"></div></div>
    <div id="hbtns" style="display:flex;gap:6px"></div>
  </header>
  <main id="main"></main>
  <footer id="foot"></footer>
</div>
<div id="cd"><div class="n" id="cdn">3</div><div class="t" id="cdt"></div></div>
<div id="modal"><div class="box" id="mbox"></div></div>

<script>
const KEY = 'cowork-mindmeld-state', MKEY = 'cowork-mindmeld-muted';
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const rnd = n => Math.floor(Math.random() * n);
const pick = a => a[rnd(a.length)];

const SPARKS = ('apple anchor balloon banana battery beach bicycle blanket bridge bubble cactus camera candle castle cheese chess circus cloud coffee comet compass cookie crown crystal desert diamond dinosaur doctor dragon drum eagle earthquake egg elbow engine feather fire flag forest fountain fridge frog galaxy garden ghost giraffe glacier glove guitar hammer helmet honey horse hurricane igloo island jacket jelly jungle kangaroo kettle key kite ladder lamp lemon library lighthouse lion lizard magnet map marble mask meteor mirror monkey moon mountain mushroom needle ninja ocean octopus orange owl paint panda parachute parrot peanut pencil penguin piano pickle pillow pirate pizza planet popcorn potato pumpkin puzzle pyramid queen rabbit radio rainbow robot rocket rose sandwich saturn scissors shark shoe skeleton snow soap sock spider spoon squirrel stamp statue storm submarine sugar sun sushi sword taco teacup telescope thunder tiger toast tomato tornado tractor treasure trumpet tunnel umbrella unicorn vampire violin volcano waffle wallet waterfall whale whistle window wizard wolf yoyo zebra zipper').split(' ');

const PTS = [12, 10, 8, 6, 4, 3, 2, 2, 2];
const ptsFor = k => PTS[Math.min(k, PTS.length - 1)];
const letters = w => w.replace(/[^A-Za-zÀ-ÿ]/g, '');

const RULES = [
  { id:'plain', icon:'🌀', name:'Open Mind', desc:'No extra rule. Just meet in the middle.' },
  { id:'short', icon:'✂️', name:'Short Wire', desc:'Every word must be 5 letters or fewer.',
    check: w => letters(w).length > 5 ? 'Short Wire: 5 letters or fewer.' : null },
  { id:'long', icon:'🐍', name:'Long Haul', desc:'Every word must be 6 letters or more.',
    check: w => letters(w).length < 6 ? 'Long Haul: 6 letters or more.' : null },
  { id:'noe', icon:'🚫', name:'E-Free Zone', desc:'No word may contain the letter E.',
    check: w => /[eéèêë]/i.test(w) ? 'E-Free Zone: no letter E allowed.' : null },
  { id:'allit', icon:'🔤', name:'Echo Letters', desc:'Each bridge word must start with the first letter of one of the two words before it.',
    check: (w, prev) => {
      if (!prev) return null;
      const f = x => stem(x).charAt(0);
      const ok = [f(prev[0]), f(prev[1])].filter(Boolean);
      return ok.length && !ok.includes(stem(w).charAt(0)) ? `Echo Letters: start with ${ok.map(c => c.toUpperCase()).join(' or ')}.` : null;
    } },
  { id:'deal', icon:'🃏', name:'Spark Deal', desc:'The deck deals both spark words. You bridge from there.' },
  { id:'hot', icon:'⏱️', name:'Hot Potato', desc:'15 seconds to lock in each word, or the phone picks one for you.', typeOnly:true },
  { id:'double', icon:'💎', name:'Double Down', desc:'Double points, but only 4 bridges to find the meld.' },
];
const ruleById = id => RULES.find(r => r.id === id) || RULES[0];

// one normaliser for matching AND no-repeat checks
function stem(w) {
  let s = String(w).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]/g, '');
  if (s.length > 4 && s.endsWith('ies')) s = s.slice(0, -3) + 'y';
  else if (s.length > 4 && /(ss|x|z|ch|sh)es$/.test(s)) s = s.slice(0, -2);
  else if (s.length > 3 && s.endsWith('s') && !/(ss|us|is)$/.test(s)) s = s.slice(0, -1);
  return s;
}

/* ---------- audio ---------- */
let AC = null, muted = localStorage.getItem(MKEY) === '1';
function tone(f, d = .12, type = 'sine', v = .14, when = 0) {
  if (muted) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const t = AC.currentTime + when, o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
    o.connect(g).connect(AC.destination); o.start(t); o.stop(t + d + .02);
  } catch (e) {}
}
const sfx = {
  tap: () => tone(660, .06, 'triangle', .08),
  lock: () => { tone(520, .08, 'square', .06); tone(780, .1, 'square', .06, .07); },
  tick: () => tone(440, .1, 'triangle', .12),
  go: () => tone(880, .2, 'triangle', .14),
  meld: () => [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, .35, 'triangle', .13, i * .09)),
  miss: () => { tone(300, .18, 'sawtooth', .06); tone(240, .25, 'sawtooth', .05, .12); },
  fizzle: () => [400, 330, 260, 190].forEach((f, i) => tone(f, .22, 'sawtooth', .05, i * .12)),
};

/* ---------- state ---------- */
let S, undoStack = [], cdToken = 0, hotIv = null, quitArmed = false;
function freshSetup(names) {
  return { phase:'setup', setup:{ names: names || ['', '', '', ''], mode:'type', rounds:6, rules:true, maxSteps:6 } };
}
function load() {
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.phase) return s; } catch (e) {}
  return freshSetup();
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
function snap() { undoStack.push(JSON.stringify(S)); if (undoStack.length > 60) undoStack.shift(); }
S = load();
if (S.phase === 'turn' && ['typeA', 'typeB'].includes(S.cur.sub)) S.cur.sub = S.cur.sub === 'typeA' ? 'passA' : 'passB';
window.addEventListener('pagehide', save);

/* ---------- game logic ---------- */
function startGame(keepOpts) {
  const st = S.setup;
  const used = {};
  const names = st.names.map((n, i) => (n || '').trim().slice(0, 16) || `Player ${i + 1}`).map(n => {
    let k = n, c = 2; while (used[k.toLowerCase()]) k = `${n} ${c++}`; used[k.toLowerCase()] = 1; return k;
  });
  const n = names.length, allPairs = n * (n - 1) / 2;
  S = {
    phase:'turn', setup: st,
    opts:{ mode: st.mode, rules: st.rules, maxSteps: st.maxSteps },
    players: names.map(name => ({ name, score:0, melds:0, duos:0, called:0 })),
    total: st.rounds === 'all' ? allPairs : st.rounds,
    round: 0, pairs:{}, last:[], history:[], cur:null,
  };
  undoStack = [];
  newDuo();
}
function pairKey(i, j) { return i < j ? i + '-' + j : j + '-' + i; }
function chooseDuo() {
  const n = S.players.length;
  if (n === 2) return S.round % 2 ? [1, 0] : [0, 1];
  let best = null, bestScore = Infinity;
  for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++) {
    const sc = (S.pairs[pairKey(i, j)] || 0) * 100 + (S.players[i].duos + S.players[j].duos) * 10
      + ((S.last.includes(i) ? 4 : 0) + (S.last.includes(j) ? 4 : 0)) + Math.random() * 3;
    if (sc < bestScore) { bestScore = sc; best = [i, j]; }
  }
  return Math.random() < .5 ? best : [best[1], best[0]];
}
function drawRule() {
  if (!S.opts.rules || Math.random() < .35) return 'plain';
  const pool = RULES.filter(r => r.id !== 'plain' && !(r.typeOnly && S.opts.mode !== 'type'));
  return pick(pool).id;
}
function newDuo() {
  const [a, b] = chooseDuo();
  S.cur = { a, b, rule: drawRule(), chain:[], sub:'intro', pend:[null, null], notes:[], meldStep:null, manual:false, called:[], warn:[] };
}
const C = () => S.cur;
const maxSteps = () => C().rule === 'double' ? 4 : S.opts.maxSteps;
const isFinal = () => S.round === S.total - 1 && S.total > 1;
const mult = () => (C().rule === 'double' ? 2 : 1) * (isFinal() ? 2 : 1);
const pname = i => S.players[i].name;
const prevPair = () => { const ch = C().chain; return ch.length ? ch[ch.length - 1] : null; };
const bridgesUsed = () => Math.max(0, C().chain.length - 1);
const outOfSteps = () => C().meldStep == null && bridgesUsed() >= maxSteps();

function randomUnused() {
  const usedSet = new Set(C().chain.flat().map(stem));
  const pool = SPARKS.filter(w => !usedSet.has(stem(w)) && !(ruleById(C().rule).check && ruleById(C().rule).check(w, prevPair())));
  return pick(pool.length ? pool : SPARKS);
}
function validate(raw) {
  const w = raw.trim();
  if (!w) return 'Type a word first.';
  if (/\s/.test(w)) return 'One word only, no spaces.';
  if (!/^[A-Za-zÀ-ÿ0-9'’-]+$/.test(w)) return 'Letters only, please.';
  if (!stem(w)) return 'That is not a word.';
  if (C().chain.some(p => p.some(x => stem(x) === stem(w)))) return `"${w}" was already said in this duo. No repeats!`;
  const r = ruleById(C().rule);
  return r.check ? r.check(w, prevPair()) : null;
}

function begin() {
  snap(); sfx.tap();
  const c = C();
  if (c.rule === 'deal') {
    const w1 = pick(SPARKS); let w2 = pick(SPARKS); while (stem(w2) === stem(w1)) w2 = pick(SPARKS);
    c.chain.push([w1, w2]); c.dealt = true; c.sub = 'shown';
  } else c.sub = S.opts.mode === 'type' ? 'passA' : 'shout';
  render();
}
function lockWord(side, word, auto) {
  snap();
  const c = C();
  c.pend[side] = word.trim();
  if (auto) c.notes.push(`Time ran out, so the phone picked "${word}" for ${pname(side ? c.b : c.a)}.`);
  sfx.lock();
  c.sub = side === 0 ? 'passB' : 'reveal';
  render();
}
function resolveRow(wa, wb) {
  const c = C();
  c.chain.push([wa, wb]);
  if (stem(wa) === stem(wb) && stem(wa) !== '') { c.meldStep = c.chain.length - 1; sfx.meld(); }
  else if (outOfSteps()) sfx.fizzle();
  else sfx.miss();
  c.sub = 'shown'; c.fresh = true;
}
function countdown(label, done) {
  const tok = ++cdToken, el = $('#cd'), n = $('#cdn'), t = $('#cdt');
  el.classList.add('on'); t.textContent = label;
  const seq = ['3', '2', '1'];
  let i = 0;
  const stepFn = () => {
    if (tok !== cdToken) return;
    if (i < seq.length) { n.textContent = seq[i]; n.style.animation = 'none'; void n.offsetWidth; n.style.animation = ''; sfx.tick(); i++; setTimeout(stepFn, 650); }
    else { el.classList.remove('on'); sfx.go(); done(); }
  };
  stepFn();
}
function cancelCountdown() { cdToken++; $('#cd').classList.remove('on'); }
function doReveal() {
  countdown('REVEAL', () => {
    snap();
    const c = C();
    resolveRow(c.pend[0], c.pend[1]);
    c.pend = [null, null];
    render();
  });
}
function nextStep() {
  snap(); sfx.tap();
  const c = C();
  c.notes = []; c.warn = []; c.fresh = false;
  c.sub = S.opts.mode === 'type' ? 'passA' : 'shout';
  render();
}
function roomMeld() {
  snap();
  const c = C();
  c.meldStep = c.chain.length - 1; c.manual = true; c.fresh = true; sfx.meld();
  render();
}
function duoPoints() { const c = C(); return c.meldStep == null ? 0 : ptsFor(c.meldStep) * mult(); }
function finishDuo() {
  snap(); sfx.tap();
  const c = C(), pts = duoPoints(), A = S.players[c.a], B = S.players[c.b];
  A.duos++; B.duos++;
  if (c.meldStep != null) {
    A.score += pts; B.score += pts; A.melds++; B.melds++;
    c.called.forEach(i => { S.players[i].score += 2; S.players[i].called++; });
  }
  S.pairs[pairKey(c.a, c.b)] = (S.pairs[pairKey(c.a, c.b)] || 0) + 1;
  S.history.push({ a:c.a, b:c.b, rule:c.rule, chain:c.chain, meldStep:c.meldStep, pts, manual:c.manual, called:c.called.slice() });
  S.last = [c.a, c.b];
  S.round++;
  if (S.round >= S.total) { S.phase = 'over'; S.cur = null; }
  else newDuo();
  render();
}

/* ---------- rendering ---------- */
function funnel(chain, meldStep, freshLast) {
  if (!chain.length) return '';
  return '<div class="funnel">' + chain.map((p, i) => {
    const pad = Math.min(i, 7) * 3.2;
    const cls = 'frow' + (freshLast && i === chain.length - 1 ? ' new' : '');
    if (i === meldStep) {
      const same = p[0].toLowerCase() === p[1].toLowerCase();
      return `<div class="${cls} meld" style="padding:0 ${pad}%"><span class="pill pm">${esc(p[0])}${same ? '' : ' = ' + esc(p[1])}</span></div>`;
    }
    return `<div class="${cls}" style="padding:0 ${pad}%"><span class="pill pa">${esc(p[0])}</span><span class="lbl">${i === 0 ? 'spark' : '#' + i}</span><span class="pill pb">${esc(p[1])}</span></div>`;
  }).join('') + '</div>';
}
function targetHTML() {
  const p = prevPair();
  if (!p) return `<div class="lead center">Step 0: <b>any word at all</b>. This is your spark.</div>`;
  return `<div class="lead center" style="margin-bottom:2px">Bridge ${bridgesUsed() + 1} of ${maxSteps()}: find a word that links</div>
    <div class="target"><span class="pill pa">${esc(p[0])}</span><span class="and">&amp;</span><span class="pill pb">${esc(p[1])}</span></div>`;
}
function ruleCard(compact) {
  const r = ruleById(C().rule);
  return `<div class="card rule"${compact ? ' style="padding:10px"' : ''}><div class="ri">${r.icon}</div><div><b>${r.name}</b><span>${r.desc}</span></div></div>`;
}
function hdr() {
  const sub = $('#hsub'), hb = $('#hbtns');
  if (S.phase === 'turn') sub.textContent = `Duo ${S.round + 1}/${S.total}${isFinal() ? ' · FINAL ×2' : ''}`;
  else sub.textContent = S.phase === 'over' ? 'Game over' : 'Say the same word';
  let h = `<button class="icon" data-act="mute" aria-label="Sound">${muted ? '🔇' : '🔊'}</button>`;
  if (S.phase === 'turn') h = `<button class="icon" data-act="undo" aria-label="Undo" ${undoStack.length ? '' : 'disabled style="opacity:.35"'}>↶</button><button class="icon" data-act="scores" aria-label="Scores">🏆</button>` + h + `<button class="icon" data-act="quit" aria-label="Quit">✕</button>`;
  hb.innerHTML = h;
}
function render() {
  stopHot();
  const m = $('#main'), f = $('#foot');
  hdr();
  if (S.phase === 'setup') renderSetup(m, f);
  else if (S.phase === 'turn') renderTurn(m, f);
  else renderOver(m, f);
  m.scrollTop = 0;
  save();
}

function renderSetup(m, f) {
  const st = S.setup, n = st.names.length, allPairs = n * (n - 1) / 2;
  const roundOpts = [4, 6, 8, 12];
  if (n > 2 && !roundOpts.includes(allPairs) && allPairs <= 21) roundOpts.push('all');
  if (st.rounds === 'all' && !roundOpts.includes('all')) st.rounds = 6;
  m.innerHTML = `
    <p class="lead">Two minds, two words. Keep meeting in the middle until you both say <b class="cg">the same word</b>.</p>
    <details class="card"><summary>How to play</summary><ol>
      <li>Each duo secretly types any word (their <b class="ca">spark</b>) on the passed phone.</li>
      <li>Both words are revealed. Now each secretly types one word that links the two.</li>
      <li>Reveal again. The two chains funnel inward, step by step, until you both type the <b class="cg">same word</b>. That's a MELD!</li>
      <li>The faster the meld, the more points you both score. No repeating words already said. Plurals count as a match.</li>
      <li>Spectators: shout your prediction before each reveal. Called the meld word? +2.</li>
      <li><b>Shout Mode</b> skips typing: count 3-2-1 and say your words out loud together.</li></ol></details>
    <label class="h">Players (${n})</label>
    <div id="names">${st.names.map((nm, i) => `<div class="row"><input class="txt" data-name="${i}" maxlength="16" placeholder="Player ${i + 1}" value="${esc(nm)}" autocomplete="off">${n > 2 ? `<button class="x" data-act="rm" data-i="${i}" aria-label="Remove">✕</button>` : ''}</div>`).join('')}</div>
    ${n < 10 ? '<button class="spark-btn" data-act="add">+ Add player</button>' : ''}
    <label class="h">Mode</label>
    <div class="chips"><button class="chip ${st.mode === 'type' ? 'on' : ''}" data-act="mode" data-v="type">Secret typing</button><button class="chip ${st.mode === 'shout' ? 'on' : ''}" data-act="mode" data-v="shout">Shout out loud</button></div>
    <p class="small">${st.mode === 'type' ? 'The phone passes between the duo. The app judges matches, bans repeats and checks rule cards.' : 'Fast and loud: the duo counts 3-2-1 and says their words together. The room judges.'}</p>
    <label class="h">Duos to play</label>
    <div class="chips">${roundOpts.map(r => `<button class="chip ${st.rounds === r ? 'on' : ''}" data-act="rounds" data-v="${r}">${r === 'all' ? `Every pair (${allPairs})` : r}</button>`).join('')}</div>
    <label class="h">Bridges before a fizzle</label>
    <div class="chips">${[5, 6, 8].map(r => `<button class="chip ${st.maxSteps === r ? 'on' : ''}" data-act="steps" data-v="${r}">${r}</button>`).join('')}</div>
    <label class="h">Rule cards</label>
    <div class="chips"><button class="chip ${st.rules ? 'on' : ''}" data-act="rules" data-v="1">On</button><button class="chip ${!st.rules ? 'on' : ''}" data-act="rules" data-v="0">Off</button></div>
    <p class="small">Twists like Short Wire, E-Free Zone, Spark Deal and Double Down. The final duo always scores double.</p>`;
  f.innerHTML = `<button class="btn" data-act="start">Start Mind Meld</button>`;
}

function renderTurn(m, f) {
  const c = C(), A = pname(c.a), B = pname(c.b), mode = S.opts.mode;
  const duoHTML = `<div class="duo"><span class="ca">${esc(A)}</span><span class="plus">+</span><span class="cb">${esc(B)}</span></div>`;
  switch (c.sub) {
    case 'intro': {
      const ms = maxSteps(), mu = mult();
      const lad = [`<span>spark <b>${ptsFor(0) * mu}</b></span>`].concat(Array.from({ length: ms }, (_, i) => `<span>${i + 1} <b>${ptsFor(i + 1) * mu}</b></span>`)).join('');
      m.innerHTML = `<p class="lead center">${isFinal() ? '<b class="cg">FINAL DUO: double points!</b>' : `Up next, duo ${S.round + 1} of ${S.total}`}</p>
        ${duoHTML}${ruleCard()}
        <div class="card"><b>Points if you meld at bridge…</b><div class="ladder">${lad}</div>
        <p class="small" style="margin:8px 0 0">Both of you score. No meld after ${ms} bridges = fizzle.${S.players.length > 2 ? ' Spectators: guess the meld word out loud before each reveal.' : ''}</p></div>`;
      f.innerHTML = `<button class="btn" data-act="begin">Begin</button>`;
      break;
    }
    case 'passA': case 'passB': {
      const side = c.sub === 'passA' ? 0 : 1, who = side ? B : A, other = side ? A : B;
      m.innerHTML = `${funnel(c.chain, null, false)}<div class="privacy">🤫</div>
        <div class="big">Pass to <span class="${side ? 'cb' : 'ca'}">${esc(who)}</span></div>
        <p class="lead center">${esc(other)} and everyone else: eyes off the screen.${side ? ` ${esc(A)} has locked in.` : ''}</p>`;
      f.innerHTML = `<button class="btn ${side ? 'teal' : ''}" data-act="iam" data-side="${side}">I'm ${esc(who)}: show me</button>`;
      break;
    }
    case 'typeA': case 'typeB': {
      const side = c.sub === 'typeA' ? 0 : 1, who = side ? B : A;
      const r = ruleById(c.rule), hot = c.rule === 'hot';
      m.innerHTML = `<div class="big" style="font-size:clamp(20px,6vw,28px)"><span class="${side ? 'cb' : 'ca'}">${esc(who)}</span>, your word</div>
        ${targetHTML()}
        <input class="txt bigtxt" id="word" maxlength="24" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="one word">
        <div class="err" id="err"></div>
        ${hot ? '<div class="timer" id="hotT">15</div>' : ''}
        ${!c.chain.length ? '<button class="spark-btn" data-act="randword">🎲 Random spark</button>' : ''}
        ${r.id !== 'plain' ? `<p class="small center">${r.icon} ${r.name}: ${r.desc}</p>` : ''}`;
      f.innerHTML = `<button class="btn ${side ? 'teal' : ''}" data-act="lock" data-side="${side}">Lock it in</button>`;
      const inp = $('#word');
      inp.value = '';
      inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); tryLock(side); } });
      inp.addEventListener('input', () => { $('#err').textContent = ''; });
      setTimeout(() => inp.focus(), 50);
      if (hot) startHot(side);
      break;
    }
    case 'reveal': {
      m.innerHTML = `${funnel(c.chain, null, false)}<div class="privacy">🔒🔒</div>
        <div class="big">Both words locked!</div>
        <p class="lead center">Gather round. ${S.players.length > 2 ? 'Spectators: shout your guess for the meld word now!' : 'Say your guesses out loud first!'}</p>
        ${c.notes.map(n => `<div class="note center">⏱ ${esc(n)}</div>`).join('')}`;
      f.innerHTML = `<button class="btn gold" data-act="reveal">Reveal 3-2-1</button>`;
      break;
    }
    case 'shout': {
      m.innerHTML = `${duoHTML}${funnel(c.chain, null, false)}${targetHTML()}
        ${ruleById(c.rule).id !== 'plain' ? `<p class="small center">${ruleById(c.rule).icon} ${ruleById(c.rule).name}: ${ruleById(c.rule).desc}</p>` : ''}
        <p class="lead center">Think of your word silently. When the countdown ends, both say it out loud <b>at the same time</b>.</p>`;
      f.innerHTML = `<button class="btn gold" data-act="say">3-2-1 Say it!</button>`;
      break;
    }
    case 'judge': {
      m.innerHTML = `${duoHTML}${targetHTML()}
        <p class="lead center">Same word? Log what they said (optional, it builds the ladder and catches repeats).</p>
        <div class="row"><input class="txt" id="sa" maxlength="24" autocomplete="off" spellcheck="false" placeholder="${esc(A)} said…" style="border-color:var(--a)"></div>
        <div class="row"><input class="txt" id="sb" maxlength="24" autocomplete="off" spellcheck="false" placeholder="${esc(B)} said…" style="border-color:var(--b)"></div>
        <div class="err" id="err"></div>`;
      f.innerHTML = `<button class="btn alt" data-act="judge" data-v="0">Different</button><button class="btn gold" data-act="judge" data-v="1">MELD!</button>`;
      $('#sa').value = ''; $('#sb').value = '';
      break;
    }
    case 'shown': {
      const melded = c.meldStep != null, fizz = outOfSteps(), pts = duoPoints();
      let verdict;
      if (c.dealt && c.chain.length === 1 && !melded) verdict = `<div class="verdict no">Sparks dealt!</div><p class="lead center">The deck picked your starting words. Now bridge them.</p>`;
      else if (melded) verdict = `<div class="verdict yes">MELD!</div><div class="pts">+${pts} each for ${esc(A)} &amp; ${esc(B)}${mult() > 1 ? ` (×${mult()})` : ''}</div>
        <p class="lead center">${c.meldStep === 0 ? 'Same spark word. Spooky!' : `Melded at bridge ${c.meldStep}.`}${c.manual ? ' (Room ruling)' : ''}</p>`;
      else if (fizz) verdict = `<div class="verdict no">Fizzle…</div><p class="lead center">${maxSteps()} bridges and no meld. 0 points this time.</p>`;
      else verdict = `<div class="verdict no">So close…</div><p class="lead center">No meld yet. ${maxSteps() - bridgesUsed()} bridge${maxSteps() - bridgesUsed() === 1 ? '' : 's'} left.</p>`;
      const spect = S.players.map((p, i) => i).filter(i => i !== c.a && i !== c.b);
      const calledHTML = melded && spect.length ? `<div class="card"><b>Called it?</b><p class="small" style="margin:4px 0 8px">Tap anyone who shouted the meld word before the reveal: +2 each.</p>
        <div class="chips">${spect.map(i => `<button class="chip ${c.called.includes(i) ? 'on' : ''}" data-act="call" data-i="${i}">${esc(pname(i))}</button>`).join('')}</div></div>` : '';
      const warn = c.warn.length ? `<div class="note center">⚠ Room check: ${c.warn.map(esc).join(' ')}</div>` : '';
      m.innerHTML = `${funnel(c.chain, c.meldStep, c.fresh)}${verdict}${c.notes.map(n => `<div class="note center">⏱ ${esc(n)}</div>`).join('')}${warn}${calledHTML}
        ${!melded && !(c.dealt && c.chain.length === 1) ? '<button class="linkbtn" data-act="roommeld">Same word, just spelled differently? Room rules it a meld</button>' : ''}`;
      if (melded || fizz) f.innerHTML = `<button class="btn" data-act="finish">${S.round + 1 >= S.total ? 'Final scores' : 'Next duo'}</button>`;
      else f.innerHTML = `<button class="btn" data-act="next">Next bridge</button>`;
      c.fresh = false;
      break;
    }
  }
}

function tryLock(side) {
  const inp = $('#word'); if (!inp) return;
  const err = validate(inp.value);
  if (err) { $('#err').textContent = err; sfx.miss(); return; }
  const w = inp.value.trim(); inp.value = '';
  lockWord(side, w, false);
}
function startHot(side) {
  const end = Date.now() + 15000;
  hotIv = setInterval(() => {
    const left = Math.max(0, Math.ceil((end - Date.now()) / 1000)), el = $('#hotT');
    if (el) { el.textContent = left; el.classList.toggle('low', left <= 5); }
    if (left <= 5 && left > 0 && el && el.dataset.l != left) { el.dataset.l = left; sfx.tick(); }
    if (left <= 0) {
      stopHot();
      const inp = $('#word'), v = inp ? inp.value : '';
      if (inp) inp.value = '';
      if (!validate(v)) lockWord(side, v, false); else lockWord(side, randomUnused(), true);
    }
  }, 200);
}
function stopHot() { if (hotIv) { clearInterval(hotIv); hotIv = null; } }

function judge(same) {
  const c = C(), ia = $('#sa').value.trim().split(/\s+/)[0] || '', ib = $('#sb').value.trim().split(/\s+/)[0] || '';
  snap();
  c.warn = [];
  [ia, ib].forEach(w => {
    if (!w) return;
    if (c.chain.some(p => p.some(x => stem(x) === stem(w)))) c.warn.push(`"${w}" was already said.`);
    const r = ruleById(c.rule); const e = r.check && r.check(w, prevPair()); if (e) c.warn.push(`"${w}" breaks ${e}`);
  });
  c.warn = [...new Set(c.warn)];
  if (same) {
    const w = ia || ib || '(same word)';
    c.chain.push([w, ia && ib ? ib : w]); c.meldStep = c.chain.length - 1; sfx.meld();
    c.sub = 'shown'; c.fresh = true;
  } else {
    if (ia && ib && stem(ia) === stem(ib)) { $('#err').textContent = 'Those two are the same word. Tap MELD!'; undoStack.pop(); return; }
    resolveRow(ia || '?', ib || '?');
  }
  render();
}

function awards() {
  const H = S.history, out = [];
  const melds = H.filter(h => h.meldStep != null);
  if (melds.length) {
    const fast = melds.reduce((a, b) => b.meldStep < a.meldStep ? b : a);
    out.push(['💞', 'Soul Mates', `${pname(fast.a)} & ${pname(fast.b)}: melded on "${fast.chain[fast.meldStep][0]}" ${fast.meldStep === 0 ? 'with their sparks' : `in ${fast.meldStep} bridge${fast.meldStep > 1 ? 's' : ''}`}`]);
    const slow = melds.reduce((a, b) => b.meldStep > a.meldStep ? b : a);
    if (slow !== fast && slow.meldStep > fast.meldStep) out.push(['🛤️', 'Scenic Route', `${pname(slow.a)} & ${pname(slow.b)}: ${slow.chain[0].join(' / ')} … ${slow.chain[slow.meldStep][0]}`]);
  }
  const fz = H.filter(h => h.meldStep == null);
  if (fz.length) { const f = fz[fz.length - 1]; const last = f.chain[f.chain.length - 1] || ['?', '?']; out.push(['📡', 'Static on the Line', `${pname(f.a)} & ${pname(f.b)} ended on "${last[0]}" vs "${last[1]}"`]); }
  if (S.players.length > 2) {
    const ps = S.players.slice().sort((a, b) => b.called - a.called);
    if (ps[0].called) out.push(['🔮', 'Psychic', `${ps[0].name} called the meld word ${ps[0].called} time${ps[0].called > 1 ? 's' : ''}`]);
    const sync = S.players.filter(p => p.duos).map(p => ({ p, r: p.melds / p.duos })).sort((a, b) => b.r - a.r)[0];
    if (sync && sync.p.melds) out.push(['🧠', 'Hive Mind', `${sync.p.name} melded in ${sync.p.melds} of ${sync.p.duos} duos`]);
  }
  return out;
}
function renderOver(m, f) {
  const ranked = S.players.slice().sort((a, b) => b.score - a.score || b.melds - a.melds);
  const two = S.players.length === 2;
  let head;
  if (two) {
    const mx = S.history.reduce((s, h, i) => s + 12 * (h.rule === 'double' ? 2 : 1) * (i === S.total - 1 && S.total > 1 ? 2 : 1), 0);
    const pct = mx ? S.players[0].score / mx : 0;
    const rating = pct >= .6 ? 'One brain, two bodies' : pct >= .4 ? 'Deeply in sync' : pct >= .2 ? 'On the same wavelength' : pct > 0 ? 'Getting warmer' : 'Different planets';
    head = `<div class="big cg">${S.players[0].score} pts</div><p class="lead center">${esc(S.players[0].name)} &amp; ${esc(S.players[1].name)}, team score. <b>${rating}.</b></p>`;
  } else {
    const best = ranked[0].score, winners = ranked.filter(p => p.score === best);
    head = `<p class="lead center">Most in sync with the room</p><div class="big cg">${winners.map(p => esc(p.name)).join(' &amp; ')}</div>`;
  }
  const board = two ? '' : `<div class="card board">${ranked.map((p, i) => `<div class="pl"><div class="rk">${i + 1}</div><div class="nm">${esc(p.name)}<div class="st">${p.melds}/${p.duos} melds${p.called ? ` · ${p.called} called` : ''}</div></div><div class="sc">${p.score}</div></div>`).join('')}</div>`;
  const aw = awards();
  const hist = S.history.map(h => {
    const path = h.chain.map((p, i) => i === h.meldStep ? `<b class="cg">${esc(p[0])}</b>` : `${esc(p[0])}/${esc(p[1])}`).join(' → ');
    return `<div class="hist"><b><span class="ca">${esc(pname(h.a))}</span> + <span class="cb">${esc(pname(h.b))}</span></b> ${h.meldStep != null ? `<span class="cg">+${h.pts}</span>` : '<span>fizzle</span>'}<br>${path || '—'}</div>`;
  }).join('');
  m.innerHTML = `${head}${board}
    ${aw.length ? `<div class="card">${aw.map(a => `<div class="award"><div class="ai">${a[0]}</div><div><b>${a[1]}</b><span>${esc(a[2])}</span></div></div>`).join('')}</div>` : ''}
    <div class="card"><b>Every ladder</b>${hist}</div>`;
  f.innerHTML = `<button class="btn alt" data-act="newgame">New setup</button><button class="btn" data-act="rematch">Rematch</button>`;
}

function showScores() {
  const ranked = S.players.slice().sort((a, b) => b.score - a.score);
  $('#mbox').innerHTML = `<h2>Scores</h2><div class="board">${ranked.map((p, i) => `<div class="pl"><div class="rk">${i + 1}</div><div class="nm">${esc(p.name)}<div class="st">${p.melds}/${p.duos} melds</div></div><div class="sc">${p.score}</div></div>`).join('')}</div>
    <p class="small">Duo ${S.round + 1} of ${S.total}. Points land when a duo finishes.</p><div class="btnrow"><button class="btn alt" data-act="close">Close</button></div>`;
  $('#modal').classList.add('on');
}
function showQuit() {
  $('#mbox').innerHTML = `<h2>Quit this game?</h2><p class="lead">Scores and ladders so far will be lost.</p>
    <div class="btnrow"><button class="btn alt" data-act="close">Keep playing</button><button class="btn" data-act="quitok">Quit</button></div>`;
  $('#modal').classList.add('on');
}
function closeModal() { $('#modal').classList.remove('on'); }

/* ---------- events ---------- */
document.addEventListener('input', e => {
  const i = e.target.dataset && e.target.dataset.name;
  if (i != null && S.phase === 'setup') { S.setup.names[+i] = e.target.value; save(); }
});
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const act = el.dataset.act, v = el.dataset.v;
  const st = S.setup;
  switch (act) {
    case 'mute': muted = !muted; localStorage.setItem(MKEY, muted ? '1' : '0'); hdr(); if (!muted) sfx.tap(); break;
    case 'add': if (st.names.length < 10) { st.names.push(''); sfx.tap(); render(); const ins = document.querySelectorAll('[data-name]'); ins[ins.length - 1].focus(); } break;
    case 'rm': if (st.names.length > 2) { st.names.splice(+el.dataset.i, 1); sfx.tap(); render(); } break;
    case 'mode': st.mode = v; sfx.tap(); render(); break;
    case 'rounds': st.rounds = v === 'all' ? 'all' : +v; sfx.tap(); render(); break;
    case 'steps': st.maxSteps = +v; sfx.tap(); render(); break;
    case 'rules': st.rules = v === '1'; sfx.tap(); render(); break;
    case 'start': startGame(); sfx.go(); render(); break;
    case 'begin': begin(); break;
    case 'iam': sfx.tap(); snap(); C().sub = el.dataset.side === '1' ? 'typeB' : 'typeA'; render(); break;
    case 'randword': { const inp = $('#word'); if (inp) { inp.value = randomUnused(); $('#err').textContent = ''; sfx.tap(); } break; }
    case 'lock': tryLock(+el.dataset.side); break;
    case 'reveal': doReveal(); break;
    case 'say': countdown('SAY IT TOGETHER', () => { snap(); C().sub = 'judge'; render(); }); break;
    case 'judge': judge(v === '1'); break;
    case 'next': nextStep(); break;
    case 'roommeld': roomMeld(); break;
    case 'call': { const c = C(), i = +el.dataset.i, k = c.called.indexOf(i); if (k >= 0) c.called.splice(k, 1); else c.called.push(i); sfx.tap(); render(); break; }
    case 'finish': finishDuo(); break;
    case 'undo': if (undoStack.length) { cancelCountdown(); S = JSON.parse(undoStack.pop()); if (S.cur && ['typeA', 'typeB'].includes(S.cur.sub)) S.cur.sub = S.cur.sub === 'typeA' ? 'passA' : 'passB'; sfx.tap(); render(); } break;
    case 'scores': showScores(); break;
    case 'quit': showQuit(); break;
    case 'quitok': closeModal(); cancelCountdown(); S = freshSetup(S.players.map(p => p.name)); undoStack = []; render(); break;
    case 'close': closeModal(); break;
    case 'rematch': { const names = S.players.map(p => p.name); S.setup.names = names; startGame(); sfx.go(); render(); break; }
    case 'newgame': { const o = S.opts, r = S.setup.rounds; S = freshSetup(S.players.map(p => p.name)); Object.assign(S.setup, { mode:o.mode, rules:o.rules, maxSteps:o.maxSteps, rounds:r }); undoStack = []; render(); break; }
  }
});
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });

render();
</script>
</body>
</html>
