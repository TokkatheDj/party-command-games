const PREF_KEY = "cowork-story-smugglers-prefs";
// ---------- SOUND: Plucked String (Karplus-Strong) ----------
const Snd = (()=>{
  let ctx=null, master=null, muted=false; const cache=new Map();
  try{ muted = JSON.parse(localStorage.getItem(PREF_KEY)||"{}").muted===true; }catch(e){}
  function init(){
    if(ctx) { if(ctx.state==="suspended") ctx.resume(); return; }
    const AC = window.AudioContext||window.webkitAudioContext; if(!AC) return;
    ctx = new AC();
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value=-14; comp.knee.value=10; comp.ratio.value=4; comp.attack.value=.004; comp.release.value=.2;
    master = ctx.createGain(); master.gain.value = muted?0:.8;
    master.connect(comp); comp.connect(ctx.destination);
  }
  // Karplus-Strong: noise burst into a 1/f delay line with a two-tap averaging lowpass in the loop
  function ks(freq, dur, damp){
    const key=freq+"|"+dur+"|"+damp; if(cache.has(key)) return cache.get(key);
    const sr=ctx.sampleRate, N=Math.max(2,Math.round(sr/freq)), len=Math.floor(sr*dur);
    const buf=ctx.createBuffer(1,len,sr), d=buf.getChannelData(0);
    let prev=0;
    for(let i=0;i<N && i<len;i++){ const r=Math.random()*2-1; prev = prev*.35 + r*.65; d[i]=prev; }
    for(let i=N;i<len;i++){ d[i] = damp*0.5*(d[i-N] + d[i-N+1]); }
    cache.set(key,buf); return buf;
  }
  function pluck(freq, at=0, opt={}){
    if(!ctx||muted) return;
    const dur=opt.dur||1.1, vol=opt.vol??.45, damp=opt.damp??.996;
    const t=ctx.currentTime+.01+at;
    const src=ctx.createBufferSource(); src.buffer=ks(freq,dur,damp);
    const g=ctx.createGain();
    g.gain.setValueAtTime(0.0001,t);
    g.gain.linearRampToValueAtTime(vol,t+.008);
    g.gain.exponentialRampToValueAtTime(0.0008,t+dur);
    let node=src;
    if(opt.lp){ const f=ctx.createBiquadFilter(); f.type="lowpass"; f.frequency.value=opt.lp; src.connect(f); node=f; }
    node.connect(g); g.connect(master); src.start(t); src.stop(t+dur+.05);
  }
  const N={G3:196,A3:220,B3:246.94,D4:293.66,E4:329.63,G4:392,A4:440,B4:493.88,D5:587.33,E5:659.25,G5:783.99};
  return {
    init,
    get muted(){return muted},
    setMuted(m){ muted=m; if(master) master.gain.setTargetAtTime(m?0:.8,ctx.currentTime,.02);
      try{ localStorage.setItem(PREF_KEY,JSON.stringify({muted:m})); }catch(e){} },
    tap(){ pluck(N.E5,0,{dur:.35,vol:.22}); },
    motif(){ [N.G4,N.B4,N.D5,N.G5].forEach((f,i)=>pluck(f,i*.13,{dur:1.3,vol:.42})); },
    seize(){ [N.G3,N.B3,N.D4,N.G4].forEach((f,i)=>pluck(f,i*.025,{dur:.9,vol:.38})); },
    good(){ pluck(N.B4,0,{dur:.7,vol:.4}); pluck(N.E5,.1,{dur:1,vol:.42}); },
    bad(){ pluck(N.A3,0,{dur:.6,vol:.45,damp:.982,lp:900}); pluck(N.G3,.16,{dur:.8,vol:.45,damp:.982,lp:700}); },
    tick(){ pluck(N.D5,0,{dur:.25,vol:.14,damp:.99}); },
    timeUp(){ [N.G3,N.D4,N.G4].forEach((f,i)=>pluck(f,i*.04,{dur:1.4,vol:.42,damp:.993,lp:1600})); },
    win(){ [N.D5,N.E5,N.G5].forEach((f,i)=>pluck(f,i*.12,{dur:1,vol:.4}));
      [N.G4,N.B4,N.D5,N.G5].forEach((f,i)=>pluck(f,.42+i*.03,{dur:1.8,vol:.36})); }
  };
})();

function drawWord(pool){
  let avail = pool.filter(w=>!S.used.includes(w));
  if(avail.length<6){ S.used = S.used.filter(w=>!pool.includes(w)); avail = pool.slice(); }
  const w = pick(avail); S.used.push(w); return w;
}
function chooseTwist(){
  if(!S.twists) return TWISTS[0];
  if(Math.random()<.45) return TWISTS[0];
  let opts = TWISTS.slice(1).filter(t=>t.id!==S.lastTwist);
  if(S.players.length<4) opts = opts.filter(t=>t.id!=="dogs");
  return pick(opts);
}
function startTurn(){
  const n=S.players.length, t=S.turn;
  if(t>0 && t%n===0){ // new lap -> new chapter
    const left = CHAPTERS.filter(c=>!S.chaptersUsed.includes(c));
    S.chapter = pick(left.length?left:CHAPTERS); S.chaptersUsed.push(S.chapter);
  }
  const twist = chooseTwist(); S.lastTwist = twist.id;
  const count = twist.id==="heavy"?4:3;
  const words=[]; for(let i=0;i<count-1;i++) words.push(drawWord(EVERYDAY_WORDS));
  words.push(drawWord(WILD));
  const T = {
    narrator: t%n, twist:twist.id, words:shuffle(words),
    gold: twist.id==="gold"? rnd(count) : -1,
    herring: twist.id==="herring"? drawWord(EVERYDAY_WORDS) : null,
    secs: twist.id==="quick"? Math.min(25,S.secs) : S.secs + (twist.id==="heavy"?10:0),
    seizes:[], verdicts:null,
    before: S.players.map(p=>p.score),
    snap: JSON.stringify(S.players)
  };
  S.T=T; S.phase="intro"; save(); render();
}
function save(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(S)); }catch(e){} }
function clearSave(){ try{ localStorage.removeItem(SAVE_KEY); }catch(e){} }
function loadSave(){ try{ const s=JSON.parse(localStorage.getItem(SAVE_KEY)||"null"); return s&&s.players&&s.T? s:null; }catch(e){ return null; } }
function twistOf(id){ return TWISTS.find(t=>t.id===id)||TWISTS[0]; }
function narr(){ return S.players[S.T.narrator]; }
function correctSeizes(){ return S.T.seizes.filter(z=>z.ok==="yes").length; }

// ---------- RENDER ----------
function topBar(){
  const lap=lapOf(S.turn);
  return `<h1 class="sr">Story Smugglers</h1><div class="top"><span class="tag" style="white-space:nowrap">Lap ${lap}/${S.laps} · Turn ${S.turn%S.players.length+1}/${S.players.length}</span>
  <span class="row" style="flex:0 0 auto;gap:6px">
    <button data-act="mute" aria-pressed="${Snd.muted}">${Snd.muted?"Sound off":"Sound on"}</button>
    <button data-act="menu">Menu</button></span></div>`;
}
function storySoFar(){
  const s = S.souvenirs.map(x=>x.w);
  return `<div class="story"><b>Once upon a time…</b> ${esc(S.opener)}</div>
  ${S.chapter?`<div class="card"><h2 class="h3">Chapter ${lapOf(S.turn)}</h2><p style="margin:0">${esc(S.chapter)}</p></div>`:""}
  ${s.length?`<p class="hint">Already in the tale: ${s.map(esc).join(", ")}</p>`:""}`;
}
function scoreList(withDelta){
  const order = S.players.map((p,i)=>({p,i})).sort((a,b)=>b.p.score-a.p.score);
  const best = order[0].p.score;
  return order.map(({p,i})=>{
    const d = withDelta? p.score - S.T.before[i] : 0;
    return `<div class="score${p.score===best&&best>0?" lead":""}"><span>${esc(p.name)}${i===S.T.narrator&&withDelta?" <span class=\"hint\">(narrator)</span>":""}</span>
      <span><b>${p.score}</b>${d?`<span class="delta ${d>0?"up":"dn"}">${d>0?"+":""}${d}</span>`:""}</span></div>`;
  }).join("");
}

const VIEWS = {
setup(){
  const saved = loadSave();
  return `<h1>Story Smugglers</h1>
  <p class="sub">Tell one story together, and sneak secret words past the Customs officers listening in.</p>
  <p class="meta">3–10 players · about 15–25 minutes · one phone, passed to each Narrator</p>
  <hr class="rule">
  ${saved?`<div class="panel center"><p style="margin-top:0">A story is still being told: <b>${saved.players.map(p=>esc(p.name)).join(", ")}</b>.</p>
    <div class="row"><button class="primary" data-act="resume">Resume that game</button><button data-act="discard">Start fresh</button></div></div>`:""}
  <div class="panel">
    <p class="dropcap" style="margin-top:0">Every Narrator gets three secret Contraband words and forty seconds to continue the story out loud, slipping each word in so smoothly that nobody notices. Everyone else is Customs: the phone lies face-up in the middle, and when you think you just heard a smuggled word, slap your name and say it.</p>
    <ol class="rules">
      <li><b>Right seize:</b> the catcher scores 1.</li>
      <li><b>False alarm:</b> the catcher loses 1 and the Narrator gains 1, so bait them with odd innocent words!</li>
      <li><b>Slipped through unseen:</b> the Narrator scores 2 for every word. Smuggle all of them clean for a bonus point.</li>
      <li><b>Forgot to say one:</b> the Narrator loses 1 for each word never spoken.</li>
    </ol>
  </div>
  <div class="panel">
    <h2 class="h3">Who's playing?</h2>
    ${setup.names.map((n,i)=>`<div class="namegrid"><input type="text" maxlength="14" aria-label="Player ${i+1} name" placeholder="Player ${i+1}" value="${esc(n)}" data-name="${i}">
      <button class="x" data-act="del" data-i="${i}" aria-label="Remove player ${i+1}" ${setup.names.length<=3?"disabled":""}>✕</button></div>`).join("")}
    <button data-act="add" ${setup.names.length>=10?"disabled":""}>+ Add a player</button>
    <label class="fld" id="lapsL">Laps around the table</label>
    <div class="chips" role="group" aria-labelledby="lapsL">${[1,2,3].map(v=>`<button class="chip" data-act="laps" data-v="${v}" aria-pressed="${setup.laps===v}">${v} lap${v>1?"s":""}</button>`).join("")}</div>
    <label class="fld" id="secsL">Storytelling time per turn</label>
    <div class="chips" role="group" aria-labelledby="secsL">${[30,40,60].map(v=>`<button class="chip" data-act="secs" data-v="${v}" aria-pressed="${setup.secs===v}">${v} seconds</button>`).join("")}</div>
    <label class="fld" id="twL">Twist cards</label>
    <div class="chips" role="group" aria-labelledby="twL"><button class="chip" data-act="twists" aria-pressed="${setup.twists}">${setup.twists?"Twists on":"Twists off"}</button></div>
    <button class="primary big" data-act="start">Open the first chapter</button>
  </div>`;
},
intro(){
  const T=S.T, tw=twistOf(T.twist), first=S.turn===0, newLap=S.turn>0&&S.turn%S.players.length===0;
  return topBar()+`
  ${first?`<h2>The tale begins…</h2>`:newLap?`<h2>A new chapter!</h2>`:`<h2>Next Narrator</h2>`}
  ${storySoFar()}
  <div class="panel center">
    <p style="margin:0" class="hint">The story passes to</p>
    <p style="font-size:clamp(28px,8vw,44px);font-weight:700;margin:4px 0">${esc(narr().name)}</p>
    ${T.twist!=="none"?`<div class="card" style="text-align:left"><h2 class="h3">Twist: ${tw.name}</h2><p style="margin:0">${tw.desc}</p></div>`:`<p class="hint">${tw.name}: three words, ${T.secs} seconds.</p>`}
    <p>Hand the phone to <b>${esc(narr().name)}</b>. Everyone else, look away!</p>
    <button class="primary big" data-act="peek">I'm ${esc(narr().name)}, show my secret words</button>
  </div>
  <div class="panel"><h2 class="h3">Scores</h2>${scoreList(false)}</div>`;
},
peek(){
  const T=S.T;
  return topBar()+`<h2>Your contraband, ${esc(narr().name)}</h2>
  <p class="hint">Keep the screen to yourself. Memorise these, then slip every one into your part of the story.</p>
  ${T.words.map((w,i)=>`<span class="word${i===T.gold?" gold":""}">${esc(cap(w))}${i===T.gold?"<small>★ Golden: worth 4 if it slips through</small>":""}</span>`).join("")}
  ${T.herring?`<div class="card"><h2 class="h3">Your Red Herring: ${esc(cap(T.herring))}</h2><p style="margin:0">Say it suspiciously. If someone seizes it, tap “Red Herring!” and collect 3.</p></div>`:""}
  <p>You have <b>${T.secs} seconds</b>. Pick up the story where the last Narrator left off.</p>
  <button class="primary big" data-act="hide">Got them, hide my words</button>`;
},
ready(){
  const T=S.T;
  return topBar()+`<h2>Phone face-up in the middle</h2>
  ${storySoFar()}
  <div class="panel center"><p style="margin-top:0">Customs officers: listen closely. When you hear a word that sounds smuggled, slap your name and say the word out loud.</p>
  ${T.twist==="dogs"?`<p><b>Sniffer Dogs:</b> one seize each this turn.</p>`:""}
  <button class="primary big" data-act="go">${esc(narr().name)}: start the clock and tell!</button></div>`;
},
live(){
  const T=S.T, n=S.players.length, caught=correctSeizes();
  const pads = S.players.map((p,i)=>{
    if(i===T.narrator) return "";
    const used = T.seizes.filter(z=>z.p===i).length;
    const dis = T.twist==="dogs" && used>0;
    return `<button class="pad" data-act="seize" data-i="${i}" ${dis?"disabled":""}>Seize! ${esc(p.name)}<span class="s">${dis?"seize used":used?`${used} seize${used>1?"s":""} this turn`:"tap if you heard one"}</span></button>`;
  }).join("");
  return topBar()+`<p class="center hint" style="margin:0">${esc(narr().name)} is telling the story…</p>
  <div class="timer" id="tm">${Math.ceil(liveRemain)}</div>
  <div class="bar" aria-hidden="true"><i id="tb"></i></div>
  <p class="center" style="margin:8px 0 0"><span class="tag">Caught so far: ${caught} of ${T.words.length}</span></p>
  <div class="pads">${pads}</div>
  <div class="row" style="margin-top:14px">
    <button data-act="undo" ${T.seizes.length?"":"disabled"}>Undo last seize</button>
    <button class="primary" data-act="done">${esc(narr().name)} is done talking</button>
  </div>`;
},
reveal(){
  const T=S.T, caught=correctSeizes();
  if(!T.verdicts) T.verdicts = T.words.map(()=>"slip");
  const marked = T.verdicts.filter(v=>v==="caught").length;
  const opt=(i,v,l)=>`<button data-act="verdict" data-i="${i}" data-v="${v}" aria-pressed="${T.verdicts[i]===v}">${l}</button>`;
  return topBar()+`<h2>Customs inspection</h2>
  <p>Here's what ${esc(narr().name)} was smuggling. Agree as a table what happened to each word.</p>
  <p><span class="tag">Customs made ${caught} correct seize${caught===1?"":"s"}</span></p>
  <div class="panel">
  ${T.words.map((w,i)=>`<div class="vword">${i===T.gold?'<span class="star" aria-hidden="true">★ </span>':""}${esc(cap(w))}${i===T.gold?' <span class="hint">(Golden)</span>':""}</div>
    <div class="verdict" role="group" aria-label="What happened to ${esc(w)}">${opt(i,"slip","Slipped through")}${opt(i,"caught","Caught")}${opt(i,"never","Never said")}</div>`).join("")}
  ${marked!==caught?`<p class="hint">Heads up: ${marked} marked “Caught” but Customs made ${caught} correct seize${caught===1?"":"s"}. Double-check before you confirm.</p>`:""}
  </div>
  <button class="primary big" data-act="score">Confirm and score the turn</button>`;
},
summary(){
  const T=S.T, last = S.turn+1>=totalTurns();
  return topBar()+`<h2>${esc(T.summaryTitle)}</h2>
  <p>${T.summaryText}</p>
  <div class="panel"><h2 class="h3">Scores</h2>${scoreList(true)}</div>
  <button class="primary big" data-act="next">${last?"Close the book: final scores":"Pass the story on"}</button>`;
},
final(){
  const order = S.players.slice().sort((a,b)=>b.score-a.score);
  const best = order[0].score, winners = order.filter(p=>p.score===best);
  const award=(ic,title,key,desc)=>{ const m=Math.max(...S.players.map(p=>p[key])); if(m<=0) return "";
    const who=S.players.filter(p=>p[key]===m).map(p=>esc(p.name)).join(" & ");
    return `<div class="award"><span class="ic" aria-hidden="true">${ic}</span><div><b>${title}: ${who}</b><br><span class="hint">${desc(m)}</span></div></div>`; };
  return `<h1>The End</h1>
  <p class="sub">${winners.length>1?"A tie! ":""}${winners.map(p=>esc(p.name)).join(" & ")} ${winners.length>1?"share":"takes"} the crown with ${best} point${best===1?"":"s"}.</p>
  <hr class="rule">
  <div class="panel"><h2 class="h3">Final scores</h2>${order.map((p,i)=>`<div class="score${p.score===best?" lead":""}"><span>${i+1}. ${esc(p.name)}</span><b>${p.score}</b></div>`).join("")}</div>
  <div class="panel"><h2 class="h3">Awards</h2>
    ${award("🧳","Master Smuggler","slipped",m=>`${m} word${m>1?"s":""} slipped past Customs`)}
    ${award("🦅","Eagle Eye","caught",m=>`${m} correct seize${m>1?"s":""}`)}
    ${award("🐟","Took the Bait","falses",m=>`${m} false alarm${m>1?"s":""}`)}
    ${award("🫢","Butterfingers","dropped",m=>`${m} word${m>1?"s":""} never made it into the story`)}
  </div>
  <div class="panel"><h2 class="h3">The tale you told</h2>
    <div class="story">${esc(S.opener)}</div>
    <p class="hint">…and it somehow featured:</p>
    <div class="souv">${S.souvenirs.map(x=>`<span class="${x.c?"c":""}">${esc(x.w)}${x.c?'<span class="sr"> (caught)</span>':""}</span>`).join("")||"<span>nothing at all!</span>"}</div>
    <p class="hint">Crossed-out words were caught by Customs.</p>
  </div>
  <div class="row"><button class="primary big" data-act="again">Play again, same players</button><button class="big" data-act="newgame">New game</button></div>`;
}
};

function render(){
  const phase = S? S.phase : "setup";
  $("#screen").innerHTML = VIEWS[phase]();
  if(phase==="live") paintTimer();
  $("#app").scrollTop = 0;
}

// ---------- LIVE TIMER ----------
function startLive(){
  liveRemain = S.T.secs; lastTick=-1; S.phase="live"; render(); resumeTimer();
}
function resumeTimer(){
  liveEnd = performance.now() + liveRemain*1000;
  clearInterval(timerId); timerId=setInterval(stepTimer,100);
}
function pauseTimer(){ clearInterval(timerId); timerId=null; liveRemain=Math.max(0,(liveEnd-performance.now())/1000); }
function stepTimer(){
  liveRemain = Math.max(0,(liveEnd-performance.now())/1000);
  const s=Math.ceil(liveRemain);
  if(s<=5 && s>0 && s!==lastTick){ lastTick=s; Snd.tick(); }
  paintTimer();
  if(liveRemain<=0){ clearInterval(timerId); timerId=null; Snd.timeUp(); toReveal(); }
}
function paintTimer(){
  const tm=$("#tm"), tb=$("#tb"); if(!tm) return;
  const s=Math.ceil(liveRemain); tm.textContent=s; tm.classList.toggle("low", s<=5);
  tb.style.width = (100*liveRemain/S.T.secs)+"%";
}
function toReveal(){ clearInterval(timerId); timerId=null; S.phase="reveal"; render(); }

// ---------- OVERLAY ----------
function openOv(html){ $("#ovBody").innerHTML=html; $("#ov").hidden=false; const b=$("#ovBody button"); if(b) b.focus(); }
function closeOv(){ $("#ov").hidden=true; $("#ovBody").innerHTML=""; }
let pendingSeize=-1;
function seize(i){
  Snd.seize(); pauseTimer(); pendingSeize=i;
  const p=S.players[i], T=S.T;
  openOv(`<h2 id="ovTitle">${esc(p.name)} seizes!</h2>
  <p>${esc(p.name)}, say the word you heard out loud.</p>
  <p><b>${esc(narr().name)}</b>, was that one of your secret words?</p>
  <button class="primary big" data-act="sz-yes">Yes, caught it</button>
  <button class="big" data-act="sz-no">No, false alarm</button>
  ${T.herring?`<button class="big" data-act="sz-herring">Red Herring! (pays me 3)</button>`:""}
  <button class="big" data-act="sz-cancel">Oops, tapped by mistake</button>`);
}
function resolveSeize(kind){
  const T=S.T, i=pendingSeize, p=S.players[i], n=narr();
  closeOv(); pendingSeize=-1;
  if(kind==="cancel"){ resumeAfterSeize(); return; }
  const z={p:i, ok:kind, dP:0, dN:0};
  if(kind==="yes"){ z.dP=1; Snd.good(); }
  else { z.dP = p.score>0? -1 : 0; z.dN = kind==="herring"?3:1; Snd.bad(); }
  p.score+=z.dP; n.score+=z.dN;
  if(kind==="yes") p.caught++; else p.falses++;
  T.seizes.push(z);
  if(correctSeizes()>=T.words.length){ toReveal(); return; }
  resumeAfterSeize();
}
function resumeAfterSeize(){ render(); if(liveRemain>0) resumeTimer(); else toReveal(); }
function undoSeize(){
  const T=S.T, z=T.seizes.pop(); if(!z) return;
  const p=S.players[z.p]; p.score-=z.dP; narr().score-=z.dN;
  if(z.ok==="yes") p.caught--; else p.falses--;
  Snd.tap(); pauseTimer(); render(); resumeTimer();
}

// ---------- SCORING ----------
function scoreTurn(){
  const T=S.T, n=narr(); let pts=0, slipped=0, never=0;
  T.words.forEach((w,i)=>{
    const v=T.verdicts[i];
    if(v==="slip"){ pts += i===T.gold?4:2; slipped++; S.souvenirs.push({w,c:false}); }
    else if(v==="caught"){ S.souvenirs.push({w,c:true}); }
    else { never++; }
  });
  const clean = slipped===T.words.length;
  if(clean) pts+=1;
  pts -= never;
  n.score = Math.max(0, n.score+pts);
  n.slipped += slipped; n.dropped += never;
  if(clean){ T.summaryTitle="A clean run!"; T.summaryText=`${esc(n.name)} smuggled every single word past Customs, plus a bonus point.`; Snd.win(); }
  else if(slipped===0){ T.summaryTitle="Customs wins this round"; T.summaryText=`Not one word slipped through for ${esc(n.name)}. Sharp ears, everyone.`; Snd.bad(); }
  else { T.summaryTitle=`${slipped} word${slipped>1?"s":""} slipped through`; T.summaryText=`${esc(n.name)} got ${slipped} of ${T.words.length} past Customs${never?`, but forgot to say ${never}`:""}.`; Snd.good(); }
  S.phase="summary"; save(); render();
}
function nextTurn(){
  S.turn++;
  if(S.turn>=totalTurns()){ S.phase="final"; clearSave(); Snd.win(); render(); return; }
  startTurn(); Snd.motif();
}

// ---------- EVENTS ----------
document.addEventListener("input", e=>{
  const i=e.target.dataset.name; if(i!==undefined) setup.names[+i]=e.target.value;
});
document.addEventListener("click", e=>{
  const b=e.target.closest("button[data-act]"); if(!b||b.disabled) return;
  Snd.init();
  const a=b.dataset.act, i=+b.dataset.i;
  switch(a){
    case "add": setup.names.push(""); Snd.tap(); render(); { const ins=document.querySelectorAll("input[data-name]"); ins[ins.length-1].focus(); } break;
    case "del": setup.names.splice(i,1); Snd.tap(); render(); break;
    case "laps": setup.laps=+b.dataset.v; Snd.tap(); render(); break;
    case "secs": setup.secs=+b.dataset.v; Snd.tap(); render(); break;
    case "twists": setup.twists=!setup.twists; Snd.tap(); render(); break;
    case "start": {
      const names = setup.names.map((n,k)=>n.trim()||`Player ${k+1}`);
      const seen={}; const uniq=names.map(n=>{ seen[n]=(seen[n]||0)+1; return seen[n]>1?`${n} ${seen[n]}`:n; });
      Snd.motif(); newGame(uniq); break; }
    case "resume": S=loadSave(); if(S){ if(["peek","ready","live","reveal"].includes(S.phase)) rewindTurn(); Snd.motif(); render(); } break;
    case "discard": clearSave(); Snd.tap(); render(); break;
    case "mute": Snd.setMuted(!Snd.muted); b.setAttribute("aria-pressed",Snd.muted); b.textContent=Snd.muted?"Sound off":"Sound on"; break;
    case "menu": {
      const wasLive = S.phase==="live"; if(wasLive) pauseTimer();
      openOv(`<h2 id="ovTitle">Menu</h2>
        <button class="big" data-act="ov-close">Back to the story</button>
        <button class="big" data-act="ov-end">End now and show final scores</button>
        <button class="big" data-act="ov-quit">Quit to the title screen</button>
        <p class="hint">Quitting keeps your game saved so you can resume it.</p>`); break; }
    case "ov-close": closeOv(); if(S.phase==="live" && liveRemain>0) resumeTimer(); break;
    case "ov-end": closeOv(); clearInterval(timerId); S.phase="final"; clearSave(); Snd.win(); render(); break;
    case "ov-quit": closeOv(); clearInterval(timerId); timerId=null;
      if(S.phase!=="final"){ if(["peek","ready","live","reveal"].includes(S.phase)) rewindTurn(); save(); }
      S=null; render(); break;
    case "peek": Snd.tap(); S.phase="peek"; render(); break;
    case "hide": Snd.tap(); S.phase="ready"; render(); break;
    case "go": Snd.motif(); startLive(); break;
    case "seize": seize(i); break;
    case "sz-yes": resolveSeize("yes"); break;
    case "sz-no": resolveSeize("no"); break;
    case "sz-herring": resolveSeize("herring"); break;
    case "sz-cancel": resolveSeize("cancel"); break;
    case "undo": undoSeize(); break;
    case "done": Snd.tap(); toReveal(); break;
    case "verdict": S.T.verdicts[i]=b.dataset.v; Snd.tap(); render(); break;
    case "score": scoreTurn(); break;
    case "next": nextTurn(); break;
    case "again": { const names=S.players.map(p=>p.name); setup.laps=S.laps; setup.secs=S.secs; setup.twists=S.twists; Snd.motif(); newGame(names); break; }
    case "newgame": S=null; clearSave(); Snd.tap(); render(); break;
  }
});
// a turn interrupted mid-way restarts from its intro with the scores it started with
function rewindTurn(){
  const T=S.T; if(T.snap) S.players=JSON.parse(T.snap);
  T.seizes=[]; T.verdicts=null; S.phase="intro";
}
document.addEventListener("keydown", e=>{ if(e.key==="Escape" && !$("#ov").hidden && S && S.phase!=="live"){ closeOv(); } });
render();
</script>
</body>
</html>
