<!-- CONCEPT: Word Games - Fridge Magnet Poets: build the funniest sentence from random fridge-magnet word tiles to answer a silly prompt, then the room votes; a hidden-in-plain-sight Gold Word gives bonus points -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fridge Magnet Poets</title>
<style>
:root{--bg:#14122b;--bg2:#221d4a;--card:#fff7df;--ink:#1a1530;--pink:#ff3d81;--yellow:#ffd23f;--cyan:#2ee6d6;--violet:#8f7bff;--white:#fff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:radial-gradient(circle at 20% 0%,#2d2670 0,var(--bg) 55%) fixed;color:var(--white);font-family:'Trebuchet MS',system-ui,-apple-system,Segoe UI,sans-serif}
body{padding:env(safe-area-inset-top) 0 40px}
#app{max-width:1240px;margin:0 auto;padding:18px 18px 30px}
h1{margin:0;font-size:clamp(40px,8vw,92px);line-height:.95;letter-spacing:-1px;text-shadow:0 5px 0 #000a}
h1 span{color:var(--yellow)}
h2{margin:0 0 10px;font-size:clamp(26px,4vw,46px)}
.sub{font-size:clamp(18px,2.4vw,28px);opacity:.92;margin:10px 0}
.meta{display:inline-block;background:#ffffff1a;border:2px solid #ffffff44;border-radius:999px;padding:8px 18px;font-weight:700;font-size:clamp(15px,1.8vw,21px);margin:6px 6px 6px 0}
.panel{background:#ffffff12;border:2px solid #ffffff2a;border-radius:22px;padding:20px;margin:16px 0}
.card{background:var(--card);color:var(--ink);border-radius:22px;padding:22px;box-shadow:0 8px 0 #b9a77a,0 16px 30px #0008}
.btn{font:900 clamp(20px,2.6vw,30px) 'Trebuchet MS',system-ui,sans-serif;min-height:64px;padding:12px 30px;border:0;border-radius:18px;background:var(--yellow);color:var(--ink);cursor:pointer;box-shadow:0 6px 0 #a5810a;touch-action:manipulation;transition:transform .08s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #a5810a}
.btn.pink{background:var(--pink);color:#fff;box-shadow:0 6px 0 #9b1648}
.btn.cyan{background:var(--cyan);box-shadow:0 6px 0 #11877e}
.btn.ghost{background:#ffffff1f;color:#fff;box-shadow:0 6px 0 #0006;border:2px solid #ffffff55}
.btn.small{min-height:48px;padding:8px 18px;font-size:clamp(16px,1.8vw,22px)}
.btn[disabled]{opacity:.4;pointer-events:none}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.center{text-align:center;justify-content:center}
.grow{flex:1}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{font:800 clamp(17px,2vw,24px) inherit;font-family:inherit;min-height:52px;padding:8px 20px;border-radius:14px;border:3px solid #ffffff55;background:#ffffff14;color:#fff;cursor:pointer}
.seg button.on{background:var(--cyan);color:var(--ink);border-color:var(--cyan)}
.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.nrow{display:flex;gap:8px;align-items:center}
.nrow input{flex:1;min-width:0;font:700 22px inherit;font-family:inherit;padding:12px 14px;border-radius:14px;border:3px solid #ffffff55;background:#0006;color:#fff}
.nrow input:focus{outline:none;border-color:var(--yellow)}
.av{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-size:28px;flex:none;border:3px solid #fff}
.xbtn{width:44px;height:44px;border-radius:12px;border:0;background:#ffffff22;color:#fff;font-size:22px;cursor:pointer}
.how{font-size:clamp(18px,2.3vw,26px);line-height:1.35}
.how b{color:var(--yellow)}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px;flex-wrap:wrap}
.pill{background:#ffffff22;border-radius:999px;padding:6px 16px;font-weight:800;font-size:clamp(15px,1.8vw,22px)}
.promptcard{font-size:clamp(28px,5vw,64px);font-weight:900;line-height:1.1;text-align:center;font-family:Georgia,serif;font-style:italic}
.promptcard small{display:block;font:800 clamp(14px,1.6vw,20px) 'Trebuchet MS',sans-serif;font-style:normal;color:#7a6a3d;letter-spacing:2px;text-transform:uppercase;margin-bottom:8px}
.gold{background:linear-gradient(135deg,#fff3a0,#ffc400 55%,#ff9d00);color:#3a2600!important}
.score{display:flex;flex-wrap:wrap;gap:8px}
.sc{display:flex;align-items:center;gap:8px;background:#ffffff1a;border-radius:999px;padding:5px 14px 5px 6px;font-weight:800;font-size:clamp(14px,1.7vw,20px)}
.sc .av{width:34px;height:34px;font-size:19px;border-width:2px}
.sc b{color:var(--yellow);font-size:1.2em}
.tile{display:inline-block;font:800 clamp(19px,2.3vw,30px)/1 'Trebuchet MS',system-ui,sans-serif;background:var(--card);color:var(--ink);padding:.55em .8em;border-radius:8px;border:0;box-shadow:0 3px 0 #b9a77a,0 6px 10px #0006;cursor:pointer;touch-action:manipulation;transform:rotate(var(--r,0deg));margin:5px;transition:transform .08s,opacity .15s}
.tile:active{transform:rotate(var(--r,0deg)) scale(.93)}
.tile.func{background:#cfeeff;box-shadow:0 3px 0 #7da9bf,0 6px 10px #0006;font-size:clamp(16px,1.9vw,24px)}
.tile.punct,.tile.suffix{background:#ffd3e4;box-shadow:0 3px 0 #c18098,0 6px 10px #0006;font-size:clamp(16px,1.9vw,24px)}
.tile.goldt{background:linear-gradient(135deg,#fff3a0,#ffc400 55%,#ff9d00);box-shadow:0 3px 0 #b27a00,0 0 18px #ffd23f,0 6px 10px #0006}
.tile.used{opacity:.22;pointer-events:none}
.tile.sel{outline:5px solid var(--cyan);outline-offset:2px}
.chip{display:inline-block;font:800 var(--cs,clamp(22px,3.4vw,46px))/1 'Trebuchet MS',system-ui,sans-serif;background:var(--card);color:var(--ink);padding:.5em .7em;border-radius:8px;box-shadow:0 3px 0 #b9a77a,0 6px 10px #0006;margin:6px;transform:rotate(var(--r,0deg))}
.chip.func{background:#cfeeff}.chip.punct,.chip.suffix{background:#ffd3e4}.chip.goldt{background:linear-gradient(135deg,#fff3a0,#ffc400 55%,#ff9d00)}
.chip.attach{margin-left:-6px}
.poem{padding:10px 4px;line-height:1.5}
.sentence{min-height:140px;background:#0007;border:3px dashed #ffffff66;border-radius:20px;padding:12px;display:flex;flex-wrap:wrap;align-items:center;--cs:clamp(20px,2.8vw,36px)}
.sentence .tile{margin:6px}
.sentence.empty::before{content:'Tap magnets below to build your masterpiece…';opacity:.55;font-size:clamp(18px,2.2vw,28px);font-weight:700}
.hand{display:flex;flex-wrap:wrap;justify-content:center;padding:6px 0}
.timer{font-size:clamp(34px,5vw,60px);font-weight:900;min-width:2.3ch;text-align:center;background:#0008;border-radius:16px;padding:2px 16px;border:3px solid var(--cyan)}
.timer.low{border-color:var(--pink);color:var(--pink);animation:pulse .5s infinite alternate}
@keyframes pulse{to{transform:scale(1.12)}}
.pass{text-align:center;padding:30px 0}
.pass .av{width:150px;height:150px;font-size:84px;margin:0 auto 14px;border-width:6px}
.pass h2{font-size:clamp(34px,6vw,76px)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:16px}
@media(max-width:520px){.grid{grid-template-columns:1fr}}
.vcard{background:#ffffff14;border:3px solid #ffffff33;border-radius:20px;padding:12px;--cs:clamp(17px,2vw,26px)}
.vcard .num{font-weight:900;color:var(--yellow);font-size:26px}
.vctl{display:flex;align-items:center;justify-content:center;gap:16px;margin-top:6px}
.vctl button{width:64px;height:64px;border-radius:50%;border:0;font-size:36px;font-weight:900;background:var(--cyan);color:var(--ink);cursor:pointer}
.vctl button.m{background:#ffffff33;color:#fff}
.vctl .v{font-size:48px;font-weight:900;min-width:2ch;text-align:center}
.res{display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:#ffffff14;border:3px solid #ffffff33;border-radius:20px;padding:12px;margin:12px 0;--cs:clamp(17px,2vw,26px);animation:rise .5s both}
.res.win{border-color:var(--yellow);background:#ffd23f26;box-shadow:0 0 30px #ffd23f66}
@keyframes rise{from{opacity:0;transform:translateY(24px)}}
.who{display:flex;flex-direction:column;align-items:center;min-width:120px;font-weight:900;font-size:20px}
.who .av{margin-bottom:4px}
.badge{display:inline-block;background:var(--yellow);color:var(--ink);border-radius:999px;padding:4px 12px;font-weight:900;font-size:17px;margin:2px}
.badge.p{background:var(--pink);color:#fff}.badge.c{background:var(--cyan)}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:12px;margin:20px 0}
.pod{text-align:center;flex:1;max-width:260px}
.pod .blk{border-radius:16px 16px 0 0;display:grid;place-items:start center;padding-top:10px;font-weight:900;font-size:clamp(30px,5vw,60px);color:var(--ink)}
.pod .av{margin:0 auto 6px;width:90px;height:90px;font-size:50px}
.pod .nm{font-weight:900;font-size:clamp(18px,2.4vw,30px)}
.conf{position:fixed;top:-40px;font-size:30px;pointer-events:none;z-index:50;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(115vh) rotate(540deg)}}
#mute{position:fixed;right:12px;bottom:12px;z-index:40;width:48px;height:48px;border-radius:50%;border:2px solid #ffffff55;background:#0008;color:#fff;font-size:22px;cursor:pointer}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.hint{opacity:.8;font-size:clamp(15px,1.8vw,22px)}
</style>
</head>
<body>
<button id="mute" data-a="mute" title="Sound on/off" aria-label="Sound on/off">🔊</button>
<div id="app"></div>
<script>
"use strict";
/* ---------- helpers ---------- */
const $app=document.getElementById('app');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const COLORS=['#ff3d81','#ffd23f','#2ee6d6','#8f7bff','#ff8a3d','#6dff8a','#4da3ff','#ff6b6b','#d36bff','#b8e04a'];
const EMOJI=['🦊','🐙','🦄','🐸','🦖','🐧','🐝','🦉','🐼','🦈'];

/* ---------- audio (Web Audio API, no files) ---------- */
let AC=null,muted=false;
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC;}
function tone(f,d=.12,type='sine',v=.15,delay=0,slide=0){if(muted)return;const c=ac();if(!c)return;const t=c.currentTime+delay,o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+d+.03);}
const SFX={
 pop:()=>tone(500+Math.random()*160,.07,'triangle',.2),
 unpop:()=>tone(340,.09,'triangle',.15,0,-120),
 submit:()=>{tone(523,.1,'square',.09);tone(784,.18,'square',.09,.09);},
 tick:()=>tone(900,.05,'square',.07),
 buzz:()=>tone(130,.35,'sawtooth',.14),
 reveal:()=>{tone(180,.18,'triangle',.28,0,-60);tone(392,.22,'sine',.16,.12);},
 vote:()=>tone(660,.08,'sine',.2),
 gold:()=>[988,1319,1568].forEach((f,i)=>tone(f,.16,'sine',.16,i*.07)),
 fanfare:()=>[523,659,784,1047,1319,1568].forEach((f,i)=>tone(f,.28,'triangle',.18,i*.1)),
 next:()=>tone(440,.08,'sine',.12)
};

/* ---------- content ---------- */
const PROMPTS=["A fortune cookie fortune that is slightly threatening","The worst slogan for a dentist","A dramatic movie trailer line","A text message from your cat","The last words of a pirate who lost the treasure map","A terrible pickup line used at a library","A weather forecast from a very grumpy meteorologist","The sign on the door of a haunted pizza shop","A motivational poster for sloths","An awkward toast at a wedding","A one-star review of the moon","A secret message from a squirrel to the mayor","Instructions on a bottle of dragon shampoo","A tweet from a very confused robot","The worst advice a grandma ever gave","A new ice cream flavor nobody asked for","A knight's complaint to customer service","A bedtime story that ends badly","Your superhero's catchphrase","A note left on the fridge by a ghost roommate","A love poem to a sandwich","The title of the most boring documentary ever","A job application from a wizard","Breaking news from the animal kingdom","What the dog really thinks of the mail carrier","A vacation postcard from the bottom of the ocean","The rules of a very strange board game","An apology from a T. rex","A sales pitch for something totally useless","A bumper sticker nobody should drive with","Today's special at an alien diner","A warning label for a tickle machine","A dramatic announcement from an airplane captain","A song lyric about socks","A lost-and-found sign for something impossible","A kindergarten teacher's fiercest threat","A cartoon villain's worst business plan","What the pizza says right before it is eaten","An excuse for being late because of a dragon","A horoscope that is weirdly specific","A reality show title you would absolutely binge","Advice from a wise old tree","The caption under an embarrassing family photo","A scary campfire story that is secretly about homework","The slogan of a breakfast cereal for grown-ups","A tourist brochure for your hometown (lies only)","A strongly worded letter from a potato","A pep talk for a nervous goldfish","A brand new holiday and how we celebrate it","A robot's first-ever poem","A prediction about the year 3000","The worst possible name for a boat","A message in a bottle","A grumpy note from the tooth fairy","An action movie one-liner about vegetables","The tagline for a mattress that does way too much","A museum sign for a very ordinary rock","A greeting card that should never be sent","A cheer for the world's slowest race","A complaint from the sun","A magic spell that goes hilariously wrong","A diary entry from a houseplant","A pirate's online dating profile","The strictest rule at the silliest library","A voicemail from a time traveler","A drive-thru order placed by a dragon"];
const NOUNS=["banana","wizard","pickle","dragon","sandwich","volcano","penguin","sock","moon","taco","ghost","robot","castle","noodle","llama","pirate","cheese","goblin","trampoline","pancake","mustache","spaghetti","dinosaur","unicorn","potato","rocket","jellyfish","disco","tornado","cupcake","squirrel","kitten","broccoli","ninja","treasure","bagel","walrus","popcorn","umbrella","hamster","mermaid","cactus","bubble","couch","cowboy","thunder","waffle","monkey","pudding","giraffe","sneeze","hiccup","cookie","pajamas","mountain","sparkle","teacup","trumpet","dolphin","pizza","kingdom","raccoon","backpack","sausage","galaxy","monster","burrito","bicycle","octopus","marshmallow","scooter","bathtub","parade","lasagna","detective","toaster","elephant","jungle","sidekick","lizard","accordion","meatball","dance","homework","spaceship","sunshine","cabbage","puppet","gorilla","pretzel","shoelace","wombat","lightning","skateboard","tuba","hotdog","princess","caveman","snowman","carnival","cheddar","island","clown","muffin","crayon","submarine","rainbow","peanut","hippo","teapot","doorbell","superhero","owl","soup","chicken","fireworks","grandma","captain","kazoo","dumpling","tiger","slipper","balloon","yodel","barbecue","detention","magician","zombie","avocado","bunny","lemon","pigeon","coconut","vampire","jester","blanket","tractor","campfire","cheeseburger","notebook","goldfish"];
const VERBS=["dance","explode","giggle","wobble","gallop","snore","sneak","juggle","tickle","gobble","float","yell","wiggle","sprint","whisper","bounce","steal","vanish","sing","tumble","chase","cuddle","slurp","waddle","fly","munch","melt","spin","splash","hug","invent","sparkle","stomp","sneeze","laugh","hide","jump","flip","cook","nap","guess","borrow","trade","scream","pretend","surf","rescue","wander","crash","pounce","grow","shrink","build","swing","tiptoe","argue","party","slide","fetch","wave","brag","escape","moo"];
const ADJ=["fuzzy","mysterious","enormous","tiny","spicy","soggy","magnificent","wobbly","sneaky","glittery","haunted","cheesy","grumpy","fancy","ancient","squishy","bonkers","majestic","lumpy","sparkly","cosmic","dramatic","slippery","furious","jolly","legendary","crunchy","awkward","sleepy","brave","goofy","electric","suspicious","delicious","clumsy","invisible","shiny","stinky","gigantic","mighty","silly","secret","frozen","ticklish","noisy","royal","hungry","lonely","flaming","polite","strange","golden","creepy","speedy","bouncy","cranky","fabulous","sticky","cursed","enchanted","wild","heroic","buttery","funky"];
const MISC=["never","always","tonight","forever","suddenly","quickly","secretly","softly","loudly","almost","maybe","please","again","slowly","together","instantly","absolutely","gently","boldly","nobody","everyone","somebody","tomorrow","yesterday","very","extremely","probably","finally","badly","happily"];
const GOLDS=["banana","wobbly","kazoo","majestic","bonkers","pickle","sneeze","galloping","glitter","noodle","rascal","thunder","squishy","ferocious","pajamas","cheddar","ninja","gigantic","tiny","mystery","wizard","jiggle","disco","sparkle","marshmallow","lumpy","fancy","rocket","grumpy","llama","trombone","gobble","mustache","haunted","bubble","spicy","pirate","tornado","couch","yodel"];
const FUNCS=["the","a","my","your","our","I","you","we","it","he","she","they","is","are","was","will","can","to","of","in","on","with","for","and","but","not","no","so","if","this","that","from","at","by","me","his","her"];
const SUFFIX=["s","ing","ed","y","ly","er"];
const PUNCT=[",",".","!","?","...","'s"];

/* ---------- state ---------- */
let S={names:['','','',''],rounds:4,timer:60};
let G=null,T=null,usedPrompts=new Set();
const player=i=>G.players[i];
const avatar=i=>`<span class="av" style="background:${COLORS[i%10]}">${EMOJI[i%10]}</span>`;
function stopTimer(){if(T){clearInterval(T);T=null;}}
function pick(pool,n,ban){return shuffle(pool.filter(w=>!ban.has(w))).slice(0,n);}
function rot(i){return ((i*37+11)%9-4)*.7;}
function poemText(tk){let s='';tk.forEach((t,i)=>{s+=(i&&!t.attach?' ':'')+t.text;});return s;}
function chips(tk,gold){return tk.map((t,i)=>`<span class="chip ${t.kind==='gold'?'goldt':t.kind} ${t.attach?'attach':''}" style="--r:${rot(i)}deg">${t.kind==='gold'?'★ ':''}${esc(i===0?t.text.charAt(0).toUpperCase()+t.text.slice(1):t.text)}</span>`).join('');}
function scoreStrip(){return `<div class="score">${G.players.map((p,i)=>`<div class="sc">${avatar(i)}${esc(p.name)} <b>${p.score}</b></div>`).join('')}</div>`;}
function head(){return `<div class="top"><div class="pill">✨ Fridge Magnet Poets</div><div class="pill">Round ${G.round} of ${G.rounds}</div></div>`;}

/* ---------- game flow ---------- */
function startGame(){
  const names=S.names.map((n,i)=>n.trim()||('Player '+(i+1)));
  G={players:names.map(n=>({name:n,score:0})),rounds:S.rounds,round:0,timerSecs:S.timer,hall:[],screen:'intro'};
  usedPrompts=new Set();
  newRound();
}
function replay(){
  G.players.forEach(p=>p.score=0);G.round=0;G.hall=[];newRound();
}
function newRound(){
  G.round++;
  let avail=PROMPTS.filter(p=>!usedPrompts.has(p));
  if(avail.length<2){usedPrompts=new Set();avail=PROMPTS.slice();}
  G.prompt=avail[Math.floor(Math.random()*avail.length)];usedPrompts.add(G.prompt);
  G.gold=GOLDS[Math.floor(Math.random()*GOLDS.length)];
  G.poems=[];G.turn=0;G.sel=-1;G.screen='intro';render();
}
function dealHand(){
  const ban=new Set([G.gold]);
  const h=[];
  [[NOUNS,6],[VERBS,4],[ADJ,4],[MISC,2]].forEach(([pool,n])=>pick(pool,n,ban).forEach(w=>{ban.add(w);h.push({text:w,kind:'rand',used:false});}));
  h.push({text:G.gold,kind:'gold',used:false});
  return shuffle(h);
}
function beginTurn(){G.cur={tokens:[],hand:dealHand(),swapped:false};G.sel=-1;G.screen='build';
  if(G.timerSecs){G.left=G.timerSecs;stopTimer();T=setInterval(()=>{G.left--;const el=document.getElementById('timer');if(el){el.textContent=G.left;el.classList.toggle('low',G.left<=10);}if(G.left<=5&&G.left>0)SFX.tick();if(G.left<=0){stopTimer();submit(true);}},1000);}
  render();}
function wordCount(){return G.cur.tokens.filter(t=>t.kind==='rand'||t.kind==='gold'||t.kind==='func').length;}
function submit(auto){
  const tk=G.cur.tokens.slice();
  if(wordCount()<3&&!auto){SFX.buzz();const s=document.querySelector('.sentence');if(s){s.classList.remove('shake');void s.offsetWidth;s.classList.add('shake');}return;}
  stopTimer();
  let list=tk;
  if(!tk.some(t=>t.kind!=='punct'&&t.kind!=='suffix')) list=[{text:'(froze up and said nothing!)',kind:'func'}];
  G.poems.push({player:G.turn,tokens:list,gold:list.some(t=>t.kind==='gold'),votes:0,gain:0});
  SFX.submit();
  G.turn++;
  if(G.turn>=G.players.length){G.screen='gather';}else{G.screen='pass';}
  render();
}
function finishVoting(){
  const maxV=Math.max(...G.poems.map(p=>p.votes));
  G.poems.forEach(p=>{
    p.win=maxV>0&&p.votes===maxV;
    p.gain=p.votes+(p.gold?1:0)+(p.win?2:0);
    G.players[p.player].score+=p.gain;
    G.hall.push({prompt:G.prompt,text:poemText(p.tokens),tokens:p.tokens,player:p.player,votes:p.votes});
  });
  G.resOrder=G.poems.slice().sort((a,b)=>b.votes-a.votes);
  G.screen='results';SFX.fanfare();render();confetti(25);
}

/* ---------- actions ---------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b)return;
  ac();const a=b.dataset.a,i=parseInt(b.dataset.i,10);
  act(a,i,b.dataset.v);
});
function act(a,i,v){
  switch(a){
  case 'mute':muted=!muted;document.getElementById('mute').textContent=muted?'🔇':'🔊';return;
  case 'addp':if(S.names.length<10){S.names.push('');SFX.pop();render();}return;
  case 'rmp':if(S.names.length>3){S.names.splice(i,1);SFX.unpop();render();}return;
  case 'rounds':S.rounds=+v;SFX.pop();render();return;
  case 'timer':S.timer=+v;SFX.pop();render();return;
  case 'start':SFX.fanfare();startGame();return;
  case 'intro-go':G.screen='pass';SFX.next();render();return;
  case 'pass-go':SFX.next();beginTurn();return;
  case 'hand':{const h=G.cur.hand[i];if(!h||h.used||G.cur.tokens.length>=22)return;h.used=true;G.cur.tokens.push({text:h.text,kind:h.kind,hi:i});h.kind==='gold'?SFX.gold():SFX.pop();render();return;}
  case 'func':{if(G.cur.tokens.length>=22)return;G.cur.tokens.push({text:v==='f'?FUNCS[i]:v==='s'?SUFFIX[i]:PUNCT[i],kind:v==='f'?'func':v==='s'?'suffix':'punct',hi:-1,attach:v!=='f'});SFX.pop();render();return;}
  case 'tok':G.sel=(G.sel===i?-1:i);SFX.next();render();return;
  case 'left':if(G.sel>0){const t=G.cur.tokens;[t[G.sel-1],t[G.sel]]=[t[G.sel],t[G.sel-1]];G.sel--;SFX.pop();render();}return;
  case 'right':if(G.sel>=0&&G.sel<G.cur.tokens.length-1){const t=G.cur.tokens;[t[G.sel+1],t[G.sel]]=[t[G.sel],t[G.sel+1]];G.sel++;SFX.pop();render();}return;
  case 'del':if(G.sel>=0){removeTok(G.sel);G.sel=-1;SFX.unpop();render();}return;
  case 'undo':if(G.cur.tokens.length){removeTok(G.cur.tokens.length-1);G.sel=-1;SFX.unpop();render();}return;
  case 'clear':G.cur.tokens.slice().forEach(()=>removeTok(0));G.sel=-1;SFX.unpop();render();return;
  case 'shuffle':{if(G.cur.swapped)return;G.cur.swapped=true;const ban=new Set([G.gold]);G.cur.hand.forEach(h=>ban.add(h.text));
      G.cur.hand.forEach((h,idx)=>{if(h.kind==='rand'&&!h.used){const pool=(NOUNS.includes(h.text)?NOUNS:VERBS.includes(h.text)?VERBS:ADJ.includes(h.text)?ADJ:MISC);const n=pick(pool,1,ban)[0];if(n){h.text=n;ban.add(n);}}});
      SFX.reveal();render();return;}
  case 'submit':submit(false);return;
  case 'gather-go':G.revIdx=0;G.order=shuffle(G.poems.map((p,k)=>k));G.screen='reveal';SFX.reveal();render();return;
  case 'next-rev':G.revIdx++;if(G.revIdx>=G.order.length){G.screen='vote';SFX.next();}else SFX.reveal();render();return;
  case 'vplus':G.poems[i].votes++;SFX.vote();render();return;
  case 'vminus':if(G.poems[i].votes>0){G.poems[i].votes--;SFX.unpop();render();}return;
  case 'reveal-authors':finishVoting();return;
  case 'next-round':if(G.round>=G.rounds){G.screen='final';SFX.fanfare();render();confetti(60);}else newRound();return;
  case 'again':SFX.fanfare();replay();return;
  case 'new':stopTimer();G=null;render();return;
  }
}
function b_kind(v){return v;}
function removeTok(k){const t=G.cur.tokens[k];if(t&&t.hi>=0)G.cur.hand[t.hi].used=false;G.cur.tokens.splice(k,1);}
document.addEventListener('input',e=>{const el=e.target;if(el.dataset&&el.dataset.n!==undefined){S.names[+el.dataset.n]=el.value;}});

function confetti(n){const em=['🎉','✨','🧲','⭐','🎊','💛','🩷'];for(let k=0;k<n;k++){const s=document.createElement('span');s.className='conf';s.textContent=em[k%em.length];s.style.left=Math.random()*100+'vw';s.style.animationDuration=(2.5+Math.random()*3)+'s';s.style.animationDelay=Math.random()*1.2+'s';document.body.appendChild(s);setTimeout(()=>s.remove(),7500);}}

/* ---------- rendering ---------- */
function render(){
  window.scrollTo(0,0);
  if(!G){return $app.innerHTML=setupHTML();}
  const f={intro:introHTML,pass:passHTML,build:buildHTML,gather:gatherHTML,reveal:revealHTML,vote:voteHTML,results:resultsHTML,final:finalHTML}[G.screen];
  $app.innerHTML=f();
}
function setupHTML(){
  return `<div class="center" style="text-align:center;padding-top:20px"><h1>Fridge Magnet <span>Poets</span> 🧲</h1>
  <p class="sub">Build the funniest sentence you can from a pile of random magnet words, then let the room decide who is the poet laureate of the fridge.</p>
  <span class="meta">👥 3–10 players</span><span class="meta">⏱ about 20–30 min</span><span class="meta">📱 pass the device + room vote</span></div>
  <div class="panel how"><b>How to play:</b> every round shows a silly prompt. In secret, each player gets a hand of magnets and builds a sentence that answers it. Then every poem is read out loud (anonymously!) and <b>the room points at its favorite on the count of three</b>. One host holds the device and taps the votes. <b>★ Gold Word:</b> use the glowing gold magnet for +1 bonus point!</div>
  <div class="panel"><h2>Who's playing?</h2><div class="names">${S.names.map((n,i)=>`<div class="nrow">${avatar(i)}<input data-n="${i}" value="${esc(n)}" maxlength="14" placeholder="Player ${i+1}" aria-label="Player ${i+1} name">${S.names.length>3?`<button class="xbtn" data-a="rmp" data-i="${i}" aria-label="Remove player">✕</button>`:''}</div>`).join('')}</div>
  ${S.names.length<10?`<p><button class="btn small ghost" data-a="addp">+ Add player</button></p>`:''}</div>
  <div class="panel row" style="gap:30px"><div><h2 style="font-size:28px">Rounds</h2><div class="seg">${[3,4,6].map(r=>`<button class="${S.rounds===r?'on':''}" data-a="rounds" data-v="${r}">${r}</button>`).join('')}</div></div>
  <div><h2 style="font-size:28px">Build timer</h2><div class="seg">${[[0,'Off'],[45,'45s'],[60,'60s'],[90,'90s']].map(([v,l])=>`<button class="${S.timer===v?'on':''}" data-a="timer" data-v="${v}">${l}</button>`).join('')}</div></div></div>
  <p class="center" style="text-align:center"><button class="btn pink" data-a="start" style="font-size:clamp(26px,3.5vw,42px);padding:16px 50px">Start the Game ▶</button></p>`;
}
function introHTML(){
  return `${head()}${scoreStrip()}
  <div class="card" style="margin-top:20px"><div class="promptcard"><small>Round ${G.round} prompt</small>${esc(G.prompt)}</div></div>
  <div class="panel gold" style="display:flex;gap:16px;align-items:center;flex-wrap:wrap"><span style="font-size:48px">★</span><div class="how"><b style="color:#3a2600">Gold Word this round: <span style="font-size:1.4em;text-transform:uppercase">${esc(G.gold)}</span></b><br>It's glowing in everyone's hand. Use it in your sentence for +1 bonus point.</div></div>
  <p class="hint">Everyone takes a turn in secret: pass the device along. Most votes wins the round (+2). Each vote = +1 point.</p>
  <p class="center" style="text-align:center"><button class="btn" data-a="intro-go">Let's build! ▶ Pass to ${esc(player(0).name)}</button></p>`;
}
function passHTML(){
  const p=G.turn;
  return `${head()}<div class="pass">${avatar(p).replace('class="av"','class="av"')}<h2>Pass the device to<br><span style="color:${COLORS[p%10]}">${esc(player(p).name)}</span></h2>
  <p class="sub">Shield your screen — no peeking at the magnets! (${p+1} of ${G.players.length})</p>
  <div class="card" style="max-width:800px;margin:16px auto"><div class="promptcard" style="font-size:clamp(22px,3.4vw,40px)"><small>The prompt</small>${esc(G.prompt)}</div></div>
  <p><button class="btn pink" data-a="pass-go" style="font-size:clamp(24px,3.2vw,38px);padding:16px 44px">I'm ${esc(player(p).name)} — show my magnets</button></p></div>`;
}
function buildHTML(){
  const c=G.cur,p=G.turn;
  const sentence=c.tokens.map((t,i)=>`<button class="tile ${t.kind==='gold'?'goldt':t.kind} ${G.sel===i?'sel':''}" data-a="tok" data-i="${i}" style="--r:${rot(i)}deg;${t.attach?'margin-left:-8px':''}">${t.kind==='gold'?'★ ':''}${esc(t.text)}</button>`).join('');
  const hand=c.hand.map((h,i)=>`<button class="tile ${h.kind==='gold'?'goldt':''} ${h.used?'used':''}" data-a="hand" data-i="${i}" style="--r:${rot(i+3)}deg">${h.kind==='gold'?'★ ':''}${esc(h.text)}</button>`).join('');
  return `<div class="top"><div class="pill" style="background:${COLORS[p%10]};color:#14122b">${EMOJI[p%10]} ${esc(player(p).name)}'s magnets</div>
  <div class="pill grow" style="text-align:center;font-family:Georgia,serif;font-style:italic;font-size:clamp(16px,2.2vw,26px)">${esc(G.prompt)}</div>
  ${G.timerSecs?`<div class="timer ${G.left<=10?'low':''}" id="timer">${G.left}</div>`:''}</div>
  <div class="sentence ${c.tokens.length?'':'empty'}">${sentence}</div>
  <div class="row center" style="margin:10px 0;justify-content:center">
   <button class="btn small ghost" data-a="left" ${G.sel>0?'':'disabled'}>◀ Move</button>
   <button class="btn small ghost" data-a="right" ${G.sel>=0&&G.sel<c.tokens.length-1?'':'disabled'}>Move ▶</button>
   <button class="btn small ghost" data-a="del" ${G.sel>=0?'':'disabled'}>🗑 Remove</button>
   <button class="btn small ghost" data-a="undo" ${c.tokens.length?'':'disabled'}>↶ Undo</button>
   <button class="btn small ghost" data-a="clear" ${c.tokens.length?'':'disabled'}>Clear</button></div>
  <p class="hint" style="margin:0;text-align:center">Tap a magnet in your sentence to select it (then move or remove it). ★ Gold = +1 point.</p>
  <div class="hand">${hand}</div>
  <div class="panel" style="padding:8px 12px"><div class="hint" style="margin-left:6px">Free words &amp; endings (unlimited):</div><div class="hand" style="justify-content:flex-start">
   ${FUNCS.map((w,i)=>`<button class="tile func" data-a="func" data-v="f" data-i="${i}" style="--r:${rot(i)}deg">${w}</button>`).join('')}
   ${SUFFIX.map((w,i)=>`<button class="tile suffix" data-a="func" data-v="s" data-i="${i}" style="--r:${rot(i)}deg">-${w}</button>`).join('')}
   ${PUNCT.map((w,i)=>`<button class="tile punct" data-a="func" data-v="p" data-i="${i}" style="--r:${rot(i)}deg">${w}</button>`).join('')}</div></div>
  <div class="row center" style="justify-content:center"><button class="btn ghost small" data-a="shuffle" ${c.swapped?'disabled':''}>🔀 Swap unused magnets (once)</button>
  <button class="btn pink" data-a="submit">Lock it in ✔</button></div>`;
}
function gatherHTML(){
  return `${head()}<div class="pass"><div style="font-size:90px">🧲</div><h2>All ${G.players.length} poems are in!</h2>
  <p class="sub">Set the device where the whole room can see it. Poems will appear <b>one at a time, anonymously</b> — read each one out loud in your most dramatic voice!</p>
  <p><button class="btn pink" data-a="gather-go" style="font-size:clamp(24px,3.2vw,38px);padding:16px 44px">Start the reveal ▶</button></p></div>`;
}
function revealHTML(){
  const p=G.poems[G.order[G.revIdx]];const last=G.revIdx===G.order.length-1;
  return `${head()}<div class="card" style="margin-top:10px;text-align:center"><div class="promptcard" style="font-size:clamp(20px,3vw,36px)"><small>The prompt</small>${esc(G.prompt)}</div></div>
  <div class="panel center" style="text-align:center;min-height:230px;display:flex;flex-direction:column;justify-content:center;animation:rise .5s both"><div class="pill" style="align-self:center;margin-bottom:6px">Poem ${G.revIdx+1} of ${G.order.length}</div><div class="poem">${chips(p.tokens)}</div></div>
  <p class="hint center" style="text-align:center">Read it aloud like it's an Oscar speech! 🎭</p>
  <p class="center" style="text-align:center"><button class="btn" data-a="next-rev">${last?'Time to vote! ▶':'Next poem ▶'}</button></p>`;
}
function voteHTML(){
  const tot=G.poems.reduce((s,p)=>s+p.votes,0),n=G.players.length,order=G.order;
  return `${head()}<div class="panel how" style="margin-top:8px"><b>Vote time!</b> On the count of <b>3</b>, everyone points at their favorite poem (<b>not your own!</b>). The host taps + for every finger pointing at it. <span class="hint">(Poem numbers match the reveal order.)</span></div>
  <div class="grid">${order.map((pi,k)=>{const p=G.poems[pi];return `<div class="vcard"><div class="num">Poem ${k+1}</div><div class="poem" style="text-align:center">${chips(p.tokens)}</div>
  <div class="vctl"><button class="m" data-a="vminus" data-i="${pi}" aria-label="Remove vote">−</button><div class="v">${p.votes}</div><button data-a="vplus" data-i="${pi}" aria-label="Add vote">+</button></div></div>`;}).join('')}</div>
  <p class="center" style="text-align:center;margin-top:18px"><span class="pill" style="${tot===n?'background:var(--cyan);color:var(--ink)':''}">Votes counted: ${tot} / ${n}</span><br><br>
  <button class="btn pink" data-a="reveal-authors">${tot===n?'Reveal the poets! 🥁':'Reveal anyway (votes ≠ players)'}</button></p>`;
}
function resultsHTML(){
  return `${head()}<h2>Who wrote what?</h2>
  ${G.resOrder.map((p,k)=>`<div class="res ${p.win?'win':''}" style="animation-delay:${k*.25}s"><div class="who">${avatar(p.player)}${esc(player(p.player).name)}</div>
   <div class="grow poem" style="min-width:260px">${chips(p.tokens)}</div>
   <div style="text-align:center;min-width:120px"><div style="font-size:42px;font-weight:900">+${p.gain}</div><div>${p.votes?`<span class="badge c">${p.votes} vote${p.votes>1?'s':''}</span>`:''}${p.gold?`<span class="badge">★ Gold +1</span>`:''}${p.win?`<span class="badge p">👑 Winner +2</span>`:''}</div></div></div>`).join('')}
  <div class="panel"><h2 style="font-size:30px">Scoreboard</h2>${scoreStrip()}</div>
  <p class="center" style="text-align:center"><button class="btn" data-a="next-round">${G.round>=G.rounds?'See final results 🏆':'Next round ▶'}</button></p>`;
}
function finalHTML(){
  const rank=G.players.map((p,i)=>({...p,i})).sort((a,b)=>b.score-a.score);
  const top=rank.slice(0,3);const heights=[190,140,100];const cols=['#ffd23f','#d9e2ec','#e0a96d'];
  const podOrder=top.length===3?[1,0,2]:top.map((_,k)=>k);
  const hall=G.hall.slice().sort((a,b)=>b.votes-a.votes).slice(0,3).filter(h=>h.votes>0);
  return `<div class="top"><div class="pill">✨ Fridge Magnet Poets</div><div class="pill">Final results</div></div>
  <div class="center" style="text-align:center"><h1>🏆 <span>${esc(rank[0].name)}</span> wins!</h1>${rank.length>1&&rank[1].score===rank[0].score?`<p class="sub">(It's a tie with ${esc(rank[1].name)} — share the fridge!)</p>`:''}</div>
  <div class="podium">${podOrder.map(k=>{const r=top[k];return `<div class="pod">${avatar(r.i)}<div class="nm">${esc(r.name)}</div><div class="blk" style="height:${heights[k]}px;background:${cols[k]}">${k+1}<br><span style="font-size:.6em">${r.score}</span></div></div>`;}).join('')}</div>
  <div class="panel"><h2 style="font-size:30px">Everyone</h2><div class="score">${rank.map(r=>`<div class="sc">${avatar(r.i)}${esc(r.name)} <b>${r.score}</b></div>`).join('')}</div></div>
  ${hall.length?`<div class="panel"><h2 style="font-size:30px">🏛 Hall of Fame — best poems tonight</h2>${hall.map(h=>`<div class="res" style="animation:none"><div class="who">${avatar(h.player)}${esc(player(h.player).name)}</div><div class="grow"><div class="hint" style="font-family:Georgia,serif;font-style:italic">${esc(h.prompt)}</div><div class="poem">${chips(h.tokens)}</div></div><span class="badge c">${h.votes} votes</span></div>`).join('')}</div>`:''}
  <p class="center" style="text-align:center"><button class="btn pink" data-a="again">Play Again (same players)</button> <button class="btn ghost" data-a="new">New Game</button></p>`;
}
render();
</script>
</body>
</html>
