<!-- CONCEPT: MOONFALL - a moderator-free werewolf party game: one phone passes around the circle every night and every player's turn has identical taps (pack hunt, seer peek, healer shield, or a villager's quiet watch, then a whisper and a moon-tap), so nobody can tell who is hunting; dawn reveals the victim and the village's anonymous whispers, a timed discussion follows, and secret pass-the-phone ballots exile a suspect until the wolves are gone or outnumber the village. | Players: 5-12 | ~15-30 min -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Moonfall</title>
<style>
:root{
  --bg:#070a16; --bg2:#101634; --panel:rgba(20,26,50,.86); --panel2:#1c2446; --line:#2c3764;
  --text:#e9ecff; --muted:#949fcb; --moon:#f3e9c6;
  --wolf:#ff5a6e; --village:#5fd4a0; --seer:#a98bff; --healer:#5cc8f5; --gold:#ffc857;
  --a:#d8c9ff; --b:#8fdcff;
  --r:18px; --gap:clamp(10px,3vw,16px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;padding:0;height:100%;overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none;
  font-family:'Segoe UI',system-ui,-apple-system,sans-serif;color:var(--text);background:radial-gradient(120% 80% at 50% 0%,var(--bg2),var(--bg) 70%)}
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;transition:opacity 1.2s}
#glow{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:0;transition:opacity 1.2s;
  background:radial-gradient(120% 70% at 50% 110%,rgba(255,170,90,.38),rgba(255,120,120,.12) 45%,transparent 70%)}
body.dayMode #sky{opacity:.25} body.dayMode #glow{opacity:1}
#app{position:relative;z-index:1;height:100dvh;display:flex;flex-direction:column;max-width:640px;margin:0 auto}
header{display:flex;align-items:center;gap:8px;padding:10px 14px 6px}
h1{margin:0;font-size:clamp(22px,6.5vw,30px);letter-spacing:.5px;font-weight:800;
  background:linear-gradient(90deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}
#phaseTag{flex:1;font-size:clamp(12px,3.4vw,14px);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbtn{min-width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--text);font-size:18px;cursor:pointer;padding:0 10px}
main{flex:1;overflow-y:auto;overflow-x:hidden;padding:6px 14px 24px;display:flex;flex-direction:column;gap:var(--gap);-webkit-overflow-scrolling:touch}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:clamp(14px,4vw,20px);backdrop-filter:blur(4px);animation:rise .35s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.card h2{margin:0 0 10px;font-size:clamp(17px,4.8vw,21px);display:flex;align-items:center;gap:8px}
.center{text-align:center}
p{margin:8px 0;line-height:1.45;font-size:clamp(14px,3.8vw,16px)}
.hint{color:var(--muted);font-size:clamp(12.5px,3.4vw,14px)}
.lead{font-size:clamp(15px,4vw,17px)}
.pill{font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--panel2);color:var(--muted);border:1px solid var(--line)}
.btn{display:block;width:100%;min-height:52px;border-radius:14px;border:1px solid var(--line);background:var(--panel2);color:var(--text);
  font-size:clamp(15px,4.2vw,18px);font-weight:700;cursor:pointer;padding:10px 14px;font-family:inherit}
.btn:active{transform:scale(.98)}
.btn.primary{background:linear-gradient(90deg,#6d5cff,#3fa9f5);border:none;color:#fff;box-shadow:0 6px 22px rgba(80,110,255,.35)}
.btn.big{min-height:60px;font-size:clamp(17px,4.8vw,20px)}
.btn.ghost{background:transparent;border-style:dashed;color:var(--muted);margin-top:8px}
.btn.danger{background:linear-gradient(90deg,#d83a5b,#ff7a59);border:none;color:#fff}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.namerow{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.seat{width:26px;text-align:center;color:var(--muted);font-weight:700;font-size:14px}
.namerow input{flex:1;min-width:0;height:46px;border-radius:12px;border:1px solid var(--line);background:#0c1127;color:var(--text);
  padding:0 12px;font-size:16px;font-family:inherit;user-select:text;-webkit-user-select:text}
.namerow input:focus{outline:2px solid #6d8bff;border-color:transparent}
.icon{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--muted);font-size:16px;cursor:pointer;flex:none}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid rgba(255,255,255,.06)}
.setrow:first-of-type{border-top:none}
.setrow .lbl{font-size:clamp(14px,3.9vw,16px)} .setrow .lbl small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.stepper{display:flex;align-items:center;gap:6px;flex:none}
.stepper b{min-width:74px;text-align:center;font-size:15px}
.stepper button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-size:20px;cursor:pointer}
.toggle{width:64px;height:44px;border-radius:99px;border:1px solid var(--line);background:#0c1127;position:relative;cursor:pointer;flex:none}
.toggle::after{content:"";position:absolute;top:6px;left:6px;width:30px;height:30px;border-radius:50%;background:#56608a;transition:.2s}
.toggle.on{background:rgba(95,212,160,.25);border-color:var(--village)} .toggle.on::after{left:26px;background:var(--village)}
.err{color:var(--wolf);font-weight:600;text-align:center;min-height:0}
details.card summary{cursor:pointer;font-weight:700;font-size:clamp(15px,4.2vw,17px);min-height:30px;list-style:none}
details.card summary::-webkit-details-marker{display:none}
details.card ul{padding-left:20px;margin:8px 0} details.card li{margin:6px 0;line-height:1.4;font-size:14.5px}
.moon{width:clamp(70px,22vw,110px);aspect-ratio:1;border-radius:50%;margin:4px auto 10px;
  background:radial-gradient(circle at 62% 30%,rgba(0,0,0,.09) 0 9%,transparent 10%),radial-gradient(circle at 30% 62%,rgba(0,0,0,.08) 0 13%,transparent 14%),
  radial-gradient(circle at 70% 70%,rgba(0,0,0,.07) 0 7%,transparent 8%),radial-gradient(circle at 36% 34%,#fffcef,var(--moon) 55%,#c7b688);
  box-shadow:0 0 50px rgba(243,233,198,.45),0 0 120px rgba(243,233,198,.15)}
.sun{background:radial-gradient(circle at 40% 40%,#fff4c2,#ffc15a 55%,#ff8a3d);box-shadow:0 0 60px rgba(255,180,80,.55)}
.kicker{text-transform:uppercase;letter-spacing:2px;font-size:12px;color:var(--muted);font-weight:700}
.pass{text-align:center;padding-top:26px;padding-bottom:26px}
.passicon{font-size:46px;margin:8px 0}
.pass h2{justify-content:center;color:var(--muted);font-weight:600;margin-bottom:4px}
.passname{font-size:clamp(34px,11vw,52px);font-weight:900;line-height:1.1;word-break:break-word;
  background:linear-gradient(90deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}
.rolecard{text-align:center;border:2px solid var(--rc);box-shadow:0 0 40px color-mix(in srgb,var(--rc) 30%,transparent)}
.roleicon{font-size:clamp(64px,20vw,96px);line-height:1.1}
.rolename{justify-content:center;font-size:clamp(30px,9vw,42px)!important;color:var(--rc);margin:2px 0 4px!important}
.label{color:var(--muted)}
.team{display:inline-block;padding:4px 12px;border-radius:99px;border:1px solid var(--rc);color:var(--rc);font-weight:700;font-size:13px}
.pack{background:rgba(255,90,110,.1);border-radius:12px;padding:8px}
.acthead{display:flex;align-items:center;gap:12px}
.acthead .ai{font-size:40px}
.acthead h2{margin:0}
.choices{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(140px,42%),1fr));gap:10px;margin-top:12px}
.choice{min-height:56px;border-radius:14px;border:1px solid var(--line);background:#0e1430;color:var(--text);font-size:clamp(15px,4.2vw,17px);
  font-weight:700;cursor:pointer;padding:8px;font-family:inherit;word-break:break-word}
.choice:active{background:#27315e}
.choice.abstain{grid-column:1/-1;color:var(--muted);font-weight:600;border-style:dashed}
.mates,.notes{background:rgba(0,0,0,.2);border-radius:12px;padding:8px 12px;margin-top:10px;font-size:14.5px;line-height:1.7}
.peekres{font-size:clamp(24px,7vw,32px);font-weight:900;margin:10px 0}
.moonbtn{display:block;margin:10px auto;width:min(58vw,230px);aspect-ratio:1;border-radius:50%;border:none;cursor:pointer;
  background:radial-gradient(circle at 36% 34%,#fffcef,var(--moon) 55%,#c7b688);
  filter:brightness(calc(.3 + var(--f) * .14)) saturate(calc(.4 + var(--f) * .12));
  box-shadow:0 0 calc(var(--f) * 16px) rgba(243,233,198,.6);transition:filter .15s,box-shadow .15s}
.moonbtn:active{transform:scale(.96)}
.dots{display:flex;justify-content:center;gap:8px;margin-top:6px}
.dots i{width:14px;height:14px;border-radius:50%;background:#2a3358;display:block}
.dots i.on{background:var(--moon);box-shadow:0 0 8px var(--moon)}
.headline{font-size:clamp(21px,6vw,27px);font-weight:800;line-height:1.25;margin:6px 0}
.whisper{display:flex;gap:10px;align-items:flex-start;background:rgba(0,0,0,.2);border-radius:12px;padding:10px 12px;margin-top:8px;text-align:left}
.whisper span{font-size:22px}
.clockwrap{position:relative;width:min(62vw,230px);aspect-ratio:1;margin:6px auto;border-radius:50%;
  background:conic-gradient(var(--gold) calc(var(--p) * 1turn),rgba(255,255,255,.08) 0)}
.clockwrap::after{content:"";position:absolute;inset:12px;border-radius:50%;background:#141a33}
.clock{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:1;font-size:clamp(40px,13vw,56px);font-weight:800;font-variant-numeric:tabular-nums}
.clockwrap.low .clock{color:var(--wolf)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip{padding:7px 12px;border-radius:99px;background:#0e1430;border:1px solid var(--line);font-size:14px;font-weight:600}
.chip.dead{opacity:.55;text-decoration:line-through}
.bars{margin-top:10px}
.bar{display:grid;grid-template-columns:minmax(70px,32%) 1fr 28px;align-items:center;gap:8px;margin:7px 0;font-size:15px}
.bar .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.bar .tr{height:18px;border-radius:9px;background:rgba(255,255,255,.06);overflow:hidden}
.bar .fl{display:block;height:100%;width:0;border-radius:9px;background:linear-gradient(90deg,#ff7a59,var(--wolf));transition:width .8s cubic-bezier(.2,.8,.2,1)}
.bar.top .nm{color:var(--wolf)}
.bar .ct{text-align:right;font-weight:800}
.banner{font-size:clamp(30px,9vw,42px);font-weight:900;margin:4px 0}
.log{margin:6px 0 0;padding:0;list-style:none}
.log li{padding:8px 0;border-top:1px solid rgba(255,255,255,.07);font-size:14px;line-height:1.45}
.log li b.n{color:var(--gold)}
.roster{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.rp{display:flex;gap:8px;align-items:center;background:#0e1430;border-radius:12px;padding:8px 10px;border-left:4px solid var(--rc);font-size:14.5px}
.rp.dead{opacity:.6}
.board .bar .fl{background:linear-gradient(90deg,#6d5cff,#3fa9f5)}
.modal{position:fixed;inset:0;z-index:10;background:rgba(3,5,12,.75);display:flex;align-items:center;justify-content:center;padding:20px}
.modal .card{max-width:420px;width:100%}
@media (min-width:700px){ main{padding-top:14px} }
</style>
</head>
<body>
<canvas id="sky"></canvas><div id="glow"></div>
<div id="app">
  <header>
    <span style="font-size:clamp(22px,6.5vw,28px)" aria-hidden="true">🌕</span><h1>Moonfall</h1>
    <div id="phaseTag">Setup</div>
    <button class="hbtn" id="soundBtn" aria-label="Sound">🔊</button>
    <button class="hbtn" id="quitBtn" aria-label="Quit game" hidden>✕</button>
  </header>
  <main id="main"></main>
</div>
<div class="modal" id="modal" hidden>
  <div class="card center">
    <h2 style="justify-content:center">Abandon this game?</h2>
    <p class="hint">Roles and progress will be lost. The leaderboard stays.</p>
    <div class="row2" style="margin-top:14px">
      <button class="btn" id="mNo">Keep playing</button>
      <button class="btn danger" id="mYes">Quit</button>
    </div>
  </div>
</div>
<script>
const LS_NAMES = 'cowork-moonfall-names', LS_SET = 'cowork-moonfall-settings', LS_SCORES = 'cowork-moonfall-scores', LS_SOUND = 'cowork-moonfall-sound';
const $ = s => document.querySelector(s);
const main = $('#main');
const load = (k, d) => { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch (e) { return d; } };
const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pickOne = a => a[Math.floor(Math.random() * a.length)];
const fmt = s => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;

const ROLES = {
  wolf:     { name: 'Werewolf', icon: '🐺', team: 'wolves',  color: 'var(--wolf)',    blurb: 'Each night your pack chooses one villager to take. By day, blend in, sound helpful and steer the vote away from your pack.' },
  seer:     { name: 'Seer',     icon: '🔮', team: 'village', color: 'var(--seer)',    blurb: 'Each night, peek at one player and learn whether they are a werewolf. Share what you know carefully — the pack hunts anyone who talks too much.' },
  healer:   { name: 'Healer',   icon: '🩹', team: 'village', color: 'var(--healer)',  blurb: 'Each night, shield one player (yourself allowed). If the pack picks them, they survive. You can\'t shield the same person two nights in a row.' },
  villager: { name: 'Villager', icon: '🧑‍🌾', team: 'village', color: 'var(--village)', blurb: 'No powers — just your eyes, ears and gut. Watch who defends whom, and find the wolves before they outnumber you.' }
};

let names = load(LS_NAMES, ['', '', '', '', '', '']);
if (!Array.isArray(names) || names.length < 5) names = ['', '', '', '', '', ''];
let settings = Object.assign({ wolves: 0, seer: true, healer: true, talk: 180, reveal: true }, load(LS_SET, {}));
let scores = load(LS_SCORES, {});
let soundOn = load(LS_SOUND, true);
let G = null;
let viewKey = '', armedAt = 0, dayTimer = null;

const autoWolves = n => n <= 6 ? 1 : n <= 10 ? 2 : 3;
const maxWolves = n => Math.max(1, Math.min(3, Math.floor((n - 2) / 2)));
const P = id => G.players[id];
const aliveIds = () => G.players.filter(p => p.alive).map(p => p.id);
const roleTag = p => `${ROLES[p.role].icon} ${ROLES[p.role].name}`;

/* ---------- audio ---------- */
let AC = null;
function ac() {
  if (!soundOn) return null;
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }
  if (AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(freq, dur, type = 'sine', vol = .12, delay = 0, to = null) {
  const a = ac(); if (!a) return;
  const t = a.currentTime + delay, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (to) o.frequency.exponentialRampToValueAtTime(to, t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .02); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur + .05);
}
function howl() {
  const a = ac(); if (!a) return;
  const t = a.currentTime, o = a.createOscillator(), g = a.createGain(), f = a.createBiquadFilter(), l = a.createOscillator(), lg = a.createGain();
  o.type = 'sawtooth'; f.type = 'lowpass'; f.frequency.value = 1100;
  o.frequency.setValueAtTime(280, t); o.frequency.exponentialRampToValueAtTime(640, t + .7);
  o.frequency.setValueAtTime(640, t + 1.3); o.frequency.exponentialRampToValueAtTime(360, t + 2.4);
  l.frequency.value = 5.5; lg.gain.value = 10; l.connect(lg).connect(o.frequency);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(.09, t + .3); g.gain.setValueAtTime(.09, t + 1.6); g.gain.exponentialRampToValueAtTime(0.0001, t + 2.5);
  o.connect(f).connect(g).connect(a.destination); o.start(t); l.start(t); o.stop(t + 2.6); l.stop(t + 2.6);
}
const sfx = {
  tap: () => tone(520, .06, 'triangle', .05),
  moon: n => tone(330 * Math.pow(1.19, n), .18, 'sine', .08),
  dawn: () => [523, 659, 784, 1047].forEach((f, i) => tone(f, .7, 'sine', .08, i * .14)),
  doom: () => { tone(196, 1.2, 'triangle', .14); tone(147, 1.4, 'sine', .12, .15); },
  tick: () => tone(1200, .05, 'square', .04),
  time: () => [880, 660, 880].forEach((f, i) => tone(f, .25, 'square', .06, i * .22)),
  gavel: () => { tone(110, .25, 'square', .14); tone(90, .3, 'square', .1, .12); },
  win: () => [392, 523, 659, 784, 1047].forEach((f, i) => tone(f, .5, 'triangle', .08, i * .12))
};

/* ---------- starfield ---------- */
const sky = $('#sky'), sctx = sky.getContext('2d');
let stars = [];
function sizeSky() {
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  sky.width = innerWidth * dpr; sky.height = innerHeight * dpr;
  sctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  stars = Array.from({ length: Math.round(innerWidth * innerHeight / 5000) }, () => ({ x: Math.random() * innerWidth, y: Math.random() * innerHeight, r: Math.random() * 1.3 + .3, p: Math.random() * 6.28, s: .5 + Math.random() * 1.5 }));
}
function drawSky(t) {
  sctx.clearRect(0, 0, innerWidth, innerHeight);
  for (const s of stars) {
    sctx.globalAlpha = .35 + .65 * (0.5 + 0.5 * Math.sin(s.p + t / 1000 * s.s));
    sctx.fillStyle = '#e8ecff';
    sctx.beginPath(); sctx.arc(s.x, s.y, s.r, 0, 6.283); sctx.fill();
  }
  sctx.globalAlpha = 1;
  requestAnimationFrame(drawSky);
}
addEventListener('resize', sizeSky); sizeSky(); requestAnimationFrame(drawSky);

/* ---------- shared views ---------- */
function passScreen(p, kicker, note) {
  return `<section class="card pass"><div class="kicker">${kicker}</div><div class="passicon">📱</div>
    <h2>Pass the phone to</h2><div class="passname">${esc(p.name)}</div><p class="hint">${note}</p></section>
    <button class="btn primary big" data-act="ready">I'm ${esc(p.name)} — show me</button>`;
}
function actScreen(icon, title, text, extra, ids, abstain) {
  return `<section class="card"><div class="acthead"><div class="ai">${icon}</div><div><div class="kicker">${esc(P(G.queue[G.idx]).name)}</div><h2>${title}</h2></div></div>
    <p>${text}</p>${extra || ''}
    <div class="choices">${ids.map(id => `<button class="choice" data-act="pick" data-id="${id}">${esc(P(id).name)}</button>`).join('')}
    ${abstain ? `<button class="choice abstain" data-act="pick" data-id="-1">${abstain}</button>` : ''}</div></section>`;
}

/* ---------- setup ---------- */
function viewSetup() {
  const n = names.filter(s => s.trim()).length;
  const nn = Math.max(5, n);
  const w = settings.wolves ? Math.min(settings.wolves, maxWolves(nn)) : autoWolves(nn);
  const board = Object.entries(scores).sort((a, b) => b[1] - a[1]);
  const top = board.length ? board[0][1] : 1;
  const tog = (k, label, sub) => `<div class="setrow"><div class="lbl">${label}<small>${sub}</small></div><button class="toggle ${settings[k] ? 'on' : ''}" data-act="tog" data-k="${k}" aria-label="${label}"></button></div>`;
  return `
  <section class="card center"><div class="moon"></div>
    <p class="lead">Werewolf with <b>no moderator</b>. One phone travels the circle each night, and every turn has the exact same taps, so nobody can tell who's hunting.</p></section>
  <section class="card"><h2>Players <span class="pill" id="countPill">${n} / 12</span></h2>
    ${names.map((s, i) => `<div class="namerow"><span class="seat">${i + 1}</span><input maxlength="14" data-i="${i}" value="${esc(s)}" placeholder="Player ${i + 1}" autocomplete="off" enterkeyhint="next"><button class="icon" data-act="rm" data-i="${i}" aria-label="Remove player ${i + 1}">✕</button></div>`).join('')}
    ${names.length < 12 ? `<button class="btn ghost" data-act="add">＋ Add player</button>` : ''}
    <p class="hint">Enter names in seating order around the circle, since the phone gets passed that way. You need 5–12 players.</p></section>
  <section class="card"><h2>Rules of the night</h2>
    <div class="setrow"><div class="lbl">🐺 Werewolves<small>Auto scales with the group</small></div>
      <div class="stepper"><button data-act="wolves" data-d="-1" aria-label="Fewer wolves">−</button><b>${settings.wolves ? w : `Auto (${w})`}</b><button data-act="wolves" data-d="1" aria-label="More wolves">+</button></div></div>
    ${tog('seer', '🔮 Seer', 'Peeks at one player each night')}
    ${tog('healer', '🩹 Healer', 'Shields one player each night')}
    ${tog('reveal', '🪦 Reveal roles when someone dies', 'Off = far harder for the village')}
    <div class="setrow"><div class="lbl">⏳ Discussion time<small>Per day, before the vote</small></div>
      <div class="stepper"><button data-act="talk" data-d="-30" aria-label="Less time">−</button><b>${fmt(settings.talk)}</b><button data-act="talk" data-d="30" aria-label="More time">+</button></div></div>
  </section>
  <div class="err" id="err"></div>
  <button class="btn primary big" data-act="start">🌕 Deal the roles</button>
  <details class="card"><summary>📜 How to play</summary><ul>
    <li><b>Deal:</b> pass the phone around. Each player privately sees their role. Wolves also see who else is in their pack.</li>
    <li><b>Night:</b> the phone goes around again. Everyone takes a turn, and every turn is two picks plus five moon taps. Wolves pick someone to take, the Seer peeks at a player, the Healer shields someone, and Villagers keep watch. Then everybody whispers who they suspect.</li>
    <li><b>Dawn:</b> the app reveals who was taken (or saved), plus the village's anonymous whispers: who's most suspected and who's most trusted. Wolves whisper too, so a whisper can be a plant.</li>
    <li><b>Day:</b> argue, accuse, bluff and defend until the timer runs out. Then everyone casts a secret ballot on the phone. Most votes gets exiled. A tie means nobody goes.</li>
    <li><b>Win:</b> the village wins when every wolf is gone. The wolves win when they equal or outnumber everyone else.</li>
    <li><b>Scoring:</b> each player on the winning team gets +2, plus a +1 bonus if they're still alive. The totals carry over from game to game on this device.</li>
  </ul></details>
  ${board.length ? `<section class="card board"><h2>🏆 Leaderboard</h2><div class="bars">${board.slice(0, 12).map(([k, v]) => `<div class="bar"><span class="nm">${esc(k)}</span><span class="tr"><span class="fl" style="width:${Math.round(v / Math.max(1, top) * 100)}%"></span></span><span class="ct">${v}</span></div>`).join('')}</div>
    <button class="btn ghost" data-act="resetScores">Reset leaderboard</button></section>` : ''}`;
}

function startGame() {
  const list = names.map(s => s.trim()).filter(Boolean);
  const err = $('#err');
  const lower = list.map(s => s.toLowerCase());
  if (list.length < 5) { err.textContent = `Moonfall needs at least 5 players (you have ${list.length}).`; return; }
  if (new Set(lower).size !== lower.length) { err.textContent = 'Every player needs a different name.'; return; }
  const n = list.length;
  const w = settings.wolves ? Math.min(settings.wolves, maxWolves(n)) : autoWolves(n);
  const deck = Array(w).fill('wolf');
  if (settings.seer) deck.push('seer');
  if (settings.healer) deck.push('healer');
  while (deck.length < n) deck.push('villager');
  shuffle(deck);
  save(LS_NAMES, names);
  G = { players: list.map((name, i) => ({ id: i, name, role: deck[i], alive: true })), round: 1, log: [], lastHeal: null, seerNotes: [],
        phase: 'deal', queue: list.map((_, i) => i), idx: 0, view: 'pass', scored: false };
  sfx.tap(); render();
}

/* ---------- deal ---------- */
function viewDeal() {
  const p = P(G.queue[G.idx]);
  if (G.view === 'pass') return passScreen(p, `Secret role ${G.idx + 1} of ${G.queue.length}`, 'Everyone else, look away. Check your role, then hide it and pass the phone on.');
  const r = ROLES[p.role];
  let extra = '';
  if (p.role === 'wolf') {
    const mates = G.players.filter(q => q.role === 'wolf' && q.id !== p.id).map(q => esc(q.name));
    extra = `<p class="pack">${mates.length ? `🐺 Your pack: <b>${mates.join(', ')}</b>` : '🐺 You hunt alone. No pack to lean on.'}</p>`;
  }
  return `<section class="card rolecard" style="--rc:${r.color}"><div class="label">${esc(p.name)}, you are the</div>
    <div class="roleicon">${r.icon}</div><h2 class="rolename">${r.name}</h2><div class="team">Team ${r.team === 'wolves' ? 'Wolves' : 'Village'}</div>
    <p>${r.blurb}</p>${extra}</section>
    <button class="btn primary big" data-act="roleDone">Hide &amp; pass on →</button>`;
}

/* ---------- night ---------- */
function viewNightIntro() {
  return `<section class="card center"><div class="kicker">Night ${G.round}</div><div class="moon"></div>
    <div class="headline">The moon rises over the village…</div>
    <p>Everyone except the phone holder closes their eyes. The phone goes around the circle, and <b>every living player takes a turn</b>. Every turn has the same taps, so the sound gives nothing away.</p>
    <p class="hint">No talking. Tap quietly. Pass the phone face-down.</p></section>
    <button class="btn primary big" data-act="nightBegin">🌙 Begin night ${G.round}</button>`;
}
function viewNight() {
  const p = P(G.queue[G.idx]), N = G.night;
  if (G.view === 'pass') return passScreen(p, `Night ${G.round} · turn ${G.idx + 1} of ${G.queue.length}`, 'Everyone else: heads down, eyes closed.');
  const others = aliveIds().filter(id => id !== p.id);
  if (G.view === 'act1') {
    if (p.role === 'wolf') {
      const mates = G.players.filter(q => q.role === 'wolf' && q.id !== p.id);
      const info = mates.length ? `<div class="mates">${mates.map(m => `<div>${m.alive ? '🐺' : '💀'} ${esc(m.name)} ${!m.alive ? '<i>(fallen)</i>' : N.wolfVotes[m.id] != null ? `→ <b>${esc(P(N.wolfVotes[m.id]).name)}</b>` : '<i>hasn\'t hunted yet</i>'}</div>`).join('')}</div>` : '';
      return actScreen('🐺', 'The pack hunts', `Choose who the pack takes tonight.${mates.length ? ' If the pack splits, the target with the most pack votes is taken. A tie is settled by the moon.' : ''}`, info, others.filter(id => P(id).role !== 'wolf'));
    }
    if (p.role === 'seer') {
      const notes = G.seerNotes.length ? `<div class="notes">${G.seerNotes.map(s => `<div>Night ${s.night}: ${esc(P(s.id).name)} — ${s.wolf ? '🐺 <b>WEREWOLF</b>' : '✨ not a wolf'}</div>`).join('')}</div>` : '';
      return actScreen('🔮', 'The Seer\'s vision', 'Choose one player and learn whether they are a werewolf.', notes, others);
    }
    if (p.role === 'healer') {
      const ids = aliveIds().filter(id => id !== G.lastHeal);
      const note = G.lastHeal != null ? `<p class="hint">You shielded ${esc(P(G.lastHeal).name)} last night, so you can't pick them tonight.</p>` : '';
      return actScreen('🩹', 'The Healer\'s shield', 'Choose one player to protect tonight. You can pick yourself.', note, ids);
    }
    return actScreen('🕯️', 'Quiet watch', 'You keep watch from your window. <b>Who do you trust most?</b> The most-trusted name gets shared anonymously at dawn.', '', others);
  }
  if (G.view === 'peek') {
    const s = G.seerNotes[G.seerNotes.length - 1];
    return `<section class="card center rolecard" style="--rc:${s.wolf ? 'var(--wolf)' : 'var(--village)'}"><div class="kicker">Your vision shows</div>
      <div class="roleicon">${s.wolf ? '🐺' : '✨'}</div><div class="passname" style="font-size:clamp(28px,8vw,40px)">${esc(P(s.id).name)}</div>
      <div class="peekres" style="color:var(--rc)">${s.wolf ? 'IS A WEREWOLF' : 'is not a werewolf'}</div>
      <p class="hint">Remember it, and don't let your face give it away.</p></section>
      <button class="btn primary big" data-act="peekOk">Continue →</button>`;
  }
  if (G.view === 'act2') {
    const txt = p.role === 'wolf' ? 'Plant suspicion. Who should the village doubt at dawn? Your whisper counts the same as everyone else\'s.'
      : 'Who do you think is a werewolf? Every whisper is shared anonymously at dawn.';
    return actScreen('🗣️', 'Whisper', txt, '', others);
  }
  const f = G.moonTaps;
  return `<section class="card center"><div class="kicker">${esc(p.name)}</div><h2 style="justify-content:center">Tap the moon to fall asleep</h2>
    <p class="hint">Five taps, then hand the phone on. Everyone does this.</p>
    <button class="moonbtn" style="--f:${f}" data-act="moon" aria-label="Tap the moon"></button>
    <div class="dots">${[0, 1, 2, 3, 4].map(i => `<i class="${i < f ? 'on' : ''}"></i>`).join('')}</div></section>`;
}
function nightPick(id) {
  const p = P(G.queue[G.idx]), N = G.night;
  if (G.view === 'act1') {
    if (p.role === 'wolf') N.wolfVotes[p.id] = id;
    else if (p.role === 'seer') { N.peek = id; G.seerNotes.push({ night: G.round, id, wolf: P(id).role === 'wolf' }); G.view = 'peek'; return; }
    else if (p.role === 'healer') N.heal = id;
    else N.trust[p.id] = id;
    G.view = 'act2';
  } else if (G.view === 'act2') {
    N.hunch[p.id] = id; G.moonTaps = 0; G.view = 'sleep';
  }
}
function moonTap() {
  sfx.moon(G.moonTaps);
  G.moonTaps++;
  if (G.moonTaps < 5) return;
  G.idx++;
  if (G.idx >= G.queue.length) { resolveNight(); G.phase = 'dawn'; setTimeout(() => (G.dawn.victim != null ? sfx.doom : sfx.dawn)(), 150); }
  else G.view = 'pass';
}
function topOf(map) {
  const c = {};
  Object.values(map).forEach(t => { if (t != null && t >= 0) c[t] = (c[t] || 0) + 1; });
  const max = Math.max(0, ...Object.values(c));
  const tied = Object.keys(c).filter(k => c[k] === max).map(Number);
  return { counts: c, max, tied };
}
function resolveNight() {
  const N = G.night;
  const wv = topOf(N.wolfVotes);
  const target = wv.max > 0 ? pickOne(wv.tied) : null;
  const saved = target != null && N.heal === target;
  G.lastHeal = N.heal;
  if (target != null && !saved) P(target).alive = false;
  const living = m => Object.fromEntries(Object.entries(m).filter(([, t]) => P(t).alive)); // whispers about tonight's victim are moot
  const h = topOf(living(N.hunch)), tr = topOf(living(N.trust));
  G.dawn = {
    victim: target != null && !saved ? target : null, saved,
    suspect: h.max >= 2 && h.tied.length === 1 ? { id: h.tied[0], n: h.max } : null,
    trusted: tr.max >= 2 && tr.tied.length === 1 ? { id: tr.tied[0], n: tr.max } : null
  };
  const bits = [];
  bits.push(target != null ? `Pack chose <b>${esc(P(target).name)}</b>${wv.tied.length > 1 ? ' (tie broken by the moon)' : ''}` : 'The pack chose no one');
  if (N.heal != null) bits.push(`Healer shielded ${esc(P(N.heal).name)}${saved ? ' — <b>saved!</b>' : ''}`);
  if (N.peek != null) bits.push(`Seer peeked at ${esc(P(N.peek).name)} (${P(N.peek).role === 'wolf' ? 'wolf!' : 'innocent'})`);
  G.log.push(`<b class="n">Night ${G.round}</b> · ${bits.join(' · ')}`);
}

/* ---------- dawn & day ---------- */
function winner() {
  const alive = G.players.filter(p => p.alive), w = alive.filter(p => p.role === 'wolf').length;
  if (w === 0) return 'village';
  if (w >= alive.length - w) return 'wolves';
  return null;
}
function deathLine(p) {
  return settings.reveal ? `They were ${p.role === 'villager' ? 'a' : 'the'} <b style="color:${ROLES[p.role].color}">${roleTag(p)}</b>.` : 'Their secret goes with them to the grave.';
}
function viewDawn() {
  const D = G.dawn, over = winner();
  let head;
  if (D.victim != null) head = `<div class="roleicon">☠️</div><div class="headline"><span style="color:var(--wolf)">${esc(P(D.victim).name)}</span> was taken in the night.</div><p>${deathLine(P(D.victim))}</p>`;
  else if (D.saved) head = `<div class="roleicon">🛡️</div><div class="headline">The pack struck… but a shield held!</div><p>Nobody died. Someone out there owes the Healer a thank-you.</p>`;
  else head = `<div class="roleicon">🌅</div><div class="headline">A quiet night. No one was taken.</div>`;
  const w1 = D.suspect ? `Most suspected: <b>${esc(P(D.suspect.id).name)}</b> (${D.suspect.n} whispers)` : 'Suspicion is scattered. No one name stands out.';
  const w2 = D.trusted ? `Most trusted: <b>${esc(P(D.trusted.id).name)}</b> (${D.trusted.n} villagers)` : 'Trust is thin. No one got more than one nod.';
  return `<section class="card center"><div class="kicker">Dawn · Day ${G.round}</div>${head}
    <div class="whisper"><span>🗣️</span><div>${w1}</div></div>
    <div class="whisper"><span>🕯️</span><div>${w2}<div class="hint" style="margin-top:2px">Wolves whisper too, so a whisper might be a plant.</div></div></div></section>
    ${D.victim != null ? `<p class="hint center">${esc(P(D.victim).name)} is out: no talking, no signals. You can watch the chaos.</p>` : ''}
    <button class="btn primary big" data-act="${over ? 'toOver' : 'toDay'}">${over ? '🏁 See how it ended' : '☀️ Start the discussion'}</button>`;
}
function rosterChips() {
  return `<div class="chips">${G.players.map(p => `<span class="chip ${p.alive ? '' : 'dead'}">${p.alive ? '' : '💀 '}${esc(p.name)}${!p.alive && settings.reveal ? ' ' + ROLES[p.role].icon : ''}</span>`).join('')}</div>`;
}
function viewDay() {
  const pct = G.talkLeft / G.talkTotal;
  const alive = aliveIds().length, wolvesLeft = G.players.filter(p => p.alive && p.role === 'wolf').length;
  return `<section class="card center"><div class="kicker">Day ${G.round} · Discussion</div>
    <div class="clockwrap ${G.talkLeft <= 10 ? 'low' : ''}" id="clockwrap" style="--p:${pct}"><div class="clock" id="clock">${fmt(G.talkLeft)}</div></div>
    <p id="dayMsg">${G.talkLeft === 0 ? '<b>Time\'s up!</b> Lock in your suspicions.' : 'Accuse, defend, bluff. Who has been acting strangely?'}</p>
    <div class="row2"><button class="btn" data-act="pause" id="pauseBtn">${G.paused ? '▶ Resume' : '⏸ Pause'}</button><button class="btn" data-act="plus30">＋30s</button></div></section>
    <section class="card"><h2>The village <span class="pill">${alive} alive${settings.reveal ? ` · ${wolvesLeft} 🐺 left` : ''}</span></h2>${rosterChips()}</section>
    <button class="btn primary big" data-act="toVote">🗳️ Start the secret vote</button>`;
}
function startDayTimer() {
  clearInterval(dayTimer);
  dayTimer = setInterval(() => {
    if (!G || G.phase !== 'day' || G.paused || G.talkLeft <= 0) return;
    G.talkLeft--;
    if (G.talkLeft > 0 && G.talkLeft <= 5) sfx.tick();
    if (G.talkLeft === 0) sfx.time();
    const c = $('#clock'), w = $('#clockwrap');
    if (c) { c.textContent = fmt(G.talkLeft); w.style.setProperty('--p', G.talkLeft / G.talkTotal); w.classList.toggle('low', G.talkLeft <= 10); }
    if (G.talkLeft === 0 && $('#dayMsg')) $('#dayMsg').innerHTML = '<b>Time\'s up!</b> Lock in your suspicions.';
  }, 1000);
}

/* ---------- vote ---------- */
function viewVote() {
  const p = P(G.queue[G.idx]);
  if (G.view === 'pass') return passScreen(p, `Day ${G.round} vote · ballot ${G.idx + 1} of ${G.queue.length}`, 'Secret ballot. Everyone else, look away.');
  return actScreen('🗳️', 'Cast your ballot', 'Who should the village exile? Nobody sees your vote.', '', aliveIds().filter(id => id !== p.id), '🤐 Abstain');
}
function resolveVote() {
  const t = topOf(G.votes);
  const abst = Object.values(G.votes).filter(v => v < 0).length;
  const exiled = t.max > 0 && t.tied.length === 1 ? t.tied[0] : null;
  if (exiled != null) P(exiled).alive = false;
  const rows = Object.entries(t.counts).map(([id, n]) => ({ id: +id, n })).sort((a, b) => b.n - a.n);
  G.verdict = { rows, abst, exiled, tie: t.max > 0 && t.tied.length > 1, max: t.max };
  const tally = rows.map(r => `${esc(P(r.id).name)} ${r.n}`).join(', ') || 'no votes';
  G.log.push(`<b class="n">Day ${G.round}</b> · ${exiled != null ? `<b>${esc(P(exiled).name)}</b> exiled (${roleTag(P(exiled))})` : 'Nobody exiled'} · votes: ${tally}${abst ? `, abstain ${abst}` : ''}`);
}
function viewVerdict() {
  const V = G.verdict, over = winner();
  let head;
  if (V.exiled != null) head = `<div class="roleicon">⚖️</div><div class="headline">The village exiles <span style="color:var(--wolf)">${esc(P(V.exiled).name)}</span>.</div><p>${deathLine(P(V.exiled))}</p>`;
  else if (V.tie) head = `<div class="roleicon">🤷</div><div class="headline">A tie! The village can't agree.</div><p>Nobody is exiled today.</p>`;
  else head = `<div class="roleicon">🤐</div><div class="headline">Nobody cast a vote.</div><p>The wolves are delighted.</p>`;
  const bars = V.rows.map(r => `<div class="bar ${r.n === V.max ? 'top' : ''}"><span class="nm">${esc(P(r.id).name)}</span><span class="tr"><span class="fl" data-w="${Math.round(r.n / V.max * 100)}"></span></span><span class="ct">${r.n}</span></div>`).join('');
  return `<section class="card center"><div class="kicker">Day ${G.round} · Verdict</div>${head}</section>
    <section class="card"><h2>Ballots</h2><div class="bars">${bars || '<p class="hint">No votes cast.</p>'}</div>${V.abst ? `<p class="hint">🤐 ${V.abst} abstained</p>` : ''}</section>
    <button class="btn primary big" data-act="${over ? 'toOver' : 'nextNight'}">${over ? '🏁 See how it ended' : `🌙 Night ${G.round + 1} falls`}</button>`;
}

/* ---------- game over ---------- */
function viewOver() {
  const win = winner();
  if (!G.scored) {
    G.scored = true;
    G.players.forEach(p => {
      const team = ROLES[p.role].team;
      const pts = team === win ? 2 + (p.alive ? 1 : 0) : 0;
      scores[p.name] = (scores[p.name] || 0) + pts;
      p.pts = pts;
    });
    save(LS_SCORES, scores);
    setTimeout(sfx.win, 120);
  }
  const village = win === 'village';
  const sorted = [...G.players].sort((a, b) => (ROLES[a.role].team === win ? 0 : 1) - (ROLES[b.role].team === win ? 0 : 1));
  return `<section class="card center rolecard" style="--rc:${village ? 'var(--village)' : 'var(--wolf)'}">
      <div class="roleicon">${village ? '🌅' : '🐺'}</div><div class="banner" style="color:var(--rc)">${village ? 'The village wins!' : 'The wolves win!'}</div>
      <p>${village ? 'The last werewolf is gone. The village sleeps soundly at last.' : 'The pack now matches the village. Nobody sleeps safely again.'}</p></section>
    <section class="card"><h2>Who was who</h2><div class="roster">${sorted.map(p => `<div class="rp ${p.alive ? '' : 'dead'}" style="--rc:${ROLES[p.role].color}"><span style="font-size:22px">${ROLES[p.role].icon}</span><div><b>${esc(p.name)}</b>${p.alive ? '' : ' 💀'}<div class="hint" style="margin:0">${ROLES[p.role].name}${p.pts ? ` · +${p.pts}` : ''}</div></div></div>`).join('')}</div></section>
    <section class="card"><h2>🌙 Moon log</h2><ul class="log">${G.log.map(l => `<li>${l}</li>`).join('')}</ul></section>
    <div class="row2"><button class="btn" data-act="setup">⚙️ Setup</button><button class="btn primary" data-act="rematch">🔁 Rematch</button></div>`;
}

/* ---------- render & events ---------- */
function render() {
  const key = G ? `${G.phase}|${G.view}|${G.idx}|${G.round}` : 'setup';
  if (key !== viewKey) { viewKey = key; armedAt = performance.now(); main.scrollTop = 0; }
  const ph = G ? G.phase : 'setup';
  document.body.classList.toggle('dayMode', ['dawn', 'day', 'vote', 'verdict', 'over'].includes(ph));
  $('#quitBtn').hidden = !G || ph === 'over';
  $('#phaseTag').textContent = !G ? 'Setup' : ({ deal: 'Dealing roles', nightIntro: `Night ${G.round}`, night: `Night ${G.round}`, dawn: `Dawn · Day ${G.round}`, day: `Day ${G.round}`, vote: `Day ${G.round} · Vote`, verdict: `Day ${G.round} · Verdict`, over: 'Game over' })[ph];
  main.innerHTML = !G ? viewSetup() : ({ deal: viewDeal, nightIntro: viewNightIntro, night: viewNight, dawn: viewDawn, day: viewDay, vote: viewVote, verdict: viewVerdict, over: viewOver })[ph]();
  if (ph === 'verdict') requestAnimationFrame(() => requestAnimationFrame(() => main.querySelectorAll('.fl[data-w]').forEach(e => e.style.width = e.dataset.w + '%')));
}

main.addEventListener('input', e => {
  const i = e.target.dataset.i;
  if (i == null || G) return;
  names[+i] = e.target.value;
  save(LS_NAMES, names);
  $('#countPill').textContent = `${names.filter(s => s.trim()).length} / 12`;
  $('#err').textContent = '';
});
main.addEventListener('keydown', e => {
  if (e.key !== 'Enter' || e.target.dataset.i == null) return;
  const nx = main.querySelector(`input[data-i="${+e.target.dataset.i + 1}"]`);
  if (nx) nx.focus(); else e.target.blur();
});

const GUARDED = new Set(['ready', 'roleDone', 'pick', 'peekOk', 'nightBegin', 'toDay', 'toVote', 'nextNight', 'toOver']);
main.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b) return;
  const act = b.dataset.act;
  if (GUARDED.has(act) && performance.now() - armedAt < 450) return; // swallow the double-tap from the previous screen
  if (act !== 'moon') sfx.tap();
  switch (act) {
    case 'add': if (names.length < 12) { names.push(''); render(); main.querySelector(`input[data-i="${names.length - 1}"]`).focus(); } break;
    case 'rm': { const i = +b.dataset.i; if (names.length > 5) names.splice(i, 1); else names[i] = ''; save(LS_NAMES, names); render(); break; }
    case 'wolves': {
      const n = Math.max(5, names.filter(s => s.trim()).length), cur = settings.wolves;
      let v = cur + (+b.dataset.d);
      if (v > maxWolves(n)) v = maxWolves(n);
      settings.wolves = Math.max(0, v); save(LS_SET, settings); render(); break;
    }
    case 'talk': settings.talk = Math.max(60, Math.min(420, settings.talk + (+b.dataset.d))); save(LS_SET, settings); render(); break;
    case 'tog': settings[b.dataset.k] = !settings[b.dataset.k]; save(LS_SET, settings); render(); break;
    case 'resetScores': if (b.dataset.sure) { scores = {}; save(LS_SCORES, scores); render(); } else { b.dataset.sure = '1'; b.textContent = 'Tap again to wipe every score'; } break;
    case 'start': startGame(); break;
    case 'ready': G.view = G.phase === 'deal' ? 'role' : G.phase === 'night' ? 'act1' : 'ballot'; render(); break;
    case 'roleDone':
      G.idx++;
      if (G.idx >= G.queue.length) { G.phase = 'nightIntro'; howl(); } else G.view = 'pass';
      render(); break;
    case 'nightBegin':
      G.phase = 'night'; G.queue = aliveIds(); G.idx = 0; G.view = 'pass';
      G.night = { wolfVotes: {}, heal: null, peek: null, hunch: {}, trust: {} };
      render(); break;
    case 'pick': {
      const id = +b.dataset.id;
      if (G.phase === 'night') nightPick(id);
      else if (G.phase === 'vote') {
        G.votes[G.queue[G.idx]] = id; G.idx++;
        if (G.idx >= G.queue.length) { resolveVote(); G.phase = 'verdict'; setTimeout(sfx.gavel, 100); } else G.view = 'pass';
      }
      render(); break;
    }
    case 'peekOk': G.view = 'act2'; render(); break;
    case 'moon': moonTap(); render(); break;
    case 'toDay': G.phase = 'day'; G.talkLeft = G.talkTotal = settings.talk; G.paused = false; startDayTimer(); render(); break;
    case 'pause': G.paused = !G.paused; b.textContent = G.paused ? '▶ Resume' : '⏸ Pause'; break;
    case 'plus30': G.talkLeft += 30; G.talkTotal = Math.max(G.talkTotal, G.talkLeft); $('#clock').textContent = fmt(G.talkLeft); $('#clockwrap').style.setProperty('--p', G.talkLeft / G.talkTotal); $('#clockwrap').classList.toggle('low', G.talkLeft <= 10); break;
    case 'toVote': clearInterval(dayTimer); G.phase = 'vote'; G.queue = aliveIds(); G.idx = 0; G.view = 'pass'; G.votes = {}; render(); break;
    case 'nextNight': G.round++; G.phase = 'nightIntro'; howl(); render(); break;
    case 'toOver': clearInterval(dayTimer); G.phase = 'over'; render(); break;
    case 'rematch': G = null; names = names.filter(s => s.trim()); while (names.length < 5) names.push(''); startGame(); break;
    case 'setup': G = null; render(); break;
  }
});

$('#soundBtn').textContent = soundOn ? '🔊' : '🔇';
$('#soundBtn').addEventListener('click', () => { soundOn = !soundOn; save(LS_SOUND, soundOn); $('#soundBtn').textContent = soundOn ? '🔊' : '🔇'; if (soundOn) sfx.tap(); });
$('#quitBtn').addEventListener('click', () => { $('#modal').hidden = false; });
$('#mNo').addEventListener('click', () => { $('#modal').hidden = true; });
$('#mYes').addEventListener('click', () => { $('#modal').hidden = true; clearInterval(dayTimer); G = null; render(); });

render();

</script>
