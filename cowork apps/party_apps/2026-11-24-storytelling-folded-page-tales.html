<!-- CONCEPT: ROUND-ROBIN STORYTELLING (hidden-fold written story chain + surprise read-aloud) - "The Folded Page": like folding paper over each line, every writer on the passed phone sees ONLY the last few words of the line before (the fold) plus a story-beat prompt ("someone speaks", "something goes wrong", "THE END") and secretly writes the next whole line in 60s, optionally weaving in one of two Ink Words; nobody sees the full tale until a named Reader turns the pages aloud, then the room crowns the Golden Quill line (+3) and the Best Stitch where two lines joined funniest (+1 to both writers) BEFORE authors are revealed, and used Ink Words score +1. Up to 8 lines per story with balanced writer rotation, story twists (Blind Fold, Wide Fold, Tiny Tale 8-word limit, Genre Swap halfway, Golden Ink), double-points final story, 64 openers x 14 genres remembered across games, read-aloud voice option, souvenir storybook, scoreboard and awards | Players: 3-10 | ~15-25 min [style: Storybook / sound: Toy Piano] -->
<!DOCTYPE html>

<style>

<body>
<div id="app">
  <header class="top">
    <h1 class="brand" style="margin:0;font-size:clamp(16px,4vw,22px);color:var(--text)">&#10086; The Folded Page</h1>

      <button class="ghost sm" id="muteBtn" aria-pressed="false">Sound on</button>
    </span>

<script>
// ---------- CONTENT ----------
const OPENERS = [
  ["The Lighthouse Pancake","Every morning at six, the lighthouse keeper flipped exactly one pancake out of the top window."],
  ["Grandma's Rocket","Nobody in the village knew that Grandma Ruth kept a rocket in her vegetable patch."],

  ["Time-Travelling Toaster","Whenever Marco made toast, he arrived about ten minutes before breakfast."],
  ["The Sleepy Volcano","The volcano had been asleep for a thousand years, and today it started to snore."],
  ["Jungle Talent Show","The annual jungle talent show was about to begin, and the sloth was on first."],
  ["Queen of the Car Park","Every evening at the supermarket car park, the pigeons crowned a new queen."],
  ["The Invisible Cat","Mrs Fern was certain she owned a cat, even though nobody had ever seen it."],
  ["Moon Holiday","The family had saved for years for a holiday on the moon, but they forgot to pack the snacks."],
  ["The Grumpy Castle","The castle on the hill was grumpy, and it showed its feelings by moving its drawbridge."],
  ["Spaghetti Storm","The weather forecast said a light drizzle, but what fell from the sky was spaghetti."],
  ["Ninja Librarian","The new librarian moved so quietly that books were reshelved before you finished reading."],
  ["The Last Unicorn Taxi","The unicorn taxi company had only one unicorn left, and he hated roundabouts."],
  ["Hiccup Kingdom","In the kingdom of Hic, it was the law that the king must never, ever hiccup."],

  ["Super Grandad","Every time a cat got stuck up a tree, Grandad quietly put on his cape."],
  ["The Bouncing Castle","The bouncy castle at the fair had started bouncing on its own and was heading for the hills."],
  ["Arctic Ice Cream Van","The only ice cream van in the Arctic played its tune very, very slowly."],
  ["Mystery Parcel","The parcel on the doorstep was addressed to \"Whoever Opens This\" and it was humming."],
  ["The Brave Toaster","The kitchen appliances had held a meeting, and the toaster had been chosen to go first."],
  ["Garden Olympics","The garden snails had been training all year for the Garden Olympics."],
  ["The Map That Moved","Every time Ola looked at the treasure map, the X was in a different place."],

  ["The Squeaky Floorboard","The floorboard outside the bedroom squeaked a different song every night."],
  ["Bigfoot's Birthday","Bigfoot was turning three hundred, and for once, he wanted to be seen."],
  ["School for Villains","At the School for Villains, Tom was failing every class for being too nice."],
  ["The Bubble City","The whole city lived inside one enormous soap bubble, and today someone had a pin."],
  ["The Haunted Bicycle","The old bicycle in the shed rang its own bell whenever someone told a lie."],
  ["Dinner with the Queen","The invitation said dinner with the Queen at eight, wear something sensible."],
  ["Volcano Pizza","The pizza restaurant at the top of the volcano promised the hottest pizza in the world."],
  ["The Wrong Wish","The genie granted Sam's wish, but he had clearly misheard the word \"car\"."],
  ["The Night Zoo","When the zookeepers went home, the animals opened a restaurant."],
  ["Cardboard Kingdom","Mia built a castle out of cardboard boxes, and in the morning someone was living in it."],
  ["The Sneezing Statue","The statue in the town square had sneezed, and the pigeons were very upset."],
  ["Treehouse Hotel","The treehouse hotel had five stars, three rooms, and one very demanding squirrel."],
  ["Planet of Hats","On the planet Zorb, your hat decided everything, including your name."],
  ["Escape from Gran's","Gran had made her famous cabbage surprise, and the children had a plan."],
  ["The Lonely Robot","Bolt was the last robot on the abandoned space station, and he had just heard a knock."],
  ["The Bake Sale Heist","Somebody had stolen every cupcake from the school bake sale, and there was only one clue."],
  ["The Flying Sofa","Dad had bought a second-hand sofa, and it had very definitely just taken off."],
  ["Knight of the Kitchen","Princess Ada was the finest sword fighter in the land, but she fought with a ladle."],
  ["The Whispering Woods","Everyone knew the woods whispered, but tonight they were whispering Josh's name."],
  ["The Big Melt","On the hottest day of summer, the town's famous chocolate statue began to wobble."]
];
const GENRES = [
  "Fairy Tale","Space Adventure","Detective Mystery","Nature Documentary","Cooking Show","Pirate Epic",
  "Spooky (but not too spooky)","Superhero Comic","Sports Commentary","Royal Drama","Wild West",
  "Spy Thriller","Underwater Saga","Dinosaur Times"
];
const BEATS_MID = [
  "Someone speaks - write what they say in quotes",
  "Something goes terribly wrong",
  "A surprising new character arrives",
  "Describe a strange sound or smell",
  "Somebody makes a plan",
  "Then, out of nowhere...",
  "Somebody makes a big mistake",
  "Add a tiny, oddly specific detail",
  "Somebody gets very emotional",
  "The weather changes dramatically",
  "Someone reveals a secret",
  "Things get even sillier",
  "A chase begins",
  "Somebody eats something",
  "Help arrives from an unlikely place",
  "Somebody sings, dances or shouts"
];
const BEAT_END = "THE END - finish the story!";
const BEAT_NEAR_END = "Build up to the big finish";
const INK = [
  "banana","trampoline","moustache","jelly","volcano","wobble","sneeze","umbrella","penguin","spaghetti",
  "invisible","grandma","kazoo","pickle","rocket","tornado","pyjamas","marshmallow","goblin","hiccup",
  "disco","cardboard","lasso","noodle","yodel","sandwich","giraffe","glitter","snorkel","catapult",
  "biscuit","walrus","teapot","bubble","sausage","cactus","helicopter","pudding","trombone","slipper",
  "robot","llama","custard","meteor","squeak","waffle","octopus","crown","bagpipes","toothbrush",
  "hedgehog","boomerang","lollipop","submarine","cucumber","ballerina","tractor","pancake","whisper","wizard",
  "parachute","mermaid","ketchup","dragon","sprinkles","igloo","hamster","pirate","porridge","tuba",
  "skateboard","unicorn","jellybean","haystack","flamingo","spoon","doughnut","ghost","balloon","turnip",
  "compass","sock","moonbeam","snail","gravy","ninja","banjo","raincoat","zebra","muffin"
];
const FILLERS = [
  "And then, quite suddenly, absolutely nothing happened at all.",
  "Meanwhile, a duck walked past and pretended not to notice.",
  "Everyone stood very still and hummed nervously.",
  "Somewhere nearby, a kettle began to whistle.",
  "Nobody could remember what had just happened, so they carried on."
];
const TWISTS = [
  {id:"blind", name:"Blind Fold", desc:"Writers see NO words from the line before - only the story beat."},
  {id:"wide", name:"Wide Fold", desc:"Writers see the last EIGHT words instead of four."},
  {id:"tiny", name:"Tiny Tale", desc:"Every line must be 8 words or fewer."},
  {id:"swap", name:"Genre Swap", desc:"Halfway through, the story switches to a brand-new genre."},
  {id:"gold", name:"Golden Ink", desc:"Ink Words are worth 2 points instead of 1."}
];
// ---------- STORAGE ----------
const load = (k, d) => { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } };
const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
const KEY = 'cowork-foldedpage-';

// ---------- HELPERS ----------
const $ = s => document.querySelector(s);
const rnd = n => Math.floor(Math.random() * n);
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const words = s => (s || '').trim().split(/\s+/).filter(Boolean);
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === 'on') { for (const [ev, fn] of Object.entries(v)) e.addEventListener(ev, fn); }
    else if (k === 'text') e.textContent = v;
    else if (k === 'cls') e.className = v;
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat()) { if (c == null || c === false) continue; e.append(c.nodeType ? c : document.createTextNode(String(c))); }
  return e;
}
const rule = () => h('hr', {cls: 'rule'});
const esc = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
function usesInk(text, w) { return new RegExp('(^|[^a-z])' + esc(w) + '(s|es)?($|[^a-z])', 'i').test(text); }

// ---------- SOUND: Toy Piano ----------
let AC = null, master = null, muted = load(KEY + 'muted', false);
function audio() {
  if (!AC) {
    try {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      const comp = AC.createDynamicsCompressor();
      comp.threshold.value = -16; comp.ratio.value = 4;
      master = AC.createGain(); master.gain.value = muted ? 0 : 0.5;
      master.connect(comp); comp.connect(AC.destination);
    } catch (e) { AC = null; }
  }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function key(freq, t, dur = 0.55, vol = 0.32) {
  const ac = audio(); if (!ac) return;
  const out = ac.createGain();
  out.gain.setValueAtTime(0.0001, t);
  out.gain.exponentialRampToValueAtTime(vol, t + 0.008);
  out.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  out.connect(master);
  [[0, 1], [11, 0.7]].forEach(([cents, g]) => {     // two detuned triangles, a bit out of tune on purpose
    const o = ac.createOscillator(), og = ac.createGain();
    o.type = 'triangle'; o.frequency.value = freq; o.detune.value = cents;
    og.gain.value = g; o.connect(og); og.connect(out);
    o.start(t); o.stop(t + dur + 0.05);
  });
  const tine = ac.createOscillator(), tg = ac.createGain();  // short high tine partial
  tine.type = 'sine'; tine.frequency.value = freq * 4.07;
  tg.gain.setValueAtTime(0.0001, t);
  tg.gain.exponentialRampToValueAtTime(vol * 0.5, t + 0.005);
  tg.gain.exponentialRampToValueAtTime(0.0001, t + 0.09);
  tine.connect(tg); tg.connect(out); tine.start(t); tine.stop(t + 0.12);
}
const N = {A3:220,Bb3:233.1,C4:261.6,E4:329.6,F4:349.2,G4:392,A4:440,C5:523.3,D5:587.3,E5:659.3,G5:784,A5:880,C6:1046.5,E6:1318.5,G6:1568};
const SFX = {
  motif() { const ac = audio(); if (!ac) return; const t = ac.currentTime + 0.02; [N.C5, N.E5, N.G5, N.C6].forEach((f, i) => key(f, t + i * 0.16, i === 3 ? 0.9 : 0.45)); },
  win() { const ac = audio(); if (!ac) return; const t = ac.currentTime + 0.02; [N.G5, N.C6, N.E6, N.G6].forEach((f, i) => key(f, t + i * 0.11, 0.7, 0.28)); key(N.C5, t + 0.44, 1.1, 0.25); },
  ok() { const ac = audio(); if (!ac) return; const t = ac.currentTime + 0.02; key(N.E5, t, 0.35); key(N.A5, t + 0.09, 0.5); },
  fail() { const ac = audio(); if (!ac) return; const t = ac.currentTime + 0.02; key(N.A3, t, 0.7, 0.3); key(N.Bb3, t + 0.03, 0.7, 0.3); },
  tap() { const ac = audio(); if (!ac) return; key(N.C6 * 1.5, ac.currentTime + 0.01, 0.12, 0.16); },
  page() { const ac = audio(); if (!ac) return; const t = ac.currentTime + 0.01; key(N.G5, t, 0.25, 0.18); key(N.D5, t + 0.07, 0.3, 0.16); },
  tick() { const ac = audio(); if (!ac) return; key(N.A5 * 2, ac.currentTime + 0.01, 0.08, 0.1); }
};
function setMuted(m) {
  muted = m; save(KEY + 'muted', m);
  const b = $('#muteBtn'); b.setAttribute('aria-pressed', m ? 'true' : 'false'); b.textContent = m ? 'Sound off' : 'Sound on';
  if (master) master.gain.value = m ? 0 : 0.5;
}
$('#muteBtn').addEventListener('click', () => { setMuted(!muted); if (!muted) SFX.tap(); });
setMuted(muted);

// ---------- SPEECH ----------
let readAloud = load(KEY + 'voice', false);
function speak(text) {
  try {
    if (!('speechSynthesis' in window)) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text); u.rate = 0.95; u.pitch = 1.05;
    speechSynthesis.speak(u);
  } catch (e) {}
}
function hush() { try { if ('speechSynthesis' in window) speechSynthesis.cancel(); } catch (e) {} }

// ---------- STATE ----------
let G = null;
let timerId = null;
const settings = Object.assign({stories: 3, clock: 60}, load(KEY + 'settings', {}));
let savedNames = load(KEY + 'names', []);
if (!Array.isArray(savedNames)) savedNames = [];

function stopTimer() { if (timerId) { clearInterval(timerId); timerId = null; } }
function show(...nodes) {
  stopTimer(); hush();
  document.body.classList.remove('writing');
  const s = $('#screen'); s.replaceChildren(...nodes.filter(Boolean));
  window.scrollTo(0, 0);
}

function pickOpeners(count) {
  let used = load(KEY + 'used', []);
  if (!Array.isArray(used)) used = [];
  let pool = OPENERS.map((_, i) => i).filter(i => !used.includes(i));
  if (pool.length < count) { used = []; pool = OPENERS.map((_, i) => i); }
  const chosen = shuffle(pool).slice(0, count);
  save(KEY + 'used', used.concat(chosen));
  return chosen;
}
function linesFor(n) { return n <= 3 ? 6 : n === 4 ? 8 : Math.min(n, 8); }

function newGame(names) {
  const n = names.length;
  const opIdx = pickOpeners(settings.stories);
  const twists = shuffle(TWISTS);
  const genres = shuffle(GENRES);
  let ptr = rnd(n), gi = 0;
  const stories = opIdx.map((oi, s) => {
    const count = linesFor(n);
    const writers = []; for (let j = 0; j < count; j++) writers.push((ptr + j) % n);
    const reader = (ptr + count) % n;
    ptr = (ptr + count) % n;
    const beats = shuffle(BEATS_MID);
    const lineBeats = []; for (let j = 0; j < count; j++) lineBeats.push(j === count - 1 ? BEAT_END : (j === count - 2 && count >= 5) ? BEAT_NEAR_END : beats[j % beats.length]);
    const twist = s === 0 ? null : twists[(s - 1) % twists.length];
    const genre = genres[gi++ % genres.length];
    const genre2 = twist && twist.id === 'swap' ? genres[gi++ % genres.length] : null;
    const inkPool = shuffle(INK);
    return {
      title: OPENERS[oi][0], opener: OPENERS[oi][1], genre, genre2, twist,
      double: s === settings.stories - 1 && settings.stories > 1,
      writers, reader, beats: lineBeats,
      ink: writers.map((_, j) => [inkPool[j * 2], inkPool[j * 2 + 1]]),
      lines: [], quill: null, stitch: null, scored: false
    };
  });
  G = {
    players: names.map(name => ({name, score: 0, quills: 0, stitches: 0, inks: 0, lines: 0})),
    stories, s: 0
  };
}
const cur = () => G.stories[G.s];
const genreAt = (st, j) => st.genre2 && j >= Math.ceil(st.writers.length / 2) ? st.genre2 : st.genre;

// ---------- SCREENS ----------
function screenSetup() {
  const nameInputs = [];
  const grid = h('div', {cls: 'names'});
  for (let i = 0; i < 10; i++) {
    const id = 'pn' + i;
    const inp = h('input', {type: 'text', id, maxlength: 16, autocomplete: 'off', placeholder: i < 3 ? 'Player ' + (i + 1) + ' (needed)' : 'Player ' + (i + 1) + ' (optional)', 'aria-label': 'Player ' + (i + 1) + ' name'});
    inp.value = savedNames[i] || '';
    nameInputs.push(inp); grid.append(inp);
  }
  const err = h('p', {cls: 'err', role: 'alert'});
  const chipGroup = (label, opts, key, fmt) => {
    const wrap = h('div', {cls: 'chips', role: 'group', 'aria-label': label});
    const btns = opts.map(v => h('button', {cls: 'opt sm', 'aria-pressed': settings[key] === v ? 'true' : 'false', text: fmt(v), on: {click: () => {
      settings[key] = v; btns.forEach((b, k) => b.setAttribute('aria-pressed', opts[k] === v ? 'true' : 'false')); SFX.tap();
    }}}));
    wrap.append(...btns);
    return h('div', {cls: 'stack'}, h('p', {cls: 'muted', style: 'margin:0', text: label}), wrap);
  };
  const voiceBtn = h('button', {cls: 'opt sm', 'aria-pressed': readAloud ? 'true' : 'false', text: 'Read-aloud voice', on: {click: () => {
    readAloud = !readAloud; save(KEY + 'voice', readAloud); voiceBtn.setAttribute('aria-pressed', readAloud ? 'true' : 'false'); SFX.tap();
  }}});
  const start = h('button', {cls: 'big', text: 'Open the storybook', on: {click: () => {
    const raw = nameInputs.map(i => i.value.trim().replace(/\s+/g, ' '));
    const filled = [];
    raw.forEach((v, i) => { if (v) filled.push(v); });
    if (filled.length < 3) { err.textContent = 'You need at least 3 players - type 3 or more names.'; SFX.fail(); return; }
    const seen = {};
    const names = filled.map(v => { const k = v.toLowerCase(); seen[k] = (seen[k] || 0) + 1; return seen[k] > 1 ? v + ' ' + seen[k] : v; });
    savedNames = filled; save(KEY + 'names', filled); save(KEY + 'settings', settings);
    newGame(names); SFX.motif(); screenStoryIntro();
  }}});
  show(
    h('h2', {cls: 'title', text: 'Write a line. Fold it. Pass it on.'}),
    h('p', {cls: 'muted', text: 'A pass-the-phone story game where every writer sees only the last few words of the line before. 3-10 players · about 15-25 minutes.'}),
    h('div', {cls: 'panel'},
      h('p', {cls: 'dropcap', text: 'Once upon a time, people folded paper over each line of a story so the next writer could only see its last few words. Here the phone does the folding. On your turn, read the fold and the story beat, then write the next line in secret. When the tale is finished, the Reader turns the pages aloud and the room picks the funniest line and the funniest join between two lines before anyone learns who wrote what.'}),
      rule(),
      h('h3', {text: 'Scoring'}),
      h('p', null, h('b', {text: 'Golden Quill'}), ' (funniest line) +3 · ', h('b', {text: 'Best Stitch'}), ' (funniest join) +1 to both writers · ', h('b', {text: 'Ink Word'}), ' used in your line +1. The final story scores double.')
    ),
    h('div', {cls: 'panel stack'},
      h('h3', {text: 'Who is writing?'}),
      grid, err,
      rule(),
      chipGroup('Stories this game', [2, 3, 4], 'stories', v => v + ' stories'),
      chipGroup('Writing clock per line', [45, 60, 90, 0], 'clock', v => v ? v + ' seconds' : 'No clock'),
      h('div', {cls: 'stack'}, h('p', {cls: 'muted', style: 'margin:0', text: 'The phone can read each page aloud'}), h('div', {cls: 'chips'}, voiceBtn))
    ),
    start
  );
}

function screenStoryIntro() {
  const st = cur();
  const tags = h('p', null,
    h('span', {cls: 'tag', text: 'Genre: ' + st.genre}),
    st.twist ? h('span', {cls: 'tag twist', text: 'Twist: ' + st.twist.name}) : null,
    st.double ? h('span', {cls: 'tag twist', text: 'Final story: double points'}) : null);
  show(
    h('p', {cls: 'muted', text: 'Story ' + (G.s + 1) + ' of ' + G.stories.length}),
    h('h2', {text: st.title}),
    h('div', {cls: 'panel'},
      tags,
      st.twist ? h('p', null, h('b', {text: st.twist.name + ': '}), st.twist.desc) : h('p', {text: 'A plain first story to warm up the ink.'}),
      st.genre2 ? h('p', {cls: 'muted', text: 'The genre will change halfway, and the writers will see when it happens.'}) : null,
      rule(),
      h('p', {text: st.writers.length + ' lines, written in this order:'}),
      h('p', {cls: 'muted', text: st.writers.map(i => G.players[i].name).join(' → ')}),
      h('p', null, 'This story’s Reader is ', h('b', {text: G.players[st.reader].name}), '.')
    ),
    h('button', {cls: 'big', text: 'Start writing', on: {click: () => { SFX.tap(); screenHandoff(0); }}}),
    scoreStrip()
  );
}

function screenHandoff(j) {
  const st = cur();
  const who = G.players[st.writers[j]].name;
  show(
    h('p', {cls: 'muted', text: st.title + ' · line ' + (j + 1) + ' of ' + st.writers.length}),
    h('div', {cls: 'panel', style: 'text-align:center'},
      h('p', {cls: 'muted', text: 'Pass the phone to'}),
      h('h2', {text: who}),
      h('p', {text: 'Everyone else: no peeking at the page!'})
    ),
    h('button', {cls: 'big', text: 'I’m ' + who + ' - open the fold', on: {click: () => { SFX.page(); screenWrite(j); }}})
  );
}

function foldWords(st, j) {
  const prev = j === 0 ? st.opener : st.lines[j - 1].text;
  const w = words(prev);
  const n = st.twist && st.twist.id === 'wide' ? 8 : 4;
  return w.slice(-n).join(' ');
}

function screenWrite(j) {
  const st = cur();
  const pi = st.writers[j];
  const blind = st.twist && st.twist.id === 'blind';
  const tiny = st.twist && st.twist.id === 'tiny';
  const g = genreAt(st, j);
  const swapped = st.genre2 && j === Math.ceil(st.writers.length / 2);
  const inkVal = st.twist && st.twist.id === 'gold' ? 2 : 1;
  const [i1, i2] = st.ink[j];

  const ta = h('textarea', {id: 'lineBox', maxlength: 140, rows: 3, 'aria-label': 'Your line of the story', placeholder: blind ? 'Write a line that fits the beat...' : 'Carry on from the fold...'});
  const counter = h('span', {cls: 'muted', text: tiny ? '0 / 8 words' : '0 / 140'});
  const err = h('p', {cls: 'err', role: 'alert'});
  const inkNote = h('span', {cls: 'muted'});
  const timerTxt = h('span', {cls: 'timer', text: settings.clock ? settings.clock + 's' : ''});
  const bar = h('div'); const meter = h('div', {cls: 'meter', 'aria-hidden': 'true'}, bar);
  let done = false;

  const refresh = () => {
    const w = words(ta.value).length;
    counter.textContent = tiny ? w + ' / 8 words' : ta.value.length + ' / 140';
    counter.style.color = tiny && w > 8 ? '#8c2f39' : '';
    const hit = [i1, i2].filter(x => usesInk(ta.value, x));
    inkNote.textContent = hit.length ? '✒ Ink Word used: ' + hit[0] : '';
  };
  ta.addEventListener('input', () => { err.textContent = ''; refresh(); });

  const commit = (text, filler) => {
    if (done) return; done = true; stopTimer();
    const used = filler ? null : ([i1, i2].find(x => usesInk(text, x)) || null);
    st.lines[j] = {text, author: pi, inkUsed: used, inkVal, filler: !!filler, beat: st.beats[j], genre: g};
    G.players[pi].lines++;
    if (j + 1 < st.writers.length) screenHandoff(j + 1); else screenStoryDone();
  };
  const tryCommit = () => {
    const t = ta.value.trim().replace(/\s+/g, ' ');
    if (t.length < 2) { err.textContent = 'Write at least a couple of letters first.'; SFX.fail(); ta.focus(); return; }
    if (tiny && words(t).length > 8) { err.textContent = 'Tiny Tale: 8 words or fewer, please.'; SFX.fail(); return; }
    SFX.ok(); commit(t, false);
  };
  ta.addEventListener('keydown', e => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); tryCommit(); } });

  const submit = h('button', {cls: 'big', text: 'Fold it over and pass', on: {click: tryCommit}});
  const foldBox = blind
    ? h('div', {cls: 'fold'}, h('span', {text: 'The fold is closed - you see nothing this time!'}))
    : h('div', {cls: 'fold'}, h('span', {cls: 'dots', 'aria-hidden': 'true', text: '… '}), h('span', {text: foldWords(st, j)}));

  show(
    h('div', {cls: 'row', style: 'justify-content:space-between'},
      h('span', {cls: 'muted', style: 'flex:0 1 auto', text: G.players[pi].name + ' · line ' + (j + 1) + ' of ' + st.writers.length}),
      h('span', {style: 'flex:0 0 auto'}, timerTxt)),
    settings.clock ? meter : null,
    h('p', {style: 'margin:8px 0 0'}, h('span', {cls: 'beat', text: st.beats[j]})),
    foldBox,
    h('label', {for: 'lineBox', cls: 'sr', text: 'Your line'}),
    ta,
    submit,
    h('div', {cls: 'row', style: 'justify-content:space-between'}, h('span', {style: 'flex:0 1 auto'}, inkNote), h('span', {style: 'flex:0 0 auto'}, counter)),
    err,
    h('div', {cls: 'panel'},
      h('p', {style: 'margin:0'}, h('b', {text: 'Ink Words'}), ' (+' + inkVal + ' if you use one): ', h('span', {cls: 'tag', text: i1}), h('span', {cls: 'tag', text: i2})),
      h('p', {style: 'margin:6px 0 0'}, h('span', {cls: 'tag', text: 'Genre: ' + g}), swapped ? h('span', {cls: 'tag twist', text: 'Genre Swap! It’s ' + g + ' now'}) : null,
        tiny ? h('span', {cls: 'tag twist', text: 'Tiny Tale: 8 words max'}) : null)
    )
  );
  document.body.classList.add('writing');
  setTimeout(() => { try { ta.focus({preventScroll: true}); } catch (e) {} }, 60);

  if (settings.clock) {
    const end = performance.now() + settings.clock * 1000;
    let lastSec = settings.clock;
    timerId = setInterval(() => {
      const left = Math.max(0, (end - performance.now()) / 1000);
      const sec = Math.ceil(left);
      timerTxt.textContent = sec + 's';
      timerTxt.classList.toggle('low', sec <= 10);
      bar.style.width = (left / settings.clock * 100) + '%';
      if (sec !== lastSec && sec <= 5 && sec > 0) SFX.tick();
      lastSec = sec;
      if (left <= 0) {
        let t = ta.value.trim().replace(/\s+/g, ' ');
        if (tiny) t = words(t).slice(0, 8).join(' ');
        if (t.length >= 2) { SFX.ok(); commit(t, false); }
        else { SFX.fail(); commit(FILLERS[rnd(FILLERS.length)], true); }
      }
    }, 200);
  }
}

function screenStoryDone() {
  const st = cur();
  SFX.motif();
  show(
    h('div', {cls: 'panel', style: 'text-align:center'},
      h('p', {cls: 'muted', text: 'The last line is written.'}),
      h('h2', {text: '“' + st.title + '” is finished!'}),
      rule(),
      h('p', {text: 'Pass the phone to the Reader:'}),
      h('h2', {text: G.players[st.reader].name}),
      h('p', {cls: 'muted', text: 'Read each page aloud in your best storytelling voice. Nobody says who wrote what yet!'})
    ),
    h('button', {cls: 'big', text: 'I’m the Reader - open the book', on: {click: () => { SFX.page(); screenReveal(0); }}})
  );
}

function storyPages(st) { return [st.opener].concat(st.lines.map(l => l.text)); }

function screenReveal(i) {
  const st = cur();
  const pages = storyPages(st);
  const last = i === pages.length - 1;
  const lineNode = h('p', {cls: 'line', text: pages[i]});
  const page = h('div', {cls: 'panel page turning'},
    h('p', {cls: 'num', text: i === 0 ? st.title + ' · the opening' : 'Page ' + (i + 1) + ' of ' + pages.length}),
    lineNode,
    i >= 2 && st.lines[i - 1].genre !== st.lines[i - 2].genre ?h('p', {cls: 'muted', text: '(The genre just swapped to ' + st.lines[i - 1].genre + '!)'}) : null
  );
  show(
    h('p', {cls: 'muted', text: 'Reader: ' + G.players[st.reader].name + ' · read this aloud'}),
    page,
    h('div', {cls: 'row'},
      h('button', {cls: 'ghost', text: 'Back', disabled: i === 0 ? true : null, on: {click: () => { SFX.page(); screenReveal(i - 1); }}}),
      h('button', {cls: 'ghost', text: '🔊 Read this page', on: {click: () => speak(pages[i])}}),
      last
        ? h('button', {text: 'Judge the story', on: {click: () => { SFX.tap(); screenJudge(); }}})
        : h('button', {text: 'Turn the page', on: {click: () => { SFX.page(); screenReveal(i + 1); }}})
    ),
    h('div', {cls: 'meter', 'aria-hidden': 'true'}, h('div', {style: 'width:' + ((i + 1) / pages.length * 100) + '%'}))
  );
  if (readAloud) setTimeout(() => speak(pages[i]), 250);
}

function screenJudge() {
  const st = cur();
  let quill = null, stitch = null;
  const go = h('button', {cls: 'big', text: 'Reveal the writers', disabled: true});
  const lineBtns = st.lines.map((l, k) => h('button', {cls: 'pick opt', 'aria-pressed': 'false', on: {click: () => {
    quill = k; lineBtns.forEach((b, m) => b.setAttribute('aria-pressed', m === k ? 'true' : 'false')); SFX.tap(); upd();
  }}}, h('b', {text: (k + 1) + '. '}), l.text));
  const joins = [];
  for (let k = 0; k + 1 < st.lines.length; k++) joins.push(k);
  const stitchBtns = joins.map(k => {
    const a = words(st.lines[k].text).slice(-4).join(' '), b = words(st.lines[k + 1].text).slice(0, 5).join(' ');
    return h('button', {cls: 'pick opt', 'aria-pressed': 'false', on: {click: () => {
      stitch = k; stitchBtns.forEach((x, m) => x.setAttribute('aria-pressed', joins[m] === k ? 'true' : 'false')); SFX.tap(); upd();
    }}}, h('b', {text: 'Lines ' + (k + 1) + '-' + (k + 2) + ': '}), '…' + a + ' ', h('b', {text: '|'}), ' ' + b + '…');
  });
  const upd = () => { go.disabled = !(quill != null && stitch != null); };
  go.addEventListener('click', () => { st.quill = quill; st.stitch = stitch; score(st); SFX.win(); screenAuthors(); });
  show(
    h('h2', {text: 'Judge “' + st.title + '”'}),
    h('p', {cls: 'muted', text: 'Decide together by shouting, pointing or a show of hands. The Reader taps the winners. Writers stay secret until you’re done.'}),
    h('div', {cls: 'panel'}, h('h3', {text: '🏆 Golden Quill: the funniest line'}), lineBtns),
    h('div', {cls: 'panel'}, h('h3', {text: '🧵 Best Stitch: where two lines joined funniest'}), stitchBtns),
    go
  );
}

function score(st) {
  if (st.scored) return; st.scored = true;
  const m = st.double ? 2 : 1;
  st.gains = G.players.map(() => 0);
  st.lines.forEach(l => { if (l.inkUsed) { st.gains[l.author] += l.inkVal * m; G.players[l.author].inks++; } });
  const q = st.lines[st.quill]; st.gains[q.author] += 3 * m; G.players[q.author].quills++;
  const a = st.lines[st.stitch].author, b = st.lines[st.stitch + 1].author;
  st.gains[a] += 1 * m; G.players[a].stitches++;
  if (b !== a) { st.gains[b] += 1 * m; G.players[b].stitches++; }
  st.gains.forEach((g, i) => { G.players[i].score += g; });
}

function storyBook(st, withMarks) {
  const box = h('div', null, h('div', {cls: 'story-line'}, h('div', {text: st.opener}), h('div', {cls: 'by', text: 'The opening'})));
  st.lines.forEach((l, k) => {
    const marks = [];
    if (withMarks) {
      if (k === st.quill) marks.push('🏆 Golden Quill');
      if (k === st.stitch || k === st.stitch + 1) marks.push('🧵 Best Stitch');
      if (l.inkUsed) marks.push('✒ ' + l.inkUsed);
      if (l.filler) marks.push('ink ran dry');
    }
    box.append(h('div', {cls: 'story-line'}, h('div', {text: l.text}),
      h('div', {cls: 'by', text: '- ' + G.players[l.author].name + (marks.length ? ' · ' + marks.join(' · ') : '')})));
  });
  return box;
}

function rankRows(sorted) {
  let rank = 0, prev = null;
  return sorted.map((p, i) => { if (p.score !== prev) { rank = i + 1; prev = p.score; } return {p, rank}; });
}
function scoreTable(gains) {
  const sorted = G.players.map((p, i) => Object.assign({i}, p)).sort((a, b) => b.score - a.score);
  const t = h('table', {cls: 'score-table'}, h('thead', null, h('tr', null, h('th', {text: '#'}), h('th', {text: 'Writer'}), gains ? h('th', {text: 'This story'}) : null, h('th', {text: 'Total', style: 'text-align:right'}))));
  const tb = h('tbody');
  rankRows(sorted).forEach(({p, rank}) => tb.append(h('tr', null, h('td', {text: rank}), h('td', {text: p.name}),
    gains ? h('td', {cls: gains[p.i] ? 'gain' : 'muted', text: gains[p.i] ? '+' + gains[p.i] : '0'}) : null,
    h('td', {cls: 'n', text: p.score}))));
  t.append(tb); return t;
}
function scoreStrip() {
  if (!G || G.players.every(p => p.score === 0)) return null;
  return h('div', {cls: 'panel'}, h('h3', {text: 'Scores so far'}), scoreTable(null));
}

function screenAuthors() {
  const st = cur();
  const lastStory = G.s === G.stories.length - 1;
  show(
    h('h2', {text: 'Who wrote what?'}),
    st.double ? h('p', null, h('span', {cls: 'tag twist', text: 'Final story: points doubled'})) : null,
    h('div', {cls: 'panel'}, h('h3', {text: st.title}), storyBook(st, true)),
    h('div', {cls: 'panel'}, h('h3', {text: 'Scoreboard'}), scoreTable(st.gains)),
    h('button', {cls: 'big', text: lastStory ? 'See the final pages' : 'Next story', on: {click: () => {
      SFX.tap(); if (lastStory) screenFinal(); else { G.s++; screenStoryIntro(); }
    }}})
  );
}

function award(title, key, one, many) {
  const best = Math.max(...G.players.map(p => p[key]));
  if (best <= 0) return null;
  const who = G.players.filter(p => p[key] === best).map(p => p.name);
  return h('div', {cls: 'award'}, h('b', {text: title + ': '}), who.join(' & ') + ' (' + best + ' ' + (best === 1 ? one : many) + ')');
}

function screenFinal() {
  const sorted = G.players.slice().sort((a, b) => b.score - a.score);
  const top = sorted[0].score;
  const winners = sorted.filter(p => p.score === top).map(p => p.name);
  SFX.win();
  const book = h('div', {cls: 'panel'}, h('h3', {text: 'The Collected Tales'}));
  G.stories.forEach((st, i) => { if (i) book.append(rule()); book.append(h('h3', {text: st.title}), storyBook(st, true)); });
  show(
    h('p', {cls: 'muted', text: 'The End'}),
    h('h2', {cls: 'title', text: winners.length > 1 ? 'Joint winners!' : winners[0] + ' wins!'}),
    h('div', {cls: 'panel', style: 'text-align:center'},
      h('p', {cls: 'dropcap', style: 'text-align:left', text: winners.length > 1
        ? 'And so the quills were laid down, and ' + winners.join(' and ') + ' shared the crown with ' + top + ' points each.'
        : 'And so the quills were laid down, and ' + winners[0] + ' was crowned Master Storyteller with ' + top + ' points.'})
    ),
    h('div', {cls: 'panel'}, h('h3', {text: 'Final scores'}), scoreTable(null)),
    h('div', {cls: 'panel'}, h('h3', {text: 'Awards'}),
      award('🏆 Most Golden Quills', 'quills', 'quill', 'quills'),
      award('🧵 Best Stitcher', 'stitches', 'stitch', 'stitches'),
      award('✒ Ink Master', 'inks', 'ink word', 'ink words')),
    book,
    h('div', {cls: 'row'},
      h('button', {text: 'Play again (same writers)', on: {click: () => { newGame(G.players.map(p => p.name)); SFX.motif(); screenStoryIntro(); }}}),
      h('button', {cls: 'ghost', text: 'New game', on: {click: () => { SFX.tap(); screenSetup(); }}}))
  );
}

screenSetup();
</script>
