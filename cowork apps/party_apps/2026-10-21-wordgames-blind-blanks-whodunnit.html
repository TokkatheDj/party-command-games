<!-- CONCEPT: WORD GAMES / AUTHOR DEDUCTION - "Blind Blanks: Whodunnit?": a pass-the-phone fill-in-the-blank party game where the phone deals out the blanks of a hidden story ("a body part", "a celebrity", "something -ing") and every player secretly fills theirs with NO idea what the story is - often while playing a secret Persona card (Pirate, Grandma, Robot, Toddler...) - then a rotating Reader performs the finished story one blank at a time, and the real game begins: four Spotlight blanks are marked and everyone secretly guesses WHO wrote each one. Detectives score +2 per correct author, and the round's Mode card decides whether writers score for being recognised (SIGNATURE) or for fooling the room (DISGUISE); a small Golden Blank vote rewards the best line. App-checked Rule cards (Letter Lock, Tiny Words, Mega Words, One Word Only, Two-Word Combo), 26 stories, 32 personas, optional read-aloud narrator, double-points final round, resumable saves, awards | Players: 3-10 | ~15-30 min -->

function parseStory(i){
  const [title,text]=STORIES[i];const parts=[],types=[];const re=/\[(\w+)\]/g;let last=0,m;
  while((m=re.exec(text))){parts.push(text.slice(last,m.index));parts.push({b:types.length});types.push(m[1]);last=re.lastIndex}
  parts.push(text.slice(last));return {title,parts,types};
}
const N=()=>S.players.length;
const P=i=>S.players[i];
const nm=i=>esc(P(i).name);
const isFinal=()=>S.round===S.rounds;
const ruleText=()=>{const r=RULES.find(x=>x.id===S.rule);return r.desc.replace('{L}',S.letter)};
const ruleName=()=>RULES.find(x=>x.id===S.rule).name;

function checkAns(raw){
  const a=raw.replace(/\s+/g,' ').trim();
  if(!a)return 'Fill this one in!';
  if(a.length>40)return 'Keep it under 40 characters.';
  const first=a.match(/[\p{L}\p{N}]/u);
  if(!first)return 'Use some actual letters!';
  const solid=a.replace(/\s/g,'');
  switch(S.rule){
    case 'letter':if(first[0].toUpperCase()!==S.letter)return `Letter Lock: must start with ${S.letter}.`;break;
    case 'tiny':if(solid.length>6)return `Tiny Words: 6 letters max (that's ${solid.length}).`;break;
    case 'mega':if(solid.length<8)return `Mega Words: 8+ letters needed (that's ${solid.length}).`;break;
    case 'one':if(a.includes(' '))return 'One Word Only: no spaces.';break;
    case 'two':if(a.split(' ').length!==2)return 'Two-Word Combo: exactly two words.';break;
  }
  return '';
}

function startGame(){
  const seen={};
  const names=setup.names.map(n=>n.replace(/\s+/g,' ').trim().slice(0,16)).filter(Boolean).map(n=>{
    let k=n,c=2;while(seen[k.toLowerCase()])k=n+' '+(c++);seen[k.toLowerCase()]=1;return k});
  if(names.length<3)return;
  S={v:1,players:names.map(name=>({name,score:0,correct:0,recog:0,fooled:0,golden:0})),
     rounds:setup.rounds,persona:setup.persona,rules:setup.rules,narrator:setup.narrator&&canSpeak,round:0,used:[]};
  newRound();
}
function newRound(){
  S.round++;
  let pool=STORIES.map((_,i)=>i).filter(i=>!S.used.includes(i));
  if(!pool.length){S.used=[];pool=STORIES.map((_,i)=>i)}
  S.story=rnd(pool);S.used.push(S.story);
  const st=parseStory(S.story),n=N();
  S.mode=S.round%2===1?'sig':'dis';
  S.rule=(!S.rules||S.round===1)?'none':rnd(RULES).id;
  S.letter=rnd([...LOCK_LETTERS]);
  S.order=[];for(let k=0;k<n;k++)S.order.push((S.round-1+k)%n);
  S.blanks=st.types.map(t=>({type:t,author:-1,answer:''}));
  shuffle(S.blanks.map((_,i)=>i)).forEach((bi,k)=>{S.blanks[bi].author=S.order[k%n]});
  S.personas=S.persona?shuffle(PERSONAS.map((_,i)=>i)).slice(0,n):null;
  // spotlight: up to 4 blanks, distinct authors first
  const byA={};S.blanks.forEach((b,i)=>{(byA[b.author]=byA[b.author]||[]).push(i)});
  const authors=shuffle(Object.keys(byA).map(Number));const spot=[];
  authors.slice(0,4).forEach(a=>spot.push(rnd(byA[a])));
  const rest=shuffle(S.blanks.map((_,i)=>i).filter(i=>!spot.includes(i)));
  while(spot.length<4&&rest.length)spot.push(rest.pop());
  S.spot=spot.sort((x,y)=>x-y);
  S.reader=(S.round-1)%n;S.revealN=0;S.turn=0;S.guesses={};S.golden={};S.last=null;S.phase='intro';
  save();render();
}
function finishRound(){
  const n=N(),mult=isFinal()?2:1,delta=Array(n).fill(0),det=[];
  S.spot.forEach(bi=>{
    const a=S.blanks[bi].author,row={bi,author:a,hits:[],misses:[]};
    for(let g=0;g<n;g++){
      if(g===a)continue;
      const pick=(S.guesses[g]||{})[bi];
      if(pick===a){row.hits.push(g);delta[g]+=2*mult;P(g).correct++;
        if(S.mode==='sig'){delta[a]+=mult;P(a).recog++}}
      else{row.misses.push(g);if(S.mode==='dis'){delta[a]+=mult;P(a).fooled++}}
    }
    det.push(row);
  });
  const gold={};
  Object.entries(S.golden).forEach(([g,bi])=>{if(bi==null)return;const a=S.blanks[bi].author;delta[a]+=mult;P(a).golden++;gold[bi]=(gold[bi]||0)+1});
  delta.forEach((d,i)=>P(i).score+=d);
  S.last={delta,det,gold,mult};S.phase='results';save();render();
}

}

function gate(title,who,sub,act,label,step){
  return `<div class="gate"><div class="lbl">${title} &middot; ${step}</div><div style="font-size:44px">📱</div>
   <p>Pass the phone to</p><div class="who">${who}</div><p class="small">${sub}</p>
   <button class="btn" data-act="${act}">${label}</button></div>`;
}
V.fillGate=()=>{const p=S.order[S.turn];
  return gate('Writing',nm(p),'Everyone else - look away!','openFill',`I'm ${nm(p)} - show my blanks`,`writer ${S.turn+1} of ${N()}`)};
V.fill=()=>{
  const p=S.order[S.turn],mine=S.blanks.map((b,i)=>({...b,i})).filter(b=>b.author===p),m=MODES[S.mode];
  const per=S.persona?PERSONAS[S.personas[p]]:null;
  return `<div><div class="lbl">${nm(p)}'s blanks</div><h2>Fill them in - blind!</h2></div>
  ${per?`<div class="persona"><div class="lbl">Your secret persona</div><p style="margin-top:4px">Write as <b>${per[0]}</b>. ${per[1]}</p></div>`:''}
  <div class="row" style="flex-wrap:wrap;gap:6px"><span class="tag ${S.mode}" style="flex:0 0 auto">${m.icon} ${m.name}</span><span class="tag rule" style="flex:0 0 auto">📜 ${ruleName()}</span></div>
  <p class="small">${m.write} ${S.rule!=='none'?esc(ruleText()):''}</p>
  <div class="card">${mine.map((b,k)=>`<div class="blankrow"><div class="hint">${k+1}. ${HINTS[b.type]}</div>
     <input type="text" maxlength="40" data-blank="${b.i}" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="${k===mine.length-1?'done':'next'}">
     <div class="err" data-err="${b.i}"></div></div>`).join('')}</div>
  <button class="btn" data-act="lockFill">Lock in my blanks</button>`;
};
function storyHTML(showAll){
  const st=parseStory(S.story);
  return st.parts.map(x=>{
    if(typeof x==='string')return esc(x);
    const bi=x.b,b=S.blanks[bi],sp=S.spot.indexOf(bi),shown=showAll||bi<S.revealN;
    if(!shown)return `<span class="bl hid${bi===S.revealN?' next':''}">${sp>=0?`<span class="badge">${sp+1}</span>`:''}${esc(HINTS[b.type].split(' (')[0].toLowerCase())}</span>`;
    return `<span class="bl ${sp>=0?'spot':'shown'}">${sp>=0?`<span class="badge">${sp+1}</span>`:''}${esc(b.answer)}</span>`;
  }).join('');
}
function lineup(){
  if(!S.persona)return '';
  return `<div class="small">Writing tonight: ${shuffleSeeded(S.personas.map(i=>PERSONAS[i][0])).join(', ')}</div>`;
}
function shuffleSeeded(a){ // stable order per round so re-renders don't jumble
  return a.slice().sort((x,y)=>hash(x+S.round)-hash(y+S.round));
}
function hash(s){let h=7;for(const c of s)h=(h*31+c.charCodeAt(0))|0;return h}
V.reveal=()=>{
  const done=S.revealN>=S.blanks.length;
  return `<div class="center"><div class="lbl">Round ${S.round} &middot; Reader: ${nm(S.reader)}</div><h2 style="margin-top:4px">"${esc(STORIES[S.story][0])}"</h2>
  <p class="small" style="margin-top:4px">${nm(S.reader)}, read it out loud with maximum drama. Gold blanks are the Spotlight - remember them!</p></div>
  ${lineup()}
  <div class="card story" id="story">${storyHTML(false)}</div>
  ${done?`${S.narrator?'<button class="btn alt" data-act="speak">🔊 Robot narrator: read it all</button>':''}
     <button class="btn" data-act="toGuess">Start the Whodunnit</button>`
   :`<div class="row"><button class="btn" data-act="revealNext">Reveal next blank</button><button class="btn alt" data-act="revealAll" style="flex:0 0 34%">Reveal all</button></div>`}`;
};
V.guessGate=()=>{const p=S.turn;
  return gate('Whodunnit',nm(p),'Keep your guesses secret!','openGuess',`I'm ${nm(p)} - let me guess`,`detective ${p+1} of ${N()}`)};
V.guess=()=>{
  const g=S.turn,mine=S.guesses[g]||(S.guesses[g]={}),n=N();
  const qs=S.spot.map((bi,k)=>{const b=S.blanks[bi];
    if(b.author===g)return `<div class="spotq"><div class="lbl"><span class="badge">${k+1}</span>${esc(HINTS[b.type].split(' (')[0])}</div><div class="ans">${esc(b.answer)}</div><p class="small">✍️ You wrote this one - nothing to guess.</p></div>`;
    return `<div class="spotq"><div class="lbl"><span class="badge">${k+1}</span>${esc(HINTS[b.type].split(' (')[0])}</div><div class="ans">${esc(b.answer)}</div>
      <div class="chips">${S.players.map((_,i)=>i===g?'':`<button class="chip ${mine[bi]===i?'on':''}" data-act="pick" data-v="${bi}:${i}">${nm(i)}</button>`).join('')}</div></div>`}).join('');
  const others=S.blanks.map((b,i)=>({b,i})).filter(x=>x.b.author!==g);
  const need=S.spot.filter(bi=>S.blanks[bi].author!==g),ready=need.every(bi=>mine[bi]!=null);
  return `<div><div class="lbl">Detective ${nm(g)} &middot; ${MODES[S.mode].icon} ${MODES[S.mode].name} round</div><h2>Who wrote it?</h2></div>
  ${lineup()}
  ${qs}
  <div class="card"><h3>🏅 Golden Blank (optional)</h3><p class="small" style="margin-bottom:8px">The funniest blank you didn't write - its writer gets +1.</p>
   <div class="chips">${others.map(x=>`<button class="chip gold ${S.golden[g]===x.i?'on':''}" data-act="gold" data-v="${x.i}">${esc(x.b.answer)}</button>`).join('')}</div></div>
  <button class="btn" data-act="lockGuess" ${ready?'':'disabled'}>${ready?'Lock in my guesses':'Pick an author for every Spotlight'}</button>`;
};
V.results=()=>{
  const L=S.last,n=N(),m=MODES[S.mode];
  const rows=L.det.map((r,k)=>{const b=S.blanks[r.bi],per=S.persona?` <span class="small">(as ${PERSONAS[S.personas[r.author]][0]})</span>`:'';
    const pts=S.mode==='sig'?r.hits.length:r.misses.length;
    return `<div class="spotq"><div class="lbl"><span class="badge">${k+1}</span>${esc(HINTS[b.type].split(' (')[0])}</div><div class="ans">${esc(b.answer)}</div>
     <p>Written by <b>${nm(r.author)}</b>${per}</p>
     <p class="small" style="margin-top:4px">${r.hits.length?`<span class="ok">✓ ${r.hits.map(nm).join(', ')}</span>`:'<span class="no">Nobody got it</span>'}
     ${r.misses.length?` &middot; <span class="no">✗ ${r.misses.map(nm).join(', ')}</span>`:''}
     &middot; writer +${pts*L.mult} (${m.name.toLowerCase()})</p></div>`}).join('');
  const top=Object.entries(L.gold).sort((a,b)=>b[1]-a[1]);
  const gold=top.length?`<div class="card"><h3>🏅 Golden Blank</h3><p><b style="color:var(--gold)">"${esc(S.blanks[top[0][0]].answer)}"</b> by ${nm(S.blanks[top[0][0]].author)} - ${top[0][1]} vote${top[0][1]>1?'s':''}</p></div>`:'';
  const board=S.players.map((p,i)=>({p,i})).sort((a,b)=>b.p.score-a.p.score)
    .map(x=>`<div class="score"><span>${esc(x.p.name)}</span><span>${x.p.score}${L.delta[x.i]?`<span class="delta">+${L.delta[x.i]}</span>`:''}</span></div>`).join('');
  return `<div class="center"><div class="lbl">Round ${S.round} results${L.mult>1?' &middot; DOUBLE POINTS':''}</div><h2 style="margin-top:4px">Case closed!</h2></div>
  ${rows}${gold}<div class="card"><h3>Scoreboard</h3>${board}</div>
  ${S.round<S.rounds?'<button class="btn" data-act="next">Next round</button>':'<button class="btn" data-act="toFinal">Final results</button>'}
  <button class="btn alt" data-act="showStory">Show the whole story again</button>`;
};
V.final=()=>{
  const r=S.players.map((p,i)=>({p,i})).sort((a,b)=>b.p.score-a.p.score);
  const pod=[r[1],r[0],r[2]].filter(Boolean).map((x,k)=>{const place=x===r[0]?1:x===r[1]?2:3,h=[110,80,60][place-1];
    return `<div class="pod" style="min-height:${h}px"><div style="font-size:26px">${['🥇','🥈','🥉'][place-1]}</div><div class="nm">${esc(x.p.name)}</div><div class="small">${x.p.score} pts</div></div>`}).join('');
  const award=(ic,t,key,unit)=>{const mx=Math.max(...S.players.map(p=>p[key]));if(!mx)return '';
    const w=S.players.filter(p=>p[key]===mx).map(p=>esc(p.name)).join(' & ');
    return `<div class="award"><div class="ic">${ic}</div><div><b>${t}</b><div class="small">${w} - ${mx} ${unit}</div></div></div>`};
  const aw=[award('🔍','Sharpest Detective','correct','correct guesses'),award('🖋️','Signature Style','recog','times recognised'),
    award('🥸','Master of Disguise','fooled','detectives fooled'),award('🏅','Golden Pen','golden','golden votes')].join('');
  return `<h1>Case Closed!</h1><h2 class="center">${esc(r[0].p.name)} wins</h2><div class="sub">The case of the Blind Blanks is solved</div>
  <div class="podium">${pod}</div>
  <div class="card"><h3>Final scores</h3>${r.map(x=>`<div class="score"><span>${esc(x.p.name)}</span><span>${x.p.score}</span></div>`).join('')}</div>
  ${aw?`<div class="card"><h3>Awards</h3>${aw}</div>`:''}
  <button class="btn" data-act="again">Play again - same players</button>
  <button class="btn alt" data-act="newPlayers">New players</button>`;
};

function render(){
  const ph=S?S.phase:'setup';
  app.innerHTML=`<div class="wrap">${topbar()}${V[ph]()}</div>${modal?modalHTML():''}`;
  if(ph==='fill'){const f=app.querySelector('input[data-blank]');if(f)f.focus({preventScroll:true})}
}
function go(ph,keepScroll){S.phase=ph;save();render();if(!keepScroll)app.scrollTop=0}
function modalHTML(){
  if(modal==='help')return `<div class="modal" data-act="close"><div class="card" data-stop="1"><h2>How to play</h2>${howList()}<button class="btn" data-act="close">Got it</button></div></div>`;
  if(modal==='quit')return `<div class="modal" data-act="close"><div class="card" data-stop="1"><h2>Start a new game?</h2><p>This game's scores will be lost.</p>
    <button class="btn" data-act="quitYes">Yes, new game</button><button class="btn alt" data-act="close">Keep playing</button></div></div>`;
  if(modal==='story')return `<div class="modal" data-act="close"><div class="card" data-stop="1" style="max-height:85vh;overflow:auto"><h2>"${esc(STORIES[S.story][0])}"</h2><div class="story">${storyHTML(true)}</div><button class="btn" data-act="close">Close</button></div></div>`;
  return '';
}
function speak(){
  if(!canSpeak)return;speechSynthesis.cancel();
  const st=parseStory(S.story);
  const text=st.parts.map(x=>typeof x==='string'?x:S.blanks[x.b].answer).join('');
  const u=new SpeechSynthesisUtterance(STORIES[S.story][0]+'. '+text);u.rate=.95;u.pitch=.8;speechSynthesis.speak(u);
}
function stopSpeak(){if(canSpeak)try{speechSynthesis.cancel()}catch(e){}}

const A={
  help(){modal='help';render()},
  quit(){modal='quit';render()},
  close(){modal=null;render()},
  quitYes(){modal=null;stopSpeak();S=null;save();render()},
  add(){if(setup.names.length<10){setup.names.push('');render();const ins=app.querySelectorAll('input[data-name]');ins[ins.length-1].focus()}},
  del(v){setup.names.splice(+v,1);render()},
  rounds(v){setup.rounds=+v;render()},
  tog(v){setup[v]=!setup[v];render()},
  start(){const c=setup.names.filter(n=>n.trim()).length;
    if(c<3){const e=document.getElementById('serr');if(e)e.textContent='Enter at least 3 player names.';return}
    startGame();app.scrollTop=0},
  resume(){S=loadSave();if(S){if(S.phase==='fill')S.phase='fillGate';if(S.phase==='guess')S.phase='guessGate';render()}},
  discard(){S=null;save();render()},
  toFill(){S.turn=0;go('fillGate')},
  openFill(){go('fill')},
  lockFill(){
    const ins=[...app.querySelectorAll('input[data-blank]')];let bad=false;
    ins.forEach(inp=>{const msg=checkAns(inp.value);app.querySelector(`[data-err="${inp.dataset.blank}"]`).textContent=msg;if(msg&&!bad){bad=true;inp.focus()}});
    if(bad)return;
    ins.forEach(inp=>{S.blanks[+inp.dataset.blank].answer=inp.value.replace(/\s+/g,' ').trim()});
    S.turn++;
    if(S.turn>=N()){S.revealN=0;go('reveal')}else go('fillGate');
  },
  revealNext(){S.revealN=Math.min(S.blanks.length,S.revealN+1);go('reveal',true);
    const nx=app.querySelector('.bl.next');if(nx)nx.scrollIntoView({block:'nearest'})},
  revealAll(){S.revealN=S.blanks.length;go('reveal',true)},
  speak(){speak()},
  toGuess(){stopSpeak();S.turn=0;go('guessGate')},
  openGuess(){go('guess')},
  pick(v){const [bi,a]=v.split(':').map(Number);(S.guesses[S.turn]=S.guesses[S.turn]||{})[bi]=a;go('guess',true)},
  gold(v){const bi=+v;S.golden[S.turn]=S.golden[S.turn]===bi?null:bi;go('guess',true)},
  lockGuess(){S.turn++;if(S.turn>=N()){finishRound();app.scrollTop=0}else go('guessGate')},
  next(){newRound();app.scrollTop=0},
  toFinal(){go('final')},
  showStory(){modal='story';render()},
  again(){const names=S.players.map(p=>p.name);setup.names=names;setup.rounds=S.rounds;setup.persona=S.persona;setup.rules=S.rules;setup.narrator=S.narrator;startGame();app.scrollTop=0},
  newPlayers(){setup.names=S.players.map(p=>p.name);S=null;save();render()}
};
app.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t||t.disabled)return;
  if(t.classList.contains('modal')&&e.target.closest('[data-stop]'))return;
  A[t.dataset.act](t.dataset.v,t);
});
app.addEventListener('input',e=>{
  const i=e.target.dataset&&e.target.dataset.name;
  if(i!=null)setup.names[+i]=e.target.value;
  if(e.target.dataset&&e.target.dataset.blank!=null){const er=app.querySelector(`[data-err="${e.target.dataset.blank}"]`);if(er)er.textContent=''}
});
app.addEventListener('keydown',e=>{
  // the setup switches are divs: Space or Enter flips them, as on a real switch (26 Oct 2026)
  if((e.key===' '||e.key==='Enter')&&e.target.matches('[role=switch]')){e.preventDefault();e.target.click();return}
  if(e.key!=='Enter'||!e.target.matches('input'))return;
  e.preventDefault();
  const ins=[...app.querySelectorAll('input[type=text]')],k=ins.indexOf(e.target);
  if(e.target.dataset.blank!=null){if(k<ins.length-1)ins[k+1].focus();else A.lockFill()}
  else if(e.target.dataset.name!=null){if(k<ins.length-1)ins[k+1].focus();else e.target.blur()}
});
render();
</script>
</body>
</html>
