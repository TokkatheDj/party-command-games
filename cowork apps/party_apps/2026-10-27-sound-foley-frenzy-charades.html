<!-- CONCEPT: Sound/Charades - Foley Frenzy: one player acts out a secret scene using ONLY mouth sound effects while their team guesses; rival teams get a steal chance. -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Foley Frenzy</title>
<style>
:root{--bg:#14102b;--panel:#231c4d;--ink:#fff;--mute:#b9b1e6;--gold:#ffd23f;--green:#3ddc84;--red:#ff4d6d;--blue:#4cc9f0;--pink:#ff6bd6;--orange:#ff9f1c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:radial-gradient(circle at 20% 0%,#2b2170,#14102b 60%);color:var(--ink);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif}
body{display:flex;flex-direction:column;min-height:100vh;overflow-x:hidden}
h1,h2,h3{margin:0}
#score{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;padding:10px;background:#0c0820;border-bottom:4px solid var(--gold);min-height:70px}
#score.hidden{display:none}
.chip{display:flex;align-items:center;gap:10px;padding:6px 16px;border-radius:40px;background:var(--panel);border:4px solid transparent;font-weight:900;font-size:clamp(16px,2.4vw,26px)}
.chip.active{border-color:var(--gold);box-shadow:0 0 18px var(--gold)}
.chip b{font-size:clamp(24px,3.6vw,42px);color:var(--gold)}
.dot{width:18px;height:18px;border-radius:50%}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;text-align:center;gap:18px}
.title{font-size:clamp(44px,9vw,110px);font-weight:900;letter-spacing:2px;line-height:1;background:linear-gradient(90deg,var(--gold),var(--pink),var(--blue));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{font-size:clamp(18px,2.6vw,30px);color:var(--mute);max-width:900px}
.card{background:var(--panel);border-radius:26px;padding:22px 28px;max-width:960px;width:100%;border:3px solid #3a2f80}
.rules{font-size:clamp(17px,2.2vw,26px);line-height:1.5;text-align:left}
.rules li{margin:6px 0}
.btn{font:inherit;font-weight:900;font-size:clamp(22px,3.2vw,38px);padding:16px 34px;border:0;border-radius:22px;color:#14102b;background:var(--gold);cursor:pointer;box-shadow:0 8px 0 #b08a00;transition:transform .08s}
.btn:active{transform:translateY(6px);box-shadow:0 2px 0 #b08a00}
.btn.green{background:var(--green);box-shadow:0 8px 0 #1c8a50}
.btn.red{background:var(--red);box-shadow:0 8px 0 #a32040;color:#fff}
.btn.blue{background:var(--blue);box-shadow:0 8px 0 #1c7a9a}
.btn.ghost{background:#3a2f80;color:#fff;box-shadow:0 8px 0 #1d1747}
.btn.small{font-size:clamp(16px,2vw,22px);padding:10px 20px;border-radius:16px;box-shadow:0 5px 0 #b08a00}
.btn.big{font-size:clamp(34px,6vw,72px);padding:26px 50px}
.row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;align-items:center}
input[type=text]{font:inherit;font-weight:800;font-size:clamp(18px,2.4vw,28px);padding:10px 16px;border-radius:14px;border:3px solid var(--blue);background:#0c0820;color:#fff;width:min(300px,80vw);text-align:center}
.teamrow{display:flex;align-items:center;gap:10px;justify-content:center;margin:8px 0}
.seg button{font:inherit;font-weight:900;font-size:clamp(18px,2.4vw,28px);padding:8px 20px;margin:4px;border-radius:14px;border:3px solid #5b4fb0;background:transparent;color:#fff;cursor:pointer}
.seg button.on{background:var(--gold);color:#14102b;border-color:var(--gold)}
.secret{font-size:clamp(40px,9vw,120px);font-weight:900;line-height:1.05;color:var(--gold);padding:10px}
.cat{display:inline-block;padding:6px 18px;border-radius:30px;background:var(--pink);color:#14102b;font-weight:900;font-size:clamp(16px,2.2vw,26px);letter-spacing:1px}
.twist{display:inline-block;padding:8px 20px;border-radius:14px;background:var(--orange);color:#14102b;font-weight:900;font-size:clamp(18px,2.6vw,30px)}
.timer{font-size:clamp(90px,22vw,260px);font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
.timer.low{color:var(--red);animation:pulse .5s infinite alternate}
@keyframes pulse{from{transform:scale(1)}to{transform:scale(1.08)}}
.bar{height:22px;width:min(900px,92vw);background:#0c0820;border-radius:20px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--gold),var(--red));transition:width .1s linear}
.wave{display:flex;gap:6px;align-items:flex-end;height:60px}
.wave i{width:10px;background:var(--blue);border-radius:6px;animation:w .6s infinite alternate}
@keyframes w{from{height:8px}to{height:58px}}
.pts{font-size:clamp(60px,12vw,150px);font-weight:900;color:var(--green)}
.hint{color:var(--mute);font-size:clamp(14px,1.8vw,20px)}
.podium{font-size:clamp(28px,4.6vw,56px);font-weight:900;margin:6px 0}
canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:50}
@media (max-width:600px){main{padding:10px}.btn{padding:14px 22px}}
</style>
</head>
<body>
<div id="score" class="hidden"></div>
<main id="main"></main>
<canvas id="fx"></canvas>

<script>
/* ---------- CONTENT: 96 scenes, 8 categories ---------- */
const DECK_DATA = {
 "ANIMALS":["A rooster waking up the farm","A mosquito in your bedroom","A cat coughing up a hairball","A dolphin show","A frog pond at night","A cow getting stuck in mud","A lion roaring then yawning","A woodpecker on a tree"],
 "KITCHEN":["Popcorn popping in the microwave","Bacon sizzling in a pan","A blender with no lid","Opening a fizzy soda and chugging it","A kettle about to whistle","Chopping a huge pile of onions","A toaster popping up","Spaghetti being slurped"],
 "SPOOKY":["A haunted house door creaking open","A ghost stuck in a vacuum cleaner","A werewolf howling then sneezing","A cauldron bubbling over","Zombies shuffling to the snack table","A bat colony taking off","A creaky staircase at midnight","A vampire tasting garlic bread"],
 "SPORTS":["A baseball crowd going wild at a home run","A bowling ball strike","Tennis rally at a loud match","A skateboard trick gone wrong","A swimmer cannonballing into a pool","Ping pong with a very fast player","A basketball buzzer-beater","A runner crossing a muddy finish line"],
 "MACHINES":["A garbage truck on trash day","A dial-up internet connection","An old car refusing to start","A helicopter landing","A printer jamming","A washing machine with one squeaky shoe","A train pulling into the station","A robot running out of battery"],
 "NATURE":["A thunderstorm rolling in","Waves crashing on a beach","A campfire crackling with marshmallows","A volcano waking up","Wind through tall grass then a tree falling","A babbling brook","Rain on a tin roof turning into hail","An avalanche"],
 "EVERYDAY":["Brushing your teeth too aggressively","A baby learning to laugh","A zipper stuck on a coat","Cracking every knuckle","Stepping on a squeaky toy","A phone buzzing across a table","Someone tiptoeing then sneezing","A door slamming in a windy house"],
 "FUN & SILLY":["A superhero landing, badly","A pirate ship in a storm","A game show contestant winning big","A spaceship launch with a hiccup","A cartoon character slipping on a banana peel","A dinosaur discovering a trampoline","A wizard casting a spell that backfires","A school bell and a stampede of kids"]
};
// extra scenes to reach variety
Object.assign(DECK_DATA,{
 "ANIMALS":DECK_DATA["ANIMALS"].concat(["A sleepy owl and a loud hyena","A bee buzzing around a picnic","A herd of elephants splashing in a river","A puppy chasing a squeaky ball"]),
 "KITCHEN":DECK_DATA["KITCHEN"].concat(["Ice cubes dropping into a glass","A pressure cooker letting off steam","Someone dropping every pot in the cupboard","Cereal being poured and crunched loudly"]),
 "SPOOKY":DECK_DATA["SPOOKY"].concat(["A witch's broom running out of fuel","A skeleton falling apart down the stairs","Wind howling around a graveyard","A mummy unwrapping a birthday present"]),
 "SPORTS":DECK_DATA["SPORTS"].concat(["A golfer's club hitting a tree","A hockey slapshot and the crowd's groan","A gymnast sticking a landing","Cheerleaders at a pep rally"]),
 "MACHINES":DECK_DATA["MACHINES"].concat(["A drill, a hammer, and a saw at a worksite","An elevator going up with an annoying jingle","A lawn mower hitting a rock","A vending machine eating a dollar"]),
 "NATURE":DECK_DATA["NATURE"].concat(["Leaves crunching on an autumn walk","A geyser erupting","Crickets and an owl at dusk","Ice cracking on a frozen lake"]),
 "EVERYDAY":DECK_DATA["EVERYDAY"].concat(["A shopping cart with a bad wheel","A vacuum cleaner eating a sock","An alarm clock being smacked, over and over","A bouncing ball rolling downstairs"]),
 "FUN & SILLY":DECK_DATA["FUN & SILLY"].concat(["A race car pit stop","A magician's trick going very wrong","A circus elephant on a tiny stool","A rubber duck army marching"])
});
const TWISTS=[
 {id:"dbl",label:"DOUBLE POINTS",mult:2,desc:"Points count twice this round!"},
 {id:"whisper",label:"WHISPER MODE",mult:1,desc:"Quiet sounds only. Whisper-level!"},
 {id:"eyes",label:"EYES CLOSED",mult:1,desc:"Keep your eyes shut the whole time."},
 {id:"opera",label:"OPERA STYLE",mult:1,desc:"Make every sound in a singing voice."},
 {id:"slow",label:"SLOW MOTION",mult:1,desc:"Everything in super slow motion."},
 {id:"hands",label:"HANDS BEHIND BACK",mult:1,desc:"Hands clasped. Sound and face only."}
];
const COLORS=["#ff4d6d","#4cc9f0","#3ddc84","#ffd23f"];
const DEFAULT_NAMES=["Red Rockets","Blue Jays","Green Machines","Gold Rush"];
const TURN_SECS=45;

/* ---------- AUDIO ---------- */
let AC=null;
function ac(){ if(!AC){ try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){} } if(AC&&AC.state==="suspended")AC.resume(); return AC; }
function tone(freq,dur,type="sine",vol=.2,when=0,slideTo){
  const a=ac(); if(!a)return;
  const o=a.createOscillator(),g=a.createGain(),t=a.currentTime+when;
  o.type=type;o.frequency.setValueAtTime(freq,t);
  if(slideTo)o.frequency.exponentialRampToValueAtTime(slideTo,t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+.02);
}
const SND={
 tick:()=>tone(900,.06,"square",.08),
 tock:()=>tone(1400,.08,"square",.14),
 start:()=>{tone(523,.12,"triangle",.25);tone(784,.2,"triangle",.25,.12)},
 win:()=>{[523,659,784,1047].forEach((f,i)=>tone(f,.25,"triangle",.28,i*.09))},
 buzz:()=>{tone(150,.7,"sawtooth",.3);tone(110,.7,"square",.2)},
 steal:()=>{tone(400,.3,"sawtooth",.18,0,900);tone(900,.2,"triangle",.2,.3)},
 skip:()=>tone(500,.2,"triangle",.2,0,250),
 fan:()=>{[392,523,659,784,1047,1319].forEach((f,i)=>tone(f,.4,"triangle",.28,i*.12))},
 click:()=>tone(700,.05,"square",.1)
};

/* ---------- STATE ---------- */
const S={phase:"setup",teams:[],rounds:3,turn:0,total:0,card:null,twist:null,left:TURN_SECS,skips:0,timer:null,pointsAward:0,
         setup:{n:2,names:DEFAULT_NAMES.slice(),rounds:3,twistOn:true},usedDeck:[],deck:[],gotBy:null};
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function buildDeck(){
  const all=[];
  for(const c in DECK_DATA)DECK_DATA[c].forEach(t=>all.push({cat:c,text:t}));
  // prefer cards not yet seen across games in this session
  const fresh=all.filter(x=>!S.usedDeck.includes(x.text));
  S.deck=shuffle(fresh.length>=20?fresh:(S.usedDeck=[],all.slice()));
}
function drawCard(){
  if(!S.deck.length)buildDeck();
  const c=S.deck.pop(); S.usedDeck.push(c.text); return c;
}

/* ---------- RENDER ---------- */
function renderScore(){
  const el=$("score");
  if(S.phase==="setup"||S.phase==="end"&&false){el.className="hidden";return}
  el.className="";
  const cur=S.turn%S.teams.length;
  el.innerHTML=S.teams.map((t,i)=>`<div class="chip ${i===cur&&S.phase!=="end"?"active":""}"><span class="dot" style="background:${t.color}"></span>${esc(t.name)} <b>${t.score}</b></div>`).join("")
    +(S.phase!=="end"?`<div class="chip">Round ${Math.min(Math.floor(S.turn/S.teams.length)+1,S.rounds)}/${S.rounds}</div>`:"");
}
function setView(html){$("main").innerHTML=html;renderScore()}

function viewSetup(){
  S.phase="setup";
  const st=S.setup;
  let teams="";
  for(let i=0;i<st.n;i++)teams+=`<div class="teamrow"><span class="dot" style="background:${COLORS[i]};width:30px;height:30px"></span><input type="text" maxlength="18" value="${esc(st.names[i])}" data-i="${i}" class="tn" aria-label="Team ${i+1} name"></div>`;
  setView(`
   <div class="title">FOLEY FRENZY</div>
   <div class="sub">Act out a scene using <b>only sound effects</b> &mdash; your team guesses before the clock runs out!<br>2&ndash;4 teams &bull; 3&ndash;10 players &bull; about 15&ndash;25 minutes</div>
   <div class="card rules"><b>HOW TO PLAY</b>
    <ol><li>One player per turn is the <b>Sound Maker</b>. Pass the screen to them and secretly peek at the scene.</li>
    <li>Hit START. Make sounds only &mdash; <b>no words, no pointing, no spelling</b> &mdash; for 45 seconds.</li>
    <li>When your team guesses it, the host taps <b>GOT IT!</b> Faster = more points (3/2/1). If time runs out, rival teams can <b>steal</b> for 1 point.</li></ol></div>
   <div class="card"><div class="hint">How many teams?</div>
    <div class="seg" id="segN">${[2,3,4].map(n=>`<button data-n="${n}" class="${st.n===n?"on":""}">${n}</button>`).join("")}</div>
    ${teams}
    <div class="hint" style="margin-top:10px">Rounds (each team goes once per round)</div>
    <div class="seg" id="segR">${[2,3,4,5].map(n=>`<button data-r="${n}" class="${st.rounds===n?"on":""}">${n}</button>`).join("")}</div>
    <div class="hint" style="margin-top:10px">Wild twists (random challenge modifiers)</div>
    <div class="seg" id="segT"><button data-t="1" class="${st.twistOn?"on":""}">ON</button><button data-t="0" class="${!st.twistOn?"on":""}">OFF</button></div>
   </div>
   <button class="btn big green" id="go">START GAME</button>
   <div class="hint">Host: one person holds the device and taps the buttons. Space = Got it, S = Skip.</div>`);
  $("segN").onclick=e=>{const n=e.target.dataset.n;if(n){saveNames();st.n=+n;SND.click();viewSetup()}};
  $("segR").onclick=e=>{const r=e.target.dataset.r;if(r){saveNames();st.rounds=+r;SND.click();viewSetup()}};
  $("segT").onclick=e=>{const t=e.target.dataset.t;if(t!==undefined){saveNames();st.twistOn=t==="1";SND.click();viewSetup()}};
  $("go").onclick=()=>{saveNames();ac();startGame()};
}
function saveNames(){document.querySelectorAll(".tn").forEach(inp=>{S.setup.names[+inp.dataset.i]=inp.value.trim()||DEFAULT_NAMES[+inp.dataset.i]})}

function startGame(){
  const st=S.setup;
  S.teams=[];for(let i=0;i<st.n;i++)S.teams.push({name:st.names[i],score:0,color:COLORS[i]});
  S.rounds=st.rounds;S.turn=0;S.total=st.n*st.rounds;
  if(S.deck.length<S.total+4)buildDeck();
  viewHandoff();
}

function viewHandoff(){
  S.phase="handoff";clearInterval(S.timer);
  const t=S.teams[S.turn%S.teams.length];
  S.card=drawCard();S.skips=0;S.left=TURN_SECS;
  S.twist=S.setup.twistOn&&Math.random()<.4?TWISTS[Math.floor(Math.random()*TWISTS.length)]:null;
  setView(`
   <div class="sub">Turn ${S.turn+1} of ${S.total}</div>
   <div class="title" style="font-size:clamp(40px,8vw,90px);background:none;color:${t.color};-webkit-text-fill-color:${t.color}">${esc(t.name)}</div>
   <div class="sub">Pick your <b>Sound Maker</b> (someone who hasn't gone yet this round if you can).<br>Hand them the screen &mdash; <b>everyone else look away!</b></div>
   <button class="btn big blue" id="peek">I'M THE SOUND MAKER</button>`);
  $("peek").onclick=()=>{SND.click();viewReveal()};
}

function viewReveal(){
  S.phase="reveal";
  setView(`
   <span class="cat">${esc(S.card.cat)}</span>
   <div class="secret">${esc(S.card.text)}</div>
   ${S.twist?`<div class="twist">TWIST: ${S.twist.label} &mdash; ${esc(S.twist.desc)}</div>`:""}
   <div class="hint">Memorize it. Sounds only &mdash; no words, no pointing, no spelling. You may skip once during the round for a new scene.</div>
   <div class="row"><button class="btn ghost" id="swap">DRAW A DIFFERENT SCENE</button><button class="btn big green" id="start">START 45s!</button></div>`);
  $("swap").onclick=()=>{SND.skip();S.card=drawCard();viewReveal()};
  $("start").onclick=startPlay;
}

function startPlay(){
  S.phase="play";SND.start();S.left=TURN_SECS;S.startedAt=performance.now();S.lastWhole=TURN_SECS;
  drawPlay();
  clearInterval(S.timer);
  S.timer=setInterval(()=>{
    const el=(performance.now()-S.startedAt)/1000;
    S.left=Math.max(0,TURN_SECS-el);
    const whole=Math.ceil(S.left);
    $("tm")&&($("tm").textContent=whole,$("tm").className="timer"+(whole<=10?" low":""));
    $("bar")&&($("bar").style.width=(S.left/TURN_SECS*100)+"%");
    $("pv")&&($("pv").textContent=curPoints());
    if(whole!==S.lastWhole){S.lastWhole=whole;if(whole<=10&&whole>0)SND.tock();else if(whole>0&&whole%5===0)SND.tick()}
    if(S.left<=0){clearInterval(S.timer);timeUp()}
  },100);
}
function curPoints(){const base=S.left>=30?3:S.left>=15?2:1;return base*(S.twist?S.twist.mult:1)}
function drawPlay(){
  const t=S.teams[S.turn%S.teams.length];
  setView(`
   <div class="sub" style="color:${t.color}"><b>${esc(t.name)}</b> &mdash; guess the scene!</div>
   <div class="wave">${Array.from({length:14},(_,i)=>`<i style="animation-delay:${(i*.07).toFixed(2)}s"></i>`).join("")}</div>
   <div id="tm" class="timer">${TURN_SECS}</div>
   <div class="bar"><i id="bar" style="width:100%"></i></div>
   ${S.twist?`<div class="twist">${S.twist.label}</div>`:""}
   <div class="sub">Worth <b id="pv" style="color:var(--green)">${curPoints()}</b> pts right now</div>
   <div class="row"><button class="btn big green" id="got">GOT IT!</button><button class="btn ghost" id="skip" ${S.skips>=1?"disabled style='opacity:.4'":""}>SKIP (new scene)</button></div>
   <div class="hint">Host taps GOT IT when the team says it. Sound Maker: keep it wordless!</div>`);
  $("got").onclick=gotIt;
  $("skip").onclick=doSkip;
}
function doSkip(){
  if(S.skips>=1)return;S.skips++;SND.skip();S.card=drawCard();
  // show new card privately in a quick overlay for sound maker
  clearInterval(S.timer);const pausedLeft=S.left;
  S.phase="skipcard";
  setView(`<span class="cat">${esc(S.card.cat)}</span><div class="secret">${esc(S.card.text)}</div><div class="hint">New scene! Timer is paused. Sound Maker only &mdash; tap resume when ready.</div><button class="btn big green" id="res">RESUME</button>`);
  $("res").onclick=()=>{S.phase="play";S.left=pausedLeft;S.startedAt=performance.now()-(TURN_SECS-pausedLeft)*1000;drawPlay();SND.start();
    S.timer=setInterval(tickBack,100)};
}
function tickBack(){
  const el=(performance.now()-S.startedAt)/1000;S.left=Math.max(0,TURN_SECS-el);const whole=Math.ceil(S.left);
  $("tm")&&($("tm").textContent=whole,$("tm").className="timer"+(whole<=10?" low":""));
  $("bar")&&($("bar").style.width=(S.left/TURN_SECS*100)+"%");
  $("pv")&&($("pv").textContent=curPoints());
  if(whole!==S.lastWhole){S.lastWhole=whole;if(whole<=10&&whole>0)SND.tock()}
  if(S.left<=0){clearInterval(S.timer);timeUp()}
}
function gotIt(){
  if(S.phase!=="play")return;
  clearInterval(S.timer);
  const pts=curPoints();S.teams[S.turn%S.teams.length].score+=pts;
  SND.win();burst();
  S.phase="result";
  viewResult(`NAILED IT!`,`+${pts}`,`<b>${esc(S.card.text)}</b>`,S.teams[S.turn%S.teams.length].name);
}
function timeUp(){
  if(S.phase!=="play")return;
  S.phase="steal";SND.buzz();
  const cur=S.turn%S.teams.length;
  setView(`
   <div class="title" style="font-size:clamp(50px,10vw,120px);color:var(--red);-webkit-text-fill-color:var(--red);background:none">TIME'S UP!</div>
   <div class="sub">Rival teams: huddle quietly and make <b>one</b> guess. Did anyone get it?</div>
   <div class="card"><div class="hint">Answer was:</div><div class="secret" style="font-size:clamp(30px,6vw,70px)">${esc(S.card.text)}</div></div>
   <div class="sub">Who stole it? (+1 point)</div>
   <div class="row">${S.teams.map((t,i)=>i===cur?"":`<button class="btn" style="background:${t.color};box-shadow:0 8px 0 rgba(0,0,0,.4);color:#14102b" data-s="${i}">${esc(t.name)}</button>`).join("")}<button class="btn ghost" data-s="-1">NO ONE</button></div>`);
  document.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{
    const i=+b.dataset.s;
    if(i>=0){S.teams[i].score+=1;SND.steal();burst();viewResult("STOLEN!","+1",`<b>${esc(S.card.text)}</b>`,S.teams[i].name)}
    else{SND.skip();viewResult("NOBODY GOT IT","+0",`<b>${esc(S.card.text)}</b>`,null)}
  });
}
function viewResult(head,pts,detail,who){
  S.phase="result";
  setView(`
   <div class="title" style="font-size:clamp(44px,8vw,100px)">${head}</div>
   ${who?`<div class="sub"><b>${esc(who)}</b> scores</div>`:""}
   <div class="pts">${pts}</div>
   <div class="sub">${detail}</div>
   <button class="btn big" id="nx">${S.turn+1>=S.total?"FINAL RESULTS":"NEXT TURN"}</button>`);
  $("nx").onclick=()=>{SND.click();S.turn++;S.turn>=S.total?viewEnd():viewHandoff()};
}

function viewEnd(){
  S.phase="end";clearInterval(S.timer);
  const sorted=S.teams.map(t=>t).sort((a,b)=>b.score-a.score);
  const top=sorted[0].score;const winners=sorted.filter(t=>t.score===top);
  SND.fan();burst();setTimeout(burst,700);setTimeout(burst,1400);
  setView(`
   <div class="title">${winners.length>1?"IT'S A TIE!":"WE HAVE A WINNER!"}</div>
   <div class="sub" style="font-size:clamp(30px,6vw,70px);font-weight:900;color:var(--gold)">${winners.map(w=>esc(w.name)).join(" &amp; ")}</div>
   <div class="card">${sorted.map((t,i)=>`<div class="podium" style="color:${t.color}">${["1st","2nd","3rd","4th"][i]} &mdash; ${esc(t.name)}: ${t.score}</div>`).join("")}</div>
   <div class="row"><button class="btn big green" id="again">PLAY AGAIN</button><button class="btn big ghost" id="newg">NEW GAME (SETUP)</button></div>
   <div class="hint">Play Again keeps the same teams and gives you all-new scenes.</div>`);
  $("again").onclick=()=>{ac();startGame()};
  $("newg").onclick=()=>viewSetup();
}

/* ---------- CONFETTI ---------- */
const cv=$("fx"),cx=cv.getContext("2d");let parts=[],raf=null;
function size(){cv.width=innerWidth;cv.height=innerHeight}size();addEventListener("resize",size);
function burst(){
  for(let i=0;i<110;i++)parts.push({x:innerWidth/2,y:innerHeight/2.2,vx:(Math.random()-.5)*18,vy:-Math.random()*16-4,r:Math.random()*8+4,c:["#ffd23f","#ff6bd6","#4cc9f0","#3ddc84","#ff4d6d"][i%5],l:90+Math.random()*40});
  if(!raf)loop();
}
function loop(){
  cx.clearRect(0,0,cv.width,cv.height);
  parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.45;p.l--;cx.fillStyle=p.c;cx.fillRect(p.x,p.y,p.r,p.r*1.6)});
  parts=parts.filter(p=>p.l>0&&p.y<cv.height+30);
  raf=parts.length?requestAnimationFrame(loop):null;
  if(!raf)cx.clearRect(0,0,cv.width,cv.height);
}

/* ---------- KEYS ---------- */
addEventListener("keydown",e=>{
  if(e.target.tagName==="INPUT")return;
  if(S.phase==="play"){if(e.code==="Space"){e.preventDefault();gotIt()}else if(e.key==="s"||e.key==="S")doSkip()}
});

viewSetup();
</script>
