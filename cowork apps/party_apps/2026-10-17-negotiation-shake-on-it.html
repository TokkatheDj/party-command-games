<!-- CONCEPT: NEGOTIATION/TRUST - "Shake On It": a split-or-steal party game where two Dealmakers talk out loud over a growing pot of coins under a ticking clock, then secretly lock SPLIT or STEAL on a passed phone. Both split and they share it, one steals and takes it all, both steal and it rolls over into a bigger pot. The rest of the room predicts the outcome for coins. Everyone's public split/steal record follows them round to round, side deals are settled (or welshed on) at the Settle-Up desk, and Deal Cards bend each round (Hostage stakes, Lone Wolf bonus, Safety Net, Silent Deal, Crowd Wager, Whisper Only), with a double-points Grand Pot to finish | Players: 3-10 | ~15-30 min -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Shake On It</title>
<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

.pred-opts button {
  min-height: 52px; border-radius: 12px; background: var(--bg); border: 1px solid var(--line);
  font-size: 12px; font-weight: 700; color: var(--muted); line-height: 1.15; padding: 4px 2px;

.reveal-row { display: flex; gap: 10px; perspective: 800px; }
.flip { flex: 1; height: clamp(150px, 42vw, 200px); position: relative; transform-style: preserve-3d; transition: transform .7s cubic-bezier(.3,1.4,.5,1); }

  position: absolute; inset: 0; border-radius: 16px; backface-visibility: hidden; -webkit-backface-visibility: hidden;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 6px;
  font-weight: 900; text-align: center;
}

.flip .front .nm, .flip .back .nm { font-size: clamp(15px, 4.4vw, 19px); word-break: break-word; }

.ledger .l:last-child { border-bottom: none; }

.board { display: flex; flex-direction: column; gap: 6px; }
.brow {
  display: grid; grid-template-columns: 28px 1fr auto; gap: 8px; align-items: center;
  background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px;
}

.settle select {
  width: 100%; min-width: 0; min-height: 48px; border-radius: 12px; background: var(--bg); color: var(--text);
  border: 1px solid var(--line); padding: 0 8px; font-size: 15px;
}

.stepper button { width: 52px; height: 52px; border-radius: 12px; background: var(--panel2); font-size: 24px; font-weight: 900; }
.stepper .v { min-width: 70px; text-align: center; font-size: 28px; font-weight: 900; color: var(--gold); }
.chip-tag { display: inline-block; padding: 2px 10px; border-radius: 99px; background: var(--panel2); border: 1px solid var(--line); font-size: 12px; font-weight: 700; color: var(--muted); }
.awards { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.award { background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 10px; text-align: center; }
.award .em { font-size: 30px; }
.award .at { font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); font-weight: 700; margin-top: 2px; }
.award .an { font-weight: 800; margin-top: 2px; word-break: break-word; }
.toast {
  position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%);
  background: var(--panel2); border: 1px solid var(--gold); color: var(--text);
  padding: 10px 16px; border-radius: 12px; font-weight: 700; font-size: 14px;
  opacity: 0; pointer-events: none; transition: opacity .25s; max-width: 90vw; text-align: center; z-index: 5;
}
.toast.on { opacity: 1; }
.rules p { margin: 6px 0; }
.rules b { color: var(--gold); }

.tbl td { padding: 6px 4px; border-bottom: 1px dashed var(--line); }

.hold-btn .fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: rgba(255,255,255,.28); }

[hidden] { display: none !important; }
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<script>
(() => {
'use strict';
const KEY = 'cowork-shakeonit-state';
const NKEY = 'cowork-shakeonit-setup';
const SKEY = 'cowork-shakeonit-sound';
const $app = document.getElementById('app');
const $toast = document.getElementById('toast');
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const rnd = n => Math.floor(Math.random() * n);
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };

const CARDS = {
  plain:    { t: '🤝 Plain Handshake', d: 'No tricks. Talk it out, then choose.' },
  hostage:  { t: '⛓️ Hostage', d: 'Both Dealmakers throw 3 of their own coins into the pot before the clock starts. Walk away empty and those coins are gone.' },
  lonewolf: { t: '🐺 Lone Wolf', d: 'A lone stealer takes 1.5× the pot. The bank pays the bonus.' },
  safety:   { t: '🪂 Safety Net', d: 'If you BOTH steal, each of you still gets a quarter of the pot, and nothing rolls over.' },
  sweet:    { t: '🍯 Sweetener', d: 'If you BOTH split, the bank adds +2 coins each on top.' },
  silent:   { t: '🤐 Silent Deal', d: 'No words at all: faces, nods, gestures and pleading eyes only. 40 seconds.', time: 40 },
  whisper:  { t: '🤫 Whisper Only', d: 'Lean in and whisper. The room must not hear a word, so spectators predict blind.' },
  crowd:    { t: '📣 Crowd Wager', d: 'Spectator predictions pay +4 instead of +2, but a wrong call costs 1 coin.' },
  mystery:  { t: '❓ Mystery Pot', d: 'Nobody knows how big the pot is until the reveal.' },
  rush:     { t: '⚡ Rush Job', d: 'Only 20 seconds to make a deal. Talk fast.', time: 20 },
  grand:    { t: '👑 Grand Pot', d: 'The final deal, and the pot is doubled. Nothing rolls over after this: if you both steal, the house keeps it.' }
};
const DECK = ['hostage', 'lonewolf', 'safety', 'sweet', 'silent', 'whisper', 'crowd', 'mystery', 'rush'];

// ---------- persistence ----------
let S = null;          // live game state
let draft = { names: ['', '', ''], laps: 2, talk: 60, cards: true, start: 5 };
try { const d = JSON.parse(localStorage.getItem(NKEY) || 'null'); if (d && Array.isArray(d.names)) draft = Object.assign(draft, d); } catch (e) {}
try { const g = JSON.parse(localStorage.getItem(KEY) || 'null'); if (g && g.v === 1 && g.phase && g.phase !== 'final') S = g; } catch (e) {}
let resumeOffer = !!S;
const save = () => {
  try {
    if (S) localStorage.setItem(KEY, JSON.stringify(S)); else localStorage.removeItem(KEY);
    localStorage.setItem(NKEY, JSON.stringify(draft));
  } catch (e) {}
};
addEventListener('pagehide', save);

// ---------- runtime-only UI state ----------
let showRules = false;
let tmpPick = null;
let revealShown = -1;      // round whose reveal animation already played
let timerId = null, paused = false, endAt = 0, lastTickSec = -1;
let settle = { from: 0, to: 1, amt: 1 };
let soundOn = localStorage.getItem(SKEY) !== '0';

// ---------- audio ----------
let AC = null;
function tone(f, d = 0.12, type = 'sine', vol = 0.14, when = 0) {
  if (!soundOn) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
    const t = AC.currentTime + when;
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + d);
    o.connect(g); g.connect(AC.destination);
    o.start(t); o.stop(t + d + 0.03);
  } catch (e) {}
}
const sfx = {
  tap: () => tone(660, 0.06, 'triangle', 0.08),
  tick: () => tone(1200, 0.05, 'square', 0.06),
  buzz: () => { tone(180, 0.5, 'sawtooth', 0.12); tone(120, 0.5, 'sawtooth', 0.1, 0.05); },
  lock: () => { tone(440, 0.08, 'triangle', 0.1); tone(880, 0.12, 'triangle', 0.1, 0.07); },
  flip: () => tone(320, 0.09, 'triangle', 0.1),
  split: () => [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.25, 'sine', 0.12, i * 0.09)),
  steal: () => { tone(220, 0.35, 'sawtooth', 0.12); tone(165, 0.5, 'sawtooth', 0.12, 0.18); },
  coin: () => { tone(1320, 0.08, 'square', 0.05); tone(1760, 0.12, 'square', 0.05, 0.06); }
};

function toast(msg) {
  $toast.textContent = msg; $toast.classList.add('on');
  clearTimeout(toast.t); toast.t = setTimeout(() => $toast.classList.remove('on'), 1800);
}

// ---------- game setup ----------
const pairKey = (x, y) => x < y ? x + '-' + y : y + '-' + x;

function newGame(names) {
  const n = names.length;
  S = {
    v: 1, phase: 'intro',
    players: names.map(nm => ({ name: nm, coins: draft.start, rec: [], stolen: 0, hits: 0, deals: 0, gave: 0, coinsWon: 0 })),
    opts: { laps: draft.laps, talk: draft.talk, cards: draft.cards, start: draft.start },
    round: 1, total: Math.max(3, Math.ceil(n * draft.laps / 2)),
    rollover: 0, pairs: {}, lastPair: [], deck: shuffle(DECK.slice()), cur: null, snap: null
  };
  setupRound();
}

function pickPair(avoidCurrent) {
  const P = S.players, idx = P.map((_, i) => i);
  const prev = avoidCurrent && S.cur ? [S.cur.a, S.cur.b] : S.lastPair;
  const inPrev = i => prev.includes(i) ? 1 : 0;
  const minD = Math.min(...P.map(p => p.deals));
  let pool = idx.filter(i => P[i].deals === minD && !inPrev(i));
  if (!pool.length) pool = idx.filter(i => P[i].deals === minD);
  if (avoidCurrent && pool.length < 1) pool = idx.slice();
  const a = shuffle(pool)[0];
  const score = x => P[x].deals * 10 + (S.pairs[pairKey(a, x)] || 0) * 3 + inPrev(x);
  const others = shuffle(idx.filter(i => i !== a));
  others.sort((x, y) => score(x) - score(y));
  let b = others[0];
  if (avoidCurrent && S.cur && pairKey(a, b) === pairKey(S.cur.a, S.cur.b) && others.length > 1) b = others[1];
  return rnd(2) ? [a, b] : [b, a];
}

function drawCard() {
  if (S.round === 1) return 'plain';
  if (S.round === S.total) return 'grand';
  if (!S.opts.cards) return 'plain';
  if (!S.deck.length) S.deck = shuffle(DECK.slice());
  return S.deck.pop();
}

function setupRound() {
  const [a, b] = pickPair(false);
  const card = drawCard();
  let base = 6 + 2 * (S.round - 1) + 2 * rnd(3);
  if (card === 'grand') base *= 2;
  const roll = S.rollover;
  S.rollover = 0;
  S.cur = {
    a, b, card, base, roll, pot: base + roll,
    choice: { a: null, b: null }, preds: {}, hostage: [0, 0], started: false,
    layout: [rnd(2), rnd(2)], timeLeft: CARDS[card].time || S.opts.talk,
    result: null, transfers: []
  };
  S.phase = 'intro';
  tmpPick = null;
  const copy = Object.assign({}, S); delete copy.snap;
  S.snap = JSON.stringify(copy);
  save();
}

function startTalk() {
  const c = S.cur;
  if (!c.started) {
    c.started = true;
    if (c.card === 'hostage') {
      [c.a, c.b].forEach((pi, k) => {
        const p = S.players[pi], amt = Math.min(3, p.coins);
        p.coins -= amt; c.hostage[k] = amt; c.pot += amt;
      });
    }
  }
  S.phase = 'talk';
  paused = false;
  endAt = Date.now() + c.timeLeft * 1000;
  save(); render(); runTimer();
}

function runTimer() {
  clearInterval(timerId);
  lastTickSec = -1;
  timerId = setInterval(() => {
    if (!S || S.phase !== 'talk') { clearInterval(timerId); return; }
    if (paused) return;
    const left = Math.max(0, (endAt - Date.now()) / 1000);
    S.cur.timeLeft = left;
    paintTimer();
    const sec = Math.ceil(left);
    if (sec <= 5 && sec > 0 && sec !== lastTickSec) { lastTickSec = sec; sfx.tick(); }
    if (left <= 0) { clearInterval(timerId); sfx.buzz(); endTalk(); }
  }, 200);
}

function paintTimer() {
  const el = document.getElementById('tm'), bar = document.getElementById('tbar');
  if (!el) return;
  const left = S.cur.timeLeft, full = CARDS[S.cur.card].time || S.opts.talk;
  el.textContent = Math.ceil(left);
  el.classList.toggle('low', left <= 10);
  if (bar) bar.style.width = Math.max(0, Math.min(100, left / full * 100)) + '%';
}

function endTalk() {
  clearInterval(timerId);
  S.phase = 'passA';
  save(); render();
}

function lockChoice() {
  if (!tmpPick) return;
  const who = S.phase === 'chooseA' ? 'a' : 'b';
  S.cur.choice[who] = tmpPick;
  tmpPick = null;
  sfx.lock();
  S.phase = who === 'a' ? 'passB' : 'predict';
  save(); render();
}

const OUTS = ['SS', 'AT', 'BT', 'TT'];
function outLabel(o, c) {
  const A = S.players[c.a].name, B = S.players[c.b].name;
  return { SS: 'Both split', AT: A + ' steals', BT: B + ' steals', TT: 'Both steal' }[o];
}

function resolve() {
  const c = S.cur;
  if (c.result) return;
  const P = S.players, A = P[c.a], B = P[c.b];
  const ca = c.choice.a, cb = c.choice.b;
  const out = ca === 'split' && cb === 'split' ? 'SS' : ca === 'steal' && cb === 'split' ? 'AT' : ca === 'split' && cb === 'steal' ? 'BT' : 'TT';
  const lines = [];
  const give = (pi, amt, why) => { if (!amt) return; P[pi].coins += amt; if (amt > 0) P[pi].coinsWon += amt; lines.push({ i: pi, amt, why }); };
  let potNote = '';
  let verdict = '';
  if (out === 'SS') {
    const half = Math.floor(c.pot / 2);
    give(c.a, half, 'half the pot'); give(c.b, half, 'half the pot');
    if (c.card === 'sweet') { give(c.a, 2, 'Sweetener'); give(c.b, 2, 'Sweetener'); }
    if (c.pot % 2) { S.rollover += 1; potNote = 'The odd coin rolls over.'; }
    verdict = '🤝 A deal is a deal!';
  } else if (out === 'AT' || out === 'BT') {
    const thief = out === 'AT' ? c.a : c.b, mark = out === 'AT' ? c.b : c.a;
    const take = c.card === 'lonewolf' ? Math.ceil(c.pot * 1.5) : c.pot;
    give(thief, take, c.card === 'lonewolf' ? 'the whole pot + Lone Wolf bonus' : 'the whole pot');
    P[mark].stolen += 1;
    lines.push({ i: mark, amt: 0, why: 'trusted… and got nothing' });
    verdict = '🗡️ ' + P[thief].name + ' stole it!';
  } else {
    if (c.card === 'safety') {
      const q = Math.floor(c.pot / 4);
      give(c.a, q, 'Safety Net'); give(c.b, q, 'Safety Net');
      potNote = 'The Safety Net caught you. The rest of the pot is gone.';
    } else if (S.round >= S.total) {
      potNote = 'Final deal, so the house keeps all ' + c.pot + ' coins.';
    } else {
      S.rollover += c.pot;
      potNote = 'All ' + c.pot + ' coins roll over into the next pot!';
    }
    verdict = '💥 Both stole. Nobody wins!';
  }
  // spectator predictions
  const win = c.card === 'crowd' ? 4 : 2;
  Object.keys(c.preds).forEach(k => {
    const pi = +k, guess = c.preds[k];
    if (guess === out) { give(pi, win, 'called it: ' + outLabel(out, c)); P[pi].hits += 1; }
    else if (c.card === 'crowd' && P[pi].coins > 0) { P[pi].coins -= 1; lines.push({ i: pi, amt: -1, why: 'Crowd Wager miss' }); }
  });
  A.rec.push(ca === 'split' ? 's' : 't');
  B.rec.push(cb === 'split' ? 's' : 't');
  A.deals += 1; B.deals += 1;
  S.pairs[pairKey(c.a, c.b)] = (S.pairs[pairKey(c.a, c.b)] || 0) + 1;
  S.lastPair = [c.a, c.b];
  c.result = { out, lines, potNote, verdict };
}

function doReveal() {
  resolve();
  S.phase = 'reveal';
  save(); render();
}

function undoRound() {
  if (!S.snap) return;
  if (!confirm('Replay this deal from the start? Coins and choices from this deal will be undone.')) return;
  const snap = S.snap;
  S = JSON.parse(snap);
  S.snap = snap;
  revealShown = -1; tmpPick = null;
  save(); render();
}

function nextRound() {
  if (S.round >= S.total) { S.phase = 'final'; save(); render(); localStorage.removeItem(KEY); return; }
  S.round += 1;
  setupRound();
  render();
}

}

function animateReveal() {
  const c = S.cur, r = c.result, rnum = S.round;
  revealShown = rnum;
  const fa = document.getElementById('f' + c.a), fb = document.getElementById('f' + c.b), af = document.getElementById('after');
  setTimeout(() => { if (fa && fa.isConnected) { fa.classList.add('go'); sfx.flip(); } }, 500);
  setTimeout(() => { if (fb && fb.isConnected) { fb.classList.add('go'); sfx.flip(); } }, 1400);
  setTimeout(() => {
    if (af && af.isConnected) af.hidden = false;
    if (r.out === 'SS') sfx.split(); else sfx.steal();
  }, 2300);
}

// ---------- events ----------
$app.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.name != null) { draft.names[+t.dataset.name] = t.value; save(); }
});
$app.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.field) { settle[t.dataset.field] = +t.value; settle.amt = 1; render(); }
});
$app.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b || b.disabled) return;
  const act = b.dataset.act, arg = b.dataset.arg;
  const fn = ACT[act];
  if (fn) { sfx.tap(); fn(arg); }
});

const ACT = {
  sound: () => { soundOn = !soundOn; localStorage.setItem(SKEY, soundOn ? '1' : '0'); render(); },
  rules: () => { showRules = !showRules; render(); if (showRules) scrollTo(0, 0); },
  quit: () => { if (confirm('Quit this game? Progress will be lost.')) { clearInterval(timerId); S = null; save(); render(); } },
  resume: () => {
    resumeOffer = false;
    if (S.phase === 'talk') { paused = true; endAt = Date.now() + S.cur.timeLeft * 1000; render(); runTimer(); return; }
    if (S.phase === 'chooseA' || S.phase === 'chooseB') S.phase = S.phase === 'chooseA' ? 'passA' : 'passB';
    if (S.phase === 'reveal') revealShown = S.round;
    render();
  },
  discard: () => { resumeOffer = false; S = null; save(); render(); },
  addName: () => { if (draft.names.length < 10) { draft.names.push(''); save(); render(); const ins = $app.querySelectorAll('[data-name]'); if (ins.length) ins[ins.length - 1].focus(); } },
  delName: a => { if (draft.names.length > 3) { draft.names.splice(+a, 1); save(); render(); } },
  laps: a => { draft.laps = +a; save(); render(); },
  talk: a => { draft.talk = +a; save(); render(); },
  start: a => { draft.start = +a; save(); render(); },
  cards: a => { draft.cards = a === '1'; save(); render(); },
  begin: () => {
    const names = draft.names.map((n, i) => (n || '').trim() || 'Player ' + (i + 1));
    const seen = new Set();
    for (const n of names) { const k = n.toLowerCase(); if (seen.has(k)) { toast('Two players are both called "' + n + '"'); return; } seen.add(k); }
    newGame(names);
    settle = { from: 0, to: 1, amt: 1 };
    render(); scrollTo(0, 0);
  },
  go: () => startTalk(),
  repair: () => {
    const [a, b] = pickPair(true);
    S.cur.a = a; S.cur.b = b;
    const copy = Object.assign({}, S); delete copy.snap; S.snap = JSON.stringify(copy);
    save(); render(); toast('New Dealmakers: ' + S.players[a].name + ' & ' + S.players[b].name);
  },
  pause: () => {
    if (paused) { paused = false; endAt = Date.now() + S.cur.timeLeft * 1000; }
    else { paused = true; }
    render();
  },
  plus: () => { S.cur.timeLeft += 15; endAt += 15000; paintTimer(); save(); },
  endTalk: () => endTalk(),
  open: () => { tmpPick = null; S.phase = S.phase === 'passA' ? 'chooseA' : 'chooseB'; save(); render(); },
  pick: a => { tmpPick = a; render(); },
  lock: () => lockChoice(),
  pred: a => {
    const [i, o] = a.split(':');
    const c = S.cur;
    if (c.preds[i] === o) delete c.preds[i]; else c.preds[i] = o;
    save(); render();
  },
  reveal: () => doReveal(),
  undo: () => undoRound(),
  settle: () => {
    const c = S.cur;
    // sensible default: a winner pays the other dealmaker
    if (c.result && !c.transfers.length) {
      const P = S.players;
      const from = P[c.a].coins >= P[c.b].coins ? c.a : c.b;
      settle = { from, to: from === c.a ? c.b : c.a, amt: 1 };
    }
    S.phase = 'settle'; save(); render(); scrollTo(0, 0);
  },
  amt: a => { const max = S.players[settle.from].coins; settle.amt = Math.max(1, Math.min(max, settle.amt + (+a))); render(); },
  pay: () => {
    const P = S.players, f = settle.from, t = settle.to, a = settle.amt;
    if (f === t || a < 1 || P[f].coins < a) return;
    P[f].coins -= a; P[t].coins += a; P[f].gave += a;
    S.cur.transfers.push({ f, t, a });
    sfx.coin(); toast(P[f].name + ' paid ' + P[t].name + ' 🪙 ' + a);
    settle.amt = 1;
    save(); render();
  },
  unpay: () => {
    const tr = S.cur.transfers.pop();
    if (!tr) return;
    const P = S.players;
    P[tr.f].coins += tr.a; P[tr.t].coins -= tr.a; P[tr.f].gave -= tr.a;
    save(); render();
  },
  board: () => { S.phase = 'board'; save(); render(); scrollTo(0, 0); },
  next: () => { nextRound(); scrollTo(0, 0); },
  again: () => {
    draft.names = S.players.map(p => p.name);
    newGame(draft.names.slice());
    revealShown = -1; settle = { from: 0, to: 1, amt: 1 };
    render(); scrollTo(0, 0);
  },
  toSetup: () => { draft.names = S.players.map(p => p.name); S = null; save(); render(); }
};

// Test hook for automated drives (read-only peek at state)
window.__shake = { get state() { return S; } };

render();
})();
</script>
</body>
</html>
