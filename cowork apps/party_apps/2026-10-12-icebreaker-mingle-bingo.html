<!-- CONCEPT: ICEBREAKERS - Mingle Bingo: "find someone who..." bingo cards; players race around the room collecting a DIFFERENT person's name for every square, with a host timer + scoreboard -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Mingle Bingo – Find Someone Who…</title>
<style>
:root{
  --bg:#1a0e3b; --bg2:#2b1768; --panel:#34207d; --ink:#ffffff; --muted:#c9bdf5;
  --yellow:#ffd23f; --pink:#ff4f9a; --teal:#2de2c4; --red:#ff5a5a; --dark:#140a2e;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:radial-gradient(circle at 20% 0%,var(--bg2),var(--bg) 60%) fixed;color:var(--ink);
  font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;font-weight:700}
button{font:inherit;color:inherit;cursor:pointer;border:0;touch-action:manipulation}
input{font:inherit}
#app{max-width:1200px;margin:0 auto;padding:16px 16px 60px}
h1{margin:0;font-size:clamp(2.4rem,7vw,5rem);line-height:1;letter-spacing:.02em;text-transform:uppercase;
  background:linear-gradient(90deg,var(--yellow),var(--pink),var(--teal));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{font-size:clamp(1.05rem,2.4vw,1.6rem);color:var(--muted);margin:8px 0 14px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chip{background:var(--panel);border:2px solid #5b43b8;border-radius:999px;padding:6px 14px;font-size:1.05rem}
.panel{background:var(--panel);border-radius:20px;padding:18px;margin:14px 0;border:2px solid #4b35a3}
.panel h2{margin:0 0 10px;font-size:1.35rem;color:var(--yellow);text-transform:uppercase;letter-spacing:.05em}
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.how div{background:var(--bg);border-radius:14px;padding:12px;font-size:1.1rem;font-weight:600}
.how b{color:var(--teal);font-size:1.6rem;display:block}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.nameIn{flex:1;min-width:180px;font-size:1.4rem;padding:12px 14px;border-radius:14px;border:3px solid #5b43b8;background:var(--dark);color:#fff;outline:none}
.nameIn:focus{border-color:var(--yellow)}
.btn{background:var(--yellow);color:#2a1a00;border-radius:16px;padding:14px 22px;font-size:1.25rem;font-weight:800;box-shadow:0 5px 0 #b38d00;transition:transform .05s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #b38d00}
.btn.pink{background:var(--pink);color:#fff;box-shadow:0 5px 0 #a82a64}
.btn.pink:active{box-shadow:0 1px 0 #a82a64}
.btn.teal{background:var(--teal);color:#003d33;box-shadow:0 5px 0 #14937f}
.btn.teal:active{box-shadow:0 1px 0 #14937f}
.btn.ghost{background:transparent;border:3px solid #6a50c8;color:#fff;box-shadow:none}
.btn.small{padding:8px 12px;font-size:1rem;border-radius:12px;box-shadow:0 3px 0 #b38d00}
.btn.pink.small{box-shadow:0 3px 0 #a82a64}.btn.teal.small{box-shadow:0 3px 0 #14937f}
.btn.big{font-size:clamp(1.6rem,4vw,2.6rem);padding:18px 40px;border-radius:22px}
.btn[disabled]{opacity:.4;pointer-events:none}
.pl{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;min-height:44px}
.pl .p{background:var(--bg);border:2px solid var(--teal);border-radius:999px;padding:6px 8px 6px 16px;font-size:1.25rem;display:flex;gap:8px;align-items:center}
.pl .p button{background:#4b35a3;border-radius:50%;width:30px;height:30px;font-size:1rem;line-height:1}
.seg{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.seg label{width:100%;color:var(--muted);font-size:1rem;text-transform:uppercase;letter-spacing:.06em}
.seg button{background:var(--bg);border:3px solid #5b43b8;border-radius:14px;padding:10px 16px;font-size:1.1rem}
.seg button.on{background:var(--teal);color:#003d33;border-color:var(--teal)}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.top .tt{font-size:clamp(1.2rem,3vw,2rem);color:var(--yellow);text-transform:uppercase}
.timerBox{text-align:center;margin:8px 0 6px}
#timer{font-size:clamp(5rem,20vw,12rem);line-height:1;font-variant-numeric:tabular-nums;color:#fff;text-shadow:0 6px 0 #0006}
#timer.low{color:var(--red);animation:pulse .5s infinite alternate}
@keyframes pulse{to{transform:scale(1.05)}}
.hint{color:var(--muted);font-size:clamp(1rem,2vw,1.4rem);font-weight:600;margin:6px 0}
.ctl{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.board{display:grid;gap:10px;margin-top:14px}
.sr{display:grid;grid-template-columns:48px 1fr auto;gap:10px;align-items:center;background:var(--panel);border:2px solid #4b35a3;border-radius:18px;padding:10px 14px}
.sr.lead{border-color:var(--yellow);box-shadow:0 0 0 3px #ffd23f55}
.rk{font-size:2rem;color:var(--yellow);text-align:center}
.nm{font-size:clamp(1.4rem,3.2vw,2.2rem);overflow:hidden;text-overflow:ellipsis}
.st{color:var(--muted);font-size:1.05rem;font-weight:600}
.pts{font-size:clamp(1.8rem,4vw,3rem);color:var(--teal);text-align:right;line-height:1}
.pts small{display:block;font-size:.9rem;color:var(--muted);font-weight:600}
.acts{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}
.star{color:var(--yellow)}
/* overlay + card */
.ov{position:fixed;inset:0;background:#0b0620fa;z-index:50;overflow:auto;padding:12px;display:flex;flex-direction:column;align-items:center}
.ov.sig{z-index:60;justify-content:center;background:#0b0620dd}
.cardWrap{--cw:min(96vw,78vh,820px);width:var(--cw)}
.cardHead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.cardHead .who{font-size:clamp(1.3rem,3.4vw,2rem);color:var(--yellow)}
.grid{display:grid;gap:5px;width:var(--cw)}
.cell{position:relative;background:#fff;color:#22124d;border-radius:10px;aspect-ratio:1/1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  padding:4px;font-size:calc(var(--cw)/var(--n)/7.4);line-height:1.1;overflow:hidden;word-break:break-word;font-weight:800;border:3px solid #fff;transition:transform .08s}
.cell:active{transform:scale(.95)}
.cell.on{background:var(--teal);border-color:#fff;color:#00362d}
.cell.free{background:var(--yellow);color:#4a3300;font-size:calc(var(--cw)/var(--n)/5.4)}
.cell.line{box-shadow:0 0 0 4px var(--pink) inset;animation:glow .8s infinite alternate}
@keyframes glow{to{filter:brightness(1.2)}}
.cell .sg{font-size:.72em;font-weight:700;background:#00362d;color:#fff;border-radius:6px;padding:1px 6px;margin-top:3px;max-width:96%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell .ck{position:absolute;top:1px;right:4px;font-size:.8em}
.modal{background:var(--panel);border:3px solid var(--yellow);border-radius:22px;padding:20px;width:min(94vw,520px)}
.modal h3{margin:0 0 6px;font-size:1.6rem;color:var(--yellow)}
.modal p{margin:6px 0 12px;font-size:1.25rem;font-weight:600}
.err{color:var(--red);font-size:1.15rem;min-height:1.4em;margin:6px 0}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--yellow);color:#2a1a00;padding:12px 22px;border-radius:999px;font-size:1.3rem;z-index:90;box-shadow:0 6px 20px #0008;max-width:92vw;text-align:center}
#fx{position:fixed;inset:0;pointer-events:none;z-index:100}
.podium{display:flex;justify-content:center;align-items:flex-end;gap:12px;margin:20px 0;min-height:260px}
.pod{width:min(30%,260px);text-align:center;border-radius:18px 18px 0 0;padding:12px 6px}
.pod .n{font-size:clamp(1.2rem,3vw,2rem);overflow:hidden;text-overflow:ellipsis}
.pod .s{font-size:clamp(1.4rem,3.5vw,2.4rem)}
.pod.g1{background:var(--yellow);color:#3a2800;height:250px}.pod.g2{background:#d5d9e6;color:#222;height:190px}.pod.g3{background:#e0a36a;color:#3a1d00;height:150px}
table.tb{width:100%;border-collapse:collapse;font-size:clamp(1.1rem,2.4vw,1.6rem)}
table.tb td,table.tb th{padding:8px 10px;text-align:left;border-bottom:2px solid #4b35a3}
table.tb th{color:var(--muted);font-size:.9rem;text-transform:uppercase}
table.tb td:last-child,table.tb th:last-child{text-align:right;color:var(--teal)}
#printArea{display:none}
@media print{
  html,body{background:#fff!important;color:#000}
  #app,.ov,.toast,#fx{display:none!important}
  #printArea{display:block}
  .pc{page-break-inside:avoid;break-inside:avoid;margin:0 0 14mm;color:#000}
  .pc h2{margin:0 0 4px;font-size:20pt}
  .pc .g{display:grid;gap:3px;width:150mm}
  .pc .c{border:2px solid #000;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;text-align:center;font-size:9pt;padding:3px;font-weight:700}
  .pc .c.f{background:#ddd}
}
@media (max-width:560px){
  .sr{grid-template-columns:36px 1fr auto}
  .btn{padding:12px 16px;font-size:1.1rem}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="printArea"></div>
<canvas id="fx"></canvas>

<script>
/* ============================ CONTENT ============================ */
const PACKS = {
  adventure: [
    "Has been to another country","Has ridden an upside-down roller coaster","Has seen a real volcano","Has slept in a tent this year",
    "Has met someone famous","Has flown on a plane this year","Has climbed a mountain","Has swum in the ocean","Has been on a cruise ship",
    "Has ridden a horse","Has caught a fish","Has been skiing or snowboarding","Has seen a shooting star","Has moved house 3+ times",
    "Has ridden a train overnight","Has been to a live concert","Has done a road trip over 8 hours","Has been in a hot air balloon or helicopter",
    "Has visited a real castle","Has built a sandcastle recently","Has seen the northern lights","Has gotten lost on a trip",
    "Has a passport that isn't expired","Has been to a theme park this year","Has gone on a hike this month","Has fed an animal on a farm",
    "Has visited 3+ countries","Has gone camping in the rain","Has ridden a camel, donkey or elephant","Has snorkeled or scuba dived"
  ],
  foodie: [
    "Loves pineapple on pizza","Hates pineapple on pizza","Can cook a meal from scratch","Has eaten something spicy and cried",
    "Drinks coffee every day","Has never tried sushi","Dips fries in a milkshake","Has eaten breakfast for dinner this week",
    "Has baked a cake","Prefers crunchy peanut butter","Loves cold pizza","Has grown their own vegetables","Can't stand cilantro",
    "Has a favorite ice cream that isn't chocolate or vanilla","Always saves the best bite for last","Has burned toast this week",
    "Can eat with chopsticks","Loves mushrooms","Has a secret snack stash","Pours the milk before the cereal","Has made homemade pizza",
    "Dislikes tomatoes","Has eaten an insect snack","Orders the same thing every time","Can name 5 kinds of pasta",
    "Knows a favorite family recipe","Likes the movie popcorn most","Has made pancakes this month","Eats pizza with a fork and knife","Puts ketchup on almost everything"
  ],
  quirky: [
    "Can wiggle their ears","Can juggle (even badly)","Knows a magic trick","Can touch their nose with their tongue","Has a nickname they love",
    "Has had a pet fish","Can do a cartwheel","Is left-handed","Can whistle a tune","Has a hidden talent","Talks to their pets or plants",
    "Has been on TV or in the news","Has a twin or knows one","Can solve a Rubik's cube","Still has a favorite childhood toy",
    "Speaks 2+ languages","Has won a trophy or medal","Was born in your birth month","Has your same first initial","Can do a handstand",
    "Can name all the planets","Has a really unusual middle name","Has been stuck in an elevator","Plays a musical instrument",
    "Can say the alphabet backwards","Is wearing mismatched socks","Can say a tongue twister perfectly","Wakes up before 6 a.m. on purpose",
    "Has a lucky number","Can do a great animal impression"
  ],
  pop: [
    "Has watched one movie 10+ times","Knows every word to a movie song","Plays video games every week","Has a favorite board game","Reads before bed",
    "Has a pet dog","Has a pet cat","Wore a homemade Halloween costume","Is wearing a hat or cap","Has a fun phone case","Has a favorite superhero",
    "Binge-watched a whole season in a weekend","Has cried at a cartoon movie","Plays on a sports team","Has been to a sleepover",
    "Has a younger sibling","Is the youngest in their family","Is the oldest in their family","Is an only child","Has a garden",
    "Loves winter best","Is a morning person","Is a night owl","Has baked cookies this month","Has a collection of something",
    "Can ride a bike with no hands","Stayed up past midnight this week","Has a favorite emoji they always use","Has dyed their hair a wild color","Has built something with LEGO this year"
  ]
};
const PACK_LABEL = {all:"Everything Mix",adventure:"Adventure",foodie:"Foodie",quirky:"Quirky",pop:"Pop & Home"};
const ALL_PROMPTS = [].concat(PACKS.adventure,PACKS.foodie,PACKS.quirky,PACKS.pop);
const poolFor = p => p==='all' ? ALL_PROMPTS : PACKS[p];

/* ============================ STATE ============================ */
const S = {
  screen:'setup', players:[], pack:'all', size:5, minutes:5, rounds:2, sigReq:true,
  round:1, cards:[], totals:[], first:null, used:[], view:null, sig:null, nameDraft:''
};
const T = {state:'ready', left:300, end:0, iv:null, lastTick:-1};
let muted=false;

/* ============================ UTIL ============================ */
const $ = s=>document.querySelector(s);
const esc = s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function fmt(s){return Math.floor(s/60)+":"+String(s%60).padStart(2,'0')}
let toastTO;
function toast(msg){let t=$('.toast');if(t)t.remove();t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);clearTimeout(toastTO);toastTO=setTimeout(()=>t.remove(),2200)}

/* ============================ SOUND (Web Audio) ============================ */
let AC=null;
function ac(){ if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}} if(AC&&AC.state==='suspended')AC.resume(); return AC }
function tone(f,d,type='sine',v=.2,when=0,to){
  if(muted)return; const c=ac(); if(!c)return;
  const o=c.createOscillator(),g=c.createGain(),t=c.currentTime+when;
  o.type=type;o.frequency.setValueAtTime(f,t); if(to)o.frequency.exponentialRampToValueAtTime(to,t+d);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+d+.02);
}
const snd = {
  pop(){tone(520,.12,'triangle',.25,0,880)},
  undo(){tone(400,.12,'triangle',.2,0,250)},
  bad(){tone(160,.25,'sawtooth',.2)},
  tick(){tone(900,.05,'square',.08)},
  start(){[392,523,659,784].forEach((f,i)=>tone(f,.18,'triangle',.25,i*.1))},
  bingo(){[523,659,784,1047,784,1047,1319].forEach((f,i)=>tone(f,.22,'triangle',.28,i*.1))},
  buzzer(){tone(140,.9,'sawtooth',.35);tone(147,.9,'square',.2)},
  win(){[523,659,784,1047].forEach((f,i)=>tone(f,.3,'triangle',.28,i*.15));tone(1047,.8,'sine',.25,.7)}
};

/* ============================ CONFETTI ============================ */
function confetti(n=140){
  const cv=$('#fx'),cx=cv.getContext('2d');cv.width=innerWidth;cv.height=innerHeight;
  const cols=['#ffd23f','#ff4f9a','#2de2c4','#ffffff','#7c5cff'];
  const ps=Array.from({length:n},()=>({x:innerWidth/2,y:innerHeight*.45,vx:(Math.random()-.5)*16,vy:-Math.random()*16-4,r:Math.random()*8+4,c:cols[Math.floor(Math.random()*cols.length)],a:Math.random()*6}));
  let f=0;(function step(){cx.clearRect(0,0,cv.width,cv.height);ps.forEach(p=>{p.vy+=.45;p.x+=p.vx;p.y+=p.vy;p.a+=.2;cx.save();cx.translate(p.x,p.y);cx.rotate(p.a);cx.fillStyle=p.c;cx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);cx.restore()});
    if(++f<110)requestAnimationFrame(step);else cx.clearRect(0,0,cv.width,cv.height)})();
}

/* ============================ GAME LOGIC ============================ */
function cellsNeeded(){return S.size*S.size-(S.size%2?1:0)}
function dealCard(pi){
  const need=cellsNeeded(); let pool=poolFor(S.pack).filter(t=>!S.used[pi].has(t));
  if(pool.length<need){S.used[pi]=new Set();pool=poolFor(S.pack).slice()}
  const picks=shuffle(pool).slice(0,need); picks.forEach(t=>S.used[pi].add(t));
  const cells=picks.map(t=>({t,sig:null,free:false}));
  if(S.size%2) cells.splice(Math.floor(S.size*S.size/2),0,{t:'FREE ★ (that\'s you!)',sig:true,free:true});
  return {cells,adj:0};
}
function dealRound(){S.cards=S.players.map((_,i)=>dealCard(i));S.first=null}
function filled(c){return c.sig!==null}
function lineSets(n){
  const L=[];for(let i=0;i<n;i++){L.push(Array.from({length:n},(_,j)=>i*n+j));L.push(Array.from({length:n},(_,j)=>j*n+i))}
  L.push(Array.from({length:n},(_,j)=>j*n+j));L.push(Array.from({length:n},(_,j)=>j*n+(n-1-j)));return L;
}
function doneLines(card){return lineSets(S.size).filter(l=>l.every(i=>filled(card.cells[i])))}
function marks(card){return card.cells.filter(c=>!c.free&&filled(c)).length}
function roundPts(i){
  const c=S.cards[i];if(!c)return 0;const m=marks(c),l=doneLines(c).length;
  let p=m+l*5; if(m===cellsNeeded())p+=10; if(S.first===i)p+=5; p+=c.adj; return Math.max(0,p);
}
function totalPts(i){return S.totals[i]+roundPts(i)}

function startGame(){
  if(!S.players.length)return;
  S.round=1;S.totals=S.players.map(()=>0);S.used=S.players.map(()=>new Set());
  dealRound();prepRound();S.screen='host';render();
}
function prepRound(){clearInterval(T.iv);T.state='ready';T.left=S.minutes*60;T.lastTick=-1}
function startTimer(){
  ac();if(T.state==='ready')snd.start();
  T.state='running';T.end=Date.now()+T.left*1000;clearInterval(T.iv);T.iv=setInterval(tickTimer,200);render();
}
function pauseTimer(){T.left=Math.max(0,Math.ceil((T.end-Date.now())/1000));T.state='paused';clearInterval(T.iv);render()}
function addTime(){ if(T.state==='running'){T.end+=60000}else T.left+=60; tickTimer(); if(T.state!=='running')updTimerDom() }
function tickTimer(){
  if(T.state!=='running')return;
  T.left=Math.max(0,Math.ceil((T.end-Date.now())/1000));
  if(T.left<=10&&T.left>0&&T.left!==T.lastTick){T.lastTick=T.left;snd.tick()}
  updTimerDom();
  if(T.left<=0){endRound(true)}
}
function updTimerDom(){const t=$('#timer');if(t){t.textContent=fmt(T.left);t.classList.toggle('low',T.state==='running'&&T.left<=10)}}
function endRound(byTimer){
  if(T.state==='ended')return;
  clearInterval(T.iv);T.state='ended';if(byTimer)snd.buzzer();
  S.roundScores=S.players.map((_,i)=>roundPts(i));
  S.players.forEach((_,i)=>{S.totals[i]+=S.roundScores[i]});
  S.view=null;S.sig=null;S.screen='roundEnd';render();
}

/* marking */
function tryMark(pi,ci){
  if(T.state!=='running'){toast(T.state==='ready'?"Host hasn't started the round yet!":"Round is paused");return}
  const cell=S.cards[pi].cells[ci];if(cell.free)return;
  if(cell.sig!==null){S.sig={p:pi,c:ci,mode:'edit',val:'',err:''};render();return}
  if(!S.sigReq){applyMark(pi,ci,true);return}
  S.sig={p:pi,c:ci,mode:'add',val:'',err:''};render();
}
function applyMark(pi,ci,val){
  const card=S.cards[pi],before=doneLines(card).length;
  card.cells[ci].sig=val; snd.pop();
  const after=doneLines(card).length;
  if(after>before){
    snd.bingo();confetti();
    if(S.first===null){S.first=pi;toast("🎉 BINGO! "+S.players[pi]+" is FIRST! +5 bonus")}
    else toast("🎉 BINGO! "+S.players[pi]+" completed a line!");
    if(marks(card)===cellsNeeded()){toast("🏆 BLACKOUT! "+S.players[pi]+" filled the whole card! +10")}
  }
  render();
}
function confirmSig(){
  const g=S.sig;if(!g)return;const raw=($('#sigIn')||{}).value||'';const nm=raw.trim();g.val=raw;
  const card=S.cards[g.p];
  if(!nm){g.err="Type the name of the person you found!";snd.bad();return rerenderSig()}
  if(nm.toLowerCase()===S.players[g.p].toLowerCase()){g.err="You can't sign your own card!";snd.bad();return rerenderSig()}
  if(card.cells.some((c,i)=>i!==g.c&&typeof c.sig==='string'&&c.sig.toLowerCase()===nm.toLowerCase())){
    g.err=nm+" already signed another square — find someone NEW!";snd.bad();return rerenderSig()}
  S.sig=null;applyMark(g.p,g.c,nm);
}
function rerenderSig(){render();const i=$('#sigIn');if(i){i.focus()}}
function unmark(){const g=S.sig;if(!g)return;S.cards[g.p].cells[g.c].sig=null;S.sig=null;snd.undo();render()}

/* ============================ RENDER ============================ */
function render(){
  const app=$('#app');
  let h='';
  if(S.screen==='setup')h=viewSetup();
  else if(S.screen==='host')h=viewHost();
  else if(S.screen==='roundEnd')h=viewRoundEnd();
  else if(S.screen==='final')h=viewFinal();
  if(S.view!==null&&S.screen==='host')h+=viewCard();
  if(S.sig)h+=viewSig();
  app.innerHTML=h;
  if(S.screen==='setup'){const i=$('#nameIn');if(i&&S._focusName){i.focus();S._focusName=false}}
  if(S.sig){const i=$('#sigIn');if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length)}}
  updTimerDom();
}
function seg(label,k,opts,cur){
  return `<div class="seg"><label>${label}</label>${opts.map(o=>`<button class="${String(cur)===String(o[0])?'on':''}" data-act="opt" data-k="${k}" data-v="${o[0]}">${o[1]}</button>`).join('')}</div>`;
}
function viewSetup(){
  return `
  <h1>Mingle Bingo</h1>
  <div class="sub">The "Find Someone Who…" game — get up, walk around, and collect a different person's name for every square!</div>
  <div class="chips"><span class="chip">👥 3–12 players</span><span class="chip">⏱ 10–20 min session</span><span class="chip">🃏 120 unique squares</span><span class="chip">🧒 Family friendly</span></div>
  <div class="panel"><h2>How it works (one sentence)</h2>
    <div class="how"><div><b>1</b>Everyone gets a secret bingo card of "Find someone who…" squares.</div>
    <div><b>2</b>Mingle! Ask people, and get a <u>different</u> person's name for each square.</div>
    <div><b>3</b>Finish a line → shout BINGO! Most points when time runs out wins.</div></div>
    <div class="hint" style="margin-top:10px">Host: run this on the big screen &amp; start the clock. Players: tap <i>Open card</i> to use this device, or open this same file on your own phone, or hit <i>Print cards</i> for paper.</div>
  </div>
  <div class="panel"><h2>Who's playing?</h2>
    <div class="row"><input id="nameIn" class="nameIn" maxlength="14" placeholder="Type a name, press Enter" autocomplete="off" value="${esc(S.nameDraft)}">
    <button class="btn teal" data-act="addp">+ Add</button></div>
    <div class="pl">${S.players.map((p,i)=>`<span class="p">${esc(p)}<button data-act="delp" data-i="${i}" aria-label="remove">✕</button></span>`).join('')||'<span class="hint">Add everyone who is playing (1–12).</span>'}</div>
  </div>
  <div class="panel"><h2>Game settings</h2>
    ${seg('Square pack','pack',[['all','🎲 Everything Mix'],['adventure','🌍 Adventure'],['foodie','🍕 Foodie'],['quirky','🤪 Quirky'],['pop','🎬 Pop & Home']],S.pack)}
    ${seg('Card size','size',[[4,'4 × 4 (quick)'],[5,'5 × 5 (classic, free center)']],S.size)}
    ${seg('Minutes per round','minutes',[[3,'3'],[5,'5'],[8,'8'],[10,'10']],S.minutes)}
    ${seg('Number of rounds','rounds',[[1,'1'],[2,'2'],[3,'3']],S.rounds)}
    ${seg('Name rule','sigReq',[['true','✍️ Must type each person\'s name'],['false','🤝 Honor system (tap only)']],S.sigReq)}
    <div class="hint">Scoring: 1 pt per square · +5 per completed line · +5 for the first BINGO of a round · +10 for a full-card blackout.</div>
  </div>
  <div class="ctl"><button class="btn big pink" data-act="start" ${S.players.length?'':'disabled'}>START GAME ▶</button></div>`;
}
function viewHost(){
  const order=S.players.map((_,i)=>i).sort((a,b)=>totalPts(b)-totalPts(a));
  const top=totalPts(order[0]);
  const hint = T.state==='ready'?'Hand out the cards (Open card / Print), then press START. Players can mingle once the clock runs!'
    : T.state==='running'?'Mingle! Find a DIFFERENT person for each square.':'Paused — hold your positions!';
  return `
  <div class="top"><div class="tt">Round ${S.round} of ${S.rounds} · ${PACK_LABEL[S.pack]}</div>
    <div class="row"><button class="btn ghost small" data-act="mute">${muted?'🔇 Sound off':'🔊 Sound on'}</button>
    <button class="btn ghost small" data-act="print">🖨 Print cards</button>
    <button class="btn pink small" data-act="endnow">End round</button></div></div>
  <div class="timerBox"><div id="timer">${fmt(T.left)}</div><div class="hint">${hint}</div></div>
  <div class="ctl">
    ${T.state==='running'?`<button class="btn big" data-act="pause">⏸ PAUSE</button>`:`<button class="btn big teal" data-act="go">${T.state==='ready'?'▶ START ROUND':'▶ RESUME'}</button>`}
    <button class="btn ghost" data-act="addtime">+1 min</button>
  </div>
  <div class="board">${order.map((i,r)=>{
    const c=S.cards[i],m=marks(c),l=doneLines(c).length;
    return `<div class="sr ${totalPts(i)===top&&top>0?'lead':''}">
      <div class="rk">${r+1}</div>
      <div><div class="nm">${esc(S.players[i])} ${S.first===i?'<span class="star">★ first!</span>':''}</div>
        <div class="st">${m}/${cellsNeeded()} squares · ${l} line${l===1?'':'s'}${S.round>1||S.totals[i]?` · banked ${S.totals[i]}`:''}</div></div>
      <div class="pts">${totalPts(i)}<small>total</small></div>
      <div class="acts">
        <button class="btn teal small" data-act="open" data-i="${i}">📇 Open card</button>
        <button class="btn pink small" data-act="adj" data-i="${i}" data-d="5">+5 BINGO</button>
        <button class="btn small" data-act="adj" data-i="${i}" data-d="1">+1</button>
        <button class="btn ghost small" data-act="adj" data-i="${i}" data-d="-1">−1</button>
        <button class="btn ghost small" data-act="first" data-i="${i}">${S.first===i?'★ remove first':'★ first'}</button>
      </div></div>`}).join('')}</div>`;
}
function viewCard(){
  const i=S.view,c=S.cards[i],lines=doneLines(c),inLine=new Set(lines.flat()),n=S.size;
  return `<div class="ov"><div class="cardWrap" style="--n:${n}">
    <div class="cardHead"><div class="who">${esc(S.players[i])}'s card</div>
      <div class="row"><span class="chip">${marks(c)}/${cellsNeeded()} · ${lines.length} line${lines.length===1?'':'s'}</span>
      <button class="btn small" data-act="closecard">✔ Done</button></div></div>
    <div class="grid" style="grid-template-columns:repeat(${n},1fr);--n:${n}">
    ${c.cells.map((x,ci)=>`<button class="cell ${x.free?'free':''} ${filled(x)&&!x.free?'on':''} ${inLine.has(ci)?'line':''}" data-act="cell" data-c="${ci}">
      ${filled(x)&&!x.free?'<span class="ck">✔</span>':''}<span>${esc(x.t)}</span>${typeof x.sig==='string'?`<span class="sg">${esc(x.sig)}</span>`:''}</button>`).join('')}
    </div>
    <div class="hint" style="margin-top:8px">${T.state==='running'?'Tap a square when you find someone — then type their name.':'Clock is not running — squares are locked.'}</div>
  </div></div>`;
}
function viewSig(){
  const g=S.sig,cell=S.cards[g.p].cells[g.c];
  if(g.mode==='edit'){
    return `<div class="ov sig"><div class="modal"><h3>Square already marked</h3>
      <p>"${esc(cell.t)}"${typeof cell.sig==='string'?`<br>Signed by <span class="star">${esc(cell.sig)}</span>`:''}</p>
      <div class="row"><button class="btn pink" data-act="unmark">Unmark it</button><button class="btn ghost" data-act="sigcancel">Keep it</button></div></div></div>`;
  }
  return `<div class="ov sig"><div class="modal"><h3>Who is it?</h3>
    <p>Find someone who…<br><span class="star">${esc(cell.t)}</span></p>
    <input id="sigIn" class="nameIn" style="width:100%" maxlength="16" placeholder="Their name" autocomplete="off" value="${esc(g.val)}">
    <div class="err">${esc(g.err)}</div>
    <div class="row"><button class="btn teal" data-act="sigok">✔ Got 'em!</button><button class="btn ghost" data-act="sigcancel">Cancel</button></div></div></div>`;
}
function standings(useTotals=true){
  return S.players.map((p,i)=>({i,p,round:S.roundScores?S.roundScores[i]:0,total:S.totals[i]})).sort((a,b)=>b.total-a.total);
}
function viewRoundEnd(){
  const st=standings(),last=S.round>=S.rounds;
  return `<h1 style="font-size:clamp(2rem,6vw,4rem)">Time's up!</h1>
  <div class="sub">Round ${S.round} of ${S.rounds} results${st[0]?` — <span class="star">${esc(S.players[roundBest()])}</span> won the round!`:''}</div>
  <div class="panel"><table class="tb"><tr><th>#</th><th>Player</th><th>This round</th><th>Total</th></tr>
  ${st.map((x,r)=>`<tr><td>${r+1}</td><td>${esc(x.p)}</td><td>+${x.round}</td><td>${x.total}</td></tr>`).join('')}</table></div>
  <div class="ctl">${last?`<button class="btn big pink" data-act="final">SEE FINAL RESULTS 🏆</button>`:`<button class="btn big teal" data-act="next">NEXT ROUND ▶</button><button class="btn ghost" data-act="final">Finish early</button>`}</div>`;
}
function roundBest(){let b=0;S.roundScores.forEach((v,i)=>{if(v>S.roundScores[b])b=i});return b}
function viewFinal(){
  const st=standings(),pod=[st[1],st[0],st[2]].filter(Boolean);
  const cls=x=>x===st[0]?'g1':x===st[1]?'g2':'g3';
  return `<h1 style="font-size:clamp(2rem,6vw,4rem)">🏆 Final Results</h1>
  <div class="sub">${esc(st[0].p)} is the Mingle Champion!</div>
  <div class="podium">${pod.map(x=>`<div class="pod ${cls(x)}"><div class="n">${x===st[0]?'👑 ':''}${esc(x.p)}</div><div class="s">${x.total}</div></div>`).join('')}</div>
  <div class="panel"><table class="tb"><tr><th>#</th><th>Player</th><th>Points</th></tr>
  ${st.map((x,r)=>`<tr><td>${r+1}</td><td>${esc(x.p)}</td><td>${x.total}</td></tr>`).join('')}</table></div>
  <div class="ctl"><button class="btn big pink" data-act="again">PLAY AGAIN (same players)</button><button class="btn big ghost" data-act="newgame">New Game</button></div>`;
}

/* ============================ PRINT ============================ */
function printCards(){
  const n=S.size;
  $('#printArea').innerHTML=S.cards.map((c,i)=>`<div class="pc"><h2>${esc(S.players[i])} — Mingle Bingo (Round ${S.round})</h2>
    <div style="margin-bottom:4px;font-size:10pt">Find someone who… and write a DIFFERENT person's name in each box!</div>
    <div class="g" style="grid-template-columns:repeat(${n},1fr)">${c.cells.map(x=>`<div class="c ${x.free?'f':''}">${esc(x.t)}</div>`).join('')}</div></div>`).join('');
  setTimeout(()=>{try{window.print()}catch(e){toast("Printing isn't available here")}},50);
}

/* ============================ EVENTS ============================ */
function addPlayer(){
  const i=$('#nameIn');const v=((i&&i.value)||'').trim();
  if(!v){if(i)i.focus();return}
  if(S.players.length>=12){toast("Max 12 players");return}
  if(S.players.some(p=>p.toLowerCase()===v.toLowerCase())){toast("That name is already added");return}
  S.players.push(v);S.nameDraft='';S._focusName=true;snd.pop();render();
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;ac();
  switch(a){
    case 'addp':addPlayer();break;
    case 'delp':S.players.splice(+b.dataset.i,1);render();break;
    case 'opt':{const k=b.dataset.k;let v=b.dataset.v;
      if(k==='sigReq')v=(v==='true');else if(k!=='pack')v=+v;S[k]=v;
      const i=$('#nameIn');if(i)S.nameDraft=i.value;render();break}
    case 'start':startGame();break;
    case 'go':startTimer();break;
    case 'pause':pauseTimer();break;
    case 'addtime':addTime();break;
    case 'mute':muted=!muted;render();break;
    case 'print':printCards();break;
    case 'endnow':if(T.state==='ready'&&!S.cards.some(c=>marks(c)||c.adj)){toast("Start the round first!");break}
      endRound(false);break;
    case 'open':S.view=+b.dataset.i;render();break;
    case 'closecard':S.view=null;render();break;
    case 'cell':tryMark(S.view,+b.dataset.c);break;
    case 'sigok':confirmSig();break;
    case 'sigcancel':S.sig=null;render();break;
    case 'unmark':unmark();break;
    case 'adj':S.cards[+b.dataset.i].adj+=+b.dataset.d;if(+b.dataset.d===5){snd.bingo();confetti(80)}else snd.pop();render();break;
    case 'first':{const i=+b.dataset.i;S.first=(S.first===i)?null:i;snd.pop();render();break}
    case 'next':S.round++;dealRound();prepRound();S.screen='host';render();break;
    case 'final':S.screen='final';snd.win();confetti(220);render();break;
    case 'again':S.screen='setup';startGame();break;
    case 'newgame':S.players=[];S.screen='setup';render();break;
  }
});
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter')return;
  if(e.target.id==='nameIn')addPlayer();
  else if(e.target.id==='sigIn')confirmSig();
});
render();
</script>
</body>
</html>
