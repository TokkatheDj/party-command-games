<!-- CONCEPT: DRAWING/DESCRIBE - "Telephone Doodle": pass-the-device telephone-pictionary chain where every player alternately draws a secret phrase, then describes the previous drawing, so the original message mutates into chaos; everyone reveals each chain link-by-link, then the group crowns the funniest link and judges "perfect telephone" for points | Players: 3-10 | ~15-25 min -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Telephone Doodle</title>
<style>
:root{
  --bg:#1a0b3d; --bg2:#2b1466; --panel:#35198a; --ink:#ffffff; --muted:#c9b8ff;
  --yellow:#ffd23f; --pink:#ff3d8b; --cyan:#2ee6d6; --green:#5bf28a; --red:#ff5a4d;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:radial-gradient(circle at 20% 0%,#3b1a9e 0%,var(--bg) 55%);color:var(--ink);
  font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;font-weight:700;overflow:hidden;user-select:none;-webkit-user-select:none}
#app{position:fixed;inset:0;overflow-y:auto;overflow-x:hidden;padding:clamp(10px,2vw,24px)}
button{font:inherit;color:inherit;cursor:pointer;border:0}
h1{margin:0;font-size:clamp(34px,7vw,76px);line-height:1;letter-spacing:1px;text-shadow:0 4px 0 var(--pink)}
h1 span{color:var(--yellow)}
.sub{color:var(--muted);font-size:clamp(16px,2.2vw,24px);margin:10px 0 0;font-weight:600}
.badge{display:inline-block;background:var(--bg2);border:2px solid var(--cyan);color:var(--cyan);border-radius:999px;padding:6px 16px;font-size:clamp(14px,1.8vw,20px);margin-top:12px}
.wrap{max-width:1000px;margin:0 auto}
.card{background:var(--panel);border:3px solid rgba(255,255,255,.14);border-radius:22px;padding:clamp(14px,2.4vw,26px);margin-top:18px}
.card h2{margin:0 0 10px;font-size:clamp(20px,2.6vw,30px);color:var(--yellow)}
.how{margin:0;padding-left:1.2em;font-size:clamp(16px,2vw,22px);line-height:1.5;font-weight:600}
.how li{margin:4px 0}
.players{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.prow{display:flex;gap:6px}
.prow input{flex:1;min-width:0;font:inherit;font-size:22px;padding:12px 14px;border-radius:14px;border:3px solid transparent;background:#fff;color:#1a0b3d}
.prow input:focus{outline:none;border-color:var(--yellow)}
.x{width:48px;border-radius:14px;background:var(--bg2);font-size:22px;color:var(--muted)}
.x:hover{background:var(--red);color:#fff}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{background:var(--bg2);border:3px solid transparent;padding:12px 18px;border-radius:14px;font-size:clamp(16px,2vw,21px)}
.seg button.on{background:var(--yellow);color:#1a0b3d}
.lbl{font-size:clamp(15px,1.8vw,19px);color:var(--muted);margin:14px 0 8px;font-weight:700;text-transform:uppercase;letter-spacing:1px}
.big{display:block;width:100%;background:var(--yellow);color:#1a0b3d;font-size:clamp(24px,4vw,40px);padding:18px 24px;border-radius:20px;box-shadow:0 7px 0 #b88a00;margin-top:18px;transition:transform .08s}
.big:active{transform:translateY(5px);box-shadow:0 2px 0 #b88a00}
.big.pink{background:var(--pink);color:#fff;box-shadow:0 7px 0 #a8205a}
.big.pink:active{box-shadow:0 2px 0 #a8205a}
.big.cyan{background:var(--cyan);box-shadow:0 7px 0 #139e94}
.big.cyan:active{box-shadow:0 2px 0 #139e94}
.big:disabled{opacity:.4;pointer-events:none}
.small{background:var(--bg2);border:3px solid rgba(255,255,255,.2);border-radius:14px;padding:10px 16px;font-size:clamp(15px,1.8vw,19px)}
.small:hover{border-color:var(--yellow)}
.mute{position:fixed;right:12px;top:10px;z-index:20;background:var(--bg2);border-radius:999px;padding:8px 14px;font-size:15px;border:2px solid rgba(255,255,255,.2)}
/* pass screen */
.pass{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;max-width:800px;margin:0 auto}
.pass .to{font-size:clamp(20px,3vw,34px);color:var(--muted)}
.pass .name{font-size:clamp(48px,12vw,130px);line-height:1.05;color:var(--yellow);text-shadow:0 5px 0 var(--pink);word-break:break-word}
.pass .job{font-size:clamp(20px,3vw,34px)}
.pass .job b{color:var(--cyan)}
.dots{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:6px}
.dot{width:16px;height:16px;border-radius:50%;background:var(--bg2);border:2px solid var(--muted)}
.dot.done{background:var(--cyan);border-color:var(--cyan)}
.dot.now{background:var(--yellow);border-color:var(--yellow);transform:scale(1.3)}
/* play screen */
.play{height:100%;display:flex;flex-direction:column;gap:8px;max-width:1100px;margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.top .who{font-size:clamp(22px,3.4vw,38px);color:var(--yellow)}
.top .st{font-size:clamp(14px,1.8vw,20px);color:var(--muted)}
.timer{font-size:clamp(28px,4vw,46px);background:var(--bg2);border:3px solid var(--cyan);border-radius:16px;min-width:84px;text-align:center;padding:2px 12px}
.timer.low{border-color:var(--red);color:var(--red);animation:pulse .5s infinite alternate}
@keyframes pulse{to{transform:scale(1.12)}}
.prompt{background:var(--panel);border:3px solid var(--yellow);border-radius:18px;padding:10px 16px;font-size:clamp(20px,3.2vw,36px);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.prompt small{display:block;font-size:clamp(13px,1.6vw,17px);color:var(--muted);text-transform:uppercase;letter-spacing:1px}
.prompt .txt{color:#fff;flex:1;min-width:200px}
.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.18);border-radius:18px;overflow:hidden}
#cv{background:#fff;border-radius:12px;touch-action:none;cursor:crosshair;box-shadow:0 6px 0 rgba(0,0,0,.35)}
.stage img{width:100%;height:100%;object-fit:contain;background:#fff;border-radius:12px}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center}
.sw{width:44px;height:44px;border-radius:50%;border:4px solid rgba(255,255,255,.35);padding:0}
.sw.on{border-color:#fff;transform:scale(1.18);box-shadow:0 0 0 3px var(--pink)}
.sz{width:48px;height:48px;border-radius:14px;background:var(--bg2);display:flex;align-items:center;justify-content:center;border:3px solid transparent}
.sz.on{border-color:var(--yellow)}
.sz i{display:block;border-radius:50%;background:#fff}
.sep{width:2px;height:34px;background:rgba(255,255,255,.2)}
.play .big{margin-top:2px;padding:12px 24px;font-size:clamp(22px,3.2vw,32px)}
.write{display:flex;flex-direction:column;gap:8px}
.write input{font:inherit;font-size:clamp(22px,3.4vw,38px);padding:14px 16px;border-radius:16px;border:4px solid var(--yellow);background:#fff;color:#1a0b3d;width:100%;user-select:text;-webkit-user-select:text}
.write input:focus{outline:none;border-color:var(--cyan)}
.write .hint{color:var(--muted);font-size:clamp(14px,1.8vw,19px);font-weight:600}
/* reveal */
.score{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:10px}
.chip{background:var(--bg2);border:2px solid rgba(255,255,255,.2);border-radius:999px;padding:6px 14px;font-size:clamp(14px,1.8vw,19px)}
.chip b{color:var(--yellow);margin-left:6px}
.rh{text-align:center;font-size:clamp(22px,3.6vw,40px);color:var(--yellow);margin:6px 0 2px}
.rs{text-align:center;color:var(--muted);font-size:clamp(14px,1.8vw,20px);margin-bottom:8px}
.link{background:var(--panel);border:4px solid rgba(255,255,255,.15);border-radius:22px;padding:14px 18px;margin:14px auto;max-width:760px;animation:pop .4s cubic-bezier(.2,1.6,.4,1) both;position:relative}
@keyframes pop{from{transform:scale(.4) rotate(-4deg);opacity:0}to{transform:none;opacity:1}}
.link .by{color:var(--cyan);font-size:clamp(15px,2vw,22px);margin-bottom:6px;text-transform:uppercase;letter-spacing:1px}
.link .say{font-size:clamp(26px,4.6vw,52px);line-height:1.15;word-break:break-word}
.link img{width:100%;display:block;background:#fff;border-radius:12px}
.link.orig{border-color:var(--pink)}
.link.canpick{cursor:pointer}
.link.canpick:hover{border-color:var(--yellow)}
.link.crown{border-color:var(--yellow);box-shadow:0 0 0 4px rgba(255,210,63,.4),0 0 30px rgba(255,210,63,.5)}
.crownbadge{position:absolute;right:12px;top:-14px;background:var(--yellow);color:#1a0b3d;border-radius:999px;padding:4px 14px;font-size:clamp(14px,1.8vw,19px)}
.bar{max-width:760px;margin:0 auto;padding-bottom:30px}
.bar .row{display:flex;gap:10px;flex-wrap:wrap}
.bar .row .big{flex:1;min-width:220px}
.hintp{text-align:center;color:var(--muted);font-size:clamp(15px,2vw,22px);margin:8px 0}
/* final */
.podium{max-width:760px;margin:16px auto 0}
.prank{display:flex;align-items:center;gap:12px;margin:10px 0;background:var(--panel);border-radius:18px;padding:10px 16px;border:3px solid rgba(255,255,255,.15)}
.prank.first{border-color:var(--yellow);background:#4a2ab5}
.prank .n{font-size:clamp(24px,4vw,44px);width:1.4em;color:var(--yellow)}
.prank .nm{flex:1;font-size:clamp(22px,3.6vw,40px);word-break:break-word}
.prank .meter{height:12px;background:var(--cyan);border-radius:8px;margin-top:6px;transition:width 1s}
.prank .pts{font-size:clamp(26px,4vw,46px);color:var(--yellow)}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:10}
</style>
</head>
<body>
<button class="mute" id="mute" aria-label="Toggle sound">Sound: On</button>
<div id="app"></div>
<canvas id="confetti"></canvas>

<script>
/* ---------- helpers ---------- */
const app = document.getElementById('app');
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

/* ---------- sound (Web Audio, no files) ---------- */
let ac = null, muted = false;
function actx() {
  if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { ac = null; } }
  if (ac && ac.state === 'suspended') ac.resume();
  return ac;
}
function tone(f, d = 0.15, type = 'sine', vol = 0.18, delay = 0) {
  if (muted) return; const a = actx(); if (!a) return;
  const t = a.currentTime + delay, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + d + 0.03);
}
const sfx = {
  click: () => tone(520, .07, 'square', .07),
  pass: () => { tone(523, .12, 'triangle'); tone(784, .2, 'triangle', .18, .1); },
  done: () => { tone(660, .1, 'triangle'); tone(880, .16, 'triangle', .18, .09); },
  tick: () => tone(950, .05, 'square', .06),
  buzz: () => { tone(140, .45, 'sawtooth', .18); tone(110, .45, 'sawtooth', .18, .05); },
  pop: () => { tone(380, .08, 'sine', .2); tone(760, .13, 'sine', .2, .06); },
  award: () => [523, 659, 784, 1047].forEach((f, i) => tone(f, .16, 'triangle', .2, i * .07)),
  fan: () => [392, 523, 659, 784, 659, 784, 1047].forEach((f, i) => tone(f, .22, 'triangle', .2, i * .11))
};
document.getElementById('mute').onclick = e => { muted = !muted; e.target.textContent = 'Sound: ' + (muted ? 'Off' : 'On'); if (!muted) sfx.click(); };

/* ---------- content: 84 starter phrases ---------- */
const PHRASES = [
 "A dog riding a skateboard to work","A grandma winning a hot dog eating contest","Three penguins in a hot tub","A robot learning to dance",
 "A cat DJing at a pool party","A pirate afraid of water","A dinosaur trying to ride a bicycle","A snowman on a beach vacation",
 "A chef whose pancake flew into space","Two giraffes sharing one umbrella","A shark stuck in an elevator","A wizard who forgot his spell",
 "A frog in a tiny business suit","A superhero who is scared of balloons","An octopus playing five video games at once","A llama in a fancy restaurant",
 "A squirrel stealing a pizza","A king stuck in a bouncy castle","A mermaid riding the school bus","A ghost doing laundry",
 "A bear brushing its teeth","A turtle winning a race car championship","A farmer and a very smug chicken","A unicorn stuck in traffic",
 "A monkey teaching math class","A snail delivering the mail","A baby riding a giant lobster","A cow on a trampoline",
 "An astronaut mowing the moon","A hippo doing ballet","A duck wearing roller skates","A tiny dragon toasting a marshmallow",
 "A teacher chased by a cloud of bubbles","A pizza with a very surprised face","A robot walking a dog made of balloons","A cactus getting a hug",
 "A zebra at the barber shop","A raccoon running a lemonade stand","A caveman discovering a trampoline","A parrot telling a joke to a banana",
 "A fish riding a bike on land","A firefighter rescuing a kitten from a cake","A walrus playing the piano","A knight arguing with a goose",
 "A family of ducks crossing a busy street","A volcano that sneezed","A scarecrow at a dance party","A bunny juggling carrots on a unicycle",
 "A sloth in a very slow race","A garden gnome on a roller coaster","A mouse driving a monster truck","A fox wearing sunglasses at the library",
 "A polar bear eating ice cream in a desert","A bee wearing a tiny crown","A giant sandwich invading the city","A grandpa surfing a big wave",
 "A kangaroo packing for a vacation","An alien learning to ride a horse","A hedgehog giving a birthday party","A lion getting a haircut",
 "A rocket ship shaped like a banana","A clown stuck in a tiny car with ten elephants","A turkey running for president","A bat hanging out at a sleepover",
 "A squid painting a self-portrait","A moose wearing a scarf in a snowstorm","A cowboy herding cats","A baker whose bread came to life",
 "A koala on a very long flight","A school of fish going to school","A troll collecting tickets at a bridge","A penguin sliding down a rainbow",
 "A peacock at a talent show","A worm in a fancy hat","A mad scientist with a bubbling soup","A camel carrying a mountain of presents",
 "A cheetah stopping for a snack mid-race","A goat standing on a roof","A princess fixing a car engine","A bird building a nest out of spaghetti",
 "A tiger in a bubble bath","A pair of socks escaping the dryer","A yeti ordering coffee","A crab playing guitar on a beach",
 "A pumpkin carrying a flashlight","A sleepy owl at breakfast","A swan teaching swimming lessons","A giant snail carrying a tiny house"
];

/* ---------- state ---------- */
const cfg = { names: ['', '', '', ''], timer: 'normal', length: 4 };
let G = null;
let timerH = null;
const TIMERS = { relaxed: [0, 0], normal: [60, 30], hurry: [30, 20] };

function stopTimer() { if (timerH) { clearInterval(timerH); timerH = null; } }
function drawPhrase() {
  if (!G.deck.length) G.deck = shuffle(PHRASES);
  return G.deck.pop();
}
function scores() {
  const s = G.players.map(() => 0);
  G.chains.forEach(ch => {
    if (ch.funny != null) { const l = ch.links[ch.funny]; if (l && l.author != null) s[l.author] += 2; }
    if (ch.perfect) ch.links.forEach(l => { if (l.author != null) s[l.author] += 1; });
  });
  return s;
}
function stepType(k) { return k % 2 === 0 ? 'draw' : 'write'; }

/* ---------- SETUP ---------- */
function showSetup() {
  stopTimer(); G = null; confettiStop();
  const n = cfg.names.length;
  app.innerHTML = `
  <div class="wrap">
    <div style="text-align:center;margin-top:8px">
      <h1>TELEPHONE <span>DOODLE</span></h1>
      <p class="sub">Draw it. Describe it. Draw THAT. Watch the message fall apart.</p>
      <span class="badge">3&ndash;10 players &bull; about 15&ndash;25 min &bull; pass-the-device</span>
    </div>
    <div class="card">
      <h2>How to play</h2>
      <ol class="how">
        <li>Everyone gets a secret phrase and <b>draws</b> it.</li>
        <li>Pass the device: the next player sees only that drawing and <b>writes</b> what it is.</li>
        <li>Next player <b>draws</b> that caption. Keep alternating!</li>
        <li>Then reveal every chain together. Crown the funniest link (+2) and judge if it survived (+1 each).</li>
      </ol>
    </div>
    <div class="card">
      <h2>Who's playing?</h2>
      <div class="players" id="plist"></div>
      <div style="margin-top:12px;display:flex;gap:10px;flex-wrap:wrap">
        <button class="small" id="addp" ${n >= 10 ? 'disabled style="opacity:.4"' : ''}>+ Add player</button>
        <button class="small" id="shufp">Shuffle seating order</button>
      </div>
      <div class="lbl">Timer (per turn)</div>
      <div class="seg" id="tseg">
        <button data-v="relaxed">Relaxed (none)</button>
        <button data-v="normal">Normal (60s draw / 30s write)</button>
        <button data-v="hurry">Hurry (30s / 20s)</button>
      </div>
      <div class="lbl">Chain length (steps per chain, capped by player count)</div>
      <div class="seg" id="lseg">
        <button data-v="3">Short (3)</button>
        <button data-v="4">Standard (4)</button>
        <button data-v="6">Long (6)</button>
      </div>
      <button class="big" id="go">Start Game</button>
    </div>
  </div>`;
  const pl = document.getElementById('plist');
  cfg.names.forEach((nm, i) => {
    const r = document.createElement('div'); r.className = 'prow';
    r.innerHTML = `<input maxlength="14" placeholder="Player ${i + 1}" value="${esc(nm)}" aria-label="Player ${i + 1} name"><button class="x" ${n <= 3 ? 'disabled style="opacity:.3"' : ''} aria-label="Remove">&times;</button>`;
    r.querySelector('input').oninput = e => cfg.names[i] = e.target.value;
    r.querySelector('.x').onclick = () => { if (cfg.names.length > 3) { cfg.names.splice(i, 1); sfx.click(); showSetup(); } };
    pl.appendChild(r);
  });
  document.getElementById('addp').onclick = () => { if (cfg.names.length < 10) { cfg.names.push(''); sfx.click(); showSetup(); setTimeout(() => { const ins = document.querySelectorAll('.prow input'); ins[ins.length - 1].focus(); }, 0); } };
  document.getElementById('shufp').onclick = () => { cfg.names = shuffle(cfg.names); sfx.click(); showSetup(); };
  const hook = (id, key, num) => {
    const seg = document.getElementById(id);
    seg.querySelectorAll('button').forEach(b => {
      if (String(cfg[key]) === b.dataset.v) b.classList.add('on');
      b.onclick = () => { cfg[key] = num ? +b.dataset.v : b.dataset.v; seg.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); sfx.click(); };
    });
  };
  hook('tseg', 'timer', false); hook('lseg', 'length', true);
  document.getElementById('go').onclick = () => { sfx.fan(); startGame(); };
}

/* ---------- GAME FLOW ---------- */
function startGame(keepPlayers) {
  const names = cfg.names.map((n, i) => (n.trim() || 'Player ' + (i + 1)));
  const N = names.length;
  const S = Math.max(2, Math.min(cfg.length, N));
  G = { players: names.map(n => ({ name: n })), N, S, step: 0, turn: 0, deck: shuffle(PHRASES), chains: [], swapped: names.map(() => false), rev: null };
  for (let i = 0; i < N; i++) G.chains.push({ links: [{ type: 'prompt', author: null, content: drawPhrase() }], funny: null, perfect: false });
  showPass();
}
function chainFor(turn, step) { return (turn + step) % G.N; }

function showPass() {
  stopTimer(); confettiStop();
  const p = G.players[G.turn], type = stepType(G.step);
  let dots = '';
  for (let i = 0; i < G.N; i++) dots += `<span class="dot ${i < G.turn ? 'done' : i === G.turn ? 'now' : ''}"></span>`;
  app.innerHTML = `
  <div class="pass">
    <div class="to">Step ${G.step + 1} of ${G.S} &bull; Pass the device to</div>
    <div class="name">${esc(p.name)}</div>
    <div class="job">You will <b>${type === 'draw' ? 'DRAW' : 'WRITE'}</b> ${G.step === 0 ? 'your secret phrase' : type === 'draw' ? 'a caption' : 'what you see'}</div>
    <div class="to" style="font-size:clamp(16px,2.2vw,24px)">Everyone else: look away!</div>
    <div class="dots">${dots}</div>
    <button class="big pink" id="ready" style="max-width:560px">I'm ${esc(p.name)} &mdash; go!</button>
  </div>`;
  document.getElementById('ready').onclick = () => { sfx.pass(); showTurn(); };
}

function showTurn() {
  const p = G.players[G.turn], type = stepType(G.step);
  const ci = chainFor(G.turn, G.step), ch = G.chains[ci], prev = ch.links[ch.links.length - 1];
  const secs = TIMERS[cfg.timer][type === 'draw' ? 0 : 1];
  const head = `
    <div class="top">
      <div><div class="who">${esc(p.name)}</div><div class="st">Step ${G.step + 1} of ${G.S} &bull; ${type === 'draw' ? 'DRAW' : 'WRITE'}</div></div>
      <div class="timer" id="timer" style="${secs ? '' : 'display:none'}">${secs}</div>
    </div>`;
  if (type === 'draw') {
    const canSwap = G.step === 0 && !G.swapped[G.turn];
    app.innerHTML = `<div class="play">${head}
      <div class="prompt"><div class="txt"><small>${G.step === 0 ? 'Your secret phrase &mdash; draw this!' : 'Draw this caption!'}</small><span id="ptxt">${esc(prev.content)}</span></div>
        ${canSwap ? '<button class="small" id="swap">Swap phrase (once)</button>' : ''}</div>
      <div class="stage" id="stage"><canvas id="cv" width="800" height="560"></canvas></div>
      <div class="tools" id="tools"></div>
      <button class="big cyan" id="done">Done drawing</button></div>`;
    setupCanvas();
    const sw = document.getElementById('swap');
    if (sw) sw.onclick = () => { G.swapped[G.turn] = true; const np = drawPhrase(); ch.links[0].content = np; document.getElementById('ptxt').textContent = np; sw.remove(); sfx.pop(); };
    document.getElementById('done').onclick = () => submitDraw(false);
    startTimer(secs, () => submitDraw(true));
  } else {
    app.innerHTML = `<div class="play">${head}
      <div class="stage"><img alt="Drawing to describe" src="${prev.content}"></div>
      <div class="write">
        <div class="hint">What is this a drawing of? Write it as a short phrase, like a caption.</div>
        <input id="txt" maxlength="80" autocomplete="off" placeholder="Type your best guess..." aria-label="Your guess">
      </div>
      <button class="big cyan" id="done">Lock it in</button></div>`;
    const inp = document.getElementById('txt');
    setTimeout(() => inp.focus(), 50);
    inp.onkeydown = e => { if (e.key === 'Enter') submitWrite(false); };
    document.getElementById('done').onclick = () => submitWrite(false);
    startTimer(secs, () => submitWrite(true));
  }
}

function startTimer(secs, onEnd) {
  stopTimer(); if (!secs) return;
  let left = secs; const el = document.getElementById('timer');
  timerH = setInterval(() => {
    left--; if (el) { el.textContent = left; el.classList.toggle('low', left <= 5); }
    if (left > 0 && left <= 5) sfx.tick();
    if (left <= 0) { stopTimer(); sfx.buzz(); onEnd(); }
  }, 1000);
}

function pushLink(link) {
  const ci = chainFor(G.turn, G.step);
  G.chains[ci].links.push(link);
  sfx.done();
  G.turn++;
  if (G.turn >= G.N) { G.turn = 0; G.step++; }
  stopTimer();
  if (G.step >= G.S) startReveal(); else showPass();
}
function submitDraw(auto) {
  const cv = document.getElementById('cv');
  pushLink({ type: 'draw', author: G.turn, content: cv.toDataURL('image/png') });
}
function submitWrite(auto) {
  const v = document.getElementById('txt').value.trim();
  if (!v && !auto) { document.getElementById('txt').focus(); sfx.buzz(); return; }
  pushLink({ type: 'text', author: G.turn, content: v || '(froze up and wrote nothing)' });
}

/* ---------- DRAWING CANVAS ---------- */
const COLORS = ['#111111', '#e63946', '#ff9f1c', '#ffd23f', '#2fbf71', '#1e90ff', '#7b2cbf', '#8b5a2b', '#ff7eb6', '#ffffff'];
function setupCanvas() {
  const cv = document.getElementById('cv'), c = cv.getContext('2d'), stage = document.getElementById('stage');
  c.fillStyle = '#fff'; c.fillRect(0, 0, cv.width, cv.height);
  c.lineCap = 'round'; c.lineJoin = 'round';
  let color = COLORS[0], size = 10, drawing = false, last = null; const undo = [];
  function fit() {
    const w = stage.clientWidth - 12, h = stage.clientHeight - 12, r = cv.width / cv.height;
    let cw = w, ch = w / r; if (ch > h) { ch = h; cw = h * r; }
    cv.style.width = Math.max(120, cw) + 'px'; cv.style.height = Math.max(90, ch) + 'px';
  }
  fit(); window.onresize = fit; setTimeout(fit, 60);
  function pt(e) { const b = cv.getBoundingClientRect(); return { x: (e.clientX - b.left) * cv.width / b.width, y: (e.clientY - b.top) * cv.height / b.height }; }
  function line(a, b) { c.strokeStyle = color; c.lineWidth = size; c.beginPath(); c.moveTo(a.x, a.y); c.lineTo(b.x, b.y); c.stroke(); }
  cv.onpointerdown = e => {
    e.preventDefault(); cv.setPointerCapture(e.pointerId);
    if (undo.length > 14) undo.shift(); undo.push(c.getImageData(0, 0, cv.width, cv.height));
    drawing = true; last = pt(e); line(last, { x: last.x + 0.01, y: last.y });
  };
  cv.onpointermove = e => {
    if (!drawing) return; e.preventDefault();
    const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [];
    (evs.length ? evs : [e]).forEach(ev => { const p = pt(ev); line(last, p); last = p; });
  };
  const end = () => { drawing = false; };
  cv.onpointerup = end; cv.onpointercancel = end; cv.onpointerleave = end;
  const tools = document.getElementById('tools');
  COLORS.forEach((col, i) => {
    const b = document.createElement('button'); b.className = 'sw' + (i === 0 ? ' on' : ''); b.style.background = col; b.setAttribute('aria-label', i === COLORS.length - 1 ? 'Eraser' : 'Color ' + (i + 1));
    if (i === COLORS.length - 1) b.title = 'Eraser';
    b.onclick = () => { color = col; tools.querySelectorAll('.sw').forEach(x => x.classList.toggle('on', x === b)); sfx.click(); };
    tools.appendChild(b);
  });
  tools.insertAdjacentHTML('beforeend', '<span class="sep"></span>');
  [[5, 8], [12, 16], [28, 28]].forEach(([s, vis], i) => {
    const b = document.createElement('button'); b.className = 'sz' + (i === 1 ? ' on' : ''); b.setAttribute('aria-label', 'Brush size ' + (i + 1));
    b.innerHTML = `<i style="width:${vis}px;height:${vis}px"></i>`; if (i === 1) size = s;
    b.onclick = () => { size = s; tools.querySelectorAll('.sz').forEach(x => x.classList.toggle('on', x === b)); sfx.click(); };
    tools.appendChild(b);
  });
  tools.insertAdjacentHTML('beforeend', '<span class="sep"></span>');
  const u = document.createElement('button'); u.className = 'small'; u.textContent = 'Undo';
  u.onclick = () => { const s = undo.pop(); if (s) { c.putImageData(s, 0, 0); sfx.click(); } };
  const cl = document.createElement('button'); cl.className = 'small'; cl.textContent = 'Clear';
  cl.onclick = () => { undo.push(c.getImageData(0, 0, cv.width, cv.height)); c.fillStyle = '#fff'; c.fillRect(0, 0, cv.width, cv.height); sfx.click(); };
  tools.appendChild(u); tools.appendChild(cl);
}

/* ---------- REVEAL ---------- */
function startReveal() {
  stopTimer(); window.onresize = null;
  G.rev = { c: 0, shown: 0 };
  showReveal(true);
}
function scoreChips() {
  const s = scores();
  return `<div class="score">${G.players.map((p, i) => `<span class="chip">${esc(p.name)}<b>${s[i]}</b></span>`).join('')}</div>`;
}
function showReveal(fresh) {
  const { c } = G.rev, ch = G.chains[c];
  const all = G.rev.shown >= ch.links.length;
  const starter = G.players[c].name;
  const linkHtml = (l, i) => {
    const who = l.author != null ? esc(G.players[l.author].name) : '';
    const label = l.type === 'prompt' ? `Original phrase (given to ${esc(starter)})` : l.type === 'draw' ? `${who} drew` : `${who} guessed`;
    const body = l.type === 'draw' ? `<img alt="Drawing by ${who}" src="${l.content}">` : `<div class="say">${l.type === 'text' ? '&ldquo;' + esc(l.content) + '&rdquo;' : esc(l.content)}</div>`;
    const pick = all && l.type !== 'prompt';
    return `<div class="link ${l.type === 'prompt' ? 'orig' : ''} ${pick ? 'canpick' : ''} ${ch.funny === i ? 'crown' : ''}" data-i="${i}" ${fresh === i ? '' : 'style="animation:none"'}>
      ${ch.funny === i ? '<span class="crownbadge">&#9733; FUNNIEST +2</span>' : ''}
      <div class="by">${label}</div>${body}</div>`;
  };
  let html = `<div class="wrap">${scoreChips()}
    <div class="rh">Chain ${c + 1} of ${G.N}</div>
    <div class="rs">Started by ${esc(starter)}</div>`;
  for (let i = 0; i < G.rev.shown; i++) html += linkHtml(ch.links[i], i);
  html += `<div class="bar">`;
  if (!all) {
    html += `<button class="big pink" id="next">Reveal next link (${G.rev.shown + 1}/${ch.links.length})</button>`;
  } else {
    html += `<div class="hintp">Group vote: <b style="color:var(--yellow)">tap the funniest link</b> to crown it (+2 to its author).</div>
      <div class="row">
        <button class="big ${ch.perfect ? 'cyan' : ''}" id="perf" style="${ch.perfect ? '' : 'background:var(--bg2);color:#fff;box-shadow:0 7px 0 #150833'}">${ch.perfect ? '&#10003; Perfect telephone! (+1 each)' : 'Did the message survive? (+1 each)'}</button>
        <button class="big pink" id="nextc">${c + 1 < G.N ? 'Next chain' : 'Final scores'}</button>
      </div>`;
  }
  html += `</div></div>`;
  app.innerHTML = html;
  const scrollEnd = () => { app.scrollTo({ top: app.scrollHeight, behavior: 'smooth' }); };
  if (!all) {
    document.getElementById('next').onclick = () => { G.rev.shown++; sfx.pop(); showReveal(G.rev.shown - 1); setTimeout(scrollEnd, 60); };
  } else {
    app.querySelectorAll('.link.canpick').forEach(el => el.onclick = () => {
      const i = +el.dataset.i; ch.funny = ch.funny === i ? null : i; if (ch.funny != null) sfx.award(); else sfx.click();
      const y = app.scrollTop; showReveal(); app.scrollTop = y;
    });
    document.getElementById('perf').onclick = () => { ch.perfect = !ch.perfect; if (ch.perfect) sfx.award(); else sfx.click(); const y = app.scrollTop; showReveal(); app.scrollTop = y; };
    document.getElementById('nextc').onclick = () => {
      sfx.click();
      if (c + 1 < G.N) { G.rev = { c: c + 1, shown: 0 }; showReveal(); app.scrollTop = 0; }
      else showFinal();
    };
    if (fresh !== undefined) setTimeout(scrollEnd, 60);
  }
  if (fresh === true) app.scrollTop = 0;
}

/* ---------- FINAL ---------- */
function showFinal() {
  const s = scores(), max = Math.max(1, ...s);
  const order = G.players.map((p, i) => ({ name: p.name, pts: s[i] })).sort((a, b) => b.pts - a.pts);
  const top = order[0].pts, winners = order.filter(o => o.pts === top).map(o => o.name);
  app.innerHTML = `<div class="wrap" style="text-align:center">
    <h1 style="margin-top:10px">${top === 0 ? 'NO ONE SCORED!' : winners.length > 1 ? 'IT\'S A <span>TIE!</span>' : '<span>' + esc(winners[0]) + '</span> WINS!'}</h1>
    <p class="sub">${top === 0 ? 'Nobody crowned a link. Chaos wins.' : winners.length > 1 ? esc(winners.join(' & ')) + ' share the doodle crown.' : 'Doodle champion of the evening.'}</p>
    <div class="podium">${order.map((o, i) => `<div class="prank ${o.pts === top && top > 0 ? 'first' : ''}"><div class="n">${i + 1}</div><div class="nm" style="text-align:left">${esc(o.name)}<div class="meter" style="width:${Math.round(o.pts / max * 100)}%"></div></div><div class="pts">${o.pts}</div></div>`).join('')}</div>
    <div class="bar" style="max-width:760px"><div class="row">
      <button class="big pink" id="again">Play Again (same players)</button>
      <button class="big" id="newg" style="background:var(--bg2);color:#fff;box-shadow:0 7px 0 #150833">New Game</button>
    </div></div></div>`;
  sfx.fan(); if (top > 0) confettiGo();
  document.getElementById('again').onclick = () => { sfx.click(); startGame(); };
  document.getElementById('newg').onclick = () => { sfx.click(); showSetup(); };
  app.scrollTop = 0;
}

/* ---------- confetti ---------- */
let cfRAF = null;
function confettiStop() { if (cfRAF) cancelAnimationFrame(cfRAF); cfRAF = null; const c = document.getElementById('confetti'); c.getContext('2d').clearRect(0, 0, c.width, c.height); }
function confettiGo() {
  const c = document.getElementById('confetti'), x = c.getContext('2d'); c.width = innerWidth; c.height = innerHeight;
  const cols = ['#ffd23f', '#ff3d8b', '#2ee6d6', '#5bf28a', '#ffffff', '#ff9f1c'];
  const ps = Array.from({ length: 140 }, () => ({ x: Math.random() * c.width, y: -Math.random() * c.height, w: 8 + Math.random() * 8, h: 5 + Math.random() * 8, vy: 2 + Math.random() * 4, vx: -1.5 + Math.random() * 3, r: Math.random() * 6, vr: -.2 + Math.random() * .4, col: cols[Math.floor(Math.random() * cols.length)] }));
  let t = 0;
  (function frame() {
    x.clearRect(0, 0, c.width, c.height);
    ps.forEach(p => { p.x += p.vx; p.y += p.vy; p.r += p.vr; x.save(); x.translate(p.x, p.y); x.rotate(p.r); x.fillStyle = p.col; x.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); x.restore(); });
    if (++t < 360) cfRAF = requestAnimationFrame(frame); else confettiStop();
  })();
}

showSetup();
</script>
