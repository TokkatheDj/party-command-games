<!-- CONCEPT: TEAM RELAY (push-your-luck comparison relay) - "Bucket Brigade": teams take timed shifts passing one phone down their line; each runner picks which of two things is heavier / older / faster / bigger / hotter (151 surprising fact pairs in 8 categories), every right answer in a row adds MORE water to the team bucket (+1, +2, +3...), any runner can POUR to bank the bucket into the team's tank, but one wrong answer - or the whistle - spills it all; a bucket brimming after 6 right auto-pours with a bonus. Round twists (Leaky Bucket, Heatwave, Golden Pail, Rival's Pick category, Small Bucket), double-water FIRE! final round, used questions remembered across games, tank scoreboard, awards | Players: 4-12 in 2-4 teams | ~15-25 min [style: Comic Panel / sound: Cartoon FX] -->

<head>

<style>
:root{

  --water:#2f7fd8; --deep:#0b5394; --good:#1e7a3c; --bad:#c8102e;
  --dot:#eadfb4; --off:#ece4c8;
  --head:'Bangers','Arial Black','Impact',sans-serif;
  --body:'Comic Neue','Comic Sans MS','Chalkboard SE','Trebuchet MS',cursive;
}
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none}
body{background-color:var(--bg);background-image:radial-gradient(var(--dot) 1.7px,transparent 1.9px);background-size:14px 14px;color:var(--ink);font-family:var(--body);font-size:clamp(15px,3.8vw,19px)}
h1,h2,h3,.head{font-family:var(--head);font-weight:900;font-synthesis:none;letter-spacing:1px;margin:0}
input{user-select:text;-webkit-user-select:text}
button{font-family:inherit;cursor:pointer}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#app{position:relative;height:100%}
.screen{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:12px 12px 24px;display:flex;flex-direction:column;align-items:center}
.screen[hidden]{display:none}
.wrap{width:100%;max-width:760px;display:flex;flex-direction:column;gap:12px}
.panel{background:var(--panel);border:4px solid var(--ink);box-shadow:5px 5px 0 var(--ink);border-radius:4px;padding:12px 14px}
.hero{text-align:center;position:relative;padding-top:16px}
.hero h1{font-size:clamp(44px,13vw,84px);color:var(--btn);text-shadow:3px 3px 0 var(--ink);line-height:1}
.sub{margin:8px 0 4px;font-weight:700}
.meta{margin:4px 0 0;color:var(--muted);font-weight:700}
.topright{position:absolute;top:8px;right:8px}
.bubble{position:relative;background:#fff;border:3px solid var(--ink);border-radius:18px;padding:10px 14px;font-weight:700;line-height:1.35}
.bubble::after{content:"";position:absolute;left:28px;bottom:-14px;border:7px solid transparent;border-top:9px solid var(--ink)}
.how h2,.setup h2{font-size:clamp(22px,6vw,30px);margin-bottom:8px}
.setup h3{font-size:clamp(18px,4.8vw,22px);margin:12px 0 6px}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button,.chipbtn{min-width:56px;min-height:48px;padding:6px 12px;background:#fff;color:var(--ink);border:3px solid var(--ink);font-weight:700;font-size:clamp(16px,4.2vw,20px);box-shadow:3px 3px 0 var(--ink);border-radius:4px}
.seg button[aria-pressed="true"],.chipbtn[aria-pressed="true"]{background:var(--deep);color:#fff}
.names{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.names label{display:flex;flex-direction:column;font-weight:700;font-size:14px;gap:3px}
.names input{font-family:var(--body);font-size:17px;font-weight:700;padding:8px;border:3px solid var(--ink);border-radius:4px;min-height:44px;width:100%;color:var(--ink);background:#fff}
.btn{background:var(--btn);color:var(--btnText);border:4px solid var(--ink);font-family:var(--head);font-weight:900;font-synthesis:none;letter-spacing:1px;font-size:clamp(22px,6vw,30px);padding:10px 18px;min-height:60px;box-shadow:4px 4px 0 var(--ink);border-radius:4px}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.btn.alt{background:var(--hi);color:var(--ink)}
.btn.blue{background:var(--deep);color:#fff}
.btn:disabled{background:var(--off);color:var(--muted);box-shadow:none;cursor:default;transform:none}
.big{width:100%}
.foot{color:var(--muted);font-size:14px;text-align:center;margin:0}
.icon{width:48px;height:48px;min-width:48px;border:3px solid var(--ink);background:#fff;color:var(--ink);font-size:22px;border-radius:4px;box-shadow:2px 2px 0 var(--ink);padding:0}
.icon[aria-pressed="true"]{background:var(--deep);color:#fff}
/* intro */
.kicker{font-weight:700;color:var(--muted);margin:0 0 4px}
.teamban{display:inline-block;color:#fff;padding:6px 14px;border:4px solid var(--ink);font-size:clamp(30px,9vw,52px);transform:rotate(-1.5deg);box-shadow:4px 4px 0 var(--ink)}
.twist{display:flex;gap:12px;align-items:center;background:var(--hi);border:4px solid var(--ink);padding:10px 12px;border-radius:4px}
.twist .ti{font-size:40px}
.twist h2{font-size:clamp(22px,6vw,28px)}
.twist p{margin:2px 0 0;font-weight:700}
.fire{background:var(--btn);color:#fff;border:4px solid var(--ink);padding:8px 12px;font-weight:700;border-radius:4px}
.fire b{font-family:var(--head);font-weight:900;font-synthesis:none;font-size:24px;letter-spacing:1px}
.picks{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
/* tanks */
.tanks{display:flex;gap:10px;justify-content:center;align-items:flex-end;padding:4px 0}
.tank{flex:1;max-width:150px;text-align:center;min-width:0}
.tank .nm{color:#fff;border:3px solid var(--ink);padding:3px 4px;font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vessel{height:clamp(80px,20vh,150px);border:4px solid var(--ink);border-top:0;background:#fff;position:relative;border-radius:0 0 12px 12px;overflow:hidden;margin:0 6px}
.water{position:absolute;left:0;right:0;bottom:0;background:var(--water);border-top:4px solid var(--deep);transition:height .7s ease-out}
.tank .num{font-family:var(--head);font-weight:900;font-synthesis:none;font-size:clamp(26px,7vw,38px);line-height:1.1}
.tank.lead .num::after{content:" 👑"}
/* play */
.play{padding-top:8px}
.play .wrap{gap:8px;min-height:100%}
.topbar{display:flex;align-items:center;gap:8px}
.teamchip{flex:1;min-width:0;color:#fff;border:3px solid var(--ink);padding:4px 8px;font-weight:700;line-height:1.15;border-radius:4px}
.teamchip .tn{font-family:var(--head);font-weight:900;font-synthesis:none;font-size:clamp(18px,5vw,26px);letter-spacing:1px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.teamchip .tk{font-size:14px}
.clock{font-family:var(--head);font-weight:900;font-synthesis:none;font-size:clamp(30px,9vw,46px);background:#fff;border:3px solid var(--ink);padding:0 10px;min-width:92px;text-align:center;border-radius:4px;line-height:48px}
.clock.low{color:var(--bad)}
.tags{display:flex;gap:6px;flex-wrap:wrap;font-weight:700;font-size:14px}
.tag{background:#fff;border:2px solid var(--ink);padding:2px 8px;border-radius:12px}
.tag.y{background:var(--hi)}
.tag.r{background:var(--btn);color:#fff}
.bucketrow{display:flex;align-items:center;gap:12px;padding:10px 12px}
.bucket{position:relative;width:62px;height:66px;flex:none;border:4px solid var(--ink);border-top-width:5px;border-radius:2px 2px 16px 16px;background:#fff;overflow:hidden;margin-top:10px}
.bucket .fill{position:absolute;left:0;right:0;bottom:0;background:var(--water);border-top:3px solid var(--deep);transition:height .35s}
.bwrap{position:relative;flex:none}
.bwrap::before{content:"";position:absolute;left:8px;right:8px;top:-2px;height:24px;border:4px solid var(--ink);border-bottom:0;border-radius:30px 30px 0 0}
.binfo{flex:1;min-width:0}
.drops{font-weight:700}
.drops b{font-family:var(--head);font-weight:900;font-synthesis:none;font-size:clamp(30px,8vw,40px);letter-spacing:1px}
.ladder{display:flex;gap:4px;margin-top:4px;flex-wrap:wrap}
.ladder span{min-width:30px;height:26px;border:2px solid var(--ink);background:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;border-radius:4px;padding:0 3px}
.ladder span.done{background:var(--deep);color:#fff}
.ladder span.next{background:var(--hi)}
.pour{flex:none;width:clamp(96px,26vw,140px);min-height:76px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;padding:6px}
.pour small{font-family:var(--body);font-size:14px;letter-spacing:0;font-weight:700;margin-top:4px}
.pour.warn{animation:nudge 1s ease-in-out infinite}
@keyframes nudge{50%{transform:scale(1.06)}}
.runner{font-weight:700;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:0 2px}
.runner .pmsg{color:var(--deep)}
.card{display:flex;flex-direction:column;gap:10px;padding:14px}
.card.gold{background:#fff3b8}
.card .bubble{font-family:var(--head);font-weight:900;font-synthesis:none;letter-spacing:1px;font-size:clamp(26px,7.5vw,40px);text-align:center;font-weight:400}
.goldtag{align-self:center;background:var(--hi);border:3px solid var(--ink);padding:2px 10px;font-weight:700}
.opt{width:100%;min-height:78px;text-align:left;background:#fff;color:var(--ink);border:4px solid var(--ink);box-shadow:4px 4px 0 var(--ink);font-weight:700;font-size:clamp(18px,5vw,26px);padding:10px 14px;border-radius:4px;line-height:1.2}
.opt:active{background:var(--hi)}
.opt.small{min-height:52px;font-size:clamp(15px,4vw,19px);box-shadow:none;cursor:default}
.opt.small:active{background:#fff}
.opt.right,.opt.right:active{background:var(--good);color:#fff}
.opt.miss,.opt.miss:active{background:var(--bad);color:#fff}
.or{text-align:center;font-family:var(--head);font-weight:900;font-synthesis:none;font-size:22px;margin:-4px 0}
.res{text-align:center}
.res .bigword{font-family:var(--head);font-weight:900;font-synthesis:none;font-size:clamp(36px,10vw,64px);line-height:1;letter-spacing:2px}
.res.ok .bigword{color:var(--good)}
.res.bad .bigword{color:var(--bad)}
.res p{margin:4px 0 0;font-weight:700}
.fact{margin:0;background:#fff8dc;border:2px dashed var(--ink);padding:8px 10px;font-weight:700;border-radius:4px}
.shake{animation:shake .45s}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
.overlay{position:absolute;inset:0;background:#fff8dc;display:flex;align-items:center;justify-content:center;padding:16px;z-index:5}
.overlay[hidden]{display:none}
.overlay .panel{max-width:420px;width:100%;display:flex;flex-direction:column;gap:10px;text-align:center}
/* summary / end */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.stat{border:3px solid var(--ink);padding:8px;text-align:center;background:#fff;border-radius:4px}
.stat b{display:block;font-family:var(--head);font-weight:900;font-synthesis:none;font-size:32px;letter-spacing:1px}
.stat span{font-weight:700;font-size:14px;color:var(--muted)}
.winner{text-align:center}
.winner h1{font-size:clamp(40px,12vw,72px);color:var(--btn);text-shadow:3px 3px 0 var(--ink);line-height:1}
.awards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.award{border:3px solid var(--ink);background:#fff;padding:8px 10px;border-radius:4px;transform:rotate(-0.6deg)}
.award:nth-child(even){transform:rotate(0.8deg)}
.award h2{font-size:22px}
.award p{margin:2px 0 0;font-weight:700}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>.btn{flex:1;min-width:150px}
@media (prefers-reduced-motion: reduce){
  .pour.warn,.shake{animation:none}
  .water,.bucket .fill{transition:none}
}
@media (max-height:720px){
  .bucketrow{padding:6px 10px}
  .bucket{height:54px}
  .card{padding:10px;gap:8px}
  .opt.small{min-height:44px;padding:6px 10px}
  .fact{padding:6px 8px}
  .tags{font-size:13px}
}
@media (max-height:620px){
  .opt{min-height:64px}
}
</style>
</head>

/* ---------- SOUND: Cartoon FX kit ---------- */
let AC=null, master=null, noiseBuf=null;
function audio(){
  if (!AC) {
    const C = window.AudioContext || window.webkitAudioContext;
    if (!C) return null;
    try {
      AC = new C();
      const comp = AC.createDynamicsCompressor();
      comp.threshold.value = -14; comp.ratio.value = 4;
      master = AC.createGain(); master.gain.value = muted ? 0 : 0.8;
      master.connect(comp); comp.connect(AC.destination);
      noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i=0;i<d.length;i++) d[i] = Math.random()*2-1;
    } catch(e) { AC=null; return null; }
  }
  if (AC.state === 'suspended') AC.resume();
  return AC;
}
function env(t0, att, peak, dur){
  const g = AC.createGain();
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(peak, t0+att);
  g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
  g.connect(master); return g;
}
// "boing" / slide-whistle voice: pitch glide with vibrato
function glide(f0, f1, dur, vol=0.3, when=0, type='sine', vib=11, depth=0.05){
  const a = audio(); if (!a) return;
  const t = a.currentTime + when;
  const o = a.createOscillator(); o.type = type;
  o.frequency.setValueAtTime(f0, t);
  o.frequency.exponentialRampToValueAtTime(f1, t + dur*0.7);
  const lfo = a.createOscillator(); lfo.frequency.value = vib;
  const lg = a.createGain(); lg.gain.value = Math.max(f0,f1)*depth;
  lfo.connect(lg); lg.connect(o.frequency);
  const g = env(t, 0.012, vol, dur);
  o.connect(g); o.start(t); lfo.start(t); o.stop(t+dur+0.05); lfo.stop(t+dur+0.05);
}
function noise(dur, type, f, q, vol, when=0, f2=0){
  const a = audio(); if (!a) return;
  const t = a.currentTime + when;
  const s = a.createBufferSource(); s.buffer = noiseBuf;
  const fl = a.createBiquadFilter(); fl.type = type; fl.Q.value = q;
  fl.frequency.setValueAtTime(f, t);
  if (f2) fl.frequency.exponentialRampToValueAtTime(f2, t+dur);
  const g = env(t, 0.006, vol, dur);
  s.connect(fl); fl.connect(g); s.start(t); s.stop(t+dur+0.05);
}
function pop(vol=0.3, when=0, f=900){
  noise(0.04, 'bandpass', 1800, 1.2, vol*0.8, when);
  const a = audio(); if (!a) return;
  const t = a.currentTime + when;
  const o = a.createOscillator(); o.type = 'sine';
  o.frequency.setValueAtTime(f, t); o.frequency.exponentialRampToValueAtTime(f*1.6, t+0.04);
  const g = env(t, 0.005, vol, 0.05); o.connect(g); o.start(t); o.stop(t+0.08);
}
const SFX = {
  tap(){ pop(0.25); },
  motif(){ [523,659,784,1047].forEach((f,i)=>glide(f*0.8, f, 0.2, 0.28, i*0.13)); },
  right(k){ pop(0.25); glide(200+k*30, 600+k*60, 0.32, 0.3, 0.03); },
  splash(){ noise(0.7, 'lowpass', 4500, 0.8, 0.5, 0, 250); glide(820, 170, 0.75, 0.22, 0.05, 'triangle', 6, 0.04); },
  pour(){ for (let i=0;i<6;i++) glide(560-i*45, 330-i*30, 0.1, 0.18, i*0.07); noise(0.55, 'bandpass', 900, 2, 0.22, 0, 300); },
  brim(){ SFX.pour(); glide(400, 1400, 0.6, 0.22, 0.45, 'triangle', 7, 0.03); },
  drip(){ glide(900, 1700, 0.09, 0.16); },
  tick(){ pop(0.12, 0, 1300); },
  whistle(){ glide(2100, 2000, 0.55, 0.16, 0, 'triangle', 28, 0.04); },
  win(){ SFX.motif(); glide(400, 1600, 0.8, 0.2, 0.6, 'triangle', 7, 0.03); pop(0.25, 1.4); pop(0.25, 1.55); }

function planTwists(n){
  const keys = shuffle(Object.keys(TWISTS));
  const plan = [];
  for (let r=1;r<=n;r++) plan.push(r===1 || !cfg.twists ? null : keys[(r-2)%keys.length]);
  return plan;
}
function newGame(){
  cfg = sanitizeCfg(cfg); save('setup', cfg);
  G = {
    teams: cfg.names.slice(0,cfg.teams).map((n,i)=>({
      name: n.trim() || DEFAULT_NAMES[i], color: TEAM_COLORS[i], tank: 0,
      st: {poured:0, bestPour:0, bestStreak:0, splashes:0, spilled:0, correct:0, answered:0}
    })),
    round: 1, ti: 0, plan: planTwists(cfg.shifts), used: new Set(), pick: null, pickOpts: []
  };

}

      <div class="topright" style="position:static;display:flex;justify-content:flex-end">${muteBtn()}</div>
      <p class="kicker">Round ${G.round} of ${cfg.shifts} · Shift for</p>
      <h1 class="teamban" style="background:${t.color}">${esc(t.name)}</h1>
      <p style="font-weight:700;margin:12px 0 0">🏃 Line up ${cfg.runners} runners! Runner 1 takes the phone. After each card, pass it to the next runner.</p>
    </div>
    ${twistHTML}
    ${fire ? `<div class="fire"><b>🔥 FIRE! Final round</b><br>Everything poured this round counts DOUBLE.</div>` : ''}
    ${pickHTML}
    <div class="panel">${tanksHTML(G.ti)}</div>
    <button class="btn big" data-act="go" ${tw==='pick'?'disabled':''}>${tw==='pick'?'Waiting for the rival pick...':'Start the clock! ⏱'}</button>
  </div>`;
  show('scrIntro');
}

function startShift(){
  const tw = G.plan[G.round-1];
  S = {
    tw, fire: G.round === cfg.shifts, cat: G.pick,
    tLeft: (cfg.clock - (tw==='heat'?15:0)) * 1000,
    bucket: 0, streak: 0, runner: 1, phase: 'ask', n: 0, cap: tw==='small' ? 4 : 6,
    leak: 0, last: performance.now(), paused: false, lastSec: null,
    poured: 0, spilled: 0, right: 0, asked: 0, res: null, lastPour: null, gold: false
  };
  drawCard();
  show('scrPlay'); renderPlay(); SFX.motif();
  say(`${G.teams[G.ti].name}, go! ${promptFor(S.card)}`);
  clearInterval(timer); timer = setInterval(tick, 100);
}

function drawCard(){
  let used = new Set(load('used', []));
  const fits = q => !S.cat || q.c === S.cat;
  let pool = Q.filter(q => fits(q) && !G.used.has(q.id) && !used.has(q.id));
  if (!pool.length) { used = new Set(); pool = Q.filter(q => fits(q) && !G.used.has(q.id)); }
  if (!pool.length) pool = Q.filter(q => !G.used.has(q.id));        // category exhausted: mix it up
  if (!pool.length) { G.used.clear(); pool = Q.slice(); }
  const q = pool[Math.random()*pool.length | 0];
  G.used.add(q.id); used.add(q.id); save('used', [...used]);
  S.n++; S.gold = S.tw === 'gold' && S.n % 3 === 0;
  S.card = {...q, flip: Math.random() < 0.5};
  S.res = null;
}

function nextAdd(){ return S.streak + 1 + (S.tw==='heat' ? 1 : 0); }

function renderPlay(){
  const t = G.teams[G.ti], q = S.card;
  const opts = q.flip ? [q.b, q.a] : [q.a, q.b];
  const rightDisp = q.flip ? 1 - q.ans : q.ans;
  const maxDrops = S.cap*(S.cap+1)/2 + (S.tw==='heat' ? S.cap : 0) + BRIM_BONUS;
  const fillPct = Math.min(100, Math.round(S.bucket / maxDrops * 100));
  const ladder = Array.from({length:S.cap}, (_,i)=>{
    const k=i+1, v=k+(S.tw==='heat'?1:0);
    return `<span class="${k<=S.streak?'done':k===S.streak+1?'next':''}">+${v}</span>`;
  }).join('');
  const lowTime = S.tLeft <= 10000;
  const tags = [
    `<span class="tag">Round ${G.round}/${cfg.shifts}</span>`,
    S.cat ? `<span class="tag">${CATS[S.cat].icon} ${CATS[S.cat].name}</span>` : '',
    S.tw ? `<span class="tag y">${TWISTS[S.tw].icon} ${TWISTS[S.tw].name}</span>` : '',
    S.fire ? `<span class="tag r">🔥 FIRE ×2</span>` : ''
  ].join('');
  let cardHTML;
  if (S.phase === 'ask') {
    cardHTML = `<section class="card panel${S.gold?' gold':''}" aria-label="Question">
      ${S.gold ? `<div class="goldtag">⭐ GOLD CARD - triple drops!</div>` : ''}
      <div class="bubble">${esc(promptFor(q))}</div>
      <button class="opt" data-act="ans" data-i="0">${esc(opts[0])}</button>
      <div class="or" aria-hidden="true">- OR -</div>
      <button class="opt" data-act="ans" data-i="1">${esc(opts[1])}</button>
    </section>`;
  } else {
    const r = S.res;
    const word = r.ok ? (r.brim ? 'BRIM FULL!' : 'SPLOOSH!') : 'SPLASH!';
    const detail = r.ok
      ? (r.brim ? `Right! +${r.add} and +${BRIM_BONUS} bonus - auto-poured ${r.pourAmt} into the tank!` : `Right! +${r.add} drop${r.add>1?'s':''} in the bucket.`)
      : (r.lost ? `Wrong - ${r.lost} drop${r.lost>1?'s':''} spilled on the floor!` : 'Wrong - luckily the bucket was empty.');
    const nextRunner = S.runner % cfg.runners + 1;
    cardHTML = `<section class="card panel${r.ok?'':' shake-me'}" aria-label="Result">
      <div class="res ${r.ok?'ok':'bad'}"><div class="bigword">${word}</div><p>${detail}</p></div>
      ${opts.map((o,i)=>`<div class="opt small ${i===rightDisp?'right':(i===S.pickedDisp?'miss':'')}">${i===rightDisp?'✔ ':(i===S.pickedDisp?'✘ ':'')}${esc(o)}</div>`).join('')}
      <p class="fact">💡 ${esc(q.fact)}</p>
      <button class="btn blue big" data-act="next">Pass it on ➜ Runner ${nextRunner}</button>
    </section>`;
  }
  const pmsg = S.lastPour ? `<span class="pmsg">💦 Last pour: +${S.lastPour.amt}</span>` : '';
  $('#scrPlay').innerHTML = `<div class="wrap">
    <div class="topbar">
      <div class="teamchip" style="background:${t.color}"><span class="tn">${esc(t.name)}</span><span class="tk">Tank: ${t.tank}</span></div>
      <div class="clock${lowTime?' low':''}" id="clock" role="timer" aria-label="Time left">${fmt(S.tLeft)}</div>
      <button class="icon" data-act="pause" aria-label="Pause">⏸</button>
      ${muteBtn()}
    </div>
    <div class="tags">${tags}</div>
    <div class="panel bucketrow">
      <div class="bwrap" aria-hidden="true"><div class="bucket"><div class="fill" id="fill" style="height:${fillPct}%${fillPct?'':';border-top-width:0'}"></div></div></div>
      <div class="binfo">
        <div class="drops"><b id="drops">${S.bucket}</b> in the bucket</div>
        <div class="ladder" aria-hidden="true">${ladder}</div>
        <span class="sr">Next right answer adds ${nextAdd()}${S.gold?', tripled':''}.</span>
      </div>
      <button class="btn pour${lowTime&&S.bucket>0?' warn':''}" id="pourBtn" data-act="pour" ${S.bucket>0?'':'disabled'}>POUR<small>${S.bucket>0?(S.fire?`bank ${S.bucket*2}`:'bank it'):'empty'}</small></button>
    </div>
    <div class="runner"><span>🏃 Runner ${S.runner} of ${cfg.runners}${S.phase==='ask'?' - your card!':''}</span>${pmsg}</div>
    ${cardHTML}
  </div>
  <div class="overlay" id="pauseOv" ${S.paused?'':'hidden'}>
    <div class="panel"><h2 style="font-size:40px">Paused</h2>
      <p style="margin:0;font-weight:700">The clock is stopped.</p>
      <button class="btn big" data-act="resume">Resume ▶</button>
      <button class="btn alt big" data-act="endshift">Blow the whistle now</button>
      <button class="btn blue big" data-act="quit">Quit to setup</button>
    </div>
  </div>`;
  if (S.phase === 'reveal') { const sc = $('#scrPlay'); sc.scrollTop = sc.scrollHeight; }
  if (!reduced) { const c = $('#scrPlay .shake-me'); if (c && S.res && !S.res.shaken) { S.res.shaken = true; c.classList.add('shake'); } }
}

function renderClock(){
  const c = $('#clock'); if (!c) return;
  c.textContent = fmt(S.tLeft);
  const low = S.tLeft <= 10000;
  c.classList.toggle('low', low);
  const p = $('#pourBtn'); if (p) p.classList.toggle('warn', low && S.bucket > 0);
}

function tick(){
  if (!S || S.phase === 'over') return;
  const now = performance.now();
  if (S.paused) { S.last = now; return; }
  const dt = Math.min(500, now - S.last); S.last = now;
  S.tLeft -= dt;
  if (S.tw === 'leaky') {
    S.leak += dt;
    if (S.leak >= 8000) {
      S.leak -= 8000;
      if (S.bucket > 0) {
        S.bucket--; SFX.drip();
        const d = $('#drops'); if (d) d.textContent = S.bucket;
        if (S.bucket === 0) renderPlay();
      }
    }
  }
  const sec = Math.ceil(S.tLeft / 1000);
  if (sec !== S.lastSec) { S.lastSec = sec; if (sec <= 5 && sec > 0) SFX.tick(); renderClock(); }
  if (S.tLeft <= 0) endShift();
}

function answer(d){
  if (!S || S.phase !== 'ask' || S.paused) return;
  const q = S.card, t = G.teams[G.ti];
  const ok = (q.flip ? 1 - d : d) === q.ans;
  S.asked++; t.st.answered++; S.pickedDisp = d;
  if (ok) {
    S.streak++; S.right++; t.st.correct++;
    t.st.bestStreak = Math.max(t.st.bestStreak, S.streak);
    let add = S.streak + (S.tw==='heat' ? 1 : 0);
    if (S.gold) add *= 3;
    S.bucket += add;
    S.res = {ok:true, add};
    if (S.streak >= S.cap) {
      S.bucket += BRIM_BONUS;
      S.res.brim = true;
      S.res.pourAmt = pour(true);
      SFX.brim();
    } else SFX.right(S.streak);
  } else {
    const lost = S.bucket;
    S.res = {ok:false, lost};
    t.st.splashes++; t.st.spilled += lost; S.spilled += lost;
    S.bucket = 0; S.streak = 0;
    SFX.splash();
  }
  S.phase = 'reveal';
  renderPlay();
  say(`${ok?'Right!':'Wrong!'} ${q.fact} Bucket: ${S.bucket}.`);
}

function pour(auto){
  if (!S || S.bucket <= 0 || S.phase === 'over' || S.paused) return 0;
  const t = G.teams[G.ti], amt = S.bucket * (S.fire ? 2 : 1);
  t.tank += amt; t.st.poured += amt; t.st.bestPour = Math.max(t.st.bestPour, amt); S.poured += amt;
  S.bucket = 0; S.streak = 0; S.lastPour = {amt};
  if (!auto) { SFX.pour(); renderPlay(); say(`Poured ${amt} into the tank. Tank: ${t.tank}.`); }
  return amt;
}

function nextRunner(){
  if (!S || S.phase !== 'reveal' || S.paused) return;
  S.runner = S.runner % cfg.runners + 1;
  drawCard(); S.phase = 'ask';
  SFX.tap(); renderPlay();
  say(`Runner ${S.runner}: ${promptFor(S.card)}`);
}

function endShift(){
  if (!S || S.phase === 'over') return;
  clearInterval(timer); timer = null;
  const t = G.teams[G.ti];
  const lost = S.bucket;
  S.dropped = lost; S.spilled += lost; t.st.spilled += lost; S.bucket = 0;
  S.phase = 'over'; S.paused = false;
  SFX.whistle();
  const last = G.ti === G.teams.length-1 && G.round === cfg.shifts;
  let nextLabel;
  if (last) nextLabel = 'See who wins! 🏆';
  else {
    const ni = (G.ti+1) % G.teams.length;
    nextLabel = `Next: ${esc(G.teams[ni].name)} ➜`;
  }
  $('#scrSum').innerHTML = `<div class="wrap">
    <div class="panel" style="text-align:center">
      <h1 style="font-size:clamp(44px,13vw,72px);color:var(--btn);text-shadow:3px 3px 0 #111">TWEEET!</h1>
      <p style="font-weight:700;margin:4px 0 0">${esc(t.name)}'s shift is over${lost?` - and ${lost} drop${lost>1?'s were':' was'} still in the bucket. Spilled!`:'.'}</p>
    </div>
    <div class="stats">
      <div class="stat"><b>${S.asked}</b><span>cards answered</span></div>
      <div class="stat"><b>${S.right}</b><span>right answers</span></div>
      <div class="stat"><b>${S.poured}</b><span>poured into the tank${S.fire?' (×2 fire)':''}</span></div>
      <div class="stat"><b>${S.spilled}</b><span>drops spilled</span></div>
    </div>
    <div class="panel">${tanksHTML(G.ti)}</div>
    <button class="btn big" data-act="advance">${nextLabel}</button>
  </div>`;
  show('scrSum');
  say(`Time! ${t.name} poured ${S.poured}. Tank: ${t.tank}.`);
}

function advance(){
  G.ti++;
  if (G.ti >= G.teams.length) { G.ti = 0; G.round++; }
  if (G.round > cfg.shifts) showEnd(); else showIntro();
}

function showEnd(){
  S = null;
  const ranked = G.teams.slice().sort((a,b)=>b.tank-a.tank);
  const top = ranked[0].tank;
  const winners = ranked.filter(t=>t.tank===top);
  const title = winners.length > 1 ? "It's a soggy tie!" : `${esc(winners[0].name)} win!`;
  const best = (fn, minOk=()=>true) => {
    let b=null, bv=-Infinity;
    G.teams.forEach(t=>{ if(!minOk(t)) return; const v=fn(t); if(v>bv){bv=v;b=t;} });
    return b ? {t:b, v:bv} : null;
  };
  const acc = best(t=>t.st.correct/t.st.answered, t=>t.st.answered>0);
  const pourA = best(t=>t.st.bestPour);
  const streakA = best(t=>t.st.bestStreak);
  const soaked = best(t=>t.st.spilled);
  const awards = [];
  if (acc && acc.v > 0) awards.push(['🎯 Steady Hands', `${acc.t.name} - ${Math.round(acc.v*100)}% right`]);
  if (pourA && pourA.v>0) awards.push(['🪣 Biggest Pour', `${pourA.t.name} - ${pourA.v} drops in one go`]);
  if (streakA && streakA.v>0) awards.push(['🔥 Hot Streak', `${streakA.t.name} - ${streakA.v} right in a row`]);
  if (soaked && soaked.v>0) awards.push(['💦 Totally Soaked', `${soaked.t.name} - spilled ${soaked.v} drops`]);
  $('#scrEnd').innerHTML = `<div class="wrap">
    <div class="panel winner">
      <div class="topright" style="position:static;display:flex;justify-content:flex-end">${muteBtn()}</div>
      <p class="kicker">The tanks are full!</p>
      <h1>${title}</h1>
      <p style="font-weight:700;margin:6px 0 0">${winners.length>1 ? winners.map(w=>esc(w.name)).join(' & ')+' tie on '+top+' drops.' : `${top} drops in the tank.`}</p>
    </div>
    <div class="panel">${tanksHTML()}</div>
    <div class="awards">${awards.map(a=>`<div class="award"><h2>${a[0]}</h2><p>${esc(a[1])}</p></div>`).join('')}</div>
    <div class="row">
      <button class="btn" data-act="rematch">Rematch 🔁</button>
      <button class="btn alt" data-act="setup">New teams</button>
    </div>
  </div>`;
  show('scrEnd');
  SFX.win();
  say(`${winners.map(w=>w.name).join(' and ')} ${winners.length>1?'tie':'win'} with ${top} drops.`);
}

function setPaused(p){
  if (!S || S.phase === 'over') return;
  S.paused = p; S.last = performance.now();
  const ov = $('#pauseOv'); if (ov) ov.hidden = !p;
  if (p) { const b = ov && ov.querySelector('[data-act="resume"]'); if (b) b.focus(); }
}

/* ---------- input ---------- */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b || b.disabled) return;
  audio();
  const act = b.dataset.act;
  switch (act) {
    case 'mute': setMuted(!muted); if (!muted) SFX.tap(); break;
    case 'set': {
      cfg[b.dataset.k] = +b.dataset.v; save('setup', cfg); SFX.tap(); renderSetup();
      const again = document.querySelector(`[data-act="set"][data-k="${b.dataset.k}"][data-v="${b.dataset.v}"]`); if (again) again.focus();
      break;
    }
    case 'twists': cfg.twists = !cfg.twists; save('setup', cfg); SFX.tap(); renderSetup(); { const t=$('[data-act="twists"]'); if(t) t.focus(); } break;
    case 'start': SFX.motif(); newGame(); break;
    case 'pick': {
      G.pick = b.dataset.c; SFX.tap();
      document.querySelectorAll('[data-act="pick"]').forEach(x=>x.setAttribute('aria-pressed', String(x===b)));
      const go = $('[data-act="go"]'); go.disabled = false; go.textContent = `Start the clock! ⏱ (${CATS[G.pick].name})`;
      break;
    }
    case 'go': startShift(); break;
    case 'ans': answer(+b.dataset.i); break;
    case 'pour': pour(false); break;
    case 'next': nextRunner(); break;
    case 'pause': setPaused(true); SFX.tap(); break;
    case 'resume': setPaused(false); SFX.tap(); break;
    case 'endshift': S.paused = false; endShift(); break;
    case 'quit': clearInterval(timer); timer=null; S=null; G=null; renderSetup(); show('scrSetup'); break;
    case 'advance': SFX.tap(); advance(); break;
    case 'rematch': SFX.motif(); newGame(); break;
    case 'setup': renderSetup(); show('scrSetup'); break;
  }
});

document.addEventListener('keydown', e => {
  if (e.target.closest && e.target.closest('input,textarea,select')) return;
  if (!S || $('#scrPlay').hidden) return;
  const k = e.key.toLowerCase();
  if (S.paused) { if (k==='escape') { setPaused(false); e.preventDefault(); } return; }
  if (S.phase === 'ask' && (k==='a' || k==='1' || k==='arrowleft')) { audio(); answer(0); e.preventDefault(); }
  else if (S.phase === 'ask' && (k==='l' || k==='2' || k==='arrowright')) { audio(); answer(1); e.preventDefault(); }
  else if (k===' ' || k==='p') { audio(); pour(false); e.preventDefault(); }
  else if (S.phase === 'reveal' && k==='enter') { nextRunner(); e.preventDefault(); }
  else if (k==='escape') { setPaused(true); e.preventDefault(); }
});

document.addEventListener('visibilitychange', () => { if (document.hidden && S && S.phase !== 'over') setPaused(true); });

renderSetup();
show('scrSetup');
/* 27 Nov 2026: a double-tap must not press whatever button the next screen puts under the finger.
   A tap on a button is ignored if it lands within 400 ms and a fingertip's width of a tap on another button that has since left the screen.
   Buttons inside an element marked data-rapid are left alone (fast-tap play areas). */
(function () { let t0 = 0, el = null, x0 = 0, y0 = 0;
  document.addEventListener('click', e => { const b = e.target.closest && e.target.closest('button');
    if (!b || b.closest('[data-rapid]') || (!e.detail && !e.clientX && !e.clientY)) return;
    const now = performance.now(), gone = el && !(el.isConnected && el.getClientRects().length);
    if (now - t0 < 400 && b !== el && gone && Math.hypot(e.clientX - x0, e.clientY - y0) < 56) { e.stopPropagation(); e.preventDefault(); return; }
    t0 = now; el = b; x0 = e.clientX; y0 = e.clientY; }, true); })();
</script>
</body>
</html>
