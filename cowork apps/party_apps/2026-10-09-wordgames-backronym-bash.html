<!-- CONCEPT: WORD GAMES (acronym invention) - Backronym Bash: a random acronym + silly theme appear, everyone secretly writes what the letters stand for on a passed-around device, answers are revealed anonymously and the group votes for the funniest. 3-10 players, ~15-20 min. -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Backronym Bash</title>
<style>
:root{
  --bg:#150f3a; --bg2:#241a63; --card:#2f2386; --ink:#ffffff; --muted:#c9c2ff;
  --yellow:#ffe14d; --pink:#ff4fa3; --cyan:#3be8ff; --green:#4dff9a; --orange:#ff9a3c; --red:#ff5a5a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:radial-gradient(circle at 20% 0%,var(--bg2),var(--bg) 60%);color:var(--ink);
  font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center}
#app{width:100%;max-width:1100px;padding:18px 20px 40px;flex:1;display:flex;flex-direction:column}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:6px;min-height:44px}
.logo{font-weight:900;font-size:clamp(18px,2.6vw,26px);letter-spacing:.04em;color:var(--yellow);text-transform:uppercase}
.logo span{color:var(--pink)}
.top-actions{display:flex;gap:8px}
.chip-btn{background:rgba(255,255,255,.12);color:var(--ink);border:2px solid rgba(255,255,255,.25);border-radius:999px;
  padding:8px 14px;font-size:15px;font-weight:700;cursor:pointer}
.chip-btn:hover{background:rgba(255,255,255,.22)}
h1{font-size:clamp(40px,8vw,84px);line-height:1;margin:.2em 0 .1em;font-weight:900;text-align:center;letter-spacing:.02em}
h1 .a{color:var(--yellow)} h1 .b{color:var(--pink)}
h2{font-size:clamp(26px,4.4vw,46px);margin:.2em 0;text-align:center;font-weight:900}
.sub{text-align:center;font-size:clamp(17px,2.3vw,24px);color:var(--muted);margin:.3em auto 1em;max-width:760px}
.meta{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:6px 0 14px}
.pill{background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.2);border-radius:999px;padding:7px 16px;font-weight:800;font-size:16px}
.panel{background:var(--card);border:3px solid rgba(255,255,255,.18);border-radius:24px;padding:22px;margin:10px 0;box-shadow:0 8px 0 rgba(0,0,0,.25)}
.howto{border-color:var(--cyan)}
.howto b{color:var(--yellow)}
button.big{font:inherit;font-weight:900;font-size:clamp(22px,3vw,32px);padding:16px 34px;border-radius:20px;border:0;cursor:pointer;
  background:var(--yellow);color:#2b1a00;box-shadow:0 7px 0 #b99a00;transition:transform .08s,box-shadow .08s;min-height:64px}
button.big:hover{filter:brightness(1.07)}
button.big:active{transform:translateY(5px);box-shadow:0 2px 0 #b99a00}
button.big:disabled{opacity:.4;cursor:not-allowed;filter:grayscale(.6)}
button.big.pink{background:var(--pink);color:#fff;box-shadow:0 7px 0 #a8266a}
button.big.pink:active{box-shadow:0 2px 0 #a8266a}
button.big.cyan{background:var(--cyan);color:#00323a;box-shadow:0 7px 0 #1b97a8}
button.big.cyan:active{box-shadow:0 2px 0 #1b97a8}
button.big.green{background:var(--green);color:#002a14;box-shadow:0 7px 0 #20a85a}
button.big.green:active{box-shadow:0 2px 0 #20a85a}
.center{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.row{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;align-items:center;margin-top:14px}
input[type=text]{font:inherit;font-weight:800;font-size:clamp(20px,3vw,30px);padding:12px 18px;border-radius:16px;border:4px solid var(--cyan);
  background:#120c33;color:#fff;outline:none;width:100%;min-height:60px}
input[type=text]:focus{border-color:var(--yellow)}
input[type=text].bad{border-color:var(--red)}
input[type=text].good{border-color:var(--green)}
.names{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:14px 0}
.name-chip{display:flex;align-items:center;gap:8px;padding:8px 8px 8px 18px;border-radius:999px;font-weight:900;font-size:22px;color:#1a1033}
.name-chip button{border:0;border-radius:50%;width:34px;height:34px;font-size:20px;font-weight:900;cursor:pointer;background:rgba(0,0,0,.25);color:#fff}
.settings{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-top:12px}
.setting label{display:block;font-weight:800;color:var(--muted);margin-bottom:6px;font-size:16px}
.seg{display:flex;gap:6px}
.seg button{flex:1;font:inherit;font-weight:900;font-size:18px;padding:12px 6px;border-radius:14px;border:3px solid rgba(255,255,255,.25);
  background:rgba(255,255,255,.08);color:#fff;cursor:pointer;min-height:52px}
.seg button.on{background:var(--cyan);color:#00323a;border-color:var(--cyan)}
/* acronym display */
.acro{display:flex;gap:clamp(8px,1.6vw,18px);justify-content:center;flex-wrap:wrap;margin:10px 0}
.letter{width:clamp(70px,13vw,150px);height:clamp(90px,17vw,190px);border-radius:22px;display:flex;align-items:center;justify-content:center;
  font-weight:900;font-size:clamp(56px,11vw,128px);color:#1a1033;box-shadow:0 8px 0 rgba(0,0,0,.3);animation:pop .5s both}
@keyframes pop{0%{transform:scale(.2) rotate(-12deg);opacity:0}70%{transform:scale(1.12) rotate(3deg)}100%{transform:scale(1) rotate(0);opacity:1}}
.theme{background:var(--pink);color:#fff;border-radius:20px;padding:14px 24px;font-size:clamp(20px,3.2vw,34px);font-weight:900;text-align:center;
  margin:10px auto;max-width:900px;box-shadow:0 6px 0 #a8266a}
.theme small{display:block;font-size:.5em;letter-spacing:.14em;text-transform:uppercase;opacity:.85}
.pass{font-size:clamp(34px,7vw,76px);font-weight:900;text-align:center;margin:20px 0 4px}
.pass em{font-style:normal;color:var(--yellow)}
.wrow{display:flex;align-items:center;gap:14px;margin:10px 0}
.wrow .letter{width:clamp(56px,9vw,90px);height:clamp(62px,9vw,90px);font-size:clamp(38px,6vw,64px);flex:none;animation:none}
.timer{height:16px;background:rgba(255,255,255,.15);border-radius:999px;overflow:hidden;margin:6px 0 4px}
.timer>div{height:100%;width:100%;background:var(--green);transition:background .3s}
.tnum{text-align:center;font-weight:900;font-size:22px;color:var(--muted)}
.msg{min-height:28px;text-align:center;font-weight:800;color:var(--yellow);font-size:18px;margin-top:6px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:14px;margin-top:12px}
.ans{background:var(--card);border:4px solid rgba(255,255,255,.2);border-radius:22px;padding:18px 20px;display:flex;align-items:center;gap:16px;
  font-size:clamp(22px,3.2vw,34px);font-weight:900;text-align:left;color:#fff;font-family:inherit;animation:pop .45s both}
.ans .num{flex:none;width:52px;height:52px;border-radius:50%;background:var(--yellow);color:#2b1a00;display:flex;align-items:center;justify-content:center;font-size:28px}
.ans .txt{flex:1;line-height:1.15}
.ans .txt b{color:var(--yellow);font-size:1.15em}
button.ans{cursor:pointer;width:100%}
button.ans:hover{border-color:var(--yellow);transform:translateY(-3px)}
.ans.win{border-color:var(--green);background:#1f6b45}
.counter{display:flex;align-items:center;gap:8px;flex:none}
.counter button{width:54px;height:54px;border-radius:14px;border:0;font-size:32px;font-weight:900;cursor:pointer;background:var(--cyan);color:#00323a}
.counter button.minus{background:#ffffff33;color:#fff}
.counter .n{min-width:44px;text-align:center;font-size:36px}
.who{font-size:.62em;color:var(--cyan);display:block;margin-top:4px}
.pts{flex:none;text-align:right;font-size:.8em;color:var(--green)}
.board{margin-top:14px}
.brow{display:flex;align-items:center;gap:12px;margin:8px 0;font-weight:900;font-size:clamp(18px,2.6vw,28px)}
.brow .nm{width:clamp(90px,18vw,200px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brow .bar{flex:1;background:rgba(255,255,255,.1);border-radius:999px;height:34px;overflow:hidden}
.brow .bar>div{height:100%;border-radius:999px;transition:width 1s ease;min-width:8px}
.brow .sc{width:clamp(70px,10vw,110px);text-align:right}
.badge{display:inline-block;background:var(--green);color:#002a14;border-radius:999px;padding:2px 12px;font-size:.6em;margin-left:8px;vertical-align:middle}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:14px;margin:18px 0}
.pod{border-radius:20px 20px 0 0;padding:14px 12px;text-align:center;font-weight:900;min-width:clamp(90px,20vw,200px);color:#1a1033;animation:rise .8s both}
.pod .pn{font-size:clamp(20px,3vw,32px);word-break:break-word}
.pod .ps{font-size:clamp(16px,2.2vw,24px)}
.pod .medal{font-size:clamp(34px,6vw,64px)}
@keyframes rise{from{transform:translateY(80px);opacity:0}to{transform:none;opacity:1}}
.round-tag{text-align:center;color:var(--muted);font-weight:800;letter-spacing:.12em;text-transform:uppercase;font-size:16px}
.confetti{position:fixed;top:-20px;width:12px;height:18px;z-index:50;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:.9}}
.hall .ans{font-size:clamp(18px,2.4vw,26px)}
.hint{color:var(--muted);text-align:center;font-size:18px;margin:6px 0}
@media (max-width:600px){#app{padding:12px 12px 30px}.panel{padding:16px}.ans{padding:12px}.ans .num{width:42px;height:42px;font-size:22px}}
</style>
</head>
<body>
<div id="app"></div>

<script>
"use strict";
/* ============ DATA ============ */
const COLORS=["#ffe14d","#ff4fa3","#3be8ff","#4dff9a","#ff9a3c","#b58cff","#ff7d7d","#7dd3ff","#c8ff4d","#ffb3e6"];
const WORDS=["TACO","LLAMA","NINJA","ROBOT","PANDA","MANGO","DONUT","WAFFLE","SPOON","COOKIE","SOCKS","BEACH","PARTY","DISCO","PLANET",
"ROCKET","PIRATE","WIZARD","DRAGON","CASTLE","TIGER","MONKEY","BUBBLE","SPARK","JELLY","CANDY","PENGUIN","COCOA","PICNIC","GIGGLE","HELLO",
"BRAVO","SUNNY","MAGIC","TURBO","NACHO","PUPPY","KITTEN","BACON","SALAD","BREAD","LASER","COMET","GHOST","SNACK","SMILE","RIVER","CLOUD",
"STORM","SPACE","PAPER","PEPPER","WHALE","OTTER","MOOSE","HAPPY","LUCKY","FUNKY","WOBBLE","NOODLE","PICKLE","BAGEL","MUFFIN","TOAST",
"GROOVE","CHEESE","BOOM","WOW","YUM","POP","GAME","PLAY","JOKE","SILLY","BUNNY","FLUFFY","DISCO","MOCHA","CAMEL","HIPPO","KOALA","SUSHI"];
const THEMES=["A brand-new breakfast cereal","A tiny town's official motto","The name of a superhero team","A note taped to the fridge",
"A weird new Olympic sport","Today's school lunch special","Advice from a wise grandparent","A pirate's to-do list","The title of a movie nobody asked for",
"A brand-new holiday everyone gets off","What the dog is really thinking","What the cat is secretly plotting","A rejected ice cream flavor",
"A robot's biggest secret wish","A wizard's complaint","A fortune cookie message","The name of a terrible restaurant","A mascot's catchphrase",
"Rules for a treehouse club","A kid's excuse for a messy room","A museum exhibit title","The zoo's newest attraction","A very specific phone app",
"A theme park ride","A superhero's weakness","The name of a rock band","A brand-new dance move","Instructions inside a mystery box",
"A knight's complaint","An alien's first words on Earth","A mad scientist's invention","A slogan for a sock company","A reality TV show title",
"A secret-handshake step list","The world's silliest sport","A bedtime story title","A sandwich on the menu","What your pet said at dinner",
"A dragon's review of a castle","A class you'd love to take","A cooking show disaster","A road trip snack list","A birthday party rule",
"A dinosaur's diary entry","A detective's newest case","A pizza topping nobody ordered","Tomorrow's weather forecast","A sign at the penguin hotel",
"A very bad invention","Features of a tiny house","A cheerleader chant","A bumper sticker","A talent show act","A sign at a friendly haunted house",
"A wild birthday cake design","A mystery novel title","A farmer's motto","A tour guide's weirdest fact","The title of a pop song",
"A video game level name","A superhero's snack","Something found in grandma's purse","Anything goes! (free-for-all)"];
const GOOD_LETTERS="AABCCDDEEFGHIIJKLLMMNOOPPRRSSSTTUWY";
const VOWELS="AEIOU";
const BLOCK=["fuck","shit","bitch","asshole","dick","cock","penis","vagina","porn","sex","slut","whore","cunt","nazi","rape","drunk","boob","boobs","butt"];
const SND_NOTES=[523,659,784,1047];

/* ============ AUDIO ============ */
let AC=null, muted=false;
function ac(){ if(!AC){ try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){} } if(AC&&AC.state==="suspended") AC.resume(); return AC; }
function tone(f,d,type="sine",vol=.2,delay=0,slide=0){
  if(muted) return; const c=ac(); if(!c) return;
  const t=c.currentTime+delay, o=c.createOscillator(), g=c.createGain();
  o.type=type; o.frequency.setValueAtTime(f,t); if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(40,f+slide),t+d);
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+.02); g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+d+.05);
}
const SFX={
  click(){tone(660,.08,"triangle",.15)},
  pop(){tone(400,.12,"square",.12,0,500)},
  tick(){tone(900,.05,"square",.08)},
  hurry(){tone(1200,.08,"square",.14)},
  buzz(){tone(140,.5,"sawtooth",.25)},
  reveal(){tone(300,.25,"triangle",.18,0,700); tone(900,.2,"sine",.12,.2)},
  vote(){tone(880,.1,"sine",.2); tone(1320,.18,"sine",.2,.09)},
  win(){SND_NOTES.forEach((n,i)=>tone(n,.25,"triangle",.2,i*.12))},
  fanfare(){[523,523,523,659,784,659,784,1047].forEach((n,i)=>tone(n,.28,"square",.13,i*.14))},
  bad(){tone(200,.2,"square",.15,0,-60)}
};

/* ============ STATE ============ */
const $app=document.getElementById("app");
let S=newState(true);
let timerH=null;
function newState(fresh, keepPlayers){
  return {
    screen:"setup", players: keepPlayers? keepPlayers.map(p=>({...p,score:0})) : [],
    rounds:5, timer:60, voteMode:"secret",
    round:0, acr:null, usedWords:new Set(), usedThemes:new Set(),
    answers:[], writeIdx:0, order:[], voteIdx:0, revealIdx:0, hall:[], lastDelta:{}
  };
}
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }

function makeAcronym(){
  let letters;
  if(Math.random()<.6){
    const avail=WORDS.filter(w=>!S.usedWords.has(w)); const w=pick(avail.length?avail:WORDS);
    S.usedWords.add(w); letters=w.split("");
  }else{
    const len=3+Math.floor(Math.random()*3); let s;
    do{ s=Array.from({length:len},()=>pick(GOOD_LETTERS)); }while(!s.some(c=>VOWELS.includes(c))||new Set(s).size<len-1);
    letters=s;
  }
  const av=THEMES.filter(t=>!S.usedThemes.has(t)); const theme=pick(av.length?av:THEMES); S.usedThemes.add(theme);
  return {letters, theme};
}

/* ============ HELPERS ============ */
function el(tag,attrs={},...kids){
  const e=document.createElement(tag);
  for(const k in attrs){ if(k==="class") e.className=attrs[k]; else if(k==="style") e.style.cssText=attrs[k]; else if(k.startsWith("on")) e.addEventListener(k.slice(2),attrs[k]); else e.setAttribute(k,attrs[k]); }
  kids.flat().forEach(c=>{ if(c==null) return; e.append(c.nodeType?c:document.createTextNode(c)); });
  return e;
}
function clearTimer(){ if(timerH){clearInterval(timerH); timerH=null;} }
function go(screen){ clearTimer(); S.screen=screen; render(); window.scrollTo(0,0); }
function pcolor(i){ return COLORS[i%COLORS.length]; }
function header(){
  return el("header",{class:"top"},
    el("div",{class:"logo"},"Backronym ",el("span",{},"Bash")),
    el("div",{class:"top-actions"},
      el("button",{class:"chip-btn",onclick:(e)=>{muted=!muted; SFX.click(); e.currentTarget.textContent=muted?"🔇 Sound off":"🔊 Sound on";}},muted?"🔇 Sound off":"🔊 Sound on"),
      S.screen!=="setup"? el("button",{class:"chip-btn",onclick:()=>{ if(confirm("Quit this game and go back to setup?")){ S=newState(true,S.players); go("setup"); } }},"✖ Quit"):null
    ));
}
function acroRow(letters,small){
  const w=el("div",{class:"acro"});
  letters.forEach((l,i)=>w.append(el("div",{class:"letter",style:`background:${COLORS[i%COLORS.length]};animation-delay:${i*.12}s`},l)));
  return w;
}
function isClean(text){
  const toks=text.toLowerCase().split(/[^a-z]+/).filter(Boolean);
  return !toks.some(t=>BLOCK.includes(t));
}
function confetti(n=60){
  for(let i=0;i<n;i++){
    const c=el("div",{class:"confetti",style:`left:${Math.random()*100}vw;background:${pick(COLORS)};animation-duration:${2+Math.random()*2.5}s;animation-delay:${Math.random()*.6}s;transform:rotate(${Math.random()*360}deg)`});
    document.body.append(c); setTimeout(()=>c.remove(),5500);
  }
}

/* ============ SCREENS ============ */
function render(){
  $app.innerHTML=""; $app.append(header());
  ({setup:rSetup,intro:rIntro,pass:rPass,write:rWrite,revealAll:rRevealAll,votePass:rVotePass,voting:rVoting,tally:rTally,results:rResults,final:rFinal})[S.screen]();
}

/* ---- Setup ---- */
function rSetup(){
  const nameIn=el("input",{type:"text",maxlength:"14",placeholder:"Type a player name…",autocomplete:"off"});
  const addMsg=el("div",{class:"msg"});
  function add(){
    const v=nameIn.value.trim();
    if(!v) return;
    if(!isClean(v)){addMsg.textContent="Let's keep names family-friendly!"; SFX.bad(); return;}
    if(S.players.length>=10){addMsg.textContent="10 players max."; return;}
    if(S.players.some(p=>p.name.toLowerCase()===v.toLowerCase())){addMsg.textContent="That name is taken!"; return;}
    S.players.push({name:v,score:0}); SFX.pop(); render();
    setTimeout(()=>{const i=document.querySelector("input[type=text]"); i&&i.focus();},30);
  }
  nameIn.addEventListener("keydown",e=>{ if(e.key==="Enter") add(); });
  const names=el("div",{class:"names"});
  S.players.forEach((p,i)=>names.append(el("div",{class:"name-chip",style:`background:${pcolor(i)}`},p.name,
    el("button",{title:"Remove",onclick:()=>{S.players.splice(i,1); SFX.click(); render();}},"×"))));
  const seg=(key,opts,fmt)=>el("div",{class:"seg"},opts.map(o=>el("button",{class:S[key]===o?"on":"",onclick:()=>{S[key]=o; SFX.click(); render();}},fmt(o))));
  const ready=S.players.length>=3;
  const startBtn=el("button",{class:"big pink",onclick:()=>{if(S.players.length<3)return;ac();S.round=0;SFX.fanfare();nextRound();}},ready?"🎉 Start the Bash!":"Add at least 3 players");
  $app.append(
    el("h1",{},el("span",{class:"a"},"BACKRONYM"),el("br"),el("span",{class:"b"},"BASH!")),
    el("p",{class:"sub"},"A made-up acronym appears. Secretly decide what the letters stand for, then vote for the funniest answer!"),
    el("div",{class:"meta"},el("span",{class:"pill"},"👥 3–10 players"),el("span",{class:"pill"},"⏱ about 15–20 min"),el("span",{class:"pill"},"📱 pass one device around")),
    el("div",{class:"panel howto"},
      el("div",{style:"font-size:clamp(18px,2.4vw,26px);font-weight:800;text-align:center"},
        "How to play: ",el("b",{},"Write"),
        " what each letter stands for (in secret) → ",el("b",{},"Reveal"),
        " every answer anonymously → ",el("b",{},"Vote"),
        " for your favorite (not your own!). Most votes wins the round.")),
    el("div",{class:"panel"},
      el("div",{style:"font-weight:900;font-size:24px;margin-bottom:8px"},"Who's playing? ",el("span",{style:"color:var(--muted);font-size:.7em"},`(${S.players.length}/10)`)),
      el("div",{class:"row",style:"margin:0;flex-wrap:nowrap"},nameIn,el("button",{class:"big cyan",style:"padding:12px 24px",onclick:add},"Add")),
      addMsg, names,
      el("div",{class:"settings"},
        el("div",{class:"setting"},el("label",{},"Rounds"),seg("rounds",[3,5,7],x=>x)),
        el("div",{class:"setting"},el("label",{},"Writing timer"),seg("timer",[30,60,90,0],x=>x?x+"s":"None")),
        el("div",{class:"setting"},el("label",{},"Voting style"),
          el("div",{class:"seg"},
            el("button",{class:S.voteMode==="secret"?"on":"",onclick:()=>{S.voteMode="secret";SFX.click();render();}},"Secret ballots"),
            el("button",{class:S.voteMode==="hands"?"on":"",onclick:()=>{S.voteMode="hands";SFX.click();render();}},"Hands up")))
      )),
    el("div",{class:"row"},startBtn)
  );
  // 28 Oct 2026: this used to disable the FIRST big button - the "Add" button - so the
  // start button stayed live and a game could begin with no players (a crash on "Pass the
  // device to...", seen by the weekly Arcade check). Disable the start button itself.
  startBtn.disabled=!ready;
  setTimeout(()=>nameIn.focus(),30);
}

/* ---- Round intro ---- */
function nextRound(){
  S.round++; S.acr=makeAcronym(); S.answers=[]; S.writeIdx=0; S.lastDelta={}; go("intro");
}
function rIntro(){
  SFX.reveal();
  $app.append(
    el("div",{class:"round-tag"},`Round ${S.round} of ${S.rounds}`),
    el("h2",{},"Your acronym is…"),
    acroRow(S.acr.letters),
    el("div",{class:"theme"},el("small",{},"Theme"),S.acr.theme),
    el("p",{class:"sub"},`Each word must start with its letter. Use the theme for extra laughs! Everyone will write in secret — one player at a time.`),
    el("div",{class:"row"},
      el("button",{class:"big cyan",onclick:()=>{SFX.click();S.acr=Object.assign(makeAcronym(),{});render();}},"🔀 Re-roll"),
      el("button",{class:"big pink",onclick:()=>{SFX.click();S.writeIdx=0;go("pass");}},"Let's write! ✍️"))
  );
}

/* ---- Pass the device ---- */
function rPass(){
  const p=S.players[S.writeIdx], i=S.writeIdx;
  $app.append(
    el("div",{class:"round-tag"},`Round ${S.round} of ${S.rounds} · Writing`),
    el("div",{class:"pass"},"Pass the device to",el("br"),el("em",{style:`color:${pcolor(i)}`},p.name)),
    el("p",{class:"sub"},`Everyone else look away! ${S.writeIdx+1} of ${S.players.length}`),
    el("div",{class:"row"},el("button",{class:"big",onclick:()=>{SFX.click();go("write");}},`I'm ${p.name} — show me!`))
  );
}

/* ---- Write ---- */
function rWrite(){
  const p=S.players[S.writeIdx], i=S.writeIdx, L=S.acr.letters;
  const inputs=[]; const msg=el("div",{class:"msg"});
  const submitBtn=el("button",{class:"big green",disabled:"",onclick:submit},"Lock it in! 🔒");
  const rows=el("div",{});
  L.forEach((l,k)=>{
    const inp=el("input",{type:"text",maxlength:"22",autocomplete:"off",autocapitalize:"words",placeholder:`A word starting with ${l}…`});
    inp.addEventListener("input",check);
    inp.addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); if(k<L.length-1) inputs[k+1].focus(); else if(!submitBtn.disabled) submit(); }});
    inputs.push(inp);
    rows.append(el("div",{class:"wrow"},el("div",{class:"letter",style:`background:${COLORS[k%COLORS.length]}`},l),inp));
  });
  const bar=el("div",{}); const tnum=el("div",{class:"tnum"});
  const timerWrap=el("div",{class:"timer"},bar);
  function words(){ return inputs.map(x=>x.value.trim().replace(/\s+/g," ")); }
  function validWord(w,l){ return w.length>0 && w[0].toUpperCase()===l; }
  function check(){
    let all=true, clean=true;
    inputs.forEach((x,k)=>{ const w=words()[k]; x.classList.remove("bad","good");
      if(w){ x.classList.add(validWord(w,L[k])?"good":"bad"); }
      if(!validWord(w,L[k])) all=false; if(w.split(" ").length>3) all=false; });
    const txt=words().join(" "); if(!isClean(txt)){clean=false;msg.textContent="Keep it family-friendly, please! 😇";}
    else if(inputs.some((x,k)=>x.value.trim()&&!validWord(words()[k],L[k]))) msg.textContent="Each word must start with its big letter!";
    else if(words().some(w=>w.split(" ").length>3)) msg.textContent="Max 3 words per letter.";
    else msg.textContent="";
    submitBtn.disabled=!(all&&clean);
  }
  function submit(opts){
    const w=words(); const ok=!submitBtn.disabled && L.every((l,k)=>validWord(w[k],l)) && isClean(w.join(" "));
    const entry={pi:S.writeIdx, words:ok?w.map(x=>x.replace(/^./,c=>c.toUpperCase())):[], ok};
    S.answers.push(entry); SFX.vote();
    S.writeIdx++;
    if(S.writeIdx>=S.players.length){ clearTimer(); S.order=shuffle(S.answers.map((a,idx)=>idx).filter(idx=>S.answers[idx].ok)); S.revealIdx=0; go("revealAll"); }
    else go("pass");
  }
  $app.append(
    el("div",{class:"round-tag"},`Round ${S.round} of ${S.rounds} · `,el("span",{style:`color:${pcolor(i)}`},p.name),"'s turn"),
    el("div",{class:"theme",style:"font-size:clamp(18px,2.8vw,30px);padding:10px 20px"},S.acr.theme),
    S.timer? el("div",{},timerWrap,tnum):"",   // not null: Element.append() prints null as the text "null"
    rows, msg,
    el("div",{class:"row"},submitBtn)
  );
  setTimeout(()=>inputs[0].focus(),50);
  if(S.timer){
    const total=S.timer*1000, start=Date.now(); let lastSec=-1;
    timerH=setInterval(()=>{
      const left=Math.max(0,total-(Date.now()-start)), frac=left/total, sec=Math.ceil(left/1000);
      bar.style.width=(frac*100)+"%"; bar.style.background= frac>.5?"var(--green)":frac>.2?"var(--yellow)":"var(--red)";
      tnum.textContent=sec+"s";
      if(sec!==lastSec){ lastSec=sec; if(sec<=5&&sec>0) SFX.hurry(); }
      if(left<=0){ clearTimer(); SFX.buzz(); submit(); }
    },100);
  }
}

/* ---- Reveal all answers ---- */
function rRevealAll(){
  if(S.order.length<2){
    $app.append(el("h2",{},"Not enough answers this round!"),el("p",{class:"sub"},"Fewer than 2 valid answers came in, so we're skipping the vote."),
      el("div",{class:"row"},el("button",{class:"big",onclick:()=>{SFX.click();afterRound();}},"Next ▶")));
    return;
  }
  SFX.reveal();
  const cards=el("div",{class:"cards"});
  S.order.forEach((ai,n)=>{
    const a=S.answers[ai];
    const txt=el("div",{class:"txt"}); a.words.forEach((w,k)=>{ txt.append(el("b",{},w[0]),w.slice(1)+(k<a.words.length-1?" ":"")); });
    const card=el("div",{class:"ans",style:`animation-delay:${n*.25}s`},el("div",{class:"num"},n+1),txt);
    cards.append(card); setTimeout(()=>SFX.tick(),n*250);
  });
  $app.append(
    el("div",{class:"round-tag"},`Round ${S.round} of ${S.rounds} · The answers`),
    acroRow(S.acr.letters),
    el("div",{class:"theme",style:"font-size:clamp(16px,2.4vw,24px);padding:8px 18px"},S.acr.theme),
    cards,
    el("p",{class:"hint"},S.voteMode==="secret"?"Read them out loud! Then each player votes secretly — no voting for your own.":"Read them out loud! Then everyone points at their favorite — no voting for your own."),
    el("div",{class:"row"},el("button",{class:"big pink",onclick:()=>{SFX.click(); S.votes={}; S.order.forEach(ai=>S.votes[ai]=0); S.voteIdx=0; go(S.voteMode==="secret"?"votePass":"tally");}},"Time to vote! 🗳️"))
  );
}

/* ---- Secret vote ---- */
function rVotePass(){
  const p=S.players[S.voteIdx], i=S.voteIdx;
  const hasChoice=S.order.filter(ai=>S.answers[ai].pi!==S.voteIdx).length>0;
  if(!hasChoice){ S.voteIdx++; if(S.voteIdx>=S.players.length){go("results");return;} rVotePass(); return; }
  $app.append(
    el("div",{class:"round-tag"},`Round ${S.round} of ${S.rounds} · Voting`),
    el("div",{class:"pass"},"Pass the device to",el("br"),el("em",{style:`color:${pcolor(i)}`},p.name)),
    el("p",{class:"sub"},`Vote ${S.voteIdx+1} of ${S.players.length}`),
    el("div",{class:"row"},el("button",{class:"big",onclick:()=>{SFX.click();go("voting");}},`I'm ${p.name} — show me!`))
  );
}
function rVoting(){
  const p=S.players[S.voteIdx];
  const cards=el("div",{class:"cards"});
  S.order.forEach((ai,n)=>{
    const a=S.answers[ai]; if(a.pi===S.voteIdx) return;
    const txt=el("div",{class:"txt"}); a.words.forEach((w,k)=>{ txt.append(el("b",{},w[0]),w.slice(1)+(k<a.words.length-1?" ":"")); });
    cards.append(el("button",{class:"ans",onclick:()=>{ S.votes[ai]++; SFX.vote(); S.voteIdx++; if(S.voteIdx>=S.players.length) go("results"); else go("votePass"); }},el("div",{class:"num"},n+1),txt));
  });
  $app.append(
    el("div",{class:"round-tag"},`Round ${S.round} of ${S.rounds} · `,el("span",{style:`color:${pcolor(S.voteIdx)}`},p.name),"'s vote"),
    acroRow(S.acr.letters),
    el("h2",{},"Tap your favorite!"),
    cards
  );
  $app.querySelectorAll(".acro .letter").forEach(x=>{x.style.height="clamp(50px,8vw,80px)";x.style.width="clamp(44px,7vw,70px)";x.style.fontSize="clamp(30px,5vw,50px)"});
}

/* ---- Hands-up tally ---- */
function rTally(){
  const cards=el("div",{class:"cards"});
  const total=el("div",{class:"hint"});
  function upd(){ const t=Object.values(S.votes).reduce((a,b)=>a+b,0); total.textContent=`${t} vote${t===1?"":"s"} counted · ${S.players.length} players`; }
  S.order.forEach((ai,n)=>{
    const a=S.answers[ai];
    const txt=el("div",{class:"txt"}); a.words.forEach((w,k)=>{ txt.append(el("b",{},w[0]),w.slice(1)+(k<a.words.length-1?" ":"")); });
    const nEl=el("div",{class:"n"},"0");
    const set=d=>{ S.votes[ai]=Math.max(0,S.votes[ai]+d); nEl.textContent=S.votes[ai]; d>0?SFX.vote():SFX.click(); upd(); };
    cards.append(el("div",{class:"ans"},el("div",{class:"num"},n+1),txt,
      el("div",{class:"counter"},el("button",{class:"minus",onclick:()=>set(-1)},"−"),nEl,el("button",{onclick:()=>set(1)},"+"))));
  });
  $app.append(
    el("div",{class:"round-tag"},`Round ${S.round} of ${S.rounds} · Hands up!`),
    acroRow(S.acr.letters),
    el("h2",{},"Count to 3 — everyone point!"),
    el("p",{class:"hint"},"Host: tap + for each person pointing at an answer. (No pointing at your own!)"),
    cards,total,
    el("div",{class:"row"},el("button",{class:"big pink",onclick:()=>{SFX.click();go("results");}},"Lock in votes ✅"))
  );
  upd();
  $app.querySelectorAll(".acro .letter").forEach(x=>{x.style.height="clamp(50px,8vw,80px)";x.style.width="clamp(44px,7vw,70px)";x.style.fontSize="clamp(30px,5vw,50px)"});
}

/* ---- Results ---- */
function rResults(){
  const ids=S.order.slice();
  const maxV=Math.max(0,...ids.map(ai=>S.votes[ai]));
  if(S.scoredRound!==S.round){
    S.scoredRound=S.round; S.lastDelta={};
    ids.forEach(ai=>{
      const a=S.answers[ai]; let pts=S.votes[ai]*100; const fav=maxV>0&&S.votes[ai]===maxV; if(fav) pts+=150;
      a.pts=pts; a.fav=fav; a.v=S.votes[ai];
      S.players[a.pi].score+=pts; S.lastDelta[a.pi]=pts;
      S.hall.push({letters:S.acr.letters.join(""),theme:S.acr.theme,text:a.words.join(" "),by:S.players[a.pi].name,votes:S.votes[ai],words:a.words});
    });
  }
  const sorted=ids.slice().sort((x,y)=>S.votes[y]-S.votes[x]);
  const cards=el("div",{class:"cards"});
  sorted.forEach((ai,n)=>{
    const a=S.answers[ai], p=S.players[a.pi];
    const txt=el("div",{class:"txt"}); a.words.forEach((w,k)=>{ txt.append(el("b",{},w[0]),w.slice(1)+(k<a.words.length-1?" ":"")); });
    txt.append(el("span",{class:"who",style:`color:${pcolor(a.pi)}`},`— ${p.name}`));
    cards.append(el("div",{class:"ans"+(a.fav?" win":""),style:`animation-delay:${n*.35}s`},txt,
      el("div",{class:"pts"},`${a.v} vote${a.v===1?"":"s"}`,el("br"),`+${a.pts}`,a.fav?el("span",{class:"badge"},"👑 Fave"):null)));
  });
  S.players.forEach((p,i)=>{ if(!(i in S.lastDelta)) S.lastDelta[i]=0; });
  SFX.win(); if(maxV>0) confetti(40);
  const last=S.round>=S.rounds;
  $app.append(
    el("div",{class:"round-tag"},`Round ${S.round} of ${S.rounds} · Results`),
    el("h2",{},"The votes are in!"),
    acroRow(S.acr.letters),
    cards,
    el("h2",{style:"margin-top:22px"},"Scoreboard"),
    scoreboard(),
    el("div",{class:"row"},el("button",{class:"big pink",onclick:()=>{SFX.click(); last?finish():nextRound();}},last?"🏆 Final results":"Next round ▶"))
  );
}
function afterRound(){ if(S.round>=S.rounds) finish(); else nextRound(); }
function scoreboard(){
  const max=Math.max(100,...S.players.map(p=>p.score));
  const b=el("div",{class:"panel board"});
  S.players.map((p,i)=>({p,i})).sort((a,b)=>b.p.score-a.p.score).forEach(({p,i})=>{
    const d=S.lastDelta[i]||0;
    b.append(el("div",{class:"brow"},el("div",{class:"nm",style:`color:${pcolor(i)}`},p.name),
      el("div",{class:"bar"},el("div",{style:`width:0;background:${pcolor(i)}`,"data-w":(p.score/max*100)+""})),
      el("div",{class:"sc"},p.score,d?el("span",{style:"color:var(--green);font-size:.6em"}," +"+d):null)));
  });
  setTimeout(()=>b.querySelectorAll(".bar>div").forEach(x=>x.style.width=x.dataset.w+"%"),80);
  return b;
}
function finish(){ go("final"); }

/* ---- Final ---- */
function rFinal(){
  SFX.fanfare(); confetti(120);
  const ranked=S.players.map((p,i)=>({p,i})).sort((a,b)=>b.p.score-a.p.score);
  const top=ranked[0].p.score;
  const winners=ranked.filter(r=>r.p.score===top);
  const medals=["🥇","🥈","🥉"], heights=[260,200,160];
  const order=[1,0,2].filter(k=>ranked[k]);
  const pod=el("div",{class:"podium"});
  order.forEach(k=>{ const r=ranked[k]; pod.append(el("div",{class:"pod",style:`background:${pcolor(r.i)};height:${heights[k]}px;animation-delay:${(2-k)*.4}s`},
    el("div",{class:"medal"},medals[k]),el("div",{class:"pn"},r.p.name),el("div",{class:"ps"},r.p.score+" pts"))); });
  const hall=S.hall.slice().sort((a,b)=>b.votes-a.votes).slice(0,3);
  const hallEl=el("div",{class:"hall cards",style:"grid-template-columns:1fr"});
  hall.forEach(h=>{ const txt=el("div",{class:"txt"}); h.words.forEach((w,k)=>{ txt.append(el("b",{},w[0]),w.slice(1)+(k<h.words.length-1?" ":"")); });
    txt.append(el("span",{class:"who"},`${h.letters} · ${h.theme} — by ${h.by} (${h.votes} vote${h.votes===1?"":"s"})`));
    hallEl.append(el("div",{class:"ans"},txt)); });
  $app.append(
    el("div",{class:"round-tag"},"Game over!"),
    el("h1",{style:"font-size:clamp(34px,6vw,64px)"},winners.length>1?"It's a tie! 🎉":`${winners[0].p.name} wins! 🎉`),
    pod,
    el("div",{class:"panel"},el("h2",{style:"font-size:clamp(22px,3.4vw,34px)"},"Final scores"),scoreboard()),
    hall.length?el("div",{},el("h2",{},"🏛 Hall of Fame"),hallEl):"",
    el("div",{class:"row"},
      el("button",{class:"big pink",onclick:()=>{SFX.click(); const keep=S.players; const r=S.rounds,t=S.timer,v=S.voteMode; const uw=S.usedWords,ut=S.usedThemes;
        S=newState(true,keep); S.rounds=r;S.timer=t;S.voteMode=v;S.usedWords=uw;S.usedThemes=ut; S.round=0; nextRound();}},"🔁 Play Again (same players)"),
      el("button",{class:"big cyan",onclick:()=>{SFX.click(); S=newState(true); go("setup");}},"🆕 New Game"))
  );
}

render();
</script>
