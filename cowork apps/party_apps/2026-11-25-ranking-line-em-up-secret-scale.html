<!-- CONCEPT: RANKING & CONSENSUS (secret-number scale line-up, co-op) - "Line 'Em Up": every player secretly peeks at a hidden number from 1-100 on the passed phone, a theme card sets a scale ("Animals - how BIG? 1 = a flea, 100 = a blue whale"), and each player says out loud something from the theme that matches their number ("...a beagle"); without ever saying numbers, the whole room argues the cards into order from lowest to highest on one shared screen, then the cards flip one at a time - every card that comes up lower than one before it costs a shared life. 8 levels climb from 1 card each to 2-3 cards per player in small groups, twists (Narrow Band 40-wide numbers, One Word Only, Opposite Day high-to-low, Silent Partner mimes, Golden Card wins a life back, Quick Clock 75s), double-points Grand Finale, team score with best saved, Clue-of-the-round stars and Bullseye exact-slot points per player, 84 scales remembered across games, awards | Players: 3-10 | ~15-20 min [style: Toy Blocks / sound: Plucked String] -->
<!DOCTYPE html>
<html lang="en">
<head>

<title>Line 'Em Up</title>
<style>
:root{

  --blue:#1d5fc4; --blueD:#123f86; --red:#c1121f; --redD:#7d0b14;

.wrap{max-width:760px;margin:0 auto;padding:12px 14px 44px}

h1,h2,h3{margin:.2em 0;line-height:1.1;font-weight:900}

.title{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0 4px}
.title span{display:inline-flex;align-items:center;justify-content:center;min-width:clamp(34px,10vw,60px);height:clamp(42px,12vw,72px);

<body>

<script>
'use strict';
const load = (k, d) => { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } };
const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
const KEY = 'cowork-lineemup-';

// ---------- 84 scales: [category, question, what 1 means, what 100 means] ----------
const THEMES = [
 ['Animals','How BIG is it?','a flea','a blue whale'],
 ['Foods','How SPICY is it?','a glass of milk',"dragon's-breath chilli"],
 ['Sounds','How LOUD is it?','a feather landing','a rocket launch'],

 ['Snacks','How HEALTHY is it?','a candy mountain','a bowl of broccoli'],
 ['Chores','How ANNOYING is it?','feeding a pet','scrubbing the oven'],
 ['Ways to travel','How FAST is it?','riding a snail','a rocket ship'],
 ['Things in a house','How EXPENSIVE is it?','a paperclip','the whole house'],

 ['Sports','How TIRING is it?','chess','a marathon'],
 ['Inventions','How IMPORTANT is it?','the fidget spinner','the wheel'],
 ['Weather','How FUN is it?','freezing drizzle','the perfect snow day'],

 ['Things','How OLD is it?',"this morning's toast",'the dinosaurs'],
 ['Birthday presents','How EXCITING is it?','a pair of socks','a pony'],
 ['Things you can do','How HARD is it?','blinking','climbing Mount Everest'],
 ['Instruments','How LOUD is it?','a triangle','a drum kit'],
 ['Story characters','How BRAVE are they?','a nervous mouse','a fearless knight'],
 ['Costumes','How SCARY is it?','a fluffy bunny','a zombie king'],
 ['Desserts','How SWEET is it?','a plain cracker','a sugar-cube sundae'],
 ['Games','How LONG does a game take?','rock paper scissors','a board game that never ends'],
 ['Animals','How CUDDLY is it?','a porcupine','a baby panda'],
 ['Things','How BRIGHT is it?','a candle stub','the midday sun'],
 ['Holidays','How RELAXING is it?','camping in a thunderstorm','a hammock on a beach'],
 ['Breakfasts','How FANCY is it?','a dry bowl of cereal','a royal banquet'],
 ['Things','How SHARP is it?','a cotton ball','a samurai sword'],
 ['Places','How WET is it?','a desert rock','the bottom of the ocean'],
 ['Fruit & veg','How much do kids LIKE it?','brussels sprouts','strawberries'],
 ['Things','How EXPENSIVE is it?','a pebble','a private island'],
 ['Noises','How ANNOYING is it?','a gentle breeze','nails on a chalkboard'],
 ['Places','How CROWDED is it?','a desert island','a stadium concert'],
 ['Habits','How WEIRD is it?','tying your shoelaces','cereal with orange juice'],
 ['Homework excuses','How BELIEVABLE is it?','aliens took it','I left it on the bus'],
 ['Things','How SOFT is it?','a brick','a cloud'],
 ['Animals','How DANGEROUS is it?','a goldfish','a great white shark'],
 ['Toys','How FUN is it?','a single sock','a giant trampoline'],
 ['Talents','How IMPRESSIVE is it?','whistling','juggling ten plates'],
 ['Things','How SMELLY is it?','a rose',"a skunk's sneeze"],
 ['Jobs','How FUN is it?','sorting paperclips','ice-cream taster'],
 ['Things','How TALL is it?','an ant','a skyscraper'],

 ['Beach moments','How PLEASANT is it?','stepping on a crab','the perfect sandcastle'],

 ['Monsters','How SCARY is it?','a sock puppet','a giant kraken'],
 ['Things','How COLOURFUL is it?','a grey rock','a rainbow parrot'],
 ['Hobbies','How MESSY is it?','reading','finger painting'],
 ['Things to do','How much PATIENCE?','eating a crisp','growing an oak tree'],
 ['Animals','How NOISY is it?','a goldfish','a howler monkey'],
 ['Ice-cream flavours','How WEIRD is it?','vanilla','pickle and mustard'],
 ['Sounds','How RELAXING is it?','a smoke alarm','rain on a tent'],
 ['Rides','How THRILLING is it?','a slow carousel','the biggest rollercoaster'],
 ['Things','How DIRTY is it?','a fresh towel','a muddy pig'],
 ['Inventions','How SILLY is it?','the light bulb','a fork with a built-in fan'],
 ['Villain plans','How EVIL is it?','stealing one sock','cancelling every birthday'],
 ['Things in your fridge','How SURPRISING?','milk','a penguin'],
 ['Places','How QUIET is it?','a fireworks show','a silent library'],
 ['Things','How BENDY is it?','a steel bar','a wet noodle'],
 ['Weather','How POWERFUL is it?','a light breeze','a giant hurricane'],
 ['Cooking smells','How GOOD is it?','burnt toast','fresh pizza'],
 ['Things to do at a party','How FUN is it?','waiting in a queue','the best party ever'],
 ['Dance moves','How ENERGETIC is it?','standing still','a breakdance spin']
];

const TWISTS = {
  narrow:  {name:'Narrow Band', text:'All numbers this level sit inside one 40-wide band, so they are bunched close together. Shown below.'},
  oneword: {name:'One Word Only', text:'Each clue must be ONE single word. No describing, no "like a...".'},
  opposite:{name:'Opposite Day', text:'Line the cards up from HIGHEST at the top down to LOWEST at the bottom.'},
  silent:  {name:'Silent Partner', text:'One player may not speak. They mime their clue instead.'},
  golden:  {name:'Golden Card', text:'One card has a ⭐. If it flips in the right order, the team wins a life back.'},
  quick:   {name:'Quick Clock', text:'75 seconds to talk it out. When the clock hits zero, the line locks itself.'}
};
const LEVELS = 8, MAXH = 5;

// ---------- sound: Plucked String (Karplus-Strong) ----------
let AC = null, master = null, muted = load(KEY + 'mute', false);
const bufCache = new Map();
function ensureAudio(){
  if (AC) { if (AC.state === 'suspended') AC.resume(); return true; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    const comp = AC.createDynamicsCompressor();
    comp.threshold.value = -14; comp.ratio.value = 4;
    master = AC.createGain(); master.gain.value = muted ? 0 : 0.85;
    master.connect(comp); comp.connect(AC.destination);
    return true;
  } catch (e) { AC = null; return false; }
}
function ksBuffer(freq, dur, damp){
  const key = freq.toFixed(1) + '|' + dur + '|' + damp;
  if (bufCache.has(key)) return bufCache.get(key);
  const sr = AC.sampleRate, N = Math.max(2, Math.round(sr / freq)), len = Math.floor(sr * dur);
  const buf = AC.createBuffer(1, len, sr), d = buf.getChannelData(0);
  const ring = new Float32Array(N);
  for (let i = 0; i < N; i++) ring[i] = Math.random() * 2 - 1;          // noise burst
  let idx = 0;
  for (let i = 0; i < len; i++) {                                        // delay line of 1/f with averaging lowpass in the loop
    const a = ring[idx], b = ring[(idx + 1) % N];
    d[i] = a;
    ring[idx] = damp * 0.5 * (a + b);
    idx = (idx + 1) % N;
  }
  bufCache.set(key, buf);
  return buf;
}
function pluck(freq, when = 0, vol = 0.5, dur = 1.1, damp = 0.996, tone = 4200){
  if (!AC || muted) return;
  const t = AC.currentTime + when + 0.01;
  const src = AC.createBufferSource(); src.buffer = ksBuffer(freq, dur, damp);
  const lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = tone;
  const g = AC.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(vol, t + 0.008);
  g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
  src.connect(lp); lp.connect(g); g.connect(master);
  src.start(t); src.stop(t + dur + 0.05);
}
const PENT = [0, 2, 4, 7, 9];
const pent = step => 196 * Math.pow(2, (12 * Math.floor(step / 5) + PENT[((step % 5) + 5) % 5]) / 12); // G3-based pentatonic
const SFX = {
  motif(){ [3, 5, 7, 9].forEach((s, i) => pluck(pent(s), i * 0.13, 0.5, 1.3)); },
  tap(){ pluck(pent(10), 0, 0.28, 0.22, 0.97, 5200); },
  move(){ pluck(pent(8), 0, 0.22, 0.25, 0.975, 4000); },
  reveal(n){ pluck(pent(2 + Math.floor(n / 100 * 11)), 0, 0.55, 1.0); },
  good(){ [5, 7, 10].forEach((s, i) => pluck(pent(s), i * 0.07, 0.42, 0.9)); },
  bad(){ pluck(82.4, 0, 0.6, 0.9, 0.985, 900); pluck(87.3, 0.03, 0.5, 0.9, 0.985, 900); pluck(73.4, 0.22, 0.55, 1.0, 0.985, 800); },
  gold(){ [7, 9, 10, 12, 14].forEach((s, i) => pluck(pent(s), i * 0.08, 0.4, 1.2)); },
  win(){ [3, 5, 7, 9, 12, 14].forEach((s, i) => pluck(pent(s), i * 0.12, 0.5, 1.5)); [3, 7, 12].forEach(s => pluck(pent(s), 0.85, 0.35, 1.8)); },
  lose(){ [7, 5, 3, 0].forEach((s, i) => pluck(pent(s) / 2, i * 0.2, 0.5, 1.2, 0.99, 1500)); }
};

// ---------- state ----------
let S = null;
let names = load(KEY + 'names', ['', '', '', '']);
if (!Array.isArray(names) || names.length < 3) names = ['', '', '', ''];
let timerSetting = load(KEY + 'timer', 0);
let screen = 'setup';
let tick = null;
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const say = t => { const l = $('#live'); if (l) { l.textContent = ''; setTimeout(() => { l.textContent = t; }, 30); } };

function cardsPer(level, n){
  if (n <= 4) return [1,1,2,2,2,3,3,3][level - 1];
  if (n <= 6) return [1,1,1,2,2,2,2,2][level - 1];
  if (n === 7) return [1,1,1,1,1,1,2,2][level - 1];
  return 1;
}

function pickTheme(){
  let used = load(KEY + 'used', []);
  if (!Array.isArray(used)) used = [];
  const usedNow = new Set(used.concat(S.themesThisGame));
  let pool = THEMES.map((_, i) => i).filter(i => !usedNow.has(i));
  if (!pool.length) { used = []; pool = THEMES.map((_, i) => i).filter(i => !S.themesThisGame.includes(i)); }
  const i = pool[Math.floor(Math.random() * pool.length)];
  used.push(i); save(KEY + 'used', used.slice(-70));
  S.themesThisGame.push(i);
  return i;
}

function newGame(list){
  S = {
    players: list, level: 1, hearts: 3, score: 0, mult: 1,
    stars: list.map(() => 0), bulls: list.map(() => 0),
    themesThisGame: [], twistsUsed: [], perfect: 0, flipsOK: 0, flipsBad: 0
  };
  SFX.motif();
  startLevel();
}

function startLevel(){
  const n = S.players.length, per = cardsPer(S.level, n);
  S.theme = pickTheme();
  S.mult = S.level === LEVELS ? 2 : 1;
  S.twist = null;
  if (S.level >= 3) {
    const chance = S.level === LEVELS ? 1 : 0.6;
    if (Math.random() < chance) {
      let keys = Object.keys(TWISTS).filter(k => !S.twistsUsed.includes(k));
      if (S.hearts >= MAXH) keys = keys.filter(k => k !== 'golden');
      if (!keys.length) keys = Object.keys(TWISTS).filter(k => k !== 'golden');
      S.twist = keys[Math.floor(Math.random() * keys.length)];
      S.twistsUsed.push(S.twist);
    }
  }
  S.dir = S.twist === 'opposite' ? -1 : 1;
  S.band = [1, 100];
  if (S.twist === 'narrow') { const lo = 1 + Math.floor(Math.random() * 61); S.band = [lo, lo + 39]; }
  const total = n * per;
  const pool = [];
  for (let v = S.band[0]; v <= S.band[1]; v++) pool.push(v);
  shuffle(pool);
  S.cards = [];
  let id = 0;
  S.players.forEach((p, pi) => {
    for (let k = 0; k < per; k++) S.cards.push({ id: id++, owner: pi, label: per > 1 ? p + ' ' + 'ABC'[k] : p, num: pool[S.cards.length], gold: false });
  });
  if (total > pool.length) S.cards.forEach((c, i) => c.num = pool[i % pool.length]); // never happens (max 16 cards)
  if (S.twist === 'golden') S.cards[Math.floor(Math.random() * S.cards.length)].gold = true;
  S.silent = S.twist === 'silent' ? Math.floor(Math.random() * n) : -1;
  S.order = shuffle(S.cards.map(c => c.id));
  S.sel = null; S.dealIdx = 0; S.revealed = 0; S.maxV = -1; S.marks = {}; S.levelMistakes = 0;
  S.starPick = null; S.timerEnd = 0;
  go('intro');
}

const cardById = id => S.cards.find(c => c.id === id);
const valOf = c => S.dir === 1 ? c.num : 101 - c.num;

// ---------- navigation ----------
let navLock = 0;   // 26 Nov 2026: a double-tap on Continue used to press whatever button the next screen put there
function go(s){ if (s !== screen) navLock = performance.now() + 400; screen = s; render(); const a = $('#app'); if (a) a.scrollTop = 0; }

function hudHTML(){
  if (!S) return '';
  const hearts = '<span aria-hidden="true">' + '❤️'.repeat(Math.max(0, S.hearts)) + '<span style="color:var(--muted)">' + '♡'.repeat(Math.max(0, 3 - S.hearts)) + '</span></span>';
  return `<div class="hud">
    <span class="chip">Level ${S.level}/${LEVELS}${S.mult > 1 ? ' · x2' : ''}</span>
    <span class="chip">${hearts}<span class="sr">Lives: </span> ${S.hearts}</span>
    <span class="chip">Score ${S.score}</span>
  </div>`;
}
function soundBtn(){
  return `<button class="btn ghost small" data-act="mute" aria-pressed="${!muted}">Sound: ${muted ? 'Off' : 'On'}</button>`;
}
function topBar(){
  return `<div class="top">${hudHTML()}${soundBtn()}</div>`;
}
function titleHTML(){
  const L = [["L","b"],["I","r"],["N","g"],["E","y"],[" ","sp"],["'E","b"],["M","r"],[" ","sp"],["U","g"],["P","y"]];
  return `<h1 class="title" aria-label="Line 'Em Up">${L.map(([t, c]) => `<span class="${c}" aria-hidden="true">${t === ' ' ? '' : t}</span>`).join('')}</h1>`;
}
function themeHTML(){
  const t = THEMES[S.theme];
  return `<div class="theme pop">
    <div class="cat">Name something from: ${esc(t[0])}</div>
    <div class="q">${esc(t[1])}</div>
    <div class="ends"><span class="n">1</span><span>= ${esc(t[2])}</span><span class="n">100</span><span>= ${esc(t[3])}</span></div>
  </div>`;
}
function twistHTML(){
  if (!S.twist) return '';
  const T = TWISTS[S.twist];
  let extra = '';
  if (S.twist === 'narrow') extra = `<br>This level every number is between <b>${S.band[0]}</b> and <b>${S.band[1]}</b>.`;
  if (S.twist === 'silent') extra = `<br><b>${esc(S.players[S.silent])}</b> is the Silent Partner this level.`;
  return `<div class="twist ${S.twist === 'golden' ? 'gold' : ''}"><b>TWIST: ${T.name}</b><br>${T.text}${extra}</div>`;
}

// ---------- screens ----------
function render(){
  const app = $('#app');
  let h = '<div class="wrap">';
  if (screen === 'setup') h += setupHTML();
  else if (screen === 'rules') h += rulesHTML();
  else if (screen === 'intro') h += introHTML();
  else if (screen === 'pass') h += passHTML();
  else if (screen === 'peek') h += peekHTML();
  else if (screen === 'who') h += whoHTML();
  else if (screen === 'talk') h += talkHTML();
  else if (screen === 'reveal') h += revealHTML();
  else if (screen === 'summary') h += summaryHTML();
  else if (screen === 'end') h += endHTML();
  h += '</div>';
  app.innerHTML = h;
  if (screen === 'talk') startTimer(); else stopTimer();
}

  <p class="hint">Say your clues out loud, then put the cards in order. ${S.sel != null ? `<b>Now tap the card whose slot ${esc(cardById(S.sel).label)} should take.</b>` : 'Tap a name, then tap where it goes.'}</p>

function revealHTML(){
  const [topEnd, botEnd] = scaleEnds();
  const t = THEMES[S.theme];
  const items = S.order.map((cid, i) => {
    const c = cardById(cid), shown = i < S.revealed, m = S.marks[cid];
    const fresh = i === S.revealed - 1;
    return `<li>
      <span class="pos" aria-hidden="true">${i + 1}</span>
      <span class="stripe c${c.owner % 4}" aria-hidden="true"></span>
      <span class="lbl">${esc(c.label)}${c.gold ? ' ⭐' : ''}</span>
      <span class="num ${shown ? (m === 'bad' ? 'bad' : 'ok') : 'hid'} ${fresh ? 'flip' : ''}">${shown ? c.num + (m === 'bad' ? ' ✗' : '') : '?'}</span>
    </li>`;
  }).join('');
  const done = S.revealed >= S.order.length;
  return `${topBar()}
  <h3>${esc(t[0])}: ${esc(t[1])}</h3>
  <div class="scaleEnd">${topEnd}</div>

         : `<div class="row"><button class="btn yellow big grow" data-act="flip">Flip the next card</button><button class="btn ghost small" data-act="flipAll">Flip all</button></div>`}`;
}

// ---------- timer ----------
function startTimer(){
  stopTimer();
  if (!S || !S.timerEnd) return;
  const upd = () => {
    const el = $('#timer'); if (!el) return;
    const left = Math.max(0, Math.ceil((S.timerEnd - Date.now()) / 1000));
    el.textContent = Math.floor(left / 60) + ':' + String(left % 60).padStart(2, '0');
    el.classList.toggle('low', left <= 15);
    if (left <= 0) { stopTimer(); SFX.bad(); say("Time's up. The line is locked."); lockIn(); }
  };
  upd(); tick = setInterval(upd, 250);
}
function stopTimer(){ if (tick) { clearInterval(tick); tick = null; } }

// ---------- game actions ----------
function moveTo(cid, idx){
  const from = S.order.indexOf(cid);
  if (from < 0 || idx < 0 || idx >= S.order.length) return;
  S.order.splice(from, 1); S.order.splice(idx, 0, cid);
}
function lockIn(){
  stopTimer();
  S.sel = null; S.revealed = 0; S.maxV = -1; S.marks = {}; S.levelMistakes = 0; S.revMsg = '';
  const sorted = S.cards.slice().sort((a, b) => valOf(a) - valOf(b)).map(c => c.id);
  S.bullNames = [];
  S.order.forEach((cid, i) => { if (sorted[i] === cid) { const c = cardById(cid); S.bulls[c.owner]++; if (!S.bullNames.includes(c.label)) S.bullNames.push(c.label); } });
  go('reveal');
}
function flipOne(quiet){
  if (S.revealed >= S.order.length) return;
  const c = cardById(S.order[S.revealed]);
  const v = valOf(c);
  S.revealed++;
  if (v < S.maxV) {
    S.marks[c.id] = 'bad'; S.levelMistakes++; S.flipsBad++;
    S.hearts = Math.max(0, S.hearts - 1);
    S.revMsg = `<b style="color:var(--red)">${esc(c.label)}'s ${c.num} is out of order!</b> A life is lost.`;
    if (!quiet) SFX.bad();
  } else {
    S.maxV = v; S.marks[c.id] = 'ok'; S.flipsOK++;
    S.score += 10 * S.mult;
    S.revMsg = `${esc(c.label)}: <b>${c.num}</b>. In order! +${10 * S.mult}`;
    if (c.gold && S.hearts > 0 && S.hearts < MAXH) { S.hearts++; S.revMsg += ' Golden card: <b>+1 life!</b>'; if (!quiet) SFX.gold(); }
    else if (!quiet) SFX.reveal(c.num);
  }
  say(S.revMsg.replace(/<[^>]+>/g, ''));
}
function afterReveal(){
  if (S.levelMistakes === 0) { S.score += 20 * S.mult; S.perfect++; }
  if (S.hearts <= 0) return finish(false);
  if (S.level >= LEVELS) return finish(true);
  if (S.levelMistakes === 0) SFX.good();
  go('summary');
}
function finish(won){
  S.won = won;
  const best = load(KEY + 'best', null);
  S.newBest = !best || S.score > best.score;
  if (S.newBest) save(KEY + 'best', { score: S.score, level: S.level });
  won ? SFX.win() : SFX.lose();
  go('end');
}

document.addEventListener('input', e => {
  const t = e.target;
  if (t.matches && t.matches('input[data-i]')) { names[+t.dataset.i] = t.value; save(KEY + 'names', names); }
});

document.addEventListener('click', e => {
  const b = e.target.closest('button[data-act]');
  if (!b) return;
  ensureAudio();
  const act = b.dataset.act;
  if (act !== 'mute' && performance.now() < navLock) return;
  switch (act) {
    case 'mute':
      muted = !muted; save(KEY + 'mute', muted);
      if (master) master.gain.value = muted ? 0 : 0.85;
      render(); if (!muted) SFX.tap(); break;
    case 'addName': if (names.length < 10) { names.push(''); save(KEY + 'names', names); render(); const ins = document.querySelectorAll('input[data-i]'); ins[ins.length - 1].focus(); } break;
    case 'delName': if (names.length > 3) { names.splice(+b.dataset.i, 1); save(KEY + 'names', names); render(); } break;
    case 'timer': timerSetting = +b.dataset.v; save(KEY + 'timer', timerSetting); SFX.tap(); render(); break;
    case 'rules': S && (S.backTo = screen); go('rules'); break;
    case 'back': go(S ? (S.backTo || 'intro') : 'setup'); break;
    case 'start': {
      const list = names.map((n, i) => (n || '').trim() || 'Player ' + (i + 1));
      // de-duplicate names so cards stay readable
      // Sam, Sam, "Sam 2" used to make two "Sam 2"s: keep every name as first typed, renumber only the repeats
      const low = list.map(n => n.toLowerCase()), used = new Set(low);
      const uniq = list.map((n, i) => { if (low.indexOf(low[i]) === i) return n; let k = 2, m; do { m = n + ' ' + (k++); } while (used.has(m.toLowerCase())); used.add(m.toLowerCase()); return m; });
      newGame(uniq); break;
    }
    case 'deal': SFX.tap(); S.dealIdx = 0; go('pass'); break;
    case 'show': SFX.tap(); S.peekWho = S.dealIdx; S.peekFrom = 'deal'; go('peek'); break;
    case 'hide':
      SFX.tap();
      if (S.peekFrom === 'deal') {
        S.dealIdx++;
        if (S.dealIdx < S.players.length) go('pass');
        else {
          const secs = S.twist === 'quick' ? 75 : timerSetting;
          S.timerEnd = secs ? Date.now() + secs * 1000 : 0;
          SFX.motif(); go('talk');
        }
      } else go('talk');
      break;
    case 'who': SFX.tap(); go('who'); break;
    case 'peekP': SFX.tap(); S.peekWho = +b.dataset.i; S.peekFrom = 'talk'; go('peek'); break;
    case 'talk': go('talk'); break;
    case 'pick': {
      const id = +b.dataset.id;
      if (S.sel == null) { S.sel = id; SFX.tap(); }
      else if (S.sel === id) { S.sel = null; SFX.tap(); }
      else { moveTo(S.sel, S.order.indexOf(id)); SFX.move(); say(cardById(S.sel).label + ' moved to slot ' + (S.order.indexOf(S.sel) + 1)); S.sel = null; }
      renderKeepFocus('pick', id); break;
    }
    case 'up': case 'down': {
      const id = +b.dataset.id, i = S.order.indexOf(id);
      moveTo(id, i + (act === 'up' ? -1 : 1)); S.sel = null; SFX.move();
      say(cardById(id).label + ' now in slot ' + (S.order.indexOf(id) + 1));
      renderKeepFocus(act, id); break;
    }
    case 'lock': SFX.tap(); lockIn(); break;
    case 'flip': flipOne(false); render(); break;
    case 'flipAll': while (S.revealed < S.order.length) flipOne(true); S.levelMistakes ? SFX.bad() : SFX.good(); render(); break;
    case 'afterReveal': afterReveal(); break;
    case 'star': { const i = +b.dataset.i; S.starPick = S.starPick === i ? null : i; SFX.tap(); const y = $('#app').scrollTop; render(); $('#app').scrollTop = y; break; }
    case 'nextLevel': if (S.starPick != null) S.stars[S.starPick]++; S.starPick = null; S.level++; startLevel(); break;
    case 'again': newGame(S.players); break;
    case 'home': S = null; go('setup'); break;
  }
});
function renderKeepFocus(act, id){
  const y = $('#app').scrollTop;
  render();
  $('#app').scrollTop = y;
  const el = document.querySelector(`button[data-act="${act}"][data-id="${id}"]`) || document.querySelector(`button[data-act="pick"][data-id="${id}"]`);
  if (el && !el.disabled) el.focus({ preventScroll: true });
}

render();
</script>
</body>
