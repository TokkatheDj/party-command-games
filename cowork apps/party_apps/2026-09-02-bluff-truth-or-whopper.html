<!DOCTYPE html>
<!-- CONCEPT: bluff/deception - Pass-the-device party game where every player writes a fake ending to a weird true fact, then everyone stakes 1-3 stars of confidence voting for the real one; points for finding truth AND for fooling people. Bucket: BLUFF & DECEPTION. 3-8 players, ~20-30 min. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Truth or Whopper — Party Bluffing Game</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  :root{
    --bg:#120b26; --ink:#fff8ec;
    --gold:#ffce3d; --hot:#ff3d81; --cyan:#2ff3e0; --lime:#9dff4d;
    --dim:#a99cc9; --card:#26154f; --card2:#331d66;
  }
  html,body{height:100%}
  body{
    font-family:"Trebuchet MS","Segoe UI",system-ui,-apple-system,sans-serif;
    background:radial-gradient(circle at 20% 0%,#2b1560 0%,var(--bg) 55%,#0b0618 100%);
    color:var(--ink);min-height:100%;
    display:flex;align-items:stretch;justify-content:center;
    padding:max(10px,env(safe-area-inset-top)) 10px max(10px,env(safe-area-inset-bottom));
    overflow-x:hidden;
  }
  #app{width:100%;max-width:960px;display:flex;flex-direction:column;justify-content:center;padding:8px 0 20px}
  .scr{animation:pop .28s cubic-bezier(.2,1.4,.5,1)}
  @keyframes pop{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:none}}

  h1{font-size:clamp(2.4rem,8.5vw,4.6rem);line-height:.94;letter-spacing:-2px;text-transform:uppercase;
     background:linear-gradient(180deg,#fff 10%,var(--gold) 55%,var(--hot) 100%);
     -webkit-background-clip:text;background-clip:text;color:transparent;
     text-align:center;filter:drop-shadow(0 4px 0 rgba(0,0,0,.45))}
  .tag{text-align:center;color:var(--cyan);font-size:clamp(.95rem,3.2vw,1.3rem);font-weight:bold;margin-top:8px;letter-spacing:.5px}
  .sub{text-align:center;color:var(--dim);font-size:clamp(.8rem,2.6vw,1rem);margin-top:6px}

  .panel{background:linear-gradient(180deg,var(--card2),var(--card));border:3px solid rgba(255,255,255,.14);
         border-radius:22px;padding:18px;margin-top:16px;box-shadow:0 14px 0 rgba(0,0,0,.35)}

  .btn{display:block;width:100%;border:none;border-radius:18px;cursor:pointer;
       font-family:inherit;font-weight:900;text-transform:uppercase;letter-spacing:1px;
       font-size:clamp(1.05rem,4vw,1.5rem);padding:20px 16px;margin-top:14px;
       background:linear-gradient(180deg,#ffe27a,var(--gold));color:#3a1d00;
       box-shadow:0 7px 0 #b07d00;transition:transform .08s,box-shadow .08s}
  .btn:active{transform:translateY(5px);box-shadow:0 2px 0 #b07d00}
  .btn.pink{background:linear-gradient(180deg,#ff86b4,var(--hot));color:#440018;box-shadow:0 7px 0 #a30049}
  .btn.pink:active{box-shadow:0 2px 0 #a30049}
  .btn.cyan{background:linear-gradient(180deg,#9dfff5,var(--cyan));color:#00332e;box-shadow:0 7px 0 #0d9b8f}
  .btn.cyan:active{box-shadow:0 2px 0 #0d9b8f}
  .btn.ghost{background:transparent;color:var(--dim);border:3px solid rgba(255,255,255,.2);box-shadow:none;
             font-size:1rem;padding:14px}
  .btn.ghost:active{transform:translateY(2px);box-shadow:none}
  .btn:disabled{opacity:.4;cursor:not-allowed}

  input[type=text]{width:100%;font-family:inherit;font-size:clamp(1.1rem,4.4vw,1.6rem);font-weight:bold;
    padding:18px;border-radius:16px;border:3px solid var(--cyan);background:#0d0722;color:var(--ink);outline:none}
  input[type=text]::placeholder{color:#6b5f8f}

  .plist{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
  .chip{background:var(--card2);border:3px solid var(--cyan);border-radius:999px;padding:10px 16px;
        font-weight:bold;font-size:1.05rem;display:flex;align-items:center;gap:10px}
  .chip b{background:var(--cyan);color:#002b27;border-radius:999px;width:26px;height:26px;
          display:grid;place-items:center;font-size:.9rem}
  .chip span{color:var(--hot);font-size:1.4rem;cursor:pointer;line-height:.8}

  .prompt{font-size:clamp(1.3rem,5.2vw,2.4rem);font-weight:bold;line-height:1.3;text-align:center;padding:6px 2px}
  .blank{color:var(--gold);letter-spacing:2px}
  .kicker{text-align:center;text-transform:uppercase;letter-spacing:3px;font-size:.85rem;color:var(--hot);font-weight:900}

  .handoff{text-align:center;padding:26px 10px}
  .handoff .who{font-size:clamp(2rem,9vw,3.6rem);font-weight:900;color:var(--gold);line-height:1;margin:10px 0;word-break:break-word}
  .eyes{font-size:clamp(2.6rem,11vw,4rem);letter-spacing:8px}

  .opt{width:100%;text-align:left;border:3px solid rgba(255,255,255,.18);background:var(--card2);color:var(--ink);
       border-radius:16px;padding:16px 18px;margin-top:12px;font-family:inherit;font-weight:bold;
       font-size:clamp(1rem,3.9vw,1.35rem);cursor:pointer;display:flex;gap:14px;align-items:center;line-height:1.25}
  .opt:active{transform:scale(.985)}
  .opt .num{flex:0 0 auto;width:36px;height:36px;border-radius:10px;background:var(--hot);color:#fff;
            display:grid;place-items:center;font-size:1rem}
  .opt.sel{border-color:var(--gold);background:#4a2f00}
  .opt.mine{opacity:.42;cursor:not-allowed}

  .stars{display:flex;gap:10px;margin-top:14px}
  .star{flex:1;border:3px solid rgba(255,255,255,.18);background:var(--card2);color:var(--ink);border-radius:16px;
        padding:14px 6px;font-family:inherit;font-weight:900;cursor:pointer;text-align:center;font-size:.8rem;
        text-transform:uppercase;letter-spacing:.5px;line-height:1.4}
  .star .s{display:block;font-size:1.5rem;letter-spacing:-2px;margin-bottom:4px}
  .star.sel{border-color:var(--gold);background:#4a2f00;color:var(--gold)}

  table{width:100%;border-collapse:collapse;margin-top:12px}
  td{padding:12px 8px;font-size:clamp(1rem,3.8vw,1.4rem);font-weight:bold;border-bottom:2px solid rgba(255,255,255,.09)}
  td.pts{text-align:right;color:var(--gold);font-variant-numeric:tabular-nums;white-space:nowrap}
  td.dlt{text-align:right;color:var(--lime);font-size:.85em;width:1%;white-space:nowrap;padding-left:12px}
  td.dlt.neg{color:#ff6b6b}
  tr.lead td{color:var(--gold)}

  .rev{border-radius:16px;padding:14px 16px;margin-top:12px;border:3px solid rgba(255,255,255,.14);background:var(--card2)}
  .rev.t{border-color:var(--lime);background:#173a05}
  .rev .ans{font-size:clamp(1.05rem,4.1vw,1.5rem);font-weight:900;line-height:1.2}
  .rev .meta{font-size:.9rem;color:var(--dim);margin-top:8px;line-height:1.5}
  .rev .meta b{color:var(--cyan)}
  .rev.t .meta b{color:var(--lime)}

  .bar{display:flex;justify-content:space-between;align-items:center;font-size:.85rem;color:var(--dim);
       text-transform:uppercase;letter-spacing:2px;font-weight:bold;padding:0 4px}
  .rules{color:var(--dim);font-size:clamp(.85rem,3vw,1.02rem);line-height:1.65;margin-top:10px}
  .rules b{color:var(--gold)}
  .warn{color:var(--hot);text-align:center;font-weight:bold;margin-top:10px;min-height:1.2em;font-size:.95rem}
  .crown{text-align:center;font-size:clamp(3rem,14vw,6rem);line-height:1}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ============================================================
   TRUTH OR WHOPPER — bluff & deception party game
   3-8 players · one device passed around · ~20-30 min (5 rounds)
   ============================================================ */

/* ---------- SOUND (Web Audio, no files) ---------- */
let AC=null;
function ac(){ if(!AC){ try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){} } return AC; }
function tone(f,d,t,v,delay){
  const c=ac(); if(!c) return;
  const o=c.createOscillator(), g=c.createGain(), s=c.currentTime+(delay||0);
  o.type=t||'square'; o.frequency.setValueAtTime(f,s);
  g.gain.setValueAtTime(0.0001,s);
  g.gain.linearRampToValueAtTime(v||0.18,s+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001,s+d);
  o.connect(g); g.connect(c.destination); o.start(s); o.stop(s+d+0.05);
}
const SFX={
  tap:()=>tone(520,.07,'square',.10),
  pass:()=>{tone(330,.10,'triangle',.14,0);tone(495,.14,'triangle',.14,.09);},
  lock:()=>{tone(660,.08,'square',.12,0);tone(880,.12,'square',.12,.07);},
  truth:()=>{[523,659,784,1046].forEach((f,i)=>tone(f,.30,'triangle',.16,i*.08));},
  win:()=>{[523,659,784,1046,1318,1568].forEach((f,i)=>tone(f,.42,'triangle',.17,i*.11));}
};

/* ---------- 70 TRUE-FACT PROMPTS (blank = the real answer) ---------- */
const FACTS=[
 ["The official state sport of Maryland is ___.","Jousting"],
 ["A group of flamingos is called ___.","A flamboyance"],
 ["The dot over a lowercase letter i is called ___.","A tittle"],
 ["In Japan, a bucket of KFC is a traditional meal on ___.","Christmas"],
 ["Sea otters hold hands while they sleep so they don't ___.","Drift apart"],
 ["The shortest war in recorded history lasted about 38 ___.","Minutes"],
 ["A shrimp's heart is located inside its ___.","Head"],
 ["The largest desert on Earth is ___.","Antarctica"],
 ["Honey found sealed in ancient Egyptian tombs was still ___.","Edible"],
 ["Wombat droppings are famously shaped like ___.","Cubes"],
 ["The unicorn is the official national animal of ___.","Scotland"],
 ["An octopus has ___ hearts.","Three"],
 ["A 'murder' is the collective noun for a group of ___.","Crows"],
 ["The man who invented the Pringles can was buried in ___.","A Pringles can"],
 ["Cows form close friendships and get stressed when they are ___.","Separated"],
 ["The longest recorded flight by a chicken lasted about 13 ___.","Seconds"],
 ["Nintendo was founded in 1889 and originally made ___.","Playing cards"],
 ["The Eiffel Tower can grow about 15 cm taller during ___.","Summer"],
 ["The technical name for the # symbol is ___.","An octothorpe"],
 ["Scotland's traditional national dish is ___.","Haggis"],
 ["There are more possible games of chess than there are ___ in the observable universe.","Atoms"],
 ["A 'jiffy' is a genuine scientific unit of ___.","Time"],
 ["Vending machines statistically injure more people each year than ___.","Sharks"],
 ["Bubble wrap was originally invented to be sold as ___.","Wallpaper"],
 ["The very first item ever sold on eBay was a broken ___.","Laser pointer"],
 ["In 2008 the Norwegian King's Guard formally knighted a ___.","Penguin"],
 ["Cotton candy was co-invented by a ___.","Dentist"],
 ["A group of pugs is called ___.","A grumble"],
 ["If you had a bathtub big enough, the planet Saturn would ___.","Float"],
 ["The industry name for the blob of toothpaste on a brush is ___.","A nurdle"],
 ["Scientists have shown that honeybees can recognise human ___.","Faces"],
 ["The loudest animal on Earth is the ___.","Sperm whale"],
 ["Botanically speaking, peanuts are not nuts — they are ___.","Legumes"],
 ["The world's oldest surviving written recipe is for ___.","Beer"],
 ["An ostrich's eye is bigger than its ___.","Brain"],
 ["Astronauts in orbit famously cannot ___.","Burp"],
 ["When it was first unveiled, the Statue of Liberty was the colour ___.","Brown"],
 ["Between 1900 and 1920, tug of war was an official Olympic ___.","Sport"],
 ["A baker's dozen is ___.","Thirteen"],
 ["Sloths can hold their breath for longer than ___.","Dolphins"],
 ["The smallest country in the world by area is ___.","Vatican City"],
 ["Cheetahs cannot roar — instead they ___.","Chirp"],
 ["Measured coast to coast, Australia is wider than the ___.","Moon"],
 ["The little plastic tip on the end of a shoelace is called ___.","An aglet"],
 ["A group of jellyfish is called ___.","A smack"],
 ["An average fluffy white cloud weighs roughly a million ___.","Pounds"],
 ["Sharks have existed on Earth for longer than ___.","Trees"],
 ["Mount Everest gets about 4 millimetres taller every ___.","Year"],
 ["Lobsters taste their food using their ___.","Feet"],
 ["The hottest planet in our solar system is ___.","Venus"],
 ["A snail can stay asleep for up to three ___.","Years"],
 ["The very first computer 'bug' was an actual ___.","Moth"],
 ["Humans share roughly 60% of their DNA with ___.","Bananas"],
 ["Butterflies taste things using their ___.","Feet"],
 ["Parts of the Great Wall of China were held together using ___.","Sticky rice"],
 ["Elephants are the only mammal that cannot ___.","Jump"],
 ["Underneath their fur, polar bears' skin is actually ___.","Black"],
 ["On Venus, a single day lasts longer than a ___.","Year"],
 ["In the 1830s, ketchup was sold in America as ___.","Medicine"],
 ["On any standard die, opposite faces always add up to ___.","Seven"],
 ["A pineapple plant takes about two ___ to produce a single fruit.","Years"],
 ["The name 'Google' came from a misspelling of ___.","Googol"],
 ["The largest snowflake ever recorded was about 15 ___ across.","Inches"],
 ["Flamingos get their pink colour from what they ___.","Eat"],
 ["A newborn kangaroo is roughly the size of a ___.","Jellybean"],
 ["Crocodiles are physically unable to stick out their ___.","Tongue"],
 ["Sound travels about four times faster through ___ than through air.","Water"],
 ["Alaska is the only US state whose name can be typed on one row of a ___.","Keyboard"],
 ["A newly hatched duckling will follow the first thing it ___.","Sees"],
 ["Bananas are slightly radioactive because they contain ___.","Potassium"],
 ["The world's largest living organism is a ___.","Fungus"],
 ["A hummingbird's heart can beat over 1,200 times per ___.","Minute"]
];

/* ---------- STATE ---------- */
const S_SETUP=0,S_RULES=1,S_HAND=2,S_LIE=3,S_VOTE=4,S_STAR=5,S_REVEAL=6,S_SCORE=7,S_END=8;
let G=null, setupNames=[], setupRounds=5, setupWarn='';
const el=document.getElementById('app');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s).toLowerCase().replace(/^(a|an|the)\s+/,'').replace(/[^a-z0-9 ]/g,'').replace(/\s+/g,' ').trim();
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function newGame(names,rounds){
  G={ players:names.map(n=>({name:n,score:0,delta:0})),
      rounds:rounds, round:0, deck:shuffle(FACTS.slice()), fact:null,
      lies:[], options:[], votes:[], turn:0, sel:null, stars:null,
      phase:'lie', screen:S_HAND, warn:'' };
  startRound();
}
function startRound(){
  G.round++;
  if(!G.deck.length) G.deck=shuffle(FACTS.slice());
  G.fact=G.deck.pop();
  G.lies=G.players.map(()=>'');
  G.votes=G.players.map(()=>null);
  G.options=[];
  G.turn=0; G.sel=null; G.stars=null; G.warn='';
  G.phase='lie'; G.screen=S_HAND;
}
function buildOptions(){
  const truthKey=norm(G.fact[1]);
  const map=new Map();
  G.players.forEach((p,i)=>{
    const raw=G.lies[i].trim(), k=norm(raw);
    if(k===truthKey){ p.accidental=true; return; }   // they wrote the real answer
    if(map.has(k)) map.get(k).authors.push(i);
    else map.set(k,{text:raw,authors:[i],truth:false});
  });
  const opts=[...map.values()];
  opts.push({text:G.fact[1],authors:[],truth:true});
  G.options=shuffle(opts);
}

/* ---------- SCORING ---------- */
function score(){
  G.players.forEach(p=>p.delta=0);
  G.players.forEach((p,i)=>{
    const v=G.votes[i]; if(!v) return;
    const o=G.options[v.opt];
    if(o.truth){ p.delta+=300*v.stars; }
    else { p.delta-=100*v.stars; o.authors.forEach(a=>{ G.players[a].delta+=250*v.stars; }); }
  });
  G.players.forEach(p=>{ if(p.accidental) p.delta+=500; });
  G.players.forEach(p=>{ p.score=Math.max(0,p.score+p.delta); });
}

/* ---------- RENDER ---------- */
function render(){
  const s=G?G.screen:S_SETUP;
  if(s===S_SETUP){ el.innerHTML=vSetup(); return; }
  if(s===S_RULES){ el.innerHTML=vRules(); return; }
  if(s===S_HAND ){ el.innerHTML=vHand();  return; }
  if(s===S_LIE  ){ el.innerHTML=vLie();   focusInput(); return; }
  if(s===S_VOTE ){ el.innerHTML=vVote();  return; }
  if(s===S_STAR ){ el.innerHTML=vStar();  return; }
  if(s===S_REVEAL){el.innerHTML=vReveal();return; }
  if(s===S_SCORE){ el.innerHTML=vScore(); return; }
  if(s===S_END  ){ el.innerHTML=vEnd();   return; }
}
function focusInput(){ const i=document.getElementById('inp'); if(i) setTimeout(()=>i.focus(),90); }

/* ---- setup ---- */
function vSetup(){
  return `<div class="scr">
    <h1>Truth<br>or Whopper</h1>
    <div class="tag">Everybody lies. One answer isn't lying.</div>
    <div class="sub">3–8 players · one device passed around · about 20–30 minutes</div>
    <div class="panel">
      <div class="kicker">Who's playing?</div>
      <div style="display:flex;gap:10px;margin-top:12px">
        <input type="text" id="nm" maxlength="14" placeholder="Type a name…" autocomplete="off">
        <button class="btn cyan" style="width:auto;margin:0;padding:18px 24px" onclick="addName()">+</button>
      </div>
      <div class="plist">${setupNames.map((n,i)=>`<div class="chip"><b>${i+1}</b>${esc(n)}<span onclick="delName(${i})">&times;</span></div>`).join('')||'<div class="sub" style="padding:8px 4px">Add at least 3 players.</div>'}</div>
      <div class="warn">${esc(setupWarn)}</div>
      <div class="kicker" style="margin-top:12px">How many rounds?</div>
      <div class="stars">
        ${[3,5,8].map(r=>`<button class="star ${setupRounds===r?'sel':''}" onclick="setRounds(${r})"><span class="s">${r}</span>rounds</button>`).join('')}
      </div>
      <button class="btn" onclick="go()">Start Game</button>
      <button class="btn ghost" onclick="showRules()">How to play</button>
    </div>
  </div>`;
}
function showRules(){ SFX.tap(); G={screen:S_RULES}; render(); }
function setRounds(r){ SFX.tap(); setupRounds=r; render(); }
function addName(){
  const i=document.getElementById('nm'); if(!i) return;
  const v=(i.value||'').trim();
  if(!v) return;
  if(setupNames.length>=8){ setupWarn='8 players maximum.'; render(); return; }
  if(setupNames.some(n=>n.toLowerCase()===v.toLowerCase())){ setupWarn='That name is already taken.'; render(); return; }
  SFX.tap(); setupNames.push(v); setupWarn=''; G=null; render();
  const n=document.getElementById('nm'); if(n) n.focus();
}
function delName(i){ SFX.tap(); setupNames.splice(i,1); setupWarn=''; G=null; render(); }
function go(){
  ac();
  if(setupNames.length<3){ setupWarn='You need at least 3 players.'; G=null; render(); return; }
  SFX.lock(); newGame(setupNames,setupRounds); render();
}
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter') return;
  const a=document.activeElement; if(!a) return;
  if(a.id==='nm'){ e.preventDefault(); addName(); }
  else if(a.id==='inp'){ e.preventDefault(); submitLie(); }
});

/* ---- rules ---- */
function vRules(){
  return `<div class="scr">
    <h1>How to play</h1>
    <div class="panel">
      <div class="rules">
        <b>1.</b> A real (and very strange) fact appears with its ending blanked out.<br><br>
        <b>2.</b> The device passes around. Each player secretly types a <b>convincing fake ending</b>.<br><br>
        <b>3.</b> All the fakes are shuffled in with the real answer. The device goes round again and everyone
        votes for the one they think is <b>true</b>, staking <b>1, 2 or 3 stars</b> of confidence.<br><br>
        <b>4.</b> Scoring each round:<br>
        &nbsp;&nbsp;• Found the truth — <b>+300 × your stars</b><br>
        &nbsp;&nbsp;• Fell for a fake — <b>−100 × your stars</b><br>
        &nbsp;&nbsp;• Someone fell for <i>your</i> fake — <b>+250 × their stars</b><br>
        &nbsp;&nbsp;• Your fake accidentally <i>was</i> the truth — <b>+500</b><br><br>
        The big scores come from writing lies people want to believe, not from being right.
      </div>
      <button class="btn" onclick="G=null;render()">Back</button>
    </div>
  </div>`;
}

/* ---- handoff ---- */
function vHand(){
  const p=G.players[G.turn], lie=G.phase==='lie';
  return `<div class="scr">
    <div class="bar"><span>Round ${G.round}/${G.rounds}</span><span>${lie?'Writing lies':'Voting'} · ${G.turn+1}/${G.players.length}</span></div>
    <div class="panel handoff">
      <div class="eyes">🙈</div>
      <div class="kicker" style="margin-top:14px">Pass the device to</div>
      <div class="who">${esc(p.name)}</div>
      <div class="sub">Everyone else — eyes up, no peeking.</div>
      <button class="btn ${lie?'pink':'cyan'}" onclick="beginTurn()">I'm ${esc(p.name)} — ready</button>
    </div>
  </div>`;
}
function beginTurn(){ SFX.pass(); G.screen=(G.phase==='lie')?S_LIE:S_VOTE; G.sel=null; G.stars=null; G.warn=''; render(); }

/* ---- lie entry ---- */
function factHTML(){ return esc(G.fact[0]).replace('___','<span class="blank">________</span>'); }
function vLie(){
  const p=G.players[G.turn];
  return `<div class="scr">
    <div class="bar"><span>Round ${G.round}/${G.rounds}</span><span>${esc(p.name)}</span></div>
    <div class="panel">
      <div class="kicker">This is a true fact — invent the ending</div>
      <div class="prompt" style="margin:14px 0">${factHTML()}</div>
      <input type="text" id="inp" maxlength="46" placeholder="Your believable lie…" autocomplete="off" autocorrect="off">
      <div class="warn">${esc(G.warn)}</div>
      <button class="btn pink" onclick="submitLie()">Lock it in</button>
      <div class="sub">Make it sound real. Every vote it steals scores you points.</div>
    </div>
  </div>`;
}
function submitLie(){
  const i=document.getElementById('inp'); if(!i) return;
  const v=(i.value||'').trim();
  if(v.length<2){ G.warn='Write something first!'; render(); return; }
  if(G.lies.some((l,k)=>k<G.turn && norm(l)===norm(v))){ G.warn='Someone already wrote that — try another angle.'; render(); return; }
  SFX.lock();
  G.lies[G.turn]=v; G.turn++; G.warn='';
  if(G.turn<G.players.length){ G.screen=S_HAND; }
  else { buildOptions(); G.phase='vote'; G.turn=0; G.screen=S_HAND; }
  render();
}

/* ---- voting ---- */
function vVote(){
  const p=G.players[G.turn];
  return `<div class="scr">
    <div class="bar"><span>Round ${G.round}/${G.rounds}</span><span>${esc(p.name)} votes</span></div>
    <div class="panel">
      <div class="kicker">Which ending is the real one?</div>
      <div class="prompt" style="margin:12px 0 4px">${factHTML()}</div>
      ${G.options.map((o,i)=>{
        const mine=o.authors.indexOf(G.turn)>-1;
        return `<button class="opt ${mine?'mine':''} ${G.sel===i?'sel':''}" ${mine?'disabled':''} onclick="pick(${i})">
          <span class="num">${i+1}</span><span>${esc(o.text)}${mine?' &nbsp;<i style="color:var(--dim);font-weight:normal">(yours)</i>':''}</span></button>`;
      }).join('')}
      <button class="btn" ${G.sel===null?'disabled':''} onclick="toStars()">Confirm choice</button>
    </div>
  </div>`;
}
function pick(i){ SFX.tap(); G.sel=i; render(); }
function toStars(){ if(G.sel===null) return; SFX.tap(); G.screen=S_STAR; G.stars=null; render(); }

function vStar(){
  const p=G.players[G.turn], o=G.options[G.sel];
  const labels=['hunch','fairly sure','certain'];
  return `<div class="scr">
    <div class="bar"><span>Round ${G.round}/${G.rounds}</span><span>${esc(p.name)}</span></div>
    <div class="panel">
      <div class="kicker">How sure are you?</div>
      <div class="prompt" style="margin:14px 0;color:var(--cyan)">“${esc(o.text)}”</div>
      <div class="stars">
        ${[1,2,3].map(n=>`<button class="star ${G.stars===n?'sel':''}" onclick="setStars(${n})">
          <span class="s">${'★'.repeat(n)}</span>${labels[n-1]}<br>
          <span style="font-size:.72rem;opacity:.85">+${300*n} / −${100*n}</span></button>`).join('')}
      </div>
      <button class="btn cyan" ${!G.stars?'disabled':''} onclick="castVote()">Lock in vote</button>
      <button class="btn ghost" onclick="backToVote()">Change answer</button>
    </div>
  </div>`;
}
function backToVote(){ SFX.tap(); G.screen=S_VOTE; render(); }
function setStars(n){ SFX.tap(); G.stars=n; render(); }
function castVote(){
  if(!G.stars) return;
  SFX.lock();
  G.votes[G.turn]={opt:G.sel,stars:G.stars};
  G.turn++; G.sel=null; G.stars=null;
  if(G.turn<G.players.length){ G.screen=S_HAND; }
  else { score(); G.screen=S_REVEAL; setTimeout(SFX.truth,280); }
  render();
}

/* ---- reveal ---- */
function vReveal(){
  const rows=G.options.map((o,i)=>{
    const voterIdx=G.players.map((p,k)=>k).filter(k=>G.votes[k]&&G.votes[k].opt===i);
    const vtxt=voterIdx.length? voterIdx.map(k=>esc(G.players[k].name)+' '+'★'.repeat(G.votes[k].stars)).join(', ') : 'nobody';
    const auth=o.truth?'the actual truth':('written by '+o.authors.map(a=>esc(G.players[a].name)).join(' &amp; '));
    const gained=o.truth?0:voterIdx.reduce((s,k)=>s+250*G.votes[k].stars,0);
    return `<div class="rev ${o.truth?'t':''}">
      <div class="ans">${o.truth?'✅ ':'🤥 '}${esc(o.text)}</div>
      <div class="meta">${auth}${gained?` — <b>+${gained}</b> to the author${o.authors.length>1?'s':''}`:''}<br>Voted for by: <b>${vtxt}</b></div>
    </div>`;
  }).join('');
  const acc=G.players.filter(p=>p.accidental);
  return `<div class="scr">
    <div class="bar"><span>Round ${G.round}/${G.rounds}</span><span>The reveal</span></div>
    <div class="panel">
      <div class="prompt" style="margin-bottom:6px">${factHTML()}</div>
      <div class="kicker" style="margin:14px 0 2px">…and the truth is</div>
      <div class="prompt" style="color:var(--lime);margin:8px 0 4px">${esc(G.fact[1])}</div>
      ${rows}
      ${acc.length?`<div class="rev t"><div class="ans">🎯 Accidental truth!</div><div class="meta"><b>${acc.map(p=>esc(p.name)).join(', ')}</b> wrote the real answer by mistake — <b>+500</b> each.</div></div>`:''}
      <button class="btn" onclick="toScore()">See the scores</button>
    </div>
  </div>`;
}
function toScore(){ SFX.tap(); G.players.forEach(p=>{ delete p.accidental; }); G.screen=S_SCORE; render(); }

/* ---- scoreboard ---- */
function vScore(){
  const sorted=G.players.slice().sort((a,b)=>b.score-a.score);
  const last=G.round>=G.rounds;
  return `<div class="scr">
    <div class="bar"><span>Round ${G.round}/${G.rounds}</span><span>Scoreboard</span></div>
    <div class="panel">
      <div class="kicker">Standings</div>
      <table>${sorted.map((p,r)=>`<tr class="${r===0?'lead':''}">
        <td style="width:1%;color:var(--dim)">${r+1}</td>
        <td>${r===0?'👑 ':''}${esc(p.name)}</td>
        <td class="dlt ${p.delta<0?'neg':''}">${p.delta>=0?'+':''}${p.delta}</td>
        <td class="pts">${p.score}</td></tr>`).join('')}</table>
      <button class="btn ${last?'pink':''}" onclick="${last?'endGame()':'nextRound()'}">${last?'Final results':'Next round →'}</button>
    </div>
  </div>`;
}
function nextRound(){ SFX.pass(); startRound(); render(); }
function endGame(){ SFX.win(); G.screen=S_END; render(); }

/* ---- end ---- */
function vEnd(){
  const sorted=G.players.slice().sort((a,b)=>b.score-a.score);
  const top=sorted[0], tie=sorted.filter(p=>p.score===top.score);
  return `<div class="scr">
    <div class="crown">🏆</div>
    <h1>${tie.length>1?'It&rsquo;s a tie!':esc(top.name)+' wins'}</h1>
    <div class="tag">${tie.length>1?esc(tie.map(p=>p.name).join(' & ')):'Champion liar &amp; truth-sniffer'}</div>
    <div class="panel">
      <table>${sorted.map((p,r)=>`<tr class="${p.score===top.score?'lead':''}">
        <td style="width:1%;color:var(--dim)">${r+1}</td><td>${esc(p.name)}</td><td class="pts">${p.score}</td></tr>`).join('')}</table>
      <button class="btn" onclick="playAgain()">Play again — same players</button>
      <button class="btn ghost" onclick="fullReset()">New game / new players</button>
    </div>
  </div>`;
}
function playAgain(){ SFX.lock(); newGame(G.players.map(p=>p.name),G.rounds); render(); }
function fullReset(){ SFX.tap(); G=null; setupNames=[]; setupWarn=''; render(); }

render();
</script>
</body>
</html>
